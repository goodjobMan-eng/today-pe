<h1>학교스포츠클럽 스포츠스태킹 대회 경기</h1>
<p>1) 5세트 중 3세트를 먼저 승리하는 팀이 최종 승리한다. 2) 1세트와 5세트는 4명이 출전하여 동시에 진행하는 363 팀 대항 릴레이(3라운드 2선승제)이다. 3) 2세트는 5명이 출전하는 개인 사이클(5라운드 3선승제), 3세트는 더블 사이클(3라운드 2선승제)이다. 4) 4세트는 3차 시기 중 가장 빠른 기록을 겨루는 363 팀 시간 릴레이로 진행한다.</p>
