<h1>생일 케이크 호흡과 상체 가동성 준비운동</h1>
<p>1) 케이크 촛불을 끄듯 코로 들이마시고 강하게 내쉬는 호흡을 5회 반복한다. 2) 물속에 들어간 것처럼 10초간 숨을 참는 스쿠버 호흡을 진행한다. 3) 4초간 들이마시고 6초간 천천히 내쉬는 호흡을 반복한다. 4) 목 회전을 양방향으로 천천히 수행하고 팔짱을 낀 채 상체를 숙여 흉추를 회전한다. 5) 어깨, 견갑골 회전 및 손목 돌리기를 차례대로 실시한다.</p>
