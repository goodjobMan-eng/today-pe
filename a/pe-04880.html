<h1>가위바위보 점프 놀이</h1>
<p>1) 제자리에서 주먹(모아 뛰기), 가위(앞뒤 벌려 뛰기), 보(양옆 벌려 뛰기) 발동작을 연습한다.2) 가위 동작 시 1회차는 오른발 앞, 2회차는 왼발 앞 순서로 번갈아 뛴다.3) 구령에 맞추어 주먹, 가위, 보 순서를 바꾸며 리듬감 있게 점프한다.4) 점프 중간에 손뼉을 치는 동작을 섞어 난도를 높인다.</p>
