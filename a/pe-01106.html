<h1>스포츠 빈백 보체 게임</h1>
<p>1) 경기장 중앙에 표적이 될 빨간색 빈백을 배치하고 초록 팀과 파랑 팀으로 모둠을 구성한다. 2) 가위바위보로 선공을 정한 뒤 투척선 뒤에서 양 팀이 번갈아 가며 표적을 향해 빈백을 투척한다. 3) 모든 투구가 끝난 후 표적 빈백에 가장 가깝게 위치한 빈백의 개수만큼 해당 팀이 득점한다. 4) 상대 팀 빈백을 쳐내어 밀어내거나 목표 표적의 거리를 단계별로 멀리 배치해 변형할 수 있다.</p>
