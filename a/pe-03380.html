<h1>소프트발리볼 배구형 게임</h1>
<p>1) 직사각형 경기장 중앙에 높이 1.5m 네트를 설치하고 4명씩 2개 모둠을 구성한다. 2) 네트를 넘어온 공을 바로 치거나 바닥에 한 번 튕긴 공을 머리 위로 쳐서 올린다. 3) 공을 3번 안에 상대 구역으로 넘기지 못하거나 공이 코트 밖으로 나가면 상대 모둠이 1점을 얻는다. 4) 15점을 먼저 얻은 모둠이 승리한다.</p>
