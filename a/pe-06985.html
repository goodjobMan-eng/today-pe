<h1>포이즌 볼 (짐볼 밀어내기 게임)</h1>
<p>1) 중앙에 진입 금지 구역(No-go Zone)을 설정하고 그 한가운데에 짐볼(포이즌 볼)을 배치한다. 2) 양 팀은 구역 양쪽에 나뉘어 서서 피구공을 들고 대기한다. 3) 시작 신호가 울리면 짐볼을 향해 피구공을 연속으로 던져 상대편 진영 밖으로 밀어내는 팀이 해당 라운드에서 승리한다.</p>
