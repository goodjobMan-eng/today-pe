<h1>볼링 비석치기</h1>
<p>1) 두 팀으로 나누고 각자 진영 뒤쪽에 팀원 수만큼 볼링핀을 일렬로 세운 뒤 공을 하나씩 가지고 선다.2) 시작 신호가 울리면 상대 진영의 볼링핀을 향해 공을 굴려 쓰러뜨린다.3) 상대팀에서 굴린 공은 손이나 발로 막을 수 있으며, 뒤로 넘어간 공은 주워와서 다시 굴린다.4) 정해진 시간(예: 3분)이 끝난 후 살아남은 볼링핀 수가 더 많은 팀이 승리한다.</p>
