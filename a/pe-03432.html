<h1>동서남북 구르기</h1>
<p>1) 반 전체를 네 모둠으로 나누고 각 모둠에서 구르는 순서를 정한 다음 동서남북 출발 위치에 섭니다. 2) 출발 신호와 함께 첫 번째 모둠원이 출발하여 각 매트에서 주어진 임무를 수행하고 게임장 한 바퀴를 돕니다. 3) 출발 지점으로 돌아와서 다음 순서 모둠원의 손을 쳐주면 다음 모둠원이 출발해 동일하게 게임장 한 바퀴를 돌아옵니다. 4) 마지막 모둠원이 가장 빨리 도착한 모둠이 이깁니다.</p>
