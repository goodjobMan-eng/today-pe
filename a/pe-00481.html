<h1>닷지비 던지기 요령과 표적 맞히기 놀이</h1>
<p>1) 중앙에 라바콘이나 훌라후프 표적을 세워 두고, 목표 지점에 플라잉디스크(닷지비)를 정확히 던지는 연습을 준비합니다. 2) 머리를 고정한 채 던지는 방향으로 손을 멈추며 원반을 던지고, 원반이 수평을 유지하도록 던지기 직전 각도를 확인한 뒤 손목 스냅으로 강하게 회전시킵니다. 3) 모둠별로 정해진 시간 동안 짝과 패스를 주고받으며 표적을 통과시키거나 맞힙니다. 4) 표적을 통과시키거나 맞힌 개수로 점수를 겨룹니다.</p>
