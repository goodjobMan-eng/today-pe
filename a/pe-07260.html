<h1>훌라후프 코딩 블라인드 미션 게임</h1>
<p>1) 2인 1조가 되어 1명은 안대를 쓰고 로봇 역할을 하고 다른 1명은 코더 역할을 맡는다. 2) 로봇은 출발선(벽)에서 훌라후프를 들고 대기한다. 3) 코더는 전진 걸음 수, 회전 각도(예: 90도 회전) 등 프로그래밍 명령어로만 지시한다. 4) 로봇이 안내에 따라 콘에 훌라후프를 성공적으로 걸면 해당 콘을 획득하고 높은 점수를 모은다.</p>
