<h1>기초체력 기르기(다리 올리기 3종)</h1>
<p>1) 편안하게 누워 복부에 힘을 준 상태에서 다리를 곧게 올려준다(10회 3세트). 2) 양손을 깍지 껴 머리 뒤에 대고 선 자세에서 양 무릎을 교차로 옆으로 들어 올린다(10회 3세트). 3) 팔굽혀펴기 자세로 엎드려 양발을 번갈아 위로 들어 올려 하체 근력을 기른다(10회 3세트).</p>
