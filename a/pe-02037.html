<h1>전통 딱지치기</h1>
<p>1) 딱지를 각자 2개 이상 준비한다. 2) 가위바위보를 해서 진 사람은 딱지를 바닥에 내려놓는다. 3) 이긴 사람은 자신의 딱지로 바닥에 놓인 다른 사람의 딱지를 내리친다. 4) 딱지가 뒤집히면 친 사람이 가져가고, 뒤집히지 않으면 차례를 넘긴다.</p>
