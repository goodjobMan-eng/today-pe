<h1>수비 중심 발야구</h1>
<p>1) 7명씩 2개 모둠을 이루고 공격용 홈과 수비용 홈을 준비한다. 2) 공격 모둠은 수비 모둠이 굴려 준 공을 차고 누를 돌아 공격용 홈으로 들어온다. 3) 수비 모둠은 타자가 찬 공을 잡아 공 이어주기를 하며 수비용 홈으로 보낸다. 4) 타자가 홈을 밟기 전에 공을 떨어뜨리지 않고 수비용 홈에 이어주면 이어준 횟수만큼 점수를 얻고 모둠원 전원이 찬 후 공수를 바꾼다.</p>
