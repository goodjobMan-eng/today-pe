<h1>S자 켄(가위바위보 버전)</h1>
<p>1) S자 모양의 코트를 만들고 양 끝 진지에 보물을 둡니다. 2) 팀별로 진지에 서서 출발합니다. 3) S자 코트 외곽을 한 발로 뛰며 이동하다 상대를 만나면 가위바위보를 합니다. 4) 이기면 계속 이동하고, 지면 진지로 돌아가 다시 출발합니다. 5) 상대 진지에 먼저 도착해 보물을 가져오는 팀이 승리합니다.</p>
