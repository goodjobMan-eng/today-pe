<h1>해피 라인댄스</h1>
<p>1) 오른쪽으로 이동하며 박수, 왼쪽으로 이동하며 박수, 오른쪽 아래 박수, 왼쪽 아래 박수를 친다. 2) 발을 딛고 팔과 다리를 옆으로 뻗어주는 동작을 좌우 번갈아 수행한다. 3) 오른쪽으로 세 걸음 걷고 박수, 왼쪽으로 세 걸음 걷고 박수를 친다. 4) 오른발을 앞뒤로 내밀고 옆으로 짚어 발 안쪽을 손으로 친 뒤 점프하며 시계방향으로 90도 회전해 반복한다.</p>
