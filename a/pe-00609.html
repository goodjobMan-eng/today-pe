<h1>팔굽혀펴기 앞구르기</h1>
<p>1) 매트 위에 엎드려 엉덩이를 바닥 쪽으로 낮춘 물개(엎드린) 자세를 취합니다. 2) 팔로 체중을 단단히 지지하면서 하체의 탄력을 이용해 한 번에 엉덩이를 높이 들어 올립니다. 3) 머리를 가슴 쪽으로 깊숙이 말아 넣으며 뒤통수부터 등, 허리 순서로 매트에 닿게 굴러갑니다. 4) 구른 뒤 엉덩이와 발바닥 순서로 착지하여 두 발로 일어서며, 뜀틀 회전 넘기를 익히기 위한 사전 매트 운동으로 활용합니다.</p>
