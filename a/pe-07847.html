<h1>얼티미트 볼</h1>
<p>1) 경기장 양 끝에 콘 4개를 놓아 엔드존을 표시하고 팀 조끼로 팀을 나눈다. 2) 공을 손에 들고 달릴 수 없으며 패스로만 전진한다. 3) 상대 팀 엔드존 안에서 패스된 공을 잡으면 1점을 득점한다. 4) 패스가 실패하면 수비 팀이 공격권을 가져간다. 5) 상대 선수와의 신체 접촉은 엄격히 금지된다.</p>
