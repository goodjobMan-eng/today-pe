<h1>스크래블 단어 완성 릴레이</h1>
<p>1) 반대편 끝에 점수가 적힌 알파벳 종이 카드를 모아두고, 학생들은 팀별로 출발선 뒤에 정렬한다. 2) 신호가 울리면 각 팀의 1번 주자가 전력 질주하여 글자 카드 한 장을 가지고 돌아온다. 3) 주자가 터치하면 다음 주자가 순서대로 달려가 새 글자 카드를 한 장씩 계속 가져온다. 4) 가져온 글자들을 조합하여 유효한 단어를 먼저 완성하거나 단어 점수 총합이 높은 팀이 승리한다.</p>
