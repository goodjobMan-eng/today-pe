<h1>경찰과 악당 의사 술래잡기</h1>
<p>1) 시민 12명, 경찰 3명, 악당 7명, 의사 3명으로 역할을 나누어 카드를 뽑고 흩어진다. 2) 악당은 시민과 의사를 터치하여 자리에 앉힌다. 3) 의사는 앉은 시민이나 의사를 터치하여 살려준다. 4) 경찰은 악당을 잡아 감옥으로 연행하고 5분 안에 악당 6명 이상을 잡으면 시민팀이 승리한다.</p>
