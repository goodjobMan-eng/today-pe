<h1>옆돌기(카트휠) 기초 동작 익히기</h1>
<p>1) 반원 모양의 줄 바깥에서 다리를 넓게 벌리고 섭니다. 2) '발, 발, 손, 손, 발, 발' 순서로 바닥에 손을 짚으며 줄 반대편으로 뛰어넘습니다. 3) 반원을 점차 넓히고 무지개를 그리듯 팔을 머리 위로 크게 휘두르며 회전한 뒤 바른 자세로 곧게 섭니다. 4) 줄을 직선으로 펴거나 치우고 발끝을 뻗으며 전신을 쭉 펴서 착지합니다.</p>
