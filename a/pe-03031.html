<h1>뒤뚱뒤뚱 펭귄 풍선 릴레이</h1>
<p>1) 모둠별로 줄을 서고 첫 주자는 양쪽 겨드랑이와 양 다리 사이에 풍선 총 3개를 끼운다. 2) 신호가 울리면 풍선이 떨어지지 않게 점프하거나 뒤뚱거리며 반환점을 향해 이동한다. 3) 반환점을 돌아 대기 중인 모둠원 전체 주위를 한 바퀴 돈 뒤 다음 주자에게 풍선을 넘긴다. 4) 진행 도중 풍선을 떨어뜨리면 그 자리에서 다시 주워 끼우고 출발하며 릴레이를 이어간다.</p>
