<h1>풍선공 의자 착륙 타깃 대결</h1>
<p>1) 두 의자의 좌판을 마주 보게 붙여 표적 착륙장을 만들고, 일정한 투척선 뒤에 양 팀 학생이 마주 선다. 2) 번갈아 가며 가벼운 풍선공을 손바닥으로 부드럽게 쳐 올려 의자 좌판 위로 날려 보낸다. 3) 풍선공이 의자 좌판 위에 안착하여 머무르면 1점을 획득하고 먼저 목표 점수에 도달한 팀이 승리한다. 4) 거리를 점차 뒤로 멀리 넓히거나 착륙 제한 시간 규정을 추가해 타깃 정확도 난이도를 높인다.</p>
