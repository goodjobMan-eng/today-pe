<h1>스카프 던지고 동시에 받기(짝, 원형)</h1>
<p>1) 두 사람이 마주 보고 서서 서로 왼쪽 방향으로 이동하기로 정한다.2) 신호에 맞춰 동시에 위로 스카프를 던진 후 서로 자리를 바꿔 상대방의 스카프를 잡는다.3) 성공할 때마다 뒤로 한 발씩 물러나며 던지는 거리를 넓혀 도전한다.4) 원형으로 둘러서서 동시에 던진 뒤 오른쪽 사람의 스카프를 잡거나 한 사람을 건너뛰어 잡는다.</p>
