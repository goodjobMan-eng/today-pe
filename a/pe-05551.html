<h1>왕과 신하 1</h1>
<p>1) 두 명씩 짝을 지어 가위바위보를 하고 이긴 사람은 왕, 진 사람은 신하가 된다.2) 신하는 왕의 한쪽 손을 공손히 받쳐 모시고 다니며 다른 왕을 찾아다닌다.3) 다른 왕을 만나면 두 왕끼리 가위바위보 대결을 펼친다.4) 대결에서 진 왕은 상대 왕의 새로운 신하가 되거나 역할을 바꾸어 게임을 이어간다.</p>
