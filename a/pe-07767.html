<h1>꼬리 태그 럭비 게임</h1>
<p>1) 양 팀(몬스터, 드래곤)으로 나누어 바지 뒤쪽에 스카프를 꽂고 무릎을 꿇고 앉는다. 2) 교사가 팀 이름을 부르면 해당 팀 선수가 공을 가지고 상대 진영 콘 뒤로 가서 공을 찍어 트라이를 시도한다. 3) 반대편 선수는 상대의 꼬리(스카프)를 뽑아 득점을 저지한다.</p>
