<h1>자이브 홀드와 댄스 플로어</h1>
<p>1) 리더와 팔로어가 마주 보고 서서 클로즈 포지션 홀드 자세를 잡는다. 2) 음악이 시작되면 8박자 동안 골반을 흔들며 기본 리듬을 탄다. 3) 홀드 프레임이 무너지지 않도록 유지하면서 원투쓰리아포 박자에 맞춰 자이브 샷세 스텝을 진행한다. 4) 리더가 방향을 제시하면 팔로어가 신호를 받아 좌우 방향으로 부드럽게 스텝을 이어간다. 5) 20초마다 신호에 맞춰 파트너를 바꾸어가며 플로어에서 자유롭게 춤을 춘다.</p>
