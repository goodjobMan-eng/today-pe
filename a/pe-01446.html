<h1>가정용 수건 매듭 캐치볼 체조</h1>
<p>1) 수건을 2~3회 단단하게 묶어 안전한 수건 공을 제작합니다. 2) 부모와 아이가 1~2m 거리를 두고 마주 보고 서서 준비합니다. 3) 오른손 투구 및 포구, 왼손 투구 및 포구, 양손 받기 등 다양한 손 사용법으로 주고받습니다. 4) 등 뒤로 던져 머리 위로 받기, 돌아서서 받기 등 신체 조작 난이도를 올려가며 연습합니다.</p>
