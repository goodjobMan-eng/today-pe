<h1>프레셔스 찾기 안대 놀이</h1>
<p>1) 한 명의 학생을 프레셔스로 지정하고, 나머지 학생들은 안대를 착용한다. 2) 프레셔스는 한자리에 조용히 멈춰 서 있고, 안대를 쓴 학생들은 천천히 이동한다. 3) 이동 중 다른 사람과 부딪히면 &quot;프레셔스?&quot;라고 묻고, 상대가 &quot;프레셔스&quot;라고 답하면 계속 탐색한다. 4) 질문에 대답이 없는 학생을 만나 세 번 물어 프레셔스임을 확인하면 안대를 벗고 프레셔스 무리에 합류한다.</p>
