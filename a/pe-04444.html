<h1>개인 공 던지기 및 받기 도전 과제</h1>
<p>1) 공을 머리 위 뒤쪽으로 살짝 던져 등 뒤에서 양손으로 받는다. 2) 바닥에 앉거나 무릎을 꿇은 상태에서 공을 위로 똑바로 던져 양손 또는 한 손에서 다른 손으로 받는다. 3) 벽에서 1.5m 떨어져 서서 공을 바닥에 튀기지 않고 벽에 언더핸드나 머리 위로 던진 후 양손으로 받는다. 4) 한 발로 균형을 잡고 서서 발을 딛지 않고 공을 좌우로 주고받거나 던져 받는다.</p>
