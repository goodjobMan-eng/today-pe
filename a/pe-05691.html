<h1>가자 치기 여행</h1>
<p>1) 원마커 팬케이크 뒤집기, 라켓으로 솜털공·셔틀콕·풍선·도치볼 치고받기, 손으로 인디아카 치기 등의 스테이션을 마련한다.2) 학생들은 원하는 스테이션을 자유롭게 돌아다니며 치기 활동을 연습한다.3) 각 스테이션마다 라켓이나 손으로 5회씩 왕복하여 공을 주고받거나 뒤집는다.4) 스테이션 미션을 완료하면 고무 밴드나 바둑돌 등의 보상을 받는다.</p>
