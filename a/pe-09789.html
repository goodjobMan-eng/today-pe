<h1>훌라후프 가위바위보 뱀 놀이</h1>
<p>1) 5~10개의 훌라후프를 일렬로 배치합니다. 2) 두 팀으로 나누어 각 팀이 훌라후프 줄의 양 끝에 섭니다. 3) 신호에 맞춰 각 팀의 첫 번째 사람이 훌라후프 안을 점프하며 이동합니다. 4) 중간에서 만나면 가위바위보를 합니다. 5) 이긴 사람은 계속 이동하고 진 사람은 자기 팀 뒤로 돌아가며, 다음 사람이 출발합니다. 6) 상대 팀 끝까지 먼저 도착하면 점수를 얻습니다.</p>
