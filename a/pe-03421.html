<h1>평균대에서 걷기의 기본 기능 익히기</h1>
<p>1) 양팔을 벌려 균형을 잡고, 발끝이 평균대의 옆면을 스치도록 앞으로 한 발씩 내딛으며 걷는다. 2) 양팔을 벌려 균형을 잡고, 발끝으로 디딜 자리를 찾으며 한 발씩 뒤로 내딛어 걷는다. 3) 양팔을 옆으로 벌려 균형을 잡고, 오른쪽 다리를 왼쪽 다리 앞으로 교차하여 왼발 옆에 놓으며 옆으로 다리를 엇걸어 걷는다.</p>
