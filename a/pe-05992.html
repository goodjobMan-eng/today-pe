<h1>포 스퀘어&amp;플로어 스퀘어 게임</h1>
<p>1) 4개 구역(1~4번)에 한 명씩 위치하며 원바운드 후 상대 구역으로 공을 넘긴다.2) 실점한 사람은 1번 자리로 이동하고 다른 사람들은 한 자리씩 승급한다.3) 점수는 4번 자리에 있는 사람만 획득하며 중앙에 미니 골대를 두고 통과시키는 플로어 스퀘어로도 응용한다.</p>
