<h1>빨대와 면봉 스나이퍼 사격 대결</h1>
<p>1) 구부러지는 빨대 끝에 면봉을 끼우고 일정 거리 앞 바닥에 종이컵 타깃을 세운다. 2) 신호와 함께 빨대를 입으로 강하게 불어 면봉을 날려 상대편 종이컵을 맞힌다. 3) 면봉이 빗나가면 정해진 출발선까지 왕복달리기를 다녀온 뒤 다시 면봉을 장전해 발사한다. 4) 먼저 상대 종이컵을 정확히 명중시켜 쓰러뜨리는 사람이 승리하며 표적 거리를 늘려 난이도를 높인다.</p>
