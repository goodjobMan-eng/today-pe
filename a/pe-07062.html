<h1>푸시 더 핀</h1>
<p>1) 일렬로 놓인 5개 스팟의 중앙 스팟 위에 원통형 핀을 세우고 양쪽 사이드라인에 2명씩 짝을 지어 선다. 2) 양 팀이 번갈아 가며 핀을 향해 공을 굴린다. 3) 공을 굴려 핀을 쓰러뜨리면 핀을 상대 팀 구역 쪽 스팟으로 한 칸 전진시켜 세운다. 4) 상대 팀이 핀을 쓰러뜨리면 다시 중앙 방향으로 되돌려 놓는다. 5) 핀을 상대 팀 사이드라인까지 밀어내면 1점을 획득하고 중앙에서 다시 시작한다.</p>
