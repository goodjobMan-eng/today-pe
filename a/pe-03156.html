<h1>긴 줄 기차놀이</h1>
<p>1) 긴 줄의 양 끝을 묶어 둥근 기차 모양을 만든다. 2) 기관사를 맡은 친구가 줄 안으로 들어가 허리춤에서 줄을 잡는다. 3) 기관사는 기차를 몰고 다니며 친구를 한 명씩 태우고 탄 친구들은 함께 줄을 잡고 이동한다. 4) 팀 경기로 진행할 경우 규칙을 지키며 반환점을 먼저 돌아오는 기차가 승리한다.</p>
