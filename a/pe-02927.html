<h1>강강술래 실꾸리 감기와 풀기 놀이</h1>
<p>1) 참가자 전원이 손을 잡고 대열을 만든다. 2) 선두 주자가 중심(가운데)으로 들어가며 안쪽에서 바깥쪽으로 나선형을 그리며 실꾸리를 감는다. 3) 감기를 마친 후 선두 주자가 팔을 들어 대문을 만들어 준다. 4) 대열이 그 대문 사이를 빠져나와 오른쪽으로 큰 원을 그리며 실꾸리를 풀어낸다.</p>
