<h1>프렌즈 캐치볼 챌린지</h1>
<p>1) 두 명 이상이 마주 보고 서거나 바닥에 앉아 준비 자세를 취한다. 2) 공이 바닥이나 주변 물체에 닿지 않도록 서로 쉬지 않고 던지고 받는다. 3) 공을 떨어뜨리지 않고 주고받은 횟수나 버틴 시간을 측정하며, 공을 떨어뜨리면 게임이 종료된다.</p>
