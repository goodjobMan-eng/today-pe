<h1>피자 배달 게임</h1>
<p>1) 모든 학생은 활동 구역의 한쪽 출발선에 한 줄로 정렬한다. 2) 각 학생에게 피자 토핑 이름을 하나씩 지정해 준다. 3) 지도자가 특정 피자 토핑을 외치면 해당 학생이 반대편으로 달려가 콩주머니를 집어 셰프에게 배달하며, '디럭스'를 외치면 모든 학생이 함께 달린다.</p>
