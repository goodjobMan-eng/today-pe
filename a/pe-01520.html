<h1>스텝래더 협동 리듬 스텝</h1>
<p>1) 체육관 바닥에 스텝래더를 설치하고 모둠별로 일정한 간격을 두고 출발선에 선다. 2) 음악과 박자 구호에 맞추어 래더 칸 안팎을 양발로 스텝하며 앞사람과 간격을 맞춰 이동한다. 3) 래더 줄을 밟거나 박자를 놓치지 않고 모둠원 전원이 연속으로 코스를 완주하면 성공한다. 4) 동작 난이도를 올려 사이드 스텝, 팔 동작 추가, 교차 스텝 등 레벨을 점진적으로 높인다.</p>
