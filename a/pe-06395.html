<h1>버니 스톰프</h1>
<p>1) 트랙을 따라 내려오는 캐릭터 버튼을 확인한다.2) 버튼이 플레이 존에 들어오면 해당 동작을 수행한다.3) 빨간색은 왼발 구르기 또는 점프, 노란색은 오른발 구르기 또는 점프, 빨강과 노랑은 제자리 뛰기, 파란색은 박수, 보라색은 허벅지 치기를 한다.4) 미니 게임에서는 토드가 튀어나오는 횟수를 소리 내어 세며 포즈를 유지한다.</p>
