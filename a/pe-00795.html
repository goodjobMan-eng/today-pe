<h1>엔칸토 퀴즈 타바타 트레이닝</h1>
<p>1) 화면에 제시되는 애니메이션 엔칸토 관련 퀴즈 질문을 듣고 생각합니다. 2) 각 보기마다 배정된 고유한 운동 동작(점핑잭, 푸시업, 스쿼트 등)을 확인하고, 자신이 정답이라고 생각하는 선택지의 동작을 카운트다운 동안 열심히 합니다. 3) 정답 공개 후 맞힌 학생은 성취감을 느끼며 다음 문제로 넘어갑니다. 4) 틀린 그림 찾기 등 중간 미니게임에서도 정답에 해당하는 동작을 완수합니다.</p>
