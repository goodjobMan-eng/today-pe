<h1>마사이족 아두무 높이뛰기 민속 표현 활동</h1>
<p>1) 마사이족의 역사와 전통 점프 춤(아두무)의 유래를 알아보고 대형을 갖춰 선다. 2) 앞꿈치로 수직 반동을 주며 무릎을 곧게 펴고 제자리에서 가능한 한 높이 뛰어오른다. 3) 뒤에 선 모둠원들이 챈트와 리듬 박수를 보내는 동안 한 명씩 앞으로 나와 최고점 점프를 선보인다. 4) 제자리 점프에서 좌우 및 앞뒤 스텝 이동 점프, 공중 다리 벌리기 동작으로 난이도를 높여 변형한다.</p>
