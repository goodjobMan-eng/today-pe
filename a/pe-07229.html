<h1>매트 큰 앞구르기</h1>
<p>1) 배 앞에 큰 공을 안고 있다고 상상하며 손 짚는 위치를 평소보다 조금 멀리 둔다. 2) 팔꿈치를 편 상태로 팔에 힘을 주고 무릎을 펴면서 바닥을 차며 회전한다. 3) 다리가 지면에 닿는 마지막 순간에 몸을 강하게 웅크려 회전 속도와 탄력을 얻으며 일어선다.</p>
