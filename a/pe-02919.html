<h1>드리블&amp;슛 대결</h1>
<p>1) 팀별로 출발선에 한 줄로 서서 첫 주자가 농구공을 준비한다. 2) 출발 신호에 맞춰 골대를 향해 드리블하여 이동한다. 3) 골대 근처에서 슛을 시도하고 성공 시 1점을 올린다. 4) 리바운드한 공을 다시 드리블하여 출발선으로 돌아와 다음 주자에게 인계하며 정해진 점수(10점)를 먼저 달성한 팀이 승리한다.</p>
