<h1>보수볼·누들 활용 균형 잡기 수업</h1>
<p>1) 보수볼과 스텝 박스를 활용해 유산소 및 스트레칭으로 준비운동을 한다. 2) 수영용 누들를 손바닥 위에 올려놓거나 발로 밟고 균형을 잡으며 걷는 활동을 한다. 3) 두 사람이 협력하여 누들 사이에 공을 올리고 떨어뜨리지 않으며 주고받는 활동을 한다. 4) 라켓 위에 폼볼을 올리고 보수볼 위를 걷는 평형성 훈련을 한다.</p>
