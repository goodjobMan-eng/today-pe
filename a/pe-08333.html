<h1>축구 패스 앤 무브 포지션 이동 드릴</h1>
<p>1) 중앙에 4개의 폴을 세우고 외곽에 콘을 배치하여 선수들이 나뉘어 위치한다. 2) 외곽 선수가 중앙 쪽으로 패스하면 중앙 선수는 리턴 패스를 주거나 방향을 전환해 반대편으로 전달한다. 3) 패스한 선수는 중앙 폴을 돌거나 다음 콘 위치로 이동하며 패스와 움직임을 연속으로 반복한다.</p>
