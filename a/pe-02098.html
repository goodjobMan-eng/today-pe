<h1>빈 생수병 미니 볼링 놀이</h1>
<p>1) 빈 생수병 10개를 바닥의 삼각형 표시 안에 세우고 정해진 거리에 투구선을 표시한다. 2) 참가자는 차례대로 투구선 뒤에서 공을 굴려 생수병을 쓰러뜨린다. 3) 1회 투구로 모두 쓰러뜨리면 스트라이크(10점)로 기록하고, 남으면 1번 더 투구하여 총 쓰러뜨린 개수를 합산한다. 4) 정해진 프레임(10프레임) 동안 투구하여 최종 합산 점수가 높은 참가자가 승리한다.</p>
