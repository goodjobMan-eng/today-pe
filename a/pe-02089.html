<h1>보물 지키기 축구</h1>
<p>1) 접시콘으로 원형 경기장을 만들고 한가운데 훌라후프와 라바콘(보물)을 놓습니다. 2) 가운데 훌라후프 주변에 보물을 지킬 수비 1명이 들어갑니다. 3) 바깥 원 밖의 공격팀은 축구공을 발로 차서 가운데 보물 라바콘을 공격합니다. 4) 수비는 공을 발로 차서 막아내며 1분 동안 수비에 성공하면 1점을 얻고, 보물이 무너지면 공수가 교대됩니다.</p>
