<h1>3대3 농구 게임</h1>
<p>1) 3명씩 두 팀을 구성하고 하나의 농구 골대에서 경기한다. 2) 경기 시작 시, 득점 후, 공이 밖으로 나갔을 때 상대 팀에게 공을 건네는 체크를 한 뒤 공격을 시작한다. 3) 슛이 림이나 백보드를 맞고 수비 팀이 리바운드한 경우 공을 3점 라인 밖으로 가지고 나간 뒤 공격을 전개해야 한다. 4) 심판이 없으므로 학생들이 스스로 파울을 선언하며 플레이한다.</p>
