<h1>친구사랑 빼빼로 손뼉치기 놀이</h1>
<p>1) 손가락 한 개를 펴고 준비한 뒤 노래와 손동작을 함께 한다. 2) 노래 끝에 '친구 사랑해'를 외치며 가위바위보를 한다. 3) 가위바위보에서 이긴 학생만 손가락을 한 개 더 펴고, 비기거나 진 학생은 그대로 유지한다. 4) 정해진 판 수(예: 5판)를 반복한 후 손가락 개수가 많은 사람이 이긴다.</p>
