<h1>올림포스 (Olymp)</h1>
<p>1) 경기장을 지하세계, 지상, 올림포스의 세 구역으로 똑같이 나눈다. 2) 모든 학생은 지상 구역에서 시작한다. 3) 다른 학생을 공으로 맞히면 위 구역으로 한 칸 이동하고(지하세계→지상, 지상→올림포스), 공에 맞으면 아래 구역으로 한 칸 내려간다(올림포스→지상, 지상→지하세계). 4) 지하세계에서 공에 맞은 학생은 경기장 전체를 한 바퀴 뛰고 지상에서 다시 시작한다.</p>
