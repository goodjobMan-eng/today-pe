<h1>티슈 캐치 놀이</h1>
<p>1) 2겹으로 겹쳐진 티슈 한 장을 펼쳐서 1장으로 얇게 만든다. 2) 한 사람이 위에서 티슈를 떨어뜨리면 다른 사람이 떨어지는 티슈를 한 손 또는 두 손으로 잡는다. 3) 앉은 자세나 발을 이용해 잡기 등 자세와 신체 부위를 바꾸어 도전한다. 4) 두 사람이 약 2미터 거리를 두고 서서 신호에 맞춰 떨어뜨리는 티슈를 달려가며 잡는다.</p>
