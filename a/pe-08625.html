<h1>수도승(므니흐) 표적 맞히고 도망가기 놀이</h1>
<p>1) 중앙에 세워둔 표적을 향해 순서대로 콩주머니를 던져 맞힌다. 2) 표적을 쓰러뜨리면 지키던 사람이 콩주머니를 주우러 간 사람을 잡으러 쫓아간다. 3) 잡히지 않고 자신의 콩주머니를 챙겨 원래 자리로 돌아오면 성공한다.</p>
