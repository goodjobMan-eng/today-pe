<h1>첫날 체육 5가지 활동 (종이공 배틀 외)</h1>
<p>1) 재활용 종이에 이름을 크게 적어 공 모양으로 뭉친다. 2) 20~30초간 음악에 맞춰 서로 종이공을 던지며 배틀을 한다. 3) 교사가 멈추면 각자 자기 이름이 적힌 종이공을 찾아 펼쳐 확인하고 앉으며 걸린 시간을 잰다. 4) 두 번째 판에서는 친구 이름을 확인했을 때 직접 전달해 주는 협동 방식으로 진행하여 기록을 비교한다.</p>
