<h1>상어와 피라미드 피구</h1>
<p>1) 체육관 양 끝에 선을 긋고 한쪽 끝에는 피라미드(미노우) 플레이어들이, 다른 쪽에는 상어 플레이어들이 자리합니다. 2) 신호에 맞춰 피라미드 플레이어들은 상어들에게 잡히거나 공에 맞지 않고 반대편으로 건너갑니다. 3) 상어들은 피구공을 던져 맞히거나 잡을 수 있으며, 공에 맞거나 잡힌 플레이어는 다음 판부터 상어가 됩니다.</p>
