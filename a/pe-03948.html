<h1>베이비 요다 볼 타깃 쓰러뜨리기</h1>
<p>1) 학급을 두 팀으로 나누어 중앙선을 넘지 않고 각 진영에 볼링핀 3개와 초록색 훌라후프 1개를 배치한다. 2) 공을 굴리거나 던져서 중앙선을 넘지 않고 상대편 볼링핀을 맞혀 쓰러뜨린다. 3) 볼링핀을 쓰러뜨린 팀은 초록색 빈백 1개를 받아 자기 진영의 훌라후프에 넣고, 쓰러진 핀은 즉시 다시 세운다. 4) 정해진 시간 후 빈백을 가장 많이 모은 팀이 승리한다.</p>
