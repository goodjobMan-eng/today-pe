<h1>패스 앤 캐치</h1>
<p>1) 학생들을 두 팀으로 나누어 한 팀은 공을 들고 원 주변에 서고 다른 팀은 원 안으로 들어간다.2) 원 안의 팀원은 제한 시간 동안 바깥 팀원들과 최대한 많은 패스와 캐치를 주고받는다.3) 정해진 시간이 지나면 역할을 교대한다.4) 다음 변형에서는 원 안의 선수가 공을 받아 다른 바깥 선수에게 달려가 패스하며 반복한다.</p>
