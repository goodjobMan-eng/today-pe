<h1>콘을 바라봐 &amp; 톡톡 술래잡기</h1>
<p>1) '콘을 바라봐': 짝과 마주 보고 서서 선생님이 던진 콘이 가리키는 방향의 친구는 도망치고 짝은 그 친구를 잡으러 달린다. 2) '톡톡 술래잡기': 뒤돌아 서 있는 친구에게 술래가 다가가 어깨를 치고 도망가면 어깨를 맞은 친구가 뒤돌아 술래를 쫓아가 잡는다. 3) 잡기 활동 후 서로 역할을 바꾸어 진행한다.</p>
