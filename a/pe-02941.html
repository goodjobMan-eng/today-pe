<h1>벽치기 스파이크 대결</h1>
<p>1) 벽에서 세 걸음 떨어진 위치에서 스파이크를 쳐서 벽을 맞춘다. 2) 성공하면 거리를 한 걸음씩 뒤로 물러나며 도전한다. 3) 공이 옆으로 벗어나거나 벽을 맞추지 못하면 실패이며, 기회는 2번 주어진다. 4) 가장 멀리 떨어진 거리(걸음 수)까지 성공하는 것을 겨룬다.</p>
