<h1>배구 공격 기본기 연습</h1>
<p>1) 네트 너머로 훌라후프를 향해 공을 던진다. 2) 제자리에서 점프하며 네트 너머로 공을 던진다. 3) 공을 잡고 점프하여 네트 너머로 던진다. 4) 이동하며 점프하여 네트 너머로 공을 던진다. 5) 2대2로 나누어 공을 던지고 잡으며 경기를 한다.</p>
