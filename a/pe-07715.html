<h1>교차로 달리기</h1>
<p>1) 학생들은 강당 사방의 콘 뒤편에 모둠별로 마주 보고 정렬하여 대기한다. 2) 신호가 울리면 교사가 양팔을 벌려 가리키는 방향의 팀들이 마주 보고 맞은편으로 달린다. 3) 교사가 팔로 차단봉을 내려 막은 쪽 팀은 출발하지 못하고 신호를 기다린다. 4) '모두 교차해서 달려라'는 신호가 떨어지면 사방의 모든 팀이 중앙 교차로를 지나 동시에 반대편으로 달린다.</p>
