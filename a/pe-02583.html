<h1>노래에 맞춰 진행하는 컵타 기본 동작</h1>
<p>1) 책상에 컵을 엎어놓고 준비한다. 2) 손뼉 2번, 책상 치기 3번(오른손·왼손·오른손), 손뼉 1번을 친 뒤 오른손으로 컵을 잡고 위로 들었다가 바닥에 놓는다. 3) 손뼉 1번을 치고 오른손을 돌려 컵을 잡은 뒤 컵 윗부분을 왼손 손바닥에 찍고 바닥 모서리를 책상에 찍는다. 4) 컵을 왼손으로 옮겨 잡고 오른손으로 책상을 친 다음 왼손의 컵을 책상에 내려놓으며 노래 박자에 맞춰 반복한다.</p>
