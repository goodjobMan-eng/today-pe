<h1>밸런타인데이 언어유희 홈트레이닝 2탄</h1>
<p>1) 화면에 밸런타인데이 언어유희 문구(Pun)가 나타난다.2) 교사가 문구를 읽어 주는 5초 동안 숨을 고르며 다음 동작을 준비한다.3) 해당 문구와 연결된 운동(개구리 점프, 벨 점프, 푸시업, 스쿼트, 슈퍼맨 등)을 30초 동안 수행한다.4) 새로운 문구가 나오면 5초 휴식 후 다음 운동을 차례대로 이어간다.</p>
