<h1>토이 스토리 스프링 런 (브레인 브레이크)</h1>
<p>1) 화면을 보며 랏소가 보낸 장난감들을 피해 제자리에서 달린다.2) 랏소의 갈고리가 나타나면 움직임을 멈추고 얼음 자세를 취한다.3) 초록 장난감 군인들이 나타나면 펀치를 날려 통과한다.4) 마지막 쿨다운 동작들을 완료하여 봄 장난감들을 되찾는다.</p>
