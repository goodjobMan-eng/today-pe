<h1>추크볼 (Tchoukball)</h1>
<p>1) 양 팀이 3대3 또는 4대4로 편을 나누고 패스를 주고받으며 공격 기회를 만든다. 2) 득점을 시도할 때는 중앙선을 넘어가 프레임(골대)을 향해 슛을 던진다. 3) 던진 공이 프레임에 튕겨 나온 뒤 코트 바닥에 바로 닿으면 득점이 인정되며, 수비 팀이 노바운드로 잡으면 득점이 되지 않는다.</p>
