<h1>핑퐁 배틀 게임 - 컵이 사라진다 1</h1>
<p>1) 책상 위 각자 앞에 종이컵 8개씩(또는 6개씩)을 일정한 거리를 두고 놓는다.2) 가위바위보 등으로 순서를 정하고 탁구공을 바운드하여 컵을 향해 던진다.3) 공이 바운드되어 자신의 컵 안에 들어가면 해당 컵을 하나씩 제거하며, 컵을 먼저 모두 제거한 사람이 승리한다.</p>
