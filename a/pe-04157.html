<h1>메모리 컵 매칭 릴레이</h1>
<p>1) 콘 뒤에 팀원들이 일렬로 줄을 서고, 앞쪽에 16개 컵(4x4 격자) 속에 도형 블록을 짝지어 엎어둔다. 2) 첫 주자가 달려가 컵 2개를 뒤집어 아래 숨겨진 도형이 같은지 확인한다. 3) 일치하면 도형을 획득하고 컵을 엎어둔 채 돌아와 다음 주자와 터치하고, 불일치하면 다시 덮어두고 돌아온다. 4) 팀원끼리 위치 정보를 소리쳐 소통하며 모든 짝을 가장 먼저 찾는 팀이 승리한다.</p>
