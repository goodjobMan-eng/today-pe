<h1>가위바위보 부루마블 (じゃんけんすごろく)</h1>
<p>1) 활동 공간의 네 모서리(A, B, C, D)에 인원을 나누어 배치한다. 2) 신호와 함께 각 모서리에서 만난 사람과 가위바위보를 한다. 3) 가위바위보에서 이긴 사람은 정해진 미션을 수행하며 다음 모서리로 전진한다. 4) 진 사람은 중앙에 놓인 콘을 왕복해 제자리로 돌아온 뒤 다시 가위바위보를 진행하며 정해진 시간 동안 반복한다.</p>
