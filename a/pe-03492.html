<h1>알록달록 이어달리기</h1>
<p>1) 4명이 한 모둠을 이루고 공을 튀기며 이동하는 순서를 정합니다. 2) 출발 신호와 함께 첫 번째 모둠원이 공을 튀기며 이동하여 빨간색-노란색-파란색 원 마커 순서로 이동합니다. 3) 원 마커 위에 도착하면 한 발을 올려놓고 공을 3번 튀긴 후에 다음 색의 원 마커로 이동합니다. 4) 마지막 모둠원이 가장 빨리 출발선으로 돌아온 모둠이 이깁니다.</p>
