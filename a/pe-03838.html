<h1>교실 스트레칭과 워밍업 운동</h1>
<p>1) 제자리에서 상체 비틀기, 대퇴사두근 당기기, 힙 플로스 동작을 진행한다. 2) 발끝 또는 무릎을 대고 팔굽혀펴기를 한 뒤 복근 컬업과 딥스, 스쿼트를 실시한다. 3) 음악에 맞춰 전신 워밍업 동작을 따라 한다. 4) 자리에 앉아 코로 깊게 호흡하며 가벼운 요가 동작으로 마무리한다.</p>
