<h1>팀조끼를 입어라! 가위바위보</h1>
<p>1) 두 팀으로 나누고, 각 팀 주장은 상대 팀 출발선 앞 쪽에 선다.2) 출발 신호에 맞춰 주자들은 상대 팀 주장에게 달려가 가위바위보를 한다.3) 가위바위보에서 지면 바로 출발선으로 돌아가 다음 주자와 교대한다.4) 가위바위보에서 이기면 팀조끼를 입고 주장 뒤에 줄을 서며, 모든 팀원이 먼저 조끼를 입은 팀이 승리한다.</p>
