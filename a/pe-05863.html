<h1>마운틴 탑</h1>
<p>1) 팀별로 콘을 일렬로 세우고 첫 주자에게 원마커를 준다.2) 신호가 울리면 첫 주자가 달려가 첫 번째 콘 위에 마커를 얹고 돌아와 줄 맨 뒤로 간다.3) 다음 주자들은 원마커를 다음 콘으로 차례대로 하나씩 옮겨 놓는다.4) 마지막 콘까지 도달한 마커를 다음 주자가 시작 위치의 초록색 콘에 먼저 가져다 놓는 팀이 승리한다.</p>
