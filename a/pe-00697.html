<h1>풍선 챌린지 (리프팅·협동·풍선 폭탄)</h1>
<p>1) 손이나 발을 사용하여 풍선이 바닥에 닿지 않도록 연속으로 리프팅합니다. 2) 풍선을 2개로 늘려 전신을 활용해 리프팅 횟수를 늘리는 도전을 진행합니다. 3) 풍선을 띄운 뒤 빠르게 벽이나 상대방의 손을 터치하고 다시 쳐올리는 미션을 수행합니다. 4) 손을 맞잡고 원을 만들어 발과 몸통으로 풍선을 살리는 협동 놀이와, 바닥 선을 사이에 두고 넘기는 풍선 폭탄 게임으로 마무리합니다.</p>
