<h1>4개 구역 발차기 및 낙법 순환학습</h1>
<p>1) 운동장에 앞차기, 옆차기, 돌려차기, 낙법 구르기 등 4개 배움 구역을 구성한다.2) 각 구역에 도착하면 양팔 간격 좌우로 나란히 줄을 서서 인사한다.3) 친샘(친구선생님)의 시범과 설명을 들은 후 구호에 맞춰 발차기 및 낙법 동작을 연습한다.4) 교사의 신호에 따라 왼쪽으로 한 칸씩 이동하며 4개 구역을 순환한다.</p>
