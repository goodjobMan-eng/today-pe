<h1>공 빼앗기 놀이</h1>
<p>1) 정해진 구역 안에서 모든 학생이 각자 자신의 공을 가지고 들어간다. 2) 자신의 공을 지키면서 상대방의 공을 쳐서 구역 밖으로 밀어낸다. 3) 참가 인원이 줄어들면 경기 구역을 좁혀가며 진행한다.</p>
