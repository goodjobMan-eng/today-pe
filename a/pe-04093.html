<h1>폼 롤리팝 패들 라켓 활동</h1>
<p>1) 폼 패들 위에 공을 얹고 좌우로 흔들며 떨어뜨리지 않고 균형을 잡는다. 2) 패들로 공을 가볍게 위로 튕기며 10회 연속 치기에 도전한다. 3) 공을 아래로 바닥에 튕기면서 칠 때마다 패들의 앞뒤 면을 번갈아 뒤집는다. 4) 파트너와 함께 공 하나로 바운드 1회 후 주고받거나 노바운드로 주고받는다.</p>
