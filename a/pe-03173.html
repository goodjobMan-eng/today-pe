<h1>훌라후프 콩주머니 이어 옮기기 릴레이</h1>
<p>1) 4명이 한 모둠이 되어 훌라후프들을 사이에 두고 나란히 선다. 2) 첫 번째 주자가 첫 번째 훌라후프의 콩주머니를 꺼내 두 번째 훌라후프에 넣는다. 3) 두 번째 주자가 콩주머니를 꺼내 다음 훌라후프에 넣는 방식으로 마지막까지 전달한다. 4) 정해진 콩주머니를 가장 먼저 마지막 훌라후프까지 모두 옮긴 모둠이 이긴다.</p>
