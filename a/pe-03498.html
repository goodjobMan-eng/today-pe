<h1>굴러오는 공 피하기</h1>
<p>1) 4명이 한 모둠을 이루고 큰 공 굴리는 역할의 모둠을 정합니다. 2) 큰 공 굴리는 역할의 모둠은 양쪽 선 사이에서 큰 공을 굴리며 움직입니다. 3) 나머지 두 모둠은 출발 신호와 함께 움직이는 큰 공을 피해 반대쪽 선 안에 놓인 콩주머니를 들고 돌아옵니다. 4) 모둠별로 왕복 5번을 달리면 역할을 바꾸어 진행하며, 가장 많은 콩주머니를 가져온 모둠이 이깁니다.</p>
