<h1>컵 핑퐁 야구</h1>
<p>1) 타자는 컵 안에 든 탁구공을 던져 세 번의 공격 기회를 갖는다.2) 수비 친구가 있는 아래쪽 컵 안으로 공을 넣으면 아웃이 된다.3) 공이 컵을 벗어나 바운드된 횟수에 따라 점수를 획득하며 한 번에 얻을 수 있는 점수는 최대 15점 등 규칙에 따라 정한다.</p>
