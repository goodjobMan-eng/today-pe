<h1>해적 놀이 (La Piraterie)</h1>
<p>1) 각 팀은 매트 2장과 콘 2개를 준비하고, 팀원들이 힘을 합쳐 보물이 있는 곳까지 매트를 이동시킨다. 2) 출발 신호가 떨어지면 바닥에 떨어지지 않고 매트 위에서만 이동해야 한다. 3) 앞선 매트로 건너뛴 뒤 팀원들과 함께 뒤쪽 매트를 앞으로 옮겨 깔며 전진한다. 4) 가장 먼저 보물에 손을 닿은 팀이 1점을 얻는다.</p>
