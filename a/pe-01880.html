<h1>굴리고 차고 잡기 3인 콤비네이션</h1>
<p>1) 3인 1조를 이루어 투수, 키커, 포수 포지션으로 일렬 배치해 선다. 2) 투수가 바닥으로 폼볼을 굴려주면 키커는 발로 높이 띄워 찬다. 3) 뒤쪽의 포수가 뜬공을 공중에서 노바운드로 잡으면 팀이 1점을 획득한다. 4) 매 타격 후 포수는 투수로, 투수는 키커로, 키커는 포수로 위치를 순환한다.</p>
