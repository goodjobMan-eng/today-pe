<h1>간이 볼링 게임</h1>
<p>1) 평평한 바닥 표면에 볼링핀(또는 의자 다리)을 세워 표적 구역을 만든다. 2) 무릎을 살짝 구부리고 편안한 자세로 공을 잡고 선다. 3) 스텝(4스텝 등)을 밟으며 공을 든 팔을 뒤로 뻗었다가 체중을 앞발에 싣고 표적을 향해 공을 굴린다. 4) 적은 투구 횟수로 많은 표적을 쓰러뜨려 승패를 겨룬다.</p>
