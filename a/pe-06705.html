<h1>매트와 벤치를 활용한 협응·리듬·기초 근력 운동</h1>
<p>1) 뜀틀 벤치 라인과 매트 라인에 학생들을 소그룹으로 나누어 배치한다. 2) 교사가 벤치와 매트에서 수행할 동작을 먼저 느린 화면으로 보여준 뒤 정상 속도로 시범을 보인다. 3) 학생들은 지정된 동작을 연습하며 1~3바퀴를 순회한다. 4) 동작에 익숙해지면 난이도 2 단계 동작을 적용하거나 음악의 비트에 맞추어 동작을 수행한다.</p>
