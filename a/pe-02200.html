<h1>색연필 눈치게임</h1>
<p>1) 각자 책상 위에 색연필 12개를 꺼내놓고 대기한다. 2) 교사가 종을 치면 숫자 순서에 맞게 큰소리로 번호를 부르며 일어난다. 3) 다른 친구와 동시에 일어나거나, 순서에 틀린 숫자를 말하거나, 마지막까지 일어나지 못하면 탈락이다. 4) 탈락할 때마다 색연필 1개를 통에 넣고, 여러 라운드 후 남은 색연필이 많은 학생이 우승한다.</p>
