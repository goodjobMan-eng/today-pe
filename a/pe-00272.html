<h1>발목 줄넘기 지도 방법</h1>
<p>1) 주로 사용하는 발목에 발목 줄넘기 고리를 끼우고, 줄넘기 회전 줄과 공을 반대쪽 발 뒤쪽에 놓습니다. 2) 반대쪽 발뒤꿈치로 공을 앞으로 가볍게 툭 찹니다. 3) 회전하여 앞으로 돌아오는 줄과 공을 타이밍에 맞춰 반대쪽 발로 가볍게 점프하여 넘습니다. 4) 익숙해지면 발목을 앞뒤로 흔들거나 반원을 그리며 연속으로 회전시켜 넘습니다.</p>
