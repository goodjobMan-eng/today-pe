<h1>목표물 맞히기 쿱(Kubb) 게임</h1>
<p>1) 양쪽 베이스라인에 쿱 5개씩 세우고 경기장 중앙에 킹 1개를 배치한다. 2) 베이스라인 뒤에서 투척봉을 언더핸드로 던져 상대편 쿱을 맞혀 쓰러뜨린다. 3) 쓰러진 쿱은 상대 진영에 던져 세워 필드 쿱으로 만들며 베이스라인 쿱보다 먼저 맞춰야 한다. 4) 필드의 모든 쿱을 쓰러뜨린 후 중앙의 킹을 먼저 쓰러뜨리는 팀이 승리한다.</p>
