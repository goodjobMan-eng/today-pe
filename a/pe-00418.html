<h1>꼬인 손 풀기 미션</h1>
<p>1) 2인 미션은 서로 마주 보고 한 손은 하늘, 한 손은 땅을 향하게 한 뒤 엇갈려 손을 잡습니다. 2) 손을 놓지 않은 채 팔과 몸을 회전시켜 원래의 바른 손잡기 상태로 되돌립니다. 3) 다인원 미션은 3명 이상이 모여 서로 다른 사람의 손을 엇갈려 잡고, 손으로 만든 문을 통과하거나 몸을 비틀며 원형으로 풀어냅니다. 4) 정해진 시간 내에 손을 놓치지 않고 모든 꼬임을 풀어내면 미션에 성공합니다.</p>
