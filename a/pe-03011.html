<h1>신체 표현 활동 요가 기본 수련</h1>
<p>1) 매트 위에 바른 자세(아빠다리)로 앉아 눈을 감고 호흡을 가다듬으며 명상을 한다. 2) 턱 들어올리기, 머리 숙이기, 좌우로 목 늘리기, 어깨 및 팔 돌리기 스트레칭을 실시한다. 3) 손을 바닥에 대고 반대 팔을 뻗어 옆구리를 늘린 후 앉아서 척추를 앞뒤로 움직인다. 4) 다리를 펴고 앉아 무릎을 굽힌 채 상체와 하체를 비트는 자세를 취한 뒤, 일어서서 한쪽 발을 허벅지에 붙이고 손을 모으는 나무 자세로 10~20초간 유지한다.</p>
