<h1>체육 수업 파라슈트 활동 모음</h1>
<p>1) 파라슈트를 높이 들어 올려 반대편으로 걸어가거나(우산), 텐트처럼 안으로 들어가 공기를 가둔다.2) 교사가 색을 부르면 해당 색을 잡은 학생이 낙하산이 내려오기 전에 바깥을 한 바퀴 달린다(나스카).3) 낙하산 위에 공이나 풍선을 올리고 흔들어 떨어뜨리지 않고 회전시키거나 털어낸다.</p>
