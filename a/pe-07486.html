<h1>크레이지 후프 (Aro Loco)</h1>
<p>1) 운동장이나 강당 바닥에 훌라후프를 여러 개 흩어 놓고 학생들을 배치합니다. 2) 음악이 나오면 학생들은 후프 주위를 자유롭게 뛰어다닙니다. 3) 음악이 멈추면 학생들은 재빨리 훌라후프 안으로 들어가며, 한 후프에 몇 명이 들어가든 상관없습니다. 4) 교사가 후프를 무작위로 몇 개씩 빼면서 음악을 다시 틀고, 후프가 줄어들 때까지 과정을 반복합니다.</p>
