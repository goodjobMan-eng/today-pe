<h1>성 지키기 (Keeper of the Castle)</h1>
<p>1) 체육관 중앙 원(성) 안에 빈백·테니스공·원반 등 다양한 교구를 보물로 두고 성 지킴이를 지정한다 2) 4개 모퉁이 진지의 팀원들은 지킴이에게 태그되지 않고 중앙의 보물을 하나씩 가져와 자신의 진지 훌라후프에 넣는다 3) 보물을 가져오다 태그되면 보물을 제자리에 돌려놓고 자기 진지의 훌라후프를 터치한 뒤 다시 참여한다</p>
