<h1>원 둘레 달리기와 농구 패스 대결</h1>
<p>1) 여러 명이 원 모양으로 둥글게 둘러서고 공을 든 한 명이 원 바깥쪽에 선다. 2) 신호가 울리면 원 바깥의 주자는 원 둘레를 전력으로 한 바퀴 달린다. 3) 주자가 달리는 동안 원에 선 학생들은 옆 사람에게 양손으로 공을 빠르게 패스하여 한 바퀴 전달한다. 4) 주자가 제자리에 먼저 돌아오는지 공이 먼저 원래 자리로 돌아오는지 대결한다.</p>
