<h1>8자 마라톤 줄넘기</h1>
<p>1) 2명이 양 끝에서 긴 줄을 돌리고 나머지 10명은 한 줄로 선다. 2) 줄이 바닥을 치는 박자에 맞춰 한 사람씩 차례대로 줄 안으로 뛰어 들어간다. 3) 줄 안에서 1회 점프한 뒤 8자 궤적을 그리며 반대편으로 빠져나간다. 4) 2분 동안 걸리지 않고 연속으로 줄을 넘고 통과한 총인원 수를 측정한다.</p>
