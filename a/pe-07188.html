<h1>퍼펙트 패스 (Perfect Pass)</h1>
<p>1) 활동 구역에 훌라후프를 여러 개 깔아 두고 각 팀(최소 3명 이상) 출발선에 콘을 세운다. 2) 신호가 울리면 첫 번째 주자가 훌라후프 안으로 달려가고 두 번째 주자가 공을 던져 패스한다. 3) 후프 안에서 두 발로 공을 안전하게 잡으면 해당 후프를 자기 팀으로 가져와 점수를 획득한다.</p>
