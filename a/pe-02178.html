<h1>소프트발리볼 4인제 경기</h1>
<p>1) 각 팀 4명씩 배드민턴 코트(낮은 네트)에 마주 보고 위치한다. 2) 서브를 시작으로 부드러운 폼볼을 손이나 팔로 쳐서 네트 너머로 넘긴다. 3) 언더핸드 및 오버핸드 토스를 활용해 공이 바닥에 떨어지지 않도록 팀원끼리 연결하여 상대 진영으로 넘긴다. 4) 한 세트에서 15점을 먼저 얻는 팀이 승리하며, 3세트 중 2세트를 먼저 선취한 팀이 경기에서 승리한다.</p>
