<h1>팀 대항 참참참 릴레이</h1>
<p>1) 수비 팀 학생 여러 명이 일렬로 나란히 섭니다. 2) 공격 팀 1번 주자가 나와 첫 번째 수비수부터 순서대로 '참참참' 대결을 펼칩니다. 3) 공격자가 가리키는 손가락 방향과 수비수의 고개 방향이 일치하면 공격 팀이 1점을 획득합니다. 4) 줄 끝까지 연속해서 진행한 뒤 획득한 총점을 기록하고, 상대 팀과 공수를 교대하여 더 많은 점수를 얻은 팀이 승리합니다.</p>
