<h1>교실대첩 카드 대결 놀이</h1>
<p>1) 두 팀으로 나누고 팀조끼와 카드(포즈 레벨 1~9, 특수카드, 왕·여왕)를 각 팀에 나눠줍니다. 2) 상대방을 터치해 가위바위보를 하고 이긴 학생이 카드를 오픈할지 결정합니다. 3) 카드 대결에서 진 학생은 교실 앞 감옥으로 가서 팔벌려뛰기를 10회 하고 게임에 다시 참여합니다. 4) 먼저 왕과 여왕이 한 번씩 아웃된 팀이 지게 됩니다.</p>
