<h1>얼티밋 프리스비 규칙</h1>
<p>1) 100x35m 크기의 경기장에서 양 끝에 18x35m의 엔드존을 두고 경기를 진행한다. 2) 각 팀은 7명으로 구성하며 최소 5명으로 경기를 할 수 있다. 3) 디스크를 패스하여 상대 팀의 엔드존 안에서 잡으면 득점한다.</p>
