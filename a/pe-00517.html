<h1>어깨 매달리기 거꾸로 원숭이 놀이</h1>
<p>1) 부모 또는 짝이 서 있는 상태에서 아이가 앞쪽 다리와 허리에 단단히 매달립니다. 2) 어른이 아이의 등을 부드럽게 받치며 아래로 천천히 회전시켜 거꾸로 매달리게 합니다. 3) 거꾸로 매달린 상태에서 좌우로 몸을 가볍게 흔들어 공간 지각 감각을 익히고, 다리를 벌려 앞뒤로 흔들거나 천천히 걸으며 회전 이동하는 응용 동작을 합니다. 4) 활동이 끝나면 두 손을 안전하게 바닥에 짚고 부드럽게 내려옵니다.</p>
