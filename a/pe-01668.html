<h1>겨울 왕국 프리즈 댄스 신체 표현 놀이</h1>
<p>1) 화면이 잘 보이는 교실이나 강당에 서서 자신의 활동 공간을 확보하고 준비한다. 2) 신나는 음악이 흘러나오는 동안 화면 속 캐릭터들의 춤 동작을 따라 하거나 나만의 창의적인 춤을 춘다. 3) 음악이 갑자기 멈추면 화면에 나오는 캐릭터의 스트레칭·정지 자세를 그대로 따라 하며 15초 동안 멈춘다. 4) 중간에 등장하는 선물 상자를 골라 푸시업이나 런지 등 제시된 보너스 피트니스 미션을 완수한다.</p>
