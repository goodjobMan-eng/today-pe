<h1>고속도로 릴레이 (Vía Rápida)</h1>
<p>1) 배구장이나 농구장 코트의 중앙과 모서리 지점에 총 6개의 콘을 설치합니다. 2) 6개의 콘 위치마다 팀별로 한 줄씩 줄을 서서 대기합니다. 3) 교사의 신호(호각)가 울리면 각 팀의 첫 번째 주자가 시계 방향을 따라 코트를 달려 자신의 원래 팀 위치까지 한 바퀴를 돕니다. 4) 자신의 팀에 도착하면 다음 주자와 하이파이브(손뼉 치기)를 하고, 다음 주자가 시계 방향으로 출발합니다.</p>
