<h1>교실트레이닝 9 - 층간소음 걱정 없는 가벼운 맨손체조</h1>
<p>1) 제자리에서 다리 스트레칭을 하며 허벅지와 다리 근육을 충분히 늘려줍니다. 2) 발목을 잡고 앉았다 일어서는 동작과 함께 팔을 크게 돌리며 관절을 풀어주고, 발끝으로 바닥을 찍으며 팔을 위와 옆으로 뻗어 전신을 움직입니다. 3) 바닥에 손을 짚고 팔로 걷는 동작(인치웜)을 수행한 후 앉아서 다리 스트레칭을 이어갑니다. 4) 깍지 낀 손을 위로 뻗어 늘려주고 심호흡으로 체조를 마무리합니다.</p>
