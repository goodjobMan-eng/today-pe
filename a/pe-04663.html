<h1>스파게티와 미트볼 술래잡기</h1>
<p>1) 15~18명의 학생이 스쿠터보드 위에 엉덩이를 대거나 무릎을 꿇고 앉아 농구 코트 안을 이동한다. 2) 케이지볼 2개를 미는 술래(미트볼)와 스쿠터보드를 타고 풀누들을 든 술래(스파게티)가 이동하는 학생들을 태그한다. 3) 태그된 학생은 스쿠터보드에서 일어나 콘 옆에 줄을 서고, 대기하던 다음 학생이 스쿠터보드를 타고 게임에 참여한다.</p>
