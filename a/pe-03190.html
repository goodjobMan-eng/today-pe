<h1>평영 기본 영법 동작 익히기</h1>
<p>1) 다리와 팔을 뻗고 물속에서 코로 숨을 내쉰다. 2) 팔로 원을 그리며 물을 옆으로 당기고, 머리가 물 밖으로 나오면 입으로 숨을 들이마신다. 3) 팔꿈치를 구부려 손을 가슴 앞으로 모으고 발뒤꿈치를 끌어당기며 발목을 바깥쪽으로 벌린다. 4) 팔을 앞으로 뻗으며 발목을 사용하여 물을 뒤쪽으로 밀어내고 다리를 모아 몸을 일직선으로 유지하며 미끄러져 나아간다.</p>
