<h1>수박이 잘 익었나 통통통 풍선 치기</h1>
<p>1) 풍선을 잡고 교사의 신호에 맞추어 손, 머리, 발 등 다양한 신체 부위로 정해진 횟수만큼 쳐서 공중에 띄웁니다.2) 두 가지 이상의 신체 부위를 조합하거나 번갈아 가며 풍선을 떨어뜨리지 않고 연속으로 칩니다.3) 4명씩 모둠을 이루어 한 손 또는 양손으로 풍선을 치면서 라바콘 반환점을 돌아오는 릴레이 게임을 진행합니다.</p>
