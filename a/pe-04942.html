<h1>부모와 함께하는 수영 교실: 자유형(크롤)</h1>
<p>1) 킥판에 손을 올리고 벽을 차서 글라이딩(케노비) 후 발차기를 한다.2) 킥판에 한 손을 얹고 몸을 옆으로 기울여 사이드 킥을 하며 호흡 자세를 익힌다.3) 선 자세에서 손을 배 쪽으로 당겨 뒤로 물을 밀어내고 크게 돌리는 팔 동작을 익힌다.4) 손이 가슴 앞쪽에 올 때 고개를 옆으로 돌려 대각선 위를 보며 호흡을 연결한다.5) 한 팔씩 번갈아 젓고 앞에서 양손을 모았다가 나아가는 캐치업 자유형을 연습한다.</p>
