<h1>콘 플립 릴레이</h1>
<p>1) 차례가 되면 한 명씩 달려가 자기 팀의 첫 번째 콘을 잡습니다.2) 콘의 윗부분을 잡고 공중에 던져 똑바로 세우는 도전을 1회 시도합니다.3) 똑바로 세우는 데 성공하면 다음 주자는 그 콘을 건너뛰고 다음 콘으로 넘어가며 실패하면 제자리에 두고 다음 주자를 터치합니다.</p>
