<h1>평균대에서 다양한 방법으로 걷기</h1>
<p>1) 땅에서 중심을 옮기며 평균대 위에 올라서 양팔을 벌려 중심을 잡는다. 2) 내딛는 발로 평균대의 옆면을 스치며 확인하고 앞으로 한 발씩 나아가 끝까지 걷는다. 3) 몸을 옆으로 돌려 양팔을 벌린 뒤 앞발을 움직이고 뒷발을 당겨오며 옆으로 걷는다. 4) 몸을 낮춘 후 양팔을 벌려 중심을 잡고 발을 내밀어 면보다 아래로 내렸다 올리며 걷는다.</p>
