<h1>공 몰기(드리블) 상호 피드백 활동</h1>
<p>1) 학생들이 역할을 나누어 드리블 연습자와 피드백을 주는 친구 코치(친샘)로 짝을 이룬다.2) 연습자는 발의 안쪽과 바깥쪽을 고루 사용하며 공 몰기를 연습한다.3) 친구 코치는 옆을 따라다니며 방향을 돌 때 자세를 낮추도록 1:1 피드백과 격려를 제공한다.4) 활동 후 역할을 바꾸어 상호 코칭을 이어간다.</p>
