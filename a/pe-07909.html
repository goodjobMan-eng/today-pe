<h1>건강활동-탭볼을 배워보자(2)</h1>
<p>1) 제자리 및 좌우, 앞뒤로 이동하며 탭볼을 가볍게 친다. 2) 제자리에서 회전하거나 공을 중심에 두고 돌면서 탭볼을 친다. 3) 탭볼을 치면서 앉았다 일어서기를 반복하거나 몸을 돌려 공을 피한 뒤 다시 친다. 4) 헤드밴드를 손에 쥐고 발등으로 공을 차는 킥 탭볼을 10회 연속 실시한다.</p>
