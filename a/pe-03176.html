<h1>스카프 균형잡고 릴레이 공 이동하기</h1>
<p>1) 두 명씩 짝을 지어 출발선에 서고 맨 앞 두 명은 스카프를 들고 위에 솜털공을 올려놓는다. 2) 신호가 울리면 스카프를 마주잡고 삼각콘을 돌아온다. 3) 앞 주자가 들어오면 다음 주자가 솜털공을 올린 스카프를 전달받아 출발한다. 4) 마지막 주자가 가장 먼저 들어온 모둠이 승리한다.</p>
