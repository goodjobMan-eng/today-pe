<h1>빈 곳을 향해 서브</h1>
<p>1) 4명이 한 모둠을 이루고 공격 모둠과 수비 모둠으로 나눕니다. 2) 공격 모둠은 순서를 정하고 1명이 2번씩 서브 구역에서 네트 너머로 공을 쳐서 넘깁니다. 3) 수비 모둠은 공격 모둠이 친 공을 잡되 원마커 안에는 들어갈 수 없습니다. 4) 친 공이 코트 안에 떨어지면 1점, 원마커 안에 떨어지면 2점을 얻으며, 수비가 잡거나 밖으로 나가면 무득점이고 공격 완료 후 공수를 교대합니다.</p>
