<h1>종이컵 놀이 시즌 3</h1>
<p>1) 종이컵을 일렬로 뒤집어 세워 손가락으로 톡 쳐서 세우는 '틱! 톡!' 활동을 합니다. 2) 컵과 컵 사이에 종이를 넣고 재빠르게 빼서 컵이 겹쳐지도록 하는 '컵과 컵 사이' 활동을 합니다. 3) 6개씩 5줄로 세운 30개의 종이컵으로 60초 안에 다양한 모양을 만드는 '미션 임파서블!' 활동을 합니다. 4) 색이 있는 주사위를 굴려 나오는 색깔의 종이컵만 빠르게 뒤집는 '어떤 색을 뒤집을까?' 활동을 합니다.</p>
