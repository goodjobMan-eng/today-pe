<h1>사다리에서 왔다 갔다 삼각콘 옮기기</h1>
<p>1) 사다리 양쪽 끝에 미니 삼각콘을 각각 2개씩 놓고, 사다리를 사이에 두고 가운데 출발 지점에 마주 선다. 2) 신호가 울리면 사다리 한쪽 끝으로 사이드 스텝으로 이동한 뒤 삼각콘을 안쪽으로 1칸 옮겨 놓고 반대쪽으로 이동한다. 3) 반대쪽 삼각콘을 안쪽으로 1칸 옮겨 놓고 다시 반대쪽으로 이동하는 과정을 반복한다. 4) 사다리 양쪽에 있는 삼각콘을 가운데 지점까지 가장 빨리 옮긴 사람이 이긴다.</p>
