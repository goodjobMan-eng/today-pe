<p>1) 우레탄 트랙 위에 폼 블록(BlockX)을 미로 격자 형태로 배열한다. 2) 네 발 걷기, 게걸음 자세로 블록 사이를 넘나들며 이동한다. 3) 양발 모아 점프 및 사이드 스텝으로 블록 격자를 통과한다. 4) 콘을 블록 사이에 두고 반환점을 돌아오는 릴레이 게임을 진행한다.</p>
