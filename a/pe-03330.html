<h1>강 넘어 선물 배달하기</h1>
<p>1) 공격 모둠과 수비 모둠으로 나누고 공격 모둠 중 한 명은 득점 구역에, 나머지는 공격 구역에서 시작합니다. 2) 공격 구역에 있는 친구들은 공을 차고 멈추면서 득점 구역에 있는 친구에게 연결합니다. 3) 득점 구역 안의 친구가 공을 받아 멈추면 1점을 획득하고, 수비 모둠은 공이 들어가지 못하도록 밖으로 차냅니다. 4) 정해진 시간이 지나면 역할을 바꾸어 진행하고 점수가 많은 모둠이 승리합니다.</p>
