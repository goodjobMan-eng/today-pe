<h1>농구 연속 4회 슛 챌린지</h1>
<p>1) 의자 위에 바구니(또는 상자)를 올리고, 6/8/10/12피트 거리에 물건 4개를 일렬로 놓는다. 2) 1분 타이머 동안 첫 번째 물건을 뛰어넘고 돌아서서 바구니로 슛을 던진다. 3) 성공하면 다음 거리의 물건들을 차례로 뛰어넘은 뒤 슛을 시도한다. 4) 한 번이라도 실패하면 처음(1단계)부터 다시 시작하여 1분 안에 연속 4회 슛 성공을 목표로 한다.</p>
