<h1>킨볼 매트 넘기기 게임</h1>
<p>1) 킨볼 내피와 외피를 확인하고 송풍기로 공기를 주입한 뒤 입구를 3~4회 돌려 묶어 준비한다. 2) 4~8명의 인원이 두 팀으로 나뉘어 세워진 매트를 사이에 두고 마주 선다. 3) 양손으로 공을 머리 위로 들어 올려 네트(매트) 너머 상대 구역으로 던져 넘긴다. 4) 30초에서 1분 동안 공을 주고받은 후 시간 종료 시 자기 코트에 공이 없는 팀이 승리한다.</p>
