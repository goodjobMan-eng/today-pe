<h1>호커스 포커스 놀이</h1>
<p>1) 술래(샌더슨 자매) 3명을 정해 빗자루(풀누들)를 타고 중앙 원에서 대기한다. 2) 음악이 시작되면 외곽의 학생들은 공(사탕)을 던져 패스하고, 술래는 공을 가로채 바구니에 담는다. 3) 공을 되찾고 싶은 학생은 매트로 가서 점핑잭 10회를 수행한 뒤 바구니에서 공 1개를 가지고 돌아온다. 4) 2분의 제한 시간이 끝나면 술래는 아직 참여하지 않은 다른 학생을 다음 술래로 지목한다.</p>
