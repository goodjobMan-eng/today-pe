<h1>종이 골프 토너먼트 게임</h1>
<p>1) 종이를 뭉쳐 만든 공을 들고 출발 지점(티박스)에 선다. 2) 정해진 코스를 따라 벙커, 워터 해저드, 문, 식물 등 장애물을 피해 핀(목표 지점)을 향해 공을 던지거나 쳐서 날린다. 3) 공이 벙커에 들어간 경우 머리 뒤로 손을 넘겨 던지는 벌칙 샷 규칙을 적용하여 던진다. 4) 가장 적은 타수로 홀아웃하여 파(Par) 이하의 타수를 기록한 사람이 승리한다.</p>
