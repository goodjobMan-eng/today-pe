<h1>누들 스틱과 풍선의 만남</h1>
<p>1) 3~4명씩 팀을 나누고 각자 누들 스틱(백업 스틱)을 준비합니다. 2) 팀에서 풍선에 바람을 넣은 후 누들 스틱으로 띄우는 연습을 합니다. 3) 돌아가면서 더 많이 더 오래 띄우는 대결을 합니다. 4) 바닥에 풍선이 닿거나 차례를 지키지 않으면 끝나며, 연속으로 2번 칠 수 없습니다.</p>
