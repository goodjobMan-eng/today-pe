<h1>거리 도전 던지기 (가벼운 공 및 간이 투포환 던지기)</h1>
<p>1) 가벼운 공 던지기는 어깨너비로 다리를 벌리고 왼발을 앞으로 뺀 뒤 공 쥔 팔을 뒤로 뺐다가 어깨 위로 힘껏 넘겨 던진다. 2) 간이 투포환은 다리를 앞뒤로 벌리고 던지는 반대 방향으로 몸을 낮춘 후, 반대편 다리를 뒤로 크게 딛는다. 3) 몸을 던지는 방향으로 회전시키며 투포환을 목 옆에 유지하고 벽을 밀듯이 손으로 밀어 던진 후 발을 바꾼다.</p>
