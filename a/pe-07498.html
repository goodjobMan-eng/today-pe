<h1>요정 피구 (Le jeu du lutin)</h1>
<p>1) 최소 5명의 참가자가 경기장 안으로 들어가며 공을 가진 사람은 3걸음 이내로 이동하고 5초 이내에 던져야 합니다. 2) 공에 맞은 사람은 경기장 밖 감옥으로 이동하며, 자신을 맞힌 선수가 다른 사람에게 맞을 때까지 감시합니다. 3) 자신을 아웃시킨 선수가 공에 맞으면 즉시 경기장 안으로 부활하여 들어오며, 최종적으로 모든 상대를 탈락시키면 승리합니다.</p>
