<h1>엔칸토 틀린 그림 찾기 브레인 브레이크 운동</h1>
<p>1) 화면에 제시된 두 장의 그림을 15초 동안 관찰하며 서로 다른 점을 찾아냅니다. 2) 3가지 보기 중 정답이라고 생각하는 선택지 아래의 운동 동작을 확인합니다. 3) 20초 카운트다운 동안 자신이 고른 답에 해당하는 동작(마운틴 클라이머, 푸시업, 레그레이즈 등)을 수행합니다. 4) 타이머 종료 후 공개되는 정답을 맞혔다면 1점을 획득하며 총 3단계 레벨을 진행합니다.</p>
