<h1>패스패스 공 지키기</h1>
<p>1) 술래를 중심으로 큰 원을 만들어 둘러섭니다. 2) 바깥 원의 학생들은 술래에게 공을 뺏기지 않도록 발로 패스를 주고받습니다. 3) 가운데 술래는 패스되는 공을 손을 쓰지 않고 발로 빼앗아야 합니다. 4) 술래가 공을 빼앗으면 마지막으로 패스한 사람이 새로운 술래가 됩니다.</p>
