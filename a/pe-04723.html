<h1>누들 댄스 태그</h1>
<p>1) 경기장 경계선을 정하고 학생 2명에게 절반 크기 누들을 주어 술래로 지정한다. 2) 술래는 음악이 멈추기 전까지 빈 공간으로 도망치는 학생들을 누들로 어깨 아래 부위를 터치한다. 3) 술래에게 터치당하거나, 넘어지거나, 경기장 밖으로 나가면 제자리에 얼어붙는다. 4) 얼어붙은 학생은 이동하지 않고 제자리에서 양옆으로 스텝을 밟으며 주먹을 위아래로 흔드는 댄스를 춘다.</p>
