<h1>콘을 활용한 4가지 신체 활동</h1>
<p>1) 후프를 점프해 통과하며 콘이 놓인 방향으로 몸을 돌린다. 2) 체조봉으로 납작한 콘을 큰 콘 사이로 조작하여 릴레이를 진행한다. 3) 팀원과 협력하여 각 줄마다 같은 색깔의 콘이 오도록 배열하고, 플랭크 자세에서 호명된 색상의 콘을 터치한다.</p>
