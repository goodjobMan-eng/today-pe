<h1>릴레이 티볼 공 던지고 받기 미션 게임</h1>
<p>1) 1번 주자는 제자리에서 공을 위로 던지고 양손으로 안정되게 받기를 3회 실시 후 교대한다. 2) 2번 주자는 공을 위로 던진 후 박수를 세 번 치고 받기를 3회 성공한 뒤 교대한다. 3) 3번 주자는 공을 던져 오른쪽 1바퀴 회전 후 받기 1회, 왼쪽 회전 후 받기 1회를 수행한다. 4) 4번 주자는 공을 던져 전방에 세워진 타깃을 맞히며 모든 미션을 먼저 종료한 팀이 승리한다.</p>
