<h1>플라이오 박스 높이별 점프와 파워 스프린트</h1>
<p>1) 3인 1조로 높이가 다른 플라이오 플랫폼 앞에 서서 약 10초간 발을 가볍게 뛰며 스텝업을 반복하고 2회 교대한다.2) 구호에 맞춰 박스 위로 점프해 올라가 스쿼트 자세로 부드럽게 착지한 뒤 천천히 걸어 내려온다.3) 뜀뛰기(Leapfrog)처럼 박스를 밟고 건너뛴 후 착지하자마자 강력한 파워 스텝으로 전력 질주(스프린트)한다.</p>
