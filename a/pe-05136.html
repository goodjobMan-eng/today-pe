<h1>핀포인트 (교실 체육 게임)</h1>
<p>1) 책상 위에 표적이 될 물건 하나를 올려놓고 두 명이 짝을 이룬다.2) 각자 뭉친 종이 3개를 준비하여 번갈아 가며 표적을 향해 던진다.3) 자신의 종이로 상대방의 종이를 쳐내어 더 멀리 밀어낼 수 있다.4) 표적에 자신의 종이 2개를 더 가깝게 위치시킨 사람이 승리한다.</p>
