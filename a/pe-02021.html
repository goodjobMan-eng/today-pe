<h1>대장 따라하기 놀이</h1>
<p>1) 전원이 양반다리를 하고 무릎 위에 손을 올린 기본자세로 둥글게 둘러앉는다. 2) 모두가 엎드려 바닥을 두드리는 동안 교사가 몰래 대장 1명을 지목하고, 술래 1명은 가운데에 앉는다. 3) 시작 신호가 울리면 대장은 손뼉 치기나 머리 만지기 등 동작을 바꾸고 나머지 학생들은 들키지 않게 대장의 동작을 그대로 따라 한다. 4) 가운데 앉은 술래는 자리에 앉아 몸만 회전하며 누가 대장인지 관찰하여 찾아내고, 맞히면 역할을 바꾼다.</p>
