<h1>뜀틀 앞으로 뛰어 넘기</h1>
<p>1) 도움닫기: 마지막 3~4보는 빠르게 뛰며 발구름판을 바라봅니다. 2) 발 구르기: 두 발이 동시에 발구름판의 가운데를 밟고 올라갑니다. 3) 손 짚기: 뜀틀의 멀리(3번 자리)를 양손 동시에 짚습니다. 4) 공중 자세: 몸의 밸런스를 맞추어 균형을 유지합니다. 5) 착지 자세: 양발을 모으고 무릎을 구부려 안전하게 착지합니다.</p>
