<h1>초등 축구형 게임 기본 규칙</h1>
<p>1) 발 또는 머리를 사용해 상대팀 골대에 공을 차서 넣는다. 2) 경기 중 골키퍼를 제외한 필드 플레이어는 손이나 팔에 공이 닿아서는 안 된다. 3) 공이 사이드라인 밖으로 나가면 두 손으로 던지는 스로인으로 경기를 재개한다. 4) 수비수 맞고 엔드라인 밖으로 나가면 코너킥, 파울 시 위치에 따라 프리킥이나 페널티킥을 진행한다.</p>
