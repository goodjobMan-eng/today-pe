<h1>파머스 백팩 캐리</h1>
<p>1) 10m 직선 코스 바닥에 0m, 4m, 5m 지점을 콘으로 표시하고 출발 순서를 정한다. 2) 첫 주자는 양손에 백팩을 1개씩 들고 출발선에서 백팩 스쿼트를 5회 실시한다. 3) 4m 지점까지 백팩 워킹 런지 6회를 하며 전진한 뒤, 5m 반환점까지 러닝하여 콘을 돌고 출발선으로 복귀한다. 4) 다음 주자와 하이파이브로 교대하며 팀원 5명 전원이 완주하면 성공한다.</p>
