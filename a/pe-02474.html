<h1>릴레이 콘 뒤집기</h1>
<p>1) 전체 인원을 4인 1조로 나누고 팀 내 순서를 정한 후 출발 지점에서 대기한다. 2) 첫 주자는 출발 신호에 맞춰 빠르게 뛰어가 콘 1개를 뒤집고 돌아와 다음 주자에게 터치한다. 3) 릴레이로 모든 콘을 뒤집을 때까지 수행한다. 4) 마지막 콘을 뒤집은 주자가 가장 먼저 결승선을 통과하는 팀이 승리한다.</p>
