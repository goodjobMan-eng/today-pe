<h1>그랩 잇 (음악 멈추면 빈백 잡기)</h1>
<p>1) 원마커 위에 빈백을 두고 두 학생이 마커로부터 약 1m 거리에 마주 보고 선다. 2) 음악이 나오면 정해진 운동 동작(점핑잭, 윗몸일으키기 등)을 각자의 속도로 수행하거나 리더를 따라 한다. 3) 음악이 멈추는 순간 동작을 멈추고 중앙의 빈백을 먼저 낚아챈다. 4) 빈백을 잡은 학생은 매너 있게 기뻐하며 빈백을 원마커에 제자리에 놓고 다음 라운드를 준비한다.</p>
