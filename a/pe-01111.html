<h1>원숭이 스텝 트릭 줄넘기</h1>
<p>1) 각자 줄넘기를 쥐고 줄을 머리 위에서 몸 앞쪽으로 비스듬히 돌리는 궤도를 파악한다. 2) 한 손은 가슴 높이에 고정하고 다른 손으로 머리 위에서 원을 그리며 줄을 연속 회전시킨다. 3) 회전하는 줄이 발 아래로 내려오는 타이밍에 맞춰 왼발과 오른발을 번갈아 들어 올리며 줄을 연속으로 통과한다. 4) 기본 동작이 숙달되면 통과 횟수 연속 10회 도전하기나 짝과 마주 보며 번갈아 수행하는 챌린지로 변형한다.</p>
