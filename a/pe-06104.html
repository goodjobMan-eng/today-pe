<h1>헤드 or 테일</h1>
<p>1) 양면 색이 다른 마커를 사용하여 한쪽 면을 머리(Head), 반대쪽 면을 꼬리(Tail)로 지정한다.2) 학생들이 각자 머리 또는 꼬리를 선택한 뒤 지도자가 마커를 위로 튕겨 떨어뜨린다.3) 바닥에 나온 면과 일치하게 맞힌 학생은 정해진 운동(예: 스쿼트 5개 또는 15개)을 수행하고 완료 시 칭찬이나 보상을 받는다.</p>
