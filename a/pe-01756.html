<h1>디즈니 캐릭터 밸런스 타바타 운동</h1>
<p>1) 화면에 등장하는 두 명의 디즈니 캐릭터나 상황 중 마음에 드는 쪽을 빠르게 선택한다. 2) 몇 초 후 각 캐릭터 밑에 나타나는 신체 단련 과제(스쿼트, 런지, 마운틴 클라이머, 플랭크 등)를 확인한다. 3) 30초 타이머 동안 자신의 선택에 해당하는 체력 운동을 올바른 자세로 지속한다. 4) 휴식 신호에 맞춰 호흡을 가다듬고 다음 디즈니 매치업에 참여하며 전신 근력을 골고루 기른다.</p>
