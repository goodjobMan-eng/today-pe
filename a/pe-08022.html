<h1>부활 피구와 불꽃 피구</h1>
<p>1) 부활 피구는 공에 맞은 외야 선수가 지정된 미션(철봉 턱걸이/정글짐 터치 등)을 완료하면 내야로 부활한다. 2) 불꽃 피구는 일반 공 1개와 불꽃 공 1개를 동시에 사용한다. 3) 불꽃 공은 여학생만 만질 수 있으며 남학생은 닿거나 잡거나 굴러오는 공을 스치기만 해도 아웃된다.</p>
