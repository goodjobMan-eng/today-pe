<h1>공잡기를 해 보아요</h1>
<p>1) 짝과 가까운 거리에서 언더로 공을 주고받다가 성공하면 거리를 넓혀 오버로 던지며 피드백한다.2) 팀별로 나뉘어 피드백을 전담하는 친구 선생님을 한 명 선정한다.3) 나에게서 가장 멀리 이동해 있는 상대 팀원에게 스텝을 밟고 허리를 돌려 공을 던진다.4) 공으로 상대를 터치하면 1점을 획득한다.</p>
