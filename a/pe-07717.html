<h1>위·아래·주변 장애물 짝 통과 놀이</h1>
<p>1) 두 명씩 짝을 지어 한 명이 엎드려 브릿지 또는 무릎을 꿇은 터널 자세를 취한다. 2) 다른 짝은 파트너의 등 위(Nad/Over)를 넘어 반대편으로 건너간다. 3) 이어서 파트너의 몸 아래(Pod/Under)로 기어서 통과한다. 4) 마지막으로 파트너의 주위를 한 바퀴 돌아 제자리로 온 뒤(Okolo/Around), 역할을 바꾸어 2분 동안 교대 횟수를 센다.</p>
