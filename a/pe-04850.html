<h1>13 풍선 대결</h1>
<p>1) 책상을 가장자리로 밀고 교실 앞뒤에 의자 8개로 골대를 만든 뒤 반을 두 팀으로 나누고 골대 앞에 앉을 대표 1명을 뽑는다.2) 팀원들은 자기 팀 대표와 같은 방향을 바라보며 한 명씩 번갈아 원하는 자리에 앉는다.3) 대표가 풍선을 멀리 쳐서 경기를 시작하며, 손으로 쳐서 상대 골대에 풍선을 넣는다.4) 의자 위에 풍선이 걸치면 1점, 의자 사이 구멍 안으로 들어가면 3점을 얻는다.</p>
