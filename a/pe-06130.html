<h1>폭신주사위공 칸잼</h1>
<p>1) 3m~5m 거리를 두고 던지는 사람과 받는 사람이 마주 서며, 받는 사람 쪽에 박스를 놓는다.2) 던지는 사람이 폭신주사위공을 박스 쪽으로 약간 길게 던진다.3) 받는 사람이 손(또는 몸)으로 공을 살짝 쳐서 박스에 넣으면 1점을 얻고, 던진 공이 박스에 직접 바로 들어가면 2점을 얻는다(공 8개를 던져 모둠별 점수를 합산).</p>
