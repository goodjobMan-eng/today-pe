<h1>원형 라인 콘 수거 달리기 게임</h1>
<p>1) 센터 서클 중앙에 여러 색깔의 미니 콘들을 모아 두고 둘레에 팀별 콘을 배치한다. 2) 신호가 울리면 중앙으로 달려가 콘을 집어 자신의 원 둘레 구역으로 가져온다. 3) 원 둘레를 따라 달리며 신호에 따라 푸시업이나 런지 같은 맨몸 운동 동작을 수행한다. 4) 제한 시간이 끝나면 각 팀 또는 개인이 모은 콘의 개수를 세어 확인한다.</p>
