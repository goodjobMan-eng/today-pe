<h1>초등 저학년 줄넘기 못하는 아이 교정 방법 5가지</h1>
<p>1) 줄을 바닥에 놓고 넘어 서 점프하기 연습을 합니다. 2) 제자리에서 뒤꿈치를 살짝 들고 점프하는 연습을 합니다. 3) 한 손만 잡고 뒤에서 앞으로 천천히 줄 돌리기 연습을 합니다. 4) 가상의 줄을 돌린다고 생각하고 점프와 팔 돌리기 타이밍 연습을 합니다. 5) 줄을 앞으로 보내고 천천히 줄넘기 한 번 넘기 시도하기 연습을 합니다.</p>
