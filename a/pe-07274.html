<h1>농구 21</h1>
<p>1) 순서를 정하고 첫 번째 선수가 자유투 라인에서 슛을 시도하며 자유투 성공 시 2점을 얻고 계속해서 슛을 쏜다. 2) 슛을 실패하면 다음 순서 선수가 공이 떨어진 리바운드 위치에서 바로 슛을 시도하며 성공 시 1점을 얻는다. 3) 리바운드 슛을 성공한 선수는 다시 자유투 라인으로 이동해 2점 슛을 이어가며 정확히 21점을 먼저 채우는 사람이 승리한다.</p>
