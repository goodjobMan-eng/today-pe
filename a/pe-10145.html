<h1>가위바위보 다리 찢기 게임</h1>
<p>1) 2명씩 짝을 지어 발을 일자 모양으로 만들고 앞발을 맞댄 상태에서 가위바위보를 한다. 2) 가위바위보에서 이긴 사람은 앞발을 뒤로 한 발 물러서고, 진 사람은 앞발을 앞으로 밀어 상대방 앞발에 닿게 다리를 찢는다. 3) 계속 가위바위보를 진행하여 다리를 더 이상 벌리지 못하는 쪽이 지게 된다.</p>
