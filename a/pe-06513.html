<h1>초등 야구형 놀이(주먹야구 및 약식 티볼)</h1>
<p>1) 접시콘으로 거리를 표시하고 마주 보며 말랑말랑한 공을 던지고 받는 캐치볼 연습을 한다. 2) 공격수는 배트 없이 손(주먹)으로 말랑말랑한 공을 치고 베이스를 돌아 점수를 획득한다. 3) 수비수가 공을 잡고 베이스를 먼저 밟으면 아웃되며, 이후 티와 배트를 사용하는 약식 티볼 형태로 응용해 진행한다.</p>
