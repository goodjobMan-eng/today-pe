<h1>무 뽑기 놀이</h1>
<p>1) 무 역할을 맡은 아이들은 엎드려 둥글게 모인 뒤 옆 친구와 단단히 팔짱을 낍니다. 2) 술래는 무 역할 아이들의 다리를 잡아당겨 엮인 팔을 풀려고 시도합니다. 3) 팔이 풀려 밖으로 끌려 나온 아이는 술래 편이 되어 함께 다른 무를 뽑습니다. 4) 정해진 시간 동안 끝까지 팔짱을 풀지 않고 버틴 아이가 승리합니다.</p>
