<h1>킨볼</h1>
<p>1) 세 명의 선수가 삼각형 대형으로 무릎을 꿇고 공 밑에 손을 받쳐 올린다. 2) '옴니킨'과 함께 공격할 상대 팀 색상을 외치고 공을 쳐서 날려 보낸다. 3) 공은 최소 3미터 이상 날아가야 하며 땅으로 내리꽂히면 실책이 된다. 4) 호명된 팀은 공이 바닥에 닿기 전에 받아내야 하며, 수비팀은 공 중심에서 3~4미터 거리를 두고 사각형 대형을 유지하며 이동한다.</p>
