<h1>칠면조 게임(Gobble Gobble)</h1>
<p>1) 팀별로 칠면조 스쿠터를 준비한다. 2) 1라운드: 스쿠터를 밀고 가서 깃털(풀 누들)을 1개 뽑아 돌아온다. 3) 2라운드: 스쿠터를 밀고 가서 깃털을 1개 꽂고 돌아온다. 4) 모든 깃털을 뽑거나 꽂은 후 팀원 전체가 앉으면 승리한다.</p>
