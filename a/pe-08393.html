<h1>축구 패스 릴레이 표적 맞히기</h1>
<p>1) 팀별로 출발선에 한 줄로 서고 맞은편에 콘 표적을 단계별 거리로 배치한다. 2) 차례가 된 주자는 공을 패스하여 표적 콘을 맞혀 쓰러뜨린다. 3) 콘을 맞히면 콘을 회수하여 뒤쪽에 쌓아 거리를 멀리 늘리고 다음 주자에게 공을 연결하며, 실패하면 공을 몰고 돌아와 다음 주자에게 넘긴다.</p>
