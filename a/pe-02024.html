<h1>매트 체스 게임</h1>
<p>1) 2명씩 짝이 되어 1명은 매트 밖에서 구르기 동작과 횟수가 적힌 주사위를 던집니다. 2) 매트 안의 학생은 주사위에 나온 방법대로 구르기를 하여 상대편 학생을 손으로 터치합니다. 3) 손에 닿은 학생은 매트 밖의 학생과 역할을 바꾸어 다시 게임에 참여합니다. 4) 활동을 반복하여 역할이 가장 덜 바뀐 팀이 이깁니다.</p>
