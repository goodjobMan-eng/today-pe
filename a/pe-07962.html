<h1>도약 앞구르기 (스프룽롤레) 단계별 연습</h1>
<p>1) 낮은 장애물을 두고 토끼뜀 뛰기로 손 지지 감각을 익힌다. 2) 매트 위에서 앞구르기를 길게 늘여 팔을 멀리 짚고 강하게 발을 구르는 긴 앞구르기를 연습한다. 3) 두 연습을 합쳐 손과 발이 바닥에서 떨어지는 짧은 공중 동작이 포함된 도약 앞구르기를 실시한다. 4) 구름판(발구름대)을 안전 매트 앞에 두고 뛰어올라 공중 체공 거리를 늘리는 도약 앞구르기를 완성한다.</p>
