<h1>어항 술래잡기</h1>
<p>1) 코트 중앙에 세움 매트 5장으로 입구 1곳을 둔 원형 어항을 만들고 안쪽에 콘 6개를 배치한다. 2) 술래는 폼 태그 스틱을 들고 학생들을 터치하러 다닌다. 3) 태그된 학생은 어항 안으로 들어가 콘 세우기(플립)를 최대 5회 시도한다. 4) 5회 안에 콘 세우기에 성공하거나, 실패 시 점핑잭 5회를 마치면 게임에 복귀한다.</p>
