<h1>3학년 타기 타원 코스 릴레이</h1>
<p>1) 주자 순서를 정하고 가위바위보를 통해 이긴 팀 주자가 안쪽 라인에서 대기한다.2) 출발 신호에 맞춰 스쿠터보드를 타고 타원 코스를 돌아 반대편 주자에게 이동한다.3) 파란 선을 몸과 기구가 완전히 통과해야 다음 주자가 교대하여 출발할 수 있다.</p>
