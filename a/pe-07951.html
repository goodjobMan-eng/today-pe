<h1>등 만지기 놀이 (Toca espaldas)</h1>
<p>1) 경기장 전체에 모든 학생이 흩어져서 선다. 2) 30초 동안 가능한 한 많은 친구의 등을 터치한다. 3) 같은 친구의 등만 계속 만질 수 없으며 다른 친구들의 등을 만져야 한다. 4) 정해진 시간이 끝나면 교사가 학생들을 모아 터치한 등 개수 구간(0~10개, 11~20개, 21~30개)을 부르고 해당 학생은 손을 든다.</p>
