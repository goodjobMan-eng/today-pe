<h1>핸드스프링(앞짚고 넘기) 연습</h1>
<p>1) 뜀틀 구름판(로이터판)과 매트를 세팅한 뒤 충분한 도움닫기 홉(hop)으로 손을 짚는다.2) 손을 짚는 순간 팔꿈치가 무너지지 않도록 어깨와 손으로 바닥을 강하게 밀어낸다.3) 회전력을 살려 엉덩이나 등이 먼저 닿지 않고 발바닥으로 착지하도록 연습한다.</p>
