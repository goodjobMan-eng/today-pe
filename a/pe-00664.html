<h1>훌라후프 공 나르기 릴레이</h1>
<p>1) 출발선에서 신호가 울리면 주자가 작은 공을 들고 출발합니다. 2) 일정한 간격으로 놓인 훌라후프를 밟으며 이동해 목표 지점의 훌라후프 안에 공을 내려놓습니다. 3) 공을 안전하게 둔 뒤 빠르게 출발선으로 복귀해 다음 주자와 터치합니다. 4) 모둠원 전체가 이어달리기를 하여 모든 공을 먼저 옮긴 팀이 승리합니다.</p>
