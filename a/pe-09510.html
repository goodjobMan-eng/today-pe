<h1>실내화 폭탄 게임</h1>
<p>1) 책상을 밀어 넓은 공간을 만들고 아이들의 실내화를 펼쳐 놓는다. 2) 안대를 쓴 참가자가 팀원들의 목소리 길잡이에 따라 실내화를 피해 깃발을 뽑거나 인형을 찾는다. 3) 실내화를 건드리거나 밟으면 감점되며, 미션을 성공하면 점수를 얻는다.</p>
