<h1>의자 숫자 다리찢기 놀이</h1>
<p>1) 두 팀으로 나뉘어 칠판 쪽에 서고 사물함 쪽에는 팀 인원수만큼 의자를 배치한다. 2) 술래와 가위바위보를 하여 이긴 사람은 다리를 찢어 한 발 전진하고, 지거나 비기면 3초간 허리를 숙여 바닥을 짚는다. 3) 다리가 의자에 닿으면 의자에 앉을 수 있으며, 앉은 자리의 번호를 확인한다. 4) 비밀 배치도에 표시된 숫자 순서(1번부터)대로 맞게 앉아야 하며, 폭탄 자리에 앉으면 출발선으로 다시 돌아간다.</p>
