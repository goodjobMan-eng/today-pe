<h1>원마커 픽 잇 업 (도전 콩주머니 던지기)</h1>
<p>1) 일렬로 놓인 10개의 원마커 맨 뒤(가장 먼 거리)에 서서 차례를 기다린다. 2) 원하는 거리의 원마커를 골라 그 위에 서서 표적을 향해 콩주머니를 언더핸드로 던진다. 3) 표적에 넣으면 서 있던 원마커와 콩주머니를 주워 팀 모둠으로 돌아와 쌓고 다음 사람에게 넘긴다. 4) 실패하면 원마커는 두고 콩주머니만 주워 다음 사람에게 넘기며, 제한 시간 내에 10개의 원마커를 모두 모으면 성공한다.</p>
