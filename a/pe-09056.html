<h1>풍선 미니 배구와 기본 기술 연습</h1>
<p>1) 풍선을 상대 진영으로 넘기는 교류를 합니다. 2) 한 손으로 공을 잡고 같은 쪽 다리를 앞으로 하여 손바닥으로 치는 언더핸드 서브를 연습합니다. 3) 손가락을 둥글게 말고 무릎을 굽히며 코칭하는 토스(핑거 패스)와 팔을 뻗어 손목 위로 치는 언더핸드 패스를 연습합니다.</p>
