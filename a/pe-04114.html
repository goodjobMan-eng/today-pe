<h1>히피티 홉 릴레이</h1>
<p>1) 콘 앞에 준비 자세로 정렬한 뒤 신호가 울리면 손잡이가 달린 히피티 홉에 앉는다. 2) 히피티 홉 손잡이를 잡고 반환점 콘까지 통통 튀어가며 돌아온다. 3) 출발선 콘에 가까워지면 튀는 것을 멈추고 다음 주자에게 히피티 홉을 넘겨준다. 4) 팀원 전원이 한 번씩 완주하면 자리에 앉아 박수를 치며 먼저 끝난 팀이 승리한다.</p>
