<h1>쌀 주머니 릴레이</h1>
<p>1) 출발 콘 뒤에 각 모둠별로 줄을 선다. 2) 각 모둠에 쌀 주머니를 하나씩 지급한다. 3) 주머니를 손, 어깨, 머리 등에 얹거나 던지고 받으며 반환점 콘까지 갔다가 돌아온다. 4) 다음 주자에게 주머니를 전달하고, 모둠원 전체가 완료한 뒤 모두 먼저 자리에 앉는 팀이 이긴다.</p>
