<h1>점수를 얻어라 게임</h1>
<p>1) 골대가 있는 경기장에 출발선과 득점 구역(1점 구역, 2점 구역)을 나누어 그린다. 2) 3명에서 5명씩 두 모둠으로 나누어 공격과 수비를 정하고, 수비 모둠의 1명은 골키퍼가 된다. 3) 공격 모둠은 공 몰기나 공 이어주기를 하며 골대에 골을 넣고, 수비 모둠에게 공을 빼앗기면 출발선에서 다시 시작한다. 4) 1점 구역에서 골을 넣으면 1점, 2점 구역에서 넣으면 2점을 얻으며 정해진 시간 동안 더 많은 점수를 얻은 모둠이 이긴다.</p>
