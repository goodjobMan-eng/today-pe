<h1>짐볼 스트레칭 및 운동</h1>
<p>1) 짐볼에 앉아 상체를 앞뒤로 젖히는 동작을 한다. 2) 짐볼에 앉아 양손과 양발을 동시에 들고 균형을 잡는다. 3) 짐볼에 배를 대고 엎드려 상체와 하체를 들어 올리는 동작을 한다. 4) 짐볼에 앉아 번갈아가며 한쪽 다리를 들고 박수를 치는 동작을 한다. 5) 짐볼을 들고 바닥에 튕기거나 제자리에서 점프를 한다.</p>
