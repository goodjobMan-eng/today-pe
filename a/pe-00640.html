<h1>초등학교 체육 야테미요 체조 및 댄스</h1>
<p>1) 음악에 맞춰 제자리에서 가볍게 점프하며 양손을 흔들어 몸을 풉니다. 2) 앞으로 걸어가며 브이 포즈를 취하고 뒤로 돌아온 뒤 기마 자세를 취합니다. 3) 온몸으로 가위바위보 동작(웅크리기, 앞뒤 발 벌리기, 옆으로 발 벌리기)을 반복하고, 좌우 사이드 스텝과 빠른 발 스텝을 한 뒤 다시 온몸 가위바위보를 이어 갑니다. 4) 신체 부위를 자유롭게 흔들고 발차기 동작을 하며 마무리합니다.</p>
