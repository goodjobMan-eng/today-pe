<h1>손과 눈의 협응력 기르기 과제</h1>
<p>1) 작은 공을 등 뒤로 던져 반대 손으로 받거나, 다리 사이로 농구공을 튕겨 손을 바꿔 잡는다.2) 하키 스틱이나 테니스 라켓으로 공을 튀기고, 배구공을 높이 던진 후 콘을 터치하고 언더핸드로 받아 올린다.3) 빈백을 던져 반대쪽 무릎을 치고 잡거나 라켓을 손 바꿔 잡기, 두 개의 공을 교차해 튀기기 등 다양한 도구 미션을 수행한다.</p>
