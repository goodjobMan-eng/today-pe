<h1>트라이앵글 드리블 &amp; 볼 컨트롤 훈련 게임</h1>
<p>1) 라바콘 3개를 삼각형으로 배치해 구역을 만들고 각 꼭짓점을 순환 코스로 정합니다. 2) STEP 1에서는 맨손으로 콘 위의 원마커를 들고 달리는 스피드 순환 러닝을 합니다. 3) STEP 2에서는 축구공을 발로 드리블하며 중앙과 바깥쪽 콘 주위를 방향 전환하며 돌아옵니다. 4) 마주 오는 다른 조의 선수나 콘과 부딪히지 않고 정해진 횟수만큼 공을 운반해 복귀합니다.</p>
