<h1>펀스틱 1인 릴레이</h1>
<p>1) 각 팀의 첫 번째 주자는 2개의 펀스틱(스티로폼 막대)을 잡고 공을 바닥에 놓는다. 2) 시작 신호가 울리면 펀스틱 2개로 공을 몰며 반환점(라바콘)을 돌아 출발선으로 돌아온다. 3) 출발선에 도착하여 다음 주자에게 펀스틱을 건넨다. 4) 마지막 주자가 먼저 반환점을 돌아 출발선에 도착하는 팀이 승리한다.</p>
