<h1>교실 의자 피트니스 (바이셉 컬 &amp; 호버)</h1>
<p>1) 의자에 앉아 양팔을 굽혔다 펴는 바이셉 컬(Bicep Curls) 동작을 20초 동안 실시한다. 2) 10초 동안 휴식을 취한다. 3) 의자 위에서 엉덩이를 띄워 버티는 호버(Hovers above seats) 동작을 20초 동안 실시한다. 4) 10초 휴식 후 바이셉 컬과 호버 동작 세트를 다시 한 번 반복한다.</p>
