<h1>미션 수행 이어달리기</h1>
<p>1) 출발 신호가 울리면 전력으로 달려가 미션 바구니 앞에 도착한다.2) 바구니 속 미션 쪽지를 확인하고 적힌 내용을 큰 소리로 외친 뒤 미션을 수행한다.3) 미션 쪽지를 바구니 안에 정확히 넣고 반환점을 돈다.4) 팀 대기열로 전력 질주해 다음 주자의 손을 터치하여 이어달린다.</p>
