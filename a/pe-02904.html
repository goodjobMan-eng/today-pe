<h1>내가 우리 반 모델</h1>
<p>1) 머리 위에 접시콘을 올리고 출발 콘 앞에 서서 출발 준비를 한다. 2) 출발 신호가 나오면 반환점을 향해 달린다. 3) 머리 위 접시콘이 떨어지면 제자리에서 스타점프 5번을 하고 다시 출발한다. 4) 반환점을 돌아 출발선으로 돌아와 먼저 들어온 사람이 승리한다.</p>
