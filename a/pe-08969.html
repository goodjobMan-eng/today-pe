<h1>풋볼 던지기와 받기 기본 기술</h1>
<p>1) 측면을 보고 목표를 향해 서서 팔꿈치를 어깨 높이로 뒤에 둡니다. 2) 발을 내딛고 발가락을 목표 방향으로 향하게 한 뒤 공을 던집니다. 3) 정면으로 오는 공은 다이아몬드 모양의 손으로 받고, 허리 아래로 오는 공은 새끼손가락을 붙여 받습니다.</p>
