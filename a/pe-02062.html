<h1>스피드컵 탁구 놀이</h1>
<p>1) 맞붙인 책상 중앙에 가림판을 세우고 양쪽에 서서 스피드컵 하나씩을 손에 쥔다. 2) 서브는 컵 속 탁구공을 튕겨 내 책상을 먼저 맞힌 뒤 상대 책상으로 넘긴다. 3) 공격은 내 책상에 닿지 않고 바로 상대 책상에 원바운드되도록 컵으로 튕겨 보낸다. 4) 상대가 보낸 공이 내 책상에 한 번 튄 것을 컵으로 받아내지 못하거나 두 번 튀기면 실점한다.</p>
