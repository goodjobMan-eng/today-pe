<h1>1학년 피트니스 챌린지</h1>
<p>1) 바닥에 앉아 발을 붙이고 뒤로 굴렀다가 가상의 줄을 잡고 복근 힘으로 일어나는 동작을 반복한다. 2) 바닥에 등을 대고 누워 머리를 들고 친구에게 손을 흔든 후 한 다리씩 번갈아 공중에 흔든다. 3) 한 발을 앞에 두고 가상의 올가미를 돌리며 반시계 방향으로 갤럽을 하고 방향을 바꾸어 이동한다. 4) 팔 돌리기와 슬라이딩을 한 후 푸시업 자세에서 한 손으로 팔 돌리기와 반대쪽 어깨 터치를 수행한다.</p>
