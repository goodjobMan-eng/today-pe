<h1>후프를 활용한 플랭크 술래</h1>
<p>1) 훌라후프에 두 발을 넣고 한 사람이 플랭크 자세를 취한다.2) 상대는 플랭크를 한 사람의 머리 쪽에 위치한다.3) 플랭크를 한 사람의 주위를 돌며 상대방의 발을 태그하면 끝난다.4) 손 대신 짧게 자른 펀스틱을 들고 발을 태그하는 방식으로도 진행한다.</p>
