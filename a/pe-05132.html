<h1>클리프행어 (거리 조절 양말공 던지기 게임)</h1>
<p>1) 테이프나 마커를 이용해 바닥에 4개의 선을 그어 3개 구역(1점, 2점, 3점 구역)을 만든다.2) 두 선수가 각자 3개의 양말공(또는 작은 공)을 차례로 구역을 향해 던진다.3) 공이 멈춘 구역의 점수를 얻되 가장 멀리 간 공은 2배 점수를 받고, 구역을 벗어나 넘어가거나 미치지 못하면 0점 처리된다.</p>
