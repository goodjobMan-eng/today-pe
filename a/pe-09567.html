<h1>원숭이 게임(테니스 변형 게임)</h1>
<p>1) 테니스 코트에서 복식 대형으로 플레이어당 1개의 라켓과 코트당 2개의 테니스 공을 준비합니다. 2) 베이스라인의 플레이어는 서비스 박스의 상대에게 높고 깊은 공을 쳐서 넘깁니다. 3) 서비스 박스 안의 플레이어는 박스를 벗어나지 않으며 베이스라인 플레이어의 공을 받아 스매시로 점수를 획득합니다.</p>
