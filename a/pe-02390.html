<h1>솜털공 저글링 단계별 기본 익히기</h1>
<p>1) 솜털공 1~2개를 손으로 던지고 받거나 발 등 다양한 신체 부위로 다루며 특성을 탐색한다 2) 2개의 공을 양손에 하나씩 쥐고 한쪽을 던지자마자 반대쪽 손의 공을 옆으로 넘기며 던지는 순서를 익힌다 3) 익숙해지면 3개의 공을 들고 번갈아 포물선을 그리며 공중으로 던져 올린다 4) 목표 횟수(2회, 3회 연속 등)를 정해 떨어뜨리지 않고 연속으로 받아내는 연습을 반복한다</p>
