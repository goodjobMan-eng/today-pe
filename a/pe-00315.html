<h1>양말공 표적도전 5차시 - 양말공으로 컵 볼링</h1>
<p>1) 의자나 책상 위에 종이컵을 피라미드 형태(4-3-2-1단, 총 10개)로 쌓아 표적을 설치하고, 표적으로부터 다섯 걸음 떨어진 위치에 남은 컵 등으로 투구선을 표시합니다. 2) 준비된 양말공 3개를 차례대로 던져 쓰러뜨린 컵의 개수(상위 단 컵당 1점)를 계산합니다. 3) 공을 모두 던진 뒤 회수하고 넘어진 컵을 다시 쌓습니다. 4) 정해진 제한 시간(3분) 동안 획득한 총점을 측정합니다.</p>
