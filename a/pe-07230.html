<h1>철봉 지지 뛰어넘어 내리기</h1>
<p>1) 낮은 철봉 앞에 서서 양손을 순손(손바닥이 아래를 향하는 그립)으로 철봉을 잡는다. 2) 양팔에 체중을 싣고 점프하여 철봉을 옆으로 뛰어넘는 감각을 익힌다. 3) 두 팔 사이 중앙에 몸을 지탱하고 몸을 옆으로 빼내며 뛰어넘는 연습을 한다. 4) 다리를 앞뒤로 흔들어 반동을 이용해 허리를 높게 띄우며 철봉을 뛰어넘어 착지한다.</p>
