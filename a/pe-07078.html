<h1>영양 뱀주사위 놀이</h1>
<p>1) 3인 1조로 모둠을 구성하고 각 모둠에 색깔별 운동 카드 5장, 말, 주사위를 배부한다. 2) 주사위를 굴려 가장 높은 숫자가 나온 사람부터 순서대로 말을 이동한다. 3) 도착한 칸의 색깔에 해당하는 운동 카드를 확인하고 해당 운동을 10회 실시하며 결승선에 먼저 도착하면 승리한다.</p>
