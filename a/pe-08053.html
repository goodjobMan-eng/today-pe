<h1>캡처 더 플래그 피구</h1>
<p>1) 양 팀으로 나뉘어 피구와 깃발 뺏기 규칙을 결합하여 진행한다. 2) 공에 맞거나 상대에게 태그당하면 아웃된다. 3) 상대 진영으로 침투하여 깃발을 획득할 수 있다. 4) 깃발을 획득하고 안전하게 자기 진영으로 돌아오면 게임이 종료된다. 5) 상대 팀 전원을 맞혀 쓰러뜨리거나 깃발을 먼저 획득한 팀이 승리한다.</p>
