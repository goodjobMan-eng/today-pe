<h1>저학년 맞춤형 모디파이드 셔틀런</h1>
<p>1) 체육관 사이드라인에 일정한 간격으로 넓게 벌려 서서 교사의 시범 랩(7회)을 관찰한다. 2) 신호음(오디오 음원)에 맞춰 맞은편 라인을 향해 천천히 똑바로 달리고 신호 전에 도착해 대기한다. 3) 속도 단계(레벨)가 올라갈 때마다 페이스를 유지하며 2번 실패 시 탈락하여 자리에 앉는다. 4) 탈락한 학생은 달리는 친구들을 무소음 응원하며 유치원은 25회, 1학년은 30회를 목표치로 부여한다.</p>
