<h1>손짚고 앞돌기 2단계 (핸드스프링 연습)</h1>
<p>1) 손짚고 버티는 힘과 신체 긴장감(코어 긴장)을 유지하는 사전 운동을 실시한다. 2) 키 높이에 맞게 쌓은 매트 위로 도움닫기 후 손을 짚고 물구나무서기를 거쳐 몸을 완전히 펴며 넘어간다. 3) 미니 트램펄린, 뜀틀, 소프트 매트를 연결해 도움닫기와 도약 후 체공하여 손짚고 앞돌기를 완성한다.</p>
