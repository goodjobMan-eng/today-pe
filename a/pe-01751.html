<h1>도전! 훌라후프 릴레이 미션</h1>
<p>1) 학생마다 훌라후프를 1개씩 배부받고 부딪히지 않게 충분한 간격을 두고 선다. 2) 화면 신호에 맞춰 허리 돌리기, 팔 돌리기, 목 돌리기 등 신체 부위별 기본 돌리기 미션을 수행한다. 3) 후프를 바닥에 내려놓고 후프 안팎 점핑잭, 한 발 점프, 후프 넘기 멀리뛰기 등 점프 훈련을 진행한다. 4) 후프 줄넘기, 동전 돌리기 후 점핑잭, 개 산책시키기(후프 굴려 걷기) 등 응용 챌린지로 변형해 도전한다.</p>
