<h1>단풍잎 하나하나 모으기</h1>
<p>1) 출발선에 접시콘 2개와 바구니를 두고, 5m 떨어진 곳에 은행잎과 단풍잎 그림카드 20장을 섞어 뒤집어 놓는다.2) 교사의 출발 신호와 함께 외친 나뭇잎 이름을 듣고 첫 번째 주자가 카드가 있는 곳으로 달린다.3) 그림카드를 1개만 뒤집어 확인한 뒤, 교사가 외친 그림과 맞으면 바구니로 가져오고 맞지 않으면 원래 자리에 두고 돌아온다.4) 돌아와 다음 주자와 손바닥 터치를 하며, 정해진 카드를 먼저 5장 모으는 모둠이 승리한다.</p>
