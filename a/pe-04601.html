<h1>뮤지컬 사커 &amp; 2대1 축구 게임</h1>
<p>1) 각자 공을 발 안쪽으로 드리블하며 공간을 이동하다가 음악이 멈추면 가장 가까운 콘 골대로 가 슛을 한다. 2) 콘으로 만든 C, A, T 세 지점에서 차례대로 큰 목표물 골대를 향해 킥을 연습한다. 3) 공격 2명, 수비 1명으로 모둠을 구성해 수비를 피해 패스한 뒤 슛으로 연결하는 2대1 게임을 진행한다.</p>
