<h1>미니언즈 양자택일 홈트레이닝</h1>
<p>1) 화면에 제시되는 두 가지 선택지 중 마음에 드는 항목을 하나 고릅니다. 2) 오른쪽 항목이 좋으면 오른쪽으로, 왼쪽 항목이 좋으면 왼쪽으로 이동합니다. 3) 화면이 전환되면 자신이 선택한 쪽에 해당하는 신체활동(달리기, 스트레칭, 댄스 등)을 수행합니다. 4) 중간에 주어지는 미니게임에 맞춰 날아오는 바나나를 주먹으로 치는 등 재미있게 참여합니다.</p>
