<h1>가위바위보 스태킹</h1>
<p>1) 각자 스피드스택스 컵 12개를 준비하고 리더(교사)와 마주 본다. 2) 리더와 전체가 동시에 &quot;가위바위보&quot;를 진행한다. 3) 가위바위보에서 이긴 사람은 컵 2개를 쌓고 비긴 사람은 1개를 쌓으며 진 사람은 쌓지 못한다. 4) 쌓는 도중 컵이 무너지면 처음부터 다시 쌓아야 한다. 5) 12개의 컵을 가장 먼저 모두 쌓은 사람이 승리한다.</p>
