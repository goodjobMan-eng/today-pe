<h1>요시 (매트 탈환 침투 게임)</h1>
<p>1) 경기장을 반으로 나누고 양쪽 끝에 매트를 배치한 뒤 팀 조끼로 두 팀으로 나눕니다. 2) 상대 진영을 뚫고 달려가 상대 매트 위에 도착하면 안전해지지만, 이동 중 태그당하면 그 자리에 멈춥니다. 3) 멈춘 팀원은 자기 진영 팀원이 손을 잡고 자기 진영으로 데려와야 구출되며, 교사가 '요시'를 외치면 전원이 상대 매트로 질주합니다.</p>
