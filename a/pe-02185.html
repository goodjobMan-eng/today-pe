<h1>건강 체력 측정과 운동 계획</h1>
<p>1) 교과서를 확인하고 심폐 지구력, 근력 및 근지구력, 유연성, 신체 구성 등 건강체력의 의미와 종류를 확인한다. 2) 학생 건강 체력 평가 제도인 PAPS(팝스)의 개념과 측정 목적을 이해한다. 3) 심폐 지구력, 유연성, 근력 및 근지구력, 신체 구성(BMI)의 세부 측정 방법과 주의점을 알아본다. 4) 측정 결과를 바탕으로 자신의 체력 수준에 알맞은 단계별 운동 계획(측정-계획-실천-확인)을 수립한다.</p>
