<h1>에그스푼 장애물 릴레이</h1>
<p>1) 에그스푼 위에 달걀 모형 공을 올리고 한 손으로 스푼을 잡는다. 2) 출발 신호에 맞춰 미니 허들을 하나씩 뛰어넘는다. 3) 반환점 콘을 돌아 출발선으로 돌아와 다음 주자에게 스푼과 공을 인계한다. 4) 공을 떨어뜨리거나 허들을 쓰러뜨리면 원래 자리로 돌아가 정리한 후 다시 출발한다.</p>
