<h1>표적 맞히기</h1>
<p>1) 골판지 상자나 페트병 등으로 표적을 준비합니다. 2) 공을 던질 위치를 정하고 바닥에 선을 긋습니다. 3) 발이 선 밖으로 나가지 않도록 주의하며 표적을 향해 힘껏 공을 던집니다. 4) 표적을 많이 맞히거나 쓰러뜨린 사람이 승리하며, 표적의 크기나 위치에 따라 점수를 정하거나 팀전으로 진행할 수 있습니다.</p>
