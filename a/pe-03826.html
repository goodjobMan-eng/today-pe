<h1>먹이사슬 가위바위보</h1>
<p>1) 모든 참가자가 팔꿈치를 날개처럼 퍼덕이는 '파리' 동작으로 시작하여 다른 파리를 찾아 이동한다. 2) 같은 단계의 상대를 만나면 가위바위보 대결을 한다. 3) 이기면 다음 단계인 개구리(점프), 뱀(손 웨이브), 매(날개짓) 순으로 진화하고, 지면 이전 단계로 퇴화한다. 4) 매 단계에서 가위바위보를 이기면 1점을 획득하고 다시 파리로 돌아가 대결을 이어간다.</p>
