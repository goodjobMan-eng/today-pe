<h1>가위바위보 유연성 자리 차지 게임</h1>
<p>1) 참여자는 두 팀으로 나뉘어 팀조끼를 입고 콘으로 표시된 출발선에 선다.2) 교사와 가위바위보를 하여 이기면 다리를 찢어 두 걸음, 비기면 한 걸음 앞으로 이동하고, 지면 제자리에서 손끝이 바닥에 닿도록 허리를 숙인다.3) 이동하여 원마커를 차지하고, 먼저 차지한 상대와 가위바위보로 대결하며 15회 후 원마커를 많이 차지한 모둠이 이긴다.</p>
