<h1>배구 스파이크 6단계 연습 드릴</h1>
<p>1) 벽을 향해 공을 때려 손목 스냅을 연습합니다. 2) 테니스공을 네트 너머로 던져 점프와 스냅 동작을 익힙니다. 3) 네트와 콘 사이 공간에 배구공이 떨어지도록 스냅하여 칩니다. 4) 대각선 코너를 향해 크로스 히팅을 연습합니다. 5) 점핑 박스 위에 올라서서 셀프 토스 후 스파이크를 때립니다. 6) 토스된 공의 최고점 타이밍에 맞춰 어프로치 점프 후 스파이크를 완성합니다.</p>
