<h1>피자 태그 (Pizza Tag)</h1>
<p>1) 모든 참가자는 손바닥 위에 원마커나 원반(피자)을 올려놓고 균형을 잡습니다. 2) 게임이 시작되면 자신의 피자를 떨어뜨리지 않으면서 다른 사람의 피자를 쳐서 땅에 떨어뜨립니다. 3) 피자가 땅에 떨어지면 피자 근처에서 지정된 운동을 수행한 후 다시 피자를 주워 게임에 재참여합니다.</p>
