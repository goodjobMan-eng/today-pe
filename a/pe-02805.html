<h1>풍선 골프 놀이</h1>
<p>1) 콘과 원마커를 이용해 1번 홀부터 5번 홀까지 코스를 만들고 중간에 종이컵 장애물을 설치한다. 2) 펀스틱을 채로 사용하여 시작 위치의 풍선을 쳐서 각 홀(원마커)을 차례로 공략한다. 3) 풍선이 원마커에 닿기만 해도 해당 홀에 성공한 것으로 인정한다. 4) 컵 장애물을 건드려 쓰러뜨리면 쓰러진 컵 개수만큼 타수를 추가하고 다시 세운 뒤 진행한다.</p>
