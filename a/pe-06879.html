<h1>양손 타격 (스트라이크) 기초</h1>
<p>1) 시선은 항상 공을 주시하고, 주로 쓰는 손이 위로 가도록 배트나 라켓을 쥡니다. 2) 타격 목표 지점을 향해 옆으로 서고, 타격 전에 배트를 어깨 뒤로 올립니다. 3) 타격할 때 주로 쓰는 손의 반대쪽 발을 목표 방향으로 내디딥니다. 4) 엉덩이와 어깨를 회전하며 앞발 위치에서 팔을 펴고 공을 친 후, 끝까지 팔을 휘두릅니다(팔로스루).</p>
