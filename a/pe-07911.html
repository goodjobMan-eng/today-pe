<h1>시계 돌리기 게임</h1>
<p>1) 줄을 돌리는 사람 주위로 동그랗게 둘러섭니다. 2) 줄이 돌아가는 타이밍을 잘 맞추어 두 박자에 한 번씩 줄을 넘습니다. 3) 줄넘기 줄은 바닥으로 3번 위로 3번씩 반복하며 돌립니다. 4) 바닥으로 줄을 돌릴 때는 점프를 하여 피하고 줄을 위로 돌릴 때는 자리에 앉아서 줄을 피합니다. 5) 줄에 걸리는 사람은 탈락 또는 벌칙을 받습니다. 6) 학생들이 성공하면 횟수를 줄여가며 난이도를 높여 게임을 진행합니다.</p>
