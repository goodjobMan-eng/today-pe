<h1>핸들러 골프</h1>
<p>1) 팀에서 순서를 정하고 3인 1팀으로 출발선에 준비합니다. 2) 첫 번째 순서 학생이 목표 지점(점보스택스)을 향해 셔틀콕을 핸들러 라켓으로 칩니다. 3) 셔틀콕이 떨어진 곳에서 이동하지 않고 다음 순서 학생이 이어서 목표 지점을 향해 칩니다. 4) 마지막 3단계 목표 지점에 셔틀콕을 먼저 넣은 후 점보스택스와 셔틀콕을 들고 출발선에 먼저 도착한 팀이 승리합니다.</p>
