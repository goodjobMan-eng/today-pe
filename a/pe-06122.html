<h1>조작움직임 기초 | 공과 도구를 다루는 활동과 친해지기</h1>
<p>1) 활동 장소를 던지기·받기, 튀기기, 굴리기, 몰기, 손으로 치기, 도구로 치기, 차기의 구역으로 나눈다.2) 각 구역별로 짝을 짓거나 개인별로 배정된 공과 도구를 활용해 안내된 조작 움직임을 수행한다.3) 도구로 치기 구역에서는 배팅티 위의 공을 배트로 치고, 차기 구역에서는 발의 다양한 부위로 공을 찬다.</p>
