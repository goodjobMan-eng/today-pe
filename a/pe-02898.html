<h1>왼쪽 오른쪽 돌아 잡아 콘 빼앗기</h1>
<p>1) 두 명씩 짝을 지어 마주 보고 그 사이에 라바콘을 놓는다. 2) '왼쪽' 구호가 나오면 왼쪽으로, '오른쪽' 구호가 나오면 오른쪽으로 한 칸 이동한다. 3) '돌아' 구호가 나오면 제자리에서 한 바퀴를 돈다. 4) '잡아' 구호가 나오는 순간 재빨리 중앙의 라바콘을 먼저 잡는다.</p>
