<h1>달리고! 차고! 막고!</h1>
<p>1) 간이 골대 양옆 출발선에 각 팀 1명씩 대기하고 맞은편 바닥에 공 하나를 둔다. 2) 신호와 함께 달려가 공을 발로 먼저 터치한 사람이 공격권을 얻는다. 3) 공을 잡지 못한 수비수는 골대로 뛰어가 골키퍼가 되어 골대를 지킨다. 4) 공격수가 드리블 후 슛하여 골을 넣으면 득점하고 수비수가 공을 막거나 빼앗아 밖으로 내보내면 수비에 성공한다.</p>
