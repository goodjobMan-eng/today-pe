<h1>초보자를 위한 단계별 기본 줄넘기 연습법</h1>
<p>1) 차렷 자세에서 양발을 모아 제자리 점프 연습을 합니다. 2) 줄넘기를 잡고 뒤에서 앞으로 팔을 돌려 발 앞에 놓는 연습을 합니다. 3) 줄이 발 앞에 왔을 때 양발로 점프하여 한 개씩 넘습니다. 4) 연속으로 2개 넘기를 연습합니다. 5) 점프를 유지하며 줄을 계속 돌려 연속 넘기를 실시합니다.</p>
