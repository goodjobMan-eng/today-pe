<h1>훌라후프 공 굴리기 릴레이</h1>
<p>1) 모둠별로 바닥에 훌라후프 2개를 일렬로 놓는다. 2) 주자가 바닥으로 공을 굴려 앞이나 뒤의 훌라후프 안에서 공을 멈추게 시도한다. 3) 훌라후프 안에 공이 멈추면 뒤에 있는 훌라후프를 집어 앞쪽으로 연결하여 전진시킨다. 4) 성공 여부와 상관없이 공을 주워 다음 주자에게 넘겨주며 반대편 목표 선까지 먼저 후프 2개를 통과시킨 팀이 이긴다.</p>
