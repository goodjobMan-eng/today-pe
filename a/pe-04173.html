<h1>복도 걷지 않기 신체 활동 챌린지</h1>
<p>1) 복도 바닥에 설치된 다양한 색상의 도형 스티커를 따라 이동 준비를 한다. 2) 복도에서는 뛰거나 기어가거나 눕지 않고 두 발로 안전하게 선 상태를 유지한다. 3) 복도 오른쪽으로 통행하며 화살표 방향을 준수하고 자신이 제어할 수 있는 속도로 움직인다. 4) 주변 교실의 학습을 방해하지 않도록 조용히 정숙을 유지하며 신체를 조절해 이동한다.</p>
