<h1>강강술래 청어엮기와 청어풀기</h1>
<p>1) 손을 잡고 원을 만들어 선두를 따라 청어 엮기 노래를 부르며 이동한다. 2) 선두가 대열의 팔 아래 틈으로 빠져나가며 한 사람씩 팔을 어깨 뒤로 넘겨 엮이게 만든다. 3) 모든 사람이 엮인 상태가 되면 대열을 유지하며 다음 동작을 준비한다. 4) 청어 풀기 노래에 맞춰 선두부터 차례대로 엮인 팔을 풀며 제자리로 돌아온다.</p>
