<h1>다리 사이 통과 긴줄넘기</h1>
<p>1) 두 명의 돌림수가 긴줄을 돌리되, 빠져나가는 쪽 돌림수는 양발을 넓게 벌리고 대기한다. 2) 진입자는 줄 안으로 들어가 타이밍에 맞춰 줄을 한 번 넘거나 통과한다. 3) 착지와 동시에 돌림수의 벌린 다리 사이(터널)로 몸을 숙여 안전하게 빠져나간다. 4) 동작에 익숙해지면 다리 사이를 통과한 직후 멋진 착지 포즈를 취하거나 8자로 순환 연속 도전에 참여한다.</p>
