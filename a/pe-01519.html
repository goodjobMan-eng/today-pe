<h1>원마커 3박자 리듬 점프</h1>
<p>1) 바닥에 원마커를 일렬로 배치하고 모둠원들이 앞사람 뒤로 줄을 서서 준비한다. 2) 구호 리듬에 맞추어 앞뒤 및 좌우로 원마커 안팎을 3박자로 점프하며 차례대로 전진한다. 3) 정해진 코스를 발을 헛디디지 않고 리듬을 유지하며 끝까지 완주하면 성공한다. 4) 익숙해지면 반대편에서 마주 보며 출발하거나 알파벳 몸동작 및 방향 바꾸기 미션을 추가한다.</p>
