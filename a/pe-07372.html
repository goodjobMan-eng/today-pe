<h1>(축구) 몇 번 만에</h1>
<p>1) 맞출 목표 지점(목표 콘)을 정하고 차는 순서를 정한다. 2) 차례대로 공을 발로 차서 멈출 때까지 기다린 후 그곳으로 이동해 다음 차례를 기다린다. 3) 정확하게 하기 위해 게임 전 접시 콘을 가지고 이동해 콘 위에 공을 올린다. 4) 순서대로 공을 차서 목표 콘을 맞출 때까지 반복하며, 목표 콘을 맞출 때까지 더 적은 횟수가 걸린 사람이 승리한다.</p>
