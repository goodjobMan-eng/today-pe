<h1>매트 운동 앞구르기 브릿지 도전하기</h1>
<p>1) 매트 앞에서 두 발로 발구르기를 하며 양손을 매트에 짚고 머리를 숙여 큰 앞구르기를 시작합니다. 2) 목 뒤쪽이 매트에 닿는 회전 타이밍에 발을 강하게 아래로 내려칩니다. 3) 시선이 천장을 향하는 순간 등을 매트에 대지 않고 허리를 단번에 젖혀 올립니다. 4) 양 발바닥을 바닥에 지탱하고 손으로 매트를 강하게 밀어 올려 아치형 브릿지 자세를 완성합니다.</p>
