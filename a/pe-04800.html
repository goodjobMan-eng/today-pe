<h1>긴 줄 가는 줄 오는 줄 통과하기와 긴 줄 바이킹</h1>
<p>1) 긴 줄넘기를 돌릴 때 줄이 땅에 닿아 위로 올라가는 타이밍에 맞춰 줄을 따라 들어가 통과한다.2) 줄의 회전 반경이 큰 중앙보다 줄을 돌리는 사람 쪽(사이드)에서 진입하여 안전하게 넘는다.3) 긴 줄 바이킹은 첫 번째 주자가 줄을 통과하자마자 줄을 반대로 돌려 반대편에서 돌아오게 한다.4) 1명이 성공하면 2명, 3명, 4명씩 인원을 점차 늘려가며 바이킹 방식으로 연속 왕복 통과한다.</p>
