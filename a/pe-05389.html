<h1>포스퀘어</h1>
<p>1) 킹(King), 퀸(Queen), 잭(Jack), 10(또는 1~4번) 사각형 코트에 한 명씩 위치하고 대기자는 밖에서 줄을 선다.2) 킹이 서비스 라인 뒤에서 공을 한 번 튀긴 후 언더핸드로 상대 구역으로 쳐서 서브한다.3) 자신의 구역에 공이 1회 바운드되면 언더핸드로 쳐 넘기며 실점 시 퇴장하고 다음 사람이 들어와 순환한다.</p>
