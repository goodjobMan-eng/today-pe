<h1>위치 닥터 댄스 피트니스 준비운동</h1>
<p>1) 제자리에 서서 음악의 도입부와 가사에 맞춰 기본 준비 자세를 취합니다. 2) 후렴구 리듬에 맞춰 점핑 잭, 양팔 교차하기, 스쿼트 탭 등 코디네이션 동작을 반복합니다. 3) 음악 중간에 나오는 킥 동작과 제자리 달리기, 브레이크댄스 스텝을 리듬에 맞춰 따라 합니다. 4) 전신을 골고루 움직여 본 활동 전 체온을 올리고 몸을 충분히 풉니다.</p>
