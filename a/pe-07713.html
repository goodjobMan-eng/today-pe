<h1>사공 놀이 (보트 끌기 릴레이)</h1>
<p>1) 2명의 주장(사공)이 끈을 잡고 매트(보트)를 끈다. 2) 다른 모둠원들은 출발지(벤치/부두)에 서서 대기한다. 3) 사공들이 매트에 태운 학생을 끈으로 끌어 반환점(노란 선)까지 이동한다. 4) 도착 후 매트를 들고 출발지로 달려 돌아와 다음 탑승자를 차례대로 태워 나른다.</p>
