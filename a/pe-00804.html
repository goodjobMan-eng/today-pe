<h1>새 학기 레이스 달리기 운동</h1>
<p>1) 화면에 등장하는 두 팀의 캐릭터 레이서 중 자신이 응원할 캐릭터를 하나 선택합니다. 2) 레이서에 맞춰 지정된 준비 동작을 수행하며 출발 신호를 기다립니다. 3) 레이스가 시작되면 화면의 경주를 보며 힘차게 제자리 달리기를 하거나 팀을 응원합니다. 4) 라운드 사이마다 틀린 그림 찾기 등 미니게임을 해결하고 다음 라운드 레이스를 이어갑니다.</p>
