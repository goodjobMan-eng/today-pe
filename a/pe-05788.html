<h1>라켓 공 튀기기 릴레이</h1>
<p>1) 모둠별로 순서를 정해 1번 주자부터 라켓으로 공을 튀긴다.2) 공을 떨어뜨린 어린이는 들어가서 다음 번호 주자에게 공과 라켓을 넘겨준다.3) 모든 모둠원이 튀긴 공의 개수를 세어 합산한다.4) 모둠원 전체의 합산 개수가 가장 많은 팀이 승리한다.</p>
