<h1>오션 오버로드 타바타 트레이닝</h1>
<p>1) 전반부에는 외발 균형잡기, 상체 숙이기 등 플라밍고 스트레칭으로 몸을 풉니다. 2) 본 운동이 시작되면 타이머에 맞춰 니 턱(Knee Tucks), 마운틴 잭, 마운틴 클라이머 등의 체력 운동을 순서대로 수행합니다. 3) 서핑 동작(패들, 팝업)과 해양 장애물 회피(점프, 숙이기, 방향 전환) 인터벌을 화면 지시에 따라 이어갑니다. 4) 일정 시간 운동 후 플러터 킥과 코브라 자세 스트레칭으로 전신을 고루 단련합니다.</p>
