<h1>박자 맞춰 시차 따라하기 율동 놀이</h1>
<p>1) 전원이 화면을 정면으로 마주하고 바른 자세로 서거나 앉아 신체 부위를 자유롭게 움직일 준비를 합니다. 2) 리더가 먼저 박자에 맞춰 1번 동작을 4박자 동안 수행한 뒤 다음 박자에 새로운 2번 동작을 시작합니다. 3) 참여자들은 리더의 앞선 동작을 한 박자 늦게 기억하여 정확한 타이밍에 그대로 따라 합니다. 4) 익숙해지면 동작 주기를 3박자나 2박자로 빠르게 줄이거나 학생이 직접 리더를 맡아 변형합니다.</p>
