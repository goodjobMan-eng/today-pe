<h1>지속 능력 향상을 위한 에어로빅 기본 및 응용 스텝</h1>
<p>1) 제자리에서 발을 구르는 마치(March) 동작을 실시한다. 2) 옆으로 이동하며 발을 모으는 스텝 터치와 한 발로 좌우 이동하는 켄켄 스텝을 익힌다. 3) V자 모양으로 앞으로 나아가는 V자 스텝과 앞뒤로 4보씩 걷는 워킹 스텝을 연결한다. 4) 스텝 터치 중 머리 위 손뼉 치기, 다리를 교차하는 그레이프바인, V자 스텝에 양팔 들기, 워킹에 킥 스텝을 더하거나 물병을 들고 응용한다.</p>
