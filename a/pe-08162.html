<h1>초등 배구 이동 및 볼 핸들링</h1>
<p>1) 코트 네 모서리에 훌라후프를 배치하고 네트 너머로 날아오는 공을 향해 출발한다. 2) 주자가 훌라후프 중 하나를 빠르게 터치한 뒤 코트 중앙의 준비 자세로 복귀한다. 3) 날아온 공을 혼자 언더핸드(포암) 패스한 뒤 잡아서 네트 너머로 쳐서 넘긴다. 4) 양 팀이 공을 떨어뜨리지 않고 최대한 많은 횟수의 랠리를 이어간다.</p>
