<h1>테이블 에어하키</h1>
<p>1) 접이식 탁자 옆면에 수영 풀누들을 벨크로와 테이프로 붙이고 양 끝에 골 라인, 가운데에 센터 라인을 표시한다 2) 손잡이를 분리한 뚫어뻥(플런저)을 패들로 사용하고 콩주머니(빈백)를 퍽으로 둔다 3) 패들로 콩주머니를 밀어 상대방의 골 라인을 넘기면 1점을 득점한다 4) 콩주머니가 중간에 멈춰 손이 닿지 않으면 탁자 옆으로 걸어가 손으로 가져와서 친다</p>
