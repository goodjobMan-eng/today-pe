<h1>가위바위보 베이스돌기</h1>
<p>1) 홈, 1루, 2루, 3루 지점을 정해 다이아몬드 형태로 구성한다.2) 양 팀에서 출발하여 베이스 라인을 따라 이동하다 마주치면 가위바위보를 한다.3) 가위바위보에서 이긴 사람은 다음 베이스 방향으로 계속 달린다.4) 베이스를 돌아 홈으로 돌아오거나 정해진 바퀴 수(2바퀴)를 먼저 도는 사람이 승리한다.</p>
