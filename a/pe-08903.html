<p>1) 일렬로 줄을 서고, 순서대로 조끼를 착용한다. 2) 각 팀에서 한 명씩 나와 먼저 공격할 팀을 선정한다. 3) 공격팀은 공을 힘껏 차고 난 뒤 대기선에 있는 같은 팀 친구들을 3바퀴를 돈다. 4) 수비팀은 공격수가 공을 차고 빙글빙글 돌고 있는 동안 공을 얼른 잡고 일렬로 선다.</p>
