<h1>신나는 수건 썰매 마법의 양단 타기</h1>
<p>1) 짝을 지어 한 명은 수건 위에 무릎을 꿇거나 편안하게 앉고 양손으로 수건 앞쪽을 단단히 잡을 준비를 한다. 2) 서 있는 짝은 수건의 반대쪽 끝을 잡고 안전 거리를 확보하며 천천히 끌어당겨 이동한다. 3) 정해진 반환점을 돌아 출발선으로 안전하게 먼저 도착하면 성공하며 역할을 서로 바꾸어 진행한다. 4) 직선 이동이 익숙해지면 곡선 코스를 돌거나 바닥 매트를 이용한 매트 썰매로 도구를 변형할 수 있다.</p>
