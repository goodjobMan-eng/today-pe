<h1>뱅뱅 볼 (던져서 상자 밀어내기)</h1>
<p>1) 중앙 구획선 부근에 대형 종이상자 여러 개를 쌓아 표적으로 세워 둡니다. 2) 양 팀은 각자의 던지기 구역 안에서 폼볼을 양손 또는 한 손으로 던져 상자를 맞힙니다. 3) 상자를 맞혀 상대 쪽으로 밀어내며, 바닥에 굴러다니는 공을 빠르게 주워 연속해서 던질 수 있습니다. 4) 제한 시간이 끝났을 때 상자가 상대편 구역으로 더 많이 넘어가 있는 팀이 득점하여 승리합니다.</p>
