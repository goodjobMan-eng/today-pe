<h1>타깃 릴레이 (콘에 천 던져 씌우기)</h1>
<p>1) 각 팀의 첫 번째 주자가 첫 번째 콘에서 두 번째 콘 위로 천을 던진다.2) 천이 콘 위에 얹어지면 다음 주자는 그 콘에서 다음 콘으로 던지고, 실패하면 성공할 때까지 같은 콘에서 계속 던진다.3) 주자는 던진 후 줄 맨 뒤로 돌아가고 다음 주자가 천을 주워 던진다.4) 마지막 콘까지 이동했다가 같은 방식으로 돌아와 첫 번째 콘에 먼저 도달하는 팀이 승리한다.</p>
