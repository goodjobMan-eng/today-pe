<h1>비트 더 카드 (카드 격파 배구 패스)</h1>
<p>1) 3~7명씩 모둠을 만들고 모둠마다 배구공 1개와 중앙에 놓인 카드 덱을 준비합니다. 2) 각 모둠에서 한 명이 중앙으로 달려가 카드를 1장 가져옵니다. 3) 카드의 숫자(J=11, Q=12, K=13)만큼 연속 패스를 성공하면 카드를 획득하고 실패하면 덱 아래에 넣고 새 카드를 가져옵니다.</p>
