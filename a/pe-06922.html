<h1>주사위 기계체조 체력 트레이닝 (다이스 잇 업)</h1>
<p>1) 주사위 옆에 숫자 1번부터 6번까지 해당하는 6장의 기계체조 과제 카드를 바닥에 나열한다. 2) 주사위를 굴려 윗면에 나온 숫자를 확인한다. 3) 나온 주사위 눈 번호에 해당하는 카드의 기계체조 과제(예: 브릿지, 버피, 점프 등)를 확인하고 지정된 횟수만큼 동작을 수행한다. 4) 동작을 완료하면 주사위를 다시 굴려 다음 기계체조 동작 과제를 이어서 진행한다.</p>
