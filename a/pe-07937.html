<h1>VR 스포츠실 왕복달리기 및 스피드 정렬</h1>
<p>1) 왕복달리기는 1~6명이 동시에 출발해 벽면 화면을 터치하며 최대 5회 왕복한다. 2) 모둠별 릴레이 시 주자가 화면을 터치하고 돌아와 다음 주자와 교대한다. 3) 스피드 정렬 회전 방식은 주자가 달려가 터치하여 타일을 회전시켜 그림을 맞춘다. 4) 퍼즐 위치변경 방식은 한 번에 두 개를 터치해 위치를 바꾸며 모둠원이 번갈아 달린다.</p>
