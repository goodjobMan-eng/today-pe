<h1>모두 넘어뜨리기 전에!</h1>
<p>1) 라바콘 여러 개를 둥글게 세워 원형 경기장을 만들고 수비수들이 원 바깥에 섭니다. 2) 술래 1명이 원 안으로 들어가 세워진 라바콘들을 손이나 발로 쓰러뜨립니다. 3) 원 밖의 수비수들은 피구공을 던져 술래가 콘을 다 넘어뜨리기 전에 공으로 맞힙니다. 4) 술래를 맞히면 술래가 미션을 수행하고, 술래가 공을 피해 모든 콘을 넘어뜨리면 수비수 전체가 미션을 수행합니다.</p>
