<h1>움직이는 알파벳 글자 찾기</h1>
<p>1) 알파벳 글자 종이를 바닥(운동장) 곳곳에 흩어 놓거나 분필로 그려 놓는다. 2) 학생들은 출발 신호에 맞춰 운동장 한쪽에서 일제히 달려 나간다. 3) 바닥에 놓인 글자 중 자신의 이름 철자를 순서대로 찾아가며 글자를 확인한다.</p>
