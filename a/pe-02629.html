<h1>가정형 신체활동 4종 운동</h1>
<p>1) 공을 몸에서 떨어지지 않게 다리 라인을 따라 이동시킨다. 2) 바닥에 무릎을 대고 가슴을 바닥 쪽으로 내밀며 팔굽혀펴기를 한다. 3) 런지 자세로 앉아 상체를 앞쪽 다리 방향으로 비트는 트위스트를 한다. 4) 바로 누워 복부에 힘을 주고 엉덩이를 들어 올리는 브릿지 자세를 한다.</p>
