<h1>벤치 활용 번호 반응 및 서킷 트레이닝</h1>
<p>1) 벤치들에 번호를 매기고 교사가 두 자리 숫자를 부르면 해당 번호의 벤치로 신속히 이동한다. 2) 긴 벤치를 활용하여 달리기 코디네이션, 방향 전환, 균형 잡기 및 슬라이딩 활동을 수행한다. 3) 벤치 6개에 분산 배치되어 정해진 시간 동안 근력 운동을 하고 신호에 맞춰 다음 벤치로 순환 이동한다.</p>
