<h1>수건 잡기 순발력 반응 놀이</h1>
<p>1) 두 사람이 마주 보고 서서 가운데 바닥에 수건을 둔다. 2) 지시자(부모·교사)가 여러 힌트 단어를 외치다가 '캐치'라고 외치는 순간 빠르게 수건을 낚아챈다. 3) 서서 하기에 익숙해지면 앉은 자세나 엎드려 누운 자세로 시작 자세를 변경한다. 4) 먼저 수건을 낚아챈 사람이 1점을 얻으며 다승을 겨룬다.</p>
