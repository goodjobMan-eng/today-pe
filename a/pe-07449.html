<h1>멀티볼</h1>
<p>1) 두 팀으로 나뉘어 체육관 양쪽 벽에 나란히 줄을 서서 대기한다. 2) 교사가 인원수를 외치며 사용할 공(농구공, 축구공, 프리즈비, 폼볼 중 하나)을 경기장 안으로 던진다. 3) 호명된 인원수의 각 팀 선수가 경기장으로 나와 해당 종목의 규칙에 맞춰 득점을 시도한다. 4) 득점이 나거나 교사가 멈춤을 외치면 공을 반납하고 팀 맨 뒤로 돌아가 줄을 선 뒤 다음 라운드를 진행한다.</p>
