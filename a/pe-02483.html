<h1>골키퍼 전진 점프 방어 훈련</h1>
<p>1) 앞으로 나가는 자세에서 두 발로 점프하며 팔과 다리를 최대한 크게 펼쳐 노마크 찬스 슈팅 각도를 좁혀 방어한다. 2) 제자리에서 원스텝 앞으로 나가면서 한 발로 점프해 팔과 다리를 최대한 크게 펼쳐 방어한다. 3) 노마크 찬스 슛 방어를 위해 제자리에서 투스텝 앞으로 전진해 공격자의 슛 타이밍에 맞춰 팔과 다리를 최대한 크게 펼쳐 방어한다.</p>
