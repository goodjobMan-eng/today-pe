<h1>거미줄 통과하기</h1>
<p>1) 철봉 3개와 줄 2개를 연결해 총 9칸의 거미줄 구멍을 만든다. 2) 모둠원들은 거미줄 구멍 하나당 한 명씩만 통과시켜 모든 인원이 반대편으로 넘어가도록 한다. 3) 이미 한 사람이 통과한 구멍은 다시 사용할 수 없다. 4) 모든 학생이 거미줄 반대편으로 무사히 이동하면 미션 성공이다.</p>
