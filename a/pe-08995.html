<h1>배구 언더핸드 패스 기본 및 응용 연습</h1>
<p>1) 제자리에서 공을 튀기며 언더핸드 패스를 연습한다. 2) 무릎을 꿇고 앉거나 앉아서 파트너가 던져주는 공을 언더핸드 패스로 받아 넘긴다. 3) 접시콘 사이를 이동하며 옆으로 점프하여 언더핸드 패스로 공을 받아 넘긴다. 4) 바닥에 고정된 훌라후프와 링 구조물 사이로 공을 통과시키며 언더핸드 패스를 연습한다.</p>
