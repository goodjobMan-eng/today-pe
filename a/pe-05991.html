<h1>큐브 접시콘 교실 게임</h1>
<p>1) 1번부터 10번까지의 숫자 접시콘 10개를 바닥이나 책상 위에 무작위로 펼쳐 놓는다.2) 참가 학생은 책상을 등지고 뒤돌아서서 신호를 기다린다.3) 신호가 울리면 신속히 뒤돌아 1번부터 10번까지 순서대로 접시콘을 찾아 위로 포개어 쌓는다.4) 가장 먼저 10번까지 올바른 순서로 모두 쌓은 사람이 승리한다.</p>
