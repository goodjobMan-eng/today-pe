<h1>5학년 반대항 발야구</h1>
<p>1) 학급당 2개 팀(A·B팀, C·D팀)으로 나누어 팀 조끼를 입고 스탠드에서 질서 있게 대기한다 2) 공격수는 공을 차고 주자가 되어 진루하며 수비수는 공을 잡아 주자보다 먼저 베이스를 밟아 아웃시킨다 3) 스트라이크와 파울이 합쳐 3개가 되거나 3아웃이 되면 공수를 교대한다 4) 총 5회까지 경기를 진행하여 최종 점수가 더 높은 학급이 승리한다</p>
