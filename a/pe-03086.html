<h1>벽을 이용한 족구 혼자 연습하기</h1>
<p>1) 자기 키의 2배 이상 되는 벽 앞에 선다. 2) 발 안쪽을 이용해 공을 벽에 높이 차고 받기를 반복하며 가능하면 머리도 이용한다. 3) 처음에는 벽 가까이에서 연습하다가 적응되면 멀리 떨어져서 공을 차고 받는다. 4) 족구공의 위쪽을 발등으로 차서 아래쪽으로 깔아 보내는 발등 차기 공격법을 연습한다.</p>
