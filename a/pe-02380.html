<h1>저글링 양손 번갈아 반박자 대각띄우기 도전</h1>
<p>1) 주로 사용하는 손부터 시작하여 반박자로 양손의 공을 대각선으로 던지고 바닥에 떨어뜨려 박자를 익힌다. 2) 오른손부터 반박자로 던진 뒤 반대 손(왼손)만 공을 잡는 연습을 수행한다. 3) 오른손잡이 기준 '오른손-왼손-왼손-오른손' 순서로 반박자로 공을 던지고 양손으로 모두 잡는다. 4) 1분마다 1라운드씩 주 손 먼저, 반대 손 먼저, 번갈아 진행하는 순서로 총 8라운드를 수행한다.</p>
