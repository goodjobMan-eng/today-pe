<h1>주사위 콘 뒤집기 릴레이</h1>
<p>1) 모둠별로 주사위 1개와 1부터 6까지 번호가 매겨진 콘 6개를 준비하여 일렬로 선다. 2) 주자가 주사위를 굴려 나온 숫자의 콘을 들고 나가 콘 플리핑(물병 세우기 방식)으로 콘을 바닥에 똑바로 세운다. 3) 콘을 세우는 데 성공하면 복귀하고 다음 주자가 즉시 주사위를 굴린다. 4) 이미 세워진 콘의 숫자가 다시 나오면 해당 콘을 다시 원래 자리로 가져온다.</p>
