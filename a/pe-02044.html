<h1>신문지 화살 투호 놀이</h1>
<p>1) 신문지를 돌돌 말아 끝부분을 수술 모양으로 잘라 신문지 화살 3개를 만든다. 2) 바구니를 표적으로 두고 1단계부터 4단계까지 거리를 점차 넓히며 화살을 던져 넣는다. 3) 반대 손으로 던지기, 신문지 화살을 손가락 위에서 균형 잡고 넣기 등 다양한 방식으로 도전한다. 4) 뒤로 돌아서 던지기, 코끼리 코 3바퀴 돌고 던지기와 같은 신체 미션을 수행하며 표적에 넣는다.</p>
