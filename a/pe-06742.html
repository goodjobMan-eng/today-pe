<h1>오렌지 게임</h1>
<p>1) 손을 모아 위아래로 굴리며 오렌지 노래를 부른 후 첫 번째 사람이 아주 작은 크기의 오렌지를 손으로 표현해 친구에게 패스한다. 2) 패스를 받은 사람은 이전보다 오렌지의 크기를 조금씩 더 크게 표현하며 다른 사람에게 넘긴다. 3) 오렌지가 점점 거대해지는 상황을 신체 연기와 동작으로 실감 나게 표현한다. 4) 너무 커져서 무겁거나 받을 수 없는 상황을 표현하지 못하거나 이전 크기보다 작게 표현하면 벌칙을 받는다.</p>
