<h1>미니언즈 프리즈 댄스 신체활동</h1>
<p>1) 음악이 흘러나오는 동안 화면 속 캐릭터와 함께 자유롭게 춤을 추며 몸을 움직입니다. 2) 음악이 멈추면 화면을 즉시 바라보고 화면에 제시된 미니언 동작 그대로 얼음 상태로 멈춥니다. 3) 중간에 나타나는 레이스 쇼다운에서는 응원할 선수를 선택한 뒤 제자리 달리기로 팀을 응원합니다. 4) 미니게임과 댄스를 번갈아 진행하며 끝까지 즐겁게 움직입니다.</p>
