<h1>스트레칭 및 유연성 운동</h1>
<p>1) 턱을 가슴 쪽으로 당기며 머리 뒤를 눌러 목 압박 스트레칭을 유지한다. 2) 양 팔꿈치로 바닥을 지지하며 상체를 들어 올려 허리 스트레칭을 유지한다. 3) 머리 뒷부분과 팔꿈치로 바닥을 지지하며 가슴과 턱을 들어 올려 물고기 자세를 유지한다. 4) 한쪽 발끝을 몸 쪽으로 당기며 무릎을 최대한 편 상태로 다리를 올려 무릎 관절 스트레칭을 유지한다.</p>
