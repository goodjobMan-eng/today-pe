<h1>농장 동물 짝 찾기 놀이</h1>
<p>1) 학생들을 활동 공간 전체에 고루 배치하고 각자에게 흉내 낼 동물을 지정한다. 2) 손수건으로 눈을 가리거나 눈을 감게 한다. 3) 각자 지정된 동물의 소리를 내며 같은 소리를 내는 짝을 찾아 이동한다. 4) 짝을 찾으면 멈춰 서서 다른 모든 친구가 짝을 찾을 때까지 기다린다.</p>
