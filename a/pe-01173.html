<h1>친구 발목 잡고 노젓기 기차 달리기</h1>
<p>1) 모둠원들이 바닥에 엉덩이를 대고 일렬로 앉아 앞사람은 뒷사람의 발목을 단단히 잡는다. 2) 구령에 맞춰 다리를 모았다 뻗으며 엉덩이를 밀어 앞으로 전진하는 연습을 한다. 3) 출발 신호와 함께 모든 팀이 동시에 전진하여 연결이 끊어지지 않고 결승선에 먼저 도착하면 승리한다. 4) 결승선에 도착한 직후 제시된 초성 퀴즈 단어를 모둠원이 돌아가며 맞히는 미션을 결합한다.</p>
