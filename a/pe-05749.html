<h1>축구 자유 드리블과 방향 전환 연습</h1>
<p>1) 골대에서 공을 하나씩 가져와 자유 공간으로 이동한다.2) 발 안쪽과 바깥쪽, 양발을 사용하여 공이 몸에서 멀어지지 않게 드리블한다.3) 교사의 시계 방향 구령(2시, 6시, 10시 등)에 맞춰 즉각 방향을 전환하며 공을 몬다.</p>
