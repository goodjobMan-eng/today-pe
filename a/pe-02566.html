<h1>짝과 함께하는 저글링 연습</h1>
<p>1) 두 사람이 마주 보고 오른손에서 상대방 오른손으로 포물선을 그리며 공 1개를 대각선으로 주고받는다. 2) 한 사람은 직선으로 던지고 상대방은 대각선으로 던지는 방식으로 공 1개를 주고받는다. 3) 두 사람이 각자 오른손에 공을 잡고 1번 주자가 먼저 던지면 2번 주자가 연속해서 공을 던져 주고받는다. 4) 한 사람이 오른손 역할(공 2개), 다른 사람이 왼손 역할(공 1개)을 맡아 번갈아 공을 띄우며 협동 저글링을 한다.</p>
