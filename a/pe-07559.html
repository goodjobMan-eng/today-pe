<h1>콘 스트라이크 발야구 게임</h1>
<p>1) 공격 팀 타자는 바닥에 놓인 폼볼을 발로 찬 뒤 반시계 방향으로 뛰어 콘을 손으로 터치하여 점수를 얻는다(콘 1개 터치당 1점씩, 최대 4점). 2) 수비 팀은 뜬공을 바로 잡으면 타자를 즉시 아웃시킨다. 3) 공이 땅에 구르거나 안타가 되면 수비 팀끼리 3회 패스한 뒤 원 밖에서 중앙에 세워진 고깔콘을 공으로 던져 맞혀 쓰러뜨린다. 4) 콘이 쓰러지기 전까지 공격 팀 타자가 콘을 찍고 달린 횟수만큼 득점으로 인정된다.</p>
