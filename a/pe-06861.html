<h1>통통 바운딩 농구</h1>
<p>1) 하프코트에서 진행하며 가위바위보나 자유투로 공격과 수비 순서를 결정한다. 2) 수비팀은 엔드라인 근처 지정된 박스 안에서 농구공을 바운드시킨다. 3) 공격팀은 공의 궤적을 예측하여 자리를 잡고 두 번째 바운드가 일어날 때 리바운드한다. 4) 공을 리바운드한 위치에서 바로 골대를 향해 슈팅을 이어가고 득점 시 점수를 획득한다. 5) 정해진 점수에 먼저 도달하거나 더 많은 득점을 한 팀이 승리한다.</p>
