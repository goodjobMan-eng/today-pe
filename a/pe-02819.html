<h1>접시콘 승부차기</h1>
<p>1) 골대와 공을 차는 출발선 사이에 여러 개의 접시콘을 흩어 놓습니다. 2) 가위바위보로 공격과 수비를 정하고, 공격은 슛을 차고 수비(골키퍼)는 골을 막습니다. 3) 골이 들어가면 공격수는 골키퍼가 공을 가져올 때까지 접시콘을 한 번에 1개씩 팀 콘으로 가져옵니다. 4) 공이 골대 밖으로 나가면 골키퍼가 접시콘을 1개씩 모으고, 공격수가 공을 가져와 출발선에 놓을 때까지 모읍니다.</p>
