<h1>발렌타인데이 댄스 앤 프리즈 챌린지</h1>
<p>1) 경쾌한 음악이 흘러나오면 캐릭터 동작을 따라 하거나 자신만의 춤을 자유롭게 춘다. 2) 음악이 멈추면 화면에 나오는 하트 요가 및 스트레칭 포즈를 15초 동안 유지한다. 3) 큐피드가 숨은 하트 찾기(야바위 셔플)와 발렌타인 틀린그림찾기 미니게임에 참여한다. 4) 음악 템포와 동작이 바뀔 때마다 신속하게 전환하며 리듬감과 순발력을 기른다.</p>
