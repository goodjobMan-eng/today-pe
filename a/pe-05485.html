<h1>캐치볼 게임 - 노란색을 노려라!</h1>
<p>1) 팀원들이 원형이나 대형을 이루고 두 명이 동시에 공 던지기를 시작한다.2) 던져진 공을 잡으면 기본 1점을 획득하고, 공을 놓치면 감점 형태의 페널티 점수 2점을 받는다.3) 빨간색 공을 잡으면 4점이 추가되며, 노란색 공을 정확히 잡아야 점수를 낮게 유지할 수 있다.4) 여러 차례 공을 주고받은 후 최종 합산 점수가 가장 낮은 팀이 승리한다.</p>
