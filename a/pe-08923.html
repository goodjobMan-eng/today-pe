<h1>원 만들고 원바운드로 공 오래 살리기</h1>
<p>1) 모둠원들이 원형으로 서서 시작하는 사람이 공을 바닥에 한 번 튀기고 다른 친구에게 보낸다. 2) 다른 친구들은 공이 바닥에 한 번 튀기면 언더 토스나 오버 토스로 공을 이어주거나 노바운드로 바로 보낸다. 3) 공을 연속해서 두 번 칠 수 없고, 개수를 세며 최대로 공을 살리거나 모둠원 전체가 터치하여 점수를 획득한다.</p>
