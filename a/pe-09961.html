<h1>체육관 포트나이트 게임</h1>
<p>1) 게임 시작 전 30초 동안 림에 공을 던져 쉴드나 리본을 획득한다. 2) 다른 플레이어를 공으로 맞혀 아웃시킨다. 3) 공을 맞고 아웃되면 교사에게 리본을 반납하고 기어 다니며 1부터 10까지 세면 부활할 수 있다.</p>
