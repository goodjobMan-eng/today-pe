<h1>협응성 올림픽 릴레이</h1>
<p>1) 두 모둠으로 나누어 주자 순서를 정하고 출발선에 정렬한다. 2) 신호가 울리면 첫 번째 주자가 출발하여 1구역에서 라켓으로 셔틀콕을 5회 튀긴다. 3) 2구역에서 바구니에 솜털 공 2개를 던져 넣고, 3구역에서 발 안쪽 면으로 축구공을 몰아 삼각콘을 돌아온다. 4) 시작점에 공을 두고 출발선으로 전력 질주하여 다음 주자와 교대한 뒤 마지막 주자가 먼저 들어온 팀이 승리한다.</p>
