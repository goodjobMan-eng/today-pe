<h1>크로스 발 터치 놀이</h1>
<p>1) 양팔을 양옆으로 나란히 벌리고 선 상태에서 반대쪽 손과 발을 교차하여 터치합니다. 2) 처음에는 몸 앞에서 오른손으로 왼발 안쪽을, 왼손으로 오른발 안쪽을 번갈아 터치합니다. 3) 이어서 몸 뒤쪽으로 다리를 접어 올리며 반대쪽 손으로 뒤꿈치나 발바닥을 터치합니다. 4) 앞과 뒤 동작을 번갈아 하며 박자에 맞춰 속도를 점차 높이고, 음악이나 노래에 맞춰 구령을 붙이며 리듬감 있게 몸을 움직입니다.</p>
