<h1>추수감사절 그린치 칠면조 프리즈 댄스</h1>
<p>1) 그린치와 함께 음악에 맞춰 칠면조 춤을 춘다. 2) 'Freeze' 신호가 나오면 근육을 전혀 움직이지 않고 지정된 포즈로 정지한다. 3) 칠면조 강아지 달리기 화면에서 출전할 강아지를 선택하고 해당 포즈를 따라 한다. 4) 레이스가 시작되면 제자리 달리기를 하며 선택한 강아지를 응원한다.</p>
