<h1>동물 흉내 내기 움직임 놀이</h1>
<p>1) 토끼처럼 크게 점프하고, 오리처럼 웅크려 걷거나, 말처럼 질주하며 다양한 동물 움직임을 시도한다. 2) 양손으로 바닥을 짚고 걷는 곰 걸음, 엉덩이를 든 게 걸음, 바닥에 엎드려 미끄러지듯 이동하는 동작을 연습한다. 3) 앞, 뒤, 옆 등 다양한 방향으로 움직임을 바꿔가며 이동한다. 4) 늑목 등에 긴 줄을 묶고 바닥에 앉아 줄을 당기며 원숭이처럼 전진한다.</p>
