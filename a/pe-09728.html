<h1>콩 주머니 모으기 대결</h1>
<p>1) 시작 신호와 함께 한 번에 한 개의 콩 주머니를 가져와 자기편의 후프 안에 넣는다. 2) 남학생과 여학생이 순환(호각 2번)하면서 활동한다. 3) 가운데 콩 주머니를 모두 가져가면 상대팀 후프에서 가져올 수 있다. 4) 정해진 시간 동안 더 많은 콩 주머니를 모은 팀이 승리한다.</p>
