<h1>비치볼 배구 기초 패스 게임</h1>
<p>1) 6명이 원형으로 둘러앉고 모둠당 비치볼 1개를 준비한다. 2) 한 학생이 공을 가볍게 토스하며 게임을 시작한다. 3) 공이 어깨 아래로 오면 언더핸드 패스(범프), 어깨 위로 오면 오버핸드 패스(세트)로 연결한다. 4) 동일한 학생이 공을 연속 두 번 건드릴 수 없으며 공이 바닥에 닿지 않도록 모둠원끼리 계속 이어간다.</p>
