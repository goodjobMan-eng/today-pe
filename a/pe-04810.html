<h1>거리가 다른 주사위 릴레이 게임</h1>
<p>1) 출발선에서 일렬로 같은 간격으로 놓인 1부터 6까지의 라바콘을 설치한다.2) 모둠의 첫 주자가 폭신 주사위 공을 굴려 나온 숫자를 확인한다.3) 나온 숫자를 큰 목소리로 부르고 주사위를 든 채 해당 번호의 라바콘을 돌아온다.4) 모둠을 돌아 다음 주자에게 주사위를 건네주고, 모든 주자가 먼저 완주한 모둠이 승리한다.</p>
