<h1>핸드볼 모터 스킬 1단계 서킷</h1>
<p>1) 팔을 든 자세로 스텝 래더의 각 칸마다 한 발씩 딛고 이동한다. 2) 콘 사이를 슬라럼으로 빠르게 통과한다. 3) 초록색 콘에 도착하면 패서에게 공을 패스한다. 4) 빨간색 콘을 돌아 달려가면서 패서에게 다시 공을 받는다. 5) 하나, 둘, 셋 스텝을 밟은 뒤 골대를 향해 슛을 던진다.</p>
