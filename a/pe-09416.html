<h1>산타 구조 태그 게임</h1>
<p>1) 엘프들은 제한 시간 내에 5개의 집(안전지대)을 모두 방문해야 합니다. 2) 그리치(술래)에게 태그를 당하면 지정된 운동을 수행한 후 게임에 복귀합니다. 3) 레벨이 올라갈수록 협동하여 여러 명이 동시에 집에 들어가거나 굴뚝·사탕수수(안전지대)를 활용하는 규칙이 추가됩니다.</p>
