<h1>체조 이동 동작 챌린지</h1>
<p>1) 매트 위에 파이크 자세(다리를 펴고 앉은 자세)로 앉아 설명을 듣는다. 2) 이동 동작을 시작하기 전과 끝마친 후에 양팔을 들어 올렸다가 내리는 '살루트(경례)' 신호를 한다. 3) 음악이 시작되면 오리걸음 등 지정된 이동 동작으로 매트를 건너간다. 4) 음악이 멈추면 매트 위에 쓰러지지 않고 몸을 통제하며 파이크 자세로 다시 앉는다.</p>
