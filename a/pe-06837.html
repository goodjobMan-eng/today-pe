<h1>눈덩이를 밀고 굴리고</h1>
<p>1) 원마커로 큰 원을 만들고 한 모둠은 원 안에, 두 모둠은 원 밖에 둘러앉는다. 2) 원 밖 모둠은 콩주머니를 바닥에 밀어 굴려 원 안 친구들의 발을 맞히고, 안쪽 친구들은 점프하며 피한다. 3) 맞은 친구는 원 밖을 한 바퀴 크게 돌고 부활하며, 2분이 지나면 역할을 바꾼다.</p>
