<h1>파트너 릴레이 점프밴드 리듬 표현</h1>
<p>1) 4인 1조를 이뤄 두 명은 발목에 점프밴드를 걸어 팽팽히 당겨 서고, 나머지 두 명은 스텝을 준비한다. 2) 노래 전주 및 전반부 리듬에 맞춰 1인 혹은 2인이 번갈아 밴드 안팎을 넘나드는 스텝을 펼친다. 3) 박자에 맞춰 안 뛰기, 걸쳐 뛰기, 밖으로 벌려 뛰기를 밴드 접촉 실수 없이 연속 성공시키면 완주 점수를 얻는다. 4) 밴드의 너비를 좁히거나 회전 스텝 및 엇박자 스텝을 섞어 모둠만의 창작 안무로 변형한다.</p>
