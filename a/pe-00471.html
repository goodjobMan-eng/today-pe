<h1>고무줄 뛰어넘기 놀이</h1>
<p>1) 두 사람이 바느질용 고무줄의 양 끝을 잡고 팽팽하게 당기며 서 있고, 다른 한 사람이 고무줄을 뛰어넘으며 도전합니다. 2) 바닥, 발목, 무릎, 허리 순으로 고무줄의 높이를 점점 올려가며 뛰어넘습니다. 3) 고무줄을 잡는 사람은 순서대로 돌아가며 역할을 교대합니다. 4) 고무줄에 닿아도 괜찮으니 옆돌기(측전) 동작으로 넘는 등 창의적인 방법으로 도전해 볼 수 있습니다.</p>
