<h1>빠르게 달리기 바른 자세 도전</h1>
<p>1) '제자리에' 구령에 스타팅 블록 앞에 서서 바닥에 손을 짚고 어깨너비로 벌려 출발선 안쪽을 짚는다. 2) '차려' 구령에 엉덩이를 머리보다 높게 들고 체중을 양팔과 앞발에 실어 불안정한 중심을 만든다. 3) 출발 신호와 함께 몸을 숙인 채 팔을 힘차게 흔들고 앞발로 강하게 차며 속도를 올린다. 4) 전력 질주 구간에서는 몸을 바로 세우고 팔을 앞뒤로 크게 흔들며 무릎을 높이 올려 결승선까지 달린다.</p>
