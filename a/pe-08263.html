<h1>가랑이 축구</h1>
<p>1) 바깥 팀은 큰 원을 만들고 안쪽 팀은 좁은 원을 만들어 다리를 벌리고 선다. 2) 바깥 팀 학생들이 손으로 공을 굴려 안쪽 팀 학생들의 가랑이 사이로 통과시킨다. 3) 안쪽 팀 학생들은 손으로 공을 막아 방어하고, 골을 넣으면 칠판에 점수를 기록한다.</p>
