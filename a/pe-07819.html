<h1>바쁜 벌들</h1>
<p>1) 한 명을 여왕벌로 정하고 나머지 학생들은 둘씩 짝을 짓습니다. 2) 여왕벌이 '등 맞대기'나 '얼굴 맞대기' 같은 지시를 내리면 짝끼리 해당 동작을 취합니다. 3) 여왕벌이 '체인지'를 외치면 모든 학생은 다른 짝을 찾아 이동합니다. 4) 짝을 찾지 못하고 혼자 남은 학생이 다음 여왕벌이 됩니다.</p>
