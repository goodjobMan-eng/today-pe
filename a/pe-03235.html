<h1>한걸음 버블 술래잡기</h1>
<p>1) 참가자 전원이 각자 훌라후프를 하나씩 잡고 몸 주변에 둘러 안전 보호막(버블)을 만든다. 2) 술래가 외치는 '한 걸음' 구호에 맞춰 모든 사람이 동시에 한 걸음씩 이동한다. 3) 피하는 사람끼리 보호막 역할을 하는 후프가 서로 닿게 되면 술래에게 잡히게 된다. 4) 술래에게 닿거나 규칙을 어기면 술래와 역할을 바꾸며, 함께 뭉쳤다 흩어지는 전략을 활용한다.</p>
