<h1>스타워즈 테마의 피구형 게임</h1>
<p>1) 스쿠터보드 위에 볼링핀을 올리고 줄을 연결하여 제다이 팀이 이동시킨다. 2) 스톰트루퍼 팀은 공을 던져 상대의 볼링핀을 쓰러뜨린다. 3) 볼링핀이 쓰러지면 제다이 팀원은 줄을 놓고 스쿠터보드를 타고 이동하여 수비 역할을 한다. 4) 제다이 팀의 볼링핀이 모두 쓰러지기 전에 결승선을 통과하면 승리한다.</p>
