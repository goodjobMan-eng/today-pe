<h1>가정에서 해보는 앉아서 윗몸 앞으로 굽히기 유연성 운동</h1>
<p>1) 손목과 발목을 빙글빙글 돌리고 관절을 늘려주는 준비운동을 먼저 실시한다. 2) 바닥이나 매트에 다리를 곧게 펴고 앉아 무릎이 굽혀지지 않도록 곧게 편다. 3) 숨을 내쉬며 상체를 앞으로 천천히 숙여 손끝을 최대한 발끝 너머로 밀어준다. 4) 최대한 내려간 지점에서 2초에서 3초 정도 자세를 유지하며 자신의 유연성을 점검하고 10초씩 유지하는 스트레칭 동작을 이어간다.</p>
