<h1>캥거루와 악어 반응 태그 놀이</h1>
<p>1) 중앙 출발선에 캥거루 팀과 악어 팀이 1명씩 짝을 지어 나란히 마주 서거나 옆에 선다. 2) 양쪽 팀 뒤편 10~15m 거리에 각 팀의 엔드존 구역을 콘으로 설치한다. 3) 교사가 '캥거루'를 외치면 캥거루 팀은 자기 엔드존으로 도망치고 악어 팀은 태그하러 쫓아간다. 4) 엔드존에 닿기 전에 상대 팀을 태그하거나 태그당하지 않고 도착하면 1점을 획득한다.</p>
