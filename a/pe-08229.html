<h1>밀크셰이크 넷볼 패스 앤 드라이브 드릴</h1>
<p>1) 패서 3명이 각각 공을 들고 삼각형 대형으로 서고, 나머지 주자들은 한 줄로 선다. 2) 첫 번째 주자가 1번 패서 앞으로 달려 나와 패스를 주고받은 뒤 공간 밖으로 빠져나간다. 3) 이어서 2번 패서, 3번 패서 앞으로 이동하며 연속해서 패스를 주고받는다. 4) 앞선 주자가 공간을 비우면 다음 주자가 차례대로 진입하여 패스를 이어받고, 3번 패스까지 마치면 줄 맨 뒤로 돌아간다.</p>
