<h1>홈트레이닝 슬로우 버피테스트</h1>
<p>1) 바르게 선 자세에서 무릎과 다리를 구부리며 양손을 바닥에 짚는다. 2) 점프하지 않고 양발을 한 발씩 차례대로 뒤로 뻗어 플랭크 자세를 만든다. 3) 허리와 엉덩이가 아래로 처지지 않게 유지한 뒤, 한 발씩 다시 앞으로 짚어 돌아온다. 4) 다리를 펴기 전에 허리를 먼저 세우고 다리 힘으로 바르게 일어선다.</p>
