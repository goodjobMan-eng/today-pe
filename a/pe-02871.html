<h1>점점 멀리 플라잉디스크 던지기</h1>
<p>1) 두 사람이 마주 보고 기본 거리 콘에 서서 플라잉디스크를 주고받는다. 2) 디스크를 성공적으로 받으면 뒤로 한 걸음 물러나 거리를 넓힌다. 3) 디스크 받기에 실패하면 앞으로 한 걸음 이동하여 가깝게 다시 도전한다. 4) 한쪽 발을 고정한 피벗 상태에서 발을 떼지 않고 패스를 이어간다.</p>
