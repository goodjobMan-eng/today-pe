<h1>디스크 골프 팀 스크램블</h1>
<p>1) 2인 1조 팀을 구성하여 모든 팀원이 티샷선에서 디스크를 던진다. 2) 팀원들이 던진 디스크 중 가장 좋은 위치에 안착한 디스크 위치를 선정한다. 3) 모든 팀원이 해당 위치로 이동하여 마커 뒤에서 다음 샷을 동시에 진행한다. 4) 디스캐처에 디스크를 넣어 홀아웃할 때까지 반복하고 타수가 가장 적은 팀이 승리한다.</p>
