<h1>네트 투 스퀘어 (TGfU 발전 단계형 네트 게임)</h1>
<p>1) 정규 네트 코트와 미니 네트 연습 구역으로 팀(파트너)을 나눈다.2) 파트너와 함께 네트 너머로 공을 쳐서 넘기는 수준별 과제(1대1 등)를 수행한다.3) 과제를 달성하면 이동하여 보드의 클릭커 및 자석 위치를 다음 단계로 변경한다.4) 메인 네트 팀이 이동할 때 미니 구역 팀이 메인 코트로 교대하여 다음 단계를 진행하고, 2대2 복식 단계까지 해금하며 순환한다.</p>
