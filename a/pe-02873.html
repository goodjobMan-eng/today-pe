<h1>비사 넘어뜨리기</h1>
<p>1) 4명이 순서를 정하고 목표물 10개를 세운다. 2) 선을 넘지 않은 상태에서 첫 번째 친구가 도구를 손으로 던져 목표물을 넘어뜨린다. 3) 목표물이 다 넘어지면 새로 10개를 설치하고 하나라도 남으면 다음 친구가 이어서 던진다. 4) 던지기 외에 발로 차서 넘어뜨리는 방식으로 변형하여 진행한다.</p>
