<h1>소프트 발리볼 게임 및 리시브 연습</h1>
<p>1) 네트를 사이에 두고 팀을 나누어 서브를 넣으며 경기를 시작한다. 2) 네트 너머로 오는 공은 손으로 잡지 않고 배구처럼 직접 쳐서 연결해야 한다. 3) 한 사람이 연속으로 공을 두 번 칠 수 없으며 반드시 다른 동료가 받아 쳐야 한다. 4) 가슴 아래로 오는 공은 손을 모아 언더 토스 자세로, 머리 위로 오는 공은 이마 위에서 오버 토스 자세로 쳐서 빈 공간으로 넘긴다.</p>
