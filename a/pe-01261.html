<h1>나무젓가락 고무줄총 종이컵 탑 쓰러뜨리기</h1>
<p>1) 나무젓가락과 고무줄로 고무줄총을 만들고, 종이컵 10개로 4단 피라미드 탑을 쌓은 뒤 3발자국 떨어진 사격선을 정한다. 2) 사격선 뒤에서 고무줄을 장전하고 종이컵 탑을 조준하여 한 발씩 고무줄을 쏜다. 3) 1층을 제외한 2·3·4층의 종이컵을 모두 쓰러뜨릴 때까지 사용한 발수와 소요 시간을 측정하여 순위를 정한다. 4) 사격 거리를 점차 늘리거나 종이컵마다 점수를 부여하여 합산 점수제로 변형할 수 있다.</p>
