<h1>긴줄 8자 마라톤 지도방법 및 양쪽 입장</h1>
<p>1) 긴 줄을 돌리는 상태에서 학생들이 8자 동선으로 연속해 줄 안으로 들어갑니다. 2) 줄 중앙에서 한 번 점프한 뒤 반대편으로 빠르게 빠져나갑니다. 3) 줄을 넘고 빠져나갈 때는 제자리나 옆이 아닌 대각선 방향으로 돌아 나옵니다. 4) 숙달되면 양쪽에서 번갈아 뛰어드는 양쪽 입장 방식으로 연속 도전을 이어갑니다.</p>
