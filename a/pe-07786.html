<h1>게와 바닷가재 게임</h1>
<p>1) 양쪽 끝 라인에 두 팀으로 나뉘어 서고 각자 번호(1~7번 등)를 부여받는다. 2) 코트 중앙에 비치볼 여러 개를 모아 두고 대기한다. 3) 교사가 번호를 부르면 양 팀의 해당 번호 학생들은 손과 발을 땅에 댄 게 걸음으로 중앙으로 기어간다. 4) 공을 쳐서 상대 진영 라인 안쪽으로 밀어 넣으며 수비 라인의 바닷가재는 공이 들어오지 못하게 막는다.</p>
