<h1>슐라이펜발 (리본 피구)</h1>
<p>1) 교사 주변에 수많은 리본을 모아 두고 시작한다. 2) 준비 라운드에서 공으로 상대방을 맞히면 교사에게 가서 리본을 1개 가져오며, 맞은 사람은 탈락하지 않고 계속 플레이한다. 3) 리본이 모두 소진되면 본게임(약 5분)을 시작한다. 4) 본게임 중 상대를 맞히면 맞힌 사람의 리본을 빼앗아 오며, 맞은 사람은 자신의 리본을 넘겨준다. 5) 정해진 시간이 끝났을 때 리본을 가장 많이 모은 학생이 승리한다.</p>
