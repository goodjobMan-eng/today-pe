<h1>막대 지키기 놀이</h1>
<p>1) 짝과 일정한 거리를 두고 마주 선다. 2) 회전할 방향을 정한 뒤 한 사람이 '하나, 둘, 셋'을 외친다. 3) 구호에 맞춰 짝과 정한 방향으로 돌면서 다른 친구가 떨어뜨린 막대를 잡는다. 4) 막대가 떨어지지 않으면 계속 반복하며 횟수를 세어 보고, 짝 놀이가 끝나면 반 전체가 한 모둠이 되어 진행한다.</p>
