<h1>콘택트볼 (공 태그 패스 게임)</h1>
<p>1) 공을 든 팀은 패스를 통해 이동하며 상대 팀 선수를 찾아간다. 2) 공을 손에 쥐고는 이동할 수 없으므로 노마크 선수가 상대 가까이로 이동해 공을 받는다. 3) 손에 쥔 공으로 상대 팀 몸을 터치하면 1점을 획득한다(던져서 맞히는 것은 금지). 4) 공을 던지거나 공이 바닥에 닿거나 상대가 가로채면 공격권이 즉시 상대 팀으로 넘어간다.</p>
