<h1>토싱 타워스 (바구니 탑 쌓기 &amp; 공 던지기)</h1>
<p>1) 중앙 네모 구역 가운데에 바구니(버킷)를 수직으로 높게 쌓아 탑을 만들고, 모둠원은 네모 구역 바깥의 원마커 위에 서서 대기합니다. 2) 신호가 울리면 공을 던져 바구니 탑 안으로 넣거나 맞혀 목표를 달성합니다. 3) 성공하면 차례대로 달려가 바구니를 하나씩 더 높이 쌓아 올립니다. 4) 원마커의 거리를 조절하여 학생 수준에 맞게 던지기 난이도를 정합니다.</p>
