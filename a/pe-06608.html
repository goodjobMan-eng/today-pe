<h1>3대 3 패스 연결 축구 게임</h1>
<p>1) 축구 골대가 있는 반 코트에서 3대 3으로 팀을 나누고 가위바위보로 이긴 팀부터 패스를 시작한다. 2) 첫 번째 패스에는 수비할 수 없으며 두 번째 패스부터 수비팀이 패스 경로를 차단하거나 직접 공을 빼앗는다. 3) 경기장 라인 밖으로 공이 나가면 킥인으로 경기를 재개하고, 공을 완전히 빼앗기면 공격과 수비 역할을 교체한다. 4) 패스를 끊기지 않고 5회 성공할 때마다 1점을 획득하며 먼저 10점을 얻는 팀이 승리한다.</p>
