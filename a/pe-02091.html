<h1>평균대 달팽이 놀이</h1>
<p>1) 평균대 여러 개를 이어 놀이 공간을 만들고 팀을 나눠 반대편에서 출발합니다. 2) 균형을 유지하며 앞으로 걸어가다 상대팀을 만나면 가위바위보를 합니다. 3) 이기면 계속 나아가고 진 팀은 바로 다음 주자가 출발합니다. 4) 상대 팀의 최종 수비 구역에 들어간 후 가위바위보를 이기면 최종 승리합니다.</p>
