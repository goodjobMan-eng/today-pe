<h1>방향 제시 타격 티볼형 게임</h1>
<p>1) 수비 모둠과 타자로 모둠을 구성한다. 2) 타자가 타석에 서면 수비 모둠이 1루 방향, 2루 방향, 3루 방향 등의 말로 타격 방향을 제시한다. 3) 타자가 수비 모둠이 제시한 방향으로 공을 치면 1점을 득점하고, 친 공이 제시한 방향을 벗어나면 점수를 얻지 못한다. 4) 공격 기회는 학생별로 3회씩 진행한다.</p>
