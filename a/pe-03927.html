<h1>에브리바디스 잇(전원 술래잡기)</h1>
<p>1) 레벨 1에서는 전원이 서로를 태그할 수 있으며 태그된 사람은 한쪽 무릎을 꿇고 앉는다. 2) 자신을 태그한 상대가 다른 사람에게 태그되어 앉으면 다시 일어서서 복귀한다. 3) 레벨 2는 2인 1조로 진행하며 파트너를 아웃시킨 상대를 찾아 태그해야 파트너가 복귀한다. 4) 레벨 3은 4인 1조로 협동하며 레벨 4는 플래그(꼬리끈)를 착용하고 동일한 방식을 반복한다.</p>
