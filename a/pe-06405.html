<h1>프리즈 댄스 및 제자리 달리기 레이스</h1>
<p>1) 화면 속 지시와 노래 가사에 맞춰 제자리 점프, 회전, 손 흔들기 등의 동작을 따라 한다.2) 'Freeze' 신호가 나오면 제시된 자세 그대로 멈춘다.3) 캐릭터 레이스 신호가 나오면 자세를 취해 선수를 고르고 3, 2, 1 구호에 맞춰 제자리 달리기로 파워를 충전한다.</p>
