<h1>교실 스태킹 컵 컬링 놀이</h1>
<p>1) 바닥에 1미터 선과 목표 원을 테이프로 표시하고 출발선을 정한다. 2) 가위바위보로 순서를 정한 뒤, 양 팀이 번갈아 가며 구슬이 든 스태킹 컵 핀을 바닥에 밀어 굴린다. 3) 컵이 1미터 선을 넘거나 옆으로 치우치면 아웃 처리되며, 상대방 핀을 쳐내어 밀어낼 수 있다. 4) 목표 원 안에 핀이 들어가거나 1미터 라인과 가장 가깝게 위치시킨 팀이 승리한다.</p>
