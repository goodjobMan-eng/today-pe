<h1>사방피구</h1>
<p>1) 팀 조끼를 입은 팀과 안 입은 팀으로 나눈다. 2) 정해진 시간 동안 코트 안의 상대 친구들을 공으로 맞힌다. 3) 공에 맞은 사람은 지정된 상대 팀 뒤쪽 외곽 구역으로 이동한다. 4) 아웃된 친구가 있을 때는 코트 안의 친구들이 바깥으로 공을 주우러 나가면 아웃된다.</p>
