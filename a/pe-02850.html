<h1>접시콘 비행접시 잡기</h1>
<p>1) 3~4색으로 된 접시콘 세트와 라바콘, 점수판을 준비합니다. 2) 접시콘 여러 개를 동시에 잡고 공중에 날립니다. 3) 팀 색으로 정한 접시콘을 잡고 먼저 돌아오면 점수를 받으며, 날아오는 접시콘을 공중에서 잡으면 승리합니다. 4) 돌아가며 대결해서 더 높은 점수를 얻은 팀이 승리합니다.</p>
