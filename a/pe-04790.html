<h1>링 지그재그 릴레이</h1>
<p>1) 모둠 팀원들이 지그재그 대형으로 일정한 거리를 두고 선다.2) 출발 신호와 함께 첫 번째 사람이 고리(링)를 들고 옆 사람에게 전달한다.3) 고리를 넘겨준 사람은 줄에서 빠져나간다.4) 손에서 손으로 링을 지그재그로 끝까지 가장 빠르게 전달한 팀이 승리한다.</p>
