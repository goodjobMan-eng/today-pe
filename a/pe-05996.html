<h1>콘 플립 돔 앤 디쉬</h1>
<p>1) 돔 팀과 디쉬(접시) 팀으로 나누어 콘을 배치한다.2) 출발 신호와 함께 자기 자리에서 콘 플립(콘 세우기)에 도전한다.3) 콘 플립에 성공한 사람만 이동하여 상대 팀 모양의 콘을 자기 팀 모양으로 뒤집는다.4) 정해진 시간(약 1분) 후 자신의 팀 모양으로 더 많이 뒤집힌 팀이 승리한다.</p>
