<h1>접시콘 플립 퐁당</h1>
<p>1) 책상 위에 접시콘을 뒤집어 놓고 손가락으로 튕겨 바로 세우는 플립을 성공한다. 2) 일어서서 탁구공을 바닥에 한 번 튕겨 뒤집힌 접시콘 안으로 넣는다. 3) 한 단계 성공할 때마다 교실 사방 벽으로 걸어가 손으로 벽을 터치하고 돌아온다. 4) 이동 중 다른 친구와 손이나 몸이 접촉되면 다시 처음으로 돌아가 재도전한다. 5) 15명 기준 선착순 약 8명 순위 안에 들면 성공한다.</p>
