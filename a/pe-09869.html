<h1>보물 숨기고 찾기 릴레이</h1>
<p>1) 첫 주자는 공(보물)을 들고 달려가 자기 팀 콘 중 하나 아래에 보물을 숨깁니다. 2) 반환점을 돌아 상대 팀의 콘 구역으로 교차해 이동한 뒤 상대 팀이 숨긴 보물을 찾습니다. 3) 찾은 보물을 들고 돌아와 다음 주자에게 전달하며 릴레이를 이어갑니다.</p>
