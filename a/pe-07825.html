<h1>팝콘 농구 게임</h1>
<p>1) 코트 중앙에 매트를 세로로 세우고 그 주변에 색상 스팟 마커를 배치한 뒤 폼볼을 둔다. 2) 매트 중앙 구역에 수비수 1명을 배치하고 나머지 학생들은 주변으로 흩어진다. 3) 주변 학생들은 스팟 마커의 폼볼을 집어 매트 안쪽으로 던져 넣고 수비수는 공을 밖으로 쳐낸다.</p>
