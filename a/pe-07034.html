<h1>하이 눈 양말 피하기 게임</h1>
<p>1) 두 사람이 등을 맞대고 서서 카우보이 자세를 취한다. 2) 사전에 합의한 걸음 수만큼 서로 반대 방향으로 함께 걸어간다. 3) '돌아서 쏴(turn and shoot)' 신호가 나오면 뒤돌아서 서로에게 양말공을 던진다. 4) 날아오는 양말을 피할 때는 멀리 달아나지 말고 최대 한 걸음만 움직여 몸을 피한다.</p>
