<h1>코코(Kho Kho)</h1>
<p>1) 공격팀은 중앙선에 일렬로 앉거나 쪼그려 앉아 방향을 번갈아 본다. 2) 공격팀 중 한 명은 서서 술래 역할을 수행한다. 3) 술래는 수비팀을 터치하여 탈락시킨다. 4) 술래는 동료의 등을 터치하고 '코(Kho)'라고 외쳐 역할을 교대할 수 있다.</p>
