<h1>노르웨이 발 닿기 균형 놀이</h1>
<p>1) 5~7명씩 소그룹을 만들어 둥글게 둘러선다. 2) 가장 어린 사람이 먼저 시작하여 진행 방향을 정한다. 3) 차례가 된 사람은 앞 사람이 건드린 발 부위(발가락 또는 뒤꿈치)로 다음 사람의 발을 건드려 발을 뻗는다. 4) 균형을 잃거나 넘어지면 원에서 탈락하며, 탈락자가 모이면 새로운 원을 구성한다.</p>
