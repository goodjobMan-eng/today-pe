<h1>연속 통과 더블더치 릴레이</h1>
<p>1) 돌리는 사람 2명이 긴 줄 2개를 양손에 잡고 안쪽으로 엇갈려 돌린다. 2) 뛰는 사람들은 줄 한쪽에 일렬로 서서 차례를 기다린다. 3) 신호에 맞춰 한 명씩 돌아가는 더블더치 줄 안으로 들어가 스텝을 밟으며 줄을 넘고 반대편으로 빠져나온다. 4) 다음 주자가 끊김 없이 연속으로 진입하며 정해진 인원이 전원 성공할 때까지 이어간다.</p>
