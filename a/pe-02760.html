<h1>하체 및 코어 중심 단련 운동</h1>
<p>1) 어깨너비로 서서 엉덩이를 뒤로 빼고 무릎이 발 앞으로 나오지 않도록 앉았다 일어나는 스쿼트를 실시한다. 2) 한 발을 앞으로 내딛고 양손에 물통을 든 느낌으로 몸을 수직으로 내리는 런지를 양발 번갈아 실시한다. 3) 매트에 누워 상체와 하체를 V자로 들어 올리고 버티는 V자 버티기를 10초간 유지한다. 4) 누운 상태에서 다리를 올려 자전거 페달을 밟듯 굴리는 자전거 타기로 복부 근력을 기른다.</p>
