<h1>신체 만들기 운동 종합 시리즈 요약</h1>
<p>1) 긴 줄 밟고 균형 잡기 등 다양한 움직임을 유도하는 기초 감각 익히기 활동을 대형에 맞춰 준비한다. 2) 모둠별로 평균대 걷기, 철봉 매달리기, 공 주고받기 등 다양한 스테이션 운동을 진행한다. 3) 발맞춰 달리기나 술래형 태그 등 게임성을 더해 체력 증진 활동을 전개한다. 4) 정리 운동을 하며 다양한 신체 움직임 프로그램의 변화를 학년 수준에 맞게 마무리한다.</p>
