<h1>피클볼 패들 &amp; 공 몸풀기 챌린지 10단계</h1>
<p>1) 1인당 패들 1개와 피클볼 1개를 챙겨 개인 공간을 확보한다.2) 각 라운드마다 30초 동안 타이머에 맞춰 제시된 패들 기술 과제를 수행한다.3) 1단계(공 올리고 스쿼트)부터 9단계(다운 바운드)까지 차례로 수행하고 10단계에는 자신만의 패들 트릭을 만들어 도전한다.</p>
