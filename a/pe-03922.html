<h1>가위바위보 베이스볼</h1>
<p>1) 모든 학생이 1번 콘으로 이동해 파트너를 찾는다. 2) 파트너와 가위바위보를 진행한다. 3) 가위바위보에서 이긴 사람은 다음 번호의 콘으로 이동하고, 진 사람은 해당 콘에 남아 새로운 상대와 대결한다. 4) 콘 4곳을 순서대로 모두 돌아 처음 자리로 돌아오면 1점을 얻는다.</p>
