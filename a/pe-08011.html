<h1>신호 반응 가위바위보 및 연산 술래잡기</h1>
<p>1) 2명이 벽(또는 사각 구역)을 사이에 두고 마주 선다. 2) 가위바위보를 하여 진 사람이 도망치고 이긴 사람이 술래가 되어 쫓아간다. 3) 코치가 신호(체인지)를 외치면 즉시 역할을 바꾸어 술래가 도망치고 도망자가 쫓아간다. 4) 사이드스텝으로 이동하며 코치가 낸 덧셈 문제의 답이 짝수면 한쪽, 홀수면 다른 쪽이 술래가 된다.</p>
