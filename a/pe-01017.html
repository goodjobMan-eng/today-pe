<h1>키 성장과 척추 이완 요가 스트레칭</h1>
<p>1) 바르게 앉아 목과 어깨를 크게 돌리고 손을 뒤로 깍지 껴 상체를 숙이는 준비 동작을 취한다 2) 앉은 자세에서 한쪽 팔로 어깨를 당기고 옆구리를 길게 늘려 상체 근육을 풀어준다 3) 다리를 앞으로 뻗어 상체를 숙이고 손을 뒤로 짚어 골반을 들어 올리는 테이블 자세를 취한다 4) 누운 상태에서 한쪽 무릎을 반대쪽으로 넘겨 척추를 비튼 뒤 사바사나 자세로 온몸의 힘을 빼며 호흡을 정돈한다.</p>
