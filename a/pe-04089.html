<h1>파이프라인 골프공 전달하기</h1>
<p>1) 반원형 파이프를 이용해 골프공을 손으로 만지지 않고 체육관 바닥 한쪽 끝에서 반대쪽 끝으로 굴려 전달한다. 2) 공은 멈추거나 떨어지거나 뒤로 갈 수 없으며 계속 앞으로 나아가야 한다. 3) 공이 멈추거나 뒤로 가면 처음부터 다시 시작한다. 4) 공을 반대편 끝까지 운반하여 통 안에 떨어뜨려 유지시키면 성공한다.</p>
