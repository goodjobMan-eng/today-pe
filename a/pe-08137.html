<h1>스파이크볼 협동 활동</h1>
<p>1) 4인 1팀이 2명씩 짝을 지어 손바닥을 위로 한 채 공을 콘까지 패스한다. 2) 바닥에 공이 2번 이하로 떨어지며 콘에 도착하면 팀의 첫 번째 스카프를 획득한다. 3) 콘에 도달한 후 네트로 이동하여 선 뒤에서 공을 띄워 네트에 스파이크한다. 4) 네트에 공을 정확히 맞히면 두 번째 스카프를 얻고 돌아온다.</p>
