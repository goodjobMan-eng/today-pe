<h1>패드민턴 기초 연습</h1>
<p>1) 원마커 위에 두 발을 올리고 선 뒤, 한 발만 바깥으로 떼어 움직이며 자세를 잡는다. 2) 오른손잡이는 라켓의 그림이 보이지 않게 손잡이를 잡는다. 3) 왼손 엄지와 검지로 셔틀콕 깃털 끝을 잡고 떨어뜨리며 패드민턴 라켓으로 가볍게 튕긴다. 4) 숙달되면 라켓의 앞뒷면을 번갈아 활용하거나 목표 개수를 정해 공을 튕긴다.</p>
