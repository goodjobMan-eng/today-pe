<h1>축구 무릎 리프팅 단계별 연습</h1>
<p>1) 1단계는 공을 무릎으로 가볍게 튕긴 후 바닥에 떨어뜨려 흘려두며 5회 연습한다.2) 2단계는 무릎으로 튕긴 공을 손으로 바로 잡는 동작을 5회 연습한다.3) 숙련되면 무릎으로 연속 2회 이상 튕겨 잡거나 공을 떨어뜨리지 않고 연속 10회 튕기기에 도전한다.</p>
