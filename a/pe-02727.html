<h1>공 이동 및 맨몸 체력 운동 루틴</h1>
<p>1) 다리는 움직이지 않고 몸에서 공이 떨어지지 않도록 다리 라인을 따라 공을 이동시킨다. 2) 런지 자세 후 복부에 힘을 주고 무릎을 앞으로 접어 허리 높이까지 들어 올린다. 3) 한쪽 방향으로 회전하며 두 발로 점프한다. 4) 발을 들어 몸을 V자로 만든 후 무릎을 구부려 가슴 쪽으로 당기며 중심을 잡는다.</p>
