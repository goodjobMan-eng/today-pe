<h1>레인보우 로드</h1>
<p>1) 훌라후프와 원마커를 바닥에 배치하고 매트를 세워 벽을 만든다 2) 음악이 나오는 동안 걷기, 뛰기, 건너뛰기 등으로 이동한다 3) 음악이 멈추면 교사가 외치는 색깔과 도구(훌라후프 또는 패드)를 찾아 이동한다 4) 패드는 1명, 훌라후프는 2명이 차지하며 성공 시 중앙에서 하이파이브를 한다</p>
