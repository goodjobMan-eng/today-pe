<h1>스쿠터보드 전신 협동 주행 챌린지</h1>
<p>1) 반환점 콘을 세우고 출발선에 바퀴 달린 스쿠터보드를 놓은 뒤 2인 1조를 구성한다. 2) 1단계는 보드에 무릎을 꿇고 엎드려 양손으로 바닥을 밀며 콘을 돌아온다. 3) 2단계는 양발을 보드에 얹은 플랭크 자세로 양손을 번갈아 짚으며 전진해 콘을 왕복한다. 4) 3단계는 짝이 발목을 잡고 수레를 밀어주듯 손은 보드를 잡고 상체 힘으로 주행하여 도착선에 먼저 들어오면 승리한다.</p>
