<h1>동적 운동과 신체 조절 운동</h1>
<p>1) 바닥에 놓인 훌라후프를 두 발로 모아 뛰며 3번째와 6번째 원에서 360도 회전한다. 2) 스텝 위로 올라가 반 바퀴 돌며 뛰어내린다. 3) 매트 위에서 앞구르기와 뒤구르기를 한다. 4) 콘 사이를 지그재그로 달린다. 5) 제자리에서 줄넘기를 한다. 6) 짐볼에 엎드려 버틴다. 7) 벽을 향해 물구나무서기를 한다.</p>
