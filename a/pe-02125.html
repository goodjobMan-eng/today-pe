<h1>글자 꽃이 피었습니다</h1>
<p>1) 술래를 1명 정하고 나머지 참가자들은 출발선에 나란히 선다. 2) 술래가 한글 자음 두 글자(예: 이응 이응, 비읍 비읍 등)를 제시하며 &quot;ㅇㅇ ㅇㅇ 글자 꽃이 피었습니다&quot;를 외친다. 3) 술래가 뒤돌아보는 동안 참가자들은 해당 초성으로 시작하는 단어를 외치며 그 단어의 특징을 몸으로 표현한 채 멈춘다. 4) 술래가 돌아봤을 때 움직이거나 제시된 글자에 맞는 단어 동작을 표현하지 못하면 출발선으로 되돌아가거나 탈락한다.</p>
