<h1>School Run (학교를 탈출하자)</h1>
<p>1) 양쪽에서 스틱을 잡은 두 친구가 주자 앞으로 스틱을 바닥에 낮게 대어 준다. 2) 주자는 두 발을 모아 스틱을 깡충 뛰어넘고, 스틱을 잡은 친구들은 스틱을 주자 머리 위로 들어 올려 다시 앞으로 놓아 이동을 돕는다. 3) 주자가 반환점에 도착하면 주자와 스틱 잡은 친구들이 모두 반환점을 돌아 출발선으로 뛰어온다. 4) 다음 주자 앞에 스틱을 놓고 반복 진행하여 마지막 주자 팀이 먼저 들어오면 승리한다.</p>
