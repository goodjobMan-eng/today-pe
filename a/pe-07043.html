<h1>태양 경배 요가 시퀀스</h1>
<p>1) 양발을 골반 너비로 서서 두 손을 높이 뻗어 올린 뒤 상체를 숙인다. 2) 정강이를 짚어 등을 폈다가 바닥을 짚고 엎드려 가슴을 천천히 내린다. 3) 엉덩이를 들어 올리는 동작과 다리를 가슴으로 당겨 앞으로 디디는 전신 스트레칭을 이어간다. 4) 동작 중 긴장을 풀기 위해 소리를 내며 호흡을 유지한다.</p>
