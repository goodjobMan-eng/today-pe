<h1>벽 대고 물구나무서서 앞구르기(도립전전) 연습</h1>
<p>1) 벽을 마주보고 배가 벽 쪽을 향하도록 벽 물구나무서기를 서서 턱을 당기고 어깨로 강하게 밀어올린다.2) 엉덩이와 발끝에 힘을 주고 몸을 일직선으로 유지하며 1~2초간 균형을 잡는다.3) 물구나무 자세에서 몸에 힘을 푼 채 쓰러지지 말고, 힘을 준 상태를 유지하면서 그대로 매트 위로 앞구르기를 진행한다.</p>
