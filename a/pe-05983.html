<h1>블랙홀에 펀스틱 쏙!</h1>
<p>1) 교실 책상 4개를 붙여 가운데 빈 공간(블랙홀)을 만들고 거리에 따라 점수가 적힌 원마커를 배치한다.2) 순서대로 정해진 원마커 위치에서 블랙홀을 향해 펀스틱을 던진다.3) 펀스틱이 블랙홀 안으로 들어가면 해당 점수를 획득하여 모은다.4) 들어가지 않으면 던진 사람(또는 팀 전체)이 점핑잭 2회를 수행한다.5) 준비된 펀스틱이 모두 소진되거나 제한시간이 끝나면 획득한 점수를 합산해 높은 순서대로 순위를 정한다.</p>
