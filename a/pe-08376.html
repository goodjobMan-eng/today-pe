<h1>초등 배구: 1대1 캐치 앤 스로우 랠리</h1>
<p>1) 약 4.5m x 3m 크기의 코트와 약 1.80m 높이의 네트를 사이에 두고 1대1로 마주 선다. 2) 코트 어느 위치에서든 공을 던져 서브하며 랠리를 시작한다. 3) 네트 너머로 넘어온 공을 두 손으로 잡은 뒤 다시 상대편 코트로 던져 넘기며 가능한 한 오랫동안 공을 떨어뜨리지 않고 랠리를 이어간다.</p>
