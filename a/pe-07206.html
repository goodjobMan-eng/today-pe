<h1>부채꼴 공 이어받기</h1>
<p>1) 4~6명으로 모둠을 구성하고 1번부터 끝 번호까지 정한다. 2) 1번 학생이 부채꼴 중심에 서고 나머지 학생들은 부채꼴 호 모양으로 선다. 3) 1번 학생이 공을 던져 주면 다음 번호 학생이 언더 토스(또는 오버 토스)로 정확히 돌려보낸다. 4) 끝 번호까지 공을 주고받으면 중심에 서는 순서를 바꾸어 반복한다.</p>
