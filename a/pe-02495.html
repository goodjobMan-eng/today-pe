<h1>단계별 단체줄넘기 기록 도전</h1>
<p>1) 반별로 20명을 선발하여 2명은 긴 줄을 돌리고 18명은 줄을 넘는다. 2) 1단계는 18명이 1명씩 차례대로 긴 줄을 넘어 반대편으로 이동한다. 3) 2단계는 2명씩 짝을 지어 총 9개 조가 차례대로 넘고, 3단계는 3명씩 6개 조가 차례대로 넘는다. 4) 4단계는 선발된 6명이 동시에 줄 안에 들어가 연속으로 40회를 넘고 마지막 40회를 넘는 순간까지의 전체 시간을 측정한다.</p>
