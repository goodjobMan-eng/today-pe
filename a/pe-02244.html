<h1>모둠 씨름</h1>
<p>1) 4~6명으로 모둠을 나누고 바닥에 지름 6미터 정도의 원을 그린다. 2) 모둠끼리 안쪽을 보며 둥글게 어깨동무를 한다. 3) 원 가운데에서 두 모둠이 어깨를 붙이고 있는 상태로 호각 소리에 맞춰 시작한다. 4) 상대 모둠원을 원 밖으로 밀어내거나 상대 모둠을 넘어뜨리면 이긴다.</p>
