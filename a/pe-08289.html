<h1>스턱 위드 미 (발 붙이고 함께 걷기 협동 놀이)</h1>
<p>1) 두 명씩 짝을 지어 서로 어깨를 감싸 안고 한쪽 발을 상대방의 발등 위에 올립니다. 2) 발이 떨어지지 않도록 구령에 맞춰 함께 한 걸음씩 앞으로 이동합니다. 3) 익숙해지면 인원을 3명, 4명 등으로 늘려 서로 발을 맞대고 연결합니다. 4) 모둠 전체가 발을 붙인 상태에서 바닥의 표시선이나 원마커 표적을 따라 끝까지 이동합니다.</p>
