<h1>가디언스 (팀조끼 꼬리 뺏기 게임)</h1>
<p>1) 각자 팀조끼(비브스)의 가운데를 잡아 바지 뒤에 절반은 걸치고 절반은 밖으로 나오게 꽂는다.2) 신호가 울리면 정해진 구역 안에서 이동하며 상대방의 조끼를 손으로 낚아채 뺏는다.3) 한쪽 팔을 방패처럼 활용해 자신의 조끼를 지키며 끝까지 자신의 조끼를 지켜낸 사람이 승리한다.</p>
