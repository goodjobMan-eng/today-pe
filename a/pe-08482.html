<h1>스파이더맨 술래잡기</h1>
<p>1) 책상을 교실 내에 띄엄띄엄 배치합니다. 2) 술래 2명은 풍선을 들고 도망치는 학생들을 쫓습니다. 3) 다른 학생들은 '스파이더맨'이 되어 책상에 손을 대고 붙어 있다가 다른 책상으로 이동합니다. 4) 술래에게 풍선으로 터치당하면 팔벌려뛰기 5회를 하고 술래가 됩니다.</p>
