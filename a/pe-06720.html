<h1>라켓 조정 및 트래킹 기술 연습</h1>
<p>1) 야구 배트나 라켓 위에 테니스공을 올려놓고 떨어뜨리지 않고 제자리에서 튕기며 중심을 잡는다. 2) 1~2m 거리의 벽과 콘 사이에서 라켓으로 공을 좌우로 컨트롤하며 패스한다. 3) 라켓 위에 콩주머니를 얹어 4~5m 떨어진 훌라후프 안으로 언더핸드 및 오버헤드로 날려 넣는다.</p>
