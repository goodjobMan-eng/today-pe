<h1>교실 피구</h1>
<p>1) 공격과 수비팀을 나누어 공격팀은 바깥쪽에 원을 만들고 수비팀은 원 안쪽에 앉거나 선다. 2) 공격팀은 공을 반드시 바깥 바닥으로 굴려서 수비팀을 맞춘다. 3) 공을 띄워서 맞추거나 공격팀끼리 패스 실수로 공이 나가면 아웃되었던 수비팀 한 명이 다시 들어온다. 4) 소음을 줄이기 위해 말을 하면 아웃되는 침묵 버전으로도 진행할 수 있다.</p>
