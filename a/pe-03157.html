<h1>우리 집 지키기 공 굴리기 게임</h1>
<p>1) 학생들을 공격 모둠과 수비 모둠으로 나누고 모둠 조끼를 착용한다. 2) 수비수는 경기장 안에 서고 각자 옆에 폼 볼링핀을 세워 놓는다. 3) 공격수는 경기장 밖에서 허리를 숙여 안으로 공을 굴려 폼 볼링핀을 쓰러뜨리고, 수비수는 손으로 공을 막아 밖으로 굴려 보낸다. 4) 역할을 바꾸어 게임을 진행하고 정해진 시간 동안 삼각콘(볼링핀)을 가장 많이 지킨 모둠이 승리한다.</p>
