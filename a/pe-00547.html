<h1>줄 따라 뛰는 리듬 점프 상급 트레이닝</h1>
<p>1) 바닥에 일자로 길게 펼쳐 놓은 긴 줄을 사이에 두고 옆으로 섭니다. 2) 박수나 음악 리듬에 맞추어 양발을 모아 줄을 좌우로 넘나들며 리듬감 있게 점프합니다. 3) 일정 박자나 '쿵 쿵쿵' 같은 변형 리듬에 맞춰 점프 템포를 조절합니다. 4) 점프와 동시에 양팔을 어깨 위아래 및 옆으로 벌리는 팔 동작을 결합하여 복합적인 신체 조절 능력을 기릅니다.</p>
