<h1>포트나이트 배트맨 댄스 앤 타바타</h1>
<p>1) 화면 좌측의 포트나이트 배트맨 댄스와 우측의 피트니스 트레이닝 동작 중 수행할 활동을 선택한다. 2) 타이머 신호에 맞춰 20초 동안 선택한 댄스 안무나 맨몸 근력 운동을 리듬에 맞춰 실시한다. 3) 20초 수행 후 10초간 영화 명장면 컷씬을 보며 휴식하고 호흡을 안정시킨다. 4) 다음 사이클마다 댄스와 운동을 번갈아 가며 바꾸거나 난이도를 조절하여 총 8사이클을 완료한다.</p>
