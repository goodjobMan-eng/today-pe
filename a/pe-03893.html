<h1>콘 플립 믹서</h1>
<p>1) 훌라후프 안이나 한 팔 길이 이내에서 콘을 뒤집어 세운다. 2) 콘 플립을 성공하면 악수를 하거나 주먹 인사를 나눈다. 3) 콘 플립에서 이기지 못한 학생은 전체 한 바퀴를 조깅으로 돈다. 4) 조깅을 마친 뒤 손을 들고 있는 다른 친구를 찾아 새 게임을 한다.</p>
