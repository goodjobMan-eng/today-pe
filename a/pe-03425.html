<h1>태권도 공격 기본 기능(지르기 및 차기)</h1>
<p>1) 주춤서기 자세에서 주먹 손등이 위로 오도록 틀어 배꼽과 가슴 사이(몸통), 얼굴, 배꼽 아래(아래)를 지른다. 2) 무릎을 접었다가 앞으로 뻗으며 발 앞축으로 앞차기를 하고 빠르게 발을 내린다. 3) 몸을 90도 회전하며 무릎을 접었다 옆으로 뻗어 발날이나 뒤축으로 옆차기를 한다. 4) 무릎을 접고 몸을 90도 회전해 큰 궤적을 그리며 발등으로 돌려차기를 한다.</p>
