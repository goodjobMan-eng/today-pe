<h1>페이퍼 볼 드롭 챌린지</h1>
<p>1) 플라스틱 컵을 바닥에 놓고 손에 구긴 종이공을 쥔 뒤 팔을 어깨 높이 앞으로 뻗는다. 2) 뻗은 손에서 종이공을 떨어뜨려 컵 안에 바로 넣으면 3점을 얻고, 컵을 맞고 튕겨 나가면 1점을 얻으며, 빗나가면 0점을 얻는다. 3) 공을 떨어뜨린 후 즉시 컵 주변을 갤럽 걸음으로 한 바퀴 돌아 제자리로 돌아온 뒤 다시 시도한다. 4) 1분 동안 제한 시간 안에 최대한 많은 점수를 획득한다.</p>
