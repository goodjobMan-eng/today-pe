<h1>기초 점프 기술 익히기 스테이션 활동</h1>
<p>1) 양발을 모으고 무릎을 굽힌 뒤 팔을 크게 휘두르며 제자리 점프와 한 발 점프 연습을 한다. 2) 지그재그로 놓인 후프를 개구리처럼 양발로 뛴다. 3) 스팟 마커를 따라 포고 점프로 높이 뛴다. 4) 강을 건너듯 점차 넓어지는 기준선을 뛰어넘는다. 5) 미니 허들을 넘으며 전진 및 측면 점프를 하고 대형 공을 점프해서 잡는다.</p>
