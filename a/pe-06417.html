<h1>비행 발명품 디스 오어 댓 트레이닝</h1>
<p>1) 제시되는 두 가지 비행 발명품 중 원하는 쪽을 10초 동안 선택한다.2) 선택한 항목에 배정된 맨몸 운동을 30초 동안 수행한다.3) 라운드별로 런지, 점프, 킥, 카프 레이즈, 코어 트위스트 등의 운동을 이어간다.4) 운동을 모두 마친 후 비행 발명품 및 근육에 관한 퀴즈를 푼다.</p>
