<h1>저학년 공 다루기 및 타깃 볼 게임</h1>
<p>1) 비닐봉지에 신문지를 넣은 맞춤형 공으로 공 던지기와 잡기 감각을 익힙니다. 2) 주먹(몸 젖히기)-가위(비틀기)-보(던지기)의 리듬으로 던지기 기본 동작을 연습합니다. 3) 두 팀으로 나뉘어 구역 라인 너머 서로의 코트로 공을 던지거나 차서 보냅니다. 4) 제한 시간이 끝났을 때 자기 코트에 남은 공의 개수가 적은 팀이 승리합니다.</p>
