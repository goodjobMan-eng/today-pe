<h1>계단 셔플 댄스 챌린지</h1>
<p>1) 제자리에서 발을 번갈아 뻗고 미끄러지는 러닝맨 기본 셔플 스텝을 익힙니다. 2) 기본 스텝에 익숙해지면 계단을 오르내리는 듯한 이동형 셔플 스텝으로 발전시키고, 발을 교차하며 차는 킥 동작과 팔 동작을 스텝 박자에 맞추어 결합합니다. 3) 신나는 음악의 비트에 맞추어 제자리 또는 이동하며 스텝을 연속으로 수행합니다. 4) 친구들과 함께 대형을 맞추어 군무 형태로 계단 셔플 댄스를 완성합니다.</p>
