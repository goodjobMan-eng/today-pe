<h1>콘이랑 언더 캐치</h1>
<p>1) 공이 닿는 팔 부위에 고깔콘을 거꾸로 끼워 착용한다. 2) 마주 선 상대가 빈백을 던져 주면 콘을 낀 상태에서 언더패스 자세를 취한다. 3) 한 발을 앞으로 내밀며 이동하여 고깔콘 속으로 빈백을 정확히 받아낸 뒤 역할을 맞바꾼다.</p>
