<h1>저학년 매트 운동 놀이 (곰 기차·옆구나무서기·구르기 릴레이)</h1>
<p>1) 매트 운동으로 이어지는 팔 지지력과 회전 감각을 기르기 위해, 두 줄 라인 위에서 무릎을 떼고 기어가는 곰 기차를 합니다. 2) 한 발 곰 걷기 등 팔로 체중을 지탱하는 동작을 이어서 수행합니다. 3) 팔로 체중을 지탱하며 발을 띄워 멈추는 옆구나무서기 동작에 도전합니다. 4) 2인 1조로 매트 위에서 데굴데굴 구르며 바톤을 전달하는 릴레이나 볼링 놀이를 진행합니다.</p>
