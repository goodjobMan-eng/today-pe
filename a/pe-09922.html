<h1>앉아서 공 옮기기</h1>
<p>1) 전체 인원을 2팀으로 나누어 팀별로 일렬로 출발선 뒤에 앉아서 대기한다. 2) 첫 주자는 양 손을 몸 뒤로 짚어 엉덩이를 든 후, 배 위에 핸드볼 공을 놓은 채로 앞으로 이동해 반환점(콘)을 찍고 다시 뒤로 돌아온다. 3) 출발선까지 돌아와 핸드볼 공을 대기 중인 다음 주자에게 공을 건네준다. 4) 릴레이로 진행하여 마지막 주자가 가장 먼저 들어온 팀이 승리한다.</p>
