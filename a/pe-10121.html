<h1>빈백 슬라이딩 피구</h1>
<p>1) 양 팀으로 나누어 공 대신 빈백을 바닥에 대고 미는 방식으로 상대 진영에 전달합니다. 2) 바닥을 타고 슬라이딩해 오는 빈백에 맞으면 아웃됩니다. 3) 굴러오는 빈백을 발로 밟아 정지시키면 캐치로 인정되어 아웃되지 않으며, 빈백 개수를 여러 개로 늘려 진행할 수 있습니다.</p>
