<h1>포인트 안무와 주제 표현 프로젝트 수업</h1>
<p>1) 모둠별로 실용음악 1곡을 선정한 뒤 가사의 의미를 탐색하여 핵심 단어를 도출한다. 2) 가사의 특징을 살린 포인트 안무를 만들고 일자형·브이자형 등 다양한 무대 대형을 구성한다. 3) 3~4차시 동안 모둠별로 동작을 연습하고 중간 발표회를 통해 다른 모둠의 피드백을 수용하여 보완한다. 4) 강당에서 의상과 소품을 갖춰 최종 무대 공연을 선보인 뒤 모둠별 작품 설명 영상을 제작하여 감상을 공유한다.</p>
