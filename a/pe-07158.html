<h1>머쉬룸 볼</h1>
<p>1) 경기장 안에 흩어져 있다가 바닥에 던져진 폼볼을 먼저 잡은 사람이 던지는 사람이 된다. 2) 공을 잡은 사람은 최대 세 걸음까지 이동하여 주변의 사람을 맞힐 수 있다. 3) 공에 맞은 사람은 바닥에 쪼그려 앉아 버섯이 되고, 지나가는 생존자를 태그하면 서로 역할을 바꾼다. 4) 바닥에 굴러온 공을 버섯들끼리 인터셉트당하지 않고 모두 패스 연결하면 앉아 있던 버섯들이 모두 다시 일어난다.</p>
