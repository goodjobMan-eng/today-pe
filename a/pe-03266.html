<h1>뜀틀에서 앞구르기</h1>
<p>1) 3걸음에서 5걸음 뒤에서 가볍게 도움닫기를 하여 모둠발로 구름판을 힘차게 밟는다. 2) 뜀틀 높이를 생각하며 구름판과 가까운 쪽에 손을 짚고 몸을 들어올려 뛰어오른다. 3) 몸을 최대한 둥글게 하여 앞구르기를 한다. 4) 엉덩이가 뜀틀에 닿으면 다리를 내리고 무릎을 살짝 구부리면서 착지한다.</p>
