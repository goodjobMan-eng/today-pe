<h1>피구 수비와 캐칭 기술</h1>
<p>1) 사방에서 날아오는 공을 시계 방향 및 무작위 순서로 백스텝과 점프로 피하는 사방 피하기를 한다. 2) 3m 거리 무릎 앉아 받기, 5m 러닝 후 받기, 백스텝 후 받기, 지그재그 이동 캐칭을 5회씩 완수한다. 3) 5m 거리에서 1대1로 공을 던지고 캐칭 후 반격하여 5점을 먼저 내는 대결을 한다. 4) 2대 2 공격 대 수비 게임으로 10m 거리 공격팀 2명이 패스 후 공격하고 수비팀 2명이 피하거나 잡아 점수를 낸다.</p>
