<h1>반대 박수 게임</h1>
<p>1) 교사가 박수를 치면 아이들은 그 횟수의 반대 횟수로 박수를 칩니다. 2) 교사가 1번 치면 아이들은 2번, 교사가 2번 치면 아이들은 1번 박수를 칩니다. 3) 헷갈리지 않고 올바른 횟수로 박수를 쳐서 끝까지 남는 사람이 승리합니다.</p>
