<h1>콘 수집 농구 드리블 릴레이</h1>
<p>1) 코트 한쪽에 3~4개 팀으로 나누어 콘 뒤에 한 줄로 서고 팀별로 농구공 1개씩을 갖는다.2) 신호가 울리면 각 팀의 첫 번째 주자가 공을 드리블하여 구역에 흩어져 있는 콘 하나를 집어 들고 돌아온다.3) 콘을 내려놓고 다음 주자에게 공을 패스하며 모든 콘이 수집되면 가장 많은 콘을 모은 팀이 승리한다.</p>
