<h1>분식집 놀이 (가로세로 달리기)</h1>
<p>1) 교실 분임 대형이나 줄 대형에서 가로줄과 세로줄에 각각 분식집 메뉴 이름(튀김, 라면, 순대, 만두 등)을 지정한다.2) 술래가 특정 메뉴 이름을 외치면 해당 줄에 속한 학생들이 자리에서 일어난다.3) 호명된 학생들은 교실 책상 줄 사이 통로를 따라 가로줄 또는 세로줄 방향으로 달린다.4) 반환점을 돌거나 정해진 코스를 돌아 먼저 자기 자리에 바르게 앉는 학생이 승리한다.</p>
