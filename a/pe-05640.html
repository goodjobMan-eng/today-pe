<h1>플디 후프 20-50-100</h1>
<p>1) 양쪽 팀 앞에 훌라후프를 거리순으로 3개씩 배치하고 가까운 곳부터 20점, 50점, 100점 구역으로 정한다.2) 양 팀 주자가 출발선에서 플라잉디스크를 던져 목표 후프 안에 넣는다.3) 디스크가 후프 안에 들어가면 해당 후프를 자기 팀 진영으로 가지고 온다.4) 더 높은 점수의 후프를 가져와 총합 점수가 높은 팀이 승리한다.</p>
