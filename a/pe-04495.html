<h1>콘 사이 워리어 자세 오버암 스로</h1>
<p>1) 콘 위치에 서서 짝과 거리를 두고 마주 보고 선다. 2) 목표물을 향해 한 손을 뻗고 다른 손의 테니스공으로 귀를 긁는 듯한 전사(워리어) 자세를 취한다. 3) 한 발을 앞으로 내딛으며 머리 위로 테니스공을 던져 짝에게 전달한다. 4) 공을 받은 짝도 같은 방법으로 목표를 가리키고 귀를 긁는 준비 자세 후 던진다.</p>
