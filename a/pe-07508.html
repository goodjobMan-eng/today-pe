<h1>10번 패스하기(공 빼앗기 협동 게임)</h1>
<p>1) 조끼를 입어 두 팀으로 나누고 공을 경기장 안으로 던져 시작한다. 2) 공을 잡은 팀은 상대 팀에게 빼앗기지 않고 연속으로 10번 패스를 성공해야 1점을 얻는다. 3) 공을 잡고 걷는 것은 금지되며 공중에서 공을 가로채거나 신체 접촉 없이 수비 방해를 할 수 있다. 4) 공이 경기장 밖으로 나가면 상대 팀에게 공의 소유권이 넘어간다.</p>
