<h1>산타 스트레칭</h1>
<p>1) 화면에 나오는 전사 1 자세(Warrior 1)를 따라 한다.2) 전사 2 자세(Warrior 2)와 스쿼트(Squat) 동작을 이어 한다.3) 한 발로 균형을 잡고 반대쪽 발로 바꾸어 선다.4) 삼각 자세(Triangle Pose)와 춤의 신 자세(Lord of Dance Pose)를 취한다.5) 엎드려 오른쪽 다리 들기, 왼쪽 다리 들기 후 좌우 사이드 플랭크를 차례로 수행한다.</p>
