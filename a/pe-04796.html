<h1>득템 원마커!</h1>
<p>1) 2번 주자가 공이나 콩주머니를 들고 대기하고, 1번 주자는 출발 신호에 맞춰 원하는 원마커를 밟는다.2) 2번 주자가 던져준 공이나 콩주머니를 원마커에서 발이 벗어나지 않고 잡으면 해당 원마커를 획득한다.3) 획득한 원마커를 가져와 모으고 다음 주자에게 인계하며 가장 많은 원마커를 모은 팀이 승리한다.</p>
