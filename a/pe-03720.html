<h1>스톱 터치 신체 부위 반응 놀이</h1>
<p>1) 부모(술래)는 바닥에 앉고, 어린이는 그 주변을 걷거나 달린다. 2) 부모가 &quot;터치&quot;라고 말하면 바닥을 최대한 빠르게 손으로 터치한다. 3) &quot;엉덩이&quot; 등 특정 신체 부위가 호명되면 해당 부위를 바닥에 빠르게 닿게 한다. 4) 역할을 바꾸거나, 부모의 호명된 신체 부위에 어린이가 직접 터치하는 스킨십 형태로 변형한다.</p>
