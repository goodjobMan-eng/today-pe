<h1>농장 놀이</h1>
<p>1) 경기장 구역을 농장으로 정하고 한쪽 끝에 학생들을 동물(돼지, 소, 양)별로 배치한다. 2) 중앙에 술래인 농부를 세운다. 3) 농부가 특정 동물 이름을 부르면 해당 동물 학생들은 농부에게 잡히지 않고 농장 반대편 끝으로 건너가야 한다. 4) 이동 중 농부에게 잡힌 학생은 농장 둘레를 한 바퀴 돌고 다시 동물들이 있는 곳으로 돌아간다. 5) 농부가 다시 중앙으로 돌아와 다른 동물 이름을 부르며 놀이를 반복한다.</p>
