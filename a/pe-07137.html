<h1>짝과 함께하는 힘찬 움직임과 유연성 조합 운동</h1>
<p>1) 짝과 엎드린 자세에서 체중을 지탱하거나 마주 보고 굴리기·버티기 힘겨루기 놀이를 한다. 2) 수건이나 짝의 팔을 잡고 서로 밀고 당기며 등과 다리 근육의 수축과 이완 스트레칭을 유도한다. 3) 약 5m 간격을 두고 달리기하며 앞사람의 신호 포즈에 맞춰 주위 돌기, 다리 밑 통과 등 복합 동작을 수행한다.</p>
