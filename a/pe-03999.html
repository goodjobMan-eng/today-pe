<h1>화면 동작과 폴리스팟 운동</h1>
<p>1) 화면에 나오는 이동 움직임(걷기·갤럽·스킵 등)을 경계 구역 안에서 자유롭게 수행한다. 2) 호루라기 신호가 울리면 폴리스팟(원마커)을 찾아 올라선다. 3) 화면에 같은 색깔로 제시된 제자리 운동이나 댄스 동작을 수행한다. 4) 매 라운드마다 이동 움직임과 제자리 운동 종목을 바꾼다.</p>
