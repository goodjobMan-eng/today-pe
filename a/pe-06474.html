<h1>핑거 라이트볼 공튀기기 활동</h1>
<p>1) 오른손 바닥으로 공을 살살 쳐서 머리 높이까지 유지하며 떨어뜨리지 않고 20번 튕긴다. 2) 왼손 바닥으로 손을 바꿔 떨어뜨리지 않고 공을 20번 튕긴다. 3) 오른손과 왼손을 번갈아 가며 리듬을 타면서 공을 20번 튕긴다. 4) 오른손 검지 손가락 하나만 사용하여 공을 20번 튕긴다. 5) 왼손 검지 손가락 하나로 공을 20번 튕긴다. 6) 손바닥이나 손가락으로 공을 치며 거실이나 공간에서 원을 그리며 이동한다.</p>
