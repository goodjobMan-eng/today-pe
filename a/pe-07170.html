<h1>식물 대 동물</h1>
<p>1) 콘으로 식물 구역과 동물 구역을 나누고, 술래 2명에게 각각 초록색과 주황색 폼롤러를 준다. 2) 신호가 울리면 초록 술래에게 잡힌 사람은 식물 구역으로, 주황 술래에게 잡힌 사람은 동물 구역으로 이동한다. 3) 모든 사람이 잡히면 더 많은 인원을 모은 팀이 승리하고 패배한 팀에 운동 벌칙(턱점프 10회 등)을 정해준다.</p>
