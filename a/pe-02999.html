<h1>타바타 트레이닝 운동</h1>
<p>1) 20초 운동 후 10초 휴식하는 루틴으로 8회를 반복하여 한 사이클 4분 동안 진행한다. 2) 앞다리 무릎이 발보다 앞으로 나오지 않게 유의하며 상체를 펴고 뒷무릎을 90도로 내리는 런지를 실시한다. 3) 하체가 내려갈 때 무릎이 발보다 나오지 않게 하며 허리를 펴고 정면을 보는 스쿼트를 실시한다. 4) 팔굽혀펴기, 누워 복근 힘으로 발을 올리는 레그레이즈, 발끝과 팔로 버티는 플랭크, 사이드 플랭크, 스트레칭 순으로 진행한다.</p>
