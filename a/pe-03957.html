<h1>필을 찾아라 릴레이</h1>
<p>1) 학급을 6개 모둠으로 나누고 각 모둠은 색깔 콘 뒤에 한 줄로 선다. 2) 차례가 된 학생은 반대편으로 달려가 여러 개의 원마커 중 하나를 뒤집어 확인한다. 3) 원마커 밑에서 캐릭터 그림을 찾으면 마커를 팀으로 가져와 1점을 얻는다. 4) 그림이 없으면 마커를 제자리에 두고 돌아오다가 자기 팀 색깔 마커 위에 멈춰 엄지손가락을 내리는 신호를 보내고, 대기 중인 팀원들이 점핑잭을 완료해야 팀으로 복귀할 수 있다.</p>
