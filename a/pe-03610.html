<h1>플라잉디스크 백핸드 그립 및 짝과 주고받기</h1>
<p>1) 엄지손가락을 위쪽에 넣고 검지와 나머지 손가락으로 디스크를 잡아 백핸드 그립을 만든다. 2) 몸을 살짝 옆으로 틀어 배 쪽에서 손목 스냅을 이용해 짝에게 정확히 던진다. 3) 햄버거 잡기(위아래로 잡기), 치킨처럼 양손으로 잡기, 한 손으로 잡기 중 선택하여 디스크를 받는다. 4) 짝과 함께 3가지 잡기 방법 중 원하는 방식을 활용해 10번을 먼저 연속으로 주고받아 잡는다.</p>
