<h1>공 던지기 놀이</h1>
<p>1) 반을 두 편으로 나누고 각 편에서 술래를 한 명씩 정해 등과 배에 술래 붙임딱지를 붙인다. 2) 반 전체가 경기장 안에 같은 편끼리 나누어 들어간 후 신호에 따라 경기를 시작한다. 3) 상대편에게 공을 던져 맞히되 반드시 가슴보다 낮게 던진다. 4) 공에 맞은 사람은 경기장 밖으로 나가서 상대방을 공격하고 상대편 술래를 먼저 맞히면 이긴다.</p>
