<h1>샷건 올코트 농구 게임</h1>
<p>1) 올코트 중앙에 공을 두고, 시작 신호와 함께 양 팀 선수가 달려 나와 볼을 차지합니다. 2) 공을 확보한 선수는 빠르게 상대 코트로 드리블하여 슛을 시도하거나 뒤따라 들어오는 팀원에게 패스합니다. 3) 시작 신호에 따라 후속 주자들이 순차적으로 코트에 투입되어 수적 우위(속공) 상황이 만들어집니다. 4) 득점에 성공하거나 리바운드가 발생하면 공수가 즉시 전환되어 빠른 전환 플레이를 연습합니다.</p>
