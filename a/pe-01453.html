<h1>줄 탈출 코디네이션 게임</h1>
<p>1) 2인 1조로 줄넘기를 잡고 무릎 높이의 수평 또는 대각선 감옥 장애물 선을 바닥 공간에 설치합니다 2) 도전자들은 몸을 웅크리거나 포복하며 줄에 몸이 닿지 않도록 통과하여 감옥 밖으로 탈출을 시도합니다 3) 줄을 건드리지 않고 반대편으로 완전히 빠져나오면 탈출 성공 점수를 획득하며 터치 시 재도전합니다 4) 줄을 2개 이상 엇갈려 입체 거미줄 구조로 설치하거나 이동 속도를 슬로우 모션으로 제한해 신체 조절력을 높입니다</p>
