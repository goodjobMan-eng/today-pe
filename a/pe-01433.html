<h1>마주 보고 발바닥 밀며 공중 글자 쓰기 놀이</h1>
<p>1) 두 사람이 마주 보고 바닥에 앉아 무릎을 세우고 양 발바닥을 서로 맞닿게 맞춘다. 2) 두 발바닥을 떨어뜨리지 않고 공중에 띄운 상태로 1부터 10까지 숫자를 공중에 크게 그린다. 3) 파트너와 호흡을 맞춰 발바닥이 떨어지지 않고 10까지 완주하면 미션에 성공하여 점수를 획득한다. 4) 손을 바닥에서 떼어 자신의 무릎을 잡은 채로 글자를 쓰거나 글자·도형을 맞히는 퀴즈로 변형한다.</p>
