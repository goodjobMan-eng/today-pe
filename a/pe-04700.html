<h1>더 라스트 쉽</h1>
<p>1) 6개의 스쿠터 보드 위에 체육관 매트를 올려 팀별 배(Ship)를 만든다. 2) 학생들이 매트 사방에 위치하여 협동으로 매트를 밀고 이동한다. 3) 밖으로 나가 아이템(자원)을 획득하여 본부로 가져온다. 4) 모든 자원이 소진되기 전에 가장 많은 아이템을 모은 팀이 승리한다.</p>
