<h1>땅콩놀이</h1>
<p>1) 바닥에 큰 땅콩 모양 놀이판을 그리고, 그 안에 인원수에 맞춰 작은 원들을 그린다. 2) 술래 1명은 땅콩 밖에서 시작하고, 놀래들은 작은 원 안에서 시작한다. 3) 술래는 땅콩 안의 놀래들을 손으로 쳐서 잡고, 작은 원에는 한 명만 들어갈 수 있으며 두 명 이상 들어가거나 발을 걸치면 실격되어 술래가 된다. 4) 술래에게 잡히거나 실격된 사람은 술래가 되며, 늘어난 술래들이 협동해 놀래를 모두 잡으면 끝난다.</p>
