<h1>오버핸드 던지기 학습을 위한 형성평가</h1>
<p>1) 학생들은 짝과 함께 오버핸드 던지기를 연습한다. 2) 한 명은 던지는 동작을 수행하고, 다른 한 명은 코치가 되어 동작을 관찰한다. 3) 코치는 던지는 학생이 정해진 동작(옆으로 서기, 팔 90도 굽히기, 앞발 내딛기, 반대쪽 허벅지 터치)을 수행할 때마다 점수를 부여한다. 4) 동작을 모두 수행하면 2점을 얻는다.</p>
