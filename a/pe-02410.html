<h1>4x4 후프 리듬 점프</h1>
<p>1) 후프나 라인 테이프로 4x4 바둑판 모양의 점프 판을 바닥에 만든다. 2) 교사는 리듬 막대로, 학생들은 박수로 일정한 박자를 맞춰 준다. 3) 박자에 맞춰 점프하며 후프 칸을 이동하며 1단계부터 5단계 스텝을 차례대로 익힌다. 4) 앞 주자가 나가는 박자에 맞춰 다음 주자가 바로 진입하며 끊기지 않고 이어서 스텝을 밟는다.</p>
