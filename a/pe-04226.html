<h1>실내 칸잼 게임</h1>
<p>1) 바구니(칸잼 통)를 세우고 모둠별로 마주 서서 준비한다. 2) 플라잉디스크를 던져 바구니에 맞으면 1점, 직접 들어가면 2점을 얻는다. 3) 통 뒤에 대기하던 팀원이 손으로 쳐서 넣으면 3점을 얻는다. 4) 디스크를 손으로 잡아서 통에 넣는 것은 인정하지 않는다.</p>
