<h1>기초 매트 균형 동작 (포인트 &amp; 패치 밸런스)</h1>
<p>1) 강당에 매트를 1인당 1장씩 배치하고 매트 위에 앉아 대기한다.2) 발과 손을 이용해 지지하는 포인트 밸런스를 실험하고 최소 4초간 정지 상태를 유지한다.3) 손과 발을 쓰지 않고 엉덩이, 등, 배, 무릎 등을 이용하는 패치 밸런스를 실험한다.4) 패치 밸런스 2개와 포인트 밸런스 2개를 원하는 순서대로 엮어 연속 동작을 발표한다.</p>
