<h1>카드길 따라 운동하기</h1>
<p>1) 인원수에 맞추어 색깔이 다른 공을 준비하고, 카드를 모두 모아 뒤집은 상태로 카드길을 만든다. 2) 순서대로 주사위를 던져 나온 숫자만큼 자신의 공을 옮긴다. 3) 공을 옮긴 지점의 카드를 뒤집어 내용에 따라 운동하며, 이미 뒤집힌 카드는 적힌 운동량의 절반만 수행한다. 4) 시작 및 도착 지점으로 먼저 돌아오는 사람이 이긴다.</p>
