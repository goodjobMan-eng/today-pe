<h1>스트리트 댄스 배틀</h1>
<p>1) 학급을 두 모둠으로 나눈 후 가운데 공간을 비워두고 서로 반대편에 일렬로 마주 보고 선다. 2) 음악이 시작되면 각 모둠에서 한 명씩 가운데로 나와 음악에 어울리는 스트리트 댄스 동작을 보여준다. 3) 동작을 마친 학생은 자기 자리로 돌아가고, 다음 순서의 친구들이 차례대로 나와 댄스 동작을 표현한다. 4) 서로의 즉흥적인 움직임 표현이 끝나면 모여 앉아 다른 친구들의 동작을 비난하지 않고 존중하며 감상 소감을 나눈다.</p>
