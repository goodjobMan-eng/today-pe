<h1>패스 앤 런 어라운드</h1>
<p>1) 피더(패서)는 콘 한쪽에 위치한 파트너에게 축구공을 패스한다. 2) 파트너는 공을 받아 인사이드로 다시 패스해 주고 콘 반대편으로 빠르게 이동한다. 3) 피더가 다시 반대편으로 공을 패스하면 파트너가 리턴 패스를 하며 좌우 이동을 반복한다.</p>
