<h1>믹서 피구 (발론 메스클라도르)</h1>
<p>1) 학급을 빨강 팀과 노랑 팀으로 나누고 공을 배분한다. 2) 공을 던져 상대 팀 선수를 맞힌다. 3) 공에 맞은 선수는 상대 진영으로 넘어가 엔드라인(바닥 끝선)을 터치한 뒤 상대 팀으로 소속을 바꾼다. 4) 한 팀의 인원이 모두 상대 팀으로 넘어가 전원 탈락하면 새 라운드를 시작한다.</p>
