<h1>앞구르기의 기본 기능 익히기</h1>
<p>1) 매트에 양발을 모아 서서 양손을 어깨너비로 벌려 매트를 짚고 고개를 숙여 뒤쪽을 바라봅니다. 2) 양발로 매트를 힘있게 밀어 구르며 턱을 당겨 뒷머리가 매트에 닿게 몸을 둥글게 유지합니다. 3) 다리를 감싸 안으며 무릎을 모아 가슴 쪽에 붙이고 일어서서 균형을 유지합니다. 4) 다리 벌려 앞구르기는 등이 닿을 때 무릎을 펴고 다리를 양옆으로 벌린 뒤 양손으로 매트를 밀며 일어섭니다.</p>
