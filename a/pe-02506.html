<h1>공 확실히 운반하기</h1>
<p>1) 경기장 중앙에 여러 종류의 공을 모아 두고 각 팀의 진영을 정해 준비한다. 2) 신호가 울리면 중앙으로 달려가 발로 공을 드리블하여 1회에 1개씩 자신의 팀 진영으로 운반한다. 3) 중앙의 공이 모두 소진되면 공을 가장 많이 모은 팀이 승리한다. 4) 다른 팀 진영의 공을 빼앗아 오거나 반대로 다른 팀 진영에 공을 넣어 공이 가장 적은 팀이 승리하는 방식으로 변형하여 진행한다.</p>
