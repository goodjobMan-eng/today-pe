<h1>리프프로그 태그</h1>
<p>1) 학생들은 체육관에 흩어지고 술래를 1~2명 지정한다. 2) 술래에게 태그된 사람은 개구리처럼 바닥에 웅크려 앉는다. 3) 다른 사람이 다가와 웅크린 사람을 뜀틀 넘듯 뛰어넘어 주면 다시 풀려나 살아난다.</p>
