<h1>5대5 간이 축구 게임</h1>
<p>1) 2개의 축구 골대가 있는 경기장에 5명씩 2개 모둠으로 팀을 구성한다. 2) 공을 몰거나 패스하며 상대 모둠 지역으로 이동해 공격하고, 수비가 공을 빼앗으면 공수가 바뀐다. 3) 골키퍼는 골대 앞에서 손을 포함한 온몸으로 공을 막을 수 있다. 4) 상대 골대에 공을 넣으면 1점을 얻고, 정해진 시간 동안 점수가 더 높은 모둠이 승리한다.</p>
