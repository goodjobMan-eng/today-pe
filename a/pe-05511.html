<h1>늦게 내는 가위바위보 집중놀이</h1>
<p>1) 교사가 손뼉을 치며 &quot;주먹 주먹 짝짝&quot; 등 가위바위보 구령과 박수를 시작한다.2) 학생들은 교사가 낸 손동작을 확인한 뒤 한 박자 늦게 이기는 손동작을 내며 박수를 친다.3) 교사가 구령 패턴이나 동작을 바꾸면 학생들은 집중하여 알맞게 대응한다.</p>
