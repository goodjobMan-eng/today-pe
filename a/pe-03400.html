<h1>상상 컵쌓기</h1>
<p>1) 6명씩 2개 모둠으로 나누고 모둠별로 컵 3개씩 총 6개의 컵을 준비하여 앞의 3명이 컵을 들고 시작한다. 2) 첫 번째 학생이 출발해 도착선 너머에 컵을 내려놓고 돌아와 모둠을 돌아 터치하는 유턴 터치를 한다. 3) 두 번째 학생은 컵을 옆에 나란히 놓고 돌아오며 세 번째 학생은 놓인 컵 2개 위에 컵을 1개 쌓는다. 4) 네 번째 학생부터는 컵을 하나씩 가지고 돌아와 6번째 학생까지 먼저 자리에 앉는 모둠이 승리한다.</p>
