<h1>하계 올림픽 밸런스 선택 운동 브레인 브레이크</h1>
<p>1) 화면에 제시되는 두 가지 올림픽 관련 질문과 선택지를 확인하고 서서 대기한다. 2) 10초 생각 시간 동안 더 선호하는 선택지를 정하고 해당 방향(왼쪽 또는 오른쪽)으로 움직인다. 3) 화면이 전환되면 선택한 쪽에 지정된 신체 운동(댄스, 스트레칭, 버티기, 팔굽혀펴기 등)을 15초간 수행한다. 4) 중간에 삽입되는 육상 3인 달리기 응원 레이스와 다른 그림 찾기 미니게임에 적극 참여한다.</p>
