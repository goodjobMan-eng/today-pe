<h1>팬케이크 로봇 댄스 피트니스</h1>
<p>1) 경쾌한 음악에 맞춰 로봇처럼 절도 있는 자세를 취하며 가볍게 발을 구른다. 2) 가사의 안내에 맞춰 반죽을 젓는 동작, 팬케이크를 뒤집는 손동작을 리듬감 있게 따라 한다. 3) 점핑잭, 로봇 워킹, 하이 점프, 스쿼트 등 유산소 동작을 연속으로 수행하며 심박수를 높인다. 4) 음악 템포 변화에 맞춰 몸을 멈추거나 튕기는 모션을 더해 창의적인 로봇 댄스로 발전시킨다.</p>
