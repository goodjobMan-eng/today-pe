<h1>가위바위보 계란판 탁구공 장기 배틀</h1>
<p>1) 책상 위 30구 계란판의 양쪽 끝 줄(5칸)에 서로 다른 색의 탁구공을 5개씩 일렬로 배치합니다. 2) 마주 앉은 두 참가자가 동시에 가위바위보를 진행하여 승패를 가립니다. 3) 이긴 사람은 바위 1칸, 가위 2칸, 보 3칸씩 전·후·좌·우로 자신의 탁구공을 직선 이동시킵니다(대각선 및 뛰어넘기 불가). 4) 이동한 칸에 상대방 탁구공이 있으면 해당 공을 잡아내며 상대 공을 모두 잡거나 끝선에 도달하면 승리합니다.</p>
