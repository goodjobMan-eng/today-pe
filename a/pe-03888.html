<h1>터보 타임(춤추며 풀려나는 술래잡기)</h1>
<p>1) 마지막 학생이 체육관에 들어오면 특정 이름 첫 글자를 지정하여 술래(Taggers)를 정하고 3분간 게임을 시작한다. 2) 학생들은 누가 술래인지 파악하면서 태그를 당하지 않도록 도망친다. 3) 술래에게 태그를 당한 학생은 그 자리에서 춤을 추고 있어야 한다. 4) 다른 학생이 다가와 똑같은 춤 동작을 따라 해 주면 태그가 풀려 다시 게임에 복귀한다.</p>
