<h1>페트병(콘) 쓰러뜨리기 킥 연습</h1>
<p>1) 전방에 목표물로 페트병(또는 콘)을 세워 둔다.2) 디딤발을 목표물 방향으로 정확히 디딘다.3) 발 안쪽(인사이드)을 이용해 목표물을 조준하고 똑바로 공을 차서 쓰러뜨린다.4) 숙달되면 발등(인스텝)을 곧게 펴서 차는 킥으로도 도전한다.</p>
