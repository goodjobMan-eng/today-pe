<h1>가위바위보 챌린지</h1>
<p>1) 모든 인원이 중앙 구역에서 시작해 가위바위보를 하고 이긴 사람은 1번 코너 구역으로 이동하며 진 사람은 중앙에 남아 이길 때까지 계속한다2) 1번 구역에서 이긴 사람은 2번 구역으로 이동하며 같은 방식으로 4번 코너 구역까지 전진한다3) 4번 코너에서 승리한 사람은 다시 중앙으로 돌아와 점수를 획득하고 중앙에 상대가 있으면 바로 대결하며 없으면 올 때까지 기다린다</p>
