<h1>도전 캐치콕</h1>
<p>1) 1단계는 셔틀콕 깃털 부분을 세 손가락으로 잡고 손목 스냅을 이용해 1m 이상 수직으로 던진 뒤 코르크가 아래를 향할 때 오른손의 스태킹 컵으로 받는다. 2) 2단계는 파트너와 2m 거리를 두고 한 명이 셔틀콕을 대각선 위로 높게 던진다. 3) 파트너는 오른손 스태킹 컵으로 셔틀콕을 받아내고 꺼내어 다시 던져 왕복 2회를 완료한다.</p>
