<h1>배구 스파이크 스윙 연습 (수건·테니스공·페트병)</h1>
<p>1) 끝을 묶은 수건을 잡고 반대 손을 든 상태에서 백스윙 후 큰 원을 그리며 스윙 연습을 한다. 2) 테니스공(또는 말아 쥔 수건)을 위로 토스한 뒤 스파이크 스윙 궤적으로 최고 타점에서 잡아챈다. 3) 500ml 페트병 뚜껑을 잡고 반대 손을 들며 스윙을 반복해 스파이크에 필요한 근력과 폼을 익힌다.</p>
