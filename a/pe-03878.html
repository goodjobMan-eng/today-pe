<h1>캡처 더 콘</h1>
<p>1) 체육관에 각 팀의 구역을 만들고 훌라후프로 감옥을 설치한다. 2) 태그당하지 않고 상대 팀 구역에서 콘을 가져와 자기 구역으로 돌아온다. 3) 태그된 선수는 해당 상대 팀의 감옥으로 이동한다. 4) 팀원이 감옥에 있는 선수를 태그하면 두 선수 모두 손을 들고 자기 구역으로 안전하게 복귀한다.</p>
