<h1>치어리더 기본 동작 따라하기</h1>
<p>1) 다리를 벌렸다가 무릎을 뒤로 굽히며 뛴다.2) 기본 스텝을 하면서 머리 위로 박수를 친다.3) 기본 스텝으로 옆으로 이동하며 머리 위에 손을 올렸다가 앞으로 뻗는다.4) 기본 스텝을 유지하며 손을 옆으로 찔렀다가 바깥으로 펼친 후 음악에 맞춰 반복한다.</p>
