<h1>인간숫자 찾아라 놀이</h1>
<p>1) 인간숫자 팀(번호 조끼 착용)이 자신의 번호와 운동장에 설 위치를 정하고 넓게 흩어진다. 2) 도전 팀(7명씩 3개 팀)은 출발선에 모여 어디서 출발할지 등 이동 전략을 상의한다. 3) 출발 신호가 울리면 도전 팀은 한 줄로 함께 뛰어가 인간숫자 팀의 손바닥을 터치하며 숨겨진 숫자를 확인한다. 4) 번호를 모두 파악한 후 1번부터 7번까지 순서대로 인간숫자를 차례로 터치하고 출발선으로 돌아와 &quot;성공&quot;을 외친다.</p>
