<h1>슛 드릴 게임 (미들슛 편)</h1>
<p>1) 공격 팀과 수비 팀으로 나뉘어 골대 주변 미들 레인지 구역에서 슈팅 훈련을 진행합니다. 2) 1단계는 수비 없이 패스를 주고받은 뒤 지정된 위치에서 미들슛을 던지며 슛 폼과 릴리즈 감각을 익힙니다. 3) 2단계는 수비수가 점차 적극적으로 견제하는 가운데 패스워크로 오픈 찬스를 만들어 슛을 시도합니다. 4) 3단계는 경기와 비슷한 실전 상황에서 빠른 패스 회전과 리바운드 경합을 포함해 슈팅을 성공시킵니다.</p>
