<h1>사방팔방 던지기 야구형 게임</h1>
<p>1) 중앙의 공격용 베이스 좌우 10m에 콘을 두고, 상하 4m에 수비용 베이스를 배치한다.2) 공격수는 공격용 홈베이스에서 사방팔방으로 공을 던지고 콘을 돌아 홈으로 달린다.3) 수비수는 공을 잡아 수비수 3명 이상을 거쳐 수비용 홈베이스로 공을 이어준다.4) 수비보다 먼저 콘을 돌아오면 1점, 반대쪽 콘까지 돌아오면 2점을 얻는다.5) 모든 모둠원이 공격을 마치면 공수를 교대하여 2회 게임 후 득점이 많은 모둠이 이긴다.</p>
