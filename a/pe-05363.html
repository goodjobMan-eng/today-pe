<h1>어부의 엉킨 낚싯줄 풀기</h1>
<p>1) 엉켜 있는 로프(낚싯줄)를 팀별로 배정받고 기준선 밖에서 대기한다.2) 첫 번째 도전에서는 제자리에 서서 발을 떼지 않고 낚싯대를 옆 사람에게 넘겨가며 엉킨 줄을 푼다.3) 두 번째 도전에서는 낚싯대를 다른 사람에게 넘기지 않고 몸을 줄 위아래로 움직여가며 엉킨 줄을 푼다.4) 상대 팀보다 먼저 줄을 완벽하게 풀어내는 팀이 승리한다.</p>
