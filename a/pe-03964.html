<h1>동계올림픽 스키점프 스테이션</h1>
<p>1) 통에서 같은 색깔의 폼 누들 2개를 꺼내 스키 폴처럼 양손에 든다. 2) 양발을 모아 무지개 후프 사이를 스키 점프하듯 통과한다. 3) 매트 위로 올라가 경사/높은 매트에서 평평한 매트로 도약하여 착지한다. 4) 착지한 거리에 본인의 누들 색상과 일치하는 콘을 놓아 기록을 표시하고 다음 시도에서 기록 경신에 도전한다.</p>
