<h1>뜀틀 위에서 앞구르기</h1>
<p>1) 발구름판의 위치를 확인하며 가볍게 도움닫기를 한다 2) 손 짚을 곳을 바라보며 양손을 뻗고 발구르기를 힘차게 하여 엉덩이가 머리보다 높이 올라오도록 뛰어오른다 3) 양손으로 뜀틀 앞부분을 짚고 고개를 깊숙이 넣어 양손-뒷머리-등-허리-엉덩이 순서로 뜀틀에 닿게 하여 구른다 4) 양발이 매트에 닿는 순간 무릎을 살짝 구부려 충격을 줄이고 양팔을 옆으로 뻗으며 착지하여 균형을 잡는다</p>
