<h1>코너 볼 게임</h1>
<p>1) 교실 벽을 바라본 채 엉덩이를 바닥에 대고 앉고, 각 모둠원에게 1~5번까지 번호를 부여합니다. 2) 선생님이 번호를 부르면 그 번호의 학생이 재빠르게 중앙 원마커 위의 빈백을 잡습니다. 3) 빈백을 잡은 사람이 다른 모둠의 빈 공간으로 빈백을 통과시키면 그 모둠의 점수를 1점 가져옵니다. 4) 번호를 부르기 전에 엉덩이를 떼거나 해당 번호가 아닌 사람이 움직이면 점수를 잃습니다.</p>
