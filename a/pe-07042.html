<h1>녹 잇 다운 게임</h1>
<p>1) 두 사람이 가운데에 물병 같은 표적을 두고 마주 보고 선다. 2) 차례대로 공을 던져 가운데의 표적을 맞혀 쓰러뜨린다. 3) 표적을 맞힐 때마다 한 걸음씩 뒤로 물러서서 거리를 넓히거나, 각자 공을 들고 던진 뒤 제자리로 돌아오며 먼저 쓰러뜨리는 사람이 승리한다.</p>
