<h1>뒤죽박죽 카드 쟁탈전</h1>
<p>1) 10부터 1까지 역순으로 카드를 찾고, 추가된 얼음 카드와 찬스 카드를 포함해 총 32장으로 진행한다.2) 얼음 카드를 뽑아 '얼음'을 외치면 다른 팀들은 모두 멈춰야 하며 들고 있는 카드를 빼앗아올 수 있다.3) 찬스 카드를 뽑으면 다른 팀에 방해받지 않고 팀이 필요한 카드를 찾을 때까지 계속 들춰볼 수 있다.</p>
