<h1>부산행 술래잡기</h1>
<p>1) 교사가 첫 번째 좀비(술래)가 되어 학생들을 쫓아간다.2) 교사에게 태그된 첫 번째 학생은 좀비 바이러스에 감염되어 마동석 역할(체비)이 된다.3) 태그된 학생들은 지정된 원마커(스팟) 자리로 가서 앉아 있는다.4) 마동석 역할을 맡은 학생이 5명 정도를 터치해 구출하면 다시 살아나 도망칠 수 있다.5) 마지막까지 살아남은 소수의 학생들을 칭찬하며 게임을 마친다.</p>
