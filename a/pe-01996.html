<h1>다양한 방법으로 물에 뜨기와 호흡하기</h1>
<p>1) 새우등 뜨기, 큰 대자 뜨기, 누워 뜨기, 해파리 뜨기 등 자신에게 편한 자세를 취해 물에 뜬다. 2) 물에 떠 있다가 숨을 쉬기 위해 팔로 물을 누르면서 머리를 수면 위로 들어 호흡한다. 3) 호흡 후 몸이 가라앉으면 다시 기존의 뜨기 자세를 취하고 기다려 떠오르기를 반복한다.</p>
