<h1>철봉 다리 걸어 회전하기 (박쥐·발빼기 돌기)</h1>
<p>1) 낮은 철봉을 엄지손가락까지 감싸 쥐는 바른 엎드려잡기로 양손으로 단단히 잡고 매달립니다. 2) 몸과 철봉 사이 틈새로 두 다리를 들어 올려 앞으로 통과시키며 회전하여 거꾸로 매달렸다가 착지합니다. 3) 반대로 뒤에서부터 회전할 때는 무릎을 굽혀 점프하며 엉덩이를 번쩍 들어 앞으로 굴러가듯 다리를 틈새로 빼냅니다. 4) 회전 후 안전하게 발이 지면에 닿으면 손을 떼고 일어섭니다.</p>
