<h1>고깔 차지하기</h1>
<p>1) 고깔을 둥글게 배치하고 학생들은 고깔 주변에 섭니다. 2) 학생들은 음악과 교사의 동작에 맞춰 원 둘레를 움직입니다. 3) 교사가 고깔의 색깔을 외치면 재빠르게 그 색깔의 고깔을 차지합니다. 4) 고깔을 획득하면 점수 1점을 얻고 제한 시간 동안 목표 점수를 도달한 학생이 승리합니다.</p>
