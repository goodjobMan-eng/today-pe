<h1>공 차서 득점하기 게임</h1>
<p>1) 키커(타자)는 차는 곳에서 5m 간격으로 점수 구역(1, 2, 3, 4점 및 5점)이 표시된 경기장으로 수비가 없는 곳을 향해 공을 찬다. 2) 공이 떨어진 지점에 해당하는 점수를 획득하며, 땅볼로 차도 1점을 얻을 수 있다. 3) 찬 공을 수비수가 후프에 통과시키면 타자는 아웃되어 득점하지 못하며, 모둠원들이 한 번씩 찬 후 합산 점수가 높은 모둠이 이긴다.</p>
