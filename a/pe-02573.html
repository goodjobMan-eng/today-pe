<h1>사이클 스태킹</h1>
<p>1) 3-6-3 스태킹을 업스태킹하고 왼쪽부터 다운스태킹한다. 2) 3-6-3에서 양손에 컵을 2개씩 들고 6-6 스태킹으로 쌓은 뒤 다운스태킹한다. 3) 오른손에 5개, 왼손에 4개의 컵을 잡고 1-10-1 스태킹을 완성한 뒤 다운스태킹한다. 4) 마지막으로 처음과 같이 3-6-3 스태킹 형태로 되돌아와 마무리한다.</p>
