<h1>기초 뜀틀 뛰어넘기 단계별 연습</h1>
<p>1) 뜀틀을 향해 도움닫기 후 구름판에서 양발로 강하게 발구르기를 한다. 2) 뜀틀 앞쪽에 양손을 짚고 뜀틀 위에 걸터앉았다가 앞으로 뛰어내려 무릎을 굽히며 착지한다. 3) 뜀틀 위에서 손을 짚은 채 조금씩 앞으로 이동하여 끝부분을 밀어내며 뛰어내린다. 4) 발구르기와 동시에 양손을 짚고 몸을 띄워 뜀틀 옆쪽으로 회전시켜 무릎을 굽히며 안전하게 착지한다.</p>
