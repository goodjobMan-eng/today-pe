<h1>보석 도둑 놀이</h1>
<p>1) 책상을 십자가 모양으로 배치하고 중앙에 공깃돌 바구니, 각 팀 자리에 바구니를 놓습니다. 2) 맨 앞에 있는 학생이 가위바위보 대결을 하여 이기면 보석을 가져가고, 진 학생은 줄 맨 뒤로 이동합니다. 3) 가위바위보를 비길수록 가져갈 수 있는 보석의 개수가 늘어나며, 제한 시간이 되거나 보석이 없으면 끝납니다.</p>
