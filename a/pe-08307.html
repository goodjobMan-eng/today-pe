<h1>배구 플로터 서브 기본기 연습</h1>
<p>1) 공에 회전이 걸리지 않도록 손바닥 중앙에 얹어 수직으로 올리고 팔이 공을 자연스럽게 따라가는 토스를 연습한다. 2) 공을 올림과 동시에 디딤발을 내딛고 치는 팔의 팔꿈치를 뒤로 당기는 구분 동작으로 서브 자세를 잡는다. 3) 손목을 단단히 고정한 상태에서 처음에는 주먹으로 밀어 쳐보고, 익숙해지면 손바닥으로 쳐서 네트를 넘긴다.</p>
