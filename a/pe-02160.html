<h1>스카프 캐치 및 스텝 운동</h1>
<p>1) 스카프를 작게 뭉쳐 머리 위로 던진 후 떨어지는 스카프를 양손 또는 한 손으로 잡는다. 2) 스카프를 던져 올린 뒤 박수를 1~3회 치고 잡거나 팔 또는 발등에 걸친다. 3) 바닥에 스카프를 일정한 간격으로 깔아두고 색깔을 지정한다. 4) 스카프 위를 두 발 점프나 한 발 켄켄 점프로 차례대로 밟으며 이동한다.</p>
