<h1>축구 인사이드 및 인스텝 슈팅 연습</h1>
<p>1) 디딤발을 공 옆에 나란히 두고 무릎과 상체로 중심을 잡는다. 2) 발 안쪽으로 정확하고 낮게 차려면 인사이드 슈팅을 시도한다. 3) 거리가 멀거나 강하게 찰 때는 발등으로 인스텝 슈팅을 한다. 4) 슈팅 후 발끝을 낮게 유지하여 공이 뜨지 않도록 조절한다.</p>
