<h1>농구 패스 기본 자세와 벽 패스 연습</h1>
<p>1) 다리를 어깨넓이로 벌리고 바닥에 공을 튀기며 공의 탄력과 감각을 익힌다. 2) 체스트 패스는 가슴 앞에서 엄지손가락을 넣으며 양손으로 공을 밀어 던지고, 공을 받을 때는 팔꿈치를 살짝 구부려 가슴 쪽으로 끌어당긴다. 3) 벽의 목표 지점을 향해 제자리 체스트 패스 10회, 원스텝 패스 10회, 투스텝 패스 10회, 오른손/왼손 원핸드 패스 각 10회를 연습한다.</p>
