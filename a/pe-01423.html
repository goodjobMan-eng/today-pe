<h1>손잡고 타이밍 맞추기 짝 전방회전 놀이</h1>
<p>1) 매트 앞에 두 명의 학생이 나란히 서서 안쪽 손을 서로 단단히 맞잡는다. 2) 구령에 맞추어 동시에 웅크려 매트에 머리 뒤쪽을 대며 함께 앞으로 구른다. 3) 회전 후 일어설 때까지 잡은 손을 놓지 않고 두 발로 바르게 착지하면 성공 점수를 얻는다. 4) 잡지 않은 바깥 손도 바닥에 짚지 않는 방식이나 3인 이상으로 인원을 늘려 협동 회전으로 발전시킨다.</p>
