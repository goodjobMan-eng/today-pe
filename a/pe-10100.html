<h1>아카샤 오 코리 (Agacha ou Corre)</h1>
<p>1) 학생들이 원 형태로 모여 서서 공을 서로 주고받습니다. 2) 공을 받은 학생 옆에 있는 친구는 즉시 앉았다가 일어납니다. 3) 동작을 실수하거나 늦은 학생은 원 주위를 한 바퀴 돌아 제자리에 돌아옵니다.</p>
