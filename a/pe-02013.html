<h1>다양한 표적 던져 넣기 놀이</h1>
<p>1) 던지는 사람과 표적 역할을 맡을 사람을 정해 마주 보고 선다. 2) 표적 역할을 맡은 학생은 작은 바구니를 허리 앞에 차거나 들고 움직이지 않고 그대로 선다. 3) 던지는 학생은 정해진 거리에서 바구니를 향해 공이나 물체를 던진다. 4) 거리를 다르게 하여 고정된 표적 안에 공이나 물체를 많이 넣은 학생이나 모둠이 승리한다.</p>
