<h1>가위바위보 릴레이 게임</h1>
<p>1) 4개 팀으로 나누고, 각 팀에서 가위바위보를 잘하는 학생 1명씩을 선발하여 상대 팀 앞에 수비로 배치한다. 2) 접시콘 사이 거리를 약 15m로 유지하고 각 팀 학생들은 출발선에 한 줄로 대기한다. 3) 호각 소리가 나면 맨 앞 학생이 달려나가 상대 팀 수비수와 가위바위보를 한다. 4) 가위바위보에서 이기면 통과 지점으로 이동하고 다음 주자가 출발하며, 지면 출발선의 팀 맨 뒤로 돌아가고 다음 주자가 출발한다.</p>
