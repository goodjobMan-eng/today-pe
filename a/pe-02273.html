<h1>계란판 탁구공 장기 놀이</h1>
<p>1) 두 사람 사이에 계란판을 두고 각자 앞쪽 한 줄에 서로 다른 색깔의 탁구공 5개를 놓는다. 2) 가위바위보를 하여 바위는 1칸, 가위는 2칸, 보는 3칸을 전후좌우로 이동한다. 3) 대각선 이동이나 다른 탁구공을 뛰어넘는 것은 불가능하다. 4) 이동한 위치에 상대의 말이 있으면 따먹으며, 상대 말 5개를 먼저 모두 따내면 승리한다.</p>
