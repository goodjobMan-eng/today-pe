<h1>스쿼트 점핑 삼목</h1>
<p>1) 가위바위보 없이 시작 신호가 울리면 바로 스쿼트를 1회 실시한다.2) 책상 위의 탁구공을 바운드시켜 계란판에 넣는다.3) 공이 들어가지 않아도 매 투구마다 스쿼트 1회를 한 뒤 다시 공을 던진다.4) 계란판에 먼저 3목(가로·세로·대각선)을 완성한 사람이 손을 들고 승리를 표시한다.</p>
