<h1>점프 로프 포 하트 줄넘기 축제</h1>
<p>1) 체육관에 번호가 적힌 콘 45개를 배치하고 콘마다 3가지 크기의 줄넘기와 훌라후프를 준비한다. 2) 학생들을 번호별로 2~3명씩 모둠으로 나누어 각 콘 스테이션에 배정한다. 3) 모둠별로 줄넘기 또는 훌라후프를 자유롭게 선택하여 활동하며 긴 줄넘기와 짝 기술을 연습한다. 4) 1분, 2분, 3분, 4분 동안 쉬지 않고 줄넘기를 연속 성공하면 벽면 명예의 전당에 이름을 올린다.</p>
