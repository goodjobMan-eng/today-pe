<h1>발로 차고 콘을 도는 후프탑 게임</h1>
<p>1) 학생들을 공격 모둠과 수비 모둠으로 나눈다. 2) 공격수는 굴러오는 공을 발등이나 발 안쪽 면으로 차고 삼각콘을 돌아 공격 홈으로 들어온다. 3) 수비수는 공을 잡아 던져서 세워진 후프탑을 모두 쓰러뜨린 후 공을 들고 수비 홈으로 들어온다. 4) 공격수는 수비수가 수비 홈에 들어오기 전까지 삼각콘을 돈 횟수만큼 점수를 얻으며, 전원 공격 후 공수를 교대한다.</p>
