<h1>철봉 무릎 걸고 흔들어 오르기</h1>
<p>1) 양손으로 철봉을 잡고 매달린 상태에서 몸을 뒤로 젖히며 한쪽 무릎을 철봉에 겁니다. 2) 다른 쪽 다리는 곧게 펴서 앞뒤로 반동을 주며 몸을 크게 흔듭니다. 3) 반동이 앞으로 올라오는 타이밍에 맞추어 철봉을 짚고 상체를 강하게 끌어올립니다. 4) 철봉 위로 올라와 팔을 펴고 지지 자세를 완성한 뒤 반대편으로 다리를 빼내어 내려옵니다.</p>
