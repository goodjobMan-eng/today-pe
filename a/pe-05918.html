<h1>드롭 킥 앤 캐치 스테이션</h1>
<p>1) 각자 축구공 하나를 들고 독립된 공간에서 활동을 준비한다.2) 공을 바닥에 떨어뜨려 한 번 튀어 오른 공을 발등(신발 끈 부위)으로 차올린 후 양손으로 잡는다.3) 공을 차올려 양손으로 잡을 때마다 1점씩 획득하며, 양발(왼발·오른발)을 번갈아 연습한다.4) 익숙해지면 공이 바닥에 튀기 전에 떨어지는 공을 바로 차올려 잡는 방식으로 도전한다.</p>
