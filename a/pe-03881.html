<h1>5분 워밍업 루틴</h1>
<p>1) 발을 어깨너비로 벌리고 발가락을 터치하며 햄스트링을 늘린다. 2) 다리를 옆으로 들어 올리는 레그 리프트를 좌우 번갈아 실시한다. 3) 제자리에서 무릎을 가슴 높이까지 힘차게 올리며 뛴다. 4) 팔벌려뛰기(점핑잭)를 진행한 뒤, 점프 없이 스쿼트 동작을 결합한 잭 스쿼트로 마무리한다.</p>
