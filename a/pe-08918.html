<h1>문어놀이</h1>
<p>1) 출발선과 도착선을 표시하여 활동 구역을 정한다. 2) 도망자들은 출발선에 서고 왕문어는 도착선에 선다. 3) 왕문어가 시작 신호를 알리면 도망자 전원은 도착선을 향해 달리고 왕문어는 도망자를 잡는다. 4) 왕문어에게 잡힌 도망자는 잡힌 자리에서 새끼 문어가 되어 다른 도망자를 잡는다.</p>
