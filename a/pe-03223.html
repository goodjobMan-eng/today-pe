<h1>전략 왕복 달리기</h1>
<p>1) 2명씩 두 모둠을 구성하고 출발선에서 5m, 7m, 9m 떨어진 지점에 모둠별로 콘을 세운다. 2) 10초마다 울리는 신호를 듣고 첫 번째 주자가 원하는 거리의 콘을 향해 출발한다. 3) 다음 신호 전까지 돌아오면 콘 거리에 따라 점수(5m 1점, 7m 2점, 9m 3점)를 얻으며, 도착하지 못하면 0점 처리된다. 4) 다음 신호가 울리면 앞사람 도착 여부와 상관없이 다음 사람이 출발하며 정해진 시간 동안 점수를 합산해 승부를 겨룬다.</p>
