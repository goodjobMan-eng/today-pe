<h1>훌라후프 선택 챌린지 (This or That)</h1>
<p>1) 1인당 훌라후프 1개를 준비하고 안전한 자리를 잡는다.2) 화면에 제시되는 두 가지 후프 챌린지 동작 중 하나를 선택한다.3) 선택한 동작을 30초 동안 집중하여 수행한다.4) 라운드마다 새로운 선택지가 주어지며(허리 돌리기 vs 스쿼트, 양팔 돌리기 vs 손가락 돌리기, 줄넘기 넘기, 스킵 등), 마지막 라운드에는 나만의 챌린지 동작을 만들어 수행한다.</p>
