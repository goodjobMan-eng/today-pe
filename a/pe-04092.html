<h1>스쿠터 파트너 릴레이</h1>
<p>1) 2인 1조를 이루어 한 명은 스쿠터보드 위에 양반다리로 앉는다. 2) 파트너가 뒤에서 스쿠터를 밀어 반환점 콘을 돌아 제자리로 돌아온다. 3) 역할을 바꾸어 다른 파트너가 스쿠터를 밀어준다. 4) 변형으로 스쿠터에 앉은 사람이 뒤로 돌아앉아 손잡이를 잡고 발로 뒤로 밀며 이동한다.</p>
