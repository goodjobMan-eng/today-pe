<h1>짝꿍 다리 들기 그네 체조</h1>
<p>1) 한 사람은 바닥에 다리를 쭉 펴고 편안하게 앉고, 파트너는 상대방의 발치 앞에 선다. 2) 서 있는 사람이 앉아 있는 사람의 두 발목을 조심스럽게 잡아 바닥에서 살짝 들어 올린다. 3) 다리를 든 채로 양옆으로 좌우로 살살 흔들어 주며 그네를 타듯 균형과 복부 긴장을 유지하도록 돕는다. 4) 익숙해지면 앞뒤로 흔들거나 높이를 살짝 조절하며 흔들림에 버티는 코어 조절 능력을 기른다.</p>
