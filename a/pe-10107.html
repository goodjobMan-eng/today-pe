<h1>막대 건너기 놀이</h1>
<p>1) 두 명이 짝을 지어 막대를 발로 딛고 균형을 잡으며 이동한다. 2) 바닥에 놓인 통이나 드럼통 위에 막대를 걸쳐놓고 건너는 활동을 한다. 3) 짝과 손을 잡거나 협동하여 떨어지지 않고 막대를 운반한다.</p>
