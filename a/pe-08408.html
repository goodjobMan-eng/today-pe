<h1>배구 오버핸드 패스 단계별 연습</h1>
<p>1) 공을 위로 던지거나 바닥에 튕긴 뒤 공 밑으로 빠르게 이동해 두 발로 멈춰 서서 이마 위에서 오버핸드 자세로 공을 잡는다. 2) 네트 앞 보조자가 띄워주는 공 밑으로 들어가 두 발을 딛고 안정적으로 오버핸드 패스를 연결한다. 3) 엔드라인에서 엎드려 있다가 신호에 맞춰 일어나 앞으로 달려 나오며 긴 공과 짧은 공을 연속해서 오버핸드 패스한다.</p>
