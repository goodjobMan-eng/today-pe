<h1>동그라미 차지하기 게임</h1>
<p>1) 반지름 2m 접시콘 원 4개를 동서남북에 만들고 양 팀은 시작점에 선 뒤 바지에 꼬리 2개씩을 넣는다.2) 공격 팀이 가랑이 사이로 공을 뒤로 전달하거나 굴려 게임을 시작한다.3) 공격 팀은 동그라미 안에 들어가 패스를 받아 영역을 차지하며, 동그라미 4개 중 3개를 차지하면 1점을 얻는다.4) 공을 든 상태로 태그되거나 공을 빼앗기면 공격 기회(총 5회)를 1회 잃고 그 자리에서 다음 공격을 진행한다.</p>
