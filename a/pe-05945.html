<h1>근지구력 홈트 4종 운동</h1>
<p>1) 팔꿈치를 바닥에 대고 엎드려 엉덩이를 든 뒤 몸을 일자로 만들어 배에 힘을 주고 버티는 플랭크를 한다.2) 선 자세에서 발을 앞으로 내밀며 무릎을 굽혀 내려갔다 올라오는 런지를 양발 번갈아 실시한다.3) 발을 어깨너비로 벌리고 손을 앞으로 내민 채 기마 자세(스쿼트)로 내려가 10초간 버틴다.4) 엎드려뻗쳐 자세를 취했다가 일어나며 위로 점프하는 버피테스트를 연속으로 반복한다.</p>
