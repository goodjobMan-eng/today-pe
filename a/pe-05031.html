<h1>아프지 않은 다이빙 앞구르기(뛰어 구르기) 단계별 연습</h1>
<p>1) 뜀틀 3단 높이나 매트 앞에 서서 양팔로 체중을 단단히 받치며 기본 앞구르기를 실시한다2) 구르는 순간 손이 매트에 닿을 때까지 턱을 들지 않고 매트를 주시하다가 팔로 체중을 지탱하며 넘긴다3) 발판(구름판) 위에서 가볍게 점프하며 양손을 멀리 짚고 체중을 받치며 뛰어 구르기를 시도한다4) 도움닫기로 달려와 구름판을 밟고 공중으로 점프한 후 매트에 손을 짚어 부드럽게 구른다</p>
