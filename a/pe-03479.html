<h1>손·발·채를 활용한 공 몰기 기본 기능</h1>
<p>1) 한 손으로 공 몰기를 할 때는 제자리에서 공을 튀기며 몸 앞에서 공이 멀리 벗어나지 않도록 연습한다. 2) 공을 몰며 이동할 때 수비수가 막아서면 공을 좌우로 낮게 튀기며 이동한다. 3) 발로 공을 몰 때는 발에서 멀리 떨어지지 않게 공을 밀듯이 차며, 발의 안쪽과 바깥쪽을 골고루 사용하여 이동한다. 4) 채로 공을 몰 때는 채를 몸 앞에서 짧게 움직이거나 양옆으로 길게 움직이며 공을 몰고 이동한다.</p>
