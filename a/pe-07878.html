<h1>꼬리 잇기 술래잡기(체인 태그)</h1>
<p>1) 술래 1명이 도망자를 잡으러 다닌다. 2) 술래에게 잡힌 사람은 술래와 손을 잡고 연결되어 함께 다른 사람을 잡으러 다닌다. 3) 4명이 잡혀 체인이 되면 둘씩 두 조로 나뉘어 각각 술래가 되거나, 줄을 끊지 않고 계속 길게 이어간다.</p>
