<h1>슈퍼컴퓨터 (키펀치)</h1>
<p>1) 컴퓨터 케이스 역할을 하는 원 안에 1부터 30까지의 숫자를 흩어 놓는다.2) 팀별로 순서를 정해 한 팀씩 원에 들어가 1부터 30까지의 숫자를 반드시 순서대로 밟는다.3) 모둠원 전체가 최소 한 개 이상의 숫자를 밟아야 하며, 원 안에는 한 번에 한 명만 들어갈 수 있다.4) 순서를 틀리거나 동시에 들어가면 5초의 벌칙 시간이 추가되며, 전체 소요 시간을 측정해 단축 경쟁을 한다.</p>
