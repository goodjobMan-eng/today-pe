<h1>지그재그 드리블 및 기술 릴레이</h1>
<p>1) 지그재그로 배치된 콘 사이를 낮은 자세로 드리블하며 콘마다 손을 바꿔 통과한다. 2) 코스 끝에 놓인 후프(원) 안에 도착한다. 3) 후프 안에서 허리 둘레로 공 돌리기 5회 또는 다리 사이로 공 통과하기 5회 등 지정된 기술 과제를 수행한다. 4) 다시 낮은 자세를 유지하고 손가락 끝으로 공을 튕기며 출발선까지 드리블하여 돌아온다.</p>
