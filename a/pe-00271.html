<h1>성장기 학생을 위한 키커지는 놀밥홈트 3강 (근력운동 편)</h1>
<p>1) 실내 제자리에서 교사의 시범과 구령에 맞춰 전신 근력 운동을 시작하며, 양손에 깍지를 끼거나 팔을 뻗어 준비 자세를 잡고 호흡을 가다듬습니다. 2) 다리와 팔을 교차하거나 들어 올리는 동작으로 복근과 하체 근력을 단련합니다. 3) 상체를 숙여 바닥을 짚고 몸을 산 모양처럼 펴주는 자세를 취하며 전신을 자극합니다. 4) 모든 동작을 구령 카운트에 맞춰 일정한 호흡으로 끝까지 완수합니다.</p>
