<h1>디텍티브 피구 (부활 피구)</h1>
<p>1) 양 팀으로 구역을 나누고 중앙선 부근에 피구공 여러 개를 배치해 둔다. 2) 시작 신호와 함께 공을 던져 상대를 맞히며 경기를 진행한다. 3) 공에 맞은 학생은 외곽으로 나가며 자신을 맞힌 상대 선수의 번호나 외모를 기억한다. 4) 자신을 아웃시킨 상대 선수가 다른 공에 맞아 아웃되는 순간 즉시 코트로 부활한다.</p>
