<h1>플라잉디스크 던지고 받는 방법 (백핸드, 포핸드, 받기)</h1>
<p>1) 백핸드 스트로크는 몸을 목표 방향과 90도로 돌린 후 디스크를 뒤에서 앞으로 당기며 던집니다. 2) 포핸드 스트로크는 던지는 손의 반대발을 내딛고 몸 측면에서 디스크를 놓아 던집니다. 3) 날아오는 디스크는 손바닥으로 위아래 박수를 치듯 잡거나 높은 공은 두 손으로 막듯이 잡습니다.</p>
