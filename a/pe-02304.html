<h1>수건 버피텐 10회 왕복 측정</h1>
<p>1) 일반 수건을 한 번 접어 바닥에 두고 수건 뒤에서 대기한다. 2) 시작 구령에 맞춰 양발로 점프하여 수건 좌우 바닥에 착지한 뒤 수건 앞으로 이동해 버피 동작을 실시한다. 3) 다시 점프하여 수건 좌우를 거쳐 수건 뒤로 돌아오는 동작을 1회로 카운트한다. 4) 총 10회를 완료하여 마지막 10회 착지할 때까지의 소요 시간을 측정한다.</p>
