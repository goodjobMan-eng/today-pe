<h1>도구 없이 따라하는 맨손 체조</h1>
<p>1) 심장에서 먼 부위부터 작은 동작에서 큰 동작 순서로 운동을 준비한다. 2) 다리 운동으로 자연스럽게 앉았다 일어나고, 팔과 어깨를 앞뒤로 돌려준다. 3) 한 팔을 머리 위로 넘겨 옆구리를 늘리고 앞뒤 좌우로 목 근육을 풀어준다. 4) 상체를 숙였다 젖히는 등배 운동 후 몸에 힘을 빼고 제자리에서 가볍게 뛴다.</p>
