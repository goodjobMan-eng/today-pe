<h1>수건이나 스카프를 활용한 던지고 잡기 및 기초 체력 운동</h1>
<p>1) 팔벌려뛰기와 좌우 방향 전환 달리기 등 기초 체력 운동을 실시한다. 2) 수건이나 스카프를 공중에 던져 잡는 오버헤드 캐치와 팬케이크 캐치를 연습한다. 3) 점프하여 잡거나 몸을 180도 돌아서 잡는 동작을 연습한다. 4) 스카프를 공중에 던지고 잡은 직후 백핸드, 포핸드, 해머 던지기 자세로 연결한다.</p>
