<h1>인간 체인 술래잡기 (체인 태그 놀이)</h1>
<p>1) 운동장이나 강당 공간에 모든 학생이 흩어져 서고 술래 2명을 선정한다. 2) 신호가 울리면 술래 2명은 손을 잡고 이동하며 도망치는 다른 학생들을 태그한다. 3) 술래에게 태그된 학생은 술래들의 손을 잡고 연결되어 함께 긴 체인을 만든다. 4) 체인이 중간에 끊어진 상태에서 터치한 것은 무효이며, 손을 다시 잡은 상태에서만 유효하게 태그할 수 있다.</p>
