<h1>철봉 기초 오래 매달리기</h1>
<p>1) 매달리기 전에 어깨를 돌리고 손목을 충분히 풀어준다. 2) 철봉을 잡을 때 손을 어깨너비 정도로 벌려 잡는다. 3) 어깨에 힘을 빼고 자연스럽게 매달려 정해진 시간 동안 최대한 버틴다. 4) 처음에는 10초, 점차 20초, 30초, 1분으로 시간을 늘려간다.</p>
