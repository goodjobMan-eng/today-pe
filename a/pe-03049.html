<h1>풍선 언더핸드 패스 연습</h1>
<p>1) 한 손바닥을 다른 손 손등에 대고 감싸며 손목을 아래로 젖혀 팔꿈치를 완전히 편다. 2) 풍선이 떨어지는 지점을 파악해 다리로 빠르게 이동하여 몸의 정면에서 받는다. 3) 무릎을 구부려 자세를 낮추고 무릎을 구부렸다 펴며 두 팔로 공을 밀어 올려 손목 윗부분에 맞춘다. 4) 양반다리로 앉아 1분간 제자리에서 풍선을 위로 올리거나 박수를 치고 받는 연습에 도전한다.</p>
