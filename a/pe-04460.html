<h1>배구 스파이크 및 타구 기초 연습</h1>
<p>1) 두 사람이 각자 콘 위치에 서서 마주보고 짝을 이룬다. 2) 한 사람이 배구공을 자신의 머리 위 높이 던져 올린다. 3) 한 발을 내딛으며 주먹이 아닌 손바닥을 활짝 펴서 하이파이브를 하듯 머리 앞쪽 높은 위치에서 공을 때려 상대에게 보낸다. 4) 맞은편 파트너는 날아온 공을 손으로 잡아 다시 같은 방식으로 스파이크를 연습한다.</p>
