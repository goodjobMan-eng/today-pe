<h1>훌라후프 탈출 게임</h1>
<p>1) 수비수는 양쪽 라인에서 훌라후프나 공을 들고 대기한다.2) 주자는 신호에 맞춰 중앙 통로를 통과하며 반대편으로 달린다.3) 수비수는 훌라후프나 공을 굴려 지나가는 주자를 맞히거나 통과를 저지한다.4) 주자는 속도와 방향을 바꾸며 날아오는 교구를 피해 탈출한다.</p>
