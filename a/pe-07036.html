<h1>중력을 거스르는 풍선 띄우기</h1>
<p>1) 풍선 3개를 준비하고 한 손에 하나씩 들거나 띄울 준비를 합니다. 2) 시작 신호와 함께 1분 타이머를 작동하고 풍선을 공중에 띄웁니다. 3) 1분 동안 발, 팔, 어깨, 머리 등 신체의 모든 부위를 사용하여 풍선이 바닥에 떨어지지 않게 계속 쳐서 띄웁니다.</p>
