<h1>8자 줄넘기 단계별 연습법</h1>
<p>1) 줄을 일자로 바닥에 두고 좌우로 점프하며 앞으로 전진하는 연습을 한다.2) 줄을 흔들어 파도를 만들고 10회 연속으로 넘는다.3) 돌리는 줄에 들어가 연속으로 10회 넘는다.4) 줄에 들어가 5회 뛴 뒤 줄 돌리는 사람의 다리 사이로 빠져나온다.5) 돌고 있는 줄의 타이밍에 맞춰 들어가 3회 뛴 후 밖으로 빠져나온다.6) 3회째 점프하는 도중 다음 사람이 연속으로 줄 안으로 들어가는 방식으로 8자 줄넘기를 완성한다.</p>
