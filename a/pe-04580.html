<h1>글리코 초콜릿 파인애플</h1>
<p>1) 두 사람이 마주 보고 서서 가위바위보를 한다. 2) 구(주먹)로 이기면 '구리코'라고 외치며 세 걸음 전진한다. 3) 쵸(가위)로 이기면 '치오코렛토'라고 외치며 여섯 걸음 전진한다. 4) 파(보)로 이기면 '파이나팟푸루'라고 외치며 여섯 걸음 전진하여 먼저 골인하는 사람이 승리한다.</p>
