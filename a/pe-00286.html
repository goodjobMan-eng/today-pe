<h1>짝꿍 가위바위보 술래잡기 (3월 준비운동·대형연습 놀이)</h1>
<p>1) 학생들이 둘씩 짝을 지어 마주 보고 가위바위보를 합니다. 2) 이긴 사람은 도망자가 되어 즉시 지정된 구역 안으로 도망가고, 진 사람은 술래가 되어 점핑잭(팔벌려뛰기)을 3회 한 후 도망자를 잡으러 갑니다. 3) 도망자가 술래에게 태그되면 그 자리에서 멈춰 다시 둘이 가위바위보를 하여 역할을 새로 정합니다. 4) 정해진 시간 동안 파트너를 유지하며 반복하여 심폐지구력과 순발력을 기릅니다.</p>
