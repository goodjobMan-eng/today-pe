<p>1) 출발 콘과 도착 콘을 세우고 모둠별로 출발선 콘 뒤에 일렬로 섭니다. 2) 교사가 동물의 이름을 외치면 첫 주자가 해당 동물의 걸음걸이와 동작을 흉내 내며 반환점을 돌아옵니다. 3) 돌아와 다음 주자와 하이파이브를 하면 다음 주자가 같은 동물을 흉내 내며 출발합니다.</p>
