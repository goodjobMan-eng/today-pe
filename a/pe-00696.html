<h1>수건 칠변화 놀이 (회전·점프·캐치·타격)</h1>
<p>1) 수건 끝을 묶은 뒤 회전하는 수건을 피해 30초 동안 통과하는 횟수를 겨룹니다. 2) 바닥에서 흔드는 수건에 닿지 않게 점프하며 바닥을 짚는 미션을 수행합니다. 3) 수건을 공처럼 뭉쳐 혼자 또는 짝과 함께 높이 던져 잡는 캐치볼을 진행합니다. 4) 마지막으로 수건을 배트처럼 말아 상대방이 늘어뜨린 수건이나 가벼운 볼을 타격합니다.</p>
