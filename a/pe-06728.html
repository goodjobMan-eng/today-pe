<h1>다양한 도구로 목표물 맞히기 스트라이킹 게임</h1>
<p>1) 학생들은 통에서 원하는 라켓이나 패드 등 타격 도구를 고른다. 2) 짝과 함께 공을 바닥에 튀기거나 떨어뜨려 타격 도구로 친다. 3) 공을 쳐서 네트 넘기기, 원마커 맞히기, 후프 통과시키기 등 다양한 표적 목표물을 맞힌다. 4) 언더핸드 타격만 허용되며, 공과 도구를 바꿔가며 연습한다.</p>
