<h1>캐칭 앤 드로잉 릴레이</h1>
<p>1) 여러 팀으로 나누고 각 팀 앞에 마커를 놓는다.2) 첫 번째 주자 외의 모든 팀원은 공을 가지고 출발 신호 시 첫 번째 마커 뒤에 선 첫 번째 주자에게 공을 던진다.3) 공을 잡으면 해당 마커 위에 공을 놓고 다음 마커로 이동하며, 놓치면 다음 마커로 이동할 수 없고 던지는 사람은 계속 교대한다.4) 마지막 직전 마커까지 공을 채운 주자는 마지막 마커 주위를 돌아오며 가장 먼저 끝낸 팀이 승리한다.</p>
