<h1>더하기 1명 릴레이</h1>
<p>1) 학급을 두 팀으로 나누고 10m 혹은 20m 앞에 반환점을 설치한다.2) 첫 번째 주자가 달려 반환점을 돌고 출발선으로 돌아온다.3) 다음 주자의 손을 잡고 2명이 함께 달려 반환점을 돌아온다.4) 주자를 한 명씩 손을 연결하여 추가하며 전원이 연결되어 먼저 들어오는 팀이 승리한다.</p>
