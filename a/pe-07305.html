<h1>폭탄이 온다</h1>
<p>1) 두 팀은 엔드라인 뒤에 서고 코트 중앙에 메디신볼이나 럭비공 1개를 놓는다. 2) 양 팀은 7~8개의 공을 던져 중앙의 공을 맞춰 상대 진영으로 밀어낸다. 3) 교사의 멈춤 신호에 중앙 공을 상대 코트로 보낸 팀이 이기며, 자기 진영으로 들어온 공만 사용할 수 있다.</p>
