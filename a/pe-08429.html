<h1>가위바위보 터치 등 축구 코디네이션 놀이 4가지</h1>
<p>1) 첫 번째는 가위바위보를 하여 이긴 사람이 도망치는 가위바위보 터치이다. 2) 두 번째는 턴을 하여 도망치는 상대를 터치하는 훈련이다. 3) 세 번째는 쫓아오는 상대의 드리블로 도망치는 드리블 터치이다. 4) 네 번째는 3개의 공을 빨리 모은 사람이 승리하는 볼 모으기이다.</p>
