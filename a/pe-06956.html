<h1>월 볼 (Wall Ball)</h1>
<p>1) 벽면 공간을 지정하고 참가자들은 3~5개의 목숨을 가지고 개인전으로 시작한다 2) 시작 플레이어가 바닥에 공을 먼저 1번 튕겨 벽에 맞도록 스파이크한다 3) 다음 플레이어가 돌아오는 공을 같은 방식으로 벽을 향해 바운드 스파이크하며 실수를 범한 플레이어는 목숨을 1개씩 잃고 최후의 생존자가 승리한다</p>
