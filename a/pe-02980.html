<h1>축구 드리블 기본 4가지 방법 익히기</h1>
<p>1) 발등 드리블: 발등으로 공을 톡톡 치며 앞으로 나아간다. 2) 양발 드리블: 좌우로 움직이며 엄지발가락 쪽(인사이드)으로 공을 톡톡 치며 이동한다. 3) 발바닥 공 끌기: 발 앞꿈치(발가락 쪽)로 공을 디디며 끌어당긴다. 4) 발바닥 밀기/스텝: 발바닥으로 공을 다루며 이동 동작을 연습한다.</p>
