<h1>이지 바스켓 (Easy Basket)</h1>
<p>1) 팀당 5명 이상으로 구성하며 경기는 3~4분씩 진행한다. 2) 양손 드리블이 가능하고 드리블을 멈췄다가 다시 시작할 수 있다. 3) 림을 맞히면 1점, 골인되면 3점, 파울을 얻으면 1점 및 공격권을 획득한다.</p>
