<h1>얼티미트 프리스비 경기 방법</h1>
<p>1) 7 대 7로 경기하며 양 끝의 엔드존을 포함한 필드에서 풀(스로오프)로 시작한다. 2) 디스크를 가진 선수는 달릴 수 없으며 축발(피벗)을 고정한 채 7초 안에 모든 방향·거리로 패스해야 한다. 3) 디스크가 땅에 떨어지거나 장외로 나가거나 가로채이면 공격권이 즉시 수비팀으로 넘어간다. 4) 패스가 상대 엔드존 안에서 완료되면 득점한다.</p>
