<h1>뜀틀에 손 짚고 다리 벌려 걸터앉기</h1>
<p>1) 뜀틀 3~5걸음 뒤에서 도움닫기를 하여 구름판을 힘껏 밟고 뛰어오른다. 2) 뛰어오르며 두 손을 짚을 위치를 바라보고 양팔을 앞으로 뻗으며 몸을 앞쪽으로 기울인다. 3) 양손으로 뜀틀을 짚으면서 두 다리를 최대한 옆으로 벌린다. 4) 양팔로 체중을 버티며 다리를 앞으로 끌어당겨 뜀틀 위에 걸터앉는다.</p>
