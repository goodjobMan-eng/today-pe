<h1>수건공을 활용한 던지기 감각 트레이닝</h1>
<p>1) 수건의 양 끝을 묶어 둥근 수건공 모양을 만듭니다. 2) 바닥에 누운 상태에서 팔꿈치를 반대 손으로 고정하고 수건공을 위로 던져 받는 개인 연습을 합니다. 3) 둘씩 마주 앉아 다리를 뻗은 상태(장좌)에서 상체 회전과 손목 스냅을 이용해 수건공을 주고받습니다. 4) 일어서서 발을 좌우 또는 앞뒤로 넓게 벌리고, 몸통 회전과 무게중심 이동을 활용해 거리를 넓혀 가며 캐치볼을 합니다.</p>
