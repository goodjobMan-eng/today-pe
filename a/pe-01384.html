<h1>초등 플로어볼 미니 하키 경기</h1>
<p>1) 양 팀 골대를 설치하고 필드 플레이어와 골키퍼를 배치하며 스틱과 팀 조끼를 갖춘다. 2) 스틱의 블레이드로 볼을 드리블하거나 패스하며 상대 골문으로 전진한다. 3) 상대 골대 안으로 볼을 슈팅하여 골망을 흔들면 1점을 득점한다. 4) 스틱 헤드를 무릎 이상 올리지 못하게 제한하거나 골키퍼 없이 미니 골대로 변형할 수 있다.</p>
