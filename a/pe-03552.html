<h1>숲 가꾸기</h1>
<p>1) 반 전체를 4개 모둠으로 나누고 모둠별로 순서를 정한다. 2) 출발 신호와 함께 모둠 지역의 콘을 발에 끼운다. 3) 게임장 가운데 사각형 구역 안에 발로 콘을 바르게 세우며, 떨어뜨리거나 두 발이 땅에 닿으면 모둠 맨 뒤로 이동한다. 4) 콘을 세우고 돌아와 다음 주자와 손을 터치하며, 정해진 시간 동안 가장 많이 세운 모둠이 승리한다.</p>
