<h1>양말로 하는 평형성 및 코어 운동</h1>
<p>1) 누운 상태에서 발로 양말공을 잡아 손을 거치거나 발만 사용하여 머리 위 바구니에 옮긴다. 2) 머리에 양말을 얹고 차렷 자세에서 한쪽 다리를 앞·뒤·T자·옆으로 뻗으며 15초간 중심을 잡는다. 3) 바닥에 앉아 다리를 교차하며 다리 사이로 양말을 주고받는 하늘 자전거를 30초간 실시한다. 4) 양발 사이에 양말을 끼우고 팔과 다리를 들어 올려 V자 자세로 15초간 버틴다.</p>
