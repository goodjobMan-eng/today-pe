<h1>병아리 싸움</h1>
<p>1) 인원에 맞춰 코트를 준비한다. 2) 쪼그리고 앉아 양손으로 양쪽 발목을 잡는다. 3) 쪼그리고 앉은 상태로 이동하여 어깨나 등으로 상대를 밀어 넘어뜨린다. 4) 넘어지면 코트 밖으로 나가며, 제한 시간 내에 쓰러지지 않고 남아 있던 사람이 승리한다.</p>
