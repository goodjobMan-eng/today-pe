<h1>라스트 맨 스탠딩</h1>
<p>1) 학생들은 코트 안에서 자유롭게 달리기, 걷기, 점프 등을 하며 움직인다. 2) 음악이 멈추거나 신호가 울리면 앉기, 서기, 무릎 꿇기, 눕기 중 한 가지 자세를 취한다. 3) 술래(교사)가 눈을 감고 외친 자세를 취하고 있던 학생들은 탈락하여 코트 밖에서 지정된 운동(런지, 플랭크 등)을 수행한다.</p>
