<p>1) 벽 앞에 콘을 세워 장애물 구역을 만들고 축구공을 준비합니다. 2) 인사이드, 아웃사이드, 토, 힐 패스를 벽을 향해 차고 튕겨 나오는 공을 발바닥으로 멈춰 세웁니다. 3) 콘 옆에서 벽으로 공을 패스한 뒤 콘 반대편으로 빠르게 이동해 리바운드된 공을 받으며 성공 횟수를 셉니다. 4) 콘 사이 간격을 좁히거나 양발을 번갈아 사용하며 난이도를 높여 도전합니다.</p>
