<h1>스리 볼 (Three Ball)</h1>
<p>1) 정해진 구역 안에 학생들이 흩어져 서고 공 3개를 경기장 안으로 던져 넣는다. 2) 공을 잡은 선수는 이동을 멈추고 피벗만 가능하며 다른 선수에게 공을 던져 맞힌다. 3) 공에 맞은 선수는 구역 밖으로 나가 구역 밖으로 굴러나온 공을 주워 안쪽 선수를 맞히거나 손으로 태그해 자리를 바꾼다.</p>
