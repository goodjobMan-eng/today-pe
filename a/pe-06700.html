<h1>상하체 적응 신체활동 홈트레이닝</h1>
<p>1) 선 채로 어깨 으쓱하기(shrugs)와 양팔 머리 위로 뻗기를 30초~60초간 수행한다. 2) 레터럴 레이즈와 씰 클랩(가슴 열고 닫기), 팔 가위치기, 손목 돌리기 및 복싱 펀치를 실시한다. 3) 하체 운동으로 스텝백 후 무릎 올리기, 제자리 행진, 사이드킥, 스쿼트, 둔근 킥백을 순차적으로 따라 한다.</p>
