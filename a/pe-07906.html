<h1>8분 지속 달리기 체력 테스트 (Klug&amp;Fit)</h1>
<p>1) 배구 코트 모서리에 콘을 설치하고 2인 1조를 구성한다. 2) 한 명은 8분 동안 코트 둘레(1바퀴 60m)를 가능한 한 많이 달리고 파트너는 바퀴 수를 센다. 3) 8분이 끝나면 완주 바퀴 수에 60을 곱한다. 4) 마지막 미완주 구간은 콘 또는 중앙선 통과마다 10m씩 더하여 기록을 측정한다.</p>
