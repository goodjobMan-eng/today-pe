<h1>원마커 얼음땡</h1>
<p>1) 활동 구역 바닥에 원마커를 여러 개 놓고 술래를 정한다. 2) 술래가 친구들을 쫓아다니며 터치하려고 시도한다. 3) 다른 학생들은 술래를 피해 도망치며, 원마커 위에 올라가면 술래에게 잡히지 않는다. 4) 다른 친구가 원마커에 올라간 학생을 터치하면 그 학생은 원마커에서 양보하고 나와야 한다.</p>
