<h1>쥐덫 술래잡기</h1>
<p>1) 팀 B에서 쥐 1명을 정하고, 팀 A에서 쥐를 쫓을 고양이 1명을 지정한다. 2) 신호가 울리면 고양이는 매트로 세워진 벽 사이를 통과하며 20초 안에 쥐를 태그해야 한다. 3) 고양이가 20초 안에 쥐를 태그하면 고양이 팀이 1점을 획득한다. 4) 다음 라운드에서는 직전 고양이가 새로운 쥐가 되고, 상대 팀이 새로운 고양이를 선택해 진행한다.</p>
