<h1>캐치 앤 스텝 (한 걸음 뒤로 던지기)</h1>
<p>1) 2인 1조로 마주 보고 서서 짝마다 공을 1개씩 준비한다. 2) 바운드 없이 공을 던져 상대방이 노바운드로 잡으면 공을 잡은 사람이 뒤로 한 걸음 물러선다. 3) 공을 놓치면 놓친 사람이 앞으로 한 걸음 전진하여 거리를 다시 좁힌다. 4) 던지기 방식을 언더핸드·오버핸드로 바꾸거나 물풍선을 활용해 발전시킬 수 있다.</p>
