<h1>터치 벽 왕복 술래잡기 (Tu pillas)</h1>
<p>1) 경기장 전체(또는 콘으로 나눈 절반 공간)에 학생들을 배치하고 술래를 정한다. 2) 술래가 다른 학생을 터치하여 잡는다. 3) 잡힌 학생은 운동장 반대편 벽으로 가서 벽을 터치하고 정해진 운동 미션(팔굽혀펴기 5회, 스쿼트 등)을 수행한다. 4) 미션을 완료한 학생은 다시 경기장 안으로 돌아와 놀이에 참여한다.</p>
