<h1>왕 지키기</h1>
<p>1) 전체 인원을 4~6인 1조로 나누고, 그 중 1명을 술래, 1명을 왕으로 정합니다. 2) 술래를 제외한 전원은 서로 손을 잡고 원을 만들어 이동합니다. 3) 술래는 원 밖에서 왕을 터치해야 하며, 조원들은 왕을 몸으로 지켜야 합니다. 4) 이때, 팀끼리 잡은 손이 떨어져서는 안 되며 술래를 바꿔가며 진행합니다.</p>
