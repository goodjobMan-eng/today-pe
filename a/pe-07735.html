<h1>배구 기초 체력 및 리시브 연습</h1>
<p>1) 5개의 콘(또는 물건) 사이를 사이드스텝으로 지그재그 이동하여 하체 근육을 단련한다. 2) 바닥에 공이 떨어지는 소리를 듣고 제자리에서 점프한 후 공에 가깝게 이동하는 순발력 훈련을 한다. 3) 파트너가 던져주는 공을 언더핸드 자세로 받아 파트너에게 정확히 넘겨주는 연습을 한다.</p>
