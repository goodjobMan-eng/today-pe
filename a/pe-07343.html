<h1>두 코트 피구 (츠바이 펠더 발)</h1>
<p>1) 파랑 팀과 노랑 팀으로 나누어 각자의 구역에 서서 2개의 공으로 상대 팀원을 맞힌다. 2) 공에 맞은 사람은 바깥쪽으로 돌아 반대편 벤치 위로 이동한다. 3) 같은 팀원이 패스한 공을 벤치 위의 탈락자가 잡으면, 공을 내려놓고 바깥으로 돌아 자기 진영으로 복귀해 부활한다. 4) 한 팀이 상대 팀 전원을 자기 쪽 벤치로 보내면 승리한다.</p>
