<h1>플로어 탁구 (땅 탁구)</h1>
<p>1) 바닥에 지름 1m 내외의 원이나 사각형 구역을 그린다. 2) 첫 서브는 허리보다 낮은 위치에서 언더 스윙으로 지정 구역에 바운드시켜 상대에게 보낸다. 3) 상대방과 번갈아가며 구역 안에 공을 바운드시켜 랠리를 이어가고, 구역에 바운드시키지 못하거나 스트로크하지 못하면 실점한다.</p>
