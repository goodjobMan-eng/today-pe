<h1>연속 투척 변형 스캐터볼</h1>
<p>1) 폼볼 1개를 중앙에 두고 전원 자유롭게 흩어져 대기한다. 2) 공을 잡은 학생이 '스캐터볼'을 외치면 모든 학생은 제자리에 얼음 상태로 멈춘다. 3) 공을 가진 사람은 3보 이내로 이동해 상대 학생의 다리나 몸통을 향해 조준하여 던진다. 4) 공을 맞히지 못하면 가장 가까운 사람이 즉시 공을 주워 다시 외치고, 1명이 아웃될 때까지 멈춤 없이 릴레이로 연속 진행한다.</p>
