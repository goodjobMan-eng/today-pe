<h1>주먹야구 공 받기 기본 기능</h1>
<p>1) 발을 어깨너비만큼 벌리고 무릎을 살짝 굽혀 낮은 기본 수비 자세를 취한다. 2) 날아오는 공의 방향을 끝까지 시선으로 확인한다. 3) 공이 몸에 닿는 순간 양손으로 확실히 잡아 가슴 쪽으로 당겨 충격을 흡수한다. 4) 공을 잡을 때는 주변 동료와 부딪히지 않도록 &quot;마이&quot; 콜을 외친다.</p>
