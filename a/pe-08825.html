<h1>프레하조바나 (잡고 던지는 배구형 게임)</h1>
<p>1) 배구 코트와 네트를 활용하여 3명이 한 팀을 이뤄 경기를 진행한다. 2) 공을 잡고 3걸음까지만 이동할 수 있으며 3번째 패스나 공격 시 반드시 네트를 넘겨야 한다. 3) 첫 번째 공을 잡은 후 바로 공격하거나 네트를 넘길 수 없으며 패스를 거쳐야 한다.</p>
