<h1>진저브레드맨을 쫓는 루돌프 구출 런</h1>
<p>1) 화면에 나타나는 1인칭 장애물을 확인하고 타이밍에 맞춰 점프하거나 숙이며 제자리 달리기를 합니다. 2) 진저브레드맨이 던지는 눈볼이나 장애물을 몸을 좌우로 기울여 순발력 있게 피합니다. 3) 스테이지 중간에 루돌프가 숨은 선물 상자를 찾아 맞히는 미션을 해결합니다. 4) 총 3단계 레벨의 장애물을 모두 돌파하여 잃어버린 루돌프와 선물을 구출합니다.</p>
