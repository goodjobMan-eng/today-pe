<h1>점프 조깅과 스트레칭</h1>
<p>1) 줄넘기, 허들, 훌라후프를 활용한 코스를 준비한다. 2) 학생들은 줄넘기, 조깅, 허들 넘기, 훌라후프 통과하기 활동을 수행한다. 3) 조깅 중 피로를 느끼면 벽에 붙은 스트레칭 그림을 보고 스트레칭을 한다. 4) 2분마다 활동을 교대한다.</p>
