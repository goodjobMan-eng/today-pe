<h1>초등 발야구 기본 규칙 및 경기 방법</h1>
<p>1) 투수가 스트라이크 존으로 공을 굴려주면 타자는 공을 발로 차고 1루로 달린다.2) 타자가 찬 공이 파울 구역을 넘어가 땅에 맞거나 외야에 떨어지면 안타가 되어 주루한다.3) 찬 공이 땅에 닿기 전 수비수가 직접 잡거나, 주자보다 공이 먼저 베이스에 도달하거나 주자를 공으로 태그하면 아웃된다.4) 주자가 1루, 2루, 3루를 차례로 돌아 홈 베이스를 밟으면 1점을 득점한다.</p>
