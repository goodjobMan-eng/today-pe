<h1>실내·체육관 레크 4선 및 트러블 예방 声かけ</h1>
<p>1) 원 모양으로 앉아서 탐정 팀 1팀과 왕상 팀을 정합니다. 2) 왕상 팀은 1분간 왕상의 동작을 3회 이상 바꾸며 따라 합니다. 3) 탐정 팀은 1분 이내에 왕상을 찾습니다. 4) 왕상을 찾은 후 왕상 팀이 누구인지 묻고 왕상이 정답을 외칩니다. 5) 2팀으로 나누어 1팀 15명 내외로 役割(역할)을 정하여 드락에돗찌볼을 진행합니다.</p>
