<h1>양말공을 활용한 3가지 신체활동</h1>
<p>1) 양말을 둥글게 말아 양말공 여러 개를 준비한다. 2) '타깃 회수': 흩뿌려진 양말공을 한 번에 하나씩 목표 지점에 가장 빠른 시간 내에 가져다 놓는다(외발 홉으로 난이도를 높임). 3) '매트 점프 이송': 양말공을 집어 점프로 매트를 건너 다른 매트로 모두 옮긴다. 4) '박스 골인': 양발 사이에 양말공을 끼우고 점프하여 상자(박스) 안에 넣는다.</p>
