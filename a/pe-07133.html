<h1>손발 협응 콘 점프 트레이닝(구파·켄파)</h1>
<p>1) 일렬로 배치된 콘을 따라 앞으로 나아가며 손과 발을 동시에 모으고 벌리는 구파(점핑잭) 점프를 한다. 2) 손이 벌어질 때 발을 모으고 손이 모일 때 발을 벌리는 반대 동작으로 난도를 높여 뛴다. 3) 콘 구간 중앙 지점을 통과할 때 손발 동작의 협응 방식을 반대로 즉각 전환하며 전진한다.</p>
