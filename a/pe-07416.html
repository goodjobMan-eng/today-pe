<h1>낙하산 파도와 색깔 놀이</h1>
<p>1) 낙하산의 빨강·파랑·노랑·초록 색상 중 원하는 색 구역에 다 같이 앉아 색깔을 탐색한다 2) 낙하산 손잡이를 잡고 천천히 흔들며 작은 파도를 만들고, 바람이 거세진다는 신호에 맞춰 크게 흔들어 큰 파도를 만든다 3) 하나, 둘, 셋 구령에 맞춰 낙하산을 번쩍 들어 올린 뒤 그 아래로 들어가 몸을 숨긴다 4) 낙하산 위에 인형(교구)을 올려놓고 손으로 직접 만지지 않고 천을 털어내며 공중으로 띄워 움직인다</p>
