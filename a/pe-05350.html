<h1>어질리티 래더 트레이닝</h1>
<p>1) 래더의 각 칸에 한 발씩 넣으며 빠르게 전진한다.2) 한 칸에 두 발씩 차례로 디디며 더블 스텝으로 통과한다.3) 양발로 각 칸마다 버니홉으로 점프하여 이동한다.4) 스쿼트 자세로 앉아 각 칸마다 점프 스쿼트로 전진한다.5) 네발 기기 자세로 양손과 양발로 각 칸을 짚으며 이동한다.6) 무릎을 팔꿈치에 닿게 당기며 스파이더맨처럼 기어서 이동한다.</p>
