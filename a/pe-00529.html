<h1>낙하물 반응 캐치 놀이</h1>
<p>1) 두 사람이 마주 보고 서서 한 사람이 양손에 접은 장갑이나 작은 물건을 머리 높이로 듭니다. 2) 술래가 예고 없이 양손 중 한쪽의 물건을 아래로 떨어뜨립니다. 3) 맞은편 사람은 물건이 바닥에 닿기 전에 재빨리 손으로 낚아채 잡습니다. 4) 익숙해지면 손의 준비 위치를 머리 위, 배, 등 뒤 등으로 바꾸고 양손 잡기에서 한 손 잡기로 바꾸어 난이도를 높입니다.</p>
