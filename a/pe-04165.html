<h1>잭팟 볼 던지기 받기 놀이</h1>
<p>1) 던지는 사람 1명과 공을 받는 모둠(4~6명)으로 역할을 나누고 목표 점수를 10점으로 정한다. 2) 던지는 사람이 점수와 상태(공중에서 잡는 alive 또는 바닥에 튕긴 후 잡는 dead)를 외치며 공을 던진다. 3) 조건에 맞게 공을 잡은 사람은 해당 점수를 획득해 누적한다. 4) 누적 점수가 10점에 도달하거나 외쳐진 잭팟 공을 잡은 사람이 새로운 던지는 사람이 된다.</p>
