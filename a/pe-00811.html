<h1>마리오 갤럭시 프리즈 댄스</h1>
<p>1) 신나는 음악이 나오는 동안 화면의 캐릭터를 보며 자유롭게 춤을 춥니다. 2) 용암 발판 위로 구멍 뚫린 벽이 다가오면 즉시 춤을 멈추고 벽의 구멍 모양과 똑같은 자세를 취합니다. 3) 정확한 자세를 만들어 벽을 통과하고 발판 아래로 떨어지지 않도록 버팁니다. 4) 매 라운드마다 다양한 정지 자세를 완성하며 끝까지 살아남습니다.</p>
