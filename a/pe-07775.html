<h1>팀 공 태그 놀이</h1>
<p>1) 학급을 여러 팀(노랑, 파랑, 초록, 보라 등)으로 나누고 각 팀별로 팀 조끼를 입는다. 2) 모든 참가자에게 폼볼을 1개씩 나누어 준다. 3) 다른 팀의 팀원을 찾아 손에 든 폼볼로 태그하며, 공을 던지는 행위는 금지된다. 4) 태그당한 사람은 바닥에 앉아 멈추며, 같은 팀원이 공으로 터치해 주면 다시 일어난다.</p>
