<h1>고르디우스의 매듭 풀기 협동 놀이</h1>
<p>1) 학생들이 둥글게 원을 만들고 자신의 두 팔을 교차한다. 2) 서로 다른 두 친구의 손을 한 손씩 맞잡는다. 3) 잡은 손을 절대로 놓지 않고 몸을 넘기거나 비틀면서 얽힌 매듭을 풀어 하나의 큰 원을 만든다.</p>
