<h1>개구리와 수련 잎 놀이</h1>
<p>1) 체육관 빨간 선을 따라 이동 준비를 한다. 2) 음악이 시작되면 빨간 선을 따라 스킵이나 갤럽으로 이동한다. 3) 음악이 멈추면 빨간 선 위에 멈춰 서서 초록색 콩주머니를 훌라후프 중 하나로 던져 넣으면 1점을 얻는다.</p>
