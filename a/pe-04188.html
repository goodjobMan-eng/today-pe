<h1>수레바퀴 걷기 올림픽</h1>
<p>1) 짝을 지어 한 명은 엎드려 양손으로 바닥을 짚고 다른 한 명은 발목을 잡는 수레바퀴 자세를 취한다. 2) 출발 신호에 맞춰 동, 은, 금메달을 나타내는 거리별 콘 3개 중 하나를 목표로 전진한다. 3) 자세가 끊어지거나 무너지지 않고 해당 콘을 돌아 출발선으로 돌아온다. 4) 역할을 바꾸어 다른 콘을 목표로 다시 도전한다.</p>
