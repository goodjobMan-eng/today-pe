<h1>음악줄넘기 초급 5단계 기본 동작</h1>
<p>1) 1회전 2도약은 회전 반경이 커지도록 손목과 팔을 같이 사용하여 줄을 한 번 돌릴 때 두 번 점프를 뛴다. 2) 되돌리기는 첫 동작 시 줄이 옆으로 가지 않고 뒤로 가도록 돌려주며, 왼쪽은 왼손이 오른쪽은 오른손이 허리 뒤쪽으로 이동했다가 줄이 넘어오면 풀어서 넘겨 제자리로 온다. 3) 뒤로 뛰기는 손을 골반 높이에 두고 팔이 아닌 손목을 이용해 줄을 돌린다.</p>
