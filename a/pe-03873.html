<h1>로데오 라운드업 스쿠터 태그</h1>
<p>1) 술래인 카우보이와 카우걸은 대형 스쿠터를 타고 이동하며 도망치는 학생들을 태그한다. 2) 태그된 학생은 코트 중앙에 위치한 마구간으로 이동한다. 3) 보안관 역할을 맡은 참가자가 말을 훌라후프로 끌어 코너의 법원으로 데려가 처리한 뒤 다시 게임에 들여보낸다.</p>
