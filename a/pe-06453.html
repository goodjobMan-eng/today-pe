<h1>코박사를 물리쳐라 홈트 심폐지구력편</h1>
<p>1) 8박자 구령에 맞추어 제자리 걷기 운동을 5세트 수행한다. 2) 10초간 휴식한 후 조금 빠르게 제자리 달리기 운동을 8세트 수행한다. 3) 휴식 후 무릎을 높이 들어 올리는 무릎 꺾기(무릎 올리기) 운동을 6세트 수행한다. 4) 잠시 휴식한 뒤 제자리 줄넘기 동작을 12세트 수행하여 심폐지구력을 기른다.</p>
