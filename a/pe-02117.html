<h1>꼬리잡기 피구</h1>
<p>1) 4명이 한 조가 되어 앞사람의 허리를 잡고 한 줄로 선다(팀당 4~18명). 2) 정식 경기장에서 일반 피구 대형으로 공격과 수비를 진행한다. 3) 공격은 반드시 상대 조의 맨 마지막에 있는 꼬리를 맞춰야 하며, 중간에 있는 사람은 공에 맞아도 아웃되지 않는다. 4) 맨 뒤 꼬리가 공에 맞으면 조원 4명이 모두 아웃되어 외야로 나가 계속 경기를 진행한다.</p>
