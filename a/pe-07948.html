<h1>신문지와 테이프 풍선을 활용한 기초 이동·타격 놀이</h1>
<p>1) 바닥에 신문지 여러 장을 일정한 간격으로 징검다리처럼 배치한다. 2) 테이프를 감아 둥글게 만든 풍선을 손이나 발로 쳐올린다. 3) 각 신문지를 두 발로 번갈아 밟으며 지나가면서 풍선이 바닥에 떨어지지 않도록 계속 쳐낸다.</p>
