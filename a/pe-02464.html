<h1>온라인 전신 스트레칭</h1>
<p>1) 매트에 앉아 깍지를 끼고 목을 앞, 뒤, 좌, 우, 대각선 방향으로 당기며 10초간 호흡하고 천천히 돌려준다. 2) 한 팔을 앞으로 펴고 반대 손으로 손가락을 몸 쪽으로 당겨 손목을 스트레칭한 후 어깨를 교차해 당겨준다. 3) 다리를 펴고 앉아 한쪽 다리를 접은 채 상체를 앞으로 숙여 허벅지와 햄스트링을 늘려주고 다리를 교차해 허리를 비틀어준다. 4) 나비 자세로 발바닥을 맞대고 허리를 곧게 편 후 상체를 숙여 골반을 이완시킨다.</p>
