<h1>핀 프로텍터 (볼링핀 지키기 축구 게임)</h1>
<p>1) 준비운동으로 원마커와 콘 주변에서 발 드리블과 발 기술을 익히고 짝과 패스 및 드리블 연습을 한다. 2) 본 게임에서 각자 자신의 볼링핀을 바닥에 세우고 수비 위치를 잡는다. 3) 축구공을 발로 차서 경기장 안의 다른 사람의 볼링핀을 쓰러뜨린다. 4) 상대의 슛으로부터 자신의 볼링핀이 쓰러지지 않도록 발로 막아 끝까지 지킨다.</p>
