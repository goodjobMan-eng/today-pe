<h1>저글링 공 캐스케이드 및 샤워링</h1>
<p>1) 양손에 공을 하나씩 쥐고 X자로 번갈아 던지며 첫 번째 공이 정점에 있을 때 두 번째 공을 던져 잡는 2공 캐스케이드를 연습한다. 2) 공 세 개에 번호를 매겨 번호 순서대로 연속해서 던져 잡는 3공 캐스케이드를 30초간 연습한다. 3) 한 손에 공 2개를 쥐고 원형 궤도로 번갈아 던져 잡는 샤워링을 양손 각각 연습한다. 4) 샤워링과 캐스케이드를 연속해서 연결하는 저글링 퍼포먼스를 진행한다.</p>
