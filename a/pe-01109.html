<h1>페이퍼 링 돌핀 점프 챌린지</h1>
<p>1) 종이를 길게 말아 연결한 페이퍼 링을 준비하고 양발을 어깨너비로 벌리고 선다. 2) 팔벌려뛰기(점핑잭)를 빠르게 1회 실시한 직후 들고 있던 페이퍼 링을 머리 위 공중으로 던진다. 3) 공중에 뜬 링의 가운데 구멍으로 돌고래처럼 손을 찔러 넣어 팔목에 통과시키며 순발력 있게 잡는다. 4) 60초 타이머 동안 이 동작을 쉬지 않고 반복하여 개인별 목표 횟수(12~16회) 이상 달성에 도전한다.</p>
