<h1>거북이와 사냥꾼 술래</h1>
<p>1) 사냥꾼 술래를 정하고 나머지 참가자는 도망친다.2) 사냥꾼 술래에게 태그된 사람은 다리를 꿇고 엎드려 거북이가 된다.3) 도움을 주는 동물보호가 친구가 대형 스카프를 거북이 등 위에 덮어주면 거북이가 살아난다.4) 스카프의 도움을 받아 살아난 친구가 다음 동물보호가가 되어 다른 거북이를 살려준다.</p>
