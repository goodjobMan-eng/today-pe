<h1>표적 맞히기 볼링형 게임</h1>
<p>1) 엄지와 중지, 약지를 간이 볼링공 구멍에 넣고 공을 잡는다. 2) 어깨에 힘을 빼고 공을 굴릴 방향을 바라보며 선다. 3) 걸음을 내디디며 두 손으로 공을 밀어주듯 팔을 앞으로 뻗었다가 뒤로 들어 올린다. 4) 자세를 낮추어 한쪽 발에 체중을 싣고 공을 밀듯이 굴려 목표물을 넘어뜨린다.</p>
