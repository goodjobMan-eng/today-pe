<h1>블랙 아이드 피스 음악 비트 타바타</h1>
<p>1) 시작 10초 카운트다운 동안 제자리에서 스트레칭을 하며 대기한다. 2) 화면이 초록색으로 바뀌면 20초 동안 점핑잭, 하이니, 푸시업, 스쿼트 등 제시된 전신 맨몸 운동을 전력으로 수행한다. 3) 화면이 빨간색으로 바뀌면 10초 동안 제자리에서 가볍게 호흡을 고르며 휴식한다. 4) 총 8개 인터벌(버피, 복근 킥, 런지 점프 등)을 음악 비트에 맞춰 끝까지 완주한다.</p>
