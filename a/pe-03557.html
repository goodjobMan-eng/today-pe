<h1>가위바위보 유연성 게임</h1>
<p>1) 두 명이 양발을 앞뒤로 붙이고 마주 보고 서서 가위바위보를 한다. 2) 이긴 친구는 앞발을 뒷발 뒤꿈치에 붙여 뒤로 물러선다. 3) 진 친구는 앞발을 앞으로 밀어 이긴 친구의 앞발 끝에 붙인다. 4) 다리를 더 벌릴 수 없을 때까지 게임을 진행하여 승패를 가른다.</p>
