<h1>라켓으로 치기 피드백하며 연습</h1>
<p>1) 4명이 한 조가 되어 마주 보고 라켓으로 셔틀콕을 친다.2) 상대방이 라켓을 내리고 있으면 '라켓 들어'를 외쳐 준다.3) 치고 나서 삼각형 준비 자세를 만들며 연습을 진행한다.4) 신호(얼음)가 울리면 셔틀콕을 가운데 두고 다음 구역(팀 자리)으로 한 칸씩 이동한다.</p>
