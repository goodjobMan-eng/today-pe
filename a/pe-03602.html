<h1>풍선 달리기</h1>
<p>1) 교실 양끝으로 학생들을 길게 앉히고 출발선 반대편에 반환점으로 콘을 놓는다. 2) 첫 번째 주자가 출발선에서 풍선을 들고 출발하여 풍선을 손으로 통통 치며 이동한다. 3) 반환점을 돌아서 출발선으로 돌아오면 의자에 앉아 있던 다음 친구가 풍선을 받아서 출발하고 앞 주자는 맨 뒷자리 빈 의자에 앉는다. 4) 마지막 주자가 반환점을 돌아 출발선에 도착해 풍선을 먼저 가지고 들어온 팀이 승리한다.</p>
