<h1>2인 1조 협동 공 잡기 놀이</h1>
<p>1) 두 사람이 마주 보고 서서 던져진 공을 양손 또는 한손으로 동시에 잡는다. 2) 정면을 본 상태에서 몸 옆으로 던져진 공을 옆구리나 팔로 호흡을 맞춰 멈춘다. 3) 두 사람이 등을 맞대고 돌아서서 날아오는 공을 등 사이로 끼워 잡는다. 4) 엉덩이 높이로 날아오는 공을 두 사람의 엉덩이 사이에 끼워 멈춘다.</p>
