<h1>스노우맨 구출 협동 게임</h1>
<p>1) 각 팀은 인원수보다 1개 더 많은 폴리스팟(예: 학생 3명이면 스팟 4개)을 받고, 맞은편 매트 위에 핀 6개를 세워둔다. 2) 팀원들은 양발을 반드시 스팟 위에만 올려놓은 상태를 유지해야 한다. 3) 가장 뒤에 남은 스팟을 팀원끼리 손으로 앞쪽으로 전달해 바닥에 놓으며 조금씩 전진한다. 4) 맞은편에 도착하면 핀 1개를 챙겨 같은 방식으로 팀 기지 후프까지 안전하게 가져오며 6개를 모두 구출할 때까지 반복한다.</p>
