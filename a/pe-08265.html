<h1>가위바위보 자리 빼앗기</h1>
<p>1) 전원이 의자를 둥글게 놓고 앉고 술래 1명을 정한다. 2) 술래가 앉아 있는 친구에게 다가가 가위바위보를 한다. 3) 술래가 이기면 그 자리를 빼앗고, 진 사람이 새로운 술래가 되어 다른 빈 자리를 찾거나 다른 친구와 가위바위보를 한다. 4) 정해진 제한 시간이 끝났을 때 자리에 앉지 못하고 서 있는 학생이 최종 술래가 된다.</p>
