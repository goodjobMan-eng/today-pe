<h1>교실 의자 맨손체조 준비운동</h1>
<p>1) 의자에 바르게 앉아 깍지를 끼고 팔을 위로 뻗어 상체를 늘려준다. 2) 어깨와 가슴 근육을 풀어주며 팔을 회전하고 기지개를 켠다. 3) 줄이 없는 상태에서 줄넘기하듯 팔을 돌리며 발목과 무릎을 가볍게 들어준다. 4) 한쪽 다리를 뻗어 들어 올리거나 다리를 꼬아 상체를 비틀며 스트레칭한다.</p>
