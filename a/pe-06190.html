<h1>티볼 타격 및 경기 실습</h1>
<p>1) 공격 팀은 타순을 정해 차례대로 앉아서 대기한다.2) 타자는 팔을 펴서 배트 끝이 공에 닿도록 거리를 조절하고 배트를 세워 준비한 뒤, 신호에 맞춰 배트를 뒤로 뺐다가 휘둘러 친다.3) 타격 후 베이스로 달리고, 파울이 3개 누적되거나 수비 태그/송구로 아웃이 발생하면 아웃 처리된다.4) 쓰리아웃이 되면 공수를 교대하며, 득점 시 공격 팀이 점수를 기록한다.</p>
