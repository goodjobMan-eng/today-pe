<h1>플로어볼 기초 기능 익히기</h1>
<p>1) 오른손은 스틱 끝을 잡고 왼손은 아래쪽을 잡아 적당한 힘을 쓸 수 있게 그립을 쥔다. 2) 스틱 양쪽 면을 모두 활용하여 공을 짧게 다루며 드리블한다. 3) 발을 벌리고 체중을 이동하며 동료에게 패스를 주고받는다. 4) 정지해 있는 공을 향해 체중을 실어 정확하게 슛을 시도한다.</p>
