<h1>투호놀이 점수 미션</h1>
<p>1) 인원수에 맞게 모둠을 구성한다(예: 6명씩 4팀). 2) 투호통 앞에 학생 수준에 맞추어 적당한 거리에 원마커를 놓는다. 3) 모둠원이 원마커 위치에서 투호 화살을 2개씩 돌아가며 던진다. 4) 팀별로 통 안에 들어간 개수를 기록하여 합산 점수를 계산한다(예: 1개당 20점).</p>
