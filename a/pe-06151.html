<h1>다양한 방법으로 종이컵 이동시키기</h1>
<p>1) 책상 위에 경계선을 표시하여 종이컵이 이동할 길을 만든 뒤 출발 지점에 종이컵 3개를 놓는다.2) 1단계는 입으로 바람을 불어서, 2단계는 부채질을 해서, 3단계는 풍선의 바람을 빼며 종이컵을 반대편 목표 지점까지 이동시킨다.3) 종이컵이 책상 아래로 떨어지면 점핑잭(팔벌려뛰기)을 2회 수행한 후 다시 올려놓고 계속 진행한다.</p>
