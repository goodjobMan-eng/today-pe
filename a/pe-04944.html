<h1>야구 트레이닝: 글러브 캐칭 기초</h1>
<p>1) 글러브를 낀 팔을 크게 한 바퀴 돌려 팔꿈치를 몸 앞쪽으로 가져온다.2) 팔꿈치가 몸 앞에 온 상태에서 손목을 돌려 글러브 안쪽 면이 정면(상대방 쪽)을 향하게 한다.3) 글러브 속에서 검지를 똑바로 세우고 손바닥을 상대에게 향한다.4) 날아오는 공을 검지와 중지 뿌리 부근에 오도록 맞추며 글러브로 쥐어 잡는다.</p>
