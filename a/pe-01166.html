<h1>장막 블라인드 까꿍 이름 맞히기 놀이</h1>
<p>1) 두 팀으로 나뉘어 담요나 장막을 가운데 두고 마주 보고 앉은 뒤, 장막 바로 앞에 원마커 자리를 지정한다. 2) 각 팀에서 대표 1명씩을 몰래 선발하여 장막 바로 앞 마커 자리에 서로 보이지 않게 밀착해 앉힌다. 3) 진행자와 전체 학생이 &quot;하나, 둘, 셋, 까꿍!&quot;을 외치며 장막을 신속하게 바닥으로 내린다. 4) 장막이 내려가는 즉시 마주 본 상대방의 이름을 먼저 큰 소리로 외친 학생의 팀이 1점을 획득한다.</p>
