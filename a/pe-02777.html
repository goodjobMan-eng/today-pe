<h1>초등 체육 준비운동 스트레칭 체조</h1>
<p>1) 목 운동으로 고개를 좌우로 천천히 돌려준다. 2) 어깨 돌리기와 허리 돌리기를 구령에 맞추어 좌우로 실시한다. 3) 무릎 돌리기, 무릎 짧게/길게 누르기, 발목 돌리기를 차례로 수행한다. 4) 손깍지 끼고 목 늘려주기와 팔벌려뛰기로 전신을 풀어 준비운동을 마무리한다.</p>
