<h1>달걀판 탁구 놀이</h1>
<p>1) 공을 라켓이나 손으로 바닥에 한 번 튕겨 달걀판 안으로 골인시킨다. 2) 달걀판에 칠해진 색깔에 따라 파랑색은 5점, 초록색은 3점, 주황색은 1점을 얻는다. 3) 한 사람당 3번의 기회가 주어지며 합산 점수가 높은 사람이 승리한다.</p>
