<h1>플로어볼 브리티시 불독 드리블 게임</h1>
<p>1) 참가자들은 반대편 라인에 서고 술래는 중앙에 선다. 2) 시작 신호가 울리면 참가자들은 술래를 피해 플로어볼 스틱으로 숏 드리블이나 롱 드리블을 하며 맞은편 라인까지 이동한다. 3) 술래는 드리블하는 사람의 공을 빼앗아 옆 라인 밖으로 쳐내며 공을 빼앗긴 사람은 술래 팀이 된다. 4) 다음 판부터는 늘어난 술래들을 피해 이동하며 끝까지 살아남는 최후의 1인이 승리한다.</p>
