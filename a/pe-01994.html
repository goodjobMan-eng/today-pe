<h1>추크볼 기초 규칙 및 득점 연습</h1>
<p>1) 공을 가진 상태에서 세 발 이상 걷지 않고(3보 이내), 드리블 없이 오직 패스만으로 이동한다. 2) 공을 잡은 후 3초 이내에 패스하거나 바운더를 향해 슛을 시도한다. 3) 같은 팀끼리 연속 패스는 최대 3회까지만 가능하며 3회 이내에 슛을 해야 한다. 4) 바운더에 슛을 던져 튕겨 나온 공이 진입 금지 구역(포비든 존) 밖의 바닥에 떨어지면 1점을 얻는다.</p>
