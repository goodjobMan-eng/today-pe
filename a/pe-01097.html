<h1>줄넘기 거미줄 스파이더웹 챌린지</h1>
<p>1) 줄넘기를 양손에 잡고 기본 준비 자세를 취하며 도전을 준비한다. 2) 줄넘기를 한쪽 팔에 걸쳐 올린 뒤 손과 팔 사이 공간으로 줄을 교차시켜 거미줄 모양을 만든다. 3) 거미줄 형태를 완성한 상태를 유지하거나 모양을 유지한 채 제자리 점프에 성공한다. 4) 아래에서부터 줄을 끌어올려 단번에 거미줄 모양을 만들거나 연속 점프 동작으로 연결한다.</p>
