<h1>축구공 단계별 리프팅 마스터</h1>
<p>1) 원마커 위에 서서 축구공을 양손으로 들고 준비 자세를 취한다. 2) 바운드된 공을 발등 중심(신발 끈 부위)으로 차올린 뒤 바닥에 떨어뜨리거나 손으로 잡는 연습부터 시작한다. 3) 공을 손에서 바로 떨어뜨려 발등으로 차올린 후 손으로 잡고, 점차 횟수를 늘려 연속 10회에 도전한다. 4) 발등 리프팅에 익숙해지면 무릎 각도를 지면과 수평으로 들어 올리는 허벅지 리프팅과 헤딩 리프팅으로 단계를 확장한다.</p>
