<h1>농구 드리블 기본 및 응용 연습</h1>
<p>1) 오른손 팔꿈치로 인사하며 평소 잘 쓰지 않는 반대 손으로 공을 튀긴다. 2) 제자리에서 눈을 감고 드리블하거나 자세를 서기, 앉기, 엎드리기, 눕기로 바꾸며 드리블을 유지한다. 3) 다리 사이로 공을 통과시키거나 두 개의 공을 동시에 양손으로 드리블하고, 짝과 1대 1로 공 뺏기를 진행한다.</p>
