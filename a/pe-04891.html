<h1>꼭두각시 인형 몸 조절 협응 운동</h1>
<p>1) 오른손을 들면서 동시에 왼 다리를 들어 올립니다.2) 반대쪽인 왼손을 들면서 동시에 오른 다리를 들어 올립니다.3) 한쪽 발의 뒤꿈치만 엉덩이에 닿도록 무릎을 뒤로 접어 올립니다.4) 반대쪽 발의 뒤꿈치도 번갈아 뒤로 접어 엉덩이에 닿게 올립니다.5) 손을 올리는 동작과 뒤꿈치를 들어 올리는 동작을 동시에 연결하여 수행합니다.</p>
