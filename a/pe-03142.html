<h1>친구와 함께 맨손체조 하기</h1>
<p>1) 제자리에 서서 친구와 발맞춰 걷는다. 2) 친구와 등을 마주 대고 서서 한 명이 왼쪽으로 몸통을 틀면 다른 한 명은 오른쪽으로 틀어 서로 손을 마주댄다. 3) 친구와 마주 보고 서서 왼손으로 친구 어깨를 잡고 오른손으로 오른발을 잡아 뒤로 당긴다. 4) 친구와 마주 보고 양팔을 뻗어 서로 어깨를 잡고 허리를 숙여 열까지 세며, 등을 대고 앉거나 마주보고 앉아 스트레칭을 실시한다.</p>
