<h1>홀리데이 8개 체육 스테이션</h1>
<p>1) 쿠키 교환: 한 명은 라켓으로 콩주머니를 띄워 보내고 파트너는 뚜껑으로 받는다. 2) 썰매 타기: 한 명은 스쿠터를 타고 풀누들을 잡으며 파트너는 루돌프가 되어 걸어서 끈다. 3) 눈싸움: 콘 뒤에서 3개의 눈싸움 공을 던져 볼링핀을 쓰러뜨린다. 4) 스노보드: 파트너가 30초 모래시계를 재는 동안 밸런스 보드 위에서 균형을 잡는다.</p>
