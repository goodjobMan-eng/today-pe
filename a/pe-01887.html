<h1>음악 캐치볼 태그 놀이</h1>
<p>1) 두 명씩 짝을 지어 강당 곳곳에 넓게 흩어지고 짝마다 부드러운 폼볼 1개씩을 나누어 갖는다. 2) 음악이 흘러나오는 동안 두 사람은 일정 거리를 유지하며 공을 안정적으로 주고받는 캐치볼을 한다. 3) 음악이 갑자기 멈추는 순간 공을 들고 있던 학생이 술래가 되어 짝을 쫓아가 공으로 태그한다. 4) 손에 쥔 공으로 터치하는 방식 대신 허리 아래를 향해 살짝 던져 맞히는 피구 방식으로 변형할 수 있다.</p>
