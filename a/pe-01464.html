<h1>개인 수건 활용 3단계 점프·스트레칭·캐치 놀이</h1>
<p>1) 학생 각자 수건을 바닥에 작게 접어두고 양발로 점프하여 넘나드는 기초 점프를 실시한다. 2) 수건을 넓게 펼쳐 거리를 넓히며 제자리 점프와 지그재그 점프 도전을 이어간다. 3) 수건 양끝을 잡고 팔을 머리 위로 돌려 어깨 유연성을 기르고 등 뒤와 다리 밑으로 수건을 통과시킨다. 4) 수건을 두 번 매듭지어 둥근 공처럼 만든 뒤 위로 던져 박수를 치거나 머리를 만지고 잡는 캐치 놀이로 발전시킨다.</p>
