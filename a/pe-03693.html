<h1>변신 술래잡기</h1>
<p>1) 술래에게 터치되면 그 자리에서 술래가 지시한 동물 흉내를 낸다. 2) 터치되지 않고 도망치는 사람이 무슨 흉내인지 맞히면 풀려나 다시 도망친다. 3) 맞혀줄 때까지 계속해서 동작을 취한다. 4) 술래를 늘리거나 동물이 아닌 스포츠 동작을 흉내 내는 방식으로 변형할 수 있다.</p>
