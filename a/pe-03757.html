<h1>공 굴리기 유연성 운동</h1>
<p>1) 무릎을 구부린 자세에서 상체를 숙이고 몸 주변으로 공을 굴린다. 2) 숨을 천천히 내쉬며 힘을 뺀 상태로 공을 굴린다. 3) 다리를 벌리는 개각 자세나 다리를 펴고 앉는 장좌 자세 등 자세를 바꾸어 가며 실시한다. 4) 공의 크기를 작게 바꾸는 등 용구를 다양하게 활용하여 운동한다.</p>
