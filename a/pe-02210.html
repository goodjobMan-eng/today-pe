<h1>축구 타깃 사격 슈팅 대결</h1>
<p>1) 골대 그물에 대형 과녁 현수막을 설치하고 일정 거리 떨어진 슈팅 지점을 정한다. 2) 참가자는 순서를 정해 1인당 5번씩 차례대로 축구공 슈팅을 시도한다. 3) 과녁에 맞은 구역의 점수(중앙에 가까울수록 높은 점수)를 기록지에 합산한다. 4) 5번의 슈팅이 끝난 뒤 합산 점수가 가장 높은 참가자가 승리한다.</p>
