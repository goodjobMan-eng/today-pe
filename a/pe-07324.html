<h1>본진으로 돌아와라 술래잡기</h1>
<p>1) 4개 팀이 각각 2명씩 짝을 이루고 각자 1번과 2번 번호를 부여받는다. 2) 교사가 한 숫자를 부르면 해당 번호의 선수는 다른 팀 진영으로 달려가 다른 색 스카프를 가져온다. 3) 불리지 않은 파트너는 자기 진영의 스카프를 지키기 위해 침입한 상대 선수를 태그한다. 4) 태그당한 선수는 스카프를 제자리에 두고 본진으로 돌아가며, 무사히 스카프를 가져오면 1점을 얻는다.</p>
