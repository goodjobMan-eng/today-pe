<h1>집콕 폴디 유산소 볼링 게임</h1>
<p>1) 60초 타이머를 설정한다. 2) 출발선에서 플라잉디스크를 던져 4개의 종이컵을 모두 쓰러뜨린다. 3) 1분 이내에 모두 쓰러뜨리면 성공이다. 4) 실패 시 플라잉디스크를 주워와 다시 던지거나, 종이컵 장애물을 돌아와 재도전한다.</p>
