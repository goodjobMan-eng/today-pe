<h1>투게더 바스켓 혼자 및 짝 도전 활동</h1>
<p>1) 혼자 공을 던져 잡고, 바운드 후 잡고, 던진 뒤 박수 치기, 바운드 후 박수 치기, 뒤로 한 칸 이동해 바운드 후 한 바퀴 돌아 잡기를 연습한다. 2) 두 명이 마주보고 서서 각자 공 던져 잡기와 바운드 잡기를 한 후 오른쪽 및 왼쪽으로 한 칸씩 이동하며 공을 잡는다. 3) 뒤로 한 걸음 이동하여 바운드 후 제자리에서 한 바퀴를 돌고 떨어지는 공을 잡으며 호흡을 맞춘다.</p>
