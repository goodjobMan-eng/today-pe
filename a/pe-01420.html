<h1>고양이 자세와 C자 골반 코디네이션</h1>
<p>1) 바닥에 양손과 무릎을 대고 네 발 기기 자세를 취해 척추와 골반을 정렬한다. 2) 등을 둥글게 말아 골반을 위로 끌어올렸다가 반대로 젖히며 상하 골반 움직임을 5회 반복한다. 3) 시선을 정면에 고정한 채 손발을 떼지 않고 골반만 좌우로 밀어 C자 모양을 만든다. 4) 일어선 자세로 전환하여 머리를 고정한 채 골반을 부드럽게 S자로 흔드는 리듬 트레이닝으로 발전시킨다.</p>
