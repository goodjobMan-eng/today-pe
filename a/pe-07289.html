<h1>체조 준비운동 동물 흉내 걷기 및 점프</h1>
<p>1) 신호에 맞춰 자유롭게 달리다가 외발 뛰기, 양발 모아 뛰기를 한다. 2) 발끝으로 걷기, 발뒤꿈치로 걷기 등 다양한 발 모양으로 걷는다. 3) 토끼 점프, 개구리 점프, 코끼리 걷기, 거미 걷기, 오리걸음 등 동물의 움직임을 흉내 내며 이동한다. 4) 천천히 고개를 돌리며 목을 풀어 마무리한다.</p>
