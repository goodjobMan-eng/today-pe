<h1>길게 한 걸음 놀이</h1>
<p>1) 도착선에 삼각콘을 여러 개 세우고 콘 위에 각각 나라 이름표를 붙인다. 2) 술래 1명을 정하고, 나머지 학생들은 출발선에 일정한 간격으로 선다. 3) 술래가 가고 싶은 나라 이름을 외치며 해당 콘 앞에 서면 학생들과 가위바위보를 한다. 4) 가위바위보에서 이기면 두 발, 비기면 한 발 앞으로 가고, 지면 제자리에서 앉았다 일어서기를 1회 수행한다. 5) 술래 앞 나라 이름표가 붙은 삼각콘을 통과하면 도착에 성공한다.</p>
