<h1>펀치 야구</h1>
<p>1) 공격 팀 타자가 배트 없이 주먹으로 티볼공을 타격하고 베이스로 달린다. 2) 타자는 베이스에 머무르지 않고 고깔을 돌아 홈으로 되돌아오며 홈에 도착한 횟수만큼 점수를 얻는다. 3) 수비 팀은 잡은 공을 반드시 중간 수비수를 거쳐 베이스로 송구하며, 주자보다 공이 먼저 도착하면 아웃이 된다.</p>
