<h1>몰래 다가가서 터치하고 도망치기 (스니크 앤 리액트)</h1>
<p>1) 첫 번째 주자는 시작선에서 약 20피트 떨어진 결승선까지 걸어가 벽의 벽돌 한 곳을 응시하며 뒤를 돌아보지 않는다. 2) 두 번째 주자는 첫 번째 주자 뒤로 조용히 몰래 다가간다. 3) 두 번째 주자가 첫 번째 주자의 어깨나 등을 터치하면 즉시 출발선을 향해 도망친다. 4) 첫 번째 주자는 터치를 감지하자마자 뒤돌아 출발선에 도달하기 전에 두 번째 주자를 쫓아가 태그한다.</p>
