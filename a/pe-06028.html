<h1>징검다리 핑퐁 게임</h1>
<p>1) 일렬로 배치된 종이컵(또는 용기)을 향해 탁구공을 바닥에 한 번 튕겨 넣는다.2) 가장 앞의 1단계 컵에 공이 들어가면 다음 단계 컵으로 넘어간다.3) 2단계, 3단계 순서대로 공을 바운드하여 컵에 넣는 도전을 이어간다.4) 정해진 마지막 단계의 컵까지 공을 모두 먼저 넣는 사람이 승리한다.</p>
