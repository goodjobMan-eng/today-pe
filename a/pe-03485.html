<h1>말한 곳을 향해 공 치기</h1>
<p>1) 4명이 한 모둠을 이루고 두 모둠이 게임을 진행한다. 2) 공격수는 2개의 지역 중 공을 쳐서 보낼 곳을 소리쳐 말한 뒤 공을 친다. 3) 공이 떨어진 곳에 따라 점수를 얻고, 미리 말했던 지역으로 공이 떨어지면 표시된 점수의 2배를 얻되 공이 땅에 떨어지기 전에 수비수가 잡으면 점수를 얻을 수 없다. 4) 모든 모둠원의 공격이 끝나면 공수를 바꾸고 가장 많은 점수를 얻은 모둠이 이긴다.</p>
