<h1>농구 기초 패스 4가지 연습하기</h1>
<p>1) 가슴 높이에서 스텝을 밟으며 양손을 앞으로 뻗어 기본 체스트 패스를 연습한다. 2) 수비수가 손을 뻗어 길을 막을 때는 바닥에 튕겨 주는 바운드 패스를 활용한다. 3) 수비수가 낮게 압박하거나 멀리 보낼 때는 머리 위에서 던지는 오버헤드 패스를 사용한다. 4) 몸으로 수비수를 등지고 한 손으로 길을 열어 밀어주는 원핸드 패스를 익힌다.</p>
