<h1>5가지 릴레이 달리기 게임</h1>
<p>1) [꼬리 뺏기] 중앙 후프 구역에 있는 팀 꼬리를 상대 수비수를 피해 자기 진영으로 가져온다. 2) [사목 릴레이] 달리기 후프 격자판(4x4)에 팀 조끼/스카프를 놓아 4개를 한 줄로 먼저 완성한다. 3) [주사위 릴레이] 주사위를 굴려 나온 눈의 번호 후프에 테니스공을 채워 6개 후프를 먼저 채운다. 4) [카드 찾기/레고 릴레이] 달려서 팀 색상 카드를 모두 찾거나 예시 레고 모형을 릴레이로 완성한다.</p>
