<h1>고양이와 쥐 술래잡기 (Chat et Souris)</h1>
<p>1) 원(구역) 주변을 쥐(도망자)들이 달리고, 조끼를 입은 고양이(술래)는 바깥에서 대기합니다. 2) 쥐는 고양이에게 잡히지 않기 위해 계속 달리고, 안전 구역인 원마커 안으로 들어가 대피할 수 있습니다. 3) 안전 구역 안에서는 최대 3초까지만 머물 수 있으며 3초가 지나면 밖으로 나와 다시 달려야 합니다.</p>
