<h1>킨볼 기초 적응 놀이 및 릴레이</h1>
<p>1) 킨볼을 손과 무릎을 이용해 몸 쪽으로 끌어당기며 위로 띄우고 컨트롤하는 연습을 한다. 2) 손으로 킨볼의 공기 주입구를 잡지 않고 밑으로 들어가 받친다. 3) 팀별로 콘을 돌아 뒷사람을 돌아서 다음 주자에게 연결하는 킨볼 굴리기 릴레이를 진행한다. 4) 두 명이 가운데를 맞대고 밀거나, 팀원 전원이 손이나 머리로 받치고 이동하는 방식으로 변형하여 진행한다.</p>
