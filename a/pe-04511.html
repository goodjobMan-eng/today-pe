<h1>개인 축구공 챌린지 1편</h1>
<p>1) 한 발로 3초간 중심을 잡고 발등 부분으로 공을 최대한 멀리 찬다. 2) 발바닥으로 공을 밟은 뒤 발을 뒤로 당겨 공을 몸 뒤로 굴려 제어한다. 3) 공을 두 손으로 잡고 떨어뜨려 한 번 튀긴 후 발등으로 최대한 높고 멀리 찬다. 4) 공을 떨어뜨려 튀긴 후 발등으로 차서 손으로 잡으며, 숙달되면 무릎으로 튕겨 잡거나 머리로 살짝 헤딩하여 잡는다.</p>
