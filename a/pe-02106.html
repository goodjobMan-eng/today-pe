<h1>디스크 다루기 및 디스크 슛 골인 놀이</h1>
<p>1) 1인 1디스크를 들고 손목 스냅을 이용해 머리 위로 던진 후 박수를 치며 양손으로 잡는 연습을 한다. 2) 디스크를 세워 역회전을 주며 굴려 자신에게 되돌아오게 하는 회전 굴리기 동작을 익힌다. 3) 체육관 한쪽에 미니 축구 골대를 배치하고 모둠별로 라바콘 출발선 뒤에 한 줄로 선다. 4) 신호에 맞춰 차례대로 디스크를 던져 골대 안으로 골인시키고, 가장 많은 골을 넣은 모둠이 승리한다.</p>
