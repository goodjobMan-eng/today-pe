<h1>교실 짝 체력·순발력 5종 챌린지</h1>
<p>1) 교실에서 짝과 마주 보며 서거나 앉아 대형을 갖춘다. 2) 마주 보고 손뼉 쳐서 중심 무너뜨리기, 참참참, 악수 가위바위보 손등 터치, 허벅지 씨름, 가위바위보 다리 넓히기 순으로 5가지 놀이를 수행한다. 3) 각 종목마다 먼저 중심을 잃거나 방어/공격에 실패하면 점수를 내주며 3판 2선승제로 승자를 정한다. 4) 쉬는 시간이나 체육 도입 단계에서 짝을 바꾸어가며 토너먼트 형식으로 확장해 진행한다.</p>
