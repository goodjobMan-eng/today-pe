<h1>골프형 활동: 공을 정확하게 및 멀리 보내기</h1>
<p>1) 두 손으로 골프채를 잡고 왼손 엄지손가락을 오른손으로 감싸 쥔다. 2) 다리를 어깨너비로 벌려 11자로 서서 목표를 확인한다. 3) 치는 반대 방향으로 채를 들어 올린 뒤 어깨와 팔을 일직선으로 유지하며 가볍게 쳐서 정확하게 보낸다. 4) 채의 손잡이를 어깨 높이까지 올리고 허리를 돌리며 채를 앞으로 뻗어 멀리 보낸다.</p>
