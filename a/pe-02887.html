<h1>탑 술래잡기</h1>
<p>1) 팀을 나누고 공수 순서를 정한다. 2) 순서를 정해 수비팀 1번은 폼주사위 탑을 쌓고, 공격팀 1번은 일정한 거리에서 피구공을 들고 준비한다. 3) 공격팀 1번이 공을 던져 수비팀의 탑을 무너뜨리면, 던진 공을 가지고 와서 경기장 안을 도망가는 수비팀을 터치해 잡는다. 4) 수비팀에서 탑을 쌓았던 사람이 탑을 다시 쌓은 후 &quot;멈춰!&quot;라고 외칠 때까지 잡은 사람 수가 공격팀의 점수가 된다.</p>
