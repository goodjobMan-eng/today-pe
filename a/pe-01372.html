<h1>발 터치 돈가스 놀이</h1>
<p>1) 바닥에 원을 그리고 가위바위보로 1번부터 차례대로 순서를 정한다. 2) '돈'을 외치며 한 발로 원을 밟고 '가스'를 외치며 밖으로 뛰어 두 발 착지하며 등록한다. 3) 1번이 '돈가스(원 밟고 공격)'나 '가스(즉시 공격)'로 상대 발을 터치하려 시도하면 수비는 피하고 나머지 번호는 1번의 구호를 따라 진행한다. 4) 발이 밟히거나 선을 밟으면 탈락하며 변형 규칙으로 연속 세 번 공격을 허용할 수 있다.</p>
