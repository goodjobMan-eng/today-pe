<h1>하이파이브 윗몸 일으키기</h1>
<p>1) 4명이 한 모둠을 이루어 2명씩 짝을 짓고 순서와 역할을 정한 뒤 매트 위에 마주 보고 앉습니다. 2) 두 사람이 서로의 발목을 교차하여 끼우고 뒤로 누워 단단히 고정합니다. 3) 시작 신호와 함께 동시에 윗몸을 일으켜 마주친 양손으로 하이파이브를 하며 3분간 모둠 누적 성공 횟수를 측정합니다. 4) 짝이 지치면 모둠 내 대기 중이던 다른 짝과 수시로 교대하여 기록을 이어갑니다.</p>
