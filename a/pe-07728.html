<h1>몸으로 이어요!</h1>
<p>1) 두 팀으로 나누고 팀별로 학생들의 번호를 정한다. 2) 각 팀의 순서대로 한 명이 주사위를 두 번 던져 첫 번째 나온 신체 부위를 시작점(벽 또는 앞 사람)에 대고, 두 번째 나온 신체 부위를 끝점으로 최대한 길게 뻗는다. 3) 다음 번호 학생도 계속해서 주사위를 두 번 던지며 앞 사람의 신체 끝점에 이어 신체를 연결한다. 4) 마지막 학생까지 이었을 때 벽에서부터 최종 신체 부위까지의 길이가 더 긴 팀이 승리한다.</p>
