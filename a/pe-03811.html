<h1>양말 캐처 1분 챌린지</h1>
<p>1) 종이 한 장을 손가락으로 둥글게 말아 테이프 한 줄을 가운데에 붙여 원통 막대를 만들고 양말을 준비한다. 2) 양발을 모아 좌우로 1회 스키 점프를 뛴다. 3) 한 손으로 종이 막대 아래를 잡고 다른 손으로 양말을 위로 언더핸드 토스한다. 4) 떨어지는 양말을 종이 막대 윗부분 구멍에 얹혀지도록 받아내면 1점을 얻으며 1분 동안 반복하여 점수를 기록한다.</p>
