<h1>여름 프리즈 댄스</h1>
<p>1) 제자리에서 뛰고 돌며 손을 흔들고 바닥으로 내린다.2) 왼쪽과 오른쪽으로 점프하며 균형을 잡는다.3) 손뼉을 한 번, 두 번 치고 음악에 맞춰 멈춤(freeze) 자세를 취한다.4) 화면 속 레이스에서 응원할 주자를 포즈로 선택하고 제자리 달리기를 하여 에너지를 충전한다.</p>
