<h1>협동 콘돌기 주먹야구</h1>
<p>1) 타자가 공을 주먹으로 타격한 후 두 개의 콘을 차례로 돌아 홈 원마커로 달린다.2) 수비팀은 공을 잡으면 모든 팀원이 한 번씩 공을 패스하여 전달한다.3) 마지막으로 공을 받은 수비수가 중앙 루프(원)를 타자보다 먼저 밟으면 아웃, 타자가 먼저 홈을 밟으면 득점한다.</p>
