<h1>초록 불 빨간 불 (무궁화 꽃이 피었습니다 변형)</h1>
<p>1) 교사는 경기장 반대편에 서고 학생들은 반대편 출발선에 정렬한다. 2) 교사가 '초록 불'을 외치면 학생들은 앞으로 전진하고, '빨간 불'을 외치면 그 자리에 즉시 멈춘다. 3) 달리기 외에도 빠른 걸음, 스키핑, 사이드 스텝 등 다양한 이동 방식으로 이동할 수 있다. 4) '빨간 불' 신호에 멈추지 못하고 움직인 학생은 출발선으로 돌아가 다시 시작한다.</p>
