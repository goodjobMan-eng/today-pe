<h1>체육수업 질서운동 (간격 벌리기 및 원대형)</h1>
<p>1) 교사가 지정한 모둠의 대표가 오른손을 들며 '기준'을 외치고 나머지는 목소리로 복창한다.2) 양팔 간격 신호에 맞춰 양옆과 앞뒤 간격을 손이 닿지 않도록 넓힌 뒤 빠르게 모인다.3) 한 팔 간격 신호에 팔을 올려 앞사람 어깨와 옆사람 간격을 맞춘다.4) 호루라기 신호에 맞춰 손을 뻗어 큰 원을 만들거나 팔꿈치를 맞대어 좁은 원대형을 만든다.</p>
