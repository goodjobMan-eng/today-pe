<h1>스토리텔링 기초체력 운동</h1>
<p>1) 앉아서 한쪽 다리를 뻗고 반대쪽 무릎을 굽혀 숙이는 부채 자세로 몸을 푼다. 2) 바닥에 누워 양발을 교차해 페달을 밟듯이 굴리는 하늘 자전거를 30초씩 3세트 실시한다. 3) 발뒤꿈치를 골반 쪽으로 모으고 무릎을 위아래로 흔드는 나비 자세를 30초씩 3세트 진행한다. 4) 엎드린 자세에서 양팔과 양다리를 들어 올려 5초간 버티는 비행기 자세를 5회씩 3세트 실시한다.</p>
