<h1>철봉 한 발 걸쳐 넘겨내리기</h1>
<p>1) 낮은 철봉 아래 바닥을 정리하고, 한 손은 엎드려잡고 다른 손은 엎어잡는 편역수 자세로 철봉을 지지하여 몸을 띄웁니다. 2) 엎드려잡은 손 쪽의 철봉 위에 한쪽 다리를 자연스럽게 걸쳐 올립니다. 3) 걸친 발로 철봉을 밟으며 엎드려잡았던 손을 철봉에서 뗍니다. 4) 엎어잡은 손으로 철봉을 잡은 채 몸을 옆으로 돌려 안전하게 바닥으로 내려옵니다.</p>
