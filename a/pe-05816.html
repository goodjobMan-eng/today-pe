<h1>강당 변형 삼팔선 놀이</h1>
<p>1) 강당 바닥의 직사각형 구획 라인을 활용해 수비수를 직사각형 구역 안에 배치한다.2) 공격수는 수비수를 피해 농구공 5개 중 하나를 들고 반대편으로 건너간다.3) 반대쪽에 있는 핸드볼 골대에 농구공을 집어넣으면 공격팀이 승리한다.4) 이동 중 수비수에게 몸이 터치당하면 공격수는 아웃된다.</p>
