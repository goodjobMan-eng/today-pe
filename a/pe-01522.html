<h1>더블더치 콩주머니 배달 릴레이</h1>
<p>1) 모둠별로 더블더치(긴줄 2개) 돌리는 영역과 반환점에 훌라후프 및 콩주머니 보관함을 둔다. 2) 출발 신호와 함께 주자가 달려가 회전하는 더블더치 줄 속으로 들어가 줄을 1~2회 넘고 통과한다. 3) 반환점의 훌라후프 안에서 콩주머니 1개를 집어 출발선 상자에 넣으면 1점을 획득하고 다음 주자가 달린다. 4) 줄에 걸리면 재도전해야 하며, 줄을 넘는 횟수를 늘리거나 콩주머니 반환 미션으로 변형한다.</p>
