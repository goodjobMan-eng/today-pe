<h1>농구 기초 바운드 및 볼 컨트롤</h1>
<p>1) 무릎을 굽히고 자세를 낮춘 상태에서 손가락을 사용해 공을 바닥에 바운드한다. 2) 공을 보지 않고 주변을 살필 수 있도록 시선을 정면으로 든다. 3) 공을 몸 앞에서 좌우로 튕겨 손을 바꾸는 크로스오버 드리블을 연습한다. 4) 한 손으로 좌우로 흔드는 윈드스크린 와이퍼 드리블과 몸 옆에서 앞뒤로 튕기는 전후 드리블을 양손으로 번갈아 연습한다.</p>
