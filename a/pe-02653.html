<h1>빙글빙글 저글링 공</h1>
<p>1) 한쪽 손에 공 2개를 잡고 샤워링을 진행하는 도중에 반대쪽 손으로 공을 잡고 테이크아웃을 연결한다. 2) 3개 공으로 캐스케이딩을 하다가 공을 잡고 클로 캐치로 연결한다. 3) 3개 공 캐스케이딩 도중 공을 잡고 오버 와 롭 연결 동작을 수행한다. 4) 2공 샤워링 테이크아웃, 3공 캐스케이딩 테이크아웃 클로, 3공 캐스케이딩 오버 와 롭 순으로 연결해 종합 저글링 퍼포먼스를 완성한다.</p>
