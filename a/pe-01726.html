<h1>독서 주간 책 고르기 타바타 운동</h1>
<p>1) 교실 책상 옆이나 강당의 정해진 위치에 개인 간격을 두고 섭니다. 2) 화면에 인기 도서 두 권의 표지와 카운트다운이 나오면 마음에 드는 책을 하나 선택합니다. 3) 선택 시간 종료 후 책별로 배정된 신체 활동 동작(제자리달리기, 풍차돌리기, 점핑잭 등)이 나타납니다. 4) 30초 동안 자신의 책에 해당하는 운동을 완수한 뒤 10초 휴식하며 다음 도서 선택을 준비합니다.</p>
