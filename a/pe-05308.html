<h1>해적 하키 게임</h1>
<p>1) 퍽이 없는 해적 역할과 퍽을 가지고 도망치는 역할로 나뉘며, 대기자는 한 줄로 서서 기다린다.2) 해적은 구역 안을 이동하며 퍽을 가진 사람을 찾아 하키 스틱으로 퍽을 빼앗는다.3) 퍽을 빼앗긴 사람은 자신의 스틱을 대기 줄의 맨 앞사람에게 넘겨주고 대기 줄 맨 끝으로 이동한다.4) 스틱을 넘겨받아 새로 경기장에 들어온 사람은 해적이 되어 다른 사람의 퍽을 빼앗으러 다닌다.</p>
