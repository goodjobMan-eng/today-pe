<h1>마이 미니 골프 퍼팅 활동</h1>
<p>1) 양손을 모아 퍼터 그립 중앙을 잡고 시계추처럼 앞뒤로 부드럽게 스윙한다.2) 매트 양쪽 끝에서 시작하여 중앙 홀컵을 향해 퍼팅하는 연습을 한다.3) 성벽 모양 장애물(캐슬), 다리(브리지), 미로 장애물 사이로 공을 쳐서 홀에 넣는다.4) 루프 장애물을 통과시켜 한 번에 회전하여 홀에 들어가도록 퍼팅한다.5) 곡선 블록을 자유롭게 조합하여 다양한 코스를 만들고 차례대로 퍼팅한다.</p>
