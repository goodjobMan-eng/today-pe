<h1>공 뺏기</h1>
<p>1) 정해진 구역 안에서 술래 1명을 정하고, 나머지 선수들은 손(또는 발)으로 공을 소유한다. 2) 술래에게 공을 뺏기거나 터치당하지 않도록 패스하며 지켜낸다. 3) 공 없이 술래가 된 선수는 다른 동료에게서 공을 뺏어야 술래 역할을 교대할 수 있으며, 공을 경기장 밖으로 벗어나게 한 선수는 자동으로 술래가 된다.</p>
