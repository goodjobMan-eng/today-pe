<h1>스위치 민첩성 콘 훈련</h1>
<p>1) 콘 6개씩 2미터 간격으로 두 줄 평행하게 세우고 한쪽 줄 콘 위에 공을 올려놓는다. 2) 공이 없는 줄 끝에서 출발하여 양 줄 사이를 이동한다. 3) 한 번에 공 1개씩 집어 반대쪽 줄의 다음 콘 위로 옮겨 놓는다. 4) 팀을 나누어 어느 팀이 먼저 모든 공을 옮기는지 대결한다.</p>
