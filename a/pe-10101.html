<h1>초등 체육 레슬링 및 태그 게임 활동</h1>
<p>1) 두 사람이 마주 서서 손을 잡고 상대방의 발을 밟거나 중심을 무너뜨리는 활동을 한다. 2) 쪼그리고 앉아 손을 잡고 상대방의 발을 땅에 닿게 하여 중심을 잃게 하는 활동을 한다. 3) 누워서 발바닥을 맞대고 서로의 발뒤꿈치를 바닥에 닿게 만드는 복부 및 균형 활동을 한다. 4) 허리에 꼬리끈(태그벨트)을 차고 상대방의 꼬리를 떼어내는 태그 게임을 한다.</p>
