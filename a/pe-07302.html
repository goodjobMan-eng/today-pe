<h1>농구 양손 드리블 및 지봉 잡기 연습</h1>
<p>1) 2인 1조로 서로 마주 보고 선다. 2) 한 손으로는 농구공을 드리블하고 다른 한 손으로는 지봉을 붙잡는다. 3) 교사의 신호에 따라 제자리 드리블 또는 지봉 아래로 드리블 통과 등 손을 바꾼다. 4) 실수를 하지 않고 드리블을 유지하며 점수를 겨룬다.</p>
