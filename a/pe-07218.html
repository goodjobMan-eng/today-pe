<h1>깡통차기 변형 술래잡기</h1>
<p>1) 술래는 태그 막대로 도망치는 친구들을 터치하여 아웃시킨다. 2) 아웃된 사람은 두 손을 들고 표시하며 아웃 구역으로 이동한다. 3) 생존자가 술래를 피해 깡통 구역의 공을 차면 아웃된 친구들이 모두 부활한다. 4) 술래가 공을 주워 원래 위치에 놓을 때까지는 태그할 수 없다.</p>
