<h1>큐피드의 화살 태그 놀이</h1>
<p>1) 한 명의 학생이 풀누들로 제작한 큐피드 화살을 든 술래(큐피드)가 된다. 2) 신호가 울리면 큐피드는 화살로 도망치는 다른 학생들을 태그한다. 3) 태그된 학생은 체육관 모퉁이 구역으로 이동해 교사에게 발렌타인 운동 카드를 1장 뽑는다. 4) 카드에 적힌 정해진 운동 미션을 완료하고 카드를 다른 통에 넣은 후 게임에 복귀한다.</p>
