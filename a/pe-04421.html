<h1>상어와 피라미</h1>
<p>1) 상어 2명이 중앙에 서고 피라미들은 한쪽 끝에 꼬리끈을 차고 준비한다. 2) 상어가 3, 2, 1, 출발을 외치면 피라미들은 반대편 안전지대로 이동한다. 3) 상어에게 꼬리끈을 뺏긴 피라미는 상어가 된다. 4) 안전지대에 도착한 피라미는 꼬리끈을 뺏기지 않는다.</p>
