<h1>체력 윷놀이</h1>
<p>1) 윷을 던져 나오는 패에 따라 정해진 체력 운동을 수행한다. 2) 도는 앉아 윗몸 앞으로 숙이기, 개는 윗몸 말아 올리기, 걸은 버피테스트, 윷은 스쿼트, 모는 팔굽혀펴기, 백도는 엎드려 허리 젖히기를 한다. 3) 해당 운동을 마친 후 나온 패만큼 말을 이동시킨다. 4) 윷이나 모가 나오거나 상대 말을 잡으면 한 번 더 던지며, 정해진 규칙에 따라 말을 완주시킨다.</p>
