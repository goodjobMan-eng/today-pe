<h1>풋살 기본 규칙과 킥인 플레이</h1>
<p>1) 마루 바닥이나 인조잔디 경기장에서 양 팀 5명씩 선수를 구성하여 배치한다. 2) 바닥에 맞는 스터드가 없는 고무창 운동화를 착용하고 경기를 진행한다. 3) 공이 경기장 밖으로 나가면 던지는 드로인이 아닌 발로 차서 넣는 킥인을 실시한다. 4) 킥인은 볼 아웃 후 4초 이내에 완료해야 하며 4초를 넘기면 상대팀에게 소유권이 넘어간다.</p>
