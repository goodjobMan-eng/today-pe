<h1>메이 찾기 브레인 브레이크 타바타</h1>
<p>1) 학생들은 화면 속 여러 별 뒤로 빠르게 숨는 메이(레드 팬더)의 움직임을 집중해서 관찰한다. 2) 메이가 숨었다고 생각되는 별 아래에 제시된 신체 동작(팔굽혀펴기, 댄스, 스쿼트 등)을 카운트다운 동안 따라 한다. 3) 정답 별이 공개되었을 때 자신이 선택해 수행한 별이 맞으면 1점을 획득한다. 4) 단계가 올라갈수록 별의 개수가 늘어나며 중간 그림 찾기 퀴즈를 맞히는 미니게임으로 변형하여 진행한다.</p>
