<h1>교실 밖으로 나온 우리 반, 1.1km를 함께 달리다</h1>
<p>1) 달리기 전 활동으로 코스를 걸으며 플로깅을 진행해 달릴 길을 익힌다. 2) 교실에서 호흡법, 팔 동작, 달리기 기본자세를 사전 교육받고 교내에서 연습한다. 3) 학교 후문으로 나가 두 줄로 서서 1.1km 코스를 함께 달린다. 4) 완주 후 학교로 돌아와 정리 운동을 실시한다.</p>
