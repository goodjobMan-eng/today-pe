<h1>농구 8자 볼 핸들링 및 스파이더 드리블</h1>
<p>1) 양발을 넓게 벌리고 무릎을 굽혀 자세를 낮춘 뒤 고개를 든다. 2) 공을 떨어뜨리지 않고 다리 사이 안팎으로 8자 모양을 그리며 공을 돌린다. 3) 스파이더 바운싱은 다리 사이 가운데 지점에 공을 떨어뜨리지 않고 계속 튀긴다. 4) 손을 다리 앞쪽과 뒤쪽으로 번갈아 가며 손가락 끝을 이용해 공을 빠르게 드리블한다.</p>
