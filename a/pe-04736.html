<h1>성장기 학생들을 위한 키 커지는 요가</h1>
<p>1) 양반다리로 앉아 손으로 무릎을 잡고 상체를 오른쪽과 왼쪽으로 각각 10번씩 돌린다.2) 자리에 누워 무릎을 세우고 양팔을 벌린 뒤 두 무릎을 좌우로 번갈아 바닥 쪽으로 넘겨준다.3) 한쪽 발을 반대쪽 무릎 위에 올리고 아래 다리를 가슴 쪽으로 당겨 스트레칭한다.4) 엎드린 상태에서 상체나 다리를 천천히 들어 올리는 동작을 이어가며 몸을 풀어준다.</p>
