<h1>플라잉디스크 타깃 캐치 게임</h1>
<p>1) 바닥에 훌라후프 구역을 놓고 캐처가 그 안에 들어가며, 투구자는 정해진 거리에서 플라잉디스크를 던질 준비를 합니다. 2) 투구자가 디스크를 던지면 캐처는 훌라후프 밖으로 발이 나가지 않은 상태에서 날아오는 디스크를 받아내야 점수를 얻습니다. 3) 모둠별 주자가 순서대로 던져 성공한 횟수를 합산해 승패를 겨룹니다. 4) 응용형으로 A, B 양 팀 주자가 중앙 구역에서 먼저 디스크를 잡아채는 대결 형식으로 진행할 수도 있습니다.</p>
