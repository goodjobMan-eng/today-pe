<h1>다양한 이동동작 스텝 1탄</h1>
<p>1) 바닥에 놓인 후프 사이를 걸으며 워킹 동작을 연습합니다. 2) 한 발을 들고 깡충깡충 뛰며 호핑 동작을 연습합니다. 3) 두 발을 모으고 높이 뛰어오르는 점핑 동작을 연습합니다. 4) 한 발씩 미끄러지는 슬라이딩 동작을 연습합니다. 5) 껑충 뛰며 앞으로 나아가는 스키핑 동작을 연습합니다.</p>
