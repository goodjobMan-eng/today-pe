<h1>배드민턴 거리 조절 서브 및 공 보내기</h1>
<p>1) 허리 아래에서 라켓 중앙에 셔틀콕을 대고 밀어 치는 백핸드 서브로 서비스 라인을 넘기는 규칙을 익힌다. 2) 코트 앞쪽 훌라후프에는 손목을 가볍게 이용해 살짝 넘겨 넣는 짧은 스트로크를 연습한다. 3) 코트 뒤쪽 훌라후프에는 몸통을 이용해 상대방 키를 넘기도록 높고 길게 보내는 긴 스트로크를 연습한다. 4) 실전 1:1 경기에서 상대방의 위치를 보고 비어 있는 앞뒤 공간으로 거리를 조절하여 공을 보낸다.</p>
