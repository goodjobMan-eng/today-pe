<h1>포 코너 스쿠터 축구</h1>
<p>1) 노랑, 파랑, 빨강, 초록 팀은 스쿠터보드를 타고 발만 사용하여 각자 자기 팀 색깔 골대에 공을 넣어 득점한다. 2) 공을 손으로 건드리면 스쿠터 운동을 5회 수행한 후 다시 경기에 참여한다. 3) 한 골이 들어가면 다른 팀이 공을 가져가 자신의 골대에 넣을 수 있다.</p>
