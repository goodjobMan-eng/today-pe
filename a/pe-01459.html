<h1>수건 2인 1조 공 나르기 릴레이</h1>
<p>1) 2인 1조로 짝을 지어 수건(또는 팀 조끼)의 양쪽 끝을 한 손씩 마주 잡고 출발선에 선다. 2) 신호가 울리면 출발선의 후프 안에 놓인 공을 손을 대지 않고 천으로만 떠받쳐 들어 올린다. 3) 공이 바닥에 떨어지지 않도록 두 사람의 보폭과 호흡을 맞춰 목표 지점인 바구니까지 달린다. 4) 바구니 안에 공을 안전하게 쏟아 넣은 뒤 되돌아와 다음 주자에게 넘기거나 남은 공을 모두 옮길 때까지 반복한다.</p>
