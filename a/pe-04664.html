<h1>축구 태그 게임</h1>
<p>1) 모든 학생이 각자 축구공을 가지고 강당 안을 자유롭게 드리블하며 이동한다. 2) 수비수 역할을 맡은 술래가 다른 학생들의 공 위에 발을 얹어 트래핑을 시도한다. 3) 수비수에게 공을 트래핑당한 학생은 멈춰 서서 공을 머리 위로 들고 도움을 요청하며, 동료가 다리 사이로 공을 패스해 주면 풀려난다.</p>
