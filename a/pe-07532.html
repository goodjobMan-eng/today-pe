<h1>후프 사목 릴레이 게임</h1>
<p>1) 바닥에 훌라후프를 사각 격자(4x4 등) 모양으로 배열해 판을 구성한다. 2) 두 팀으로 나누어 각 팀마다 서로 다른 색상의 띠(스카프)를 준비한다. 3) 신호가 울리면 각 팀의 주자가 한 명씩 전력으로 달려와 원하는 후프 안에 자기 팀 띠를 하나 놓는다. 4) 돌아와 다음 주자와 터치하며, 릴레이를 이어가며 같은 색 띠 4개를 가로·세로·대각선 한 줄로 먼저 잇는 팀이 승리한다.</p>
