<h1>의자 활용 10초 스쿼트 &amp; 탭 챌린지</h1>
<p>1) 교실에서 각자 의자를 안전한 공간에 배치하고 바른 자세로 의자 앞에 서서 준비한다. 2) 시작 신호가 울리면 엉덩이를 의자 시트에 살짝 터치하고 일어서는 의자 스쿼트 또는 발판 터치를 반복한다. 3) 10초 동안 바른 자세를 무너뜨리지 않고 성공한 스쿼트 및 발 탭 횟수를 측정하여 자신의 기록을 경신한다. 4) 제한 시간을 15초·20초로 점차 늘리거나 짝과 번갈아 기록을 측정해 주는 짝 챌린지로 변형한다.</p>
