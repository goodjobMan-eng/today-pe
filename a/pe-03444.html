<h1>거리별 표적 멀리 던지기 게임</h1>
<p>1) 6명이 한 모둠을 이루어 던지기 영역 앞에 선다. 2) 모둠원이 정해진 영역마다 1명씩 공을 3번씩 던진다. 3) 공이 떨어진 지점에 따라 1점, 2점, 3점을 획득한다. 4) 모둠원의 점수를 모두 합산하여 가장 높은 점수를 얻은 모둠이 이긴다.</p>
