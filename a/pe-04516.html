<h1>체육 팔굽혀펴기 동작 및 응용 변형</h1>
<p>1) 가슴 높이에 양손을 두고 엉덩이를 조이며 몸을 곧게 편 기본 푸시업 자세를 취한다. 2) 푸시업 후 반대쪽 손과 발을 교차 터치하거나 팔꿈치와 무릎을 닿게 하는 동작을 실시한다. 3) 양손 간격을 넓게 벌렸다가 좁게 모아 뛰며 번갈아 푸시업을 진행한다. 4) 다이아몬드, 스핑크스, 웜, 스파이더맨, 아처, 베어워크 등 특수 변형 및 공이나 빈백을 활용한 균형 잡기 푸시업을 연습한다.</p>
