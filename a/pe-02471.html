<h1>디스크골프 수업</h1>
<p>1) 운동장에 디스캐처를 설치하여 홀을 구성하고 큰 콘으로 출발 지점을 지정한다. 2) 4인 1조 등 모둠을 구성하여 각자 디스크를 목표 디스캐처를 향해 차례대로 던진다. 3) 디스캐처에서 가장 멀리 있는 사람부터 순서대로 다음 투구를 이어간다. 4) 던진 디스크가 디스캐처 안으로 들어가 홀아웃될 때까지 던진 횟수를 기록지에 기록한다.</p>
