<h1>평균대에서 뛰기와 방향 바꾸기</h1>
<p>1) 바닥에 그어진 직선 위에서 무릎을 굽혀 중심을 낮추며 점프 착지 균형을 먼저 연습한다. 2) 평균대에 올라가 자세를 낮추고 팔로 균형을 잡으며 가볍게 점프 후 착지 시 무릎을 굽힌다. 3) 발을 앞뒤로 교차하며 다리 벌려 뛰기를 실시한다. 4) 상체를 낮추고 가고자 하는 방향으로 팔을 돌리며 발을 움직여 방향을 바꾼다.</p>
