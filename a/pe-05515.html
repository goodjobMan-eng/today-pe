<h1>아이스크림 바꾸기</h1>
<p>1) 각자 자신이 좋아하는 아이스크림 이름을 하나씩 정한다.2) 교실 안을 걸어 다니며 마주친 친구에게 자신의 아이스크림 이름을 말한다.3) 서로의 아이스크림 이름을 교환하여 바뀐 이름으로 다른 친구를 만나러 간다.4) 정해진 시간 동안 끊이지 않고 여러 친구와 이름을 바꾼다.</p>
