<h1>손가락 물건 중심잡기</h1>
<p>1) 손가락 끝 위에 다양한 물건을 세워 균형을 잡는다. 2) 길이가 긴 물건부터 시작하여 짧거나 굵기가 일정하지 않은 물건 순서로 난이도를 높여 도전한다. 3) 앉거나 서서 손가락을 미세하게 움직이며 물건이 쓰러지지 않도록 버틴다.</p>
