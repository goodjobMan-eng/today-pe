<h1>앉아서 하는 국민체조</h1>
<p>1) 의자에 바르게 앉아 고개를 끄덕이고 가볍게 걷는 동작을 한다. 2) 구령에 맞춰 손가락 접고 펴기와 숨쉬기 동작을 실시한다. 3) 손목, 어깨, 목, 가슴, 옆구리, 등배, 몸통 순으로 앉아서 체조 동작을 진행한다. 4) 온몸 운동과 어깨 운동에 박수를 결합하여 실시한 후 숨고르기로 마무리한다.</p>
