<h1>도깨비 보물 탈출 술래잡기</h1>
<p>1) 술래(도깨비/괴물)는 잠을 자며 집 문을 지키고, 도망자들은 지정된 문을 통해 안으로 들어간다. 2) 술래가 잠들어 있는 동안 창고에서 음식(물건)을 한 번에 하나씩 가지고 지정된 문으로 탈출한다. 3) 술래가 깨어나 움직이면 잡히지 않도록 안전 구역으로 도망쳐야 한다. 4) 술래에게 태그되면 감옥에 갇히게 된다.</p>
