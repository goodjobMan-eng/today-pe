<h1>차이니즈 점프 로프 셰이프 &amp; 스펠링</h1>
<p>1) 밴드 로프를 양손에 쥐고 늘려 V자, 직사각형, 직각삼각형 등 지시하는 기하학적 도형을 만든다. 2) 바닥의 알파벳 스팟을 보고 각 글자로 시작하는 단어를 머릿속으로 떠올려 완성한다. 3) 호명된 단어나 문장에 들어가는 알파벳 스팟을 들고 제자리에서 신체 표현을 진행한다. 4) 스팟을 들고 행진(마칭)하며 지명된 순서대로 알파벳을 찾아 모은다.</p>
