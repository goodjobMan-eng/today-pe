<h1>빙글빙글 1대1 꼬리잡기 놀이</h1>
<p>1) 두 사람이 마주 보고 서서 수비수(도망자)와 공격수(꼬리 잡는 술래) 역할을 정한다. 2) 수비수는 수건(꼬리끈) 한 장을 바지 뒤쪽 허리춤에 빠지지 않게 살짝 끼운다. 3) 시작 신호와 함께 두 사람이 좌우로 빙글빙글 돌며 술래는 꼬리를 뺏으려 하고 도망자는 꼬리를 지킨다. 4) 10초의 제한 시간 내에 꼬리를 빼앗으면 술래의 승리, 빼앗기지 않으면 도망자의 승리가 되며 공수를 교대한다.</p>
