<h1>포스퀘어 게임</h1>
<p>1) 4개의 구역으로 나뉜 코트에 모둠원이 한 명씩 자리 잡습니다. 2) 4번 구역에 있는 사람이 공을 튕겨서 다른 구역으로 보냅니다. 3) 다른 구역의 사람은 날아온 공을 원바운드로 받아 다른 사람에게 넘깁니다. 4) 공을 잡거나 라인에 맞거나 직접 치면 탈락하여 바깥으로 이동합니다. 5) 4번 구역에서 점수를 벌어 목표 점수에 도달하면 게임에서 졸업합니다.</p>
