<h1>풍선 신체 부위 튕기기 및 풍선 배구</h1>
<p>1) 풍선을 적당한 크기로 불어 묶어 준비합니다. 2) 1분 동안 손, 발, 머리, 무릎, 배구 토스 자세 순으로 머리 위로 풍선을 튕기며 개수를 셉니다. 3) 발을 절대 떼지 않고 머리 위까지 풍선을 튕겨 올리며 횟수를 겨루는 시합을 합니다. 4) 둘이서 손이나 발을 사용하여 풍선 배구 경기를 진행합니다.</p>
