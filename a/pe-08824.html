<h1>보물(수건) 뺏기 게임</h1>
<p>1) 중앙에 놓인 수건을 두고 양 팀이 마주보고 선다. 2) 자신의 번호나 색깔이 불리면 중앙으로 달려가 수건을 잡는다. 3) 수건을 가지고 자기 진지로 돌아오면 승리하고, 상대는 그 전에 수건을 든 친구를 터치하면 승리한다.</p>
