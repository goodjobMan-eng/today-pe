<h1>인간 일으키기 모둠 체조</h1>
<p>1) 10명이 모여 신장과 체력에 따라 역할을 나누고 한 줄로 정렬한다. 2) 합조(토대) 멤버들은 한쪽 무릎을 꿇고 앉아 서로 손을 잡고 지지할 준비를 한다. 3) 탑승(라이더) 멤버는 1열의 어깨에 발을 올리고 2열부터는 신체를 지지한다. 4) 신호에 맞춰 다함께 호흡을 맞추어 상체를 일으켜 세운다.</p>
