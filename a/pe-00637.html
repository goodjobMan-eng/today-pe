<h1>닌자 수련 놀이</h1>
<p>1) 학생 사이 간격을 충분히 벌리고 닌자 기본자세를 취하며 집중해서 준비합니다. 2) 술래(교사)가 날리는 가상 수리검의 위치 구호에 맞춰 즉각적으로 반응 동작을 합니다. 3) '머리 수리검'을 외치면 재빨리 쪼그려 앉아 피하고, '발 수리검'을 외치면 높이 점프하여 피합니다. 4) '닌자 촙'에는 손으로 쳐내 방어하고, 장풍이나 회전 공격 구호에는 한 바퀴 돌거나 온몸으로 막아 냅니다.</p>
