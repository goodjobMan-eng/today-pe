<h1>고양이와 쥐 달리기 놀이</h1>
<p>1) 두 명씩 짝을 지어 선다. 2) 술래를 정하면 고양이와 쥐 역할을 나눈다. 3) 고양이와 쥐는 중앙에 서고 다른 아이들은 원대형으로 앉는다. 4) 고양이는 다섯까지 세고 쥐를 쫓아간다. 5) 쥐는 놀이 구역 안에서 도망간다. 6) 쥐가 앉아 있는 친구 옆에 앉으면 그 짝이 쥐가 되어 도망간다. 7) 쥐가 잡히면 술래를 바꿔 진행한다.</p>
