<h1>짝과 함께하는 교구 협응 및 균형 운동</h1>
<p>1) 2인 1조로 손을 맞잡고 뒤로 누우며 서로 체중을 당겨 균형을 잡는 동작을 연습한다. 2) 등을 맞대고 팔을 끼지 않은 채 서로 등을 밀며 앉았다가 일어서고 함께 점프한다. 3) 한 명이 앉아서 공을 제자리 드리블하는 동안 다른 한 명은 공을 빼앗으려 하거나 둘레를 달린다. 4) 공을 잡고 튕겨 오르는 타이밍에 맞춰 점프하거나 등을 굽혀 뒤로 패스하고 등 위로 굴린다.</p>
