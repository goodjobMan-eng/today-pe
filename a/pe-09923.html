<h1>빅발야구 킥 연습 및 주자·수비 협동 게임</h1>
<p>1) 디딤발(왼발)을 공 옆에 두고 발등으로 공 아래쪽을 차서 공을 위로 띄우는 킥 기본기를 연습한다. 2) 공격수는 공을 차낸 후 일렬로 줄 선 팀원들 주위를 남자는 3바퀴, 여자는 2바퀴 돌고 공격 베이스로 달린다. 3) 수비는 공을 직접 받으면 아웃이며, 바운드된 공을 잡으면 잡은 사람 뒤로 수비수가 한 줄로 모여 만세를 한 뒤 수비 베이스로 패스해 주자보다 먼저 닿으면 아웃시킨다.</p>
