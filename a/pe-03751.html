<h1>매일 10분 꾸미기 체조 1인 기술 7종</h1>
<p>1) 수평 밸런스는 다리를 뒤로 뻗고 상체를 앞으로 숙여 수평을 만든다. 2) V자 밸런스는 다리를 펴고 앉아 양손을 옆으로 뻗은 채 다리를 들어 올린다. 3) 한 손 밸런스는 손을 짚고 엎드려 몸을 곧게 편 뒤 한 손을 든다. 4) 물범, 브리지, 범고래, 스카이트리(등 서기) 등 다양한 1인 균형 자세를 단계별로 연습한다.</p>
