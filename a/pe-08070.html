<h1>후프 거리별 풋볼 패스 앤 캐치 릴레이</h1>
<p>1) 모둠별로 일렬 릴레이 대형으로 서고, 팀 앞쪽에 빨강(1점), 노랑(2점), 초록(3점) 훌라후프를 거리순으로 배치한다. 2) 첫 번째 주자(리시버)는 원하는 색상의 후프로 달려가 들어가고, 두 번째 주자(쿼터백)는 공을 던져 패스한다. 3) 리시버가 공을 받으면 해당 후프의 점수를 획득하며(놓치면 0점), 쿼터백은 리시버가 되고 리시버는 줄 맨 뒤로 이동하여 역할을 교대한다.</p>
