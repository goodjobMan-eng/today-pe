<h1>심폐지구력을 기르는 운동 (줄넘기)</h1>
<p>1) 줄 가운데를 발로 딛고 손잡이를 가슴 높이까지 끌어당겨 줄 길이를 맞춘다. 2) 양발을 모아 가볍게 뛰는 양발 모아 뛰기, 한 발을 뒤로 접었다 앞으로 차며 넘는 발 앞뒤로 흔들어 뛰기, 발을 번갈아 바꾸며 넘는 발 바꾸어 뛰기를 실시한다. 3) 두 명이 마주 보고 서서 발목에 긴줄을 걸어 팽팽하게 고정하고, 다른 한 명은 리듬에 맞춰 걸리지 않게 다양한 방법으로 긴줄을 뛰어넘는다.</p>
