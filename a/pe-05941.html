<h1>알줍기 풍선배</h1>
<p>1) 둥지를 5~8m 간격으로 두고 알을 뿌린 뒤 가위바위보로 경기장을 선택한다2) 풍선을 들고 준비한 뒤 심판의 신호에 맞춰 공(풍선)을 튕기면서 알을 줍는다3) 풍선이 바닥에 닿으면 경기가 종료되며 둥지에 모은 최종 알 개수로 승패를 정한다</p>
