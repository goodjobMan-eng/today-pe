<h1>어라운드 더 월드</h1>
<p>1) 원 중앙에 팀 수만큼 플랫 콘을 두고 각 팀은 2명 이상씩 1~2m 간격을 두고 원형으로 둘러선다. 2) 신호가 울리면 각 팀의 마지막 주자가 같은 방향으로 원을 돌아 자기 팀으로 온다. 3) 자기 팀원들의 다리 사이로 기어가 원 중앙의 플랫 콘을 먼저 차지한다. 4) 라운드마다 플랫 콘 수를 점차 줄이며 가장 많은 콘을 획득한 팀이 승리한다.</p>
