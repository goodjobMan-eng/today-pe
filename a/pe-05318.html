<h1>수건 트랩 축구 발 기술 챌린지</h1>
<p>1) 수건 2장을 일직선상에 5~6피트(약 1.5~1.8m) 간격으로 바닥에 놓는다.2) 발의 안쪽과 바깥쪽을 사용하여 축구공을 드리블한다.3) 첫 번째 수건 위에서 공을 발로 멈추는 트랩을 성공한다.4) 반대편 수건으로 드리블하여 다시 트랩하며 1분 동안 성공 횟수를 측정한다.</p>
