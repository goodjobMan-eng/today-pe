<h1>가위바위보 종이 로켓 챌린지</h1>
<p>1) 종이를 돌돌 말고 가운데에 테이프를 붙여 종이 로켓을 만든다. 2) 스트래들 점프(다리 벌렸다 모아 뛰기) 1회를 실시한다. 3) 한 손으로 바위(주먹)를 쥐고 그 위에 종이 로켓을 올려 보(보자기)를 만든다. 4) 팔을 위로 뻗어 종이 로켓을 띄운 뒤 떨어지는 로켓을 손가락 가위로 잡아채면 1점을 얻는다.</p>
