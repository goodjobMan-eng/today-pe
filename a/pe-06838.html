<h1>도전 바스켓 챌린지</h1>
<p>1) 출발 신호에 맞춰 공을 들고 출발한 뒤 드리블 존으로 이동하여 제자리에서 빠르게 드리블을 5회 실시한다. 2) 패스 존으로 이동해 바닥에 공을 놓고 코끼리코를 한 상태로 공 주위를 3바퀴 돈 후 패스 미션을 성공할 때까지 시도한다. 3) 지그재그 드리블 존을 통과해 슈팅 존에 도착한 뒤 슛을 시도하여 1골이 들어갈 때까지 던져 성공하면 종료하거나 다음 주자에게 연결한다.</p>
