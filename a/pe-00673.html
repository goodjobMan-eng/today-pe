<h1>타깃 통과 공 던지기 릴레이</h1>
<p>1) 던지는 사람, 표적을 든 사람, 공을 줍는 사람으로 역할을 나눕니다. 2) 던지는 사람은 바닥의 스팟에 서서 높이 들린 훌라후프 안으로 공을 정확히 던져 통과시킵니다. 3) 뒤편의 수비수는 통과하거나 떨어진 공을 재빨리 잡아 다음 주자에게 전달합니다. 4) 훌라후프를 벽에 걸어 두고 스텝 훈련용 스팟을 밟으며 이동해 던지는 릴레이 방식으로 확장합니다.</p>
