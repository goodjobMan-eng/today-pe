<h1>고양이와 쥐 얼음땡</h1>
<p>1) 참여 인원보다 2개 적은 수의 원마커를 배치하고, 고양이와 첫 번째 쥐를 제외한 친구들은 원마커 위에 올라간다. 2) 스틱을 든 고양이가 쥐를 잡으러 달리고, 쥐는 고양이에게 잡히기 전에 원마커 위의 친구를 터치한다. 3) 터치당한 친구는 밖으로 나와 새 쥐가 되어 도망치고, 터치한 친구는 해당 원마커 위에 앉아 대기한다. 4) 고양이에게 잡히지 않고 모든 쥐가 원마커 위에 앉아 마지막 쥐가 교사와 하이파이브를 하면 미션에 성공한다.</p>
