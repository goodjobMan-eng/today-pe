<h1>발렌타인데이 언어유희 타바타 워크아웃</h1>
<p>1) 화면에 언어유희(pun) 문장이 나타나고 코치가 문장을 읽는 동안 5초간 휴식하며 동작을 준비한다. 2) 문장 낭독이 끝나면 해당 문장과 연결된 운동 동작(플로스 댄스, 점핑잭, 하이니, 제자리달리기 등)을 30초 동안 수행한다. 3) 새로운 언어유희 문장이 나오면 다시 5초간 휴식한 뒤 다음 운동 동작을 이어간다.</p>
