<h1>축구 골대와 득점 변형 방법</h1>
<p>1) 두 사람이 펀스틱을 들고 공이 굴러오는 방향으로 이동해 골대를 만들어 통과시키는 움직이는 골대로 경기한다.2) 득점한 팀의 골대 콘 간격을 한 칸씩 옆으로 넓혀 실점 확률을 높이는 고무줄 골대로 경기한다.3) 콘 사이 통과는 1점, 콘 기둥을 맞히면 2점, 중앙 좁은 콘 사이로 넣으면 3점으로 득점 구역을 차등화하여 경기한다.</p>
