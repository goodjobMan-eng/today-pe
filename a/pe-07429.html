<h1>만리장성 술래잡기 (Chinesische Mauer)</h1>
<p>1) 경기장 중앙에 통과해야 하는 구역(만리장성)을 설정하고 첫 술래를 구역 안에 배치한다. 2) 나머지 도망자들은 경기장 한쪽 끝 출발선에 선다. 3) 도망자들은 술래를 피해 중앙 구역을 통과하여 반대편 구역으로 달려간다. 4) 중앙 구역을 건너다 술래에게 태그된 사람은 다음 라운드부터 술래가 되어 중앙 구역에 합류한다. 5) 마지막 한 사람까지 모두 잡힐 때까지 라운드를 반복한다.</p>
