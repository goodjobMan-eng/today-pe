<h1>전신 활력 타바타 8종 인터벌 서킷</h1>
<p>1) 전신 관절을 풀어주는 워밍업 스트레칭을 4분간 진행하고 호흡을 정돈한다. 2) 점핑잭, 니업, 마운틴 클라이머, 플랭크, 푸시업, 버트킥, 사이드스텝, 숏피치 8개 동작을 순서대로 배운다. 3) 20초간 최대 강도로 운동하고 10초간 호흡을 고르는 타바타 인터벌 루틴을 1~2세트 실시한다. 4) 체력에 맞춰 푸시업은 무릎 대고 하기, 점핑 동작은 템포를 조절하는 변형을 적용한다.</p>
