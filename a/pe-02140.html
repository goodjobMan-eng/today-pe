<h1>게이트볼 제1게이트 통과 연습</h1>
<p>1) 제4라인 선상에 2m 길이로 설치된 스타트 에어리어 선 가운데에 20cm 간격으로 10개의 공을 나란히 놓는다. 2) 제1게이트를 넘어 5m에서 15m까지 1m 간격으로 접시콘을 일렬로 배치한다. 3) 스틱으로 공을 타격하여 제1게이트를 정확히 통과시키는 연습을 꾸준히 실시한다. 4) 10개 중 8개 이상 통과를 목표로 하며, 힘(강약) 조절을 통해 통과한 공이 목표 접시콘 거리에 멈추도록 보낸다.</p>
