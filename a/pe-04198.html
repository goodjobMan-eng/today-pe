<h1>사이드 스위처스(진영 바꾸기 피구)</h1>
<p>1) 중앙선을 기준으로 두 팀으로 나뉘어 각자 진영에 선다. 2) 공을 던져 상대 팀 선수를 맞힌다. 3) 공에 맞은 선수는 상대 팀 진영으로 넘어가 엔드 벽을 터치한다. 4) 벽을 터치한 후 상대 팀의 일원이 되어 게임을 계속한다.</p>
