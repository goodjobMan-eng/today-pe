<h1>교실트레이닝 12 - 층간소음 없는 땀나는 홈트레이닝</h1>
<p>1) 학생들은 제자리에서 스쿼트, 런지 후 발차기, 플랭크 및 마운틴 클라이머 등 안내되는 전신 맨몸 운동을 차례대로 수행합니다. 2) 각 동작은 층간 소음이 발생하지 않도록 뛰지 않는 동작 위주로 구성되어 있으며 약 30초 동안 집중하여 따라 합니다. 3) 하체 근력과 코어 근육을 고르게 자극하도록 구성된 동작들을 이어서 합니다. 4) 8가지 이상의 타바타 형태 홈트레이닝 동작을 끝까지 완수합니다.</p>
