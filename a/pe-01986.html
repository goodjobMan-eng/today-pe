<h1>4대1 콘 지키기 터치 게임</h1>
<p>1) 활동 구역에 콘 5개를 세워 두고 수비수 4명과 공격수 1명을 정해 배치한다. 2) 시작 신호가 울리면 모든 선수가 구역 안에서 분주히 움직이며 공간을 선점한다. 3) 공격수는 비어 있는 콘 1개의 상단을 손으로 터치하여 점령하려 하고, 수비수 4명은 손으로 콘 끝을 덮어 방어한다. 4) 공격수가 콘 하나를 먼저 터치하면 라운드가 종료되며, 역할을 교대하여 새로운 공격수를 투입한다.</p>
