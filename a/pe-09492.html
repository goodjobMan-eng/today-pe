<h1>반달 술래잡기</h1>
<p>1) 지름이 4M 정도 되는 원을 그리고 원을 가로지르는 선을 켠다. 2) 술래를 한 명 뽑고 나머지는 모두 원 안으로 들어간다. 3) 술래는 원 안에 들어갈 수 없고 라인을 밟고 다니며 원 안의 사람들을 터치한다. 4) 술래에게 터치당하면 원 밖으로 나가 라인을 뛰어다니며 다른 사람들을 터치한다. 5) 원 안의 아이들이 4~5명만 남아 팔이 안닿는 경우 한 발만 안에 넣어 터치할 수 있다. 6) 최후의 1명이 승리!</p>
