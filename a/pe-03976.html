<h1>미식축구 스냅 볼링 챌린지</h1>
<p>1) 각자 미식축구 공을 하나씩 준비하고 전방에 볼링 핀을 세운다. 2) 공격 라인 자세를 취하고 다리 사이 뒤쪽으로 공을 스냅(샷건 하이크)하여 볼링 핀을 쓰러뜨린다. 3) 쓰러진 볼링 핀 1개당 팝잇에 1점을 기록하고 핀을 다시 세운다. 4) 스냅이 어려운 경우 공을 바닥에 굴려 핀을 맞히는 볼링 방식으로 진행한다.</p>
