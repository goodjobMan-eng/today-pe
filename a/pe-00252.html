<h1>스캐터볼 (주사위 공 팔찌 모으기 게임)</h1>
<p>1) 참가자들이 손을 잡고 원을 돌며 구호를 외칩니다. 2) 순번인 학생이 주사위 공을 중앙으로 던지고, 윗면에 나온 번호의 학생이 재빨리 공을 잡고 '스캐터'를 외치면 도망치던 학생들은 그 자리에 모두 멈춰 섭니다. 3) 공을 잡은 술래가 다른 친구를 향해 던져 맞히면 상대의 팔찌를 얻고, 상대가 공을 잡으면 술래가 팔찌를 넘겨줍니다. 4) 모든 색깔의 팔찌를 가장 먼저 모으는 사람이 승리합니다.</p>
