<h1>짧은 거리 빠르게 달리기 기본자세</h1>
<p>1) 양발을 앞뒤로 벌리고 무릎을 살짝 굽혀 중심을 앞발에 두고 출발 신호를 기다린다. 2) 신호와 함께 앞발 무릎이 펴지며 뒷발이 빠르게 앞으로 나가며 가속한다. 3) 팔은 앞뒤로 크게 흔들고 무릎을 들어 보폭을 넓혀 중간 구간을 달린다. 4) 도착 지점까지 속도를 줄이지 않고 가슴을 내밀며 통과한다.</p>
