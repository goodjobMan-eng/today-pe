<h1>진 지키기 놀이</h1>
<p>1) 다섯 명당 한 명꼴로 술래를 뽑고 술래가 지킬 진을 정한다. 2) 술래는 진에 붙어 있고 나머지 사람들은 진에서 멀리 도망친다. 3) 술래에게 잡힌 사람은 진을 붙잡고 서며, 여럿이 잡히면 손을 잡고 길게 늘어서서 다른 사람의 구출을 기다린다. 4) 도망치던 사람이 술래를 피해 진(또는 잡힌 사람)을 쳐주면 살아나고, 술래에게 모두 잡히면 놀이가 끝난다.</p>
