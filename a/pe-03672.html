<h1>배드민턴 단합 놀이</h1>
<p>1) 전체를 2팀으로 나누고 팀 조끼를 입는다. 2) 기록 표에 팀원의 이름과 팀원 각자가 완수해야 할 셔틀콕 리프팅 목표 개수를 적는다. 3) 순서대로 선수가 나와 셔틀콕을 떨어뜨리지 않고 해당 횟수를 채워야 다음 선수가 이어서 라켓을 넘겨받는다. 4) 대기하는 팀원들이 횟수를 세어주며 셔틀콕을 떨어뜨리면 1부터 다시 시작하고, 먼저 전원 목표를 끝내는 팀이 승리한다.</p>
