<h1>원마커 3개 징검다리 스피드 이동 릴레이</h1>
<p>1) 출발선 앞에 원마커 3개를 준비하고 주자는 마커 위에 선다. 2) 바닥을 직접 밟지 않고 남는 마커를 앞으로 옮겨 밟으며 목표 지점까지 전진한다. 3) 반환점에 가장 먼저 도달하거나 릴레이를 마친 팀이 승리한다. 4) 모둠 대항 릴레이나 이동 경로 길이를 늘려 난이도를 조절할 수 있다.</p>
