<h1>그린치 여름 프리즈 댄스 요가</h1>
<p>1) 음악에 맞춰 신나게 춤을 춘다. 2) 'Freeze' 신호가 나오면 지정된 요가 포즈를 취하고 몸을 흔들지 않은 채 멈춘다. 3) 겨울 화면으로 전환되면 날아오는 초록색 비치볼을 터뜨리고 빨간색 비치볼은 피한다. 4) 날씨가 여름으로 돌아오면 다시 음악에 맞춰 춤을 추고 프리즈 동작을 반복한다.</p>
