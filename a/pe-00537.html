<h1>럭비 돌파 보물 빼앗기 게임</h1>
<p>1) 수비수(술래)는 정해진 라인 위에서만 움직이며 공을 가진 공격수를 태그합니다. 2) 공격수는 공을 든 채 수비수의 태그를 피해 좌우 페인트 동작을 활용해 수비 라인을 돌파합니다. 3) 수비 구역을 라인에서 사각형 에어리어로 확장하면 수비 범위가 넓어져 난이도가 높아집니다. 4) 팀 돌파로 발전시켜 공을 가진 사람이 태그당하지 않도록 패스를 주고받으며 돌파할 수 있습니다.</p>
