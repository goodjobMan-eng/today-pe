<h1>방바닥 탈출 놀이</h1>
<p>1) 바닥이 용암이라고 상상하고 책 2권을 발판 삼아 한 발씩 딛고 옮겨가며 목표 지점까지 이동한다. 2) 책 위에 한 발로만 올라서서 균형을 잡으며 이동하거나 깽깽이발(한 발)로만 뛰어 건너는 활동에 도전한다. 3) 바닥을 얼음판으로 상상하고 발밑에 물티슈(또는 걸레) 2장을 깔고 발이 떨어지지 않게 제자리 회전 및 미끄러지며 바닥을 닦아 탈출한다.</p>
