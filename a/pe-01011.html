<h1>맛있는 음식 홈트레이닝 타바타</h1>
<p>1) 고기 굽기, 낙지탕탕이, 떡메치기 등 음식 조리 동작을 본뜬 맨몸 타바타 동작을 익힌다. 2) 교사의 시범과 리듬 구령에 맞추어 제자리 발구르기와 팔 뻗기, 점프 동작을 차례로 실시한다. 3) 정해진 카운트 동안 바른 자세를 유지하며 동작을 멈추지 않고 수행한 학생이 성취감을 얻는다. 4) 학생들이 좋아하는 다른 음식 조리 동작을 직접 제안하여 새로운 루틴을 만들어 변형한다.</p>
