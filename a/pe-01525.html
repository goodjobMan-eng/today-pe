<h1>스텝래더 리듬 트레이닝</h1>
<p>1) 바닥에 스텝래더를 일렬로 펼쳐놓고 학생들은 사다리 시작 지점에 줄을 서서 준비한다. 2) 경쾌한 음악 비트에 맞추어 사다리 칸 안팎을 다양한 스텝(1발씩 통과, 양발 벌려 모으기 등)으로 리드미컬하게 통과한다. 3) 사다리 칸을 밟지 않고 정확하고 일정한 박자로 끝까지 도달하면 모둠 점수를 얻는다. 4) 짝과 마주 보며 스텝을 맞추거나 음악 템포를 빠르게 바꾸는 등 스텝 패턴을 다양하게 변형한다.</p>
