<h1>보물 쟁탈 훌라후프 러너</h1>
<p>1) 활동 공간 네 모서리에 훌라후프를 두고 동일한 수의 콩주머니를 채워 모둠별 기지를 정한다. 2) 신호가 울리면 이동하며 상대 팀 후프에서 콩주머니를 1번에 1개씩 집어 자기 기지로 가져온다. 3) 제한 시간이 종료되었을 때 자기 후프에 콩주머니를 가장 많이 모은 팀이 승리한다. 4) 변형으로 상대 진영 수비수의 터치(태그) 규칙을 추가해 잡히면 돌려놓게 운영할 수 있다.</p>
