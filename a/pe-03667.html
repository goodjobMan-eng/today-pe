<h1>앉아서 하는 교실 의자 요가</h1>
<p>1) 의자를 뒤로 밀어 책상과 의자 사이에 충분한 공간을 만들고 목과 어깨를 가볍게 풀어줍니다. 2) 발바닥을 바닥에 붙이고 무릎을 모은 뒤, 의자 등받이 아랫부분을 잡고 가슴을 열어 낙타 자세를 10초간 유지합니다. 3) 등을 둥글게 말아 배꼽을 바라보는 고양이 자세를 10초간 유지합니다. 4) 의자에서 엉덩이를 살짝 떼고 팔을 뻗는 의자 자세, 양팔을 뻗어 좌우로 기울이는 초승달 자세, 다리 당기기와 아기 자세를 차례로 진행합니다.</p>
