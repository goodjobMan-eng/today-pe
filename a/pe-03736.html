<h1>움직이며 공 보기 및 캐치 운동</h1>
<p>1) 제자리에서 앉거나 선 자세로 공을 위로 던지고 캐치한다. 2) 멈춰 있는 공을 걸어가며 잡고, 이어서 걸어가며 공을 던져 잡은 뒤 뛰어가며 던져 잡는다. 3) 부드러운 공을 살짝 던져 자신의 머리로 헤딩한다. 4) 공을 위로 던진 뒤 양손으로 원을 만들어 그 안으로 공을 통과시킨다.</p>
