<h1>발 멈춰(전쟁 선포) 피구</h1>
<p>1) 참가자들은 원을 만들고 공을 가진 사람은 중앙에 선다. 2) 중앙의 사람이 특정인의 이름을 부르며 전쟁을 선포하고 공을 위로 던진다. 3) 호명된 사람이 공을 잡고 '발 멈춰'를 외치면 모든 참가자는 제자리에 멈춘다. 4) 공을 잡은 사람은 3걸음을 이동하여 가장 가까운 사람에게 공을 던져 맞히고, 맞은 사람은 탈락한다.</p>
