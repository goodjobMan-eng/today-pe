<h1>공 사냥꾼</h1>
<p>1) 술래(사냥꾼)들은 공을 서로 주고받으며 이동한다. 2) 술래는 공을 던지지 않고 들고 이동하며 사냥꾼을 피해 도망 다니는 사람(먹잇감)을 터치하여 잡는다. 3) 술래와 도망자 모두 뛰지 않고 빠르게 걷기만 해야 한다.</p>
