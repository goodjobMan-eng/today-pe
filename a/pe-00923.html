<h1>신발 릴레이 달리기</h1>
<p>1) 학생들은 신발 한 짝만 벗어 중앙 원이나 훌라후프 안에 모아 두고 팀별 출발선에 일렬로 섭니다. 2) 출발 신호가 울리면 각 팀의 첫 번째 주자가 중앙으로 달려가 자신의 신발을 찾아 신습니다. 3) 신발을 완전히 신은 주자는 팀으로 돌아와 다음 주자와 하이파이브를 하고 줄 맨 뒤로 갑니다. 4) 모든 팀원이 신발을 먼저 다 찾아 신고 돌아오는 팀이 승리하며, 라운드마다 앙감질, 스킵, 갤럽 등 이동 방법을 바꿔 봅니다.</p>
