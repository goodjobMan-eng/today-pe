<h1>야생 칠면조 사냥</h1>
<p>1) 체육관 중앙에 사냥꾼 3~4명이 공을 가지고 서고, 나머지 학생들은 칠면조가 되어 가장자리에 선다. 2) 사냥꾼이 중앙에서 공을 굴려 가장자리를 이동하는 칠면조의 무릎 이하를 맞힌다. 3) 공에 맞은 칠면조는 바구니에서 고무 칠면조를 꺼내 중앙의 사냥꾼에게 가져다준다.</p>
