<h1>십자 통로 술래잡기</h1>
<p>1) 바닥에 십자 모양의 통로 구역과 4개의 사각형 칸으로 이루어진 코트를 준비합니다. 2) 술래는 십자 통로 구역 안에서만 이동하며 도망치는 사람들을 잡으러 다닙니다. 3) 도망치는 사람들은 십자 구역 안으로 들어가지 않고 사각형 칸들을 반시계 방향으로 돌며 이동하고, 술래에게 터치된 사람은 코트 밖으로 탈락합니다. 4) 술래에게 잡히지 않고 정해진 바퀴 수를 무사히 완주하면 승리합니다.</p>
