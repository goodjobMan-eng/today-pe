<h1>발로 공 차서 콘 쓰러뜨리기</h1>
<p>1) 4명이 한 모둠을 이룬다. 2) 각 영역에 정해진 방법으로 공을 차서 세워진 콘을 쓰러뜨린다. 3) 한 모둠원이 각각의 방법마다 2번씩 공을 찬다. 4) 콘을 쓰러뜨리면 1개당 1점을 얻고, 모둠원 전체의 점수를 합산해 가장 높은 점수를 얻은 모둠이 승리한다.</p>
