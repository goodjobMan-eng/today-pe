<h1>발야구 공 받기 요령(높은 공·정면 공·땅볼)</h1>
<p>1) 공을 잡을 사람이 주변 친구들과 부딪히지 않도록 &quot;마이&quot;를 외친다. 2) 높은 공은 피하지 않고 끝까지 보며 두 손으로 잡아 가슴 쪽으로 끌어안는다. 3) 정면 공은 놓치지 않게 가슴으로 확실히 품어 잡는다. 4) 바닥으로 굴러오는 공은 다리 간격을 좁히거나 한쪽 무릎을 낮춰 가랑이 사이로 빠지지 않게 잡는다.</p>
