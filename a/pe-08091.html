<h1>플래그 풋볼 기본 경기 규칙</h1>
<p>1) 양 팀은 5명씩 공격과 수비로 나뉘며 자신의 5야드 라인에서 공격을 시작한다 2) 공격 팀은 4번의 플레이 안에 하프라인을 넘어야 퍼스트 다운을 얻고 다시 4번의 기회 안에 득점해야 한다 3) 공을 가진 선수의 플래그가 뽑히면 플레이가 멈추며 태클이나 블로킹은 금지된다</p>
