<h1>슐런</h1>
<p>1) 한 세트당 30개의 퍽을 가지고 총 3번의 쿼터(기회)로 진행한다. 2) 보드판의 4개 관문에 퍽을 손으로 밀어 넣는다. 3) 1쿼터 후 들어가지 않은 퍽을 모아 2쿼터, 3쿼터를 진행하며 들어간 퍽은 관문 안에 쌓아둔다. 4) 3쿼터 종료 후 관문에 들어간 퍽의 점수를 계산하며, 4개 관문에 1개씩 골고루 들어가면 10점에 2배 보너스가 주어져 20점이 된다.</p>
