<h1>탁구 백핸드 쇼트</h1>
<p>1) 몸의 왼쪽으로 오는 공을 향해 발을 일자로 두고 무릎과 허리를 살짝 낮추는 기본자세를 잡는다. 2) 라켓 각도를 약 90도에서 앞으로 살짝만 숙이고 몸통과 주먹 하나 이상 거리를 유지한다. 3) 스윙을 크게 하지 않고 앞에서 짧게 밀어주며 마지막에 공을 살짝 눌러주는 느낌으로 넘긴다.</p>
