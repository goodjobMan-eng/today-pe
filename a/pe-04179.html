<h1>농구 기초 볼핸들링 및 드리블 연습</h1>
<p>1) 제자리에서 공을 허리, 무릎, 머리 둘레로 돌리고 방향을 바꾸어가며 볼핸들링을 한다. 2) 머리-허리-무릎-무릎-허리-머리 순으로 연결하는 코크스크류 동작과 다리 사이 8자 굴리기를 실시한다. 3) 트리플 쓰렛 기본자세를 잡은 후 오른손과 왼손으로 높낮이(낮게, 중간, 높게)를 조절하며 제자리 드리블을 한다. 4) 좌우 크로스오버, 윈드실드 와이퍼 드리블 및 다리 사이와 등 뒤로 넘기는 드리블을 연습한다.</p>
