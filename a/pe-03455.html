<h1>균형 잡기 주사위</h1>
<p>1) 6명이 한 모둠을 이루어 1번부터 6번까지 순서를 정하고 각자 원마커 위에 선다. 2) 1번부터 순서대로 대형 주사위를 굴린다. 3) 주사위 눈(1~6)에 해당하는 균형 잡기 동작을 확인하고 5초 동안 자세를 유지한다. 4) 5초 동안 균형 동작을 성공적으로 유지하면 1점을 획득하며, 가장 높은 점수를 얻은 모둠이 이긴다.</p>
