<h1>벽을 이용한 단계별 옆돌기(측전) 연습</h1>
<p>1) 벽을 정면으로 마주 보고 선 뒤 손을 바닥에 짚는다.2) 벽을 따라 발을 여러 번 디디며 벽면을 타고 옆으로 넘어가는 형태를 익힌다.3) 익숙해지면 발 디디는 횟수를 점차 줄여 한두 번만 디디고 넘어가도록 한다.4) 다리를 점차 높이 차올려 벽에 닿지 않고 혼자서 옆돌기를 완성한다.</p>
