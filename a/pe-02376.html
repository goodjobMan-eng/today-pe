<h1>스포츠스태킹 3단 쌓기 도전</h1>
<p>1) 컵 3개를 준비하여 겹쳐서 중앙에 둔다. 2) 오른손으로 1개의 컵을 꺼내고 왼손으로 1개의 컵을 위에 쌓는 업스태킹을 수행한다. 3) 오른손으로 위의 컵을 내리고 왼손으로 나머지 1개를 얹는 다운스태킹을 수행한다. 4) 스페이스바 타이머를 누른 뒤 3단 스태킹을 정해진 횟수만큼 빠르게 완료하고 다시 스페이스바를 누른다.</p>
