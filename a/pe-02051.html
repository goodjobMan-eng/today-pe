<h1>볼링 핀 야구</h1>
<p>1) 타석에서 가까운 구역부터 1점(4개), 2점(3개), 3점(3개)으로 볼링핀 10개를 배치한다. 2) 주먹으로 공을 쳐서 볼링핀을 쓰러뜨린다. 3) 가장 높은 점수의 볼링핀 점수만 획득 점수로 인정된다. 4) 자신이 친 후 볼링핀을 다시 세우고, 3세트를 번갈아 공격하여 점수가 높은 팀이 승리한다.</p>
