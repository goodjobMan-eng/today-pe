<h1>신문지 격파 펀치와 킥 놀이</h1>
<p>1) 두 사람이 짝을 지어 한 명은 신문지를 양손으로 팽팽하게 펴서 잡고 다른 한 명은 앞에 선다. 2) 신문지를 잡은 사람이 신호하면 주먹으로 신문지 중앙을 힘차게 쳐서 뚫는다. 3) 주먹 찌르기뿐만 아니라 발차기, 수도 치기 등 다양한 동작으로 신문지를 찢는다. 4) 역할을 바꾸어 번갈아 도전하며 가장 통쾌하게 격파한 동작을 찾아본다.</p>
