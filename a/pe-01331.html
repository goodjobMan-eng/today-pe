<h1>바운다룬 네트 배구</h1>
<p>1) 준비: 네트를 사이에 두고 양쪽 코트에 3~4명씩 배치되며 모든 학생이 바운다룬을 하나씩 쥐고 준비한다. 2) 진행: 서브로 띄운 공을 팀원끼리 2~3회 패스하여 연결한 뒤 네트 너머 상대 진영으로 튕겨 넘긴다. 3) 득점: 상대 팀이 공을 떨어뜨리거나 네트에 걸리면 1점을 획득하며 정해진 점수를 먼저 낸 팀이 승리한다. 4) 변형: 네트 경기 전 1인 연속 튕기기, 앞뒤 뒤집어 튕기기, 2인 짝 패스 랠리로 단계별 적용이 가능하다.</p>
