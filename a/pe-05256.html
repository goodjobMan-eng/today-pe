<h1>키노피오의 할로윈 런 (Toad's Halloween Run)</h1>
<p>1) 화면 속 유령과 장애물을 점프하기, 숙이기, 펀치하기, 킥하기 등으로 피하며 달린다.2) 각 레벨이 끝나면 지정된 요가 자세를 유지하여 사탕 바구니를 선택한다.3) 마지막 레벨에서 상자 셔플 퍼즐을 보고 사탕이 숨겨진 상자를 자세 유지로 맞힌다.</p>
