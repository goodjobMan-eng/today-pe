<h1>세이버 스톰프 히어로 (스타워즈 브레인 브레이크)</h1>
<p>1) 응원할 스타워즈 캐릭터를 정하고 트랙을 따라 내려오는 버튼을 주시한다.2) 버튼이 플레이 존에 들어올 때 지정된 동작(파란색=왼쪽 세이버 공격, 노란색=왼발 쿵 구르기/홉, 보라색=오른발 쿵 구르기/홉, 노랑+보라=점프, 빨간색=오른쪽 세이버 공격)을 수행한다.3) 라운드 중간의 미니 댄스 브레이크 시간에는 동작을 따라 하거나 자유롭게 춤을 춘다.</p>
