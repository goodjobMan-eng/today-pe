<h1>미니 크리켓</h1>
<p>1) 타격팀과 수비팀으로 나누고 코트에 위켓(골대)과 베이스 마커를 설치한다. 2) 투수가 공을 바운드시켜 던지면 타자는 목재 패들로 체육관 빈 공간으로 공을 친다. 3) 타자는 배트를 쥔 채 베이스 마커를 찍고 다시 위켓으로 돌아오며 왕복 1회당 1점을 획득한다. 4) 수비수가 공을 잡아 위켓을 맞히기 전에 타자가 베이스를 터치해야 세이프가 된다.</p>
