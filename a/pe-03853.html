<h1>푸시업 &amp; 컬업 인터벌 측정</h1>
<p>1) 교사의 구령 오디오에 맞춰 팔굽혀펴기(푸시업)를 '다운-업' 리듬에 따라 실시한다. 2) 지정된 횟수(5회, 10회, 20회 등)의 푸시업을 마친 뒤 컬업(윗몸일으키기) 단계로 전환한다. 3) 컬업 구령에 맞춰 '업-다운' 리듬으로 복근 운동을 수행한다. 4) 푸시업과 컬업을 번갈아 진행하며 체력 기준에 도전한다.</p>
