<h1>야구 기초 투구 동작 연습</h1>
<p>1) 검지와 중지를 실밥에 걸치고 엄지 제1관절을 공 밑에 받쳐 쥐며 새끼손가락을 모은다.2) 공을 던지기 전 팔 전체를 크게 돌려 어깨와 팔꿈치 힘을 뺀다.3) 축이 되는 발을 90도로 돌리고 반대 발을 목표 방향으로 크게 디디며 팔을 앞으로 휘두른다.</p>
