<h1>티볼 배팅 연습 스테이션</h1>
<p>1) 3인 1조(타자, 별 마커의 투수, 콘 위치의 외야수) 또는 4인 1조(포수 추가)로 조를 구성한다. 2) 타자는 배팅 티 위에 놓인 공을 치며, 3~5학년은 투수가 직접 던져주는 공을 칠 수도 있다. 3) 외야수는 타구를 쫓아가 잡아 투수에게 넘겨주고, 투수는 공을 받아 다시 배팅 티에 올려놓는다. 4) 저학년은 5분마다 포지션을 교대하고, 고학년은 3분 또는 타자당 5회 타격 후 역할을 순환한다.</p>
