<h1>원 마커로 돌아와</h1>
<p>1) 두 명이 한 모둠을 이루고 두 모둠이 네트를 사이에 두고 게임을 한다. 2) 각 모둠원은 수비 위치를 정해 원 마커를 놓고 한 발로 밟고 서 있다가 셔틀콕이 넘어오면 치고 원 마커로 돌아온다. 3) 원 마커로 돌아오지 않은 상태에서 셔틀콕을 치면 상대 모둠이 1점을 얻는다. 4) 셔틀콕이 상대 모둠 코트 바닥에 떨어지거나 상대 모둠이 친 셔틀콕이 코트 밖으로 나가면 1점을 얻으며, 15점을 먼저 얻은 모둠이 이긴다.</p>
