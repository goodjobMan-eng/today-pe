<h1>체조 스테이션 활동</h1>
<p>1) 미니 트램펄린에서 도약하여 스트래들 점프를 하고 모터바이크 자세로 착지한다.2) 웨지 매트 위에 누워 무릎을 가슴으로 모으고 턱을 당겨 에그 롤을 실시한다.3) 벽에 기댄 웨지 매트 위로 발을 올려 물구나무서기 형태의 스파이더맨 워크를 수행한다.4) 철봉 매달리기, 지지하여 다리 흔들기, 평균대 위 걷기, 훌라후프 점프 등 각 스테이션 과제를 순환하며 수행한다.</p>
