<h1>고무신을 받아랏</h1>
<p>1) 전체 인원을 둘로 나누고 머리 위에 바구니를 올려 고무신을 받아낼 바구니 동자를 정합니다. 2) 출발선에서 고무신을 쥐고 출발하여 슛 라인에서 고무신으로 바꿔 신습니다. 3) 슛을 하는 학생은 라인에서 고무줄 장애물을 넘겨 바구니 동자의 바구니 속으로 슛을 합니다. 4) 바구니 동자는 수비 라인 안에서 바구니로 받고 주자는 출발선으로 돌아와 다음 주자와 손바닥 터치를 합니다.</p>
