<h1>허리 틀어 매트 뛰어넘기 (옆돌기 기초 연습)</h1>
<p>1) 매트 옆에 측면으로 쪼그려 앉아 준비 자세를 취합니다. 2) 앉은 상태에서 상체를 틀며 진행 방향 앞쪽 손을 매트 앞부분에 먼저 짚습니다. 3) 반대쪽 먼 손을 매트 건너편에 짚고 두 손으로 바닥을 강하게 지지합니다. 4) 두 손으로 체중을 지탱하면서 엉덩이와 허리를 띄워 매트를 뛰어넘어 반대편에 착지합니다.</p>
