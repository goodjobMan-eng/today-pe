<h1>주사위 피트니스(Würfel Fitness)</h1>
<p>1) 정해진 주사위 스테이션에 가서 주사위를 굴린다. 2) 굴려서 나온 숫자에 해당하는 번호의 운동 과제 카드를 찾는다. 3) 사전에 지정된 구역에서 해당 카드에 적힌 운동 과제를 완료한다. 4) 과제를 마친 후 다시 주사위 스테이션으로 이동하여 주사위를 굴리고 다음 과제를 수행한다.</p>
