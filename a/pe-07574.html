<h1>체력운동 마블</h1>
<p>1) 참여자가 한 명씩 주사위를 굴려 가장 높은 수가 나온 순서대로 순번을 정한다. 2) 차례대로 주사위를 굴려 나온 수만큼 보드판 위의 자석 말을 이동시킨다. 3) 말이 도착한 위치에 적혀 있는 체력운동 명칭을 확인하고 해당 운동을 실시한다. 4) 황금열쇠 칸에 도착하면 해당하는 미션 카드를 뽑아 미션을 수행한다. 5) 참여자 전원이 보드판을 총 한 바퀴 돌 때까지 번갈아가며 주사위를 던지고 운동을 반복한다.</p>
