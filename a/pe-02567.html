<h1>공 2개 저글링 기초 연습</h1>
<p>1) 양손에 공을 하나씩 잡고 머리 높이까지 비슷하게 던져 받기를 8회 연습한다. 2) 대각선 방향으로 공을 하나씩 연속으로 던져 교차하며 받기를 8회 연습한다. 3) 한 손에 공 2개를 쥐고 앞쪽 공을 먼저 던진 후 내려올 때 뒤쪽 공을 던져 연속으로 받아낸다.</p>
