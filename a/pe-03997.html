<h1>컬러 스팟 농구 드리블</h1>
<p>1) 화면에 제시되는 특정 드리블 동작을 구역 내를 자유롭게 이동하며 수행한다. 2) 호루라기 신호가 울리면 주변에 있는 원마커(스팟)를 찾아 올라선다. 3) 자신이 밟은 스팟의 색상과 일치하는 공 다루기(핸들링) 기술을 수행한다. 4) 라운드가 바뀔 때마다 지정되는 드리블 방식과 스팟별 핸들링 동작을 변경하여 진행한다.</p>
