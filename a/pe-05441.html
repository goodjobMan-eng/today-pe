<h1>뉴글러브 땅볼 및 플라이볼 캐치 연습</h1>
<p>1) 짝과 마주 보고 서서 뉴글러브를 착용하고 공 2개를 준비한다.2) 한 사람이 바닥으로 공을 굴려 땅볼을 주면 상대방이 글러브로 잡고 바운드하여 다시 던져준다.3) 포물선으로 높게 공을 띄워 플라이볼을 던져주고 상대방이 캐치한다.4) 원마커를 베이스로 활용하여 글러브로 공을 잡으며 발로 베이스를 밟는 투구 및 캐치볼 연습으로 연계한다.</p>
