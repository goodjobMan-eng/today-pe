<h1>소공간 체육 게임</h1>
<p>1) 가위바위보에서 진 사람은 제자리에서 3바퀴 돈 뒤 파트너를 쫓아가 태그합니다. 2) 풀누들 절반으로 풍선을 쳐서 상대 팀 벽에 맞히면 점수를 획득합니다. 3) 벽을 공이나 무언가의 경계로 사용하여 탈락자가 생길 때까지 공을 맞히거나 피하는 게임을 진행합니다.</p>
