<h1>뜀틀 지지하여 올라타기 및 뛰어내리기</h1>
<p>1) 발구름판 앞까지 달려와 마지막 한 걸음에서 한 발로 딛고, 구름판은 두 발로 강하게 굴러 뜁니다. 2) 뜀틀의 먼 쪽 모서리를 양손으로 힘차게 짚으며 몸을 띄웁니다. 3) 뜀틀 상단에 두 발을 모아 안전하게 웅크려 올라탄 뒤 중심을 잡고 일어섭니다. 4) 앞쪽 매트를 향해 가볍게 뛰어내리며 무릎을 살짝 굽혀 충격을 흡수하며 착지합니다.</p>
