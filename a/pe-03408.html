<h1>동그라미 대장공</h1>
<p>1) 폼볼이나 소프트 발리볼을 준비하고 두 편으로 나누어 한 팀은 바깥쪽에, 다른 팀은 안쪽 도너츠 구역에 자리를 잡는다. 2) 바깥쪽 팀이 공을 안쪽에 있는 자기 팀 대장에게 패스하여 전달한다. 3) 대장이 공을 잘 잡으면 1점을 얻는다. 4) 제한 시간 2분 또는 3분 뒤에 공수를 교대한다.</p>
