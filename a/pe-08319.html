<h1>배구 스파이크 스텝 훈련</h1>
<p>1) 오른손잡이 기준 왼발을 길게 내딛으며 '타-안' 박자에 힘을 모은다. 2) 오른발 뒤꿈치로 강하게 디디며 '타', 왼발 발바닥 전체로 지면을 누르며 '탄'의 연속 스텝을 밟는다. 3) 도움닫기의 전진력을 양팔 스윙과 함께 위로 끌어올리며 점프한다.</p>
