<h1>집에서 즐기는 세 가지 씨름 놀이(팔씨름·손씨름·발치기 씨름)</h1>
<p>1) 팔씨름은 팔꿈치를 대고 손을 잡은 뒤 반대 손으로 받쳐주고 시작 신호에 맞춰 자기 쪽으로 넘긴다.2) 손씨름은 마주 서서 양손을 잡고 당기거나 밀어서 상대를 먼저 넘어뜨린다.3) 발치기 씨름은 서로 다리를 걸치고 중심을 무너뜨려 상대를 넘어뜨리거나 균형을 잃게 한다.</p>
