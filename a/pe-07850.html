<h1>바다괴물 놀이</h1>
<p>1) 강당 중앙에 큰 매트(바다괴물 진지)를 놓고 네 구역 모퉁이에 동물별(상어, 돌고래, 고래, 가오리) 매트를 둔다. 2) 교사의 신호에 맞춰 학생들이 매트 주변을 자유롭게 달린다. 3) 교사가 동물 이름을 외치면 중앙의 바다괴물이 해당 동물을 잡으러 뛰어가고, 잡힌 학생은 바다괴물이 된다.</p>
