<h1>론 다이스 링 굴리기 게임</h1>
<p>1) 표적 원형 링(훌라후프)을 바닥에 두고 일정한 거리 뒤에 서서 순서를 정한다. 2) 한 발을 출발 링 안에 두고 차례대로 큰 주사위를 굴려 표적 링 안으로 넣기를 시도한다. 3) 주사위가 링 안에 완전히 멈추면 주사위 윗면에 나온 눈의 수만큼 점수를 획득한다. 4) 정해진 횟수(4회) 동안 번갈아 던진 후 획득한 눈의 합계를 계산하여 더 높은 점수를 얻은 편이 승리한다.</p>
