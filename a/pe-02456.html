<h1>점보컵 플라프 릴레이 및 미션 게임</h1>
<p>1) 출발선에서 달려가 점보컵 3개-6개-3개를 순서대로 쌓은 뒤 반환점을 돌아온다. 2) 돌아오면서 쌓여 있는 점보컵 3개-6개-3개를 다시 정리하고 타이머를 멈춘다. 3) 변형 게임에서는 반환점에서 물병 세우기 등의 미션을 성공한 후 컵을 정리한다. 4) 정리 후 공을 던져 점보통이나 플라프 구역(100점~400점)에 넣어 획득한 점수와 들어온 순서 점수를 합산해 승패를 가린다.</p>
