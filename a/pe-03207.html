<h1>공 몰기 기초 활동</h1>
<p>1) 손으로 공 몰기: 팔과 손목을 이용하여 공을 바닥에 튀기며 이동한다. 2) 발로 공 몰기: 발 안쪽으로 공을 몰며 천천히 이동한다. 3) 채로 공 몰기: 몸의 가운데에 공을 놓고 채의 안쪽과 바깥쪽 면으로 공을 몰며 이동한다.</p>
