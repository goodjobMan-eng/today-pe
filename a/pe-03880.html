<h1>포 코너 태그 매트 릴레이</h1>
<p>1) 강당 모서리에 매트(또는 콘)로 벽을 세우고 두 팀으로 나눈다. 2) 각 팀의 첫 주자가 폼 태그 스틱을 들고 강당 둘레를 한 바퀴 달린다. 3) 주자는 다음 주자에게 태그 스틱을 넘겨주고 줄 맨 뒤로 이동한다. 4) 앞서 달리는 상대 팀 주자를 추격하여 태그 스틱으로 터치하면 1점을 획득한다.</p>
