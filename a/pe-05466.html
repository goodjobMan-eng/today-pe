<h1>체육수업 기본 이동 스텝 4가지</h1>
<p>1) 공간을 이동하다가 마주친 동료와 하이파이브를 나눈다.2) 걷기(Walking)와 가볍게 뛰기(Jogging/Running) 스텝으로 공간을 이동한다.3) 한 발로 뛰는 홉(Hop)과 두 발로 도약하는 점프(Jump) 등 다양한 이동 기술을 순서대로 익힌다.</p>
