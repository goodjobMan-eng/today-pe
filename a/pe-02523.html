<h1>농구 &amp; 훌라후프 복합 6개 스테이션 활동</h1>
<p>1) 후프 6개로 집(오두막)을 지어 인형을 던져 넣는 '후라 헛 토싱', 원마커에서 슛을 성공해 마커를 모으는 '핫샷 슈팅'을 진행한다. 2) 후프를 굴려 티볼 배팅 티를 맞추는 롤링과, 줄넘기로 끄는 후프 안으로 드리블하며 따라가는 '워크 더 도그'를 실시한다. 3) 원형으로 바운스 패스를 돌릴 때마다 통을 쌓는 빌더 활동과 플랭크 자세로 후프 간 빈백을 이동시키는 릴레이를 로테이션한다.</p>
