<h1>늑대와 얼음 깽깽이 술래잡기</h1>
<p>1) 늑대(술래) 2명을 정하고 나머지 도망자들은 경기장 안에서 달린다 2) 늑대에게 첫 번째로 태그당하면 한쪽 다리를 잃어 깽깽이(외발)로만 이동해야 한다 3) 한쪽 다리로 이동 중인 상태에서 늑대에게 두 번째 태그를 당하면 다리를 벌린 채 얼음 상태로 멈춘다 4) 다른 생존자가 얼음이 된 사람의 다리 사이를 통과하면 다시 풀려나 달릴 수 있다</p>
