<h1>911 헬프 스쿠터 태그</h1>
<p>1) 학생 전원이 스쿠터보드에 타고, 빨간 폼스틱을 든 술래 4명과 빨간 공(밴드)을 든 구조대원 6명을 정한다 2) 술래를 피해 스쿠터보드를 타고 이동하며 활동을 진행한다 3) 술래의 폼스틱에 태그당한 학생은 스쿠터보드를 뒤집어 놓고 그 위에 앉아 '911 헬프'를 외친다 4) 구조대원이 다가와 빨간 공을 건네주거나 던져주면 부활하여 다시 스쿠터를 타고 참여한다</p>
