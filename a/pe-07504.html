<h1>블롭 술래잡기</h1>
<p>1) 두 명의 술래가 손을 잡고 블롭이 되어 출발한다. 2) 손을 놓치지 않고 다른 사람을 터치하며, 터치된 사람은 손을 잡고 블롭의 일원이 된다. 3) 블롭이 4명이 되면 2명씩 둘로 나뉘어 계속해서 남은 사람들을 쫓아가며, 10분이 지나거나 모두 잡힐 때까지 진행한다.</p>
