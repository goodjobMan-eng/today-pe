<h1>보조 받으며 턱걸이 뒤집기(역오르기)</h1>
<p>1) 팔을 굽혀 몸이 철봉 아래에 오도록 밀착시킨다.2) 발을 앞뒤로 벌리고 서서 발을 위로 차올린다.3) 보조자는 다리 움직임에 맞춰 원을 그리듯 허리를 밀어 올려 철봉 위에 얹어준다.4) 배가 철봉에 닿으면 제비 자세를 취하며 마무리한다.</p>
