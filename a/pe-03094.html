<h1>티볼 캐치볼 5단계 연습</h1>
<p>1) 어깨를 열고 힘을 완전히 뺀 상태에서 가볍게 툭 던지는 힘 빼고 던지기를 10회 이상 연습한다. 2) 상대방의 턱과 가슴 사이 높이를 향해 팔을 펴서 릴리스 포인트를 일정하게 맞추며 짧고 빠르게 던진다. 3) 오른손잡이는 왼발을 앞으로 딛는 스텝(1, 2, 3)을 활용하여 거리를 두고 길게 던진다. 4) 자세를 낮추고 바운드되어 오는 공을 글러브를 열어 다른 손으로 덮으며 잡는 연습과 머리 위 높은 공 잡기를 진행한다.</p>
