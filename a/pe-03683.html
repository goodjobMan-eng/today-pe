<h1>수건 오버스윙 네트 맞히기</h1>
<p>1) 수건 1장을 접어 끝부분을 묶어 단단한 매듭을 만든다. 2) 농구 골대 대각선 아래에 서서 발을 어깨너비보다 넓게 벌리고 양팔을 뻗어 대자(大) 자세를 취한다. 3) 수건을 쥔 쪽 발에 체중을 싣고 반대쪽 손과 어깨를 골대 네트로 향한다. 4) 수건을 뒤로 뺐다가 머리 위를 지나도록 크게 휘둘러 매듭 끝이 골대 네트에 닿게 스윙한다.</p>
