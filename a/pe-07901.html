<h1>뜀틀을 활용한 월스핀 단계별 연습</h1>
<p>1) 뜀틀을 대형 매트에서 30cm 거리에 두고 한쪽 손을 짚으며 넘는 엎드려넘기(Hockwende) 연습을 한다. 2) 뜀틀을 매트에 점점 가깝게 밀착시켜 몸이 벽을 타듯 가파르게 넘어가도록 각도를 높인다. 3) 뜀틀을 치우고 매트를 비스듬히 세운 뒤 양손으로 매트를 짚으며 뛰어넘어 회전 동작을 완성한다.</p>
