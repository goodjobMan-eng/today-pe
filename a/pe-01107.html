<h1>테이블 바운딩 스태킹 게임</h1>
<p>1) 책상을 사이에 두고 마주 앉아 각자 자기 앞쪽에 스태킹 컵 3개를 간격을 두어 세워 둔다. 2) 탱탱볼을 책상 위에 1회 원바운드 시켜 상대방 쪽 테이블 위에 세워진 컵 안으로 골인시킨다. 3) 공이 컵 안으로 들어가면 성공한 컵을 차례대로 하나씩 포개어 쌓는 스태킹을 진행한다. 4) 먼저 3개의 컵을 모두 포개어 정리한 사람이 승리하며, 책상 거리를 넓혀 난이도를 조절할 수 있다.</p>
