<h1>사자 우리 탈출 게임</h1>
<p>1) 교사(사자)가 원 중앙에 서고, 유아들(우리)은 손을 맞잡고 둥글게 원을 만들어 둘러싼다. 2) 사자가 밑으로 나가려 하면 아이들은 쪼그려 앉아 우리를 막고, 위로 탈출하려 하면 만세를 불러 팔을 올려 막는다. 3) 손을 놓치지 않고 사자를 우리 안에 가두어 두면 아이들 팀의 승리가 된다. 4) 사자가 우리를 뚫고 탈출하면 아이들은 빠르게 지정된 집(매트)으로 달려가 대피해야 하며, 잡히지 않아야 한다.</p>
