<h1>킨볼 독극물 공 게임</h1>
<p>1) 학생들이 원 모양으로 서고 다른 그룹의 학생들이 원 안쪽에 선다. 2) 원 바깥쪽 학생들은 킨볼을 손으로 쳐서 안쪽 학생들을 맞힌다. 3) 공에 맞은 학생은 지정된 구역으로 가서 운동을 하고 완료하면 게임에 복귀한다. 4) 게임은 2분에서 3분간 진행된다.</p>
