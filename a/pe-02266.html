<h1>목표물에 정확히 굴려라</h1>
<p>1) 출발점에 원마커를 놓고 일정 거리에 훌라후프들을 볼링 핀 모양이나 네모 모양으로 바닥에 배치한다. 2) 훌라후프 안에는 1부터 9까지 숫자가 적힌 원마커를 넣는다. 3) 출발선에서 공을 굴려 훌라후프 안에 멈추면 해당 원마커에 적힌 점수를 획득한다. 4) 모둠의 첫 주자는 훌라후프 뒤쪽에 서서 굴러온 공을 줍고 점수를 확인한다.</p>
