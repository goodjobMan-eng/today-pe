<h1>애벌레 산책 놀이</h1>
<p>1) 애벌레가 되었다고 상상하며 교사의 안내에 따라 오른발과 왼발을 맞추어 걷는다.2) 구덩이가 나오면 발을 들어 지나가고, 비가 오면 나뭇잎 밑으로 몸을 숨긴다.3) 웅덩이가 나오면 발끝을 들고 조심조심 건너간다.4) 새가 날아올 때는 몸을 낮춰 피하고 먹이를 찾아 먹은 뒤 집으로 돌아온다.</p>
