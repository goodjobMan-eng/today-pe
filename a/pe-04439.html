<h1>농구 기초 볼 컨트롤 연습</h1>
<p>1) 바디 랩: 배 주위로 공을 한쪽 방향으로 돌리고, 반대 방향으로 돌린 뒤 다리 주위나 한쪽 다리 주위로도 돌린다. 2) 드롭 앤 캐치: 무릎을 굽히고 공을 다리 사이에 둔 채 한 손은 앞, 한 손은 뒤로 잡고 살짝 띄운 뒤 앞뒤 손을 바꿔 잡는다. 3) 스텝 앤 스루: 앞으로 한 걸음씩 걸어가며 매 걸음마다 다리 사이로 공을 통과시키고, 뒤로도 걸으며 실시한다.</p>
