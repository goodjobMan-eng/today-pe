<h1>도트볼(피구) 게임</h1>
<p>1) 양 팀이 내야와 외야로 나뉘어 상대의 내야 플레이어에게 볼을 맞춘다. 2) 볼이 맞고 바닥에 떨어진 경우 맞은 플레이어는 아웃되어 외야로 이동한다. 3) 외야 플레이어가 내야 플레이어에게 볼을 맞추면 아웃된 플레이어가 내야로 들어온다. 4) 마지막까지 내야에 남아 있던 플레이어의 수로 승패를 결정한다.</p>
