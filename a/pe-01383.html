<h1>전국축전 남자 결승전 타깃 피구</h1>
<p>1) 코트 내야와 외야 라인을 표시하고 양 팀 각 10명 이상의 선수가 준비한다. 2) 점프 패스와 외야 롱패스를 활용하여 상대 수비의 시선을 분산시키고 하체를 타깃으로 공격한다. 3) 상대 선수의 몸이나 발을 맞혀 아웃시키며 공이 바닥에 닿기 전 직접 잡아내면 공격권을 유지한다. 4) 경기 시간을 3~5분으로 제한하거나 특정 구역 외야수만 공격할 수 있도록 변형한다.</p>
