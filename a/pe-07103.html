<h1>완전 쉬운 줄넘기 기본기술 2탄</h1>
<p>1) 크루거는 한쪽 다리를 들고 종아리 쪽으로 손을 넣어 넘은 후 팔을 교차(X)하거나 그대로 빼서 오픈(O)으로 연결한다. 2) 인버스는 든 다리와 같은 쪽 손을 먼저 다리 아래로 넣고 반대 손을 엇갈려 넣은 뒤 넘는다. 3) 엘리펀트는 한쪽 다리를 든 상태에서 양손을 모두 다리 사이로 깊숙이 넣어 넘는다. 4) A.S와 C.L은 무릎을 낮추고 손을 다리 아래나 허리 쪽으로 넣어 넘는 동작으로 순서대로 연습한다.</p>
