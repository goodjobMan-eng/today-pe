<h1>앞, 뒤, 콩, 콩, 콩, 기차놀이</h1>
<p>1) 4명이 한 모둠을 이루고 한 줄로 서서 앞 모둠원의 어깨에 손을 올려 기차를 만듭니다. 2) 신호에 맞추어 구호를 외치며 모둠발로 앞으로 또는 뒤로 뛰어 움직입니다. 3) 상대 모둠 기차와 만나면 맨 앞에 있는 모둠원끼리 가위바위보를 합니다. 4) 지면 진 모둠의 맨 앞 사람이 이긴 모둠의 맨 뒤로 가며, 정해진 시간 후 가장 긴 기차 모둠이 이깁니다.</p>
