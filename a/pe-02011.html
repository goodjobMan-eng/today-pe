<h1>교실에 있는 물건 표현하기</h1>
<p>1) 교실 물건이 그려진 그림 카드를 관찰하고 표현할 대상을 선정합니다. 2) 크고 작음, 뾰족함과 둥긂, 넓고 좁음 등 형태의 차이가 나도록 몸으로 모양을 모방합니다. 3) 선풍기 등 물건의 동작을 빠르고 느리게, 직선과 곡선 움직임으로 비교하며 표현합니다. 4) 친구들과 협동하여 교실 물건의 특징을 살린 신체 표현 동작을 완성합니다.</p>
