<h1>발렌타인데이 그린치 런 브레인 브레이크</h1>
<p>1) 화면을 보며 발렌타인데이 장식물을 피하고 도로를 질주한다. 2) 집 안에 들어가 카드는 발로 차고 풍선은 터뜨린다. 3) 리본을 풀기 위해 제자리에서 회전하고 하트 케이크는 점프하여 밟는다. 4) 거리로 나와 음악에 맞춰 춤을 추며 날아오는 장식물을 피하고 사탕을 되던지는 동작을 한다.</p>
