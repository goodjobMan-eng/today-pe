<h1>공을 들고 뛰어라 게임</h1>
<p>1) 바닥에 경기장 영역과 득점 구역을 표시하고 공은 하나만 준비한다. 2) 각 모둠은 자기 영역에 위치하며 공을 들고 달리거나 패스하면서 상대 모둠의 득점 구역으로 전진한다. 3) 공을 패스할 때는 반드시 뒤쪽에 있는 친구에게만 이어줄 수 있다. 4) 공을 가진 모둠이 득점 구역에 도착하면 1점을 얻고 수비는 공을 뺏거나 가로챌 수 있으며 앞쪽 패스나 밀치기는 반칙이다.</p>
