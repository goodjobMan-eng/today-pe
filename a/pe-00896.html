<h1>닌자 나우! 바이러스 퇴치 타바타 운동</h1>
<p>1) 사막, 기차역 등 세계 곳곳에 출몰하는 바이러스를 물리치기 위해 제자리에서 전력 질주하며 이동합니다. 2) 화면에 다가오는 붉은색 바이러스는 발차기로, 파란색/보라색 바이러스는 손날 당수로 쳐서 파괴합니다. 3) 중간에 등장하는 건강한 음식을 먹는 모션을 취해 에너지를 채우고, 사탕이나 방해물은 피합니다. 4) 최종 보스 바이러스가 나타나면 강력한 점프와 파워 킥 등 슈퍼파워를 연속으로 사용하여 퇴치합니다.</p>
