<h1>물과 친해지는 다양한 활동 및 뜨기</h1>
<p>1) 물 약하게 뿌리기, 걸터앉아 발로 물장구치기, 물속에서 숨 오래 참기, 얕은 물에서 어깨 짚고 걷기, 벽 잡고 걷기를 한다. 2) 물로 얼굴을 적시고 담그기, 고개를 담그고 숨 참기, 바둑알 줍기, 물속에서 가위바위보 하기를 한다. 3) 엎드려 뜨기, 해파리 뜨기, 새우등 뜨기, 부판 안고 누워서 뜨기, 잎새 뜨기 등 다양한 방법으로 물에 뜬다.</p>
