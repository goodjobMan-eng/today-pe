<h1>마리오 카트 홈 트레이닝 운동</h1>
<p>1) 화면에 제시된 두 캐릭터 중 좋아하는 캐릭터를 선택해 10초간 고른다. 2) 20초 동안 제시되는 타이머에 맞춰 해당 캐릭터의 운동을 수행한다. 3) 운동이 끝나면 마리오 카트 레이스 영상이 재생되는 것을 감상한다.</p>
