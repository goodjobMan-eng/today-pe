<h1>깃발 뺏기 (Flagi)</h1>
<p>1) 경기장을 양 팀 구역으로 나누고 각 구역에 깃발 영역과 감옥을 설치한다. 2) 자신의 진영에서는 안전하지만 상대 진영으로 넘어가면 태그될 수 있으며, 태그된 사람은 상대 감옥으로 이동한다. 3) 감옥에 갇힌 사람은 태그되지 않고 자신의 진영으로 달려 돌아오면 부활한다. 4) 깃발 영역에 도달하면 무적 상태가 되며, 깃발을 들고 자신의 진영으로 무사히 돌아오면 득점한다.</p>
