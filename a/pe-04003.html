<h1>하키 스틱핸들링 및 슛 스테이션</h1>
<p>1) 짝과 원마커 위에 서서 퍽이 바닥에서 뜨지 않도록 손목을 밀며 플랫 패스를 주고받는다. 2) 콘 3개 사이를 지그재그로 통과하며 왕복 스틱핸들링 기술을 연습한다. 3) 돔과 콘 장애물을 통과하며 퍽을 제어하고 정해진 구역 안에서 드리블한다. 4) 골대를 향해 1회 슛을 시도하여 볼링핀을 넘어뜨리고 스틱으로 퍽을 다시 가져온다.</p>
