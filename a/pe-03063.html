<h1>홈 풍선 배구 스파이크</h1>
<p>1) 벽이나 문에 표적이 될 신문지를 붙이고 풍선을 분다. 2) 신문지로부터 두 발자국 뒤에 선 뒤, 왼발을 앞으로 두고 대기한다. 3) 왼손으로 풍선을 위로 띄우고 오른손 팔꿈치를 어깨 위로 들어 허리를 젖혔다 펴며 신문지를 향해 스파이크한다. 4) 총 10번 시도하여 신문지 표적을 5번 맞히는 것에 도전하며, 익숙해지면 세 발자국 뒤나 언더핸드·오버헤드 토스 후 연결하여 시도한다.</p>
