<h1>체육관 라인 팩맨 술래잡기</h1>
<p>1) 체육관 코트 라인 위에 모든 학생이 흩어져 서고 술래 1명을 팩맨으로 지정합니다. 2) 신호가 울리면 모든 학생은 오직 바닥의 라인 위만 밟고 이동해야 합니다. 3) 팩맨은 두 팔로 입 모양을 흉내 내며 라인을 따라 도망자를 태그하고, 태그된 도망자는 새로운 팩맨으로 변합니다. 4) 시간이 흐를수록 늘어나는 팩맨들을 피해 라인 교차로를 활용하여 끝까지 살아남습니다.</p>
