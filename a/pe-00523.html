<h1>의자를 활용한 백핸드스프링 기초 익히기</h1>
<p>1) 보조자가 의자 옆에 서고 활동자는 의자 위에 등을 지고 앉으며, 보조자는 활동자의 등과 허리를 두 손으로 단단하게 받칩니다. 2) 활동자는 뒤로 천천히 젖히며 바닥에 양손을 짚어 물구나무 자세를 만듭니다. 3) 손이 바닥에 완전히 닿은 것을 확인한 후 보조자가 다리를 들어 올려 넘겨 줍니다. 4) 활동자는 착지 후 균형을 잡고 마무리 포즈를 취합니다.</p>
