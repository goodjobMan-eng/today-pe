<h1>자이언트 스노우볼 술래잡기</h1>
<p>1) 술래는 큰 공을 굴리거나 밀어서 다른 학생을 맞힌다. 2) 술래는 공을 들고 던질 수 없다. 3) 술래에게 맞은 학생은 제자리에 앉는다. 4) 앉아 있는 학생은 다른 학생이 가볍게 터치해주면 다시 게임에 참여할 수 있다.</p>
