<h1>고무줄놀이 아메리칸스 패턴</h1>
<p>1) 양쪽 친구가 발목에 고무줄을 걸고 벌려 선다.2) 가운데 주자가 1, 2, 3, 4 박자에 맞춰 발을 벌려 안팎으로 뛰는 4회 스트래들 점프를 한다.3) 고무줄 안(in), 고무줄 위 밟기(on), 밖(out) 순서로 발을 이동한다.4) 성공하면 고무줄 높이를 종아리, 무릎 순으로 높여 진행한다.</p>
