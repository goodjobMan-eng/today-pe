<h1>아일랜드 호핑</h1>
<p>1) 하프코트 크기의 공간에 4개의 콘으로 직사각형 섬 구역을 만듭니다. 2) 2명의 플레이어가 술래(해적)가 되어 중앙에 위치합니다. 3) 나머지 플레이어들은 농구공을 가지고 각 섬 구역에 분산하여 시작합니다. 4) 신호와 함께 드리블하며 섬에서 섬으로 이동하고 술래는 이동하는 플레이어를 태그합니다. 5) 태그된 플레이어는 공을 옆에 두고 술래가 되며, 모든 플레이어가 잡힐 때까지 진행합니다.</p>
