<h1>컨베이어 벨트 협동 신체 운반</h1>
<p>1) 매트 위에 여러 학생이 머리를 맞대고 지그재그로 바닥에 눕는다. 2) 누워 있는 학생들은 양손을 위로 곧게 뻗어 컨베이어 벨트를 만든다. 3) 운반 대상 학생이 온몸에 힘을 주고 눕고, 누운 학생들이 손을 굴려 끝까지 안전하게 이동시킨다.</p>
