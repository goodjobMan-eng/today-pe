<h1>색깔 발야구</h1>
<p>1) 노랑, 파랑, 초록 세 팀으로 나누고 공격팀에서 공격수 2명이 동시에 공 2개를 찬다. 2) 찬 직후 공격수들은 팀원 줄을 한 바퀴 돌아 원위치로 들어온다. 3) 수비팀들은 각자 팀 조끼 색깔에 맞는 공을 잡아 홈으로 패스하여 보낸다. 4) 홈에 도착한 순서대로 1등 3점, 2등 2점, 3등 1점을 부여한다.</p>
