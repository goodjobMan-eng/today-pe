<h1>구역이 줄어드는 꼬리잡기 타이트 스페이스</h1>
<p>1) 넓은 코트 안에서 모든 학생이 허리 뒤에 꼬리끈(플래그)을 꽂고 준비합니다. 2) 신호가 울리면 자유롭게 뛰어다니며 자신의 꼬리는 지키고 다른 사람의 꼬리를 뺏습니다. 3) 꼬리를 뺏기거나 코트 밖으로 나가면 탈락하여 사이드라인에 대기하며 근처로 오는 선수의 꼬리를 뺏을 수 있습니다. 4) 생존자가 줄어들 때마다 경기장 구역을 절반, 4분의 1로 좁혀 최종 1인이 남을 때까지 겨룹니다.</p>
