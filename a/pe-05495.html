<h1>드리블 술래</h1>
<p>1) 술래 1명을 정하고 나머지 참가자들은 공을 드리블하며 이동한다.2) 술래가 발로 찬 공이나 술래의 몸에 닿지 않도록 공과 몸을 모두 피하며 드리블한다.3) 술래의 공이나 몸에 맞거나 경기장 밖으로 나가면 사이드로 나가 공 위 발바꾸기를 3회 실시한 뒤 다시 참여한다.</p>
