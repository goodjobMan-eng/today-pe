<h1>원마커 하나 빼기</h1>
<p>1) 전체 인원수보다 적게 바닥에 원마커를 배치하고 정해진 구역 안을 자유롭게 돌아다닌다. 2) 호각 신호가 울리면 빈 원마커를 찾아 재빨리 그 위에 올라선다. 3) 두 명이 동시에 하나의 원마커에 올라간 경우 가위바위보를 하여 진 사람이 양보한다. 4) 원마커에 올라가지 못한 학생은 교사 앞으로 모여 경기장을 한 바퀴 돌아 달리고 합류한다.</p>
