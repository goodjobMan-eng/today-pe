<h1>흔들 요람 가위바위보 놀이</h1>
<p>1) 2인 1조로 매트 위에 마주 보고 앉는다. 2) '안 내면 진 거' 구령에 요람 흔들기(몸을 굴려 뒤로 누웠다 일어남)를 1회 하고 일어난다. 3) '가위바위보'를 외치며 다시 요람 흔들기를 하고 일어나 손을 내민다(비기면 '비겼다' 구령과 함께 다시 굴러 승부를 낸다). 4) 가위바위보에서 이긴 사람이 승리한다.</p>
