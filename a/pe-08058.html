<h1>스카이스크레이퍼(고층 빌딩) 킥 게임</h1>
<p>1) 콘 2개를 위아래로 포개어 세워 고층 빌딩(스카이스크레이퍼) 표적을 중앙에 여러 개 설치한다. 2) 학생들은 짝을 이루어 체육관 베이스라인에 서서 준비한다. 3) 차례대로 폼볼을 발로 차서 중앙의 포개진 콘을 맞춰 쓰러뜨린다. 4) 킥을 한 뒤 중앙으로 달려가 공을 회수하여 베이스라인으로 복귀하고, 짝에게 차례를 넘긴다. 5) 마지막 남은 콘 표적을 쓰러뜨린 팀이 나오면 해당 라운드가 종료된다.</p>
