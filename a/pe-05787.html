<h1>몬스터 드리블</h1>
<p>1) 술래인 몬스터 팀은 다른 학생들의 공을 뺏어 경기장 라인 밖으로 차낸다.2) 공이 밖으로 나간 학생은 선에서 다리를 벌리고 공을 든 채 도움을 요청한다.3) 살아있는 친구가 다리 사이로 공을 통과시켜 주면 두 사람 모두 유리한 위치로 이동해 재참여한다.</p>
