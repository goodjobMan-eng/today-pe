<h1>8자 가로채기</h1>
<p>1) 3명이 한 모둠을 이루어 1·2·3번 번호를 정하고 2번과 3번이 일정 거리를 두고 마주 선다. 2) 2번과 3번이 패스를 주고받기 시작하면 수비수인 1번이 중앙에서 8자 궤적으로 달리며 스텝을 밟는다. 3) 1번은 2번과 3번 사이의 패스 공을 가로챈 뒤 패스했던 원 주자에게 바로 되돌려주고 반대편을 향해 돈다. 4) 1번이 가로채기 20회를 성공하면 역할을 교대하며, 패스 속도를 높이거나 바운드 패스로 변형해 난이도를 조절한다.</p>
