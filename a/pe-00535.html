<h1>수건 매듭 피구 놀이</h1>
<p>1) 수건을 길게 꼬아 두세 번 매듭을 단단히 묶어 공 모양으로 만들고, 두 사람이 약 1~2m 거리를 두고 마주 섭니다. 2) 수비하는 사람은 두 발을 바닥에 고정한 채 움직이지 않고 날아오는 수건을 몸을 굽히거나 젖혀 피합니다. 3) 던지는 사람은 수비자의 몸을 향해 수건을 던지고, 수비자는 공에 맞지 않아야 하며 손으로 잡아도 실격입니다. 4) 주로 쓰는 손뿐만 아니라 반대쪽 손으로도 번갈아 던지며 반사신경을 겨룹니다.</p>
