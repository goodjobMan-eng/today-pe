<h1>폭탄 돌리기</h1>
<p>1) 전체 인원을 5인 1조로 나누어 원 대형으로 서서 준비합니다. 2) 시작 신호에 맞춰 오른쪽 방향으로 패스를 합니다. 3) 패스를 주고받을 때에는 반드시 몸통 바깥쪽으로 공을 한 바퀴 돌린 후에 볼을 던집니다. 4) 제한 시간(30초)이 종료되었을 때 볼을 갖고 있는 사람이 벌칙을 받습니다.</p>
