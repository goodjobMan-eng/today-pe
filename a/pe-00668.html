<h1>다이아몬드 패스 게임</h1>
<p>1) 경기장 바깥쪽에 위치한 공격수들이 다이아몬드와 외곽 대형을 만들고 중앙에 수비수를 배치합니다. 2) 공격 팀은 공을 가진 상태에서 드리블 없이 정해진 패스를 주고받으며 수비를 피해 빈 공간으로 공을 연결합니다. 3) 제한된 패스 횟수 안에 상대의 인터셉트 없이 연속 패스를 성공시키면 득점합니다. 4) 수비수가 공을 차단하거나 패스 실수가 나오면 역할을 교대하며, 단계가 올라갈수록 수비수 수나 압박 강도를 높입니다.</p>
