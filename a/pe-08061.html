<h1>훌라후프를 활용한 체육 놀이 4가지</h1>
<p>1) 훌라후프 달리기: 일렬로 놓인 후프를 한 칸씩 뛰어 건너 결승선에 먼저 다 앉은 팀이 승리한다. 2) 해와 얼음 술래잡기: 얼음 술래(폼스틱)에게 태그되면 팔을 벌리고 멈추며, 해 구출자가 후프를 몸에 씌워주면 풀려난다. 3) 후프 점핑잭 챌린지: 바닥에 회전시킨 후프가 쓰러지기 전에 점핑잭을 하고 후프를 잡는다. 4) 빈백 뺏기: 자기 팀 후프에서 빈백을 가져와 팀원에게 던져 성공적으로 받으면 획득한다.</p>
