<h1>카드 릴레이</h1>
<p>1) 6개 팀으로 나누어 각 팀의 원(훌라후프) 뒤에 한 줄로 선다. 2) 신호가 울리면 첫 주자가 반대편으로 달려가 엎어져 있는 카드 중 1장을 확인한다. 3) 카드가 자기 팀 원의 색상과 일치하면 카드를 가지고 돌아오고, 일치하지 않으면 다시 엎어둔 채 돌아온다. 4) 출발선에 도착해 다음 주자와 발을 터치하여 교대하고 다음 주자가 출발한다.</p>
