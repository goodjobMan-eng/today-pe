<h1>좀비볼 (머크발)</h1>
<p>1) 경기장에 3~5개의 소프트볼을 두고 다른 참가자를 맞힌다. 2) 공에 맞은 사람은 벤치에 앉아 좀비가 되며 자신을 맞힌 사람을 기억한다. 3) 자신을 맞힌 사람이 다른 사람의 공에 맞아 아웃되면 부활하여 다시 코트로 들어온다.</p>
