<h1>마루운동 구르기 5종</h1>
<p>1) 손을 짚고 몸을 둥글게 말아 회전력을 이용해 일어서는 앞구르기를 실시한다. 2) 손바닥을 귀 옆에 대고 뒤로 몸을 둥글게 말아 손으로 매트를 밀며 일어서는 뒤구르기를 실시한다. 3) 앞구르기를 마친 후 마지막 착지 동작에서 다리를 양옆으로 벌려 일어서는 다리벌려 앞구르기를 실시한다. 4) 다리벌려 뒤구르기와 다리를 모아 편 채로 도는 다리 펴 뒤구르기를 순서대로 익힌다.</p>
