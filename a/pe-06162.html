<h1>라켓으로 치기 백핸드 탐구 활동</h1>
<p>1) 라켓을 들고 준비 자세를 유지한다.2) 라켓 든 손 반대쪽으로 셔틀콕이 오면 백핸드로 친다.3) 공을 친 뒤 팔을 들어 삼각형 모양을 만든다.4) 주황색·파란색 친구에게 셔틀콕을 넘겨주고 노란색·연두색 친구는 체인처럼 오른쪽으로 한 칸씩 이동하여 다음 짝과 연습한다.</p>
