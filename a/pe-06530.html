<h1>함께 앉아 배구</h1>
<p>1) 2인 1조로 한 명은 서고 한 명은 앉아서 언더패스와 오버패스를 연습하며 힘을 기른다. 2) 두 명 모두 앉은 상태에서 언더패스, 오버패스, 스파이크, 블로킹 등 기본 동작을 익힌다. 3) 경기 규칙은 일반 배구와 동일하며 바닥에 앉은 상태에서 한 손 서브로 경기를 시작한다.</p>
