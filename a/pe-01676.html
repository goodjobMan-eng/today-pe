<h1>그린치 크리스마스 스트레칭 요가</h1>
<p>1) 매트나 바닥에 자리를 잡고 바른 자세로 서거나 앉아 호흡을 가다듬는다. 2) 화면에 그린치 캐릭터가 보여주는 요가 자세를 보고 그대로 따라 취한다. 3) 30초 카운트다운 동안 깊게 호흡하며 자세를 유지하고, 안내에 맞춰 반대쪽도 똑같이 늘려준다. 4) 난도가 높은 한 발 균형 자세나 플랭크는 신체 조건에 맞게 버티는 시간을 조절한다.</p>
