<h1>스타일 술래잡기</h1>
<p>1) 술래를 정하고 술래에게 잡히면 특정 신체 동작(스키, 발레, 역도 등)을 멈춘 채 흉내 낸다.2) 도망치는 다른 친구가 다가와 멈춰 있는 친구와 똑같은 동작을 취해 주면 부활한다.3) 살아난 친구는 다시 자유롭게 도망칠 수 있으며 정해진 시간 동안 활동을 이어간다.</p>
