<h1>후프 골프 볼링 놀이</h1>
<p>1) 출발선 앞에 훌라후프를 바닥에 내려놓고 2인 또는 3인 1조로 차례를 정해 대기한다. 2) 차례대로 공을 바닥으로 굴려 훌라후프 안을 통과하거나 안쪽에 멈추도록 시도한다. 3) 공이 후프를 튕겨 나가거나 밖으로 벗어나지 않고 후프 안에 정확히 머무르면 1점을 획득한다. 4) 거리를 점차 늘리거나 후프 테두리를 타고 회전하도록 벽면 및 각도를 조절하는 방식으로 변형한다.</p>
