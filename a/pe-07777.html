<h1>로봇 배터리 수리 놀이</h1>
<p>1) 모든 학생은 머리 위에 로봇의 배터리 역할을 하는 주머니(콩주머니)를 얹고 로봇 역할을 맡는다. 2) 2명의 학생은 고장 난 로봇을 고치는 '로봇 정비사' 역할을 맡는다. 3) 로봇들이 운동장을 이동하다가 머리 위의 배터리가 바닥으로 떨어지면 그 자리에 멈춰 서야 한다. 4) 로봇 정비사가 다가가 떨어진 주머니를 주워 다시 머리 위에 올려주면 로봇이 다시 작동하여 움직인다.</p>
