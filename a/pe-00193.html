<h1>다람쥐 도토리 모으기 술래잡기 — 도토리 3개 모으면 탈락자 전원 부활!</h1>
<p>중앙 훌라후프에 펀스틱을 든 사냥꾼(술래)이 서고, 다람쥐 학생들은 각자 도토리(콩주머니) 1개를 들고 외곽 원마커 위에 섭니다. 술래가 '사냥꾼이다!'를 외치면 다람쥐들은 다른 원마커로 이동하며, 술래에게 터치당하면 원마커 위에 도토리를 남겨 두고 밖으로 나갑니다. 살아남은 다람쥐가 남겨진 도토리를 주워 총 3개를 모으고 '3개!'를 외치면 아웃된 친구 전원이 부활합니다.</p>
