<h1>강 건너기 (River Crossing)</h1>
<p>1) 음악이 시작되면 각 모둠은 원마커(폴리스팟)를 밟고 앞에 놓인 여분의 원마커를 앞으로 전달하며 이동한다2) 원마커 밖의 바닥(강)에 발이 닿으면 팀 전체가 처음 지점으로 돌아가 다시 시작한다3) 건너편 훌라후프에 도착하면 콩주머니 1개를 집어 들고 다시 원마커를 놓으며 출발 콘으로 돌아온다4) 훌라후프 안의 콩주머니 4개를 모두 가져오면 활동이 끝난다</p>
