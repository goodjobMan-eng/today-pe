<h1>나 혼자 저글링 기초 1·2단계</h1>
<p>1) 1단계는 공 1개를 잡고 팔을 아래로 내리며 반대쪽 손으로 포물선을 그리듯 던져 받으며 부드럽게 반복한다. 2) 공을 받을 때는 손을 딱 멈추지 않고 떨어지는 흐름에 맞춰 손을 살짝 내리면서 잡는다. 3) 2단계는 양손에 공을 하나씩 쥐고 한쪽 손의 공을 던진 뒤, 공이 최고 정점에 도달했을 때 반대쪽 손의 공을 연속으로 던진다. 4) 공이 떨어지는 순서대로 침착하게 양손으로 각각 받아낸다.</p>
