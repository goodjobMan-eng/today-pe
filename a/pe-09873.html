<h1>펀스틱 링컬링</h1>
<p>1) 원 중앙에 표적 마커를 놓고 출발선을 정한다. 2) 차례대로 펀스틱 끝에 링을 걸어 중앙 표적을 향해 밀어 쏜다. 3) 링이 구르는 동안 팀원들이 펀스틱으로 바닥을 쓸어 유도(브러시질)할 수 있으며, 중앙 표적에 가까운 링으로 점수를 계산한다.</p>
