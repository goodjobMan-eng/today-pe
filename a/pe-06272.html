<h1>주사위 태그</h1>
<p>1) 각자 주사위를 굴려 가장 낮은 수가 나온 사람이 최초의 술래가 된다.2) 콘 4개로 표시한 경기장 안에서 술래는 주사위를 들고 친구들을 태그하러 다닌다.3) 태그당한 사람은 경기장 밖으로 나가 주사위를 굴리고 나온 숫자만큼 푸시업이나 버피 테스트를 한다.4) 체력 운동을 마친 사람이 새로운 술래가 되어 경기장 안으로 들어가 태그한다.</p>
