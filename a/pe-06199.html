<h1>거리도전(멀리뛰기) 활동 장소 계획하기</h1>
<p>1) 운동장에 액션 루프나 선, 콘 등으로 단계별 착지 목표 구역을 구성한다.2) 4개 모둠(모둠당 약 5명)으로 팀을 구성한다.3) 학생들은 출발선에 서서 목표 색상이나 구역을 정한 뒤 제자리멀리뛰기를 한다.4) 다른 구역으로 이동해 차례를 기다리며 정해진 횟수(예: 5번 또는 9번) 안에 목표 지점에 도달하는 미션에 도전한다.</p>
