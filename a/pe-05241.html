<h1>독성 강 건너기 (Toxic River)</h1>
<p>1) 학급 전체가 한 팀이 되어 출발선에서 마법의 돌(스팟)을 독성 강 바닥에 내려놓으며 전진한다2) 돌을 놓을 때는 즉시 발로 밟아야 하며, 사람의 무게가 실리지 않고 방치된 돌은 회수된다3) 강 중간에 위치한 보라색 체크포인트 3곳에 도달하면 추가 자원을 얻고 실패 시 해당 체크포인트에서 재시작할 수 있다4) 모든 학생이 반대편 육지(도착선)까지 무사히 건너가면 성공한다</p>
