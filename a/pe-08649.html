<h1>도구 없는 균형 잡기 운동</h1>
<p>1) 한 발로 서서 다른 한 발을 앞뒤 좌우로 자유롭게 움직이거나 눈을 감고 균형을 잡습니다. 2) 한 발로 서서 번갈아가며 양손으로 바닥을 탭합니다. 3) 짝과 마주 서서 손바닥을 맞대고 서로 균형을 잃게 밀거나 당깁니다. 4) 한 발로 서서 손을 가슴에 모으고 짝과 상대를 밀어 균형을 무너뜨립니다. 5) 한 줄로 서서 짝과 손을 잡고 한 발로 서서 상대방을 선 밖으로 밀어내는 게임을 합니다.</p>
