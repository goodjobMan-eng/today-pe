<h1>볼 던지기 기초 연습</h1>
<p>1) 폼볼을 공을 쥐지 않은 손에 올린 뒤 던지는 손으로 손뼉 치듯 가볍게 친다. 2) 시소처럼 몸을 뒤에서 앞으로 움직이며 체중 이동을 이용해 공을 던진다. 3) 공을 쥐지 않은 손을 던질 방향으로 뻗었다가 공을 쥔 손과 강하게 맞바꾼다.</p>
