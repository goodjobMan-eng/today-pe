<h1>도지볼(데드볼)</h1>
<p>1) 경기장 중앙에 공을 일렬로 배치하고 양 팀은 콘 뒤 시작선에 위치한다. 2) 시작 신호에 맞춰 중앙으로 달려가 공을 가져온 뒤 공격을 시작한다. 3) 공을 던져 상대 선수를 맞히며, 수비는 들고 있는 공으로 날아오는 공을 방어할 수 있다. 4) 공에 맞은 선수는 아웃되어 퇴장하고 상대 팀을 모두 아웃시킨 팀이 승리한다.</p>
