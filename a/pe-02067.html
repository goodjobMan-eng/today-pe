<h1>제기차기</h1>
<p>1) 제기의 머리 부분을 손바닥 위에 올려놓고 준비한다. 2) 제기를 가볍게 위로 던진 뒤 내려올 때 발 안쪽(발목 안쪽) 부위로 찬다. 3) 차고 바닥에 발을 딛는 동작부터 시작하여 1개 차고 잡기, 2개 연속 차기로 개수를 늘린다. 4) 발을 땅에 딛지 않고 연속해서 차는 헐랭이 차기나 양발을 번갈아 가며 차는 지기지기 차기에 도전한다.</p>
