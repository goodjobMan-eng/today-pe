<h1>매스 패싱</h1>
<p>1) 파트너와 짝을 지어 한 명은 농구 라인, 다른 한 명은 배구 라인에 선다. 2) 한 명씩 중앙으로 드리블하여 카드를 한 장 뽑는다. 3) 파트너에게 돌아와 카드에 적힌 숫자만큼 패스를 주고받는다. 4) 검은색 카드는 바운드 패스, 빨간색 카드는 체스트 패스를 한다.</p>
