<h1>배드민턴 안자민턴 및 변형 복식 경기</h1>
<p>1) 네트 코트별로 3~4명씩 배치하고 앉아서 하는 안자민턴, 4대 4 포지션 경기, 컷코트 경기 등의 변형 경기를 진행한다. 2) 코트 밖 대기 인원은 1열로 줄을 서서 훌라후프 안에서 리프팅 연습을 하며 대기한다. 3) 경기 중 개인 누적 실수가 2번 발생하면 코트에서 나와 대기줄 맨 뒤로 이동한다. 4) 대기줄 맨 앞에 있던 사람이 빈자리로 들어가 경기를 이어 진행한다.</p>
