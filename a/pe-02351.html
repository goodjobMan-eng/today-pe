<h1>훌라후프 공 통과 챌린지</h1>
<p>1) 2인 1조로 마주 보고 서서 훌라후프를 한 손씩 잡고 준비한다. 2) 시작 신호와 함께 한 명이 배구공을 바닥에 한 번 바운드시켜 훌라후프 안으로 통과시킨다. 3) 통과한 공을 맞은편 사람이 잡아 다시 바닥에 바운드시켜 훌라후프 안으로 통과시킨다. 4) 정해진 시간 동안 공이 후프 안을 완전히 통과한 횟수를 누적하여 성공 횟수를 기록한다.</p>
