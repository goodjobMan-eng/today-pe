<h1>부활절 마리오 스톰프 리듬 피트니스</h1>
<p>1) 좋아하는 마리오 캐릭터를 선택해 파워 미터를 채우도록 돕는다. 2) 버튼이 플레이 존에 들어올 때 색상에 맞춰 지정된 동작을 수행한다. 3) 빨간색은 왼발 스톰프/홉, 노란색은 오른발 스톰프/홉, 빨강+노랑은 점프, 파란색은 박수, 보라색은 허벅지 치기를 한다. 4) 꽃 파워를 잃은 마리오를 돕기 위해 벽돌을 펀치로 부수고 뻐끔플라워를 발로 찬다.</p>
