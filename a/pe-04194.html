<h1>파라슈트 로켓 발사 놀이</h1>
<p>1) 낙하산 중앙에 공 1개를 올리고 학생들이 둘러서서 낙하산 가장자리를 잡는다. 2) 바깥 영역에 로켓(공)을 잡을 학생들을 배치한다. 3) 낙하산을 잡은 학생들이 협동하여 공을 공중으로 높이 쏘아 올린다. 4) 바깥 학생들은 쏘아 올려진 공이 바닥에 닿기 전에 잡으려고 시도하며, 공을 잡은 학생은 낙하산을 잡고 있던 학생과 자리를 바꾼다.</p>
