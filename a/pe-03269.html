<h1>다리 벌려 뒤구르기</h1>
<p>1) 매트 위에 쪼그려 앉아 손바닥이 하늘을 향하도록 귀 옆에 댄다. 2) 무게중심을 서서히 뒤로 옮기며 등이 매트에 닿도록 구른다. 3) 손바닥이 매트에 닿고 다리가 뒤로 넘어갈 때 다리를 양옆으로 쭉 펴며 벌린다. 4) 다리가 땅에 닿으면 손으로 매트를 밀면서 상체를 일으켜 중심을 잡고 마무리한다.</p>
