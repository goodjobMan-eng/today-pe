<h1>맨손 체조 동작으로 공 이어주기</h1>
<p>1) 네 명이 한 모둠을 이루어 순서를 정하고 손이 맞닿을 수 있을 정도의 간격을 유지하며 한 줄로 선다.2) 신호가 울리면 맨손 체조 동작을 활용하여 다음 친구에게 공을 전달한다.3) 마지막 친구가 공을 이어받으면 뒤에 있는 바구니에 공을 넣는다.4) 정해진 시간 동안 공을 바구니에 가장 많이 넣은 모둠이 승리한다.</p>
