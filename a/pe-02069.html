<h1>원마커 훌라후프 점프 트레이닝</h1>
<p>1) 바닥에 훌라후프와 원마커를 배치하여 운동 공간을 확보한다. 2) 1라운드로 원마커 위에서 두 발을 모아 제자리뛰기를 실시한다. 3) 2라운드로 양발을 번갈아 원마커를 밟으며 뛰고, 3라운드로 한 발씩 2번 점프한다. 4) 4라운드로 원마커 위 두 발 모으기와 훌라후프 밖 벌려 뛰기(보자기-주목 점프), 5라운드로 앞뒤 뛰기(주목-가위 점프)를 진행한다.</p>
