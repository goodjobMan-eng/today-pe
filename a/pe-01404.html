<h1>수건 뽑기 술래잡기</h1>
<p>1) 각자 바지 허리 뒤쪽에 수건을 꼬리처럼 꽂고 정해진 구역에 흩어져 준비한다. 2) 신호가 울리면 자신의 수건을 지키면서 다른 친구의 꼬리 수건을 재빠르게 뽑는다. 3) 수건을 빼앗기더라도 탈락하지 않고 계속 움직이며 다른 사람의 수건을 빼앗아 모은다. 4) 정해진 제한 시간 종료 후 가장 많은 수건을 획득한 사람이 승리하며, 팀 대항전으로도 변형해 진행한다.</p>
