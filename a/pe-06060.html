<h1>보물찾기</h1>
<p>1) 바닥에 깔린 20개의 원마커 중 2곳 밑에 각각 보물과 꽝 쪽지를 숨긴다.2) 찾는 팀의 팀장은 보지 않고 있고, 팀원들은 목표 쪽지에 가까워지면 빠르게 제자리 달리기 신호를 보낸다.3) 팀장은 팀원들의 달리기 신호를 보고 원마커를 확인하여 정해진 횟수 내에 보물을 찾는다.</p>
