<h1>축구 하프 발리 패스 연습</h1>
<p>1) 두 명이 짝을 이루어 한 명은 피더(공 던져주는 사람), 다른 한 명은 패서 역할을 맡는다.2) 피더는 콘 위치에서 언더암으로 공을 던져 패서 앞바닥에 한 번 튀기게 한다.3) 패서는 공이 튀어 오른 뒤 공중에 있을 때 발안쪽(인사이드)이나 발등(슈팅 부위)을 이용해 다시 피더에게 패스한다.4) 피더가 패스된 공을 잡으면 성공할 때마다 1점을 획득한다.5) 왼발과 오른발을 모두 번갈아 연습한다.</p>
