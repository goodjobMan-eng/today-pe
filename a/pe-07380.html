<h1>1인 창작체조 만들기</h1>
<p>1) 수학여행이나 특정 사건 등 표현할 하나의 이야기를 주제로 선정한다. 2) 기상, 이동, 줄 서기, 놀이기구 타기 등 상황별 신체 동작(펴기, 굽히기, 돌리기)을 8박자에 맞춰 구성한다. 3) 구성한 3~4가지 이상의 동작을 연결하여 2~3분 분량의 전신 스트레칭 체조로 완성하여 표현한다.</p>
