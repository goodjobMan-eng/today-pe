<h1>호흡 맞추는 2인 1조 협동 줄넘기 놀이</h1>
<p>1) 2인 1조로 서서 줄넘기 손잡이를 나눠 잡거나 한 명이 줄을 돌릴 준비를 한다. 2) 나란히 서서 안쪽 손잡이를 맞바꿔 잡고 제자리에서 타이밍을 맞춰 함께 뛴다. 3) 한 명이 줄을 돌리고 다른 한 명이 품 안으로 들어가 마주 보거나 앞을 보고 연속 도약한다. 4) 두 사람이 양 끝 손잡이를 잡고 돌리는 긴 줄 안에 뛰어 들어가 앞뛰기나 엇걸어뛰기(X자)에 도전한다.</p>
