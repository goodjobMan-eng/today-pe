<h1>파트너 티볼 타격 챌린지</h1>
<p>1) 두 명이 짝을 이루어 한 명은 타자, 한 명은 수비수 역할을 맡는다. 2) 타자는 타격 티에 놓인 공을 쳐서 수비수를 지나 벽까지 도달하도록 타격한다. 3) 수비수는 공이 자신을 지나쳐 벽으로 가지 못하도록 수비하여 막아낸다. 4) 1회 타격이 끝날 때마다 서로 타자와 수비수 역할을 교대한다.</p>
