<h1>콘 드리블 및 바운스 패스 챌린지</h1>
<p>1) 음악이 멈추기 전까지 공을 드리블하며 배치된 20개의 콘을 모두 터치하고 복귀한다. 2) 자석 선(plagnets) 평가판에 맞춰 스스로 바운스 패스 도전 과제를 순서대로 수행한다. 3) 통과한 패스 단계(3단계, 6단계, 8단계)에 따라 자신의 수준을 자석 보드에 기록한다. 4) 모둠별로 바구니를 향해 슛을 성공시키는 메이크 잇 테이크 잇 미니 게임을 진행한다.</p>
