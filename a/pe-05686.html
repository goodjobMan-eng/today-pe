<h1>팀조끼 던져 잡기</h1>
<p>1) 출발선에 원마커를 두고 선다.2) 팀조끼를 앞으로 높이 던진다.3) 팀조끼가 바닥에 닿기 전에 달려가 공중에서 잡는다.4) 팀조끼를 잡은 위치에 원마커를 놓아 거리를 표시한다.5) 원마커를 출발점 삼아 같은 방법으로 던지고 잡으며 점점 더 멀리 이동한다.</p>
