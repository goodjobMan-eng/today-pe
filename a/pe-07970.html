<h1>킨볼 기초 훈련법</h1>
<p>1) 드리블 릴레이는 2인 1조로 킨볼을 바닥에 떨어뜨리지 않고 마주 보며 이동한다 2) 1자 릴레이는 킨볼 속도에 맞춰 빠르게 앞지르며 수비 대형으로 이동한다 3) 드리블 세팅 히트 훈련은 마주 서서 삼각형 대형으로 공을 받아 세팅하고 타격한다 4) 슬라이딩 훈련은 지정된 위치의 킨볼을 향해 몸을 던져 슬라이딩하며 받아낸다</p>
