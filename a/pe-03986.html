<h1>라바 리버 (용암 강 건너기 협동 놀이)</h1>
<p>1) 바닥을 닿으면 안 되는 용암 강으로 설정하고 출발선에서 반대편 도착 지점 매트까지의 코스를 구성한다. 2) 팀원들은 바닥(용암)에 닿지 않도록 디딤판(방석, 종이가방, 줄넘기 등)을 바닥에 놓으며 건너간다. 3) 진행 도중 신체나 발이 바닥에 닿으면 처음 출발 지점으로 돌아가 다시 시작한다. 4) 안대를 착용한 팀원을 말로 안내해 건너게 하거나 경로에 장애물을 배치하여 난이도를 높여 도전한다.</p>
