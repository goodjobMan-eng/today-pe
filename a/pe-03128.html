<h1>사방팔방 후프 댄스</h1>
<p>1) 바닥에 훌라후프를 바둑판 격자 형태로 여러 개 배열한다. 2) 4명이 각자 모서리 후프에 서서 신호에 맞춰 안쪽으로 스텝을 밟으며 들어간다. 3) 음악 박자에 맞추어 후프 사이를 전후좌우로 리듬감 있게 점프 이동한다. 4) 서로 다른 방향에서 이동해 오는 모둠원들과 스텝이 꼬이지 않게 호흡을 맞춰 스텝을 완주한다.</p>
