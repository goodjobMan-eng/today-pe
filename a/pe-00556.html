<h1>쿠루린파 회전 구르기 놀이</h1>
<p>1) 짝(또는 교사·보호자)과 마주 보고 서서 양손을 맞잡고, 매트를 깔고 안전하게 몸을 회전시킬 준비를 합니다. 2) 1단계: 손을 잡은 채로 아이가 배꼽을 보며 앞으로 데굴 구르는 앞구르기를 합니다. 3) 2단계: 상대방의 다리를 타고 올라가며 뒤로 공중 회전하여 착지하는 뒤돌기 회전을 익힙니다. 4) 3단계: 다리 사이로 손을 넣어 맞잡은 뒤 들어 올려 회전시키는 가랑이 회전으로 다양한 회전 감각을 기릅니다.</p>
