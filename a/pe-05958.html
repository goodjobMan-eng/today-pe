<h1>해, 달, 별, 턴 게임</h1>
<p>1) 교사가 지시어를 외치면 학생들은 제자리에서 점프하며 지정된 방향으로 몸을 돌린다.2) '해'는 오른쪽 90도, '달'은 왼쪽 90도로 점프하여 돈다.3) '턴'은 180도 반 바퀴를 돌고, '별'은 360도 한 바퀴를 완전히 회전한다.4) 지시어에 맞지 않는 방향으로 뛰거나 잘못 반응하면 정해진 규칙에 따라 탈락하거나 벌칙을 수행한다.</p>
