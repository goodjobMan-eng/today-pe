<h1>엎드려 플랭크 볼 패스 게임</h1>
<p>1) 엎드린 상태에서 손을 벌리고 손이 닿는 거리에 콘을 놓아 골대를 정한다. 2) 팔꿈치와 손바닥, 발가락만 바닥에 대고 몸을 띄워 플랭크 자세를 유지한다. 3) 자세를 무너뜨리지 않고 상대방의 양 콘 사이 골대로 공을 굴려 넣는다.</p>
