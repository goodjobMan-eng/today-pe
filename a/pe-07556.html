<h1>풍선 야구</h1>
<p>1) 홈베이스에 한 발을 올린 상태에서 키친타월 심으로 풍선을 쳐서 공격한다. 2) 수비가 풍선을 잡아 홈이나 해당 베이스를 찍기 전에 타자가 1루를 찍고 홈으로 돌아오면 1점, 2루는 2점, 3루는 3점을 얻는다. 3) 두 번째 버전은 수비 없이 구역(1점, 2점, 3점)을 나눠 풍선을 쳐서 넘긴 구역에 따라 점수를 얻고 컵을 맞춰 감점 또는 추가점을 얻는다.</p>
