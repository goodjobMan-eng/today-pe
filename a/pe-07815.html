<h1>바운티 헌터 (현상금 사냥꾼, CAZARRECOMPENSAS)</h1>
<p>1) 교사가 체육관 바닥 전체에 칩(포커 칩/마커)을 흩뿌려 놓는다. 2) 학생들을 모둠으로 나누거나 개인전으로 준비시킨다. 3) 제한 시간(3분 또는 5분 등) 동안 흩어져 칩을 최대한 많이 모으고, 시간이 종료되면 가장 많이 모은 팀이 승리한다.</p>
