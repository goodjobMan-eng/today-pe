<h1>뜀틀 부상 방지 안전 수칙 및 충격 완화 연습</h1>
<p>1) 뜀틀 위에 올라가 양손으로 좌우 흔들림 없이 평행하게 4회 연속 제자리 짚는 연습을 한다2) 높은 단 위에 발을 올리고 손으로 체중을 지탱하며 통나무 밀기 등 팔 지지력을 기른다3) 뜀틀 위에서 뛰어내릴 때 손부터 짚지 말고 무릎 쿠션을 활용해 착지하거나 엉덩이로 구르며 충격을 흡수한다4) 뜀틀을 넘는 속도가 너무 빠를 때는 착지 후 손을 짚고 앞구르기로 자연스럽게 연결해 충격을 분산한다</p>
