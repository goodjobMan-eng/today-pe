<h1>십자 래더 교차 릴레이 스텝</h1>
<p>1) 스텝래더 두 개를 십자(+) 모양으로 교차 설치하고 네 방향 끝에 팀원들이 나누어 대기한다. 2) 음악 리듬에 맞춰 4개 방향에서 동시에 출발하여 중심 교차점을 향해 스텝을 밟으며 전진한다. 3) 중앙 교차 지점에서 충돌 없이 자연스럽게 엇갈려 통과한 뒤 반대편 끝까지 완주하면 팀 포인트를 얻는다. 4) 이동 방향을 90도 회전하여 빠져나가거나 팀별 인원을 점차 늘려 통과 난이도를 높인다.</p>
