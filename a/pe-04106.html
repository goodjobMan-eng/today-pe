<h1>홈베이스 자리 찾기 및 기본 이동 기술</h1>
<p>1) 체육관 벽면의 숫자와 문자를 조합한 격자 좌표를 확인하여 자신의 홈베이스 자리를 익힌다. 2) 주변 친구들과 부딪히지 않도록 안전 공간(버블)을 유지하며 개방된 공간을 걷는다. 3) 멈춤 신호가 울리면 동작을 멈추고 신속하게 자신의 홈베이스 자리로 걸어서 돌아온다. 4) 이동 방식을 사이드 스텝(슬라이딩)과 갤럽으로 바꾸어 이동한 후 제자리로 복귀한다.</p>
