<h1>후프 캐슬 만들기, 통과하기, 캐슬 옮기기</h1>
<p>1) 바닥에 훌라후프 1개를 놓고, 양쪽에 2개씩 겹쳐 끼운 뒤 위에 1개를 얹어 후프 캐슬(입체 성)을 완성한다.2) 완성된 후프 캐슬이 무너지지 않도록 낮은 자세로 엉금엉금 기어서 내부를 통과한다.3) 바닥에 줄넘기를 깔고 모둠원 2~4명이 줄넘기 손잡이나 줄을 함께 잡고 캐슬을 들어 올린다.4) 캐슬이 무너지거나 떨어지지 않도록 균형을 유지하며 정해진 목표 지점까지 안전하게 이동시킨다.</p>
