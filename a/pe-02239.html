<h1>공 던지고 숫자 부르기</h1>
<p>1) 한 사람을 기준으로 주변에 나머지 인원 모두 둥글게 모여 서서 1번부터 숫자를 지정받는다. 2) 가운데 서 있는 사람이 공을 높이 던지며 숫자 하나를 외친다. 3) 그 숫자를 지정받은 사람이 가운데로 달려 나가 공을 잡는다. 4) 공을 잡으면 가운데로 와 공을 던지고, 공을 잡지 못하면 원래 던지던 사람이 다시 공을 던지고 숫자를 부른다.</p>
