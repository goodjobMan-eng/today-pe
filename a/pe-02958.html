<h1>줄넘기 2.5중 뛰기 멀티 기술</h1>
<p>1) 기본 2단 뛰기를 100~200회 이상 안정적으로 뛸 수 있는 숙련도를 갖춘다. 2) 스윙(사이드) 후 오픈(SO) 동작을 양쪽 방향으로 멈추며 연습한다. 3) 사이드 후 크로스 오픈(SCO)으로 이어지는 동작을 손을 교차하며 연습한다. 4) 사이드-오픈-크로스(SOC)와 사이드-크로스-크로스(SCC) 동작을 단계별로 연결하여 멀티 뛰기를 완성한다.</p>
