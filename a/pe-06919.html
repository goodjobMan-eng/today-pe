<h1>다양한 옆돌리기(카트휠)</h1>
<p>1) 정면을 보고 시작하여 끝날 때 몸을 1/4 틀어 뒤를 보고 착지하는 뒤돌아 끝내기 옆돌리기를 연습한다. 2) 정면을 보고 시작하여 끝날 때도 정면을 바라보며 착지하는 정면 끝내기 옆돌리기를 연습한다. 3) 손 하나를 옆구리에 두거나 몸 옆에 붙이고, 손이 바닥에 오래 머물지 않도록 다리를 빠르게 차넘기는 한 손 옆돌리기를 실시한다.</p>
