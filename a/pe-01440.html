<h1>신체 각성 전신 파워 점프</h1>
<p>1) 양팔을 편 채 각자 양옆으로 두 팔 간격의 안전 거리를 확보하고 제자리 기본 점프 자세로 정렬한다. 2) 교사의 박자에 맞춰 무릎을 가슴까지 힘껏 끌어당기는 모아뜀뛰기를 3회씩 끊어 뛰며 착지 밸런스를 잡는다. 3) 흔들림 없이 착지할 때마다 스스로 1점씩 세어 10점을 달성하면 모둠 전체가 만세를 부른다. 4) 다리를 앞뒤로 교차하는 가위 점프와 팔다리를 동시에 좌우로 크게 벌리는 점핑잭 동작을 논스톱 연속으로 연결한다.</p>
