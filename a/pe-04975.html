<h1>수영 발차기(버터플라이 킥/물장구) 기초 연습</h1>
<p>1) 풀 벽을 잡고 몸을 띄운 상태에서 양다리를 위아래로 번갈아 움직인다.2) 무릎이 아닌 다리 시작점(고관절)부터 다리 전체를 움직여 찬다.3) 발끝을 곧게 펴고 양 엄지발가락이 가볍게 스치듯 규칙적으로 찬다.4) 킥판을 잡거나 고개를 숙여 호흡하며 전진하는 연습으로 연결한다.</p>
