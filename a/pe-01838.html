<h1>큐피드의 미션 하트 태그</h1>
<p>1) 술래 2명(부러진 화살)과 미션 전달자 1명(큐피드)을 정하고 나머지는 하트가 되어 흩어집니다. 2) 술래가 도망가는 하트를 터치하면 태그된 하트는 그 자리에서 외발 서기로 멈춥니다. 3) 큐피드가 외발 서기 중인 학생에게 미션 카드를 주면 적힌 운동(팔벌려뛰기·팔굽혀펴기)을 완료해 부활합니다. 4) 제한 시간 동안 술래가 전원을 멈추게 하거나 큐피드 인원을 늘리는 방식으로 변형할 수 있습니다.</p>
