<h1>병원 술래잡기</h1>
<p>1) 각자 공을 가지고 정해진 구역 안에서 드리블하며 손으로 다른 친구를 터치한다. 2) 터치당한 친구는 터치당한 부위를 손으로 잡아야 한다. 3) 두 번 터치당하면 병원 구역으로 이동해 공을 4번 터치하고 다시 게임에 참여한다.</p>
