<h1>짐볼 바운스 리바운드 캐치</h1>
<p>1) 빨래 바구니나 고정용 통 위에 대형 짐볼을 얹어 흔들리지 않게 고정하고 4~6명씩 모둠을 구성한다. 2) 일정 거리 뒤에서 던지는 공을 짐볼 표면에 바운스시켜 튕겨 나오는 공을 모둠원이 순발력 있게 캐치한다. 3) 1분 동안 연속으로 캐치에 성공한 횟수를 세어 모둠별 최고 기록에 도전한다. 4) 난이도에 따라 투척 거리를 조절하거나 던지는 공의 크기와 재질을 폼볼 등으로 교체하여 진행한다.</p>
