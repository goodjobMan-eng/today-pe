<h1>스텝 얼음땡</h1>
<p>1) 술래 1~2명을 정하고 나머지 학생은 생존자가 된다. 2) 술래는 진행자가 외치는 특정 스텝(펭귄, 크랩 등)으로만 움직여 생존자를 잡는다. 3) 생존자 역시 같은 지정 스텝으로만 도망칠 수 있다. 4) 잡힌 생존자는 그 자리에서 얼음이 되고 다른 생존자가 터치해 주면 다시 풀려난다. 5) 제한 시간 3분 안에 모든 생존자를 잡으면 술래 팀이 승리한다.</p>
