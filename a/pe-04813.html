<h1>볼 핸들링 + 눈치 게임</h1>
<p>1) 교사를 중심으로 원을 만든 뒤 교사의 시범에 맞춰 1인 1공으로 허리 돌리기(좌/우 각 20회), 무릎 돌리기(좌/우 각 20회), 다리 사이 8자 돌리기(20회), 무릎-허리-머리-허리-무릎 연결 돌리기(10회)를 연습한다.2) 기본 동작 숙달 후 다 함께 농구공을 든 상태에서 눈치 게임을 진행한다.3) 눈치 게임에서 걸린 학생은 교사가 정해준 볼 핸들링 벌칙 동작을 수행한 뒤 다시 게임에 참여한다.</p>
