<h1>소방대 물통 전달 릴레이 (빈백 버킷 브리게이드)</h1>
<p>1) 팀별로 출발선(물통 원반)부터 도착선(화재 현장 원반)까지 일렬로 간격을 두고 선다. 2) 맨 앞 주자가 원반 위의 콩주머니(물통)를 집어 왼쪽 어깨 너머로 뒷사람에게 넘긴다. 3) 공을 넘긴 주자는 대열의 맨 뒤로 달려가 다시 넘겨받을 준비를 하며 이동한다. 4) 마지막 목표 지점 원반에 모든 콩주머니를 가장 먼저 운반해 불을 끈 팀이 승리한다.</p>
