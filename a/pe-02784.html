<h1>농구공 제자리 및 이동 드리블 연습</h1>
<p>1) 제자리에서 오른손으로 구령에 맞추어 정해진 횟수(1회, 3회, 5회, 7회, 10회)만큼 공을 튀기고 잡는다. 2) 왼손으로 손과 발을 바꾸어 동일한 횟수만큼 튀기기 테스트를 진행한다. 3) 양손으로 번갈아 튀기는 연습을 끊어서 진행한다. 4) 콘 반환점을 향해 걸어가거나 드리블하며 콘을 돌아 출발선으로 돌아온다.</p>
