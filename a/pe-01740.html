<h1>컬러 피트니스 원마커 신체활동</h1>
<p>1) 넓은 체육관 바닥에 6가지 색깔의 원마커(폴리스팟)를 골고루 흩어 놓는다. 2) 화면에 걷기, 달리기, 갤럽, 스킵 등의 이동운동이 제시되면 경계 구역 안을 자유롭게 이동한다. 3) 교사의 호루라기 소리가 들리면 즉시 가까운 원마커를 찾아 그 위에 두 발로 올라선다. 4) 화면에 나타난 해당 마커 색상의 운동(스쿼트, 플랭크, 런지 등)을 확인하고 정해진 시간 동안 성실히 수행한다.</p>
