<h1>컬러 접시콘 찾기</h1>
<p>1) 팀별로 출발선에 서고 가운데에 번호가 적힌 컬러 숫자 접시콘을 모아 둔다.2) 자기 팀에 필요한 번호(1번부터 순서대로)를 찾으러 한 명씩 달려나간다.3) 다른 팀이 들어서 보여준 접시콘 번호를 잘 기억했다가 자기 팀에 필요한 번호일 때 찾아온다.4) 주자가 도착선에 도착하면 다음 사람이 출발하여 10번까지 먼저 완성하는 팀이 승리한다.</p>
