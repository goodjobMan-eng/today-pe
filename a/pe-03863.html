<h1>이름 부르고 가위바위보 응원단 게임</h1>
<p>1) 체육관 안에서 최대한 빠르게 짝을 찾아 마주 선다. 2) 서로 자신의 이름을 말하며 주먹 인사를 나눈다. 3) 3판 2선승제로 가위바위보를 진행한다. 4) 승자는 손을 들고 새로운 상대 주자를 찾아 이동하고, 패자는 승자의 뒤를 따르며 열렬한 응원단이 되어 응원한다.</p>
