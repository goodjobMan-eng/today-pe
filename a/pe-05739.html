<h1>3학년 방향전환 달리기</h1>
<p>1) 첫 번째 구역에서는 천천히 달리다가 방향을 전환할 때 빠르게 전환한다.2) 두 번째 구역(십자 달리기)에서는 놓여 있는 훌라후프를 활용해 원을 크게 돈다.3) 세 번째 구역에서는 자세를 낮추고 왼쪽 콘은 왼손으로, 오른쪽 콘은 오른손으로 터치하며 지그재그로 달린 뒤 다른 구역으로 이동한다.</p>
