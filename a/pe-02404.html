<h1>배드민턴 리듬 트레이닝 스트로크</h1>
<p>1) 배드민턴 라켓을 잡고 음악 비트에 맞추어 제자리 손목 스윙을 3회 실시한다. 2) 포핸드 오버헤드, 포핸드 사이드암, 포핸드 언더핸드 스트로크를 각각 3회씩 음악에 맞춰 반복한다. 3) 백핸드 오버헤드, 백핸드 사이드암, 백핸드 언더핸드 스트로크를 각각 3회씩 실시한다. 4) 좌우 슬라이딩 스텝 후 포핸드 스트로크 2회, 좌우 헤어핀 2회 후 점프 스매싱으로 마무리한다.</p>
