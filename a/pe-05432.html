<h1>협력 깨금발 콩콩콩</h1>
<p>1) 모둠원들이 앞뒤로 나란히 선다.2) 앞사람의 어깨에 손을 올리고 뒷사람은 앞 친구의 한쪽 발목을 잡는다.3) 첫 번째 친구는 발목을 잡히지 않은 상태로 맨 앞에서 출발 준비를 한다.4) 정해진 거리(약 15m 등)를 발을 놓치지 않고 깨금발로 함께 뛰어 통과한다.5) 끝까지 발목을 잡은 채 먼저 결승선을 통과하는 모둠이 승리한다.</p>
