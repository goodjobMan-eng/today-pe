<h1>훌라후프 표적 배드민턴 서비스 챌린지</h1>
<p>1) 네트 너머 반대편 코트에 1번부터 4번까지 훌라후프 4개를 거리별로 배치합니다. 2) 서브 라인에 서서 셔틀콕 깃털을 잡고 코르크가 자신을 향하게 맞춘 뒤 언더핸드로 서브를 넣습니다. 3) 1번 후프부터 4번 후프까지 순서대로 셔틀콕을 정확히 넣어 모든 후프에 성공할 때까지 걸린 시간을 측정합니다. 4) 팀원끼리 셔틀콕을 번갈아 서브하거나 점수판을 만들어 합산 점수로 팀 대결을 펼칩니다.</p>
