<h1>탈출 게임</h1>
<p>1) 아이는 바닥에 엎드리고 술래는 발을 잡으며, 신호에 맞춰 빠져나와 탈출한다. 2) 술래가 아이의 등 위에 엎드려 누르고, 아이는 온몸에 힘을 주어 기어 나와 탈출한다. 3) 술래가 다리 사이에 아이를 앉히고 다리로 감싸 잠그면 제한 시간 내에 빠져나온다. 4) 네발로 엎드린 술래의 허리를 뒤에서 잡고 앞쪽으로 기어 나와 빠져나온다.</p>
