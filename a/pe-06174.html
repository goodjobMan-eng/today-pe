<h1>영역형 축구형 게임 패스와 드리블</h1>
<p>1) 파트너의 이름을 부른 후 발 안쪽으로 정확하게 패스한다.2) 패스에 실패하면 정해진 구역을 한 바퀴 돌고 다시 참여한다.3) 지정된 구역에서 공을 차서 날리지 않고 밀면서 2시, 6시, 10시 방향으로 방향을 전환하며 자유 드리블한다.</p>
