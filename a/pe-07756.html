<h1>어린이 단계별 팔굽혀펴기 트레이닝</h1>
<p>1) 손으로 바닥을 짚고 몸을 지탱하며 약 10초간 버틴다. 2) 무릎을 바닥에 대고 물개처럼 엎드린 자세에서 배를 바닥에 댔다가 팔을 굽혔다 펴며 상체를 들어 올린다. 3) 무릎을 떼고 엎드려 배를 바닥까지 완전히 붙인 뒤 팔을 밀어 올라오는 동작을 반복한다. 4) 충분한 근력이 생기면 가슴이 바닥에 닿기 직전까지만 내렸다가 밀어 올리는 일반적인 팔굽혀펴기에 도전한다.</p>
