<h1>주사위 달리기 (나온 눈만큼 반환점 돌기)</h1>
<p>1) 학급을 두 팀으로 나누어 출발 순서를 정하고 출발점과 반환점을 콘으로 표시합니다. 2) 첫 주자는 출발선에서 천주사위를 머리 위로 높이 던져 바닥에 나온 눈의 수를 확인합니다. 3) 주사위를 들고 반환점까지 전력 질주해 나온 숫자만큼 반환점을 돈 뒤 출발점으로 돌아와 다음 주자에게 주사위를 손으로 안전하게 건네줍니다. 4) 팀의 마지막 주자까지 반환점을 모두 돌고 먼저 완주하는 팀이 승리합니다.</p>
