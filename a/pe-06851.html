<h1>캐치볼 탁구</h1>
<p>1) 던져던져 탁구는 2대 2로 라켓 없이 손으로 서브를 넣고 상대는 손으로 받아 3초 안에 상대 코트로 던진다. 2) 같은 팀원에게 패스할 수 없고 공이 바닥에 떨어지면 실점하며 10점까지 진행한다. 3) 척척 받기 탁구는 3대 3으로 같은 팀원이 2대 1로 마주 보고 서서 라켓으로 공을 쳐주면 다른 팀원이 라켓으로 받는다. 4) 1분간 진행하여 손을 대지 않고 라켓으로 받아 자기 팀 컵 안에 더 많은 공을 넣는 팀이 승리한다.</p>
