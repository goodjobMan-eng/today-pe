<h1>스케이트 타기 운동</h1>
<p>1) 바닥에 양옆으로 놓인 마커 사이에서 중심을 잡고 선다. 2) 자세를 낮추고 몸통의 중심과 높이를 일정하게 유지한다. 3) 한쪽 다리를 옆으로 쭉 뻗어 발끝으로 마커를 정확하게 터치하고 돌아온다. 4) 좌우를 번갈아가며 각 7회씩 실시하고 총 3세트를 반복한다.</p>
