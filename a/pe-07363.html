<h1>반응 달리기 게임</h1>
<p>1) 8~10m 거리를 두고 두 개의 서로 다른 색깔 선(마커)을 설치한다. 2) 참가자들은 두 선 사이 중앙에 한 줄로 나란히 선다. 3) 진행자가 특정 색깔(예: 노란색 선, 파란색 선)을 외치면 재빨리 해당 선으로 달려간다.</p>
