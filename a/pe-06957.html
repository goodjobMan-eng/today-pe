<h1>어라운드 더 월드 크리켓 타격 게임</h1>
<p>1) 7~8명이 한 팀이 되어 타자 1명, 투수 1명, 나머지 외야 수비수로 역할을 나눈다. 2) 투수가 타자에게 총 5번 공을 던지며, 타자는 공을 쳐서 수비수 방향으로 보낸다. 3) 수비수가 공을 성공적으로 잡거나 필딩하면 팀이 1점을 획득하며, 공을 처리한 수비수는 해당 타자의 남은 기회 동안 옆으로 빠져 다른 친구들에게 기회를 준다.</p>
