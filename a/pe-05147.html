<h1>여름 테마 둘 중 하나 고르기(Would You Rather)</h1>
<p>1) 화면에 양자택일 질문(예: 레모네이드 vs 스노우콘)이 나오면 마음에 드는 선택지를 하나 고른다.2) 자신이 고른 선택지 쪽에 표시된 운동 동작이나 댄스 동작을 확인한다.3) 카운트다운 시간(약 10초) 동안 화면 속 캐릭터의 동작을 따라 하며 움직인다.</p>
