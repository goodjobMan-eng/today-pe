<h1>농구 기초 기능을 익히는 3가지 농구형 게임</h1>
<p>1) '왕자·왕·황제': 학생들은 각자 드리블하며 상대 공을 쳐내 상위 구역으로 승격하고 공을 뺏기면 하위 구역으로 내려간다. 2) '문어 술래잡기': 술래를 피해 드리블로 반대편 코트로 건너가며, 술래에게 닿으면 코트에 서서 함께 술래 역할을 한다. 3) '움직이는 후프': 각 팀의 주자가 후프를 들고 움직이는 골대 역할을 하며, 5번 패스를 완료한 후 후프 속에 슛을 넣어 득점한다.</p>
