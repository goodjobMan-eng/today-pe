<h1>초등 단체 좌식 배구 놀이</h1>
<p>1) 배드민턴 네트를 낮게 설치하고 두 팀으로 나누어 코트 바닥에 무릎을 꿇거나 앉아서 배치된다. 2) 배드민턴 서비스 라인 부근에서 서브 공을 던져 올려 경기를 시작한다. 3) 바닥에 엉덩이를 대고 앉은 상태에서 큰 공을 쳐서 네트 너머로 넘긴다(외곽 방어자는 서서 코트 안으로 공을 지원해 준다). 4) 공이 바닥에 닿지 않게 여러 번 쳐서 랠리를 이어가며, 오랫동안 쳐서 점수를 얻을 경우 랠리 점수(2점)를 부여한다.</p>
