<h1>두더지 보물찾기 놀이</h1>
<p>1) 학생들이 교실 밖 복도로 나가 대기한다.2) 교사가 교실 안 곳곳에 글자를 적은 포스트잇 보물을 숨겨 놓는다.3) 두더지 역할을 맡은 학생들이 얼굴에 원뿔형 도안 콘을 대고 교실로 들어온다.4) 시야가 좁아진 상태에서 교실 곳곳을 탐색하여 포스트잇에 적힌 글자를 찾아 읽는다.5) 보물에 적힌 글자를 맞히면 선물을 획득한다.</p>
