<h1>공기놀이 중심 기술 익히기(바닥치기와 공기줍기)</h1>
<p>1) 공깃돌을 위로 올린 뒤 바닥을 손으로 치고 떨어지는 공깃돌을 받는다. 2) 바닥치기 동작을 연달아 5번 성공할 때까지 반복 연습한다(도중 실패 시 처음부터 다시 시작). 3) 바닥치기에 성공하면 공깃돌 하나를 위로 올리고 바닥의 공깃돌 하나를 집는 공기줍기를 연습한다. 4) 공깃돌 5개를 연달아 집어 올릴 때까지 반복하여 기본기를 익힌다.</p>
