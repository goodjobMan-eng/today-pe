<h1>짝 다리 뛰어넘기</h1>
<p>1) 두 사람이 짝을 지어 한 명은 바닥에 앉거나 눕고 다른 한 명은 그 옆에 선다. 2) 바닥에 있는 사람이 다리 한 짝 또는 양다리를 벌려 바닥에 내밀고 서 있는 사람이 두 발 모아 또는 켄켄(한 발)으로 뛰어넘는다. 3) 10초 동안 부딪히지 않고 왕복해서 넘은 횟수를 세어 성공 여부를 확인한다. 4) 바닥에 엎드리거나 완전히 누운 상태 위를 타넘는 고난도 동작으로 변형하여 진행한다.</p>
