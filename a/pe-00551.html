<h1>안전하고 쉬운 모둠 매스게임(꾸미기 체조) 3가지</h1>
<p>1) 3~4명이 바닥에 둘러앉아 서로 손을 잡고 발을 가운데로 모아 올리는 '꽃' 동작을 준비합니다. 2) 3인 1조 부채 대형에서는 가운데 학생이 한 걸음 뒤로 물러서서 양옆 학생들과 손을 잡고 발을 모아 균형을 잡습니다. 3) 여러 명이 일렬로 엎드려 뒷사람의 발목을 앞사람의 어깨에 걸치는 '파도(다리)' 동작으로 연결합니다. 4) 동작을 마칠 때까지 자세를 유지하며 호흡을 맞춥니다.</p>
