<h1>우리 반 육상 대회 기록 도전</h1>
<p>1) 반 전체를 네 모둠으로 나누고 두 모둠은 선수, 나머지 두 모둠은 경기 진행 역할을 맡는다. 2) 선수 모듬이 기록 측정을 마치면 경기 진행을 맡은 모듬과 역할을 바꾼다. 3) 이어달리기는 모든 모둠이 경기에 참여한다. 4) 가위뛰기와 배면뛰기 중 자신 있는 방법으로 가로대를 넘으며 새로운 기록에 도전한다.</p>
