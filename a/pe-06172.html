<h1>기차공놀이</h1>
<p>1) 짝과 함께 등이나 몸 사이에 공을 끼우고 손을 잡거나 앞사람 어깨에 손을 올린다.2) 공을 떨어뜨리지 않고 함께 호흡을 맞춰 목적지까지 이동하여 한 줄 기차를 완성한다.3) 뒤에 공이 떨어지거나 불편하면 멈춰 달라고 부탁하고 상대는 멈춰 기다려준다.4) 끝까지 들어온 순서대로 1위 팀부터 꼴찌 팀까지 점수를 부여한다.</p>
