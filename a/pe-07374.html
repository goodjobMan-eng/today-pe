<h1>팔벌려 가위바위보</h1>
<p>1) 팔벌려뛰기를 '하나 둘 셋' 구령에 맞춰 진행한다. 2) '셋'의 구령에서 손바닥을 위로 하여 양팔을 45도 위로 벌린 자세(가위), 머리 위에서 동그라미를 만든 자세(주먹), 양팔을 옆으로 펼친 자세(보) 중 하나를 취한다. 3) 정해진 가위바위보 규칙에 따라 승패를 겨룬다.</p>
