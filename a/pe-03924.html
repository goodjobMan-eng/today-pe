<h1>300점 플라잉디스크 받기</h1>
<p>1) 4~6명이 모둠을 만들고 콘 위치의 던지는 사람 1명과 맞은편 받는 사람들로 나뉜다. 2) 던진 디스크를 바닥에서 주우면 100점을 얻고, 공중에서 바로 잡으면 200점을 얻는다. 3) 디스크를 다시 던지는 사람에게 건네며 누적 300점을 먼저 획득할 때까지 반복한다. 4) 300점을 채운 사람이 던지는 역할을 이어받고 모든 점수를 0점으로 초기화한다.</p>
