<h1>훌라후프 발차기 모둠 공 모으기</h1>
<p>1) 4~5명씩 모둠을 만들고 모든 팀원이 한 훌라후프에 한 손 이상을 얹고 모둠 진지에 선다. 2) 중앙 구역에 다양한 색상의 폼볼을 흩뿌려 둔 뒤 신호와 함께 모둠원 전체가 후프를 잡은 채 이동한다. 3) 손을 쓰지 않고 오직 발로만 공을 살살 차거나 패스하여 한 번에 1개씩 모둠 진지로 가져온다. 4) 제한 시간 종료 후 모은 공의 총개수(또는 공 색깔별 차등 점수)를 합산하여 승패를 가린다.</p>
