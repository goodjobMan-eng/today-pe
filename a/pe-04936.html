<h1>3대3 스리맨 사커 (슈팅 편)</h1>
<p>1) 양 골대에 페트병 3개를 세우고 3 대 3으로 5분간 시합을 진행한다.2) 배운 슛 기술을 살려 상대 페트병을 공으로 맞춰 쓰러뜨린다.3) 5분 동안 페트병을 더 많이 쓰러뜨린 팀이 이기며 동점일 경우 PK전으로 간다.4) PK전은 팀당 3명이 한 명씩 번갈아 페트병을 향해 슈팅한다.5) PK전에서 페트병을 더 많이 쓰러뜨린 팀이 최종 승리한다.</p>
