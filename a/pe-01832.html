<h1>동전 밟기 보물찾기 웜업</h1>
<p>1) 참가자들은 경기장 끝선에 등을 돌려 정렬하고 교사는 경기장 곳곳에 동전을 흩뿌려 둔다. 2) 출발 신호가 떨어지면 학생들은 일제히 달려가 바닥에 놓인 동전을 찾아 그 위에 발을 올리고 선다. 3) 동전을 밟지 못한 학생들은 팔굽혀펴기나 점핑잭 등 간단한 체조 미션을 수행한다. 4) 매 라운드마다 동전을 1개씩 줄여가며 진행하고 마지막에 남는 우승자를 가린다.</p>
