<h1>범프 태그 (자리 밀어내기 술래잡기)</h1>
<p>1) 학생들이 바닥에 두 명씩 짝을 지어 나란히 앉아 대기한다. 2) 한 짝을 나누어 한 명은 술래(추격자), 한 명은 도망자가 되어 술래잡기를 시작한다. 3) 도망자는 앉아 있는 짝 중 한 사람 옆에 앉을 수 있으며, 앉는 순간 반대편 끝에 앉아 있던 사람이 밀려나 새로운 도망자가 된다. 4) 술래가 도망자를 터치하면 그 즉시 두 사람의 역할이 바뀌어 새로운 술래와 도망자가 된다.</p>
