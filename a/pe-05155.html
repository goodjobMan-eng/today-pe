<h1>구미 베어 태그</h1>
<p>1) 교사가 양손에 풀누들 태그 스틱을 들고 로봇처럼 행진하며 구미 베어 노래에 맞춰 학생들을 태그한다.2) 태그된 학생은 구미 베어가 되어 통에서 태그 스틱 2개를 가져온다.3) 태그된 학생들도 교사와 함께 로봇처럼 행진하며 다른 학생들을 태그한다.</p>
