<h1>탈락 없는 가라사대 놀이</h1>
<p>1) 색연필 10개를 책상 위에 올려놓고 준비한다. 2) 진행자가 말 앞에 '가라사대'를 붙인 명령에만 행동을 따라 한다. 3) '가라사대'를 붙이지 않은 명령에 움직이면 틀린 것으로 판정하고 색연필 1개를 필통에 넣는다. 4) 중간 탈락자 없이 계속 진행하여 마지막에 색연필이 가장 많이 남은 사람이 우승한다.</p>
