<h1>흉내내기 동물 가위바위보 (마넷코 도우부츠 쟌켄)</h1>
<p>1) 참가자들은 제자리에서 리듬에 맞춰 구호를 외치며 가볍게 점프합니다. 2) 구호 끝 신호에 맞춰 약속된 동물 자세(말 자세, 악어 자세, 거미 자세 등) 중 하나를 동시에 취합니다. 3) 술래나 상대와 같은 동물 자세를 취하면 점수를 얻습니다. 4) 서로 다른 동물 자세를 취한 사람은 벌칙으로 해당 자세를 유지한 채 제자리에서 한 바퀴 돕니다.</p>
