<h1>오늘의 매직넘버</h1>
<p>1) 모둠별 주자가 출발선에서 달려 나가 반환점에 놓인 숫자 카드(종이컵)를 확인한다.2) 첫 번째와 두 번째 주자는 숫자가 보이게 카드를 들고 오고, 세 번째 주자는 보이지 않게 가려서 가져온다.3) 세 숫자의 합이 교사가 제시한 오늘의 매직넘버(예: 20)와 일치하면 모둠이 성공한다.4) 합이 맞지 않으면 다음 주자가 카드 1장을 반환점에 되돌려놓고 다른 카드로 교체해 가져온다.</p>
