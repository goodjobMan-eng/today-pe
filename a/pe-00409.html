<h1>MIX 가위바위보</h1>
<p>1) 의자를 둥글게 원형으로 배치한 후 의자 하나를 빼고 술래 한 명이 원 가운데에 섭니다. 2) 술래는 머리 위로 두 손을 높이 들고 앉아 있는 전체 학생들과 가위바위보를 합니다. 3) 가위바위보에서 진 학생들만 자리에서 일어나 빈자리를 찾아 빠르게 이동해 앉습니다. 4) 자리에 앉지 못하고 남은 학생이 다음 술래가 되어 새로운 조건(진 사람, 비긴 사람 등)으로 게임을 이어 갑니다.</p>
