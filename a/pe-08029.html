<h1>초급 배구 기초 경기 규칙</h1>
<p>1) 한 팀 6명씩 양 코트에 나뉘어 서고 서브로 랠리를 시작한다. 2) 네트를 넘어온 공이 바닥에 닿기 전에 팀원끼리 연결하여 3회 이내에 상대 코트로 넘긴다. 3) 공을 바닥에 떨어뜨리거나 3회 이내에 넘기지 못하면 상대 팀이 득점하며, 25점을 먼저 낸 팀이 세트를 얻는다.</p>
