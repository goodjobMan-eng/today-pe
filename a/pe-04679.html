<h1>신체 기능 도전 코스 (테스트 유어 스킬)</h1>
<p>1) 각 콘에 제시된 동작 그림(허들 달리기, 한 발 뛰기, 축구 드리블, 농구 슛, 크랩 워크, 스키핑, 스쿠터보드)을 확인한다. 2) 출발 콘에서 지정된 동작을 수행하며 반환점 콘을 돌아 제자리로 돌아온다. 3) 복귀한 주자는 콘을 손으로 터치(비프)하여 대기 중인 다음 주자에게 순서를 넘긴다. 4) 한 활동을 마친 학생은 원하는 다른 운동 콘으로 이동하여 도전한다.</p>
