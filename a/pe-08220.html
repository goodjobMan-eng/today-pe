<p>1) 양 팀이 마주 보고 사이드라인을 따라 길게 서서 대기한다. 2) 신호가 울리면 각 줄의 앞쪽 5명이 경기장 안으로 들어가 축구공(폼볼)으로 경기를 한다. 3) 사이드라인에 남은 학생들은 골키퍼 역할을 하며, 다음 신호 때 안쪽 5명은 줄 맨 뒤로 가고 새로운 5명이 교대 투입된다.</p>
