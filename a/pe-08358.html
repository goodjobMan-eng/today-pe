<h1>3인 패스 컷 리플레이스 드릴</h1>
<p>1) 탑(Top)과 양쪽 윙(Wing) 콘 위치에 서서 탑의 선수가 한쪽 윙으로 공을 패스한다. 2) 패스한 선수는 골대를 향해 가운데로 컷인하며 공을 바라본 뒤 반대편 윙 콘으로 이동한다. 3) 반대편 윙의 선수가 빈 탑 자리로 올라와 패스를 받고, 다시 윙으로 패스한 뒤 컷인을 반복하며 공간을 채운다.</p>
