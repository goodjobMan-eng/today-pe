<h1>노른자 흰자 옮기기 릴레이</h1>
<p>1) 엎어놓은 스태킹 컵 위에 다른 컵을 포개어 올려놓고 노른자 팀과 흰자 팀으로 나눈다.2) 책상 위에 컵을 두고 손목의 회전을 이용해 컵을 쳐서 뒤집어 착지시킨다.3) 성공하면 다음 사람 책상으로 이동하여 차례대로 컵을 뒤집어 옮긴다.4) 도중에 컵이 바닥에 떨어지면 떨어진 위치에서 다시 도전하여 마지막 주자까지 먼저 옮기는 팀이 승리한다.</p>
