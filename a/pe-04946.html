<h1>피구 굴러오는 공 안전 캐칭 훈련 (キャッチングの練習)</h1>
<p>1) 양발을 어깨너비로 벌리고 허리를 낮추며 상체를 살짝 앞으로 숙여 기본자세를 잡는다.2) 바닥으로 굴러오는 낮은 공이 오면 무릎을 바닥에 대며 자세를 완전히 낮춘다.3) 손으로만 잡으려 하지 말고 두 팔로 감싸 안듯이 가슴 전체로 공을 품어 잡는다.4) 짝이 굴려주는 공을 정면에서 안전하게 품어내는 연습을 반복한다.</p>
