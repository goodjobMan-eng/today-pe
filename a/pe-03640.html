<h1>교실 책상 사이 자유투 농구 게임</h1>
<p>1) 모둠별로 바닥에 앉아 1번부터 차례대로 대기한다. 2) 자기 차례에 앉은 자세로 공을 던져 책상 사이 공간에 집어넣는다. 3) 공을 던진 사람이 직접 공을 잡아 다음 순서 친구에게 전달한다. 4) 모든 팀원이 끝날 때까지 정확하게 많이 넣은 팀이 이기며 다 끝난 팀은 머리에 손을 올린다.</p>
