<h1>화산과 아이스크림 콘 뒤집기</h1>
<p>1) 활동 공간에 15개 이상의 콘을 바르게 세우거나 거꾸로 뒤집어 흩어놓는다. 2) 학급을 '화산 팀(바르게 세우기)'과 '아이스크림 팀(뒤집어 놓기)'의 두 팀으로 나눈다. 3) 신호가 울리면 2~3분 동안 뛰어다니며 자기 팀 방향으로 한 번에 콘을 1개씩 뒤집는다. 4) 호루라기 소리에 멈추고 자신의 팀 모양으로 더 많이 뒤집힌 팀이 승리하며, 역할을 바꾸어 재진행한다.</p>
