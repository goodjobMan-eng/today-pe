<h1>폭주 기관차 킨볼 레일 게임</h1>
<p>1) 학생들이 바닥에 엎드리거나 등을 대고 나란히 누워 기찻길 레일을 만든다. 2) 기관사 역할을 맡은 학생이 킨볼(기차)을 학생들 위로 굴려 이동시킨다. 3) 킨볼이 자기 몸 위를 지나가면 즉시 일어나 기찻길의 맨 끝으로 달려가 다시 눕는다. 4) 기차가 바닥에 닿지 않게 유지하며 체육관 반대편 끝까지 기찻길을 연결해 나간다.</p>
