<h1>잔디밭 릴레이 배턴 터치 달리기</h1>
<p>1) 주자가 배턴을 쥐고 출발 구호에 맞춰 앞 주자에게 다가간다. 2) 앞 주자는 뒤를 보지 않고 손을 뒤로 뻗어 배턴을 이어받는다. 3) 배턴을 이어받은 뒤 전방의 콘을 향해 전력 질주한다.</p>
