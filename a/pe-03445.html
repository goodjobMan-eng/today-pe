<h1>앞구르기 연습하기</h1>
<p>1) 양손으로 무릎을 잡고 가슴에 붙인 뒤 턱을 당겨 뒤로 누웠다 앞으로 구르는 오뚝이 구르기를 연습한다. 2) 친구가 앞에서 잡아주거나 뒤에서 밀어주며 도움을 받아 앞구르기를 연습한다. 3) 경사진 매트의 높은 곳에서 낮은 곳으로 턱을 당기고 몸을 둥글게 말아 앞구르기를 연습한다. 4) 양손을 어깨너비로 벌려 매트를 짚고 뒷머리, 등, 허리, 엉덩이, 발 순서로 몸이 닿도록 구른 뒤 손으로 무릎을 잡고 일어선다.</p>
