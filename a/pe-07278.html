<h1>주사위 술래잡기</h1>
<p>1) 체육관 곳곳에 4가지 색상의 훌라후프를 학생 수만큼 놓고 각자 후프 안에 들어간다. 2) 교사가 주사위를 굴려 1~4번 색상 후프의 학생이 펀스틱을 들고 술래가 되며, 5번은 점핑잭, 6번은 교사가 술래가 된다. 3) 색상이 나온 술래는 도망치는 학생들을 태그하고, 태그된 학생은 빈 훌라후프에 들어가 대기한다.</p>
