<h1>돌 마녀 술래잡기 (라 소르시에르 드 피에르)</h1>
<p>1) 유도 매트(타타미) 영역 내에서 술래(마녀) 1~2명을 정한다. 2) 안전 구역 바깥(빨간 매트)으로 나가거나 술래에게 터치되면 돌이 된다. 3) 돌이 된 사람은 자리에 웅크려 몸을 둥글게 웅크리고 멈춘다. 4) 다른 친구가 다가와 웅크린 친구의 팔을 감싸 안고 밀어 뒤집어주면 돌에서 풀려나 다시 달릴 수 있다. 5) 모든 사람이 돌이 되기 전에 술래를 피해 친구들을 구출하며 도망친다.</p>
