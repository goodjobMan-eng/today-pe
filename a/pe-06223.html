<h1>맞추기 달리기(틱택토)</h1>
<p>1) 연두 팀과 주앙 팀으로 나누어 일렬로 줄을 선다.2) 신호가 울리면 출발하여 장애물을 뛰어넘거나 돌아 달린다.3) 3x3 판에 팀 마커(조끼)를 놓으며 3줄 맞추기를 시도한다.4) 이미 놓인 마커가 꽉 차면 자기 팀 마커 중 하나만 골라 빈칸으로 위치를 이동한다.5) 다음 주자와 손을 터치하고 줄의 맨 뒤로 돌아간다.</p>
