<h1>원 바운딩 공치기 협력놀이</h1>
<p>1) 5명~7명이 한 팀을 이루고 공 1개를 준비하여 원형으로 선다. 2) 1명이 공을 원 안으로 던져 바운딩시켜 놀이를 시작한다. 3) 손바닥으로 공의 아래를 쳐서 원 안으로 원바운딩되게 공을 넘기며 팀원 모두가 참여한다. 4) 공이 두 번 바운딩되거나 벽 등에 맞아 원바운딩이 끊길 때까지 연속으로 친 횟수를 세어 최고 기록을 겨룬다.</p>
