<h1>철봉 천국돌기·지옥돌기 요령</h1>
<p>1) 철봉 위에 올라가 양다리를 봉에 단단히 건다. 2) 엄지손가락을 봉 아래로 감싸 쥐는 그립으로 봉을 잡고 손을 절대 놓지 않는다. 3) 배가 아닌 허벅지(대각선 아래)를 바라보며 몸을 최대한 웅크려 앞으로(천국돌기) 또는 뒤로(지옥돌기) 힘차게 회전한다.</p>
