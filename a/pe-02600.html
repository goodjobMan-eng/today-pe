<h1>홈트레이닝 버피와 전신 운동</h1>
<p>1) 엎드려 무릎과 팔꿈치를 바닥에 댄 후 몸을 곧게 펴서 팔꿈치와 발로 버티는 플랭크를 30초씩 3세트 수행한다. 2) 앉은 자세에서 한 발을 뻗고 반대 무릎을 굽힌 뒤 상체를 기울여 몸을 늘려주는 동작을 좌우 10회씩 수행한다. 3) 선 자세에서 상체를 굽혀 손을 짚고 다리를 뒤로 뻗었다가 모아 일어서는 버피테스트를 10회씩 3세트 실시한다.</p>
