<h1>츄빅 스파이크볼</h1>
<p>1) 중앙에 스파이크볼 소형 바운드 네트(츄빅)를 설치하고 2명씩 2개 팀(총 4명)이 둘러서서 준비한다. 2) 한 팀이 공을 네트에 바운드시켜 상대 팀에게 서브하며 랠리를 시작한다. 3) 팀원끼리 최대 3번의 터치(패스) 안에 공을 중앙 네트에 바운드시켜 상대 팀 진영으로 넘긴다. 4) 공이 네트를 벗어나거나 바닥에 먼저 떨어지면 상대 팀이 득점하며 정해진 점수에 먼저 도달한 팀이 승리한다.</p>
