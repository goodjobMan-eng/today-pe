<p>1) 화면에 나오는 질문을 보고 조이가 갈 방향을 정해 지정된 포즈를 취한다.2) 이동 중 나타나는 장애물에 맞춰 점프, 숙이기, 피하기, 펀치 동작을 수행한다.3) 불안 토네이도가 나타나면 동작을 멈추고 제자리에 얼음처럼 멈춘다.</p>
