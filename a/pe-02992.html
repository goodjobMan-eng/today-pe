<h1>대왕문어 술래잡기</h1>
<p>1) 대왕문어 술래는 스펀지 막대를 들고 긴 다리를 이용하듯 걸어 다니며 도망치는 친구들을 터치한다. 2) 술래에게 잡힌 친구는 잡힌 자리에 멈춰 서서 제자리에서 손을 뻗어 다른 친구를 잡는 새끼 문어가 된다. 3) 교사가 호루라기를 불어 1라운드를 종료하면 살아남은 친구들끼리 가위바위보를 하여 다음 대왕문어를 정한다. 4) 변형 활동으로 모두가 달리며 참여하거나, 새끼 문어도 걸어 다니며 친구들을 잡는 방식으로 진행한다.</p>
