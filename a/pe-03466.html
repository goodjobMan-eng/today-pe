<h1>볼링 핀 쓰러뜨리기</h1>
<p>1) 여섯 명이 한 모둠을 이루고 공을 차는 순서를 정한다. 2) 공을 차서 볼링핀을 모두 쓰러뜨리면 다음 순서의 모둠원이 공을 찬다. 3) 볼링핀을 일곱 개보다 적게 쓰러뜨리면 첫 번째 콘을 돌아오고, 세 개보다 적게 쓰러뜨리면 두 번째 콘을 돌아 다음 순서 모둠원과 손을 쳐주면 공을 찰 수 있다. 4) 정해진 시간 동안 가장 많은 볼링핀을 쓰러뜨린 모둠이 이긴다.</p>
