<h1>손잡고 페트병 타이밍 점프</h1>
<p>1) 모둠원들이 둥글게 둘러서서 서로 양손을 잡아 원형을 만들고, 각자의 발밑 바닥에 페트병을 하나씩 일정 간격으로 세워 둡니다. 2) 전원이 구호나 노래 리듬에 맞춰 동시에 두 발 모아 제자리 혹은 옆으로 점프합니다. 3) 페트병을 발로 쳐서 넘어뜨리거나 점프하는 타이밍·방향이 어긋나면 처음부터 다시 시작합니다. 4) 호흡을 맞춰 약속한 횟수만큼 페트병을 건드리지 않고 연속으로 점프를 성공하면 클리어합니다.</p>
