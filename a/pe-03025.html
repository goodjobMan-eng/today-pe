<h1>한 줄 달팽이 놀이</h1>
<p>1) 양쪽 팀이 일직선 라인의 양 끝에서 각각 출발하여 마주 보고 걸어온다. 2) 마주치면 멈춰 서서 가위바위보를 진행한다. 3) 가위바위보에서 진 사람은 선 밖으로 나가 자기 팀 줄 맨 뒤로 돌아가고, 이긴 사람은 계속 앞으로 전진한다. 4) 진 팀에서는 다음 사람이 즉시 선을 따라 출발하여 전진하는 상대와 다시 가위바위보를 한다.</p>
