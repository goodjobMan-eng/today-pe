<h1>삼각 술래잡기</h1>
<p>1) 빨강, 하양, 검정 3개 팀으로 나누고 각 팀의 진지를 만든다. 2) 빨강은 하양, 하양은 검정, 검정은 빨강 팀을 쫓아가 태그한다. 3) 태그된 사람은 상대 팀 진지로 잡혀가 손을 잡고 줄을 서서 기다린다. 4) 잡히지 않은 아군이 포로 줄의 맨 앞사람을 태그하면 전원 부활하며, 한 팀이 전원 잡히면 게임이 끝난다.</p>
