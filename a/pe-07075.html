<h1>가비지 토스 (Garbage Toss)</h1>
<p>1) 네트 양쪽에 두 팀으로 나누어 서고 바닥 전체에 셔틀콕을 흩뿌려 둔다. 2) 신호가 울리면 바닥의 셔틀콕을 줍거나 날아오는 것을 잡아 서브 라인으로 이동한다. 3) 포핸드나 백핸드 서브(숏 서브 또는 롱 서브)로 상대편 코트로 넘긴다. 4) 정해진 제한 시간이 끝났을 때 자기 진영에 셔틀콕이 더 적게 남은 팀이 승리한다.</p>
