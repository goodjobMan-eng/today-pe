<h1>상상 공 마임 표현 놀이</h1>
<p>1) 가상의 상상 공이 아주 무겁거나 뜨겁거나 더럽거나 가시가 돋친 상태 등 다양한 특성을 지녔다고 가정한다. 2) 진행자의 안내에 따라 공의 상태(더러움, 뜨거움, 무거움, 뾰족함, 미끄러움)에 맞추어 표정과 몸짓으로 극대화하여 표현한다. 3) 짝이나 모둠과 함께 공을 건네받으며 해당 감각과 무게감을 실감 나게 마임으로 이어간다.</p>
