<h1>릴로와 스티치 키즈 요가 스트레칭</h1>
<p>1) 화면 속 귀여운 스티치가 선보이는 요가 자세를 그대로 따라 합니다. 2) 자세를 잡은 상태에서 마음을 차분히 가라앉히고 깊고 천천히 숨을 쉽니다. 3) 안내 멘트에 따라 반대쪽 방향으로 자세를 바꾸어 좌우 신체 균형을 맞춥니다. 4) 전신 늘리기, 한 발 서기, 좌식 명상 자세를 차례로 수행하며 유연성과 이완을 유도합니다.</p>
