<h1>체력-업 주사위 피구공 놀이 (26 이륙하자~ 슝!)</h1>
<p>1) 공격과 수비 역할을 가위바위보 등으로 정한다.2) 공격 팀은 판에 1부터 100까지 숫자를 연속해서 쓴다.3) 수비 팀은 주사위 피구공을 던져 숫자 2나 6이 나오면 '전투기'라고 외치며 공격을 정지시킨다.4) 역할을 바꾸어 번갈아 진행하며 100까지 먼저 다 쓰고 마지막에 '끝'을 외친 팀이 승리한다.</p>
