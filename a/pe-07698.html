<h1>매트로 강 건너기 변형 놀이</h1>
<p>1) 모둠별로 절반은 안대를 착용해 시각장애 역할을 맡고, 나머지 절반은 말을 하지 못하는 역할을 맡는다. 2) 말을 못 하는 참가자들은 비언어적 신호로만 눈이 보이지 않는 참가자들을 안내한다. 3) 두 장의 대형 매트만을 번갈아 이동하며 바닥에 떨어지지 않고 체육관 끝까지 건너간다.</p>
