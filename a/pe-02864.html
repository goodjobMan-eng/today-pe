<h1>접시콘을 옮겨라</h1>
<p>1) 양쪽에 라바콘을 5개씩 놓고 5개의 접시콘을 가지고 출발한다. 2) 왼쪽 라바콘에 접시콘을 올리고 반환점을 돌아 왼쪽 콘 중 하나를 오른쪽으로 옮기는 과정을 반복한다. 3) 둘이 대결할 경우 색깔이 다른 접시콘과 라바콘을 사용해 서로 반대 방향에서 출발하여 상대방 쪽에 빨리 옮기고 돌아온다. 4) 라바콘이나 접시콘이 없을 때는 종이컵 5개와 마스킹 테이프로 대체하여 진행할 수 있다.</p>
