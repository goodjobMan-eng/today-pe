<h1>트릭 오어 트릿 술래잡기</h1>
<p>1) 술래가 도망가는 학생을 터치하여 잡는다. 2) 잡힌 학생은 '트릭 오어 트릿'을 외치며 정해진 장소로 이동한다. 3) 장소에 놓인 주사위를 던져 나온 숫자만큼 운동(팔굽혀펴기, 점핑잭 등)을 수행한다. 4) 운동을 마치면 다시 게임에 참여한다.</p>
