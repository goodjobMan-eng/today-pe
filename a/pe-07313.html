<h1>파수꾼과 동물 술래잡기(엘 과르디안)</h1>
<p>1) 마당 양쪽 구석에 매트를 깔고 학생들(동물)이 올라서며, 중앙에는 파수꾼 술래 모둠이 대기한다. 2) 교사가 '파수꾼 업무 종료, 원숭이!'처럼 특정 동물을 외친다. 3) 해당 동물 역할을 맡은 학생들은 그 동물의 흉내 동작을 취하며 반대편 매트로 달려 건너간다. 4) 건너가는 도중 파수꾼에게 잡힌 학생은 밖에서 대기하거나 파수꾼으로 전환된다.</p>
