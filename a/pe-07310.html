<h1>체육 릴레이 게임</h1>
<p>1) 손에 접시콘을 들고 빠르게 달려 콘을 반 바퀴 돈 뒤 후프 안에 콘을 놓는다. 2) 돌아와 다음 주자에게 배턴을 넘기며 모둠 전원이 통과할 때까지 반복한다. 3) 전원이 통과하면 콘 뒤에 한 줄로 서서 공이 땅에 떨어지지 않게 차례대로 패스하고 캐치한다. 4) 공을 패스한 뒤 즉시 쪼그려 앉으며 가장 먼저 완료한 팀이 득점한다.</p>
