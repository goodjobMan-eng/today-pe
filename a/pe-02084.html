<h1>체육시간 플로어볼 경기</h1>
<p>1) 양 팀으로 나뉘어 각자 플로어볼 스틱을 잡고 팀 조끼를 착용하여 경기장에 배치된다. 2) 중앙에서 페이스오프로 경기를 시작하며 스틱으로 공을 패스하고 드리블한다. 3) 상대 팀 골대에 공을 넣어 득점한다. 4) 정해진 피리어드(1~4피리어드) 동안 경기를 진행한다.</p>
