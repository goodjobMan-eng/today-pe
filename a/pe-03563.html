<h1>원숭이 구르기 주사위 릴레이</h1>
<p>1) 반 전체를 세 모둠으로 나누고 모둠별로 구르는 순서를 정합니다. 2) 첫 번째 모둠원은 양 발바닥을 맞대고 양손으로 발목을 잡은 자세로 준비하고 두 번째 모둠원이 주사위를 굴립니다. 3) 주사위가 홀수가 나오면 앞의 콘을, 짝수가 나오면 뒤의 콘을 굴러서 돌아옵니다. 4) 첫 번째 모둠원이 돌아오면 세 번째 모둠원이 주사위를 던지고 다음 모둠원이 출발하며, 마지막 모둠원이 가장 먼저 돌아온 모둠이 이깁니다.</p>
