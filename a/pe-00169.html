<h1>4코너 사분면 흡수 피구(4-Corner Dodgeball) — 코트 통합형 무탈락 피구</h1>
<p>강당 중앙에 십자(+) 형태로 라바콘을 세워 코트를 4개 사분면으로 나누고 4개 팀이 들어갑니다. 소프트폼볼을 던져 다른 구역 선수를 맞히면, 맞은 선수는 탈락하지 않고 자신을 맞힌 사분면 팀으로 즉시 이동해 합류합니다. 한 사분면의 마지막 선수가 흡수되면 그 사이 콘을 치워 코트 절반을 하나로 합쳐 최종 승리 사분면을 가립니다.</p>
