<h1>다리 사이 통과 차단 스트라이크볼 게임</h1>
<p>1) 꼬깔콘 6개를 역삼각형 볼링 핀 형태로 세우고 수비 학생이 다리를 벌려 핀을 보호하며 선다. 2) 공격 학생은 굴러오는 공을 잡지 않고 손으로 즉시 쳐서 수비 학생의 다리 사이로 통과시킨다. 3) 공이 다리 사이를 통과하면 공격자가 1점을 획득하고 수비는 다리로 막아 방어한다. 4) 수비 학생 수를 늘리거나 콘 개수와 거리를 조절하여 릴레이 대결로 변형할 수 있다.</p>
