<h1>공 몰기 놀이 (몬스터 술래)</h1>
<p>1) 정해진 구역 안에서 공을 몰며 몬스터(술래)를 피한다.2) 공을 찰 때는 앞으로만 차지 말고 2시, 3시, 10시 방향 등으로 밀면서 조절한다.3) 몬스터에게 공을 빼앗기거나 경기장 선 밖으로 공이 나가면 아웃된다.</p>
