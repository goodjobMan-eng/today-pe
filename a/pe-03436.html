<h1>태권도 약속 겨루기</h1>
<p>1) 공격자가 방어자의 몸통 부위를 돌려차기로 공격하면 방어자는 오른손 아래 막기로 방어한다. 2) 방어자는 막은 후 바로 몸통 지르기로 반격한다. 3) 공격자가 방어자의 얼굴 부위를 돌려차기로 공격하면 방어자는 재빠르게 뒤쪽으로 이동하여 피한다. 4) 방어자는 피한 직후 바로 이어서 옆차기로 반격한다.</p>
