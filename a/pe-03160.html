<h1>가위바위보 성장 놀이</h1>
<p>1) 1단계(바닥에 앉아 걷기), 2단계(의자에 앉기), 3단계(일어서서 걷기), 4단계(자리에 서서 손 번쩍 들기)의 동작을 확인한다. 2) 모두 바닥에 앉아 교실을 돌아다니다가 같은 단계의 친구를 만나면 가위바위보를 한다. 3) 가위바위보에서 이긴 사람은 다음 단계로 변신하고, 진 사람은 같은 모습으로 계속 게임을 한다. 4) 4단계까지 성장한 친구는 칠판 앞으로 모이며, 반의 절반 이상이 모이면 다 함께 노래를 부르고 마친다.</p>
