<h1>3팀 콘 쓰러뜨리기 축구 게임</h1>
<p>1) 3팀으로 나누어 각 팀 진영 앞에 콘을 일렬로 세우고 대기한다. 2) 신호가 울리면 각 팀 주자가 자기 진영의 콘 사이를 지그재그로 달린 뒤 중앙에 투입된 공을 향해 달린다. 3) 공을 차지한 선수는 상대 두 팀 중 하나의 콘을 공으로 차서 쓰러뜨리려 하고, 상대 팀들은 공을 빼앗거나 콘을 방어한다. 4) 쓰러진 콘은 그대로 두며, 콘이 0개가 된 팀이 패배한다.</p>
