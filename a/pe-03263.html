<h1>뜀틀 도움닫기와 발구르기 연습</h1>
<p>1) 세 걸음에서 다섯 걸음 뒤에서 가볍게 도움닫기를 한다. 2) 모둠발로 발구름판의 앞부분을 힘껏 밟으며 발바닥 전체로 발을 구른다. 3) 발구름판에서 높이 뛰어오른 다음 무릎을 살짝 구부리고 양팔을 벌려 균형을 잡으며 착지한다. 4) 동작이 익숙해질 수 있도록 반복하여 연습한다.</p>
