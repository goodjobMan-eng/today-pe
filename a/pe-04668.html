<h1>고스트버스터즈 유령 쓰러뜨리기 피구</h1>
<p>1) 코트 중앙선을 기준으로 두 팀으로 나누고 각 진영에 10개의 유령 핀을 세운다. 2) 공 10개를 사용하여 상대 진영의 유령 핀을 향해 던지거나 굴린다. 3) 수비팀은 공을 잡거나 쳐내어 자신의 유령 핀을 방어한다. 4) 넘어진 유령 핀을 다시 세우는 규칙(1라운드) 또는 다시 세우지 못하는 규칙(2라운드)을 적용해 승패를 가린다.</p>
