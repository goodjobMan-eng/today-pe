<h1>민속놀이 널뛰기</h1>
<p>1) 널판 가운데에 짚단이나 받침대를 괴어 널을 설치한다. 2) 두 사람이 널 양쪽 끝에 마주 보고 올라선다. 3) 한 사람이 발을 굴러 뛰어오르면 그 반동을 이용해 반대편 사람이 뛰어오른다. 4) 박자에 맞춰 번갈아 가며 높이 뛰어오르는 동작을 반복한다.</p>
