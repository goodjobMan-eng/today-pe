<h1>빈 곳으로 주먹야구 게임</h1>
<p>1) 6명이 한 모둠을 이루어 두 팀이 게임을 진행한다. 2) 타자는 주먹으로 공을 치고 1점이 적힌 콘을 돌아 홈으로 들어오면 1점, 2점이 적힌 콘을 돌아 홈으로 들어오면 2점을 얻는다. 3) 수비 모둠이 뜬공을 바로 받거나 타자보다 먼저 홈으로 공을 보내면 타자는 아웃된다. 4) 모든 타자의 공격이 끝나면 공수를 교대하고 점수를 더 많이 얻은 모둠이 이긴다.</p>
