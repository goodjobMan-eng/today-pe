<h1>초등 3학년 기본 움직임 운동</h1>
<p>1) 정면을 보고 천천히 걷기, 팔을 힘차게 흔들며 빠르게 걷기, 가슴을 펴고 천천히 달리기, 보폭을 넓혀 빠르게 달리기를 차례로 수행한다. 2) 낮은 철봉 팔 뻗어 매달리기, 높은 철봉 매달리기, 다리 걸어 매달리기로 철봉 활동을 한다. 3) 누워 다리 들어올려 버티기, 팔로 버티기, 의자 자세로 버티기와 다양한 몸통·무릎 굽히기 및 친구와 등대고 밀기, 마주보며 당기기를 연습한다.</p>
