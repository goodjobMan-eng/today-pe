<h1>알파벳 단어 탈출 태그</h1>
<p>1) 교사는 시작 전 지정 알파벳 글자(예: D)를 제시하고 술래 1~2명을 선정한다. 2) 신호가 울리면 술래는 도망치는 학생들을 터치하고, 터치당한 학생은 자리에 앉는다. 3) 앉은 학생은 지정 글자로 시작하는 단어(예: Dog)를 소리 내어 외치면 즉시 부활하여 다시 달린다. 4) 이전에 다른 학생이나 자신이 쓴 단어는 중복 사용할 수 없도록 규칙을 제한하여 진행한다.</p>
