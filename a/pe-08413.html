<h1>쓰러지기 전에 후프 돌리기 협동 놀이</h1>
<p>1) 학생들이 원을 그리며 서고, 바닥에 훌라후프를 회전시켜 세운다. 2) 모든 학생들이 협동하여 바닥에 있는 후프가 완전히 쓰러져 멈추기 전에 달려가 계속 회전시킨다. 3) 후프 하나라도 바닥에 완전히 쓰러지면 게임이 종료되며, 연속으로 같은 후프를 두 번 돌리는 것은 금지된다.</p>
