<h1>비닐봉지 제기 만들기와 제기차기</h1>
<p>1) 불투명 비닐봉지 제일 아래 가운데에 100원짜리 동전을 놓는다. 2) 동전 크기만큼 접어서 제일 위까지 접어 올린 뒤, 동전이 움직이지 않게 반으로 접어 고무줄로 감아준다. 3) 가위로 고무줄 윗부분을 잘라낸 뒤 손으로 하나하나 펼쳐주고 비벼서 제기를 완성한다. 4) 완성된 제기를 손바닥으로 치기, 책 위에 올려놓고 치기, 발로 차기 단계로 도전한다.</p>
