<h1>사방치기 (홉스코치)</h1>
<p>1) 1번부터 9번까지 번호가 매겨진 사방치기 칸에 콩주머니나 돌 등 표식을 던진다.2) 표식이 들어간 칸은 건너뛰고, 외칸은 한 발, 쌍칸은 양발로 통과하여 끝에서 돌아온다.3) 돌아오는 길에 균형을 잃거나 선을 밟지 않고 자신의 표식을 주워 출발선으로 돌아온다.4) 1번부터 9번까지 성공적으로 완료하면 승리한다.</p>
