<h1>교실 사구역 풍선배구 게임</h1>
<p>1) 책상으로 교실을 4구역으로 나누고 학생들은 각 구역 바닥에 앉는다 2) 엉덩이를 교실 바닥에 붙인 상태에서 자기 구역으로 넘어오는 풍선을 다른 구역으로 넘긴다 3) 타이머(30~50초)를 작동하고 선생님이나 모니터가 특정 풍선 색깔을 호명한다 4) 타이머가 울렸을 때 호명된 색깔의 풍선을 치거나 그 풍선이 있는 구역 팀이 실점한다</p>
