<h1>닌자 거북이 술래잡기</h1>
<p>1) 달리지 않고 스킵, 갤럽, 빠른 걸음으로만 이동한다. 2) 닌자 스틱을 든 슈레더 팀에게 태그된 거북이는 그 자리에서 닌자 자세로 얼어붙는다. 3) 팀원이 피자를 가져다주면 런지 점프 10회를 하고 풀려나며, 피자를 다른 얼어붙은 팀원에게 전달한다. 4) 파워볼을 든 스플린터에게 태그된 슈레더 팀원은 피트니스 구역으로 발끝으로 걸어가 점핑잭 10회를 하고 복귀한다.</p>
