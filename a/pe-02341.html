<h1>농구형 게임 기본 규칙과 바이얼레이션</h1>
<p>1) 한 팀 5명씩 구성하여 상대 바스켓에 공을 넣고 자기 바스켓을 수비한다. 2) 공을 손으로 튀기는 드리블을 하며 이동하고, 두 손으로 잡고 세 걸음 이상 걷지 않는다. 3) 3점 라인 밖 슛은 3점, 안쪽 슛은 2점, 반칙으로 얻은 자유투는 1점으로 계산한다. 4) 24초 슛 제한, 8초 하프라인 통과, 5초 패스, 3초 골밑 머무름 제한 등 바이얼레이션 규칙을 지킨다.</p>
