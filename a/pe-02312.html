<h1>돼지씨름</h1>
<p>1) 큰 원을 그리고 모두 원 안으로 들어간다. 2) 모두 앉아서 두 손을 엉덩이 아래쪽으로 가져가 잡는다. 3) 선생님의 시작 신호에 맞추어 상대방을 쓰러뜨린다. 4) 쓰러지거나 선을 넘어간 사람은 원 밖으로 나가며, 마지막까지 남은 사람이 속한 팀이 승리한다.</p>
