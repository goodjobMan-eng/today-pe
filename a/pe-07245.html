<h1>골리 태그</h1>
<p>1) 일부 참가자는 골키퍼가 되어 자신의 콘(또는 블록)을 지킨다. 2) 나머지 선수들은 공을 발로 차서 골키퍼의 콘이나 블록을 쓰러뜨리려고 시도한다. 3) 블록이나 콘을 맞히는 데 성공하면 찬 선수가 새로운 골키퍼가 되고, 원래 골키퍼는 선수가 되어 역할을 교대한다.</p>
