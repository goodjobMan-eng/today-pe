<h1>두 발 술래잡기</h1>
<p>1) 술래를 한 명 정하고 모든 친구들은 원 안으로 들어간다. 2) 선생님의 호루라기 소리에 맞추어 모두 동시에 술래가 닿지 않는 곳으로 두 발 높이 뛰기를 한다. 3) 한 번 뛴 후 술래는 팔을 뻗어 친구들을 잡고, 친구들은 움직이지 않는다. 4) 술래에게 잡힌 학생은 정해진 구역 밖으로 나가 앉는다.</p>
