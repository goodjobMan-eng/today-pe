<h1>언더 꽃게 요리사</h1>
<p>1) 4인 1팀으로 구성하고 2인 1조가 출발선 뒤에서 옆으로 마주보고 선다. 2) 한 명은 공을 던지고 한 명은 언더핸드로 받으며 사이드 스텝으로 반환점까지 이동한다. 3) 반환점에 있는 볼통(바구니)에 공을 넣는다. 4) 출발선으로 사이드 스텝으로 돌아와 대기하던 다음 2인 조와 교대한다. 5) 4명 모두 먼저 완료하고 들어온 팀이 승리한다.</p>
