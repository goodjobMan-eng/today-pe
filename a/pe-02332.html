<h1>만보기 차고 하루 1000번 움직이기 실내 맨손운동</h1>
<p>1) 만보기를 팔에 차거나 손에 쥐고 숫자를 0으로 맞춘다. 2) 양팔 앞뒤로 흔들기 20회, 손과 다리를 반대로 움직이며 제자리 걷기 20회를 실시한다. 3) 양팔을 앞으로 뻗어 몸쪽으로 당기기 20회, 위로 뻗어 아래로 당기기 20회, 어깨 돌리기(뒤/앞 각 20회)를 한다. 4) 바닥에 누워 대각선 손발 맞닿기 20회 및 윗몸일으키기 응용 동작 20회를 하여 만보기 카운트를 올린다.</p>
