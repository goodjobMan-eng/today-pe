<h1>포스트잇 활용 3단계 순발력 기르기 운동</h1>
<p>1) 포스트잇 6장을 두 걸음 간격으로 바닥에 일정한 간격으로 붙인다. 2) 앞으로 이동할 때는 큰 걸음으로 포스트잇 2장을 전진하고 뒤로 갈 때는 잔발로 1장 후진하는 방식으로 이동한다. 3) 팔을 최대한 쳐주며 1세트부터 5세트까지 점차 속도를 올려 진행한다. 4) 세트 사이에 10초씩 휴식을 취하며 총 5세트를 완료한다.</p>
