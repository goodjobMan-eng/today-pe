<h1>조작 기술(Manipulative Skills)</h1>
<p>1) 학급을 두 모둠으로 나눕니다. 2) 모둠은 5m 거리를 두고 마주 봅니다. 3) 교사가 제시하는 이동 동작(걷기, 뛰기 등)을 하며 공을 주고받습니다. 4) 음악이 멈추면 공을 들고 있는 학생은 탈락합니다. 5) 5분 후 탈락하지 않은 학생이 많은 모둠이 승리합니다.</p>
