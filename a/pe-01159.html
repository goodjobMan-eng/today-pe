<h1>러블리즈 아츄 음악 줄밴드 안무 발표</h1>
<p>1) 4인 1모둠으로 두 명은 발목에 고무줄 밴드를 걸고 양끝에서 벌려 서며, 두 명은 중앙에서 점프 주자가 된다. 2) 러블리즈의 '아츄' 음악 박자에 맞추어 밴드 안팎을 번갈아 밟고 뛰는 기본 스텝과 방향 전환 스텝을 수행한다. 3) 모둠원이 합을 맞추어 정해진 안무 구간을 실수 없이 완벽하게 소화하면 성공 점수를 얻는다. 4) 익숙해지면 주자와 밴드 고정 역할을 교대하거나 밴드 높이를 무릎 높이로 올려 난도를 높인다.</p>
