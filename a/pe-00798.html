<h1>겨울 양자택일 브레인 브레이크 운동</h1>
<p>1) 화면에 나타나는 두 가지 겨울 관련 보기 중 선호하는 것을 선택합니다. 2) 자신이 선택한 방향(좌측 또는 우측)으로 이동하여 준비 자세를 취합니다. 3) 화면이 바뀌면 나타나는 캐릭터의 운동 동작이나 스트레칭을 시간 동안 따라 합니다. 4) 중간 스키 레이스 응원이나 날아오는 눈싸움 눈덩이를 앉거나 숙여 피하는 미니 게임을 함께 즐깁니다.</p>
