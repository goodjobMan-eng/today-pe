<h1>주먹야구 두 모둠 간이 게임</h1>
<p>1) 수비는 1~3루와 홈에 배치되고 공격수는 주먹으로 공을 친 뒤 베이스 바깥쪽으로 주루한다. 2) 공을 잡은 수비수는 즉시 가장 가까운 베이스로 이동하고 다른 수비수도 각 베이스로 흩어진다. 3) 공을 잡은 베이스부터 시계 반대 방향 순서로 모든 베이스에 차례대로 공을 송구해 홈 또는 1루까지 보낸다. 4) 수비 송구가 완료되는 순간까지 공격 주자가 통과한 바퀴 수 및 베이스 수만큼 점수를 계산한다.</p>
