<h1>제자리 팀 풍선 띄우기</h1>
<p>1) 의자에 앉아서 하거나 서서 참여할 자리를 정합니다. 2) 자리에 앉은 사람은 의자에서 일어나면 안 되고, 서서 하는 사람은 두 발 중 하나라도 떼면 탈락합니다. 3) 팀원이 번갈아 가며 풍선을 바닥에 떨어뜨리지 않고 계속 띄웁니다. 4) 정해진 시간 동안 끝까지 풍선을 살려 더 오래 유지한 팀이 승리합니다.</p>
