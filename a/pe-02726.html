<h1>가정형 관절 및 코어 트레이닝 4종 운동</h1>
<p>1) 상체를 세우고 들어 올린 다리를 직각으로 만들어 무릎을 바깥으로 돌린다. 2) 엎드린 자세에서 복부에 힘을 주고 무릎을 바닥에서 띄워 손과 발로 중심을 잡는 에어 리프팅을 한다. 3) 복부를 바닥에 대고 엎드려 허리에 힘을 준 뒤 팔다리를 쭉 펴서 들어 올리는 백 익스텐션을 한다. 4) 양팔을 뻗었다가 가운데로 모아 몸을 터치하는 동작을 실시한다.</p>
