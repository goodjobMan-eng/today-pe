<h1>두 불 사이에서 (피구형 게임)</h1>
<p>1) 바닥에 직사각형 구역을 그리고 가운데 선을 나눠 두 팀으로 나뉜다. 2) 상대 코트의 선수를 공으로 맞히면 맞은 선수는 상대 구역의 바깥쪽(외야)으로 이동한다. 3) 공을 잡거나 피하면서 상대편 모든 선수를 아웃시키면 게임이 끝난다.</p>
