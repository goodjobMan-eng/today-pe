<h1>콩주머니 컬링</h1>
<p>1) 라바콘을 중심으로 동심원 점수 구역을 바닥에 그린다. 2) 팀을 나누고 일정한 거리에서 콩주머니나 솜털공을 목표 지점을 향해 차례로 던진다. 3) 가장 안쪽 원부터 순서대로 3점, 2점, 1점을 받고 콘에 닿으면 보너스 5점을 얻는다. 4) 모든 공을 던진 후 점수를 합산하여 더 높은 점수를 얻은 팀이 승리한다.</p>
