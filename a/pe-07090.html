<h1>보물찾기</h1>
<p>1) 경기 구역 전체에 라바콘을 골고루 배치하고 그중 일부 콘 밑에 테니스공을 숨긴다. 2) 각 팀 선수가 한 명씩 차례로 달려 나와 콘 하나를 들어 올려 보물이 있는지 확인한다. 3) 공이 없으면 콘을 다시 덮고 돌아가 다음 주자와 터치하고, 공을 찾으면 공을 획득하고 콘을 덮은 뒤 팀으로 돌아온다.</p>
