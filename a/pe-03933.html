<h1>디펜더 핀 지키기 게임</h1>
<p>1) 훌라후프 안에 볼링 핀을 세우고, 디펜더는 훌라후프 바깥에서 핀을 방어한다. 2) 주변의 둘러싼 사람들은 선 뒤의 원마커에 한 발을 딛고 공을 쳐내거나 굴려 핀을 쓰러뜨리려 시도한다. 3) 핀이 쓰러지면 핀을 쓰러뜨린 사람이 훌라후프로 들어가 핀을 다시 세우고 새로운 디펜더가 된다. 4) 기존 디펜더는 공을 주워 핀을 쓰러뜨린 사람의 원마커 위치로 이동하여 역할을 교대한다.</p>
