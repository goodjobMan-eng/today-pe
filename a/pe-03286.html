<h1>바구니에 슛</h1>
<p>1) 모둠별 바구니를 가운데에 모아놓고 바구니에서 3m 거리에 원마커를 놓는다. 2) 개인당 빈백을 3개씩 갖고 원마커 위치에 한 줄로 선다. 3) 신호가 울리면 모둠별로 한 명씩 번갈아가며 손을 아래에서 위로 올리면서 빈백을 던진다. 4) 다른 모둠이 던진 빈백이 우리 모둠의 바구니에 들어가면 우리 모둠의 빈백이 되며, 바구니에 빈백이 가장 많이 들어간 모둠이 승리한다.</p>
