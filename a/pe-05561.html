<h1>하늘 땅 협력술래</h1>
<p>1) 술래에게 쫓기다가 잡힐 것 같으면 '하늘' 또는 '땅' 자세를 취한다.2) '하늘' 자세를 한 친구는 다른 친구가 위로 넘어가 주면 살아난다.3) '땅' 자세를 한 친구는 다른 친구가 다리 밑으로 기어 통과해 주면 살아난다.4) 교사가 그만을 외쳤을 때 술래에게 잡히지 않고 살아있는 친구의 수를 확인한다.</p>
