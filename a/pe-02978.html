<h1>신나는 음악과 함께하는 스텝박스 유산소 운동</h1>
<p>1) 스텝박스 뒤에 서서 음악 리듬에 맞춰 한 발씩 올라갔다 내려오는 베이직 스텝을 실시한다. 2) 스텝박스에 한 발을 딛고 반대쪽 무릎을 가슴 높이까지 세 번 연속으로 끌어올리는 쓰리니업 동작을 연결한다. 3) 박스 위에 발을 올린 뒤 옆으로 가볍게 발끝을 찍어주는 탭 스텝을 수행한다. 4) 양발을 넓게 벌려 박스 위에 올렸다가 내리는 브이스텝과 발을 빠르게 교차하는 차차차 스텝을 리듬에 맞춰 반복한다.</p>
