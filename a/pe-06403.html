<h1>나 홀로 집에 뉴욕 달리기 브레인 브레이크</h1>
<p>1) 화면 속 지시에 따라 뉴욕 거리를 제자리에서 달리며 점프하고 숙여 장애물을 피한다.2) 비둘기 아주머니를 조심스럽게 지나가며 날아오는 눈덩이를 피한다.3) 벽돌을 모아 던져 유리창을 깨고, 정지 동작을 유지하며 틀린 그림 찾기 미션을 수행한다.4) 센트럴 파크를 통과하며 새 모이 자루를 격파하고 도둑들을 경찰에게 유인한다.</p>
