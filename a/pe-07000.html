<h1>유치·저학년 장애물 달리기 코스</h1>
<p>1) 훌라후프 터널을 기어서 통과한 뒤 앞사람이 출발 신호에 도달하면 다음 사람이 출발한다. 2) 바닥의 점(도트 마커)을 따라 한 발 또는 두 발로 깡충깡충 뛴 후 낮은 바를 기어서 통과한다. 3) 매트 경사로(매직 마운틴)를 기어 올라간 뒤 천천히 내려온다. 4) 평균대 다리를 천천히 건넌 후 훌라후프 숲 코스에서 후프 사이를 점프하여 통과한다. 5) 출구를 통과해 마지막 평균대를 천천히 건너 출발점으로 돌아온다.</p>
