<h1>4면 몸풀기 (콘 사이 구간 이동 운동)</h1>
<p>1) 마당이나 체육관 네 모서리에 콘 4개를 설치해 사각형 구역을 만든다. 2) 각 모서리 변(side)마다 수행할 기본 움직임 동작을 지정한다. 3) 학생들은 콘 사이 구간을 돌며 트로팅(조깅), 게걸음 걷기, 갤럽, 점프 등 지정된 동작을 순서대로 수행한다.</p>
