<h1>봉 쓰러뜨리지 않기 게임</h1>
<p>1) 3명이 한 팀이 되어 봉을 들고 삼각형을 만든다. 2) 3명이 동시에 손을 놓고 다음 봉으로 이동하여 쓰러지기 전에 봉을 잡는다. 3) 봉이 1개라도 쓰러지면 실격이다. 4) 더 긴 거리를 이동한 팀이 승리한다.</p>
