<h1>섬 술래잡기</h1>
<p>1) 경기장 바닥에 매트 여러 장을 적절한 간격으로 배치하여 섬을 만든 뒤 1~2명의 술래를 정한다. 2) 모든 참가자는 바닥에 떨어지지 않고 매트 위에서만 이동하며 매트 사이를 뛰어넘어 다닌다. 3) 술래에게 태그당한 사람은 별도로 마련된 점프 스테이션(미니 파쿠르)을 통과한 뒤 다시 합류하거나, 술래 표식(팀조끼/띠)을 넘겨받아 새로운 술래가 된다.</p>
