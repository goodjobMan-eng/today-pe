<h1>10회 패스 게임 (체너발)</h1>
<p>1) 공을 바닥에 떨어뜨리지 않고 같은 팀원끼리 연속으로 10번 패스한다. 2) 10회 패스에 성공하면 해당 팀이 1점을 얻고 공격권이 상대 팀으로 넘어간다. 3) 상대 팀은 수비를 통해 공을 가로채거나 바닥에 닿게 유도하며, 공이 땅에 닿거나 가로채이면 다시 1부터 숫자를 센다.</p>
