<h1>크로스 더 스트림 (강 건너기 피구 게임)</h1>
<p>1) 체육관 매트 5개를 강 위의 통나무로 배치하고 학생들은 한쪽 끝선에 선다.2) 교사가 부르는 조건(예: 노란 셔츠)에 해당하는 학생이 반대편으로 강을 건넌다.3) 던지는 사람이 굴리거나 던진 공에 맞은 학생은 탈락하여 던지는 사람이 된다.</p>
