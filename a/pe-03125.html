<h1>비석치기</h1>
<p>1) 가위바위보를 하여 진 편은 비석을 세운다. 2) 이긴 편은 3~4m쯤 떨어진 전방에서 출발선을 긋는다. 3) 자신의 비석을 던져 상대의 비석을 맞춰 쓰러뜨린다. 4) 도중에 실패하면 상대편에게 기회가 넘어간다.</p>
