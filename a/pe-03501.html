<h1>코트 구석으로 셔틀콕 보내기</h1>
<p>1) 두 명이 한 모둠을 이루고 두 모둠이 게임을 한다. 2) 라켓을 이용한 다양한 스트로크로 셔틀콕을 상대 모둠 코트로 넘긴다. 3) 셔틀콕이 상대 모둠 바닥에 떨어지거나 상대가 친 셔틀콕이 코트 밖으로 나가면 1점을 얻고, 노란색 구역에 떨어지면 2점을 얻는다. 4) 15점을 먼저 얻은 모둠이 이긴다.</p>
