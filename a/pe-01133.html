<h1>원바운드 띄우고 패스 릴레이</h1>
<p>1) 5~6명의 모둠원이 둥글게 둘러서고 배구공 형태의 공 1개를 준비한다. 2) 첫 주자가 바닥에 공을 원바운드 시킨 뒤 손으로 가볍게 위로 띄워 올린다. 3) 다른 모둠원이 띄워진 공을 노바운드로 잡아서 다음 사람에게 다시 원바운드로 패스한다. 4) 공을 떨어뜨리지 않고 모둠원 전원이 연속 성공할 때까지 목표 횟수(5~10회)를 점차 늘려가며 진행한다.</p>
