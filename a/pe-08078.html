<h1>둥지 속 셔틀콕 (Birdie in the Nest)</h1>
<p>1) 짧은 패들(배드민턴 라켓 대용)로 셔틀콕을 쳐서 바닥의 훌라후프 안으로 넣는다. 2) 셔틀콕이 후프 안에 들어가면 후프를 앞쪽으로 한 번 뒤집어 넘겨 거리를 늘린다. 3) 거리가 멀어지면 오버핸드로 치며 정해진 시간 동안 누가 더 먼 거리까지 후프를 넘기는지 도전한다.</p>
