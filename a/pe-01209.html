<h1>백조의 날개짓 음악 교실 스트레칭</h1>
<p>1) 음악 템포에 맞춰 교실 앞뒤 공간에서 가볍게 제자리걸음을 하며 준비한다. 2) 백조처럼 양팔을 옆으로 넓게 벌려 날개짓하듯 우아하게 흔들며 한쪽 다리를 번갈아 옆과 앞으로 들어 올린다. 3) 당당하게 팔을 흔들며 제자리 걷기를 한 뒤, 양팔로 물살을 가르듯 수영 동작을 하며 상체를 좌우로 비틀어준다. 4) 다리를 벌리고 서서 옆구리를 좌우로 길게 늘린 후 상체를 숙여 발끝을 번갈아 터치하고 런지 자세 인사로 마무리한다.</p>
