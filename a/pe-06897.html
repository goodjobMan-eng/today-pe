<h1>콩주머니 밸런스 릴레이</h1>
<p>1) 2~3개 팀으로 나누어 일렬로 줄을 서서 대기한다 2) 각 줄의 첫 번째 주자는 신체의 지정된 부위(머리, 손등 등)에 콩주머니를 올려 균형을 잡고 반환점을 향해 달린다 3) 이동 중 콩주머니가 떨어지거나 손으로 잡으면 멈춰서 원래 부위에 다시 올린 후 이동하며, 반환점을 돌아온 주자가 팀 뒤에 앉으면 다음 주자가 출발하여 모든 팀원이 먼저 완주한 팀이 승리한다</p>
