<h1>다이아몬드</h1>
<p>1) 다이아몬드 형태로 콘을 배치하고 양쪽 끝에서 공격수 1명과 수비수 1명이 시작한다.2) 수비수는 게임 시작 전 두 걸음 앞으로 나와서 시작한다.3) 공격수는 양 옆 콘에 도착하면 1점, 상대방 쪽 콘에 도착하면 3점을 획득한다.4) 수비수는 공격수를 태그하면 1점을 얻으며 태그되거나 콘에 도착하면 재시작한다.</p>
