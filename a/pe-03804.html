<h1>운동화 뒤집기 도전 (스니커 플립 챌린지)</h1>
<p>1) 운동화 뒤쪽을 잡고 거꾸로 든 상태에서 언더핸드로 위로 던져 바닥에 떨어뜨린다. 2) 운동화 끈이 위를 향해 바르게 착지하면 1점을 얻고, 옆으로 눕거나 뒤집히면 0점이 된다. 3) 던진 후 운동화를 사이에 두고 앞뒤로 왕복 점프(스키 점프)를 한 뒤 다시 던지기를 진행한다. 4) 1분 동안 점수를 계속 누적하여 가장 높은 개인 기록을 목표로 한다.</p>
