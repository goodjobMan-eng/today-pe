<h1>배구 패스와 리시브 단계별 기본기 연습</h1>
<p>1) 혼자서 언더핸드 자세로 공을 올리며 굴신 운동, 한 손 얹기, 직상 언더 리시브를 연습한다. 2) 손가락 삼각대를 유지하며 혼자서 오버핸드 직상 패스와 헤딩 연계 패스를 연습한다. 3) 2인 1조로 바닥에 앉아 패스를 주고받는 연습부터 시작하여 일어서서 평행 패스, 회전 후 패스, 원바운드 롱패스로 확장한다. 4) 콘 사이를 사이드스텝이나 8자로 돌며 찬스볼과 강타를 받아내는 풋워크 연계 리시브를 연습한다.</p>
