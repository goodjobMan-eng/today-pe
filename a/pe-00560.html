<h1>가위바위보 스킵 스텝 놀이</h1>
<p>1) 두 사람이 마주 보고 서서 가위바위보를 합니다. 2) 진 사람은 이긴 사람의 둘레를 달려서 한 바퀴 돕니다. 3) 다음 단계에서는 진 사람이 양발 모아 점프(주먹 점프), 다리 벌려 점프(보 점프), 앞뒤 벌려 점프(가위 점프) 순으로 도는 방법을 바꿉니다. 4) 마지막 단계에서는 앞뒤 발을 리드미컬하게 바꾸는 스킵 동작으로 둘레를 돌며, 가위바위보를 하면서 자연스럽게 스킵의 기본 스텝을 익힙니다.</p>
