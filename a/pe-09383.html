<h1>눈 가리고 줄지어 이동하기</h1>
<p>1) 맨 뒤 사람을 제외한 앞사람들은 눈을 가리고 앞사람의 어깨를 잡고 줄을 섭니다. 2) 어깨를 양쪽 다 누르면 앞으로 이동, 오른쪽 어깨를 누르면 우회전, 왼쪽 어깨를 누르면 좌회전, 등 뒤를 치면 멈춥니다. 3) 맨 뒤 사람이 눈을 뜨고 앞사람들을 조종하여 장애물(콘)을 피해 벽까지 이동합니다.</p>
