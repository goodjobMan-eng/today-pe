<h1>수건 매달리기 물고기 낚시 놀이</h1>
<p>1) 두 사람이 짝을 지어 한 명은 낚시꾼으로서 수건 끝을 양손으로 단단히 잡고 선다. 2) 물고기 역할을 맡은 학생은 바닥에 엎드리거나 앉아 수건의 반대쪽 끝을 두 손으로 꽉 붙잡는다. 3) 낚시꾼이 줄을 당기거나 버티는 동안 물고기는 손을 놓치지 않고 끝까지 매달려 악력과 버티는 힘을 겨룬다. 4) 바닥에 앉아 다리를 들고 매달리기나 눈을 감고 버티기 등 다양한 자세로 변형하여 진행한다.</p>
