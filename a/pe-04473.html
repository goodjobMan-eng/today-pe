<h1>맨몸 어린이 체력 운동 루틴</h1>
<p>1) 한쪽 무릎을 앞으로 굽히고 점프하며 다리를 교차하는 점프 런지를 실시한다. 2) 서 있는 자세에서 손을 바닥에 짚고 앞으로 걸어가 푸시업을 한 뒤 다시 손으로 걸어 돌아와 일어선다. 3) 무릎과 발을 모으고 골반을 비틀며 좌우로 뛰는 슬라럼 점프를 한다. 4) 엎드린 상태에서 양팔, 머리, 발을 동시에 들어 올려 3초간 버틴 후 내려오는 슈퍼맨 동작을 한다.</p>
