<h1>타깃 볼 (발로 하는 거리두기 게임)</h1>
<p>1) 경기 구역 양쪽에 후프를 3개씩 배치하고 각자 공을 준비해 1대 1로 마주 선다.2) 발로 공을 차서 상대편 구역의 후프 안에 공을 멈추게 한다.3) 상대의 슛을 블록하거나 이미 들어가 있는 공을 밀어낼 수 있으나, 후프 안에 완전히 들어간 공은 건드릴 수 없다.4) 2분 종료 시 후프에 더 많은 공을 넣은 사람이 이기며, 3개 후프를 먼저 모두 채우면 즉시 승리한다.</p>
