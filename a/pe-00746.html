<h1>훌라후프 통과 협동 놀이</h1>
<p>1) 모둠원들이 둥글게 원형으로 둘러서서 서로 손을 맞잡습니다. 2) 손을 놓지 않은 상태에서 몸을 유연하게 움직여 훌라후프 사이를 통과합니다. 3) 훌라후프를 옆 사람에게 넘기며 원을 한 바퀴 완전히 회전시킵니다. 4) 동작에 익숙해지면 훌라후프를 2바퀴 돌리거나 역방향으로 전달하는 규칙을 적용해 모둠 간 속도 경쟁을 펼칩니다.</p>
