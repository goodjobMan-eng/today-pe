<h1>기초 이동 운동(로코모션) 7가지</h1>
<p>1) 팔을 흔들며 무릎을 높이 들어 달리기(러닝)를 실시한다. 2) 한 발로 뛰어 같은 발로 착지하며 발을 바꾸는 스키핑과 한 발로만 뛰는 호핑을 양발로 연습한다. 3) 무릎과 발을 모아 양발로 동시에 뛰는 점핑과 앞뒤 다리를 유지하며 나아가는 갤로핑을 연습한다. 4) 무릎을 낮추고 앞을 보며 좌우로 이동하는 사이드스텝과 한 발로 뛰어 반대 발로 착지하는 리핑을 실시한다.</p>
