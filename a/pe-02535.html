<h1>탁구 왕초보 기본 서브 연습</h1>
<p>1) 공을 든 손으로 살짝 던져서 공이 내려올 때 라켓을 약 45도로 맞춘다. 2) 친 공이 자기 쪽 테이블에 먼저 한 번 튀긴 후 네트를 넘어 상대방 테이블 코트에 바운드되도록 넘긴다. 3) 무조건 테이블 밖 뒤에서 서브를 넣어야 하며 테이블 위에서 넣지 않는다. 4) 공을 쳤을 때 네트를 안 넘어가거나 자기 바닥을 안 맞고 넘어가거나 상대 테이블 밖으로 나가면 서브 실패가 된다.</p>
