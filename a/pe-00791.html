<h1>글자 프리즈 댄스 브레인 브레이크</h1>
<p>1) 음악이 나오는 동안 화면을 보며 자유롭게 춤을 추거나 제자리에서 몸을 움직입니다. 2) 음악이 멈추면 화면에 제시된 알파벳 글자를 확인하고, 자신의 온몸을 이용해 해당 알파벳 글자 모양을 만들어 카운트다운 동안 그대로 멈춥니다. 3) 중간에 다른 글자 찾기나 동물 맞히기 미니게임이 나오면 집중해서 정답을 맞힙니다. 4) 동작을 창의적으로 바꾸며 다음 글자가 나올 때까지 반복하여 참여합니다.</p>
