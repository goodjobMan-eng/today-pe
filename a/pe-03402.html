<h1>배팅 티 공 치기 게임</h1>
<p>1) 운동장에 티볼 경기장을 그리고 1·2지역과 1점·2점·3점 선을 긋고 배팅 티를 준비한다. 2) 타자는 2개의 지역 중에서 공을 쳐서 보낼 곳을 큰 소리로 외친 후 공을 친다. 3) 친 공이 떨어진 곳에 따라 1점에서 3점을 얻고, 외친 지역으로 공이 떨어지면 얻은 점수의 2배를 얻는다. 4) 한 명당 3회씩 공을 친 후 총점을 합쳐 점수를 많이 얻은 사람이 이긴다.</p>
