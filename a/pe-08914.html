<h1>점보스택 피구</h1>
<p>1) 공격자는 공을 던져 점보스택을 쓰러뜨립니다. 2) 수비자는 쓰러진 점보스택을 세웁니다. 3) 공격자는 공을 들고 수비팀을 태그합니다. 4) 테그 당해서 아웃되면 자리에 앉습니다. 5) 점보스택을 다 세우고 꼴을 외치면 경기 종료됩니다.</p>
