<h1>실내 발야구 공 주고받기 놀이</h1>
<p>1) 공을 받을 사람은 두려워하지 말고 끝까지 보며 품에 안듯이 잡고, 잡을 때 '마이' 콜을 외친다. 2) 가까운 거리에서는 언더 패스로 떨어뜨리지 않고 정확하게 주고받는다. 3) 거리가 조금 멀어지면 오버 패스로 정확하게 이어준다. 4) 3명 이상 둘러서서 패스할 때는 공을 잡고 3초 안에 무조건 다른 사람에게 패스한다.</p>
