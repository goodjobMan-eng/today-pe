<h1>알파벳 점프</h1>
<p>1) 같은 크기의 종이 26장에 알파벳을 하나씩 적어 원하는 순서대로 배치한다.2) 앞으로 뛰기, 뒤로 뛰기, 옆으로 뛰기 등 다양한 방식으로 뛰며 이동한다.3) 점프할 때마다 밟은 종이에 적힌 알파벳을 소리 내어 말한다.4) 동작에 익숙해지면 종이 사이의 거리를 넓혀 난이도를 높인다.</p>
