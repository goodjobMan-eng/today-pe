<h1>줄넘기 기본 기술 및 응용 동작</h1>
<p>1) 줄넘기 가운데를 두 발로 밟고 손잡이가 겨드랑이에 오도록 줄 길이를 맞춘다. 2) 줄이 한 번 회전할 때마다 한 번 점프하는 싱글 점프를 연습한다. 3) 줄 1회전에 점프와 바운스를 섞는 더블 점프, 한 발을 앞뒤로 두는 이지 로커, 제자리 조깅하며 넘는 조거, 1회 점프에 줄을 2번 돌리는 더블 언더를 차례로 익힌다.</p>
