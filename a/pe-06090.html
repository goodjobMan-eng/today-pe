<h1>숫자카드 번호순 찾기</h1>
<p>1) 1번부터 10번까지의 숫자카드를 엎어 놓고 모둠별로 출발선에 선다.2) 신호가 울리면 한 명씩 달려가서 카드를 확인하고 1번 카드를 찾으면 자기 팀으로 가져온다.3) 번호순으로 찾지 못한 카드는 그 자리에 그대로 덮어두고 돌아온다.4) 마지막 10번 카드가 남으면 팀원 전체가 함께 달려 나가 카드를 획득하고 결승선에 들어온다.</p>
