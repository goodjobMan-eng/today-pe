<h1>디펜시브 컨티뉴어스 크리켓</h1>
<p>1) 콘 4개로 만든 사각 구역 안에 스텀프(위켓) 2세트를 10~15m 간격으로 설치하고 타자, 투수, 위켓키퍼, 수비수 2명으로 역할을 나눈다. 2) 투수가 공을 던지면 타자는 방어 타격(블로킹)만 사용하여 위켓을 방어한 뒤 외곽 콘을 돌아 다시 스텀프로 복귀해야 한다. 3) 타자가 외곽 콘을 도는 동안 투수가 던진 공에 스텀프가 맞거나 뜬공이 잡히면 타자는 아웃되며, 각 역할을 순환한다.</p>
