<h1>제자리 대시 반응 달리기 놀이</h1>
<p>1) 교사가 제자리에서 천천히 달리는 동작과 빠르게 대시하는 동작을 보여주면 학생들이 그대로 따라 한다. 2) 학생들이 제자리 대시를 하다가 교사가 가리키는 손짓 신호(오른쪽/왼쪽)에 맞춰 해당 방향으로 즉시 한 발을 내딛는다. 3) 익숙해지면 교사의 지시에 따라 위(점프)와 아래(바닥 터치 후 복귀) 동작을 추가하여 순발력 있게 반응한다.</p>
