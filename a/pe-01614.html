<h1>포트나이트 핏합 타바타 챌린지</h1>
<p>1) 화면 좌측의 포트나이트 댄스와 우측의 피트니스 동작을 확인하고 제자리에 선다. 2) 20초 운동 시간 동안 게임 댄스 또는 사이드 런지·줄넘기 점프 등의 맨몸 운동 중 하나를 선택해 집중해서 따라 한다. 3) 10초 휴식 신호가 나오면 심호흡을 하며 다음 라운드에 도전할 동작을 미리 결정한다. 4) 모둠별로 댄스팀과 운동팀을 나누어 역할을 바꾸어가며 8개 구간을 완주한다.</p>
