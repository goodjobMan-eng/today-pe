<h1>인사이드 아웃 백 투 스쿨 런</h1>
<p>1) 기쁨이가 본부로 돌아갈 방향(두 갈래 길) 중 하나를 자세를 취해 선택한다. 2) 길을 달리며 점프, 숙이기, 피하기, 펀치 동작으로 장애물을 피한다. 3) 불안 토네이도가 다가오면 화면에 맞춰 동작을 멈추고 프리즈(얼음) 상태를 유지한다. 4) 기억 구슬 눈사태에 막히면 파우치를 불러 다이너마이트를 골라 길을 뚫는다.</p>
