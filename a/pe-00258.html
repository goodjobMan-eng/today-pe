<h1>성장기 학생을 위한 키커지는 놀밥홈트 5강 (심폐지구력 편)</h1>
<p>1) 성장기 학생들의 심폐지구력과 신체 발달을 돕는 홈트레이닝으로, 음악 비트에 맞추어 제자리에서 가볍게 뛰며 워밍업을 시작합니다. 2) 점핑잭, 암워킹, 하이니 등 전신 유산소 운동 동작을 순서대로 수행합니다. 3) 교사의 시범과 카운트에 맞추어 정해진 세트 동안 쉬지 않고 동작을 지속합니다. 4) 마무리 스트레칭으로 호흡을 가다듬고 전신 근육을 이완하며 마칩니다.</p>
