<h1>원 안의 공 쳐내기 놀이 (스트라이킹)</h1>
<p>1) 원 안에 양 팀 선수의 서로 다른 색깔 공들을 동수로 배치한다.2) 가위바위보나 동전 던지기로 선공을 정한 뒤 여분의 공으로 자신의 색깔 공을 강하게 맞힌다.3) 공이 원 밖으로 나가면 계속해서 칠 기회를 얻고, 나가지 않으면 공격권이 상대방에게 넘어간다.4) 자신의 색깔 공을 먼저 모두 원 밖으로 쳐내어 떨어뜨리는 선수가 승리한다.</p>
