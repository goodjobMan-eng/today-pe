<h1>뒤집기 리버시(오셀로) 대항전</h1>
<p>1) 경기장 바닥에 양면 색이 다른 원마커(디스크)를 무작위로 깔아 둡니다. 2) 두 팀으로 나누어 각 팀의 대표 색(예: 파란색 팀, 빨간색 팀)을 정합니다. 3) 시작 신호와 함께 정해진 시간 동안 상대 팀 색의 마커를 자기 팀 색이 위로 오도록 뒤집습니다. 4) 제한 시간이 끝났을 때 자기 팀 색으로 뒤집힌 원마커가 더 많은 팀이 승리합니다.</p>
