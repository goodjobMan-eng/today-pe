<h1>탁구공 종이컵 쳐내기</h1>
<p>1) 경기장(책상) 위에 놓인 종이컵을 향해 손가락으로 탁구공을 쳐서 책상 아래로 떨어뜨린다. 2) 떨어진 종이컵을 수거해 가운데 놓고 계속 치며 1분 동안 더 많은 종이컵을 떨어뜨린다. 3) 대결 시에는 탁구공이 바닥에 떨어지면 공격권이 상대방으로 넘어가며 모은 컵을 높이 쌓아 더 많이 모은 쪽이 승리한다.</p>
