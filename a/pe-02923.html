<h1>플라잉디스크 통과의 신</h1>
<p>1) 디스크를 날릴 위치를 정하고 가운데에 상자 등을 이용해 통과용 장애물을 설치한다. 2) 한 사람이 디스크를 10번 던져 장애물을 통과시킨다. 3) 걸리지 않고 깨끗하게 통과하면 10점, 장애물에 한 번 부딪히고 통과하면 5점을 획득한다(최대 100점). 4) 10번을 던진 후 반대편 참가자와 교대하여 점수를 겨룬다.</p>
