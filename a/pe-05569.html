<h1>머리 위 휴지 밸런스 챌린지</h1>
<p>1) 두루마리 휴지를 머리 위에 똑바로 올려놓고 중심을 잡습니다.2) 머리에서 휴지가 떨어지지 않도록 천천히 바닥에 엉덩이를 대고 앉습니다.3) 뒤로 상체를 약 45도 정도만 눕혔다가 다시 중심을 잡고 앉는 자세로 돌아옵니다.4) 머리에 충격이 가지 않도록 천천히 중심을 유지하며 다시 일어섭니다.5) 난이도를 높일 때는 양손에 휴지를 하나씩 올려놓고 손으로 바닥을 짚지 않은 채 도전합니다.</p>
