<h1>뇌를 깨우는 3분 교실체조</h1>
<p>1) 박수를 세 번 친 후 어깨를 앞뒤로 8박자씩 돌린다.2) 목을 좌우로 8박자씩 돌린다.3) 손을 뒤집어 깍지 낀 채 팔을 비틀며 고개를 뒤로 5초간 젖힌다.4) 팔을 두드리며 어깨까지 올라갔다가 손을 뒤집어 내려온다.5) 팔을 교차해 가슴 쪽으로 당기며 고개를 반대로 돌려 5초간 스트레칭한다.</p>
