<h1>저학년 교구 활용 풍선 타격 4스테이션 — 원마커 외발 고정 25회 챌린지</h1>
<p>1~2학년 학생들이 4가지 타격 교구(롤리팝 패들 라켓, 볼링핀, 플라잉디스크, 펀스틱) 스테이션을 돌며 풍선을 바닥에 떨어뜨리지 않고 연속 50회 위로 치기에 도전합니다. 이어서 원마커(Poly Spot)에서 한 발을 떼지 않고 25회 연속 타격하기, 마지막으로 짝과 바닥 라인을 사이에 두고 풍선 배구 랠리를 진행합니다.</p>
