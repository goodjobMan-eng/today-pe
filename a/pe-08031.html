<h1>멀리뛰기 기초 강좌 (도움닫기·발구르기·공중동작)</h1>
<p>1) 도움닫기는 시작, 중간, 발구르기 직전의 3단계로 나누어 도움닫기 속도를 높인다. 2) 발구르기 2보 전 폭을 넓혀 몸이 무너지지 않도록 하고 지지발로 힘차게 발을 구른다. 3) 초보자는 공중 동작으로 가장 기본인 모아뛰기(몸 웅크려 뛰기)를 연습한다.</p>
