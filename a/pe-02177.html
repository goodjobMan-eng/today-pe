<h1>슐런 기초 경기</h1>
<p>1) 나무 보드 경기장 시작 지점에 퍽 30개를 준비하고 차례를 정한다. 2) 퍽을 잡고 슬라이딩하듯 밀어 보드 끝에 있는 4개의 점수 구멍(1점, 2점, 3점, 4점)으로 넣는다. 3) 관문을 완전히 통과하지 못하고 걸쳐 있거나 들어가지 못한 퍽(라인 아웃)은 회수하여 총 3쿼터까지 투구한다. 4) 4개 구멍에 퍽이 골고루 1개씩 들어가면 스트라이크로 20점을 얻으며, 최종 합산 점수로 승패를 정한다.</p>
