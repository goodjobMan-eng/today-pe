<h1>커피잔 회전 놀이</h1>
<p>1) 한 사람이 바닥에 다리를 모으고 앉아 양손을 위로 뻗어 만세 자세를 취합니다. 2) 상대방은 뒤에 서서 양팔을 엇갈려 엑스(X)자로 교차한 뒤 상대의 손을 맞잡습니다. 3) 서 있는 사람이 팔을 번갈아 당기며 앉아 있는 사람의 몸을 제자리에서 팽이처럼 빙글빙글 돌려 줍니다. 4) 동작에 익숙해지면 회전 속도를 조금씩 올리고 반대 방향으로도 회전해 봅니다.</p>
