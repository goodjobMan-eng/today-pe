<h1>아이스크림콘 펜싱 게임</h1>
<p>1) 두 명씩 짝을 지어 한 손에는 라바콘 위에 폼볼을 얹은 아이스크림콘을 들고 다른 한 손에는 펀스틱을 쥔다. 2) 신호가 울리면 정해진 구역 안에서 이동하며 자신의 콘 위 공을 보호하는 동시에 상대방의 공을 노린다. 3) 펀스틱으로 상대방의 콘 위에 얹힌 공만 정확히 쳐서 바닥에 먼저 떨어뜨리면 1점을 획득한다. 4) 구역 크기를 줄이거나 2대2 팀 태그 대항전으로 변형하여 박진감을 높일 수 있다.</p>
