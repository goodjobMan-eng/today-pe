<h1>플라잉디스크 던지기 기초 연습</h1>
<p>1) 디스크를 잡을 때 백핸드는 엄지를 올리고 네 손가락으로 아래를 받치며, 포핸드는 엄지와 검지/중지를 넓게 벌려 파지한다. 2) 정면으로 던질 때는 몸을 일자로 두고 허리를 먼저 회전한 뒤 팔과 손목 스냅을 사용해 던진다. 3) 회전 방향과 비행 궤적(외회전, 내회전)을 익히기 위해 20m 내외 거리에서 던지기를 반복 연습한다.</p>
