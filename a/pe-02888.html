<h1>칠판 양궁 대결</h1>
<p>1) 칠판에 분필이나 자석 등으로 과녁을 만든다. 2) 팀을 나누고 던질 순서를 정한다. 3) 정해진 자리에서 휴지에 물을 묻혀 칠판 과녁을 향해 던진다. 4) 칠판에 3초 이상 붙어 있어야 해당 점수를 받으며, 돌아가며 도전해 더 높은 점수를 얻은 팀이 승리한다.</p>
