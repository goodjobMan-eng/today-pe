<h1>흔들흔들 술래잡기 놀이</h1>
<p>1) 술래 한 명을 정한다. 2) 손등에 콩주머니를 올리고 균형을 잡으면서 술래를 피해 다닌다. 3) 콩주머니를 떨어뜨리거나 술래가 몸을 치면 놀이에서 탈락한다. 4) 술래의 콩주머니가 떨어지면 놀이가 끝나고 술래를 다시 뽑으며 마지막까지 남은 사람이 새 놀이의 술래가 된다.</p>
