<h1>낚시 꼬리잡기</h1>
<p>1) 라바콘 4개로 사각형 경기장을 만들고 각자 팀조끼를 바지 뒤에 넣어 꼬리를 만든 후 경기장 안에 들어갑니다. 2) 신호가 시작되면 다른 친구의 꼬리를 뺏어 손에 들고, 엉덩이의 꼬리를 뺏기면 손에 든 꼬리를 바지 뒤에 넣어 계속 경기를 진행합니다. 3) 꼬리가 모두 뺏겨 탈락하면 경기장 밖으로 나가 한 발만 안으로 들여놓고 낚시하듯 안쪽 친구의 꼬리를 뺏어 부활합니다.</p>
