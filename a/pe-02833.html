<h1>뿅망치 수비 축구</h1>
<p>1) 팀별로 수비 술래를 정하고 술래에게 백업 스틱(펀스틱)을 줍니다. 2) 술래는 중앙선을 넘어갈 수 없으며 자기 진영으로 공을 몰고 오는 상대 공격수를 스틱으로 터치해 수비합니다. 3) 술래에게 터치된 공격수는 자기 팀 골대를 터치하고 와야 다시 참여할 수 있습니다. 4) 공격수를 터치한 술래는 가장 가까운 팀원에게 스틱을 넘겨주어 술래 역할을 교대합니다.</p>
