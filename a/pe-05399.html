<h1>후프 탑 게임</h1>
<p>1) 공격 모둠과 수비 모둠으로 나눈다.2) 공격수는 굴러오는 공을 발로 차고 삼각콘을 돌아 공격 홈으로 들어온다.3) 수비수는 공을 잡아 던져서 후프탑을 모두 쓰러뜨린 뒤 공을 들고 수비 홈으로 들어온다.4) 공격수는 수비수가 들어오기 전까지 삼각콘을 돈 횟수만큼 점수를 얻고, 전원 공격 후 공수를 바꾼다.</p>
