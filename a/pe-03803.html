<h1>보틀 플립 홉 챌린지</h1>
<p>1) 바닥에 양말공(출발선)과 10피트 거리에 종이(타깃)를 두고, 가운데에 물이 1/3 채워진 물병을 둔다. 2) 물병 위치에서 한 발로 6회 홉하여 양말공으로 이동한 뒤, 발을 바꿔 6회 홉으로 돌아온다. 3) 돌아온 후 물병 세우기(보틀 플립)를 3회 시도하여 성공할 때마다 1점을 얻는다. 4) 1분 동안 같은 과정을 반복하여 최고 점수를 기록한다.</p>
