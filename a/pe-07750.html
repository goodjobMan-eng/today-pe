<h1>3인 릴레이 장애물 통과 몸풀기 놀이</h1>
<p>1) 출발선과 결승선을 정하고 모둠원들이 간격을 두고 엎드려 자세를 잡는다. 2) 맨 뒤의 주자가 앞 친구들을 차례로 네 발로 기어가며 통과하여 맨 앞으로 이동한다. 3) 모둠 형태에 맞춰 엎드린 친구 배 밑으로 기어가거나 위로 뛰어넘는 변형 동작으로 결승선까지 이동한다.</p>
