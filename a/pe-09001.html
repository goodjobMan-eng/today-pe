<p>1) 오른손과 왼손을 번갈아 가며 무릎 높이에서 공을 드리블한다. 2) 골대에서 멀리 떨어진 위치에서 던지면 3점, 안쪽은 2점, 파울 시 자유투를 던진다. 3) 쪼그려 앉은 상태에서 손가락으로 공을 받쳐 위로 뛴 뒤 그립 기술로 공을 던진다.</p>
