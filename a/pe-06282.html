<h1>동장군을 녹여라</h1>
<p>1) 음악 소리에 맞춰 정해진 구역을 자유롭게 걸어 다닌다.2) 음악이 멈추면 파란색 막대풍선을 든 동장군이 외치고, 학생들은 주제에 맞는 동상 포즈로 멈춘다.3) 빨간색 막대풍선을 든 햇님이 터치하면 동상이 풀려 다시 움직일 수 있고, 동장군에게 다시 터치되면 동상이 된다.</p>
