<h1>후프 풍선 통과 몸 통과</h1>
<p>1) 팀원 중 한 명이 훌라후프를 잡고 서 있는다.2) 나머지 두 명의 팀원이 풍선을 쳐서 훌라후프 안으로 통과시킨다.3) 풍선이 통과한 후 두 팀원도 직접 훌라후프를 몸으로 통과한다.4) 풍선을 계속 바닥에 떨어뜨리지 않고 통과를 반복하여 제한 시간 내 가장 많은 점수를 획득한 팀이 승리한다.</p>
