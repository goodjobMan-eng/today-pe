<h1>죽은 개미 구출 술래잡기</h1>
<p>1) 활동 공간에 학생들을 고르게 흩어지게 하고 술래 몇 명을 지정한다. 2) 술래에게 태그된 학생은 바닥에 누워 양팔과 양다리를 위로 번쩍 들어 '죽은 개미'가 된다. 3) 잡히지 않은 친구 4명이 달려와 양팔과 양다리를 하나씩 잡아주면 부활하여 다시 달린다. 4) 인원이 적은 학급에서는 4명이 모이는 대신 하이파이브 한 번으로 구출하도록 변형한다.</p>
