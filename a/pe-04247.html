<h1>점보 스택스 쟁탈전</h1>
<p>1) 팀별로 점보 스택스 10개와 콩주머니 4개를 배치하고 수호자를 정한다 2) 출발선에서 달려가 상대 팀 스택스에 도착하면 수호자와 가위바위보를 한다 3) 이기면 스택스를 가져와 팀 원마커 위에 올리고, 지면 빈손으로 돌아온다 4) 스택스를 모두 가져가면 콩주머니를 쟁탈하며, 스택스 1개당 1점, 콩주머니 1개당 2점으로 계산한다</p>
