<h1>이색 규칙 피구 3선 (너른 코트 피구·왕 피구·굴리기 피구)</h1>
<p>1) [테마히로 피구] 두 팀으로 나누어 시작한 뒤, 승패 결과나 공격·수비 특성에 따라 내야 코트 면적 비율(예: 3대 1)을 조절하여 경기한다.2) [왕 피구] 팀에서 1명의 왕을 몰래 정해 심판에게만 알리고, 상대 팀의 왕을 먼저 맞히면 승리한다.3) [굴리기 피구] 공을 위로 던지는 것을 금지하고 바닥으로만 굴려 던지며, 무릎 아래에 공이 맞으면 아웃된다.</p>
