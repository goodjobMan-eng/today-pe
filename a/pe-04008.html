<h1>덧셈 볼링 (Addition Bowling)</h1>
<p>1) 팀별로 레인에 볼링 핀 1개를 1번 자리에 세우고 대기 줄 콘 뒤에 선다. 2) 투구자가 스텝, 런지 동작으로 공을 굴려 핀을 쓰러뜨리면 스트라이크로 인정되어 핀 1개를 추가한다. 3) 핀을 모두 쓰러뜨리지 못하면 핀을 추가하지 않고 그대로 다시 세워 다음 주자가 도전한다. 4) 스트라이크를 이어가며 핀을 10개까지 늘려 최종 스트라이크를 달성하면 콘 뒤에 앉아 만세를 부른다.</p>
