<h1>디스코 스튜 댄스 태그</h1>
<p>1) 술래인 디스코 스튜는 양발 아래에 스카프를 대고 미끄러지는 셔플 동작으로만 이동하며 배구 코트 안의 학생들을 태그한다. 2) 술래에게 태그된 학생은 코트 밖 댄스 스테이지로 이동하여 자신만의 특별한 댄스 동작을 수행한다. 3) 다른 학생이 댄스 스테이지로 와서 해당 댄스 동작을 3초간 따라 한 뒤, 두 사람이 하이파이브를 하면 게임에 복귀한다.</p>
