<h1>철봉 밑으로 흔들어 내리기 (운터슈붕) 기초 동작 익히기</h1>
<p>1) 철봉 아래를 통과하며 팔을 곧게 펴고 몸을 아치 형태로 뻗는 기본 동작을 익힌다 2) 철봉을 잡은 양손 간격을 약간 벌리고 작은 도약으로 공간을 통과한다 3) 휘두르는 다리를 앞쪽 대각선 위로 적극적으로 차올리며 통과한다 4) 철봉 높이의 절반 정도 위치에 보조 봉을 대어 목표 높이를 조절하며 연습하고 점차 한 발 도약으로 난도를 높인다</p>
