<h1>쌍권총 가위바위보</h1>
<p>1) 두 사람이 마주 보고 쌍권총 모양으로 두 손을 동시에 내민다.2) 양쪽 손가락 숫자의 합을 먼저 정확하게 말한 사람이 이긴다.3) 오답을 먼저 말한 사람이 패배하며, 진 사람은 점핑잭을 한 뒤 손을 흔들어 짝이 없는 다른 친구를 찾아 이동한다.</p>
