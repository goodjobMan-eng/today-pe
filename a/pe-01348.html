<h1>다람쥐와 도토리 잡기</h1>
<p>1) 2인 1조로 짝을 짓고 한 팀당 폭신 주사위공(폼볼) 1개를 준비하여 자유로운 위치에 선다. 2) 교사의 첫 신호에 맞춰 짝끼리 부드럽게 공을 던지고 받으며 기본 캐치 연습을 한다. 3) 교사가 다시 신호하면 공을 쥔 학생은 다람쥐가 되어 점핑잭 3회를 하고, 도토리(짝)를 걸어서 쫓아가 터치해 역할을 바꾼다. 4) 호루라기 2회가 울리면 다시 멈춰 서서 패스 연습을 진행하며, 이동 방식을 스키핑·갤로핑 등으로 변형한다.</p>
