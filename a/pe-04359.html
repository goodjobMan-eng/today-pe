<h1>엔칸토 런</h1>
<p>1) 미라벨이 갈 두 개의 문 중 자신의 문으로 이어질 것 같은 문 하나를 고른다. 2) 정답 문을 맞히면 1점을 얻는다. 3) 선택한 방을 통과해 달리며 화면에 나타나는 장애물을 숙이기·점프·피하기 등으로 피한다. 4) 등장인물이 나타나 멈추라고 하면 그 자리에서 즉시 동작을 멈춘다.</p>
