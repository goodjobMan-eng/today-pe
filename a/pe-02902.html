<h1>지퍼백 스파이크 놀이</h1>
<p>1) 교실 책상이나 바닥에 종이컵을 올려놓아 목표물을 만든다. 2) 한 손으로 지퍼백을 위로 띄운다. 3) 반대쪽 손으로 지퍼백을 내리쳐 목표물인 종이컵을 향해 스파이크한다. 4) 여러 명이 할 때는 한 사람이 띄워주고 다른 사람이 치거나 받는 방식으로 변형하여 진행한다.</p>
