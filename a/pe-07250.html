<h1>스푼과 풍선</h1>
<p>1) 숟가락과 풍선을 준비하고 바닥에 출발선을 테이프로 표시한다. 2) 참가자는 숟가락으로 풍선을 떨어뜨리지 않고 조종하며 정해진 코스(3개 방)를 통과해 집안을 돈다. 3) 코스를 모두 돌아 먼저 바구니 안에 풍선을 넣은 사람이 해당 라운드에서 승리한다.</p>
