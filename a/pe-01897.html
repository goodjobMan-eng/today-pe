<h1>풀누들 연결 투게더 볼</h1>
<p>1) 벽면에 매트를 세워 골대를 만들고 3명이 풀누들을 양손으로 함께 잡아 한 몸으로 연결된 팀을 만든다. 2) 연결이 끊어지지 않도록 팀원들과 발을 맞추어 움직이며 경기장에 투입된 대형 짐볼을 발이나 몸으로 쳐낸다. 3) 풀누들을 놓치지 않은 상태로 상대편 매트 골대에 짐볼을 명중시켜 득점을 올린다. 4) 2인 1조로 풀누들 하나를 잡고 경기하거나 경기장에 짐볼을 여러 개 넣어 다득점 경기로 변형한다.</p>
