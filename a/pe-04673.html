<h1>축구 해적 게임</h1>
<p>1) 모든 학생은 공을 하나씩 가지고 체육관 안에서 드리블한다. 2) 해적 역할을 맡은 2명의 술래는 공 없이 시작하여 다른 사람의 공을 발로 빼앗으려 한다. 3) 공을 빼앗긴 사람은 새로운 해적이 되어 다른 사람의 공을 빼앗으러 다닌다. 4) 방금 자신의 공을 빼앗아 간 사람의 공을 즉시 다시 빼앗을 수는 없다.</p>
