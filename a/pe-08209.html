<h1>볼 태그 (가로채기 술래잡기)</h1>
<p>1) 코트 3분의 1 구역에서 조끼를 입은 술래 팀과 도망치는 프리 플레이어 팀으로 나눈다. 2) 술래 팀은 공을 든 채 달릴 수 없으며 패스로 공간을 좁혀 공을 손에 쥔 채로 상대를 터치(태그)한다. 3) 공을 던져서 맞힐 수 없으며, 도망치는 팀이 술래의 패스를 가로채면(인터셉트) 아웃된 모든 선수가 부활해 2분간 진행 후 역할을 바꾼다.</p>
