<h1>공 던지고 받기 개인 도전 과제 6가지</h1>
<p>1) 두 손으로 공을 위로 던지고 한 손(오른손 또는 왼손)으로 공 밑을 받쳐 잡는다. 2) 다리를 이용해 공을 최대한 높이 수직으로 던진 후 두 손으로 잡아낸다. 3) 공을 던지고 박수를 세 번 친 후 잡고, 익숙해지면 한 바퀴 돌아 잡는다. 4) 공을 높이 던진 후 두 손으로 바닥을 터치하고 잡거나, 양손 사이로 번갈아 저글링하듯 던져 받는다.</p>
