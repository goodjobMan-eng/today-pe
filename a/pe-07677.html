<h1>패스 중심 변형 농구 (2대1 오픈 찬스 게임)</h1>
<p>1) 수비 1명과 공격 2명으로 팀을 구성하며 드리블은 금지된다. 2) 공격은 빈 공간(오픈 레인)으로 이동하여 패스를 주고받으며 슛을 시도한다. 3) 슛을 시도한 사람이 다음 수비가 되어 빠르게 역할을 교대한다. 4) 수비 강도는 파일런처럼 자리만 지키는 콜드, 패스 차단이 가능한 웜, 전면 수비인 핫으로 단계별 조절한다.</p>
