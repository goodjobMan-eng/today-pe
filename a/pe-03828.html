<h1>홈 켄터키 사방치기 동전 던지기 챌린지</h1>
<p>1) 출발선에서 2피트, 4피트, 6피트 거리에 책을 1권씩 순서대로 놓아둔다. 2) 출발선 뒤에서 반대발을 내딛으며 언더핸드로 동전을 던져 첫 번째 책 위에 올린다. 3) 동전이 올라가면 외발 뛰기와 양발 벌려 뛰기로 세 번째 책까지 이동 후 돌아오며 중심을 잡고 동전을 줍는다. 4) 1분 안에 3개의 책에 순서대로 동전을 올리고 사방치기 코스를 완료한다.</p>
