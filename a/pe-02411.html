<h1>후프 점프 및 이어달리기</h1>
<p>1) 후프 5개를 일렬로 놓고 10m 앞에 콘을 설치한다. 2) 1단계 양발 모아 뛰기, 2단계 한 발 점프, 3단계 옆으로 뛰기, 4단계 양발 가위 점프로 후프를 통과한 뒤 콘을 돌아온다. 3) 후프 이어달리기는 팀원들이 후프 위에 한 명씩 서서 맨 끝 주자부터 후프를 들고 앞으로 이동해 내려놓는다. 4) 후프를 들고 이동하는 친구가 후프를 내려놓으면 다음 친구가 출발하여 반환점을 돌아온다.</p>
