<h1>해골 프리즈 댄스 앤 강아지 달리기</h1>
<p>1) 노래 지시에 따라 위아래 점프, 제자리 회전, 손 흔들기, 바닥 터치, 좌우 점프, 한 발 버티기, 박수 치기를 수행한다. 2) 'Freeze' 신호가 나오면 제시된 뼈 포즈를 취하고 정지 상태를 유지한다. 3) 몬스터 강아지 레이스에서 원하는 강아지를 골라 해당 포즈를 취한다. 4) 레이스가 시작되면 제자리 달리기를 빠르게 하여 선택한 강아지를 응원한다.</p>
