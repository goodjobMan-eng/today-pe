<h1>킹핀 게임</h1>
<p>1) 상대 진영의 볼링핀을 공으로 던져서 쓰러뜨린다. 2) 상대 진영에서 깃발이 뽑히면 매트(감옥)로 이동한다. 3) 공을 던져 아군을 구하거나 상대 골대에 슛을 넣으면 감옥에서 탈출한다.</p>
