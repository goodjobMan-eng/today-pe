<h1>세 번째에 넘겨라' 풍선 배구</h1>
<p>1) 교실 중앙에 고무줄 등으로 네트를 설치하고 양 팀으로 나뉘어 앉습니다. 2) 풍선을 서브한 뒤 반드시 자기 팀 내에서 두 번 패스하고 세 번째에만 상대 코트로 넘겨야 합니다. 3) 한 번이나 두 번째에 바로 넘기면 상대 팀 득점으로 인정됩니다. 4) 바닥에 풍선이 떨어지거나 네트에 걸리면 실점합니다.</p>
