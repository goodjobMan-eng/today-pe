<h1>매트에 가면 게임하기</h1>
<p>1) 4명에서 6명의 친구들과 모둠을 만들고 순서를 정합니다. 2) 첫 번째 사람은 앞에서 익힌 기초 동작 중에서 자신이 하고 싶은 동작을 합니다. 3) 두 번째 사람은 앞의 친구가 했던 동작을 따라 한 다음 자신이 하고 싶은 동작을 합니다. 4) 같은 방법으로 다음 사람은 앞의 친구들이 했던 동작을 차례로 따라 한 다음 자신이 하고 싶은 동작을 추가하며, 동작을 틀리지 않고 끝까지 남은 사람에게 박수를 보냅니다.</p>
