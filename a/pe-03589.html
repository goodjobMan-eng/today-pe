<h1>킥런볼 발야구</h1>
<p>1) 수비팀은 모여있지 않고 넓게 사이사이에 서서 무릎을 구부려 자세를 낮춰 잡을 준비를 한다. 2) 공격팀은 킥을 한 후 차례대로 베이스 4개를 밟고 홈에 들어온다. 3) 수비팀은 땅볼일 때 줄 서서 다리 사이로 공을 넘기고, 첫 번째 공을 잡은 친구(1번)는 홈을 지키러 오고 9번째로 공을 잡은 선수가 홈으로 던진다. 4) 공격팀의 발이 빠른지 수비팀의 공이 빠른지 겨뤄 득점 여부를 결정한다.</p>
