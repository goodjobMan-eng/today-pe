<h1>신과함께(핸드볼형 게임)</h1>
<p>1) A팀 B팀으로 나누어 영역에 자리한다. 2) 가위바위보로 시작 순서를 정한 후 골키퍼부터 시작한다. 3) 골키퍼 -&gt; 다음 영역 -&gt; 다음 영역 -&gt; 다음 영역 -&gt; 골대 슛 또는 우리팀-&gt;신-&gt;우리팀으로 공을 던진다. 4) 공은 치거나 잡아서 우리팀 공격권으로 가져올 수 있다.</p>
