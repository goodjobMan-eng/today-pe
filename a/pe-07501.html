<h1>감염자 놀이</h1>
<p>1) 두 명의 좀비가 공을 들고 패스하며 인간을 쫓아간다. 2) 좀비는 공을 던지지 않고 손에 쥔 채로 인간을 터치하며, 공을 들고 이동할 수 없다. 3) 터치된 인간은 좀비가 되어 함께 패스하며, 마지막까지 터치되지 않고 남은 인간이 승리한다.</p>
