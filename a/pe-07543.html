<h1>바이히보덴볼(소프트 매트 볼 게임)</h1>
<p>1) 경기장 안쪽에 소프트 매트(Weichboden) 2개를 배치하고 두 팀으로 나눈다. 2) 드리블 없이 패스를 주고받으며 상대 진영 매트로 이동한다. 3) 동료가 던진 공이 바닥에 한 번 이상 튄 후 매트 위에 있는 팀원이 공을 잡으면 득점한다.</p>
