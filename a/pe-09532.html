<h1>표적 맞추기</h1>
<p>1) 공을 가진 술래는 '하나'라고 외치며, 다른 친구에게 패스합니다. 2) 패스를 받은 친구는 다시 '둘'을 외치며 다른 친구에게 패스합니다. 3) 두 번째 패스를 받은 친구는 '셋'을 외치며 다른 학생을 공으로 맞춥니다. 4) 이때 공을 맞춘 술래는 1점을 얻으며, 반대로 상대 친구가 공을 잡으면 잡은 친구가 1점을 얻습니다.</p>
