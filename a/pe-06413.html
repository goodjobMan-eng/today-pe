<h1>인사이드 아웃 가을 프리즈 댄스</h1>
<p>1) 제자리에서 뛰고 돌며 손을 흔들고 바닥으로 내린다.2) 왼쪽과 오른쪽으로 한 번씩 점프하고 균형을 잡는다.3) 손뼉을 한 번 친 뒤 두 번 치고 동작을 멈추며 멈춤(freeze) 자세를 취한다.4) 나뭇잎 레이스에서 원하는 잎을 고르고 제자리 달리기를 하여 에너지를 채운다.</p>
