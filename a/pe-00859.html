<h1>미니언즈 요가 프리즈 댄스</h1>
<p>1) 음악이 나오는 동안 신나게 춤을 추며 자유롭게 움직입니다. 2) 제시되는 춤을 따라 하거나 자신만의 창의적인 춤 동작을 만들어 춥니다. 3) 음악이 멈추면 즉시 동작을 멈추고 화면 속 미니언의 요가 자세대로 얼음처럼 멈춥니다. 4) 중간에 등장하는 미니 게임을 통해 다양한 미니언 캐릭터를 확인하며 활동을 이어갑니다.</p>
