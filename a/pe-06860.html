<h1>점수 차등 구역 배구</h1>
<p>1) 경기장 코트를 테이프를 이용해 동일한 3~6개 구역으로 나누고 구역별로 차등 점수를 부여한다. 2) 일반 배구 규칙으로 경기를 진행하다가 한 팀이 15점에 도달하면 뒤진 팀에게 구역 배구 점수 시스템이 시작된다. 3) 뒤진 팀이 동점을 만들거나 역전하면 양 팀 모두에게 구역별 득점 시스템이 동일하게 적용된다.</p>
