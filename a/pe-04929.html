<h1>교차뜨기(엑스자 줄넘기) 기초 연습</h1>
<p>1) 양손을 허리 높이에 두고 팔 대신 손목을 돌려 줄을 넘긴다.2) 줄을 넘길 때 양 팔꿈치가 겹칠 정도로 깊게 팔을 교차한다.3) 교차 폭을 넓게 유지하며 일정한 리듬에 맞춰 뛴다.4) 회전하는 줄을 뒷발에 걸어 멈추며 자세를 완성한다.</p>
