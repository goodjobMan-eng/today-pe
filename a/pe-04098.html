<h1>컵스택 릴레이 달리기</h1>
<p>1) 모둠별로 일렬로 서서 출발 대기하며 전방에 6개(또는 10개) 스태킹 컵을 세워둔다. 2) 첫 주자가 달려가 컵 뒤편에 서서 컵을 아래로 모은(다운스택) 뒤 다시 피라미드 모양으로 쌓는다(업스택). 3) 컵 정리를 마친 주자는 출발선으로 전력 질주하여 대기 중인 다음 주자의 손을 터치한다. 4) 모든 팀원이 주행을 마치고 전원 바닥에 앉아 박수를 치는 팀이 최종 승리한다.</p>
