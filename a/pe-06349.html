<h1>이스케이프 인투 서머</h1>
<p>1) 화면에 열기구가 나오면 숙이고 수박은 베고 아이스크림은 피하며 숯불은 점프해 넘는다.2) 그릴이 나오면 정해진 운동을 완료해 버거를 뒤집는다.3) 해변에서는 갈매기를 피해 숙이고 파도를 피하며 서핑보드를 뛰어넘는다.4) 보너스 배구에서는 보라색 공은 언더핸드, 노란색 공은 토스, 빨간색 공은 점프 스파이크를 한다.</p>
