<h1>의자 맨손 체조</h1>
<p>1) 의자에 바른 자세로 앉아 가슴을 펴고 준비한다. 2) 양손을 깍지 끼고 머리 위로 기지개를 켜며 상체를 늘려준다. 3) 목, 어깨, 팔, 옆구리를 차례대로 스트레칭하고 허리와 등 근육을 이완한다. 4) 다리를 앞으로 뻗어 발목을 젖히고 발뒤꿈치를 밀어주며 하체 근육을 풀어준다.</p>
