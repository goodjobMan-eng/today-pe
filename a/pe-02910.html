<h1>탁구공 바닥 튀겨 컵 빙고 대결</h1>
<p>1) 교실 바닥에 스피드스택스 컵으로 3X3 빙고판을 만듭니다. 2) 팀을 나눈 후 바닥에 튀겨서 컵에 넣는 연습을 합니다. 3) 팀 내에서 정한 순서대로 돌아가며 바닥에 1번 튀겨 컵에 넣습니다. 4) 컵에 들어갔다가 탁구공이 나오면 무효이며, 돌아가며 도전해서 먼저 한 줄 빙고를 만들면 승리합니다.</p>
