<h1>종이접시 플디 타깃 맞히기</h1>
<p>1) 종이접시 테두리를 다듬어 꾸민 뒤 벽면 과녁이나 훌라후프 표적을 설치하고 2~3m 거리에 출발선을 표시한다. 2) 손가락으로 종이접시 밑면을 감싸 쥐고 몸과 발을 목표 방향으로 나란히 정렬하여 준비한다. 3) 벽에 붙은 과녁의 중심 점수판이나 훌라후프 링을 통과하도록 손목 스냅으로 종이접시를 날려 성공 횟수와 점수를 기록한다. 4) 표적의 거리를 점점 넓히거나 과녁 크기를 줄여 난이도를 높이는 개인별 도전 과제로 변형한다.</p>
