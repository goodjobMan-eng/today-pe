<h1>기초 매트 구르기 (연필·통나무·곰 구르기)</h1>
<p>1) 연필 구르기: 등을 대고 누워 팔다리를 허리 높이 위로 든 U자 형태를 유지하며 앞뒤로 구른다.2) 통나무 구르기: 팔다리를 바닥과 수직으로 한 테이블 자세에서 좌우로 몸을 회전하며 구른다.3) 곰 구르기: 다리를 90도로 벌리고 앉아 한쪽 어깨와 등을 거쳐 반대편으로 구른 뒤 다시 앉는다.4) 균형 동작 2개, 점프 2개, 구르기 2개를 연결하여 연속 발표 동작을 완성한다.</p>
