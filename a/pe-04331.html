<h1>디스코 술래잡기</h1>
<p>1) 8개의 댄스 스테이지를 강당 곳곳에 설치한다. 2) 술래 2명이 펀스틱을 들고 다니며 다른 학생들을 터치한다. 3) 터치당한 학생은 댄스 스테이지로 이동해 춤을 춘다. 4) 다른 학생이 다가와 같은 춤을 추면 댄스 스테이지에서 나와 게임에 복귀한다.</p>
