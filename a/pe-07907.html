<h1>인디애나 존스 로프 탈출 놀이</h1>
<p>1) 매트로 표시된 계곡을 로프를 타고 건너 안전 구역인 후프 안으로 착지한다. 2) 귀중한 보물(메디신볼)을 던지지 않고 들고 함께 계곡을 건넌다. 3) 모든 학생이 후프 안에 들어가고 보물이 안전하게 이동하면 미션을 완수한다.</p>
