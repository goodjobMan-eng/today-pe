<h1>1대1 배틀 트위스터 게임</h1>
<p>1) 바닥에 색깔 원마커(또는 색종이)를 배치하고 두 참가자가 마주 서서 준비한다.2) 진행자가 호명하는 손이나 발(예: 왼발 빨강, 오른손 노랑)을 해당 색깔 원마커 위에 짚는다.3) 신체 균형을 유지하며 버티다가 손과 발 외의 몸 부위나 균형을 잃고 바닥에 먼저 닿으면 패배한다.</p>
