<h1>팝콘 농구 슈팅 게임</h1>
<p>1) 체육관 중앙에 매트를 사각형으로 세워 골대 타깃을 만들고 주변에 원마커를 흩어 놓습니다. 2) 매트 타깃 안에는 공을 밖으로 튕겨 내 주는 학생 1명이 들어갑니다. 3) 나머지 학생들은 원마커 위치에서 폼볼을 주워 세워진 매트 안으로 농구 슛을 던집니다. 4) 골인된 공은 안의 학생이 팝콘처럼 사방으로 던져 내보내고, 학생들은 여러 마커를 옮겨 다니며 공을 주워 올바른 폼으로 슈팅 연습을 이어 갑니다.</p>
