<h1>종합 릴레이 (장애물 이어달리기)</h1>
<p>1) 스피드 레더, 돔콘 지그재그 코스, 허들을 순서대로 설치하고 마지막 주자는 팀 조끼를 착용합니다. 2) 신호와 함께 팀 전원이 일렬로 출발하여 세 가지 장애물을 순서대로 통과합니다. 3) 3분 동안 마지막 주자가 돈 바퀴 수로 점수를 측정하며 바퀴당 1점, 반 바퀴 초과는 0.5점을 가산합니다. 4) 출발선 침범, 레더 오착지, 콘이나 허들 접촉 등 규칙 위반 1회당 0.1점의 페널티를 적용합니다.</p>
