<h1>슈퍼히어로 키즈 요가 스트레칭</h1>
<p>1) 지도자의 구호와 시범에 맞춰 슈퍼맨처럼 엎드려 팔다리를 들고 나는 동작을 한다.2) 손을 바닥에 짚고 다리를 뒤로 뻗어 엎드린 뒤 몸을 위아래로 움직인다.3) 자리에 앉아 다리를 벌려 잡고 한쪽 다리를 10초간 늘려주며 좌우 스트레칭을 반복한다.</p>
