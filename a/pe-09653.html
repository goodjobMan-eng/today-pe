<h1>여학생 중심 발야구</h1>
<p>1) 1루수, 2루수, 3루수, 포수, 투수는 여학생이 맡습니다. 2) 루에서 공을 잡지 않고 손으로 쳐도 아웃입니다. 3) 투수는 우리 편 여학생이 공을 굴려줍니다. 4) 파울은 아웃입니다. 5) 뜬 공을 잡아도 아웃이 아닙니다. 6) 멀리 찬 학생은 한 바퀴 이상 뛸 수 있습니다. 7) 한 바퀴 돌고 2루에 멈추면 2루 주자가 됩니다. 8) 두 바퀴는 2점, 세 바퀴는 3점입니다.</p>
