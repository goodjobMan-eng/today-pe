<h1>라이프세이버 태그</h1>
<p>1) 술래는 손에 태그할 도구(콩주머니)를 쥐고, 세이버는 파워업 물체를 손에 든다. 2) 술래에게 태그당한 사람은 그 자리에서 한쪽 무릎을 꿇고 앉는다. 3) 세이버가 무릎 꿇은 사람에게 언더핸드로 파워업을 던져주어 파워업을 받으면 일어난다.</p>
