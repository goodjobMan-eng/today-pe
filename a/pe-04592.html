<h1>패들과 라켓 기본 구조 익히기 및 범프 업 연습</h1>
<p>1) 라켓의 네 부위(손잡이, 헤드, 페이스, 스로트)의 명칭과 잡는 위치를 확인한다. 2) 패들을 한 손으로 꽉 쥐고 놓치지 않도록 올바른 그립을 유지한다. 3) 공이 위에 얹혀 있다고 상상하며 패들을 위로 튕기는 동작(범프 업)을 취하며 앞뒤로 걸어 왕복한다. 4) 파트너와 함께 흰색 라인에 서서 왕복 걷기 연습을 실시한다. 5) 활동 후 라켓을 지정된 파란 선 위에 정리한다.</p>
