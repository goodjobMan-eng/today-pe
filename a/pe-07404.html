<h1>훌라후프 보물 지키기 놀이 (보물 훔치기)</h1>
<p>1) 수비수는 훌라후프 바깥에 서서 후프 안의 보물(스카프)을 지킨다. 2) 공격수들은 수비수를 피해 훌라후프 안의 보물을 손을 뻗어 가져오려 시도한다. 3) 수비수가 보물에 닿기 전에 공격수를 태그하면 공격수는 다른 후프로 이동해야 한다. 4) 공격수가 태그당하지 않고 보물을 가져가는 데 성공하면 수비수와 역할을 교대한다.</p>
