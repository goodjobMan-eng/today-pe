<h1>가가볼 (가가 피구)</h1>
<p>1) 경기장 벽에 한 손가락을 대고 대기하다가 공이 바닥에 세 번 튈 때 '가-가-볼'을 외치고 손을 떼며 시작한다. 2) 손으로 공을 쳐서 상대방의 무릎 아래를 맞혀 아웃시킨다. 3) 공을 연속으로 두 번 터치(더블 탭)할 수 없으며 벽이나 다른 사람의 발에 닿은 후에 다시 칠 수 있다. 4) 넘어져서 무릎 등 신체가 바닥에 닿거나 경기장 벽을 잡거나 공을 쳐서 벽 밖으로 넘기면 아웃된다.</p>
