<h1>농구 기본 드리블 및 체인지</h1>
<p>1) 어깨너비로 발을 벌리고 자세를 낮춘 상태에서 손가락 5개로 강하게 제자리 드리블을 한다.2) 반대 손은 가슴 앞에 올려 상대 수비로부터 공을 보호한다.3) 드리블하며 앞으로 이동한 뒤, V자를 그리며 한 손 드리블 체인지 및 양손 크로스오버를 연습한다.</p>
