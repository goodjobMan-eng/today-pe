<h1>발 가위바위보</h1>
<p>1) 2인 1조가 되어 의자에 앉아 서로 마주 본다. 2) 양발을 바닥에서 띄워 올린 뒤, 발동작으로 가위바위보를 한다(모아 닫으면 주먹, 위아래로 벌리면 가위, 좌우로 벌리면 보). 3) 신호에 맞춰 동시에 발동작을 내어 승패를 겨룬다. 4) 후공이 이기는 규칙이나 후공이 지는 규칙의 늦게 내기 가위바위보로 변형하여 진행한다.</p>
