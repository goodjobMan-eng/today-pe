<h1>평행봉 회전 내리기 연습</h1>
<p>1) 평행봉 앞쪽에 줄 2개를 평행하게 연결하여 앞으로 길게 설치한다. 2) 평행봉 끝부분을 양손으로 지지하고 서서 앞뒤로 반동을 준다. 3) 다리를 흔들어 앞으로 넘어가며 줄 위로 회전하여 안전하게 착지 연습을 한다. 4) 줄에 다리가 닿아도 줄을 놓아주면 되므로 부상 위험 없이 안전하게 동작을 익힌다.</p>
