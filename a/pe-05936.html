<h1>거인과 성</h1>
<p>1) 긴 폼 바 등으로 사각형 성 벽과 문을 만들고 참가자들은 문지기가 되어 벽을 잡고 대기한다.2) 술래인 거인이 해머 교구로 특정 문이나 벽을 공격하러 올 때 문지기들은 벽을 뺏기지 않도록 단단히 잡아야 한다.3) 거인이 다른 쪽으로 공격을 가면 다른 문지기들도 이동하여 해당 벽을 함께 잡으며 지킨다.</p>
