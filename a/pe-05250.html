<h1>체육 보물찾기 (PE 스캐빈저 헌트)</h1>
<p>1) 학생들은 체육 도전 과제가 적힌 활동지를 준비한다.2) 주변 야외나 동네에서 활동지에 적힌 물건(예: 뛰어넘을 수 있는 나뭇가지나 콘 등)을 직접 찾아 나선다.3) 해당 대상을 발견하면 지시된 신체활동(예: 물건 위로 뛰어넘기)을 직접 수행한다.4) 과제를 완수한 후 활동지에 확인 체크(또는 색칠)를 하고 다음 항목을 찾아 이동한다.</p>
