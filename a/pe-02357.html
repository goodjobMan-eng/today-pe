<h1>간이 하키</h1>
<p>1) 6명이 한 모둠을 이루고 두 모둠이 대결하며, 모둠별로 골키퍼 1명을 정합니다. 2) 공격 모둠은 채로 공을 패스하거나 드리블하여 상대 모둠 영역으로 이동합니다. 3) 공격 모둠은 골대 앞 반원에 들어갈 수 없고 반원 밖에서만 슛을 할 수 있으며, 득점하거나 공을 빼앗기면 상대에게 공격권이 넘어갑니다. 4) 정해진 시간 동안 점수를 더 많이 얻은 모둠이 이깁니다.</p>
