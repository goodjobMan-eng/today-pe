<h1>4분 코어 타바타 운동</h1>
<p>1) 20초 운동 후 10초 휴식으로 구성된 8개 인터벌 타바타 타이머를 준비한다. 2) 누워서 반대쪽 손과 발끝을 교차로 터치하는 얼터네이팅 토 탭과 바이시클 크런치를 수행한다. 3) 하이 니 탭과 점프 턱으로 전신 반응을 높인 뒤 토 터치와 크런치를 진행한다. 4) 오블리크 트위스트와 다리와 상체를 띄우는 코어 밸런스 동작으로 4분 운동을 마무리한다.</p>
