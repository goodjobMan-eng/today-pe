<h1>고! 스톱!! 주사위 윷놀이</h1>
<p>1) 주사위 피구공을 굴려 나온 눈(1=도, 2=개, 3=걸, 4=윷, 5=모 등)에 따라 해당 점수를 획득한다.2) 주사위를 던진 후 계속해서 점수를 쌓을지('고') 멈추고 점수를 확정할지('스톱')를 결정한다.3) 주사위를 계속 굴리다가 1(도)이 나오면 모았던 점수가 0점으로 리셋되고 공격권이 상대 팀으로 넘어간다.4) 상대 팀과 번갈아 진행하여 목표 점수(예: 30점)에 먼저 도달하는 팀이 승리한다.</p>
