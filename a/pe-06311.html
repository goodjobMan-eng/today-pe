<h1>집에서 하는 재미있는 풍선 활동(신체 협응 발달)</h1>
<p>1) 손바닥으로 풍선을 위로 띄우며 교사가 부르는 신체 부위(어깨, 팔꿈치, 무릎, 발 등)를 재빨리 풍선에 댄다.2) 벽을 향해 오른손, 왼손, 양손 번갈아 손바닥과 손등으로 풍선을 가볍게 밀어 패스한다.3) 풍선을 손으로 튕기며 이동해 상자 안에 넣거나 무릎 사이에 끼우고 점프한다.</p>
