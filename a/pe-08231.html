<h1>전통 부로인진(Buroinjin) 경기</h1>
<p>1) 콘으로 경기장 구역을 표시하고 두 팀으로 나눈 뒤 공격팀 엔드라인에서 공을 가지고 시작한다. 2) 공격팀은 공을 들고 달려 상대 엔드라인을 넘어가며 득점을 시도한다. 3) 달리는 도중 수비수에게 터치당하면 2걸음 이내에 패스해야 하고, 정지 상태에서 터치당하면 3초 이내에 패스한다. 4) 4번 터치되거나 패스가 가로채이면 공수 교대가 이루어지며 수비수는 3미터 뒤로 물러난다.</p>
