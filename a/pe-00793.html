<h1>요가 프리즈 댄스 챌린지 2편</h1>
<p>1) 신나는 음악이 재생되는 동안 화면 속 캐릭터들의 춤을 따라 하거나 자유롭게 춤을 춥니다. 2) 음악이 멈추면 화면에 안내되는 지정 요가 자세를 즉시 확인합니다. 3) 화면 속 캐릭터와 같은 요가 정지 동작을 취하고 10초간 균형을 잡으며 버팁니다. 4) 제한 시간이 끝나고 다시 음악이 나오면 다음 라운드 댄스를 이어가며, 전신 스트레칭과 평형성 강화를 목표로 끝까지 자세를 유지합니다.</p>
