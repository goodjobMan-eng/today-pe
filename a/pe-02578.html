<h1>유연성 기르기 체조</h1>
<p>1) 매트 위에 앉아 다리를 구부려 양 발바닥을 붙이고 다리를 위아래로 10회 흔든 뒤 상체를 숙여 3회 호흡한다(나비자세). 2) 엎드린 자세에서 한쪽 다리를 접어 손 옆에 두고 상체를 바닥에 밀착시킨 뒤 3회 호흡한다(비둘기자세). 3) 양발을 넓게 벌리고 한쪽 무릎을 굽힌 뒤 양팔을 벌려 3회 호흡한다(전사자세). 4) 양팔을 벌린 상태에서 한 손으로 다리 아래를 짚고 옆구리를 늘려 3회 호흡한다(삼각자세).</p>
