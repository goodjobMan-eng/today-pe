<h1>축구 드리블 및 패스 퀘스트</h1>
<p>1) 도입부에서 가위바위보 진화 게임으로 몸풀기를 진행한다. 2) 훌라후프를 바닥에 펼쳐놓고 지정된 색깔의 훌라후프 안에서 공을 드리블하며 멈춘다. 3) 벽을 향해 패스하고 트랩하는 '사커 패스 퀘스트' 과제를 수행한다. 4) 퀘스트 진행 상황을 화이트보드와 자석에 기록하며 마무리 대화를 나눈다.</p>
