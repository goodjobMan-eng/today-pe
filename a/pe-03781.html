<h1>좀비 술래잡기</h1>
<p>1) 최초의 좀비 역할을 정한다(40명 기준 4명 정도). 2) 좀비는 바닥을 기어 다니며 쫓아가고, 인간 역할의 학생들은 자유롭게 도망친다. 3) 좀비에게 터치당하면 그 자리에서 좀비가 된다. 4) 터치당할 때마다 좀비가 늘어나는 방식으로 진행한다.</p>
