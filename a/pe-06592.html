<h1>족구 팀별거리 컨트롤 챌린지</h1>
<p>1) 4명이 한 팀을 구성하고 코트에 3~6m(1점), 6~9m(2점), 9~12m(4점)의 세 구역을 설정한다. 2) 손으로 족구공을 띄운 뒤 발 안쪽 등으로 차서 목표 구역으로 서브한다. 3) 개인별 2번의 기회로 팀당 총 8번 도전하여 팀 총점이 6점을 넘으면 성공한다.</p>
