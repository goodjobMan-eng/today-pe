<h1>노젓는 달팽이 가위바위보</h1>
<p>1) 교실 바닥에 책을 놓아 4줄의 달팽이 소용돌이 라인을 만들고 두 모둠으로 나눈다. 2) 3인 1조가 되어 바닥에 앉아 뒷사람이 앞사람의 발목을 잡고 엉덩이로 밀며 양쪽 끝에서 동시에 출발한다. 3) 곡선 라인을 따라 이동하다가 상대 조를 마주치면 맨 앞사람끼리 가위바위보를 한다. 4) 이긴 조는 계속 전진하고 진 조는 즉시 출발점으로 돌아가며 대기하던 다음 조가 새로 출발해 상대 진영 끝까지 도달하면 승리한다.</p>
