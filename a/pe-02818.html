<h1>행운의 숫자 피구</h1>
<p>1) 팀을 나누고 일반 피구 방식으로 경기를 진행한다. 2) 상대가 던진 공을 잡으면 경기를 멈추고 주사위를 굴린다. 3) 던지기 전 행운의 숫자 2개를 정하며, 첫 번째 숫자가 나오면 아웃된 아군 1명 부활, 두 번째 숫자가 나오면 상대 1명을 아웃시킨다. 4) 나머지 숫자가 나오면 바로 경기를 재개하며, 상대 팀을 모두 먼저 아웃시키거나 제한 시간 동안 더 많이 생존한 팀이 승리한다.</p>
