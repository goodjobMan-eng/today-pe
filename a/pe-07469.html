<h1>페페와 페파 (6가지 달리기 게임)</h1>
<p>1) 학생들은 파트너와 등맞대고 1미터 거리를 두고 앉거나 선다. 2) 한쪽은 페페, 반대쪽은 페파로 역할을 정한다. 3) 교사가 부른 이름의 사람이 파트너를 잡으러 쫓아가고, 불리지 않은 사람은 결승선까지 도망친다.</p>
