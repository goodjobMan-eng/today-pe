<h1>사자의 고리 통과하기 체조</h1>
<p>1) 어린이는 사자가 되고, 보호자는 손이나 팔·다리로 동그란 고리를 만든다. 2) 어린이는 보호자의 몸에 닿지 않도록 조심하며 만든 고리 사이를 기어서 통과한다. 3) 바닥에 엎드린 자세, 팔과 다리로 만든 다리 형태 등 다양한 모양의 고리를 통과한다. 4) 역할을 바꾸어 어린이가 고리를 만들고 보호자가 통과해 본다.</p>
