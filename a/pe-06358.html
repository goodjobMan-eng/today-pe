<h1>포토 사파리 헌트 브레인 브레이크</h1>
<p>1) 화면의 음악에 맞춰 숲속을 걷거나 점프하고 발을 구르며 이동한다.2) 야생동물이 나타나면 지시에 따라 점프하기, 숙이기, 펀치하기, 발차기 동작으로 피한다.3) 기린이 나타나면 기린의 포즈를 그대로 따라 멈춰 사진을 찍는다.</p>
