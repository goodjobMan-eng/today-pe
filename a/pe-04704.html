<h1>트리플 B</h1>
<p>1) 중앙 콘 라인을 기준으로 양 팀 진영에 각각 5~10개의 볼링핀을 세우고 각 핀 주위에 훌라후프를 놓아 수비수 접근을 제한한다. 2) 공을 던져 상대 진영의 볼링핀을 쓰러뜨린다. 3) 자기 진영의 농구 골대에 슛을 성공시키면 쓰러진 볼링핀을 다시 세울 수 있으며, 슛을 성공시킨 학생 본인만 핀을 다시 세울 수 있다.</p>
