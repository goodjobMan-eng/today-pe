<h1>매트 물구나무서기 연습(벽 물구나무서기 및 벽 걷기)</h1>
<p>1) 배를 벽 쪽으로 향하고 발바닥으로 벽을 타고 올라가며 손을 서서히 벽에 가깝게 짚는다. 2) 10초를 센 뒤 배꼽을 보며 앞구르기를 한다. 3) 발바닥을 벽에 대고 벽을 타고 올라간 뒤 옆으로 걸어 이동한다. 4) 익숙해지면 발 위치를 더 높여 걷고, 이동을 마친 뒤 배꼽을 보며 앞구르기를 한다.</p>
