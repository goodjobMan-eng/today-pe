<h1>색깔 풍선 캐치 (순발력 및 반응 협응 놀이)</h1>
<p>1) 지도자가 색깔이 표시된 풍선을 들고 있고 어린이는 그 옆에 준비 자세로 선다.2) 지도자가 풍선을 놓는 순간 특정 색깔을 외친다.3) 어린이는 풍선이 날아가거나 바닥에 닿기 전에 호명된 색깔의 풍선(또는 줄)을 양손으로 신속하게 잡는다.4) 숙달되면 풍선 2개 놓기, 뒤돌아 서 있다가 신호 듣고 잡기, 다리 사이로 빠져나가는 풍선 잡기 등으로 변형하여 진행한다.</p>
