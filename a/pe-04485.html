<h1>후프에 콩주머니 넣기 릴레이</h1>
<p>1) 각 팀의 출발선 후프 안에 팀원 수만큼의 콩주머니를 넣고, 앞쪽에는 투척 원뿔(콘)과 표적 후프를 배치한다. 2) 첫 번째 주자가 출발하여 후프에서 콩주머니 1개를 집어 투척 콘까지 달린다. 3) 투척 콘에서 표적 후프를 향해 언더암(밑으로 던지기)으로 콩주머니를 던진다. 4) 콩주머니가 후프 안에 들어가 멈추면 바로 돌아오고, 빗나가면 최대 3번까지 주워와 다시 던진 후 다음 주자와 하이파이브한다.</p>
