<h1>아침을 여는 전교생 색깔별 대항 릴레이 달리기</h1>
<p>1) 전교생이 학년 구분 없이 색깔별(팀별)로 모여 운동장 트랙에 팀 조끼를 입고 정렬한다. 2) 출발 신호에 맞춰 저학년부터 고학년까지 지정된 주자들이 차례대로 바통을 이어받으며 달린다. 3) 전원이 완주한 후 결승선 통과 순위와 팀 전체 완주 기록을 측정하여 득점을 가린다. 4) 팀별 목표 기록을 정해 기록 단축을 도전 과제로 삼거나 달리기 주자 순서를 전략적으로 조정한다.</p>
