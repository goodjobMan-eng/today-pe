<h1>길과 골목 (미로 변경 술래잡기)</h1>
<p>1) 학생들이 격자 대형(예: 5×5)으로 서고, 고양이 1명과 쥐 1명을 뽑아 미로 밖에 둔다. 2) 교사가 &quot;길(가로)!&quot; 또는 &quot;골목(세로)!&quot;을 외치면 학생들은 손을 맞잡아 통로 방향을 90도 바꾼다. 3) 고양이와 쥐는 만들어진 통로 사이로만 빠른 걸음(파워워킹)으로 이동하며 쫓고 피한다. 4) 고양이가 쥐를 잡거나 제한 시간이 지나면 역할을 바꾸고, 균형 물체 올리기 변형을 둘 수 있다.</p>
