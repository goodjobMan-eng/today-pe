<h1>냠냠냠(Nom Nom Nom) 댄스 웜업</h1>
<p>1) 교실 또는 체육관에서 주변 공간을 확보하고 바른 자세로 준비한다. 2) 경쾌한 'Nom Nom Nom' 음악 신호에 맞춰 한쪽 발을 찍는 풋 탭과 손가락 가리키기 동작을 시작한다. 3) 무릎을 높이 들어 올리는 하이니 런과 전신을 여닫는 점핑잭 동작을 음악 박자에 맞춰 역동적으로 수행한다. 4) 점핑잭 동작의 횟수를 늘리거나 좌우 탭 방향을 빠르게 전환하는 챌린지 방식으로 변형하여 활력을 높인다.</p>
