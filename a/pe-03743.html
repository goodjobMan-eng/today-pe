<h1>신문지 인구밀도 게임</h1>
<p>1) 신문지를 한 장 펼쳐 바닥에 두고 그 위에 올라서서 5초를 버틴다. 2) 신문지를 절반씩 접어 크기를 점차 줄여가며 그 위에 올라선다. 3) 크기가 작아지면 한 발로 서서 균형을 잡고 5초를 버틴다. 4) 발뒤꿈치를 들거나 눈을 감고 버티는 등 조건을 추가하며 진행한다.</p>
