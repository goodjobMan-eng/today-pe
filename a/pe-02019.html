<h1>츄크볼 단계별 패스 슛 수비 연습</h1>
<p>1) 2인 1조로 마주 보고 콘 라인 밖에서 언더패스와 캐치를 정면 및 신호 방향으로 연습한다. 2) 원거리에서 오버패스와 캐치를 연습하며 공을 주고받는다. 3) 츄크볼 프레임 정면 반원 구역 밖에서 바운드 슛 후 튀어나오는 공을 캐치한다. 4) 좌우 45도 및 측면에서 스텝 후 점프 슛을 시도하고, 슛 직후 반대편 수비 로테이션으로 이동하여 리바운드 수비를 연습한다.</p>
