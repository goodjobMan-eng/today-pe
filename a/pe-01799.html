<h1>범퍼볼 축구 실딩 디펜스 놀이</h1>
<p>1) 학생들은 각자 축구공 1개씩을 가지고 강당 전체 공간에 고르게 퍼져 드리블을 준비한다. 2) 술래(범퍼) 2~3명이 다가오면 공을 몸 반대편으로 숨기는 실딩 동작으로 공을 지켜낸다. 3) 범퍼에게 공을 빼앗겨 구역 밖으로 나가면 팔굽혀펴기 5회를 수행한 뒤 다시 참여한다. 4) 범퍼는 손을 들고 조용히 대기 중인 다른 학생에게 공을 건네주어 역할을 교대하며 수비 강도를 조절한다.</p>
