<h1>언더핸드 빈백 &amp; 볼링핀 쓰러뜨리기</h1>
<p>1) 콘으로 경계선을 설정하고 양 팀으로 나누어 투척선 뒤에 정렬한다. 2) 반대발을 앞으로 디디며 언더핸드로 빈백을 미끄러뜨리듯 던져 중앙의 콘과 볼링핀을 맞춘다. 3) 준비된 빈백이 모두 소진되면 제한 시간 내에 넘어진 핀을 건드리지 않고 빈백을 회수해 바구니를 채운다. 4) 2단계로 공을 굴려 핀을 맞추는 롤링 방식으로 전환하여 더 많은 목표물을 쓰러뜨린 팀을 가린다.</p>
