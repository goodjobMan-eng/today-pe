<h1>가로세로 퍼즐 맞추기 릴레이</h1>
<p>1) 출발 신호(가로 또는 세로)에 맞춰 주자가 후프에서 출발하여 접시콘 퍼즐로 달려간다.2) 대각선이나 건너뛰기는 불가능하며 가로 또는 세로로 바로 인접한 접시콘 2개의 위치만 한 번 바꾼다.3) 자기 자리로 돌아와 출발 지점의 후프 안에 두 발을 넣고 다음 주자와 터치한다.4) 다음 주자가 이어서 나와 인접한 콘을 바꾸며 제시된 방향(가로/세로)으로 같은 색깔 콘 3줄을 먼저 완성한다.</p>
