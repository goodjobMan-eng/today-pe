<h1>탁구 포핸드 서브</h1>
<p>1) 왼발을 앞에 두고 오른발을 뒤에 놓은 기본자세를 잡는다. 2) 공을 손바닥 위에 올려놓고 회전 없이 라켓 고무(라바) 위로 16cm 이상 높게 던진다. 3) 내려오는 공을 탁구대 뒤쪽 밑에서 손목 스냅을 이용해 쳐서 넘긴다. 4) 서브 후 상대의 리턴에 대비해 바로 기본 위치로 돌아온다.</p>
