<h1>벽 공 발리 챌린지</h1>
<p>1) 종이 3장을 뭉쳐 만든 종이 공을 들고 벽을 마주보고 선다. 2) 언더핸드로 공을 벽을 향해 가볍게 던진다. 3) 벽에 맞고 튕겨 나온 공을 손으로 쳐서(발리) 계속 벽에 맞히며, 바닥에 떨어질 때까지 성공한 횟수(1회당 1점)를 세어 3번의 기회 중 최고 기록을 측정한다.</p>
