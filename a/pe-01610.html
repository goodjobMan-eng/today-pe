<h1>발렌타인데이 프리즈 댄스 요가 무브먼트</h1>
<p>1) 화면을 마주 보고 주변 친구와 닿지 않도록 제자리에 바르게 선다. 2) 신나는 음악에 맞춰 캐릭터들의 춤과 동작을 자유롭게 따라 하며 리듬을 탄다. 3) 타이머가 멈추고 'Freeze' 신호가 나오면 화면에 제시된 요가 정지 자세를 그대로 멈춰 버틴다. 4) 동작 난이도를 조절하거나 짝과 함께 거울처럼 서로의 정지 동작을 흉내 내는 방식으로 변형한다.</p>
