<h1>수건 고리 표적 슛 놀이</h1>
<p>1) 한 사람은 수건의 양끝을 묶어 둥근 링(골대)을 만들어 두 손으로 잡고, 다른 한 사람은 수건을 둥글게 매듭지어 공을 만든다. 2) 던지는 사람은 골대 역할을 하는 파트너로부터 1~2m 거리에 선다. 3) 수건 공을 아래에서 위로 부드럽게 던져 파트너가 잡고 있는 수건 링 표적 안을 통과시킨다. 4) 성공할 때마다 링의 높이를 높이거나 서 있는 거리를 뒤로 한 걸음씩 넓혀가며 난이도를 높인다.</p>
