<h1>다양한 풍선 놀이</h1>
<p>1) 교실에서 학생들이 모여 앉아 풍선을 직접 붑니다. 2) 둥글게 서서 풍선을 떨어뜨리지 않고 손으로 칩니다. 3) 앞사람의 어깨를 잡고 기차 대형을 만들어 허리에 풍선을 끼우고 이동하며 다른 기차와 겨룹니다.</p>
