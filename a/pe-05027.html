<h1>양말공 손 운동 놀이</h1>
<p>1) 양말을 둥글게 말아 공 모양으로 만든다2) 양말공을 위로 던지고 양손으로 10회 연속 받는다3) 팔을 곧게 편 상태에서 위로 던져 10회 받는다4) 공을 던진 후 팔을 한 바퀴 비틀어 교차하며 10회 받는다5) 어깨를 크게 돌리며 투구 동작으로 위로 던져 올린다6) 팔을 뻗은 채 새끼손가락 쪽에 힘을 주어 양말공을 쥐었다 펴기를 양손 각각 10회 반복한다</p>
