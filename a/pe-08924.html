<h1>배구 기초 토스 연습 단계별 트레이닝</h1>
<p>1) 머리 위에서 삼각형 모양을 만들어 공을 감싸는 기본 손 모양과 굴곡 동작을 익힌다. 2) 짝이 던져주는 공을 평행, 45도, 90도 각도로 당기면서 잡았다가 밀어내는 동작을 연습한다. 3) 오픈 자세에서 왼발을 디디며 공을 잡고 오른발로 틀어 몸을 돌려 토스하는 방향성 스텝을 익힌다.</p>
