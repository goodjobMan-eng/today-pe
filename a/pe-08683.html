<h1>앵그리 벌룬 교실체육</h1>
<p>1) 풍선을 치거나 던져 패스합니다. 2) 풍선을 잡으면 이동이 불가능합니다. 3) 풍선으로 상대의 물병을 쓰러뜨리면 1점을 얻습니다. 4) 관중은 날아오는 풍선을 손으로 칠 수 있습니다. 5) 상대가 잡고 있는 풍선을 뺏거나 칠 수 없습니다. 6) 잡은 풍선은 5초 안에 던져야 합니다.</p>
