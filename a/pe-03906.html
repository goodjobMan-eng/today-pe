<h1>홀리데이 팔로우 얼롱 준비운동</h1>
<p>1) 양팔을 앞으로 뻗고 허리를 편 상태로 스쿼트를 5회 실시한다. 2) 양팔을 벌려 수평을 유지하며 상체를 좌우로 비틀어 준다. 3) 가드를 올린 상태에서 제자리 눈밭 킥 동작을 좌우 번갈아 실시한다. 4) 제자리 무릎 높여 뛰기를 실시하고 정지 신호에 멈춘 뒤 슬라이드 스텝과 빠른 발 스텝을 수행한다.</p>
