<h1>태권도품새수업</h1>
<p>1) 공간을 4개 구역(1구역 태극 1장, 2구역 줄넘기, 3구역 태극 1장, 4구역 앞차기)으로 나눈다.2) 각 구역에 학생 사범(주강사, 보조강사)을 배치하여 해당 동작을 배우고 연습한다.3) 각 구역에서 5분씩 활동한 후 신호에 맞춰 다음 구역으로 순환 이동한다.4) 모든 구역 순환 후 전체가 함께 태극 1장 동작을 맞춰보며 마무리한다.</p>
