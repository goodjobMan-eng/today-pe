<h1>뜀틀 앞구르기</h1>
<p>1) 뜀틀 대여섯 걸음 뒤에서 가볍게 도움닫기를 하여 모둠발로 구름판을 힘차게 밟는다. 2) 뜀틀 높이를 생각하며 손을 짚고 몸을 충분히 들어 올릴 수 있을 만큼 뛰어오른다. 3) 구름판과 가까운 쪽에 손을 짚고 양팔에 힘을 주며 균형을 유지한다. 4) 몸을 둥글게 말아 구른 후 엉덩이가 뜀틀에 닿으면 다리를 내리고 무릎을 살짝 구부려 착지한다.</p>
