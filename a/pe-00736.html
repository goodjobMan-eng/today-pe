<h1>뜀틀 팔 굽혀 앞구르기 넘기</h1>
<p>1) 일정한 도움닫기로 힘차게 달려와 구름판을 두 발로 강하게 구릅니다. 2) 두 손으로 뜀틀 앞쪽을 짚고 팔을 자연스럽게 굽히며 머리 뒷부분을 뜀틀에 닿게 합니다. 3) 등과 허리를 둥글게 말아 뜀틀 위에서 앞구르기를 하듯 부드럽게 회전합니다. 4) 회전 관성을 유지하며 뜀틀을 통과한 뒤 매트 위에 두 발로 안정감 있게 착지합니다.</p>
