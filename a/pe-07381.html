<h1>티볼 수비 방법(전진 대시 및 외야 수비)</h1>
<p>1) 약하게 굴러오는 타구는 기다리지 않고 앞으로 대시하여 자세를 낮추고 한 손(글러브)으로 땅을 긁듯이 잡는다. 2) 잡은 후 일어서면서 자연스럽게 송구 동작으로 연결한다. 3) 뜬공(외야 플라이)은 자세를 너무 낮추지 않고 양발을 대각선으로 벌려 앞뒤 이동에 대비한다. 4) 뒤로 넘어가는 타구는 공을 등지지 않고 시선을 유지하며 빠르게 뒤로 물러나거나 커버 플레이를 펼친다.</p>
