<h1>벤치 장애물 건너기 균형 스테이션</h1>
<p>1) 벤치 위에 일정한 간격으로 높은 콘을 올려놓는다.2) 양팔로 균형을 잡으며 콘을 건드리거나 밟지 않고 벤치를 건넌다.3) 콘을 건드리지 않고 끝까지 도달할 때마다 1점을 획득한다.4) 돌아온 후 다음 차례에는 옆으로 걷기 등 다른 방법으로 건너기에 도전한다.</p>
