<h1>배구 발 디그 대결</h1>
<p>1) 바닥에 둥근 원을 그린다. 2) 원 안에서 발과 무릎만을 이용해 공(풍선)을 띄우는 발 디그를 실시한다. 3) 공(풍선)이 30cm 이상 위로 올라와야 하며, 원 밖으로 나가거나 손에 닿지 않게 유지한다. 4) 기회는 두 번 주어지며 최대 20개까지 성공하는 것을 목표로 도전한다.</p>
