<h1>왕복 오래달리기로 체력 기르기</h1>
<p>1) 2명씩 한 모둠을 이루어 양쪽 출발선에서 서로를 마주 보고 선다. 2) 신호가 울리면 왼쪽 사람이 출발선에 있는 콩주머니를 가져와 마주 달려오는 오른쪽 사람에게 전달한다. 3) 콩주머니를 전달받은 사람은 뒤돌아 달려 바구니에 콩주머니를 넣는다. 4) 더 이상 달릴 수 없을 때까지 반복하여 콩주머니를 옮기고, 콩주머니를 많이 옮긴 모둠이 이긴다.</p>
