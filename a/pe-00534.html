<h1>다리 사이 터널 볼 캐치 앤 킥</h1>
<p>1) 두 사람이 마주 보고 서며 한 사람은 다리를 어깨너비보다 넓게 벌려 터널을 만듭니다. 2) 다른 한 사람이 바닥으로 공을 굴려 주면 상대는 발을 움직이지 않고 다리 사이로 공을 통과시킵니다. 3) 익숙해지면 뒤로 돌아선 채 다리 사이를 보며 공을 통과시키는 방식으로 난이도를 높입니다. 4) 공을 굴리는 사람이 '캐치', '킥', '통과(무반응)' 중 구령을 외치면 받는 사람은 신호에 맞춰 즉시 해당 동작을 합니다.</p>
