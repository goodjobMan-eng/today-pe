<h1>고양이와 쥐</h1>
<p>1) 짝을 지어 고양이와 쥐 역할을 나누고, 고양이는 앞(무대 쪽)을 보고 선다. 2) 쥐는 홉, 스킵, 점프 등 다양한 동작으로 고양이 등 뒤로 조용히 다가간다. 3) 교사가 '쥐들이 왔다'고 외치면 고양이가 뒤돌아서서 자신의 짝인 쥐만 쫓아가며, 쥐는 기준선을 넘어 도망쳐야 한다.</p>
