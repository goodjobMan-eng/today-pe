<h1>가정형 신체활동 서킷 트레이닝</h1>
<p>1) 몸통 중심과 높이를 유지하며 다리를 옆으로 뻗어 마커를 터치하는 스케이트 타기 운동을 한다. 2) 사다리를 사이드스텝으로 이동 후 콘을 지그재그로 통과한다. 3) 측면으로 서서 양발을 앞뒤로 교차하며 이동한다. 4) 한쪽 다리를 들어 버티며 한 칸씩 대각선으로 이동하는 밸런스 워킹을 한다.</p>
