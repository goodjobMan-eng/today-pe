<h1>릴레이 바통 전달 방법 (오버핸드 패스)</h1>
<p>1) 1~4번 주자가 일직선으로 바른 위치에 선다. 2) 1·3번 주자는 오른쪽, 2·4번 주자는 왼쪽 손으로 바통을 잡는다. 3) 바통을 줄 때는 손목을 꺾어 앞으로 밀어내듯 건넨다. 4) 받을 때는 손바닥이 위를 향하지 않게 뒤로 손을 뻗어 'へ' 자 모양을 만든다. 5) 테이크오버존 안에서 지정된 위치를 지켜 바통을 주고받는다.</p>
