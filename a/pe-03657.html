<h1>배드민턴 포핸드 및 백핸드 서비스</h1>
<p>1) 포핸드 서비스는 라켓 잡은 발을 뒤에 두고 셔틀콕을 배와 가슴 사이에 둔 뒤 던지지 않고 가볍게 놓으며 높고 멀리 칩니다. 2) 백핸드 서비스는 라켓 잡은 발을 앞에 두고 셔틀콕을 몸 앞 115cm 아래에 위치시킨 뒤 뒤로 당겼다가 지그시 밉니다. 3) 서비스 시 셔틀콕이 라켓에 닿는 위치는 지면으로부터 115cm 아래(명치 부근)여야 합니다.</p>
