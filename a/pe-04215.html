<h1>타깃 토이즈</h1>
<p>1) 체육관 한쪽에 훌라후프를 여러 개 배치하고 각 후프 안에 장난감(인형, 빈백)을 놓는다. 2) 후프에서 적당한 거리의 출발선에 모둠별로 릴레이 대형으로 선다. 3) 각 팀 첫 번째 주자가 폼볼을 굴리거나 발로 차서 후프 안의 장난감을 맞힌다. 4) 장난감을 맞히면 공과 획득한 장난감을 팀으로 가져오고, 맞히지 못하면 공만 회수하여 다음 주자에게 넘기며 가장 많은 장난감을 모은 팀이 승리한다.</p>
