<h1>스포츠 틱택토(MORPION SPORTIF)</h1>
<p>1) 두 팀으로 나누고 훌라후프 9개로 3x3 격자를 만들며 각 팀 출발선에 콘을 둡니다. 2) 출발 신호에 맞춰 각 팀 첫 주자가 훌라후프 쪽으로 달려가 자기 팀 색깔의 스카프를 하나 놓습니다. 3) 자기 팀 콘으로 돌아와 다음 주자가 출발하며, 가로·세로·대각선 중 한 방향으로 자기 팀 색깔 3개를 먼저 일렬로 완성한 팀이 승리합니다.</p>
