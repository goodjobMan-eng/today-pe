<h1>통통볼과 킥보드 타기</h1>
<p>1) 통통 볼을 타고 바닥을 차면서 위로 오르며 직선으로 이동한다. 2) 통통 볼을 타고 두 발로 바닥을 차면서 왼쪽과 오른쪽으로 번갈아가며 곡선으로 이동한다. 3) 킥보드 발판 중앙에 한 발을 올리고 바닥을 밀듯이 차며 직선으로 이동한다. 4) 킥보드 발판 중앙에 한 발을 올리고 손잡이로 방향을 바꿔가며 곡선으로 이동한다.</p>
