<h1>물고기 잡기</h1>
<p>1) 어부(술래) 1명과 물고기로 역할을 나눕니다. 2) 어부가 '그물을 던진다'는 신호를 외치면 물고기들은 어부에게 잡히지 않도록 반대편 안전지대로 달립니다. 3) 이동 도중 어부에게 터치된 물고기는 어부의 동료가 되어 서로 손을 잡고 함께 술래가 됩니다. 4) 어부 인원이 늘어나 그물이 커지면 그물을 여러 개로 나누거나, 시작 시 어부 인원 및 안전지대까지의 거리를 바꾸어 진행합니다.</p>
