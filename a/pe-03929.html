<h1>미션 임파서블</h1>
<p>1) 참가자들은 안전 구역으로 건너가 한 번에 1개의 콩주머니만 집어 출발 구역으로 되가져온다. 2) 안전 구역을 벗어나 이동하는 동안 술래에게 꼬리 벨트를 빼앗기면 탈락한다. 3) 꼬리를 뺏기면 가져가려던 콩주머니를 원래 자리에 두고 교사에게 가서 벨트를 다시 착용한 후 재도전한다. 4) 요원 팀은 5분 제한 시간 안에 반대편의 콩주머니 100여 개를 모두 가져와야 승리한다.</p>
