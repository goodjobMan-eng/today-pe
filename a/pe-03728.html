<h1>앞구르기 후 공 받기</h1>
<p>1) 매트 끝에 서고 보조자는 매트 앞쪽에서 공을 들고 마주 선다. 2) 매트 위에서 앞구르기를 한 뒤 일어나면서 보조자가 던져준 공을 잡는다. 3) 공에 회전을 주어 던지거나 두 가지 색상의 공 중 외친 색상의 공을 캐치한다. 4) 매트를 등지고 돌아선 상태나 반대쪽 방향에서 시작하여 회전 후 공을 잡는다.</p>
