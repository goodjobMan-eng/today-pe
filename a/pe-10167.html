<h1>그리즈리 베어</h1>
<p>1) 곰 한 명이 코트 한쪽에 서고 사슴들은 반대쪽에 섭니다. 2) 사슴들이 곰에게 &quot;몇 시니 그리즈리 베어?&quot;라고 묻습니다. 3) 곰이 시간을 말하면 그 숫자만큼 사슴들이 곰을 향해 걸어갑니다. 4) 곰이 &quot;자정&quot; 또는 &quot;점심시간&quot;을 외치면 뒤돌아 사슴들을 잡으러 쫓아갑니다.</p>
