<h1>새매 술래잡기</h1>
<p>1) 술래(사냥꾼) 1명을 정하고 나머지 참가자들은 반대편 출발선에 선다. 2) 출발 신호가 울리면 모든 도망자는 사냥꾼에게 잡히지 않고 경기장 전체를 가로질러 반대편으로 이동해야 한다. 3) 사냥꾼에게 태그된 참가자는 사냥꾼 팀으로 합류해 함께 다른 참가자를 잡으며, 마지막까지 살아남은 최후의 1인이 승리하여 다음 새매가 된다.</p>
