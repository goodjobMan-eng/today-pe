<h1>기본 공 저글링 2</h1>
<p>1) 공 2개로 양손 번갈아 던져 받기와 동시에 던져 양손으로 각각 받는 몸풀기를 한다. 2) 위에서 낚아채듯 잡는 2공 클로와 공 3개를 번갈아 던지는 3공 베이직 및 3공 클로를 연속 성공한다. 3) 2인 1조로 어깨 높이로 팔을 들고 팔 아래로 공을 회전하듯 주고받는 코끼리 저글링을 5분 안에 완료한다. 4) 2인 1조 어깨동무를 하고 2공 저글링을 수행하는 스피드 챌린지와 반환점을 돌아오는 협동 레이스를 진행한다.</p>
