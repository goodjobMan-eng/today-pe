<p>1) 한 손으로 말 모양 막대를 잡고 다른 한 손만 사용하여 고리를 조작한다.2) 패스를 주고받으며 목표 지점(나무/체력장 구역)을 맞혀 득점한다.3) 공(고리)을 소유할 수 있는 시간은 1인당 최대 2초로 제한하여 빠르게 패스한다.</p>
