<h1>공 패스 러닝 릴레이</h1>
<p>1) 학생들을 모둠별로 일렬종대로 세운다. 2) 줄의 맨 앞 학생에게 공 1개를 지급한다. 3) 맨 앞 학생이 방향을 정해 달리기 시작하면 뒤의 팀원들은 대열을 유지하며 뒤따라 달린다. 4) 달리는 동안 공을 뒤쪽으로 차례대로 패스한다. 5) 마지막 주자가 공을 받으면 맨 앞으로 달려 나와 줄을 이끌며 같은 방식으로 패스를 이어간다.</p>
