<h1>칠면조 술래잡기 (Turkey Tag)</h1>
<p>1) 칠면조 태깅 스틱을 든 술래 2명이 도망치는 학생들을 쫓아 태그한다.2) 술래에게 태그된 학생은 팔을 칠면조 날개처럼 접고 터키 점핑잭을 5회 실시한 뒤 다시 참여한다.3) 안전 원마커 구역에 들어가면 최대 10초 동안 쉴 수 있으며 술래는 그 앞에서 기다릴 수 없다.</p>
