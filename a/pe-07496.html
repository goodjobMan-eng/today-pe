<h1>여우와 사냥꾼</h1>
<p>1) 사냥꾼 1명을 제외한 모든 참가자(여우)는 허리 뒤쪽에 손수건(스카프)으로 꼬리를 단다. 2) 사냥꾼은 여우를 쫓아가 꼬리를 잡아채며 포획한다. 3) 잡힌 여우는 사냥꾼이 되어 기존 사냥꾼을 도와 다른 여우들을 함께 사냥한다.</p>
