<h1>후프 술래잡기</h1>
<p>1) 술래와 나머지 친구들이 양 끝에 위치하여 시작한다. 2) 술래는 펀스틱을 들고 한쪽 발에 훌라후프를 넣은 채로 끌고 이동하며, 발이 후프에서 빠지면 다시 발을 넣고 움직여야 한다. 3) 술래의 펀스틱에 맞은 친구는 아웃되어 지정된 장소로 이동한다. 4) 제한 시간이 끝날 때까지 살아남으면 승리한다.</p>
