<h1>체조 벤치 균형잡기 운동</h1>
<p>1) 뒤집은 체조 벤치 위를 앞으로 균형을 잡으며 건넌다. 2) 이어서 옆으로 걷거나 뒤로 걸어서 벤치를 통과한다. 3) 난이도를 높여 벽을 터치하거나 눈을 감고 건너며, 테니스공을 손으로 주고받거나 튕기면서 건넌다. 4) 파트너가 던져주는 공을 잡으면서 건너는 활동으로 발전시킨다.</p>
