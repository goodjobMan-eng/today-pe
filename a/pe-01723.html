<h1>슈퍼볼 양자택일 타바타 운동</h1>
<p>1) 학생들은 교실 책상 옆이나 강당의 개인 공간에 바르게 섭니다. 2) 화면에 슈퍼볼 관련 두 가지 선택지가 제시되면 자신이 선호하는 쪽을 마음속으로 고릅니다. 3) 각 선택지 옆에 배정된 운동 또는 댄스 동작이 나타나면 자신의 선택에 맞게 30초 동안 동작을 수행합니다. 4) 인터벌 타이머 종료 후 10초간 호흡을 가다듬으며 휴식하고 다음 라운드를 이어갑니다.</p>
