<h1>포트나이트 댄스 오프 브레인 브레이크</h1>
<p>1) 주변 친구와 책상 등에 부딪히지 않도록 안전거리를 확보하고 화면을 봅니다. 2) 화면에 제시되는 두 가지 포트나이트 댄스 동작 중 마음에 드는 하나를 선택합니다. 3) 음악과 타이머가 시작되면 선택한 댄스를 30초 동안 리듬에 맞춰 따라 추고, 이어지는 10초 휴식 시간에 숨을 고르며 다음 동작을 준비합니다. 4) 매 라운드마다 새로운 댄스를 골라 마지막 보너스 라운드까지 완료합니다.</p>
