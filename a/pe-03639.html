<h1>원마커 피자 술래잡기</h1>
<p>1) 각자 원마커(피자)를 손바닥 위에 올리고 배달원이 된다. 2) 경기장 안을 이동하며 상대방의 원마커만 쳐서 떨어뜨린다. 3) 상대를 건드리거나 자기 원마커를 스스로 떨어뜨리거나 경기장 밖으로 나가면 아웃된다. 4) 마지막까지 원마커를 떨어뜨리지 않고 살아남는 사람이 승리한다.</p>
