<h1>양말공 컵 볼링 쓰러뜨리기 챌린지</h1>
<p>1) 출발선에서 10피트 떨어진 지점에 컵 3개를 각각 2피트 간격으로 나란히 세워 둔다. 2) 출발선 뒤에서 양말공을 언더핸드로 굴려 컵 1개를 맞혀 쓰러뜨린다. 3) 쓰러뜨린 컵을 주워 다른 컵 위에 포개어 쌓은 후, 다시 선 뒤로 돌아가 남은 컵을 굴려 맞힌다. 4) 마지막 컵까지 모두 맞힌 후 3개의 컵으로 피라미드 성(아래 2개, 위 1개)을 쌓고, 선 뒤로 돌아가 공을 굴려 1분 안에 성을 쓰러뜨린다.</p>
