<h1>벽 짚고 옆돌기 (카트휠 골반 띄우기 연습)</h1>
<p>1) 벽면 바로 옆에 안전 매트를 깔고 벽을 등지고 섭니다. 2) 옆돌기 착수 요령에 맞춰 매트와 벽 모서리에 양손을 차례로 짚습니다. 3) 다리를 차올리며 발이나 엉덩이로 벽면을 '쿵' 짚어 순간적인 물구나무서기 자세를 만들고, 버틴 상태에서 다리를 차례로 내려놓으며 마지막 손으로 매트를 밀고 일어납니다. 4) 벽 옆 시도가 두렵다면 벽을 보고 물구나무서기를 한 뒤 한 발씩 옆으로 내리는 연습부터 합니다.</p>
