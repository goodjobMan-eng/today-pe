<h1>긴줄넘기 놀이 4종</h1>
<p>1) 두 사람이 양쪽에서 긴줄을 잡고 돌릴 수 있는 공간을 확보한다. 2) 쥐덫(Mouse Trap)은 긴줄을 앞뒤로 번갈아 반 바퀴씩 돌릴 때 줄에 걸리지 않고 통과한다. 3) 곰 인형(Teddy Bear)은 노래 가사에 맞춰 돌아서기, 땅 짚기, 신발 묶기 동작을 하며 줄을 넘는다. 4) 매운 고추(Hot Peppers)와 학교(School) 규칙에 따라 학년별 횟수나 점차 빨라지는 속도에 맞춰 줄넘기에 도전한다.</p>
