<h1>치어리딩 그대에게 동작 표현하기</h1>
<p>1) 뉴트럴, 밴트오버, 스쿼트 등 준비체조를 통해 신체를 푼다. 2) 신해철의 '그대에게' 전반부 박자에 맞춰 왼손·오른손을 들어 올리고 촵 동작과 빠운스 스텝을 익힌다. 3) 후반부 하이라이트 멜로디에 맞춰 팔을 뻗고 돌리는 연결 안무를 연습한다. 4) 전체 인원이 일렬로 서서 시간차 웨이브와 좌우 대형 변화를 맞추며 동작을 표현한다.</p>
