<h1>강아지 술래잡기</h1>
<p>1) 체육관 구석에 매트 4개를 벽에서 약간 떨어지게 배치하고 학급을 4개 팀으로 고르게 나눈다. 2) 한 팀에게 팀조끼를 주어 술래(포획자) 역할을 맡기고 나머지 세 팀은 강아지가 된다. 3) 신호가 울리면 강아지들은 술래를 피해 도망치고, 술래에게 태그된 강아지는 자신의 출발 장소인 매트(우리)로 돌아간다. 4) 술래가 모든 강아지를 잡으면 라운드가 끝나고, 다음 팀에게 팀조끼를 넘겨 술래를 바꿔 진행한다.</p>
