<h1>핀스카(Finska)</h1>
<p>1) 번호가 적힌 12개 핀을 특정 대형으로 세운다. 2) 큰 투척 블록을 던져 핀을 쓰러뜨린다. 3) 한 개만 쓰러지면 핀에 적힌 숫자가 점수가 되고 여러 개가 쓰러지면 쓰러진 개수가 점수가 된다. 4) 쓰러진 핀은 쓰러진 그 자리에 그대로 다시 세운다. 5) 정확히 50점을 먼저 만드는 사람이 승리하며 50점을 초과하면 25점으로 되돌아간다.</p>
