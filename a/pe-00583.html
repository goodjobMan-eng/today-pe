<h1>개구리 물구나무서기</h1>
<p>1) 매트 위에 양손을 어깨너비로 벌려 바닥에 평평하게 짚습니다. 2) 굽힌 팔꿈치 위에 굽힌 무릎 안쪽을 살포시 올려놓습니다. 3) 시선을 매트 앞쪽 바닥에 두며 상체 중심을 앞으로 천천히 이동합니다. 4) 발을 바닥에서 떼고 팔과 팔꿈치로 균형을 잡으며 10초 이상 버팁니다.</p>
