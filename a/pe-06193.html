<h1>3학년 축구 시합 수업</h1>
<p>1) 조끼를 입고 팀을 나누어 축구 경기를 진행한다.2) 공을 차고 패스하며 한곳에 뭉치지 않고 넓게 퍼져서 움직인다.3) 골을 넣은 팀은 팀원끼리 모여 하이파이브를 해야만 득점으로 인정된다.4) 점수를 실점한 팀도 함께 모여 파이팅을 외치며 서로를 격려한다.</p>
