<h1>폼 투창 표적 맞히기 게임</h1>
<p>1) 투척 구역 바닥에 두 개의 라인을 표시하고 전방에 표적 공을 놓는다.2) 안전 폼 투창의 끝을 아래로 향한 채 입장하여 투척 구역에 서서 45도 각도로 조준한다.3) 표적 공에 가장 가깝게 폼 투창을 던진 학생(또는 팀)이 승리하며 차례를 마친 후 출발선 뒤로 돌아간다.</p>
