<h1>홈 트레이닝 전신 근력 운동</h1>
<p>1) 팔벌려뛰기로 체온을 올리고 몸을 예열한다. 2) 앉을 때 무릎이 발 앞으로 나오지 않게 주의하며 앉았다 일어서는 스쿼트를 실시한다. 3) 팔을 어깨너비보다 넓게 벌리고 허리를 편 상태로 팔굽혀펴기(필요시 무릎 대기)를 실시한다. 4) 플랭크 버티기, 하늘자전거, 버피 테스트 등 복부와 전신 근지구력 운동을 순서대로 진행한다.</p>
