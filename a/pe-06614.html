<h1>배드민턴 하이 클리어 기초와 미션 게임</h1>
<p>1) 묵찌빠 동작 점프 게임으로 몸을 풀고 라켓으로 셔틀콕을 수직으로 3m 높이까지 5회 연속 띄운다. 2) 짝과 함께 벽을 향해 60도 각도로 셔틀콕을 쳐서 25회 벽치기 릴레이를 완성하고 순간 악력 그립을 익힌다. 3) 코트 반대편 훌라후프 3개에 언더핸드로 셔틀콕을 넣는 게임과 오버헤드로 연결해 스태킹 컵으로 받아 3점을 내는 릴레이 게임을 한다.</p>
