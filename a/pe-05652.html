<h1>설마 00색은 아니지? 릴레이</h1>
<p>1) 반환점에 두 가지 색깔(예: 노랑과 초록)의 마커를 뒤집어 놓는다.2) 주자가 달려와 마커를 들기 전에 뒤에서 대기하는 친구가 특정 색(예: 노랑 아니지?)을 외친다.3) 친구가 외친 색과 일치하면(틀리면) 다시 갔다 와야 하고, 외친 색이 아니면 성공하여 팀 자리로 돌아가 앉는다.</p>
