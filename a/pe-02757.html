<h1>훌라후프 돌리기 기초 운동</h1>
<p>1) 훌라후프를 손목에 걸고 살짝 반동을 주어 손목 돌리기를 연습한다. 2) 훌라후프를 팔 안쪽에 넣고 힘을 주었다 빼며 팔 돌리기를 연습한다. 3) 훌라후프를 허리에 대고 수평을 맞춘 뒤 가볍게 밀며 10초간 허리 돌리기를 유지한다. 4) 허리 돌리기가 익숙해지면 허리를 계속 돌리면서 앞뒤로 걷거나 점프하는 동작을 시도한다.</p>
