<h1>숫자 접시콘 활용 펀스틱 기둥 먼저 세우기</h1>
<p>1) 각 팀 첫 번째 주자가 출발선에서 숫자 접시콘 1개를 들고 반환점에 놓인 펀스틱으로 달려간다.2) 바닥에 놓인 펀스틱 구멍에 접시콘을 꽂아 기둥을 똑바로 세우고 출발선으로 돌아와 다음 주자와 손을 터치한다.3) 다음 주자들도 차례로 접시콘을 가져가 기둥을 세우며, 10개의 기둥을 먼저 모두 완성하고 복귀한 팀이 승리한다.</p>
