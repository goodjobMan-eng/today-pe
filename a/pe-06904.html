<h1>기본 움직임 기술: 스키핑</h1>
<p>1) 리드하는 발을 앞으로 내딛고 가볍게 홉(도약)한다. 2) 팔을 몸 옆에서 다리 움직임과 반대 방향으로 흔든다. 3) 발앞꿈치(발볼)로 부드럽게 착지한다. 4) 시선은 진행 방향인 앞쪽을 주시한다.</p>
