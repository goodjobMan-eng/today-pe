<h1>악어 강 건너기</h1>
<p>1) 콘으로 강 구역을 표시하고 악어(술래) 1명을 강 중앙에 배치한다. 2) 나머지 학생들은 강의 한쪽 편에 서서 출발 신호를 기다린다. 3) 신호가 울리면 학생들은 악어에게 터치되지 않고 반대편 강가로 달려 건너간다. 4) 악어에게 터치된 학생은 아기 악어가 되어 네 발(기어가는 자세)로 기어 다니며 다른 학생들을 함께 잡는다. 5) 마지막까지 잡히지 않고 남은 1명의 학생이 승리하며 다음 판의 악어가 된다.</p>
