<h1>마리오 올림픽 달리기 레이스</h1>
<p>1) 화면에서 자신이 응원할 레이서 캐릭터를 먼저 선택합니다. 2) 레이서 캐릭터에 배정된 준비 동작을 화면에 맞춰 수행합니다. 3) 레이스가 시작되면 제자리 달리기를 하거나 팀을 향해 열심히 응원합니다. 4) 레이스 중간에 주어지는 미니 게임(다른 그림 찾기)에도 참여합니다.</p>
