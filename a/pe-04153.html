<h1>무스 타깃 투척 운동 게임</h1>
<p>1) 투척선 뒤에 서서 상대방 열의 표적을 향해 물체를 던진다. 2) 상대방 열의 표적에 넣으면 표시된 숫자만큼 상대에게 운동 횟수를 부여하거나 점수를 얻는다. 3) 자신의 열 표적에 실수로 넣으면 자신이 해당 운동을 수행해야 한다. 4) 마지막 칸 표적에 들어가 무스가 선언되면 표적 주변을 전력 질주하여 먼저 돌아온 사람이 보너스 점수를 획득한다.</p>
