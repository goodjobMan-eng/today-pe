<h1>스카프 활용 놀이</h1>
<p>1) 스카프를 두 손으로 뭉친 후 머리 위로 높게 던지고 받아본다. 2) 스카프를 머리 위로 높이 던진 후 박수를 치거나 한 바퀴를 돈 후 잡아본다. 3) 스카프를 높이 던지고 머리, 손등, 어깨, 무릎, 발 등 신체 부위로 받아본다. 4) 스카프를 신체 부위에 올린 후 떨어지지 않도록 콘을 돌아오거나 꼬리잡기 놀이를 한다.</p>
