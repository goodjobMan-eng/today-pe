<h1>터치 미 신체 터치 술래잡기</h1>
<p>1) 터치하는 사람과 도망치는 사람을 정하고 마주 보고 악수를 한다. 2) 도망치는 사람이 엉덩이 등 터치할 신체 부위를 지정한다. 3) 제한 시간 안에 지정된 부위를 터치하면 터치하는 사람이 이기고, 터치당하지 않고 피하면 도망치는 사람이 이긴다. 4) 역할을 바꾸거나 무릎, 등 등으로 터치할 부위를 바꾸어 진행한다.</p>
