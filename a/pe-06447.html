<h1>환경과 건강을 함께 지키는 플로깅 홈트레이닝</h1>
<p>1) 손목, 어깨, 목, 허리, 무릎 순서로 관절 스트레칭을 실시한다. 2) 제자리에서 무릎을 가슴까지 높이 들고 팔을 뻗으며 큰 걸음 걷기 및 조깅을 한다. 3) 허리를 숙이지 않고 스쿼트 자세로 무릎을 굽혀 쓰레기를 줍는 동작을 10회씩 2세트 반복한다. 4) 이동 후 한 발을 앞으로 내미는 런지 자세로 쓰레기를 줍고, 사이드 스텝으로 이동하며 분리수거 동작을 수행한다.</p>
