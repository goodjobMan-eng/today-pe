<h1>포환던지기 후프 표적 맞히기 게임</h1>
<p>1) 바닥에 훌라후프를 놓고 두 줄의 콘으로 투척 구역을 만든다.2) 투척 구역에 들어선 학생은 포환던지기 기본자세로 공을 밀어 후프 안에 넣도록 던진다.3) 투척을 마친 학생은 줄 맨 뒤로 돌아가며 정해진 투구 후 후프 안에 공이 가장 많은 팀이 승리한다.</p>
