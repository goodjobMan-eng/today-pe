<h1>팝콘 술래잡기</h1>
<p>1) 경기장 안에 흩어져 시작하며 모든 사람이 동시에 술래가 되어 서로를 태그할 수 있다. 2) 다른 사람에게 태그당한 학생은 그 자리에 앉거나 쭈그려 앉고 자신을 태그한 사람을 지켜본다. 3) 두 사람이 동시에 서로를 태그한 경우에는 가위바위보로 누가 태그당했는지 결정한다. 4) 자신을 태그한 사람이 다른 사람에게 태그당하거나 교사가 '팝콘'이라고 외치면 앉아 있던 학생들이 즉시 일어나 다시 경기에 참여한다.</p>
