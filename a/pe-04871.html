<h1>도캉 가위바위보</h1>
<p>1) 두 팀으로 나뉘어 라인, 평균대, 폐타이어 길의 양 끝 진지에 선다.2) 신호에 맞춰 각 팀의 선두가 길을 따라 상대 진지를 향해 달린다.3) 중간에서 만나면 가위바위보를 하고, 진 사람은 길을 비켜 진지로 돌아가며 다음 주자가 즉시 출발한다.4) 이긴 사람은 계속 전진하고, 팀원 전원이 상대 진지에 먼저 도달한 팀이 승리한다.</p>
