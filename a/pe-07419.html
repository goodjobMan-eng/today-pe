<h1>기계체조 워밍업 런앤스톱</h1>
<p>1) 체육관 전체 공간을 활용하여 서로 부딪치지 않게 가볍게 조깅한다. 2) 호각 소리가 나면 그 자리에 멈춰 무릎을 가슴 높이까지 최대한 높고 빠르게 올린다. 3) 다시 조깅하다가 멈춤 신호에 엉덩이에 발뒤꿈치가 닿도록 킥을 반복한다. 4) 사이드 스텝으로 방향을 바꾸며 이동하고 매트 위를 지나거나 철봉·평균대 아래를 통과한다. 5) 제자리에 멈춰 서서 머리 회전, 어깨 팔 돌리기, 팔꿈치 펴기 스트레칭을 5~6회씩 실시한다.</p>
