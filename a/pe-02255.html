<h1>발목줄넘기 기본 리듬스텝</h1>
<p>1) 편한 쪽 발목에 발목줄넘기 고리를 걸고 발을 든 채 줄을 가볍게 돌려 회전 감각을 익힌다. 2) 발로 줄을 뒤로 차면서 돌아오는 줄을 반대쪽 발로 가볍게 점프하여 넘는다. 3) 지지하는 반대쪽 발을 앞으로 밀거나 반원을 그리듯 차주며 줄이 멈추지 않고 계속 돌도록 일정한 박자로 넘는다. 4) 앞으로 뛰기가 익숙해지면 발을 뒤로 차며 넘는 뒤로 뛰기 단계로 전환하여 연습한다.</p>
