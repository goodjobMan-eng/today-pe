<h1>짝꿍 공 전달 및 배 밀착 운반 놀이</h1>
<p>1) 두 명씩 짝을 짓고 공 1개를 준비해 등을 지거나 마주 보고 선다. 2) 제자리에서 허리를 비틀며 양옆과 머리 위, 다리 사이로 공을 서로 주고받는다. 3) 손을 쓰지 않고 배나 등에 공을 밀착해 끼운 채 떨어뜨리지 않고 반환점을 돌아온다. 4) 익숙해지면 발걸음 속도를 높이거나 뒤로 걷기 등 이동 방식을 변형하여 도전한다.</p>
