<h1>소리 듣고 도망가기</h1>
<p>1) 두 사람이 가운데 콘을 사이에 두고 마주 보고 선다. 2) 호각 소리가 1번 울리면 왼쪽, 2번 울리면 오른쪽으로 지정된 사람이 도망간다. 3) 반대편 사람은 즉시 쫓아가 도망가는 사람이 안전선에 닿기 전에 손으로 터치한다. 4) 한 발 들고 도망가기 등 이동 동작을 변형하여 진행한다.</p>
