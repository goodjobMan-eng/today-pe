<h1>점프 댄스</h1>
<p>1) 오른발을 옆으로 뻗고 점프, 왼발을 옆으로 뻗고 점프한 뒤 팔을 교차해 점프하고 두 팔을 위로 흔들며 점프하는 동작을 2회 반복한다.2) 권투 스피드백 치듯 손을 굴리며 앞으로 4걸음 전진하고, 뒤로 4걸음 후진한다.3) 팬케이크, 롤러블레이드, 스네이크, 셰이크, 웨이브 동작을 오른쪽부터 시작해 각각 4회씩 반복한다.</p>
