<h1>인셀발 (섬 피구 게임)</h1>
<p>1) 팀별로 매트 1장을 강당 바닥에 배치하여 각 팀의 섬으로 지정한다. 2) 소프트볼로 다른 팀의 자유롭게 움직이는 선수를 맞힌다. 3) 공에 맞은 사람은 자기 팀의 섬(매트)으로 이동하며, 섬에서 날아오는 공을 잡아 다른 팀 선수를 맞히면 탈락에서 벗어나 부활한다.</p>
