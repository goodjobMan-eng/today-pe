<h1>유즈 유어 누들 (Use Your Noodle)</h1>
<p>1) 노란 선을 사이에 두고 짝과 마주 선 뒤 한 사람은 짝수 팀, 다른 사람은 홀수 팀을 정한다. 2) 바닥에 풀누들을 두고 1부터 5까지의 숫자 중 하나를 동시에 손가락으로 낸다. 3) 두 숫자의 합이 짝수면 짝수 팀이, 홀수면 홀수 팀이 누들을 집어 상대가 벽에 닿기 전에 태그를 시도한다. 4) 벽에 닿기 전 태그에 성공하면 1점을 얻으며 10점을 먼저 내는 사람이 승리한다.</p>
