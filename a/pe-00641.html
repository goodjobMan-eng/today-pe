<h1>줄넘기 가위바위보 게임</h1>
<p>1) 수비 팀은 정해진 위치에 서서 줄넘기를 계속 넘고, 공격 팀 주자는 줄넘기를 넘으면서 첫 번째 수비수에게 다가갑니다. 2) 두 사람이 줄을 넘는 상태에서 발이나 손으로 가위바위보를 합니다. 3) 공격자가 이기면 다음 수비수에게 전진하여 다시 줄넘기 가위바위보를 하고, 지면 출발선으로 돌아갑니다. 4) 정해진 시간 안에 통과한 인원이나 횟수로 점수를 겨룹니다.</p>
