<h1>후프 보디가드 술래잡기</h1>
<p>1) 수비수 2명이 훌라후프 1개를 함께 잡고 안에 선 대장을 둘러싸 보호한다. 2) 술래는 가장 반대편에서 출발하여 좌우로 빠르게 움직이며 대장을 터치하러 다가간다. 3) 수비수들은 후프를 든 채 함께 회전하고 이동하며 대장이 술래에게 잡히지 않도록 막는다. 4) 술래가 대장을 터치하면 술래 팀이 승리하고, 후프를 놓쳐도 술래 팀이 승리한다.</p>
