<h1>매트 위 오뚝이(다루마) 구르기 놀이</h1>
<p>1) 바닥에 매트를 깔고 발바닥을 서로 맞댄 상태로 앉아 양손으로 발을 단단히 잡습니다. 2) 몸을 둥글게 만 채로 좌우 및 뒤로 데굴데굴 굴렀다가 반동을 이용해 제자리로 일어납니다. 3) 익숙해지면 반대 방향으로도 구르며 오뚝이처럼 중심을 잡고 일어납니다. 4) 팔과 다리가 풀리지 않도록 끝까지 몸을 웅크린 상태를 유지하며 코어와 균형 감각을 단련합니다.</p>
