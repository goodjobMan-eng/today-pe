<h1>훌라후프 바운스 패스 짝 교환 드릴</h1>
<p>1) 강당 바닥 전체에 훌라후프를 바운드 표적으로 띄엄띄엄 배치한다. 2) 두 명이 한 조가 되어 훌라후프를 사이에 두고 마주 서서 훌라후프 중앙으로 바운스 패스를 주고받는다. 3) 연속 3회 패스를 성공하면 공이 없는 학생이 다른 빈 짝을 찾아 이동하여 새로운 짝과 3회 패스를 수행한다. 4) 마지막 패스를 마친 공을 가진 학생은 공을 머리 위로 들어 빈 파트너를 부르고 거리를 점차 넓히는 변형을 적용한다.</p>
