<h1>자리를 지켜라</h1>
<p>1) 등글게 둘러앉아 빈자리를 하나 남겨둡니다. 술래는 가운데 섭니다. 2) 놀이가 시작되면 한 칸씩 자리를 옮겨 술래가 빈 자리에 앉지 못하도록 합니다. 3) 술래가 빈 자리에 앉게 되면 술래에게 자리를 뺏긴 사람이 새로운 술래가 됩니다. 4) 같은 방식으로 술래가 자리에 앉을 때까지 놀이를 계속합니다.</p>
