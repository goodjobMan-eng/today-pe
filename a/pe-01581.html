<h1>더 히트 이즈 온 유산소 워밍업 댄스</h1>
<p>1) 바닥에 개인 공간을 확보하고 바른 자세로 서서 경쾌한 음악에 맞춰 준비한다. 2) 음악 비트에 따라 사이드 스텝 터치, 팔 뻗기, 하이 니 러닝, 킥 등 리듬 스텝 동작을 차례로 따라 한다. 3) 후반부에는 숄더 탭 플랭크와 크랩 킥 등 전신 근력 강화 매트 동작을 리듬에 맞춰 수행한다. 4) 동작 난이도나 반복 속도를 학년별 체력 수준에 맞춰 조절하며 음악이 끝날 때까지 완주한다.</p>
