<h1>벤치 볼</h1>
<p>1) 경기장 양쪽 끝에 벤치를 하나씩 두고 학급을 두 팀으로 나눈다. 2) 각 팀에서 1명씩 상대 팀 진영의 벤치 위에 올라가서 시작한다. 3) 팀원들은 상대 진영 벤치에 있는 자기 팀원에게 공을 패스한다. 4) 벤치 위의 선수가 패스한 공을 잡으면 공을 던진 사람도 벤치로 이동해 함께 선다. 5) 먼저 벤치 위에 5명의 팀원을 모으는 팀이 승리한다.</p>
