<h1>볼 술래잡기</h1>
<p>1) 술래 1명을 정하고 나머지 사람들은 각자 매트 위에 올라가 공을 들고 준비한다. 2) 매트 위에 선 사람들은 술래가 공이 없는 매트를 밟아 차지하지 못하도록 서로 공을 패스한다. 3) 발전 규칙으로 참가자들은 패스를 돌리는 동안 매트에서 내려와 이동하며 패스를 이어갈 수 있다.</p>
