<h1>잡고 피해 게임</h1>
<p>1) 두 사람이 마주 보고 서거나 학급 전체가 둥글게 원형으로 선다.2) 한 손은 손바닥을 펴서 상대방 손 아래에 두고, 다른 한 손은 엄지를 세워 상대방 손바닥 위에 올린다.3) 진행자가 신호 음절을 외치다가 &quot;잡아!&quot;라고 외치는 순간 손바닥을 편 쪽은 상대 엄지를 움켜잡고, 엄지를 세운 쪽은 재빨리 위로 빼서 피한다.4) &quot;잡채&quot;, &quot;잡동사니&quot; 등 다른 단어에 속아서 먼저 잡거나 피하면 실점하며, 점수를 겨룬다.</p>
