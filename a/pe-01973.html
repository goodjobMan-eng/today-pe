<h1>5단계 축구 서클 패스</h1>
<p>1) 모둠별로 6~8명이 둥글게 원형으로 서고 축구공 1~2개를 준비한다. 2) 양옆 사람이 아닌 맞은편 동료의 이름을 부르며 정확하게 인사이드 패스를 주고받는다. 3) 중앙에 콘을 세워 패스로 맞혀 쓰러뜨리거나 중앙 수비수가 패스를 가로채면 역할을 교대한다. 4) 외곽 전원이 공을 쥐고 중앙의 패서에게 차례로 원터치 패스를 주고받는 방식으로 발전시킨다.</p>
