<h1>축구 트래핑과 랜덤 킥 게임</h1>
<p>1) 2인 1조로 짝을 지어 발과 허벅지를 이용해 공의 충격을 흡수하며 트래핑을 10회씩 번갈아 연습한다. 2) 디딤발 방향과 공의 중앙 타격을 의식하며 인사이드, 인스텝, 인프론트, 아웃프론트 킥 연습을 수행한다. 3) 4개 모둠으로 나누어 각 조 1번부터 차례대로 나와 교사가 무작위로 지정하는 킥 기술로만 골대에 슛을 시도한다. 4) 지정된 킥으로 골을 넣어 가장 많은 득점을 기록한 모둠이 승리한다.</p>
