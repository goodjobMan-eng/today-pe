<h1>점프 로프 포 하트 장애물 코스</h1>
<p>1) 평균대를 걸어서 건너간다.2) 콘 상단의 안내에 따라 콘 꼭대기를 터치한다.3) 터널을 기어서 통과한다.4) 불의 고리(후프 아치)를 지나간다.5) 볼링핀 사이를 지그재그로 통과한다.6) 허들을 뛰어넘고 콘을 터치한다.7) 보라색과 파란색 허들을 연속으로 뛰어넘는다.8) 두 발로 타이어 안으로 두 번 점프해 들어간다.9) 결승선 콘의 꼭대기를 닌자 워리어 스톱 버튼처럼 터치하여 완주한다.</p>
