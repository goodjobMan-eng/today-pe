<h1>안내자와 시각장애인(Le guide et les aveugles)</h1>
<p>1) 두 명씩 짝을 지어 한 명은 안내자, 한 명은 눈을 가린 시각장애인 역할을 맡습니다. 2) 안내자는 콘 뒤에 머무르며 콘을 넘어가지 않고 오직 목소리로만 이동 경로를 지시합니다. 3) 눈을 가린 사람은 안내자의 목소리만을 듣고 공간을 이동하여 놓여 있는 스카프를 찾아 출발선으로 가져옵니다.</p>
