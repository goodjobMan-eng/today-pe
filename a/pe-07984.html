<h1>누워서 하는 베개 돌리기 챌린지</h1>
<p>1) 누운 상태에서 두 발로 두툼한 솜베개를 들어 지탱한다. 2) 손을 쓰지 않고 발로 베개를 한쪽 방향으로 360도 돌려 기본 위치로 돌아온다. 3) 반대 방향으로 다시 발만 사용해 360도를 돌려 총 720도를 완주한다.</p>
