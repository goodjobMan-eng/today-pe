<h1>매트에 앉아서 발 차올리기 (철봉 오르기 연습)</h1>
<p>1) 매트에 앉아 봉을 어깨너비로 잡고 허리 위치에 둔다.2) 한 발로 지면을 차며 다른 한 발을 머리 뒤쪽을 향해 가위(지키) 모양으로 높이 차올린다.3) 등과 허리를 둥글게 말아 올리며 뒤로 굴러 발이 머리 너머 바닥에 닿을 정도로 차올린다.</p>
