<h1>철봉 고난도 거꾸로 오르기 3단계 도전</h1>
<p>1) 철봉에 매달려 턱걸이하듯 팔을 굽히고 다리를 모아 들어 올린다.2) 팔과 무릎을 굽힌 상태에서 발을 차올려 철봉을 거꾸로 오른다.3) 팔과 무릎을 곧게 편 자세에서 반동 없이 순수 근력으로 거꾸로 오른다.</p>
