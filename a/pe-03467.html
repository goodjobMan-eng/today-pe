<h1>채로 공 치기와 받기 게임</h1>
<p>1) 8명이 한 모둠을 이루고 모둠별로 2명씩 짝을 이룬 다음 순서를 정한다. 2) 출발 신호와 함께 둘이서 채로 공을 치고 받으면서 이동하여 반환점을 돌아 다음 순서의 모둠원에게 공을 이어준다. 3) 공을 몰고 다섯 걸음보다 많이 이동할 수 없다. 4) 마지막 모둠원이 가장 빨리 출발선으로 돌아온 모둠이 이긴다.</p>
