<h1>개구리 점프 구리코</h1>
<p>1) 리더 한 명을 정하고 다른 사람들은 가로로 한 줄로 선다. 2) 리더와 가위바위보를 한다. 3) 리더를 이긴 사람은 개구리 동작으로 점프하여 앞으로 나아간다(주먹으로 이기면 '구-리-코' 3회, 가위로 이기면 '치-요-코-레-이-토' 6회, 보자기로 이기면 '파-이-나-쓰-푸-루' 6회 점프). 4) 골 라인을 가장 먼저 넘은 사람이 이기며, 2인 1조 대결형으로 변형해 활동할 수도 있다.</p>
