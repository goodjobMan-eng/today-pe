<h1>스쿠프 활동 시 고깔콘 활용하기</h1>
<p>1) 짝과 함께 스쿠프를 잡고 공을 던지고 받는다.2) 스쿠프로 공을 받기 어려워하는 학생은 고깔콘(라바콘)을 활용한다.3) 상대가 던진 공을 고깔콘의 입구로 갖다 대어 받는다.4) 바운드된 공이나 날아오는 공을 다양하게 받으며 기능을 익힌다.</p>
