<h1>거리별 농구 패스 릴레이</h1>
<p>1) 원마커로 간격을 두고 선 상태에서 1번 주자가 2번 주자에게 공을 던져 패스합니다. 2) 가까운 거리와 먼 거리를 번갈아 패스하며 상황에 따라 이동하여 공을 잡습니다. 3) 패스를 놓치면 성공할 때까지 다시 시도합니다. 4) 조별로 릴레이를 마친 뒤 리더(1번)가 맨 뒤로 이동하며 순번을 바꾸어 진행합니다.</p>
