<h1>신문지 가위바위보</h1>
<p>1) 바닥에 펼쳐 놓은 신문지 위에 두 사람이 각각 올라서서 마주 봅니다. 2) 신호에 맞춰 가위바위보를 합니다. 3) 진 사람은 자신이 딛고 있는 신문지를 절반으로 접은 뒤 그 위에 다시 올라섭니다. 4) 신문지가 계속 작아져 발이 신문지 밖으로 벗어나거나 균형을 잃으면 패배합니다.</p>
