<h1>캐슬 (Castles)</h1>
<p>1) 각 플레이어는 경기장 안에 자신의 콘(캐슬)을 거꾸로 세워 둔다. 2) 공을 차서 다른 플레이어의 콘을 맞춰 쓰러뜨리면 맞은 사람은 아웃된다. 3) 콘이 쓰러진 사람은 콘을 들고 사이드라인으로 이동한다. 4) 사이드라인에 나간 사람도 공을 잡아 경기장 안의 콘을 향해 찰 수 있다. 5) 마지막까지 자신의 콘을 지키고 살아남는다.</p>
