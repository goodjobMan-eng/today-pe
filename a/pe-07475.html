<h1>개구리 점프 릴레이</h1>
<p>1) 학급을 여러 팀으로 나누고 각 팀에 훌라후프 여러 개를 지급한다. 2) 팀마다 1명을 '개구리' 주자로 선정하고 나머지는 후프를 옮기는 도우미 역할을 맡는다. 3) 개구리 주자는 바닥에 놓인 훌라후프 안을 점프하며 마지막 후프까지 전진한다. 4) 팀원들은 개구리가 지나간 뒤쪽 후프를 주워 앞쪽에 연속으로 놓아주며, 코트 반대편 끝까지 도달(왕복 가능)한 후 다음 주자와 교대한다.</p>
