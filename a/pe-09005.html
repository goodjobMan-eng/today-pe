<h1>플래그 태그</h1>
<p>1) 각 플레이어는 허리춤에 2개의 플래그(스카프)를 꽂고 시작한다. 2) 상대방의 플래그를 손으로 잡아당겨 빼앗는다. 3) 두 플래그를 모두 빼앗기면 바닥에 무릎을 꿇고 앉아 다른 플레이어로부터 플래그를 받을 때까지 기다린다.</p>
