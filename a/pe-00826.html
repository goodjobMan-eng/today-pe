<h1>지뢰 피하기 협동 탈출 (눈 가리고 미로 통과)</h1>
<p>1) 구역 내에 꼬깔콘 등 장애물(지뢰)을 무작위로 배치합니다. 2) 2인 1조가 되어 한 명은 안대를 쓰거나 눈을 감고, 다른 한 명은 말로만 길을 안내합니다. 3) 안내자는 말로만 방향과 거리를 알려 눈을 가린 친구가 지뢰를 건드리지 않도록 이끕니다. 4) 지뢰를 건드리지 않고 반대편 목표 지점까지 안전하게 통과하면 성공합니다.</p>
