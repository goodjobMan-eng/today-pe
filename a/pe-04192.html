<h1>스톤헨지 지키기 게임</h1>
<p>1) 매트로 스톤헨지 구조물을 세우고 그 위에 콘을 올리며, 중앙에는 핀을 세운다. 2) 중앙의 수비팀은 날아오는 공을 쳐내며 구조물을 보호한다. 3) 공격팀은 폼볼을 던져 핀(1점), 콘(3점), 스톤 구조물(5점)을 쓰러뜨려 점수를 얻는다. 4) 물건을 쓰러뜨린 선수는 해당 물건을 직접 가져와 자기 팀 구역에 모은다.</p>
