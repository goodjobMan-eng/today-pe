<h1>부메랑 피구 놀이</h1>
<p>1) 강당 전체에 학생들이 자유롭게 흩어지고 교사가 여러 개의 폼볼을 코트 안으로 던져 넣는다. 2) 폼볼을 주운 학생은 다른 사람의 무릎 아래(발이나 다리)를 향해 공을 던지거나 굴려 맞힌다. 3) 공에 맞은 학생은 그 자리에 즉시 앉아야 하며, 자신을 맞힌 공이 아닌 다른 굴러오는 공을 잡으면 다시 일어난다. 4) 공을 든 상태에서 맞으면 공을 내려놓고 앉아야 하며 앉아 있는 친구에게 공을 굴려주어 살려주는 변형도 가능하다.</p>
