<h1>뜀틀 빙고 게임</h1>
<p>1) 2개의 모둠으로 나누어 모둠별로 다른 색 스카프를 주머니에 꽂는다. 2) 출발 신호와 함께 첫 번째 사람이 뜀틀을 뛰어넘은 다음 훌라후프에 스카프를 넣고 돌아온다. 3) 뜀틀을 넘지 못하면 출발선으로 돌아가서 다시 도전한다. 4) 상대편 모둠의 스카프가 가로, 세로, 대각선 한 줄로 채워지지 않도록 막으며 한 줄을 먼저 완성하는 모둠이 승리한다.</p>
