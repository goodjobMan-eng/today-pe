<h1>움직임 요소에 변화 주어 뛰기 (탐구 루틴)</h1>
<p>1) 2명 또는 3명이 짝을 이루어 네 가지 스테이션(팔 탐구, 잘 도는 방향 탐구, 제자리/달려와서 탐구, 장애물 탐구)으로 나뉜다.2) 한 학생이 뛰기 동작을 시도하면 나머지 친구들은 관찰한다.3) 관찰한 친구들은 준비 동작 크기나 팔 흔들기 등 잘하는 방법을 조언(피드백)한다.4) 서로 번갈아가며 시도와 조언을 반복하고 안내판을 확인하며 스테이션을 이동한다.</p>
