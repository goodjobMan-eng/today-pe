<h1>구급차 출동 병원 태그 놀이</h1>
<p>1) 코트 반대편 모퉁이에 콘으로 병원을 설치하고, 술래 2명과 구급차 운전사 2명을 지정한다. 2) 술래에게 태그된 도망자는 환자가 되어 그 자리에 누워 도움을 요청한다. 3) 구급차 운전사 2명이 스쿠터 매트를 밀고 가 환자를 최대 2명 태워 가까운 병원으로 이송한다. 4) 병원에 도착한 환자는 팔굽혀펴기 등 지정된 체력 미션(5회)을 완수하면 다시 부활하여 도망친다.</p>
