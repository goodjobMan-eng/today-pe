<h1>그린치 런</h1>
<p>1) 마을을 꾸미기 위해 화면에 맞춰 제자리에서 뛰며 리스 사이를 점프한다. 2) 크리스마스 헬리콥터가 나타나면 몸을 웅크려 숙이고, 장식품을 높이 던진다. 3) 그린치가 나타나면 즉시 동작을 멈추고 제자리에 얼어붙는다. 4) 집 안으로 들어가 트리의 리본을 풀고, 떨어지는 장식을 피하며 구르는 선물을 줍는다.</p>
