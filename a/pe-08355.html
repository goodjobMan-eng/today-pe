<h1>배구공 기차 협동 릴레이</h1>
<p>1) 팀원들이 일렬로 서서 앞사람의 등과 뒷사람의 배 사이에 배구공을 손을 대지 않고 끼운다. 2) 신호에 맞춰 손을 쓰지 않고 발을 맞추어 앞으로 전진한다. 3) 반환점(의자)을 돌아오는 도중 공이 떨어지면 출발선으로 돌아가 다시 시작한다.</p>
