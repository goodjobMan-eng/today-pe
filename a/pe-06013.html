<h1>행운의 숫자 점핑</h1>
<p>1) 한 팀에 4명씩 대형을 맞추어 준비한다.2) 교사가 1부터 12까지 적힌 숫자 카드 중 한 장을 보지 않고 뽑아 든다.3) 뛴 횟수가 카드 숫자와 가장 가까운 팀은 1점, 숫자를 정확히 맞힌 팀은 2점을 얻는다.</p>
