<h1>기본 이동 움직임 7가지 배우기</h1>
<p>1) 출발선과 반환점에 콘을 설치하고 이동 구역을 구성합니다. 2) 걷기, 달리기, 양발로 뛰는 점핑 순서로 기초 이동 동작을 수행합니다. 3) 한 발로 뛰는 호핑과, 걷기와 호핑이 합쳐진 리드미컬한 스키핑을 연습합니다. 4) 앞발이 가고 뒷발이 따르는 갤로핑과 한 발로 멀리 도약하는 리핑까지 총 7가지 이동 동작을 차례로 익힙니다.</p>
