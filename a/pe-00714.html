<h1>뜀틀 운동 (뜀틀 위 앞구르기)</h1>
<p>1) 뜀틀 앞 발구름판에서 양발로 힘차게 발을 굴러 도약합니다. 2) 뜀틀 상단 앞쪽 표시된 위치에 두 손을 짚고, 도약할 때 엉덩이를 높게 들어 올립니다. 3) 턱을 가슴 쪽으로 당겨 목 뒤쪽부터 뜀틀에 닿도록 부드럽게 회전합니다. 4) 회전 후 매트 위로 균형을 잡으며 착지합니다.</p>
