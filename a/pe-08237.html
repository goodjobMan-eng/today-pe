<h1>피자 배달원 놀이</h1>
<p>1) 참가자들은 손바닥 위에 뒤집은 접시콘(피자)을 한 손으로 받쳐 든다. 2) 정해진 구역 안을 이동하며 자신의 피자를 지키는 동시에 다른 사람의 피자를 쳐서 떨어뜨린다. 3) 피자가 떨어진 참가자는 구역 옆 늑목을 오르거나 팔굽혀펴기를 수행한 후 다시 들어온다. 4) 팀조끼를 착용해 팀 대항전으로도 진행할 수 있다.</p>
