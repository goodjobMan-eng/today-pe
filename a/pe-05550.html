<h1>스포츠 빈백 저글링 3구 혼자 및 짝 활동</h1>
<p>1) 한 손에 빈백 2개, 다른 손에 1개를 쥐고 1, 2, 3번 순서로 포물선을 그리며 번갈아 던진다.2) 입으로 숫자를 세며 던져 올린 빈백을 떨어뜨리지 않고 안정적으로 잡는 연습을 한다.3) 마주 선 짝과 함께 바깥쪽 손은 고정하고 안쪽 손으로 빈백을 번갈아 주고받으며 3구 저글링을 시도한다.</p>
