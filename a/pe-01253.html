<h1>패스 앤 런 럭비 태그 게임</h1>
<p>1) 라바콘으로 사각형 구역을 만들고 6명이 한 모둠이 되어 4명은 공격수, 2명은 수비수(팀조끼 착용)를 맡는다. 2) 공격수는 수비수를 피해 공을 들고 뛰거나 동료에게 패스하며 구역 안에서 자유롭게 이동한다. 3) 수비수는 패스되는 공을 가로채거나 공을 소지한 공격수를 손으로 가볍게 터치(태그)한다. 4) 공을 빼앗기거나 태그당한 공격수는 수비수와 조끼를 바꿔 역할을 교대하며, 애매한 패스로 빼앗기면 가위바위보로 수비수를 정한다.</p>
