<h1>브레이크 대시 달리기 연습</h1>
<p>1) 달리는 사람의 골반 부위를 뒤에서 손으로 잡아 앞으로 나가는 힘을 억제한다. 2) 달리는 사람은 저항을 이겨내며 몸을 앞으로 밀며 나아간다. 3) 정해진 걸음 수(3보 또는 5보)를 구호에 맞춰 달린 뒤 잡고 있던 손을 완전히 놓아 앞으로 질주한다.</p>
