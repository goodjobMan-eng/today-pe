<h1>거미 술래잡기 (네 발 자세 술래잡기)</h1>
<p>1) 네 발 자세로 엎드려 이동하는 술래잡기이며, 술래는 등을 위로 향한 네 발 자세(호랑이/개 자세)로 도망자를 쫓습니다. 2) 도망자는 배를 위로 향한 네 발 자세(게/거미 자세)로 술래를 피해 달아납니다. 3) 술래에게 터치당하면 역할을 교대하거나 모자를 바꿔 쓰고 술래가 됩니다. 4) 도망자가 5초간 쉴 수 있는 안전지대를 설치하거나 술래 수를 늘려 변형할 수 있습니다.</p>
