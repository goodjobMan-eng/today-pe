<h1>탁구공 바운딩 퐁당</h1>
<p>1) 경기자 앞 1~1.5m 거리에 컵 6개를 바닥에 나란히 놓는다. 2) 바닥에 앉아 탁구공을 바닥에 한 번 바운드시켜 컵 안으로 집어넣는다. 3) 공이 들어간 컵을 가져와 포개어 모으며, 6개의 컵을 먼저 모두 획득한 사람이 승리한다.</p>
