<h1>원뿔 잡기 (Catch the cone)</h1>
<p>1) 콘을 일렬로 세우고 두 학생이 콘을 사이에 두고 마주 보고 선다. 2) 진행자가 지시하는 신체 부위(머리, 어깨, 무릎, 발끝 등)나 색깔을 듣고 손으로 만진다. 3) 진행자가 '콘(Cone)'을 외치는 순간 상대보다 빠르게 콘을 먼저 잡는 사람이 승리한다.</p>
