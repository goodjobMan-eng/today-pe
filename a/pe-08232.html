<h1>리파 럭비</h1>
<p>1) 양쪽 골반 위치에 깃발 2개가 달린 태그 벨트를 착용하고 경기를 시작한다. 2) 공격수는 공을 들고 전진하며, 수비수가 깃발을 뜯고 &quot;립(Rip)&quot;을 외치면 공격수는 세 걸음 이내에 즉시 패스한다. 3) 수비수는 뜯은 깃발을 상대에게 돌려주고, 수비 팀 전원은 깃발이 뜯긴 지점 뒤로 물러선다. 4) 공격수가 상대 골라인 너머 바닥에 공을 찍어 누르면 트라이 득점으로 인정된다.</p>
