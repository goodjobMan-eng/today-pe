<h1>농구 라인 술래잡기 (Line Tiggy)</h1>
<p>1) 모든 학생은 체육관 코트의 라인을 따라서만 이동하며 라인 밖으로 벗어날 수 없습니다. 2) 술래 2명은 공을 한 손으로 드리블하며 이동하고 빈 손으로 다른 학생을 태그합니다. 3) 태그된 학생은 라인 밖으로 나와 점핑잭(스타 점프)을 10회 실시한 후 다시 라인 위로 돌아가 게임에 참여합니다.</p>
