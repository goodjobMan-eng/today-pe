<h1>비치타월 뜀틀 손짚고 넘기 연습</h1>
<p>1) 뜀틀 상단에 각자 준비한 커다란 비치타월을 평평하게 올려놓는다. 2) 뜀틀을 향해 달려와 양손으로 타월 위를 강하게 짚으며 뛰어넘는다. 3) 손으로 타월을 짚을 때 탕 소리가 나도록 힘차게 짚어 타월이 구겨지거나 밀리지 않게 한다. 4) 타월이 밀리지 않고 제자리에 유지되면서 깔끔하게 착지하는지 확인하며 반복 연습한다.</p>
