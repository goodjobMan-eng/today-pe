<h1>가을 스톰프 히어로 리듬 운동 및 요가 프리즈</h1>
<p>1) 대결할 캐릭터(펌킨 피카츄 또는 소닉) 중 하나를 선택한다.2) 트랙 버튼이 플레이 존에 도달하면 색상별 동작(빨강: 왼발 스톰프/홉, 노랑: 오른발 스톰프/홉, 빨강+노랑: 점프, 파랑: 박수, 보라: 허벅지 치기)을 따라 한다.3) 미니게임에서는 요가 포즈를 따라 멈추거나 날아오는 나뭇잎을 펀치·킥하고 링과 몬스터볼을 획득한다.</p>
