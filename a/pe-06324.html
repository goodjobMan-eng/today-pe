<h1>아크로 요가 파트너 협동 체조 활동</h1>
<p>1) 학생들을 3~4명씩 모둠으로 구성하고 영상을 보며 해결할 체조 과제를 부여한다.2) 2명의 학생이 짝을 이루어 아크로 요가 파트너 체조 동작을 연습한다.3) 모둠의 나머지 학생들은 짝이 안전하게 동작을 수행할 수 있도록 주변에서 지켜보며 안전 도우미 역할을 한다.</p>
