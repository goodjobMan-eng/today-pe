<h1>수건 점프 챌린지</h1>
<p>1) 수건을 작게 접어 바닥에 평평하게 놓습니다. 2) 학생은 수건 앞에 서서 두 발로 가볍게 뛰어넘는 점프를 연습합니다. 3) 성공할 때마다 수건을 조금씩 펼쳐 너비를 넓혀 가며 다음 단계에 도전합니다. 4) 최종적으로 큰 목욕수건 크기까지 펼쳐 한 번에 뛰어넘는 데 도전합니다.</p>
