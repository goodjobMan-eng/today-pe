<h1>피투그람(파키스탄 탑 무너뜨리기 술래잡기)</h1>
<p>1) 수비와 공격으로 순서를 정한다. 2) 수비팀은 돌, 비사, 젠가 등을 이용해 안쪽 사각형 안에 탑을 3~5층 쌓는다. 3) 공격팀은 폼 주사위(인형)를 5번 안에 던져 탑을 무너뜨린다. 4) 탑이 무너지면 공격팀은 주사위를 주워 도망가는 수비팀을 터치하고, 수비팀은 탑을 쌓았던 사람이 무너진 탑을 다시 쌓는다.</p>
