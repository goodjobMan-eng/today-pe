<h1>수건 타기 놀이</h1>
<p>1) 수건 위에 무릎을 세우고 양손과 양발은 수건 밖으로 빼고 앉는다. 2) 시작 신호가 울리면 양손과 발로는 바닥을 밀고 동시에 엉덩이로는 바닥을 당기며 앞으로 움직인다. 3) 동작을 반복하며 반환점을 돌아 출발선까지 이동한다. 4) 토너먼트 경기나 모둠별 이어달리기 형식으로 게임을 진행할 수 있다.</p>
