<h1>TV 술래잡기</h1>
<p>1) 술래에게 쫓기면 바닥에 앉아 TV 쇼 이름을 외치며 TV가 된다. 2) TV가 된 아이는 3초 동안 안전하다. 3) 술래는 TV가 된 아이를 기다리지 않고 다른 사람을 잡으러 간다. 4) 술래에게 잡히면 화장실이 되어 팔을 뻗고 제자리에서 3번 돌아야 다시 게임에 참여할 수 있다.</p>
