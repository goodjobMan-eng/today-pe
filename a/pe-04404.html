<h1>농구 드리블 넉아웃</h1>
<p>1) 각자 농구공을 하나씩 가지고 정해진 구역 안에서 드리블을 한다. 2) 드리블을 유지하면서 다른 사람의 공을 쳐서 구역 밖으로 내보낸다. 3) 공을 뺏기거나 구역 밖으로 나가면 탈락한다. 4) 마지막까지 남는 사람이 승리한다.</p>
