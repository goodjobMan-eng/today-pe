<h1>사뿐사뿐 폴카 라인댄스</h1>
<p>1) 왼쪽으로 세 번, 오른쪽으로 세 번 손뼉 치기를 2회 반복한다 2) 왼발 뒤꿈치와 발끝을 번갈아 터치(힐토 힐토)한 뒤 옆으로 갤로핑 스텝을 세 번 뛴다 3) 반대쪽(오른발)도 동일하게 힐토 힐토 후 갤로핑 스텝 세 번을 연결한다 4) 왼쪽으로 원을 그리며 여덟 박자 동안 걸어 90도 회전한 방향을 보고 선 뒤 음악에 맞춰 전체 순서를 반복한다</p>
