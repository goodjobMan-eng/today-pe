<h1>스페이스 배틀 (우주선 파괴 게임)</h1>
<p>1) 양 구역 후방에 훌라후프 3개를 두고 안에 콘을 세운 뒤 중앙선에 피구공을 배치한다. 2) 신호가 나면 공을 확보해 상대 진영의 콘을 던지거나 굴려서 모두 쓰러뜨리면 승리한다. 3) 상대 진영으로 넘어가면 태그당해 얼어붙으며, 동료가 손을 잡고 무사히 귀환시키면 해제된다.</p>
