<h1>지속주 포인트 레이스 (라 쿠르스 오 푸앙)</h1>
<p>1) 핸드볼 코트(대각선·직선·가로선) 모서리에 4개의 콘을 설치한다. 2) 3분, 6분, 9분 중 정해진 시간 동안 달린다. 3) 전속력으로 대각선을 달리면 3점, 긴 직선을 가볍게 조깅하면 2점, 짧은 가로폭을 걸으면 1점을 획득한다. 4) 짝 학생은 대기하면서 주자의 이동 경로를 관찰하고 기록지에 점수를 기록한다. 5) 교사는 30초마다 남은 시간을 안내하며, 시간이 종료되면 짝과 역할을 바꾼다.</p>
