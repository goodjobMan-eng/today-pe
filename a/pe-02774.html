<h1>매트운동 뒷구르기 기초 동작</h1>
<p>1) 부상을 예방하기 위해 손목 스트레칭을 충분히 실시한다. 2) 팔을 어깨 뒤쪽으로 넘겨 손바닥이 매트를 향하도록 준비 자세를 잡는다. 3) 무릎을 가슴 쪽으로 당겨 웅크린 상태로 허리를 둥글게 말며 엉덩이부터 뒤로 구른다. 4) 발로 바닥을 차고 손으로 매트를 밀어내며 회전한 뒤 안전하게 네 발 또는 두 발로 착지한다.</p>
