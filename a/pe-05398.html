<h1>패러슈트 썰매</h1>
<p>1) 전체를 두 모둠으로 나누고 각 모둠에서 썰매 끄는 사람 2명을 정하며 나머지 모둠원은 둘로 나뉘어 경기장 양쪽 끝에 자리 잡는다2) 썰매 타는 사람이 패러슈트 위에 앉아 팽팽하게 당겨 잡으면 끄는 사람은 앞으로 잡아당기며 썰매를 끈다3) 반대편 도착선을 통과하면 앉았던 사람만 다음 모둠원으로 바꾸어 릴레이를 이어간다4) 마지막 모둠원이 가장 먼저 도착하는 모둠이 승리한다</p>
