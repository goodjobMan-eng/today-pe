<h1>티슈 떨어뜨리지 말고 달리는 술래잡기</h1>
<p>1) 정해진 사각형 코트 안에서 술래 2명을 지정하고 술래는 팀조끼를 착용합니다. 2) 모든 참가자는 티슈(또는 손수건)를 가슴이나 배에 대고, 손을 쓰지 않고 달리는 바람의 저항으로 티슈가 떨어지지 않도록 계속 달립니다. 3) 티슈가 바닥에 떨어진 사람은 그 자리에서 5초 동안 멈춰 있다가 다시 주워 달릴 수 있습니다. 4) 술래에게 태그를 당한 참가자는 코트 밖으로 탈락합니다.</p>
