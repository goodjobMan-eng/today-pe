<h1>뜀틀 기초 말뛰기(등 짚고 뛰어넘기) 놀이</h1>
<p>1) 2인 1조로 한 사람은 매트 위에서 말이 되고, 다른 사람은 뒤에서 달려와 뛰어넘을 준비를 합니다. 2) 말의 양쪽 등이나 옆구리 부근에 손을 짚고 양발로 힘차게 발을 구르며 점프합니다. 3) 다리를 양옆으로 벌려 말을 안전하게 넘은 뒤 짚었던 손을 밀어내며 두 발로 안정되게 착지합니다. 4) 1단계 무릎 꿇기, 2단계 엎드리기, 3~5단계 서서 숙이기 순으로 난이도를 높여 가며 연속 넘기에 도전합니다.</p>
