<h1>책을 활용한 리듬 스텝 놀이</h1>
<p>1) 바닥에 동화책 2권을 나란히 내려놓고 책 앞에 바르게 선다. 2) 첫 번째 단계로 16박자 동안 두 번씩 번갈아 가며 발로 책을 터치하는 스텝을 실시한다. 3) 두 번째 단계로 16박자 동안 한 번씩 번갈아 가며 책을 터치하고, 세 번째 단계로 양발을 번갈아 책 위에 올렸다 내리는 스텝을 진행한다. 4) 네 번째 단계로 발을 사선으로 두고 점프하며 양발을 번갈아 뛰어 책을 터치하는 고난도 스텝을 실시한다.</p>
