<h1>포스퀘어 기본 규칙 게임</h1>
<p>1) 코트를 1, 2, 3번과 빅베어 구역으로 나누고, 서버(빅베어)는 서비스 라인 한 발 뒤에서 서브한다. 2) 공은 각 구역 안에서 반드시 한 번만 바운드되어야 하며, 머무르거나 잡지 않고 손으로 쳐서 넘긴다. 3) 실수를 한 플레이어는 아웃되어 코트 밖 대기 줄로 이동하고 나머지 인원이 높은 번호 칸으로 순환해 올라간다. 4) 판정 논쟁이 생기면 빅베어가 결정하거나 가위바위보로 해결한다.</p>
