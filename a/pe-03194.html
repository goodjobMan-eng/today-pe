<h1>방향별 기초 발차기 활동</h1>
<p>1) 한쪽 다리의 무릎을 들어 발을 앞으로 쭉 뻗으며 앞으로 차기를 한다. 2) 한쪽 다리의 무릎을 들어 시선을 뒤쪽으로 돌리면서 뒤로 차기를 한다. 3) 정면을 보고 섰다가 오른쪽으로 90도 돌아서 발의 옆날로 오른쪽 차기를 한다. 4) 정면을 보고 섰다가 왼쪽으로 90도 돌아서 발의 옆날로 왼쪽 차기를 한다.</p>
