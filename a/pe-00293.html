<h1>혼자 왔어요 (의자 원형 인원수 구호 놀이)</h1>
<p>1) 의자를 둥글게 원형으로 배치하고 모두 자리에 앉아 시작합니다. 2) 시작하는 사람부터 순서대로 1명, 2명, 3명, 4명, 3명, 2명, 1명 순으로 일어나며 인원수에 맞는 구호를 외칩니다. 3) 1명이 외친 후에는 '모두 왔어요' 구호와 함께 전원이 동시에 일어났다가 다시 앉습니다. 4) 자기 차례나 인원수에 맞지 않게 일어나거나 구호를 외치지 못하면 탈락하여 벌칙을 받습니다.</p>
