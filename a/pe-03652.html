<h1>연결 줄넘기 7단계 도전</h1>
<p>1) 자신이 수행할 7가지 줄넘기 동작과 순서를 계획하여 정한다. 2) 1단계부터 모아 뛰기 15회, 번갈아 뛰기 10회 등 기본 스텝을 수행한다. 3) 이어서 다리벌렸다모아 뛰기 10회, 앞뒤로흔들어 뛰기 8회, 360도 돌며 모아뛰기 등 응용 스텝을 멈추지 않고 연결한다. 4) 엇걸었다풀어 뛰기(또는 엇걸어 뛰기) 5~10회, 2단 뛰기 10~20회 등 고난도 기술까지 총 7단계를 중간에 걸리지 않고 연속으로 완료한다.</p>
