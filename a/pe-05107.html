<h1>4 스팟 운동 챌린지</h1>
<p>1) 종이접시 4개에 1부터 4까지 번호를 적어 사방 4피트 정사각형으로 바닥에 배치한다.2) 중앙에서 한 발을 무릎에 올리는 나무 자세로 균형을 잡고 대기한다.3) 호명되는 번호(1: 점핑잭, 2: 스키점프, 3: 퀵피트, 4: 프리댄스) 접시 뒤로 신속히 이동해 운동한 뒤 중앙으로 복귀한다.</p>
