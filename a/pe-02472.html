<h1>컬볼 놀이</h1>
<p>1) 컬 볼 보드판을 만들고 3명이 한 팀이 된다. 2) 한 명이 3개의 돌(바둑알 또는 병뚜껑)을 한 번씩 사용해 한 팀당 총 9번의 기회를 가진다. 3) 자신의 기회에 보드판 안의 돌들을 맞추거나 내보낼 수 있으며, 아이템 존에 들어가면 아이템 카드를 얻어 사용한다. 4) 마지막으로 돌이 위치한 포인트 존의 점수를 합산해 가장 높은 점수를 획득한 팀이 승리한다.</p>
