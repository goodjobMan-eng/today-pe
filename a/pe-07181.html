<h1>술래 대 전체</h1>
<p>1) 참가자 수만큼 1번부터 번호가 적힌 원마커를 바닥에 무작위로 배치하고 각 주자가 원마커 위에서 출발 대기한다. 2) 중앙의 술래(또는 교사)가 번호 3개를 부르면 해당 번호의 주자들이 반대편을 향해 달린다. 3) 태그당한 주자는 옆쪽 감옥으로 이동하고 살아남은 인원과 잡힌 인원으로 술래와 전체 팀 간의 점수를 집계한다.</p>
