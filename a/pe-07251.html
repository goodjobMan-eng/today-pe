<h1>스쿱으로 3연속 캐치</h1>
<p>1) 양 팀으로 나뉘어 각자 스쿱(라켓)을 하나씩 들고 경기장에 선다. 2) 자기 팀끼리 스쿱을 사용해 공을 패스하고 받는다. 3) 공은 1회 바운드까지 허용되며, 연속으로 3회 패스에 성공하면 1점을 획득하고 상대 팀에게 공격권이 넘어간다.</p>
