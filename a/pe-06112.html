<h1>접시콘 점핑 가위바위보 (달팽이 놀이 변형)</h1>
<p>1) 양 팀 1번 주자가 공을 들고 출발하여 번호가 적힌 접시콘을 점프하며 전진한다.2) 상대 주자와 중간에서 마주치면 멈춰 서서 가위바위보를 한다.3) 진 주자는 공을 들고 자기 팀으로 달려가 다음 주자 손에 전달하고 이긴 주자는 계속 전진한다.</p>
