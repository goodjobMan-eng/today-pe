<h1>매트 뒤구르기 기초 동작 연습</h1>
<p>1) 쪼그려 앉아 양손을 위로 들어 귀 옆 손바닥이 천장을 향하게 준비 자세를 취한다.2) 등을 둥글게 말고 배꼽을 바라보며 뒤로 구른다.3) 매트에 손바닥을 단단히 짚고 바닥을 밀어내며 회전한다.4) 무릎이 아닌 발바닥으로 안정감 있게 착지한다.</p>
