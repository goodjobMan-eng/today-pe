<h1>상어와 피라미(해파리와 바라쿠다) 놀이</h1>
<p>1) 한 명의 술래(상어)를 정하고, 다른 술래(해파리)들에게는 폼롤러(누들)를 지급한다. 2) 상어는 달릴 수 있고, 해파리는 자신의 구역 안에서만 누들로 참가자를 태그할 수 있다. 3) 나머지 참가자들(피라미)은 교사가 지정한 기본 움직임 기술(갤럽 등)을 수행하며 바다 구역을 건너간다. 4) 상어는 참가자의 어깨에서 허리 사이 몸통 부위만을 두 손가락으로 부드럽게 태그해야 한다.</p>
