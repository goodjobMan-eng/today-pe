<h1>뜬 공 트래핑 후 패스 연습</h1>
<p>1) 짝이 손으로 던져주는 뜬 공을 맞이한다.2) 가슴이나 허벅지, 머리로 공의 위력을 흡수하며 발밑에 떨어뜨린다.3) 튀어 오른 공을 발로 침착하게 멈춰 세운다.4) 차기 편한 위치에 공을 둔 뒤 손을 쓰지 않고 발로 짝에게 다시 패스한다.5) 마지막에는 발로만 직접 공을 컨트롤하여 패스하는 단계까지 연습한다.</p>
