<h1>기계체조 예술 포즈 만들기</h1>
<p>1) 시범으로 보여주는 기계체조 예술 포즈를 보고 따라 하거나 자신만의 개성을 더해 포즈를 만든다. 2) 턱과 머리를 높이 들고 손끝부터 발끝까지 온몸을 쭉 뻗으며 손가락, 손목, 머리, 팔꿈치 위치를 신경 써서 표현한다. 3) 자신이 취한 예술 포즈 자세를 흔들리지 않게 3초 동안 유지한다.</p>
