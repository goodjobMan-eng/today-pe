<h1>ET 술래잡기 (ET tag)</h1>
<p>1) 가위바위보 등으로 술래와 도망자를 정한다. 2) 술래가 10을 세는 동안 도망자는 도망간다. 3) 술래에게 터치된 사람은 ET처럼 검지손가락을 내밀고 멈춘다. 4) 다른 도망자가 다가와 검지손가락 끝을 맞대고 함께 소리를 내면 부활하여 다시 도망친다.</p>
