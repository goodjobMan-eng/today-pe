<h1>줄넘기 기술 (Jump Rope Tricks)</h1>
<p>1) 레벨 1 기초 기술로 사이드 스윙과 4회 점프 후 4회 사이드 스윙 패턴을 연습한다2) 뒤로 돌려 뛰기와 한 발로 뛰기 동작을 익힌다3) 시저스 점프, 점핑잭 다리 벌려 뛰기, 360도 회전 점프를 실시한다4) 레벨 2~4 고급 기술로 십자뜨기(크리스크로스), 연속 십자뜨기, 프레첼, 2단 뛰기(더블언더) 및 짝과 손잡이를 바꿔 뛰는 짝 줄넘기를 수행한다</p>
