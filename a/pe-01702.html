<h1>크리스마스 요정 브레인 브레이크 워크아웃</h1>
<p>1) 학생들은 화면이 잘 보이는 자리에 1인당 충분한 안전거리를 확보하고 바로 선다. 2) 화면의 요정 동작을 따라 20초간 제자리 운동을 하고 신호음에 맞춰 동작을 전환한다. 3) 중간에 제시되는 미니게임에서 좌우로 몸을 기울여 눈싸움을 피하거나 제자리 점프를 성공하면 보너스 성공을 얻는다. 4) 공간에 따라 짝과 함께 동작을 맞추거나 동작 강도를 조절하여 변형할 수 있다.</p>
