<h1>철봉 제비 자세 중심잡기 놀이</h1>
<p>1) 철봉 위로 뛰어올라 팔을 곧게 펴서 몸을 지탱하는 기본 버티기를 준비합니다. 2) 팔을 편 상태에서 등과 다리가 일직선이 되도록 몸을 곧게 폅니다. 3) 시선은 바닥이 아닌 정면을 바라보며 골반(허벅지 부근)으로 중심을 잡습니다. 4) 중심이 안정되면 몸을 점차 앞으로 기울여 제비 형태를 만들고 잠시 손을 떼는 도전도 시도해 봅니다.</p>
