<h1>지휘자 찾기 놀이</h1>
<p>1) 학생들이 둥글게 원을 지어 앉고, 원 밖으로 나간 한 명의 술래를 제외한 학생들 중 한 명의 '지휘자'를 비밀리에 정한다. 2) 술래가 원 중앙에서 관찰하는 동안 지휘자가 특정 동작을 시작하면 원에 앉은 나머지 학생들이 눈치채지 못하게 따라 한다. 3) 술래는 동작을 주도하고 있는 지휘자가 누구인지 관찰하여 찾아낸다. 4) 지휘자의 동작 크기를 작게 하거나 이동하면서 진행하는 방식으로 난이도를 높일 수 있다.</p>
