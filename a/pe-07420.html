<h1>농구 코트 라인 드리블</h1>
<p>1) 학생들은 농구공을 1개씩 들고 중앙 원(센터 서클)에 모인다. 2) 코트 안을 자유롭게 달리며 동시에 제자리 및 이동 드리블을 연습한다. 3) 교사의 안내에 따라 코트의 빨간색 선, 골 밑 제한구역(라켓/페인트 존), 3점 라인, 중앙선(하프라인)의 명칭과 위치를 확인하며 해당 구역으로 이동한다. 4) 신호가 울리면 공을 멈추고 다리 사이로 공을 통과시키며 대기한다.</p>
