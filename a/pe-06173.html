<p>1) 대기자는 파란 선 뒤에 번호 순서대로 앉아 있고, 투구자는 원마커 출발선으로 이동한다.2) 콘으로 표시된 투구선 뒤에서 허리를 숙여 적당한 빠르기로 공을 굴려 핀을 쓰러뜨린다.3) 투구 후에는 쓰러진 핀을 레인 뒤편으로 치우고, 공을 챙겨서 반드시 레인 바깥 옆쪽으로 돌아 나온다.4) 다음 라운드 준비 시 1인당 1개씩 초록색 점 스티커 위에 핀을 세우고 순서대로 앉는다.</p>
