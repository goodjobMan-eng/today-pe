<h1>링고(Ringo)</h1>
<p>1) 학급을 두 팀으로 나누고 각 팀은 링고 마스터와 링고 투수를 정합니다. 2) 링고 마스터는 상자 옆에, 링고 투수는 상대 팀 구역 상자 옆에 위치합니다. 3) 시작 신호와 함께 투수가 공을 던지면, 팀원들은 공을 패스하여 마스터에게 전달하고 마스터는 공을 상자에 넣습니다.</p>
