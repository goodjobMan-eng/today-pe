<h1>핀업 핀다운 볼링핀 피구</h1>
<p>1) 각자 자신의 볼링핀을 코트 자기 진영 원하는 곳에 세우고 공으로부터 지킨다. 2) 상대가 던진 공에 자신의 핀이 쓰러지면 핀을 들고 반대편 벽(상대 진영 뒤쪽)으로 이동한다. 3) 반대편 벽에서 공을 잡아 상대 팀 핀을 뒤쪽에서 맞춰 쓰러뜨리면 다시 자기 팀 진영으로 복귀한다.</p>
