<h1>매복 훌라후프 킥 태그 놀이</h1>
<p>1) 경기 구역 안에 술래(공격자) 소수와 도망자들을 배치하고, 술래들은 바닥에 놓인 훌라후프를 하나씩 배정받습니다. 2) 신호가 울리면 술래들은 발로 훌라후프를 차서 밀며 도망자들의 발을 맞히러 이동합니다. 3) 발에 훌라후프가 닿은 도망자는 경기장 외곽을 한 바퀴 돌고 복귀하거나 아웃되어 대기합니다. 4) 플로어하키 스틱과 퍽을 사용하거나 폼볼을 굴리는 방식으로 도구를 변형하여 진행할 수 있습니다.</p>
