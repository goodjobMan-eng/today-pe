<h1>쏘리 (비치볼 맞히기 타깃 피구 게임)</h1>
<p>1) 학급을 두 팀으로 나누고 중앙선을 넘어가지 않도록 자기 진영에 배치한다. 2) 상대 진영의 받침대(스티 티) 위에 올려진 비치볼을 향해 폼볼을 던져 떨어뜨린다. 3) 상대의 비치볼을 떨어뜨리면 보드게임처럼 &quot;쏘리(Sorry)!&quot;라고 외친다. 4) 자기 진영의 비치볼이 떨어지면 수비 선수가 즉시 받침대 위에 다시 올려놓으며 경기를 이어간다.</p>
