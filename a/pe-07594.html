<h1>호주 원형 게임(CÍRCULO AUSTRALIANO)</h1>
<p>1) 참가자들은 원형으로 서서 한 공을 오른쪽 사람에게 건네지 않고 던져서 패스하며 떨어뜨리지 않고 한 바퀴를 돌립니다. 2) 원 중앙에 술래가 위치하며 두 번째 공(주황색 공)을 원형의 참가자 중 한 명에게 던지고 다시 돌려받습니다. 3) 중앙의 술래는 두 공 중 하나가 바닥에 떨어지도록 유도하며 공을 떨어뜨린 사람이 중앙의 술래가 됩니다.</p>
