<h1>디스파라 볼라 (야구형 패스 게임)</h1>
<p>1) 네 개의 매트(또는 콘)로 베이스를 설치하고 타격 팀과 수비 팀으로 나눈다. 2) 투수가 공을 던지면 타자가 야구 배트로 공을 치고 베이스를 차례로 돈다. 3) 타자가 모든 베이스를 돌아 홈으로 들어오면 타격 팀이 1점을 획득한다. 4) 수비 팀은 타구된 공을 잡아 수비수 간에 5번 패스를 성공시키면 주자를 아웃시킬 수 있으며, 5번 패스 전 주자가 최종 베이스에 도착하면 득점이 인정된다.</p>
