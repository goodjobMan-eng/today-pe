<h1>공 차기 1·2차시 활동</h1>
<p>1) 공 옆에 놓인 원마커를 디딤발로 밟고 발 안쪽으로 공을 찬다.2) 좁은 원마커 사이를 통과하도록 마주 보고 발 안쪽 패스를 약 10회 연습한다.3) 마주 본 거리를 더 벌려 멀리서 발등으로 공을 차는 연습을 한다.4) 양쪽 위치를 서로 바꾸어 역할을 교대하며 반복 연습한다.</p>
