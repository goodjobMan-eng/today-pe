<h1>협동 업앤다운 변형 발야구</h1>
<p>1) 공격팀은 4인 모둠 단위로 구성하고 수비팀은 전원 외야 및 내야 필드에 자유롭게 위치를 잡는다. 2) 키커가 공을 차면 모둠 4명이 동시에 베이스를 돌고, 수비는 포구한 학생 뒤로 일렬로 정렬한다. 3) 수비팀은 정렬 후 공을 머리 위와 다리 아래로 번갈아 전달(업앤다운)하고 마지막 주자가 홈으로 달린다. 4) 공격의 마지막 4번 주자가 수비 최종 주자의 홈 터치보다 먼저 홈(또는 루)에 도달하면 득점한다.</p>
