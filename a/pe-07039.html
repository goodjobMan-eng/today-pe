<h1>스쿼트 앤 래더</h1>
<p>1) 종이컵을 일렬로 세워 사다리 형태의 러닝 코스를 만든다. 2) 첫 번째 주자가 컵 사이를 달리는 래더 런을 시작한다. 3) 짝은 제자리에서 발을 어깨너비보다 약간 넓게 벌리고 엉덩이를 무릎 높이까지 낮췄다 일어서는 올바른 스쿼트 동작을 반복한다. 4) 래더 런 주자가 돌아오면 역할을 교대하여 3분 동안 쉬지 않고 이어간다.</p>
