<h1>부상 예방 하체 스트레칭</h1>
<p>1) 한쪽 다리를 펴고 반대쪽을 구부려 엉덩이를 뒤로 밀며 무릎을 누르고 발등을 몸 쪽으로 당겨 10초간 유지한다. 2) 한쪽으로 앉아 반대쪽 다리를 뻗고 발끝을 몸 쪽으로 당겨 하체 근육을 늘려준다. 3) 한쪽 다리를 들어 올려 양손으로 감싸 쥐고 가슴 쪽으로 당겨 중심을 잡는다. 4) 한쪽 다리를 뒤로 접어 손으로 발등을 잡고 뒤꿈치가 엉덩이에 닿도록 당긴 뒤 반대 팔을 뻗어 중심을 잡는다.</p>
