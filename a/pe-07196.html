<h1>공감 가위바위보</h1>
<p>1) 음악에 맞춰 자유롭게 교실을 돌아다닌다. 2) 음악이 멈추면 가장 가까운 친구와 마주 보고 가위바위보를 한다. 3) 가위바위보에서 비긴 두 친구는 손을 잡고 한 팀이 된다. 4) 다시 음악이 흐르면 함께 돌아다니다가 음악이 멈추면 다른 무리와 가위바위보를 하여 비기면 손을 합친다.</p>
