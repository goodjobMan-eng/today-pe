<h1>얼티미트 프리스비 규칙</h1>
<p>1) 양 팀 각 7명이 양쪽 엔드존에 서서 시작하며 수비 팀이 디스크를 던져 경기를 개시한다 2) 디스크를 가진 선수는 달릴 수 없으며 패스로만 전진한다 3) 상대 엔드존 안에서 팀원의 패스를 받으면 1점을 득점한다 4) 디스크가 땅에 떨어지거나 가로채이면 공격권이 상대 팀으로 넘어간다</p>
