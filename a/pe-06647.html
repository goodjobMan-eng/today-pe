<h1>3인 1팀 다트 카운트업 게임</h1>
<p>1) 3명이 한 팀을 이루고 투구선(2m 뒤)에 순서대로 대기한다. 2) 한 명씩 번갈아 가며 1인당 다트 3발을 목표 보드를 향해 던진다. 3) 다트가 명중한 점수를 합산하여 팀 누적 점수에 반영한다. 4) 총 8라운드 동안 팀원들이 순서대로 다트를 던지며 점수를 쌓는다. 5) 8라운드 종료 후 팀 합산 누적 점수가 가장 높은 팀이 승리한다.</p>
