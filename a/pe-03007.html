<h1>기초 타바타 운동 (팔굽혀펴기, 크런치, 앉아 윗몸 앞으로 굽히기, 스쿼트)</h1>
<p>1) 팔굽혀펴기를 실시하며 여학생은 무릎을 대거나 펴고 남학생은 무릎을 굽히지 않고 어깨보다 약간 넓게 팔을 벌려 충분히 내려갑니다. 2) 크런치는 누워서 무릎을 들고 손을 배 위에 얹은 채 상체를 들어 올리며 숨을 내쉽니다. 3) 앉아 윗몸 앞으로 굽히기는 앉은 채로 상체를 굽혀 발끝을 잡고 10초간 버팁니다. 4) 스쿼트는 엉덩이를 뒤로 빼며 무릎이 직각이 되도록 앉았다가 일어납니다.</p>
