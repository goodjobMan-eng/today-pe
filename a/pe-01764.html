<h1>진로 직업 선택 양자택일 워밍업 타바타</h1>
<p>1) 화면에 두 가지 직업 선택지(소방관 vs 사진작가, 군인 vs 교사 등)가 나오면 마음에 드는 직업을 고릅니다. 2) 몇 초 뒤 각 직업 아래에 지정된 운동 동작(점핑잭, 런지, 스쿼트 등)이 나타납니다. 3) 자신이 선택한 직업 밑의 운동을 30초 동안 활기차게 따라 합니다. 4) 라운드가 끝날 때마다 잠시 숨을 고르고, 새로운 직업 선택지에 맞춰 다양한 유산소·근력 동작을 수행합니다.</p>
