<h1>농구 바운드 패스와 오버헤드 패스 연습</h1>
<p>1) 바운드 패스는 체스트 패스와 동일한 자세로 공을 잡아 바닥 전체 거리의 3분의 2 지점에 튕겨 동료에게 전달한다. 2) 오버헤드 패스는 양손으로 공을 머리 위로 들어 올리고 허리 반동과 어깨, 손목 스냅을 이용해 수비수 머리 너머로 전달한다. 3) 수비수가 가까이 붙었을 때는 바운드 패스를, 수비수의 방어벽을 넘겨야 할 때는 오버헤드 패스를 상황에 맞춰 실습한다.</p>
