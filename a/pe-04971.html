<h1>원형 서서 공 돌리기 저글링</h1>
<p>1) 4~6명이 둥글게 모여 서서 각자 공을 한 손에 든다.2) 신호에 맞춰 오른쪽이나 왼쪽 사람에게 공을 동시에 던져 패스하고 받는다.3) 바운드 패스나 한 사람 건너뛰기, 한 바퀴 회전하고 잡기 등 난이도를 높여가며 공을 떨어뜨리지 않고 이어간다.</p>
