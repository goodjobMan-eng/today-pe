<h1>지구력 달리기 게임 모음</h1>
<p>1) 30~50m 거리에 콘을 설치하고 모둠 첫 주자가 콘을 돌아오며 다음 팀원을 데려와 함께 달린다. 2) 모둠 전원이 함께 돈 후 먼저 뛴 선수부터 차례로 빠지며 마지막 주자가 혼자 들어오면 완주한다. 3) 가장 먼저 전원 완주하여 자리에 앉는 모둠이 승리한다.</p>
