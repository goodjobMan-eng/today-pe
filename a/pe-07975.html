<h1>여러 가지 주제를 창작 무용으로 표현하기</h1>
<p>1) 친구들과 함께 공감할 수 있는 주제(계절, 학교생활, 이야기 등)를 정한다. 2) 선정한 주제에 어울리는 상황이나 이야기를 4가지 정도로 나눈다. 3) 표현 요소와 표현 방법을 활용하여 크고 작게, 빠르고 느리게, 반복 등의 동작을 다양하게 구성한다. 4) 매끄럽게 이어지도록 연습한 후 친구들 앞에서 작품을 발표하고 감상한다. 5) 수업 후 많이 사용한 신체 부위를 스트레칭하며 정리운동을 한다.</p>
