<h1>롤리팝 패들 배틀</h1>
<p>1) 가운데 기준선을 두고 양 팀 진영에 원통이나 볼링핀을 9~10개씩 세웁니다. 2) 시작 신호가 나면 스펀지 패들로 바닥에 있는 공이나 손에서 띄운 공을 쳐서 상대편 핀을향해 보냅니다. 3) 상대 팀의 핀을 쓰러뜨리면 그 핀을 직접 가져와 자기 팀 선 위에 세웁니다.</p>
