<h1>출동 유괴단 PJ 마스크 힐링 요가</h1>
<p>1) 개인 활동 공간을 확보하고 편안한 마음으로 서서 준비 자세를 취한다. 2) 캣보이, 올빼미아, 도마뱀 등 화면 속 캐릭터의 요가 스트레칭 동작을 확인한다. 3) 30초 타이머 동안 깊은 심호흡과 함께 자세를 멈춰 유지하고 지시에 따라 좌우 방향을 바꾼다. 4) 선 자세 균형, 앉아 다리 펴기, 코브라 자세 등 다양한 동작으로 전신 근육을 고르게 이완한다.</p>
