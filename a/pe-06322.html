<h1>트레저 헌트 체력 미션 놀이</h1>
<p>1) 바닥에 점수나 운동 과제가 뒷면에 적힌 종이들을 여러 장 깔아 둔다.2) 음악이 나오면 종이 위만 밟으며 걷거나 모둠발·한 발 점프로 이동한다.3) 음악이 멈추면 그 자리에 그대로 멈추고 밟고 있던 종이를 뒤집는다.4) 종이에 점수가 적혀 있으면 점수를 획득하고, 운동 과제(팔벌려뛰기 10회, 제자리조깅 20회 등)가 적혀 있으면 해당 동작을 수행한다.</p>
