<h1>매트 운동 다리 벌려 앞구르기(개각전전)</h1>
<p>1) 체육관 매트를 여러 장 깔고 매트 앞에 섭니다. 2) 양손을 매트에 짚고 머리 뒤쪽을 대며 큰 앞구르기로 회전을 시작합니다. 3) 발이 얼굴 위를 통과하는 순간 양다리를 좌우로 넓게 벌리고, 양손을 가랑이 사이 몸 가까운 매트에 짚어 바닥을 강하게 밀어냅니다. 4) 상체를 앞으로 숙이며 반동을 이어받아 다리를 벌린 채 일어섭니다.</p>
