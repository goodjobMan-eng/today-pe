<h1>컵 쌓기 하키 챌린지</h1>
<p>1) 출발선에서 6~8피트 거리에 플라스틱 컵 4개를 1~1.5피트 간격으로 배치한다. 2) 출발선에서 하키 스틱(또는 빗자루)으로 양말공을 쳐서 컵을 맞힌다. 3) 컵을 맞히면 달려가 그 컵을 다른 컵 위에 포개어 쌓고, 양말공을 하키 스틱으로 드리블하여 출발선으로 돌아온다. 4) 1분 동안 같은 방식으로 샷과 드리블을 반복하여 마지막 컵까지 모두 포개어 쌓는다.</p>
