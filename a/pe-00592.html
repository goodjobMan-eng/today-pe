<h1>매트 운동 놀이 - 벽 타기 물구나무서기</h1>
<p>1) 벽을 등지고 매트 위에 엎드려 양손을 바닥에 짚고 발을 벽에 올립니다. 2) 발로 벽을 한 걸음씩 걸어 올라가면서 손도 벽 쪽으로 차근차근 좁혀 들어갑니다. 3) 시선은 양손 사이의 매트를 응시하며 배가 벽에 가까워질 때까지 몸을 폅니다. 4) 벽과 몸이 나란히 설 수 있는 위치까지 도전한 후 손과 발을 되짚어 안전하게 내려옵니다.</p>
