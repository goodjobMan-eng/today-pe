<h1>플디 콘 명중 틱택토 놀이</h1>
<p>1) 3x3 배열로 거꾸로 세운 라바콘 9개를 표적으로 배치하고 출발선에 모둠별 플라잉디스크와 숫자컵을 준비한다. 2) 신호가 울리면 출발선에서 플라잉디스크를 날려 라바콘 표적을 직접 맞힌다. 3) 디스크로 콘을 맞힌 학생은 달려가 해당 콘 위에 자기 팀 색깔의 컵을 씌우고 가로·세로·대각선 3칸을 먼저 완성하면 득점한다. 4) 던진 디스크를 주워 다음 주자에게 빠르게 넘겨주는 릴레이 스피드 대결 방식으로 변형하여 진행한다.</p>
