<h1>럭비형 게임</h1>
<p>1) 두 모둠으로 나누고 참가자는 허리 양쪽에 모둠 조끼를 하나씩 끼운 후 각자 시작선에 정렬한다.2) 게임이 시작되면 공격 모둠은 가랑이 사이로 공을 뒤로 전달하며 경기를 시작한다.3) 공격팀이 이동하는 순간 수비는 태그나 공 뺏기를 시도하며, 꼬리나 공을 뺏기면 그 자리에서 뒤로 패스하여 다시 시작한다.4) 5번 저지당하면 공격권이 바뀌며, 상대 득점 구역에 들어가 바닥에 공을 태그하면 1점을 획득한다.</p>
