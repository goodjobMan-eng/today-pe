<h1>철봉 전방 지지 회전(공중 앞으로 돌기) 4가지 요령</h1>
<p>1) 지지 자세에서 다리를 흔들어 반동을 붙이고 등을 편 채 머리를 멀리 빠르게 크게 회전한다. 2) 철봉 바로 아래까지는 손을 세게 쥐지 않고 가볍게 쥐다 후반에 다시 세게 쥔다. 3) 철봉을 넘은 후반에는 턱을 당겨 등을 둥글게 말고 팔꿈치를 가볍게 굽혀 작게 회전한다. 4) 배꼽(골반 부근)이 철봉에서 떨어지지 않도록 밀착하며 지지 자세로 돌아온다.</p>
