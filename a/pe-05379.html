<h1>트랩 볼 (Trapp Ball) 캐치 앤 월 게임</h1>
<p>1) 양손으로 트랩 라켓 손잡이를 벌려 공을 위로 띄운 뒤 다시 라켓을 오므려 잡는다.2) 언더핸드 방식과 오버헤드 방식으로 번갈아 띄워 잡는 연습을 한다.3) 벽을 향해 공을 쏘아 튕겨 나온 공을 노바운드나 원바운드로 잡는다.4) 짝과 마주 서서 공을 주고받으며 패스하고 받는다.5) 벽을 사이에 두고 테니스처럼 벽에 공을 맞혀 번갈아 받아내는 랠리 대결을 펼쳐 득점한다.</p>
