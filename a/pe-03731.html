<h1>공 굴리고 앞구르기 캐치</h1>
<p>1) 매트(또는 이불) 뒤편에 준비 자세를 취하고 공을 전방으로 굴린다. 2) 공이 굴러가는 동안 뒤통수를 대고 앞구르기를 재빠르게 실시한다. 3) 매트에서 일어나 굴러간 공이 멈추거나 떨어지기 전에 양손으로 잡아낸다. 4) (변형) 스스로 공을 굴리거나 발로 살짝 찬 후 앞구르기 하여 잡는다.</p>
