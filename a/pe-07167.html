<h1>훌라 녹아웃 (Hula Knockout)</h1>
<p>1) 2인 1조로 짝을 지어 한 명은 바닥에 훌라후프를 놓고 안에 서고 다른 한 명은 농구공이나 축구공을 가지고 시작한다. 2) 신호가 울리면 공을 가진 사람은 영역 안을 드리블하며 이동한다. 3) 훌라후프 안의 사람은 최소 한 발을 후프 안에 둔 채 지나가는 드리블러의 공을 쳐내 뺏는다. 4) 공을 뺏긴 사람은 공을 찾아와 다시 드리블을 이어가며 몇 분 후 역할을 교대한다.</p>
