<h1>카드 친구 (Zahlenfreunde)</h1>
<p>1) 각자 숫자 카드를 한 장씩 목에 걸거나 손에 쥐고 음악에 맞춰 구역 안을 자유롭게 돌아다닌다. 2) 음악이 멈추면 자리에 멈춰 서서 자신의 카드와 더해(또는 빼서) 목표 숫자(10 또는 15)가 되는 짝을 빠르게 찾는다. 3) 짝을 완성한 학생들은 바깥쪽에 마련된 후프(도착 구역)로 신속히 이동하여 정답을 확인한다.</p>
