<h1>고깔 달리기 및 잡아라 고깔</h1>
<p>1) 중앙선 양 끝에 고깔을 세우고 중앙선에서 마주 본 짝과 가위바위보를 한다. 2) 진 학생은 자기 쪽 고깔(반환점)을 빠르게 돌고 오며, 5번 먼저 이긴 학생이 승리한다. 3) 이어지는 '잡아라 고깔'은 신호 단어가 나오면 뒤쪽 고깔을 집어 들고 달려와 중앙 고깔을 먼저 잡는다.</p>
