<h1>교실 네트 원바운드 캐치 배구</h1>
<p>1) 교실 책상 사이에 긴 줄로 낮은 네트를 설치하고 양 팀 코트 영역을 나눈다. 2) 서브 구역에서 언더핸드로 공을 쳐서 네트 너머 상대 진영으로 원바운드가 되도록 넘긴다. 3) 공이 자기 코트에 반드시 바운드된 후 잡아야 하며, 직접 노바운드로 잡거나 바운드 후 잡지 못하면 실점한다. 4) 최대 3회 이내 패스(세트) 후 상대 진영으로 반격할 수 있으며 공의 종류(몬스터볼, 큰 공, 럭비공)를 바꿔 변형한다.</p>
