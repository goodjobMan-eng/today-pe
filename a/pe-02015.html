<h1>지정하여 차기 발야구형 게임</h1>
<p>1) 모둠을 나눈 후 수비 모둠은 투수와 수비수로 역할을 나눈다. 2) 타자가 공을 차 보낼 영역의 점수를 외친 후 찬다. 3) 공이 해당 영역에 떨어지면 해당하는 점수를 얻는다. 4) 다른 곳에 떨어지거나 수비수가 잡으면 아웃이며, 쓰리 아웃이 되면 공수를 교대하고 3회 동안 점수를 많이 얻는 모둠이 승리한다.</p>
