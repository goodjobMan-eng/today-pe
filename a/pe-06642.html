<h1>배구 세트 챌린지 및 배구 코트의 지휘자</h1>
<p>1) 머리 위에 접시콘을 두고 떨어뜨리지 않으면서 연속 5회 세트한다. 2) 세트한 뒤 원바운드 후 큰 쓰레기 봉투(또는 접시콘) 안에 공을 연속 3회 넣는다. 3) 4인 1조로 골대 앞 학생이 나머지 3명과 순서대로 세트를 주고받은 뒤 마지막 학생이 농구 골대에 공을 넣어 3라운드 중 2라운드를 먼저 이긴 팀이 승리한다.</p>
