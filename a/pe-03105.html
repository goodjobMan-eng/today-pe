<h1>농구형 게임 규칙</h1>
<p>1) 점프볼로 경기를 시작하며, 10분씩 4쿼터 동안 진행한다. 2) 팀당 5명이 경기에 참가하며 수시로 선수를 교체할 수 있다. 3) 3점 슛 라인 밖에서 넣으면 3점, 선 안쪽은 2점, 자유투는 1점을 획득한다. 4) 공을 잡고 세 걸음 이상 걸으면 워킹, 드리블 후 공을 잡고 다시 드리블하면 더블 드리블 반칙이다.</p>
