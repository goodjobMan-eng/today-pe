<h1>다양한 공 저글링 (큰 공 저글링 도전)</h1>
<p>1) 양손에 공을 하나씩 잡고 남은 공 하나는 겨드랑이와 몸통 사이에 끼워 준비 자세를 취한다. 2) 공중에 공을 띄워 던지고 받기를 반복하며 대형 공으로 3구 저글링에 도전한다. 3) 짝 활동 시 한 친구가 공을 공중으로 띄워 넘겨주면 이어받아 3구 저글링을 연속으로 이어간다.</p>
