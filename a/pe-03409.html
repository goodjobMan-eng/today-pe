<h1>안대 기차</h1>
<p>1) 앞사람의 어깨에 양손을 올리고 일렬로 줄을 서서 안대 기차 대형을 만든다. 2) 맨 앞의 길잡이 학생을 제외한 나머지 팀원들은 눈을 감거나 안대를 착용한다. 3) 길잡이의 안내에 따라 쪼그려 앉아 있는 장애물(참가자)과 의자, 책상 등 설치된 장애물 사이를 부딪히지 않고 목적지까지 이동한다. 4) 팀이 목적지에 도착하는 시간을 측정하여 걸린 시간이 더 짧은 팀이 승리한다.</p>
