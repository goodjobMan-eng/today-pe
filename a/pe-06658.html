<h1>교실 미니 피구 가가볼</h1>
<p>1) 책상으로 정사각형 경기장을 만들고 4~8명이 들어가 손을 책상에 올리고 준비한다. 2) 신호와 함께 공을 중앙에 던져 바닥에 3번 튄 후 게임을 시작한다. 3) 공은 손으로만 쳐서 상대방의 허리 아래를 맞히며, 맞은 사람은 경기장 밖으로 퇴장한다. 4) 공을 연속 2번 터치하거나 자신이 친 공이 밖으로 나가면 아웃되며, 마지막까지 남은 1명이 승리한다.</p>
