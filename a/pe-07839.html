<h1>형태를 찾아라!</h1>
<p>1) 학생들은 원 대형으로 서고 원 중앙에 가장 큰 물건(농구공 등)을 놓는다. 2) 학생들은 서로의 몸이 닿지 않도록 주의하며 협동하여 중앙의 물건을 터치한다. 3) 신체 접촉 없이 성공하면 점차 작은 크기의 물건(테니스공, 동전 등)으로 교체하여 도전한다. 4) 중앙의 물건을 향해 움직이다가 학생끼리 몸이 닿으면 처음부터 다시 시작한다.</p>
