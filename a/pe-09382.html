<h1>체육관 순환 운동</h1>
<p>1) 매트에서 벽에 발을 대고 물구나무서기를 한다. 2) 화면을 보며 터치 패널로 건강한 음식을 분류한다. 3) 기둥 사이를 지그재그로 달린다. 4) 매트 위에서 백팩(모래주머니)을 들고 운동한다. 5) 파란색 모듈 블록 위를 건너간다. 6) 통에 공을 던져 넣는다. 7) 바닥에 앉아 줄을 당겨 타이어를 끌어온다. 8) 노란색 단상 위를 오르내린다.</p>
