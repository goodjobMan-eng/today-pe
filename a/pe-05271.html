<h1>고질라 어린이 타바타 운동 놀이</h1>
<p>1) 고질라를 피해 제자리 달리기를 하다가 지시에 따라 점핑잭과 자전거 타기 동작을 한다.2) 프리즈 신호가 나오면 즉시 동작을 멈추고 얼음 자세를 유지한다.3) 발로 밟히지 않게 구르거나 점프하고 마지막에는 킹콩과 고질라 중 선택하여 해당 운동을 수행한다.</p>
