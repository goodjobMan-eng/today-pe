<h1>풍선 활용 배구 언더·오버 패스 연습</h1>
<p>1) 양손 손가락을 포개고 엄지를 나란히 모아 손목 위 평평한 부위로 공을 받는 언더패스 자세를 취한다 2) 무릎을 굽혔다 펴는 반동을 이용해 팔꿈치를 편 채 팔이 수평이 되는 지점까지만 들어 올려 낮은 공을 받아 올린다 3) 이마 위에서 엄지와 검지로 삼각형(삼각김밥 모양)을 만든다 4) 날아오는 공을 확인하며 무릎 반동과 함께 손목과 팔을 위로 뻗어 높은 공을 밀어 올린다.</p>
