<h1>단계별 딱지치기 릴레이와 맞대결</h1>
<p>1) 1단계는 바닥에 딱지 4장을 놓고 1장으로 10번 안에 4장을 모두 넘기는 개인 도전을 진행한다. 2) 2단계는 팀별로 바닥에 놓인 딱지 15장을 차례대로 쳐서 연속 두 번 넘기면 딱지를 획득하는 릴레이를 진행한다. 3) 3단계는 각자 획득한 딱지를 가지고 1대1로 마주 보며 두 번 연속 넘겨 따내는 방식으로 대결한다.</p>
