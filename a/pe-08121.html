<h1>공룡 태그 축구 게임</h1>
<p>1) 콘으로 사각 구역을 만든 후 2인 1조마다 작은 삼각 구역을 콘으로 배치한다. 2) 짝 중 한 명은 공룡(술래), 한 명은 레인저가 되어 공을 각자 드리블한다. 3) 삼각형 주변을 돌며 공룡이 레인저를 태그하면 역할을 바꾸거나 1분 후 교대한다.</p>
