<h1>브렌발 (Brennball)</h1>
<p>1) 경기장 둘레에 4개의 베이스 콘 또는 후프를 놓고 수비수의 캐치존을 표시한다 2) 공격 팀 1번 주자가 테니스공을 경기장 안으로 던지고 베이스를 향해 달린다 3) 수비 팀이 공을 잡아 캐치존의 선수에게 던져 캐치존에 공이 도착하기 전에 주자는 베이스에 안착해야 한다 4) 공이 캐치존에 들어왔을 때 베이스 사이에 멈춰선 주자는 아웃되며 8분 후 공격과 수비를 교대한다</p>
