<h1>트릭 오어 트릿 태그</h1>
<p>1) 주황색 공을 든 술래들이 도망치는 학생들을 태그하러 다닌다. 2) 태그를 당하지 않으려면 집(벽면 구역)에 있는 학생에게 찾아간다. 3) 주사위를 굴려 나온 눈의 수만큼 지정된 운동(베리 줍기 등)을 수행한다.</p>
