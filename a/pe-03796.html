<h1>종이 배구공 언더핸드 토스 챌린지</h1>
<p>1) 종이 3장을 뭉치고 겹쳐 감싸서 종이 배구공을 만든다. 2) 발을 앞뒤로 벌리는 시저 점프를 1회 뛴다. 3) 한 손으로 종이공을 언더핸드로 위로 던진다. 4) 두 손을 모아 언더핸드 범프 자세를 만들고 전완(팔뚝)으로 쳐올린 뒤 바로 잡으면 1점을 얻으며, 1분 동안 반복한다.</p>
