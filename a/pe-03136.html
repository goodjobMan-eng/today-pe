<h1>협응성 기르기 운동</h1>
<p>1) 패드민턴 채로 셔틀콕을 위로 튀기며 떨어지지 않도록 한다. 2) 튀어 오르는 공을 손바닥으로 가볍게 누르며 연속으로 튀긴다. 3) 발로 공을 몰면서 접시콘 사이를 통과한다. 4) 친구와 마주 보고 서서 스쿠프로 공을 던지고 받거나 바닥에 한 번 튕겨 주고받는다.</p>
