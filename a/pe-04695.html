<h1>그린 머신 재활용 릴레이</h1>
<p>1) 스쿠터보드 6개 위에 매트를 올려 팀 우주선(배)을 만든다. 2) 체육관 중앙에 색상별 미니콘을 모아 두고 가장자리에 색상이 일치하는 훌라후프를 배치한다. 3) 모둠별로 배를 타고 이동하여 중앙에서 한 번에 한 개의 콘을 집는다. 4) 집어 온 콘을 같은 색상의 훌라후프에 분리수거하여 중앙의 모든 쓰레기를 빠르게 치운다.</p>
