<h1>가정형 신체활동 루틴(DAY-22)</h1>
<p>1) 양팔과 다리를 넓게 벌리며 높게 점프하는 양팔 벌려 뛰기를 한다. 2) 다리를 앞뒤로 교차해 점프한 뒤 와이드 스쿼트를 실시한다. 3) 한쪽 발을 올리고 스쿼트 자세로 점프하며 옆으로 이동한다. 4) 한 발로 앞뒤 좌우 원마커를 순서대로 점프하는 크로스 호핑을 반복한다.</p>
