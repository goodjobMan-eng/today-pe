<h1>패스 야구</h1>
<p>1) 홈플레이트와 1루, 2루에 선수를 배치하고 시작한다. 2) 홈의 선수가 1루로 공을 던지고 비어 있는 3루로 이동한다. 3) 1루 선수는 2루로 공을 던지고 비어 있는 홈으로 이동하며, 2루 선수는 3루로 공을 던지고 비어 있는 1루로 이동한다. 4) 정해진 시간 동안 홈플레이트를 밟은 횟수가 많은 팀이 승리한다.</p>
