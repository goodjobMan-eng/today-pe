<h1>저글링 양손 번갈아 대각 띄우기</h1>
<p>1) 주로 사용하는 손으로 공 하나를 들고 대각 띄우기를 양손 각각 연습한다. 2) 공 두 개를 양손에 들고 주로 사용하는 손으로 먼저 던져 반대 손의 원래 공 앞쪽으로 잡는 연습을 반복한다. 3) 공 3개(주로 쓰는 손 2개, 반대 손 1개)를 들고 번갈아가며 대각 띄우기를 진행한다. 4) 1분 동안 정해진 난이도의 대각 띄우기를 수행하는 방식으로 총 8라운드 동안 기록에 도전한다.</p>
