<h1>균형잡기 다리 건너기 놀이</h1>
<p>1) 출발선과 도착선을 설정하고 끝에 징검다리로 쓸 원마커를 놓아 준비한다. 2) 다리를 건너는 사람은 원마커 위에서 한 발로 균형을 잡고, 팀원이 놓아주는 원마커를 밟으며 앞으로 나아간다. 3) 다리를 놓아주는 사람은 출발선에서 가져온 원마커를 한 번에 한 개씩만 옮겨 놓아준다. 4) 도착선에 도착하면 역할을 바꾸어 출발 지점으로 먼저 되돌아오는 팀이 승리한다.</p>
