<h1>달리기 피치(발 회전) 높이기 훈련</h1>
<p>1) 마커를 신발 세 켤레 길이 간격으로 일렬로 배치합니다.2) 첫발은 몸에서 멀어지지 않게 몸과 가까운 위치에 딛고 출발합니다.3) 다섯 번째 마커 부근까지는 상체를 세우지 않고 낮은 자세를 유지하며 달립니다.4) 속도가 붙으면 상체를 세우고 양팔을 힘차게 흔듭니다.5) 깡통을 위에서 밟아 찌그러뜨리듯 앞꿈치로 지면을 강하게 차며 마커 사이를 통과합니다.</p>
