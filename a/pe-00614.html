<h1>철봉 지지 회전 뒤돌기(후방 지지 회전) 연습</h1>
<p>1) 철봉 아래에 안전 매트를 설치하고, 철봉을 두 손으로 짚고 지지한 상태로 섭니다. 2) 다리를 앞으로 힘차게 흔들고, 배가 철봉에서 완전히 떨어질 정도로 반동을 주어 회전 타이밍을 잡습니다. 3) 반동으로 돌아와 배가 철봉에 닿는 순간 허리와 무릎을 굽히며 철봉에 배를 감아 줍니다. 4) 동시에 상체를 뒤로 힘차게 젖히며 회전한 뒤 손목을 돌려 처음의 지지 자세로 돌아옵니다.</p>
