<h1>4코너 축구</h1>
<p>1) 체육관 네 모서리에 벤치를 옆으로 눕혀 골대로 배치하고 학생들을 4개 팀으로 나눈다. 2) 각 팀은 자신의 골대를 방어하면서 나머지 3개 팀의 골대 어디에나 골을 넣어 득점할 수 있다. 3) 골대가 낮기 때문에 무작정 강하게 차기보다는 패스로 연계하여 골을 노린다. 4) 정해진 시간이 끝났을 때 가장 많은 골을 넣은 팀이 승리한다.</p>
