<h1>빨래 바구니 슬램 21</h1>
<p>1) 빨래 바구니(또는 양동이·상자) 2개를 두고 파트너와 등지고 서서 5걸음 거리(숙련자는 더 멀리)를 둔다. 2) 한 사람이 공이나 원반을 던지고 반대편 파트너는 손으로 쳐서 바구니를 맞히거나 넣도록 돕는다. 3) 바구니 옆면을 손으로 쳐서 맞히면 1점, 쳐서 안에 들어가면 2점, 직접 맞히면 3점, 직접 들어가면 4점을 획득하며 합산하여 21점을 먼저 만든다.</p>
