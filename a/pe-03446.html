<h1>바람개비 달리기</h1>
<p>1) 반 전체를 4개 모둠으로 나누고 모둠별로 출발 지점을 정한다. 2) 모둠원끼리 순서를 정하고 출발 신호와 함께 출발한다. 3) 걷거나 달리면서 운동장 한 바퀴를 돌아 다음 모둠원의 손을 쳐주면 다음 모둠원이 출발한다. 4) 걷거나 달리는 중 상대 모둠원을 잡으면 게임을 멈추고 상대 모둠을 잡은 모둠이 1점을 얻으며 가장 많은 점수를 얻은 모둠이 이긴다.</p>
