<h1>미니언즈 할로윈 프리즈 댄스</h1>
<p>1) 화면에서 신나는 음악이 흘러나오면 자유롭게 춤을 추며 몸을 움직입니다. 2) 영상 속 캐릭터의 동작을 따라 하거나 자신만의 창의적인 춤 동작을 표현해도 좋습니다. 3) 음악이 멈추고 멈춤 신호가 나오면 그 자리에서 자세를 멈추고 얼음 상태를 유지합니다. 4) 정지 자세를 유지하면서 자신의 사탕 바구니에 어떤 간식이 나오는지 확인합니다.</p>
