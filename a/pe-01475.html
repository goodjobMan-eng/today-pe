<h1>닷지비 캐치 앤 밸런스 챌린지</h1>
<p>1) 각자 부드러운 천 재질의 닷지비 디스크를 1~2개씩 준비하여 안전 거리를 확보한다. 2) 혼자서 디스크를 머리 위에 올리고 걷거나 앉았다 일어서며 중심을 잡는다. 3) 디스크를 위로 던져 박수를 치거나 한 손으로 잡고, 짝과 마주 보고 다양한 자세로 주고받는다. 4) 바구니를 든 짝에게 정확히 던져 넣거나 바닥에 미끄러뜨려 맞히는 표적 게임으로 발전시킨다.</p>
