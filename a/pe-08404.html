<h1>코너 차지하기 (Cuatro Esquinas)</h1>
<p>1) 사각 구역의 네 모서리와 중앙에 콘을 배치하고 학생들을 5개 팀으로 나누어 각 모서리와 중앙에 배치한다. 2) 교사의 신호가 울리면 모든 팀은 다른 모서리로 달려가 코너를 차지한다. 3) 모서리를 선점하지 못하고 남은 팀은 중앙으로 이동하여 다음 라운드를 기다린다. 4) 팀원 전체가 해당 모서리에 먼저 도착해야 해당 코너를 차지한 것으로 인정된다.</p>
