<h1>솜털공 훌라후프 릴레이 골인 놀이</h1>
<p>1) 두 팀으로 나눈 뒤 조끼를 착용하고 인원수에 맞게 모든 팀원이 솜털공을 들고 출발선에 선다. 2) 신호가 울리면 꼬깔콘을 돌아 한 발 뛰기로 이동하여 골대 역할을 하는 훌라후프 안으로 솜털공을 던져 넣는다. 3) 골대에 공을 넣지 못했다면 출발선에 다시 다녀와야 재도전하여 던질 수 있다. 4) 모든 팀원이 골대에 먼저 공을 골인시키는 팀이 승리하며, 훌라후프 여러 개를 두고 색깔에 맞춰 넣는 방식으로 난이도를 높인다.</p>
