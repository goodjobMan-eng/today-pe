<h1>협동 풍선 차 넘기기</h1>
<p>1) 4명씩 한 모둠이 되어 코트 줄(접시콘·삼각콘 경계)의 양쪽에 선다. 2) 가위바위보를 하여 이긴 모둠이 풍선을 먼저 발로 차서 상대 영역으로 보낸다. 3) 상대 모둠은 풍선을 3번 안에 차서 다시 상대 영역으로 보낸다. 4) 풍선을 1번 혹은 4번 차거나, 같은 사람이 연속으로 차거나, 주고받는 도중 바닥에 떨어지면 실점하며, 정해진 시간 동안 점수를 더 많이 획득한 모둠이 승리한다.</p>
