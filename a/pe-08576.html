<h1>틱택토 릴레이</h1>
<p>1) 팀별로 3~4명씩 나눕니다. 2) 신호가 울리면 첫 번째 주자가 매트에서 구르기 동작을 수행합니다. 3) 훌라후프 9개로 만든 틱택토 판으로 달려가 자신의 색깔 콘을 놓습니다. 4) 다음 주자와 교대하며 릴레이를 이어가며, 먼저 가로·세로·대각선으로 3개를 놓는 팀이 승리합니다.</p>
