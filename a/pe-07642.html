<h1>쥐와 덫 (케이지 속의 쥐)</h1>
<p>1) 술래 역할을 하는 참가자들이 손을 잡고 큰 원을 만들어 덫을 형성한다. 2) 쥐 역할을 맡은 참가자들은 원 안팎을 자유롭게 드나들며 이동한다. 3) 신호에 맞춰 원을 만든 참가자들이 앉거나 팔을 내려 덫을 닫고 안에 갇힌 쥐를 잡는다.</p>
