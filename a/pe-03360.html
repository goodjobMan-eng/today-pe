<h1>쓰로우볼 (던지고 받아 공 넘기기 게임)</h1>
<p>1) 4명씩 2개 모둠을 이루고 코트 중앙에 네트를 설치한다. 2) 경기장 밖에서 두 손으로 공을 던져 네트 너머 상대 빈 곳으로 넘기며 시작한다. 3) 넘어온 공은 두 손으로 받고 모든 모둠원의 손을 거친 후 상대 코트로 던져 넘긴다. 4) 공을 받지 못하거나 구역 밖으로 나가면 상대가 1점을 얻으며 15점을 먼저 얻으면 승리한다.</p>
