<h1>니모 타격 원형 패스 게임</h1>
<p>1) 중앙에 통과 인형(니모)을 두고, 원형으로 각 학생마다 원마커(폴리스팟)를 하나씩 깔고 선다. 2) 공을 가진 첫 번째 학생이 옆 원마커의 학생에게 공을 던진다. 3) 공이 바닥에 닿지 않고 원을 따라 패스되어 공을 처음 던진 학생에게까지 무사히 돌아온다. 4) 처음 시작한 학생에게 공이 돌아오면 중앙의 인형을 향해 공을 던져 맞혀 떨어뜨릴 한 번의 기회를 얻고 점수를 얻는다.</p>
