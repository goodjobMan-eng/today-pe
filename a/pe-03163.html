<h1>티니클링 기본 동작 익히기</h1>
<p>1) 대나무는 삼박자에 맞춰 팔을 벌려 두 번 치고 모아서 한 번 친다. 2) 대나무 사이에서 두 번 점핑하고 밖에서 양발을 벌려 점핑하는 발 벌려 뛰기를 한다. 3) 움직이는 대나무 사이를 한 발씩 호핑하며 번갈아 뛰기를 한다. 4) 대나무 사이에서 두 번 점핑 후 뒤로 돌며 양발을 벌려 뛰고 돌기를 한다.</p>
