<h1>기본 움직임 기술: 균형 잡기</h1>
<p>1) 평평한 바닥에 똑바로 서서 먼 곳의 한 지점을 응시하며 시선을 고정한다. 2) 복부 근육을 단단히 조여 중심을 잡고 몸을 곧게 세운다. 3) 양팔을 크게 흔들지 않고 곧게 뻗어 균형 유지를 돕는다. 4) 처음에는 벽을 잡고 한쪽 발을 들어 올리는 연습부터 시작한다. 5) 익숙해지면 벽에서 손을 떼고 양팔을 벌려 버티며, 양쪽 발을 모두 번갈아 연습한다.</p>
