<h1>단체 줄넘기 잘 넘는 법</h1>
<p>1) 무릎을 지나치게 굽히지 않고 편 상태를 유지하며 착지할 때만 무릎을 쿠션처럼 살짝 굽혔다 펴서 뛴다. 2) 줄 안에서 뛰는 사람은 줄을 바라보고 줄이 90도 각도에 도달했을 때 도약한다. 3) 돌리는 사람은 허리를 낮추고 당기며 한 손을 축으로 삼고 다른 손으로 방향을 조절하며 돌린다.</p>
