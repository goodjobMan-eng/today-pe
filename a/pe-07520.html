<h1>스페셜 에이전트(Agent Spécial)</h1>
<p>1) 코트를 둘로 나누고 각 팀에서 스파이 1명을 지정해 상대 팀 진영에 배치합니다. 2) 시작 시 스파이에게 공이 주어지며, 스파이는 자기 진영에 있는 팀원에게 패스를 보냅니다. 3) 스파이의 패스를 두 손으로 땅에 떨어뜨리지 않고 노바운드로 잡은 팀원은 상대 진영으로 넘어가 새로운 스파이가 되며, 팀 전체가 먼저 상대 진영으로 이동한 팀이 승리합니다.</p>
