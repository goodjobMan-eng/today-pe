<h1>몸의 힘을 기르는 운동</h1>
<p>1) 발을 어깨너비로 벌리고 한쪽 다리를 앞으로 내밀어 무릎을 90도로 굽혔다 펴는 런지를 한다. 2) 손바닥을 어깨너비로 벌려 짚고 팔꿈치를 굽혀 가슴이 매트에 닿을 정도로 내렸다가 미는 팔굽혀펴기를 한다. 3) 2인 1조로 한 명이 무릎을 세워 눕고 다른 학생의 손끝에 닿을 때까지 윗몸을 말아 올린다. 4) 배를 대고 엎드려 양손과 다리를 들어 올리고 허리에 힘을 주어 버틴다.</p>
