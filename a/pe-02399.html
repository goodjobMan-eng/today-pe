<h1>막대 협동 공 나르기와 배구 리시브 연결 놀이</h1>
<p>1) 두 사람이 긴 막대 2개를 나란히 쥐고 그 위에 공을 얹어 반환점을 돌아온다. 2) 공이 바닥에 떨어져도 손을 쓰지 않고 오직 막대로만 집어 올려 이동한다. 3) 막대를 잡은 두 사람이 마주 보고 서서 날아오는 공이 원바운드된 후 협동하여 막대 위에 공을 얹는다. 4) 공이 막대에 닿는 순간 무릎을 굽히고 중심을 낮추며 충격을 흡수하여 제어한다.</p>
