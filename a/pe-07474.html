<h1>아웃 오브 컴뱃 (공 지키기 생존 게임)</h1>
<p>1) 정해진 구역 안에 모든 학생이 1인당 축구공 또는 농구공 1개씩을 소지하고 흩어진다. 2) 각자 자신의 공을 드리블하여 지키면서 동시에 다른 친구의 공을 쳐서 구역 밖으로 쳐내야 한다. 3) 자신의 공이 경기장 밖으로 나가거나 제어를 잃은 학생은 라인 밖 사이드라인으로 이동한다. 4) 구역 밖으로 밀려난 탈락자들도 라인 밖에서 플레이를 계속하며 안쪽 학생들의 공을 빼앗거나 쳐낼 수 있다.</p>
