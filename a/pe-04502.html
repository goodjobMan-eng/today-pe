<h1>배구 언더핸드 패스(디그) 핵심 교정 3가지</h1>
<p>1) 언더핸드 면을 만들 때 양 엄지손가락을 바닥 쪽으로 내려 전완근이 밀착되도록 평평한 면을 만든다. 2) 공을 칠 때 어깨를 위로 크게 휘두르지 말고 공 뒤로 빠르게 이동해 한 발을 앞으로 딛는다. 3) 목표 지점을 향해 팔 전체로 밀어주며 공을 정확하게 보낸다. 4) 목과 어깨 사이에 공을 끼웠다고 상상하며 어깨를 앞쪽과 목표 방향으로 모아 팔 사이 틈을 없앤다.</p>
