<h1>교실 책상 미니탁구 복식 게임</h1>
<p>1) 책상을 마주 보고 2명이 한 조가 되어 복식으로 경기할 준비를 한다. 2) 서브는 오른쪽에서 상대 오른쪽으로 대각선 방향으로 넣으며 2회씩 넣는다. 3) 서브를 넣거나 공을 친 선수는 즉시 파트너와 자리를 바꾼다. 4) 한 선수가 공을 연속으로 두 번 칠 수 없으며 11점 선취(9대 9 듀스 시 2점 차)로 승패를 결정한다.</p>
