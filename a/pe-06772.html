<h1>볼링핀 쓰러뜨리기 주먹야구</h1>
<p>1) 타자가 주먹으로 공을 치고 1루와 3루 베이스로 달린다. 2) 수비수는 뜬공을 바로 잡으면 타자 아웃을 시킨다. 3) 땅볼일 경우 수비수는 구역 밖으로 나와 중앙에 세워진 볼링핀을 공으로 맞춰 쓰러뜨린다. 4) 주자가 베이스에 도착하기 전에 볼링핀이 쓰러지면 주자는 아웃된다.</p>
