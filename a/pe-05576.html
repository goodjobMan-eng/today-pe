<h1>배트맨 달리기</h1>
<p>1) 신문지를 가슴에 대고 양팔을 양옆으로 펼친 뒤 신문지가 떨어지지 않도록 달린다.2) 출발할 때 손을 뗐다가 반환점을 돌아 다음 주자에게 신문지를 전달한다.3) 신문지를 손으로 잡고 달리면 안 되며 맞바람의 공기 저항으로 떨어지지 않게 유지한다.</p>
