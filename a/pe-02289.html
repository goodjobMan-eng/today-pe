<h1>플로어볼 기초 기능 및 경기 방법</h1>
<p>1) 스틱을 잡고 숏 드리블, 롱 드리블, 패스, 슈팅(리스트 슈팅, 드래그 슈팅)을 익힌다. 2) 중앙 지점에서 양 팀이 마주 보고 심판의 휘슬 신호와 함께 페이스오프로 경기를 시작한다. 3) 패스와 드리블을 통해 상대 팀 골대에 볼을 넣어 더 많은 골을 넣은 팀이 승리한다. 4) 볼이 링크 밖으로 나가면 히트인, 반칙이 발생하면 수비수가 3m 이상 떨어진 상태에서 프리히트를 진행한다.</p>
