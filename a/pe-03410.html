<h1>진주 품은 조개 게임</h1>
<p>1) 바닥 중앙에 후프를 놓고, 후프를 중심으로 3명씩 짝을 이룬다. 2) 두 명이 손을 잡아 조개를 만들고 나머지 한 명이 그 안에 들어가 진주 모양을 만든다. 3) 후프 안에 들어간 술래가 '조개' 또는 '진주'를 외치면 해당 역할을 맡은 사람들이 후프 안을 밟고 새로운 짝을 찾아 이동한다. 4) 짝을 찾지 못한 사람이 새로운 술래가 된다.</p>
