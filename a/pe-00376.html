<h1>매트 앞구르기 기초 동작 익히기</h1>
<p>1) 매트 앞에 양발을 모으고 무릎을 굽혀 쪼그려 앉습니다. 2) 턱을 가슴 쪽으로 바짝 당겨 몸을 둥글게 말고, 양손으로 매트를 짚으며 발을 차고 앞으로 굴러갑니다. 3) 손, 머리 뒤통수, 어깨, 등, 엉덩이, 발 순서로 매트에 닿도록 합니다. 4) 회전력을 이용해 발바닥으로 딛고 일어섭니다.</p>
