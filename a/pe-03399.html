<h1>모든 누 공 이어주기 티볼 게임</h1>
<p>1) 두 모둠으로 나누어 공격과 수비를 정하고, 타자는 배팅 티의 공을 친 뒤 모든 누를 돌아 홈으로 달립니다. 2) 수비 모둠은 공을 잡으면 가장 가까운 누로 던진 뒤 모든 누에 차례로 공을 이어줍니다. 3) 공격 모둠이 홈으로 들어오기 전에 수비 모둠이 모든 누에 공을 이어주면 아웃됩니다. 4) 타자가 모든 누를 돌아 홈으로 들어오면 1점을 얻고, 3회씩 진행하여 점수가 많은 모둠이 이깁니다.</p>
