<h1>보텍스 던지기</h1>
<p>1) 손목과 어깨 관절을 풀고 던지기 흉내 내기 동작으로 준비운동을 한다. 2) 무릎 꿇은 자세에서 벽을 향해 반대쪽 다리를 앞으로 내밀고 보텍스를 던진다. 3) 무릎 꿇었다가 일어서는 동작과 연계하여 던지기를 연습한다. 4) 반대쪽 다리로 한 걸음 앞으로 내딛으며 던지는 스텝을 연습한다. 5) 사이드 스텝이나 크로스오버 스텝을 포함한 도움닫기를 연결하여 최종 투구를 실시한다.</p>
