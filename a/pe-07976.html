<h1>킨볼 슬라이딩 단계별 훈련</h1>
<p>1) 공기 주입구에 손가락을 넣어 공을 잡고 공중에 띄우면서 슬라이딩 박자에 맞춰 들어온다. 2) 보조자가 손으로 통통 튀겨주다 띄워주는 타이밍에 맞춰 슬라이딩해 들어온다. 3) 발끝을 정강이 쪽으로 당기지 않고 발등을 앞으로 쭉 편 상태로 슬라이딩해 공을 머리 위로 띄운다. 4) 보조자가 던지거나 차준 공을 향해 달려가 슬라이딩으로 받아 살린다.</p>
