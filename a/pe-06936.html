<h1>포팀 패들 하키</h1>
<p>1) 구역 네 모서리에 골대를 두고 4개 팀이 각 모서리에서 시작한다. 2) 각 팀 5명 중 번호를 정해 호명된 번호의 학생들이 가운데로 나와 공을 뺏으며 다른 세 팀의 골대 중 아무 곳에나 골을 넣는다. 3) 실점한 팀은 대기 선수가 링을 가져와 콘에 꽂고, 링 3개가 채워진 팀의 골대는 닫히며 마지막까지 남는 팀이 승리한다.</p>
