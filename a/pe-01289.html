<h1>감정 공감 원형 의자 바꾸기 놀이</h1>
<p>1) 교실 책상을 밀고 학생 수보다 의자 1개를 적게 원형으로 배치한 뒤 술래 1명을 중앙에 세운다. 2) 술래가 화면에 제시된 감정 단어 중 하나와 그 감정을 느낀 실제 경험 이유를 말한다. 3) 전체 친구들이 &quot;왜요?&quot;라고 되물은 후 술래의 사연에 공감하는 학생들만 자리에서 일어나 빈 의자로 이동한다. 4) 자리를 차지하지 못한 학생이 다음 술래가 되며 3번 연속 술래가 되면 간단한 장기자랑을 진행한다.</p>
