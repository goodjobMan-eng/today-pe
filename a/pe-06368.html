<h1>크리스마스 무비 스톰프 브레인 브레이크</h1>
<p>1) 응원할 영화 캐릭터를 선택한다.2) 트랙을 따라 내려오는 버튼이 플레이 존에 들어올 때 해당 신체 동작을 수행한다.3) 빨간색은 왼발 구르기/점프, 노란색은 오른발 구르기/점프, 빨강·노랑 동시는 양발 점프, 파란색은 박수, 보라색은 허벅지 치기를 한다.4) 중간 미니 게임에서는 각 구역에 공통으로 반복되는 이미지를 찾아 지정된 자세를 취한다.</p>
