<h1>특수요원 장애물 극복 균형 이동</h1>
<p>1) 발이 마룻바닥에 닿지 않도록 균형을 잡으며 장애물 코스를 이동한다.2) 보수볼, 원마커, 지그재그선, 평균대, 줄(레이저) 순으로 통과한다.3) 앞사람이 세 번째 지그재그 장애물에 도달하면 뒷사람이 출발한다.4) 총 2회 반복 실시 후 출발 지점에 앉는다.</p>
