<h1>1대1 마커 가위바위보 땅따먹기</h1>
<p>1) 두 사람이 짝을 짓고 약 15m 간격으로 바닥에 원마커를 하나씩 놓고 마주 보고 선다. 2) 신호가 울리면 서로를 향해 걸어가다가 만나는 지점에서 멈춰 가위바위보를 한다. 3) 이긴 사람은 계속 걸어가고, 진 사람은 즉시 반대로 전력 질주해 자신의 출발 마커를 발로 찍고 다시 걸어온다. 4) 상대방이 출발 마커 위에 서 있는 상태에서 가위바위보를 이기면 1점을 얻으며 정해진 시간 동안 다득점자가 승리한다.</p>
