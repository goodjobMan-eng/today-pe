<h1>고깔고깔 대작전</h1>
<p>1) 꼭짓점을 조금 잘라 시야 구멍을 낸 고깔모자를 얼굴에 쓴다. 2) 라바콘 위에 올려진 다양한 색깔의 공들을 향해 이동한다. 3) 막대풍선(펀스틱)을 휘둘러 라바콘 위의 공을 쳐서 떨어뜨린다. 4) 제한 시간 동안 공을 더 많이 떨어뜨린 쪽이 승리한다.</p>
