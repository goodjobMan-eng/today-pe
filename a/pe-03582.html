<h1>매트 앞구르기 기초 연습</h1>
<p>1) 매트 위에 발과 가까운 위치에 손을 짚고 선다. 2) 시선은 배꼽을 향해 머리를 숙이고 엉덩이를 들어 올려 몸을 둥글게 만든다. 3) 정수리가 아닌 뒤통수가 먼저 매트에 닿도록 하며 앞쪽으로 구른다. 4) 굴러가는 반동을 이용해 손으로 무릎을 감싸 쥐며 일어선다.</p>
