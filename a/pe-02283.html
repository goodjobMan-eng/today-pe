<h1>골볼 체험 경기</h1>
<p>1) 골볼 전용 매트를 일정한 간격으로 배치하여 골대를 구성한다. 2) 공격수는 시각스포츠 안대를 착용하고, 초등학교 저학년은 근거리에서 굴리고 고학년은 최소 7m 이상 떨어진 거리에서 소리 나는 골볼 공을 굴려 던진다. 3) 수비수는 안대를 착용하고 귀를 기울여 굴러오는 공의 위치를 파악한다. 4) 수비수는 슬라이딩을 하지 않고 자신의 신체 또는 골볼 전용 매트를 활용하여 공을 막아내며, 막으면 0점 막지 못하면 1점을 실점한다.</p>
