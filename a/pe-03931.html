<h1>타이거 테일즈 술래잡기</h1>
<p>1) 사육사는 훌라후프 구역에서 시작하고, 꼬리를 단 호랑이들은 동물원 구역 안을 자유롭게 도망친다. 2) 사육사가 동물원에 들어가 호랑이의 꼬리를 떼어내며, 꼬리는 한 번에 하나씩만 뗄 수 있다. 3) 꼬리를 획득한 사육사는 출발지의 훌라후프에 가져다 놓아야 1점을 얻고 다시 꼬리를 잡으러 갈 수 있다. 4) 꼬리를 뺏긴 호랑이는 줄 끝으로 이동해 대기하며 차례가 되면 꼬리를 다시 달고 복귀한다.</p>
