<h1>하늘에서 공이 비처럼 내려와</h1>
<p>1) 3명이 한 조가 되어 배드민턴 라켓(또는 맨손)으로 풍선을 치며 반환점 콘을 향해 이동한다. 2) 나머지 학생들은 이동하는 조를 향해 탱탱볼을 던져 풍선을 맞히려고 시도한다. 3) 날아오는 탱탱볼에 풍선이 맞거나 풍선이 바닥에 닿으면 아웃된다. 4) 조원 중 풍선을 모는 주자 외의 다른 팀원은 몸으로 날아오는 탱탱볼을 막아 풍선을 보호하며 반환점을 돌아온다.</p>
