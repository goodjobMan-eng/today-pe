<h1>도입 퀴디치 게임</h1>
<p>1) 양 팀이 출발선에 서서 신호에 맞춰 중앙으로 달려가 공을 차지한다. 2) 큰 공은 득점용으로 사용하여 목표물(앵글볼)을 맞춰 떨어뜨려 득점한다. 3) 작은 공은 상대 선수를 맞혀 아웃시키는 피구용으로 사용하여, 작은 공에 맞은 선수는 출발선으로 돌아갔다가 다시 참여한다. 4) 큰 공을 든 사람이 작은 공에 맞으면 공을 내려놓고 3미터 이상 물러나야 한다.</p>
