<h1>가족과 함께 가위바위보 올림픽</h1>
<p>1) 가위는 닭, 바위는 거북이, 보는 황새 동작으로 정하고, 바닥에 원마커를 동메달 3개, 은메달 2개, 금메달 1개 순으로 배치합니다.2) 출발선에서 다른 모둠 친구와 신체 표현 가위바위보를 하여 이긴 동작의 동물을 흉내 내며 동메달 위치로 이동합니다.3) 각 메달 위치에서 다른 친구와 겨뤄 이기면 은메달, 금메달로 차례로 이동하며, 금메달에서 이길 때마다 점수를 획득합니다.</p>
