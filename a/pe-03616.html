<h1>발펌프 발야구</h1>
<p>1) 수비팀은 내야와 각 베이스에 위치하고 공격팀은 차례대로 공을 차고 주루를 준비한다. 2) 타자가 공을 찬 후 1루를 향해 달리고, 주자는 상황에 맞춰 다음 베이스로 진루한다. 3) 수비수가 뜬공을 한 번에 직접 잡거나 베이스를 밟아 포스 아웃 또는 태그 아웃을 시킨다. 4) 파울이 3번 누적되면 아웃 처리되며, 3아웃이 되면 공수를 교대한다.</p>
