<h1>미니 콘축구</h1>
<p>1) 경기장 양 끝에 같은 수의 콘을 일정한 간격으로 여러 개 배치하고 2팀으로 나눈다.2) 콘 앞 1~2m 지점에 라인을 그어 공격수가 들어가지 못하도록 제한한다.3) 발 안쪽(인사이드)을 사용하여 허리 높이 아래로 공을 찬다.4) 공으로 상대 콘을 쓰러뜨리면 1점을 획득하고 쓰러진 콘은 다시 세우지 않는다.5) 정해진 시간 동안 콘을 더 많이 넘어뜨리거나 먼저 모두 넘어뜨린 팀이 승리한다.</p>
