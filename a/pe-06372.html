<h1>마리오 샴록 런 (세인트 패트릭 데이 브레인 브레이크)</h1>
<p>1) 화면 속 장애물과 적을 피해 달리며 황금 토끼풀을 모은다.2) 쿠파를 마주치면 움직임을 멈추고 멈춰라(Freeze) 동작을 수행한다.3) 마지막에 쿠파가 제시하는 쿨다운 스트레칭 자세를 완료한다.</p>
