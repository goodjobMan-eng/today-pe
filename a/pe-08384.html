<h1>10가지 축구 드리블 놀이 드릴</h1>
<p>1) 콘으로 표시된 사각 구역 안에서 각자 축구공을 하나씩 가지고 자유롭게 드리블한다. 2) 조끼 꼬리를 꽂고 공을 지키며 상대 꼬리를 빼앗는 '오리 꼬리잡기', 신호에 맞춰 멈추는 '신호등 놀이', 콘 게이트를 통과하는 '게이트 드리블' 등 다양한 미니게임을 단계별로 진행한다. 3) 정해진 시간 동안 술래를 피하거나 정해진 구역을 통과하며 공을 발 가까이에 두고 제어한다.</p>
