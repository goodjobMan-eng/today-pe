<h1>풋살 패스 드리블과 인성 경기</h1>
<p>1) 2인 1조로 마주보고 발 안쪽 넓은 면으로 인사이드 패스를 주고받으며, 디딤발은 방향을 향하고 공은 발바닥으로 멈춘 뒤 신호 시 반시계 방향으로 상대를 바꾼다. 2) 발 바깥쪽과 안쪽을 번갈아 활용하여 드리블하고 공이 멀어지면 발바닥으로 멈춰 세워 제어한다. 3) 수준별 또는 성별로 팀을 편성하여 응원과 해설 속에 미니 풋살 경기를 진행한다.</p>
