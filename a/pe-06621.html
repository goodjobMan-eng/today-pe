<h1>스쿼시 탁구 (벽 탁구)</h1>
<p>1) 벽과 바닥에 정해진 구역을 표시하고, 단식(1대 1) 또는 복식(2대 2)으로 팀을 구성한다. 2) 가위바위보로 서브권을 정한 후 라켓으로 탁구공을 쳐서 벽 구역에 맞히고, 튕겨 나온 공을 양 팀이 번갈아 가며 친다. 3) 공이 바닥에 두 번 튀기 전(노바운드 또는 1바운드)에 쳐서 벽 구역으로 되돌려 보내며, 15점 또는 21점에 먼저 도달하면 승리한다.</p>
