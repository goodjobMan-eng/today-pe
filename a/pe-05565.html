<h1>헤딩 술래</h1>
<p>1) 술래가 축구공을 들고 걸어 다니며 다른 친구들을 쫓아가 머리로 공을 맞히거나 몸에 공을 닿게 한다.2) 공에 닿은 사람은 아웃되어 경기장 밖으로 나간다.3) 아웃된 사람은 경기장 밖에서 축구공을 들고 제자리 헤딩을 3번 성공해야 경기장 안으로 복귀할 수 있다.</p>
