<h1>런치 잇 (파라슈트 볼 쏘아 올리기)</h1>
<p>1) 학생들이 원형 파라슈트의 가장자리를 잡고 둥글게 둘러선다. 2) 파라슈트 가운데에 공을 올리고 잡는 높이(복근 높이)를 맞춘다. 3) 전체가 구령에 맞춰 하나, 둘, 셋 위로 올렸다가 아래로 강하게 내리치며 공을 튕겨 올린다. 4) 협동하여 공을 체육관 천장에 닿게 쏘아 올리고, 다시 파라슈트로 받아내면 보너스 점수를 얻는다.</p>
