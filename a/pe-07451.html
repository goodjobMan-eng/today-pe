<h1>겨루기 놀이를 통한 짝 근력 운동</h1>
<p>1) 매트 위에서 마주 보고 어깨를 잡아 상대 어깨를 바닥에 닿게 하거나, 엎드린 자세에서 상대 팔을 당겨 등을 바닥에 닿게 한다. 2) 콘 위에 테니스공을 올려두고 상대 뒤에 있는 공을 먼저 쳐서 떨어뜨리는 대결을 한다. 3) 기준선에서 서로 손을 맞잡고 당겨 선을 넘게 하거나, 어깨를 맞대고 밀거나 등을 맞대고 밀어 선을 넘는 겨루기를 한다.</p>
