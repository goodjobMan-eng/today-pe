<h1>마차야 달려라</h1>
<p>1) 마부 1명을 정하고 마부는 후프에 줄을 매달아 후프를 바닥에 끈다. 2) 신호가 울리면 첫 번째 주자가 후프 안에 들어가 마부를 따라 이동한다. 3) 마부가 반환점을 돌아 출발선에 들어오면 첫 번째 주자는 후프 밖으로 나오고 다음 주자가 후프 안에 들어가 출발한다. 4) 마지막 주자가 가장 먼저 들어온 모둠이 승리한다.</p>
