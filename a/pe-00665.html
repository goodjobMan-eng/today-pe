<h1>콘 패스 축구 드릴 게임</h1>
<p>1) 넓은 활동 구역 곳곳에 라바콘을 흩어 세워 두고 2인 1조로 짝을 맞춥니다. 2) 짝과 함께 자유롭게 구역을 드리블하며 이동하다가 빈 라바콘을 찾아 콘을 사이에 두고 패스를 주고받습니다. 3) 다른 조와 겹치지 않게 빈 공간을 탐색하며 이동합니다. 4) 제한 시간 동안 정해진 횟수만큼 패스를 성공시킵니다.</p>
