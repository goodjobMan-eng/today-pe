<h1>하나되어 포뮬러 1</h1>
<p>1) 팀원들이 한 줄 기차가 되어 사다리 건너기, 허들 점프, 지그재그 돔콘의 세 영역을 순환식으로 달린다.2) 마지막 주자의 링바톤이 시작점에 돌아왔을 때를 1바퀴로 인정하며, 종료 휘슬 시 2영역을 통과했으면 0.5바퀴를 가산한다.3) 허들이나 돔콘을 쓰러뜨리면 1개당 팀의 잔여 시간에서 1초씩 감소된다.</p>
