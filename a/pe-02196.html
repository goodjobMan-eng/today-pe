<h1>지그재그 릴레이 놀이</h1>
<p>1) 6명이 한 팀이 되어 손을 잡고 원으로 선다. 2) 각 팀의 첫 번째 주자는 팀원들의 맞잡은 손 아래와 위를 원 안팎으로 지그재그 통과하며 달린다. 3) 주자가 출발 지점에 도착하면 오른쪽 학생이 다음 주자로 출발하여 릴레이를 이어간다. 4) 모든 팀원이 빠르게 움직여 릴레이를 먼저 끝내고 전원 자리에 앉은 팀이 승리한다.</p>
