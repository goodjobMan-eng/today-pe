<h1>볼링 핀 쓰러뜨리기와 세우기 놀이</h1>
<p>1) 체육관 곳곳에 플라스틱 볼링 핀이나 콘을 세워 둔다. 2) 전체 학생의 절반은 쓰러뜨리는 팀, 절반은 다시 세우는 팀으로 나눈다. 3) 쓰러뜨리는 팀은 손이나 팔을 사용하여 서 있는 핀을 쓰러뜨리고, 세우는 팀은 넘어진 핀을 다시 똑바로 세운다.</p>
