<h1>종이컵을 활용한 민첩성 기르기(3가지 스텝)</h1>
<p>1) 좌우 2m 간격으로 종이컵을 두고 사이드스텝으로 왕복하며 3회 터치하는 동작을 10세트 수행한다. 2) 중앙을 기준으로 앞뒤 좌우 십자 방향으로 종이컵을 배치하고 십자 스텝으로 컵을 터치하는 동작을 5회 수행한다. 3) 종이컵 5개를 일정한 간격으로 일렬 배치하고 지그재그로 달리는 왕복달리기를 10회 실시한다.</p>
