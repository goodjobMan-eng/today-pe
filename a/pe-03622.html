<h1>왕복 달리기 팝스 측정</h1>
<p>1) 15m 거리에 출발선과 반대편 선을 표시하고 측정자와 달리는 주자로 짝을 맞춘다. 2) 신호음(삑 소리)에 맞추어 출발선에서 반대편 선으로 달린다. 3) 다음 신호음이 울릴 때까지 선 안에 도착한 후 반대 방향으로 다시 달린다. 4) 신호음 안에 들어오지 못해 2번 실패하면 달리기를 멈추고 직전까지 달린 횟수를 기록한다.</p>
