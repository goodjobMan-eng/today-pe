<h1>지렁이 달리기</h1>
<p>1) 한 팀당 7~8명씩 두 팀으로 나누고 출발선에 선다. 2) 선두 주자가 라인을 따라 앞으로 달려가 양팔을 벌려 선다. 3) 다음 주자는 선두가 양팔을 벌릴 때 달려가 앞 주자를 S자로 지그재그 통과한 뒤 1미터 간격으로 나란히 선다. 4) 전체 주자가 출발한 후 처음 주자가 같은 방법으로 주자들의 양팔을 빠르게 통과하며 반환점을 돌아온다.</p>
