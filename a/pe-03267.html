<h1>혼자 하는 기초 줄넘기</h1>
<p>1) 줄을 한 번 돌릴 때 한 번씩 뛰는 두 발 모아 뛰기를 한다. 2) 제자리에서 조깅하듯 발을 번갈아 가며 가볍게 한 번씩 뛰는 두 발 번갈아 뛰기를 한다. 3) 오른쪽과 왼쪽으로 발을 너무 높이 들지 않고 두 번 뛰기를 한다. 4) 양팔을 X자 모양으로 엇걸어 한 번 넘고 팔을 풀면서 한 번 넘는 엇걸었다 풀어 뛰기를 한다.</p>
