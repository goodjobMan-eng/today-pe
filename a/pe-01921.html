<h1>구급차 의사 피구</h1>
<p>1) 코트 양 끝에 매트로 병원을 만들고, 팀마다 스쿠터보드를 탄 구급차 의사 2명과 일반 선수를 정한다. 2) 중앙선 너머로 폼볼을 던져 상대를 맞히며, 공에 맞은 선수는 아웃되어 맞은 자리에 즉시 앉는다. 3) 팀의 의사가 스쿠터보드를 타고 다가가 부상자를 태운 뒤 본진 병원 매트까지 무사히 데려오면 부활한다. 4) 고학년은 의사도 공에 맞아 아웃될 수 있는 규칙을 적용해 의사가 모두 탈락하면 전원 아웃 시 승패를 가린다.</p>
