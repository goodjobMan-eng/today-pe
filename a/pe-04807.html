<h1>학기초 체육 수업 오리엔테이션 및 진단평가</h1>
<p>1) 모둠 대형(방향통 기준 횡대), 원 대형(반시계 방향 원), 교실 대형(책상 형태 모둠) 모이기 신호를 연습한다.2) 원 대형으로 둘러서서 발목부터 머리까지 관절 풀기를 실시하고 하체부터 상체까지 스트레칭을 배운다.3) 남은 시간에 50m 달리기 측정을 실시하여 학생들의 신체 능력을 진단한다.4) 원 대형으로 모여 관절 풀기 없이 스트레칭만으로 정리운동을 하고 수업을 마무리한다.</p>
