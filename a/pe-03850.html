<h1>레드라이트 그린라이트 조깅 클럽</h1>
<p>1) 초록색 표지판(또는 초록색 콘) 위치에서 출발 신호를 기다린다. 2) 초록색 표지판을 보면 출발하여 다음 표지판까지 약 100야드 거리를 일정한 페이스로 조깅한다. 3) 빨간색 표지판(또는 빨간색 콘/반사판)에 도달하면 멈춰 서서 걷거나 휴식을 취한다. 4) 다음 초록색 표지판에 도착하면 다시 조깅을 시작하며 코스를 순환한다.</p>
