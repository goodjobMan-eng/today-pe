<h1>축구 슛 스피드 릴레이 (슈팅 존 골 넣기)</h1>
<p>1) 빨강 팀과 파랑 팀으로 나누어 각 팀 콘 뒤에 한 줄로 선다. 2) 출발 신호와 함께 공을 손에 들고(또는 발로 드리블하여) 노란색 슈팅 존(사각형 구역)까지 최대한 빠르게 달린다. 3) 슈팅 구역 안에서 팀 골대를 향해 슛을 하고, 성공 여부와 관계없이 공을 주워 들고 돌아와 다음 주자에게 넘기며 10골을 먼저 넣는 팀이 이긴다.</p>
