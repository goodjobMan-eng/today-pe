<h1>스포츠스태킹 사이클 (3-6-3 스태킹)</h1>
<p>1) 왼쪽에서 오른쪽 순서로 3개, 6개, 3개의 컵을 업스태킹(쌓기)한다. 2) 3개 컵은 오른손 1개·왼손 1개, 6개 컵은 오른손 3개·왼손 2개를 집어 양손을 번갈아 가며 쌓는다. 3) 처음 시작한 왼쪽 3개 컵부터 오른쪽 방향으로 차례대로 다운스태킹(해체)한다.</p>
