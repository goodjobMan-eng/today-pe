<h1>해적 공 뺏기 드리블</h1>
<p>1) 2~3명의 해적을 제외한 모든 학생이 농구공을 1개씩 튕기며 강당 전체를 자유롭게 드리블한다. 2) 공이 없는 해적들은 드리블 중인 친구들에게 다가가 손으로 공을 뺏거나 쳐낸다. 3) 공을 빼앗긴 학생은 즉시 새로운 해적이 되어 다른 드리블러의 공을 뺏으러 이동한다. 4) 방금 자기 공을 뺏어간 해적의 공을 바로 되뺏는 것은 금지되며, 난이도를 높이려면 공 개수를 점차 줄여 해적 수를 늘린다.</p>
