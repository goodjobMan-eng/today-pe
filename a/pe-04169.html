<h1>먹이사슬 술래잡기</h1>
<p>1) 참가자들에게 초록색(식물 50~60%), 노란색(초식동물 20~30%), 빨간색(잡식동물 10~20%) 조끼를 나누어 입히고 활동 구역을 정한다. 2) 초록색은 잡식동물과 초식동물을 피해 도망쳐 살아남아야 한다. 3) 노란색은 빨간색을 피하면서 초록색을 태그해 잡을 수 있다. 4) 빨간색은 노란색과 초록색 모두를 태그할 수 있고 아무에게도 태그당하지 않는다.</p>
