<h1>파트너 페이서(2인 1조 달리기)</h1>
<p>1) 짝을 지어 한 명은 1번 구역, 파트너는 반대편 2번 구역의 라인에 선다. 2) 삐 소리(신호음)가 울리면 1번 주자들이 동시에 반대편 라인으로 달린다. 3) 반대편 라인에 도착하여 기다리던 파트너(2번)와 하이파이브를 한다. 4) 하이파이브를 받은 파트너는 바로 출발하지 않고, 다음 삐 소리가 울릴 때까지 기다렸다가 출발하여 달린다.</p>
