<h1>줄다리기</h1>
<p>1) 양쪽 콘 색상을 확인하여 자리를 잡고 줄 맨 앞 매듭 뒤에 서서 지그재그 패턴으로 간격을 두고 정렬한다. 2) 신호에 맞춰 최대한 낮은 자세로 넓은 지지면을 확보하며 대기한다. 3) &quot;준비, 시작, 당겨&quot; 신호가 떨어지면 줄을 당겨 매듭이 콘을 지나가도록 끌어당긴다. 4) 호각 소리가 들리면 즉시 줄을 놓는다.</p>
