<h1>복근 강화 타바타 운동</h1>
<p>1) 매트 위에 자리를 잡고 바른 자세로 준비한다. 2) 버피 테스트, 온몸 비틀기, 슈퍼맨 자세, 앉아서 상체 비틀기, 브릿지 자세, 윗몸일으키기, 플랭크, 누워서 상하체 들기 순으로 20초 운동 후 10초 휴식 인터벌을 진행한다. 3) 각 동작 안내 자막에 맞춰 올바른 복근 자극 자세를 유지하며 반복한다.</p>
