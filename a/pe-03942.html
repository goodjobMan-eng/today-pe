<h1>스키 점프 술래잡기</h1>
<p>1) 술래 5명에게 긴 폼롤러(풀누들)를 나눠주고 게임을 시작한다. 2) 술래가 다른 사람을 태그하면 바닥에 풀누들을 내려놓는다. 3) 태그된 사람은 바닥의 풀누들 위를 양발을 모아 좌우로 스키 점프를 정해진 횟수만큼 뛴다. 4) 점프를 마친 사람이 풀누들을 집어 들고 새로운 술래가 되어 다른 학생들을 쫓아간다.</p>
