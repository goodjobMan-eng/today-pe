<h1>한 걸음 개미구멍 막기</h1>
<p>1) 학급 전체가 교실 바닥의 빈 책상 구멍(개미구멍) 뒤쪽 출발선에 나란히 대기한다. 2) 교사의 시작 신호에 맞춰 전원이 동시에 한 발씩 정확히 앞으로 내딛는 동작을 수행한다. 3) 교실 벽 끝까지 도달하면 가장자리를 돌아 빈 책상 틈 사이(개미구멍)로 몸을 채워 넣는다. 4) 정해진 제한 시간(1분) 내에 모든 학생이 엉덩이를 붙이거나 틈을 완전히 밀착해 구멍을 전부 막으면 학급 전체가 성공한다.</p>
