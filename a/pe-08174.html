<h1>군마짱과 다양한 움직임 하기 (몸 풀기 운동)</h1>
<p>1) 오뚝이 자세로 뒤로 굴렀다 머리가 닿지 않게 일어나고 발을 딛지 않는 연속 동작에 도전한다. 2) 발바닥을 맞대고 무릎을 벌려 구르는 대불 자세와 손을 짚고 다리를 바꾸는 걸레질 동작을 한다. 3) 개구리 발치기, 가족이 손을 잡고 끌어주는 어미 물개 놀이, 손잡고 점프하기를 진행한다.</p>
