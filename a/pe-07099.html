<h1>위브 릴레이 (지그재그 달리기)</h1>
<p>1) 팀별로 농구 코트 너비 양 끝에 스팟 마커를 2개 설치하고, 팀원 4~5명이 마커 사이에서 3~4미터 간격으로 벌려 선다. 2) 첫 번째 주자가 맨 끝 스팟 마커에서 출발하여 팀원들과 반대편 마커를 지그재그(위브)로 돌고 다시 돌아온다. 3) 출발선으로 돌아와 두 번째 주자를 터치하고 원래 자리로 돌아가며, 모든 팀원이 마칠 때까지 반복한다.</p>
