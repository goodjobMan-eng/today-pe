<h1>3공 멀티 축구</h1>
<p>1) 양쪽 끝에 골대(매트나 콘 활용)를 설치하고 골키퍼와 필드 플레이어를 배치한 두 팀으로 나눕니다. 2) 첫 번째 축구공으로 킥오프를 진행하며 일반적인 축구 규칙에 따라 경기를 시작합니다. 3) 교사가 경기 도중 두 번째, 세 번째 축구공을 무작위로 공중에 던져 넣어 3개의 공이 동시에 인플레이되도록 합니다. 4) 골을 허용한 골키퍼는 즉시 필드 플레이어와 교대하여 골키퍼 기회를 고르게 분배합니다.</p>
