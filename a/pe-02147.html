<h1>티볼 타격 기본자세 및 스윙법</h1>
<p>1) 티볼 대 베이스 모서리에서 대각선 뒤쪽으로 한 걸음 물러선다. 2) 양발을 어깨너비로 벌리고 양쪽 무릎을 11자 형태로 가볍게 굽힌다. 3) 배트에 적힌 로고를 티에 놓인 공의 높이 및 위치와 나란히 맞춘다. 4) 스윙할 때 몸쪽 팔꿈치를 몸에 붙이고 잡은 밑의 손을 이용해 힘차게 휘두른다.</p>
