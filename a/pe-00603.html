<h1>버피 점프로 체력 기르기</h1>
<p>1) 학생 사이 간격을 넓게 벌려 바르게 선 자세에서 신호를 기다립니다. 2) 신호에 맞춰 자리에 웅크려 앉은 뒤, 양손을 바닥에 짚고 두 다리를 뒤로 뻗어 팔굽혀펴기 기본 자세를 만듭니다. 3) 두 다리를 가슴 쪽으로 당겨 웅크린 자세로 돌아온 뒤, 제자리에서 힘차게 점프하며 머리 위로 박수를 칩니다. 4) 이 4단계 동작을 5~10회 연속으로 반복하고, 친구와 구령을 맞추거나 속도 대결로 변형합니다.</p>
