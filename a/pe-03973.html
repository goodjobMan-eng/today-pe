<h1>빨래 바구니 농구 슛 게임</h1>
<p>1) 체육관에 흰색 빨래 바구니들을 배치하고 바구니 주변에 원마커를 골고루 흩어 놓은 뒤 출발선에 팀별 훌라후프와 게이터볼을 둔다. 2) 2~3명으로 구성된 팀의 학생이 차례대로 원마커 위치로 달려가 서서 흰색 바구니를 향해 1번 슛을 던진다. 3) 슛이 바구니에 들어가면 슛을 던졌던 원마커를 주워 팀의 훌라후프로 가져와 모은다. 4) 슛을 실패하면 공을 팀원에게 전달하여 다음 사람이 도전할 수 있도록 한다.</p>
