<h1>도둑 잡기 (도적들의 공 걷어내기)</h1>
<p>1) 3명의 학생에게 조끼를 입혀 '도둑(도적)'으로 지정하고, 나머지 학생들은 경기장에 폼볼을 굴린다. 2) 일반 학생들은 도둑에게 공을 뺏기지 않도록 드리블하거나 서로 패스하며 공을 지킨다. 3) 도둑이 공을 가로채 체육관 외벽으로 차서 맞히면 그 공은 즉시 경기에서 제거된다. 4) 모든 공이 벽에 맞아 밖으로 제거될 때까지 진행하며, 종료 후 새로운 도둑을 선발한다.</p>
