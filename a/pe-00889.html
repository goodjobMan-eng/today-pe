<h1>용암 탈출 점프 트램펄린 운동</h1>
<p>1) 방 전체가 용암으로 변한 상황에서 트램펄린과 징검다리 스텝 패드를 활용해 안전하게 이동합니다. 2) 음악에 맞춰 트램펄린 위에서 다양한 점프와 스텝 동작, 킥 동작을 수행합니다. 3) 바닥에 놓인 스텝 패드로 건너뛰어 스쿼트나 런지, 버피 동작을 취한 뒤 다시 트램펄린으로 돌아옵니다. 4) 화면에 거대 뱀과 'FREEZE' 경고가 뜨면 제자리에서 멈추거나 날아오는 불꽃을 웅크려 피합니다.</p>
