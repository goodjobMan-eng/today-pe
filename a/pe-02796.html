<h1>종이컵 민첩성 스텝 운동</h1>
<p>1) 종이컵 2개를 양쪽에 두고 가운데에 선다. 2) 가운데에서 양쪽 종이컵 쪽으로 번갈아 스텝을 밟아 이동하며 10회를 1세트로 실시한다. 3) 종이컵 5개를 바닥에 별 모양으로 배치하고 가운데에 선다. 4) 별 모양 중심에서 대각선 방향 꼭짓점 쪽으로 왔다 갔다 이동하는 스텝을 실시한다.</p>
