<h1>신체 4박자 리듬 놀이</h1>
<p>1) 의자에 둥글게 둘러앉아 신체 부위를 활용해 4분음표 4개의 나만의 4박자 리듬을 만든다. 2) 순서를 정해 돌아가며 자신이 만든 4박자 신체 리듬을 차례대로 소개한다. 3) 한 친구가 발표한 신체 리듬을 다 같이 주의 깊게 관찰하고 똑같이 따라 하며 한 바퀴 돌아본다. 4) '도레미송' 같은 4/4박자 노래 반주에 맞춰 노래가 끝날 때까지 4박자 신체 리듬을 이어가며 표현한다.</p>
