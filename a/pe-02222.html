<h1>티볼 공 던지는 기본자세와 단계별 던지기 연습</h1>
<p>1) 검지와 중지를 벌려 공 위를 감싸고 손바닥을 뗀 상태에서 공을 잡는다. 2) 던지는 방향으로 손목을 움직여 위로 던지며 손가락 감각을 익힌다. 3) 무릎을 대고 앉아 상체를 회전하며 팔꿈치를 펴고 손가락 끝으로 공을 놓으며 던진다. 4) 일어서서 던질 곳을 향해 왼발을 내딛고 몸통 회전, 어깨, 팔꿈치, 손목, 손가락 힘을 연결하여 강하게 던진다.</p>
