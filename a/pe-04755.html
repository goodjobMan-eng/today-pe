<h1>애벌레 기차</h1>
<p>1) 모둠원들이 앞사람의 어깨나 등을 잡고 일렬 기차 대형으로 선다.2) 맨 앞사람부터 손을 떼지 않고 후프에 발과 머리를 차례로 넣어 통과시킨 뒤 뒷사람에게 넘긴다.3) 후프를 차례로 넘겨 마지막 주자 뒤 콘 안에 후프를 떨어뜨려 안착시키면 성공한다.</p>
