<h1>빈 곳을 공략하는 배구 서브 게임</h1>
<p>1) 6명씩 모둠을 구성하고 네트를 사이에 둔 뒤 훌라후프 5개를 상대 코트의 빈 공간에 배치한다. 2) 서버가 언더핸드 서브로 공을 넘기면 반대편 수비 모둠원 전원이 이어받기를 수행한다. 3) 이어받은 뒤 상대 코트의 훌라후프를 피해 빈 곳으로 공을 넘기면 1점을 획득한다. 4) 공격 후 서브 번호를 순환하며 수비 배치를 고려해 훌라후프 위치를 바꿔 난이도를 조절한다.</p>
