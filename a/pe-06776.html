<p>1) 콩주머니를 달걀이라고 생각하고 짝과 마주 보며 소중하게 던지고 받는다. 2) 둘 다 공을 안전하게 주고받는 데 성공하면 각자 뒤로 한 걸음씩 물러난다. 3) 던지거나 받다가 공을 놓치면 다시 원래 자리로 한 걸음 앞으로 다가와서 이어간다.</p>
