<h1>축구 콘 드리블 앤 슛 게임</h1>
<p>1) 양쪽에 골대를 두고 바닥 곳곳에 콘 장애물을 배치합니다. 2) 한쪽 골대를 향해 슛을 한 후 반대편 골대를 향해 공을 드리블하여 전진하며, 이동 중 바닥의 콘이나 다른 친구들과 부딪히지 않도록 주의합니다. 3) 반대쪽 골대 근처에 도달하면 다시 슛을 시도하며 양방향을 반복하여 발로 공을 다루는 횟수를 늘립니다. 4) 익숙해지면 콘을 지그재그로 돌거나 1바퀴 회전한 뒤 슈팅하는 규칙을 추가합니다.</p>
