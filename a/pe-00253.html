<h1>패드민턴 (핸들러 라켓 경기)</h1>
<p>1) 탁구와 배드민턴을 결합한 경기로, 두 팀으로 나누어 네트를 사이에 두고 마주 섭니다. 2) 서브는 대각선 방향으로 상대 코트에 넣으며, 점수가 짝수일 때는 오른쪽, 홀수일 때는 왼쪽에서 서브합니다. 3) 셔틀콕을 원바운드 없이 한 번에 쳐서 상대 코트의 빈 공간으로 넘겨 득점을 노립니다. 4) 1세트 25점씩 총 3세트를 진행하여 2세트를 먼저 이기는 팀이 승리합니다.</p>
