<h1>두뇌 회전 가위바위보 매트 앞구르기 놀이</h1>
<p>1) 매트 위에 매트 구르기 준비 자세를 취하고 교사(짝)와 정면을 바라보며 마주선다. 2) 상대가 구령과 함께 손으로 가위바위보를 제시하면 지정된 미션(같은 손 내기, 이기는 손 내기, 지는 손 내기)을 빠르게 판단한다. 3) 미션에 해당하는 손 모양을 그대로 유지하며 매트 위로 전방회전을 수행한 뒤 일어선다. 4) 발 모양으로 가위바위보를 변형하거나 지시어(승/패/비김)를 무작위로 제시하여 신체 순발력을 높인다.</p>
