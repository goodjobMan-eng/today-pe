<h1>불가능한 스쿼트 챌린지</h1>
<p>1) 발바닥을 바닥에 붙이고 무릎을 모아 쪼그려 앉은 뒤 양손을 뒷짐 지고 균형을 유지한다. 2) 벽 앞에서 양발 끝과 벽 사이에 검지손가락 하나 들어갈 정도의 틈을 두고 선다. 3) 턱과 손을 벽에 밀착한 상태를 유지하며 쪼그려 앉았다가 일어난다.</p>
