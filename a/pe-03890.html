<h1>크레이지볼 사커</h1>
<p>1) 강당 양쪽 끝에 매트 3개씩을 똑바로 세워 골대로 두고 중앙에 공 3개를 정렬한다. 2) 두 팀으로 나누고 각 팀은 3명의 골키퍼를 정해 골대를 지키며 나머지 선수는 코트에 배치된다. 3) 3개의 공을 동시에 사용하여 상대 골대 매트로 공을 차서 넣으면 득점한다. 4) 골을 넣은 사람은 'Score!'라고 외친 뒤 자기 팀 벽을 터치하고 돌아와야 다시 공을 만질 수 있다.</p>
