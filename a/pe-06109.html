<h1>강당 콘컵 다득점 축구</h1>
<p>1) 양쪽 골대 구역에 라바콘 6개를 격자로 세우고 가운데에 스태킹 컵(액티비티 컵) 10개를 피라미드 형태로 쌓는다.2) 학생들을 모둠으로 나누어 폼볼을 발로 차며 축구 경기를 진행한다.3) 공으로 상대편 콘이나 중앙의 컵을 쓰러뜨리면 넘어진 개수만큼 다득점하며, 수비가 걷어내다 공으로 자기 콘을 맞춰 쓰러뜨리면 자살골이 된다.</p>
