<h1>3가지 핵심 포인트로 완성하는 철봉 역회전(오름돌기)</h1>
<p>1) 엄지손가락을 봉 안쪽으로 감아쥐는 바른 그립(순수 또는 역수)으로 철봉을 잡는다2) 축이 되는 발을 앞에 두고 반대쪽 다리를 축구공을 차듯 강하게 위로 차올린다3) 팔꿈치를 굽힌 상태를 유지하여 몸과 철봉의 거리가 멀어지지 않게 유지한다4) 시선은 턱을 들지 않고 자신의 배꼽을 끝까지 보면서 몸을 둥글게 말아 봉 위로 올라탄다</p>
