<h1>협력 플랭크 다리 뛰어넘기 릴레이</h1>
<p>1) 3~4명이 한 모둠을 이루어 한 명은 바닥에 엎드려 정확한 팔꿈치 플랭크 자세를 취한다. 2) 주자는 플랭크를 하고 있는 친구의 다리 좌우를 양발 또는 한발로 번갈아 점프하며 뛰어넘는다. 3) 점프 주자나 플랭크 주자가 힘들어지면 모둠 내 다른 대기 학생과 즉시 역할을 교대한다. 4) 정해진 제한 시간(1~3분) 동안 모둠원이 릴레이로 역할을 바꿔가며 뛰어넘은 점프 누적 횟수를 합산하여 승부를 가린다.</p>
