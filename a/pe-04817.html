<h1>복근 실내화 옮기기</h1>
<p>1) 학급을 두 팀으로 나누어 일렬로 마주 보고 바닥에 앉는다.2) 각 팀의 시작점에 팀원들의 실내화를 모아 놓는다.3) 시작 신호가 울리면 맨 앞사람이 실내화를 손을 쓰지 않고 발로만 잡아 다음 사람에게 전달한다.4) 전달 도중 실내화를 바닥에 떨어뜨리면 해당 실내화는 다시 시작점으로 보내 다시 옮긴다.5) 시작점에 있던 모든 실내화를 끝나는 지점으로 먼저 옮긴 팀이 승리하며, 진 팀은 복근 운동으로 레그 드랍을 10회 실시한다.</p>
