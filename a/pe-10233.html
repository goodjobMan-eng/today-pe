<h1>꼬리잡기 피구</h1>
<p>1) 4명이 한 팀이 되어 1명은 외야로 나가고 3명은 내야에서 앞사람의 허리 옷을 잡아 줄을 섭니다. 2) 외야의 상대 팀은 공을 던져 내야 맨 뒤에 위치한 꼬리 학생을 맞힙니다. 3) 꼬리 학생이 공에 맞으면 아웃되어 외야로 나가며 끝까지 꼬리를 지키거나 상대를 아웃시키는 팀이 승리합니다.</p>
