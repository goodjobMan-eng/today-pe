<h1>허들 달리기 기본 기술 연습</h1>
<p>1) 시작 지점에서 속도를 붙여 허들로 달려간다. 2) 먼 거리에서 발구르기 발로 도약하고 리드 발을 앞으로 뻗으며 허들을 낮게 넘어간다. 3) 2대 이상의 허들 구간을 3걸음 리듬으로 감속 없이 연속 주파한다.</p>
