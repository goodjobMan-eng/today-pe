<h1>타바타 고급 과정</h1>
<p>1) 오른팔로 왼쪽 무릎을 찍고 양발을 교차시키는 팔꿈치로 무릎 찍기 동작을 10회 한다. 2) 다리를 어깨너비로 벌리고 양발을 번갈아 뒤로 내려가는 백런지 동작을 5회 한다. 3) 백런지 자세에서 다리를 대각선 안쪽으로 빼며 내려가는 사이드 백런지를 5회 한다. 4) 어깨너비로 서서 스쿼트 후 점프하는 점핑 스쿼트를 10회 한다. 5) 스쿼트 자세에서 땅을 짚고 양발을 뒤로 뻗었다가 당겨 일어나는 슬로우 버피를 5회 반복한다.</p>
