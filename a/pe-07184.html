<h1>포 웨이 프리스비</h1>
<p>1) 체육관 가장자리에 팀별로 약 3×3피트 크기의 골 구역을 설치하고 각자 골을 지킨다. 2) 프리스비를 던져 패스하고, 팀원이 상대 골 구역 안에서 패스를 받아내면 1점을 획득한다. 3) 프리스비를 든 채 달릴 수 없으며 수비수는 팔 길이 거리에서 1명만 붙을 수 있다.</p>
