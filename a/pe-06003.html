<h1>마우스 트랩(쥐덫)</h1>
<p>1) 고깔 콘 위에 체육 교구 담는 바구니를 살짝 올려놓고 준비한다.2) 가위바위보를 한 뒤 양 팀이 번갈아 가며 콩주머니를 던진다.3) 바구니를 맞춰 떨어뜨렸을 때 그 안에 들어간 콩주머니 개수나 점수를 획득한다.4) 바구니를 세로로 놓아 너비를 좁히거나 콩주머니 대신 공을 굴려 난이도를 조절할 수 있다.</p>
