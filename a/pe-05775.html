<h1>상황별 공 던지고 잡기 기초 연습</h1>
<p>1) 두 손으로 가슴 높이에서 한 발을 내밀며 던지고, 잡을 때는 팔을 내밀었다가 당겨주며 잡는다.2) 가슴 높이에서 팔을 뻗고 한 발 내밀며 바닥에 공을 한 번 튀겨서 패스하며, 한 손으로도 튀겨 패스한다.3) 공이 셀 때는 어깨 높이나 머리 위에서 한 발 내밀며 던진 뒤 배와 가슴으로 안전하게 받는다.</p>
