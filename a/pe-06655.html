<h1>피클볼 배구 랠리 게임</h1>
<p>1) 두 명씩 한 팀을 이루어 네트를 사이에 두고 코트에 선다. 2) 한 팀이 서브를 넣으면 상대 팀은 바로 넘기지 않고 1구가 바운드된 후 플레이를 시작한다. 3) 첫 번째 학생이 공을 드롭하여 띄워주고, 두 번째 학생이 스트로크로 받아친다. 4) 팀원 간 협력하여 3구 이내에 공을 네트 너머 상대 코트로 넘긴다. 5) 공이 아웃되거나 네트에 걸리면 실점하며 7점 또는 11점을 먼저 낸 팀이 승리한다.</p>
