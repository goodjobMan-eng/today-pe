<h1>농구 드리블 꼬리잡기 미니게임</h1>
<p>1) 콘과 콘 사이를 S자 모양으로 드리블하며 지나간다. 2) 심판이 던져주는 색과 같은 색 콘을 터치하고 되돌아온다. 3) 드리블하며 돌다가 휘슬 소리가 나면 반대 방향으로 돌면서 앞사람을 터치한다.</p>
