<h1>할로윈 호박 그리고 움직이기</h1>
<p>1) 제시된 두 가지 호박 모양 중 마음에 드는 디자인 하나를 고른다.2) 선택한 모양에 해당하는 운동(30초)을 수행한다.3) 연필을 들고 30초 동안 종이에 호박 윤곽을 그린다.4) 눈, 코, 입, 꼭지 모양도 각각 원하는 것을 고르고, 30초 운동 후 30초 동안 그림을 추가해 호박을 완성한다.</p>
