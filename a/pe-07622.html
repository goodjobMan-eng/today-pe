<h1>라 디아나 (La Diana)</h1>
<p>1) 경기장 중앙에 콘을 세우고 각 콘 위에 배구공을 올려놓는다. 2) 학급을 두 팀으로 나누어 경기장 양쪽 끝에 마주 보고 정렬한 뒤 학생마다 테니스공을 1개씩 쥐고 선다. 3) 신호가 울리면 테니스공을 던져 콘 위에 놓인 배구공을 맞혀 먼저 모든 배구공을 떨어뜨리는 팀이 승리한다.</p>
