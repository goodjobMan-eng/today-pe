<h1>스마트 기기 활용 매트 운동 과제 발견 및 협동 연습</h1>
<p>1) 4인 1모둠을 구성하고 자료 확인, 영상 촬영, 보조자, 수행자로 역할을 나눈다. 2) 보조자의 시작 신호에 맞추어 매트 위에서 목표 동작(앞구르기 등)을 전력을 다해 시도한다. 3) 촬영된 슬로 모션 영상과 참고 자료를 함께 보며 웅크려 서기 등 성공·미흡 요소를 분석한다. 4) 부족한 단계(경사대 구르기, 단차 매트 구르기 등)에 맞춘 맞춤형 보조 스테이션을 선택해 반복 연습한다.</p>
