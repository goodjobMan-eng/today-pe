<h1>체인 피구</h1>
<p>1) 팀 구분 없이 체육관 전체에 흩어져 서서 시작한다. 2) 공을 주워 다른 사람의 허리 아래를 맞히고, 공에 맞은 사람은 그 자리에 앉는다. 3) 앉아 있는 사람이 공을 얻어 서 있는 사람의 다리를 맞히면 맞은 사람은 앉고 던진 사람은 다시 일어선다. 4) 앉아 있는 사람이 다른 앉아 있는 사람에게 공을 패스(체인 연결)한 뒤 서 있는 사람을 맞히면 체인으로 연결된 앉은 사람들이 모두 함께 일어선다.</p>
