<h1>우리 반 슛돌이 게임</h1>
<p>1) 양 팀 주자는 신호에 맞춰 콘 바깥쪽을 돌아 공을 향해 달린다.2) 공을 먼저 잡은 사람은 공 차는 장소로 드리블하고, 공을 잡지 못한 사람은 골대로 가 수비한다.3) 공 차는 장소에서 골대로 슛을 넣어 골인하면 1점을 얻는다.4) 정해진 시간 동안 더 많은 점수를 얻은 모둠이 이긴다.</p>
