<h1>추수감사절 타임머신 프리즈 댄스</h1>
<p>1) 화면 속 칠면조를 도와 신나는 음악과 캐릭터 안무에 맞춰 자유롭게 춤춘다. 2) 농부가 화면에 불시에 등장하며 'FREEZE!' 신호가 뜨면 즉시 동작을 멈춘다. 3) 박물관 석상 포즈나 소스 바닥 버티기 등 제시되는 특별 정지 자세를 유지한다. 4) 포털을 통해 공룡 시대, 달, 서부 개척지 등 다양한 시대로 넘어가며 동작을 이어간다.</p>
