<h1>나이트타임 데이타임</h1>
<p>1) 양팔을 벌려 개인 공간을 확보하고 체육관 콘 안쪽 구역에 선다.2) 술래(교사)가 '데이타임(Daytime)'이라고 외치면 개구리처럼 바닥에 웅크렸다가 점프한다.3) '나이트타임(Nighttime)'이라고 외치면 몸을 공처럼 웅크리고 누워 잠자는 시늉을 한다.4) 다음 라운드에서는 점프할 때 개골개골(rivet rivet) 소리를 내거나, 낮 시간에 최대한 빠르게 뛰거나 높게 점프하는 등 동작을 바꿔 진행한다.</p>
