<h1>풍선 빙고</h1>
<p>1) 교실에서 풍선 5개를 서로 쳐서 계속 띄우며 놀이를 진행합니다. 2) 화면(모니터)에 빙고 줄 위치가 공개되면 10초 카운트다운 동안 풍선을 쳐서 빙고 자리 친구들에게 전달합니다. 3) 제한 시간 내에 빙고 자리에 있는 친구들이 모두 풍선을 잡고 일어서면 성공합니다.</p>
