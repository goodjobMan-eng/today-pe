<h1>초등 PAPS 체력측정 실기 종목 연습</h1>
<p>1) 준비운동으로 가벼운 스트레칭과 관절 돌리기를 충분히 실시한다. 2) 악력기는 손 크기에 맞추고 몸에 닿지 않게 주먹 하나 띄운 채 2~3초간 힘을 준다. 3) 앉아윗몸앞으로굽히기는 무릎을 굽히지 않고 호흡을 내쉬며 측정계를 민다. 4) 왕복오래달리기는 신호음 전 반환점을 통과하고 돌아설 때 힘을 빼고 턴한다.</p>
