<h1>앞구르기와 뒤구르기 기초 동작</h1>
<p>1) 앞구르기는 머리를 깊숙이 숙여 배꼽을 바라보며 손을 앞쪽 바닥에 짚고 목 뒤쪽이 매트에 닿도록 구른다 2) 앞구르기 후 다리와 발끝을 곧게 뻗은 채 손을 짚지 않고 일어선다 3) 뒤구르기는 웅크린 자세로 양손을 귀 옆에 대고 머리를 숙여 뒤로 구른다 4) 뒤로 구를 때 양손으로 매트를 강하게 밀어내며 일어선다</p>
