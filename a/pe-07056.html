<h1>물구나무서기 기초 (헤드스탠드)</h1>
<p>1) 매트 위에 두 손을 아래에 두고 머리를 앞에 두어 손과 머리가 삼각형 모양이 되도록 짚는다 2) 무릎이 바닥에 닿지 않게 다리를 펴고 걸어 들어와 무릎이 배에 닿게 엉덩이를 높이 든다 3) 한 발씩 엉덩이 쪽으로 들어 올려 균형을 잡은 뒤 두 다리를 위로 펴서 곧은 자세를 유지한다 4) 내려올 때는 한쪽 무릎씩 차례로 통제하며 천천히 내려온 뒤 일어서서 기지개를 켜며 마무리한다</p>
