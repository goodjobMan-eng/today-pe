<h1>휴지야! 날아라!</h1>
<p>1) 개인별로 티슈 1장을 준비하고 바닥의 출발선 뒤에 선다. 2) 선을 넘지 않은 상태에서 휴지 한쪽 끝을 손으로 잡고 날린다. 3) 정해진 구역에 들어가면 10점을 얻고, 들어가지 않은 경우 멀리 간 순서대로 8점, 6점, 4점, 2점을 얻는다. 4) 모둠 번호 순서대로 나와서 대결하여 합산 점수가 더 높은 모둠이 승리한다.</p>
