<h1>창의적 움직임과 즉흥 표현</h1>
<p>1) 짝과 마주 보고 서서 리더를 번갈아 맡으며 리더의 동작을 그대로 따라 한다. 2) 한 사람이 동작을 하면 상대방은 그 동작에 반응하는 움직임을 취한다. 3) 장애물 코스를 통과하며 모양 만들기, 장애물 넘기, 길 선택하기를 즉흥적으로 수행한다.</p>
