<h1>네트 너머로 공 치고 받기 게임</h1>
<p>1) 4명이 한 모둠을 이루고 두 모둠이 게임을 합니다. 2) 손으로 공을 쳐서 네트 너머로 보냅니다. 3) 넘어온 공은 바로 받거나 바닥에 한 번 닿은 뒤에도 받을 수 있으며, 공을 받은 자리에서 손으로 쳐서 다시 네트 너머로 보냅니다. 4) 상대 모둠이 공을 받지 못하거나 네트를 넘기지 못하면 1점을 얻고, 11점을 먼저 얻은 모둠이 이깁니다.</p>
