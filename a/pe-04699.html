<h1>스트래들 볼 (다리 벌려 손치기)</h1>
<p>1) 학생들이 원을 만들어 다리를 벌리고 서서 손으로 공을 쳐서 다른 사람의 다리 사이로 통과시키려 한다. 2) 공이 자신의 다리 사이를 통과하면 1스트라이크를 받는다. 3) 공을 공중으로 쳐서 다른 사람이 잡거나 누군가의 다리 위로 원 밖으로 넘어가면 친 사람이 스트라이크를 받는다. 4) 3스트라이크를 받으면 체육관 내의 다른 모둠으로 이동하여 탈락 없이 게임을 계속한다.</p>
