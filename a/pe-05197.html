<h1>스노우 데이 술래잡기</h1>
<p>1) 술래들은 하얀 눈덩이(폼볼)를 들고 다른 사람을 잡으러 다닌다.2) 술래가 눈덩이를 떨어뜨리면 술래의 태그 권한을 잃는다.3) 술래에게 태그된 사람은 그 자리에 앉아야 한다.4) 앉아 있는 사람에게 다른 참가자가 다가가 눈 오는 날 집에서 무엇을 했는지 서로 이야기해 주면 풀려난다.</p>
