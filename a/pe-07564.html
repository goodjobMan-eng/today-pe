<h1>공 굴려서 표적 맞히기</h1>
<p>1) 표적을 세우고 출발선에서 거리를 정해 선다. 2) 작은 공은 한 손으로, 큰 공은 두 손으로 쥐고 힘을 조절해 표적 가까이로 굴린다. 3) 발로 할 때는 공을 정지시킨 상태에서 발 안쪽(인사이드)으로 살짝 밀어 차 표적 가까이 보낸다.</p>
