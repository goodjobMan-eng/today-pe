<h1>전략! 성을 지켜라</h1>
<p>1) 총 4개 팀으로 나누어 팀 조끼를 입고 점보스택을 5-4-3-2-1개씩 15개 피라미드로 쌓아 성을 만든다. 2) 각 팀에서 수비 1명을 정해 성 앞에 배치하고 나머지 팀원은 공격수로 대기한다. 3) 시작 신호와 함께 각 팀 공격수가 다른 팀 성으로 달려가 수비와 가위바위보를 한다. 4) 가위바위보에서 이기면 상대의 점보스택 1개를 가져와 자기 팀 성 옆쪽에 쌓고 지면 그냥 돌아가 다음 공격수와 하이파이브를 한다.</p>
