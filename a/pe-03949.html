<h1>봅슬레이 썰매 달리기</h1>
<p>1) 스쿠터보드 4개를 연결하고 위에 매트 1장을 올려 4~5인 1조로 봅슬레이를 구성한다. 2) 절반의 학생은 매트 위에 완전히 탑승하고 나머지 학생들은 썰매를 밀고 조종한다. 3) 빨강, 주황, 노랑, 초록, 파랑, 보라 순서로 배치된 6개 콘 체크포인트를 통과하여 완주한다. 4) 한 바퀴를 돌고 나면 탑승자와 미는 사람의 역할을 맞바꾸어 진행한다.</p>
