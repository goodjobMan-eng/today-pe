<h1>실내 축구 기본기 4가지 연습</h1>
<p>1) 발끝을 사용하여 공을 무릎 높이 이하로 가볍게 차올리며 저글링을 연습한다. 2) 제자리에서 인사이드, 아웃사이드, 발바닥 등을 활용해 다양한 볼 마스터리 동작을 반복한다. 3) 두 개의 콘을 두고 그 사이를 8자 모양으로 돌며 오른발, 왼발, 인사이드, 아웃사이드로 드리블한다. 4) 소파나 벽 아래를 향해 공을 차고 튀어나오는 공을 인사이드와 아웃사이드로 연속 패스 및 리시브한다.</p>
