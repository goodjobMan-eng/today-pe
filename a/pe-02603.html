<h1>축구 드리블 기초 및 공 뺏기 게임</h1>
<p>1) 발끝(인프런트), 발 안쪽(인사이드), 발등 바깥쪽(아웃사이드)으로 공을 밀며 드리블을 익힌다. 2) 놓여 있는 라바콘 사이를 지그재그로 통과하며 드리블 연습을 한다. 3) 동그란 경기장에서 각자 자기 공을 지키면서 다른 친구의 공을 밖으로 쳐낸다.</p>
