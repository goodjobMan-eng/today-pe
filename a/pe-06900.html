<h1>기초 움직임 기술 달리기</h1>
<p>1) 머리와 상체를 곧게 세우고 시선은 앞을 바라본다 2) 발 앞부분(발볼)으로 착지하며 낮은 계단을 오르듯 무릎을 높이 들어 올린다 3) 팔꿈치를 90도로 굽히고 팔이 몸통 앞을 가로지르지 않게 몸 옆에서 앞뒤로 흔든다 4) 발이 몸통 바로 아래에 착지하도록 하며 지면을 세게 치지 않고 조용하고 가볍게 달린다</p>
