<h1>전통 놀이 5종 스테이션 릴레이</h1>
<p>1) 1단계는 공기놀이로 모둠원 모두 한 번씩 성공합니다. 2) 2단계는 투호로 모둠원 모두 한 번씩 성공합니다. 3) 3단계는 제기차기로 모둠 합쳐 6개 이상 차면 성공합니다. 4) 4단계는 윷던지기로 연속으로 걸 이상이 모두 나오면 성공합니다. 5) 5단계는 딱지 넘기기로 한 명당 한 번씩 모둠원 모두 넘기면 성공합니다.</p>
