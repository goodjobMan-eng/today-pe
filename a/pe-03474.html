<h1>순간적으로 강한 힘을 내는 운동</h1>
<p>1) 양발을 모아 미니 허들을 뛰어넘는다. 2) 양발을 어깨너비만큼 벌리고 서서 양손으로 공을 잡고 머리 뒤로 보낸 뒤, 허리를 뒤로 젖혔다가 몸을 일으키며 공을 힘껏 던진다. 3) 제자리에서 무릎을 굽혀 앉아 양손을 어깨너비로 벌려 매트를 짚고 양발을 뒤로 뻗어 엎드린 후 다시 가슴까지 끌어당겨 일어선다.</p>
