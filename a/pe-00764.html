<h1>베러 웬 아임 댄싱 피트니스 웜업</h1>
<p>1) 경쾌한 팝송 리듬에 맞추어 제자리에서 스텝을 밟으며 따라 하는 댄스 웜업을 시작합니다. 2) 제자리에서 가볍게 조깅하듯 뛰며 음악의 리듬을 익힙니다. 3) 무릎을 높이 들어 올리며 팔을 뻗고, 양옆으로 사이드 스텝을 밟으며 골반을 흔듭니다. 4) 점핑잭과 팔 벌려 뛰기 동작을 반복하며 전신 관절과 근육을 유연하게 풀어줍니다.</p>
