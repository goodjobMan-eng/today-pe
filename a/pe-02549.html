<h1>배구 언더핸드 패스 기본자세 및 벽 패스 연습</h1>
<p>1) 편한 발을 반 보 뒤로 빼고 뒤꿈치를 살짝 든 채 하체 자세를 낮춘다. 2) 양손을 모아 엄지를 아래로 내리고 팔을 곧게 펴 평평한 면을 만든다. 3) 팔만 휘두르지 않고 하체의 중심 이동과 무릎 반동으로 혼자 공을 띄우는 연습을 한다. 4) 벽을 마주보고 공을 던진 후 튀어나오는 공을 언더핸드 패스로 연속해서 받아낸다.</p>
