<h1>철봉 글라이더(비행기 내리기) 연습법</h1>
<p>1) 철봉에 뛰어오르거나 한 발씩 걸쳐 철봉 위에 두 다리를 벌리고 올라타는 연습을 한다. 2) 철봉을 잡고 매달린 상태에서 반동을 주어 앞으로 멀리 착지하는 점프 연습을 한다. 3) 철봉 위에 다리를 올린 후 엉덩이를 철봉 아래로 통과시키며 반동으로 다리를 놓고 앞으로 날아가 착지한다.</p>
