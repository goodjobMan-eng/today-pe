<h1>교실 초성 릴레이 모둠 놀이</h1>
<p>1) 칠판에 모둠 번호를 적고 교사가 제시할 초성 자음을 판서한다.2) 모둠원들은 자음 초성에 맞는 서로 다른 낱말을 모둠원 수만큼 회의하여 정한다.3) 단어를 모두 정한 모둠은 교사 앞으로 나와 일렬로 선다.4) 1초 안에 머뭇거리지 않고 차례대로 서로 다른 단어를 말하면 성공한다.5) 1등 모둠은 동그라미 2개, 2등 모둠은 1개를 획득하며 다음 초성으로 반복한다.</p>
