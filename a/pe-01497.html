<h1>3인 1조 십자가 균형 공중 부양</h1>
<p>1) 양쪽의 받침자 2명은 한쪽 무릎을 꿇고 가운데 탑승자의 겨드랑이 밑으로 손을 넣어 맞잡아 준비한다. 2) 신호 구령에 맞춰 받침자는 안쪽 다리로 일어나며 밀어 올리고 가운데 탑승자는 가볍게 제자리 점프한다. 3) 공중에 뜬 탑승자는 양팔과 온몸을 곧게 펴 십자가 모양을 유지하며 정지 동작으로 버틴다. 4) 착지 신호에 맞춰 안전하게 착지하고 익숙해지면 공중 정지 시간을 3초에서 5초로 늘려 도전한다.</p>
