<h1>전원 터치 협동 풍선공 펀이볼</h1>
<p>1) 코트 중앙에 낮은 네트나 라인을 치고 모둠별로 4~5명씩 양 팀으로 나뉘어 위치한다. 2) 서브된 풍선공을 팀원 전체가 최소 한 번씩 차례대로 손으로 쳐서 연결한 후 상대 코트로 넘긴다. 3) 팀 내 지정된 지목 플레이어가 공을 터치하여 넘기면 보너스 2점을 획득하고 실점한 팀은 스쿼트 미션을 수행한다. 4) 팀원 전원 터치 규칙 외에 바운드 횟수 허용이나 연속 터치 규칙을 변형하여 랠리 지속 시간을 늘린다.</p>
