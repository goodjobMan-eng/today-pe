<h1>우주비행사와 화성인 놀이</h1>
<p>1) 학생 일부를 우주비행사로 정하고 발목에 줄로 풍선(산소통)을 묶는다. 2) 나머지 학생들은 화성인이 되어 우주비행사의 풍선을 밟아 터뜨리려 시도한다. 3) 풍선이 터진 우주비행사는 화성인으로 변하며 모든 우주비행사가 잡히면 라운드가 종료된다.</p>
