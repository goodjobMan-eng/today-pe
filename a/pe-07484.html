<h1>사냥개 술래잡기 (뻬로 카사도르)</h1>
<p>1) 경기장 네 구석에 매트 4장을 깔고 각 매트마다 학생 모둠을 배치한다. 2) 조끼를 입은 사냥개 팀을 정하고 교사가 출발 신호를 외치면 다른 모둠 학생들을 쫓아 술래잡기를 시작한다. 3) 술래에게 태그된 학생들은 원래 자신의 매트로 돌아가며 모든 학생이 잡히면 역할을 교대한다.</p>
