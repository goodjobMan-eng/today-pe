<h1>뿅망치 달리기</h1>
<p>1) 양 팀에서 한 명씩 가운데로 나와 가위바위보를 한다. 2) 가위바위보에서 진 사람은 뿅망치를 들고 이긴 사람을 쫓아간다. 3) 뿅망치를 피해 출발선까지 무사히 도착하면 이긴 팀이 1점을 획득하고, 도착 전에 치면 진 사람 팀이 1점을 획득한다. 4) 뿅망치를 든 사람은 고깔콘이 세워진 가운데 자리에 원래대로 갖다 놓고, 각 팀이 한 바퀴를 돌 때까지 반복하여 총점으로 승패를 가린다.</p>
