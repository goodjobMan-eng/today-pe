<h1>기사 치기 (기사 술래잡기)</h1>
<p>1) 2명을 제외한 모든 학생은 바닥에 최소 2미터 간격으로 앉는다. 2) 술래는 도망자를 쫓아가서 잡으며, 도망자가 앉아 있는 친구 뒤에 앉으면 그 친구가 새로운 술래(사냥꾼)가 된다. 3) 원래 술래였던 사람은 쫓기는 도망자가 되어 게임이 계속 이어진다.</p>
