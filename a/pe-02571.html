<h1>BEEF 구호를 활용한 농구 슛 연습</h1>
<p>1) 발을 어깨너비로 벌리고 무릎을 굽혀 균형(Balance)을 잡는다. 2) 시선(Eyes)은 림의 뒤쪽에 둔다. 3) 슛을 쏘는 손의 팔꿈치(Elbow)를 아래로 향하게 정렬한다. 4) 무릎을 펴면서 손목을 스냅하여 던지고 팔로우 스루(Follow-through) 동작을 유지한다.</p>
