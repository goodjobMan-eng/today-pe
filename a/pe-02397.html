<h1>츄크볼 리바운더를 활용한 티볼 수비 송구 연습</h1>
<p>1) 두 팀으로 나누어 각각 츄크볼 리바운더 앞에 일렬로 선다. 2) 정면에서 굴러오거나 튕겨 나온 공을 두 손으로 캐치한 후 글러브에서 빠르게 공을 뺀다. 3) 측면으로 방향을 전환하고 허리를 회전하며 정면의 홈(그물망)을 향해 강하고 정확하게 송구한다. 4) 송구한 공이 그물망에 들어갈 때마다 1점씩 점수를 획득한다.</p>
