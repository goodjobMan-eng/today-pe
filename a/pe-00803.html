<h1>봄맞이 둘 중 하나 선택 홈트레이닝</h1>
<p>1) 화면에 제시되는 봄 관련 두 가지 선택지 중 자신이 선호하는 쪽을 선택합니다. 2) 선택에 따라 화면의 왼쪽 또는 오른쪽 공간으로 몸을 이동합니다. 3) 화면이 전환되면 자신이 선택한 쪽에 지정된 맨몸 운동(푸시업, 런지, 레그레이즈 등) 또는 스트레칭을 30초 동안 수행합니다. 4) 매 라운드 카운트다운에 맞춰 서로 다른 근력 운동과 댄스, 밸런스 동작을 반복합니다.</p>
