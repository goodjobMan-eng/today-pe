<h1>모서리 가위바위보</h1>
<p>1) 교실 네 모서리에 콘을 두고 칠판 앞에는 의자(왕자리)를 둔다. 2) 모든 학생이 1단계 콘에서 만나 가위바위보를 한다. 3) 이긴 사람은 다음 단계 콘으로 이동하고 진 사람은 이전 단계로 돌아가거나 머문다. 4) 4단계를 통과한 학생은 왕자리 의자에 앉은 학생과 대결하여 이기면 왕의 자리를 차지한다.</p>
