<h1>저학년 대장공</h1>
<p>1) 양 팀이 원마커 위 또는 경기장 구역에서 패스를 연결하며 빈 공간으로 이동한다.2) 선 밖의 대장에게 패스하여 대장이 공을 받으면 골인되어 점수를 올린다.3) 득점 후 상대 팀 볼로 시작하거나 공이 라인 밖으로 나가면 상대 팀이 시작하며, 공 없는 사람만 이동한다.</p>
