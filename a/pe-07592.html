<h1>색깔 색종이 순서 맞추기 릴레이</h1>
<p>1) 참가자들은 두 모둠으로 나뉘어 줄을 서고 앞쪽에 색깔 색종이들을 둔다. 2) 진행자가 색깔 순서를 부르면 각 팀 주자가 달려가 색종이를 그 순서대로 배치한다. 3) 가장 먼저 올바른 순서로 완성한 팀이 득점하며 점수가 가장 높은 팀이 승리한다.</p>
