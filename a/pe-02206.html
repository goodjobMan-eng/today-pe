<h1>교실 공굴려 부활피구 놀이</h1>
<p>1) 책상을 모둠으로 붙이고 통로를 확보한 뒤, 책상 위에 부활용 팀조끼 2개를 올려놓는다. 2) 공격팀 5명은 팀조끼를 입고 공 2개를 가진 채 바닥으로 굴려 피하는 팀의 발목을 맞춘다. 3) 공에 발목이 닿은 학생은 아웃되어 근처 책상에 걸터앉는다. 4) 피하는 학생이 책상 위의 팀조끼를 아웃된 친구에게 전달하고, 아웃된 학생이 팀조끼를 던져 공격수를 맞추면 부활하며 정해진 시간(5분) 동안 아웃된 학생 수를 센다.</p>
