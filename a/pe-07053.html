<h1>빈백 던지기 게임</h1>
<p>1) 훌라후프(또는 양동이, 표적) 5개를 일렬로 배치하고, 출발선 뒤에 선다. 2) 두 참가자가 서로 다른 색상의 콩주머니를 각자 10~12개씩 받아 번갈아 가며 각 후프 안에 던져 넣는다. 3) 모든 콩주머니를 던진 후 후프에 들어가지 않은 콩주머니만 회수하여 다시 던지며, 모든 후프에 콩주머니를 먼저 다 넣는 사람이 승리한다.</p>
