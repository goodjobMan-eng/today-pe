<h1>손에 손잡고 이어달리기</h1>
<p>1) 출발점과 반환점에 라바콘을 설치하고 팀 조끼를 입어 팀을 나눈다. 2) 첫 주자는 혼자 달려 반환점을 돌아온다. 3) 출발선으로 돌아와 다음 주자와 손을 잡고 함께 반환점을 돌아온다. 4) 같은 방법으로 반환점을 돌 때마다 출발선에서 1명씩 손을 잡고 추가하여 달리며 모든 팀원이 손을 잡고 먼저 돌아오면 승리한다.</p>
