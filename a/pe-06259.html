<h1>사과, 배, 수박</h1>
<p>1) 술래는 벽이나 나무를 등지고 돌아선다.2) 술래가 여름철에 볼 수 있는 단어를 세 번 반복해서 부를 때만 다른 친구들이 이동한다.3) 술래가 여름과 관련 없는 단어를 말하면 움직이지 못하며, 뒤돌아봤을 때 움직이면 잡힌다.4) 등을 터치하고 출발선으로 돌아갈 때 잡히면 술래가 된다.</p>
