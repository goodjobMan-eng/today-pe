<h1>코어 트레이닝 워밍업 프로그램</h1>
<p>1) 양손을 깍지 끼고 위로 뻗은 뒤 어깨너비로 발을 벌리고 배꼽을 축으로 몸을 좌우로 10회 기울인다. 2) 손을 위로 뻗어 가슴을 펴며 턱을 5초간 들었다 내리는 동작을 5회 반복한다. 3) 팔꿈치를 굽혀 어깨에 댄 채 앞으로 10회, 뒤로 10회 크게 돌린다. 4) 정면을 본 채 축이 흔들리지 않게 상체를 좌우로 10회 비틀고, 이어 한 발로 서서 발목을 잡고 앞쪽 허벅지를 늘려준다.</p>
