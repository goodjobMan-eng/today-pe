<h1>고장난 장난감</h1>
<p>1) 팔꿈치, 머리, 어깨, 발등 등 정해진 신체 부위에 빈백을 올린다.2) 장난감 파괴자 역할을 맡은 술래를 피해 도망간다.3) 빈백이 떨어져 고장 난 친구는 다른 친구가 도와주어 다시 올린다.4) 술래는 도와주는 친구의 빈백은 떨어뜨리지 못한다.5) 게임 후 가장 많은 친구를 도와준 학생을 칭찬하거나, 모두 고장 난 장난감이 되면 술래가 승리한다.</p>
