<h1>주사위 행운의 숫자 줄넘기</h1>
<p>1) 각 팀에서 3명씩 나와 동시에 주사위를 던진다. 2) 주사위 숫자가 더 크게 나온 사람이 승리하며, 나온 숫자만큼 걸리지 않고 줄넘기를 뛴다. 3) 정해진 횟수를 연속 성공하면 1점을 얻고, 다시 처음부터 그 횟수를 채울 때마다 추가 점수를 얻는다. 4) 상대방은 수비로서 주사위를 계속 굴려 6이 나올 때까지 반복하며, 6이 나오면 상대의 줄넘기 공격이 종료된다.</p>
