<h1>훌라후프 누적 릴레이</h1>
<p>1) 각 팀의 첫 주자가 훌라후프를 들고 반환점 콘을 돌아온다. 2) 출발선으로 돌아와 대기 중인 모든 팀원이 훌라후프 안을 통과한다. 3) 다음 주자가 합류하여 같은 코스를 달린다. 4) 모든 팀원이 줄에 합류하여 왕복 코스를 가장 먼저 완주한 팀이 승리한다.</p>
