<h1>플로어하키 기초 경기 규칙</h1>
<p>1) 코트 중앙에서 양 팀 대표 선수가 스틱과 바닥을 번갈아 3회 두드리는 페이스오프로 경기를 시작한다. 2) 골키퍼 구역(박스) 안에서 슛을 하거나 들어가면 득점이 무효 처리되며, 골키퍼만 공을 손으로 잡아 팀원에게 굴려줄 수 있다. 3) 스틱을 허리 위로 올리거나(하이스틱), 신체 접촉을 하거나, 발로 공을 밟으면 반칙이 선언되어 상대팀에게 공격권이 넘어간다.</p>
