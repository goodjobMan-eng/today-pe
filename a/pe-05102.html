<h1>3인 코토로코토로 (꼬리잡기 놀이)</h1>
<p>1) 세 명이 술래 1명, 어미(앞사람) 1명, 꼬리(뒷사람) 1명으로 역할을 나눈다.2) 어미와 꼬리는 서로를 잡고 한 줄로 서며, 술래는 꼬리를 터치하려 움직인다.3) 정해진 제한 시간(10초) 동안 술래는 꼬리를 노리고 어미는 이를 막는다.4) 시간이 끝나거나 터치되면 역할을 교대하여 진행한다.</p>
