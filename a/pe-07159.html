<h1>핀 다운</h1>
<p>1) 바닥에 훌라후프를 배치하고 그 안에 플라스틱 핀을 세워 각자의 홈베이스를 만든다. 2) 수비자는 자신의 핀을 지키고, 나머지 대기자들은 경기장 가장자리에서 차례를 기다린다. 3) 피구공을 던져 상대방의 핀을 넘어뜨리면 대기자들이 외치며 넘어진 선수는 나가고 대기자가 교대해 들어온다.</p>
