<h1>체조봉 협동 릴레이 게임</h1>
<p>1) 짝과 함께 체조봉만을 사용하여 평평한 콘을 떨어뜨리지 않고 상자까지 운반한다. 2) 짝과 체조봉으로 작은 공을 먼저 운반한 뒤 바로 이어 테니스공을 상자까지 떨어뜨리지 않고 운반한다. 3) 모둠별로 달리지 않고 테니스공을 운반하거나 체조봉으로 공을 던지고 받는 등 창의적인 협동 과제를 스스로 만들어 수행한다.</p>
