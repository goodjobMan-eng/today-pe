<h1>진화 가위바위보</h1>
<p>1) 모든 참가자는 가장 첫 단계인 병아리 자세(웅크린 자세)로 구역 안을 이동합니다. 2) 같은 동물 단계인 사람끼리 만나 가위바위보를 하고, 이기면 다음 단계로 진화하고 지면 이전 동물(또는 병아리) 단계에 머뭅니다. 3) 병아리에서 토끼(점프 이동), 고릴라를 거쳐 최종적으로 사람으로 진화합니다. 4) 제한 시간 내에 사람으로 진화한 사람은 성공하여 코트 밖으로 나옵니다.</p>
