<h1>슈퍼 마리오 인터랙티브 바디 트레이닝</h1>
<p>1) 학생들은 스크린 앞에 서서 개인 공간을 확보하고 준비 운동 자세를 취한다. 2) 화면 속 마리오 장애물에 맞춰 점프, 오리걸음 숙이기, 슈퍼스피드 제자리달리기를 실시한다. 3) 레벨별로 부끄부끄 프리즈 멈추기, 마운틴 잭, 수영 팔젓기, 펀치 및 킥 동작을 타이밍에 맞춰 수행한다. 4) 보스전 웅크리기와 쿵쿵 점프 등 8단계 미션을 완료하여 스테이지를 클리어하고 득점감을 느낀다.</p>
