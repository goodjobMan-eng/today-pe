<h1>농구 테마 둘 중 하나 선택 운동</h1>
<p>1) 화면에 제시되는 농구 관련 두 가지 선택지 중 자신이 선호하는 것을 하나 고릅니다. 2) 오른쪽 그림이 좋으면 오른쪽으로, 왼쪽 그림이 좋으면 왼쪽으로 몸을 이동합니다. 3) 화면이 전환되면 자신이 선택한 쪽에 해당하는 운동 및 스트레칭 동작을 확인합니다. 4) 30초 카운트다운 동안 캐릭터나 시범자의 동작을 적극적으로 따라 하며 운동합니다.</p>
