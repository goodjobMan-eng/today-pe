<h1>해적 다리 만들기 버티기</h1>
<p>1) 바닥에 엎드려 팔뚝(전완)과 발가락으로 바닥을 지탱하는 플랭크 자세를 취한다. 2) 해적 선원들이 개울을 건널 수 있도록 자세를 40초 동안 흐트러짐 없이 유지한다. 3) 자세 유지가 너무 힘들면 무릎을 바닥에 댈 수 있지만 등은 곧게 세워 유지해야 한다.</p>
