<h1>라인 점프 키즈 트레이닝</h1>
<p>1) 바닥에 테이프, 줄넘기, 양말 등을 이용해 안전하게 넘을 수 있는 기준선을 만든다.2) 선을 사이에 두고 스키 점프, 180도 회전 점프, 한 발 점프, 크로스오버, 3단계 스텝 등 화면의 동작을 따라 뛴다.3) 짝이 있으면 교대로 번갈아 뛰고, 혼자 할 때는 쉬는 구간에 제자리에서 호흡을 가다듬으며 휴식한다.</p>
