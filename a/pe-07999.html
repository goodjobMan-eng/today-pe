<h1>삼밀 회피형 체육 수업 10가지 아이디어</h1>
<p>1) 4면 피구는 코트를 4개 구역으로 나누어 대각선끼리 같은 팀으로 구성하고 2개 이상의 공으로 진행한다. 2) 티볼은 팀 전원이 2타석씩 친 뒤 공수 교대하며 수비수가 공을 잡고 홈 베이스를 밟으면 아웃된다. 3) 라인 축구는 필드 내 공격 인원을 제한하고 외곽 도우미(오타스케맨)를 배치하여 손으로 패스할 수 있게 운영한다.</p>
