<h1>탁구라켓과 공을 이용한 공놀이</h1>
<p>1) 한 손에 탁구라켓을 잡고 공이 바닥에 닿지 않게 위로 띄운다. 2) 양손에 라켓을 하나씩 들고 번갈아가며 공을 위로 띄운다. 3) 2명이 마주 보고 앉아 바닥에 닿지 않게 공을 주고받는다. 4) 일정한 거리에서 라켓으로 공을 쳐 바구니나 통에 바운드 없이 또는 바운드해서 넣는다.</p>
