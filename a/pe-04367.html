<h1>마리오 몬스터 런 마법 해제 브레인 브레이크</h1>
<p>1) 화면 속 마리오 일행이 갈 방향을 지정된 포즈를 취해 선택한다. 2) 진행 경로에 나타나는 블록을 펀치로 치고 장애물에 맞춰 점프, 숙이기, 피하기 동작을 한다. 3) 다른 그림 찾기 미니게임이 나오면 제시된 세 가지 차이점을 찾으면서 해당 포즈를 유지한다. 4) 파워업 아이템을 획득할 때까지 코스를 완주하여 마법을 해제한다.</p>
