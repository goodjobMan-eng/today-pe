<h1>펀스틱 2인 3각 게임</h1>
<p>1) 두 사람이 나란히 서서 안쪽 발의 발등 위에 펀스틱을 가로로 올린다.2) 양 끝에 선 사람은 바깥쪽 다리를 벌려 균형을 잡고, 안쪽 손을 잡은 채 호흡을 맞춰 전진한다.3) 이동 중 펀스틱이 떨어지면 그 자리에서 다시 발등에 올리고 출발하며, 반환점을 돌아온다.</p>
