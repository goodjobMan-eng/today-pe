<h1>매트운동 응용동작 6가지 익히기</h1>
<p>1) 매트나 두꺼운 이불을 바닥에 깔고 주변 장애물을 치운다. 2) 누워서 다리 들어 버티기, 팔 짚고 다리 들어 올리기, 엉덩이 들어 버티기를 각 10초씩 실시한다. 3) 엎드려서 한쪽 팔과 다리 교차로 들기, 양팔과 양다리 동시에 들어 슈퍼맨 자세 유지하기를 각 10초씩 한다. 4) 엎드려 뻗친 상태에서 한 팔과 반대쪽 다리를 들어 수평을 유지하는 균형 동작을 10초간 버틴다.</p>
