<h1>농구 원핸드 및 투핸드 슛 성공률 높이기</h1>
<p>1) 원핸드 슛은 엄지와 새끼손가락으로 공을 고정하고 나머지 세 손가락의 스냅과 손목을 젖혀 슛을 한다. 2) 패스를 받거나 드리블 후 왼발, 오른발 스텝을 딛고 점프하며 슛 동작을 연결한다. 3) 힘이 부족하거나 거리가 멀 때는 두 손을 가슴 앞에 모으고 엄지를 위로 향하게 하여 점프하며 투핸드 슛을 한다. 4) 슛이 잘 들어가지 않을 때는 백보드 안쪽 사각형 네모칸을 조준하여 맞춘다.</p>
