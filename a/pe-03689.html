<h1>라인 술래잡기</h1>
<p>1) 강당 바닥의 라인을 확인하고 술래를 정한다. 2) 시작 신호가 울리면 모든 참가자는 오직 코트 라인 위로만 이동하며 술래잡기를 진행한다. 3) 술래에게 터치된 사람은 술래 역할을 넘겨받아 교대한다. 4) (변형) 라인 위에 마커 등 장애물을 배치하여 뛰어넘으며 이동하게 하거나, 코트 크기 및 술래 수를 변경한다.</p>
