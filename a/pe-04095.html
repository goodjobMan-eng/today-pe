<h1>플라잉디스크 캐치와 패스 게임</h1>
<p>1) 평행하게 마주 보고 서서 날아오는 디스크를 위아래 두 손으로 잡는 엘리게이터 캐치를 연습한다. 2) 3인 1조를 구성하여 양 끝의 두 사람이 서로 디스크를 던져 패스를 주고받는다. 3) 가운데 있는 수비 학생은 중간에서 날아오는 디스크를 가로채 잡는 킵어웨이(원숭이 놀이)를 진행한다. 4) 트랙을 돌다가 멈추는 신호에 맞춰 오존 구역(표적 영역) 안으로 디스크를 던져 넣는 놀이를 진행한다.</p>
