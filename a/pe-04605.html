<h1>포 코너 태그 게임</h1>
<p>1) 체육관 네 모퉁이에 매트를 세워 달리기 라인을 만든다. 2) 두 팀으로 나누어 양쪽 사이드라인에 대기한다. 3) 각 팀 첫 번째 주자가 태그 스틱을 들고 매트 바깥쪽으로 한 바퀴 돌아 다음 팀원에게 전달한다. 4) 상대 팀 주자를 태그하면 1점을 획득한다.</p>
