<h1>머리 위로 공 전달하기 릴레이 놀이</h1>
<p>1) 모둠별로 1번부터 4번까지 순서를 정하고 1번부터 맨 앞에 서서 도착선을 등지고 한 줄로 선다. 2) 시작 신호가 울리면 맨 앞사람부터 공을 머리 위로 뒤쪽으로 전달한다. 3) 공을 뒤로 전달한 사람은 제빨리 줄의 가장 뒤쪽으로 뛰어가 다시 공을 받을 준비를 한다. 4) 공을 계속 뒤로 전달하다가 공이 도착선 안으로 들어오면 만세를 외치며, 먼저 들어온 모둠이 이긴다.</p>
