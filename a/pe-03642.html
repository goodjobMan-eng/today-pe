<h1>배구 언더핸드 서비스 연습</h1>
<p>1) 왼손으로 공을 티볼대처럼 받쳐 들고 던지지 않는다. 2) 주먹을 쥐고 살이 많은 부분으로 맞추도록 준비한다. 3) 오른손을 뒤로 적당히 백스윙한 뒤 앞으로 밀듯이 팔로우스루하며 친다. 4) 둘이 마주보고 서서 서브를 주고받으며 연습한다.</p>
