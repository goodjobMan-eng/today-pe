<h1>헐레벌떡 보물 옮기기</h1>
<p>1) 출발 신호가 울리면 바닥에 흩어져 있는 교구(보물)를 한 번에 1개씩 집는다. 2) 머리 위로 두 손을 뻗어 교구를 받쳐 들고 반대편 보물섬까지 달린다. 3) 보물섬에 교구를 내려놓고 왕복하며 바닥의 보물을 모두 옮긴다.</p>
