<h1>디스크 윷놀이</h1>
<p>1) 팀별로 코치와 말을 놓을 주자를 정하고 셔틀콕으로 팀 말을 준비한다. 2) 녹색선 뒤에서 디스크를 해머 던지기 방식으로 던져 도·개·걸·윷·모가 적힌 윷놀이 타깃을 맞힌다. 3) 맞힌 결과에 따라 윷판의 팀 말을 이동시키며, 모나 윷이 나오거나 상대 말을 잡았을 때는 디스크 던지기 기회를 한 번 더 얻는다. 4) 팀의 말 2개가 먼저 윷판을 돌아 나오는 팀이 승리한다.</p>
