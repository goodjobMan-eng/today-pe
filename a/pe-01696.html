<h1>러키의 프리즈 댄스 파티</h1>
<p>1) 신나는 음악이 흘러나오는 동안 화면 속 캐릭터처럼 자유롭게 춤을 추며 몸을 움직인다. 2) 음악이 멈추고 프리즈 화면이 나타나면 즉시 동작을 멈추고 15초 동안 제시된 포즈를 그대로 유지한다. 3) 다시 음악이 시작되면 댄스를 이어가며 신체 협응력과 반응 속도를 키운다. 4) 중간에 금화 속 러키 찾기 및 틀린 그림 찾기 미니게임을 수행하여 집중력을 기른다.</p>
