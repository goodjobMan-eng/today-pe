<h1>나무 심기 (Plant the trees)</h1>
<p>1) 콘 8개로 구역을 3개(팀1, 팀2, 중앙)로 나누고 콩주머니 10개를 흩어 놓는다. 2) 신호가 울리면 상대 구역으로 달려가 콩주머니를 한 번에 1개씩 집어 자기 구역으로 가져온다. 3) 2~3분 후 호각이 울렸을 때 자기 구역에 콩주머니가 더 많은 팀이 승리한다. 4) 콩주머니를 머리에 얹고 걷거나 다리 사이에 끼우고 점프해서 가져오는 방식으로 변형한다.</p>
