<h1>팀 밸런스 릴레이</h1>
<p>1) 1번 주자는 출발선에서 티밸런스 자세로 5초간 버틴 후 다음 주자에게 달려가 손을 터치한다. 2) 2번 주자는 바닥의 접시콘을 머리 위에 올리고 구간을 이동하여 3번 주자에게 손을 터치한다. 3) 3번 주자는 터치를 받은 후 코끼리 코 5바퀴를 돌고 중심을 잡은 뒤 4번 주자에게 터치한다. 4) 4번 주자는 바닥의 라바콘을 손등 위에 올리고 균형을 유지하며 달려 결승선을 통과한다.</p>
