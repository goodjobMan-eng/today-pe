<h1>배드민턴 운동</h1>
<p>1) 라켓의 앞면과 뒷면을 번갈아 뒤집어가며 셔틀콕을 혼자 튕겨 올린다.2) 두 명이 짝을 지어 셔틀콕을 한 번씩 번갈아 쳐서 넘긴다.3) 한 사람을 추가해 세 명이서 셔틀콕을 이어 치며 랠리를 진행한다.4) 바닥이나 벽 쪽에 4개의 목표 구역(1~4번)을 정해두고 셔틀콕을 쳐서 넣는다.5) 10번 동안 목표 원 안에 셔틀콕을 얼마나 정확히 넣는지 도전한다.</p>
