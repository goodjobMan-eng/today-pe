<h1>솜털공 놀이(고양이와 쥐)</h1>
<p>1) 둘씩 짝을 맺고 음악이 흐르면 솜털공을 주고받는다. 2) 음악이 멈추는 순간 솜털공을 가진 사람은 고양이가 되고, 공이 없는 사람은 쥐가 되어 빠른 걸음으로 도망친다. 3) 고양이가 솜털공을 든 손으로 쥐의 등이나 어깨 부위를 터치하면 역할이 교대된다. 4) 터치당한 쥐는 고양이로 바뀌기 전 스쿼트 3회를 하고 공을 주워 원래 파트너였던 쥐를 쫓아간다.</p>
