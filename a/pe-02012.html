<h1>이동하면서 표현하기</h1>
<p>1) 출발선과 도착선을 정한 후 모둠을 나누어 어떤 방법으로 이동할지 정합니다. 2) 정해진 코스를 걷기, 스키핑, 갤로핑 등 다양한 스텝을 활용하여 이동합니다. 3) 교사의 깃발이나 호루라기 신호에 맞추어 왼쪽과 오른쪽으로 방향을 바꾸며 움직입니다. 4) 혼자 하기 힘든 학생은 또래나 교사의 손을 잡고 이동하며 신체 표현을 익힙니다.</p>
