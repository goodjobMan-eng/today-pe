<h1>PAPS 대비 윗몸 말아 올리기 기초 동작</h1>
<p>1) 무릎을 약 90도로 세우고 누워 손을 앞으로 뻗은 자세를 취한다. 2) 복근의 힘을 이용해 손을 무릎 쪽으로 뻗으며 상체를 말아 올린다. 3) 혼자서 연습할 때 올라오기 힘들면 파트너가 발을 눌러주거나 발을 걸쳐 고정하고 연습한다.</p>
