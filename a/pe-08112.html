<h1>탱탱볼 기초 스트레칭 및 주고받기</h1>
<p>1) 바닥에 앉아 탱탱볼을 몸과 다리를 따라 굴리며 신체 부위를 스트레칭한다. 2) 원마커 옆에 서서 양손으로 탱탱볼을 원마커를 향해 바닥에 튕겨 다시 잡는다. 3) 원마커를 밟고 서서 공을 눈높이까지 던진 후 점프하며 잡거나, 짝과 마주 보고 바닥에 튕겨 공을 주고받는다.</p>
