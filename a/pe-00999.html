<h1>노네트 스피드민턴 대결</h1>
<p>1) 네트 없이 12.8m 간격을 두고 한 변 5.5m인 정사각형 코트 2개를 마주 보게 설치한다. 2) 각 코트 뒤쪽 2.5m 서브 존 안에서 언더 서브나 스매시 서브로 상대 코트를 향해 스피더를 날린다. 3) 서브는 점수와 관계없이 3회씩 교대하며, 상대 정사각형 코트 안에 노바운드로 스피더를 떨어뜨려 득점한다. 4) 1세트 16점 3세트 경기(2세트 선취승)로 진행하며, 야외에서는 윈드링을 끼우고 야간에는 라이트를 장착해 변형한다.</p>
