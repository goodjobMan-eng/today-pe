<h1>농구 홈트레이닝 기술 연습</h1>
<p>1) 무릎을 높게 들어 올렸다가 뒤로 뻗는 하이 니 익스플로전을 좌우 각각 연습한다. 2) 공 없이 무릎과 팔 반동을 이용해 제자리에서 슛 펌핑 동작을 반복한다. 3) 점프하여 양손 또는 한 손으로 리바운드 후 착지하여 피벗하는 동작을 연습한다. 4) 좌우 페이크 앤 점프 동작과 스텝백 모션 후 슛으로 연결하는 동작을 익힌다. 5) 크로스오버와 비하인드 백 드리블 스텝 및 리버스 스텝 드리블 모션을 따라 한다.</p>
