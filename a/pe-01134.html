<h1>줄줄이 맞춰요! 라바콘 볼링</h1>
<p>1) 중앙 일렬로 홀수 개(9개)의 라바콘을 세우고, 양 팀은 콘 양쪽 투척 라인 뒤에 2~3명씩 배치된다. 2) 신호가 울리면 각 팀의 첫 번째 주자가 폼볼을 굴려 중앙에 놓인 라바콘을 넘어뜨린다. 3) 콘을 맞혀 쓰러뜨리면 즉시 달려가 쓰러진 콘을 자기 팀 영역으로 가져오고 다음 주자와 교대한다. 4) 중앙의 콘이 모두 사라질 때까지 진행하여 콘 과반수(9개 중 5개 이상)를 먼저 획득한 팀이 승리한다.</p>
