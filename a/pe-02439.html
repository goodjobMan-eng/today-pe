<h1>소프트 발리볼 던져서 넘기기 게임</h1>
<p>1) 네트를 사이에 두고 양 팀으로 나뉘어 코트에 위치한다. 2) 서브를 넣는 사람은 공을 위로 쳐서 넘기거나 손으로 받기 좋게 네트 너머로 포물선으로 넘긴다. 3) 공을 잡고 이동할 수 없으므로 제자리에서 같은 편에게 패스하거나 상대 빈 공간으로 던져 넘긴다. 4) 공이 상대 코트 바닥에 떨어지면 득점하며 네트를 흔들거나 몸이 넘어가면 실점한다.</p>
