<h1>팀 가위바위보 (Team Rock Paper Scissors)</h1>
<p>1) 학급을 두 팀으로 나누고 각 팀별로 모여 낼 모양(가위, 바위, 보)을 상의하여 결정한다. 2) 교사의 신호에 맞춰 양 팀이 마주 보고 가위바위보를 한다. 3) 이긴 팀은 도망치는 진 팀 선수를 쫓아가 태그한다. 4) 잡힌 선수는 상대 팀으로 소속을 바꾼다. 5) 출발 위치로 돌아와 과정을 반복하며 상대 팀 전원을 잡는다.</p>
