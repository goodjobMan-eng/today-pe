<h1>봄꽃을 소중히 (볼링핀 쓰러뜨리기)</h1>
<p>1) 각자 진영에 팀 인원수만큼 볼링핀을 1열로 세우고 공을 한 개씩 들고 볼링핀 앞에 선다.2) 게임이 시작되면 상대 팀 진영의 볼링핀을 향해 공을 굴려 쓰러뜨린다.3) 상대가 굴린 공은 손이나 몸으로 막아내며, 넘어진 볼링핀은 다시 세우지 못한다.4) 정해진 시간이 지난 후 자기 팀 진영에 남아 있는 볼링핀 수가 많은 팀이 승리한다.</p>
