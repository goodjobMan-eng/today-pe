<h1>축구 1대1 콘 돌아 스프린트 슛</h1>
<p>1) 두 팀으로 나뉘어 골대 양쪽에 줄을 선 뒤 10~15m 앞에 세워진 키 큰 콘을 바라본다.2) 신호가 울리면 각 팀 첫 번째 주자가 동시에 달려 나가 콘을 돌아 나온다.3) 코치가 차 준 축구공을 먼저 차지하여 골대로 드리블한 뒤 슛을 넣는다.4) 인원을 늘려 2대2나 3대3으로 진행할 때는 슛하기 전에 정해진 횟수만큼 패스해야 한다.</p>
