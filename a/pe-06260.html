<h1>우리가족 힘을 모아 주거니 받거니</h1>
<p>1) 두 명이 짝을 이루어 출발선에 선다.2) 출발 신호와 함께 두 명이 협동하여 풍선을 번갈아 치면서 반환점을 돌아온다.3) 출발선에 도착하면 다음 주자에게 두 손으로 풍선을 건네준다.4) 세 쌍의 주자가 먼저 출발점으로 돌아오는 팀이 이긴다.</p>
