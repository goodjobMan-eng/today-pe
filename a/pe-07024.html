<h1>잉글랜드 대 웨일스</h1>
<p>1) 농구 코트를 반으로 나누어 한쪽은 잉글랜드, 다른 쪽은 웨일스로 정하고 각 진영에 은행(훌라후프+콩주머니)과 감옥(빈 훌라후프)을 배치한 뒤 모든 참가자는 바지 뒤에 태그를 꽂는다 2) 상대 진영으로 넘어가 태그를 뺏기지 않고 은행의 금괴(콩주머니)를 1개씩 훔쳐 자기 진영 은행으로 가져온다 3) 상대 진영에서 태그를 뺏기면 상대 감옥으로 이동하며, 같은 팀원이 감옥으로 건너와 구해주면 다시 살아난다</p>
