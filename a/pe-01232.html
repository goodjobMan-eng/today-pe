<h1>4방향 폭신주사위 균형잡기 챌린지</h1>
<p>1) 중앙에 미니 원마커 1개를 두고 동서남북 사방에 마커와 폭신 주사위공을 각각 1개씩 배치한다. 2) 참가자는 중앙 마커 위에 한 발로 선 채 반대쪽 발을 들고 중심을 잡는다. 3) 원하는 순서대로 몸을 숙여 공을 하나씩 주워 다른 손 위에 차례대로 4개를 쌓아 올린다. 4) 모둠별 순번 대항전으로 진행하여 4개를 모두 쌓고 3초간 버티기에 성공한 순서대로 순위 점수를 얻는다.</p>
