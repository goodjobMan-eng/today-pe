<h1>제자리 전력 달리기</h1>
<p>1) 4명이 한 모둠을 이루고 모둠별로 달리는 순서를 정한다. 2) 출발 신호와 함께 첫 번째 주자가 제자리에서 뛰기 동작을 10회 한 뒤 콘을 향해 달려간다. 3) 콘을 돌고 난 다음 제자리에서 뛰기 동작을 10회 하고 출발선으로 돌아오면 다음 주자가 출발한다. 4) 마지막 모둠원이 가장 빨리 출발선으로 돌아온 모둠이 이긴다.</p>
