<h1>가위뛰기 높이뛰기 기본 기능</h1>
<p>1) 서서히 출발하여 속도를 점점 높이고 발구르기 전 3보를 가장 빠르게 도움닫기한다. 2) 발뒤꿈치부터 힘을 주어 구르며 순간적인 힘으로 힘차게 발을 구른다. 3) 차올린 발이 가로대를 넘으면 반대쪽 발을 즉시 위로 들어 올려 가로대를 통과한다. 4) 몸의 균형을 유지하며 한 발씩 순서대로 무릎을 약간 굽혀 매트에 착지한다.</p>
