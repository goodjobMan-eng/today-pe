<h1>수영장 폼롤러 링 받기 릴레이</h1>
<p>1) 짝과 함께 폼롤러(누들)를 이마나 신체 사이에 두고 떨어뜨리지 않으며 이동하는 균형 연습을 한다. 2) 폼롤러를 한 손 또는 두 손으로 잡고 던져진 빅 링을 폼롤러에 끼워 잡는다. 3) 링을 성공적으로 걸어 잡을 때마다 짝과 자리를 바꾸며 뒤쪽 번호 위치로 한 걸음씩 물러난다. 4) 폼롤러를 두 개 들고 양손으로 동시에 날아오는 링 두 개를 받아내는 변형 단계로 진행한다.</p>
