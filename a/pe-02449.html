<h1>초등 학교 규칙 피구</h1>
<p>1) 양 팀 인원을 똑같이 나누고 각 팀에서 외야 공격수 1명을 뽑아 상대편 외야에 배치한다. 2) 내야 수비수와 외야 공격수가 패스를 주고받으며 상대 내야 수비수를 공으로 맞힌다. 3) 공에 맞은 내야 수비수는 아웃되어 상대팀 외야로 나가 외야 공격수가 된다. 4) 자기 팀 수비수가 아웃되어 외야로 나오면 먼저 나가 있던 공격수는 다시 본래 내야 수비로 복귀하며 상대 내야를 모두 아웃시키면 승리한다.</p>
