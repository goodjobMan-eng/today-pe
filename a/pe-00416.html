<h1>집단 스피드 퀴즈 (몸으로 말해요)</h1>
<p>1) 뽑기나 지명으로 술래 학생 1~2명을 뽑아 화상회의의 대기실로 잠시 보내 제시어를 보지 못하게 합니다. 2) 남은 학생들에게 화면 공유로 제시어(예: 고릴라, 거미, 속담)를 보여 준 뒤 술래를 회의실로 다시 불러옵니다. 3) 신호와 함께 모든 학생이 목소리를 내지 않고 몸짓과 표정만으로 제시어를 동시에 표현합니다. 4) 술래는 화면 속 친구들의 동작을 관찰하고 정답을 채팅창에 입력해 맞힙니다.</p>
