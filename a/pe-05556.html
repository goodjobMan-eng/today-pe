<h1>외치고 가위바위보</h1>
<p>1) 둘이 마주 보고 가위바위보를 한다.2) 기본 버전에서는 결과를 보자마자 이긴 사람은 '이겼다', 진 사람은 '졌다'를 말하며 손으로 해당 모양을 빠르게 만든다.3) 거꾸로 버전에서는 이긴 사람이 '졌다', 진 사람이 '이겼다'로 반대로 말하며 몸으로 표현한다.4) 승패 판단이 늦거나 반대로 잘못 말한 사람이 패배한다.</p>
