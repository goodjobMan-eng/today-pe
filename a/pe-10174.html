<h1>헌티드 하우스</h1>
<p>1) 3명의 마녀(또는 마법사)는 초록색 누들로 안에서 트래커(술래) 역할을 한다. 2) 나머지 학생들은 '트릭어트리터'로서 음악이 나올 때 시계 방향으로 외곽을 걸으며 이동한다. 3) 음악이 멈추면 트래커를 피해 외곽의 아이템(프리스비 링)을 잡아 파란색 양동이에 넣거나 마녀에게 태그되지 않도록 한다.</p>
