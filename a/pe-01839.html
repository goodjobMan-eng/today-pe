<h1>트리키 핀 드리블 슬라럼</h1>
<p>1) 2인 1조로 짝을 짓고 농구공 1개와 볼링핀 10~15개로 원하는 주행 코스(S자, 원형 등)를 설치합니다. 2) 한 선수가 핀을 쓰러뜨리지 않고 정해진 코스를 따라 정밀하게 농구 드리블로 통과합니다. 3) 30초 동안 핀을 쓰러뜨리지 않고 성공한 랩 수를 세거나 핀이 쓰러지면 상대가 점수를 얻습니다. 4) 익숙해지면 반대 손(약한 손) 드리블이나 2인 동시 드리블 및 팀 릴레이 주행으로 변형합니다.</p>
