<h1>콘 드리블 드릴 (직선 및 지그재그)</h1>
<p>1) 콘을 2~3미터 간격으로 일렬로 배치하거나 지그재그 형태로 배치한다.2) 첫 번째 주자가 뱀처럼 콘 사이를 지그재그로 통과하며 끝까지 이동한다.3) 콘을 건드리지 않고 돌아오는 길에도 동일하게 통과해 출발점으로 온다.4) 다음 주자와 하이파이브를 하고 차례를 넘긴다.</p>
