<h1>투수가 있는 발야구</h1>
<p>1) 학급을 두 팀으로 나누고 홈베이스 쪽에 콘 2개로 공 통과 구역을 지정한다.2) 공격 팀과 같은 편 투수가 굴려준 공을 타자가 발로 차서 경기장 안으로 보낸다.3) 타자는 공을 찬 뒤 정해진 점수 콘(가까운 곳 1점, 먼 곳 3점)을 돌고 홈으로 돌아와 득점 베이스를 밟는다.4) 수비는 공을 잡아 수비 베이스를 먼저 밟아 아웃시키며, 전원 타격 또는 3아웃제로 공수를 교대한다.</p>
