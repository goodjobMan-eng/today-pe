<h1>뜀틀 목걸기뛰기와 머리대고넘기 비교 관찰</h1>
<p>1) 뜀틀에서 목(어깨/등)을 대고 넘는 동작과 머리를 대고 넘는 동작, 두 가지 회전 뛰기를 비교 관찰하는 활동을 준비합니다. 2) 도움닫기 후 발구르기를 거쳐 뜀틀에 손과 목 부위를 대며 몸을 젖혀 착지하는 형태를 확인합니다. 3) 머리대고넘기는 머리 정수리 부위를 지지점으로 삼아 팔로 밀어내며 회전하는 형태를 확인합니다. 4) 두 동작의 차이점을 분석하며 몸을 젖히는 타이밍과 안전한 착지 자세를 학습합니다.</p>
