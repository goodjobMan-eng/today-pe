<h1>수건을 잡아라 반응속도 놀이</h1>
<p>1) 두 사람이 짝을 이루어 한 사람은 수건을 쥐고 다른 사람은 수건 끝을 잡을 준비를 합니다. 2) 수건을 쥔 사람이 예고 없이 수건을 아래로 당기거나 뺍니다. 3) 상대는 손이나 발을 빠르게 움직여 빠져나가는 수건을 눌러서 멈춰야 합니다. 4) 익숙해지면 뒤로 돌아서 있거나 선 자세, 엎드린 자세 등 다양한 출발 자세에서 진행하고, 수건을 빼는 사람은 페인트를 섞어 상대의 순발력과 판단력을 이끌어 냅니다.</p>
