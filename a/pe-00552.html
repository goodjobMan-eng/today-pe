<h1>초보자도 쉽게 배우는 매트 앞구르기</h1>
<p>1) 매트 앞에서 양손을 짚고 웅크린 자세로 준비합니다. 2) 엉덩이를 들면서 턱을 당겨 머리 뒤쪽(뒤통수)이 매트에 먼저 닿도록 몸을 둥글게 맙니다. 3) 보조자는 연습하는 학생의 허리나 엉덩이를 가볍게 받쳐 앞으로 넘어갈 수 있게 돕습니다. 4) 구른 뒤 양발로 안전하게 바닥을 딛고 일어섭니다.</p>
