<h1>캐치 발리볼</h1>
<p>1) 팀당 9명이 코트에 들어가며, 서브는 엔드라인 밖에서 선을 밟지 않고 한 손으로 공을 던져 시작한다. 2) 상대가 넘긴 공은 가슴에 닿지 않게 양손으로 잡으며, 공을 잡은 상태에서는 한 발만 움직일 수 있다. 3) 같은 팀끼리 공을 전달하여 3회 이내에 네트 너머로 양손으로 공격해 넘기며, 15점을 먼저 얻는 세트를 2세트 선취하면 승리한다.</p>
