<h1>두 줄 안에서 줄넘기 뛰기</h1>
<p>1) 두 명의 줄잡이가 긴 줄 두 개의 길이를 동일하게 맞추고 번갈아 가며 키보다 높게 큰 원을 그리듯 돌린다. 2) 줄잡이 옆에 서서 반대쪽 줄이 얼굴 앞을 지나갈 때 '하나, 둘' 스텝 박자에 맞춰 두 줄 사이로 뛰어 들어간다. 3) 개인 줄을 어깨에 메고 들어간 뒤, 두 줄이 돌아가는 타이밍에 맞춰 안에서 개인 줄넘기를 연속으로 넘는다.</p>
