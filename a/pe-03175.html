<h1>원 마커에서 균형 잡기</h1>
<p>1) 네 명이 한 모둠이 되어 모둠 조끼를 입고 순서를 정한다. 2) 상대 모둠이 원 마커 색깔을 외치면 순서대로 해당 원 마커를 발로 밟고 양발로 균형을 잡는다. 3) 마지막 모둠원까지 자세를 잡으면 상대 모둠원이 한 명씩 들어가 손바닥 밀치기를 한다. 4) 손바닥 밀치기를 버텨낸 모둠원 한 명당 1점을 얻으며 점수가 가장 많은 모둠이 승리한다.</p>
