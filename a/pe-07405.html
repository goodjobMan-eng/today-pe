<h1>필드데이 창던지기 대회 (The Javelin Throw)</h1>
<p>1) 운동장에 표시된 초록색 선(줄넘기 표시선) 뒤에 두 발을 두고 대기한다. 2) 신호 요원이 'Ready, Set, Throw'를 외치면 초록색 선을 넘지 않고 창을 최대한 멀리 던진다. 3) 전원이 1회씩 투척한 후 각 조의 1위 승자들은 검은색 선으로 이동해 챔피언십 결승 투척을 준비한다. 4) 결승 투척에서 가장 멀리 던진 학생이 학급 최종 창던지기 챔피언이 된다.</p>
