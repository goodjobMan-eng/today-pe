<h1>닷지볼(Datchball)</h1>
<p>1) 경기 시작 전 양 팀이 상대 팀과 인사를 나눈다. 2) 코트 중앙에 놓인 세 개의 공을 향해 출발 신호 후 달려가 공을 가져온다. 3) 던진 공에 맞은 선수는 손을 들고 코트 밖으로 나간다. 4) 중앙선(로프)을 넘어가거나 밟아서는 안 된다.</p>
