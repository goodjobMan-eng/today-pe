<h1>스피드스택스 핑퐁 빙고 테이블 대결</h1>
<p>1) 책상 중앙에 십자 형태(중앙 1개, 4방향 줄기)로 스택스 컵들을 엎어 두고 모둠별 색깔 라인을 지정한다. 2) 신호가 울리면 팀원들이 번갈아 탁구공을 테이블에 한 번 바운드시켜 컵 안으로 투입한다. 3) 공이 컵에 들어가면 해당 컵을 바로 세워 뒤집으며 다른 팀 컵에 공이 들어가도 즉시 뒤집어 준다. 4) 자기 팀 라인의 컵을 모두 뒤집은 후 중앙 공용 컵에 공을 가장 먼저 골인시킨 팀이 승리한다.</p>
