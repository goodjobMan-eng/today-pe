<h1>배틀쉽 핀 쓰러뜨리기</h1>
<p>1) 체육관 중앙 매트 벽을 사이에 두고 양 팀으로 나뉘어 핀(군함)을 세우고 공을 던져 상대 핀을 맞히려 한다. 2) 매트 벽 너머로 날아오는 공을 노바운드로 캐치하면 상대 진영 외곽으로 넘어가 공을 1회 투척할 수 있는 보너스를 얻는다. 3) 수비수는 자기 팀 핀을 몸으로 가로막아 방어할 수 있다. 4) 몸이 중앙 매트 벽에 닿아서는 안 되며, 상대 진영으로 이동할 때는 검은색 외곽선 밖으로만 다녀야 한다.</p>
