<h1>공 3개 저글링 기초 연습</h1>
<p>1) 공을 2개 쥔 손의 앞쪽 공(1번)을 던지고 반대 손의 공(2번)을 던진 뒤 1번 공을 잡는 순서로 연습한다. 2) 1번과 2번 공을 연속으로 던지고 받는 동작에 익숙해지면 3번째 공을 던지는 동작으로 넘어간다. 3) 3번 공을 위로 던지기 어려우면 아래로 떨어뜨리며 손에서 버리는 동작부터 연습한다. 4) 던진 공들을 반대편 손으로 번갈아 잡아채며 3개 공 저글링 동작을 연결한다.</p>
