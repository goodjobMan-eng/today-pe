<h1>고무줄 축구</h1>
<p>1) 가로 30걸음, 세로 20걸음 크기의 경기장 양 끝에 콘으로 골대를 만들고 두 팀으로 나눈다 2) 발로 드리블하거나 패스를 이어가며 상대 골대(콘 사이)를 향해 공을 찬다 3) 공격에 성공하여 득점하면 점수를 얻은 팀 골대의 콘을 한 발자국 넓혀 골대 크기를 키운다 4) 공이 경기장 밖으로 나가면 나간 지점에서 상대 팀이 발로 차서 인플레이하며, 골대를 더 이상 넓힐 수 없을 때까지 진행한다</p>
