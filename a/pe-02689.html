<h1>육상 단거리 스타트(크라우칭 및 스탠딩 스타트)</h1>
<p>1) 크라우칭 스타트의 번치, 미디엄, 일롱게이티드 스타트 중 자신에게 맞는 보폭과 발 위치를 잡고 손을 아치 모양으로 짚어 준비합니다. 2) 차렷 신호에 맞춰 엉덩이를 높이 들어 올리고 시선은 첫발을 디딜 곳이나 바닥을 봅니다. 3) 출발 신호와 함께 첫발을 박차며 강하게 대시합니다. 4) 스탠딩 스타트는 베이직, 원핸드, 투핸드 자세 중 알맞은 출발법을 선택하여 연습합니다.</p>
