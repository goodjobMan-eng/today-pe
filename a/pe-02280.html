<h1>4단계 볼링 투구 자세 익히기</h1>
<p>1) 1단계 푸시어웨이(Push away): 공을 앞으로 밀어낸다. 2) 2단계 다운스윙(Down swing): 팔을 아래로 자연스럽게 내린다. 3) 3단계 백스윙(Back swing): 팔을 뒤로 쭉 들어 올린다. 4) 4단계 포워드 스윙(Forward swing): 팔을 앞으로 뻗으며 굴리는 동작으로 연결한다.</p>
