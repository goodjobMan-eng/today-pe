<h1>하키형 게임 기초 패스 및 수비 돌파</h1>
<p>1) 스틱의 끝부분과 중간을 잡고 자세를 낮춘 상태에서 공을 몸 뒤쪽에서 앞으로 밀어 패스한다. 2) 패스를 받을 때는 스틱을 뒤로 살짝 빼면서 충격을 흡수해 공을 부드럽게 멈춘다. 3) 수비수가 다가올 때 몸을 회전하며 등이나 옆으로 막고 스틱을 조작해 방향을 전환한다. 4) 팀원과 협동할 때 패스를 주고 빈 공간으로 빠르게 이동하여 다시 공을 받을 위치를 선점한다.</p>
