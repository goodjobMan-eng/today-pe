<h1>화살표 방향 반응 체조 놀이</h1>
<p>1) 교사가 보여주는 화살표 카드의 방향을 집중해서 바라본다. 2) 화살표가 위를 향하면 일어서고, 아래를 향하면 자리에 앉는다. 3) 화살표가 오른쪽이나 왼쪽을 가리키면 신속하게 해당 방향으로 몸을 움직인다. 4) 음악 박자에 맞춰 점차 빨라지는 화살표의 방향에 맞춰 신속하게 반응한다.</p>
