<h1>피구 공격 전술 3가지</h1>
<p>1) 상대 정면으로 빠르게 달려가 수비수를 직접 노려 맞히는 '기습 공격'을 실행한다. 2) 상대 진영 양쪽 구석 외곽을 노려 던지며 외야와 연결하는 '코너 공격'을 전개한다. 3) 외야와 패스를 주고받으며 수비 대형을 흔들어 빈틈을 공략하는 '사이드 공격'을 펼친다.</p>
