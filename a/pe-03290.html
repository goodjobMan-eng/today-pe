<h1>개구리 피하기</h1>
<p>1) 가위바위보를 하여 개구리(술래) 2명을 정한다. 2) 개구리 1명은 연못을 지키고 다른 개구리 1명은 연못 밖의 친구들을 잡으러 다닌다. 3) 개구리 손에 닿은 친구는 연못에 갇히며, 연못 밖에 있는 다른 친구가 손으로 쳐주면 탈출할 수 있다. 4) 개구리에게 모두 잡히거나 정해진 시간이 지나면 개구리를 다시 뽑아 게임을 한다.</p>
