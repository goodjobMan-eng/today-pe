<h1>야구형 게임 5단계 지도법 및 변형 게임</h1>
<p>1) 1단계로 원형 발야구를 통해 야구형 게임의 특징과 빈 공간으로 공 보내기를 익힌다. 2) 2단계로 홈런왕 연습, 콘 돌아오기, 바람개비 패스, 공 이어주며 득점하기 등 기본 기능을 익힌다. 3) 3단계로 원마커를 활용해 수비 위치 전략을 경험한다. 4) 4단계로 발야구, 주먹야구, 티볼 등 실제 게임을 진행한다. 5) 5단계로 업앤다운 발야구, 킥볼, 육각야구 등 변형 야구형 게임을 즐긴다.</p>
