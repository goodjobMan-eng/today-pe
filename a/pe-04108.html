<h1>체조 스테이션 순환 수업</h1>
<p>1) 점핑·착지, 평균대, 턱걸이, 이동(동물 걷기), 뜀틀, 로프 스윙, 밸런스 보드 등 번호가 매겨진 구역을 순서대로 순환한다. 2) 각 스테이션에는 수준별(레벨 1~3 등) 과제가 제시되어 있으며 이전 단계를 성공해야 다음 단계로 올라간다. 3) 음악이 멈추면 번호 순서에 맞춰 다음 스테이션으로 일제히 이동한다.</p>
