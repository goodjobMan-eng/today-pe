<h1>짝 티볼</h1>
<p>1) 6명이 한 모둠을 이루어 모둠별로 2명씩 짝을 짓고 주자와 타자를 정합니다. 2) 공격 모둠은 타자가 치기 전에 1루·2루·3루가 적힌 3장의 카드 중 1장을 뽑아 적힌 누로 주자를 내보냅니다. 3) 타자가 공을 쳐서 주자가 다음 누로 진루하면 1점을 얻습니다. 4) 수비 모둠이 뜬공을 바로 잡거나 주자보다 먼저 베이스나 홈으로 공을 보내면 아웃되며, 모든 타자 공격 종료 후 공수를 교대합니다.</p>
