<h1>트럼프 카드 달리기 (Spielkartenlauf)</h1>
<p>1) 인원에 따라 빨강/검정 2개 팀 또는 4개 문양(하트·스페이드·다이아·클로버) 4개 팀으로 나눈다. 2) 주자들은 릴레이 형식으로 바닥에 뒤집혀 있는 카드를 향해 달려가 한 장을 뒤집는다. 3) 자신의 색깔이나 문양이 맞으면 카드를 가지고 돌아오고, 아니면 다시 뒷면으로 덮어두고 복귀하며 모든 카드를 먼저 모은 팀이 승리한다.</p>
