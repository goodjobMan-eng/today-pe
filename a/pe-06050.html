<h1>컵 옆구리 핑퐁당 놀이</h1>
<p>1) 한 손에는 컵의 옆구리를 잡고 다른 손으로 탁구공을 공중에 던진다.2) 컵 옆구리로 공을 튀긴 뒤 컵 입구 안으로 받아 넣는다.3) 1번 튕겨 넣으면 1점, 2번 튕겨 넣으면 2점을 획득한다.4) 튀긴 횟수만큼 점수를 높여가며 제한 시간 1분 동안 더 높은 점수에 도전한다.</p>
