<h1>리더 배구 가로 세로 패스</h1>
<p>1) 리더가 맨 앞에 서서 마주 본 대열의 팀원에게 공을 패스한다.2) 공을 받은 사람은 리더에게 다시 패스하고 대열의 뒤나 옆으로 이동한다.3) 마지막 사람이 공을 패스하면 대열이 갈라지며 그 사람이 새로운 리더 위치로 이동해 패스를 이어간다.</p>
