<h1>축구 3단계 정밀 드리블 앤 턴</h1>
<p>1) 출발선 앞에 접시콘을 지그재그로 배치하고 반환점에 훌라후프를 놓아 드리블 주로를 만든다. 2) 1단계는 첫 번째 콘까지 공을 차서 날리지 않고 발로 가볍게 밀면서 돌아오는 연습을 한다. 3) 2단계는 훌라후프 안까지 공을 몰고 가 공을 완전히 멈춰 세운 뒤 훌라후프 주위를 한 바퀴 돌고 복귀한다. 4) 3단계는 지그재그 콘들을 피해 드리블한 후 훌라후프에서 멈춰 돌고 다시 지그재그로 돌아오며 릴레이를 펼친다.</p>
