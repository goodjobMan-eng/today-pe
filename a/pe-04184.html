<h1>수면 태그 (슬립 태그)</h1>
<p>1) 체육관을 낮 구역과 밤 구역 둘로 나눈 뒤 술래 2명과 밤 구역의 요정 2명을 정한다. 2) 낮 구역에서 술래에게 태그된 학생은 밤 구역으로 이동해 누워 10부터 1까지 거꾸로 센다. 3) 밤 구역의 요정이 마술봉으로 잠든 학생을 살짝 터치하면 다시 낮 구역으로 돌아가 참여한다.</p>
