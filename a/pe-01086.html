<h1>공 전달 전진 릴레이</h1>
<p>1) 모둠원들이 앞뒤로 간격을 두고 일렬로 서며, 팀 앞쪽과 뒤쪽에 각각 반환점 콘을 설치한다. 2) 신호가 울리면 맨 앞 주자부터 머리 위(또는 다리 사이)로 공을 뒤 주자에게 전달한다. 3) 공을 받은 맨 끝 주자는 공을 든 채 전력 질주하여 맨 앞자리로 이동해 다시 머리 위로 공을 뒤로 보낸다. 4) 공을 전달받고 앞으로 이동하는 과정을 반복하여 팀 전체가 목표 결승선 콘까지 먼저 도달하는 팀이 승리한다.</p>
