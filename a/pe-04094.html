<h1>장애물 코스 부트캠프</h1>
<p>1) 출발선에서 스쿠터보드에 엎드려 팔로 패들링하여 전진한 뒤 내린다. 2) 후프를 통과하고 터널 밑을 기어가며 허들을 넘거나 점프해 이동한다. 3) 한 발 뛰기(외발 홉) 구간과 줄을 따라 힐 롤(뒤꿈치 걷기) 구간을 통과한다. 4) 코스 중간에 위치한 노란색 마커에 도달하면 스쿼트, 런지, 점핑잭, 윗몸일으키기, 플랭크, 팔굽혀펴기 등의 피트니스 미션을 수행하고 전력 질주하여 피니시 라인으로 들어온다.</p>
