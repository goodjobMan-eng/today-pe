<h1>하이파이브 릴레이</h1>
<p>1) 학급별로 1열로 나란히 선다. 2) 맨 뒤 사람을 제외한 모든 학생은 하이파이브를 하기 편하게 양손을 얼굴 앞에 들고 대기한다. 3) 신호에 맞춰 맨 뒤 학생이 소리를 내며 앞 사람들과 차례로 하이파이브를 하며 맨 앞으로 달린다. 4) 맨 앞으로 간 학생은 똑같이 손을 들고 서며, 다음 맨 뒤 학생이 출발하는 과정을 반복해 15m 앞 결승선에 먼저 도착한다.</p>
