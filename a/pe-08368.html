<h1>네트 없이 둘이서 하는 배구 풋워크 및 패스 5가지 훈련</h1>
<p>1) 콘 사이를 셔플 스텝 및 크로스오버 스텝으로 이동하며 파트너가 던져주거나 패스한 공을 언더핸드로 받아넘긴다. 2) 콘을 대각선 및 사각형·다이아몬드 형태로 배치하고 낮은 자세를 유지한 채 콘 사이를 이동하며 패스한다. 3) 제자리에서 블로킹 점프 후 착지하여 파트너의 공을 언더핸드로 자신에게 띄운 뒤(디그) 다시 세트하여 파트너에게 패스한다.</p>
