<h1>점프 저쪽 보고 훠이(참참참) 놀이</h1>
<p>1) 원마커 위에서 제자리 점프로 가볍게 리듬을 타며 술래의 신호를 기다립니다. 2) 술래가 구호와 함께 팔을 뻗는 방향(좌·우·상·하)에 맞춰 점프하며 몸의 방향을 돌리거나 앉습니다. 3) 기초 단계에서는 술래와 같은 방향으로 움직이고, 난이도를 높여 술래와 반대 방향으로 점프하는 방식으로 규칙을 바꿉니다. 4) 구호의 템포를 점차 빠르게 올리거나 좌우를 넘어 상하 점프·앉기 동작을 조합하여 순발력을 겨룹니다.</p>
