<h1>흔들흔들 타워</h1>
<p>1) 두 사람이 마주 보고 가위바위보를 한다. 2) 이긴 사람이 진 사람의 머리 위에 준비한 물건(수건, 신문지, 책 등)을 원하는 모양으로 얹는다. 3) 머리에 물건을 얹은 사람은 제자리에서 떨어뜨리지 않고 한 바퀴를 회전한다. 4) 걷거나 가위바위보를 하거나 물건을 얹는 도중 머리 위의 물건을 떨어뜨리면 패배한다.</p>
