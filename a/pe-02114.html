<h1>스포츠스태킹 363 스택</h1>
<p>1) 12개의 컵을 3개, 6개, 3개 묶음으로 책상 위에 배치합니다. 2) 대각선 방향에서 오른손, 왼손 순서로 컵을 들어 올려 3개, 6개, 3개의 피라미드 모양으로 쌓습니다(업스택). 3) 오른손과 왼손을 이용해 피라미드 모양으로 쌓인 컵을 차례대로 허물어 원래대로 정리합니다(다운스택). 4) 양손으로 타이머를 눌러 컵을 쌓고 내리는 데 걸린 기록을 측정합니다.</p>
