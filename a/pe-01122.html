<h1>4방향 술래 피하기 방 탈출 게임</h1>
<p>1) 라바콘과 원마커로 약 2m 사각형 방을 만들고 가운데에 도전자 1명, 네 변 바깥에 술래 3명이 선다. 2) 신호가 울리면 도전자는 술래들의 틈을 노려 사각형 구역 밖으로 완전히 탈출을 시도한다. 3) 도전자가 술래의 손에 닿지 않고 탈출에 성공하면 1점을 얻고, 태그되면 태그한 술래가 1점을 얻는다. 4) 태그한 사람이나 탈출 성공자가 다음 도전자(중앙) 역할을 맡는 방식으로 교대하며 진행한다.</p>
