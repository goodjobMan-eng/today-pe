<h1>순발력 기르기 운동 4종</h1>
<p>1) 양손으로 농구공을 잡고 머리 뒤로 보낸 후 허리와 상체를 숙이며 바닥에 강하게 튀겨 멀리 보낸다. 2) 다리를 어깨너비로 벌리고 무릎을 낮췄다가 양팔을 빠르게 위로 들어 올리며 제자리 높이뛰기를 한다. 3) 무릎을 굽혀 자세를 낮춘 뒤 공중으로 뛰어오르며 양다리를 벌리고 손을 앞으로 뻗어 발에 댄 후 착지한다. 4) 일정한 간격으로 설치된 여러 개의 낮은 간이 허들을 무릎을 굽혔다 펴며 한 발씩 뛰어넘는다.</p>
