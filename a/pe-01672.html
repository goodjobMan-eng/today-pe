<h1>마인크래프트 스티브 숨바꼭질 스트레칭 놀이</h1>
<p>1) 화면 속 흙 블록들의 움직임을 관찰할 수 있도록 화면 앞에 바르게 선다. 2) 스티브가 숨은 블록들이 섞이는 과정을 집중해서 추적하여 마지막 위치를 기억한다. 3) 스티브가 숨어 있는 블록 번호에 배정된 스트레칭 및 정지 자세(나무 자세, 사이드 런지 등)를 취해 정답을 맞힌다. 4) 5개 라운드를 진행하며 중간에 제시되는 캐릭터 선택 미션과 다른 그림 찾기 신체 활동에 참여한다.</p>
