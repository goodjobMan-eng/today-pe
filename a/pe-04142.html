<h1>파트너 볼링 콘 쓰러뜨리기</h1>
<p>1) 두 명이 짝을 이루고 공 1개와 콘 1개를 준비한다. 2) 공을 가진 사람이 체육관 바닥의 투구 선을 정하고, 파트너는 원하는 위치에 콘을 세운다. 3) 투구 선 뒤에서 반대발을 내딛으며 언더핸드로 공을 굴려 콘을 맞힌다. 4) 한 번 던진 후 역할을 바꾸며, 먼저 3점을 얻은 사람이 승리한다.</p>
