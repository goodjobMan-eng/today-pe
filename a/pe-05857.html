<h1>풋 골프 릴레이</h1>
<p>1) 모둠별로 줄을 서고 팀당 콘 1개를 가지며, 활동 구역에는 작은 공들을 흩어 놓는다.2) 신호가 울리면 각 줄의 첫 번째 주자가 공으로 달려가 콘의 빈 공간이 공을 향하도록 앞에 놓는다.3) 발로 공을 굴려 콘 안으로 넣은 뒤, 공을 들고 자기 팀 훌라후프로 돌아와 넣고 콘을 다음 주자에게 넘긴다.4) 제한 시간 동안 공을 가장 많이 모은 팀이 승리한다.</p>
