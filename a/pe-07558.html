<h1>배구 서브 1분 챌린지 게임</h1>
<p>1) 낮은 공 받기(언더)나 높은 공 받기(오버)로 공을 튀겨 올린 뒤 잡는 동작을 1회 수행한다. 2) 서브 구역에서 의자 너머 상대 구역으로 언더 서브나 오버 서브를 넣는다. 3) 서브한 공이 의자를 넘어가면 1점, 상자를 맞히면 2점, 바구니 상자 안에 들어가면 5점을 획득한다. 4) 1분 동안 서브를 반복하여 총합 10점 이상을 달성하면 미션에 성공한다.</p>
