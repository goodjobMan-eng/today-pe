<h1>신학기 브레인 브레이크 3종 릴레이 파티</h1>
<p>1) 화면을 중심으로 교실 내 책상 간격을 넓혀 개인 활동 공간을 충분히 확보합니다. 2) 1부 달리기 게임에서는 캐릭터를 골라 제자리 달리기와 응원을 하며 미니 게임에 참여합니다. 3) 2부 프리즈 댄스에서는 음악에 맞춰 춤추다가 정지 신호와 함께 제시된 알파벳 모양을 몸으로 표현합니다. 4) 3부 양자택일 운동에서는 두 가지 선택지 중 하나를 골라 이동한 뒤 제시된 근력·스트레칭 운동을 완수합니다.</p>
