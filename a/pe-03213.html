<h1>접시콘 판 뒤집기</h1>
<p>1) 경기 공간에 앞면(정방향)과 뒷면(뒤집힌 상태)이 비슷한 비율이 되도록 접시콘을 넓게 펼쳐 놓는다. 2) 두 팀으로 나누어 한 팀은 앞면으로 세우는 팀, 다른 팀은 뒷면으로 뒤집는 팀으로 역할을 정한다. 3) 시작 신호가 울리면 제한 시간 동안 자신의 팀 방향으로 접시콘을 빠르게 뒤집는다. 4) 경기 시간이 끝나면 양 팀의 접시콘 수를 세어 자기 팀 모양으로 더 많이 뒤집은 팀이 승리한다.</p>
