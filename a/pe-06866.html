<h1>눈사람 쓰러트리기</h1>
<p>1) 원 중앙에 볼링핀을 세우고 둘레에 배치된 원마커 위에 공을 하나씩 두고 선다. 2) 발 안쪽(인사이드)을 이용해 밀듯이 공을 차서 원 안의 볼링핀을 쓰러뜨린다. 3) 공이 밖으로 나가면 주워와 원마커에 다시 선 후 차며, 모든 볼링핀을 쓰러뜨리는 데 걸린 시간을 측정한다.</p>
