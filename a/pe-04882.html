<h1>공 나르기 놀이</h1>
<p>1) 두 사람이 수건의 양 끝을 잡고 그 위에 공을 올린다.2) 손으로 공을 만지지 않고 수건만 잡은 채 목표 지점까지 이동한다.3) 수건 대신 신문지를 펼쳐 잡고 공을 올려 옮겨본다.4) 도구 없이 두 사람이 배나 등을 마주 대고 공을 사이에 끼운 채 걷는다.</p>
