<h1>조깅 패스 볼 런</h1>
<p>1) 학생들은 한 줄로 서서 같은 방향을 보고 선두 주자에게 공을 전달하여 준비합니다. 2) 대열 전체가 체육관 둘레나 라인을 따라 일정한 조깅 속도로 계속 달립니다. 3) 달리는 동안 머리 위로 공을 뒤 사람에게 연속해서 넘겨 맨 끝 주자까지 전달합니다. 4) 맨 끝 주자가 공을 받으면 대열보다 빠른 속도로 앞으로 뛰어가 새 선두가 되고 변형으로 다리 사이 전달을 적용할 수 있습니다.</p>
