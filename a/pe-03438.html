<h1>이어달리기 배턴 주고받기 및 전력 질주</h1>
<p>1) 배턴을 건네주는 주자가 달려오면 건네받을 주자는 앞으로 달려 나가기 시작하여 건네주는 주자의 속도와 맞춥니다. 2) 배턴을 주고받을 때는 미리 정해 둔 신호 소리를 보냅니다. 3) 신호 소리가 들리면 건네받을 주자는 팔을 뒤로 어깨 높이까지 들어 올린 후 손바닥을 하늘로 향하게 펴서 배턴을 받습니다. 4) 배턴을 오른손으로 건네주면 왼손으로, 왼손으로 건네주면 오른손으로 받고 전력으로 속도를 내어 달립니다.</p>
