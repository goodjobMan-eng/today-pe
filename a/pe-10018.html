<h1>레이업 휠</h1>
<p>1) 체육관 내 6개의 농구 골대와 중앙 원을 활용해 6개의 팀을 만든다. 2) 신호가 울리면 각 팀의 첫 번째 사람이 골대를 향해 달려가 레이업 슛을 시도한다. 3) 슛 성공 여부와 관계없이 공을 챙겨 다음 주자에게 전달하고 줄 뒤로 이동한다. 4) 일정 시간 동안 진행한 뒤 팀이 시계방향으로 다음 골대로 이동하여 반복한다.</p>
