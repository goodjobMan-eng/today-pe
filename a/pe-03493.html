<h1>축구형 게임 패스 기능 익히기</h1>
<p>1) 제자리에서 모둠과 발의 안쪽으로 공을 차서 패스하고 받는다. 2) 패스가 익숙해지면 거리를 조금씩 늘려가며 패스 연습을 한다. 3) 멀리 있는 모둠원에게 패스할 때는 발등을 사용하여 공을 띄워 패스하고, 공이 날아오는 것에 따라 몸의 다양한 부위로 받는다.</p>
