<h1>로열스 테니스 챔피언 게임</h1>
<p>1) 코트의 한쪽 끝에 로열 팀(킹과 퀸 2명)이 위치하고 반대쪽에 도전자들이 줄을 선다. 2) 첫 번째 도전자가 킹의 서브를 받아 1포인트 승부를 겨루며, 도전자가 이기면 킹의 자리로 이동하고 지면 대기 줄로 돌아간다. 3) 다음 도전자는 퀸과 승부하며, 로열 자리에 있는 선수는 쉬지 않고 바로 서브를 넣을 수 있어 도전자들은 빠르게 준비해야 한다.</p>
