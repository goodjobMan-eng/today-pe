<h1>피트니스 스크램블 게임</h1>
<p>1) 활동 공간 한쪽 끝에는 운동 과제(스타 점프, 팔굽혀펴기 등)가 적힌 퍼즐 조각을 두고 반대쪽 끝을 퍼즐 맞추는 구역으로 정한다. 2) 출발선에서 퍼즐 조각이 있는 곳으로 달려가 조각 하나를 집는다. 3) 조각에 적힌 횟수만큼 지정된 운동을 완수한 뒤 조각을 가져와 퍼즐을 완성한다.</p>
