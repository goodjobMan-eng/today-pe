<h1>어부 술래잡기</h1>
<p>1) 술래들이 서로 손을 잡고 그물을 만들어 도망치는 친구들을 쫓아간다. 2) 도망치는 참가자가 코트 끝선 밖으로 넘어가면 술래가 된다. 3) 어부의 그물이 도망치는 친구를 둘러싸서 터치하면 잡힌 친구도 그물에 손을 잡고 연결된다. 4) 잡을 때 술래 사이의 그물이 끊어지면 잡힌 것으로 인정되지 않는다.</p>
