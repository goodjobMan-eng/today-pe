<h1>네트 밑 휠 패스 훈련</h1>
<p>1) 네트 한쪽에서 공을 네트 너머 반대편 코트로 던져준다. 2) 반대편 코트의 수비 선수가 날아오는 공을 받아 네트 앞 목표 선수에게 언더핸드 패스를 한다. 3) 목표 선수는 잡은 공을 네트 밑으로 굴려 반대편에 보내고, 선수들은 위치를 순환하며 패스 연습을 반복한다.</p>
