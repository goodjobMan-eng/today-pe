<h1>원 릴레이 플라잉 디스크</h1>
<p>1) 4명이 팀을 이루어 출발하여 코스 한 바퀴를 달린 뒤 다음 주자에게 순서를 넘긴다. 2) 주자는 원 안에서 플라잉디스크를 던져 디스크 캐처에 넣는다. 3) 디스크가 캐처에 들어가면 다음 주자가 출발하고, 실패하면 4명이 모두 한 바퀴씩 돌아야 기회가 다시 주어진다.</p>
