<h1>체력 UP 주사위 공 신체 트레이닝</h1>
<p>1) 주사위 공의 6개 면에 표시된 운동(스쿼트, 점핑잭, 버피, 점프턱, 마운틴클라이머, 하이니)을 확인한다. 2) 모둠별로 주사위 공을 굴려 윗면에 나온 신체 트레이닝 동작과 숫자를 확인한다. 3) 나온 운동 종류와 횟수(또는 시간)에 맞춰 모든 팀원이 정확한 자세로 신체 활동 미션을 수행한다. 4) 구기 종목 트라이 성공 시 주사위 공을 굴려 보너스 점수를 얻는 등 경기 규칙 변형 도구로도 활용한다.</p>
