<h1>미니 트램펄린 뜀틀 레인 운동</h1>
<p>1) 배구 코트에서 술래잡기로 몸을 푼 뒤 늑철(벽사다리) 및 트램펄린 반동 점프와 코어 운동을 실시한다. 2) 늑철 앞에 놓인 미니 트램펄린을 밟고 위로 수직 도약하는 연습을 한다. 3) 미니 트램펄린과 뜀틀을 번갈아 배치한 레인을 달려가며 트램펄린을 밟고 뜀틀 위로 뛰기 또는 뛰어넘기를 반복한다. 4) 처음에는 모아뛰기(Hockwende)로 시작하여 점차 점프 동작을 크고 강하게 연결한다.</p>
