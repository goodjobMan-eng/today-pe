<h1>달리기 빨라지는 한 발 밸런스 운동 (片足バランス)</h1>
<p>1) 바른 자세로 서서 한쪽 다리를 뒤로 들어 올린다.2) 균형을 잡은 후 든 다리를 앞으로 들어 올린다.3) 머리를 흔들지 않고 시선을 고정한 채 좌우 다리를 번갈아 실시한다.4) 중심을 유지하며 다양한 각도로 다리를 움직여 균형 능력을 키운다.</p>
