<h1>신체 인식과 방향 감각을 기르는 체육 놀이 모음</h1>
<p>1) 교사의 지시에 따라 머리, 무릎 등 신체 부위를 신속하게 터치하거나 지정된 방향으로 이동한다. 2) 짝을 이루어 상대방의 동작을 거울처럼 따라 하거나 지시어에 맞춰 다양한 균형 자세를 취한다. 3) 활동 구역 내에서 친구들과 안전거리를 유지하며 이동 운동과 신체 표현 미션을 수행한다.</p>
