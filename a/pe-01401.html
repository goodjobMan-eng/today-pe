<h1>외발 버티기 밸런스 끝말잇기</h1>
<p>1) 두 명이 서로 마주 보고 선 뒤 신호에 맞춰 동시에 한쪽 발을 들어 올립니다. 2) 든 발이 바닥에 닿지 않도록 균형을 잡으며 번갈아 가며 단어를 이어 끝말잇기를 진행합니다. 3) 든 발이 바닥에 닿거나 끝말잇기 단어를 잇지 못한 사람이 패배하며, 끝까지 버틴 사람이 승리합니다. 4) 익숙해지면 양눈을 감고 진행하거나 손뼉을 치며 단어를 말하는 조건으로 난이도를 높입니다.</p>
