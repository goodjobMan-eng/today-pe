<h1>특수체육 변형 축구 드릴 및 경기</h1>
<p>1) 콘 사이를 지그재그로 통과하며 축구공을 드리블하여 컨트롤한다.2) 공을 머리 위로 들어 올리고 1부터 20까지 숫자를 세며 스트레칭 및 중심 잡기를 한다.3) 동료들과 공을 패스하며 상대 골대를 향해 전진한다.4) 기회가 생기면 골대를 향해 슛을 시도하거나 두 손으로 머리 위로 던져 스로인을 진행한다.</p>
