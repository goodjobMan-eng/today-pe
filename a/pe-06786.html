<h1>체인지볼</h1>
<p>1) 양손에 각각 스태킹 컵과 탁구공을 쥐고 준비한다. 2) 양손의 탁구공을 동시에 위로 던진 뒤 반대쪽 손의 컵으로 교차하여 받아낸다. 3) 두 개 모두 받으면 100점(또는 200점), 한 개만 받으면 50점(또는 100점) 등으로 점수를 획득한다.</p>
