<h1>꼬꼬공기</h1>
<p>1) 닭의 일생을 표현한 1단계 모이먹기부터 12단계 먹기까지 순서대로 공기를 진행한다. 2) 물먹기, 까부리, 기둥박기, 알낳기, 알올리기, 알품기, 알바꾸기, 알깨기, 솥걸기 등 지정된 단계별 동작을 차례로 성공한다. 3) 11단계 고추장 된장을 거쳐 12단계 먹기에서 공깃돌을 꺾어 잡은 개수로 나이를 얻는다. 4) 정해진 목표 나이(10살 등)를 먼저 획득하는 사람이 승리한다.</p>
