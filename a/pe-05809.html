<h1>공 세우고 차기 및 패스 연습</h1>
<p>1) 공을 세우고 뒤로 물러섰다가 다가오면서 디딤발을 공 옆에 둔다.2) 발 안쪽(인사이드)으로 공을 찬다.3) 익숙해지면 거리를 점차 늘려가며 발등으로도 차본다.4) 더 익숙해지면 굴러오는 공을 세우지 않고 바로 차거나 발 안쪽으로 잡는다.</p>
