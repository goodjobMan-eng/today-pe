<h1>중앙 숫자 카드 탈환 전략 달리기</h1>
<p>1) 코트 중앙 원에 다양한 점수가 적힌 숫자 카드 여러 장을 뒤집어 놓거나 흩어 놓는다. 2) 신호가 울리면 각 모둠 주자가 한 명씩 전력 질주하여 중앙에서 카드 1장을 집어 진영으로 가져온다. 3) 가져온 카드의 숫자를 모둠별로 합산하여 정해진 목표 점수에 먼저 도달하거나 최고 점수를 낸 팀이 승리한다. 4) 고득점 카드 가져오기, 특정 목표 숫자 맞추기, 연산식 만들기 등으로 규칙을 변형해 진행한다.</p>
