<h1>주토피아 키즈 요가 스트레칭</h1>
<p>1) 화면에 등장하는 주토피아 캐릭터들의 요가 및 스트레칭 동작을 보고 따라 할 준비를 합니다. 2) 긴장을 풀고 깊게 숨을 들이쉬고 내쉬며 자세를 유지합니다. 3) 안내에 따라 '반대쪽으로 전환(switch to the other side)' 신호가 나오면 반대 방향도 동일하게 수행합니다. 4) 정해진 카운트다운 시간 동안 차분하게 몸을 늘려주며 마무리합니다.</p>
