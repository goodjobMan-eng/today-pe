<h1>발등 슈팅 연습</h1>
<p>1) 공을 발등(신발 끈 부위)에 맞춘다는 느낌으로 자세를 잡는다. 2) 디딤발은 공 옆에 주먹 2개 정도 간격으로 두고 가슴과 상체를 숙여 공이 뜨지 않게 한다. 3) 공에 가까이 서서 제자리 슛 연습을 먼저 하여 발등에 정확히 맞추는 감각을 익힌다. 4) 익숙해지면 뒤로 3~4보 물러나 달려들어가며 힘을 실어 차거나 파트너가 밀어준 공을 차서 슈팅한다.</p>
