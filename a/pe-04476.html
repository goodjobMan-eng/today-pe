<h1>엔드라인 왕복 워밍업 루틴</h1>
<p>1) 활동 구역 양쪽 끝에 엔드라인을 콘이나 바닥 선으로 표시하고 모든 학생이 한쪽 선에 정렬한다. 2) 운동 전 가슴에 손을 대어 10초간 맥박과 호흡 상태를 확인한다. 3) 햄스트링 킥, 스모 스쿼트 스톰프, 외발 점프 착지, 사이드 킥, 사이드 리프, 베어 워크, 덕 워들 동작 등으로 반대편 엔드라인까지 이동한다. 4) 운동 종료 후 다시 맥박과 호흡 변화를 확인하며 몸의 열감과 준비 상태를 비교한다.</p>
