<h1>투구 및 캐치 게임 모음</h1>
<p>1) 훌라후프와 콩주머니를 이용해 플랭크 자세로 주고받기 연습을 한다. 2) 매트에 앉아 윗몸일으키기를 하며 공을 던지고 받는 운동을 한다. 3) 두 사람이 마주 서서 콘을 들고 공을 주고받으며 캐치 연습을 한다. 4) 콘을 세워두고 공을 굴려 맞추거나 점프하며 공을 주고받는 활동을 한다.</p>
