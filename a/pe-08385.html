<h1>어린이 농구 패스 트레이닝 드릴 모음</h1>
<p>1) 콘과 구역을 설정한 후 '패스 더 락', '다이아몬드 패싱' 등을 통해 점프 스톱과 피벗, 체스트 패스 기본기를 익힌다. 2) '패싱 태그', '농구 테니스', '킵어웨이'를 통해 제한된 공간에서 수비를 따돌리고 동료에게 정확히 공을 전달하는 연습을 한다. 3) '위브', '엔드존', '딘 스미스' 등 코트 전체를 활용하며 어시스트 후 슛으로 연결하는 협동 패스 미니게임을 진행한다.</p>
