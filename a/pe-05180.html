<h1>낙하산 놀이: 우산과 버섯</h1>
<p>1) 학생들이 원형으로 둘러서서 파라슈트(낙하산) 가장자리를 잡는다.2) '우산(Umbrella)' 구령에 맞춰 파라슈트를 높이 들어 올린 뒤 한 걸음 안으로 들어간다.3) 파라슈트를 내리고 쪼그려 앉아 준비 자세를 취한다.4) '버섯(Mushroom)' 구령에 맞춰 위로 크게 부풀린 후 안쪽으로 들어가 돔 형태를 만들고, 밖으로 나와 파도를 만든다.</p>
