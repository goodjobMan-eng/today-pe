<h1>비행기 노래 맞춤 준비체조</h1>
<p>1) 제자리 걷기와 V스텝으로 몸을 풀며 리듬을 탄다. 2) 앞으로 3걸음 걸으며 총 쏘기 포즈를 취하고 뒤로 3걸음 물러선다. 3) 가슴 펴주기(비행기 자세), 팔꿈치 찌르고 원 그리기, 니킥, 산 찌르기 동작을 수행한다. 4) 제자리 점프와 발차기, 팔 벌려 뛰기, 숨쉬기 동작으로 마무리한다.</p>
