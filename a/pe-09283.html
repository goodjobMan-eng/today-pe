<h1>닥터 피구</h1>
<p>1) 코트 중앙선을 기준으로 두 팀으로 나눕니다. 2) 상대 팀에게 공을 던져 맞히면 맞은 사람은 바닥에 앉습니다. 3) 앉아 있는 팀원은 같은 팀의 '닥터'가 다가와 터치해주면 다시 일어날 수 있습니다. 4) 상대 팀의 닥터까지 모두 맞혀 앉히면 승리합니다.</p>
