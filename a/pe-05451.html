<h1>바다-섬-강-산 점프 놀이</h1>
<p>1) 교사의 구령(바다, 섬, 강, 산)을 듣고 동작을 준비한다.2) '바다' 구령에는 앞으로 점프하고, '섬' 구령에는 원래 자리로 점프해 돌아온다.3) '강' 구령에는 뒤로 점프하고, '산' 구령에는 제자리에서 위로 점프한다.4) 구령을 틀리면 팔찌를 반납하거나 미션을 수행하며 마지막까지 살아남는다.</p>
