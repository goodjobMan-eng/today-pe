<h1>변형 츄크볼 (백보드 활용 게임)</h1>
<p>1) 농구 골대 아래에 콘으로 아치형 구역을 만든다. 2) 공을 가진 사람은 걸을 수 없고 피벗만 가능하며, 슛하기 전에 팀원끼리 최소 3회 이상 패스해야 한다. 3) 수비는 공격수를 직접 마크할 수 없으며 어느 쪽 농구 골대 백보드에 던져도 된다. 4) 백보드를 맞고 튀어나온 공이 콘 구역 바깥 바닥에 떨어지면 공격팀 득점이고, 수비팀이 바닥에 닿기 전에 잡으면 득점이 되지 않는다.</p>
