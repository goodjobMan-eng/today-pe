<h1>지그재그 달리기 콩주머니 이어달리기</h1>
<p>1) 각 팀 앞에 콘 2개를 지그재그로 배치하고 끝에 팀원 수만큼의 콩주머니를 담은 후프를 둔다. 2) 각 팀의 첫 주자가 출발하여 콘을 빠르게 터치하며 달린 후 후프 안의 콩주머니 1개를 집어 들고 돌아온다. 3) 돌아와서 다음 주자와 하이파이브를 하면 다음 주자가 출발한다. 4) 팀의 모든 콩주머니를 가장 먼저 모은 팀이 승리한다.</p>
