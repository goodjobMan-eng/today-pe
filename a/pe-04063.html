<h1>필드 데이 협동 챌린지</h1>
<p>1) 팀원들이 협력하여 후프 바닥 1개, 양옆 2개, 상단 1개로 입체 구조물을 세운다. 2) 후프 구조물이 무너지지 않도록 체구가 가장 작은 팀원이 안으로 통과해 들어간다. 3) 구조물을 완성한 후 공을 지그재그로 밀며 반환점까지 갔다가 직선으로 돌아온다. 4) 반환점을 돌아오면 다음 주자가 이어받아 기록을 측정한다.</p>
