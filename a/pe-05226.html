<h1>페이서(왕복오래달리기) 측정 시범</h1>
<p>1) 신호음이 울릴 때마다 직선으로 달려 왕복 랩을 완료한다.2) 신호음 전에 랩을 완료하지 못한 횟수가 두 번째가 되면 측정이 종료된다.3) 짝은 주자가 통과한 랩 숫자를 확인하여 기록지에 체크한다.4) 달리기가 끝난 학생은 짝과 함께 앉아 모두 끝날 때까지 기다린다.</p>
