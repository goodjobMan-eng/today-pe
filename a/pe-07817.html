<h1>매트 골대 비치볼 축구 (풋볼 플라야)</h1>
<p>1) 매트 여러 장을 옆으로 세워 가운데 빈 공간(골대)이 생기도록 사각형 형태로 배치한다. 2) 학급을 녹색 팀과 흰색 팀의 두 팀으로 나누고, 각 팀에 비치볼을 1개씩 지급한다. 3) 축구 기본 규칙과 동일하게 손을 제외한 발이나 신체 부위만을 사용해 비치볼을 찬다. 4) 상대 팀 매트 사각형 가운데의 빈 공간 안으로 비치볼을 차 넣어 득점하며 1점을 획득한다.</p>
