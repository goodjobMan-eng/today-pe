<h1>하키 기초 드리블 및 슈팅</h1>
<p>1) 스틱 위쪽을 한 손으로 잡고 다른 손은 중간 부위를 잡은 채 양손으로 스틱을 쥔다. 2) 무릎을 굽혀 자세를 낮추고 스틱 헤드의 중앙 부위와 양면을 활용하여 작은 터치로 공을 다룬다. 3) 콘 라인을 따라 콘 끝까지 부드럽게 드리블하여 전진한 뒤 공을 멈추고 돌아온다. 4) 콘 끝까지 드리블한 후 공을 멈춰 세우고 발을 내딛으며 골대를 향해 슈팅한다.</p>
