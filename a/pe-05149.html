<h1>사커 누들 태그</h1>
<p>1) 풀누들을 든 술래들이 다른 학생들의 어깨 아래 부위를 태그하러 다닌다.2) 태그되거나 넘어진 학생, 또는 경기장 경계선 밖으로 나간 학생은 그 자리에서 얼음이 되어 양손을 올리고 좌우로 움직인다.3) 공(게이터스킨 볼)을 가진 학생은 태그되지 않는 무적 상태이며, 드리블하다가 얼어붙은 친구에게 발로 패스하고 친구가 발로 공을 트랩하면 얼음이 풀려 역할을 교대한다.</p>
