<h1>2개 베이스 이동 규칙 발야구</h1>
<p>1) 부채꼴 모양의 경기장에 홈, 1루, 2루, 3루 베이스 4개를 설치하고 공격과 수비로 나눈다. 2) 타자는 다리가 야구방망이가 되어 공을 타격(발로 차기)한다. 3) 파울 라인을 벗어나면 파울이 선언된다. 4) 홈런은 없으며, 아무리 멀리 차도 타자와 주자는 최대 2개 베이스까지만 이동할 수 있다.</p>
