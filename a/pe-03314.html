<h1>혼자 왔어요, 둘이 왔어요, 셋이 왔어요 달리기</h1>
<p>1) 모둠별로 출발선에서 10m 떨어진 곳에 삼각콘 1개를 세운다. 2) 신호가 울리면 첫 번째 주자가 출발하여 삼각콘을 돌아와서 두 번째 주자와 손을 잡고 둘이 같이 뛴다. 3) 두 주자가 삼각콘을 돌아 출발선에 들어오면 세 번째 주자의 손을 잡고 셋이 같이 뛴다. 4) 모든 주자가 손을 잡고 가장 먼저 출발선에 들어온 모둠이 승리한다.</p>
