<h1>양말 공 브레인 액티비티</h1>
<p>1) 양말 한 켤레를 둥글게 말아 공 형태로 만든다.2) 한 손으로 양말 공을 알맞은 높이로 던져 같은 손으로 1분간 연속으로 잡은 뒤 반대 손으로 바꾸어 진행한다.3) 양손으로 대각선 방향 번갈아 던지기, 반대쪽 팔 아래로 넣어 던지기, 두 개 동시에 던지기, 팔 꼬아 잡기 등 다양한 패턴을 각각 1분간 실시한다.</p>
