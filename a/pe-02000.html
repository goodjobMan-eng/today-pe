<h1>구조물(구명부환·킥판)을 활용한 안전 뜨기</h1>
<p>1) 물에 던져진 구명부환의 경우 올라타지 말고 두 팔을 걸쳐 잡고 가슴을 기댄 채 뜬다. 2) 킥판(헬퍼)은 두 팔로 가슴에 끌어안고 누워 몸을 띄운다. 3) 즉각적인 위험이 없고 육지와 멀다면 머리를 들어 구조자가 오는 방향을 살피며 제자리에서 구조를 기다린다. 4) 가까운 곳에 대피할 안전지대가 있다면 발차기를 하여 그곳까지 이동한다.</p>
