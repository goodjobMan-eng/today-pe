<h1>터치하면 술래가 바뀌는 변형 술래잡기 놀이</h1>
<p>1) 변형 술래잡기(変わり鬼)는 술래가 다른 사람을 터치하면 즉시 술래가 바뀝니다. 2) 꼬리 뺏기 술래잡기(しっぽ取り鬼ごっこ)는 술래가 다른 사람의 꼬리를 빼앗아야 술래가 바뀝니다. 3) 바이바이 술래잡기(バイバイ鬼)는 링 안에 들어가면 무적이지만 한 링에 1명만 들어갈 수 있고, 다른 사람이 들어와 &quot;바이바이&quot;라고 외치면 원래 있던 사람은 반드시 밖으로 나와야 합니다.</p>
