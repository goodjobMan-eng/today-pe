<p>1) 각 팀에서 한 명씩 나와 가위바위보로 선공과 후공을 결정한다.2) 기준선 뒤에 서서 팀별로 번갈아 가며 표적지를 향해 컬링 스톤을 투구한다.3) 모든 투구가 끝난 후 표적지 정중앙에 가장 가깝게 스톤을 위치시킨 팀이 승리한다.4) 승리 팀은 상대 팀의 가장 가까운 스톤보다 표적 중심에 더 가까이 위치한 연속된 스톤 개수만큼 득점한다.</p>
