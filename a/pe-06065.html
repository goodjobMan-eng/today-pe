<h1>후프와 줄넘기 줄을 활용한 활동</h1>
<p>1) 후프에 줄넘기 줄을 묶어 바닥에 던진 후 당겨서 목표물을 끌어오는 낚시 놀이를 한다.2) 친구가 끌어당기는 후프 안에 들어가 속도에 맞춰 밟지 않고 걸어간다.3) 후프가 앞으로 당겨지는 동안 후프 안쪽 공간으로 공을 드리블하며 이동한다.</p>
