<h1>스켈레톤 및 루지 썰매 활동</h1>
<p>1) 배구 지주대 사이에 줄(로프)을 길게 연결하여 설치한다. 2) 학생은 스쿠터보드 위에 엎드리거나(스켈레톤), 무릎을 꿇거나 앉는 자세(루지)를 선택한다. 3) 로프를 양손으로 잡고 팔 힘으로 당기며 반대편 끝까지 전진한다. 4) 로프 끝에 도착하면 스쿠터를 들고 출발점으로 돌아와 차례를 기록하고 다음 차례를 준비한다.</p>
