<h1>비사치기 넘어뜨리기 놀이</h1>
<p>1) 비사 5개를 세워 두고 공을 찰 수 있는 출발선을 긋는다. 2) 한 사람당 공을 3번 차서 세워진 비사를 무너뜨린다. 3) 3번 안에 5개를 모두 무너뜨리면 다시 쌓고 남은 공을 차며, 쓰러뜨린 개수만큼 점수를 얻는다. 4) 3번 차고도 쓰러뜨리지 못하고 남아 있는 비사의 개수는 상대팀의 점수가 된다.</p>
