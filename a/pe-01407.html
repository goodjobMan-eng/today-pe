<h1>중학교 체육 ACP 준비운동 연계 수업 사례</h1>
<p>1) 수업 도입부에 짝과 함께 점프 및 꼬리잡기 놀이로 몸을 푼다. 2) 모둠별로 소통 협동 놀이와 지네 피구 활동을 진행하여 분위기를 높인다. 3) 활발해진 신체 협응력을 바탕으로 본운동인 농구 패스와 슛을 진행한다. 4) 학급 상황에 맞춰 미니 경기 규칙을 변경하며 팀 협력 플레이를 유도한다.</p>
