<h1>디스크 컬링</h1>
<p>1) 출발선에서 10~15m 전방에 지름 2~3m 내외의 과녁을 그린다. 2) 각 팀당 5개의 디스크를 가지고 순서를 정해 번갈아 과녁을 향해 바닥으로 밀어 보낸다. 3) 양 팀 모두 투구를 마친 후 과녁 중심에 가장 가까운 디스크를 위치시킨 팀이 승리한다.</p>
