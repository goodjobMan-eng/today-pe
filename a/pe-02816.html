<h1>모양 점프 달팽이 놀이</h1>
<p>1) 도화지에 발바닥(및 손바닥) 모양을 그려 바닥에 불규칙하게 배치하여 길을 만든다. 2) 양 팀으로 나뉘어 출발선과 최후 방어선을 정하고 각 팀 첫 주자가 모양에 맞춰 점프하며 전진한다. 3) 중간에서 마주치면 가위바위보를 하여 진 사람은 대기 줄 맨 뒤로 가고 다음 사람이 출발하며, 이긴 사람은 계속 전진한다. 4) 상대 팀의 최후 방어선을 통과한 후 가위바위보에서 승리하면 최종 승리한다.</p>
