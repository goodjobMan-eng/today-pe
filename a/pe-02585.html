<h1>스파이 피구(시크릿 여왕 피구)</h1>
<p>1) 팀별로 상대 팀 모르게 비밀리에 여왕 1명을 정하고, 심판에게만 조용히 알려준다. 2) 일반 피구 규칙으로 경기를 진행하되, 여왕이 티 나지 않도록 일반 팀원처럼 행동하며 수비한다. 3) 여왕을 제외한 모든 팀원이 아웃되어 1명만 남게 되면, 그 남은 1명은 공에 맞아도 아웃되지 않는 무적 호위무사가 되어 여왕을 지킨다. 4) 공을 던져 상대 팀의 숨겨진 여왕을 맞혀 아웃시키는 팀이 승리한다.</p>
