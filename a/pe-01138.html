<h1>징검다리 후프 점프 빈백 보물 탈환</h1>
<p>1) 코트에 훌라후프를 징검다리 형태로 촘촘히 깔고 끝지점에 빈백 보물 더미를 모아둔다. 2) 각 모둠 주자는 펀스틱을 들고 출발해 후프 안쪽을 양발 점프나 깽깽이(호핑)로 연속 도약한다. 3) 반환점의 빈백을 펀스틱 끝으로 짚거나 주워 챙긴 뒤 다시 징검다리를 뛰어 건너 출발선 모둠 바구니에 넣는다. 4) 이동 방식을 한 발 호핑이나 사이드 스텝으로 변형하거나 후프 간격을 넓혀 멀리뛰기 도전 과제로 진행한다.</p>
