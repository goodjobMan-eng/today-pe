<h1>교실 고양이와 쥐 술래잡기</h1>
<p>1) 2명씩 손을 잡고 '나무' 역할을 맡아 교실 곳곳에 선다. 2) 쥐(도망자)가 고양이(술래)에게 쫓기다가 나무를 이루는 한 친구의 손을 잡는다. 3) 나무의 반대쪽 손에 있던 친구가 튕겨 나가 새로운 쥐가 되어 도망친다. 4) 고양이가 쥐를 잡으면 잡힌 친구가 고양이가 되고, 이전 고양이는 &quot;야옹&quot; 소리와 몸짓으로 변신 동작을 마친 뒤 쥐가 되어 도망간다.</p>
