<h1>홈 트레이닝 4종 신체활동 루틴</h1>
<p>1) 허리를 아래로 내렸다가 등을 둥글게 말아 올리는 고양이 말 등 자세 유연성 운동을 한다. 2) 앞쪽과 측면으로 상체를 숙여 가볍게 반동을 주며 다리 늘리기 유연성 운동을 한다. 3) 팔굽혀펴기 자세에서 한쪽 발을 교차 터치한 후 모아서 높이 뛰는 크로스오버피 심폐지구력 운동을 한다. 4) 한쪽 다리로 중심을 잡고 반대쪽 발끝으로 목표점을 터치하는 밸런스 운동을 반복한다.</p>
