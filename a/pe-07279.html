<h1>스펠 볼</h1>
<p>1) 학생들이 큰 원을 만들고 몇 명의 학생이 원 안으로 들어간다. 2) 원 밖의 학생들이 짐볼을 굴리거나 밀어서 원 안의 학생들을 맞히려고 시도한다. 3) 공에 맞은 학생은 교사가 제시한 체육 관련 단어의 철자를 맞혀야 하며, 맞히면 공을 굴린 학생과 자리를 바꾼다.</p>
