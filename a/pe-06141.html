<h1>배려민턴 게임</h1>
<p>1) 두 모둠으로 나누고 각 모둠 안에서 두 명씩 짝을 만들어 순서를 정한다.2) 1번 짝끼리 네트를 사이에 두고 마주 보고 서서 셔틀콕을 주고받는다.3) 셔틀콕을 넘겨줄 때마다 모둠 점수 1점을 얻는다.4) 셔틀콕을 넘기지 못해 바닥에 떨어뜨리면 다음 짝으로 교대한다.5) 활동에 익숙해지면 한 코트에서 한 모둠씩 정해진 시간 동안 대결하여 더 높은 점수를 얻은 모둠이 승리한다.</p>
