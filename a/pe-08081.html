<h1>스파이더 볼</h1>
<p>1) 공을 들고 뛰거나 걷거나, 또는 날아오는 공에 맞으면 그 자리에 앉아야 한다. 2) 앉아 있는 상태에서 서 있는 사람이 다가왔을 때 공으로 맞히면 다시 일어날 수 있다. 3) 또는 앉은 상태에서 다른 파트너와 공을 연속 5번 주고받는 캐치에 성공하면 다시 일어날 수 있다. 4) 서 있는 동안에는 체육관 어디든 자유롭게 달리며 바닥의 공을 줍거나 앉아 있는 친구에게 공을 넘겨줄 수 있다.</p>
