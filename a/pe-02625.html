<h1>가정형 신체활동 코디네이션 운동</h1>
<p>1) 상체를 바르게 세우고 다리를 직각으로 만들어 무릎을 들어 바깥으로 돌린다. 2) 중심과 높이를 유지하며 다리를 옆으로 뻗어 마커를 정확하게 터치한다. 3) 다리를 앞뒤로 교차하며 사다리를 밟지 않고 측면으로 이동한다. 4) 양발로 동시 점프 회전하며 사다리를 이동하되 착지 시 발목에 무리가 가지 않도록 주의한다.</p>
