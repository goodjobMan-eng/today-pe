<h1>맨몸 근력 및 근지구력 운동</h1>
<p>1) 무릎을 대고 등을 편 상태로 니 푸시업을 10회 3세트 실시한다. 2) 다리와 허리를 곧게 펴고 일반 푸시업을 실시한다. 3) 푸시업 자세에서 한 손씩 반대쪽 어깨를 터치하는 숄더 탭스를 20회 3세트 실시한다. 4) 무릎이 앞으로 나가지 않게 엉덩이를 뒤로 빼며 스쿼트와 점프 스쿼트를 하고, 상체를 세워 런지와 백 런지를 실시한다.</p>
