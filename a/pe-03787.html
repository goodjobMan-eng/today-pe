<h1>십자 술래잡기 (십자귀)</h1>
<p>1) 바닥에 십자 형태의 구역을 만들고 술래 2명은 십자 선 위(십자 안)로 들어간다. 2) 도망자는 술래를 피해 십자 주변을 시계 방향으로 돈다. 3) 술래에게 태그되면 다시 처음 위치(출발점)로 돌아가서 시작한다. 4) 도망자가 2바퀴를 돌면 도망자 팀이 승리한다.</p>
