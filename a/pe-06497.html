<h1>나 잡아봐라 이어달리기 (쫓고 쫓기는 달리기)</h1>
<p>1) 원형 트랙(센터 서클)의 반대편에 두 팀이 마주 보고 한 줄로 선다. 2) 각 팀의 첫 번째 주자가 펀스틱을 배턴으로 들고 같은 방향으로 원을 따라 달린다. 3) 한 바퀴를 돌고 다음 주자에게 배턴을 넘기며, 앞 주자를 펀스틱으로 태그하면 점수를 얻거나 승리한다.</p>
