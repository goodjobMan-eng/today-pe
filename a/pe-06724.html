<h1>슈퍼스타 축구 개인기 트릭 챌린지</h1>
<p>1) 각 활동마다 10번의 시도 기회가 주어지며 기술을 성공할 때마다 점수를 획득한다. 2) 발로 공을 띄워 발등에 3초간 올려두는 스쿱 업 등 13가지 축구 트릭에 순차적으로 도전한다. 3) 난이도가 높은 기술은 더 높은 점수를 받고 쉬운 기술은 비교적 적은 점수를 얻어 최종 점수를 기록한다.</p>
