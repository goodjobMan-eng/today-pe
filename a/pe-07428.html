<h1>민첩성 사각판 협동 리듬 챌린지</h1>
<p>1) 참가자 수에 맞게 두 발이 들어갈 크기의 사각 칸을 바닥에 그리고 60cm 이상 간격을 둔다. 2) 발 스텝, 점프, 턴을 활용한 리듬 스텝 구조를 만들고 천천히 1분간 반복 숙달한다. 3) 모둠원 전체가 속도를 맞춰가며 자리를 바꾸거나 박수를 섞은 협동 동작을 완성한다.</p>
