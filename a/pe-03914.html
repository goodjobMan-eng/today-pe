<h1>좀비 태그</h1>
<p>1) 농구 코트 또는 배구 코트 라인이 그려진 바닥에서 한 명의 감염된 좀비 술래를 지정한다. 2) 모든 학생과 술래는 코트 라인 위에서만 달려서 이동해야 한다. 3) 좀비 술래는 라인을 따라 이동하며 도망치는 학생들을 태그한다. 4) 태그된 학생은 즉시 좀비가 되어 두 팔을 앞으로 뻗고 절뚝거리며 다른 도망자들을 함께 태그한다.</p>
