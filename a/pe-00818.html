<h1>세인트 패트릭 데이 프리즈 댄스</h1>
<p>1) 음악이 흘러나오는 동안 화면 속 캐릭터들의 춤을 따라 하거나 자신만의 창의적인 동작으로 자유롭게 춤을 춥니다. 2) 음악이 멈추면 화면을 보고 레프러콘 캐릭터의 정지 자세를 그대로 흉내 내어 몸을 멈춥니다. 3) 중간에 등장하는 달리기 승부 예측 레이스와 동전 뒤에 숨은 요정 찾기 미니게임에도 적극적으로 참여합니다. 4) 다시 음악이 시작되면 멈춘 자세를 풀고 신나게 춤과 신체 표현 활동을 이어갑니다.</p>
