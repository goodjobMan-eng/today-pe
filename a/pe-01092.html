<h1>손에 손잡고 훌라후프 통과 릴레이</h1>
<p>1) 4~6명이 한 팀이 되어 옆 사람과 손을 단단히 잡고 일렬로 나란히 선다. 2) 맨 끝 주자의 팔에 훌라후프를 걸고 시작 신호에 맞춰 손을 놓지 않은 채 몸을 비틀어 옆 사람에게 후프를 넘긴다. 3) 반대편 끝 사람까지 후프가 도달하면 반환점 콘을 돌아 마지막 주자가 전원과 함께 출발선으로 전력 질주한다. 4) 인원이 많을 때는 훌라후프 개수를 2~3개로 늘리거나 양방향 교차 전달 방식으로 진행한다.</p>
