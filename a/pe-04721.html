<h1>공 던지기와 받기 기본 자세</h1>
<p>1) 언더핸드 스로는 스윙, 스텝, 스로우 순서로 실시한다. 2) 오버핸드 스로는 몸을 목표 방향으로 돌리고 알파벳 L 모양을 만든 뒤 스텝, 트위스트, 스로우 순서로 실시한다. 3) 던질 때는 항상 반대쪽 발로 스텝을 밟는다. 4) 공을 받을 때는 높은 공은 엄지를 붙이고, 낮은 공은 새끼손가락을 붙여서 잡는다.</p>
