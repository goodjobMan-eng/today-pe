<h1>BTS 다이너마이트(Dynamite) 표현활동 체조</h1>
<p>1) 방탄소년단 Dynamite 전주에 맞춰 가볍게 제자리걸음을 하며 리듬을 탄다. 2) 1번 동작으로 손뼉을 치며 어깨와 팔을 양옆으로 뻗는 스텝을 반복한다. 3) 2번과 3번 동작으로 몸을 가볍게 털며 킥과 스텝을 조합하고 기타를 치는 듯한 모션을 취한다. 4) 4번 동작으로 신나게 리듬 스텝을 밟은 후 마지막 숨쉬기 운동으로 호흡을 정돈한다.</p>
