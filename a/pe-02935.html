<h1>강강술래 덕석몰기와 풀기</h1>
<p>1) 손을 잡고 원을 만들어 노랫소리에 맞춰 오른쪽으로 천천히 걸어가며 원을 크게 돈다. 2) 선두가 대열을 이끌고 안쪽으로 달팽이 모양(태극 모양)을 그리며 감아 들어가는 덕석몰기를 한다. 3) 안쪽까지 감긴 대열을 다시 바깥쪽으로 풀어 나오는 덕석풀기를 진행한다.</p>
