<h1>보디가드 술래잡기 (스타·보디가드·팬)</h1>
<p>1) 스타, 보디가드, 팬 역할을 정하고 3명 또는 4명이 한 모둠을 구성합니다. 2) 보디가드는 스타의 손을 잡거나 앞을 막아서며 팬의 접근을 차단하고, 팬은 보디가드의 방어를 피해 스타를 터치하기 위해 빠르게 움직입니다. 3) 팬이 스타를 터치하면 라운드가 종료됩니다. 4) 라운드가 끝나면 역할을 한 칸씩 순환하여 바꾸며, 역할 번호를 정해 순서대로 순환하면 혼선 없이 진행할 수 있습니다.</p>
