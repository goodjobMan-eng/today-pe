<h1>관음보살 당기기 버티기 놀이</h1>
<p>1) 두 사람이 마주 보고 앉아 한 사람이 양팔을 앞으로 뻗어 모으고, 상대방이 그 팔을 바깥쪽으로 벌리거나 당기려 할 때 팔 힘으로 버틴다. 2) 역할을 바꾸어 같은 방식으로 진행한다. 3) 양다리를 모아 앞으로 뻗고 앉은 상태에서 상대방이 다리를 벌리려 할 때 다리를 모아 버틴다. 4) 무릎을 세워 앉은(체육관 앉기) 자세에서 다리를 모아 벌어지지 않도록 전신 힘으로 버틴다.</p>
