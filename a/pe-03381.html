<h1>이어 주는 공 막기</h1>
<p>1) 10m 정도 크기의 원을 그리고 원 밖의 공격 모둠(5~6명)과 원 안의 수비 모둠(3명)으로 나눈다. 2) 공격 모둠은 원 밖에서 원 안을 가로질러 발로 패스하고 수비 모둠은 이어 주는 공을 막는다. 3) 공격 모둠이 수비 모둠을 피해 공을 이어 주면 1점을 얻고, 수비 모둠이 공을 막거나 가로채면 1점을 얻는다. 4) 5점을 먼저 얻는 모둠이 이긴다.</p>
