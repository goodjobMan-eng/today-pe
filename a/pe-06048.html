<h1>어흥-탕-에헴 태그게임</h1>
<p>1) 두 팀이 마주 보고 서서 공격과 수비 역할을 정한다.2) 수비수는 한 발만 뒤나 옆으로 디뎌서 공격수의 태그를 피할 수 있다.3) 공격수는 한 발을 앞으로 내딛으며 상대방을 손으로 태그하려고 시도한다.4) 공격을 피하지 못하고 태그된 사람은 아웃되거나 상대 팀으로 넘어간다.5) 정해진 시간 동안 더 많은 팀원을 유지하거나 상대를 모두 잡으면 승리한다.</p>
