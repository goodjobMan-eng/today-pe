<h1>루돌프 고리 던지기</h1>
<p>1) 팀별로 출발선 뒤에 대기하고 목표 지점에 루돌프 뿔을 배치한다. 2) 신호에 맞춰 출발선에서 고리를 던져 루돌프 뿔에 건다. 3) 고리를 넣지 못했을 때는 고리를 주워서 다시 제자리로 돌아온다. 4) 뿔에 걸린 고리의 점수를 합산하여 목표 점수를 먼저 달성한 팀이 승리한다.</p>
