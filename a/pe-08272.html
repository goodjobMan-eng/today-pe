<h1>벽치기 술래잡기 코디네이션</h1>
<p>1) 두 사람이 마주 보고 플랭크 자세로 손바닥을 터치하며 대기한다. 2) 신호가 울리면 한쪽은 정해진 벽을 향해 달리고 반대쪽은 상대를 터치하러 쫓아간다. 3) 공을 패스하며 이동하다가 신호가 울리면 공을 가진 사람이 벽으로 달리고 상대는 태그를 시도한다.</p>
