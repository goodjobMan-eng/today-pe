<h1>무빙 원마커 12가지 운동</h1>
<p>1) 점프 회전: 360도 회전 2) 턱점프: 무릎을 가슴에 닿게 점프 3) V-sit: V자 모양으로 버티기 4) 버피: 팔 짚고 다리 뻗기 5) 런지: 다리 앞뒤로 굽히기 6) 플랭크: 엎드려 버티기 7) 라인 터치: 좌우 이동하며 터치 8) 푸쉬업: 팔 굽혀 펴기 9) 나무자세: 한 발로 서서 버티기 10) 스쿼트: 앉았다 일어나기 11) 하이니: 무릎 높이 들고 뛰기 12) 줄넘기: 양발 모아 뛰기나 번갈아 뛰기</p>
