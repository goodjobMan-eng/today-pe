<h1>매트 피구 (마텐 츠바이펠더발)</h1>
<p>1) 중앙선을 경계로 두 팀으로 나누어 마주 서고, 각 팀 진영에 대형 안전 매트를 세워 둔다. 2) 양 팀은 소프트볼을 던져 상대 선수를 맞히며 일반 피구 규칙대로 경기를 진행한다. 3) 경기 중 세워 둔 대형 매트가 쓰러지면 남은 인원과 상관없이 그 팀은 즉시 패배한다.</p>
