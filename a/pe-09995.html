<h1>카트휠(옆돌기) 연습 단계</h1>
<p>1) 훌라후프와 콘을 배치하고 그 안에서 당나귀 차기(동물 걷기) 동작을 연습한다. 2) 제자리에서 손을 훌라후프에 짚고 콘을 넘는 카트휠 연습을 한다. 3) 서서 손을 훌라후프에 짚고 완전히 넘어가는 카트휠을 실시한다. 4) 한 손 카트휠에 도전한다.</p>
