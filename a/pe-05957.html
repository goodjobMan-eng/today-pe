<h1>고깔콘 디스크 볼링</h1>
<p>1) 책상 위에 고깔콘을 거꾸로 세워 볼링핀 형태로 배치한다.2) 세 명 정도가 한 팀이 되어 정해진 거리에서 플라잉디스크(폼 디스크/터치폼)를 던진다.3) 고깔콘을 쓰러뜨리면 10점, 책상 아래로 떨어뜨리면 20점을 얻는다.4) 디스크를 던진 사람이 콘을 세우고 로테이션으로 교대하며 먼저 100점을 얻은 팀이 승리한다.</p>
