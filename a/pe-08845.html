<h1>오프 더 덱</h1>
<p>1) 학생들은 마주 보는 위치에 짝을 이루어 원형으로 선다. 2) 짝 중 한 명이 녹색 테니스공을 들고 호루라기 소리에 맞춰 반대편 짝에게 공을 던진다. 3) 공을 놓친 짝은 본 경기에서 탈락하지만 빨간색 테니스공으로 바꿔 계속 던지기·받기 연습을 진행하며 마지막까지 녹색 공을 유지한 짝이 승리한다.</p>
