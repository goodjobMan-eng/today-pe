<h1>강 건너뛰기</h1>
<p>1) 두 줄의 줄넘기를 나란히 바닥에 놓아 강을 만들고, 콘 뒤에 일렬로 대기한다. 2) 첫 주자부터 차례대로 달려와 줄넘기 사이의 강을 뛰어넘는다. 3) 착지 후 넘어지지 않고 두 발로 균형을 유지하며 서 있어야 한다. 4) 줄넘기를 밟거나 강에 빠지거나 착지 시 넘어지면 탈락하여 콘 뒤에 앉고, 매 라운드 강의 폭을 점차 넓힌다.</p>
