<h1>리듬 변형 소형 허들 달리기</h1>
<p>1) 모둠별로 소형 허들과 접은 박스를 일정 간격으로 배치해 리듬 코스를 설치한다. 2) 신호에 맞춰 통·통·통이나 쿵·쿵쿵 등 설정된 리듬에 맞추어 발을 디디며 허들을 넘는다. 3) 허들 앞 박스를 밟지 않고 앞으로 몸을 밀어내며 완주한 주자가 성공 점수를 얻는다. 4) 허들 간 간격을 넓히거나 박스를 추가 배치하여 자신에게 맞는 새로운 리듬 구간으로 확장한다.</p>
