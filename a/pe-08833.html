<h1>탁구공 교실 축구</h1>
<p>1) 책상과 의자를 번갈아 붙여 경기장을 만들고 몸을 옆으로 틀어 한 발만 경기장 안으로 넣습니다. 2) 경기장 가운데에 탁구공을 떨어뜨리며 '탁! 구! 공!' 구호를 외치고 구호가 끝나면 발로 공을 찹니다. 3) 상대의 의자 밑(골대)으로 공을 차 넣으면 득점하며, 공이 밖으로 나가면 구호를 다시 외치고 재개합니다.</p>
