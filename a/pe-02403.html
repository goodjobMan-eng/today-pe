<h1>플라잉디스크 얼티미트 기본 경기</h1>
<p>1) 두 팀 각 7명의 필드 플레이어가 엔드존에서 마주보고 서서 수비 팀이 디스크를 풀(풀 던지기)하여 경기를 시작한다. 2) 공격 팀은 패스를 주고받으며 전진하고, 디스크를 잡은 선수는 즉시 멈춰서 10초 이내에 다른 선수에게 패스해야 한다. 3) 수비 팀 선수가 디스크를 가로채거나 땅에 떨어뜨리면 턴오버가 되어 공격권이 전환된다. 4) 상대 진영 엔드존 안에서 날아온 디스크를 잡으면 1점을 획득한다.</p>
