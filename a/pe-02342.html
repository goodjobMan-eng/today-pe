<h1>플로어컬</h1>
<p>1) 두 팀으로 나누어 가위바위보로 선공을 정하고 일정한 거리에서 하우스를 향해 스톤을 투구한다. 2) 투구 시 한쪽 무릎을 꿇거나 양반다리를 하고 스톤의 하단 바퀴가 모두 바닥에 닿은 상태로 굴린다. 3) 호그라인을 넘지 못하거나 정해진 라인을 벗어나 투구한 스톤은 반칙으로 제거한다. 4) 양 팀의 모든 스톤을 투구하면 엔드가 종료되며, 하우스 중앙에 가장 가까운 스톤의 팀이 승리하고 다음 엔드 선공이 된다.</p>
