<h1>몸 가위바위보 게임</h1>
<p>1) 짝과 마주 서서 시작 구호에 맞춰 가위바위보 동작을 전신으로 표현한다. 2) 공중에서는 다른 동작을 하다가 착지할 때 가위바위보 모양으로 바꾼다. 3) 이긴 사람은 다른 사람을 찾아가서 가위바위보를 계속 한다. 4) 3회 연속으로 이기면 선생님이 있는 곳으로 와서 앉는다.</p>
