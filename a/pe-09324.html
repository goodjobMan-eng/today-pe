<h1>몇명일까?</h1>
<p>1) 칠판에 학생 수만큼 숫자를 적는다. 2) 한 명씩 일어나 주어진 주제에 맞는 발표를 한다. 3) 발표에 해당하는 학생 수만큼 숫자에 동그라미를 표시한다. 4) 이미 동그라미가 표시된 숫자가 나오면 실패한다.</p>
