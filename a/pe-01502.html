<h1>지그재그 리듬 도약 갤럽 달리기</h1>
<p>1) 운동장에 출발선과 접시콘 반환점을 배치하고 1열 종대로 준비한다. 2) 신호에 맞추어 앞발을 크게 내딛고 뒷발이 따라붙는 리듬감 있는 갤럽 스텝으로 앞으로 전진한다. 3) 목표 지점의 콘을 신속하고 정확하게 돌아온 학생에게 성공 점수를 부여한다. 4) 익숙해지면 발을 바꾸어 진행하거나 점프 높이 및 보폭을 넓혀 도약 난이도를 높인다.</p>
