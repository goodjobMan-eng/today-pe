<h1>서서 하는 전신 스트레칭</h1>
<p>1) 발목과 손목을 가볍게 돌려주며 준비 운동을 시작한다. 2) 서서 한쪽 발목을 뒤로 잡아당겨 뒤꿈치를 엉덩이에 붙여 허벅지 앞쪽을 늘려준다. 3) 한쪽 발목을 반대쪽 무릎 위에 얹고 엉덩이를 뒤로 빼며 의자에 앉듯 앉아 둔근과 골반을 늘려준다. 4) 다리를 어깨너비보다 넓게 벌려 좌우로 체중을 이동하며 허벅지 안쪽을 이완하고 상체와 옆구리를 늘려준다.</p>
