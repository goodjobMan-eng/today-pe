<h1>단계별 전신 요가 스트레칭</h1>
<p>1) 바닥에 앉아 발목을 안팎으로 돌리고 다리를 반대쪽 허벅지에 얹어 관절을 푼다. 2) 종아리와 허벅지를 양손으로 누르고 배꼽으로 깊은 호흡을 하며 발바닥을 두드린다. 3) 상체를 좌우로 비틀어 허리와 목을 천천히 돌린 후 다리를 양옆으로 넓게 벌려 앞으로 숙인다. 4) 바닥에 엎드리거나 누워 팔다리를 교차해 뻗으며 척추와 골반을 길게 늘여준다.</p>
