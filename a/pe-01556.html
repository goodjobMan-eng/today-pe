<h1>매트 전방 도립 회전 뛰기</h1>
<p>1) 매트 앞 직선 도움닫기 주로를 확보하고 발구름 지점과 착지 구역을 확인한다. 2) 3~5걸음 리듬감 있게 도움닫기를 달려와 두 발로 강하게 구름판이나 바닥을 박차며 도약한다. 3) 두 손을 매트에 힘차게 짚는 동시에 다리를 뒤로 강하게 차올려 손짚고 공중 회전을 만든다. 4) 어깨로 바닥을 강하게 밀어내며 몸을 펴고 두 발로 안정감 있게 착지하며, 착지 매트 단차를 두어 단계별로 숙달한다.</p>
