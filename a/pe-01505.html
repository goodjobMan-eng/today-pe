<h1>두 손으로 모아 잡는 기초 공 놀이</h1>
<p>1) 학생마다 폼볼을 1개씩 배부받아 개인 공간에 서서 준비 자세를 취한다. 2) 공을 손으로 가볍게 위로 던진 뒤 떨어지는 공을 두 손을 모아 가슴 앞에서 안전하게 잡는다. 3) 손바닥을 접시 모양으로 오므려 받기, 박수 치고 받기, 튕겨 오른 공 잡기 등 미션을 단계별로 수행한다. 4) 성공 횟수를 점수로 기록하거나 상자나 훌라후프 표적 안에 공을 던져 넣는 도전 과제로 확장한다.</p>
