<h1>플로어 하키 스틱 기초 및 공간 이동 (강아지 산책)</h1>
<p>1) 조깅 신호에 약한 손으로만 하키 스틱을 잡고 빈 공간으로 조깅하며 이동한다. 2) '멈춰(freeze)' 신호가 나오면 무릎을 굽히고 스틱 아래쪽을 잡아 낮은 자세를 취한다. 3) '슛(shoot)' 신호가 나오면 스틱을 휘둘러 슛 동작을 하고 즉시 다시 빈 공간으로 조깅한다.</p>
