<h1>블라인드 가림막 배구 경기</h1>
<p>1) 배구 네트 위에 침대 시트나 가림막 타프를 걸어 상대 코트 내부가 전혀 보이지 않도록 준비합니다. 2) 학급을 두 팀으로 나누어 시트 너머 상대 진영의 위치와 움직임을 모르는 상태로 배구 경기를 진행합니다. 3) 공이 가림막을 넘어오는 즉시 반응하여 리시브하고 3회 이내에 상대편 코트로 공을 넘겨 득점합니다. 4) 난이도에 따라 배구공 대신 가벼운 비치볼이나 큰 짐볼을 사용하거나 원바운드를 허용해 진행할 수 있습니다.</p>
