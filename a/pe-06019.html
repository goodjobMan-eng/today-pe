<h1>원마커 네비게이션 게임</h1>
<p>1) 원마커 20개(5x4)를 바닥에 배치하고 정해진 경로(가로, 세로, 대각선 이동 가능, 총 8단계)를 교사가 미리 설정한다.2) 모둠의 첫 주자가 출발하여 원마커를 하나씩 밟으며 올바른 길을 탐색한다.3) 맞으면 '딩동댕', 틀리면 '땡' 신호를 받으며, 틀릴 경우 즉시 돌아오고 다음 주자가 경로를 기억하여 이어 도전한다.</p>
