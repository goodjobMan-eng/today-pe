<h1>축구 드리블(인사이드, 아웃사이드)과 골 넣기 시합</h1>
<p>1) 출발선에서 발 안쪽(인사이드)으로 공을 살짝 밀고 따라가 발바닥으로 잡으며 콘 사이를 드리블한다.2) 발 바깥쪽(아웃사이드)으로 공을 밀고 디딤발을 넘겨가며 드리블한 후 발바닥으로 멈춘다.3) 홀수 개의 축구공을 준비하고 모둠별로 1대1 드리블 시합을 진행한다.4) 콘 사이를 통과하여 드리블해 간 후 골대에 슛을 성공시키고 돌아온다.5) 더 많은 골을 성공시킨 팀이 승리한다.</p>
