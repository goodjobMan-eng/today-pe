<h1>수건 뒤집기 게임</h1>
<p>1) 접은 큰 수건을 앞에 두고 각자 수건 바로 뒤에서 시작한다. 2) 양말공을 언더암으로 던져 수건 한가운데에 올린다. 3) 성공하면 앞으로 가서 수건을 한 번 뒤집어 앞으로 이동시킨다. 4) 계속 던지고 수건을 뒤집으며 정원이나 실내 끝까지 누가 더 빨리 나아가는지 경주한다.</p>
