<h1>공 차고 달리기</h1>
<p>1) 6명이 한 모둠을 이루어 두 모둠이 공격과 수비로 나뉜다. 2) 공격수가 발로 공을 찬 후 한 줄로 서 있는 공격 모둠원들의 주위를 돌아 공격 홈으로 달린다. 3) 수비 모둠은 찬 공을 발로 멈춘 수비수 뒤로 한 줄로 서서 머리 위로 공을 전달하고 마지막 모둠원이 공을 들고 수비 홈으로 달린다. 4) 수비수보다 공격수가 먼저 홈에 들어오면 1점을 얻으며 모든 모둠원의 공격 후 역할을 바꾸어 많은 점수를 얻은 팀이 이긴다.</p>
