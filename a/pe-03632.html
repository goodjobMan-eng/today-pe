<h1>플라잉디스크 발로 잡기 놀이</h1>
<p>1) 신체 부위 구호(1번 머리, 2번 어깨, 3번 허리, 4번 엉덩이, 5번 무릎)에 맞춰 손을 얹는다. 2) '잡아' 신호가 나오면 다리로 빨리 가서 원반을 발로 끌어온다. 3) 잡지 못한 친구도 자기 자리로 돌아가고, 원반을 다시 가운데로 놓을 때도 발로 가져다 놓는다.</p>
