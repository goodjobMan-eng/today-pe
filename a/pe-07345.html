<h1>벤치 아래로 공 통과시키기 게임</h1>
<p>1) 뜀틀 위에 올려진 세 개의 벤치 아래로 공을 통과시켜 상대 구역으로 보내는 경기이다. 2) 파랑 팀과 노랑 팀은 각각 자신의 구역에서 손바닥만을 이용해 공을 멈추고 몰고 쳐낸다. 3) 상대 진영 뒤편의 색깔 콘으로 표시된 골대 사이로 공을 통과시키면 1점을 획득한다. 4) 여러 개의 공을 동시에 사용하며 각자 득점 수를 세어 승부를 겨룬다.</p>
