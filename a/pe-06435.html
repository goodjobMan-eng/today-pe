<h1>플라잉디스크 골프 릴레이</h1>
<p>1) 모둠별로 출발선 뒤에 일렬로 선 뒤 첫 번째 주자가 디스크를 집어 든다.2) 출발선 뒤에서 지정된 표적 골대를 향해 디스크를 던져 넣는다.3) 디스크가 골대에 들어가면 그대로 두고 뒤로 가고, 빗나가면 공중에 날아오는 디스크를 주의하며 직접 주워와 다음 주자에게 넘긴다.</p>
