<h1>파트너 태그 놀이</h1>
<p>1) 짝을 정해 가위바위보를 하고 진 사람이 술래가 된다. 2) 신호에 맞춰 지정된 이동 방식(걷기, 스키핑, 조깅, 달리기)과 운동을 수행하며, 이때 상대는 10초 동안 도망간다. 3) 술래는 오직 자신의 파트너만 쫓아가 태그할 수 있다. 4) 파트너를 태그하면 도망가던 파트너가 과제 운동을 수행하고, 술래였던 사람은 도망가며 역할을 바꾼다.</p>
