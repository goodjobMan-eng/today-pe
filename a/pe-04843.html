<h1>더블피구</h1>
<p>1) 남학생용 공과 여학생용 공을 서로 다른 색으로 1개씩 준비하고 2팀으로 나눈다.2) 남학생은 남학생용 공으로 남학생만, 여학생은 여학생용 공으로 여학생만 아웃시킬 수 있다.3) 상대 성별의 공에 맞으면 아웃되지 않고 다른 성별에게 공을 패스한다.4) 상대 팀의 한쪽 성별이 전원 아웃되면 자신의 공으로 다른 성별도 아웃시킬 수 있다.5) 던질 성별이 없으면 외야로 패스하며 상대 팀 전원을 먼저 아웃시키면 승리한다.</p>
