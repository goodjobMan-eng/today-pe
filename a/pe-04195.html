<h1>벽 튕기기 피구</h1>
<p>1) 팀 없이 전원이 체육관 전체에 자유롭게 흩어진다. 2) 상대에게 공을 던지기 전에 반드시 공을 벽에 먼저 맞힌 뒤 튕겨 나온 공을 직접 잡아야 한다. 3) 공에 맞은 사람은 그 자리에 앉는다. 4) 자신을 맞힌 상대가 다른 사람에게 맞아 탈락하여 앉으면 즉시 일어나 게임에 복귀한다.</p>
