<h1>휘트니스 메모리 게임</h1>
<p>1) 한쪽에는 숫자 빈백 10개, 다른 한쪽에는 운동 지시 빈백 10개를 바닥에 뒤집어 놓는다.2) 주자가 달려가 양쪽에서 각각 빈백 하나씩 총 두 개를 동시에 뒤집어 확인하고 팀원들에게 보여준다.3) 같은 짝을 맞추면 해당 빈백을 가져와 지시된 운동을 적힌 숫자 횟수만큼 팀 전체가 실시한다.4) 정해진 쌍을 먼저 모두 찾아 운동을 완료한 팀이 승리한다.</p>
