<h1>고양이와 쥐 놀이 (팀 바꾸기 술래잡기)</h1>
<p>1) 중앙선을 사이에 두고 두 팀(고양이 팀과 쥐 팀)으로 나뉘어 마주 보고 섭니다. 2) 리더가 '쥐!'를 외치면 쥐 팀이 고양이 팀을 쫓아가고 고양이 팀은 뒤쪽 안전선까지 도망치며, '고양이!'를 외치면 반대로 고양이 팀이 쥐 팀을 쫓아갑니다. 3) 뒤쪽 선에 닿기 전에 태그당한 사람은 상대 팀으로 이동합니다. 4) 반복 후 최종 인원이 더 많은 팀이 승리합니다.</p>
