<h1>신문지 막대 균형 및 짝 연결 표현놀이</h1>
<p>1) 신문지를 단단하게 말아 테이프를 붙이고 양 끝을 잘라 신문지 막대를 제작한다. 2) 막대를 손바닥, 손가락, 손등, 이마 등에 얹어 중심을 잡는 균형잡기 활동을 연습한다. 3) 막대를 위로 던져 잡거나 손을 뗐다가 떨어지기 전에 아래쪽을 낚아채는 감각 놀이를 한다. 4) 두 사람이 마주 보고 서서 검지 끝 사이에 막대를 맞대어 떨어뜨리지 않고 앞뒤 이동, 회전, 상하 움직임을 협동하여 표현한다.</p>
