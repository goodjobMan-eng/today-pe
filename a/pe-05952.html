<h1>썰어, 섞어, 튀어</h1>
<p>1) 교사가 '썰어'를 외치면 둘씩 짝지어 서 있던 사람 중 짝이 없는 술래가 둘 사이의 손을 자르며 끼어들고 밀려난 사람이 다른 짝을 찾는다.2) 교사가 조건(예: 3명, 시계 찬 사람 등)과 함께 '섞어'를 외치면 참가자들은 조건에 맞는 새로운 모둠을 만들어 선다.3) 교사가 '튀어'를 외치면 가장 가까운 벽으로 뛰어가 벽을 터치한 뒤 돌아와 짝과 손을 마주 대고 선다.</p>
