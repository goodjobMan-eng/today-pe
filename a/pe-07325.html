<h1>라 텍 (야구형 타격 베이스 달리기 게임)</h1>
<p>1) 타격 팀과 수비 팀으로 나뉘며, 타자는 순서대로 야구 배트나 테니스 라켓으로 테니스공을 멀리 친다. 2) 타자는 공이 경기장에 들어간 사이 콘으로 표시된 베이스들을 돌아 홈 라인을 통과해 1점을 얻는다. 3) 수비 팀은 공을 주워 지정된 위치의 주장에게 빠르게 패스한다. 4) 주자가 베이스 사이에 있을 때 주장이 공을 발밑에 받거나 수비수가 뜬공을 바로 잡으면 타자는 아웃된다.</p>
