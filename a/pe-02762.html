<h1>빈 공간을 찾아라 패스 게임</h1>
<p>1) 베이스를 4개 설치하고 1루 고정 수비수와 움직이는 수비수를 정한다. 2) 공을 던진 사람은 곧바로 빈 베이스 공간으로 뛰어간다. 3) 공을 받는 사람은 공을 떨어뜨리지 않고 잡은 뒤 빈 공간으로 다시 패스한다. 4) 공을 떨어뜨리거나 엉뚱한 방향으로 던지면 아웃(벌칙)이 된다.</p>
