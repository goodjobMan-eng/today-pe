<h1>슈팅 탁구</h1>
<p>1) 탁구대 위에 종이컵, 페트병 등 다양한 목표물을 설치한다.2) 개인전은 한 명씩 서브를 10회 연속 실시하여 맞힌 목표물 수를 센다.3) 단체전은 팀원이 보낸 서브 공을 리시브하여 목표물을 10회 도전해 맞힌다.4) 정해진 기회 동안 더 많은 목표물을 맞힌 개인 또는 팀이 승리한다.</p>
