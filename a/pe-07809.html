<h1>로봇 술래잡기</h1>
<p>1) 나쁜 로봇(술래)은 폼볼을 손에 든 채 던지지 않고 이동하며 착한 로봇을 태그하러 다닌다. 2) 착한 로봇은 나쁜 로봇을 피해 도망치며, 중앙 훌라후프 안전 구역(충전소)에 들어가 최대 10초간 머물 수 있다. 3) 태그된 로봇은 콘 구역(수리소)으로 이동해 큰 소리로 30초를 센 후 다시 게임에 복귀한다.</p>
