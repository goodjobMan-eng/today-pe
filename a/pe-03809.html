<h1>하이 플랭크 워크아웃 챌린지</h1>
<p>1) 출발선 뒤에서 웅크려 앉아 손을 앞으로 짚으며 전진해 하이 플랭크 자세를 취한다. 2) 머리 너머에 놓인 접시에서 동전 1개를 집은 뒤, 손으로 기어 돌아와 의자 위 접시에 넣고 1점을 얻는다. 3) 난이도를 높이려면 플랭크 상태에서 푸시업 1회를 하여 가슴으로 양말공을 터치한 뒤 동전 3개를 집어 돌아와 3점을 얻는다. 4) 정해진 시간 동안 반복하여 모은 동전 점수를 합산한다.</p>
