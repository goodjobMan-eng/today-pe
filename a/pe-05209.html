<h1>긴줄넘기 테디베어 라임 놀이</h1>
<p>1) 두 사람이 양쪽에서 긴줄넘기를 잡고 돌린다.2) 뛰는 사람은 줄 안으로 들어가 'Teddy Bear' 노래 라임에 맞춰 뛴다.3) 가사에 맞춰 '돌기(turn around)', '바닥 짚기(touch the ground)' 등의 동작을 줄에 걸리지 않고 수행한다.4) 'Jump out of sight' 부분에 맞춰 줄 밖으로 빠져나온다.</p>
