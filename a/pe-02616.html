<h1>종이 딱지치기</h1>
<p>1) 두꺼운 종이를 반으로 접고 선을 따라 잘라 긴 종이 두 장을 만든다. 2) 종이 두 장을 십자가 모양으로 겹친 후 네 귀퉁이를 삼각형으로 접어 시계 반대 방향 순서로 접어 넣고 마지막은 안쪽 틈으로 집어넣어 딱지를 완성한다. 3) 네 손가락으로 딱지의 바깥쪽을 잡고 엄지로 한쪽을 잡은 뒤 허리를 펴고 무릎을 굽힌다. 4) 팔과 어깨의 힘을 사용하여 바닥에 놓인 상대 딱지의 가운데를 강하게 내리쳐 넘긴다.</p>
