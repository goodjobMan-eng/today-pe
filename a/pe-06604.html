<h1>스카프 훨훨 저글링</h1>
<p>1) 스카프 끝을 잡고 높이 던져 공중에 가장 오래 띄우는 사람이 이긴다. 2) 스카프를 던진 후 360도 또는 720도 회전하여 떨어지는 스카프를 잡는다. 3) 둘이서 동시에 스카프를 던진 후 서로 자리를 바꿔 상대방의 스카프를 잡는다. 4) 2인 1조가 한 방향을 보고 서서 앞사람이 던진 스카프를 뒷사람이 잡는 릴레이를 30초~1분간 진행한다.</p>
