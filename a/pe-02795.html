<h1>비닐봉지 협응성 운동</h1>
<p>1) 공기를 살짝 넣은 비닐봉지 2장을 한 손으로 바닥에 떨어뜨리지 않고 10회 이상 저글링한다. 2) 공기를 넣은 비닐봉지 3장을 양손을 번갈아 사용하며 10회 이상 저글링한다. 3) 공기를 넣은 비닐봉지 1장을 발을 바닥에 딛고 차는 방식으로 10회 이상 제기차기를 한다. 4) 비닐봉지를 양발로 번갈아 차거나, 발을 바닥에 딛지 않고 공중에서 연속으로 10회 이상 찬다.</p>
