<h1>고깔콘 빈백을 품다</h1>
<p>1) 각자 원마커를 밟고 선다.2) 빈백을 바닥에 슬라이드시키지 않고 살짝 던져서 세워진 고깔콘 안에 넣는다.3) 빈백이 고깔콘 안에 들어가면 해당 콘을 획득하여 제거한다.4) 6개의 고깔콘을 먼저 모두 제거하여 가져가는 사람이 승리한다.</p>
