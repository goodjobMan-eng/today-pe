<h1>철봉 다리빼기 돌기</h1>
<p>1) 철봉에 매달려 다리를 봉 아래로 넣고 뒤로 굴러 회전한다. 2) 숙달되면 다리가 철봉에 닿지 않도록 몸을 둥글게 말고 뒤로 회전한다. 3) 초보자는 지도자와 손을 잡고 회전 연습을 한다. 4) 회전 후 착지하여 팔을 벌려 마무리한다.</p>
