<h1>신문지 던지기 매트 발구르기 연습</h1>
<p>1) 신문지와 테이프로 제작한 발자국 매트(1번, 2번, 3번 화살표 표시)를 바닥에 놓는다. 2) 매트의 1번과 2번 표시에 양 발뒤꿈치를 맞추고 선다(우투수는 우측을 향해 위치). 3) 앞발(2번)을 들어 3번 화살표 방향으로 최대한 곧게 내딛는다. 4) 체중을 실어 디딘 후 던지는 팔을 휘두르며 투구 동작을 완료한다.</p>
