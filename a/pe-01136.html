<h1>주고받다가 삐빅! 공 술래잡기</h1>
<p>1) 2인 1조로 짝을 짓고 짝마다 폼볼 1개를 준비하여 마주 보고 선다. 2) 호각 '삑' 소리가 나면 짝과 일정한 거리를 두고 공을 부드럽게 던지고 받는다. 3) 교사가 호각을 '삐빅' 하고 두 번 불면 공을 들고 있던 학생이 술래가 되어 짝을 태그하러 쫓아간다. 4) 도망가던 짝이 공을 든 술래에게 터치당하면 즉시 멈춰 서서 다시 평화롭게 주고받기 모드로 복귀한다.</p>
