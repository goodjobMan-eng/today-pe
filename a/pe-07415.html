<h1>매 놀이 (레페르비에, L'Epervier)</h1>
<p>1) 콘으로 코트의 양 끝 출발선과 가운데 구역을 표시하고 가운데에 술래(매) 1명을 배치한다 2) 출발선에 대기하던 참가자들은 신호가 떨어지면 반대편 구역을 향해 달린다 3) 술래는 지나가는 참가자를 태그하려 하고, 태그된 참가자는 그 자리에 멈춰서 얼음 석상이 된다 4) 반대편에 무사히 도착한 사람은 다음 신호에 다시 건너가며, 끝까지 살아남거나 술래를 늘려가며 진행한다</p>
