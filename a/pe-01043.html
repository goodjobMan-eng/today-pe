<h1>스카프 꼬리잡기 놀이</h1>
<p>1) 각자 스카프를 바지 허리 뒤춤에 꼬리처럼 살짝 꽂아 넣고 정해진 구역에 흩어져 준비한다. 2) 신호가 울리면 자신의 꼬리를 지키면서 주변 친구들의 꼬리를 재빠르게 뽑아 챈다. 3) 꼬리를 뺏겨도 탈락 없이 계속 참여하며 제한 시간 동안 가장 많은 꼬리를 모은 학생이 승리한다. 4) 스카프를 양쪽에 2개씩 꽂거나 2인 1조 짝을 지어 도전하는 방식으로 변형할 수 있다.</p>
