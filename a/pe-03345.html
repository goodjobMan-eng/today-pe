<h1>주사위 체력 운동</h1>
<p>1) 모둠 또는 짝과 함께 주사위 체력 운동을 위한 6가지 운동 방법을 정하고 확인한다. 2) 친구와 번갈아 가며 주사위를 굴려 나온 숫자의 해당 운동을 한다. 3) 원하는 숫자가 나오지 않으면 순서를 넘길 수 있으며 6가지 운동을 모두 하도록 노력한다. 4) 활동지의 글자를 모두 완성하면 활동을 마친다.</p>
