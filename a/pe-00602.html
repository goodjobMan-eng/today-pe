<h1>수영 호흡법 기초 놀이 (버블링과 보빙)</h1>
<p>1) 욕조나 수조, 수영장에서 물속 호흡의 기초를 익히기 위해 물통과 수경 등을 준비합니다. 2) 버블링 단계에서는 물속에서 코와 입으로 공기 방울을 보글보글 내뿜으며 숨을 뱉습니다. 3) 보빙 단계에서는 물속에서 숨을 뱉고 수면 위로 올라오며 남은 숨을 순간적으로 뱉은 직후 공기를 크게 들이마십니다. 4) 익숙해지면 위아래로 반복하는 속도를 높여 연속 호흡 리듬을 익힙니다.</p>
