<h1>터치 없이 달리는 무궁화 꽃이 피었습니다</h1>
<p>1) 운동장에 출발선, 술래 위치, 술래 뒤쪽의 결승 통과선을 라인으로 긋고 술래 1명을 정한다. 2) 술래가 구호를 외칠 때 참가자들은 전진하고, 뒤돌아볼 때 멈추되 움직이면 원래 출발선으로 돌아간다. 3) 참가자 중 한 명이 술래 뒤쪽의 선을 밟아 끊는 순간 모든 참가자는 출발선을 향해 전력으로 도망친다. 4) 선을 끊은 참가자는 안전 구역으로 인정되어 살아남고, 가장 늦게 도망친 사람이 다음 술래가 된다.</p>
