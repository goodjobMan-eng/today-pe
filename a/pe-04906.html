<h1>등 맞대고 철봉 턱걸이 회전(역상승) 연습</h1>
<p>1) 철봉을 잡은 사람과 보조자가 등을 맞대고 선다.2) 보조자가 고개를 숙이고 몸을 웅크린 채 뒤로 물러서며 위로 밀어준다.3) 수행자는 보조자 등에 올라타듯 양다리를 들어 올려 허벅지를 철봉에 걸치고 회전한다.</p>
