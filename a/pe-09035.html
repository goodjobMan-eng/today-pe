<h1>지진 놀이 (터전 게임)</h1>
<p>1) 바닥에 원을 그리고 왕, 녀왕(공주), 브루가 등의 그림(픽토그램)을 표시한다. 2) 참가자들은 각자 원(픽토그램) 위에 서서 자기 발 밑의 그림을 기억한다. 3) 사회자가 특정 픽토그램 종이를 들고 외치면, 해당 그림 위에 있던 사람들은 다른 비어있는 원으로 빠르게 이동해 자리를 잡는다. 4) 지진(Terremoto)이 외쳐지면 모든 참가자가 자리를 이탈하여 새로운 빈 원을 찾아 이동한다.</p>
