<h1>메디신볼 스포츠 트레이닝</h1>
<p>1) 메디신볼을 들고 5가지 운동을 각 2회씩 수행한다. 2) 아이소메트릭 홀드(20초), 컬 투 프레스, 고블렛 스쿼트(10회), 런닝 홀드(20초), 스트레이트 레그 홀드(15초) 순서로 진행한다. 3) 운동 중에는 호흡을 유지한다. 4) 메디신볼이 없으면 책이나 가방을 활용할 수 있다.</p>
