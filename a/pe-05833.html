<h1>핸드볼 기초 패스 점수 게임</h1>
<p>1) 3대 3 또는 2대 2로 팀을 나눈다.2) 팀원끼리 성공적으로 패스를 주고받으면 1점을 얻는다.3) 수비팀이 상대 팀 공을 가로채면 1점을 얻는다.4) 콘으로 표시된 구역 안에서 경기하며 상대 몸을 치거나 접촉할 수 없다.</p>
