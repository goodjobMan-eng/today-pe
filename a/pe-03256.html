<h1>생활용품 활용 팔 운동 및 계단 오르기</h1>
<p>1) 힘에 맞는 물병을 양손에 들고 바르게 선다. 2) 팔꿈치를 몸통에 붙이고 팔을 굽혀 물병을 들어 올린 후 내려 처음 자세로 돌아온다. 3) 물병을 머리 위로 들어 올리며 팔을 뻗은 후 팔꿈치와 어깨를 유지하며 내린다. 4) 계단을 한 계단씩 오르거나 여러 계단 오르기, 오르내리기를 반복한다.</p>
