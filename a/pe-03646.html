<h1>바나나 술래잡기</h1>
<p>1) 술래는 스펀지봉을 들고 도망치는 친구들을 쫓아다니며 터치한다. 2) 술래에게 터치당하면 경기장 밖으로 나가 심판을 보며 대기한다. 3) 잡힐 것 같으면 두 손을 머리 위로 모아 바나나를 외쳐 멈추고, 다른 친구 한 명이 쳐주면 한 손을 내린다. 4) 또 다른 친구가 한 번 더 쳐주면 온전히 살아나 다시 달릴 수 있으며, 5분 동안 술래가 모두 잡으면 승리한다.</p>
