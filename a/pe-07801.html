<h1>4 구역 플라잉디스크 (Cuatro Zonas Frisbee)</h1>
<p>1) 경기장 네 구석에 4개 팀의 구역을 만들고, 각 팀은 자기 구역을 수비하며 동시에 3개의 디스크로 경기를 시작합니다. 2) 디스크를 패스하여 상대 팀 구역 안으로 침투한 팀원에게 정확히 전달하면 1점을 얻습니다. 3) 디스크를 든 채 달릴 수 없으며, 상대 손에 있는 디스크를 직접 빼앗을 수 없습니다.</p>
