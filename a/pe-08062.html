<h1>교실 체육 4가지 게임</h1>
<p>1) 물병 뒤집기: 1번 구역에서 물병을 세우면 다음 구역으로 이동해 6번까지 먼저 도달한다. 2) 판지 균형 잡기: 짝과 줄을 잡고 판지를 기울여 공을 가운데 구멍과 상자에 넣는다. 3) 붐 클랩 스내치: 바닥 치기(붐), 박수(클랩) 구령 후 스내치에 물건을 낚아채며, 펄스 게임: 동전 앞면 시 손을 쥐어 전달해 끝 선수가 물건을 잡는다.</p>
