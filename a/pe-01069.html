<h1>몸 따로 마음 따로 점핑 체조</h1>
<p>1) 학생들은 교사를 마주 보고 간격을 넓혀 선다. 2) 제자리에서 구령에 맞춰 팔을 어깨, 머리 위 박수, 허리, 가슴 순으로 교차해 움직인다. 3) 동작이 익숙해지면 가벼운 점프를 뛰며 손동작을 일치시키거나 좌우 번갈아 뛰기로 난도를 높인다. 4) 전후 점프를 뛰며 상체 박자를 반대로 엇갈려 수행하는 도전 과제로 변형한다.</p>
