<h1>하키형 게임의 기본 기능 익히기</h1>
<p>1) 드리블: 플로어볼 채를 허리 높이 이하로 유지하며 채를 사용해 공을 몬다. 2) 패스: 플로어볼 채를 사용해 동료에게 공을 이어준다. 3) 캐치: 플로어볼 채를 사용해 자신에게 오는 공을 받는다. 4) 슛: 플로어볼 채를 사용해 상대 골대에 공을 넣는다.</p>
