<h1>반창고 술래</h1>
<p>1) 정해진 구역 안에서 술래 1명을 정하고 게임을 시작한다.2) 술래에게 태그된 사람은 태그당한 부위에 한 손을 반창고처럼 얹고 함께 술래가 된다.3) 술래가 2명, 4명으로 점점 늘어나며 마지막 생존자가 남을 때까지 도망친다.4) 도망치다 구역 밖으로 나가면 자동으로 술래가 된다.</p>
