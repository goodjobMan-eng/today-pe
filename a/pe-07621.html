<h1>핀볼 (Pinball)</h1>
<p>1) 경기장 중앙에 볼링핀을 세우고, 골키퍼는 노란 조끼를 입고 핀 주변을 둘러서서 수비한다. 2) 투수는 초록 조끼를 입고 폼볼을 공중으로 던지고, 굴리는 선수는 반대편에서 바닥으로 굴려 중앙의 핀을 쓰러뜨린다. 3) 3분 동안 쓰러뜨린 핀의 개수로 점수를 매기며, 정해진 시간이 지나면 역할을 교대한다.</p>
