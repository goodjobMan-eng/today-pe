<h1>천대중소 (포스퀘어 땅따먹기)</h1>
<p>1) 바닥에 '밭 전(田)' 자 형태의 4분할 코트를 그리고 각 구역을 서열 순으로 '천·대·중·소'로 지정합니다. 2) 4명의 선수가 각자 칸에 서서 손으로 공을 바닥에 튕겨 상대 구역으로 쳐넘기며 랠리를 이어갑니다. 3) 랠리에서 실수를 범하면 낮은 서열의 구역으로 강등되어 자리를 바꿉니다. 4) 가장 낮은 '소' 구역의 참가자가 실수를 하면 밖에서 대기하던 대기자와 교대합니다.</p>
