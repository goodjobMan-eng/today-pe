<h1>긴 줄 연속 8자 마주 건너기 게임</h1>
<p>1) 두 명이 긴 줄의 양 끝을 잡고 돌린다. 2) 타이머를 2분으로 설정하고 신호가 울리면 모둠원이 1명씩 차례대로 줄 안으로 들어간다. 3) 줄을 넘고 빠져나가기 직전에 뒷사람이 연속으로 들어가 줄을 넘고 빠져나온다. 4) 줄을 돌리는 사람을 기준으로 8자를 그리며 2분 동안 줄에 걸리지 않고 가장 많이 넘은 모둠이 이긴다.</p>
