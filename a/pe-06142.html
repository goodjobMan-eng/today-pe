<h1>플라잉디스크 영역형 게임</h1>
<p>1) 두 모둠으로 나누어 가위바위보로 공격과 수비를 정하고 공격 모둠은 안전 지역에서 디스크를 이어주며 시작한다.2) 디스크를 잡은 사람은 한쪽 발만 움직일 수 있고 들고 달릴 수 없다.3) 디스크를 던져 상대 골대에 맞히면 1점, 들어가면 2점을 얻으며 패스 실패나 가로채기 시 공수가 바뀐다.</p>
