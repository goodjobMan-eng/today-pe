<h1>플래시 카드 피트니스 덧셈 놀이</h1>
<p>1) 화면에 간단한 덧셈 문제가 나오면 10초의 제한 시간 동안 머릿속으로 답을 계산합니다. 2) 각 정답 보기 옆에는 서로 다른 신체 활동(스트레칭, 점핑잭, 달리기 등) 캐릭터 동작이 표시되어 있습니다. 3) 자신이 계산한 답에 해당하는 운동 동작을 카운트다운 동안 따라 하며 몸을 움직입니다. 4) 시간이 끝나면 화면에 정답과 체크 표시가 나타나 정답 여부를 확인하고 다음 문제로 넘어갑니다.</p>
