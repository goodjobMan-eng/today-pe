<h1>운동신경 테스트 7종 챌린지</h1>
<p>1) 매트 위에서 삼점도립을 한 뒤 다리 반동을 이용해 손으로만 버티는 물구나무서기로 올라간다. 2) 한 손은 주먹 쥐고 위아래로 두드리고, 다른 손은 펴서 앞뒤로 문지르며 손을 번갈아 바꾼다. 3) 바닥에 앉아 다리를 들고 바닥을 밀어 엉덩이로 회전하며, 1번 밀어 2바퀴 이상 회전을 목표로 한다. 4) 공을 위로 던진 뒤 머리, 어깨, 배, 무릎 등 신체 부위를 차례대로 터치하고 다시 받는다.</p>
