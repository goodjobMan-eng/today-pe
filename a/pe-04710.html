<h1>색깔 맞추기 빈백 정리 놀이</h1>
<p>1) 체육관 바닥 곳곳에 여러 색상의 훌라후프와 콩주머니(빈백)를 흩어 놓는다. 2) 학생들은 바닥에서 한 번에 콩주머니 1개를 주워 같은 색상의 훌라후프를 찾아 넣는다. 3) 훌라후프 안에 들어간 콩주머니는 다시 만질 수 없으며, 모든 콩주머니가 정리될 때까지 반복한다. 4) 교사의 안내에 따라 깽깽이발(hop), 사이드스텝(slide), 이동 속도(느리게/보통)를 바꾸어 변형한다.</p>
