<h1>치킨 타코 태그</h1>
<p>1) 술래는 펀스틱(누들)과 원마커 사이에 고무 치킨을 끼워 타코 모양으로 쥐고 시작한다. 2) 술래는 도망치는 다른 참가자들을 쫓아가 펀스틱과 치킨 타코로 태그를 시도한다. 3) 술래에게 태그를 당한 참가자는 치킨 타코와 펀스틱을 넘겨받아 새로운 술래가 된다. 4) 방금 자신을 태그한 이전 술래는 바로 다시 태그할 수 없으며 다른 사람을 쫓아야 한다.</p>
