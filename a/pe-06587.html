<h1>블라인드 셔틀콕 리시브 챌린지</h1>
<p>1) 네트 중앙에 돗자리나 가림막을 쳐서 상대방의 움직임이 보이지 않도록 시야를 차단한다. 2) 2인 1조로 한 명은 코트 중앙에서 수비 자세를 취하고, 공격자는 반대편에서 셔틀콕을 다양한 위치로 10번 떨어뜨린다. 3) 수비자는 떨어지는 셔틀콕을 파악해 스텝을 밟아 5번 이상 받아내면 성공한다.</p>
