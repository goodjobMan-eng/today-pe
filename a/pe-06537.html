<h1>자이브 리듬 묵찌빠 게임</h1>
<p>1) 파트너와 마주 서서 주먹과 보자기 모양으로 손을 맞댄다. 2) 자이브 음악이 나오는 동안 구령에 맞춰 주먹과 보자기를 계속 바꾼다. 3) 스톱 구령이 나오면 멈추고 그 순간 보자기 모양으로 끝난 사람이 승리한다. 4) 주먹을 낸 사람은 엎드리고 승리한 사람은 가볍게 등을 두드린다.</p>
