<h1>초등 기초 피클볼 랠리 (더블 바운스 챌린지)</h1>
<p>1) 네트를 사이에 두고 코트 양쪽에 2명씩(복식) 라켓을 쥐고 기본 수비 위치에 선다. 2) 서버는 허리 아래 높이에서 언더핸드로 공을 쳐서 상대 코트 대각선 방향으로 서브를 넣는다. 3) 서브된 공과 리턴된 공은 양측 코트에서 각각 1회씩 반드시 바운드된 후 타구해야 한다(더블 바운스 룰). 4) 이후 노바운드 발리 또는 원바운드 랠리를 이어가며 규칙 위반 시 서브권 팀이 득점한다.</p>
