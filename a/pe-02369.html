<h1>주먹 야구형 게임</h1>
<p>1) 타자가 직접 공을 띄우고 주먹으로 쳐서 수비 구역으로 보낸 뒤 주루한다. 2) 공이 땅에 닿기 전에 수비가 바로 잡으면 타자는 아웃된다. 3) 수비 모둠원이 던진 공이 주자보다 먼저 루에 도착하면 주자는 아웃된다. 4) 세 명의 공격 모둠원이 아웃되면 공수를 교대한다.</p>
