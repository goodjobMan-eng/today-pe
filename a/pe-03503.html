<h1>간이 축구</h1>
<p>1) 7명이 한 모둠을 이루어 두 모둠이 게임을 준비한다. 2) 각 모둠별로 1명씩 골키퍼를 정한다. 3) 공을 드리블하거나 패스하며 상대 모둠 영역으로 이동해 골대에 공을 넣으면 1점을 획득한다. 4) 공을 빼앗기거나 공이 게임장 밖으로 나가면 상대 모둠으로 공격권이 넘어간다.</p>
