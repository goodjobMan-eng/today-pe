<h1>신호등 농구 드리블 놀이</h1>
<p>1) 콘 4개를 이용해 출발선과 반대편 도착선을 표시하고 모든 학생에게 농구공을 1개씩 배부한다. 2) 교사가 중간에서 &quot;초록불(Green)&quot;을 외치면 학생들은 도착선을 향해 빠르게 드리블하며 전진한다. 3) 교사가 &quot;빨간불(Red)&quot;을 외치면 모든 학생은 즉시 드리블과 전진을 멈춰야 한다. 4) 빨간불 이후에도 드리블하거나 움직인 학생은 뒤로 2걸음 물러나며, 가장 먼저 도착선을 통과한 학생이 승리한다.</p>
