<h1>해파리 게임</h1>
<p>1) 학생들을 두 팀으로 나누고 각 팀에서 술래 1명씩을 뽑아 술래는 교실 앞, 나머지는 교실 뒤에 선다. 2) 교사의 신호에 맞춰 모든 학생이 한 걸음씩 이동하며, 술래는 가까워진 상대 팀 학생을 터치해 해파리로 만든다. 3) 터치당한 해파리는 제자리에서 한 팔을 흔들며 멈춰 서서 근처의 상대 팀을 터치하고, 상대 팀을 모두 해파리로 먼저 만든 팀이 승리한다.</p>
