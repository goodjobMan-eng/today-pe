<h1>매트 운동 물구비 건너기 (카와와타리)</h1>
<p>1) 뜀틀 받침대나 매트 위에 두 손을 어깨너비로 짚고 팔꿈치를 곧게 편다. 2) 시선은 뒤가 아닌 앞쪽을 바라본 상태에서 두 발을 점프하여 반대쪽으로 건너뛴다. 3) 숙달되면 허리를 높게 띄워 공중에 머무는 시간을 점차 늘려가며 매트 위에서도 실시한다.</p>
