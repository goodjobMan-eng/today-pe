<h1>머리 위 콩 주머니</h1>
<p>1) 콩주머니의 넓은 면을 머리 위에 올리고 교실 안을 걸어 다닌다. 2) 머리 위의 콩주머니가 떨어지지 않도록 유지하며 몇 번 떨어졌는지 횟수를 센다. 3) 신호에 맞춰 손을 대지 않고 5초 안에 가장 가까운 아무 의자에나 앉는다. 4) 의자에서 다시 일어나 시계 방향 또는 반대 방향으로 속도를 조절하며 돌다가 신호에 맞춰 빈 의자에 앉는다.</p>
