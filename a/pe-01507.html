<h1>손가락 조종 마임과 동작 따라하기</h1>
<p>1) 두 명씩 짝을 짓고 서로 2m 거리를 유지하며 마주 선다. 2) 조종자가 두 손가락을 움직이면 상대방은 손가락 끝의 방향에 맞춰 온몸을 크게 움직인다. 3) 손끝, 발끝, 얼굴 표정까지 상대방의 리드에 맞춰 유연하게 표현하면 성공으로 인정한다. 4) 역할을 바꾸어 상대방의 동작을 거울처럼 따라 하거나 속도와 크기를 다르게 변형하여 표현한다.</p>
