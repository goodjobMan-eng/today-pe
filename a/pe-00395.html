<h1>풍선통통! 놀이</h1>
<p>1) 두 명 이상의 참가자가 바닥에 마주 보고 앉아 양손을 맞잡습니다. 2) 맞잡은 손을 놓지 않은 채 손이나 발, 머리 등을 활용해 풍선을 공중에 띄웁니다. 3) 엉덩이를 바닥에서 떼거나 맞잡은 손이 떨어지면 반칙이 됩니다. 4) 정해진 목표 횟수(예: 10회, 20회)를 달성하거나 정해진 시간 동안 떨어뜨리지 않고 유지합니다.</p>
