<h1>뜀틀 머리대고넘기(헤드스프링) 벽면 연습법</h1>
<p>1) 벽면 앞에 안전 매트와 받침대를 설치하고 벽을 마주보고 섭니다. 2) 받침대에 양손과 머리를 삼각 지지 형태로 대고 벽을 향해 도움닫기 발구르기를 합니다. 3) 엉덩이가 머리 위치를 넘어가 벽에 닿는 순간을 포착하며 타이밍을 익히고, 닿으면 두 다리를 천장 쪽으로 강하게 뻗어 올려 물구나무서기 자세를 만듭니다. 4) 몸을 활처럼 젖히는 반동의 타이밍을 벽면 지지를 통해 반복해서 익힙니다.</p>
