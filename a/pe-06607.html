<h1>축구 부상 예방을 위한 정적 및 동적 스트레칭</h1>
<p>1) 정적 스트레칭으로 런지 자세 발목 누르기, 무릎 꿇고 앞다리 뻗어 햄스트링 늘리기, 무릎 밀어내며 고관절 풀기, 대퇴사두근 늘리기, 다리 옆으로 뻗어 내전근 늘리기를 각 20~30초씩 양발 번갈아 실시한다. 2) 동적 스트레칭으로 만세 런지 후 상체 돌리기, 무릎 펴고 팔꿈치 바닥 내린 뒤 상체 회전하기, 한 발로 서서 다리 앞뒤·좌우 흔들기, 무릎 직각 회전하기, 제자리에서 무릎 높여 뛰기를 실시한다.</p>
