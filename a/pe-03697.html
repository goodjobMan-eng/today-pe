<h1>얼굴 가위바위보 다리벌리기 놀이</h1>
<p>1) 얼굴의 표정이나 움직임으로 가위, 바위, 보 동작을 정한다. 2) 2명이 마주 보고 서서 얼굴로 가위바위보를 한다. 3) 가위바위보에서 진 사람은 양발을 좌우로 벌린다(왼발과 오른발을 발 너비만큼 조금씩 벌린다). 4) 가위바위보를 계속하며 서 있지 못하고 쓰러지면 진다.</p>
