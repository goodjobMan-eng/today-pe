<h1>퍼펙트 패스 게임 (Pase Perfecto)</h1>
<p>1) 콘 뒤에 팀별로 줄을 서고, 각 팀 첫 번째 주자는 앞에 놓인 훌라후프 안으로 들어갑니다. 2) 줄에 서 있는 다음 주자가 훌라후프 안에 있는 주자에게 공을 패스합니다. 3) 훌라후프 안의 주자가 후프 밖으로 나가지 않고 공을 잘 받으면 해당 훌라후프를 획득하여 팀으로 가져옵니다. 4) 패스를 놓치면 후프에 있던 주자가 공을 챙겨 팀 줄 뒤로 돌아가고 다음 차례가 계속 이어집니다.</p>
