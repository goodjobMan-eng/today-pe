<h1>피자 나르기</h1>
<p>1) 모둠별로 출발선에 서고 코스에 라바콘과 접시콘으로 3단계 라인을 표시한다.2) 1번 주자가 접시콘 3개를 들고 첫 번째 라인으로 달려가 접시콘 1개를 놓고 출발점으로 돌아온다.3) 두 번째와 세 번째 라인까지 차례로 달려가 접시콘을 하나씩 놓고 돌아와 다음 주자와 손 터치를 한다.4) 2번 주자는 빈손으로 달려가 각 라인에 놓인 접시콘을 차례대로 회수해 돌아온다.</p>
