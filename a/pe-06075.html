<h1>나는야 명사수 (플라잉디스크 표적 맞히기 게임)</h1>
<p>1) 각 팀은 출발선에 서서 전방에 세워진 3개의 볼링핀 표적을 향해 플라잉디스크를 1명씩 던진다.2) 디스크를 던져 표적을 맞히지 못하면 던진 학생이나 팀원 전체가 지정된 지점을 4회 왕복 달리기한 뒤 돌아온다.3) 표적을 맞히면 디스크를 회수하여 다음 주자에게 넘겨주며 차례대로 던진다.4) 3개의 볼링핀 표적을 모두 먼저 쓰러뜨리는 팀이 승리한다.</p>
