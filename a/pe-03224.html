<h1>간이 농구 게임</h1>
<p>1) 5명씩 두 모둠으로 나누어 농구 경기장에서 경기를 준비한다. 2) 공을 가진 모둠은 공을 몰거나 패스하며 상대 모둠 지역으로 이동하고, 상대 모둠이 공을 빼앗으면 공격과 수비가 바뀐다. 3) 반원 영역 안에서 골을 넣으면 1점, 반원 영역 밖에서 골을 넣으면 2점을 얻는다. 4) 정해진 시간 동안 더 많은 점수를 얻은 모둠이 이긴다.</p>
