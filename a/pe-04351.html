<h1>겨울 속으로 탈출 런</h1>
<p>1) 1단계에서는 늑대를 피하고 해를 숙여 피하며 과자 케이크와 빙판을 뛰어넘어 코를 찾는다. 2) 2단계에서는 스벤과 경쟁하며 얼음을 펀치로 깨고 불타는 브루니를 뛰어넘으며 당근을 모은다. 3) 3단계에서는 얼음 발사 동작으로 불을 끄고 사만다의 바람 돌풍을 돌아 피한다. 4) 눈 괴물 마시멜로가 나타나면 동작을 멈추고 멈춰 서며 스벤을 타고 탈출한다.</p>
