<h1>론다트(측방통과회전) 지도 방법</h1>
<p>1) 스킵하면서 한쪽 무릎을 높이 들어 올리는 홉 동작을 연습한다. 2) 매트 위에서 손을 짚고 두 발을 모아 뛰는 론다트 동작을 수행한다. 3) 착지 후 정면을 향해 두 손을 들고 바르게 선다.</p>
