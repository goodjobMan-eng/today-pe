<h1>한 걸음 술래잡기</h1>
<p>1) 술래는 펀스틱을 들고 영역 가운데 서고 학생들은 주변에 위치한다. 2) 술래가 '한 걸음'이라고 외치면 모든 학생은 술래를 피해 딱 한 걸음만 이동한다. 3) 술래도 한 걸음 이동하며 반경 내에 있는 학생을 펀스틱으로 터치한다. 4) 터치당한 학생은 영역 밖으로 나가 점핑잭 5회 또는 스쿼트 5회 벌칙을 수행한 후 재참여한다.</p>
