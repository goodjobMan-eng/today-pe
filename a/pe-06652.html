<h1>교실 플로어 컬링 리그전</h1>
<p>1) 표적판과 출발선을 설치하고 출발선 앞 일정 거리에 호그 라인을 표시한다. 2) 양 팀은 번갈아 가며 마룻바닥 결을 따라 베어링 스톤을 표적판을 향해 굴린다. 3) 호그 라인을 넘지 못한 스톤은 경기 구역에서 제거한다. 4) 모든 스톤을 투구한 후 표적판 정중앙에 상대 팀보다 더 가깝게 위치한 스톤의 개수만큼 득점한다. 5) 정해진 엔드 동안 경기를 진행하여 누적 점수가 높은 팀이 승리한다.</p>
