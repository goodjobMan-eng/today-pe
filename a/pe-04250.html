<h1>시그널 점프&amp;런</h1>
<p>1) 운동장에 훌라후프, 라바콘, 스틱 등 시그널을 설치한다. 2) 시그널마다 정해진 동작(점프, 대시 등)을 수행한다. 3) 동작을 정확하게 수행하며 빠르게 골인 지점까지 이동한다. 4) 동작을 틀리면 해당 시그널의 처음부터 다시 시작한다.</p>
