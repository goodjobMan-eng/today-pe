<h1>프레리도그 픽오프 (Prairie Dog Pickoff)</h1>
<p>1) 각자 후프(둥지) 안에 포미(프레리도그)를 세우고 수비 준비 자세로 슬라이드하며 둥지를 지킨다. 2) 공을 주워 든 사람은 피벗만 가능하며 공을 던지거나 굴려 다른 사람의 프레리도그를 쓰러뜨린다. 3) 자신의 프레리도그가 쓰러지면 자신을 맞힌 사람에게 합류하여 콜로니(무리)를 이루고 팀을 확장해 나간다.</p>
