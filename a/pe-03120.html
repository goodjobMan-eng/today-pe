<h1>몸을 둥글게 하여 뒤구르기</h1>
<p>1) 매트 뒤를 향해 선 후 자연스럽게 무릎을 굽혀 앉는다. 2) 발을 살짝 모으고 양손은 손바닥이 위와 뒤를 향하도록 귀 옆에 받쳐 준비한다. 3) 엉덩이, 등, 뒤통수 순서로 매트에 닿도록 구르며 턱을 당겨 시선을 배꼽에 둔다. 4) 손바닥으로 매트를 힘차게 밀어내며 몸을 둥글게 유지하여 돌아 일어선다.</p>
