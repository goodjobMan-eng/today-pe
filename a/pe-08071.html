<h1>배고픈 개와 뼈다귀 지키기</h1>
<p>1) 수비수(경비견)들이 서로 손을 맞잡고 둥글게 원을 만들어 안쪽의 목표물(뼈다귀)을 둘러싼다. 2) 공격수(배고픈 개) 1명이 원 바깥에 위치한다. 3) 시작 신호가 울리면 수비수들은 함께 움직이며 원 안쪽을 방어한다. 4) 공격수는 수비 원 주변을 돌아 안으로 손을 뻗어 목표물(뼈다귀)을 가로채려 시도한다.</p>
