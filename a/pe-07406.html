<h1>발 오 카피텐 (주장에게 패스하기)</h1>
<p>1) 각 팀의 주장은 상대편 진영 끝에 마련된 전용 구역 안에 위치한다. 2) 팀원들은 공을 잡고 걷거나 드리블하지 않고 오직 패스만을 활용해 이동한다. 3) 공을 팀의 주장에게 안전하게 패스하여 전달하면 점수를 얻는다.</p>
