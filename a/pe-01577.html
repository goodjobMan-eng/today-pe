<h1>차차 슬라이드 댄스 워밍업</h1>
<p>1) 넓은 공간에서 교사의 시범이나 음악을 마주 보고 안전거리를 유지하며 정렬한다. 2) 노래 가사의 지시어에 맞춰 좌우 스텝, 홉 점프, 발 구르기, 크리스크로스 등 리듬 동작을 수행한다. 3) 림보처럼 몸을 낮추거나 턴을 돌며 음악의 템포에 맞춰 동작의 정확도를 높인다. 4) 동작의 난이도를 높이거나 모둠별로 방향을 바꿔 마주 보며 리듬 맞추기 변형을 적용한다.</p>
