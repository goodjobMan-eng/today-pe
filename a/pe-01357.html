<h1>버피 제로 묵찌빠 게임</h1>
<p>1) 5m 내외의 안전한 바닥 공간을 마련하고 모둠별로 마주 보고 앉거나 1대1 짝을 구성한다. 2) 제로 게임이나 묵찌빠, 가위바위보 대결을 펼치며 공격과 수비를 진행한다. 3) 패배한 팀이나 학생은 정해진 벌칙 횟수(예: 3회, 6회, 10회 등)만큼 전신 운동인 버피 테스트를 정확한 동작으로 수행한다. 4) 바닥에 O/X 정답 존을 만들고 2지선다 퀴즈를 출제하여 오답자가 3~5회의 버피를 수행하는 퀴즈 배틀로 변형할 수 있다.</p>
