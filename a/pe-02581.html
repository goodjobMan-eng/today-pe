<h1>상체 근력 강화를 위한 코어 트레이닝 7단계</h1>
<p>1) 팔 펴서 버티기: 양팔을 곧게 편 플랭크 자세를 취하고 버틴다. 2) 팔굽혀 버티기: 팔꿈치를 굽힌 상태에서 몸통을 일직선으로 유지하며 버틴다. 3) 무릎 대고 팔굽혀펴기: 무릎을 바닥에 대고 팔을 굽혔다 펴며 상체를 들어 올린다. 4) 팔굽혀펴기, 한쪽 다리 들기, 엎드려 무릎 당겨 닿기, 팔굽혀펴기 후 슈퍼맨 동작을 차례로 실시한다.</p>
