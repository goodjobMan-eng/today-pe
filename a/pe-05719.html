<h1>다리 쭉쭉 릴레이</h1>
<p>1) 1번 주자가 출발선에 발을 대고 앞으로 최대한 넓게 벌려 선다.2) 2번 주자가 1번 주자를 돌아와 그 앞에 발을 이어 최대한 다리를 벌려 선다.3) 다음 주자들도 앞 주자들을 돌아 나와 이어 선 뒤 마지막 주자까지 먼저 도착해 일어선 모둠이 승리한다.</p>
