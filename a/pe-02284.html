<h1>쇼다운</h1>
<p>1) 2명의 선수가 시각경기용 고글과 특수 장갑을 착용하고 나무 라켓을 든다. 2) 라켓으로 소리 나는 구슬 공을 쳐서 테이블 벽면을 맞히거나 센터 보드 스크린 아래로 통과시킨다. 3) 상대편의 골 포켓에 공을 넣으면 한 골당 2점을 얻는다. 4) 한 선수가 상대보다 2점 이상 앞선 상태에서 11점 이상을 먼저 획득하면 승리한다.</p>
