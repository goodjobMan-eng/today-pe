<h1>멀티 버킷 테니스공 챌린지</h1>
<p>1) 주로 쓰는 손에 테니스공을 쥐고 반대쪽 손에 팝콘 버킷(통)을 든다 2) 공을 바닥에 튕긴 뒤 버킷으로 바로 받아낸다 3) 공을 바닥에 튕긴 후 제자리에서 한 바퀴 돌아 버킷으로 잡거나 버킷 바닥면으로 받아낸다 4) 바닥에 튕긴 공을 머리 위에 얹은 버킷으로 받거나 버킷을 바닥에 내려놓고 튕겨 나온 공을 받아내는 등 고난도 과제에 도전한다</p>
