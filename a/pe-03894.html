<h1>비치볼 배시</h1>
<p>1) 코트 중앙에 하키 골대 2개를 마주보게 놓고 주변에 매트를 깔아 경기 구역을 만든다. 2) 팀당 안전요원 1명을 지정해 코트 중앙에 배치하고 나머지 팀원들은 매트(비치 타월) 뒤에 선다. 3) 음악이 시작되면 팀원들은 작은 공을 던져 중앙의 비치볼을 맞혀 상대 골대 안으로 밀어 넣는다. 4) 안전요원은 비치볼을 직접 건드리지 않고 굴러온 작은 공을 팀원들에게 발로 차거나 던져서 전달한다.</p>
