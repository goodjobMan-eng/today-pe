<h1>침략 게임: 성 침략하기와 건틀릿</h1>
<p>1) 공격 2명과 수비 1명으로 나누어 공격수는 패스를 주고받으며 수비를 피해 게이트를 통과하거나 끝 지점까지 도달한다. 2) 수비수가 공을 가진 공격수를 태그하면 수비수가 점수를 얻고, 공격수가 태그당하지 않고 통과하면 공격수가 득점한다. 3) 공이 없는 지원 공격수는 수비수와 적절한 거리를 유지하며 패스를 받기 쉬운 위치로 이동한다.</p>
