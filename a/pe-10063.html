<h1>훌라후프 공굴리기 게임</h1>
<p>1) 훌라후프와 콘을 배치하고 기본 운동(걷기, 뛰기)으로 몸을 푼다. 2) 첫 번째 종목은 훌라후프 안에 색깔을 맞춰 공굴리기이다. 3) 두 번째 종목은 원안에 공굴리기이다. 4) 세 번째 종목은 원안에 있는 콘을 공을 굴려 맞춰 4개 밀어내기이다. 5) 네 번째 종목은 주사위를 던져 나온 숫자에 솜털공 던지기이다.</p>
