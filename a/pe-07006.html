<h1>화면 화살표 점프 챌린지</h1>
<p>1) 바닥에 홈 베이스가 될 지점(스팟)을 정하고 올라선다 2) 화면에 화살표가 나오면 화살표 방향(앞, 뒤, 좌, 우)으로 양발 점프하여 이동한다 3) 화면에 홈 베이스 기호가 나타나면 다시 홈 베이스 자리로 양발 점프하여 복귀한다 4) 단계가 올라갈수록 화면 신호 속도가 빨라진다.</p>
