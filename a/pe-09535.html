<h1>가위바위보 달리기</h1>
<p>1) 책상을 모아 가로로 3줄을 만들어 출발선 뒤에 길게 줄을 섭니다. 2) 출발 신호와 함께 진행방향을 따라 이동하여 상대팀원과 만나는 지점에서 멈추어 가위바위보를 합니다. 3) 이긴 학생은 상대팀을 향해 빠르게 돌진하고, 진 학생은 자신의 팀 맨 뒷줄로 이동합니다.</p>
