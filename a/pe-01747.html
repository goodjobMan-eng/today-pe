<h1>단계별 줄넘기 인터벌 트레이닝</h1>
<p>1) 학생들은 각자 개인 줄넘기를 들고 전후좌우 안전거리를 유지하며 정렬한다. 2) 화면에 제시되는 기초 동작(양발 모아 뛰기, 두 번 뛰기 등)을 30초 타이머 동안 박자에 맞춰 뛴다. 3) 20초간 줄을 멈추고 심호흡을 하며 충분한 휴식을 취한다. 4) 뒤로 돌려 뛰기, 가위바위보 뛰기, 십자 뛰기 등 고난도 변형 줄넘기 동작으로 단계를 올려 도전한다.</p>
