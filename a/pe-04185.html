<h1>크리스마스 밸런스 게임 브레인 브레이크</h1>
<p>1) 화면에 제시되는 두 가지 크리스마스 선택지 중 마음에 드는 것을 하나 고른다. 2) 사탕 지팡이를 고르면 사이드 런지를 하고, 핫초코를 고르면 하이킥을 한다. 3) 크리스마스트리를 고르면 무빙 트리 동작을 하고, 썰매를 고르면 갤럽으로 이동한다. 4) 선물을 고르면 사이드 플랭크를 유지하고, 저녁 식사를 고르면 발끝 닿기(toe touch)를 한다.</p>
