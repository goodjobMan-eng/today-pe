<h1>제다이 누들 배틀</h1>
<p>1) 학생들을 두 팀으로 나누고 짝을 정해 바닥의 스팟 마커 위에 서게 한다. 2) 각 짝 중 한 명이 스펀지봉(누들)을 들고 전장으로 출전한다. 3) 전장에 나간 학생들은 상대 팀 선수의 무릎 아래를 스펀지봉으로 태그하는 배틀을 벌인다. 4) 태그당한 학생은 두 손을 들고 자기 마커의 짝에게 달려가 스펀지봉을 넘겨주며 교대하고, 교대받은 짝이 전장에 투입된다.</p>
