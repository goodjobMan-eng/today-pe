<h1>마법 상자 열기 게임</h1>
<p>1) 바닥에 번호가 매겨진 1번부터 5번 라인을 확인한다. 2) 후프 안에 두 발을 넣고 출발 준비를 한다. 3) 정해진 암호 번호인 1번 라인, 2번 라인, 다시 1번 라인, 4번 라인, 마지막 1번 라인 순서로 빠르게 이동한다. 4) 암호 조합을 틀리지 않고 완수하여 마법 상자를 연다.</p>
