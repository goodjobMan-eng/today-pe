<h1>외발 서기 밸런스 챔피언</h1>
<p>1) 양팔을 옆으로 벌리고 교사의 신호와 함께 한쪽 발을 들어 올려 외발 서기 자세를 취한다. 2) 든 발이 바닥에 닿거나 균형을 잃고 양발로 디디면 그 자리에 조용히 앉아 탈락한다. 3) 1차 예선에서 오래 버틴 모둠별 대표 학생들을 선발하여 결승전을 진행한다. 4) 결승전에서는 눈 감고 버티기나 초시계 측정 기록 대결로 변형하여 최종 챔피언을 결정한다.</p>
