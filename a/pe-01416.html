<h1>두뇌 자극 스피드·리듬 변형 걷기와 점프</h1>
<p>1) 교사의 구령에 맞춰 학생들이 자유롭게 공간을 조깅하거나 걸어 다닌다. 2) 교사가 신호를 주면 슬로 모션으로 걷기, 같은 쪽 팔다리 함께 내밀기, 특유의 리듬 스텝으로 이동 방식을 전환한다. 3) 교사의 박수와 호각 신호에 늦지 않고 즉시 몸의 리듬을 바르게 바꾼 학생이 생존한다. 4) 바닥에 4가지 색상의 마커 링을 배치하고 마주 본 짝의 점프 순서를 눈으로 기억해 그대로 따라 뛰는 패턴 점프로 변형한다.</p>
