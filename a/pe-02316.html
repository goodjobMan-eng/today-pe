<h1>한 줄 진 뺏기 놀이</h1>
<p>1) 두 편으로 나누고 각 편은 배턴을 준비한 뒤 한 개 직선을 두고 서로 마주 보고 선다. 2) 첫 번째 주자는 배턴을 들고 앞꿈치와 뒤꿈치를 붙여 직선을 따라 걷는다. 3) 상대편과 마주치면 몸으로 가위바위보를 하여 진 사람은 출발선으로 돌아가 다음 주자에게 배턴을 넘기고, 이긴 주자는 계속 전진한다. 4) 상대편 출발선의 삼각콘에 손을 대면 점수를 얻고 되돌아와 배턴을 넘기며, 정해진 시간 동안 점수를 많이 얻은 편이 이긴다.</p>
