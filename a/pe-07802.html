<h1>바닥 미끄럼 콩주머니 술래잡기 (Bolsita Que Pilla)</h1>
<p>1) 모든 학생과 모래주머니(콩주머니)가 경기장 전체에 흩어진 상태로 시작합니다. 2) 바닥에 있는 주머니를 주워 바닥을 따라 미끄러뜨려 다른 사람의 발을 맞힙니다. 3) 주머니에 맞은 사람은 그 자리에 앉아야 하며, 굴러온 주머니를 주워 앉은 채로 다른 사람을 맞힐 수 있습니다.</p>
