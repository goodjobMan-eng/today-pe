<h1>7과 2분의 1 게임</h1>
<p>1) 1부터 4까지 번호가 적힌 네 개의 사각형 표적판을 바닥에 표시한다. 2) 각 선수는 최대 3번의 던지기 기회 동안 말을 던져 점수를 합산한다. 3) 구역 안은 적힌 숫자만큼, 선 위에 걸치면 0.5점을 획득한다. 4) 선수는 목표 점수인 7.5점을 넘지 않도록 원하는 시점에 던지기를 멈출 수 있다. 5) 7.5점을 초과하면 불리해지며, 7.5점에 가장 가깝거나 정확히 맞춘 사람이 승리한다.</p>
