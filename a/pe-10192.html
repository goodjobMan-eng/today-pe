<h1>학교 동계 올림픽 체육 수업 운영 방법</h1>
<p>1) 2~6학년 학생들이 3개씩 투표해 대표 국가 6개 팀을 선정하고 게시판을 꾸민다. 2) 1일 차에는 성화 봉송 및 팀별 팀 존(Team Zone) 구성 등 개막식을 진행한다. 3) 2일 차부터 7일 차까지 봅슬레이, 스키 슬라럼, 플로어 하키, 컬링 등 4개 종목을 순환하며 실습한다. 4) 8일 차에는 메달 수여식 및 폐막식을 진행한다.</p>
