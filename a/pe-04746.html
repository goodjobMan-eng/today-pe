<h1>눕게 되는 가위바위보</h1>
<p>1) 두 사람이 마주 서서 가위바위보를 한다.2) 질 때마다 한쪽 무릎 꿇기(1단계), 두 무릎 꿇기(2단계), 엉덩이 대고 앉기(3단계), 엎드리기(4단계) 순으로 자세를 낮춘다.3) 다섯 번째로 진 사람이 바닥에 완전히 뻗어 누우면 패배하고 상대가 승리한다.</p>
