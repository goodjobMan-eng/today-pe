<h1>킨볼 푸쉬(push) 연습</h1>
<p>1) 2인 1조로 공을 잡고 가슴 쪽으로 밀착해 접촉 면적을 줄인다. 2) 치는 사람은 반대쪽 발을 앞으로 내딛으며 양손을 뻗어 공 중심을 앞으로 밀어낸다. 3) 잡는 사람은 치는 사람이 밀어낼 때 타이밍에 맞춰 손의 힘을 빼며 공을 놓아준다.</p>
