<h1>스쿠터 보드 운동 5가지</h1>
<p>1) 슈퍼 터틀: 배를 대고 엎드려 손과 발로 밀며 앞으로 이동합니다. 2) 제트 플레인: 배를 대고 엎드려 다리를 곧게 펴고 공중으로 든 채 손으로 밀며 이동합니다. 3) 숏 워크: 보드에 앉아 발뒤꿈치로 밀며 이동합니다. 4) 창문 닦기: 무릎을 꿇고 보드를 잡은 채 바닥을 닦듯이 앞으로 이동합니다. 5) 왜건: 보드에 앉아 양손으로 줄을 잡고 다른 사람이 끌어줍니다.</p>
