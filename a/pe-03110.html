<h1>축구 수비와 돌파 기술 연습</h1>
<p>1) 공격은 수비가 앞에 있을 때 공을 툭 치며 방향을 바꿔 빠르게 돌파를 시도한다. 2) 수비는 무리하게 발부터 뻗지 않고 자세를 낮추며 간격을 좁힌다. 3) 수비 시 몸을 일자로 서지 않고 약간 대각선으로 서서 상대의 진행 방향에 맞춰 뒤로 물러서며 거리가 닿을 때 공을 빼앗는다.</p>
