<h1>파라슈트 디지 디지</h1>
<p>1) 학생들이 파라슈트를 잡고 한 방향으로 천천히 돌다가 반대 방향으로 회전한다. 2) 교사의 신호에 맞춰 파라슈트를 손에서 놓고 지정된 체력 동작(점핑잭 10회 등)을 수행한다. 3) 동작을 마친 뒤 다시 파라슈트로 돌아와 잡아 더 빠른 속도로 회전하고 다음 지시 동작을 수행한다.</p>
