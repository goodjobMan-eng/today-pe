<h1>병뚜껑 책상 네트형 게임</h1>
<p>1) 책상 가운데에 장애물(상자, 책 등)을 놓아 간이 네트를 설치한다. 2) 가위바위보 등으로 차례를 정하고 병뚜껑을 손으로 쳐서 상대편 구역으로 넘긴다. 3) 병뚜껑이 책상 밖으로 나가거나 네트에 걸리면 상대편이 득점한다. 4) 점수를 누적하여 정해진 승리 기준에 먼저 도달하는 팀이 승리한다.</p>
