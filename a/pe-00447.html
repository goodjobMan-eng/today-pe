<h1>손잡고 술래잡기</h1>
<p>1) 술래 한 명을 정하고 나머지 참가자들은 정해진 구역 안에서 도망칩니다. 2) 술래는 도망치는 친구를 쫓아가 손으로 터치합니다. 3) 터치당한 사람은 술래가 되어 기존 술래와 손을 맞잡고 함께 다른 친구들을 잡으러 다니며, 술래 줄이 길어지면 도망자들은 빈 공간으로 빠르게 빠져나갑니다. 4) 마지막까지 잡히지 않고 살아남은 사람이 최종 승자가 됩니다.</p>
