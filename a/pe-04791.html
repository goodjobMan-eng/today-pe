<h1>아슬아슬 피사의 사탑</h1>
<p>1) 빨대로 흡입하여 종이를 집어 올린 뒤 그 위에 종이컵을 차례로 쌓는다.2) 종이와 종이컵 5단 쌓기에 먼저 성공한 사람은 정해진 운동(점핑잭 5회 등)을 수행한다.3) 종이만 쏙 빼내어 종이컵들이 포개지도록 만든 뒤 다시 운동을 먼저 완료하는 사람이 승리한다.</p>
