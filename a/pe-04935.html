<h1>3대3 스리맨 사커 (드리블 편)</h1>
<p>1) 양 골대 위치에 페트병을 3개씩 세워 둔다.2) 3명씩 두 팀을 구성하여 3 대 3으로 경기를 진행한다.3) 경기 시간은 5분간 진행된다.4) 배운 드리블 기술을 활용하여 상대 진영의 페트병을 공으로 맞춰 쓰러뜨린다.5) 정해진 시간 내에 페트병을 더 많이 쓰러뜨린 팀이 승리한다.</p>
