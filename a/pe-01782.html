<h1>뉴스포츠 츄크볼 경기</h1>
<p>1) 양쪽 엔드라인에 바운더 프레임과 반원 금지구역을 설치하고 두 팀으로 나눈다. 2) 공을 잡고 3보 이상 걷지 못하며 패스를 3회 이내로 연결하여 프레임에 슛을 던진다. 3) 프레임에 튄 공이 금지구역 바깥 코트 바닥에 닿으면 득점하고, 수비가 직접 받으면 무득점이 된다. 4) 상대 패스나 슛을 직접 가로챌 수 없으며 어느 쪽 프레임에든 공격할 수 있는 양방향 룰을 적용한다.</p>
