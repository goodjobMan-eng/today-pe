<h1>아이스 스케이팅 태그 (미끄럼 술래잡기)</h1>
<p>1) 콘 6개로 빙상장 구역을 만들고, 모든 학생은 양발 밑에 스카프를 한 장씩 밟고 빙판을 지치듯 미끄러지며 이동한다. 2) 수영장 폼롤러(스펀지봉)를 든 2~3명의 술래가 스카프를 탄 채 도망자를 터치하러 다닌다. 3) 술래에게 태그된 학생은 스카프를 벗어두고 경기장 외곽을 한 바퀴 달린 후 새 스카프를 받아 경기장에 재입장한다.</p>
