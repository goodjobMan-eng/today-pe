<h1>니트로볼 규칙과 경기 방법</h1>
<p>1) 5~9명으로 팀을 나누어 배구와 사구의 규칙을 섞어 경기를 진행합니다. 2) 언더핸드 배구 칠기로 서브를 넣으며, 학년 수준에 맞춰 서브 깊이를 조절합니다. 3) 공은 1~3번 튀긴 후 넘길 수 있으며 체육관 벽을 활용할 수 있습니다.</p>
