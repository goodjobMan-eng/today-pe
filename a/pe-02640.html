<h1>가정형 신체활동 웨이크업 스트레칭과 사다리 운동</h1>
<p>1) 양다리를 앞으로 뻗고 양팔을 위로 올려 상체를 뒤로 젖히는 웨이크업 스트레칭을 실시한다. 2) 발을 붙여 사다리 라인을 따라 일자로 걷는 인라인 워킹을 진행한다. 3) 사다리 안쪽과 바깥쪽을 지그재그 방향으로 한 발씩 이동하는 지그재그 워킹을 한다. 4) 양발을 어깨너비로 벌리고 상체를 바르게 편 채 와이드 스쿼트를 실시한다.</p>
