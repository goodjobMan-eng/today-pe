<h1>크레이지 캐터필러</h1>
<p>1) 학생들은 2~3명씩 모둠을 구성하고 각자 풀누들과 게이터 볼 1개를 받는다.2) 음악이 시작되면 체육관 바닥에 흩어진 원마커를 향해 오직 풀누들만을 사용해 공을 드리블하여 이동한다.3) 원마커 위에 공을 가두면 해당 마커를 집어 팀의 출발 위치로 가져가 길게 연결하여 애벌레를 만든다.4) 바닥의 모든 마커가 소진될 때까지 진행한 뒤 모은 마커 수를 센다.</p>
