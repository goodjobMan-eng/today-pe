<h1>홈 농구 BEEF 챌린지</h1>
<p>1) 목표 바구니를 가운데에 두고 공(폼볼·양말공·종이공 등) 9개를 3개씩 3방향 일렬로 배치한다. 2) 각 공 위치에서 슛하기 전 점핑잭 5회를 실시한다. 3) BEEF(밸런스·시선·팔꿈치·팔로우스루) 자세를 적용하여 바구니를 향해 슛을 던진다. 4) 골인하면 다음 공으로 이동해 점핑잭 5회 후 슛하고, 실패하면 공을 주워와 점핑잭 없이 들어갈 때까지 재시도하여 9개를 모두 넣는 시간을 측정한다.</p>
