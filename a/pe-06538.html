<h1>술래 활용 플래그 풋볼 캐치 게임</h1>
<p>1) 5명이 한 조가 되어 술래 1명과 수행자 4명으로 구성한다. 2) 수행자는 자리에서 움직이지 않은 채 술래를 피해 패스를 주고받는다. 3) 술래는 던지는 공을 쳐내거나 인터셉트하며 방해한다. 4) 패스가 10회 이어지면 술래에게 벌칙이 주어지고, 술래가 공을 쳐내거나 뺏으면 패스를 실패한 사람과 역할을 바꾼다.</p>
