<h1>어린이 체육 장애물 코스 (Hinderbana)</h1>
<p>1) 미니 골대와 훌라후프 터널을 포복으로 기어서 통과한다 2) 뒤집힌 벤치 위를 중심 잡으며 걸어가 벽면 늑목을 타고 오른다 3) 늑목에서 매트 위로 안전하게 착지한 뒤 경사 벤치를 걸어 올라가 뜀틀 위를 건넌다 4) 뜀틀에서 대형 매트로 뛰어내린 뒤 바닥 훌라후프를 점프해 통과하고 천 터널을 기어 나온 뒤 공을 상자에 넣고 스텝을 밟아 돌아온다</p>
