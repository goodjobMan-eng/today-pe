<h1>종이 비행기 컵 볼링</h1>
<p>1) A4용지로 각자의 종이 비행기를 접어 준비합니다. 2) 책상 위에 스피드스택스 컵 10개(4-3-2-1 피라미드 형태)를 쌓아 목표물을 만듭니다. 3) 출발선에서 팀원들이 돌아가며 컵 탑을 향해 종이 비행기를 날립니다. 4) 정해진 시간 동안 종이 비행기로 넘어뜨린 컵의 개수만큼 점수를 얻어 합산합니다.</p>
