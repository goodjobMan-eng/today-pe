<h1>단계별 짝·모둠 매트 꾸미기체조(쿠미타이소)</h1>
<p>1) 1인 동작부터 2인, 3인 동작까지 난이도 1~10단계를 순서대로 협력하여 수행합니다. 2) 1단계 V자 균형, 2단계 한 손 균형 등 개인 기본자세를 5초간 안정적으로 유지합니다. 3) 2인 동작인 더블 밸런스와 미끄럼틀을 거쳐 3인 동작인 꽃, 부채, 스카이트리, 다리 만들기까지 차례로 도전합니다. 4) 각 단계마다 모둠원 전원이 신호를 맞추어 5초 이상 자세를 유지하면 성공합니다.</p>
