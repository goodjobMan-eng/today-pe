<h1>부모와 함께하는 수영 교실: 배영</h1>
<p>1) 킥판을 가슴에 안고 누운 자세로 물에 뜨는 연습을 한다.2) 킥판 없이 크게 숨을 들이쉬고 복부에 공기를 모아 배영 뜨기를 한다.3) 발등으로 물을 차올리며 배영 킥으로 앞으로 나아간다.4) 서 있는 자세에서 양팔을 번갈아 들어 올리며 스트로크 동작을 익힌다.5) 팔과 다리의 동작을 연결하여 배영을 실시한다.</p>
