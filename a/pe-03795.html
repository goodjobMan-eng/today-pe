<h1>인형 전달 스피드 점핑잭 1분 챌린지</h1>
<p>1) 발과 양손을 모으고 한쪽 손에 곰 인형(또는 베개)을 들고 선다. 2) 팔을 벌려 뛰며 점핑잭을 수행하는 도중 머리 위에서 반대쪽 손으로 인형을 전달한다. 3) 팔과 다리를 모아 제자리로 돌아오면 1회로 계산한다. 4) 1분 동안 제한 시간 안에 가능한 많은 횟수의 점핑잭을 연속해서 성공한다.</p>
