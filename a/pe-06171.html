<h1>창던지기</h1>
<p>1) 투척선 뒤에서 축구 코너폴을 어깨 위로 들고 투척 준비 자세를 취한다.2) 도움닫기 시 옆으로 서서 개걸음 스텝으로 이동하며 팔을 높이 들어 올린다.3) 신호에 맞춰 포물선 각도를 살려 전방 멀리 축구 폴대를 던진다.4) 자신이 던진 위치에 접시콘을 놓아 비거리를 표시하고 다음 차례에 더 멀리 던져 콘을 옮긴다.</p>
