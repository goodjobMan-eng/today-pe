<h1>뜀틀 뛰어넘기 단계별 연습</h1>
<p>1) 처음에는 낮은 높이부터 시작하여 성공의 경험을 느낄 수 있도록 한다. 2) 손을 짚을 때는 최대한 멀리 짚도록 유도한다. 3) 높이에 익숙해지면 단계를 올려서 차례대로 도전한다. 4) 익숙해지면 장애물 없이 빠르게 달려와 손을 멀리 짚고 뛰어넘기를 완성한다.</p>
