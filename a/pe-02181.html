<h1>공 한 개 저글링 기초 연습</h1>
<p>1) 저글링 공(또는 둥글게 만 양말, 테니스공) 1개를 준비합니다. 2) 오른손과 왼손을 번갈아 가며 한 손으로 공을 던지고 반대쪽 손으로 받는 동작을 연습합니다. 3) 공을 눈높이(약 30cm 이상)까지 띄우며 양손 감각을 익힙니다. 4) 안정적으로 공을 떨어뜨리지 않고 연속 50회 던지고 받기를 달성할 때까지 반복합니다.</p>
