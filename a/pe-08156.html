<h1>알파벳 볼 (ABC Ball)</h1>
<p>1) 술래 1명이 원 한가운데에 서고 나머지 학생들은 술래를 둘러싸고 원형으로 선다. 2) 가운데 사람이 알파벳 글자 하나를 외치며 원 둘레에 있는 학생에게 공을 패스한다. 3) 공을 받은 학생은 해당 알파벳으로 시작하는 단어를 말하고 다시 가운데 사람에게 공을 던져 돌려준다. 4) 이미 나온 단어를 반복하거나 단어를 생각하지 못하면 탈락하여 자리에 앉으며 새 술래가 들어올 때 다시 일어난다.</p>
