<h1>부상 예방을 위한 앞구르기 기초 동작</h1>
<p>1) 매트에 양손을 짚고 엉덩이를 높이 들어 올린다.2) 배꼽을 바라보며 뒷목부터 등이 바닥에 닿도록 둥글게 몸을 만다.3) 발을 모아 힘을 실어 구른 뒤, 바닥을 손으로 짚지 않고 발 반동만으로 일어선다.4) 구르는 도중 다리가 벌어지거나 등으로 바닥을 강타하지 않도록 둥근 자세를 유지한다.</p>
