<h1>바운스 챌린지 2편 (농구 기능)</h1>
<p>1) 공을 보지 않거나 눈을 감은 채 손끝 감각을 느끼며 드리블한다.2) 한 발로 깽깽이 뛰기를 하면서 반대쪽 손으로 공을 바운스하고, 익숙해지면 손과 발을 바꾼다.3) 공을 바운스한 뒤 재빠르게 제자리에서 회전하여 두 손(또는 한 손)으로 잡는다.4) 체육관 바닥 라인을 따라 몸을 낮추고 손끝을 이용해 라인을 벗어나지 않게 드리블한다.</p>
