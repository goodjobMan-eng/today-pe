<h1>어몽어스 임포스터 찾기 관찰 타바타</h1>
<p>1) 개인 활동 공간을 확보하고 화면의 어몽어스 캐릭터 그림을 주시합니다. 2) 15초 제한 시간 동안 화면 양쪽에 중복으로 등장하는 임포스터 캐릭터를 찾아냅니다. 3) 자신이 추측한 캐릭터에 배정된 신체 활동 동작(런지, 버피, 점핑잭 등)을 수행합니다. 4) 5초 전 정답 캐릭터가 공개되면 정답 여부를 확인하며 활기차게 운동을 지속합니다.</p>
