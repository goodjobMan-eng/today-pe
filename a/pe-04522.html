<h1>트램펄린 기초 점프 및 착지 동작</h1>
<p>1) 트램펄린 중앙의 십자 표시에서 두 발을 모으고 발끝으로 가볍게 뛰어오르는 기본 도약을 익힌다. 2) 중심을 잃었을 때 양팔을 뻗고 무릎을 굽혀 반동을 흡수하는 모터바이크 착지를 훈련한다. 3) 공중에서 다리를 뻗는 펜슬, V자로 벌리는 스트래들, 별 모양 스타, 무릎을 안는 턱 동작을 연습한다. 4) 엉덩이로 튕겨 일어서는 시트 드롭과 엎드려 튕기는 프론트 드롭 동작을 연결한다.</p>
