<h1>운동 전 전신 스트레칭과 팔 짚고 버티기</h1>
<p>1) 박수를 치고 손목, 발목, 무릎을 천천히 돌려 몸을 푼다. 2) 어깨와 팔을 앞뒤로 크게 돌리고 다리를 넓게 벌려 무릎을 굽혀 눌러준다. 3) 바닥에 엎드려 양손을 짚고 다리를 펴 머리부터 발끝까지 버티는 동작을 5회 실시한다. 4) 1회 실시 후 숨을 고르고 총 3세트를 반복하여 체온과 심박수를 높인다.</p>
