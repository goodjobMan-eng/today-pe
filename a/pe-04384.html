<p>1) 두 명이 양 끝에서 줄을 잡고 바닥에 대고 흔든다. 2) '스네이크'는 줄을 좌우로 흔들고, '오션 웨이브'는 줄을 상하로 흔든다. 3) 줄이 바닥에 닿을 때 줄을 넘는다. 4) 줄이 배 높이보다 높게 올라오지 않게 한다.</p>
