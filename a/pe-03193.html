<h1>순발력 기르기 순환 운동</h1>
<p>1) 양발을 모으고 위로 높이 뛰어오르면서 접시콘을 좌우로 뛰어넘는다. 2) 줄넘기로 양발을 모으고 뛰어오르며 줄을 빠르게 두 번 돌려 2단 뛰기를 한다. 3) 무릎을 굽히고 앉았다가 순간적으로 위로 힘차게 뛰어오른다. 4) 양발을 모으고 뛰어올라 미니 허들 등 장애물을 넘고, 티볼 공을 한 손으로 쥐고 빠르게 던진다.</p>
