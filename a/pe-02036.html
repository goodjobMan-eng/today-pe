<h1>팽이치기</h1>
<p>1) 팽이에 팽이채의 줄을 팽팽하게 감는다. 2) 바닥에 팽이를 던지듯 당겨 풀면서 회전시킨다. 3) 팽이채 줄로 팽이 몸통을 쳐서 회전이 멈추지 않게 유지한다. 4) 2인 이상 시합할 때는 줄로 상대방 팽이를 들이받거나 찍어 상대 팽이를 먼저 멈추게 한다.</p>
