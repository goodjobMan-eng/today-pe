<h1>꽃게 축구 (FÚTBOL CANGREJO)</h1>
<p>1) 두 팀으로 나누어 경기장 양쪽 끝에 골대를 두고 각자 진영에 위치한다. 2) 모든 선수는 바닥을 등지고 양손과 양발을 땅에 짚는 꽃게 자세(크랩 워크)를 취한다. 3) 중앙에 놓인 비치볼을 향해 꽃게 자세로 이동하며 손, 발, 몸 전체를 사용해 상대 골대에 공을 넣어 경기한다.</p>
