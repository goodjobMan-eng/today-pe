<h1>징검다리 가위바위보</h1>
<p>1) 원마커를 길게 'ㄷ'자 모양으로 바닥에 배치하여 징검다리 경로를 만듭니다. 2) 양 팀은 양쪽 출발선에 한 줄로 서고, 신호가 울리면 첫 번째 주자가 점프하며 징검다리를 건넙니다. 3) 마주친 두 주자는 가위바위보를 하여 이긴 사람은 계속 전진하고 진 팀은 즉시 다음 주자가 출발합니다. 4) 계속해서 가위바위보를 이겨 상대팀 출발선까지 먼저 도달한 팀이 승리합니다.</p>
