<h1>프리즈 댄스</h1>
<p>1) 체육관 바닥 라인을 기준으로 본 대결 구역과 연습 구역을 나눈다. 2) 음악이 나오면 학생들은 동물 흉내, 스킵, 갤럽 등 자유롭게 춤을 추며 움직인다. 3) 음악이 멈추면 그 즉시 동작을 완전히 멈춘다(프리즈). 4) 음악이 멈췄을 때 움직인 학생은 탈락하여 연습 구역으로 이동해 계속 춤춘다.</p>
