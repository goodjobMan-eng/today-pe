<h1>안대 쓰고 강 건너기</h1>
<p>1) 한 사람이 안대를 쓰고 출발선에 선다. 2) 안대를 쓰지 않은 짝이 말로 방향과 걸음을 안내해 준다. 3) 안대를 쓴 사람은 안내자의 말을 듣고 멈추거나 방향을 틀며 장애물을 피해 걷는다. 4) 장애물을 하나라도 건드리지 않고 반대편까지 무사히 통과하면 역할을 바꾸어 진행한다.</p>
