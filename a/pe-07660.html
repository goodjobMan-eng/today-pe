<h1>캥거루 릴레이</h1>
<p>1) 팀당 후프 5개(총 10개)를 일렬로 배치하고 반환점에 콘을 세운다. 2) 신호가 울리면 각 팀 첫 번째 주자가 후프 안으로 모둠발로 연속 점프한다. 3) 마지막 후프를 지나 반환점 콘을 돌아 달려서 자기 팀으로 복귀한다. 4) 출발선을 통과하면 다음 주자가 터치받아 동일하게 후프 점프를 수행한다. 5) 모든 팀원이 3회 먼저 완주한 팀이 1점을 획득한다.</p>
