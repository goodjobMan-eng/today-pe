<h1>드리블 꼬리잡기 게임</h1>
<p>1) 모든 참가자는 허리 뒤에 꼬리끈(스카프)을 달고 각자 축구공을 하나씩 가집니다. 2) 신호가 시작되면 경기 구역 안에서 공을 발로 능숙하게 드리블하며 이동합니다. 3) 자신의 공을 컨트롤하면서 동시에 상대방 허리의 꼬리끈을 손으로 뽑아냅니다. 4) 자신의 꼬리를 지키며 제한 시간 안에 가장 많은 꼬리를 얻은 팀 또는 개인이 승리합니다.</p>
