<h1>종이 딱총 큰 소리 내기 도전</h1>
<p>1) 직사각형 종이의 각 모서리를 안쪽으로 접어 종이 딱총을 완성합니다. 2) 딱총의 끝 모서리를 단단히 잡고 준비 자세를 취합니다. 3) 팔을 머리 위에서부터 아래쪽으로 온 힘을 다해 강하게 내리쳐, 종이 틈으로 바람이 들어가며 펼쳐질 때 큰 '팡' 소리를 냅니다. 4) 참가자들끼리 번갈아 내리치며 누가 가장 큰 소리를 내는지 도전합니다.</p>
