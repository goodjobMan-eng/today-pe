<h1>투게더 스틱 놀이</h1>
<p>1) 모둠원들이 둥글게 둘러서서 각자 스틱을 세워 손가락 옆면으로 짚고 준비한다. 2) 신호에 맞추어 자신의 스틱을 놓고 옆 사람 자리로 이동하여 쓰러지기 전에 옆 사람의 스틱을 잡는다. 3) 다른 사람이 잡을 수 있도록 도와주며 연속으로 성공한 횟수를 늘려간다. 4) 팀 전체가 스틱을 떨어뜨리지 않고 한 바퀴를 완전히 도는 미션에 도전한다.</p>
