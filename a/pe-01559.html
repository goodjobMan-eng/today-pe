<h1>철봉 앞으로 지지하여 돌기 챌린지</h1>
<p>1) 철봉에 올라 양팔을 쭉 펴고 허벅지를 철봉에 기댄 채 앞 지지 자세를 만든다. 2) 상체를 앞으로 숙이며 골반을 접어 철봉을 축으로 하여 앞쪽으로 몸을 기울인다. 3) 팔과 허벅지의 접촉을 유지하며 부드럽게 앞으로 한 바퀴 굴러 다시 지지 자세를 만든다. 4) 완벽하게 성공하면 착지로 연결하거나 연속 회전으로 동작의 안정성을 높인다.</p>
