<h1>중학년 뜨기·헤엄치기 운동 (케노비·수준별 영법 학습)</h1>
<p>1) 물속에서 힘을 빼고 엎드리거나 뜨는 다양한 자세를 익히는 수영 기초 도전 활동입니다. 2) 비트판 등 보조구를 활용해 벽을 차고 몸을 일직선으로 뻗는 케노비(유선형 뻗기) 동작을 반복 연습합니다. 3) 자유형과 평영의 발차기·손동작·호흡법을 수준별 구역(A·B·C)으로 나누어 단계별로 학습합니다. 4) 짝과 함께 동작의 흐름과 몸의 균형이 무너지지 않는지 서로 관찰하고 평가합니다.</p>
