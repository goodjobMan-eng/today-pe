<h1>죽었다 살았다 놀이</h1>
<p>1) 술래 1명은 플라스틱을 들고, 죽은 학생 2명은 훌라후프를 듭니다. 2) 선생님의 신호가 울리면 술래는 살아있는 학생을 잡으러 다닙니다. 3) 술래에게 잡히면 얼음 상태가 되어 그 자리에 멈춰 있습니다. 4) 훌라후프를 잡고 있던 죽은 학생은 얼음이 된 학생에게 훌라후프를 넘겨주고 살아나게 됩니다. 5) 훌라후프를 받은 학생은 얼음이 된 다른 학생을 찾아다닙니다. 6) 제한 시간 동안 활동을 반복합니다.</p>
