<h1>축구 리프팅 기술 익히기</h1>
<p>1) 츄우 코치의 슈퍼테크닉 영상에서 소개하는 리프팅의 기본 개념과 방법을 관찰한다. 2) 축구공을 떨어뜨리지 않고 발로 계속 튀기는 리프팅 동작을 연습한다. 3) 슬로 모션으로 나오는 프로의 고난도 리프팅 동작을 보며 세부적인 발 모양을 살펴본다. 4) 재미를 느끼며 꾸준히 리프팅 기술을 연습해 본다.</p>
