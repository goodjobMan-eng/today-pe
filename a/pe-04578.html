<h1>스포츠 술래잡기 보물 쟁탈전</h1>
<p>1) 중앙에 보물(페트병)을 놓고 양 끝에 진지를 만든다. 2) 술래는 수비 구역을 지키며 공격자를 양손으로 터치한다. 3) 공격자는 술래를 피해 진지 안으로 들어가 보물을 쟁탈한다. 4) 제한 시간 내 보물을 획득하거나 진지에 먼저 들어간 쪽이 승리한다.</p>
