<h1>탄성 밴드 상체 스트레칭과 근력 운동</h1>
<p>1) 밴드를 두 손으로 잡고 일정한 간격으로 양옆으로 당기며 어깨 가동 범위를 넓힌다. 2) 한 손은 무릎에 고정하고 반대쪽 손을 대각선 위로 천천히 들어 올리며 어깨를 늘린다. 3) 밴드를 짧게 쥐고 가슴 앞에서 빠른 속도로 좌우로 당겼다 놓는 동작을 반복한다. 4) 등 뒤로 밴드를 넘겨 쥐고 양팔을 번갈아 뻗거나 두 팔을 동시에 밀어내며 상체 근력을 단련한다.</p>
