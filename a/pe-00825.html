<h1>꼬리잡기 달리기 (팀 꼬리 탈환전)</h1>
<p>1) 모든 학생 또는 팀의 마지막 주자 허리춤에 꼬리끈(스카프)을 착용합니다. 2) 신호와 함께 이동하며 상대 팀의 꼬리끈을 뽑으러 갑니다. 3) 상대 팀의 꼬리끈을 먼저 뽑아내면 점수를 얻거나 승리합니다. 4) 자신의 꼬리가 뜯기지 않도록 보호하면서 빠르게 회피하고 기회를 노려 공격합니다.</p>
