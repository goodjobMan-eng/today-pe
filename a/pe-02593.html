<h1>발피구 서바이벌</h1>
<p>1) 팀 없이 개인전으로 진행하며 끝까지 살아남는 사람이 승리합니다. 2) 공이 땅에 튄 후(바운드) 종아리 아래쪽을 맞으면 아웃입니다. 3) 공이 땅에 닿지 않고 뜬공(업볼)으로 오거나 종아리 위쪽을 맞으면 아웃이 아닙니다. 4) 아웃된 사람은 정해진 원마커 구역으로 들어가 술래 역할을 맡아 다른 친구들을 아웃시킵니다.</p>
