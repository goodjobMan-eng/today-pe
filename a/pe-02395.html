<h1>뜀틀 단계별 뛰어넘기 도전</h1>
<p>1) 지상에서 팔을 짚고 다리를 최대한 벌리며 착지하는 기본 동작을 연습한다. 2) 뜀틀을 가로로 놓고 손 짚는 위치를 최대한 멀리 짚으며 뛰어넘는다. 3) 도움닫기 시 뜀틀 앞에서 멈추지 않도록 유니바나 콘 등 장애물을 설치해 추진력을 얻어 뛰어넘는다. 4) 뜀틀을 세로로 놓고 낮은 단부터 점차 단을 올려가며 최종적으로 도움닫기 후 손을 끝에 짚고 연속으로 뛰어넘는다.</p>
