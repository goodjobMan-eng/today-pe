<h1>꽃게 터널 공 전달 게임</h1>
<p>1) 모든 참가자가 원형으로 둘러앉아 손과 발로 바닥을 짚고 엉덩이를 들어 게 자세를 만든다. 2) 지정된 방향으로 옆 사람의 팔 아래 공간을 통해 공을 굴려 전달한다. 3) 엉덩이가 바닥에 닿지 않도록 자세를 유지하며 공이 정해진 바퀴 수를 돌아오는 기록에 도전한다.</p>
