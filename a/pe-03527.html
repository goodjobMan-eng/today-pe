<h1>상대 바구니에 골 넣기</h1>
<p>1) 6명이 한 모둠을 이루고 두 모둠이 게임을 준비합니다. 2) 가운데 있는 상자 안의 공을 손으로 잡아 상대 영역의 제한 구역 앞까지 빠르게 이동합니다. 3) 상대 영역에 있는 바구니에 공을 던져 넣으며, 제한 구역 안으로는 들어갈 수 없습니다. 4) 정해진 시간 동안 상대 바구니에 가장 많은 공을 넣은 모둠이 이깁니다.</p>
