<h1>심장 건강 줄넘기 순환 운동</h1>
<p>1) 체육관에 트램폴린, 허들, 하트 모양 훌라후프, 줄넘기 등의 구역을 설치한다. 2) 학생들이 각 구역을 돌며 트램폴린 10회 점프, 허들 넘기, 하트 점프, 줄넘기 등의 활동을 수행한다. 3) 3~5학년은 20~50회 점프 및 기술 테스트를 진행하고 1~2학년은 기본 점프를 실시한다.</p>
