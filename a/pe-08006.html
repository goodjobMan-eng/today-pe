<h1>대집단 체육 활동 모음 (스네이크 핏 외)</h1>
<p>1) 스네이크 핏: 학생들을 4~6명씩 모둠으로 나누어 체육관 양 끝에 마주 보게 세운다. 2) 음악이 나오면 앞사람이 달려가 반대편 팀원과 하이파이브를 하고 릴레이를 이어간다. 3) 음악이 멈추면 달리고 있던 학생들은 중앙 원으로 이동해 주사위로 정해진 횟수만큼 지정된 운동을 수행한다.</p>
