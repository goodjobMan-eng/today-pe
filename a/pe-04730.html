<h1>성장기 근력운동 홈트레이닝</h1>
<p>1) 개구리 자세로 몸을 숙여 어깨와 등 근육을 늘려준다.2) 서서 허리를 편 채 팔꿈치와 무릎을 번갈아 교차 터치한다.3) 런지 자세로 앉았다 일어나며 뒷다리를 앞으로 힘차게 찬다.4) 플랭크 자세로 엎드려 엉덩이를 들고 버틴 뒤 누워서 하늘자전거를 탄다.5) 다리를 넓게 벌려 와이드 스쿼트를 실시한다.</p>
