<h1>앵글볼</h1>
<p>1) 양 팀은 골대 옆에서 경기를 시작하며 체육관 전체를 경기장으로 활용한다 2) 공을 들고 뛰지 않고 패스를 통해서만 상대방 진영으로 전진한다 3) 수비수는 공격자로부터 1m 이상 떨어져서 수비하며 공을 터치하면 반칙이 선언된다 4) 패스로 기회를 만들어 상대 골대 위에 놓인 앵글볼을 던져 맞춰 떨어뜨리면 득점한다</p>
