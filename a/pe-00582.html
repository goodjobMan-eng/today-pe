<h1>매트 운동 앞구르기</h1>
<p>1) 매트 앞에 바르게 서서 무릎을 굽히고 양손을 어깨너비로 매트에 짚습니다. 2) 고개를 숙여 배꼽을 바라보며 엉덩이를 높이 들어 올립니다. 3) 정수리가 아닌 뒷머리가 매트에 닿도록 몸을 둥글게 말아 앞으로 구르며, 뒷머리·등·허리 순서로 매트에 닿게 합니다. 4) 밀어낸 손을 앞으로 뻗으며 양발로 착지하여 일어섭니다.</p>
