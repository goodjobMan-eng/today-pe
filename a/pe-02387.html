<h1>종이를 활용한 균형감각 챌린지</h1>
<p>1) 길게 반으로 자른 종이 2장 중 1장을 바닥에 두고 다른 발로 밟아 고정한다. 2) 나머지 종이 1장을 머리 위에 얹고 외발로 선다. 3) 고개를 숙여 머리 위의 종이를 바닥에 떨어뜨린다. 4) 1단계는 선 채로, 2단계는 무릎을 구부려, 3단계는 다리를 뒤로 뻗어 떨어지는 종이를 바닥에 닿기 전에 손으로 잡는다.</p>
