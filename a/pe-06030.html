<h1>솜털공과 친해지기 활동</h1>
<p>1) 솜털공을 위로 던진 뒤 떨어지는 공을 두 손이나 한 손으로 받는다.2) 공을 위로 던지고 박수 횟수를 늘려가며 치거나 바닥을 짚고 받는다.3) 공을 손등이나 발등에 얹어 올리거나 스태킹 컵을 양손에 쥐고 공을 던져 컵으로 받는다.</p>
