<h1>송편 배달하기</h1>
<p>1) 25m 거리에 출발점과 도착점 바구니를 두고, 5m 간격으로 원마커 4개를 놓아 주자 4명이 순서대로 선다.2) 출발점 바구니에 송편(솜털공) 5개를 담는다.3) 시작 신호와 함께 1번 주자가 공 1개를 들고 달려 2번 주자에게 건네고 제자리로 돌아온다.4) 같은 방식으로 2번은 3번에게, 3번은 4번에게 이어달리며 전달한다.5) 4번 주자는 도착점 바구니에 공을 담고, 공 5개를 먼저 모두 배달한 모둠이 이긴다.</p>
