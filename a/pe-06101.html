<h1>포스퀘어 룰 적용 변형 게임</h1>
<p>1) 가위바위보 등으로 순위를 정해 1등부터 차례대로 4번부터 1번 구역에 선다.2) 각 구역에서 정해진 개인 미션(병 플립, 점핑 잭 3회 등)을 수행한다.3) 미션에 성공하거나 탈락·성공 여부에 따라 자리를 교체해 가장 높은 번호(4번) 자리를 차지하고 유지한다.</p>
