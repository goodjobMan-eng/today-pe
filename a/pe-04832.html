<h1>인싸와 아싸 찾기</h1>
<p>1) 노래를 정하고 술래를 정한 뒤 술래는 교실 밖으로 잠시 나간다2) 교실 안에서 소리를 내지 않고 입모양만 흉내 내는 아싸(또는 춤 동작을 주도하는 인싸) 1명을 정한다3) 술래가 들어오면 노래를 시작하며 모든 학생이 노래를 부르고 춤을 춘다4) 아싸 찾기에서는 술래가 아싸에게 가까워질수록 다른 학생들이 노래를 크게 부르고, 인싸 찾기에서는 인싸의 춤 동작을 다른 학생들이 따라 하며 노래가 끝나기 전에 술래가 대상을 찾는다</p>
