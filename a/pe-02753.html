<h1>초등 발야구 기본 규칙 익히기</h1>
<p>1) 투수는 다치지 않도록 적당한 거리에서 베이스를 향해 공을 굴려주고 타자는 베이스를 지날 때 찬다. 2) 찬 공을 수비수가 직접 잡거나 수비수가 공을 잡아 주자보다 먼저 베이스를 밟으면 주자는 아웃된다. 3) 수비수가 잡다가 떨어뜨린 공도 주자보다 먼저 베이스를 밟으면 아웃이 적용된다. 4) 타자가 1루, 2루, 3루를 거쳐 홈 베이스까지 한 바퀴를 돌면 1점을 획득한다.</p>
