<h1>농구 볼 핸들링 서킷 트레이닝</h1>
<p>1) 운동장에 콘 슬라럼 드리블, 양손 동시 드리블, 라켓 위 테니스공 균형 잡으며 드리블, 밸런스 쿠션 벽 패스, 매트 싯업 등 스테이션을 설치한다. 2) 모둠별로 각 스테이션에 배치되어 주어진 볼 조작 및 신체 조절 과제를 수행한다. 3) 신호에 맞춰 다음 스테이션으로 이동하며 순환 연습한다.</p>
