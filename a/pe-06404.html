<h1>토이스토리 몬스터 런 브레인 브레이크</h1>
<p>1) 화면 속 지시에 따라 길을 선택하고 이동한다.2) 장애물이 나타나면 화면 지시에 맞춰 점프(Jump), 숙이기(Duck), 피하기(Dodge), 펀치(Punch) 동작을 한다.3) 중간에 틀린 그림 찾기 미니 게임이 나오면 자세를 유지한 채 서로 다른 곳 3군데를 찾는다.4) 마지막 쿨다운 자세를 화면에 맞춰 일정 시간 유지하며 신체를 진정시킨다.</p>
