<h1>슈퍼 마리오 이것 아니면 저것 (Would You Rather?)</h1>
<p>1) 화면에 나오는 두 가지 마리오 관련 질문 중 마음에 드는 선택지를 하나 고른다.2) 오른쪽이 좋으면 오른쪽으로, 왼쪽이 좋으면 왼쪽으로 이동한다.3) 화면이 바뀌면 선택한 선택지에 배정된 운동 동작을 수행하고 중간 미니게임(레이스, 틀린그림찾기)에 참여한다.</p>
