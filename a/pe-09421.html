<h1>짐볼 맞추기 게임</h1>
<p>1) 2~3개의 큰 체조공을 사용하여 상대방을 맞히는 게임이다. 2) 공을 맞힐 때 오직 한 발만 공에 닿아야 하며, 손으로 치거나 잡는 등 다른 신체 부위 사용은 제한된다. 3) 공에 맞거나 규칙을 위반한 사람은 벽면에 있는 기터leiter(사다리)를 오르내리는 벌칙을 수행한다.</p>
