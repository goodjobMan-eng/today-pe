<h1>주사위 공 던지고 잡기 릴레이</h1>
<p>1) 반 전체를 두 모둠으로 나누고 모둠별로 3명씩 짝을 이룬 다음 순서를 정한다. 2) 출발 신호와 함께 첫 번째 순서의 짝이 주사위를 굴리고 나온 숫자만큼 공을 던지고 잡는다. 3) 주사위 숫자만큼 끝내면 출발선으로 돌아와 다음 순서의 짝에게 공을 건네준다. 4) 마지막 짝이 가장 빨리 출발선으로 돌아온 모둠이 이긴다.</p>
