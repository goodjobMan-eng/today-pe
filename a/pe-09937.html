<h1>네 구석 몸풀기 놀이 (4 코너 게임)</h1>
<p>1) 술래 1명이 가운데 훌라후프 안에서 눈을 감고 서고, 나머지 학생들은 네 모퉁이에 있는 서로 다른 색깔의 콘 뒤에 섭니다. 2) 신호에 따라 카운트다운을 하는 동안 학생들은 지정된 이동 동작(게 걸음, 곰 걸음 등)으로 원하는 콘 위치로 이동합니다. 3) 카운트다운이 끝나면 가운데 술래가 색상 하나를 지목하고, 해당 색 콘에 있는 학생들은 팔벌려뛰기 10회 등 정해진 운동을 수행합니다.</p>
