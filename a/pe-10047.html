<h1>즐겁게 할 수 있는 워밍업 게임 모음</h1>
<p>1) 2명씩 짝을 지어 출발 신호에 맞춰 지정된 콘을 하나씩 옮긴다. 2) 3곳에 콘을 삼각형 형태로 배치하고 중앙의 기준 콘에서 자기 진지로 콘을 모은다. 3) 마주 보고 서서 고정된 위치에서 '고양이와 네즈미' 신호에 따라 지정된 방향으로 도망친다. 4) 콘과 콘 사이를 약 8m 간격으로 두고 꼬리잡기 방식으로 진행한다. 5) 2인 1조로 콘을 하나 두고 '섬' 주위에서 鬼ごっこ(술래잡기)를 한다.</p>
