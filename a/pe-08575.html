<h1>스페이스볼</h1>
<p>1) 3명의 플레이어가 지구(중앙 원)에 들어가 폼볼 미사일을 바깥으로 던집니다. 2) 바깥의 위성 플레이어들은 시계 반대 방향으로 이동하며 미사일을 피합니다. 3) 공에 맞은 위성 플레이어는 앉아야 하며, 수리 셔틀(스쿠터 탄 플레이어)이 구해주어야 합니다.</p>
