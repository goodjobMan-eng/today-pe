<h1>대왕닷지비 점수제 피구</h1>
<p>1) 양 팀으로 나누고 경기장 경계 없이 전체 영역을 활용한다.2) 대왕 닷지비 디스크를 던져 상대를 맞히거나 패스하며 점수를 겨룬다.3) 닷지비를 잡은 사람은 이동할 수 없다.4) 던진 닷지비가 손에서 떠난 뒤 상대 몸에 맞아도 잡으면 아웃되지 않는다.</p>
