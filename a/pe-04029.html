<h1>축구 드리블 프리즈</h1>
<p>1) 음악이 나오는 동안 발만 사용하여 축구공을 드리블하며 자유롭게 움직인다. 2) 이동할 때 다른 사람과 부딪히지 않도록 공을 통제하며 공간을 활용한다. 3) 교사가 'Freeze' 신호를 주거나 음악이 멈추면 즉시 움직임을 멈추고 발로 공을 밟아 트래핑한다. 4) 음악이 다시 시작되면 다시 드리블을 이어간다.</p>
