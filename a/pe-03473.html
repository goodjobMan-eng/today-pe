<h1>30점을 향해</h1>
<p>1) 6명이 한 모둠을 이루고 모둠 안에서 다트 던질 순서를 정합니다. 2) 모둠별로 한 명씩 순서대로 다트판을 향해 다트를 던집니다. 3) 다트판에 적힌 숫자를 확인하여 모둠원이 얻은 점수를 모두 합산합니다. 4) 정확히 30점을 먼저 만든 모둠이 이기며, 30점을 넘으면 마지막에 던진 점수는 무효 처리되어 다시 던집니다.</p>
