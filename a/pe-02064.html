<h1>골볼 공 옆으로 굴리기</h1>
<p>1) 골볼 공에 익숙해지도록 손으로 만지며 공을 탐색한다. 2) 양다리를 어깨너비의 2배 정도 벌리고 서서 허리를 숙여 손을 아래로 뻗는다. 3) 다리 앞에 골볼 공을 놓고 양손으로 든다. 4) 공을 양손으로 잡고 좌우로 크게 흔들다가 팔을 이동할 때 손에서 놓아 굴린다.</p>
