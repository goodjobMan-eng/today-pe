<h1>모둠 친구와 전략을 탐색하며 배드민턴형 게임</h1>
<p>1) 2명씩 짝이 되어 두 모둠이 대각선 코트로 서브하며 경기를 시작한다.2) 서브 시 점수가 0이거나 짝수면 오른쪽, 홀수면 왼쪽 코트에서 서브하고 득점하면 좌우 코트를 바꾸어 서브했던 사람이 다시 서브한다.3) 셔틀콕을 받지 못하거나 네트에 걸림, 코트 이탈, 신체·라켓 넘김, 네트 넘어오기 전 접촉, 2회 이상 연속 타구 시 실점하며 15점 3세트로 진행한다.</p>
