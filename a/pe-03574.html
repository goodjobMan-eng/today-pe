<h1>배드민턴 경기 및 서비스 규칙</h1>
<p>1) 토스를 통해 첫 서브권과 코트를 결정하며, 단식은 1대1, 복식은 2대2로 진행한다. 2) 한 게임 21점을 선취하면 승리하며, 20대 20 동점 시 2점 차가 날 때까지 진행한다(29대 29 시 30점 선점 팀 승리). 3) 서버의 점수가 0과 짝수이면 우측, 홀수이면 좌측 코트에서 대각선으로 서비스한다. 4) 서브할 때 셔틀 전체가 코트 바닥으로부터 1.15미터 아래에 위치해야 하며 서비스 라인을 밟지 않는다.</p>
