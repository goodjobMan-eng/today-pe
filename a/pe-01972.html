<h1>축구 종합 기능 10대 게임 모음</h1>
<p>1) 강당이나 운동장에 콘으로 구역을 나누고 도둑 술래잡기, 서클 패스, 핀볼 축구 등 10가지 활동을 배치한다. 2) 학생들은 모둠별로 스테이션을 돌며 볼 킵핑, 원터치 패스, 타깃 킥을 단계별로 실습한다. 3) 콘을 맞히거나 상대 볼을 라인 밖으로 차내며 모둠 점수를 획득한다. 4) 공의 종류를 폼볼, 럭비공, 주사위공 등으로 바꾸거나 술래 인원을 늘려 난이도를 조절한다.</p>
