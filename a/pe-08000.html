<h1>콘 잡기 게임 (The Cone Game)</h1>
<p>1) 바닥에 놓인 콘에 발가락을 댄 뒤 뒤로 두 걸음 물러서서 마주 본다. 2) 교사가 부르는 신체 부위(머리, 어깨, 무릎 등)에 양손을 차례대로 얹는다. 3) 교사가 '콘(Cone)'을 외치는 순간 상대보다 먼저 콘을 집어 들어 올린다.</p>
