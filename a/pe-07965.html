<h1>로봇 조종 놀이</h1>
<p>1) 한 모둠에 3명이 되어 1명은 정비공, 2명은 로봇 역할을 맡는다. 2) 정비공이 로봇의 머리를 터치하면 출발하고, 오른쪽 어깨는 우회전, 왼쪽 어깨는 좌회전, 등은 후진, 다시 머리를 터치하면 정지한다. 3) 로봇들은 오직 일정한 로봇 걸음걸이로만 천천히 이동해야 한다. 4) 서로 다른 경로로 이동하던 두 로봇의 손바닥이 서로 닿으면 센서가 작동하여 자동으로 전원이 꺼지며 성공한다.</p>
