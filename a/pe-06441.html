<h1>그물 술래와 기어가는 동물 놀이</h1>
<p>1) 술래는 그물을 들고 이동하며, 학생들은 바닥에 엎드려 뱀, 도마뱀, 사자처럼 기어 다니며 도망친다.2) 술래가 다가와 그물을 덮어씌워 참가자를 잡는다.3) 그물에 잡히지 않은 다른 친구들이 기어가서 잡힌 친구를 구출해 준다.</p>
