<h1>축구 기초 기술 익히기(패스·트래핑·슈팅·드리블)</h1>
<p>1) 디딤발을 공 옆에 두고 발 안쪽으로 정확하게 밀어 차는 인사이드 패스를 연습한다. 2) 날아오거나 굴러오는 공의 뒤로 이동해 발바닥, 발등, 무릎, 가슴 등으로 공을 받아 멈춘다. 3) 도움닫기 후 발등(신발 끈 부위)으로 골대 구석을 향해 강하게 슈팅한다. 4) 발 안쪽과 바깥쪽, 발바닥을 활용해 공을 몸 가까이 두며 방향을 바꿔 드리블한다.</p>
