<h1>물고기 잡기 어부 술래잡기</h1>
<p>1) 구역을 만들고 가운데 콘으로 그물이 좌우로 활동할 구역을 표시한다. 2) 신호에 맞춰 구역 끝에서 끝까지 달려서 통과하며, 통과하는 중에 그물에 걸리면 그물이 되어 손을 잡고 좌우로 움직인다. 3) 구역을 조금씩 넓혀서 도망갈 수 있는 공간을 만들어 준다. 4) 최후의 2~3인은 다음 판 그물이 된다.</p>
