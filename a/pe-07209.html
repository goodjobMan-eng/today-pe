<h1>수족구(손발공) 게임</h1>
<p>1) 각 팀에서 손을 사용할 수 있는 사람을 미리 정하고 2대2로 코트에 선다 2) 지정된 사람은 손과 발을 모두 쓰고 다른 선수는 발과 머리만 사용한다 3) 코트 안에서 바운드는 1회만 허용되며 3회 이내에 상대 코트로 넘긴다 4) 상대편으로 공을 넘길 때는 손을 쓸 수 없으며 반드시 발이나 머리로만 넘긴다 5) 5점을 먼저 내는 팀이 승리하며 4대4 동점 시 2점 차 듀스 규칙을 적용한다</p>
