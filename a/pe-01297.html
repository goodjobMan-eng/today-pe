<h1>순발력 가위바위보 순발력 대결</h1>
<p>1) 두 사람이 마주 보고 서거나 앉아 다양한 규칙(만세, 손등 터치, 풍선 뺏기/막기) 중 하나를 선택합니다. 2) 가위바위보 신호에 맞춰 동시에 손동작을 내밀고 승패를 순간적으로 판단합니다. 3) 승자는 손등 터치나 풍선 공격 등 정해진 순발력 미션을 행하고 패자는 손등 방어나 책으로 가드를 올립니다. 4) 덧셈 암산, 거꾸로 만세 외치기, 손가락 젓가락 놀이 등 인지적 조건을 더해 난도를 높입니다.</p>
