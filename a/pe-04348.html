<h1>나 홀로 집에 런 브레인 브레이크</h1>
<p>1) 케빈이 되어 집을 지키기 위해 집 안을 달리며 트랩을 점검한다. 2) 지하실 트랩을 점검하며 화로를 뛰어넘고 떨어지는 다리미를 피하며 계단을 쿵쿵 오르고 못을 피해 웅크린다. 3) 1층에서는 장난감 차를 뛰어넘고 불꽃을 피해 숙이며 깨진 장식품을 피하고 깃털을 쳐낸다. 4) 퀴즈가 나오면 정답에 해당하는 동작을 따라 해 선택하고 위층 트랩을 점검한 뒤 짚라인에 매달린다.</p>
