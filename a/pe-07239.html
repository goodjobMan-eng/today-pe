<h1>앞구르기 전 기초 말 걷기</h1>
<p>1) 손바닥을 활짝 펴서 바닥에 짚고 팔꿈치와 무릎을 곧게 편다. 2) 엉덩이(골반)를 높게 들어 올린 사족보행 자세(말 걷기)를 취한다. 3) 구르지 않고 네 발로 바닥을 짚으며 앞으로 천천히 걸어 나간다. 4) 걸어가는 도중 배꼽을 바라보며 등을 둥글게 말아 자연스럽게 몸이 앞으로 굴러가도록 연결한다.</p>
