<h1>배드민턴 복식 경기 규칙 익히기</h1>
<p>1) 경기 시작 전 토스로 서브 순서를 정한다. 2) 서버 팀 점수가 0점 또는 짝수일 때는 우측 구역에서, 홀수일 때는 좌측 구역에서 대각선 서비스 구역으로 넣는다. 3) 서브 시 셔틀콕은 지면으로부터 1.15m 이하의 높이에서 라켓으로 쳐서 넘긴다. 4) 랠리 중 셔틀콕이 상대편 코트 안에 떨어지면 득점하고, 라인 밖으로 나가거나 네트에 걸리면 실점한다.</p>
