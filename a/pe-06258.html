<h1>매트 위 유연성 향상 스트레칭</h1>
<p>1) 매트 위에 다리를 곧게 펴고 앉아 발목을 플렉스 및 포인 동작으로 당기고 보낸 뒤 안팎으로 돌린다.2) 상체를 숙여 두 손으로 발을 잡고 유지한 뒤 두 발을 마주 보아 잡고 나비 자세로 무릎을 위아래로 움직인다.3) 한쪽 다리씩 번갈아 벌려 상체를 숙이고, 양다리를 벌린 후 상체를 앞으로 숙여 늘려준다.4) 엎드린 상태에서 상체를 들어 올린 뒤 두 다리를 접어 양손으로 발등을 잡고 하늘 방향으로 들어 올린다.</p>
