<h1>공을 빼앗아라 게임</h1>
<p>1) 바닥에 경기장을 그리고 출발선과 목표 지점을 표시한 뒤 공격 모둠과 수비 모둠으로 나눈다. 2) 공격 모둠은 공 몰기나 공 이어주기를 하며 목표 지점으로 이동하고 모둠원은 1번 이상 공을 가져야 한다. 3) 수비 모둠은 공격 모둠의 공을 빼앗고, 빼앗기면 출발 지점으로 돌아가 다시 시작한다. 4) 공격 모둠이 목표 지점에 도착하면 1점, 수비 모둠이 공을 빼앗으면 1점을 얻으며 정해진 시간 동안 공수를 교대한다.</p>
