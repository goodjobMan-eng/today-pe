<h1>넷볼 슛 측정</h1>
<p>1) 골대(높이 3m 5cm)를 기준으로 90cm 거리의 좌측(가), 정면(나), 우측(다) 3개 지점을 표시한다. 2) 원핸드 슛 또는 투핸드 슛으로 가 지점에서 첫 번째 슛을 던진다. 3) 슛을 성공해야만 다음 지점(가→나→다)으로 이동할 수 있으며, 실패하면 들어갈 때까지 같은 지점에서 다시 슛을 한다. 4) 1분 동안 가, 나, 다 지점을 차례로 돌며 골대에 성공한 총 슛 개수를 측정한다.</p>
