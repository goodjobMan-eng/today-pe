<h1>공으로 풍선 띄우기 1~4단계 놀이</h1>
<p>1) 1단계는 손에 쥔 공으로 풍선을 연속 3회 위로 쳐올려 띄운다. 2) 2단계는 풍선을 친 뒤 공을 몸 뒤로 한 바퀴 돌려 다시 풍선을 친다. 3) 3단계는 친 후 양다리 사이 안팎으로 공을 넘기며 치고, 4단계는 풍선을 친 뒤 공을 공중에 던져 잡으며 풍선을 띄운다.</p>
