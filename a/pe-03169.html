<h1>동물 달리기 놀이</h1>
<p>1) 출발선 앞에 네 명씩 열을 지어 줄을 선다. 2) 출발 신호가 울리면 첫 번째 구간에 정해진 동물을 확인하고 그 동물의 걸음걸이를 흉내 내며 달린다. 3) 구간이 바뀌면 바뀐 구간의 동물 걸음걸이에 맞게 걸음을 바꾸어 달린다. 4) 도착점에 도착하면 큰 목소리로 '도착'을 외치고, 네 명이 모두 들어가면 다음 조가 출발한다.</p>
