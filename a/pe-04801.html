<h1>변형 보물 옮기기 릴레이</h1>
<p>1) 신호가 울리면 출발선에서 물건을 머리 위로 하나씩 뒤로 패스하여 전달한다.2) 물건을 넘겨받아 가진 사람만 뒤쪽 원마커 구간으로 이동해 다음 주자에게 전달한다.3) 마지막 주자까지 연결해 보물을 모두 옮겨 점보택(콘) 성을 무너뜨리지 않고 완성하면 승리한다.</p>
