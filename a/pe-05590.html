<h1>온몸 제로 배틀</h1>
<p>1) 짝과 가위바위보를 하여 이긴 사람이 먼저 공격자가 됩니다.2) 둘 다 제자리 점프를 두 번 뛴 후 앉거나 서는 동작을 취합니다.3) 공격자는 점프에 맞춰 '제로', '하나', '둘' 중 숫자를 외칩니다.4) 앉은 사람의 총 인원수와 공격자가 부른 숫자가 일치하면 공격자가 1점을 얻습니다.5) 수비자가 방어하면 공격권이 넘어가며, 3점을 먼저 내면 승리하고 새로운 짝과 대결합니다.</p>
