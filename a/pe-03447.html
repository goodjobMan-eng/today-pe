<h1>방 탈출 달리기</h1>
<p>1) 6명이 한 모둠을 이루고 달리는 순서를 정한다. 2) 모둠별로 한 명씩 게임장 주변을 천천히 달린다. 3) 선생님이 색상을 외치면 경기장의 원마커를 밟고 빠르게 방향을 전환하여 가장 가까이 놓인 콘으로 달려간다. 4) 상대 모둠보다 먼저 콘을 터치하면 점수를 얻으며, 모든 모둠원이 게임을 진행하여 가장 높은 점수를 얻은 모둠이 이긴다.</p>
