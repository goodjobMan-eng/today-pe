<h1>늑대 아저씨 (Mr Wolf)</h1>
<p>1) 학생들은 숲 가장자리(안전 구역)에서 대기하고 교사(늑대)는 반대편에 선다2) 학생들이 &quot;늑대 아저씨 지금 몇 시예요?&quot;라고 외치면 늑대가 말한 시간만큼 앞으로 걸어간다(예: 4시면 4걸음)3) 늑대가 &quot;점심시간(Lunchtime)!&quot;이라고 외치면 학생들은 태그되지 않도록 숲 가장자리로 도망친다4) 잡힌 학생은 늑대가 되어 함께 잡거나, 그 자리에 멈춰 잠자는 늑대가 되어 다음 점심시간에 도망치는 학생을 태그한다</p>
