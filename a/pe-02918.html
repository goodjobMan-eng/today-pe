<h1>주사위 몰키 놀이</h1>
<p>1) 교실 바닥에 숫자가 적힌 라바콘들을 불규칙하게 세워 두고 목표 점수(50점)를 정한다. 2) 투구선에서 차례대로 폼 주사위를 굴리거나 던져 라바콘을 쓰러뜨린다. 3) 쓰러진 라바콘에 적힌 숫자와 주사위의 눈 숫자를 더해 팀 점수에 누적하고 콘을 다시 세운다. 4) 목표 점수에 정확히 먼저 도달한 팀이 승리하며, 목표 점수를 초과하면 점수가 절반으로 줄어든다.</p>
