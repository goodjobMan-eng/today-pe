<h1>전략 빙고 농구 경기와 리바운드 박스아웃</h1>
<p>1) 코트에 표시된 16개 위치의 개인 기술 미션을 수행하며 가로, 세로, 대각선 중 한 줄 빙고를 완성한다. 2) 5~8명이 팀을 이루어 1분 동안 두 개의 공으로 슛을 시도하고 공이 바닥에 떨어지기 전에 리바운드하여 패스한다. 3) 빙고판에 적힌 플레이 과제(스크린, 속공, 리바운드 등)를 경기 중 팀원들과 성공시켜 빙고 줄을 완성하고 점수를 얻는다.</p>
