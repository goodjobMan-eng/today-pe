<h1>탁구 리프팅 6종 세트 챌린지 및 릴레이</h1>
<p>1) 정식 규격 탁구대에서 6가지 탁구 리프팅 미션 과제를 순서대로 도전한다. 2) 6인 1조 서바이벌 방식으로 진행하여 미션 수행 도중 실패하면 탈락하고 끝까지 살아남는 1인이 승리한다. 3) 팀전으로 진행할 경우 6명이 한 팀이 되어 탁구 라켓과 공을 배턴 삼아 각 단계 미션을 릴레이로 수행한다. 4) 팀전 릴레이 제한 시간은 99초이며 실패 시 1단계 또는 실패한 단계부터 다시 도전하여 완료한다.</p>
