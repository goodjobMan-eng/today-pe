<h1>동물 탐험 자세 키즈 요가 밸런스</h1>
<p>1) 바닥에 매트를 펴고 편안하게 서서 호흡 정리와 기본 관절 스트레칭을 진행한다. 2) 등을 둥글게 말고 펴는 고양이 자세와 어깨를 열어주는 트위스트 자세로 척추를 부드럽게 푼다. 3) 힙 킥과 버드독 자세로 코어 중심을 잡은 뒤 다운독과 삼각 자세, 반달 자세로 균형을 잡는다. 4) 버티는 시간을 5초에서 10초로 늘리거나 짝과 호흡을 맞추며 연결 동작을 완성한다.</p>
