<h1>꼬리를 지키는 원형 방패놀이</h1>
<p>1) 3~5명의 팀원이 서로 손을 잡고 둥글게 원형 방패 대형을 만든다. 2) 팀원 중 1명이 허리에 꼬리끈을 달거나 팀 조끼를 입어 타깃이 된다. 3) 원 바깥의 술래는 방패를 피해 원 안쪽 꼬리를 달고 있는 팀원을 터치하려고 시도한다. 4) 방패 팀원들은 손을 놓치지 않고 방향을 바꾸며 술래를 가로막고, 꼬리가 터치되거나 손을 놓치면 술래와 역할을 바꾼다.</p>
