<p>1) 두 팀이 양 끝에서 숫자 원마커를 밟으며 이동하다가 마주치면 가위바위보를 한다.2) 진 사람은 옆 원마커로 나와 앉아 있는다.3) 뒤에 출발한 같은 팀 친구가 앉아 있는 친구의 머리를 터치하면 살아난다.4) 상대방 징검다리 마지막 판을 먼저 밟는 팀이 승리한다.</p>
