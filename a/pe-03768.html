<h1>저학년 매트 요람 흔들기 놀이</h1>
<p>1) 매트 위에 앉아 무릎을 안고 등을 둥글게 만 채 턱을 당겨 뒤로 굴렀다 일어난다. 2) 익숙해지면 손을 떼고 다리를 뻗어서 구르는 요람 동작을 해 본다. 3) 무릎을 순간적으로 끌어당겨 회전 속도를 높이는 동작을 경험한다. 4) 뒤로 젖혀졌을 때 양손으로 매트를 짚고 살짝 밀어내며 지지하는 동작을 놀이로 연습한다.</p>
