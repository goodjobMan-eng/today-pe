<h1>핫 샷 슛 앤 테이크 게임</h1>
<p>1) 농구 코트에 여러 개의 원마커를 배치하고 5명 이하로 모둠을 구성하여 일렬로 선다. 2) 차례가 된 첫 번째 주자가 원하는 위치의 원마커로 이동하여 슛을 시도한다. 3) 슛을 성공하면 해당 원마커를 가져와 모둠 위치에 쌓고 공을 다음 주자에게 넘긴다. 4) 슛을 실패하면 원마커를 그대로 두고 공만 주워 다음 주자에게 패스한 뒤 줄 맨 뒤로 돌아간다.</p>
