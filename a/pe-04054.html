<h1>양궁 기초 활 쏘기</h1>
<p>1) 화살통을 마주보고 서서 활을 든 어깨를 표적 방향으로 향한다. 2) 화살의 다른 색 깃이 위쪽(바깥쪽)을 향하도록 시위에 끼운다(노킹). 3) 세 손가락(화살 위 1개, 아래 2개)으로 시위를 걸어 잡는다. 4) 조준하고 시위를 당긴 후 손가락을 놓아 화살을 발사한다.</p>
