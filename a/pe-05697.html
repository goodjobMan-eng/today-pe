<h1>농구 목표 숫자 맞히기 자유투 게임</h1>
<p>1) 교사가 목표 숫자(예: 30, 15)를 하나 제시한다.2) 참가자는 자유투를 던져 골을 성공시킬 때마다 정해진 점수(숫자)를 획득한다.3) 획득한 숫자들을 사칙연산(더하기, 빼기, 곱하기, 나누기)으로 자유롭게 조합한다.4) 연산 결과가 교사가 정해준 목표 숫자와 정확히 일치하도록 수식을 먼저 완성한 팀이 승리한다.</p>
