<h1>브렌발 변형 게임 모음</h1>
<p>1) 외곽 주자 팀이 공을 경기장 안으로 던지고 매트(안전 구역)를 거쳐 장애물 코스를 최대한 달린다. 2) 중앙 팀은 패스로 공을 연결해 중앙 상자에 공을 던져 넣는다. 3) 공이 상자에 들어가면 매트 위에 있지 않은 주자는 모두 아웃 처리된다.</p>
