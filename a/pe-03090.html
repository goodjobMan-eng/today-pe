<h1>스쿼트 100개 챌린지</h1>
<p>1) 발을 어깨너비보다 살짝 넓게 벌리고 발끝을 약간 바깥쪽을 향하게 선다. 2) 엉덩이를 뒤로 빼며 무게중심을 뒤꿈치에 두고 허벅지가 바닥과 평행이 될 때까지 앉는다. 3) 복근과 다리에 힘을 주며 일어서서 기본자세로 돌아온다. 4) 10회씩 10단계를 끊어서 수행하며 총 100회 스쿼트에 도전한다.</p>
