<h1>제자리 대장을 찾아라</h1>
<p>1) 교실 책상을 모두 안쪽을 향하도록 돌려 원형 대형을 만들고, 탐정 두 명을 정해 교실 밖으로 잠시 내보냅니다. 2) 탐정이 나가 있는 사이 교실 안에서 몰래 대장 한 명을 뽑습니다. 3) 탐정이 교실 가운데로 들어오면 음악에 맞춰 대장이 다양한 신체 동작을 시작하고 나머지 학생들은 대장의 동작을 따라 합니다. 4) 탐정은 학생들의 움직임을 관찰하여 음악이 끝난 뒤 누가 대장인지 찾아냅니다.</p>
