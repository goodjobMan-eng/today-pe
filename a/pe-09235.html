<h1>공포의 강 건너기</h1>
<p>1) 활동 구역을 정하고 2팀으로 나눕니다. 2) 공격 팀은 공을 굴리고, 익숙해지면 던집니다. 3) 수비 팀은 정해진 시간 또는 횟수 안에 반대편의 안전지대로 공을 피해서 건너갑니다. 4) 공에 맞으면 상대팀에게 맞은 수 만큼 점수를 주게 됩니다. 5) 공포의 강을 몇 번 건너는 것을 할 지 정하고 시작합니다. 6) 정해진 시간이나면 공격과 수비의 역할을 바꾸어서 대결합니다.</p>
