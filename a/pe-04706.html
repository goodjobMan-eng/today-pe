<h1>쿠키 항아리 채우기</h1>
<p>1) 두 팀으로 나누고 중앙 경계선과 매트로 세운 쿠키 항아리를 설치한다. 2) 항아리 안에 들어간 학생들은 들어오는 공(쿠키)을 다시 밖으로 던져낸다. 3) 공격 팀 학생들은 신호에 맞춰 공을 주워 쿠키 항아리 속으로 오버핸드 스로로 던져 넣는다. 4) 항아리 진영 수비 학생들은 던져진 공을 공중에서 잡아 방어할 수 있다.</p>
