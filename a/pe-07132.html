<h1>운동회 박 터트리기(오노미나게) 필승법</h1>
<p>1) 바구니 기둥에서 약 1미터 떨어진 위치에 선다 2) 바구니 테두리 림 부위를 조준한다 3) 무릎을 굽혔다 펴면서 양손으로 공을 감싸 쥐고 위로 똑바로 던진다 4) 한 번에 공 2~3개를 세로로 쥐고 연속해서 던진다 5) 던지기 담당과 공을 주워 모아주는 역할로 역할을 분담하여 진행한다</p>
