<h1>접시콘 할리갈리와 접시콘 정리 게임</h1>
<p>1) 교사가 색깔 순서와 방향을 정해 펼쳐놓은 접시콘 배열을 확인한다. 2) 출발선에서 달려가 한 번에 하나씩 접시콘을 가져와 교사가 제시한 것과 똑같은 색깔과 모양으로 바닥에 완성한다. 3) 난이도를 높여 접시콘을 뒤집어 놓거나 머리 위에 접시콘 모자를 얹고 떨어뜨리지 않으며 이동하여 완성한다. 4) 팀별로 빨강·노랑, 파랑·초록 등 지정된 두 가지 색깔의 접시콘을 한 색깔씩 차례대로 빠르게 모아 정리하는 시합을 진행한다.</p>
