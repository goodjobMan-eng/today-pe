<h1>공 차기와 멈추기</h1>
<p>1) 공을 끝까지 보면서 모둠원의 위치를 향해 공을 찬다. 2) 공이 굴러가는 방향으로 발을 살짝 빼거나 발 안쪽으로 대듯이 공을 받아 멈춘다. 3) 이동할 때는 모둠원의 이동 방향에 맞추어 공을 찬다. 4) 공을 멀리 찰 때는 공 옆에 디딤발을 딛고 무릎을 구부렸다 펴면서 찬다.</p>
