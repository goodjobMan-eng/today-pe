<h1>신호등 드리블</h1>
<p>1) 5명이 한 모둠을 이루고 공격 모둠과 수비 모둠으로 나눕니다. 2) 공격 모둠은 드리블하며 빨간색, 노란색, 초록색 순서대로 원마커를 밟고 득점 영역으로 이동합니다. 3) 수비 모둠은 공격 모둠의 손에서 공이 벗어날 때만 공을 빼앗을 수 있으며 공을 빼앗긴 공격 모둠원은 아웃됩니다. 4) 공격과 수비의 역할을 번갈아 하고 득점 영역에 도착한 모둠원이 많은 모둠이 이깁니다.</p>
