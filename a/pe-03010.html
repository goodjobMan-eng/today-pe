<h1>공 3개 저글링</h1>
<p>1) 오른손에 공 2개, 왼손에 공 1개를 잡고 준비한다. 2) 먼저 오른손 공을 던지고 반대편 손 공을 던지며 순서대로 던지고 받기를 반복한다. 3) 연습할 때는 '던지고 던지고 받고 받고'를 소리 내어 말하며 타이밍을 익힌다. 4) 왼손이 공을 받으러 갈 때 공을 쫓아가지 말고 기다렸다가 던지고 받는다.</p>
