<h1>가정형 신체활동 루틴(DAY-20)</h1>
<p>1) 팔을 앞으로 뻗은 상태에서 양발을 번갈아 차는 심폐지구력 운동을 실시한다. 2) 사이드스텝으로 이동 후 빈백을 반대편으로 옮기는 운동을 한다. 3) 한 발로 균형을 잡고 서서 허리를 축으로 공을 원 모양으로 돌린다. 4) 다리를 들어 발의 안쪽과 바깥쪽을 손으로 터치하며 이동하는 운동을 반복한다.</p>
