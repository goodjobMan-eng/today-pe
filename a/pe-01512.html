<h1>반복 옆뛰기 콘 터치 트레이닝</h1>
<p>1) 중앙 출발선과 좌우에 접시콘을 일정한 간격(약 1~1.5m)으로 일렬 배치하고 중앙 바구니에 마커를 둔다. 2) 사이드 스텝으로 신속하게 이동하며 중앙의 마커를 집어 양옆의 콘에 하나씩 올려놓는다. 3) 다시 사이드 스텝으로 이동하며 양옆 콘에 놓인 마커를 수거하여 중앙 바구니로 되돌려 놓는다. 4) 마커 개수를 늘리거나 짝과 마주 보며 동시에 거울 모드로 스텝 대결을 펼치는 방식으로 변형한다.</p>
