<h1>운동장 바이애슬론 달리기</h1>
<p>1) 출발 신호에 맞춰 지정된 원형 트랙을 한 바퀴 달린다. 2) 원 밖 또는 사격 지점으로 이동해 준비된 공을 표적을 향해 던진다. 3) 표적에 맞히지 못했을 경우 다시 달려 한 바퀴를 더 돌고 와서 사격에 재도전한다. 4) 1등, 2등 등 순위가 나올 때까지 달리기와 사격을 계속 반복한다.</p>
