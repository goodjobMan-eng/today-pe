<h1>매트 위 마지막 생존자 (밀어내기)</h1>
<p>1) 바닥에 두꺼운 매트를 깔고 안전을 위해 주변에도 보조 매트를 덧댄다. 2) 여러 명의 학생이 무릎을 꿇거나 낮은 자세로 매트 위에 함께 올라간다. 3) 상대를 잡고 밀거나 당겨서 매트 밖으로 밀어낸다. 4) 발이나 몸이 매트 밖 바닥에 닿으면 탈락하며 끝까지 매트 위에 남은 최후의 1인이 승리한다.</p>
