<h1>발리킥 패스 및 슈팅 연습</h1>
<p>1) 짝이 손으로 공을 살짝 띄워 던져준다.2) 디딤발을 차려는 방향(받는 사람)으로 정확히 향한다.3) 발목을 단단히 고정하고 발 안쪽(인사이드)으로 띄운 공을 맞춰 바로 패스한다.4) 발등(인스텝)으로 찰 때는 발가락을 곧게 뻗어 발목을 고정한 뒤 정면으로 차낸다.5) 좌우 양발로 번갈아 가며 연습한다.</p>
