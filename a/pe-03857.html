<h1>롤리팝 태그 놀이</h1>
<p>1) 각자 핀 1개, 누들 1개, 빈백 1개를 준비한다. 2) 빈백을 핀 위에 산타 모자처럼 올려 균형을 잡는다. 3) 다른 사람의 몸은 치지 않고 오직 핀과 빈백만 누들로 찌르거나 태그한다. 4) 빈백을 손으로 만지거나 바닥에 떨어뜨리면 아웃되어 안전하게 자기 자리로 돌아가 대기한다.</p>
