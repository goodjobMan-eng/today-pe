<h1>간이 컬링</h1>
<p>1) 4명이 한 모둠을 이루고 두 모둠이 게임을 하며 모둠별로 공을 굴리는 순서를 정합니다. 2) 가위바위보를 하여 이긴 모둠이 먼저 원 중앙으로 공을 굴리며 두 모둠이 번갈아가며 공을 굴립니다. 3) 공을 굴려 다른 모둠의 공을 밀어낼 수 있습니다. 4) 모든 모둠원이 공을 굴린 후 원 중앙에 가까이 위치한 공의 개수가 많은 모둠이 이깁니다.</p>
