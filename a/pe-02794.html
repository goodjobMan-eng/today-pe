<h1>사각형 배구 게임</h1>
<p>1) 배구 경기장을 4개 구역으로 나누어 우리 구역과 상대 3곳 구역을 정한다. 2) 언더핸드 서브나 오버핸드 서브로 공을 쳐서 경기를 시작한다. 3) 3번 안에 공을 쳐서 우리 구역을 제외한 상대편 세 군데 구역 중 한 곳으로 공을 넘긴다. 4) 수비수가 없거나 받기 어려운 빈 곳으로 공을 전략적으로 넘겨 경기한다.</p>
