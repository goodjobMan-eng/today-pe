<h1>테니스 공을 활용한 어린이 피트니스 운동</h1>
<p>1) 준비된 테니스 공을 양손에 들고 상체를 숙이거나 팔을 올리며 스트레칭을 한다. 2) 바닥에 공을 두고 발로 고정한 채 상체를 숙였다 펴는 운동을 한다. 3) 바닥에 앉아서 다리 사이에 공을 두고 상체와 다리를 움직이는 근력 운동을 한다.</p>
