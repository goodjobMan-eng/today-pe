<h1>파틴테로(필리핀 전통 놀이)</h1>
<p>1) 수비수는 각자 정해진 선 위에서만 움직인다. 2) 공격수는 수비수의 터치를 피해 모든 선을 통과하여 반대편 끝까지 갔다가 다시 돌아와야 한다. 3) 수비수에게 터치당하면 탈락하며, 공격수가 끝까지 갔다가 돌아오면 탈락한 팀원을 부활시킨다.</p>
