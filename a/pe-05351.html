<h1>램프샷 (Ramp Shot)</h1>
<p>1) 4명의 플레이어가 투수, 리시버, 스틸러 등으로 나뉘어 경기를 진행한다.2) 공을 던져 경사판 상단의 그물망에 들어가면 3점을 획득한다.3) 공이 경사판에 맞고 튕겨 나온 것을 팀 리시버가 바닥에 닿기 전에 잡으면 1점을 획득한다.4) 상대 팀 스틸러가 경사판에서 튕겨 나온 공을 바닥에 닿기 전에 가로채 잡으면 다음 라운드에 추가 투구권을 얻는다.5) 먼저 21점에 도달하는 팀이 승리한다.</p>
