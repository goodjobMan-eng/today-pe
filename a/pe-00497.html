<h1>뜀틀 옆 넘기 연습</h1>
<p>1) 뜀틀을 정면으로 다리 벌려 넘기 전 두려움을 줄이기 위해 옆으로 뛰어넘는 기초 보조 활동을 준비합니다. 2) 뜀틀 양옆 방향으로 손을 짚고 발구름판을 굴러 엉덩이를 높이 들며 몸을 밀어 넘깁니다. 3) 착지 매트 위로 안전하게 착지한 뒤 출발 위치로 돌아옵니다. 4) 좌우 신체 균형을 맞추기 위해 손을 반대 방향으로 짚고도 동일하게 뛰어넘는 연습을 반복합니다.</p>
