<h1>디스크 골프 (디스캐처 목표 던져 넣기)</h1>
<p>1) 출발선인 티(Tee) 지점에서 목표물인 디스캐처를 향해 플라잉디스크를 던져 넣는 골프형 활동입니다. 2) 첫 번째 티 드로우 이후에는 홀(디스캐처)에서 가장 멀리 떨어진 사람부터 차례대로 다음 투구를 진행합니다. 3) 디스크가 떨어진 위치에 원마커를 놓아 기준을 정하며, 마커를 밟거나 넘어서서 던지면 1벌타가 부여됩니다. 4) 정해진 홀을 모두 마친 뒤 던진 총 횟수가 가장 적은 사람이나 팀이 승리합니다.</p>
