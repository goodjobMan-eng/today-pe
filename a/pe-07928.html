<h1>원판 다리 만들기 놀이</h1>
<p>1) 2명씩 짝을 짓고 원판 2개를 준비한 뒤 도우미와 탐험가 역할을 정한다. 2) 도우미가 첫 번째 원판을 바닥에 놓으면 탐험가가 양발을 모아 원판 위로 뛴다. 3) 도우미가 두 번째 원판을 앞에 놓고 탐험가가 뛰면, 뒤의 원판을 다시 앞으로 옮겨 놓는다. 4) 같은 방식으로 반환점을 돌아 출발선에 도착한 뒤 서로 역할을 바꾼다.</p>
