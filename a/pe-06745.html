<h1>비접촉 교실 눈치 게임 &amp; 팝콘 게임</h1>
<p>1) 자기 자리에 앉아 눈치를 보며 1부터 숫자를 순서대로 외치며 일어난다. 2) 동시에 두 명이 일어나거나 마지막까지 숫자를 외치지 못한 학생은 스쿼트 벌칙을 수행한다. 3) 변형된 팝콘 게임에서는 앞선 학생이 일어났다가 앉으면 팝콘 튀기듯 빠르게 다음 번호가 일어난다.</p>
