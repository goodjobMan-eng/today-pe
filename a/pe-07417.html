<h1>럭키 루크</h1>
<p>1) 원으로 둘러서고 술래 한 명을 원 가운데에 정한다. 2) 술래가 원을 돌며 한 사람의 이름을 부른다. 3) 호명된 사람이 재빨리 몸을 숙이면, 그 사람의 양옆 두 사람이 서로를 향해 상대의 이름을 부르며 손총을 쏜다. 4) 더 늦게 쏜 사람이 탈락하여 앉는다. 5) 마지막 두 사람이 남으면 등을 맞대고 서서 과일 이름이 나오면 한 걸음 앞으로 가고, 채소 이름이 나오면 뒤돌아 서로를 쏜다.</p>
