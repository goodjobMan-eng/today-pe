<h1>라바콘 양발 연속 점프 순발력 훈련</h1>
<p>1) 라바콘을 뒤쪽에 좌우 2개, 앞쪽에 전방으로 3개를 일렬로 배치한다. 2) 출발선에서 양발을 모아 좌우 콘을 연속으로 점프하여 넘는다. 3) 이어서 앞쪽으로 나란히 놓인 콘들을 멈춤 없이 두 발 모아 연속으로 뛰어넘는다. 4) 점프를 마치면 대기 줄 뒤로 돌아가 다음 차례를 기다린다.</p>
