<h1>손잡고 함께 일어서기 놀이</h1>
<p>1) 두 명씩 짝을 지어 바닥에 마주 앉은 뒤 양 발끝을 맞대고 서로의 두 손을 굳게 맞잡습니다. 2) 시작 신호에 맞춰 동시에 서로의 손을 앞으로 당기며 하체에 힘을 주어 함께 일어섭니다. 3) 2명 연속 성공 시 3명, 4명, 8명 순으로 둥글게 둘러앉아 발을 모으고 도전 인원을 늘려갑니다. 4) 최종적으로 분단 전체나 학급 전원이 다 함께 원을 만들어 동시에 일어서기에 도전합니다.</p>
