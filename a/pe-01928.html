<h1>서빙 챔프 배구 서브 챌린지</h1>
<p>1) 배구 코트 네트를 기준으로 학급을 양쪽 엔드라인 뒤에 두 팀으로 나누어 정렬한다. 2) 공격 팀 전원이 배구공을 하나씩 잡고 동시에 네트 너머 상대 코트 안으로 서브를 넣는다. 3) 네트를 넘겨 상대 코트 인바운드 영역에 떨어진 공의 개수만큼 득점을 기록한다. 4) 상대 팀이 공을 모두 회수해 반대편에서 서브를 실시하며 언더핸드와 오버핸드 서브를 번갈아 적용해 20점에 먼저 도달하면 승리한다.</p>
