<h1>초등 저글링 공 던지고 받기 연습</h1>
<p>1) 공 1개를 한 손으로 위로 던져서 같은 손으로 받으며 10회 연습한다. 2) 공 1개를 양손으로 번갈아 던지고 받는 연습을 10회 실시한다. 3) 공 2개를 양손에 하나씩 쥐고 동시에 위로 던져서 제자리 손으로 받는다. 4) 공 2개를 한 손에서 반대 손으로 포물선을 그리며 교차하여 던지고 받는다. 5) 공 3개를 쥐고 양손을 교차하며 연속으로 던져 받는 기본 저글링 동작을 반복 연습한다.</p>
