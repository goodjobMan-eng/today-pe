<h1>웅덩이와 강 건너기 (허들 워밍업 게임)</h1>
<p>1) 콘을 바닥에 여러 모양으로 배치하여 크기가 작은 '웅덩이'와 '강' 구역을 만든다.2) 학생들은 구역 안을 자유롭게 돌아다니며 한 번에 한 곳씩 콘 구역을 점프하여 뛰어넘는다.3) 두 학생이 웅덩이에 동시에 도착하면 한 명이 먼저 넘을 때까지 기다려 양보한다.</p>
