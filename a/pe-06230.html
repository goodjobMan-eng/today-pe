<h1>초등 럭비 게임</h1>
<p>1) 수비수가 상대를 터치하면 아웃되며 아웃된 사람은 자기 팀이 공격권을 얻으면 자동으로 경기장에 복귀합니다.2) 공을 가진 사람은 이동할 수 없고 패스만 가능하며 7초 안에 던져야 합니다.3) 페널티 에어리어(직사각형 구역) 안에서 우리 편이 패스된 공을 직접 잡으면 득점합니다.4) 득점 후에는 중앙에서 다시 경기를 시작합니다.</p>
