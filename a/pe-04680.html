<h1>터키 헌팅</h1>
<p>1) 사냥꾼 팀은 점(도트) 위에서 공을 가지고 시작하고, 터키 팀은 중앙 구역 안에 위치한다. 2) 터키 팀은 걸어서 이동해야 하며, 사냥꾼 팀은 공을 던져 터키를 맞힌다. 3) 공에 맞으면 잡힌 것으로 처리된다. 4) 사냥꾼은 바닥의 공을 줍되 흰색 선을 넘어가 터키 구역 안으로 들어갈 수 없으며 터키도 흰색 선 안쪽에 머물러야 한다.</p>
