<h1>엔쿠엔트라 투 티에라 (안전 매트 찾기 술래잡기)</h1>
<p>1) 강당 전체 코너와 중앙 곳곳에 매트(안전지대)를 분산 배치하고 술래 2명을 선정한다. 2) 나머지 학생들은 매트 위에 올라가 대기하며 한 매트에 인원수 제한 없이 올라설 수 있다. 3) 중앙의 술래가 &quot;새로운 땅을 찾아라!&quot;라고 외치면 매트 위의 모든 학생은 다른 매트로 이동해야 한다. 4) 이동 도중 술래에게 태그된 학생은 술래로 전환되어 중앙으로 이동하며 전원이 잡힐 때까지 진행한다.</p>
