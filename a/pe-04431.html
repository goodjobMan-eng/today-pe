<h1>축구 숏터치 드리블 연습</h1>
<p>1) 일렬로 놓인 콘 라인을 따라 양발의 안쪽과 바깥쪽을 사용하여 공을 작게 터치하며 드리블한다. 2) 발끝(발가락)으로 공을 차지 않고 공을 몸 가까이에 유지한다. 3) 콘 라인 끝에 도달하면 발로 공을 멈춰 세운다. 4) 멈춘 공을 다시 반대 방향으로 작게 터치하며 출발점으로 돌아온다.</p>
