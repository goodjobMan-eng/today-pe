<h1>뜀틀 벤치를 활용한 리듬 스텝 훈련</h1>
<p>1) 긴 벤치 6개를 일정한 혹은 불규칙한 간격으로 일렬로 배치한다. 2) 1단계는 자유롭게 벤치를 넘어가며 기구에 적응한다. 3) 2단계는 벤치를 넘을 때마다 왼발로 벤치 위를 딛고 건넌다. 4) 3단계 이후 벤치 사이 바닥 접촉 횟수를 지정(3회, 2회 등)하여 리듬에 맞춰 통과한다.</p>
