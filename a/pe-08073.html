<h1>배드민턴 기본 규칙</h1>
<p>1) 단식(1대1) 또는 복식(2대2)으로 네트를 사이에 두고 마주 선다. 2) 토스로 서브권과 코트를 정한 뒤 서브로 경기를 시작한다. 3) 셔틀콕을 네트 너머 상대 코트로 쳐 넘겨 랠리를 이어간다. 4) 셔틀콕이 네트에 걸리거나 코트 밖으로 나가면 실점하며, 21점을 먼저 내는 쪽이 이긴다.</p>
