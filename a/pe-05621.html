<h1>빈백 밸런스 가위바위보</h1>
<p>1) 콩주머니(빈백)를 하나씩 잡고 머리 위, 어깨, 팔꿈치 등 허용된 신체 부위에 올린다.2) 다른 사람과 자유롭게 가위바위보 대결을 하여 이기면 바닥에서 빈백을 가져와 몸에 추가로 올린다.3) 정해진 시간이 끝난 후 몸에 빈백을 가장 많이 올리고 있는 사람이 승리한다.</p>
