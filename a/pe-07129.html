<h1>숫자 맞히기 게임 (눈치 서기 게임)</h1>
<p>1) 참가자 전원이 쪼그려 앉은 자세로 원을 이루어 준비한다. 2) 순서대로 한 사람씩 숫자를 부르면서 구호를 외치고 일어선다. 3) 호명한 숫자와 실제로 동시에 일어선 사람의 수가 일치하면 승리한다.</p>
