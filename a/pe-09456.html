<h1>터널 태그와 피구의 결합 게임</h1>
<p>1) 지정된 구역 안에서 술래(도전자)는 공을 던져 도망치는 학생들을 맞힙니다. 2) 도망치는 학생들은 세 걸음까지만 걸을 수 있으며 공을 잡거나 패스할 수 있습니다. 3) 태그(공에 맞음)된 학생은 제자리에 멈춰 서고, 다른 학생이 다가와 기어 지나가면 다시 움직일 수 있습니다.</p>
