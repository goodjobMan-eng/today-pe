<h1>기브 앤 고 (플라잉디스크 달리기 게임)</h1>
<p>1) 두 사람이 짝이 되어 한 명은 출발선에, 파트너는 앞쪽 필드에 위치한다. 2) 신호가 울리면 던지고 받기를 성공한 후, 방금 던진 사람이 파트너 앞으로 달려 나가 다시 패스를 받는다. 3) 필드 반대편 끝선까지 번갈아 전진했다가 다시 출발선으로 먼저 돌아오는 팀이 승리하며, 중간에 떨어뜨리면 체크포인트(출발선 또는 끝선)로 돌아가 다시 시작한다.</p>
