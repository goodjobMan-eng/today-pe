<h1>짐볼 피하기 블록 나르기 놀이</h1>
<p>1) 한쪽에 놓인 스펀지 블록들을 가져와 반대편 바구니에 하나씩 넣는다.2) 술래(교사)는 중간에서 큰 짐볼을 굴리거나 던져 지나가는 참가자를 맞힌다.3) 공에 맞으면 블록을 내려놓고 제자리로 돌아가거나 다시 시도한다.4) 공을 피해 모든 블록을 바구니에 무사히 옮겨 담으면 미션을 완수한다.</p>
