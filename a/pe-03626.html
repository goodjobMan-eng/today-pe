<h1>교실 농구 패스 놀이</h1>
<p>1) 조끼 팀과 안 조끼 팀으로 나눈다. 2) 같은 팀끼리 공을 패스하여 5번을 먼저 연결하면 1점을 얻는다. 3) 득점하면 공은 상대방에게 주며 패스 미스를 하거나 공을 놓치면 공격권이 넘어간다. 4) 공을 3초 이상 가지고 있으면 안 되고 일어서지 않고 이동하며 패스한다.</p>
