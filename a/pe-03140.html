<h1>밀고 당기는 애벌레 놀이</h1>
<p>1) 모둠별로 일렬로 앉아 다리를 앞으로 펴고 앞사람이 뒷사람의 발목을 손으로 잡는다. 2) &quot;영차&quot; 구호에 맞춰 무릎을 굽히며 엉덩이를 당겨 앞으로 전진한다. 3) 맨 뒤 친구가 손을 사용하여 방향을 조절하며 반환점 라바콘을 돌아온다. 4) 도중에 애벌레 대열이 끊어지면 그 자리에서 3초간 멈췄다가 다시 연결하여 출발선으로 먼저 돌아온다.</p>
