<h1>인간 지혜의 고리 (손 얽힘 풀기)</h1>
<p>1) 8~10명 정도가 동그랗게 모여 원을 만듭니다. 2) 양옆 사람과 손을 잡지 않고, 같은 사람과 양손을 모두 잡지 않는 규칙을 지키며 자유롭게 손을 교차해 잡습니다. 3) 잡은 손을 놓지 않은 채 팔을 넘거나 다리를 통과하며 엉킨 매듭을 풉니다. 4) 손이 풀려 커다란 하나의 원(또는 두 개의 원)으로 펼쳐지면 성공입니다.</p>
