<h1>농구 골대 배구</h1>
<p>1) 4명씩 모둠을 이루어 한 명은 골대 옆에 서고 나머지 3명은 줄을 서서 바라봅니다. 2) 골대 옆의 학생이 공을 줄의 첫 번째 학생에게 전달합니다. 3) 공을 받은 학생이 골대를 향해 서브나 언더핸드 타법으로 골을 넣습니다. 4) 성공 여부와 관계없이 공을 잡거나 주운 뒤 맨 뒤로 이동하고 다음 학생이 반복합니다.</p>
