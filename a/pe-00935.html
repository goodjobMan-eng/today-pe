<h1>프리덤 캐치 (감옥 탈출 패스 피구)</h1>
<p>1) 코트 한쪽에 라인으로 감옥 구역을 만들고, 일정 거리에 자유 콘을 놓으며 바닥에 폼볼을 흩어 놓습니다. 2) 술래 2~4명을 정하고, 나머지 도망자들은 술래를 피해 활동 구역을 뛰어다닙니다. 3) 술래에게 태그된 학생은 감옥 구역에 갇힙니다. 4) 자유 상태의 학생이 바닥의 폼볼을 주워 자유 콘 위치로 가서 감옥의 친구에게 패스를 던지고, 친구가 노바운드로 안전하게 캐치하면 감옥에서 탈출합니다.</p>
