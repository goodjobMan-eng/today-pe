<h1>더블더치 줄 돌리는 방법</h1>
<p>1) 두 사람이 긴 줄 두 개를 팽팽하게 마주 잡고 어깨너비보다 약간 넓은 보폭으로 선다.2) 한 사람이 두 줄 안쪽으로 반 바퀴 차이를 두고 줄을 돌리기 시작하면 맞은편 사람이 리듬을 받아 돌린다.3) 팔 전체를 휘두르지 않고 팔꿈치부터 손목까지를 활용해 몸의 중심선을 넘지 않도록 바닥에 닿는 원을 만든다.</p>
