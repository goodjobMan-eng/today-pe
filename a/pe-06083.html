<h1>풍선 공중부양 숫자 컵 포개기</h1>
<p>1) 풍선 1개와 1번부터 12번까지 적힌 숫자 컵을 준비한다.2) 풍선이 바닥에 떨어지지 않도록 손으로 계속 띄운다.3) 풍선을 띄우면서 1번부터 12번 숫자 컵을 1번이 맨 밑, 12번이 맨 위로 가도록 차례대로 포갠다.4) 풍선이 바닥에 떨어지면 컵을 다시 펼쳐 놓고 처음부터 다시 도전한다.</p>
