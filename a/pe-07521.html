<h1>미술관의 조각상(LES STATUES AU MUSÉE)</h1>
<p>1) 참가자들은 원을 만들고 안대로 눈을 가리며, 원 중앙에 조각상 역할과 설명자 역할 2명이 위치합니다. 2) 조각상이 원하는 자세를 취하면, 설명자는 조각상의 자세를 말로 정확하게 설명합니다. 3) 눈을 가린 참가자들은 설명을 듣고 동작을 재현하며, 설명이 끝난 후 안대를 벗고 원래 조각상과 가장 유사한 자세를 취한 사람이 다음 판의 조각상이 됩니다.</p>
