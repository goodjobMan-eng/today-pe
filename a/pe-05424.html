<h1>아이스 스케이팅 술래</h1>
<p>1) 파란 조끼를 입은 사람이 얼음(술래)이 되어 도망가는 친구를 태그한다.2) 술래에게 태그되면 아이스(얼음) 상태가 되어 멈춘다.3) 천사(해동맨)가 얼음이 된 친구를 한 바퀴 돌려주면 다시 살아나 게임에 참여한다.</p>
