<h1>등 대고 인간 의자 만들기</h1>
<p>1) 두 사람이 등을 맞대고 선 뒤 무릎을 천천히 굽혀 의자에 앉은 자세(투명의자)를 만듭니다. 2) 중심을 안정적으로 잡은 상태에서 양팔을 머리 위로 뻗거나 동작을 유지합니다. 3) 성공하면 양옆으로 한 명씩 인원을 추가해 3명, 4명으로 점차 일렬로 길게 등을 맞댄 인원을 늘립니다. 4) 모든 인원이 서로 등을 밀어주며 하체 힘으로 버텨 목표 시간 동안 전원이 무너지지 않고 자세를 유지하면 성공입니다.</p>
