<h1>송어 낚시 술래잡기</h1>
<p>1) 2명의 어부가 폼 태그 스틱을 들고 코트 양쪽을 이동하며 송어 역할을 하는 나머지 학생들을 잡는다. 2) 송어는 코트 양 끝의 안전 구역에서 10초 이상 머물 수 없다. 3) 어부에게 잡힌 송어는 지정된 구역으로 이동한다. 4) 3분 동안 진행하며 잡힌 송어의 수를 세어 승자를 가린다.</p>
