<h1>협동낚시</h1>
<p>1) 팀별 시작점에 한 줄로 서고 첫 번째 사람은 원하는 숫자 원마커 위로 올라가 대기한다2) 두 번째 사람은 낚시터(시작점)로 올라와 콩주머니를 던지고 첫 번째 사람이 발을 원마커에 둔 채 잡으면 해당 원마커를 획득한다3) 성공 시 원마커를 던진 사람이 다음 숫자 원마커로 이동하고 세 번째 사람에게 콩주머니를 넘기며 모든 원마커를 획득해 점수를 합산한다</p>
