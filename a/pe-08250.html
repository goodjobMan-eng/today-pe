<h1>뜀틀과 매트를 활용한 구르기·회전·지지·도약 서킷 운동</h1>
<p>1) 강당에 뜀틀과 체조 매트를 일정한 간격으로 원형 또는 순환형으로 배치한다. 2) 매트 구간에서는 앞으로 구르기 또는 뒤로 구르기를 연속으로 수행한다. 3) 뜀틀 구간에서는 두 손으로 뜀틀 상단을 짚고 뛰어넘거나 몸을 돌려 넘는다. 4) 신호나 박자에 맞춰 다음 스테이션으로 이동하며 다양한 이동 및 도약 동작을 반복한다.</p>
