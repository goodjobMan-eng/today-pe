<h1>열 발 뛰기</h1>
<p>1) 술래를 제외하고 출발선에서 출발 준비를 합니다. 2) 정해진 숫자만큼 뛰어서 이동합니다. 3) 모두 뛴 후 뒤를 돌아 술래를 바라봅니다. 4) 술래는 정해진 숫자보다 한 발 적게 뜁니다. 5) 술래에게 잡히면 아웃되어 미션 구역으로 이동해 미션을 수행합니다. 6) 술래에게 잡히지 않았다면 다시 뛰어서 출발선으로 들어와야 생존합니다.</p>
