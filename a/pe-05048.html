<h1>뜀틀 위 가로 구르기와 양발 점프 넘기 놀이</h1>
<p>1) 뜀틀 위에 가로로 엎드려 턱을 당겨 작게 웅크린 상태로 옆으로 데굴데굴 굴러 반대편 매트로 내려온다2) 도움닫기 후 속도를 붙여 뜀틀 위를 몸의 중심(허리 부근)으로 빠르게 가로 회전하며 뛰어내린다3) 가로로 놓인 뜀틀(1~3단)을 향해 달려와 손을 대지 않고 두 발로 점프하여 무릎을 가슴으로 당기며 뛰어넘는다4) 익숙해지면 단수를 올리거나 세로 방향으로 놓고 비스듬히 앞쪽으로 점프하여 뛰어넘는다</p>
