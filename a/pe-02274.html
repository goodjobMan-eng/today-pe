<h1>슐런 퍽 투구 연습</h1>
<p>1) 보드 위에서 퍽을 목표 거리별로 힘을 조절하여 푸쉬하는 연습을 한다. 2) 점수가 다른 4개의 관문함(1점, 2점, 3점, 4점)에 퍽을 밀어 넣으며 골고루 들어갈 때마다 보너스 10점을 가산하는 규칙을 익힌다. 3) 퍽을 측벽에 튕겨서 밀어 넣으며 반사 각도와 힘의 강약을 조절한다. 4) 측벽에 튕겨 원하는 관문함에 퍽을 집어넣는 실전 투구를 연습한다.</p>
