<h1>점프 챌린지 (일직선 장애물 선 점프)</h1>
<p>1) 바닥에 수건, 신문지 봉 또는 줄넘기를 일직선으로 길게 놓아 장애물 선을 만듭니다. 2) 양발 모아 좌우로 넘기, 외발 플라밍고 점프, 켄켄파(외발·양발 번갈아 점프하기)를 연습합니다. 3) 달리기 스텝(조깅 스텝)과 양발 연속 점프 등 다양한 스텝 동작을 숙달합니다. 4) 동요 '튤립'과 '반짝반짝 작은 별' 노래 리듬에 맞추어 앞서 익힌 점프 동작들을 연속으로 수행합니다.</p>
