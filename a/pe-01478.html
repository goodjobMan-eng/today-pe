<h1>발로 공 주고받기 협동 챌린지</h1>
<p>1) 두 사람이 매트나 바닥에 다리를 뻗고 마주 앉아 발 사이에 공 1개를 끼워 준비한다. 2) 손을 쓰지 않고 오직 발과 다리의 힘만으로 공을 들어 올려 상대방의 양발로 넘겨준다. 3) 시계 방향 또는 반시계 방향으로 몸을 돌리며 공을 떨어뜨리지 않고 정해진 바퀴 수만큼 패스를 이어간다. 4) 익숙해지면 누운 자세에서 머리 위 바닥을 터치하고 오거나 공의 크기·종류를 바꿔 난이도를 높인다.</p>
