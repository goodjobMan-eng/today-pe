<h1>플라잉디스크러닝PK</h1>
<p>1) 출발 신호에 맞춰 디스크를 바구니에서 집어 들고 콘을 돌아 달린다.2) 반대편 상대 골대 옆에 도착하여 디스크를 골대를 향해 던진다.3) 먼저 던져 골인하면 2점(골인 1점+선착 보너스 1점), 늦게 던져 골인하면 1점을 얻으며 둘 다 노골 시 바로 다음 주자가 출발한다.</p>
