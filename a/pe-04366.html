<h1>인사이드 아웃 2 본부 복귀 런</h1>
<p>1) 기쁨이가 본부로 갈 경로를 포즈로 선택하여 표현한다. 2) 화면에 지시되는 동작(점프, 숙이기, 피하기, 펀치)을 수행한다. 3) 불안 토네이도가 다가오면 즉시 동작을 멈추고 멈춤(Freeze)을 유지한다. 4) 장애물이 막히면 객관식 질문에 맞는 해결 도구(다이너마이트)를 맞힌다.</p>
