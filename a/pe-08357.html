<h1>저학년 축구 기초 순환 훈련</h1>
<p>1) 콘으로 표시된 사각 구역 안에서 발등 바깥쪽을 이용해 공을 짧게 치며 자유롭게 드리블한다. 2) 일렬로 놓인 콘 사이를 잔발 스텝으로 빠르게 통과하며 신체 균형을 잡는다. 3) 콘 스텝을 마친 뒤 정면의 패서에게 발안쪽(인사이드)으로 공을 정확히 패스한다. 4) 앞으로 굴러오는 공을 향해 달려가며 디딤발을 공 옆에 두고 골대를 향해 슈팅한다.</p>
