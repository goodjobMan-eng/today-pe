<h1>정확한 타이밍을 잡아라</h1>
<p>1) 책상 위에 컵을 놓고 두 사람이 실 양쪽을 잡고 탁구공이 굴러갈 간격을 만든다. 2) 실 위에 탁구공을 굴려 컵 위치에 올 때 실을 벌려 컵 안에 떨어뜨린다. 3) 컵 속에 탁구공이 들어가면 1점을 얻고 더 많이 성공한 팀이 승리한다.</p>
