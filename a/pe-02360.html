<h1>뒤구르기의 기본 기능 익히기</h1>
<p>1) 매트 위에서 뒤로 돌아 양발을 모으고 쪼그려 앉아 양손을 어깨 위로 올려 손바닥이 하늘을 향하게 합니다. 2) 무게 중심을 뒤로 옮기며 다리를 힘차게 밀고, 등이 매트에 닿을 때 무릎과 가슴을 최대한 가깝게 합니다. 3) 턱을 가슴 쪽으로 당기며 머리를 숙여 몸을 둥글게 만들고 양손으로 매트를 힘차게 밀며 일어섭니다. 4) 다리 벌려 뒤구르기는 뒤로 구르며 다리를 펴서 옆으로 벌리고 양발이 닿으면 매트를 밀며 일어섭니다.</p>
