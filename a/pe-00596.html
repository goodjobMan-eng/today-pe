<h1>평영을 위한 개구리 발차기 익히기</h1>
<p>1) 평영의 기초 발차기인 개구리 발동작을 단계별로 익히는 활동을 준비합니다. 2) 발뒤꿈치를 엉덩이 쪽으로 부드럽게 끌어당긴 후 발목을 바깥쪽으로 꺾어 줍니다. 3) 발바닥으로 물을 강하게 밀어내듯 대각선 뒤쪽으로 차고 두 발을 모아 길게 뻗어 줍니다. 4) 킥판을 잡고 엎드려 차거나 배영 자세로 누워서 직접 발동작을 보며 차는 연습을 반복합니다.</p>
