<h1>킥판 선택 수영 영법 익히기</h1>
<p>1) 수영장 풀사이드에 모여 킥판을 쥐는 2가지 방식(얼굴 들기, 얼굴 담그기)을 확인한다. 2) 신호와 함께 킥판 앞쪽을 잡고 시선을 전방에 두며 발차기로 앞으로 나아간다. 3) 자신의 호흡 수준에 맞춰 킥판 뒤쪽에 손을 얹고 물속에 얼굴을 담갔다 들며 나아간 거리를 기록한다. 4) 레인별로 두 가지 킥판 파지법 중 자신에게 적합한 방식을 스스로 선택해 왕복 연습을 진행한다.</p>
