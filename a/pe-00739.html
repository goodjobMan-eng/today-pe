<h1>긴줄 넘기 기초 활동 (문어 다리 자르기·차단기)</h1>
<p>1) 여러 명이 옆으로 줄을 서서 앞으로 다가오는 긴줄을 캥거루 점프로 동시에 뛰어넘습니다. 2) 돌아오는 긴줄이 머리 위로 지나갈 때는 쪼그려 앉아서 머리에 닿지 않게 피합니다. 3) 줄을 위아래로 흔드는 '차단기' 동작에서는 줄이 아래로 갈 때 뛰어넘고 위로 갈 때 통과합니다. 4) 차단기 동작에 익숙해지면 자연스럽게 연속 긴줄넘기 뛰기로 전환합니다.</p>
