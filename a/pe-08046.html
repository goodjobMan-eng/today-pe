<h1>공 운반 술래잡기 (플래그 풋볼 기초 게임)</h1>
<p>1) 공격 팀은 허리에 플래그를 차고 타원형 공을 들고 출발선에 선다. 2) 출발 신호에 맞춰 중간의 술래 구역을 통과해 반대편 골 라인까지 공을 운반한다. 3) 술래에게 플래그를 뺏기지 않고 운반하면 득점하며, 플래그를 뺏기면 경기장 옆에 둔 플래그를 다시 차고 출발선에서 재출발한다.</p>
