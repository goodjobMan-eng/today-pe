<h1>림보 놀이</h1>
<p>1) 줄을 잡을 친구 두 명을 정하고 림보 줄이 처지지 않도록 팽팽하게 잡는다. 2) 상체를 펴고 가슴을 뒤로 젖힌 상태에서 몸에 줄이 닿지 않도록 줄 아래로 지나간다. 3) 어깨 높이에서 시작하여 줄의 높이를 점점 낮추며 통과한 친구는 줄 밖으로 돌아나와 다시 줄을 서고 통과하지 못한 친구는 자리로 돌아간다. 4) 가장 오래 살아남은 친구가 승리한다.</p>
