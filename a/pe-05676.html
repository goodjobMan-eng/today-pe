<h1>함께 줄넘기 너머로</h1>
<p>1) 모둠원 중 두 명이 긴 줄넘기의 양쪽 끝을 잡는다.2) 줄을 잡은 두 사람이 긴 줄을 바닥에 낮게 대고 주저앉아 대기한다.3) 나머지 모둠원들이 줄을 쉽게 넘을 수 있도록 줄을 넘겨주면 팀원들이 줄 위로 뛰어넘어 이동한다.4) 줄을 잡은 사람들이 줄을 머리 위로 다시 넘겨 앞으로 보내며 정해진 목표 지점까지 모둠 전체가 전진한다.</p>
