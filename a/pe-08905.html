<h1>체육관 워밍업 게임 4선</h1>
<p>1) 두 팀으로 나누어 상대 진영에 있는 많은 휴지(접시콘)를 자기 진영으로 가져오는 팀이 승리한다. 2) 3개의 같은 색 휴지(접시콘)를 한 줄로 먼저 놓는 팀이 승리한다. 3) 정해진 시간 동안 자신의 진영에 더 많은 휴지(접시콘)를 가져오는 팀이 승리한다. 4) 각 모서리에 있는 휴지(접시콘)를 상대를 피해 교환하며 네 가지 색을 맞히는 게임을 진행한다.</p>
