<h1>배구 버터플라이 패스 및 서브 리시브 훈련</h1>
<p>1) 네트 양쪽에 토서, 패서, 타깃 선수가 위치를 잡는다. 2) 토서가 공을 던져주거나 서브를 넣으면 패서가 네트 앞 타깃에게 언더핸드로 정확히 패스한다. 3) 플레이 후 토서는 패서 위치로, 패서는 타깃으로, 타깃은 반대편 코트로 순환 이동한다.</p>
