<h1>제자리 풍선 띄우기 협력 놀이</h1>
<p>1) 앉아 있는 자리를 기준으로 4~6명을 한 팀으로 구성하고 의자를 돌려 서로 마주 본다. 2) 일어서지 않고 자신의 자리에 앉은 상태로 손을 이용해 풍선을 공중으로 띄운다. 3) 공중에서 풍선을 친 횟수를 다 함께 소리 내어 세며 누적한다. 4) 한 사람이 연속으로 두 번 치거나 풍선이 바닥에 닿으면 카운트를 멈추고 다시 시작한다.</p>
