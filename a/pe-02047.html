<h1>늘였다 줄였다 이어달리기</h1>
<p>1) 두 팀이 서로 반대 방향을 바라본 상태로 한 줄로 서서 손을 잡는다. 2) 신호에 맞춰 양쪽 끝에 있는 첫 주자가 한 바퀴를 돌아 가운데로 들어온다. 3) 주자가 가운데로 들어오면 다음 주자가 똑같이 달린다. 4) 마지막 주자가 가운데로 먼저 들어오는 팀이 승리한다.</p>
