<h1>팀조끼 집중력 순발력 게임</h1>
<p>1) 짝과 마주 보고 책상 가운데에 팀조끼를 놓는다. 2) 교사의 신호에 맞춰 동작(1번 머리, 2번 어깨, 3번 허리, 돌아 한 바퀴 회전, 때려 책상 치기)을 수행한다. 3) 교사가 '잡아'를 외치면 책상 가운데의 팀조끼를 먼저 잡는다. 4) 잡아서 머리 위로 먼저 흔드는 사람이 승리한다.</p>
