<h1>뒷마당 장애물 달리기</h1>
<p>1) 발매트에서 출발해 콘마다 한 발로 뛴다. 2) 훌라후프를 밟으며 지나간 뒤 터널을 포복으로 통과한다. 3) 평균대에서 균형을 잡고 버킷에서 세 바퀴 돈다. 4) 콘 사이를 지그재그로 통과한 뒤 바구니에 콩주머니를 던져 넣는다. 5) 원반을 던져 바구니를 쓰러뜨리고 줄을 따라간 뒤 벤치를 두 손으로 짚고 뛰어넘어 버저를 누른다.</p>
