<h1>뉴컴 볼 (Newcomb)</h1>
<p>1) 배구 코트에서 서브로 게임을 시작한다. 2) 날아오는 공을 배구처럼 치지 않고 두 손으로 받아낸 뒤 네트 너머로 던진다. 3) 던진 공이 상대편 진영 바닥에 떨어지거나 상대 서브가 실패하면 득점하며, 득점한 팀이 계속 서브권을 갖고 실점 시 선수를 로테이션한다.</p>
