<h1>킥런볼</h1>
<p>1) 팀당 10명으로 구성하고 공격수는 타석의 접시콘에 놓인 럭비공을 플레이스 킥으로 찬다. 2) 킥을 한 타자 주자는 20m 떨어진 공격수 대기 구역의 주자들을 남학생 3바퀴, 여학생 2바퀴를 돈다. 3) 수비팀은 바운드된 공을 처음 잡은 수비수 뒤로 전원이 일렬로 서서 다리 사이로 공을 전달하며 마지막 쿼터백이 수비 베이스로 공을 패스한다. 4) 주자가 수비 공보다 먼저 베이스를 밟으면 1점을 얻고, 3아웃이 되면 공수를 교대한다.</p>
