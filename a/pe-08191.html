<h1>앞구르기 기초 및 단계별 연습</h1>
<p>1) 통나무 구르기(log roll)와 달걀 구르기(egg roll)로 기초 회전 감각을 익힌다. 2) 경사대 위에서 다리를 벌린 별 모양(star)으로 서서 손을 바닥에 짚는다. 3) 턱을 가슴에 단단히 붙이고 팔을 굽히며 경사대를 굴러 내려간다. 4) 다리를 모으고 같은 방법으로 경사대에서 앞구르기를 연습한다. 5) 경사대 없이 평평한 매트 바닥에서 다리를 펴거나 모으는 변형 앞구르기를 실시한다.</p>
