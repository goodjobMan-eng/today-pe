<h1>농구 패스 기초 연습</h1>
<p>1) 패스하는 사람은 한 발 나가며 손등이 보이도록 앞으로 나란히 밀어준다. 2) 바운드 패스는 바닥 3분의 2 지점에 튕겨 상대 명치로 보낸다. 3) 키가 큰 수비수를 상대할 때는 두 손을 뻗어 낮고 빠른 언더 패스를 사용한다. 4) 어깨너머로 큰 원을 그리며 던지는 훅 패스를 연습한다.</p>
