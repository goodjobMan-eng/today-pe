<h1>피자 나르기 콘 쌓기 왕복 달리기</h1>
<p>1) 모둠별로 3명씩 팀 조끼를 입고 출발선에 정렬하며 목표 지점 3곳을 마커와 콘으로 표시한다. 2) 교사의 신호가 울리면 세 명이 함께 달려가 첫 번째부터 세 번째 지점까지 접시콘을 하나씩 똑바로 쌓는다. 3) 반환점이나 출발선을 찍은 뒤 다시 함께 달려가 각 지점의 접시콘을 하나씩 회수해 온다. 4) 접시콘 대신 원마커 위에 테니스공을 얹는 피자 토핑 형태로 변형하여 진행한다.</p>
