<h1>체육 댄스 파티</h1>
<p>1) 조명과 스트리머로 꾸민 강당에 입장하여 야광봉을 받고 댄스 플로어에 준비한다. 2) 단체 댄스로 시작하여 차차 슬라이드, 큐피드 셔플 등 대중적인 그룹 댄스를 3~4곡 함께 춘다. 3) 그룹 댄스가 끝난 후 나머지 시간 동안 자유롭게 프리스타일 댄스를 즐긴다.</p>
