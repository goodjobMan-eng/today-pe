<h1>공간 장악 축구 패스 게임</h1>
<p>1) 라바콘으로 가로세로 20걸음 크기의 사각형 구역을 표시하고 가위바위보로 술래 1명을 정한다. 2) 술래를 피해 일반 선수들이 구역 내에서 축구공을 발로 패스하며 술래는 공을 차단하러 쫓아간다. 3) 술래에게 뺏기지 않고 패스 20회를 달성하면 일반 선수가 이기고, 도중 공을 뺏거나 라인 밖으로 나가면 술래가 승리한다. 4) 원형 구역 중앙에 술래를 두고 맞은편 동료에게 가로질러 패스하거나 술래를 2명으로 늘려 난이도를 높인다.</p>
