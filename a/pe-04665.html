<h1>트릭 오어 트릿 릴레이</h1>
<p>1) 학생들은 3~4명씩 색깔 콘 뒤에 줄을 서서 릴레이 팀을 구성한다. 2) 자기 차례가 되면 팀 색깔에 맞는 모형 집으로 달려가 문을 열고 &quot;트릭 오어 트릿&quot;을 외친다. 3) 사탕을 1개 골라 꺼낸 뒤 문을 닫고 &quot;감사합니다&quot;라고 말한다. 4) 팀의 바구니로 달려와 사탕을 넣고 다음 주자와 교대하며 약 10분간 연속 릴레이를 진행한다.</p>
