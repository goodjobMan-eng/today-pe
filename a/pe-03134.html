<h1>색깔 주사위 놀이</h1>
<p>1) 반 전체를 모둠으로 나누고 모둠 색깔을 정한 뒤 색깔 주사위를 준비합니다. 2) 전체가 둥글게 원을 만들고 중심에서 주사위를 던집니다. 3) 주사위의 색깔과 같은 색의 모둠 친구가 다른 모둠 친구에게 주사위를 던져 공격합니다. 4) 던진 주사위를 잡으면 공격권을 얻고, 맞으면 탈락하여 경기장 밖으로 나가며 마지막까지 남은 모둠이 승리합니다.</p>
