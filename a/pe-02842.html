<h1>교실 바닥 탐파 놀이</h1>
<p>1) 교실 바닥에 분필이나 마스킹테이프로 돌아올 놀이판 선을 그립니다. 2) 팀을 나누고 순서대로 말(공깃돌 등)을 손가락으로 쳐서 선 안을 따라 이동시킵니다. 3) 이전 주자가 보낸 곳에서 이어서 다음 사람이 치며, 선 밖으로 나가면 아웃되어 처음으로 돌아갑니다. 4) 가장 먼저 맨 끝 칸까지 이동시키거나 정해진 시간 동안 가장 멀리 보낸 팀이 승리합니다.</p>
