<h1>축구-양말공 슛 챌린지 게임</h1>
<p>1) 출발선에 신발 한 짝을 목표물로 세워 두고 일정한 거리를 둔다.2) 양말공 위에 발을 번갈아 올려놓는 토 터치 동작을 3회 실시한다.3) 발 안쪽(인사이드)으로 양말공을 차서 세워 둔 신발을 맞힌다.4) 신발을 맞히면 1점을 획득하며 정해진 기회 동안 최고 점수에 도전한다.</p>
