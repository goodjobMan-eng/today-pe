<p>1) 손을 주먹을 쥐거나 손바닥을 편 형태 중 편한 방식으로 준비한다. 2) 주먹을 쥘 때는 평평한 면으로, 손바닥을 펼 때는 손바닥 아래쪽 부위로 칠 준비를 한다. 3) 공의 중심보다 살짝 아랫부분에 손이 닿도록 각도를 맞추며 아래에서 위로 스윙한다. 4) 왼손을 오른손 앞쪽에 두고 토스를 너무 높지 않게 가볍게 띄운다. 5) 처음에는 짧은 거리에서 서브 연습을 시작하여 점차 긴 거리로 늘려간다.</p>
