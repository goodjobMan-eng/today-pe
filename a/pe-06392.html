<h1>할로윈 마녀 달리기 브레인 브레이크</h1>
<p>1) 화면에 나오는 마녀 캐릭터 중 응원하고 싶은 마녀를 한 명 선택한다.2) 선택한 마녀에 해당하는 동작을 따라 하며 몸을 움직인다.3) 경주가 시작되면 빗자루를 탄 시늉을 하며 제자리에서 달리거나 날아가는 동작을 취하며 응원한다.</p>
