<h1>호커스 포커스 캔디 던지기 게임</h1>
<p>1) 학생들은 체육관 양쪽 사이드라인에 서서 중앙 묘지를 향해 가토 스킨 볼(캔디)을 던지고 받는다. 2) 중앙에서는 수비수 3명이 풀누들 빗자루를 타고 날아다니며 날아오는 공을 가로채 바구니에 넣는다. 3) 공을 빼앗긴 학생은 매트로 달려가 윗몸일으키기나 점핑잭 5회를 수행하고 바구니에서 공 1개를 다시 찾아온다. 4) 2분마다 수비수를 새로운 인원으로 교체하여 진행한다.</p>
