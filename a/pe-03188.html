<h1>줄과 천을 활용한 기본 표현 동작</h1>
<p>1) 양손으로 줄을 잡고 돌리며 한 발 또는 두 발로 줄을 뛰어넘습니다. 2) 한쪽 발끝을 줄에 걸치고 다리를 곧게 뻗어 들어 올리며 균형을 잡습니다. 3) 양손으로 줄을 잡고 한쪽 팔만 돌리면서 줄을 휘감습니다. 4) 한 손 또는 양손으로 천을 잡고 머리 위에서 다양한 방향으로 흔들거나 돌리고 던졌다가 받습니다.</p>
