<h1>배구 기초 기능 지도법 (언더핸드 패스, 토스, 서브)</h1>
<p>1) 양손을 모아 편평한 면을 만들고 다리 힘을 이용해 언더핸드 패스(범프)를 연습한다.2) 이마 위에서 엄지와 검지로 삼각형 창문을 만들어 손가락 끝으로 세팅(토스)한다.3) 공을 든 반대쪽 발을 내딛으며 주먹 측면으로 언더핸드 서브를 연습한다.</p>
