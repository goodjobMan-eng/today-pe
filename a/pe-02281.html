<h1>통합체육 보치아</h1>
<p>1) 적색 팀과 청색 팀이 서로 마주 보고 바닥의 숫자 원형 마커에 앉으며 중앙에 흰색 표적구를 놓는다. 2) 가위바위보나 교사의 지정으로 선공 팀(청팀)을 정하고 3번 선수가 표적구를 향해 먼저 큰 공을 투구한다. 3) 두 번째 투구는 상대 팀(홍팀) 3번 선수가 투구하고 이후에는 흰색 표적구와 거리가 더 먼 팀이 번갈아 투구한다. 4) 표적구에 더 가깝게 붙인 공의 개수만큼 득점하여 더 많은 점수를 얻은 팀이 승리한다.</p>
