<h1>공 차고 멈추기 상호 피드백 활동</h1>
<p>1) 녹색 구역 친구들이 뒤에서 달려와 공을 차고 멈추는 연습을 한다.2) 연두색 구역 친구들은 연습 장면을 관찰하고 고칠 점을 설명하며 피드백을 제공한다.3) 역할을 바꾸어 연두색 구역이 연습하고 녹색 구역 친구들이 관찰하여 피드백을 준다.</p>
