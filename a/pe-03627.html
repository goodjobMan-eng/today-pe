<h1>계란판 탁구공 원바운드 넣기 및 빙고 놀이</h1>
<p>1) 계란판을 책상 가운데에 두고 탁구공을 원바운드 시켜 던져 넣는 연습과 시합을 한다. 2) 가위바위보로 순서를 정하거나 동시에 번갈아 가며 계란판에 탁구공을 원바운드로 튕겨 넣는다. 3) 가로, 세로, 대각선 중 한 줄로 3개 빙고를 먼저 완성하는 사람이 승리한다. 4) 5개를 다 넣었는데도 빙고가 완성되지 않으면 공을 다 빼지 않고 하나씩 빼서 다시 던져 넣는다.</p>
