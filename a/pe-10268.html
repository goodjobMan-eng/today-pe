<h1>리듬 워밍업(고도 다지기 버전)</h1>
<p>1) 머리 위 박수와 屈伸(굴신) 동작을 한다. 2) 伸脚(신각), 아킬레스건 늘리기, 발목 돌리기를 한다. 3) 다리 앞뒤 흔들기, 무릎 올리기, 다리 올리기, 넘기 동작을 한다. 4) 견갑골 풀기, 손뼉 치기, 전후굴 및 높이뛰기 점프 동작을 한다.</p>
