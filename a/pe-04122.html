<h1>감사 태그</h1>
<p>1) 술래는 폼 누들(스펀지봉)을 들고 체육관 안의 빈 공간을 찾아 흩어진다. 2) 술래에게 태그되거나 라인 밖으로 나가거나 넘어지면 아웃된다. 3) 아웃된 학생은 교사가 있는 원마커 스팟으로 이동하여 대기한다. 4) 자신이 감사하게 여기는 것을 한 가지 말하면 즉시 게임에 다시 복귀한다.</p>
