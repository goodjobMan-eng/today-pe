<h1>셔틀콕 다트</h1>
<p>1) 네모칸 표적(탁구대 등)을 앞에 두고 포핸드 그립으로 배드민턴 라켓을 잡는다. 2) 무릎을 구부려 낮은 자세를 유지한다. 3) 라켓면을 수직으로 세워 정면으로 셔틀콕을 강하고 곧게 직선으로 타격한다. 4) 총 5번의 시도 중 2번 이상 표적 네모칸을 정확히 맞추면 성공한다.</p>
