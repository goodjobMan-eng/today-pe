<h1>줄넘기 발바꿔뛰기 (구보뛰기)</h1>
<p>1) 줄 없이 제자리에서 조깅하듯 한 발씩 무릎을 살짝 들며 교대로 뛰는 기본 동작을 연습한다. 2) 이때 공중에 뜬 발은 발등을 펴 발끝이 지면을 향하고 발바닥이 뒤를 보도록 유지한다. 3) 발 동작이 익숙해지면 줄을 잡고 천천히 발을 번갈아 뛰며 줄을 넘는다.</p>
