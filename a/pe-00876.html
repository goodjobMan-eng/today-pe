<h1>크리스마스 요정 엘프의 질주 탈출 놀이</h1>
<p>1) 학생들은 산타의 요정 엘프가 되어 화면 속 숲길을 제자리 달리기로 통과합니다. 2) 울타리가 나오면 점프하고 나뭇가지가 나오면 신속하게 몸을 숙여 피합니다. 3) 공중이나 바닥에 나타나는 선물 상자를 손을 뻗어 잡는 동작을 취합니다. 4) 설인이 나타나면 즉시 얼음 자세로 멈추고 눈싸움 단계에서는 날아오는 눈덩이를 피해 몸을 숨깁니다.</p>
