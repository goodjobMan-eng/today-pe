<h1>마천루 빌딩 무너뜨리기 피구</h1>
<p>1) 강당을 4개 구역으로 나누고 각 모퉁이에 접이식 매트 2단을 세워 마천루를 만든 뒤 4개 팀으로 나눈다. 2) 각 팀에 피구공을 배부하고 신호가 울리면 상대 진영의 매트 탑을 향해 공을 던져 쓰러뜨린다. 3) 공을 던져 날아오는 공을 막을 수 있으며 매트 탑이 먼저 완전히 쓰러진 팀은 탈락한다. 4) 탈락한 팀 학생들은 원하는 생존 팀으로 흩어져 합류하고 최후의 한 탑이 남을 때까지 대결한다.</p>
