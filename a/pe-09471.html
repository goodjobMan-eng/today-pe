<h1>오징어 놀이와 다방구</h1>
<p>1) 공격팀은 한 발로 뛰거나 두 발로 이동하며 오징어 모양 진을 통과한다. 2) 수비팀은 공격팀을 잡거나 선 밖으로 밀어낸다. 3) 다방구는 술래를 피해 도망치며 지정된 구역에서 탈출한다.</p>
