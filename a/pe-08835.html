<h1>누가 잡을까? (인지 반응 패스 술래잡기)</h1>
<p>1) 2인 1조로 짝을 지어 1번과 2번 역할을 정한 뒤 자유롭게 이동하며 공을 패스한다. 2) 신호자가 손가락으로 1을 들면 1번이 2번을 잡고, 2를 들면 2번이 1번을 잡으러 달린다. 3) 신호가 내려가면 다시 공 패스를 진행하며 공을 떨어뜨리면 팔굽혀펴기 등의 추가 미션을 수행한다.</p>
