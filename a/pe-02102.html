<h1>혼자고누</h1>
<p>1) 고누판 선이 만나는 교차점 중 정중앙 한 칸만 비워두고 나머지 32곳에 바둑알(말)을 놓는다. 2) 자신의 말 하나를 선택하여 이웃한 다른 말 바로 너머의 빈 칸으로 뛰어넘는다. 3) 뛰어넘힌 말은 판에서 떼어내어 밖으로 뺀다. 4) 더 이상 뛰어넘을 수 있는 말이 없을 때까지 반복하여 판 위에 말이 1개만 남으면 성공한다.</p>
