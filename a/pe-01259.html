<h1>양말공 거리별 단계 농구 슛 챌린지</h1>
<p>1) 표적 상자를 두고 1걸음부터 5걸음 거리마다 종이컵을 놓아 1~5단계 투척 구역을 만든다. 2) 타이머를 시작하고 1단계(5개)부터 양말공 3개를 번갈아 던져 상자에 넣는다. 3) 던진 공을 회수해 2단계(4개), 3단계(3개), 4단계(2개), 5단계(1개) 순으로 총 15개를 성공할 때까지 이어간다. 4) 2~3회 반복 도전하며 15개를 모두 넣는 데 걸린 총 시간을 측정해 기록 단축을 겨룬다.</p>
