<h1>상어의 습격</h1>
<p>1) 술래 2명(상어)은 구역 중앙에 서고 나머지 학생(수영자)은 한쪽 끝에 선다. 2) 신호가 울리면 수영자들은 상어에게 잡히지 않고 반대편으로 달려간다. 3) 상어에게 태그된 학생은 그 자리에 앉아 멈춘다. 4) 건너가는 다른 학생이 앉아 있는 학생과 손을 맞잡아(하이파이브) 살려줄 수 있다.</p>
