<h1>플라잉디스크 포핸드 던지기 표적 맞히기</h1>
<p>1) 엄지, 검지, 중지를 펴고 검지와 중지는 디스크 안쪽, 엄지는 바깥쪽을 잡는 포핸드 그립을 잡는다. 2) 날리고자 하는 방향을 정면으로 바라보고 다리를 어깨너비로 벌린다. 3) 플라잉디스크를 몸 옆에서 앞으로 손목의 스냅을 이용해 회전을 주며 날린다. 4) 던지는 순간 디스크를 날리는 손과 같은 쪽 발을 살짝 밀어주며 표적인 컵을 맞혀 쓰러뜨린다.</p>
