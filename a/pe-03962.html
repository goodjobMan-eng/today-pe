<h1>포스트잇 플릭 풋볼 게임</h1>
<p>1) 포스트잇을 대각선으로 두 번 접고 테이프나 스테이플러로 고정해 종이 미식축구공을 만든다. 2) 테이블 양쪽에 1~2명씩 위치하여 번갈아 공을 손가락으로 튕긴다. 3) 테이블 반대편 엔드존 라인을 넘기되 밖으로 떨어지지 않게 3번의 기회 안에 튕겨 터치다운을 노린다. 4) 3번 안에 터치다운에 실패하면 공을 세우고 한 손가락으로 튕겨 필드골을 시도한다.</p>
