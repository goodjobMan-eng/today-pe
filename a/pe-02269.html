<h1>퐁당퐁당 컵을 쌓아라 놀이</h1>
<p>1) 두 명이 짝이 되어 한 명은 공을 튀기고 한 명은 스피드스택스 컵을 잡는다. 2) 한 팀원이 바닥에 탁구공을 원바운드로 튀겨 보낸다. 3) 반대편 팀원이 들고 있는 컵으로 바운드된 탁구공을 받아낸다. 4) 공을 받는 데 성공하면 그 컵을 뒤편 테이블에 하나씩 쌓아 총 12개의 컵을 먼저 쌓으면 성공한다.</p>
