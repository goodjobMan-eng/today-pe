<h1>교실 슐런 네덜란드 전통 스포츠</h1>
<p>1) 2m 길이의 슐박 테이블 끝에 서서 둥근 나무 퍽 30개를 확인하고 준비한다. 2) 1차 시기에서 30개의 퍽을 관문 4개(왼쪽부터 2점, 3점, 4점, 1점)를 향해 차례로 슬라이딩해 밀어 넣는다. 3) 들어가지 않은 퍽을 수거해 2차, 3차 시기까지 반복 푸시한 뒤 관문별로 들어간 퍽 개수대로 점수를 계산한다. 4) 4개 관문에 퍽이 1개씩 골고루 채워질 때마다 세트당 10점의 보너스 점수를 추가 합산해 승부를 겨룬다.</p>
