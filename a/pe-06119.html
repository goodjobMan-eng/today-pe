<h1>몬스터볼 활용 츄크볼 게임</h1>
<p>1) 양 팀이 공을 패스하여 상대편 골대(리바운더)에 공을 던져 튕겨 나오게 공격한다.2) 공격 패스는 연속 세 번까지 가능하며 세 번 이내에 슛을 해야 한다.3) 수비 팀은 상대의 패스를 직접 가로채거나 몸싸움으로 방해할 수 없다.4) 튕겨 나온 공을 받아내면 수비 팀이 공격권을 얻어 바로 반대쪽이나 해당 골대로 공격을 이어간다.</p>
