<h1>풍선 배구</h1>
<p>1) 풍선 안에 쌀 몇 톨을 넣고 바람을 불어 묶는다. 2) 의자 사이에 연결한 줄(네트)을 사이에 두고 마주 선다. 3) 소리가 나는 풍선을 상대 쪽으로 손이나 팔로 쳐서 넘긴다.</p>
