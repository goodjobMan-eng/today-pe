<h1>홉 스킵 갤럽 기초 이동운동</h1>
<p>1) 체육관 한쪽 벽면 엔드라인을 따라 전교생이 안전한 간격을 두고 일렬로 정렬한다. 2) 교사의 질문과 발문에 따라 건너편 벽면까지 걸어가며 몸을 풀고 천천히 조깅으로 되돌아온다. 3) 점차 속도를 높여 러닝, 외발 뛰기(홉), 스킵, 갤럽(말 달리기) 등 다양한 기초 이동 기술로 반대편을 왕복한다. 4) 동물 흉내 내기나 팔을 크게 흔들며 리듬에 맞춰 스킵하기 등 창의적인 이동 동작으로 변형하여 완주한다.</p>
