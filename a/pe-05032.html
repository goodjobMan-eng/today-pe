<h1>뜀틀 구름판 밟기 및 도움닫기 조절 훈련</h1>
<p>1) 뜀틀 앞 구름판에 두 발로 올라서서 위로 높게 점프하는 반동 감각을 익힌다2) 구름판의 중앙(흰색 선 부분)을 양발로 강하게 밟으며 수직으로 솟구치는 점프를 반복한다3) 뜀틀에서 2~3걸음 뒤에서 출발하여 도움닫기 후 구름판을 양발로 힘껏 밟고 도약한다4) 처음부터 전력 질주하지 않고 점진적으로 가속하며 구름판 반발력을 살려 뜀틀 위를 뛰어넘는다</p>
