<h1>상어와 서퍼 (스쿠터보드 바다 건너기)</h1>
<p>1) 체육관 중앙을 바다로 정하고 노란색 조끼를 입은 술래(상어) 4명을 배치한다. 2) 양쪽 사이드라인에 5명씩 스쿠터보드를 타고 대기한다. 3) 신호가 울리면 스쿠터보드를 타고 상어에게 태그되지 않고 반대편으로 건너간다. 4) 상어에게 태그되면 스쿠터보드에서 일어나 다음 대기자에게 전달하고 안전 구역을 통해 줄 끝으로 돌아간다.</p>
