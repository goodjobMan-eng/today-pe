<h1>라부부 가을 런 브레인 브레이크</h1>
<p>1) 사과를 되찾기 위해 이동할 방향을 화면을 보고 선택한다.2) 맞힐 때마다 1점씩 점수를 얻는다.3) 달리기, 점프, 웅크리기, 부수기, 피하기, 도약하기 등 화면의 움직임을 제자리에서 따라 한다.4) 틀린 그림 찾기 미니 게임이 나오면 포즈를 취한 채 3가지 차이점을 찾는다.</p>
