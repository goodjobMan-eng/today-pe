<h1>나는야 번개맨</h1>
<p>1) 제자리에서 팀조끼를 머리 위 높이 던져 양손으로 잡는 감각을 익힌다. 2) 둘이서 약 3미터 거리에 서서 각자 머리 위로 팀조끼를 던진 뒤 앞으로 빠르게 뛰어가 친구의 팀조끼를 잡는다. 3) 성공하면 원마커를 뒤로 한 걸음씩 넓혀가며 모둠(3명 시계 방향)으로 인원을 늘려 계속 도전한다.</p>
