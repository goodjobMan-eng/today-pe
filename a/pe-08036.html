<h1>리듬 던지기</h1>
<p>1) 던지는 방향을 향해 옆으로 서서 준비 자세를 잡고 왼손을 옆으로 뻗는다. 2) 1의 구령에 공을 쥔 손을 왼손에 붙이고, 2의 구령에 손을 아래로 크게 원을 그리며 돌려 어깨와 팔이 일직선이 되게 만든다. 3) 왼손을 힘껏 당겨 몸을 회전시키며 3의 구령에 팔을 크게 휘둘러 공을 던진다.</p>
