<h1>멀리뛰기 과정 자세 탐구</h1>
<p>1) 도움닫기 구간에서 빠른 속도로 열심히 달려온다.2) 발구름판을 밟을 때 몸을 수직으로 세우지 않고 약간 기울여 순간적으로 멈추며 튕겨 오르듯 뛰어오른다.3) 공중에서 배를 앞으로 내밀고 팔을 뒤로 젖히는 만세 자세를 취하며 추진력을 얻는다.4) 착지 전에는 팔을 앞으로 젖히고 다리를 최대한 앞으로 내밀며 몸을 접어 착지한다.</p>
