<h1>트라이앵글 태그 (3대 1 술래잡기)</h1>
<p>1) 4명이 한 모둠을 이루고, 3명은 손을 잡고 원을 만들며 1명은 술래가 된다. 2) 술래와 원 안의 지정된 목표 학생 1명이 서로를 마주본다. 3) 시작 신호가 울리면 술래는 10초 동안 목표 학생을 태그하려 하고, 나머지 두 명은 원을 회전시키며 목표 학생을 보호한다.</p>
