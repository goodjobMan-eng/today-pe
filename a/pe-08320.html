<h1>혼자서도 할 수 있는 배구 기초 기능 연습</h1>
<p>1) 언더핸드 리시브 자세로 공을 팔에 얹고 낮은 자세로 10초간 정지한 뒤, 한 손 또는 양손으로 공을 위로 튕긴다. 2) 이마 헤어라인 위치로 공을 헤딩해 보며 접촉 위치를 익힌 뒤 제자리에서 20~30회 오버핸드 패스를 한다. 3) 공에 앞쪽 회전을 주는 토스를 익히고 스파이크 스텝과 스윙을 연결해 본다. 4) 서브를 위해 무회전으로 공을 띄우고 타점 위치에서 잡는 연습을 반복한다.</p>
