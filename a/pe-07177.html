<h1>캐치 5</h1>
<p>1) 두 팀으로 나누어 바닥에 흩어지고 가위바위보 등으로 시작 팀을 정한다. 2) 공을 떨어뜨리거나 상대 팀에게 가로채이지 않고 팀원끼리 5번 연속 패스를 성공시킨다. 3) 두 사람 사이에서만 공을 주고받을 수 없으며 다른 사람에게 패스해야 한다. 4) 5번째 패스를 받으면 공을 바닥에 내려놓거나 내리쳐 1점을 획득하고 상대 팀이 공을 넘겨받아 시작한다. 5) 상대가 패스를 가로채거나 쳐내어 바닥에 떨어뜨리면 공의 소유권이 넘어간다.</p>
