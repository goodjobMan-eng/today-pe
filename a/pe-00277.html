<h1>교실 달팽이 3가지 게임</h1>
<p>1) 원마커로 바닥에 길을 표시해 두고 양 팀이 마주 보며 출발합니다. 2) 중간에 상대 팀 친구와 만나면 가위바위보를 합니다. 3) 이긴 학생은 계속 전진하고, 진 학생 팀은 다음 주자가 바로 출발합니다. 4) 상대편 진영 끝까지 도달하면 승리하는 규칙 외에도 주자 합류 방식 등 3가지 변형으로 운영할 수 있습니다.</p>
