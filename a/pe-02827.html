<h1>백업 스틱 그물 술래잡기</h1>
<p>1) 술래들이 백업 스틱을 잡고 양옆으로 길게 연결하여 그물을 만듭니다. 2) 신호에 맞춰 도망가는 사람들을 구석으로 몰아 잡으러 다닙니다. 3) 그물 술래에게 잡힌 사람은 술래의 양옆에 백업 스틱을 잡고 붙습니다. 4) 술래 인원이 늘어나 최대 연결 인원(예: 3명씩 2그룹 등)을 채우면 이후 잡힌 사람은 아웃됩니다.</p>
