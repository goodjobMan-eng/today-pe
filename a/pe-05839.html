<h1>스네이크 웨이</h1>
<p>1) 각자 줄넘기를 바닥에 구불구불한 S자 모양으로 펼쳐 놓습니다.2) 줄넘기 옆을 따라 앞으로 달려갔다가 줄 끝을 돌아 제자리로 돌아옵니다.3) 한 발로 줄을 따라 이동한 뒤 끝을 돌아오는 등 다양한 스텝을 시도합니다.4) 모둠별로 줄넘기 4개를 길게 연결하거나 학급 전체 줄을 길게 이어 순서대로 통과합니다.</p>
