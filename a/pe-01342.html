<h1>원형 대형으로 즐기는 강강술래 전통 춤 놀이</h1>
<p>1) 전원이 둥글게 원을 만들어 손을 맞잡고 준비한다. 2) 메기는 소리에 맞춰 시계 반대 방향으로 걷기와 뛰기를 하며 원형으로 회전한다. 3) 두 명씩 짝을 지어 거북이 동작을 흉내 내는 남생이 놀이와 선두를 따라 나선형으로 감고 푸는 덕석 몰기·풀기 동작을 이어간다. 4) 지역별 유래 동작을 추가하거나 모둠별 대형 변경을 적용해 창의적으로 변형한다.</p>
