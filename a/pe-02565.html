<h1>태권도 기본 서기 및 막기와 지르기</h1>
<p>1) 발을 모으는 모아서기, 발을 어깨너비로 벌리고 무게중심을 가운데 두는 준비서기, 기마자세의 주춤서기를 익힌다. 2) 앞으로 걸어가듯 딛는 앞서기와 뒷발을 딛고 무게중심을 뒤로 8대2로 두는 뒷굽이를 연습한다. 3) 주춤서기 자세에서 명치를 향해 몸통지르기를 하고 지르지 않는 손은 옆구리에 둔다. 4) 왼손으로 아래막기, 몸통막기, 얼굴막기를 차례로 수행하며 반대 손은 옆구리에 둔다.</p>
