<h1>컬러 피트니스 원마커 스텝 몸풀기</h1>
<p>1) 활동 공간 바닥에 다양한 색상의 원마커를 골고루 배치하고 화면을 준비합니다. 2) 화면에 걷기, 스킵, 사이드 스텝 등 이동 동작이 제시되면 신호에 맞춰 자유롭게 공간을 이동합니다. 3) 호각 소리가 울리면 재빨리 주변의 원마커 하나를 찾아 밟고 섭니다. 4) 자신이 밟은 원마커의 색상에 맞춰 화면에 제시된 해당 색깔의 체력 운동 동작을 수행합니다.</p>
