<h1>탁구공 릴레이 받기</h1>
<p>1) 팀을 나누고 컵을 든 채 둥글게 둘러서서 던지고 받을 순서를 정합니다. 2) 첫 주자가 다음 주자에게 탁구공을 바닥에 튕겨서 보냅니다. 3) 다음 주자가 컵으로 공을 받으면 1점을 얻고, 다시 바닥에 튕겨 다음 주자에게 보냅니다. 4) 받지 못하면 다음 순서 사람부터 다시 튀겨 진행하며, 모든 순서를 마친 후 점수를 합산해 승패를 가립니다.</p>
