<h1>하트 휴지잡기 챌린지</h1>
<p>1) 각자 두루마리 휴지 2개를 준비해 책상 위에 세워 놓는다.2) 휴지를 살짝 띄운 뒤 가운데에 공간을 만들어 하트 모양이 되도록 손으로 다시 잡는다 (1단계).3) 하트 모양을 한쪽 끝으로 보낸 뒤, 공중에 띄우면서 반대쪽으로 이동시켜 가운데로 모아 잡는다 (2단계).</p>
