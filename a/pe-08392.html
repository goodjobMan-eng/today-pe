<h1>어린이 축구 기초 개인기 6가지 연습</h1>
<p>1) 공을 드리블하여 수비수를 향해 적절한 속도로 다가간다. 2) 발바닥 당기기, 발바닥과 인사이드, 슛 페인트 후 접기, 헛다리(오버시저스), 라 크로케타, 룰렛 중 연습할 기술 동작으로 상대를 속인다. 3) 속임 동작 직후 순간적으로 속도를 높이며(템포 체인지) 수비수를 제치고 앞으로 치고 나간다.</p>
