<h1>킨볼 적응 및 협동 들기 놀이</h1>
<p>1) 킨볼을 손과 발로 굴리거나 몸으로 밀며 체육관을 자유롭게 이동한다 2) 2~3명이 머리와 양손을 모아 삼각형 모양의 받침대를 만들어 떨어지는 킨볼을 협동하여 받는다 3) 무릎을 꿇고 머리 위로 킨볼을 올려 균형을 잡으며 다른 친구에게 패스한다 4) 한 손으로 공 위를 누르고 발목을 호미처럼 걸어 혼자서 킨볼을 번쩍 들어 올리는 연습을 한다</p>
