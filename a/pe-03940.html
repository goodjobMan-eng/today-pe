<h1>붐 미로</h1>
<p>1) 20~30개의 훌라후프를 직사각형 모양으로 깔고 시작과 끝 지점에 콘을 놓는다. 2) 교사는 화이트보드에 시작부터 끝까지 이어지는 숨겨진 경로를 미리 그려둔다. 3) 학생들이 한 명씩 차례대로 훌라후프를 밟으며 보이지 않는 길을 찾아 전진한다. 4) 올바른 후프를 밟으면 계속 진행하고, 잘못된 후프를 밟아 교사가 '붐'이라고 외치면 줄 맨 뒤로 돌아간다.</p>
