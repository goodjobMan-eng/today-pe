<h1>뛰고 공 굴려 잡고 달리기</h1>
<p>1) 모둠별로 출발선에서 3m 떨어진 곳에 접시콘을 놓고, 10m 떨어진 곳에 삼각콘을 세운다. 2) 신호가 울리면 첫 번째 주자가 출발하여 삼각콘을 돌아 접시콘 위치에서 공을 굴린다. 3) 굴러오는 공을 출발선에서 두 번째 주자가 잡은 뒤 출발한다. 4) 마지막 주자가 굴린 공을 첫 번째 주자가 가장 먼저 잡은 모둠이 승리한다.</p>
