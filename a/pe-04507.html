<h1>볼 체이서 달리기 게임</h1>
<p>1) 양쪽 출발선에 마주 보게 콘을 배치하고 한쪽 콘 위에 테니스공을 올려둔다. 2) 신호가 울리면 공을 낚아채는 러너가 맞은편 공을 향해 달린다. 3) 공을 잡자마자 뒤돌아 출발선으로 도망치고, 추격자는 상대가 공을 잡는 순간부터 쫓아가 태그를 시도한다. 4) 출발선에 닿기 전에 태그되면 역할을 바꿔 다음 주자와 교대한다.</p>
