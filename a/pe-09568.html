<h1>단체 공 주고받기</h1>
<p>1) 책상을 시험 대형으로 놓고 공을 전달하는 대장 한 명을 중앙에 배치해요. 2) 대장은 공을 들고 가까운 위치에 있는 친구에게 공을 주고 공을 받은 친구는 다시 대장에게 공을 주고 자리에 앉아요. 3) 점점 먼 거리에 있는 친구들과도 주고받으며 모든 친구들과 한 번씩 공을 주고받으면 성공이에요.</p>
