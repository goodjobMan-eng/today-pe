<h1>채소 릴레이</h1>
<p>1) 학급을 4개 팀으로 나누고, 팀원마다 당근·샐러드·양배추·무 등 서로 다른 채소 이름을 하나씩 부여받는다. 2) 진행자가 특정 채소 이름을 부르면, 모든 팀에서 해당 채소 역할을 맡은 주자들이 동시에 출발한다. 3) 주자들은 자기 팀원들 사이를 지그재그(슬라럼)로 달린 뒤 제자리로 돌아온다. 4) 가장 먼저 제자리로 돌아온 주자의 팀이 1점을 획득하며, 모든 채소가 호명된 후 점수가 가장 높은 팀이 승리한다.</p>
