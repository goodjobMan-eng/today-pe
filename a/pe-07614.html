<h1>1학년 볼 감각 및 던지기 익히기 활동</h1>
<p>1) 콘 사이를 지나며 한 손에서 다른 손으로 공을 던져 잡고 돌아와 짝에게 전달한다. 2) 제자리에서 공을 위로 던져 잡거나 바닥에 튕겨 튀어오르는 공을 잡는다. 3) 한 손으로 바닥에 공을 눌러 튕긴다. 4) 벤치 위에 발을 올리고 목표 지점을 가리키며 짝을 향해 위로 공을 던진다.</p>
