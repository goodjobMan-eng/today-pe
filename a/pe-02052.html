<h1>가위바위보 술래잡기</h1>
<p>1) 1.5m 간격으로 마주 보고 서서 신호에 맞춰 가위바위보를 한다. 2) 이긴 학생은 진 학생을 쫓아가 도착 지점에 닿기 전에 태그한다. 3) 진 학생은 자기 쪽 도착 지점(FINISH 라인)으로 달아난다. 4) 비기거나 태그를 당한 경우 지정된 미션(스쿼트 3회 등)을 수행한다.</p>
