<h1>의자 스트레칭 및 댄스 운동 (암 앵글 &amp; 캐비지 패치)</h1>
<p>1) 의자에 바르게 앉아 화면의 동작과 박자에 맞춰 팔 운동을 따라 합니다. 2) 먼저 양팔을 교차하며 각도를 만드는 '암 앵글(Arm Angles)' 동작을 20초 동안 실시합니다. 3) 5초간 휴식한 후 주먹을 쥐고 원을 그리듯 흔드는 '캐비지 패치(Cabbage Patch)' 댄스 동작을 20초간 진행합니다. 4) 두 가지 동작 세트를 휴식과 함께 반복하여 상체 유연성과 리듬감을 기릅니다.</p>
