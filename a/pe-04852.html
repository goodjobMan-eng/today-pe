<h1>가위바위보 릴레이</h1>
<p>1) 출발선에서 5m 앞에 상대 팀 학생 1명이 서고, 그 뒤에 일정 간격으로 콘 3개를 일렬로 놓는다.2) 출발한 주자는 상대 팀 학생과 가위바위보를 한다.3) 이기면 첫 번째 콘, 비기면 중간 콘, 지면 가장 먼 콘을 돌아서 돌아와 다음 주자와 교대한다.</p>
