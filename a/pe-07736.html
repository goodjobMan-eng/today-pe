<h1>수비팀 게임 (Equipo Defensa)</h1>
<p>1) 경기장 양 끝에 골대를 두고 콘이나 선으로 골대 앞 수비 구역을 설정한다. 2) 각 팀을 공격수, 수비수, 골키퍼로 나누며 수비수는 자신의 수비 구역 밖으로 나갈 수 없다. 3) 공격수는 중앙 구역에서 움직이다가 상대 수비 구역을 통과할 수는 있지만 그 안에 머무를 수는 없으며 골을 넣어 득점한다.</p>
