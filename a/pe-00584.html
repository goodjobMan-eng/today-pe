<h1>배면 뜨기 (누워 뜨기)</h1>
<p>1) 물속에서 등을 대고 하늘을 보며 누운 자세를 취합니다. 2) 양손과 양발을 가볍게 벌리고 온몸에 힘을 최대한 뺍니다. 3) 폐 속에 공기를 가득 담아 두고 숨을 한 번에 너무 많이 내뱉지 않도록 조절하며, 가라앉지 않도록 손발을 살짝씩 움직여 균형을 잡아 20초간 유지에 도전합니다. 4) 익숙해지면 킥판을 안거나 물장구를 치며 배면 이동으로 발전시킵니다.</p>
