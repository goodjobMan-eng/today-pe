<h1>체육관 벤치 공 튀기기 드리블 연습</h1>
<p>1) 체육관에 길게 배치된 벤치 사이 공간과 벤치 위에서 공을 튀기며 이동한다. 2) 고무공을 바닥과 벤치 위에 튕기거나 드리블하며 자유롭게 움직인다. 3) 교사의 신호나 음악에 맞춰 벤치 사이를 달리며 공을 다루는 연습을 한다.</p>
