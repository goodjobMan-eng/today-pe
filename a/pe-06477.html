<h1>핑거 라이트볼 농구 및 축구 기능 연습</h1>
<p>1) 앉아서 또는 서서 핑거 라이트볼을 손가락 부분으로 낮게 드리블한다. 2) 제자리 드리블 후 공을 치며 실내에서 이동 드리블을 연습한다. 3) 벽을 향해 두 손으로 밀며 농구 체스트 패스를 연습한다. 4) 발등으로 공을 살살 치며 축구 드리블을 연습한다. 5) 벽을 향해 인사이드 킥 패스와 발등 슛을 연습한다. 6) 발로 공을 튀기는 리프팅과 발 안쪽 제기차기 연습을 이어간다.</p>
