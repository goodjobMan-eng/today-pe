<h1>숨바꼭질 태그</h1>
<p>1) 매트를 옆으로 세워 체육관 곳곳에 바리케이드를 만들고, 콘으로 피트니스 구역을 지정한다. 2) 술래 1명을 정하고 신호가 울리면 학생들은 체육관을 자유롭게 달리거나 매트 뒤에 숨는다. 3) 술래에게 태그된 학생은 콘이 놓인 피트니스 구역으로 이동한다. 4) 피트니스 구역에서 사전 지정된 운동(팔벌려뛰기, 팔굽혀펴기 등)을 완수한 후 다시 게임에 복귀한다.</p>
