<h1>페트병 쓰러뜨리기 볼링 릴레이</h1>
<p>1) 2개의 모둠을 이루고 게임장 한쪽 끝에 물을 담은 페트병 3개를 놓는다. 2) 각 모둠에서 공을 받는 사람은 페트병 뒤에 서고 나머지 모둠원은 공을 굴리는 사람 뒤에 줄을 선다. 3) 신호가 울리면 공을 굴려 페트병을 쓰러뜨리고, 쓰러진 페트병은 공을 굴린 사람이 다시 세운다. 4) 공을 받은 사람은 공을 들고와서 대기하는 친구에게 전달하고 줄의 맨 뒤에 서며, 25점을 먼저 획득한 모둠이 승리한다.</p>
