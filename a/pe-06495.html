<h1>6학년 표적도전 볼링 연습</h1>
<p>1) 오른손잡이는 중지와 약지, 엄지를 볼링공 구멍에 넣고 잡는다. 2) 오른발-왼발-오른발-왼발(오-왼-오-왼) 4스텝으로 걸어가며 점차 자세를 낮춘다. 3) 푸시어웨이 동작과 함께 공을 앞으로 내밀고 다운스윙 후 굴린다. 4) 한 사람당 2번씩 굴리며, 투구가 끝나면 공을 다음 사람에게 굴려주고 쓰러진 핀을 직접 세운다.</p>
