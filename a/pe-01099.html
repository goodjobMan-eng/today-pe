<h1>빈백 3개를 모아라 보물 쟁탈전</h1>
<p>1) 중앙 마커에 빈백 7개를 모아두고 사방 일정 거리에 개인 홈 마커를 배치해 대기한다. 2) 신호가 울리면 전력 질주하여 중앙에서 빈백을 한 번에 1개씩 집어 자기 홈 마커로 가져온다. 3) 중앙 빈백이 소진되면 상대 홈의 빈백을 뺏어올 수 있으며 먼저 3개를 모으면 승리한다. 4) 자기 빈백을 지키는 수비수를 지정하거나 목표 개수를 4개로 늘려 진행한다.</p>
