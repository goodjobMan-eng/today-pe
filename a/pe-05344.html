<h1>3구 저글링 기초 연습</h1>
<p>1) 손을 펴고 손목 스냅 없이 한 손으로 공을 반대 손 높이까지 띄웠다가 부드럽게 받아낸다.2) 공 한 개를 양손 사이에 포물선이 아닌 안쪽 아래에서 위로 던져 주고받는다.3) 공 두 개를 양손에 쥐고 던지고 던지고 받고 받고 순서로 연습한다.4) 공 세 개를 쥐고 공이 2개 있는 손부터 시작해 '던지고, 던지고, 던지고' 리듬으로 이어간다.</p>
