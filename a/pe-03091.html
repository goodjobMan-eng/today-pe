<h1>롱볼 (발야구 변형 게임)</h1>
<p>1) 체육관 양쪽 끝에 매트를 놓고 공격팀과 수비팀으로 역할을 나눈다. 2) 수비수가 굴려준 배구공을 공격수가 발로 차고 반대편 매트를 향해 달린다. 3) 수비팀은 공을 잡아 손으로 던져 달리는 공격수를 맞히거나 타구를 직접 플라이 아웃으로 잡는다. 4) 공격수가 반대편 매트를 거쳐 되돌아오면 1점을 얻으며, 선 뒤쪽으로 찬 공은 파울이 되어 다시 찬다.</p>
