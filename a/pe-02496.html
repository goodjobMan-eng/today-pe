<h1>뉴에이지 컬링 경기</h1>
<p>1) 개인전(1인당 4개 투구) 또는 단체전(1인당 2개 투구)으로 팀을 나누고 선공과 후공을 결정한다. 2) 투구 라인에서 바퀴 달린 스톤을 밀어 투구하며, 4m 앞 호그라인을 넘지 못한 스톤은 즉시 제거한다. 3) 양 팀이 번갈아 스톤을 1개씩 투구하여 모든 스톤 투구가 끝나면 해당 엔드를 종료한다. 4) 타겟(하우스) 중심에 가장 가까운 스톤을 가진 팀만 득점하며, 상대 팀 스톤보다 중심에 가까운 연속된 스톤 개수만큼 점수를 얻는다.</p>
