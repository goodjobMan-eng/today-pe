<h1>Hide Out</h1>
<p>1) 학생들은 체육관 둘레 검은 선에서 준비 자세로 시작하여 모두 시계 방향으로 달린다.2) 매트 뒤에 최대 10초까지 숨을 수 있다.3) 중앙 원 안에 있는 던지는 사람의 공에 맞으면 던지는 사람이 된다.4) 달리는 사람이 공을 직접 받으면 원 안에 있는 사람 중 한 명을 구출해 러너로 되돌릴 수 있다.</p>
