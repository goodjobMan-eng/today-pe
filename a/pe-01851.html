<h1>등 대고 앉았다 일어서기 협동 챌린지</h1>
<p>1) 두 명씩 짝을 지어 등을 맞대고 선 채로 양손을 바닥이나 무릎에 대지 않도록 준비한다. 2) 신호가 울리면 등을 서로 밀며 지탱하여 손을 전혀 쓰지 않고 천천히 바닥에 앉는다. 3) 두 사람 모두 엉덩이가 바닥에 닿으면 다시 손을 쓰지 않고 등을 밀어내며 함께 일어선다. 4) 성공하면 4명, 6명, 8명 등 모둠 인원을 점차 늘려 다함께 앉았다 일어서는 방식으로 변형한다.</p>
