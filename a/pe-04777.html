<h1>꽃게 하이파이브 술래</h1>
<p>1) 술래(문어)는 스펀지봉을 들고 도망치는 친구들을 태그하러 다닌다.2) 술래에게 태그된 친구는 꽃게 자세(손과 발로 바닥을 짚고 엉덩이를 든 자세)로 이동한다.3) 꽃게 자세가 된 두 사람이 서로 이동해 만나 하이파이브를 하면 둘 다 살아나 게임에 재참여한다.4) 게임 후 끝까지 꽃게 자세를 하지 않은 친구들을 칭찬한다.</p>
