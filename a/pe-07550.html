<h1>넉줄고누 놀이 (인간 넉줄고누)</h1>
<p>1) 원마커 16개로 넉줄고누 판을 배치하고 팀별로 4명씩 말을 맡아 양쪽 끝 줄에 마주 보고 선다. 2) 가위바위보로 선을 정한 뒤 차례대로 선을 따라 직선으로 한 칸씩 이동한다. 3) 가로·세로로 상대 말을 가두거나 모서리 길목을 막아 따먹고, 상대 말을 1개만 남기면 승리한다.</p>
