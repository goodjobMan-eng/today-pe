<h1>멀티볼 실전 경기 체험</h1>
<p>1) 초등부 기준 전반전 15분, 후반전 15분으로 경기를 진행한다. 2) 전·후반전 내 세트 경기는 3분 동안 진행된다. 3) 세트 경기에서 이기면 2포인트를 획득하고 무승부일 경우 1포인트를 획득한다. 4) 전·후반전 모든 경기가 종료된 후 포인트 점수가 높은 팀이 최종 승리한다.</p>
