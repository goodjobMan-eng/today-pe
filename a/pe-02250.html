<h1>공 뺏기 놀이</h1>
<p>1) 전체 인원을 두 팀으로 나눈다. 2) 경기장을 반으로 나누어 상대편 진영에 훌라후프를 배치하고, 시작 신호와 함께 상대편 공을 뺏으러 넘어간다. 3) 훌라후프 안은 안전지대로 상대팀이 들어갈 수 있으며 이때는 아웃되지 않는다. 4) 공을 들고 있다가 태그되어 아웃되면 공은 그 자리에 두고 자기 진영으로 돌아간다. 5) 상대편의 공을 우리 팀 영역으로 안전하게 가져오거나 상대팀을 모두 터치하면 승리한다.</p>
