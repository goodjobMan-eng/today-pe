<h1>이동하며 공 던지고 잡기</h1>
<p>1) 반 전체를 두 모둠으로 나누고 모둠별로 두 명씩 짝을 이룬 다음 순서를 정한다. 2) 출발 신호와 함께 짝을 이룬 두 명이 공을 던지고 잡으면서 반환점을 돌아온다. 3) 공을 잡은 친구는 한 걸음만 움직일 수 있고 공을 잡지 못하면 3초 동안 공을 들고 있다가 던진다. 4) 마지막 짝이 가장 빨리 출발선으로 돌아온 모둠이 이긴다.</p>
