<h1>글자와 숫자 게임</h1>
<p>1) 진행자가 숫자와 글자를 부르면 해당되는 사람이 중앙으로 나간다. 2) 숫자는 아무것도 없는 사람, 글자는 머리에 띠를 두른 사람이다. 3) 중앙으로 나간 두 사람은 서로 뺨에 뽀뽀를 하려고 하고, 같은 팀인 다른 사람이 이를 막는다. 4) 뽀뽀를 성공하면 점수를 얻고, 실패하면 중앙에 앉는다.</p>
