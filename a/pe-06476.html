<h1>헥사 야구</h1>
<p>1) 중앙 홈베이스와 육각형 6개 꼭짓점에 훌라후프를 놓고 각 베이스를 라인기로 연결한다. 2) 타자가 공을 치면 1루 방향으로 달리고 수비수는 공을 잡아 내야로 송구한다. 3) 투아웃이 되면 공수를 교대하며 외야 안타 시 수비가 내야로 공을 보낼 때까지 주자가 계속 진루할 수 있고 파울 없이 2회씩 진행한다.</p>
