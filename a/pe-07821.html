<h1>쓰레기장 배구 게임</h1>
<p>1) 배구 코트에 네트를 설치하고 학급을 두 팀으로 나누며 각 팀 코트 맨 뒤에 훌라후프를 놓습니다. 2) 양 팀에 폼볼을 나누어 준 뒤 신호와 함께 상대 진영으로 공을 던져 넘깁니다. 3) 상대가 던진 공이 바닥에 닿기 전에 바로 잡으면 자기 진영 뒤쪽 훌라후프 안에 넣어 모읍니다. 4) 경기가 끝났을 때 훌라후프 안에 더 많은 공을 모은 팀이 승리합니다.</p>
