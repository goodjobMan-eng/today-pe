<h1>빨대 입바람 풍선 부양 협동 놀이</h1>
<p>1) 모둠원 4~5명이 둥글게 모여 서고 각자 빨대를 하나씩 입에 문다. 2) 교사의 신호와 함께 가운데에 풍선을 띄우고 빨대로 바람을 불어 공중에 띄운다. 3) 풍선이 바닥에 닿지 않고 공중에 머무는 시간을 측정한다. 4) 빨대의 굵기나 길이를 바꾸거나 풍선 개수를 늘려 난이도를 조정한다.</p>
