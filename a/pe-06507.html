<h1>전깃줄 피하기 놀이</h1>
<p>1) 교사와 학생 도우미가 약 10m 로프(긴 줄) 양 끝을 잡고 선다. 2) 줄을 좌우로 흔들거나 높낮이와 속도를 변화시키며 전깃줄을 만든다. 3) 참가 학생들은 걸리지 않고 전깃줄을 뛰어넘거나 피하며, 걸려 감전되면 자기 자리로 가 줄넘기를 한다.</p>
