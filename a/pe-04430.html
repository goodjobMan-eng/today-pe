<h1>배구 언더핸드 패스 짝 연습</h1>
<p>1) 콘 위치에서 두 명이 마주 보고 한 명은 공을 높게 던져주는 피더, 다른 한 명은 리시버가 된다. 2) 팔을 곧게 뻗고 한 손 위에 다른 손을 얹은 뒤 엄지손가락을 모아 언더핸드 자세를 만든다. 3) 피더가 높게 던져준 공을 향해 발을 내딛으며 손이 아닌 전완(앞팔) 부위로 받아 피더에게 높게 패스한다. 4) 패스를 10회 실시한 후 역할을 서로 바꾸어 진행한다.</p>
