<h1>스쿠프게임</h1>
<p>1) 중앙선에서 스쿠프 플레이로 경기를 시작한다.2) 공을 가진 사람은 걷거나 달릴 수 없으며, 7초 이내에 패스로만 공을 이동시킨다.3) 상대 팀의 골 에어리어(페널티 에어리어) 안으로 들어가 패스된 공을 스쿠프로 직접 잡으면 득점한다.4) 스쿠프 안에 잡힌 공은 빼앗을 수 없으나 날아가는 공을 가로채거나 땅에 떨어진 공을 스쿠프로 덮어 소유권을 얻을 수 있다.</p>
