<h1>고깔 지키기와 차지하기</h1>
<p>1) 두 팀으로 나뉘어 각자 영역에 같은 수의 고깔을 원하는 위치에 세워 둔다. 2) 시작 신호가 울리면 정해진 시간 동안 상대 영역의 고깔을 넘어뜨리고 자기 팀 고깔을 다시 세운다. 3) 시간이 종료되었을 때 세워져 있는 고깔 수가 더 많은 팀이 승리한다. 4) 이어지는 고깔 차지하기에서는 색깔별 고깔을 둥글게 배치하고 음악에 맞춰 돌다가 교사가 외치는 색깔의 고깔을 재빠르게 찾아 잡는다.</p>
