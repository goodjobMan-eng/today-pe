<h1>런지 컵 쌓기 도전</h1>
<p>1) 시작 위치에 서서 뒷런지를 하여 발 옆에 컵 12개를 일렬로 쌓아 놓는다. 2) 앞뒤 런지 동작을 반복하며 컵을 하나씩 옮겨 3-6-3 피라미드 모양으로 탑을 쌓는다. 3) 탑을 완성한 뒤 발을 바꾸어 런지 동작으로 역순으로 컵을 하나씩 회수하여 원위치에 모으면 성공한다. 4) 동작에 익숙해지면 사이드 런지를 활용해 6-6 피라미드 쌓기나 시간 단축에 도전한다.</p>
