<h1>화장실 변기 술래잡기</h1>
<p>1) 술래에게 태그되면 소변기 자세(양팔 벌림)나 좌변기 자세(한 손을 내밀고 앉기)로 멈춘다.2) 도망가는 친구가 소변기 자세의 팔을 내려주거나 좌변기 레버를 누르는 동작을 해주면 물 내리는 소리를 내며 살아난다.3) 변형 규칙으로 샤워기 자세를 취한 친구의 레버를 누르고 샤워하는 흉내를 내어 부활시킬 수도 있다.</p>
