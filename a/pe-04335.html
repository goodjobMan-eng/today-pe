<h1>히어 피시 피시 태그</h1>
<p>1) 술래(어부)는 3점 라인에서 시작하고, 나머지 학생은 프리스비를 들고 이동합니다. 2) 술래가 태그할 때 자신의 태그 스틱 색깔을 외칩니다. 3) 태그된 학생은 해당 색깔의 라이브 웰(바구니)에 프리스비를 넣고 매트에서 대기합니다. 4) 라운드 종료 후 바구니 속 프리스비의 무게(lb)를 합산하여 가장 높은 팀이 승리합니다.</p>
