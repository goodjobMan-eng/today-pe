<h1>이름 부르며 큰 공 이어주기</h1>
<p>1) 바닥에 지름 약 2m의 원을 그리고, 6명으로 구성된 모둠원이 적당한 간격을 두고 둘러선다. 2) 공을 보낼 친구의 이름을 부르면서 큰 공을 쳐서 이어준다. 3) 이름이 불린 친구는 바닥에 한 번 튄 공을 받아 다시 다른 친구의 이름을 부르며 이어준다. 4) 모둠원 6명의 손을 모두 거쳐 공이 이어지면 1점을 획득하며, 정해진 시간 동안 가장 많은 점수를 얻은 모둠이 이긴다.</p>
