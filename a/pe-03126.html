<h1>멈출 콩 콩주머니 책상 컬링 놀이</h1>
<p>1) 여러 개의 책상을 길게 일렬로 붙여 경기장을 만들고 끝 쪽에 콩주머니 5개를 둔다. 2) 모둠원이 출발선에 서서 순서대로 번갈아 책상 위로 콩주머니를 던지거나 민다. 3) 콩주머니가 떨어지지 않고 마지막 책상 위에 멈추면 성공으로 인정하며, 떨어진 콩주머니는 주워 온다. 4) 경쟁 모드로 진행할 때는 상대방의 콩주머니를 쳐내어 떨어뜨릴 수 있으며 주어진 콩주머니를 먼저 모두 안착시킨 팀이 승리한다.</p>
