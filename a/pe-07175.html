<h1>애니멀 팜 (동물 농장)</h1>
<p>1) 체육관에 흩어진 학생들에게 각 동물마다 최소 2명 이상이 되도록 역할을 지정한다. 2) 신호가 울리면 배정된 동물처럼 움직이고 해당 동물 울음소리를 내며 돌아다닌다. 3) 소리를 듣고 짝을 찾으면 멈춰 서서 모든 학생이 짝을 찾을 때까지 기다린다.</p>
