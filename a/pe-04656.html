<h1>성을 지켜라</h1>
<p>1) 볼링핀(성)을 세우고 각 성마다 수비자(가드)를 1명씩 배치한다. 2) 도전자들은 수비자의 태그를 피해 볼링핀을 쓰러뜨리려고 접근한다. 3) 핀을 쓰러뜨린 도전자는 새로운 가드가 된다. 4) 가드에게 태그된 도전자는 그 자리에서 벗어나 다른 성으로 이동해야 한다.</p>
