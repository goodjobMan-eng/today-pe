<h1>스포츠 빈백 - 축배를 들까?</h1>
<p>1) 축구공 모양 빈백(축) 또는 배구공 모양 빈백(배) 중 하나를 선택해 등 뒤 손안에 숨긴다.2) 돌아다니다가 친구를 만나 발 가위바위보를 진행한다.3) 가위바위보에서 이긴 사람이 진 사람의 손에 든 빈백 종류(축구공 또는 배구공)를 맞힌다.4) 정답을 맞히면 해당 빈백을 획득하고, 패자는 새 빈백을 보충하거나 변경하여 다른 친구를 찾는다.</p>
