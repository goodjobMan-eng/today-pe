<h1>뜀틀 높은 착지대 밀어내기 연습</h1>
<p>1) 뜀틀 착지 지점에 두꺼운 매트를 여러 겹 쌓아 뜀틀보다 높은 높이로 설정한다.2) 도움닫기 후 뜀틀을 짚고 손으로 힘차게 바닥을 밀어내며 높은 매트 위로 올라선다.3) 다리벌려뛰기(개각도비)와 모아뛰기를 차례로 실시하며 높은 매트 위에서 발바닥으로 안정되게 착지한다.</p>
