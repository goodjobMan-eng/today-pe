<h1>관절 부상 없는 안전한 줄넘기 기본자세 및 모아뛰기 500회 도전</h1>
<p>1) 줄을 반으로 접어 한쪽 발로 밟고 양손 손잡이가 명치 높이까지 오도록 길이를 맞춘다. 2) 차렷 자세에서 뒤꿈치를 살짝 들고 무릎을 살짝 굽혀 충격을 흡수할 수 있는 기본 준비 자세를 잡는다. 3) 팔을 몸에 붙이고 손목만 살짝 가볍게 돌리며 발목과 무릎의 반동을 이용해 가볍게 뛴다. 4) 줄넘기 모아뛰기로 1분에 100회씩 총 5분간 500회 연속 뛰기에 도전한다.</p>
