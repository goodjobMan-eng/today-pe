<h1>풍선 머리 튕겨 천장 닿기 대결</h1>
<p>1) 지름 1m 크기의 원을 바닥에 표시하고 그 안에서 풍선을 준비한다. 2) 원 안에서 머리로 풍선을 쳐서 반드시 천장에 닿도록 연속해서 튕긴다. 3) 한 발이 원 밖으로 나가는 것은 허용되나 두 발이 모두 나가거나 풍선이 땅에 떨어지면 종료된다. 4) 기회는 총 2번 주어지며, 천장에 닿은 횟수만 카운트하여 더 높은 기록을 측정한다.</p>
