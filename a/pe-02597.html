<h1>동네길 돌기 놀이</h1>
<p>1) 교실 책상 사이의 길을 자유롭게 돌아다닌다. 2) 친구와 마주치면 멈춰 서서 가위바위보를 한다. 3) 진 사람은 이긴 사람의 어깨에 손을 얹고 뒤를 따라간다. 4) 줄끼리 만나면 앞사람끼리 가위바위보를 하여 진 팀 전체가 이긴 팀 뒤에 붙어 긴 기차를 만든다.</p>
