<h1>배틀볼(피구 변형 게임)</h1>
<p>1) 경기는 6분 동안 진행되며 일정 시간마다 공이 추가된다. 2) 맞히거나 잡히면 상대 팀 매트로 이동해 세미 아웃 상태로 공을 던질 수 있다. 3) 머리를 맞히거나 던진 공이 잡히면 아웃된다.</p>
