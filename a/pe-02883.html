<h1>달리고! 쌓고! 찍고! 정리하고! 돌아오기!</h1>
<p>1) 2~4개 팀으로 나누고, 사물함(출발선)에 한쪽 손과 발을 붙인 상태에서 출발한다. 2) 달려와서 중간 지점에 있는 6개의 대형 컵을 3층 피라미드 모양으로 쌓는다. 3) 반환점(칠판 등)을 손으로 터치한다. 4) 3층으로 쌓았던 컵을 다시 한 줄로 정리하고 먼저 출발선으로 돌아간 사람이 승리한다.</p>
