<h1>데몰리션(콘 무너뜨리기 게임)</h1>
<p>1) 양 팀이 코트 양 끝 베이스라인에 나뉘어 서고, 중앙에 팀별로 6개의 콘으로 쌓은 탑을 2개씩 설치한다. 2) 축구공을 발로 차거나 굴려서 상대 팀의 콘 탑을 맞혀 무너뜨린다. 3) 콘이 무너진 팀은 팀원의 절반이 복귀해 탑을 다시 쌓아야 하며, 그동안 상대 팀 탑을 공격할 수 없다.</p>
