<h1>원바운드 3회 연결 배구 게임 (바운스 배구)</h1>
<p>1) 네트를 사이에 두고 팀당 4명씩 코트에 위치한다. 2) 서브된 공이 바운드되면 잡아 앞으로 토스하고 튕겨 스파이크하는 순서로 3번 만에 넘긴다. 3) 스파이크 시 공격수는 후회로 빠졌다가 스텝(왼-따닥-점프-쳐)을 밟으며 뛰어올라 공을 때린다. 4) 서브-리시브-토스-스파이크로 연결하며 랠리를 이어가 득점한다.</p>
