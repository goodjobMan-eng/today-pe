<h1>훌라후프 리듬 스텝 점프 놀이</h1>
<p>1) 바닥에 훌라후프를 배치하고, 동요나 구령 리듬에 맞춰 후프 안팎으로 발을 디디며 점프합니다. 2) 개인별 점프 동작을 연습한 뒤 2명 또는 3~4명이 한 모둠이 되어 동시에 호흡을 맞춥니다. 3) 특정 구령이나 박자에 맞춰 정해진 방향으로 발을 빼거나 넣는 협동 스텝을 수행합니다. 4) 후프를 밟지 않고 박자에 맞춰 끝까지 일치된 동작을 이어가면 성공입니다.</p>
