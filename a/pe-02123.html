<h1>단체 사방치기</h1>
<p>1) 4명이 한 팀이 되어 사방치기 판의 1번 칸부터 순서대로 말을 던진다. 2) 말이 들어간 칸을 피해 앙감질(깨금발)과 모둠발로 통과한 뒤 마지막 '하늘' 칸에 순서대로 모두 들어간다. 3) 하늘 칸을 밟고 뒤돌아서 역순으로 칸을 밟으며 자신의 말을 줍고 밖으로 나온다. 4) 4명이 차례로 8단계(하늘)까지 성공한 후 뒤돌아서 말을 던져 들어간 칸을 팀의 땅으로 차지한다.</p>
