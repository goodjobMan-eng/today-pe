<h1>핀 녹오버(Pin Knockover) — 수비 금지선 볼링핀·콘 투척 무너뜨리기</h1>
<p>강당 양쪽 엔드라인에 각 팀당 볼링핀(또는 라바콘) 5~6개를 세우고 핀 앞쪽에 수비 출입 금지 구역(No-Guard Zone)을 표시합니다. 중앙선을 넘지 않고 공을 굴리거나 언더핸드·오버핸드로 던져 상대 진영의 핀을 먼저 모두 쓰러뜨리는 팀이 승리합니다.</p>
