<h1>접시콘 보물찾기</h1>
<p>1) 친구들이 볼 수 없게 뒤를 돌아보게 한 뒤 접시콘을 넓게 펼쳐 놓고 그 밑에 작은 과자나 사탕을 숨긴다. 2) 신호가 울리면 접시콘을 하나씩 뒤집어가며 숨겨진 보물을 찾는다. 3) 찾은 보물을 먼저 획득하거나 정해진 시간 내에 찾아내면 종료된다. 4) 난이도를 높일 때는 접시콘을 머리 위에 올리고 이동하며, 머리에서 떨어지면 출발점으로 돌아가 다시 올리고 출발한다.</p>
