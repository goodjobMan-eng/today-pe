<h1>손치기 발치기</h1>
<p>1) 짝과 마주 보고 서서 노래에 맞춰 가슴 앞에서 손뼉을 마주친다. 2) 노래 구절에 맞춰 발을 뻗어 짝과 발끝을 마주친다. 3) 뒤이어 양손을 흔들거나 제자리에서 돌며 짝과 동작을 맞춘다. 4) 여럿이 함께 원을 만들어 손을 잡고 오른발과 왼발을 번갈아 뛰며 강강술래 대형으로 확장한다.</p>
