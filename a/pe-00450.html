<h1>쫓고 쫓기며! (원형 꼬리잡기 달리기)</h1>
<p>1) 원 둘레를 4등분한 지점에 주자들이 서고 바지에 종이테이프 꼬리를 끼웁니다. 2) 신호와 함께 일제히 같은 방향으로 원을 따라 달리며 앞사람의 테이프를 쫓아 뜯습니다. 3) 심판이 5~10초마다 호루라기를 불면 즉시 달리는 방향을 반대로 바꿉니다. 4) 꼬리를 빼앗긴 사람은 원 밖으로 나가며, 정해진 시간(30~40초) 동안 살아남거나 꼬리를 많이 획득합니다.</p>
