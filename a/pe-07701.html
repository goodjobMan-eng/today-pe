<h1>신뢰의 높은 길 건너기</h1>
<p>1) 두 줄로 마주 보고 서서 짝과 함께 체조봉을 양손으로 단단히 잡는다. 2) 통로 시작과 끝에 뜀틀용 긴 의자(팀 벤치)를 놓아 발판을 만든다. 3) 한 학생이 벤치를 딛고 올라서서 동료들의 어깨를 잡으며 체조봉 위로 건너간다.</p>
