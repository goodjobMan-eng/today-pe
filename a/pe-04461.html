<h1>라인 위 팩맨 술래잡기</h1>
<p>1) 코트 경기장 바닥의 라인 위에 모든 참가자가 자리를 잡고 선다. 2) 교사가 코트 중앙에서 시작할 팩맨(술래) 2명을 선정한다. 3) 모든 사람은 라인 위로만 이동해야 하며 술래에게 터치당하지 않고 제한 시간까지 살아남아야 한다. 4) 술래에게 터치당하면 그 자리에 앉아 블록(장애물)이 되어 술래 외 다른 사람이 지나가지 못하게 방해하며, 의사 역할을 추가해 살릴 수도 있다.</p>
