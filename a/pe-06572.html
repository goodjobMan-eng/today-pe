<h1>4차원 축구 (콘 한 바퀴 &amp; 원에서 받아라 &amp; 넓게 넓게 축구)</h1>
<p>1) 운동장 네 귀퉁이에 콘을 세우고 공을 가진 사람이 드리블하여 상대 팀 콘을 한 바퀴 돌면 득점한다. 2) 운동장에 지름 약 2m 원 3개를 그리고 팀원끼리 3회 이상 패스한 후 양발이 모두 원 안에 들어간 팀원에게 패스하면 득점한다. 3) 한 팀은 미니골대 2개를 합친 넓은 골대를 쓰고 다른 팀은 양 끝에 떨어진 골대 2개를 공격하며 전반 5분 후 골대를 바꿔 진행한다.</p>
