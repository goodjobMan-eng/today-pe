<h1>훌라후프 가위바위보 대결</h1>
<p>1) 각 팀에서 한 명씩 출발해 훌라후프를 점프하며 전진한다. 2) 상대 선수와 마주치면 멈춰 서서 가위바위보를 한다. 3) 이긴 사람은 계속 점프해 전진하고, 진 사람은 자기 팀 줄 맨 뒤로 돌아가며 다음 주자가 출발한다. 4) 후프 코스 끝까지 도달하면 상대 팀 통에서 막대기를 1개 획득한다.</p>
