<h1>새해맞이 밸런스 브레인 브레이크 운동</h1>
<p>1) 화면에 제시되는 두 가지 새해 관련 선택지 중 마음에 드는 쪽을 고릅니다. 2) 오른쪽 선택지가 좋으면 오른쪽으로, 왼쪽 선택지가 좋으면 왼쪽으로 이동합니다. 3) 화면이 전환되면 선택한 쪽에 해당하는 신체활동이나 동작을 시간 동안 따라 합니다. 4) 중간에 나오는 달리기 대결이나 틀린 그림 찾기 미니게임에도 적극적으로 참여합니다.</p>
