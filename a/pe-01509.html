<h1>동요 리듬 짝 줄넘기 놀이</h1>
<p>1) 두 명씩 짝을 짓고 각자 줄넘기를 준비하거나 둘이서 줄 하나를 함께 쥐고 나란히 선다. 2) 전래 동요나 리듬에 맞추어 양발 모아 뛰기와 좌우 스텝을 기본 동작으로 뛴다. 3) 노래 가사 중 정해진 특정 글자나 박자에 맞춰 방향을 바꾸거나 양발을 교차해 뛴다. 4) 짝과 줄을 하나씩 맞바꿔 쥐거나 둘이 함께 한 줄로 호흡을 맞춰 연속 도약하는 고난도 버전으로 발전시킨다.</p>
