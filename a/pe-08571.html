<h1>포 스퀘어(Four Square)</h1>
<p>1) 4개의 칸으로 나뉜 구역에서 공을 튕겨 상대방의 칸으로 보냅니다. 2) 공이 자신의 칸에 한 번 튕긴 후 상대방의 칸으로 쳐서 보냅니다. 3) 공을 밖으로 보내거나, 라인을 맞히거나, 자신의 칸에서 두 번 튕기면 탈락합니다.</p>
