<h1>모두의 손 (제자리 일어나기 및 물웅덩이)</h1>
<p>1) 두 명이 마주 보고 앉아 무릎을 세우고 발코를 맞댄 뒤 손을 잡고 신호에 맞춰 동시에 일어난다.2) 인원을 4~6명으로 늘려 둥글게 앉은 뒤 팔을 X자로 꼬아 손을 잡고 발을 맞대어 동시에 일어난다.3) 3~4명이 원을 만들어 손을 잡고 콘이나 후프로 표시된 물웅덩이 안으로 상대를 당기거나 밀어 넣으며 빠진 사람은 팔벌려뛰기 5회를 수행한다.</p>
