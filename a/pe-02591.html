<h1>순발력 숫자 밟기 놀이</h1>
<p>1) 방어팀이 경기 구역(배드민턴 코트 크기 등) 안 곳곳에 1부터 10까지 적힌 숫자판을 놓는다. 2) 공격팀 주자들은 출발선 바깥에서 순서대로 대기한다. 3) 출발 신호에 맞춰 공격팀 주자가 1부터 10까지 번호 순서대로(또는 10부터 1 역순으로) 숫자판을 모두 밟는다. 4) 모든 주자가 순서대로 통과하여 걸린 총 시간을 측정하고 공수 교대 후 시간이 더 짧은 팀이 승리한다.</p>
