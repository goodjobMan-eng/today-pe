<h1>책상 비트 놀이</h1>
<p>1) 손 치기는 '손', 책상 치기는 '책', 발구르기는 '발'로 동작 구호를 약속한다. 2) 1단계로 네 박자(한 마디) 구호에 맞춰 교사의 비트 동작을 따라 한다. 3) 익숙해지면 2단계로 여덟 박자(두 마디) 동작으로 늘려 따라 한다. 4) 두 팀으로 나뉘어 서로 다른 비트를 동시에 연주하여 화음을 만든다.</p>
