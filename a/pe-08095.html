<h1>인디애나 존스 (옴니킨볼 피하기 놀이)</h1>
<p>1) 학생들이 안쪽 원과 바깥쪽 큰 원으로 이중 원 대형을 만들어 선다. 2) 5명의 주자가 두 원 사이의 트랙 공간으로 들어가 달린다. 3) 두 원의 학생들이 대형 옴니킨볼을 손으로 쳐서 굴리며 달리는 주자들을 맞히고, 공에 맞은 주자는 탈락하여 원 라인에 합류한다.</p>
