<h1>휴지 활용 실내 신체활동</h1>
<p>1) 양쪽에 둔 휴지 사이를 옆걸음으로 왕복 이동하며 손으로 터치한다. 2) 한쪽 휴지를 볼링공처럼 굴려 반대쪽 휴지를 맞힌다. 3) 공중에 띄운 휴지 조각을 입으로 불어 바닥에 떨어지지 않게 유지한다.</p>
