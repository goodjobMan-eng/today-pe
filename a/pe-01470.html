<h1>바디 파츠 드리블 스톱 놀이</h1>
<p>1) 학생들은 각자 축구공 1개씩을 발밑에 두고 정해진 활동 구역 안에서 자유롭게 발로 드리블한다. 2) 주변 친구들과 충돌하지 않도록 고개를 들고 넓게 시야를 살피며 드리블을 지속한다. 3) 술래나 교사가 호명하는 신체 부위(발바닥, 엉덩이, 무릎, 머리 등)를 듣고 즉시 해당 부위로 공을 멈춰 세운다. 4) 발전 단계에서는 교사가 부른 신체 부위 '이외의' 다른 부위로 공을 멈추는 반대 동작 규칙으로 진행한다.</p>
