<h1>퀵 드로우 (공 끌어당기기 반응 게임)</h1>
<p>1) 두 학생이 선을 사이에 두고 마주 보며, 공 하나를 선 위에 두고 두 발을 선 뒤 땅에 딛고 선다. 2) 신호 전에는 두 발이 반드시 선 뒤 지면에 닿아 있어야 한다. 3) 교사가 &quot;출발(Go)&quot; 신호를 외치면 발로 공을 먼저 자기 쪽으로 끌어당긴 사람이 1점을 얻으며 3판 2선승제로 겨룬다.</p>
