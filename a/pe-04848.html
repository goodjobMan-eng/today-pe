<h1>어드밴티지 피구</h1>
<p>1) 반 아이들을 두 팀으로 나누고 직사각형 피구장을 준비한다.2) 각 팀이 한 줄로 마주 보고 서서 팀원별로 가위바위보를 진행하여 이긴 사람 수를 센다.3) 가위바위보를 더 많이 이긴 팀이 피구장의 3분의 2를 차지하고, 진 팀은 3분의 1을 차지하도록 가운데 경계선을 조정한다.4) 해당 영역에 들어가 피구 경기를 진행하며 승리 팀이 승점 1점을 획득하고, 정해진 시간이나 횟수 동안 최종 승점을 겨룬다.</p>
