<h1>배구 기초 서브(언더핸드 서브 &amp; 오버핸드 서브)</h1>
<p>1) 공을 든 팔을 가슴 앞에 곧게 뻗고, 타격 팔은 주먹을 쥐어 뒤로 뺀다. 2) 큰 걸음을 앞으로 내딛으며 공을 살짝 띄우고 아래에서 위로 주먹으로 쳐 언더핸드 서브를 넣는다. 3) 활을 당기듯 타격 손을 귀 뒤로 젖히고 높은 위치에서 공을 위로 곧게 던져 올린다. 4) 손가락을 넓게 편 손바닥으로 가능한 한 높은 타점에서 하이파이브하듯 공을 쳐 오버핸드 서브를 넣는다.</p>
