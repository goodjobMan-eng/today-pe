<h1>자세 교정과 근력 향상을 위한 단계별 코어 운동</h1>
<p>1) 눈을 감고 한 발로 서서 균형을 잡으며 5초간 버팁니다. 2) 누워서 다리를 들어 올리거나 자전거 페달을 밟듯이 전방 및 후방으로 발을 회전하고, 엎드린 상태에서 한 손과 반대쪽 발을 들어 올려 중심을 유지합니다. 3) 누운 상태에서 다리를 곧게 펴고 발바닥으로 공중에 숫자나 글자를 크게 씁니다. 4) 벽을 마주 보며 물구나무서기를 하고 시선을 손 사이로 둔 채 코어에 힘을 줍니다.</p>
