<h1>매트 위 구르기와 돌기 도전 활동</h1>
<p>1) 양팔을 위로 뻗고 옆으로 3바퀴씩 구르기를 실시한다. 2) 양발을 잡고 몸을 웅크린 상태에서 옆으로 10회 구른다. 3) 무릎을 잡고 옆으로 굴렀다 일어나는 동작을 양쪽 5회씩 실시한다. 4) 오뚝이처럼 등을 둥글게 말아 앞뒤로 구르며 일어나는 동작을 10회 실시한다.</p>
