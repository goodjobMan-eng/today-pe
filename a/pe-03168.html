<h1>신체 부위별 스트레칭</h1>
<p>1) 목을 앞으로 숙였다가 뒤로 젖히고, 손으로 감싸 양옆으로 기울인다. 2) 양손을 어깨에 대고 앞뒤로 돌린다. 3) 한쪽 손바닥을 바깥으로 향하게 하여 당기고, 한 팔을 반대편 손으로 잡아 가슴 쪽으로 당긴다. 4) 깍지 끼고 양옆으로 몸통을 늘린 후 앉아서 무릎을 펴고 발목을 가볍게 돌린다.</p>
