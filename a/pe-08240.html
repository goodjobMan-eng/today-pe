<h1>협동 릴레이 훈련 (STAFETTER)</h1>
<p>1) [공 굴리기]: 모둠원 전체가 다리를 벌리고 일렬로 엎드려 터널을 만들면 맨 앞 주자가 다리 사이로 농구공을 굴린 뒤 엎드려 있는 팀원들 위를 뛰어넘어 공을 잡으러 간다 2) [뛰고 숙이기]: 팀원들이 무릎 꿇기와 서기 자세를 번갈아 취하고 양팔을 벌리면 주자가 점프와 포복으로 통과한다 3) [드리블 릴레이]: 콘을 활용해 직진, 후진, 지그재그 방식으로 농구공을 드리블하며 반환점을 돌아온다</p>
