<h1>아임 굿 댄스 피트니스 워크아웃</h1>
<p>1) 음악에 맞추어 제자리에서 가볍게 스텝을 밟으며 피트니스 댄스를 시작합니다. 2) 팔을 위로 올리거나 리듬에 맞춰 펀치를 뻗고 점프 동작을 연결하여 진행합니다. 3) 영상에 나오는 박자와 동작 흐름을 보며 전신을 골고루 활용해 유산소 운동을 합니다. 4) 노래가 끝날 때까지 동작을 지속하며 체력을 기르고 스트레스를 해소합니다.</p>
