<h1>점프 밴드 고무줄 스텝 활동</h1>
<p>1) 두 명의 발목에 탄력 밴드를 걸쳐 벌려 서고, 한 명씩 밴드 사이에 선다. 2) 왼발 밖으로, 오른발 밖으로, 오른발 안으로, 왼발 안으로 순서대로 빠르게 발을 움직인다. 3) 두 발로 안에서 바깥으로 벌려 뛰었다가 다시 모아 뛰는 스트래들 점프를 반복한다. 4) 동작에 익숙해지면 밴드의 높이를 발목에서 점차 위로 올려 난이도를 높인다.</p>
