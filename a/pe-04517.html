<h1>경찰과 도둑 술래잡기</h1>
<p>1) 높은 콘 5개로 감옥 구역을 설치하고 도둑들은 구역 전체로 흩어진다. 2) 경찰 역할을 맡은 술래가 도둑들을 쫓아다니며 태그한다. 3) 경찰에게 잡힌 도둑은 감옥으로 이동하며, 교사가 정해준 과제(별점프 10회, 한 발 서기 20초 등)를 완료해야 감옥을 탈출해 게임에 복귀할 수 있다. 4) 교사가 호각을 불었을 때 감옥에 갇히지 않고 살아남아 있는 도둑은 1점을 획득한다.</p>
