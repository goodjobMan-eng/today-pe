<h1>훌라후프 회전 점핑잭 및 조끼 던져 받기 이동 미션</h1>
<p>1) 훌라후프를 손으로 회전시킨 후 훌라후프가 완전히 멈추기 전까지 점핑잭을 수행한다.2) 팀 조끼를 앞으로 던진 후 떨어지기 전에 달려가 잡고 원마커나 착지 지점에 놓는다.3) 조끼를 잡지 못하고 놓치면 출발점으로 다시 돌아와 재도전한다.4) 과제를 성공할 때마다 점핑잭을 5회씩 실시하여 총 15회를 먼저 완료한 학생이 성공한다.</p>
