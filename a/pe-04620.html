<h1>초등 6학년 표적 게임 디스크 골프</h1>
<p>1) 팀별로 학교 운동장 지도 시트에 티오프 콘과 표적이 될 후프 위치를 정해 홀을 설계한다. 2) 각 홀마다 예상 타수인 기준 타수(파, 2~5타)를 직접 설정한다. 3) 다른 팀의 홀을 돌며 티오프 지점에서 표적인 후프를 향해 디스크를 던진다. 4) 디스크를 던진 횟수를 기록하여 가장 적은 타수를 기록하도록 코스를 완주한다.</p>
