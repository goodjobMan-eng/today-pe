<h1>봄바드먼트 표적 맞히기 및 농구 게임</h1>
<p>1) 체육관을 반으로 나누고 양 팀은 각자의 진영 안에서만 활동한다. 2) 자신의 진영에서 폼 풋볼(투척공)을 던져 상대 진영 측면의 핀, 츄크볼 리바운더(망), 농구 림/백보드를 맞힌다. 3) 표적을 맞힌 선수는 농구공을 가져와 정해진 농구 기술(핀=레이업, 림=점프슛, 리바운더=선택)을 수행한다. 4) 농구 슛을 성공하면 농구공을 반납한 뒤 빈백 1개를 팀 득점 통에 넣고 3~5분 후 점수를 합산한다.</p>
