<h1>이동 농구 드리블 연습</h1>
<p>1) 왼발이 땅에 닿을 때 오른손으로, 오른발이 닿을 때 왼손으로 걸어가며 드리블한다. 2) 왼발과 오른발에 빠르게 박자를 맞추며 걷기 드리블을 한다. 3) 이동하며 포켓 드리블을 연습한다. 4) 가볍게 달리며 공을 살짝 앞에 두고 런닝 드리블을 하고, 좌우 방향 전환 및 다리 사이 레그 스루 드리블을 연습한다.</p>
