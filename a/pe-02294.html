<h1>시한폭탄 짝줄넘기</h1>
<p>1) 참가자 전원이 나란히 서고, 지도자가 줄을 잡은 상태에서 한 명씩 들어가 짝줄넘기를 뜁니다. 2) 줄에 걸리지 않고 차례대로 줄넘기를 넘기며 이동합니다. 3) 줄에 걸려 시간이 다 되어 '시한폭탄'이 터지는 사람과 그 양쪽 옆에 서 있는 사람이 함께 벌칙을 받습니다. 4) 지목된 사람들은 정해진 횟수(예: 5번)만큼 벌칙 동작을 수행합니다.</p>
