<h1>베이스라인 태그</h1>
<p>1) 학급을 두 팀으로 나누어 각자 반대편 베이스라인에 선다. 2) 신호와 함께 상대편 베이스라인을 향해 달린다. 3) 상대 진영에서 술래에게 태그되면 출발점으로 돌아가 다시 시작한다. 4) 팀원 전체가 반대편 베이스라인에 먼저 도착하는 팀이 승리한다.</p>
