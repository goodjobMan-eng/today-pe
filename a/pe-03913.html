<h1>스캐빈저 헌트 글자 배틀</h1>
<p>1) 종이에 글자를 적어 오려낸 뒤 게임에 참여하지 않는 사람이 집 안팎 곳곳에 글자를 숨긴다. 2) 정해진 제한 시간 동안 숨겨진 글자들을 최대한 많이 찾아 모은다. 3) 시간이 종료되면 찾은 글자들을 모아 다시 주어진 제한 시간 안에 가능한 많은 단어를 조합해 적는다. 4) 만든 단어의 글자 수나 단어 개수에 따라 점수를 합산하여 승패를 가린다.</p>
