<h1>누들 런 (Noodle Run)</h1>
<p>1) 3명이 한 팀을 이루고, 절반으로 자른 수영 누들(스펀지봉) 5개를 바닥에 일렬로 놓는다. 2) 주자 1명은 누들 위만 밟으며 반대편 목적지를 향해 앞으로 나아간다. 3) 나머지 팀원 2명은 주자의 발이 지나간 뒤쪽 누들을 재빨리 집어 주자의 앞쪽 바닥에 놓아준다. 4) 주자는 바닥에 발이 닿지 않도록 누들만 밟고 전진하여 끝까지 먼저 완주한다.</p>
