<h1>지네 피구</h1>
<p>1) 4인 1조 2팀으로 나눈다. 2) 한 팀은 코트 안에 들어가 앞사람 어깨에 손을 얹고 세로 한 줄로 선다. 3) 다른 팀은 코트 밖에서 패스를 돌리며 맨 뒷사람을 노려 공을 던진다. 4) 맨 뒷사람 외에 공이 맞으면 세이프이고 손이 떨어지면 아웃이며 제한 시간 내 맞힌 횟수를 센다.</p>
