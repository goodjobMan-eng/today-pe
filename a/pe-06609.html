<h1>포인트 농구</h1>
<p>1) 두 명이 한 사람씩 번갈아 가며 농구 골대에 슛을 시도한다. 2) 투바운드 농구는 골대 맞고 튕겨 나온 공이 바닥에 두 번 튕긴 지점에서 상대방이 슛을 던진다. 3) 노바운드 농구는 튕겨 나온 공을 바닥에 닿기 전에 잡은 위치에서 바로 슛을 시도한다. 4) 랠리 포인트 농구는 포스트 지역 5개 지점을 정해 성공 시 다음 지점으로 이동하며 모두 성공하면 승리한다.</p>
