<h1>신문지 몸에 붙여 달리기</h1>
<p>1) 출발선과 반환점을 콘으로 표시하고 각자 펼친 신문지 1장을 가슴 앞에 댑니다. 2) 신호가 울리면 손을 완전히 떼고 오직 달리는 바람의 저항(풍압)만으로 신문지를 몸에 밀착시킨 채 전력 질주합니다. 3) 반환점을 돌아 결승선까지 신문지를 떨어뜨리지 않고 완주하면 성공합니다. 4) 신문지를 반으로 접어 크기를 줄이거나, 뒤로 달리기, 옆으로 꽃게 달리기 등 다양한 방향으로 변형합니다.</p>
