<h1>공 이어 주고 슛 게임</h1>
<p>1) 5명씩 두 팀을 이루고 정해진 구역의 위치에 선다. 2) 공격 모둠 골키퍼가 앞 구역 공격수에게 패스하며 시작하고, 공격수는 수비수를 피해 앞 구역으로 패스한다. 3) 골키퍼 구역 앞 공격수는 상대 골대에 공을 넣고, 수비 모둠은 공을 넣지 못하게 막는다. 4) 상대 골대에 공을 넣으면 1점을 얻으며, 수비수가 가로채거나 맞추면 공수를 바꾸어 더 많은 점수를 얻은 팀이 승리한다.</p>
