<h1>특수 체육 4대 순환 스테이션 활동</h1>
<p>1) 체력 스테이션에서 턱걸이, 저항 밴드, 배틀로프, 덤벨, 매트 등을 활용해 운동한다.2) 영양 스테이션에서 스쿠터보드를 타고 콘 주변을 돌며 영양 콩주머니와 후프, 빙고판 및 낱말퍼즐 활동을 수행한다.3) 스포츠 스테이션에서 볼링, 축구, 야구, 풋볼 표적 맞히기 활동을 진행한다.4) 이동 운동 스테이션에서 허들 넘기, 사다리 스텝, 후프 점프, 줄넘기 등을 순환하며 수행한다.</p>
