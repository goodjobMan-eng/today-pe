<h1>주사위 술래잡기</h1>
<p>1) 콘 등을 이용해서 경기장 활동 공간을 만들고 팀 조끼를 입어 두 팀으로 나눕니다. 2) 팀 내에서 순서를 정한 후 첫 주자가 동시에 중앙으로 나와 폼 주사위를 던집니다. 3) 주사위가 멈추면 주사위를 손에 들고 나온 숫자만큼 상대 팀원을 터치하러 쫓아갑니다. 4) 주사위를 들고 나온 숫자만큼 상대 팀을 먼저 터치하고 출발 지점으로 돌아오면 승리하며, 잡힌 사람은 경기장 밖으로 나가 앉습니다.</p>
