<h1>미니 테이블 하키 (녹 하키)</h1>
<p>1) 녹 하키 전용 보드 양 끝에 각자 위치하고 미니 스틱을 1개씩 쥔다. 2) 퍽이 자신의 진영에 오면 스틱으로 1회 쳐서 상대 골대로 보낸다. 3) 벽면 반사 각도를 활용해 상대 골대에 퍽을 먼저 넣으면 득점한다. 4) 2인 단식 외에 팀원끼리 샷을 번갈아 치는 2대 2 복식 매치로 변형한다.</p>
