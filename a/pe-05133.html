<h1>체조 회전(턴) 동작 익히기</h1>
<p>1) 매트를 깔고 안전 수칙을 확인한 후 신체 6가지 부위를 이용한 턴 동작을 안내받는다.2) 발 꼬아 돌기, 엉덩이 대고 돌기, 배 대고 돌기, 등 대고 돌기, 무릎 대고 돌기, 손 짚고 토끼뜀 돌기를 3~4분씩 각각 연습한다.3) 균형잡기, 점프, 구르기 동작에 연습한 턴 2가지를 매끄럽게 연결하여 자신만의 체조 시퀀스를 완성한다.</p>
