<h1>짝 스트레칭</h1>
<p>1) 2인 1조로 등 맞대고 손뼉치기, 몸통 비틀기, 어깨 늘리기 등 상체 스트레칭을 실시합니다. 2) 서거나 앉은 자세, 누운 자세에서 서로의 손이나 발목을 잡고 밀고 당기며 하체 및 전신 근육을 늘려줍니다. 3) 각 동작은 10~15초간 자세를 유지하며 몸의 좌우로 2회씩 실시합니다.</p>
