<h1>수영 묘기 기술 연습</h1>
<p>1) 오른손으로 왼발을 잡고 자세를 유지한 채 레인 끝까지 수영하며 몸을 푼다. 2) 머리 방향으로 전진하는 스컬링(패들링) 동작을 연습할 때 다리를 움직이지 않고 팔을 수면 밖으로 빼지 않는다. 3) 발 방향으로 전진하는 역방향 스컬링을 연습한다. 4) 양손을 수면 위로 완전히 올린 상태에서 가라앉지 않고 제자리 수영을 유지하는 물잡기(입영) 동작을 연습한다.</p>
