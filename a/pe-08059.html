<h1>어린이를 위한 5가지 농구 패스 게임</h1>
<p>1) 제다이 볼: 제다이가 지키는 중앙 표적을 원을 두른 선수들이 패스하며 공으로 쓰러뜨린다. 2) 둥지 털기: 4개 구역의 팀들이 중앙 및 상대 구역에서 공을 패스해 자기 둥지로 4개를 먼저 모은다. 3) 탈리볼: 수비를 피해 연속 4회 패스에 성공하면 1점을 얻고 먼저 5점을 낸 팀이 승리한다.</p>
