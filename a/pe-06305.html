<h1>줄 점핑 앤 랜딩 (흔들다리 &amp; 뱀 넘기)</h1>
<p>1) 긴 줄을 바닥에 두고 양발 도약 및 착지, 외발 도약 착지 등 다양한 점프 동작을 연습한다.2) 2인 1조로 한 명이 줄을 바닥에서 뱀처럼 흔들면 다른 한 명은 3회 점프 후 역할을 교대한다.3) 줄을 위아래로 흔드는 흔들다리(Swinging Bridge)를 넘으며 20초 동안 몇 회 성공하는지 도전한다.</p>
