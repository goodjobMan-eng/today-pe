<h1>똥 밟았네 댄스 챌린지 율동 놀이</h1>
<p>1) 교실 또는 강당에 적당한 간격으로 자리 잡고 기본 리듬에 맞춰 가볍게 발을 구르며 준비한다 2) 똥을 밟아 당황하는 표정과 코믹한 손발 동작으로 전반부 안무를 신나게 따라 한다 3) 후렴구 가사에 맞춰 양팔을 털고 발을 차는 챌린지 댄스를 학급 구성원 모두가 한동작으로 맞춘다 4) 모둠별로 등장 타이밍을 다르게 설정하거나 자신만의 우스꽝스러운 동작을 추가하는 배틀 형태로 변형한다.</p>
