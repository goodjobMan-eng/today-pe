<h1>라켓으로 공 치며 앞으로 가기</h1>
<p>1) 출발선 콘 앞에 배드민턴 라켓과 셔틀콕을 들고 바르게 선다. 2) 제자리에서 라켓으로 셔틀콕을 위로 튕기기 시작한다. 3) 셔틀콕을 라켓으로 연속해서 튕기면서 앞쪽 반환점 콘을 향해 걸어 나아간다. 4) 반환점 콘을 돌아 떨어뜨리지 않고 계속 튕기면서 출발 지점으로 돌아온다.</p>
