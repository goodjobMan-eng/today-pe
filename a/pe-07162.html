<h1>지뢰밭 (Minefield)</h1>
<p>1) 활동 구역에 하키채, 벤치, 매트, 콘 등 다양한 도구를 배치해 지뢰밭을 만든다. 2) 두 명씩 짝을 짓고 앞사람은 안대를 착용한다. 3) 파트너는 안대를 쓴 친구를 말로 이끌어 지뢰밭을 안전하게 통과시킨다. 4) 도구에 부딪히면 처음으로 돌아가거나 끝난 후 페널티 운동을 수행하며, 반대편에 도착하면 역할을 바꾼다.</p>
