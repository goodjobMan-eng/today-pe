<h1>체육관 심폐지구력 기르기 서킷 트레이닝</h1>
<p>1) 층간소음 방지 매트 위에서 가볍게 제자리 걷기(워밍업)를 1분간 실시한다. 2) 제자리에서 점프하지 않고 머리 위로 손뼉 치기 운동을 1분간 진행한다. 3) 교대로 팔꿈치와 반대쪽 무릎을 맞닿게 올려주는 복근·유산소 운동을 1분간 실시한다. 4) 엎드려 뻗친 자세에서 엉덩이 수평을 유지하며 한 다리씩 당겼다 일어나는 슬로우 버피와 에어 줄넘기를 수행한다.</p>
