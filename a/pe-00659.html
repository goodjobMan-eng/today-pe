<h1>줄넘기 뛰어넘고 콩주머니 가져오기 릴레이</h1>
<p>1) 팀별로 출발선에 일렬로 서고, 코스 중간에 긴줄넘기를 돌리는 공간을 설치합니다. 2) 출발 신호가 울리면 주자는 달려가 회전하는 긴줄넘기를 걸리지 않고 뛰어넘습니다. 3) 줄을 통과한 뒤 반환점의 바구니에서 콩주머니 1개를 집어 들고 출발선으로 돌아옵니다. 4) 다음 주자에게 터치해 교대하며, 정해진 콩주머니를 가장 먼저 모두 모으는 팀이 승리합니다.</p>
