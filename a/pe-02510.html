<p>1) 매트 앞에서 걸어와 발을 모으고 앞구르기를 한다. 2) 옆으로 꽃게 점프를 한 뒤 발을 모아 앞구르기를 한다. 3) 뒤로 걸어와 몸을 돌린 후 앞구르기를 한다. 4) 스킵을 하거나 개구리, 호랑이, 고릴라 등 동물 흉내를 낸 뒤 앞구르기를 한다.</p>
