<h1>레인보우 큐브 컬렉터 볼링 게임</h1>
<p>1) 투구자가 공을 굴려 쓰러뜨린 볼링 핀의 개수를 확인한다.2) 줄의 맨 끝에 선 '큐브 수집가'가 뒤편 바구니로 가 쓰러진 핀 개수만큼 색깔 큐브를 가져온다.3) 모둠 도안 종이의 그림에 큐브를 맞추어 올려놓는다.4) 한 장을 완성하면 검사를 받고 통에 원래대로 넣은 뒤, 아이스크림 막대를 획득하고 다른 색 도안을 가져와 6가지 무지개색 막대를 모두 모은다.</p>
