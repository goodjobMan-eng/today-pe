<h1>동물이 되어 달려볼까?</h1>
<p>1) 두 팀으로 나누어 동물의 특징과 움직임에 대해 이야기하고 달리기에 포함시킬 동물을 정한다. 2) 각 동물의 표현 특징과 움직임을 연습한다. 3) 동물 이름을 적은 쪽지는 동물당 5장씩 준비한다. 4) 한 명씩 쪽지를 뽑아 달리면서 동물을 표현하고 앞 주자가 달리기 시작하면 쪽지를 뽑아 동물을 정한다. 5) 모든 주자가 들어오는 팀이 승리!</p>
