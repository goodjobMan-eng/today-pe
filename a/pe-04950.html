<h1>전국 피구</h1>
<p>1) 내야는 동서남북 4개 구역으로 나뉘고 각 구역에 무사 1명씩 배치되어 4개국 통일을 목표로 겨룬다2) 외야의 농민은 주로 쓰지 않는 반대 손으로 공을 던져 무사를 맞히면 내야로 들어가 무사가 된다3) 무사가 다른 무사를 맞히면 상대 영토를 흡수하여 대명이 되고 가신과 패스를 주고받으며 중앙의 라바콘이 쓰러지면 무사와 농민이 전원 교대된다</p>
