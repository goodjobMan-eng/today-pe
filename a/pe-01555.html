<h1>철봉 양무릎 걸고 흔들어 내리기</h1>
<p>1) 철봉 아래에 안전 매트를 깔고 철봉 앞에 바르게 선다. 2) 뛰어올라 두 오금을 철봉에 단단히 걸고 거꾸로 매달려 몸을 앞뒤로 크게 흔든다. 3) 뒤로 흔들리는 반동의 최고점에서 두 손을 매트에 가볍게 짚고 발을 빼며 균형을 잡는다. 4) 매트를 짚던 손을 밀어내며 두 발로 안전하게 착지하고, 숙련도에 따라 흔드는 횟수를 조절해 도전한다.</p>
