<h1>무릎 탁 찌릿</h1>
<p>1) 두 명씩 짝을 지어 한 명은 활동자, 다른 한 명은 심판 역할을 맡습니다. 2) 무릎을 치고 박수를 친 뒤 위, 아래, 오른쪽, 왼쪽 중 한 방향을 찌르는 동작을 반복합니다. 3) 활동자와 심판이 서로 마주 보고 같은 방향을 가리키면 횟수가 누적됩니다. 4) 세 번 틀리면 자리에 앉고 역할을 바꿔서 진행합니다.</p>
