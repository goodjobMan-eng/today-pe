<h1>빙글빙글 채로 공 몰기</h1>
<p>1) 6명이 한 모둠을 이루고 모둠별로 채로 공을 모는 순서를 정한다. 2) 출발 신호와 함께 트랙 안쪽과 바깥쪽에서 1명씩 채로 공을 몰아 이동한다. 3) 상대 모둠원을 마주치면 가위바위보를 하여 이긴 사람은 계속 전진하고 진 모둠은 다음 모둠원이 출발한다. 4) 상대 모둠 구역에 먼저 도착한 모둠이 승리한다.</p>
