<h1>스쿠터 태그 (Scooter Tag)</h1>
<p>1) 대부분의 학생은 스쿠터에 타고 콘 뒤에 3명이 대기하며 가운데 술래 2명이 태그 스틱을 들고 스쿠터에 탄다. 2) 술래는 스쿠터를 타고 이동하며 체육관 안의 학생들을 안전하게 태그한다. 3) 태그된 학생은 스쿠터에서 내려 콘 뒤 대기 줄 맨 뒤로 가고 줄 맨 앞 학생이 스쿠터를 넘겨받아 들어온다. 4) 2~3분이 지나면 술래가 새로운 술래를 지목하여 교대한다.</p>
