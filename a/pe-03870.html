<h1>스쿠터 봅슬레이 경주</h1>
<p>1) 학생들은 5개 국가를 대표하는 팀으로 나뉘어 콘으로 표시된 트랙 코스 앞에 선다. 2) 4인 1조로 구성된 팀원 전원이 출발선에서 스쿠터 봅슬레이를 민다. 3) 하프코트에 도달하면 팀원 중 2명은 봅슬레이에 탑승하는 탑승자가 된다. 4) 코스 위반 시 페널티가 부여되며, 팀원 4명 전원이 봅슬레이에 탑승한 상태로 결승선을 통과해야 한다.</p>
