<h1>팝 플라이 앤 그라운더</h1>
<p>1) 짝과 마주 보고 서서 한 사람이 뜬공(팝 플라이)이나 땅볼(그라운더) 중 하나를 무작위로 던진다.2) 받는 사람은 공이 높게 오면 엄지를 모아 손을 올리고 낮게 오면 새끼손가락을 모아 공을 잡는다.3) 두 사람이 공을 주고받아 총 5번 잡으면 주먹을 맞대고 체육관을 한 바퀴 조깅한 뒤 다시 제자리로 돌아와 3분 동안 잡은 횟수를 센다.</p>
