<h1>달리기 능력을 키우는 고관절 동적 스트레칭</h1>
<p>1) 푸시업(팔굽혀펴기) 엎드린 자세를 취하고 두 발을 모은다. 2) 한쪽 발을 손 옆까지 크게 전진시켜 고관절을 늘린 뒤 원위치하고 반대발도 번갈아 반복한다. 3) 엎드린 상태에서 점프하며 양발을 교대로 빠르게 앞뒤로 바꾼다. 4) 양발을 바꿀 때 공중에서 발바닥으로 손뼉을 치듯 맞부딪치며 착지한다.</p>
