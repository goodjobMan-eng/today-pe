<h1>바닥에서 축구공 띄우기 기술</h1>
<p>1) 첫 번째 기술은 발을 공 위에 두고 그대로 쳐서 올려 띄운다.2) 두 번째 기술은 디딤발인 왼발을 바닥에 두고 공을 뒤로 굴린 뒤, 동시에 뜬 공을 오른발로 차서 띄운다.3) 세 번째 기술은 공을 두 발 사이에 끼운 후 띄우고, 튀어 오를 때 발로 다시 쳐서 공을 띄운다.</p>
