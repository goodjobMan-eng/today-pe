<h1>릴레이 공 전달</h1>
<p>1) 팀별로 가라이를 벌리고 일렬로 섭니다. 2) 뒷사람부터 공을 앞사람 가랑이 사이로 전달합니다. 3) 공을 전달하면 바로 맨 앞으로 달려와서 다시 공을 받을 준비를 합니다. 4) 모든 팀원이 도착점에 들어오면 자리에 앉습니다. 도착 순서대로 순위가 정해집니다. 5) 등수와 관계없이 축하와 격려의 박수를 보내며 놀이를 마무리합니다.</p>
