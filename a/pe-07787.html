<h1>어지럼증 파라슈트 체조 게임</h1>
<p>1) 모든 학생이 원형으로 둘러서서 파라슈트 가장자리를 양손으로 잡는다. 2) 파라슈트를 잡고 한 방향으로 천천히 돌다가 방향을 바꾸어 회전한다. 3) 회전 후 파라슈트를 놓고 뒤로 5~10걸음 물러서서 교사가 지시하는 미션(점핑잭 10회 등)을 수행한다. 4) 다시 파라슈트를 잡고 더 빠르게 회전한 후 지시 미션(무릎 높여 점프 5회 등)을 이어간다.</p>
