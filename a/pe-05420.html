<h1>등대 등 손씨름</h1>
<p>1) 짝과 등을 맞대고 선다.2) 바깥쪽 손을 안쪽으로 뻗어 상대방의 손을 잡는다.3) 신호에 맞춰 손을 당겨 상대방의 발을 바닥에서 먼저 떨어뜨리면 승리한다.4) 주로 사용하는 손에 따라 유불리가 발생하므로 손을 바꾸어가며 진행한다.</p>
