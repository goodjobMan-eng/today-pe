<h1>피자 술래잡기</h1>
<p>1) 학생들은 벽을 따라 한 줄로 서서 세 가지 피자 토핑 중 하나씩 배정받고 술래(셰프)는 가운데에 선다. 2) 술래가 특정 토핑 이름을 외치면 해당 토핑 학생들은 태그되지 않고 반대편 벽으로 달려간다. 3) 태그된 학생은 가장자리(오븐)로 이동하며 마지막까지 잡히지 않도록 계속 진행한다.</p>
