<h1>치킨 누들 수프 낙하산 놀이</h1>
<p>1) 낙하산 가장자리를 배 높이로 잡고 물을 끓이듯 가볍게 흔든다 2) 국수(폼 교구)와 야채 모양 스펀지공을 차례로 낙하산 위에 넣고 함께 흔든다 3) 마지막에 러버 치킨을 넣고 끓인 뒤 맛을 보는 흉내를 낸다 4) 설거지 활동으로 낙하산을 크게 위아래로 흔들어 위의 모든 재료를 밖으로 털어낸다</p>
