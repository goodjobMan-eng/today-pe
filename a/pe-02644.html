<h1>농구공 홈 트레이닝 4종 신체활동</h1>
<p>1) 앞쪽과 측면으로 상체를 숙여 반동을 주며 다리를 늘려주는 유연성 스트레칭을 한다. 2) 무릎과 발목 순으로 농구공을 몸에 가깝게 한 바퀴씩 굴린 후 머리 위로 돌아오는 볼 서클 동작을 수행한다. 3) 팔굽혀펴기 시작 자세에서 한쪽 발을 반대쪽 손 앞쪽으로 교차 터치한 후 양발을 모아 점프하는 크로스오버 버피를 수행한다. 4) 한쪽 다리로 중심을 잡고 반대쪽 발끝으로 목표점을 터치하는 밸런스 운동을 한다.</p>
