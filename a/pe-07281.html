<h1>인디 500 레이스 게임</h1>
<p>1) 코트 외곽선이나 콘으로 트랙을 만들고 각자 훌라후프(자동차)를 몸 주변에 든 채 트랙에 선다. 2) 신호가 울리면 서로 부딪히지 않도록 개인 공간을 유지하며 트랙을 따라 이동한다. 3) 다른 참가자의 자동차와 부딪히면 코트 중앙 피트스톱으로 가서 훌라후프를 새것으로 교체받는다. 4) 새 차를 받은 후 다시 트랙으로 복귀하여 주행을 이어간다.</p>
