<h1>축구(원바! 노바!)</h1>
<p>1) 5m x 5m 사각형 경기장 안에서 2인 1조 3팀(총 6명)이 손을 잡고 원으로 선다.2) 두 사람 모두 손을 잡은 채 1회 이상 리프팅(원바운드 또는 노바운드)한 후 다음 조로 공을 넘긴다(1조-2조-3조 순).3) 1분 동안 손을 놓지 않고 경기장 안에서 성공한 조당 리프팅 횟수를 합산하여 계수한다.</p>
