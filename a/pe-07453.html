<h1>상어와 드래곤</h1>
<p>1) 술래인 상어와 드래곤, 도망치는 인간 팀으로 역할을 나누고 매트로 섬을 배치한다. 2) 드래곤은 섬 매트 위에서만 움직이고 상어는 매트 밖 바닥에서만 움직이며 인간을 태그한다. 3) 잡힌 인간은 감옥으로 이동하며, 다른 인간이 손을 잡고 섬으로 데려가면 구출된다.</p>
