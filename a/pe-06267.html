<h1>협동 배드민턴</h1>
<p>1) 얼음 배드민턴은 3대 3 팀 대항전으로 서브와 리시브 시 양발을 바닥에 붙인 채 동작을 수행하며 발이 떨어지면 파울이 된다.2) 팀원이 돌아가며 서브를 넣고 랠리가 끝나면 코트 위치를 변경하며 5점에 먼저 도달한 팀이 승리한다.3) 토스 가능 배드민턴은 2대 2 팀 대항전으로 한 명이 배구의 세터처럼 높게 띄워 주면 다른 팀원이 내리쳐 2번에 걸쳐 상대 코트로 넘겨야 하며 한 번에 넘기면 파울이다.</p>
