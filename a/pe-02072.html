<h1>홈트레이닝 상체 근력 근지구력 운동</h1>
<p>1) 바닥에 누워 무릎을 세우고 상체를 살짝 말아 올려 10초간 버티는 윗몸 말아 올리기를 실시한다. 2) 근력이 부족한 경우 손을 무릎 쪽으로 뻗어 살짝만 상체를 들고 10초간 유지한다. 3) 움직이지 않는 고정된 의자 끝을 양손으로 짚고 다리를 뻗은 상태에서 10초간 버틴다. 4) 의자를 짚은 팔을 굽혔다 펴는 팔굽혀펴기를 3회 실시한 후 다리를 뻗어 버티며 마무리한다.</p>
