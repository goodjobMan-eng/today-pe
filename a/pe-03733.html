<h1>원 안의 콘 뺏기 게임</h1>
<p>1) 콘으로 원을 만들고 술래는 원 안쪽에 위치한다. 2) 술래는 원 밖으로 나갈 수 없으며 다른 참가자들은 1명씩 들어간다. 3) 술래에게 태그되지 않고 원 안의 콘을 가져오며, 태그되면 콘을 원래 자리에 두고 돌아간다. 4) 양 팀 중 콘을 더 많이 가져온 팀이 승리한다.</p>
