<h1>손수건 뺏기 게임(엘 파뉴엘로)</h1>
<p>1) 양 팀 학생들에게 각각 1부터 6까지 번호를 배정하고 마당 양쪽에 마주보고 선다. 2) 교사가 중앙에서 손수건을 높이 들고 번호 하나를 외친다. 3) 호명된 양 팀 번호의 선수가 중앙으로 달려가 손수건을 집는다. 4) 손수건을 집은 학생이 상대에게 잡히지 않고 자기 팀 진영으로 돌아오면 1점을 얻고, 돌아오기 전 상대에게 잡히면 상대 팀이 1점을 얻는다.</p>
