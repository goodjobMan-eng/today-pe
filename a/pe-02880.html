<h1>플라잉디스크 한 줄 빙고</h1>
<p>1) 팀을 나누고 플라잉디스크를 팀별로 4~5개씩 준비한다. 2) 지정된 위치에서 순서대로 플라잉디스크를 던져 훌라후프 안에 넣는다. 3) 가로·세로·대각선 중 먼저 한 줄을 차지하는 팀이 승리한다. 4) 이미 상대 팀이 차지한 곳의 원반을 밖으로 쳐내어 빼앗는 변형 규칙을 적용할 수 있다.</p>
