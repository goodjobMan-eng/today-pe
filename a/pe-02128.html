<h1>업다운 리듬 기초작품 1-2</h1>
<p>1) 8박자에 맞추어 제자리에서 좌우로 걸으며 홀수 박자에는 업, 짝수 박자에는 다운 리듬을 탄다. 2) 걸으면서 양팔을 운전하듯이 원을 그리며 회전시킨다. 3) 스텝은 동일하게 유지하면서 양팔을 교차하여 어깨와 가슴 쪽을 터치하는 동작으로 변형한다. 4) 두 가지 동작을 연결하여 음악에 맞추어 2회 반복한다.</p>
