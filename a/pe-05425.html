<h1>줄줄이 체력 UP 6</h1>
<p>1) 1번 점핑잭을 10회 실시한다.2) 좌우로 뛰는 2번 스키어를 10회 실시한다.3) 발을 앞뒤로 교차하는 3번 크로스를 10회 실시한다.4) 엎드려서 다리를 교차하는 4번 마운틴 클라이머를 10회 실시한다.5) 5번 푸시업(힘든 학생은 무릎 대고 니푸시업)을 10회 실시한다.6) 6번 브이싯 자세를 10초간 버틴다.</p>
