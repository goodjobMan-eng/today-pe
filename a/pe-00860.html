<h1>디즈니 양자택일 운동 워크아웃</h1>
<p>1) 화면에 주어지는 두 가지 디즈니 선택지 중 마음에 드는 쪽을 고릅니다. 2) 오른쪽 선택지가 좋으면 오른쪽으로, 왼쪽이 좋으면 왼쪽으로 이동합니다. 3) 화면이 전환되면 자신이 선택한 캐릭터에 해당하는 신체 운동 활동을 수행합니다. 4) 활동 중간에 등장하는 달리기 레이스와 틀린 그림 찾기 미니 게임에 참여합니다.</p>
