<h1>안전하게 떨어지는 날아 앞구르기(다이빙 앞구르기) 단계별 연습</h1>
<p>1) 도움닫기로 달려와 턱을 당기고 배꼽을 보며 부드럽게 앞구르기를 하여 공포심을 없앤다2) 뜀틀대 위에 웅크려 짚은 상태에서 손으로 바닥 매트를 지탱하며 체중을 팔로 받쳐 구른다3) 제자리 점프를 연속 3회 하여 높이를 띄운 뒤 손으로 매트를 받치며 날아 앞구르기를 한다4) 도움닫기 후 도약하여 다리의 회전을 순간적으로 멈추어 높이를 만든 뒤 매트를 끝까지 보며 굴러 착지한다</p>
