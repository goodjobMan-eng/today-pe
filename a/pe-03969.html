<h1>슬라럼 스맥다운</h1>
<p>1) 작은 폼 누들을 양발(신발이나 발목) 사이에 끼운다. 2) 양발을 모아 점프하며 앞쪽의 볼링 핀까지 전진한다. 3) 핀 앞에 도착하면 몸을 비틀어 발에 낀 누들로 볼링 핀을 쳐서 쓰러뜨린다. 4) 쓰러진 핀을 다시 세워 두고 걸어서 출발선으로 돌아와 팝잇 점수판의 구멍을 누른다.</p>
