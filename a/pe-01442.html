<h1>사거리 드리블 및 볼 술래잡기</h1>
<p>1) 구역 내에서 각자 축구공을 발로 몰며 반대편 선까지 이동해 공을 멈추는 연습을 합니다. 2) 여러 방향에서 동시에 출발하여 중앙에서 부딪히지 않게 주변을 살피며 드리블합니다. 3) 교사가 '자동차' 신호나 장애물로 개입할 때 신속히 방향을 전환하거나 멈춰 반대편 도착 시 1점씩 획득합니다. 4) 발전 단계로 볼 술래잡기(공을 든 술래는 이동 불가, 패스로 터치) 형태로 변형하여 빈 공간 침투 능력을 기릅니다.</p>
