<h1>휴먼 체어 (인간 의자 협동 게임)</h1>
<p>1) 참가자들이 서로 등을 맞대거나 둥글게 원형을 만들어 밀착해 섭니다. 2) 신호에 맞춰 천천히 무릎을 굽히며 서로의 허벅지 위에 체중을 실어 의자처럼 앉습니다. 3) 균형이 무너지지 않도록 지탱한 상태에서 양손을 번쩍 들고 버팁니다. 4) 다 함께 하나부터 열까지 카운트다운을 마칠 때까지 자세를 유지하면 성공입니다.</p>
