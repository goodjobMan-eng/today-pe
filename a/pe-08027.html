<h1>볼 모으기 게임</h1>
<p>1) 코트 한가운데에 여러 종류의 공을 모아 두고 각 팀은 원형 진지에 위치한다. 2) 신호가 울리면 중앙으로 달려가 공을 발로 드리블하여 자기 원형 진지로 가져온다. 3) 중앙의 공뿐만 아니라 상대 팀 진지에 있는 공도 빼앗아 올 수 있으나, 드리블 중인 사람의 공은 빼앗을 수 없다. 4) 정해진 시간 후 자기 진지에 공을 가장 많이 모은 팀이 승리한다.</p>
