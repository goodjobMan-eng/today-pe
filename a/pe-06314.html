<h1>유치원 아침 동물 프리즈 및 소품 잡기 활동</h1>
<p>1) 교사의 지시에 따라 발구르기, 펭귄 걷기, 캥거루 뜀뛰기, 수영하기 동작을 하다가 프리즈 신호에 멈춘다.2) 손수건(또는 휴지)을 공중에 던진 뒤 떨어지기 전에 잡는 연습을 제자리와 점프 동작으로 1분간 진행한다.3) 5걸음 떨어진 위치에 종이공(또는 양말공)을 두고 달려가 집어 돌아오는 미션을 1분간 수행하며 개수를 센다.</p>
