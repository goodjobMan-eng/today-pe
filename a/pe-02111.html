<h1>바운다룬 배구 및 간이 게임</h1>
<p>1) 바운다룬 라켓 손잡이를 잡고 공을 올려 떨어뜨리지 않는 기본 균형 잡기를 익힌다. 2) 네트를 사이에 두고 배구 규칙을 적용하여 3번 안에 공을 상대편 진영으로 넘긴다. 3) 바운다룬 배구 경기는 5점을 먼저 내는 팀이 승리한다. 4) 훌라후프 9개를 두고 번갈아 공을 튀겨 넣어 빙고 한 줄을 먼저 완성하는 빙고 게임으로 변형할 수 있다.</p>
