<h1>구긴 A4 종이 모자 지키기 놀이</h1>
<p>1) A4 용지를 구긴 후 다시 펴서 머리 위에 모자처럼 얹는다. 2) 균형을 잡으며 입김을 불어 친구의 머리 위 종이를 떨어뜨린다. 3) 자신의 머리 위 종이가 떨어지지 않도록 지키며 한 자리에 3초 이상 머무르지 않는다. 4) 종이가 떨어져 아웃된 친구는 그 자리에 앉아 장애물이 되고 마지막까지 남는 사람이 승리한다.</p>
