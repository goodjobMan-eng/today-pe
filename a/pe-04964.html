<h1>멀리뛰기 발구르기 ‘다단’ 점프 연습</h1>
<p>1) 제자리에서 구령 리듬에 맞춰 한 발로 구르고 양손을 뒤에서 앞으로 쳐올리는 모션을 익힌다.2) 걸어가면서 마음속으로 리듬을 타며 한 발 구르기와 팔치기 동작을 연결한다.3) 도움닫기 달리기를 하다가 발구름판(매트) 직전에서 한 발로 강하게 구르고 뛰어올라 착지한다.</p>
