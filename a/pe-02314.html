<h1>사방치기 놀이</h1>
<p>1) 운동장에 사방치기 놀이판을 그리고 1번 칸 안에 돌멩이를 던진다. 2) 돌멩이가 있는 칸을 제외하고 2번 칸부터 좌우 칸은 양발, 외칸은 한 발로 뛰어 8번 칸까지 간다. 3) 8번 칸에서 두 발을 동시에 뛰어 뒤로 돌아선 후 반대 방향으로 돌아온다. 4) 돌아오는 길에 돌멩이를 주워 출발선으로 돌아오면 다음 칸에 던지고, 돌멩이나 발이 선에 닿으면 차례가 바뀐다.</p>
