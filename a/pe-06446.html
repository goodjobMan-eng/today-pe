<h1>위생팩을 활용한 족구 기초 기능 익히기</h1>
<p>1) 전신 스트레칭 및 골반 트위스트 운동을 한 뒤 스텝을 밟으며 전후좌우 공 방향으로 이동하는 기본자세를 익힌다 2) 위생팩에 바람을 불어넣어 묶은 뒤 발 안쪽(인사이드)으로 낮게 차거나 높게 차는 서브를 연습한다 3) 발등 앞차기 및 돌려차기 공격 스윙을 연습하고, 공을 떨어뜨려 인사이드 및 머리(헤딩)로 받아 올리는 리시브를 연습한다</p>
