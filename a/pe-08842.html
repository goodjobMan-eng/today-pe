<h1>트리트리스 - 3구역 술래잡기 게임</h1>
<p>1) 배구 코트를 3개 구역으로 나누고 각 구역에 구역 술래를 배치합니다. 2) 참가자들은 구역을 통과하며 2구역에서 아웃되면 1점, 3구역에서 아웃되면 2점, 모든 구역을 통과하면 4점을 얻습니다. 3) 술래가 4번째 참가자를 잡으면 어깨끈을 손에 들고 신호를 보내며, 5번째로 잡힌 참가자에게 어깨끈을 넘겨 술래를 교체합니다.</p>
