<h1>가위바위보 달리기</h1>
<p>1) 전체를 두 모둠으로 나누고 경기장 가운데 선을 기준으로 마주 보고 서서 가위바위보를 한다. 2) 가위바위보에서 진 사람은 자기 모둠 경기장 끝 쪽으로 달아난다. 3) 이긴 사람은 도망가는 상대 모둠원을 쫓아가 경기장 끝에 도착하기 전에 터치한다. 4) 도망가는 상대를 터치하면 1점을 얻으며 여러 번 진행해 점수가 더 높은 모둠이 이긴다.</p>
