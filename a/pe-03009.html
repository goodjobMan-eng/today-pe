<h1>한 손으로 공 두 개 저글링</h1>
<p>1) 세 손가락으로 공 하나를 잡고, 나머지 두 손가락으로 다른 공 하나를 잡는다. 2) 공을 제자리에서 위로 하나씩 던지고 받는 기본 동작(2-1 단계)을 연습한다. 3) 익숙해지면 공이 손 안쪽에서 바깥쪽으로 회전하도록 패턴을 바꾸어 연속으로 던지고 받는다(2-2 단계). 4) 바로 연속 동작이 어려우면 하나 둘 던지고 잡는 구분 연습을 반복한다.</p>
