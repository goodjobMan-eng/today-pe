<h1>나비처럼 훨훨 날아 사뿐히</h1>
<p>1) 스카프를 한 손에 뭉쳐 잡고 교사의 신호에 따라 높이 던진 뒤 반대 손으로 잡는 활동을 5번 성공할 때까지 반복한다.2) 손 외에 머리, 어깨, 가슴, 등, 허벅지, 무릎, 발등 등 원하는 신체 부위로 스카프를 받아보거나 앞으로 던지고 달려가서 받는다.3) 위로 던지고 한 바퀴 돌고 받기, 박수 치고 받기, 짝과 주고받기, 원 대형에서 던진 후 오른쪽으로 이동해 친구 스카프 잡기 등으로 변형해 활동한다.</p>
