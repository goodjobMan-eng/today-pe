<h1>케이팝 프리즈 댄스 앤 틀린그림찾기</h1>
<p>1) 비트에 맞춰 위아래로 점프하고 몸을 회전하며 손을 흔든다. 2) 왼쪽으로 한 번 오른쪽으로 한 번 점프한 뒤 중심을 잡고 버틴다. 3) 박수를 한 번 치고 두 번 친 뒤 프리즈 신호가 들리면 즉시 멈춘다. 4) 틀린 그림 찾기 구간에서는 중앙의 포즈를 유지한 채 3군데의 차이점을 찾는다.</p>
