<h1>철봉 운동 - 올바른 앞돌아 내리기</h1>
<p>1) 철봉을 양손으로 어깨너비로 잡고 바르게 올라서서 지지 자세를 만듭니다. 2) 상체를 앞쪽으로 깊게 숙이며 허리를 굽힌 상태를 끝까지 유지해 회전합니다. 3) 상체로 큰 원을 그리듯 머리를 바깥쪽으로 크게 돌려 앞으로 돕니다. 4) 회전이 끝나면 양발을 모아 시작했던 발판 쪽에 안정적으로 착지합니다.</p>
