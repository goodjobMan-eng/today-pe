<h1>마스터마인드 릴레이</h1>
<p>1) 각 팀의 마스터가 비밀 색상 조합을 설정하고 러너들은 출발선에 선다. 2) 출발 신호에 맞춰 한 명씩 접시콘을 들고 달려가 색상 구역에 놓은 뒤 돌아온다. 3) 모든 접시콘이 놓이면 마스터가 위치를 확인하고, 틀린 경우 주자들이 차례로 달려가 콘 위치를 바꾸며 콘(플롯)으로 정답 위치를 표시받아 먼저 조합을 맞힌 팀이 득점한다.</p>
