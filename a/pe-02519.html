<h1>4분 야외 인터벌 타바타 트레이닝</h1>
<p>1) 20초 운동과 10초 휴식 주기로 진행되는 8세트 타바타 타이머에 맞춰 대형을 갖춘다. 2) 점핑잭(팔벌려뛰기)과 스쿼트를 각각 20초간 수행하며 하체와 전신을 예열한다. 3) 제자리 조깅 후 엎드려 손으로 바닥을 짚고 뻗어나가는 인치웜을 진행한다. 4) 푸시업, 맨손 줄넘기, 팔꿈치-무릎 닿기, 런지 점프를 순서대로 수행하여 전신 체력을 기른다.</p>
