<h1>손 짚고 옆돌기의 기본 기능 익히기</h1>
<p>1) 정면을 보고 서서 양손을 들고 한 발을 내딛는다. 2) 왼발, 왼손, 오른손, 오른발, 왼발의 순서로 매트에 닿게 옆으로 돈다. 3) 양손과 한 발을 위로 들었다 내리며 왼발을 내딛고 왼손을 발 쪽으로 90도 틀어 짚는다. 4) 손과 손, 발과 발 사이의 거리를 어깨너비만큼 벌리고 일직선에 놓이게 짚으며 시선은 손을 따라가고, 차올린 다리부터 내리며 일직선에서 돌아 양팔을 옆으로 벌려 선다.</p>
