<h1>알 낳기 (Eierlegen)</h1>
<p>1) 팀을 나누고 경기장에 훌라후프를 배치한다. 2) 공을 손에 쥐고는 달릴 수 없으며 패스로만 이동해야 한다. 3) 공을 훌라후프 안으로 던져 넣는 것은 인정되지 않으며, 직접 안으로 내려놓아야 득점한다. 4) 득점 즉시 상대 팀이 공을 가지고 경기를 계속 진행한다. 5) 수비 팀은 훌라후프 안에 한 발을 넣고 서서 공격 팀의 득점을 차단할 수 있다.</p>
