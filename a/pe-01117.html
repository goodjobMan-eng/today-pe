<h1>머리 위 회전 점프 헬리콥터 줄넘기</h1>
<p>1) 줄넘기를 반으로 접어 손잡이를 한 손에 모아 쥐고 바르게 서서 기본자세를 취한다. 2) 머리 위에서 줄을 헬리콥터 프로펠러처럼 수평으로 일정하게 빙빙 돌린다. 3) 한쪽 무릎을 바닥에 대고 천천히 앉으면서 회전하던 줄을 자연스럽게 바닥 부근으로 낮춘다. 4) 바닥을 쓸며 돌아오는 줄 타이밍에 맞춰 1회선 1도약으로 점프해 넘고, 줄 회전 방향을 반대로 바꿔 뒤로 넘기에 도전한다.</p>
