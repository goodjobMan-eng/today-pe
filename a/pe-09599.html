<h1>안대 놀이</h1>
<p>1) 3~4명 또는 6~7명이 손을 잡고 원을 만든다. 2) 원 안의 한 명에게 안대를 씌운다. 3) 안대 쓴 친구가 이동하는 방향으로 원을 유지하며 함께 이동한다. 4) 안대 쓴 친구가 위험한 곳으로 가면 원을 만든 친구들이 막아주고 안전한 길로 안내한다.</p>
