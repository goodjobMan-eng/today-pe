<h1>균형 잡기 및 무게 중심 이동 활동</h1>
<p>1) 머리에 콩주머니를 얹고 원마커를 밟으며 물건을 줍거나 한 발로 뛰며 균형을 잡는다 2) 바닥 구르기, 사이드 플랭크, 스텝 박스 점프, 베어 크롤 등 다양한 방식으로 무게 중심을 이동한다 3) 풀누들을 손이나 바닥에 세워 균형을 잡고, 짝과 함께 누들 위에 공을 얹어 떨어뜨리지 않고 옮긴다</p>
