<h1>3대3 스리맨 사커 (패스&amp;컨트롤 편)</h1>
<p>1) 양 골대에 페트병을 3개씩 세워 둔다.2) 3명씩 두 팀을 구성하여 3 대 3으로 경기를 치른다.3) 경기 시간은 5분간 진행된다.4) 배운 패스 앤드 컨트롤을 살려 패스를 연결하고 빈틈을 노려 상대 페트병을 쓰러뜨린다.5) 정해진 시간 내에 페트병을 더 많이 쓰러뜨린 팀이 승리한다.</p>
