<h1>배구 오버핸드 토스(세트) 기술</h1>
<p>1) 팔을 머리 위로 올리고 양손의 엄지와 검지를 모아 하늘을 향하는 삼각형(다이아몬드) 모양을 만든다. 2) 날아오는 공을 삼각형 사이로 바라보며 손가락을 넓게 벌려 공을 맞이한다. 3) 공이 닿는 순간 하늘을 향해 팔을 뻗어 최대한 높이 밀어 올려 파트너에게 전달한다. 4) 초보자는 공을 살짝 잡았다가 밀어 올리는 방식으로 연습을 시작하고, 점차 잡지 않고 1초 이내에 튕겨내는 형태로 전환한다.</p>
