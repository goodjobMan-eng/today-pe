<h1>영역 순환 9칸 배구</h1>
<p>1) 코트 한쪽에 가로세로 3x3 총 9개의 구역을 라인으로 그리고 9명의 선수가 각 칸에 1명씩 위치한다. 2) 서브를 넣고 자기 칸으로 날아온 공은 해당 칸의 학생이 우선적으로 리시브하여 네트 너머로 넘긴다. 3) 실점하거나 득점 후 로테이션 신호가 나오면 규칙에 따라 전원이 한 칸씩 자리를 이동하여 역할을 바꾼다. 4) 초기에는 원 바운드 허용 규칙으로 감각을 익히고, 숙달되면 노 바운드 규칙으로 난도를 높여 진행한다.</p>
