<h1>철봉 방향 전환 앞으로 내리기</h1>
<p>1) 철봉에 두 손으로 지지하여 매달린 후 한쪽 다리를 철봉 위로 넘겨 걸칩니다. 2) 철봉 위에 걸친 다리를 축으로 삼아 몸의 방향을 180도 회전시킵니다. 3) 회전과 동시에 다리를 철봉 밖으로 빼내며 몸의 균형을 잡습니다. 4) 철봉 뒤쪽 바닥을 향해 안정적인 자세로 뛰어내리며 착지합니다.</p>
