<h1>중앙을 선점하라</h1>
<p>1) 가운데 표적판을 두고 1인당 원반 1개씩 들고 출발선에 한 줄로 섭니다. 2) 원마커에서 한 명씩 표적판 중앙으로 원반을 던집니다. 3) 원반이 표적판 중앙에 위치하도록 던지며 다른 모둠의 원반이 있다면 밀어내도록 던집니다. 4) 표적판 중앙에 원반이 가장 가까운 모둠이 승리합니다.</p>
