<h1>중학년 소형 허들 달리기 (3보 리듬)</h1>
<p>1) 장애물을 일정한 리듬으로 경쾌하게 넘으며 달리는 소형 허들 활동을 합니다. 2) 발구름판이나 지상 마크를 이용해 3보 리듬으로 40m 구간을 통과하는 기초 연습을 합니다. 3) 코스 중심선을 따라 착지 발부터 1-2-3 숫자를 세며 리듬과 스피드를 유지해 전력으로 달립니다. 4) 조별 대항전으로 정해진 거리를 달리며 이전 기록보다 단축한 점수를 합산해 순위를 겨룹니다.</p>
