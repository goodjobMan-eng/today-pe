<h1>미션 부채 놀이</h1>
<p>1) 1번 친구가 부채를 들고 2번 친구에게 가서 가위바위보를 요청한다. 2) 주사위를 굴려 나온 수만큼(예: 6이면 6번, 2면 2번) 진 사람이 이긴 사람에게 정성을 다해 부채질을 해준다. 3) 3번, 4번 친구에게 차례대로 찾아가 같은 방식으로 가위바위보와 부채질을 진행한다. 4) 다음 순서 친구도 부채를 들고 앞선 번호부터 차례대로 모든 친구를 찾아가 미션을 수행한다.</p>
