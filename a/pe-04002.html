<h1>가을 밸런스 선택 준비운동</h1>
<p>1) 화면에 제시되는 두 가지 가을 관련 질문 중 마음에 드는 선택지를 하나 고른다. 2) 왼쪽 항목을 선택하면 왼쪽으로 이동하고, 오른쪽 항목을 선택하면 오른쪽으로 이동한다. 3) 자신이 선택한 항목에 해당하는 운동 또는 댄스 동작을 30초 타이머 동안 수행한다.</p>
