<h1>그린치 크리스마스 프리즈 댄스 2.0</h1>
<p>1) 가사에 맞춰 점프, 회전, 손 흔들기, 좌우 점프, 한 발 버티기, 박수 치기를 수행한다. 2) 신호에 맞춰 지정된 자세로 멈춤(Freeze) 동작을 유지한다. 3) 레이서 선택 화면에서 이길 것 같은 캐릭터를 선택한다. 4) 선택한 레이서를 응원하기 위해 제자리 달리기를 빠르게 수행한다.</p>
