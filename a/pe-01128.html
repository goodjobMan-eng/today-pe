<h1>원마커 점핑 세이프 피구</h1>
<p>1) 코트 전체에 학생 수보다 여유 있게 원마커를 일정한 간격으로 분산 배치한다. 2) 모든 참가자는 이동하거나 대기할 때 반드시 두 발 중 최소 한 발을 원마커 위에 딛고 있어야 한다. 3) 마커 사이를 점프로 이동하며 상대 팀이 던지는 폼볼을 피하거나 잡아 반격 투척한다. 4) 두 발이 모두 마커에서 떨어지거나 공에 맞으면 아웃되어 외야(반대편)로 이동하며, 공의 개수를 2~3개로 늘려 난이도를 높인다.</p>
