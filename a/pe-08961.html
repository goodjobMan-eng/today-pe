<h1>축구 공 돌기 기술 5가지</h1>
<p>1) 발바닥으로 공을 멈추고 당겨 회전하는 드래그 백을 연습한다. 2) 발 바깥쪽으로 공을 감싸며 나가는 아사이드를 연습한다. 3) 발 안쪽으로 공을 감싸며 도는 인사이드를 연습한다. 4) 디딤발을 짚고 반대발로 차는 척하며 돌아서는 크루프턴을 연습한다. 5) 발바닥으로 공을 밟고 당겨 걸쳐 회전하는 훅 앤 풀을 연습한다.</p>
