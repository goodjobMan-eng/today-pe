<h1>배드민턴 포핸드 및 백핸드 그립 익히기</h1>
<p>1) 라켓을 눕히지 않고 세운 상태에서 총 모양처럼 검지를 대고 엄지로 넓은 면을 잡고 나머지 손가락을 감아쥐어 포핸드 그립을 잡습니다. 2) 백핸드 그립은 넓은 면 쪽으로 엄지를 꾹 눌러 받치고 나머지 손가락으로 가볍게 잡습니다. 3) 포핸드와 백핸드 전환 동작을 반복 연습하며 손잡이 잡는 방법을 익힙니다. 4) 백핸드 그립은 서브를 넣을 때도 가볍게 활용합니다.</p>
