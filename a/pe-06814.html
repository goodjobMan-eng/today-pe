<h1>배트로 공을 쳐서 보내기</h1>
<p>1) 배팅 티를 놓고 10m 지점에 내야 라인, 그 뒤 10m 지점에 외야 라인을 표시한다. 2) 4명이 한 모둠을 구성하여 공을 치는 순서를 정한다. 3) 배팅 티 위의 공을 쳐서 내야로 보내면 1점, 외야로 보내면 2점을 얻는다. 4) 한 사람이 5번을 치면 다음 순서로 넘어가며 모둠원 모두의 점수를 합산해 가장 높은 모둠이 이긴다.</p>
