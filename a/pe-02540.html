<h1>농구 점프 슛과 레이업 슛</h1>
<p>1) 점프 슛은 팔꿈치를 90도로 굽히고 손목을 뒤로 젖힌 후 왼손은 공 옆에 거들며 잡는다. 2) 무릎을 굽혔다 펴면서 점프하여 손목 스냅과 팔꿈치 힘으로 공을 던진다. 3) 레이업 슛은 골대 쪽으로 이동하며 오른발, 왼발 스텝을 밟고 뛰어오른다. 4) 뛰어오르는 동시에 백보드의 네모 모서리를 향해 공을 살짝 얹어놓듯이 올려놓는다.</p>
