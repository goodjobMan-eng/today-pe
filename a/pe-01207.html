<h1>뭉친 다리를 푸는 교실 하체 스트레칭</h1>
<p>1) 교실에서 책상 옆 통로에 바르게 서서 하체 스트레칭을 준비한다. 2) 한 발로 균형을 잡고 발등을 뒤로 당겨 허벅지 앞쪽을 늘려준 뒤 반대쪽도 진행한다. 3) 무릎을 가슴 앞으로 끌어안아 올리고 발목을 위아래로 움직이며 골반과 고관절을 회전시켜 풀어준다. 4) 다리를 넓게 벌려 기마 자세로 앉은 후 양손으로 무릎을 짚고 어깨를 반대쪽으로 밀어 넣으며 허벅지 안쪽과 상체를 시원하게 늘려 마무리한다.</p>
