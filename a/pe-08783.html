<p>1) 손가락과 엄지로 볼텍스를 감싸듯 쥡니다. 2) 던지는 팔의 반대쪽 발을 앞으로 하여 측면으로 섭니다. 3) 팔꿈치를 굽히지 않고 뒤로 당겼다가 팔꿈치를 리드하며 앞으로 던집니다.</p>
