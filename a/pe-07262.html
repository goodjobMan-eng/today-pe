<h1>파라슈트 피트니스 워밍업</h1>
<p>1) 바닥에 펼쳐진 파라슈트를 만지지 않고 주위를 반시계방향으로 원을 그리며 걷거나 조깅한다. 2) 음악이 멈추면 가장 가까운 파라슈트 색상 구역 앞에 1~2명씩 자리를 잡고 앉는다. 3) 교사가 지정한 해당 색상의 피트니스 운동(버피, 플랭크, 싯업 펀치, 점핑잭 등)을 30초 동안 수행한다.</p>
