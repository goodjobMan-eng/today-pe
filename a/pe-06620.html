<h1>크로스핏 타겟런 팀 릴레이</h1>
<p>1) 3명이 한 팀이 되어 출발선에서 대기한다. 2) 첫 주자는 점프 스쿼트 15회, 인앤아웃 10회, 사이드잭 10회의 개인 미션을 수행한다. 3) 미션 후 베어크롤로 10m 전진하여 셔틀콕 2개를 바구니 표적에 던져 넣는다. 4) 다시 베어크롤로 되돌아와 다음 주자와 하이파이브로 교대한다. 5) 바구니에 들어간 셔틀콕 개수에 따라 승부를 결정한다.</p>
