<h1>2인 줄넘기 나란히 서기 동작</h1>
<p>1) 두 사람이 나란히 서서 각자 바깥쪽 손으로 줄넘기 손잡이를 하나씩 잡는다. 2) 구령에 맞춰 줄을 함께 돌리며 2도약 뛰기로 줄을 넘는다. 3) 발 바꿔 뛰기 동작으로 호흡을 맞추며 줄을 넘는다. 4) 한 사람만 뛰기, 4회씩 번갈아 뛰기, 번갈아 뛰기, 회전하기 동작으로 난이도를 높여 도전한다.</p>
