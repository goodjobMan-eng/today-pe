<h1>그린치를 찾아라 움직임 퀴즈</h1>
<p>1) 화면 속에서 빠르게 섞이며 움직이는 그린치의 위치를 눈으로 집중하여 추적합니다. 2) 그린치가 숨었다고 생각되는 선물 상자에 매칭된 캐릭터의 신체 동작을 제한 시간 동안 따라 합니다. 3) 정답 공개 시 그린치가 나온 상자의 동작을 맞혔다면 1점을 획득합니다. 4) 미니게임 및 퀴즈 구간을 포함하여 총 3단계 레벨을 차례로 통과합니다.</p>
