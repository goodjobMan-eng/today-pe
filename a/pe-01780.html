<h1>저글링 스카프 교실 체조</h1>
<p>1) 학생마다 양손에 저글링 스카프를 들고 책상 옆 안전 공간에 선다. 2) 교사의 구령에 맞춰 팔을 크게 돌리거나 공중에 알파벳 글자를 크게 그린다. 3) 제시되는 수학 연산 문제를 들으며 스카프를 던져 올린 뒤 정답 숫자를 맞춘다. 4) 스카프를 위로 높이 던지고 공중에서 빠르게 낚아채며 반사신경 반응 훈련으로 변형한다.</p>
