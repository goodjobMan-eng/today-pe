<h1>점수 콘 돌아오기</h1>
<p>1) 6명이 한 모둠을 이루어 두 모둠이 공격과 수비로 나뉘어 게임을 진행한다. 2) 공격수는 수비수의 위치를 보고 배트로 공을 친 후 한 방향을 골라 자신이 원하는 점수의 콘을 돌아온다. 3) 공보다 먼저 홈으로 들어오면 콘에 해당하는 점수를 얻고, 공이 바닥에 떨어지기 전에 수비수가 잡으면 점수를 얻지 못한다. 4) 모든 모둠원의 공격이 끝나면 공수를 바꾸고 가장 많은 점수를 얻은 모둠이 승리한다.</p>
