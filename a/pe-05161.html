<h1>크로스오버 (영역 침투 게임)</h1>
<p>1) 경기장을 2개의 중앙 구역과 양 끝의 엔드존 2개로 나누고 두 팀으로 나눈다.2) 상대 구역을 통과해 상대 엔드존으로 넘어가되, 상대 구역에서는 태그될 수 있다.3) 태그되면 얼음 상태로 멈추며, 같은 팀원이 손을 잡고 자기 구역으로 데려와 구출해 준다(구출 중에는 태그 불가).4) 자기 구역의 모든 팀원을 상대 엔드존으로 먼저 이동시킨 팀이 승리한다.</p>
