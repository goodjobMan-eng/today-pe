<p>1) 서서 턱을 당긴 상태에서 목을 좌우로 천천히 회전시킨다. 2) 상체를 둥글게 숙인 채 골반을 고정하고 흉추를 좌우로 회전한다. 3) 어깨 관절을 앞뒤로 크게 돌리고, 바닥에 눕거나 의자에 앉아 고관절과 발목 회전을 수행한다.</p>
