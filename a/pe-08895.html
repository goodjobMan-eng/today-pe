<h1>어벤져스 체육 수업 워밍업</h1>
<p>1) 토르와 헐크 복장을 한 강사를 따라 제자리에서 망치 타임 동작을 한다. 2) 화면의 지시에 따라 교실과 복도를 이동하며 점프와 달리기 등의 신체활동을 한다. 3) 중간중간 나타나는 캐릭터들의 미션에 맞춰 다양한 동작과 댄스를 따라 한다.</p>
