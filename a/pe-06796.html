<h1>인간 호박고누</h1>
<p>1) 바닥에 원마커 5개를 호박고누 모양(원형과 중앙 진입로)으로 배치한다. 2) 2명씩 두 팀으로 나누어 원마커 위에 말을 대신하여 직접 올라선다. 3) 팀별로 번갈아 가며 연결된 선을 따라 빈 원마커로 한 칸씩 이동한다. 4) 상대 팀 말(사람)이 더 이상 움직일 수 없도록 길을 모두 막으면 승리한다.</p>
