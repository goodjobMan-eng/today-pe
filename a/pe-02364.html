<h1>간이 농구</h1>
<p>1) 5명이 한 모둠을 이루고 두 모둠이 게임을 진행합니다. 2) 공을 드리블하거나 패스하며 상대 모둠의 영역으로 이동합니다. 3) 골대에 공을 넣으면 1점을 얻고, 모둠원 모두가 패스를 주고받은 후 골을 넣으면 2점을 얻습니다. 4) 공을 빼앗기거나 밖으로 나가면 공격권이 넘어가며, 정해진 시간 동안 점수가 많은 모둠이 이깁니다.</p>
