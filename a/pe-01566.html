<h1>햄스터 댄스 피트니스 워밍업</h1>
<p>1) 교실이나 강당에서 학생 각자 제자리에 서서 앞을 보고 준비한다. 2) 햄스터 댄스 음악에 맞춰 양손을 머리 위에 올리거나 턱 밑에서 돌리는 햄스터 흉내 동작을 따라 한다. 3) 사이드 스텝 터치, 점핑잭, 무릎 터치, 제자리 달리기 등 유산소 스텝을 박자에 맞춰 연속으로 수행한다. 4) 후반부에는 동작의 속도를 높이거나 친구와 마주 보며 거울 모드로 동작을 따라 하는 변형 활동으로 진행한다.</p>
