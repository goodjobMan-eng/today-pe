<h1>얼음동굴에서 빠져나가기</h1>
<p>1) 접시콘으로 구획된 얼음동굴 관문마다 술래가 서서 대기하고 주자들은 출발선에 선다.2) 신호가 울리면 주자들은 방향을 바꾸며 각 관문의 술래들을 피해 도착점을 향해 달린다.3) 술래에게 터치당하면 경기장 밖으로 나가 출발선으로 돌아가고, 무사히 통과한 학생은 도착점 바구니의 콩주머니 1개를 가져와 출발점 바구니에 넣는다.</p>
