<h1>발로 공 몰아 공 모으기</h1>
<p>1) 반 전체를 두 모둠으로 나눕니다. 2) 시작 신호와 함께 상대 모둠 영역에 있는 공을 발로 몰아서 자신의 모둠 영역으로 가지고 옵니다. 3) 공은 한 번에 한 개씩만 가지고 올 수 있으며, 공을 몰고 이동하는 상대 모둠원의 공은 빼앗을 수 없습니다. 4) 정해진 시간 동안 가장 많은 공을 모은 모둠이 이깁니다.</p>
