<h1>보물 구출하기 (샤츠 베르겐)</h1>
<p>1) 늑목에 밧줄을 매달고 바닥에 두 장의 두꺼운 매트를 깐 뒤 메디신볼(보물)을 놓는다. 2) 학생들은 바닥의 두꺼운 매트를 절대 밟지 않고 밧줄과 협동을 활용해 매트 위의 메디신볼을 구출한다. 3) 모둠원 전체가 역할을 나누어 계획을 세우고 메디신볼을 안전지대로 끌어낸다.</p>
