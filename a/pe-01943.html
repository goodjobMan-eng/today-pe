<h1>독수리와 물수리의 물고기 사냥</h1>
<p>1) 코트 중앙에 콩주머니(물고기) 50~100개를 뿌려두고 양쪽 진영 끝에 훌라후프 둥지를 설치한다. 2) 빠른 물수리 팀에게 5초 먼저 출발하는 우선권을 주어 중앙의 물고기를 둥지로 나르게 한다. 3) 힘센 독수리 팀이 출발하면 물고기를 줍거나 물수리를 태그하여 물고기를 빼앗아 자기 둥지로 가져간다. 4) 한 번에 물고기 한 개씩만 운반하며, 바닥의 물고기가 다 떨어지면 둥지 속 개수가 많은 팀이 승리한다.</p>
