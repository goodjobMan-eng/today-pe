<h1>럭비공을 활용한 폭탄 나르기 협동 놀이</h1>
<p>1) 두 팀이 마주 보고 선 상태에서 교사가 양 팀 사이에 럭비공을 던지거나 찬다. 2) 양 팀 모두 럭비공이 떨어진 지점으로 달려가 가장 먼저 공을 잡은 사람이 대장이 된다. 3) 나머지 팀원들은 대장 뒤로 차례대로 일렬로 줄을 선다. 4) 머리 위나 다리 사이 등으로 럭비공을 뒤로 전달하고, 공을 넘긴 사람은 그 자리에 즉시 앉으며 맨 마지막 사람이 공을 앞으로 가져다준다.</p>
