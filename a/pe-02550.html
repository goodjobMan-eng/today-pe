<h1>농구 패스 4가지 익히기</h1>
<p>1) 체스트 패스는 엄지/검지/중지로 힘을 주고 한 발을 앞으로 내밀며 손등이 마주 볼 정도로 밀어 패스한다. 2) 바운드 패스는 나와 상대 사이의 3분의 2 지점에 공을 바운드시켜 보낸다. 3) 원핸드 패스는 한 손으로 공을 잡고 손목 스냅, 팔 힘, 허리 반동을 이용해 같은 쪽 발을 내밀며 패스한다. 4) 오버헤드 패스는 양손으로 공을 머리 위로 들어 스텝과 허리 반동을 활용해 패스한다.</p>
