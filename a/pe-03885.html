<h1>스파이더맨 스쿠터 태그</h1>
<p>1) 한 명의 술래가 체육관 중앙 바닥에 거미처럼 엎드려 있는다. 2) 다른 학생들은 조용히 술래 주변으로 모여든다. 3) 신호와 함께 거미 술래가 깨어나 기어 다니며 학생들을 태그한다. 4) 잡힌 학생도 엎드려 거미 술래가 되며, 마지막 1명이 남을 때까지 반복한다.</p>
