<h1>배드민턴 하프코트 변형 게임 9가지</h1>
<p>1) 단식 하프코트 전체를 사용하는 기본 하프코트 경기를 진행한다. 2) 앞뒤 트램라인을 제외한 중앙 박스 구역만 사용하는 덴마크/잉글리시 더블스 방식으로 공격성을 높인다. 3) 앞쪽 숏서비스라인 앞을 제외하고 뒤쪽으로만 공을 넘기거나 반대로 백바운더리를 제외하고 네트 앞 공격에 집중하는 등 코트 구역을 제한하여 경기한다.</p>
