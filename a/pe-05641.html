<h1>접시콘 핑퐁</h1>
<p>1) 테이블이나 바닥에 점수가 적힌 숫자 접시콘(또는 색깔별 점수 접시콘)을 배치한다.2) 정해진 거리에서 탁구공을 원바운드시켜 접시콘 구멍 안으로 튕겨 넣는다.3) 공이 직접 들어가거나 바운드 후 안착하면 해당 접시콘에 적힌 점수를 획득한다.4) 번갈아 던지며 정해진 목표 점수에 먼저 도달하거나 합산 점수가 높은 쪽이 승리한다.</p>
