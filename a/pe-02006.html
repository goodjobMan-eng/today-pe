<h1>병뚜껑치기 (알까기·벽치기)</h1>
<p>1) 엄지, 검지, 중지 중 손을 바닥에 붙이고 편한 손가락으로 병뚜껑을 튕겨 친다. 2) 병뚜껑을 마주 보게 두고 번갈아 쳐서 상대 병뚜껑을 맞히거나 한 뼘 거리에 닿으면 따낸다. 3) 벽치기는 벽을 이용해 상대 병뚜껑을 맞혀 따낸다. 4) 상대방 병뚜껑을 모두 따거나 많이 딴 사람이 이긴다.</p>
