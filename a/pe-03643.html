<h1>한발 술래잡기</h1>
<p>1) 술래의 &quot;한발&quot; 구령 신호에 맞춰 술래와 도망자 모두 동시에 딱 한 발씩만 이동한다. 2) 술래가 구령을 외치지 않았는데 혼자 따로 움직이거나, 두 발 이상 움직이면 즉시 아웃되어 경기장 밖으로 나간다. 3) 정해진 경기장 경계선 바깥으로 발이 나가거나 술래에게 터치당하면 아웃된다. 4) 술래 2명은 양을 몰듯이 도망자들을 몰아가며 터치하고, 마지막 2명이 남을 때까지 생존한 학생이 승리한다.</p>
