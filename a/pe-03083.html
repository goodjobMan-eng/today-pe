<h1>축구 킥 기본자세 익히기</h1>
<p>1) 공을 차기 전에 공의 위치를 똑바로 바라본다. 2) 공을 향해 달려갈 때는 직선이 아닌 비스듬한 각도로 달려간다. 3) 디딤발은 공 바로 옆에 나란히 놓는다. 4) 차는 다리를 뒤로 구부렸다 펴며 발 옆면이나 발등으로 차고, 반대 팔을 휘둘러 균형을 잡는다.</p>
