<h1>스티플체이스 종합 장애물 코스 통과하기</h1>
<p>1) 링, 봉, 블록, 클립을 조립해 넘어가기, 밑으로 기어가기, 통과하기 장애물 코스를 구성한다.2) 파란색 링은 몸을 통과시켜 빠져나간다.3) 하단이 비어 있는 가로 봉은 몸을 숙여 밑으로 기어 통과한다.4) 아래에 블록이 채워진 가로 봉은 발을 올려 넘어간다.5) 교사가 머리를 가볍게 터치하면 출발하며, 장애물 통과가 어려운 친구는 도우미가 도와준다.</p>
