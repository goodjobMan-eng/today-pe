<h1>팬케이크 파티 릴레이</h1>
<p>1) 모둠별 첫 주자는 바구니의 팬케이크(스팟 마커)를 손으로 프라이팬 위에 올린다.2) 팬케이크를 든 사람은 한쪽 발을 바닥에 고정한 채 몸을 돌려 다음 주자의 프라이팬 위로 미끄러뜨려 전달한다.3) 공을 넘긴 주자는 줄 맨 앞으로 이동하고, 팬케이크가 반대편 훌라후프(접시)에 도달할 때까지 손이나 바닥에 닿지 않게 전달하며 떨어뜨리면 처음부터 다시 시작한다.</p>
