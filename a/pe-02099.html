<h1>근심걱정 종이공 점보 컵스택에 던져 넣기</h1>
<p>1) 이면지 두 장에 1학기 중 가장 아쉬웠던 점과 가장 버리고 싶은 습관을 각각 적는다. 2) 적은 이면지를 마구 구겨서 2개의 종이공을 만든다. 3) 교실 바닥에 점보 컵스택 5개를 일렬로 놓고 던지는 위치에서 멀어질수록 2점부터 6점까지 배점한다. 4) 한번에 공 1개씩 총 두 번을 던져 컵에 들어가면 해당 위치 점수, 안 들어가면 1점을 얻는다.</p>
