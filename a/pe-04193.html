<h1>조엘의 핀 셔플 볼 굴리기</h1>
<p>1) 두 사람이 마주 보고 서서 둘 사이에 플라스틱 핀 하나를 세운다. 2) 공을 가진 사람이 바닥으로 공을 굴려 상대방 앞의 핀을 쓰러뜨리려 시도한다. 3) 공이 핀을 쓰러뜨리지 못하면 상대방이 공을 잡아 다시 굴린다. 4) 핀을 맞혀 쓰러뜨리면 핀을 맞힌 사람 쪽으로 한 칸 전진시키며, 한쪽 끝 라인까지 먼저 이동시킨 사람이 이긴다.</p>
