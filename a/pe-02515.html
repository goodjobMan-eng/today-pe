<h1>수건 뒤집기 롤링 챌린지</h1>
<p>1) 수건을 말아 출발선을 만들고 4피트 앞에 손수건(핸드타월)을 펼쳐 놓는다. 2) 반대 발을 내딛으며 양말공을 굴린다. 3) 공이 손수건 위에 멈추거나 닿으면 1점을 얻고, 몸쪽 가장자리를 잡아 앞쪽으로 한 번 접어 뒤집는다. 4) 1분 동안 굴리기와 뒤집기를 반복해 점수를 획득한다.</p>
