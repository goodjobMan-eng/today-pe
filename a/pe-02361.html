<h1>원 마커 주먹 야구</h1>
<p>1) 5명이 한 모둠을 이루고 두 모둠이 게임을 하며, 공격 모둠은 치는 순서와 가져올 원 마커를 정합니다. 2) 타자는 주먹으로 공을 치고 자신이 정한 원 마커를 홈으로 가져오면 1점을 얻습니다. 3) 수비 모둠이 뜬공을 바로 받거나 타자보다 먼저 홈으로 공을 보내면 타자는 아웃입니다. 4) 모든 타자의 공격이 끝나면 공수를 교대하고 점수를 더 많이 얻은 모둠이 이깁니다.</p>
