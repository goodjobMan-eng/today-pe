<h1>성공하면 이동 슈팅</h1>
<p>1) 슛을 하는 위치를 원마커(스팟) 등으로 1번부터 순서대로 표시합니다. 2) 미리 정한 순서대로 1번 위치에서 농구 골대를 향해 슛을 합니다. 3) 골대에 골을 넣지 못하면 맨 뒤로 이동해서 다음 차례를 기다립니다. 4) 골을 넣으면 다음 번호 위치로 이동해서 슛을 하며, 정해진 시간 동안 더 많은 곳에서 성공한 사람이 승리합니다.</p>
