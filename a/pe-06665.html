<p>1) 1스퀘어에서 양발 모아 점프로 콘을 왕복 2회 뛰어넘는다. 2) 2스퀘어에서 매트를 지나 축구볼 바운더 타깃을 향해 너프건을 1발 사격하고 오른쪽 매트로 굴러 빠져나온다. 3) 3스퀘어에서 의자와 막대로 만든 철조망 구간을 통과한다. 4) 4스퀘어에서 남은 5발로 오토리버스 타깃을 사격해 점수를 획득하고 타이머 시간 안에 출발선으로 복귀한다.</p>
