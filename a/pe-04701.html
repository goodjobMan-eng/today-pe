<h1>스파이크볼 리드업 과제 활동</h1>
<p>1) 화면에 제시된 파트너별 도전 과제 단계를 확인한다. 2) 크고 작은 후프와 다양한 공 중 자신에게 맞는 것을 골라 손으로 바닥과 후프 안으로 치는 연습을 한다. 3) 단계별 과제를 완수할 때마다 자석 평가판에 자신의 레벨을 기록한다. 4) 과제 수행 중 언제든지 후프 크기나 공을 자유롭게 바꿔가며 난이도를 조절한다.</p>
