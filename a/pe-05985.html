<h1>챔피언과 도전자 빈백 후프 게임</h1>
<p>1) 두 사람이 마주 보고 가위바위보를 하여 진 사람이 먼저 상대방 후프를 향해 빈백을 던진다.2) 던진 빈백이 상대 후프에 들어가지 못하면 자기 후프를 한 바퀴 돌아 제자리로 온다.3) 이긴 사람은 수비로서 상대가 돌아오는 동안 빈백을 던져 맞히거나 후프에 넣는다.4) 후프에 먼저 두 개를 넣는 사람이 승리한다.</p>
