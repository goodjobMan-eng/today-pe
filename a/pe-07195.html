<h1>업다운 술래잡기</h1>
<p>1) 술래는 뿅망치(태그 도구)를 들고 도망치는 친구들을 쫓아간다. 2) 술래에게 잡힌 친구는 '업'이나 '다운' 구호를 받는다. 3) '업'은 두 손을 들고 두 발을 모아 뛰며, '다운'은 바닥에 엎드린다. 4) 같은 상태의 친구(업끼리 또는 다운끼리)를 만나 마주 손을 치면 부활한다.</p>
