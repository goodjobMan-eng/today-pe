<h1>공 던지고 받기 놀이 (패스 게임)</h1>
<p>1) 조끼 색상별로 팀을 나누고 한 발을 내밀며 공을 던지고 받는 기본 연습을 한다.2) 공을 가진 사람은 이동할 수 없으며 공이 없는 팀원들은 빈 곳으로 계속 이동한다.3) 같은 팀끼리 패스가 연속 3번 성공하면 1점을 획득하고 하이파이브를 한다.4) 상대 팀이 중간에 공을 가로채거나 공이 선 밖으로 나가면 공격권이 넘어간다.</p>
