<h1>더해봐 1대1 배틀 가위바위보</h1>
<p>1) 주먹은 0, 가위는 2, 보는 5로 숫자를 정한다.2) 두 명이 마주 보고 '더해봐'를 외치며 동시에 손을 낸다.3) 양쪽 손가락 수의 합을 먼저 정확하게 외친 사람이 승리한다.4) 3판 2선승제로 먼저 이긴 사람은 점핑잭 5회를 하고 손을 든 뒤, 손을 든 다른 친구를 찾아 새로운 배틀을 진행한다.</p>
