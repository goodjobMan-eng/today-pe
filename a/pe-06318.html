<h1>도형 둘레를 드리블하며 달리는 농구 활동</h1>
<p>1) 원, 사각형, 삼각형, 직사각형 등의 다양한 도형과 출발선이 표시된 구역을 준비한다.2) 신호가 울리면 첫 번째 학생이 농구공을 드리블하며 여러 도형 둘레를 30~40초 동안 계속 이동한다.3) 두 번째 신호가 울리면 출발선으로 드리블해 돌아와 다음 주자에게 공을 넘겨주고 모든 학생이 참여할 때까지 반복한다.</p>
