<h1>요가 프리즈 댄스 멈춤 놀이</h1>
<p>1) 신나는 음악이 나오는 동안 자유롭게 춤을 추거나 제자리 스텝을 밟습니다. 2) 음악이 멈추면 화면에 제시되는 요가 동작(나무 자세, 전사 자세, 다운독 등)을 확인합니다. 3) 화면의 카운트다운에 맞춰 해당 요가 자세를 10초 동안 흔들리지 않고 유지합니다. 4) 여러 라운드를 진행하며 유연성과 신체 균형 감각을 기릅니다.</p>
