<h1>배구 언더핸드 패스 기본기 및 벽 패스 연습</h1>
<p>1) 손바닥을 위로 하여 한 손 위에 다른 손을 포개 감싸 쥐고 팔꿈치를 펴 기본 팔 모양을 만든다. 2) 발을 어깨너비의 1.5배로 벌리고 무릎을 110~120도 굽혀 중심을 앞꿈치에 둔 뒤 좌우 스텝을 연습한다. 3) 손목 위 15~20cm 위치에서 공을 맞히며 무릎과 팔을 한 동작으로 들어 올려 벽의 목표지점으로 연속 패스한다.</p>
