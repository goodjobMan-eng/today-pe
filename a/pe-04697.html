<h1>캐슬 크러셔</h1>
<p>1) 학급을 두 팀으로 나누고 1명은 스쿠터보드에 앉고 1명은 파트너를 밀어주며 털실 공을 발사체로 사용한다. 2) 팀 조끼 색상에 따라 상대 팀의 볼링핀 타워를 공으로 맞춰 쓰러뜨린다. 3) 상대 팀의 모든 핀을 먼저 쓰러뜨린 팀이 해당 라운드에서 승리한다. 4) 중앙의 콘을 공으로 쓰러뜨리면 쓰러진 자기 팀의 핀 1개를 다시 세울 수 있다.</p>
