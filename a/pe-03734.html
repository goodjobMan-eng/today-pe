<h1>부모 넘기 맨몸 지지 놀이</h1>
<p>1) 부모가 엎드려 엎드린 자세를 취하면 어린이는 그 아래를 기어서 통과하거나 다리 위를 뛰어넘는다. 2) 부모의 어깨나 등 위로 올라갔다가 내려오는 동작을 수행한다. 3) 부모가 네발로 엎드려 다리를 뻗으면 어린이는 등을 손으로 짚고 지지하며 뛰어넘는다. 4) 부모는 등을 둥글게 말아주고 어린이는 손으로 지탱하며 체중을 싣는 동작으로 발전시킨다.</p>
