<h1>순록 술래잡기 (El reno)</h1>
<p>1) 학생들을 경기장 전체에 배치하고, 팀조끼를 입은 한 명의 학생이 술래(순록)가 된다. 2) 술래는 경기장을 돌아다니며 다른 학생들을 잡으러 다닌다. 3) 술래에게 잡힌 학생은 경기장 옆으로 이동하여 경기장의 한쪽 구석과 다른 쪽 구석을 차례로 터치한다. 4) 두 구석을 모두 터치한 학생은 다시 경기장 안으로 돌아와 게임에 참여한다.</p>
