<h1>아워글래스 릴레이</h1>
<p>1) 도구나 교구 없이 학생들을 네 모둠(네 줄)으로 나눈다. 2) 네 줄의 첫 번째 주자 4명이 동시에 출발하여 모래시계 형태(대각선 및 반대 방향)로 마주 보는 지정된 줄을 향해 달린다. 3) 반대편 줄의 첫 번째 주자와 하이파이브를 한 뒤 그 줄의 맨 뒤로 가서 선다. 4) 하이파이브를 받은 주자가 바로 출발하며 네 방향에서 끊김 없이 지속적으로 러닝을 이어간다.</p>
