<h1>얼티밋 워리어스 피구</h1>
<p>1) 구역을 세 구역(농민, 기사, 얼티밋 워리어)으로 나누고 동시에 3개의 피구 게임을 진행한다. 2) 공에 맞은 선수는 아래 구역으로 한 단계 강등된다. 3) 상대를 맞힌 선수는 위 구역으로 한 단계 승급하며, 정해진 시간 종료 시 얼티밋 워리어 구역에 있는 사람이 승리한다.</p>
