<h1>서킷 체력 모듈 및 사격 챌린지</h1>
<p>1) 계단 오르내리기, 왕복 점프, 사이드 스텝의 3개 체력 모듈 구역을 구성한다. 2) 기록원과 수행자로 짝을 이루어 태블릿으로 수행 시간과 횟수를 측정한다. 3) 고강도 체력 운동을 마친 후 숨이 찬 상태에서 곧바로 사격 사선으로 이동한다. 4) 서서 쏴 자세로 전자 자동 타깃을 향해 정해진 발수(10발) 사격을 실시한다. 5) 획득한 사격 점수와 체력 모듈 수행 시간을 합산하여 모둠 기록을 산출한다.</p>
