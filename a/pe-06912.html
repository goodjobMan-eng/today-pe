<h1>서서 하는 코코 (스탠딩 코)</h1>
<p>1) 학생들을 4개 조(한 줄로 서기)로 나누고 술래 1명과 도망자 1명을 지정한다. 2) 신호가 울리면 술래는 도망자를 쫓아가고, 도망자는 원하는 조의 맨 앞에 서며 박수를 쳐서 태그를 피한다. 3) 도망자가 앞에 서면 해당 조의 맨 뒤에 있던 학생이 새로운 도망자가 되어 즉시 달린다. 4) 도망자가 술래에게 잡히면 역할을 맞바꾸며, 도망자는 10~20초 안에 안전 구역으로 들어가야 한다.</p>
