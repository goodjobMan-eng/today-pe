<h1>훌라후프 통과 릴레이</h1>
<p>1) 모둠원들이 손을 잡고 둥글게 원을 만들어, 손을 떼지 않고 훌라후프를 몸 전체로 통과시키는 협동 활동을 준비합니다. 2) 1단계는 손을 잡은 채 머리와 몸통, 다리를 움직여 후프를 다음 사람에게 넘깁니다. 3) 2단계는 일렬로 쪼그려 앉은 모둠원들의 다리 사이나 몸 아래로 후프를 연속해서 통과시킵니다. 4) 3단계는 주자가 훌라후프를 줄넘기처럼 돌려 넘으며 반환점 콘을 돌아오는 릴레이 경기로 확장합니다.</p>
