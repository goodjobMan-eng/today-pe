<h1>공 치기 서브 받기 게임</h1>
<p>1) 바닥에 1번부터 6번까지 점수가 적힌 원마커 자리를 배치한다.2) 서브하는 사람은 1번 자리에서 서브하기 전 공을 받을 친구의 이름을 부른다.3) 정지된 공을 쳐서 서브하고, 지목받은 친구는 한 발을 원마커에 댄 상태로 직접 잡거나 한 번 튕겨 잡는다.4) 성공하면 해당 자리의 점수를 획득하고, 팀원들이 시도를 마치면 역할을 교대한다.</p>
