<h1>서킷 준비운동</h1>
<p>1) 체육관 외곽을 조깅으로 2바퀴 달린다. 2) 중앙에 마련된 운동 구역으로 이동한다. 3) 팔굽혀펴기 10회(또는 10초간 버티기), 배 운동인 베리 줍기, 윈드밀 10회 등 지정된 운동 10회를 수행한다. 4) 다시 조깅 2바퀴를 달린 뒤 스트레칭으로 마무리한다.</p>
