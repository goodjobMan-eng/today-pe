<h1>디스크 골프 퍼팅 게임</h1>
<p>1) 디스크 골프 골대 앞 3걸음(1점), 5걸음(2점), 7걸음(3점) 거리에 출발선을 콘으로 표시하고 모둠별로 정렬한다. 2) 각 모둠의 1번 주자부터 1점 거리에서 골대를 향해 디스크를 던져 퍼팅한다. 3) 1점 거리에서 골대에 넣으면 다음 차례에 2점 거리에 도전하고, 2점에서 성공하면 3점 거리에 도전하며 실패 시 다음 사람에게 순서가 넘어간다. 4) 모둠원이 던져 획득한 총점을 합산하여 가장 높은 점수를 얻은 모둠이 승리한다.</p>
