<h1>도미노 컵 만들기 &amp; 스태킹 기차 달리기 &amp; 3-3-3 터치</h1>
<p>1) 바닥에 컵을 엎어 탁구공을 숨긴 후 릴레이 달리기로 나와 숨겨진 탁구공을 찾는다. 2) 바닥에 컵 6개를 일렬로 두고 위에 5개를 교차해 쌓은 뒤 마지막 컵 1개를 옆에서 밀어 도미노처럼 쓰러뜨린다. 3) 두 명이 평행하게 나란히 서서 10m 간격 자리마다 3-3-3 스태킹을 반복하며 달리다 간격이 좁혀졌을 때 상대를 먼저 가볍게 터치한 사람이 승리한다.</p>
