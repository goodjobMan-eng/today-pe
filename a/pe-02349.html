<h1>온몸족구</h1>
<p>1) 순서를 정해 돌아가며 서비스는 손으로 던져서 상대 진영으로 넣는다. 2) 넘어온 공은 노바운드 또는 원바운드로 처리하며, 몸의 어느 부위로 받아도 상관없다. 3) 모든 모둠원이 한 번씩은 반드시 공을 터치해야 한다. 4) 상대 진영으로 마지막으로 공을 넘길 때는 발이나 머리로 넘겨야 하며, 15점을 먼저 얻은 모둠이 승리한다.</p>
