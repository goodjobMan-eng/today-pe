<h1>스포츠 빈백 - 1구 2구 저글링 지도법</h1>
<p>1) 1구 연습은 다리를 어깨너비로 벌리고 공을 밑에서 끌어올려 머리 높이로 반대 팔 쪽으로 던져 잡는 연습을 2~3분간 실시한다.2) 2구 연습은 첫 번째 공을 던져 최고 정점에 도달했을 때 두 번째 공을 안쪽에서 위로 던져 올린다.3) 손을 돌리지 말고 밑에서 기다리며 첫 번째 공을 먼저 잡고 두 번째 공을 잡는다.4) 구령으로 '하나, 둘, 셋, 넷'을 입으로 외치며 타이밍에 맞춰 두 번째 공을 던지고 잡는다.</p>
