<h1>신체 부위 추가 풍선 주고받기 놀이</h1>
<p>1) 두 사람이 마주 보고 첫 번째 사람이 손 등 신체 한 부위를 사용하여 풍선을 띄워 상대에게 보낸다. 2) 상대방은 앞사람이 사용한 부위를 그대로 사용한 뒤 자신이 원하는 신체 한 부위를 새롭게 추가하여 풍선을 다시 보낸다. 3) 차례대로 신체 부위를 하나씩 늘려 가며 풍선이 바닥에 떨어지지 않도록 연속으로 주고받는다. 4) 정해진 순서의 신체 부위로 풍선을 치지 못하거나 풍선을 잡거나 놓치면 패배한다.</p>
