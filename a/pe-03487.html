<h1>몸을 유연하게 만드는 스트레칭 운동</h1>
<p>1) 양발을 벌리고 서서 깍지 낀 팔을 위로 뻗은 뒤 옆구리가 당기도록 좌우로 기울여 3초간 유지한다. 2) 한쪽 다리를 뒤로 구부려 손으로 잡고 반대 손을 뻗어 5초간 균형을 잡는다. 3) 매트에 앉아 다리를 벌리고 상체를 앞으로 숙여 양팔을 뻗고 5초간 유지한다. 4) 엎드린 사람의 손목을 잡고 서서히 당겨주거나, 등을 맞대고 팔짱을 낀 뒤 상대를 업어주며 5초간 스트레칭한다.</p>
