<h1>팀 메모리 기억력 릴레이 게임</h1>
<p>1) 바닥에 4가지 색깔의 콩주머니 각 4개씩(총 16개)을 규칙적으로 늘어놓고 그 위에 플라잉디스크(원반)나 보울을 덮어 가린다. 2) 4개 색상 팀으로 나눈 뒤, 각 팀의 첫 번째 주자가 달려 나가 원반 하나를 들춰 본다. 3) 자신의 팀 색상과 일치하면 콩주머니를 가져와 팀에 두고, 일치하지 않으면 다시 덮어둔 뒤 다음 주자에게 교대한다.</p>
