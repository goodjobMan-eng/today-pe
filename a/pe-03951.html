<h1>스노우볼 스태커스</h1>
<p>1) 바닥의 큰 사각형 안에 무지개색 양동이들을 모아두고 둘레의 원마커에 각자 선다. 2) 각자 폼 펠릿이 든 공 2개를 받아 양동이를 향해 던지거나 토스한다. 3) 공 넣기에 성공하면 해당 양동이를 자기 마커 뒤로 가져와 탑 쌓기를 시작하고 실패하면 공을 주워 다시 던진다. 4) 다음 양동이를 획득할 때마다 양동이를 뒤집어 쌓아 올려 탑을 높여간다.</p>
