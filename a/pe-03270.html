<h1>줄넘기와 친해지기</h1>
<p>1) 줄의 가운데 부분을 밟고 섰을 때 줄 끝이 겨드랑이나 가슴까지 오도록 알맞은 줄의 길이를 맞춥니다. 2) 제자리에 서서 한 손에 줄을 잡고 천천히 돌리며 줄이 바닥에 닿는 순간 가볍게 뛰어봅니다. 3) 익숙해지면 손을 바꾸어 보거나 더 빠르게 돌리며 뛰어봅니다. 4) 제자리에 앉아 줄을 한 손에 쥐고 수평으로 돌리면서 다리에 닿지 않게 넘어봅니다.</p>
