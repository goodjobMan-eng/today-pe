<h1>난파선 탈출 협동 게임</h1>
<p>1) 팀원들은 난파선에서 얻은 정해진 도구만을 사용하여 섬에서 섬으로 이동한다. 2) 이동할 때는 도구에서 발을 떼고 지나온 마지막 도구를 주워서 앞으로 옮기며 이동해야 한다. 3) 섬에 도착하여 첫 번째 단서 용지를 찾아 단어 자물쇠 상자를 연다. 4) 상자 안의 장비 단서를 이용해 다음 섬으로 이동하고 비밀번호 자물쇠, 방향 자물쇠를 순서대로 푼 뒤 바닥 훌라후프 안으로 전원이 들어와 마지막 상자를 열면 성공한다.</p>
