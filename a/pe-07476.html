<h1>풋볼 발론 로코 (미친 공 축구)</h1>
<p>1) 경기장 양쪽에 골대를 설치하고 학급을 두 팀으로 나눈다. 2) 축구공 1개, 폼볼 1개, 소프트볼(바람 빠진 공) 1개 등 총 3개의 공을 동시에 사용하여 축구 경기를 진행한다. 3) 양 팀은 세 개의 공 중 어떤 공으로든 상대 팀 골대에 골을 넣어 득점한다. 4) 골을 넣은 선수를 상대 팀 선수와 맞바꾸는 규칙 등을 변형해 적용할 수 있다.</p>
