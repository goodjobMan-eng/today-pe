<h1>골볼 기초 규칙</h1>
<p>1) 코트는 양 팀 에어리어와 중앙의 뉴트럴 에어리어로 나뉘며 아이셰이드를 착용하고 경기한다. 2) 공은 하이볼 라인 앞쪽과 뉴트럴 에어리어에서 각각 최소 한 번 이상 바운드되도록 낮게 굴려야 한다. 3) 공을 잡은 후 10초 이내에 중앙선이나 사이드라인을 넘기는 공격 투구를 완료해야 한다. 4) 공격 투구 동작 중 방해되는 소리를 내거나 반칙을 범하면 9m 너비 골대를 1명이 지키는 페널티 스로가 주어진다.</p>
