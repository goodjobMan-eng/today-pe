<h1>손님 모셔 오기</h1>
<p>1) 학급 전체가 둥글게 둘러앉고 의자 하나를 빈자리로 둔다.2) 음악이 시작되면 빈자리 양옆에 앉은 두 학생이 손을 잡고 다른 친구에게 가 한 명을 데려와 빈자리에 앉힌다.3) 새로 생긴 빈자리의 양옆 친구들이 즉시 손을 잡고 다음 친구를 데려와 앉히는 과정을 반복한다.4) 재생 중인 노래가 끝나는 순간 빈자리 양옆에 서 있거나 앉아 있는 두 학생이 벌칙을 받는다.</p>
