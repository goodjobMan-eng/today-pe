<h1>보자기로 공 넘기기 게임</h1>
<p>1) 바닥에 경기장을 그리고 가운데에 콘을 놓은 뒤 각 모둠 2명씩 짝을 이뤄 보자기를 잡고 입장한다. 2) 짝과 함께 보자기로 공을 튕겨 상대 모둠 지역으로 넘기거나 모둠원끼리 이어준 뒤 넘긴다. 3) 상대 모둠이 공을 받지 못하거나 가운데 콘에 떨어지면 1점을 얻는다. 4) 상대 모둠의 같은 짝이 연속 2회 이상 받거나 5회 이상 이어줄 경우에도 1점을 얻는다.</p>
