<h1>크랩 사커 (Crab Soccer)</h1>
<p>1) 콘 4개로 양 팀의 골대를 설치한다 2) 스위스볼(짐볼) 또는 비치볼 1개를 경기장 중앙에 둔다 3) 모든 선수는 양손과 양발을 바닥에 대고 게처럼 엎드린(뒤집힌 게 걸음) 자세로 경기장을 이동한다 4) 축구처럼 주로 발을 사용하여 큰 공을 차며 상대 팀 골대에 넣는다</p>
