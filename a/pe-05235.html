<h1>에볼루션 (가위바위보 진화 놀이)</h1>
<p>1) 모든 학생은 쪼그려 앉은 알 상태로 시작해 다른 알을 찾아 가위바위보를 한다.2) 이기면 일어서서 날개를 퍼덕이는 닭으로 진화하고, 지면 알 상태를 유지한다(비기면 재대결).3) 닭은 다른 닭과 겨뤄 이기면 팔을 앞으로 뻗은 공룡으로 진화하고, 지면 닭 상태를 유지한다.4) 공룡이 이기면 한 손을 뻗고 전화 통화 동작을 하는 슈퍼히어로가 되며, 슈퍼히어로끼리 대결하여 패배하면 다시 맨 처음 알로 강등된다.</p>
