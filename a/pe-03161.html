<h1>공 들고 이동하기 놀이</h1>
<p>1) 모둠을 나누고 시작 신호와 함께 각 모둠의 첫 번째 친구가 라켓에 공을 들고 이동한다. 2) 중간에 공을 떨어뜨리면 라켓에 다시 올리고 출발한다. 3) 팀원이 삼각콘을 돌아서 출발선으로 도착하면 다음 친구가 공을 이어받아서 출발한다. 4) 맨 마지막 팀원이 먼저 도착하는 모둠이 승리한다.</p>
