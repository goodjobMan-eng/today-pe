<h1>가위바위보 챔피언 기차놀이</h1>
<p>1) 전원이 자유롭게 이동할 수 있도록 활동 공간 전체에 흩어진다. 2) 이동하다가 마주친 상대와 즉시 가위바위보 대결을 펼친다. 3) 패배한 사람은 승리한 사람의 뒤에 붙어 줄을 서고, 선두는 승리할 때마다 기차를 길게 늘려간다. 4) 모둠끼리 마주쳤을 때는 양쪽 선두 리더끼리 대결하여 최종 한 줄 기차가 될 때까지 진행한다.</p>
