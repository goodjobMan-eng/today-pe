<h1>후프 캐슬 명중 게임</h1>
<p>1) 훌라후프 1개를 바닥에 깔고 2개를 비스듬히 세워 안쪽에 넣는 방식으로 후프 캐슬을 쌓는다.2) 1번 주자가 달려가 캐슬을 완성하면, 2번 주자가 투척선에서 공을 던져 캐슬을 맞힌다.3) 공을 던진 후 다음 주자에게 순서를 넘기고 던진 사람은 뒤로 이동한다.4) 팀별로 후프 캐슬을 3번(또는 2번) 먼저 무너뜨리는 팀이 승리한다.</p>
