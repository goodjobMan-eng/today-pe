<h1>플레이스쿠프 야구형경기</h1>
<p>1) 공격수는 하얀색 경기장 안으로 언더핸드로 공을 던진 후 베이스를 돕니다. 2) 주황색 베이스를 돌고 홈베이스를 찍으면 1점을 획득합니다. 3) 수비수가 한 번에 공을 잡으면 아웃이며, 공을 잡아 베이스를 차례로 밟아 공격수보다 먼저 홈에 도착해도 아웃입니다. 4) 3아웃이 되면 공격과 수비를 교대합니다.</p>
