<h1>크로스 줄넘기 공 전달 릴레이</h1>
<p>1) 긴줄 양끝을 돌리는 사람 2명이 마주 서고, 양쪽 진영 콘 뒤에 학생들이 한 줄씩 대기하며 첫 주자가 공을 든다. 2) 줄이 바닥을 칠 때 공을 쥔 양쪽 주자가 마주 보며 동시에 긴줄 안으로 뛰어 들어간다. 3) 두 주자가 줄 안에서 함께 점프를 뛰며 손에서 손으로 부드럽게 공을 건넨다. 4) 공을 건넨 주자는 반대편으로 빠져나가고, 공을 받은 주자도 빠져나가 다음 주자에게 넘기는 방식으로 연속 진행한다.</p>
