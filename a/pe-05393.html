<h1>골대에 공 던지고 잡기</h1>
<p>1) 세 명씩 두 모둠을 이루어 골라인 밖에 섭니다.2) 공격수는 공을 드리블하고 모둠원과 세 번 패스한 뒤 골대에 공을 던집니다.3) 골대의 그물을 맞고 튕긴 공을 수비수가 잡거나 골대의 공이 맞지 않고 밖으로 나가면 공격과 수비가 바뀝니다.4) 골대에 맞고 나온 공을 수비수가 잡지 못하면 공격 모둠은 1점을 획득합니다.5) 정해진 시간 동안 획득한 점수가 가장 많은 모둠이 승리합니다.</p>
