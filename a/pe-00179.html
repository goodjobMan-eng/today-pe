<h1>불 러시(Bull Rush) — 엔드존 돌파 &amp; 허리 조끼 꼬리 뺏기 워밍업</h1>
<p>강당 양 끝에 안전지대(Safe Zone)를 만들고 중앙에 술래(Tippers) 2명을 배치합니다. 술래가 '불 러시(Bull Rush)!'를 외치면 전원이 반대편 안전지대로 전력 질주해 돌파하며, 터치당한 학생은 다음 라운드부터 중앙 술래에 합류합니다. 2라운드에서는 허리에 팀조끼 꼬리를 꽂고 꼬리를 뺏기지 않고 돌파하기로 변형합니다.</p>
