<h1>하이브 디펜스</h1>
<p>1) 콘 구역 밖 외곽 둘레를 돌아 상대 바구니에 공을 던져 점수를 얻는다.2) 자신의 바구니 구역을 지키며 상대의 공격 공을 가로막는다.3) 자신의 구역을 벗어나 외곽을 돌 수 있으나 다른 팀의 내부 구역에는 들어가지 않는다.4) 게임 종료 시 자신의 바구니에 공이 가장 적게 남아 있는 팀이 승리한다.</p>
