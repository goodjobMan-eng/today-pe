<h1>맨손체조 동작으로 림보 통과하기</h1>
<p>1) 막대를 몸 젖히기나 엎드려 몸 낮추기 중 어떤 맨손체조 자세로 통과할지 정한다. 2) 머리나 허리 높이에서 시작하여 단계적으로 막대 높이를 낮춘다. 3) 막대를 통과할 때 동작이 무너지거나 막대를 건드리거나 바닥에 다른 신체 부위가 닿으면 탈락한다. 4) 막대를 모두 통과하면 높이를 조금 낮추어 진행하며 마지막까지 통과한 사람이 가장 많은 모둠이 승리한다.</p>
