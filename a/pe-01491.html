<h1>푸시업 자세 동물 흉내 가위바위보</h1>
<p>1) 두 사람이 마주 보고 엎드려뻗쳐(푸시업/플랭크) 기본자세를 잡는다. 2) 한 손을 바닥에서 떼어 마주 보며 가위바위보를 진행한다. 3) 가위바위보에서 진 사람은 제자리에서 몸을 한 바퀴 회전하거나 곰 걸음, 토끼 점프 등 지정된 벌칙 동작을 수행하고 다시 자세를 잡는다. 4) 가위바위보에서 이긴 사람이 다리 터널을 만들고 진 사람이 그 아래를 기어서 3바퀴 통과하는 동물 터널 통과 미션으로 변형한다.</p>
