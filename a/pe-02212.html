<h1>협동 왕복 달리기</h1>
<p>1) 팀별로 출발선에 라바콘을 세우고, 일정 거리에 1~3번 구역을 라바콘으로 표시한다. 2) 1번 주자는 출발선에서 접시콘을 한 번에 1개씩 들고 달려가 1~3번 구역에 차례대로 내려놓으며 총 3번 왕복한다. 3) 2번 주자는 반대로 1~3번 구역에 놓인 접시콘을 한 번에 1개씩 주워 출발선으로 가져오며 총 3번 왕복한다. 4) 다음 주자들도 번갈아 콘을 놓거나 주워오며 마지막 주자가 들어올 때까지 이어 달린다.</p>
