<h1>파트너 탭 &amp; 그룹형 탭 (Tap! Tap!)</h1>
<p>1) 두 명이 마주보고 가위바위보를 한 뒤, 진 사람은 손바닥을 뒤로 올리고 이긴 사람은 손을 터치한 뒤 반환점을 향해 달린다.2) 진 사람은 터치당하는 즉시 돌아서서 도착 지점 전까지 이긴 사람의 어깨를 터치해야 성공한다.3) 여러 명이 원형으로 콘을 두고 서서 가운데 도전자 1명이 빈 콘을 터치하려 할 때 주변 친구들이 먼저 콘을 터치해 방어한다.</p>
