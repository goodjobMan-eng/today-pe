<h1>술래잡기 놀이 모음</h1>
<p>1) 술래를 1명 정하고 정해진 구역 안에서 다른 참여자들은 술래를 피해 달아납니다. 2) 술래에게 터치된 사람은 술래로 교대하거나 팀조끼를 넘겨받습니다. 3) 잡힌 사람이 손을 잡고 함께 쫓는 손잡기 술래잡기나 깽깽이(외발)로 이동하는 켄켄 술래잡기로 응용할 수 있습니다. 4) 얼음땡(얼음 술래잡기)이나 그물망을 빠져나가는 물고기 게임 등 다양한 규칙을 적용해 진행합니다.</p>
