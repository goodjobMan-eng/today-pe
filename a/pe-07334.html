<h1>거리두기 후프 워밍업 놀이</h1>
<p>1) 바닥에 2m 간격으로 훌라후프를 배치하고 학생들은 후프 사이 구역을 자유롭게 걸어 다닌다. 2) 신호에 맞춰 후프 안으로 두 발로 점프하여 들어가고 후프 사이를 조깅하며 이동한다. 3) 한 발로 후프 안에 들어가기나 스킵, 스텝 등 다양한 기본 움직임 기술을 적용해 진행한다. 4) 공을 추가할 경우 각자 지정된 공을 사용하며 패스 동작을 연계해 움직인다.</p>
