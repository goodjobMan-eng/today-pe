<h1>리액션 패스 게임</h1>
<p>1) 두 사람이 마주 서서 각자 잘 튀는 농구공을 1개씩 손에 들고 거리를 두고 준비한다. 2) 리더 역할을 정하고 동시에 공을 던지되, 리더가 어떤 패스를 보내는지 빠르게 확인한다. 3) 리더가 바운드 패스를 던지면 상대는 노바운드(체스트) 패스를, 리더가 노바운드를 던지면 바운드 패스를 교차해 건넨다. 4) 숙달되면 한 사람이 자기 공을 공중 위로 던져 띄운 사이 리더의 패스를 받아 던져주고, 낙하하는 자기 공을 다시 잡는다.</p>
