<h1>개구리와 마법사 태그 게임</h1>
<p>1) 마법봉을 가진 2명의 마법사는 배구 코트 안에서 술래가 된다.2) 마법사에게 태그된 사람은 아웃되지 않고 개구리로 변한다.3) 개구리가 된 사람은 다리를 벌리고 개구리 점프를 5회 수행한 뒤 다시 게임에 참여한다.4) 얼음 신호가 울리면 마법사는 가장 가까운 개구리에게 마법봉을 넘겨 술래를 교대한다.</p>
