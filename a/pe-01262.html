<h1>단계별 공 저글링 도전</h1>
<p>1) 양손을 편안히 두고 소형 공 1~3개를 준비하며 개인 연습 공간을 확보한다. 2) 1단계로 공 1개를 바깥에서 안쪽으로 포물선을 그리며 던지고 박수를 친 후 받기를 연습한다. 3) 2단계로 공 2개를 양손에 쥐고 번갈아 던져 교차해 잡거나 한 손으로 연속 받아내며 성공 횟수를 늘린다. 4) 숙달되면 3단계로 공 3개를 연속으로 공중에 띄우는 기본 3구 저글링 궤적에 도전한다.</p>
