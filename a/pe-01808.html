<h1>어드벤처 빙고 러닝</h1>
<p>1) 학생들은 빙고 학습지와 마커를 받고 중앙 사각형 안에 모여 대기한다. 2) 음악이 시작되면 친구에게 다가가 빙고 칸 속 모험 활동 경험을 질문한다(1인당 1개 질문). 3) 상대가 해본 적이 있다고 답하면 칸에 이니셜 서명을 받고, 체육관 콘을 터치한 뒤 조깅 한 바퀴를 돌고 복귀한다. 4) 한 사람에게는 한 번만 서명받을 수 있으며, 제한 시간 동안 가로·세로·대각선 4줄 또는 6줄 빙고를 먼저 완성한다.</p>
