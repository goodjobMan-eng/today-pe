<h1>원마커 짐볼 피구</h1>
<p>1) 직사각형 또는 원형 경기장을 그리고 외야에 일정한 간격으로 공격수 인원만큼 원마커를 놓는다. 2) 공격 팀원은 원마커마다 한 명씩 올라가 활동하고 외야에서 짐볼을 굴리거나 던져 경기장 안의 친구를 맞힌다. 3) 공격수는 원마커에 한 발을 넣은 채 활동하며 공에 맞은 수비수는 아웃되어 지정된 장소로 이동한다. 4) 제한 시간이 끝나면 경기장 안에 살아남은 수비수의 숫자를 세어 많은 팀이 승리한다.</p>
