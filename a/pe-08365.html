<h1>콘을 활용한 축구 스텝 및 페이크 돌파·슈팅 훈련</h1>
<p>1) 바닥에 콘 2개를 두고 콘 사이에서 빠른 제자리 스텝과 한 발 균형 잡기를 연습한다. 2) 콘 사이에 공을 두고 헛다리나 페이크 모션을 취한 뒤 측면으로 빠르게 드리블하여 치고 나간다. 3) 페이크 동작 후 골대를 향해 이어서 슈팅을 시도한다. 4) 수비수를 앞에 두고 페이크 동작으로 수비를 제친 뒤 골문으로 슈팅한다.</p>
