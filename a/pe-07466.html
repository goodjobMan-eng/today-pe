<h1>육상 높이뛰기 스트래들 자세</h1>
<p>1) 주 발의 반대편 방향에서 높이뛰기 매트를 향해 사선으로 도움닫기해 달려온다. 2) 발구르기 발로 바닥을 강하게 차올리며 반대쪽 다리를 바 위로 먼저 넘긴다. 3) 몸의 중심과 복부를 바 아래로 회전시키면서 바를 건드리지 않고 배가 바를 향하도록 넘는다. 4) 두꺼운 안전 매트 위로 어깨와 등 쪽을 안전하게 감싸며 착지한다.</p>
