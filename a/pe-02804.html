<h1>풍선 비행기 착륙 놀이</h1>
<p>1) 손으로 높이 띄우거나 발을 이용해 풍선을 위로 띄운다. 2) 풍선이 바닥에 떨어지기 전에 깔때기를 이용해 안전하게 착륙시킨다. 3) 정해진 시간 동안 얼마나 많이 안전하게 착륙시키는지 도전하거나, 풍선 여러 개를 띄워 바닥에 닿기 전에 최대한 많이 착륙시킨다. 4) 공중에서 깔때기로 받은 상태에서 다시 띄워 연속으로 받으면 추가 점수(2배, 3배)를 얻는 방식으로 응용한다.</p>
