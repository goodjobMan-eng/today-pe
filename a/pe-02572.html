<h1>전신 대근육 코어 트레이닝 7종</h1>
<p>1) 엎드려 팔꿈치를 대고 몸을 일직선으로 유지하는 플랭크 자세를 취한다. 2) 등을 대고 누워 엉덩이를 들어 올리는 브릿지 상태에서 한쪽 다리를 들어 올린다. 3) 팔꿈치로 엎드린 상태에서 한 팔씩 앞으로 뻗는다. 4) 옆으로 누워 팔꿈치로 버티기, 손 들기, 다리 들기 동작을 순서대로 실시한 후 뒤로 팔꿈치를 대고 엉덩이를 들어 버틴다.</p>
