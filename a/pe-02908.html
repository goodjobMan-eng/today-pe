<h1>탁구공 캐치 놀이</h1>
<p>1) 콘을 바닥에 세워 탁구공을 받을 구역을 만들고 차례대로 들어선다. 2) 약 1초 간격으로 바닥에 튀겨서 오는 탁구공을 컵(캐치 도구)으로 받아낸다. 3) 미리 정한 숫자만큼 튀겨서 보낸 탁구공 중 받아낸 공의 개수만큼 득점한다. 4) 더 높은 점수를 획득한 사람 또는 팀이 승리한다.</p>
