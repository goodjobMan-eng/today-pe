<h1>화산과 빙하 게임 (Le jeu du volcan et du glacier)</h1>
<p>1) 경기장에 라바콘 10개 중 5개는 똑바로 세워 화산으로 두고, 5개는 거꾸로 놓아 빙하로 설정합니다. 2) 빙하 팀과 화산 팀으로 나뉘어 4~5분 동안 화산 팀은 거꾸로 된 콘을 바로 세우고, 빙하 팀은 바로 선 콘을 뒤집습니다. 3) 제한 시간이 지난 뒤 자신의 팀 방향으로 더 많은 콘을 만든 팀이 승리합니다.</p>
