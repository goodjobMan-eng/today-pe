<h1>81회 드리블로 세계 일주 (Around the World in 81 Dribbles)</h1>
<p>1) 짝과 함께 후프에 서서 한 명은 후프 안에서 공을 잡고, 다른 한 명은 후프 밖 세 걸음 거리에 선다.2) 후프 안의 학생이 공을 9번 드리블한 뒤 바운스 패스나 체스트 패스로 밖의 파트너에게 전달한다.3) 파트너는 주 손으로 후프 주변을 돌며 9번 드리블한 뒤 공을 후프에 두고 다음 후프로 이동하여 회전한다.</p>
