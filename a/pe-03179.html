<h1>제자리에서 멀리뛰기</h1>
<p>1) 발구름판 위에 두 발을 놓고 앞을 보고 선다. 2) 무릎을 구부려 자세를 낮추고 팔을 뒤로 젖혔다가 앞으로 쭉 뻗으며 동시에 두 발로 힘차게 발을 구른다. 3) 힘껏 뛰어올라 팔을 위로 들어 올리며 허리를 젖힌다. 4) 팔과 다리를 앞으로 뻗고 몸을 웅크리며 무릎을 굽혀 착지한다.</p>
