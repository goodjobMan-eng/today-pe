<h1>앞구르기 단계별 스테이션 연습</h1>
<p>1) 기본 앞구르기 시 시선은 손을 향하고 턱을 가슴으로 당기며 뒷머리가 매트에 닿게 구른다 2) 구르기 직후 앞으로 던져진 공을 잡으며 손을 짚지 않고 일어나는 연습을 한다 3) 경사면 매트를 활용해 추진력을 얻어 쉽게 구르는 연습을 한다 4) 벤치 위에서 무릎 꿇고 뒷머리 닿는 위치를 익히거나 다리 사이에 공을 끼우고 떨어뜨리지 않으며 구르는 연습을 한다</p>
