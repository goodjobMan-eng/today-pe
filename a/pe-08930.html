<h1>농구 원핸드 슛 자세 연습</h1>
<p>1) 양 발을 어깨 넓이로 벌리고 오른발을 살짝 앞으로 놓아 준비 자세를 만듭니다. 2) 무릎을 굽히고 공을 가슴 앞에 잡은 뒤 손목을 뒤로 젖힙니다. 3) 무릎과 팔꿈치를 동시에 펴면서 손목 스냅을 이용해 슛을 던집니다. 4) 골대 가까운 거리에서 점프 없이 폼 연습을 한 뒤 익숙해지면 거리를 넓히고 점프를 활용합니다.</p>
