<h1>깽깽이 부활 꼬리 잡기</h1>
<p>1) 직사각형 경기장에 접시콘으로 구역을 표시하고 모든 학생이 허리 뒤에 팀조끼 꼬리를 착용한다.2) 교사의 휘슬 소리에 경기가 시작되면 구역 안에서 돌아다니며 상대방의 꼬리를 뽑으러 다닌다.3) 꼬리를 뺏겨 탈락한 사람은 깽깽이(한 발 뛰기) 상태로 경기장 안을 이동하며 다른 사람의 꼬리를 노린다.4) 깽깽이 상태에서 다른 사람의 팀조끼 꼬리를 빼앗는 데 성공하면 다시 두 발로 부활하여 경기에 참여한다.</p>
