<h1>3분 안에 배우는 줄넘기 기술 4가지</h1>
<p>1) 발에 줄넘기 V자를 걸고 한쪽 발을 뒤에서 앞으로 가져온 뒤 뒤로 감고 밟은 발을 빼면서 다시 V자를 만든다 2) 앞 기술에 이어 발을 밟은 쪽 손으로 고리를 넘겨 반대쪽으로 한 번 더 넘긴 뒤 발을 빼고 만세하여 푼다 3) 손잡이를 아래로 내리고 옆에 붙인 채 줄을 앞으로 튀어 오르게 만든 뒤 손잡이를 찔러 넣는다 4) 한 손만 집어넣어 줄을 던져 잡고 뒤쪽 손잡이를 앞으로 빼낸다</p>
