<h1>콘 탑 세우기</h1>
<p>1) 라바콘을 던질 위치와 탑을 세울 위치를 정한 후 팀별로 한 줄로 섭니다. 2) 차례대로 라바콘을 던져 기준 라바콘에 씌워 콘 탑을 세웁니다. 3) 실패하면 자신이 던진 라바콘을 원래 위치에 정리하고 반대편 벽을 터치한 후 맨 뒤에 서며, 성공하면 바로 맨 뒤에 가서 다시 도전합니다. 4) 라바콘을 먼저 모두 쌓은 팀이나 정해진 시간 동안 더 많이 쌓은 팀이 승리합니다.</p>
