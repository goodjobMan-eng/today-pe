<h1>4개 스테이션 순환 뛰기 활동</h1>
<p>1) 도며 뛰기, 위로 뛰기, 제자리 뛰기, 달려와 뛰기 4개 구역(파란색, 주황색, 연두색, 노란색)으로 나뉩니다.2) 각 구역에서 2명 또는 3명이 짝을 이루어 한 명씩 번갈아 뛰기를 시도합니다.3) 뛰지 않는 친구는 상대의 동작을 관찰하고 잘한 점과 고칠 점을 조언해 줍니다.4) 신호가 울리면 다음 색상 구역으로 순환 이동하여 다른 뛰기 동작을 탐구합니다.</p>
