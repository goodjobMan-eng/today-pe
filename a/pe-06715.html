<h1>어린이 체력 증진 지구력 트레이닝</h1>
<p>1) 펜듈럼 스윙, 사이드 런지, 토르소 찹 각 30초 스트레칭으로 몸을 푼다. 2) 업다운 점프, 동서남북 홉, 시저 잭스, 스텝백 런지, 스킵 셔플, 제자리 달리기 순으로 각 운동을 30초간 수행하고 사이마다 15초씩 휴식한다. 3) 모든 세트 완료 후 2분간 휴식하고 전체 루틴을 한 번 더 반복한다. 4) 종아리 런지, 사이드 런지 유지, 삼두근 스트레칭을 각 15초간 실시하여 정리운동을 마친다.</p>
