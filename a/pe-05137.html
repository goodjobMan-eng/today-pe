<p>1) 학생들은 정해진 개인 구역에 위치한다.2) 교사가 제시한 주제(폭포, 정글, 피라미드, 바이킹 등)를 확인한다.3) 높고 낮은 동작, 빠르고 느린 동작, 다양한 감정(흥분, 의심, 슬픔, 분노), 열린 동작과 닫힌 동작을 포함하여 자신만의 춤을 만든다.</p>
