<h1>운동 기능 트레이닝 코스 (장애물 슬라럼 코스)</h1>
<p>1) 출발선에서 소리 신호(구령 또는 호루라기)에 반응하여 출발한다. 2) 좌우 콘 사이를 지그재그로 통과하며 방향 전환 및 이동 운동을 수행한다. 3) 콘 주위를 회전한 후 변형 슬라럼 구간을 지나 마지막 구간에서 가속하여 동료에게 돌아온다.</p>
