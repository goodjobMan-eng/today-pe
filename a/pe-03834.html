<h1>왕복 오래달리기 및 팔굽혀펴기·윗몸일으키기 구령 연습</h1>
<p>1) 시작 신호에 맞춰 왕복 달리기 출발선에 선다. 2) 신호음이 울릴 때마다 직선으로 1회 완복 달리기를 완료하며 속도는 1분마다 빨라진다. 3) 푸시업 신호(down, up)에 맞춰 팔굽혀펴기를 수행한다. 4) 컬업 신호(up, down)에 맞춰 윗몸일으키기를 수행한다.</p>
