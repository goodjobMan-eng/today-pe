<h1>같은 색깔 빨리 찾아 맞히기 2탄 (폭신 주사위 공 팀 게임)</h1>
<p>1) 폭신 주사위 공을 경기장에 색깔별로 골고루 퍼뜨려 놓는다.2) 심판이 스캐터볼을 던진 후 공이 멈추면 각 팀의 대표가 위를 향한 색깔을 확인하고 팀원에게 알린다.3) 해당 색깔의 폭신 주사위 공을 찾아 팀원 전원이 패스를 주고받으며 스캐터볼 근처로 이동한다.4) 마지막으로 공을 받은 팀원이 스캐터볼을 던져 맞히고 전원 자리에 앉는다.</p>
