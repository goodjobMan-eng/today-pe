<h1>키킹 캠프 필드골 킥 스테이션</h1>
<p>1) 공 보관함에서 원하는 종류와 크기의 풋볼 또는 공을 선택한다. 2) 납작한 접시콘 위에 공을 거치대(티)처럼 올려놓는다. 3) 노란색 테이프로 만든 골대 기둥 사이를 향해 공을 차 넣어 통과하면 3점을 얻는다. 4) 공을 낮게 차서 벽면 초록 매트를 맞히는 스퀴브 킥에 성공하면 1점을 얻는다.</p>
