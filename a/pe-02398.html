<h1>세워진 배드민턴 라켓 통과 셔틀콕 던지기</h1>
<p>1) 바닥에 배드민턴 라켓 여러 개를 손잡이를 위로 하거나 바닥 지지대에 세워 일렬로 배치한다. 2) 학생들은 라켓 맞은편 던지는 선 뒤에 무릎을 꿇거나 앉아 대기한다. 3) 엄지손가락이 아래로 향하는 손목 스냅을 의식하며 세워진 라켓 프레임 구멍 사이로 셔틀콕을 던져 통과시킨다. 4) 던진 셔틀콕을 모두 회수하여 모둠별로 바구니에 정리하고 반복한다.</p>
