<h1>바른 자세 의자 스트레칭 &amp; 홈트</h1>
<p>1) 의자에 바르게 앉아 턱을 당기고 허리를 편 기본 준비 자세를 취한다. 2) 상체 비틀기, 의자 잡고 엉덩이 들기, 다리 교대 들어올리기 등 부위별 운동을 순서대로 진행한다. 3) 교사의 구령에 맞추어 정해진 초 동안 버티거나 횟수를 성공적으로 채우며 근지구력을 기른다. 4) 팔 힘으로 의자를 밀어 올리는 버티기 시간을 늘리거나 다리를 동시에 들어 올리는 고난도 동작으로 변형한다.</p>
