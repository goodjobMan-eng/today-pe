<h1>와이프아웃 전신 브레인 브레이크 댄스</h1>
<p>1) 제자리에서 팔 흔들기, 매시드 포테이토, 스키 점프 동작의 순서를 익히며 준비한다. 2) 와이프아웃 음악에 맞춰 수영 스트로크, 백스트로크, 딥 스쿼트, 제자리 전력 질주를 차례대로 이어간다. 3) 서핑 자세로 균형을 잡으며 파도를 타는 모션으로 전신 협응력을 기른다. 4) 모든 루틴을 마친 뒤에는 양손을 모아 올리는 복식호흡(Centered Breath)으로 숨을 가다듬으며 정리한다.</p>
