<h1>되돌려 뛰기 줄넘기</h1>
<p>1) 줄넘기 줄을 넘지 않고 몸의 양옆 바닥으로 가볍게 치며 리듬을 잡습니다. 2) 한쪽 손으로 바닥을 친 뒤 그 손을 등 뒤로 돌려 반대편으로 넘깁니다. 3) 다른 쪽 손은 머리 위로 들어 올려 내리치며 반대쪽 바닥을 칩니다. 4) 스텝을 좌우로 경쾌하게 밟으면서 연속으로 줄을 교차하여 돌려 줍니다.</p>
