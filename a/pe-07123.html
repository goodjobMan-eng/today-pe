<h1>풍선 활용 놀이 (풍선 미사일·리프팅·다 함께 바운스)</h1>
<p>1) 풍선에 공기를 넣고 10초간 불어 손을 놓아 가장 멀리 날아간 사람을 가린다(풍선 미사일). 2) 머리, 어깨, 무릎, 발 등 지정된 신체 부위로만 풍선을 쳐서 공중에 오래 띄운다(풍선 리프팅). 3) 전원이 손을 잡고 원을 만든 뒤 손을 놓지 않고 풍선이 바닥에 떨어지지 않게 띄운다(다 함께 바운스).</p>
