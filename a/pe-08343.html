<h1>4열 로테이션 농구 패스 드릴</h1>
<p>1) 코트의 네 위치에 선수가 나뉘어 서고, 공을 가진 선수가 중앙으로 드리블 돌파한다. 2) 돌파 후 코너로 패스한 뒤 자신이 패스한 위치(다음 줄)로 이동한다. 3) 코너에서 공을 잡은 선수는 윙으로 패스하고, 연속해서 다음 선수가 돌파와 패스 로테이션을 이어간다.</p>
