<h1>노래 박자 맞춤 고무밴드 리듬 스텝</h1>
<p>1) 4인 1모둠을 구성하여 두 명은 고무밴드를 양 발목에 걸어 지탱하고 두 명은 밴드 사이에서 준비한다. 2) 노래 선율에 맞춰 점퍼 두 명이 동시에 안으로 뛰기, 밖으로 벌려 뛰기, 교차하기 스텝을 박자감 있게 진행한다. 3) 곡이 끝날 때까지 밴드에 걸리지 않고 호흡을 맞춰 연속 리듬 스텝 동작을 완성하면 성공한다. 4) 스텝 종류를 다양화하거나 점퍼가 회전하며 자리를 바꾸는 응용 동작으로 난이도를 변경한다.</p>
