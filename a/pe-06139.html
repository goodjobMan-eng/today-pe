<h1>마주보고 공 던지고 받기 활동</h1>
<p>1) 두 명씩 짝을 지어 원마커를 하나씩 갖고 공은 두 명이 한 개만 갖는다.2) 다섯 걸음 떨어진 곳에 마주 본 후 그 자리에 원마커를 놓는다.3) 공 주고받기를 네 번 성공하면 원마커를 뒤로 한 걸음씩 옮겨 단계를 올린다.4) 중간에 공을 받지 못하면 처음부터 다시 개수를 세며 정해진 시간 동안 가장 멀리까지 주고받은 모둠을 겨룬다.</p>
