<h1>발렌타인 릴레이</h1>
<p>1) 학생들은 3명씩 모둠을 구성하여 출발선 폴리스팟 뒤에 일렬로 선다. 2) 체육관 반대편 벽을 따라 9개의 바구니가 놓여 있고 바구니마다 10~15개의 플라스틱 하트가 들어 있다. 3) 신호가 울리면 각 모둠의 첫 번째 주자부터 차례대로 달려가 하트 1개를 가지고 돌아와 폴리스팟 위에 놓는다. 4) 달리기 동작 대신 스킵이나 갤럽 등 다양한 이동 운동으로 바꾸어 진행할 수 있다.</p>
