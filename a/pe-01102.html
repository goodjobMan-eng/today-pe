<h1>한 손 2구 저글링 도전</h1>
<p>1) 학생마다 콩주머니(또는 저글링볼) 2개를 손에 쥐고 편안한 기마 자세로 준비한다. 2) 한 손에 볼 2개를 쥐고 첫 번째 볼을 수직으로 띄운 뒤 정점에 도달했을 때 두 번째 볼을 옆으로 가볍게 띄운다. 3) 떨어지는 첫 번째 볼을 같은 손으로 잡고 연속해서 두 번째 볼을 받아내며 1-2 리듬을 세어 성공 횟수를 늘린다. 4) 주 손으로 익숙해지면 반대 손으로 도전하거나 연속 성공 횟수 기록 대결로 변형하여 진행한다.</p>
