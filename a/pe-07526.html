<h1>뜀틀 다리벌려뛰기 단계별 연습</h1>
<p>1) 네발 걷기 운동을 다양한 방향으로 실시하여 팔과 어깨 지지력을 기르고 몸을 푼다. 2) 뜀틀 매트와 폼 블록(스펀지 블록)을 활용해 난이도가 점진적으로 높아지는 스테이션을 설치한다. 3) 뜀틀 옆에 폼 블록을 배치해 안전하게 다리를 벌리는 연습을 진행한다. 4) 자신의 속도에 맞춰 점차 높이를 높여가며 최종적으로 뜀틀에서 다리벌려뛰기를 완성한다.</p>
