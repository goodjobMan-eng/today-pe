<h1>줄넘기 기본 자세 알아보기</h1>
<p>1) 줄을 잡을 때는 손잡이 끝부분을 잡고 엄지손가락으로 손잡이를 바르게 감싸 쥔다.2) 돌릴 때는 처음에는 팔을 쓰더라도 이후에는 양 팔꿈치를 몸통 가까이에 붙이고 손목 회전을 이용한다.3) 뛸 때는 뒤꿈치를 가볍게 든 상태에서 앞꿈치로 1~1.5cm 정도만 가볍게 튀어 오르며 뛴다.</p>
