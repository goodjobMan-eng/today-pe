<h1>한 칸씩 이동</h1>
<p>1) 여섯 명이 한 모둠을 이루고 두 모둠이 경기를 진행하며, 한 칸에 두 명씩 모둠별로 번갈아 들어간다. 2) 공은 같은 칸에 있는 모둠원이나 다음다음 칸에 있는 모둠원에게 보낼 수 있다. 3) 경기장 끝 칸에 있는 모둠원에게 공을 이어주면 1점을 얻는다. 4) 공을 빼앗기거나 점수를 얻으면 공격과 수비가 바뀌며, 정해진 시간 동안 가장 많은 점수를 얻은 모둠이 이긴다.</p>
