<h1>두 줄을 피해 넘고 넘어라</h1>
<p>1) 사각형 안에 자유롭게 섭니다. 2) 사각형 밖 4명의 친구들이 짝을 지어 각각 가슴 높이와 무릎 높이로 줄을 잡고 십자 모양이 되게 섭니다. 3) 신호가 울리면 같은 높이로 줄을 유지하며 사각형의 다른 쪽 끝으로 움직입니다. 4) 사각형 안 친구들은 몸을 굽히거나 뛰어 줄을 피해 이동하고 줄에 걸리면 밖으로 나갑니다.</p>
