<h1>앉아서 풀어주는 거북목·어깨 의자 스트레칭</h1>
<p>1) 학생들은 교실 의자에 허리를 펴고 바르게 앉아 호흡을 가다듬으며 준비합니다. 2) 안내 화면에 맞춰 깍지 껴 팔 앞으로 뻗기, 머리 위 뻗기, 목 옆·앞·뒤 늘리기, 어깨 돌리기, 허리 옆선 늘리기 동작을 순서대로 진행합니다. 3) 올바른 자세를 유지하며 뻐근한 부위가 시원해지는 이완 자극에 집중합니다. 4) 수업 시작 전 정적 스트레칭으로 쓰거나 공부 중간 피로 회복용 자투리 체조로 활용합니다.</p>
