<h1>이동식 매트 브렌발 (프라이마텐 브렌발)</h1>
<p>1) 공격팀 1명이 필드로 소프트볼을 던지면, 4인 주자 팀이 체조 매트 1장을 함께 들고 코스를 따라 달린다. 2) 수비팀은 패스로만 공을 연결하여 목표 상자(뜀틀 상자) 안으로 소프트볼을 재빨리 집어넣어야 한다. 3) 주자 팀은 공이 상자에 들어가기 전에 매트를 바닥에 내려놓고 4명 모두 그 위에 올라타 세이프되어야 하며, 최종 홈 라인을 통과한 인원수만큼 득점한다.</p>
