<h1>감염기차</h1>
<p>1) 학생들은 의자를 책상 안으로 집어넣고 교실 뒤편이나 복도로 이동해 대기합니다. 2) 뽑힌 술래 1명이 교실 앞쪽으로 나오고, 시작 신호와 함께 빠른 걸음으로 도망가는 친구들을 터치합니다. 3) 술래에게 터치당한 학생은 술래 뒤에 어깨를 잡고 붙어 기차를 만듭니다. 4) 기차의 인원이 4명이 되면 2명씩 2개의 기차로 갈라져 각각 다른 친구들을 터치하러 다니고, 계속 4명이 될 때마다 2명씩 갈라지며 마지막 남은 1명까지 모두 잡히면 게임이 끝납니다.</p>
