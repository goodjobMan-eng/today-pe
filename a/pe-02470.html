<h1>플라잉디스크 패스 및 피벗 기술 익히기</h1>
<p>1) 짝과 마주 서서 백핸드로 1:1 패스를 주고받고 익숙해지면 디스크 2개로 연속 패스를 연습한다. 2) 3명이 삼각형 대형을 이루어 백핸드 패스를 순환하며 2개의 디스크로 확장한다. 3) 파트너가 전속력으로 달릴 때 선수의 이동 공간 앞쪽으로 런닝 패스를 띄워 캐치하도록 한다. 4) 수비수를 마주했을 때 한 발을 축으로 피벗하며 백핸드와 포핸드 그립을 빠르게 전환해 수비를 피해 패스한다.</p>
