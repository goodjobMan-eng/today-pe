<h1>고양이와 쥐 꼬리잡기 놀이</h1>
<p>1) 학급에서 2명의 학습자를 고양이(술래)로 선정하고 나머지는 쥐가 된다. 2) 쥐 역할을 맡은 학생들은 바지 뒷부분에 색깔 꼬리끈을 착용한다. 3) 쥐들이 도망치면 고양이는 쥐를 쫓아가 꼬리끈을 뽑아 모은다. 4) 놀이가 끝난 후 뽑은 꼬리끈 개수를 세어 가장 많은 꼬리를 모은 고양이가 승리한다.</p>
