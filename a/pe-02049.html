<h1>파트너 패스</h1>
<p>1) 1m 거리를 두고 의자에 앉아 파트너와 마주 본다. 2) 짝과 마주 본 상태에서 공을 4번 주고받는다. 3) 성공 시 한 걸음씩 의자를 가지고 뒤로 가 거리를 벌린다. 4) 높이 던지기, 굴리기, 튕기며 던지기 등 다양한 방법으로 공을 주고받는다.</p>
