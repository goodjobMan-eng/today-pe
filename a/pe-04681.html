<h1>짝과 함께하는 언더핸드 서브 연습</h1>
<p>1) 짝과 마주 보고 서서 언더핸드 서브를 연습한다. 2) 상대가 서브한 공을 잡으면 2점을 얻는다. 3) 잡지 못하고 공을 건드리기만 하면 1점을 얻는다. 4) 공을 전혀 건드리지 못하면 0점을 얻으며, 짝과 함께 점수를 기록한다.</p>
