<h1>핫도그 술래</h1>
<p>1) 술래가 도망가는 친구들을 쫓아가며 손으로 태그한다.2) 술래에게 태그된 사람은 자리에 앉아 팔을 모아 핫도그 모양을 만들며 멈춘다.3) 다른 도망자가 다가와 케첩을 뿌리는 시늉을 하며 '케첩'이라고 소리치면 살아나고 '고마워'라고 인사한 뒤 다시 도망친다.</p>
