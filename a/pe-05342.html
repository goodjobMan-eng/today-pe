<h1>매스 패스</h1>
<p>1) 던지는 사람은 지정된 선 뒤에서 색깔 공을 바닥에 한 번 튕겨 같은 색깔 바구니에 넣는다.2) 외야수는 굴러나온 공을 잡아 던지는 사람에게 빠르게 굴려 보낸다.3) 다른 색깔 바구니에 공이 들어가면 해당 바구니의 공을 모두 비운다.4) 90초 동안 더 먼 거리 바구니에 넣어 더 높은 점수를 획득한다.</p>
