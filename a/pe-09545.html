<h1>여우야 여우야 무엇 하니?</h1>
<p>1) 한 명이 폭스가 되어 매트에 엎드려 잠자는 척한다. 2) 다른 아이들은 빨간 선에서 출발해 폭스에게 다가간다. 3) 폭스가 눈을 뜨면 아이들은 잡히지 않게 출발선으로 도망간다.</p>
