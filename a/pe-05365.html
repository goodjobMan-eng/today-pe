<h1>브룸볼 기초 기술 연습과 미니 게임</h1>
<p>1) 무릎을 굽히고 등을 편 자세로 양손 간격을 벌려 스틱을 잡고 공을 좌우로 스틱 핸들링한다.2) 삽으로 퍼올리듯 공 밑을 떠올려 벽이나 상대 머리 위로 플립 패스하는 연습을 한다.3) 날아오는 공을 멈춰 세워 제어한 뒤 목표물을 향해 팔로스루하며 패스하거나 슬랩 패스로 골대에 슛을 쏜다.4) 3대 3으로 팀을 나누어 의사소통하며 패스와 슛을 활용한 브룸볼 경기를 진행한다.</p>
