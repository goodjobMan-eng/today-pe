<h1>테니스 라켓과 하키 공 다루기 챌린지</h1>
<p>1) 한 손으로 테니스 라켓을 잡고 공이 바닥에 떨어지지 않게 공중으로 가볍게 튕긴다.2) 공을 튕길 때마다 라켓을 뒤집어 앞뒷면을 번갈아 가며 공을 친다.3) 하키 스틱을 양손으로 잡고 자세를 낮춰 공을 스틱 가까이에 두고 원, 삼각형, 사각형 모양으로 드리블한다.4) 하키 스틱으로 짧은 터치를 활용해 앞뒤, 좌우로 공을 다루는 연습을 한다.</p>
