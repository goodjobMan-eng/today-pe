<h1>엔드존 트래퍼스</h1>
<p>1) 체육관을 둘로 나누고 양쪽 끝에 원마커나 콘으로 엔드존(감옥)을 만든 뒤 두 팀으로 나뉜다. 2) 바닥으로 콩주머니를 미끄러뜨려 상대 팀 선수의 발을 맞히면 맞은 선수는 상대 진영 엔드존으로 이동한다. 3) 엔드존에 갇힌 선수는 자기 팀 선수가 던진 미식축구공을 엔드존 안에서 받으면 구출되어 복귀한다. 4) 엔드존에 사람이 너무 많으면 '탈옥(jailbreak)'을 외쳐 모두 복귀시킬 수 있다.</p>
