<h1>표적 투구 뉴스포츠 보치아</h1>
<p>1) 코트 경기선 뒤에 서서 각자 빨간색 또는 파란색 보치아 공 6개씩을 나누어 갖는다. 2) 선공이 흰색 표적구를 먼저 던져 필드에 배치한 후 자신의 공을 표적구 가까이에 투구한다. 3) 표적구로부터 상대방 공보다 멀리 위치한 팀이 계속해서 다음 투구를 이어간다. 4) 양 팀 공 12개를 모두 투구한 후, 표적구에 가장 가까운 공을 가진 팀이 상대의 가장 가까운 공보다 더 안쪽에 위치한 자기 공의 개수만큼 득점한다.</p>
