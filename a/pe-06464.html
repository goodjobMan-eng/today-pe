<h1>실내 야구 기본 캐치볼 및 투구 연습</h1>
<p>1) 양발을 어깨너비로 벌리고 기마자세를 취해 가슴 앞에서 글러브로 공을 받는 기본자세를 익힌다. 2) 투구 방향을 바라보고 다리를 90도로 들어 올린 후 팔을 뻗어 손목을 꺾으며 공을 던진다. 3) 2인 1조로 마주 보고 서서 살짝 가볍게 공을 던져 글러브로 캐치볼을 연습한다.</p>
