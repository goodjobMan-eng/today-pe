<h1>타바타 전신 운동 동작 익히기</h1>
<p>1) 매트를 깔고 층간소음 방지 및 안전 공간을 확보하여 선다. 2) 스쿼트, 플랭크, 점프 동작을 결합한 버피 테스트의 바른 동작과 허리 보호 요령을 익힌다. 3) 푸시업 자세에서 상체를 고정하고 다리를 번갈아 가슴 쪽으로 당기는 마운틴 클라이머를 익힌다. 4) 팔과 다리를 경쾌하게 벌렸다 모으며 점프하는 점핑 잭 동작을 단계별로 수행한다.</p>
