<h1>점프 마리오네트 코디네이션</h1>
<p>1) 제자리에서 점프하며 양손과 양발을 정해진 규칙에 따라 움직이는 협응 운동을 준비합니다. 2) 1단계: 손과 발을 모두 모으기(구)와 벌리기(파)로 같은 타이밍에 맞추어 점프합니다. 3) 2단계: 손은 모으고 발은 벌리거나, 반대로 손은 벌리고 발은 모으는 엇갈림 점프에 도전합니다. 4) 3단계: 한 손은 모으고 다른 손은 벌리는 등 손과 발의 조합을 다양하게 바꾸어 신체 조절 능력을 기릅니다.</p>
