<h1>요리조리 피해 달려 득점하기</h1>
<p>1) 후프, 폼볼, 모둠 조끼를 준비하고 두 모둠을 이루어 각자 위치에 선다. 2) 공을 가진 모둠은 공을 던지고 잡으며 이동하여 후프 안에 위치한 모둠원에게 공을 연결한다. 3) 후프 안의 모둠원이 공을 잡으면 1점을 획득한다. 4) 공이 바닥에 떨어지거나 상대가 가로채거나 경기장 밖으로 나가면 공격권이 넘어가며, 정해진 시간 동안 점수가 많은 모둠이 승리한다.</p>
