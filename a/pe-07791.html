<h1>굴리기와 튀기기 공 넣기</h1>
<p>1) 중앙에 바구니(버킷)를 두고 그 주변에 원을 만들어 바운서(botadores)를 배치하며, 롤러(rodadores)는 경기장 전체에 흩어진다. 2) 롤러는 바닥에 흩어진 테니스공을 주워 제자리에서 원 주변의 바운서에게 바닥으로 굴려 전달한다. 3) 바운서는 전달받은 공을 잡아 바닥에 한 번 튕겨 중앙 바구니 안에 넣는다. 4) 모든 공을 바구니에 다 넣으면 서로 역할을 바꾼다.</p>
