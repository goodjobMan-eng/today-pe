<h1>슬라이드 슬링 세이브</h1>
<p>1) 중앙선 양쪽에 팀이 나뉘고 각 팀 진영 후방에 콘 5개로 감옥(엔드존)을 설치한다. 2) 바닥에 콩주머니와 소프트볼을 두고, 학생들은 중앙선을 넘지 않고 콩주머니를 바닥으로 미끄러뜨려 상대 발을 맞힌다. 3) 콩주머니에 발을 맞은 선수는 상대 진영 뒤쪽 감옥으로 이동한다. 4) 자기 팀원이 소프트볼을 던져주고 감옥의 선수가 떨어뜨리지 않고 잡으면 게임에 복귀하며, 상대 팀 전원을 감옥에 보내면 승리한다.</p>
