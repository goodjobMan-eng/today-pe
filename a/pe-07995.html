<h1>줄넘기 연습 방법 3선</h1>
<p>1) 양발로 줄을 밟고 가슴이나 겨드랑이 높이로 줄 길이를 맞춘다. 2) 콘이나 마커를 바닥에 두고 줄을 뒤에서 앞으로 넘겨 잡은 뒤 점프하는 '오야마 캐치'를 연습한다. 3) 1회 회전 점프를 점점 빠르게 연결하여 10초 안에 연속 5회 뛰기에 도전한다. 4) 줄을 앞으로 돌리며 자연스럽게 달리는 달리기 뛰기를 연습한다.</p>
