<h1>미니농구 드리블 놀이 3가지</h1>
<p>1) 중앙선에 두 모둠으로 마주 서서 호명된 모둠이 상대 모둠원을 끝선 전에 터치하는 드리블 흑백 게임을 한다. 2) 술래 3명을 제외하고 전원 드리블하며, 술래에게 공을 빼앗기면 역할을 교대하는 공 뺏기 게임을 한다. 3) 양 끝선에서 출발해 중앙의 공을 드리블해 가져온 뒤 남은 공 하나를 1대1로 겨루는 경쟁 게임을 한다.</p>
