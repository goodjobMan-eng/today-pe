<h1>해적 농구 게임 (Piratas)</h1>
<p>1) 모든 학생을 경기장 전체에 배치하고 각자 농구공 1개씩을 드리블하며 이동한다. 2) 공이 없는 학생 3명을 해적으로 지정하여 드리블하는 학생들의 공을 빼앗도록 한다. 3) 공을 빼앗긴 학생은 즉시 다른 학생의 공을 빼앗으러 가야 한다.</p>
