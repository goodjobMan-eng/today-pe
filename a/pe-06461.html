<h1>초등 체육 요가 3편</h1>
<p>1) 테이블 자세에서 오른 무릎을 손 사이로 가져와 상체를 세우고 양팔을 들어 로 런지 자세를 취한다. 2) 양팔을 W자로 굽혀 내렸다 올리는 동작을 반복하고 엉덩이를 뒤로 밀어 앞다리를 펴는 반 원숭이 자세를 한다. 3) 하이 런지 자세, 전사 2 자세, 삼각 자세로 이어가며 호흡을 유지한다. 4) 누운 상태에서 다리를 들어 올리는 어깨서기 자세, 쟁기 자세를 거쳐 사바사나로 휴식한다.</p>
