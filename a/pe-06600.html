<h1>탁구공 다루기 기초 5단계 미션</h1>
<p>1) 짝과 함께 책상이나 바닥에 튄 탁구공을 손으로 10회 이상 피하는 반응 속도 미션을 수행한다. 2) 짝이 떨어뜨리는 탁구공을 캐치하고, 튀는 공을 컵으로 연속 바운드별로 받아낸 뒤 컵 위 공을 띄워 노바운드로 캐치한다. 3) 팀원들이 한 줄로 서서 탁구공을 2개씩 던져 컵이나 콘에 5개 이상 골인시키는 릴레이를 진행한다.</p>
