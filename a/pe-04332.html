<h1>에이스 하이 배구</h1>
<p>1) 모둠별로 배구공을 주고받으며 배구 기술을 연습한다. 2) 교사가 카드를 뽑아 숫자를 부르면 그 숫자만큼 공을 주고받는다. 3) 공이 바닥에 닿지 않게 정해진 횟수를 채우면 카드를 획득한다. 4) 7장의 카드를 모아 가장 높은 5장으로 포커 족보를 만든다.</p>
