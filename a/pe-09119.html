<h1>체조 어깨서기·물구나무서기·옆돌기</h1>
<p>1) 바닥에 누워 팔로 빔을 잡고 엉덩이를 들어 올려 다리를 수직으로 뻗어 어깨서기를 한다. 2) 바닥에 서서 큰 보폭으로 런지를 하며 팔을 들어 올려 손을 짚고 다리를 곧게 펴 물구나무서기를 한다. 3) 바닥에 서서 큰 보폭으로 런지를 하며 팔을 뻗고 몸을 옆으로 기울여 손과 발이 차례로 넘어가며 옆돌기를 한다.</p>
