<h1>중앙 수비선 돌파 태그 놀이</h1>
<p>1) 수비팀은 중앙선에 서서 손을 잡거나 간격을 두고 대기하고, 공격팀은 양쪽 끝 라인에 선다. 2) 신호가 울리면 공격팀 학생이 달려 나가 중앙 수비 라인을 통과해 반대편 안전 구역으로 건너간다. 3) 중앙 수비수는 라인을 벗어나지 않으며 지나가는 공격 선수를 손으로 터치하여 막는다. 4) 터치당하지 않고 반대편 선을 통과하면 성공한다.</p>
