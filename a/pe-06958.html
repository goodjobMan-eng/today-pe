<h1>고무줄놀이 레벨 루브릭 활동 (Chinese Jump Rope)</h1>
<p>1) 파트너와 함께 구역별로 배치된 고무줄에 선다. 2) 1단계(발목), 2단계(정강이·종아리), 3단계(무릎), 4단계(허벅지) 순으로 높이를 올리며 정해진 루틴을 통과한다. 3) 파트너가 상위 단계로 올라갈 수 있도록 돕고, 상위 단계에서는 자신만의 고무줄 루틴을 창작하여 수행한다.</p>
