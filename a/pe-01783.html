<h1>이클립스볼 라켓 네트형 게임</h1>
<p>1) 코트 중앙에 네트(또는 바닥 기준선)를 두고 팀을 나누며 각자 전용 라켓을 쥔다. 2) 서브는 바닥에 한 번 바운드시킨 후 라켓으로 쳐서 상대 코트로 보낸다. 3) 팀원 간 바운드 1회 이내로 횟수 제한 없이 패스 셋업을 연결해 네트 너머로 넘긴다. 4) 같은 사람이 공을 2회 연속 치지 못하는 룰을 적용하며 복식 또는 4대 4 팀 경기로 운영한다.</p>
