<h1>롤러 레이서 릴레이 미션</h1>
<p>1) 롤러 레이서에 앉아 양발을 발판에 올리고 손잡이를 좌우로 흔들어 이동한다. 2) 일직선 주행, 원 그리기, 8자 모양 궤적으로 회전하는 조작법을 익힌다. 3) 콘 사이를 지그재그(슬라럼)로 통과하며 반환점을 돌아온다. 4) 코스 끝에 놓인 병아리 교구를 한 번에 하나씩 집어 출발선으로 되가져오는 릴레이를 수행한다.</p>
