<h1>튀겨서 판 뒤집기 게임</h1>
<p>1) 경기장 곳곳에 뒤집기 판을 빨간색과 파란색 절반씩 펼쳐 놓고 참여자를 두 모둠으로 나눈다. 2) 게임이 시작되면 각자 공을 가지고 상대 모둠의 뒤집기 판을 밟은 뒤 공을 바닥에 5번 튀긴다. 3) 5번 튀기기를 성공하면 공을 멈추고 판을 뒤집어 우리 모둠 색깔로 만든다. 4) 정해진 시간이 지났을 때 판을 많이 뒤집은 모둠이 이긴다.</p>
