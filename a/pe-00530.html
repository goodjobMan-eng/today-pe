<h1>등 맞대고 공 전달하기</h1>
<p>1) 두 사람이 등을 맞대거나 앞뒤로 서서 어깨너비로 다리를 벌립니다. 2) 한 사람이 몸을 옆으로 비틀어 뒤에 있는 사람에게 공을 건네고, 공을 받은 사람은 반대쪽으로 몸을 돌려 다시 상대에게 전달하며 순환합니다. 3) 좌우 전달이 익숙해지면 머리 위로 넘겨주고 가랑이 사이로 받는 상하 전달을 합니다. 4) 더 나아가 좌우를 엇갈려 전달하는 8자 모양 패스로 전신 협응력을 기릅니다.</p>
