<h1>스캐터 볼 6가지 색깔 모으기 게임</h1>
<p>1) 팀별로 기본 색깔을 정하고 상대 팀에게 공을 던져 맞춘다. 2) 상대를 맞추면 상대가 가진 색깔 중 필요한 색깔을 빼앗아 온다. 3) 같은 팀끼리는 색깔을 나눠 갖거나 패스할 수 있다. 4) 6가지 색깔을 가장 먼저 모두 모으는 팀이 승리한다.</p>
