<h1>구파 체인지 손모양 바꾸기</h1>
<p>1) 자리에 앉거나 서서 양손을 앞으로 뻗을 준비를 합니다. 2) 한 손은 앞으로 뻗으며 보(보자기)를 펴고, 다른 손은 가슴에 대며 주먹을 쥡니다. 3) 신호나 구령에 맞춰 양손의 모양과 위치를 동시에 반대로 맞바꿉니다. 4) 동작이 익숙해지면 주먹과 가위, 보자기 조합을 바꾸거나 가슴을 치고 손을 바꾸는 등 변형 규칙을 적용합니다.</p>
