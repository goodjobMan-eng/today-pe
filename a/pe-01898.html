<h1>체육관 코트 라인 태그</h1>
<p>1) 체육관 바닥의 라인 위에 모든 학생이 흩어져 서고 술래 2명과 구출자 2명을 선정하여 조끼로 구분한다. 2) 모든 학생은 라인 위로만 이동해야 하며 술래에게 태그된 사람은 그 자리에 앉아 도로 봉쇄물(장애물)이 된다. 3) 구출자가 다가와 앉아 있는 학생을 태그해 주면 다시 부활하여 라인 위를 자유롭게 달린다. 4) 구출자는 술래에게 잡히지 않는 무적 규칙을 적용하고 라운드를 짧게 진행하여 역할을 순환한다.</p>
