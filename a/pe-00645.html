<h1>10패스 게임 (골형 과제 게임)</h1>
<p>1) 경기장 안에서 공격 팀과 수비 팀으로 나누고 팀조끼로 구분합니다. 2) 공격 팀은 상대의 방해를 피해 같은 팀원끼리 패스를 연결하며 성공할 때마다 숫자를 셉니다. 3) 상대 팀의 인터셉트 없이 공이 바닥에 떨어지지 않고 연속으로 10회 패스를 완료하면 1점을 얻으며, 패스 도중 공을 빼앗기거나 코트 밖으로 나가면 공격권이 넘어갑니다. 4) 정해진 시간 동안 더 많은 점수를 얻은 팀이 승리합니다.</p>
