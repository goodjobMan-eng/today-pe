<h1>개미집 놀이</h1>
<p>1) 포식자(술래) 2명을 정하고 나머지 학생들은 개미가 되어 경기장에 흩어진다. 2) 신호가 울리면 포식자들은 도망치는 개미들을 터치하러 다닌다. 3) 포식자에게 터치된 개미는 누워서 양팔과 양다리를 위로 뻗은 채 멈춘다. 4) 다른 개미 2명이 각각 팔과 다리를 동시에 터치해주면 풀려나 다시 뛸 수 있다. 5) 5분 동안 개미가 1명이라도 살아남으면 개미 팀이 이기고, 포식자가 모두 잡으면 포식자가 이긴다.</p>
