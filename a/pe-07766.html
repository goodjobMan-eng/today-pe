<h1>여우 꼬리 뺏기 게임 (La queue du renard)</h1>
<p>1) 정해진 구역 안에서 모든 참가자가 각자 허리에 꼬리 2개를 착용하고 시작한다. 2) 상대를 밀치거나 옷을 잡지 않고 상대의 꼬리만 한 번에 1개씩 뺏는다. 3) 꼬리를 모두 빼앗긴 사람은 경기장 밖으로 나가며 끝까지 살아남거나 꼬리를 가장 많이 모은 사람이 승리한다.</p>
