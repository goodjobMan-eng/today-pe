<h1>훌라후프 동작 익히기</h1>
<p>1) 훌라후프를 허리나 손목, 발목에 걸어서 돌리는 연습을 한다. 2) 발목에 걸어 돌릴 때는 걸린 발은 앞뒤로 뛰며 돌리고 나머지 한 발은 번갈아 건너뛴다. 3) 손목 스냅을 사용하여 훌라후프를 던져 역회전으로 굴린다. 4) 줄넘기처럼 훌라후프를 양손으로 잡고 모둠발로 넘는다.</p>
