<h1>겨울왕국 올라프 런 &amp; 댄스 배틀 파티</h1>
<p>1) 올라프와 함께 장애물을 피하며 사라진 선물 상자를 찾는 러닝 게임을 제자리에서 수행합니다. 2) 댄스 배틀 단계에서는 화면 하단에 나타나는 화살표 방향에 맞춰 발구르기나 제자리 점프를 합니다. 3) 미니게임 단계에서는 두 그림 사이의 틀린 그림을 빠르게 찾아냅니다. 4) 엘사와 안나 캐릭터 테마에 맞춰 퀴즈에 맞는 운동 동작을 수행하며 전신을 움직입니다.</p>
