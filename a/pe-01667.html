<h1>신학기 이것 저것? 밸런스 브레인 브레이크</h1>
<p>1) 화면 양쪽에 제시되는 신학기 관련 두 가지 선택지(예: 마법 도시락 vs 무한 물병)를 읽는다. 2) 둘 중 마음에 드는 선택지를 고르고, 화면이 전환되면 해당 동작을 타이머 동안 성실히 수행한다. 3) 점수 경쟁이나 탈락 없이 학급 전체가 함께 동작을 따라 하며 신체 활력을 충전한다. 4) 라운드 사이에 담임 선생님 문 고르기, 틀린 그림 찾기 등 미니게임을 진행해 흥미를 더한다.</p>
