<h1>쥐와 고양이 박수</h1>
<p>1) 두 사람이 마주 보고 손을 가까이 둔 채 한 명은 쥐, 다른 한 명은 고양이를 맡는다.2) 진행자가 '쥐'라고 외치면 쥐는 손뼉을 치고 고양이는 손을 빼서 피한다.3) 진행자가 '고양이'라고 외치면 고양이가 손뼉을 치고 쥐는 손을 빼서 피한다.</p>
