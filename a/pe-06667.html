<h1>원 안 콘 맞히기 원형 발야구 놀이</h1>
<p>1) 경기장 중앙에 콘 3개를 세우고 공격 주자 1명이 원 안으로 들어가 콘을 지킨다. 2) 수비 팀 학생들은 원 둘레에 둘러서서 굴려주는 공을 공격 주자가 3번의 기회 안에 발로 찬다. 3) 공격 주자가 공을 원 바깥으로 차면 원 밖에 대기 중인 다음 주자와 달려가 교체한다. 4) 수비 팀이 공을 전달하여 주자가 교체되기 전에 콘을 먼저 쓰러뜨리면 아웃, 콘이 쓰러지기 전에 교대하여 공을 지키면 득점한다.</p>
