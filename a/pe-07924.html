<h1>공 치기 놀이</h1>
<p>1) 출발 장소와 도착 장소에 각각 삼각콘을 세워 표시하고 학생 수만큼 원판을 지그재그 모양으로 놓습니다. 2) 원판 위에 한 명씩 채를 들고 서며 원판 밖으로는 나올 수 없습니다. 3) 출발 신호에 맞춰 채를 이용해 첫 번째 사람부터 마지막 사람까지 차례로 공을 밀어 전달합니다. 4) 공을 받지 못하면 공을 준 학생이 다시 공을 가져와 전달하며 도착 장소에 가장 빨리 전달한 모둠이 이깁니다.</p>
