<h1>발바닥 위엔?</h1>
<p>1) 4명이 1조가 되어 바닥에 엉덩이와 두 손을 붙이고 둥글게 둘러앉는다.2) 참가자들은 손을 쓰지 않고 각자 한 발씩만 들어 올려 발바닥을 모은다.3) 교사가 제공한 물건(물티슈, 플라잉디스크, 물병, 공 등)을 네 발바닥 위에 올려놓는다.4) 물건을 떨어뜨리지 않고 가장 오랫동안 들어 올려 균형을 유지하는 모둠이 성공한다.</p>
