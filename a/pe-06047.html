<h1>커플 색을 찾아라 (숫자 접시콘 활용 게임)</h1>
<p>1) 중앙에 16개의 점보스택을 놓고 그 위에 숫자 접시콘과 빈백을 배치한다.2) 출발 신호가 울리면 달려가서 접시콘과 점보스택(또는 빈백)의 색깔을 확인한다.3) 접시콘과 바닥 물품의 색상이 일치할 때만 자신의 팀 진영으로 가져올 수 있다.4) 색상이 서로 다르면 원래 자리에 그대로 내려놓고 돌아온다.5) 정해진 시간 동안 같은 색상 세트를 더 많이 찾아온 팀이 승리한다.</p>
