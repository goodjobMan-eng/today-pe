<h1>퍼피 구조대 틀린그림찾기 신체활동</h1>
<p>1) 화면에 양쪽으로 제시된 퍼피 구조대 그림 두 장을 15초 동안 비교 관찰한다. 2) 서로 다른 부분을 찾아 해당 정답에 배정된 스트레칭 및 신체 동작을 수행한다. 3) 정답을 맞힐 때마다 1점씩 획득하며 총 득점을 기록한다. 4) 레벨 1부터 3까지 점차 작고 세밀해지는 차이점을 찾으며 운동 강도를 높인다.</p>
