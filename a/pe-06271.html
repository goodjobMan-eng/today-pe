<h1>주사위 셔틀런</h1>
<p>1) 출발 지점에 고깔을 두고 약 12m 거리의 도착 지점에 훌라후프와 화이트보드, 마카를 놓는다.2) 3인 1팀으로 두 팀을 구성하고 각 팀 주자의 달리기 순서를 정한다.3) 1번 주자가 출발 신호와 함께 주사위를 들고 도착 지점까지 달려 훌라후프 안에 주사위를 굴린다.4) 나온 숫자를 화이트보드에 적은 뒤 출발 지점 고깔 바깥쪽으로 돌아와 다음 주자에게 주사위를 넘긴다.5) 제한 시간 동안 더 많은 주사위 점수를 획득한 팀이 승리한다.</p>
