<h1>짐볼 피구</h1>
<p>1) 콘 8개를 사용해 바깥쪽에 큰 원을 만든다. 2) 2~3명의 술래(피하는 사람)를 원 안에 배치하고 나머지 학생들은 원 둘레에 선다. 3) 바깥쪽 학생들이 1~3개의 대형 짐볼을 발로 차서 원 안의 선수를 맞히도록 굴린다. 4) 짐볼에 맞은 안쪽 선수는 바깥쪽으로 나가 짐볼을 차는 역할이 된다. 5) 안쪽에 마지막 한 명의 승자가 남을 때까지 게임을 진행한다.</p>
