<h1>디펜더 후프 핀 방어 타격 게임</h1>
<p>1) 중앙의 훌라후프 안에 핀을 세우고 수비수(디펜더) 1명이 후프 바깥에서 핀을 지킨다. 2) 주변의 경기자들은 원마커 위에 반드시 한 발을 올린 상태에서 손바닥으로 공을 쳐서 중앙의 핀을 쓰러뜨리려 시도한다. 3) 수비수는 훌라후프 안으로 들어가지 않고 손이나 발로 날아오는 공을 막아내며, 공을 발로 차서는 안 된다. 4) 공을 쳐서 중앙의 핀을 쓰러뜨린 사람이 수비수와 자리를 맞바꾸어 역할을 교대한다.</p>
