<p>1) 술래 1명을 정하고 나머지 학생들은 구역 전체에 흩어진다. 2) 술래는 알파벳 철자 하나를 말하며 다른 학생들을 잡으러 다닌다. 3) 술래에게 잡힌 학생은 제자리에 앉고, 술래가 제시한 철자로 시작하는 단어를 말해야 부활하여 다시 움직인다.</p>
