<h1>조리도구 활용 저글링 도전활동</h1>
<p>1) 국자와 뒤집개 등 조리도구를 양손에 잡고 뭉친 장갑을 공처럼 활용하여 준비한다. 2) 장갑을 가볍게 띄운 뒤 국자나 뒤집개로 받아내는 기초 동작을 반복한다. 3) 양손의 조리도구를 번갈아 활용하여 튀어 오른 장갑을 떨어뜨리지 않고 주고받으며 저글링 동작을 이어간다. 4) 조리도구의 면을 조절하며 연속으로 튕겨내는 횟수를 늘려 도전한다.</p>
