<h1>패드민턴 라켓으로 빈백 던지고 받기</h1>
<p>1) 두 사람이 마주 서서 각자 패드민턴 라켓(핸들러)을 잡는다.2) 라켓 면 위에 콩주머니(빈백)를 올린다.3) 라켓으로 콩주머니를 띄워 상대방에게 던진다.4) 상대방은 날아오는 콩주머니를 라켓 면으로 받아낸다.</p>
