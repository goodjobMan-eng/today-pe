<h1>손바닥 병플립 부저 게임</h1>
<p>1) 물병을 손으로 돌려 던져서 손바닥 위에 세운다.2) 손바닥을 완전히 펴지 않아도 손가락으로 잡지 않고 물병을 세우면 성공으로 인정한다.3) 손바닥 위에 세우는 데 성공하면 LED 부저를 누른다.4) 3개의 불을 먼저 켜는 사람이 승리하며, 실패할 때마다 스쿼트 1회를 수행한다.</p>
