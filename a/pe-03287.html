<h1>장애물을 피해 던져라</h1>
<p>1) 모둠 안에서 공격수 3명, 수비수 1명을 정한다. 2) 원 모양을 만들고 원 안에 후프를 든 수비수가 서고, 원 밖에는 다른 모둠의 공격수 3명이 삼각형 모양으로 선다. 3) 신호가 울리면 공격수는 수비수의 후프를 피해 공을 패스하고, 수비수는 후프 사이로 공을 통과하게 한다. 4) 정해진 시간 동안 수비수가 후프에 공을 가장 많이 통과시킨 모둠이 승리한다.</p>
