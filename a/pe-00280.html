<h1>교실 네트 쓰로볼 게임</h1>
<p>1) 교실 중앙에 네트 줄을 설치하고 양 팀이 엉덩이를 바닥에 댄 상태로 앉습니다. 2) 공을 한 손이나 두 손으로 던져 상대 구역 바닥에 떨어뜨리면 1점을 획득합니다. 3) 배구 규칙처럼 팀원 간에 최대 2회까지 패스할 수 있으며 세 번째에는 반드시 상대편으로 넘겨야 합니다. 4) 공을 잡은 뒤 1초 이상 오래 쥐고 있지 않아야 합니다.</p>
