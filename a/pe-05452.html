<h1>핑거 발리볼 게임</h1>
<p>1) 서브라인 뒤에 공을 놓고 손가락으로 튕겨 상대 코트 안으로 넘긴다.2) 상대 팀은 공을 3회 이내에 손가락으로 튕겨 다시 넘겨야 한다.3) 서브한 공이나 2~3번째 친 공이 스파이크 존에 들어가면 공격팀 득점이 된다.4) 상대가 3번째 공격을 시도할 때 수비팀은 블로킹 뚜껑을 네트에 놓아 블로킹을 시도할 수 있으며, 공이 블로킹 뚜껑에 닿으면 수비팀 득점이 된다.</p>
