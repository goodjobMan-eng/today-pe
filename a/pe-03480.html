<h1>수비 피해 손으로 공 몰며 이동하기</h1>
<p>1) 6명이 한 모둠을 이루고 공격 모둠과 수비 모둠으로 나눈다. 2) 수비 모둠은 수비 공간에서 움직이며 공을 몰고 이동하는 공격 모둠원을 손으로 친다. 3) 공격 모둠은 수비를 피해 공을 손으로 몰아 득점 영역으로 이동하면 1점을 얻는다. 4) 공을 놓치거나 수비 손에 닿으면 출발선에서 다시 시작하며, 역할을 바꾸어 정해진 시간 동안 높은 점수를 얻은 모둠이 이긴다.</p>
