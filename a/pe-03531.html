<h1>반쪽 농구</h1>
<p>1) 3명이 한 모둠을 이루고 두 모둠이 농구 경기장의 반쪽만 사용하여 게임을 준비한다. 2) 상대 모둠을 피해 공을 드리블하거나 패스하며 골대에 공을 넣어 3점 라인 안은 2점, 밖은 3점을 얻는다. 3) 상대 공을 빼앗거나 득점하면 3점 라인 밖으로 공을 보낸 후 공격을 다시 시작한다. 4) 정해진 시간 동안 20점을 먼저 얻은 모둠이 승리한다.</p>
