<h1>스팟 잇 빅토리 랩</h1>
<p>1) 각자 도블(Spot It) 카드를 1장씩 들고 중앙 연결 구역에서 만난다.2) 상대방에게 자기소개 인사를 나눈 뒤 '하나 둘 셋' 구호에 맞춰 카드를 뒤집는다.3) 카드에서 공통 그림을 먼저 찾아 외친 사람이 승리하며, 승자는 체육관 한 바퀴 빅토리 랩을 돌고 패자는 다른 상대를 찾아 새 경기를 한다.</p>
