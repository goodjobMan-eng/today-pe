<h1>콘에 콘 모자 씌우기 대결</h1>
<p>1) 라바콘 5개를 일정한 간격으로 설치하고 양쪽 출발선에 접시콘 2개를 들고 준비합니다. 2) 신호가 울리면 달려와 양끝 라바콘에 발을 대고 접시콘을 던져 라바콘에 모자처럼 씌웁니다. 3) 자기 쪽 라바콘에 성공하면 맨 가운데 라바콘에 접시콘 모자를 씌우러 이동합니다. 4) 가운데 라바콘에 먼저 씌운 사람이 승리하며, 정해진 시간 동안 승부가 나지 않으면 가위바위보로 결정합니다.</p>
