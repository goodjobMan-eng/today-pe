<h1>족구 빈 곳으로 공 보내기 및 스파이크</h1>
<p>1) 발 안쪽으로 공을 가볍게 위로 띄워 동료 공격수에게 토스한다. 2) 토스된 공이 정점에 이르렀을 때 발 안쪽이나 발끝으로 스파이크를 찬다. 3) 세게 차기보다 상대 수비가 없는 빈 곳이나 상대 앞쪽 약점을 노려 공을 보낸다.</p>
