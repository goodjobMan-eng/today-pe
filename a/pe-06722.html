<h1>배구 개인 기술 챌린지</h1>
<p>1) 공을 위로 띄운 뒤 콘을 터치하고 디그한다 2) 공을 띄우고 바닥에 손을 평평하게 펴서 바운드된 공을 팬케이크로 받는다 3) 공을 세팅하며 바닥에 앉았다가 다시 일어선다 4) 벽 앞에서 손목 스냅으로 벽 세팅을 연습한다 5) 네트 너머로 공을 던지고 네트 아래로 통과해 잡거나 디그한다 6) 벽에 공을 튀기며 디그와 세팅을 번갈아 연습한다 7) 바닥에 둔 후프 안에서 공을 튀기며 한 팔로 연속 터치한다.</p>
