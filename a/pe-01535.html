<h1>원바운드 캐치 소프트배구</h1>
<p>1) 코트 중앙에 네트를 치고 팀을 나눈 뒤 부드러운 소프트배구공을 준비한다. 2) 공이 바닥에 한 번 튄 뒤(원바운드) 리시브할 수 있으며 팀원 모두가 최소 1회 이상 공을 터치한다. 3) 2번째 주자는 공을 안전하게 캐치한 후 3번째 공격수에게 정확히 토스하여 공격을 연결한다. 4) 팀 수준에 따라 3번째 주자의 원바운드 공격이나 5회 이내 리턴 등 추가 규칙을 적용해 승부를 겨룬다.</p>
