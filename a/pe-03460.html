<h1>족구형 게임 기능 익히기</h1>
<p>1) 서브는 공을 가볍게 띄운 후 발 안쪽(정확한 서브) 또는 발등(강한 서브)을 이용해 찬다. 2) 공이 날아오는 방향으로 재빠르게 이동하여 충격을 흡수하며 띄워 올리는 느낌으로 발을 이용해 공을 받는다. 3) 공이 바닥에 튀어 오를 때 양쪽 무릎을 구부리며 이마 가운데로 공을 가볍게 맞춰 머리로 받는다. 4) 바닥에 튄 공을 끝까지 보면서 다리를 높이 올려 앞으로 크게 휘돌리며 강하게 스파이크한다.</p>
