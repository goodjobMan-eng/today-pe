<h1>순서대로 넣기 (농구공 버전)</h1>
<p>1) 농구 골대 아래 각기 다른 거리와 각도에 콘을 놓아 1번부터 5번까지 자리를 지정한다.2) 1번 자리에서 슛을 던져 성공하면 2번 자리로 이동하여 차례대로 슛을 던진다.3) 슛에 실패하면 다음 친구에게 차례를 넘기고, 다음 순번이 돌아왔을 때 실패했던 자리부터 다시 도전한다.4) 5번 자리까지 모두 성공하면 1등을 획득하고 다시 1번 자리로 돌아가 점수를 누적하거나 목표 점수를 먼저 달성한다.</p>
