<h1>콘홀 타임 어택 게임</h1>
<p>1) 1분이나 2분으로 타이머 시간을 정하고 빈백 1개를 준비한다.2) 콘홀 판 위에 빈백을 올리면 1점, 구멍에 넣으면 3점을 획득한다.3) 팀원들이 로테이션으로 계속 돌면서 던지고 점수를 누적하여 합산한다.</p>
