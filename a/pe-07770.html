<h1>카나스타 히라토리아 (회전 골대 슛 릴레이)</h1>
<p>1) 경기장 중앙에 원을 그리고 각 모둠 학생들을 배치한 뒤 모둠별로 농구공 1개씩을 지급한다. 2) 경기장 주변에 설치된 각자의 골대를 향해 첫 주자가 달려가 레이업 슛을 시도한다. 3) 리바운드한 공을 잡아 중앙 원의 모둠으로 복귀해 다음 주자에게 패스하며 릴레이로 진행한다. 4) 모둠원 전원이 슛을 마치면 모든 모둠이 시계 방향으로 한 칸씩 이동하여 다른 골대에서 순환 진행한다.</p>
