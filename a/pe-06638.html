<h1>초급 심폐지구력 운동 1</h1>
<p>1) 좌우로 이동하며 팔을 펼쳤다 모아주는 팔벌려뛰기 변형 동작을 수행한다. 2) 옆으로 이동해 다리와 몸을 반대로 비트는 사이드 스텝 트위스트를 양방향 번갈아 실시한다. 3) 두 팔을 당기며 가슴을 펴는 동시에 옆으로 이동해 반대쪽 발뒤꿈치로 엉덩이를 가볍게 터치하고, 마지막으로 팔을 흔들며 앞뒤로 걷기를 진행한 뒤 30초 휴식 후 2세트를 반복한다.</p>
