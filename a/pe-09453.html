<h1>가찬코 달리기 대결</h1>
<p>1) 안쪽 원 팀과 바깥쪽 팀이 일대일로 마주보며 출발한다. 2) 나선형 경로를 따라 이동하다가 만나면 가위바위보를 한다. 3) 진 사람은 탈락하고 이긴 사람은 계속 나선형 안쪽으로 이동해 상대 진영에 도달하면 점수를 얻는다.</p>
