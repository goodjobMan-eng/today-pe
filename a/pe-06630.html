<h1>핸드셰이크 댄스</h1>
<p>1) 손바닥 치기, 손등 치기, 주먹 위아래 치기, 주먹 치기 후 제자리 한 바퀴를 돌고 손바닥 치기를 한다. 2) 두 손 주먹을 두 번 부딪치고 위아래로 친 뒤 오른쪽 팔목 하이파이브를 하고 팔짱 끼고 자리를 바꿔 점프한다. 3) 오른팔·왼팔을 두 번씩 부딪치고 양손 박수를 친 뒤 발 안쪽·바깥쪽을 부딪치고 어깨를 맞댄다. 4) 친구와 마주 보고 각자 다르게 창작한 동작을 릴레이로 순차적으로 수행한다.</p>
