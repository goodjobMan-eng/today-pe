<h1>종이컵 타악 컵타 활동</h1>
<p>1) 손뼉 1번 치고 컵을 톡톡 친 후 다시 손뼉 치고 컵을 잡아 내려놓는 1번 기본 동작을 익힌다. 2) 손뼉을 2번 친 후 컵을 치고 손뼉 치며 잡아 내려놓는 2번 동작을 익힌다. 3) 손뼉 없이 바닥을 먼저 치고 손뼉 후 컵을 잡는 3번 동작을 익힌다. 4) 손뼉 후 컵을 왼손에 부딪치고 바닥을 치며 손을 바꾸어 내려놓는 4번 동작을 익혀 음악에 맞춰 연결한다.</p>
