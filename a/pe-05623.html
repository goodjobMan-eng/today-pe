<h1>3-3-3 플라잉디스크 패스 게임</h1>
<p>1) 디스크를 잡은 사람은 이동하지 못하며 3초 이내에 패스해야 하고 넘기면 상대 팀 볼이 된다2) 수비수는 3m(세 발) 이상 거리를 유지해야 하며 이내로 들어와 방해하면 반칙이 된다3) 같은 팀끼리 세 번 연속 패스를 성공하면 1점을 획득한다(단 두 사람끼리만 연속으로 주고받는 것은 2회까지만 인정)4) 두 팀 선수가 동시에 디스크를 잡은 경우에는 던진 팀의 공격권을 유지한다</p>
