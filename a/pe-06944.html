<h1>골든 차일드 농구형 게임</h1>
<p>1) 청팀과 홍팀 두 팀으로 나눈다 2) 청팀 주자는 한 번에 한 명씩 농구공을 드리블하며 파란색 콘 코스를 지그재그로 완주하고 끝에 앉아 응원한다 3) 그동안 홍팀은 자유투 라인에서 한 명씩 슛을 시도해 백보드 1점, 림 2점, 골인 3점을 획득한다 4) 슛한 사람은 공을 주워 줄 맨 뒤로 가고 다음 사람이 슛하며, 청팀 주자가 모두 완주할 때까지 점수를 합산한다.</p>
