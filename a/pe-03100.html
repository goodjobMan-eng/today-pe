<h1>배드민턴형 게임 규칙</h1>
<p>1) 단식(1 대 1) 또는 복식(2 대 2)으로 팀을 구성한다. 2) 서브를 넣을 때는 라켓이 허리보다 밑에 위치한 상태에서 아래에서 위쪽으로 넣는다. 3) 서브 시 자신의 점수가 짝수(0점 포함)이면 오른쪽 코트에서, 홀수이면 왼쪽 코트에서 대각선 방향으로 넣는다. 4) 복식에서는 득점하여 이긴 팀만 서브 넣는 좌우 자리를 바꾸고, 진 팀은 자리를 바꾸지 않는다.</p>
