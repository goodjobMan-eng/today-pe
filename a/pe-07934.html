<h1>줄넘기 겨루기 게임</h1>
<p>1) 신호가 울리면 친구에게 달려가 겨루기를 신청한다. 2) 가위바위보를 하여 이긴 사람이 배운 방법 가운데 하나를 골라 종목을 정한다. 3) 대결을 시작하여 먼저 줄에 걸린 사람이 1점, 더 오래 한 사람이 2점을 얻는다. 4) 한 번 대결한 상대와는 다시 대결할 수 없으며 정해진 시간 동안 점수를 모은다.</p>
