<h1>종이컵과 휴지공으로 하는 코프민턴</h1>
<p>1) 종이컵을 라켓 삼아 쥐고 둥글게 뭉친 휴지를 공 대신 사용한다. 2) 가위바위보에서 이긴 사람이 서브를 넣으며 경기를 시작한다. 3) 종이컵 안에 넣은 휴지를 상대 코트를 향해 튕겨 날린다. 4) 자기 코트 안에 휴지가 떨어지면 상대방이 1점을 얻고, 득점한 사람의 서브로 재개하여 먼저 5점을 얻으면 이긴다.</p>
