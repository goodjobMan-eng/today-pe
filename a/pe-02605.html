<h1>인사이드 슈팅과 인스텝 슈팅 연습</h1>
<p>1) 골키퍼의 손이 닿지 않는 위치를 겨냥하는 슈팅의 기본 원리를 이해한다. 2) 발 안쪽을 사용해 가까운 거리나 골키퍼와의 1대1 상황에서 정확하게 차는 인사이드 슈팅을 연습한다. 3) 목표물을 정해 맞추고 목표물의 위치를 바꿔가며 골대 구석으로 차는 연습을 단계적으로 실시한다. 4) 먼 거리에서 강하게 찰 때 발등을 사용하는 인스텝 슈팅을 시도하며 디딤발 무릎과 발목을 굽혀 공이 뜨지 않게 조절한다.</p>
