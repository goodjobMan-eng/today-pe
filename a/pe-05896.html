<h1>농구 콘 드리블 및 슛 릴레이</h1>
<p>1) 각 팀은 농구공 1개와 골대로 향하는 일렬 콘 라인 뒤에 선다.2) 콘 사이를 지그재그로 드리블하며 앞으로 나아간다.3) 마지막 콘에 멈춰서 골대를 향해 슛을 2번 시도한다(골을 넣을 때마다 1점 획득).4) 시작점으로 다시 드리블하여 돌아와 다음 주자에게 공을 넘겨주고, 팀 전체 득점을 합산한다.</p>
