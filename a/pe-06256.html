<h1>팀플레이 미션 농구</h1>
<p>1) 하프코트에서 두 팀으로 나누어 공격과 수비를 정한다.2) 팀당 3명 기준으로 1대1 3회, 2대2 2회, 3대3 1회를 진행하며 전원이 한 경기 이상 참여한다.3) 센터서클에서 공격팀의 바운드 패스로 경기를 시작하며, 경기 시간은 경기당 3분으로 진행한다.4) 슛 성공 여부와 관계없이 슈팅을 시도하면 즉시 공수가 교대되며, 누적 득점으로 승패를 결정한다.</p>
