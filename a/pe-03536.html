<h1>골 영역으로!</h1>
<p>1) 6명이 한 모둠을 이루어 팀을 구성한다. 2) 모둠원끼리 공을 던지고 잡으면서 상대 모둠의 골 영역으로 이동하되, 공을 잡으면 세 걸음까지만 이동할 수 있다. 3) 수비 모둠은 공을 가진 상대 모둠원으로부터 1m보다 멀리 떨어져서 수비해야 한다. 4) 모둠원이 패스를 이어받아 상대 모둠의 골 영역 안으로 들어가면 1점을 얻으며, 정해진 시간 동안 가장 많은 점수를 얻은 모둠이 이긴다.</p>
