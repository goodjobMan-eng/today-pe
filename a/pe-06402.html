<h1>봄맞이 스톰프 신체활동</h1>
<p>1) 대결하는 두 봄 캐릭터 중 마음에 드는 캐릭터를 선택한다.2) 화면 속 버튼이 플레이 존에 도착하면 박자에 맞춰 지정된 동작을 수행한다.3) 빨간색은 왼발 구르기나 깽깽이, 노란색은 오른발 구르기나 깽깽이, 빨강·노랑 동시는 점프, 파란색은 박수, 보라색은 허벅지 치기를 한다.4) 비 내리는 미니게임 구간에서는 제시되는 봄맞이 동작 포즈를 똑같이 따라 하며 버틴다.</p>
