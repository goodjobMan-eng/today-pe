<h1>연속 8자 긴줄넘기 뛰어들기 비법</h1>
<p>1) 발을 앞뒤(가위 모양)로 벌려 체중을 앞뒤로 옮기며 줄이 지나가는 타이밍을 확인합니다. 2) 줄의 가운데 지점까지 멈추지 않고 과감하게 달려 들어갑니다. 3) 줄을 한 번 넘은 직후 제자리에 머물지 말고 줄을 돌리는 사람 쪽으로 즉시 빠져나오며, 돌리는 사람의 손을 터치하거나 다리 사이를 통과하는 연습을 반복합니다. 4) 숙달되면 연속 8자 형태로 줄이 돌아갈 때 끊김 없이 차례대로 뛰어들어 넘습니다.</p>
