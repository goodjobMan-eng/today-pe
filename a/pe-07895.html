<h1>살아있는 골대 핸드볼</h1>
<p>1) 두 팀으로 나뉘며 각 팀에서 2명의 선수가 띠(리본)를 착용하고 '살아있는 골대' 역할을 맡는다 2) 일반 핸드볼 규칙에 따라 패스를 연결하며 공을 전진시킨다 3) 상대 팀의 살아있는 골대 선수에게 공을 던져 맞히면 1점을 획득한다 4) 살아있는 골대 선수도 자기 팀이 공을 가졌을 때는 일반 선수처럼 이동하고 골을 노릴 수 있다</p>
