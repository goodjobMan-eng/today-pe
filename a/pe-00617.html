<h1>매트 물구나무서서 브릿지(도립 브릿지) 도전</h1>
<p>1) 매트 앞에 서서 양손을 짚고, 처음에는 보조자가 받쳐 주는 상태에서 물구나무서기 자세를 취합니다. 2) 물구나무서기 정점에서 시선을 유지하며 등과 허리를 활처럼 젖혀 발을 매트 뒤쪽으로 내립니다. 3) 양발이 바닥에 닿는 순간의 충격을 팔과 어깨 지지력으로 버티며 아치형 브릿지 자세를 완성합니다. 4) 숙련되면 연속 동작으로 이어서 전방 핸드스프링(앞돌기)의 기초 감각을 익힙니다.</p>
