<h1>원마커 집 찾기 놀이 (I WANT A HOME)</h1>
<p>1) 활동 공간 바닥에 참가 인원보다 1~2개 적게 원마커를 배치합니다. 2) 음악이 나오는 동안 지시된 이동 기술(두 발 점프, 걷기 등)로 공간을 돌아다닙니다. 3) 음악이 멈추면 자기가 있던 곳을 제외한 빈 마커 위로 빠르게 찾아 들어갑니다. 4) 마커 집을 차지하지 못한 탈락자는 다음 차례에 음악을 멈추는 교사 역할을 맡습니다.</p>
