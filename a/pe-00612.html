<h1>수영 호흡법 기초 보빙 점프 연습</h1>
<p>1) 수영장에서 얕은 물에 들어가 서서 준비합니다. 2) 숨을 코나 입으로 다 뱉지 않고 참으며 물속으로 가라앉습니다. 3) 바닥을 차고 수면 위로 점프하여 올라오는 순간 '파' 하고 입으로 숨을 내뱉은 뒤 크게 들이마십니다. 4) 숨을 가득 들이마신 채 다시 물속으로 들어가며 동작을 연속으로 반복하고, 익숙해지면 점프하면서 앞으로 조금씩 전진합니다.</p>
