<h1>발목 감아 넘기 점프 트위스트</h1>
<p>1) 줄넘기를 반으로 접어 한쪽 끝을 발목에 묶어 고정하고 매듭이 풀리지 않게 정리한다. 2) 줄이 묶인 다리를 앞으로 가볍게 차서 줄을 앞으로 회전시키며 반대쪽 발로 줄을 뛰어넘는다. 3) 연속해서 발을 돌리며 리듬에 맞춰 걸리지 않고 성공한 점프 횟수를 기록한다. 4) 한쪽 발 숙달 후 반대쪽 발목으로 바꾸거나 점프 회전수를 늘리는 방식으로 변형한다.</p>
