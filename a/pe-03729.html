<h1>망토 놀이 (부모-아이 체조)</h1>
<p>1) 보호자가 등을 대고 누워 아이를 등이나 배 위에 태운다. 2) 아이의 손이나 옷을 잡고 천천히 들어 올려 몸이 공중에 뜨는 느낌을 체험하게 한다. 3) 미끄럼틀처럼 낮은 높이에서부터 점차 높이를 높여가며 다양한 방향으로 움직인다.</p>
