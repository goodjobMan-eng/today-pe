<h1>가정형 신체활동(워킹 및 스텝 운동)</h1>
<p>1) 한 칸에 한 발씩 발을 딛으며 걷는 한 발 워킹을 한다. 2) 공을 위로 던지고 받고 발을 바꿔가며 이동하는 공 던지고 이동 워킹을 한다. 3) 다리를 앞뒤로 교차하며 측면으로 이동하는 다리 교차 스텝을 한다. 4) 양발을 교차한 후 양발로 착지하는 크로스 점프 스텝을 한다.</p>
