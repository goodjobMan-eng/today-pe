<h1>쭉쭉! 봄의 새싹</h1>
<p>1) 원 대형으로 서서 주사위를 두 번 던진다. 2) 첫 번째 주사위는 표현할 신체 표현 동작을 나타내고 두 번째 주사위는 동작의 횟수를 나타낸다. 3) 주사위를 던진 친구가 동작을 보여주면 나머지 친구들이 그 동작을 횟수만큼 따라 스트레칭한다.</p>
