<h1>신호등 게임 (信号ゲーム)</h1>
<p>1) 참가자들은 횡단보도 선 뒤에 나란히 서고, 술래(진행자)는 맞은편에서 신호를 부른다. 2) 파란색(青)을 외치면 앞으로 한 걸음 뛰어서 나아가고, 노란색(黄色)을 외치면 뒤로 한 걸음 물러선다. 3) 빨간색(赤)을 외치면 그 자리에 그대로 멈춰 서야 한다. 4) 신호등에 없는 색깔(예: 흰색, 검은색)을 외치면 '트럭'이 지나가는 신호이므로 재빨리 뒤쪽 벽까지 도망쳐서 터치해야 한다.</p>
