<h1>농구 스킬 트레이닝 (드랩스텝·드리블·슛)</h1>
<p>1) 공 없이 어깨너비로 서서 무릎을 굽히고 발을 앞뒤로 벌리는 드랍 스텝을 연습한다. 2) 무릎 및 허리 높이에서 손바닥으로 강하게 누르는 파운드 드리블과 크로스오버를 연습한다. 3) 둘이 마주 보고 서서 내 공을 두 번 치고 상대방 공을 두 번 치거나 자리를 바꾸는 드리블 훈련을 진행한다. 4) 팔꿈치를 끝까지 뻗으며 검지와 중지 스냅으로 공을 던져 림을 향해 슛한다.</p>
