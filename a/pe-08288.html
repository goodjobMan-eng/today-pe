<h1>농구 드리블 및 볼 핸들링 준비운동</h1>
<p>1) 교사가 앞에서 시범 보이는 드리블 및 볼 핸들링 동작을 보고 따라 한다. 2) 제자리에서 공 두드리기(Slaps), 손가락 탭(Taps), 허리 감기(Wraps)를 수행한다. 3) 오른손 드리블, 왼손 드리블, V 드리블, 다리 사이 드리블, 무릎 꿇고 드리블, 앉아서 드리블, 윗몸일으키기 드리블을 차례대로 따라 한다.</p>
