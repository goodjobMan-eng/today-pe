<h1>신문지 막대 순발력 낙하 캐치 놀이</h1>
<p>1) 신문지를 돌돌 말아 테이프로 고정해 단단한 막대를 만들고 쿠션이나 방석을 바닥에 놓는다 2) 한 사람이 막대 상단을 수직으로 잡고 높이 들며 다른 사람은 차렷 자세로 손을 내린 채 준비한다 3) 신호 없이 막대를 손에서 놓아 자유 낙하시키면 떨어지는 막대를 바닥에 닿기 전에 신속히 낚아챈다 4) 성공할 때마다 손을 엉덩이나 머리 뒤에 두거나 막대에 특정 색 테이프를 붙여 해당 구역만 잡도록 난이도를 높인다</p>
