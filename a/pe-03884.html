<h1>버디 더 엘프 선물 배달 챌린지</h1>
<p>1) 체육관 외곽 6곳에 캐릭터 매트 구역을 표시하고 중앙에 이름표가 붙은 선물 가방을 둔다. 2) 모둠별로 순서대로 도전하며 출발 신호가 울리면 중앙으로 전력 질주한다. 3) 한 번에 선물 1개만 들고 해당 캐릭터 매트로 달려가 배달한 후 중앙으로 돌아온다. 4) 중앙의 선물이 모두 배달되면 모둠원 전체가 중앙 원으로 돌아오며 기록 측정을 종료한다.</p>
