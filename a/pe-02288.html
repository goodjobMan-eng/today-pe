<h1>구슬치기 (삼각형 치기)</h1>
<p>1) 정해진 개수만큼 구슬을 삼각형 안에 넣는다. 2) 삼각형에서 선 쪽으로 구슬을 던져 선에 가장 가까운 순서대로 순서를 정한다(선에 닿으면 1등, 선 밖으로 나가면 꼴찌). 3) 순서대로 구슬을 굴리거나 던져 삼각형 밖으로 구슬을 내보내며, 밖으로 나온 구슬을 따먹고 계속할 수 있다. 4) 공격 구슬이 삼각형 안에 머물거나 선에 닿으면 지금까지 딴 구슬을 모두 내놓고 탈락(소하기)한다.</p>
