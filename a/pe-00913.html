<h1>농구 테마 둘 중 하나 선택 타바타 준비운동</h1>
<p>1) 화면에 농구와 관련된 두 가지 선택지(예: 왼손 드리블 vs 오른손 드리블)가 제시됩니다. 2) 각 선택지 옆에 배정된 운동 동작(스쿼트, 제자리 달리기 등) 중 더 선호하는 쪽의 동작을 확인합니다. 3) 음악에 맞춰 정해진 시간 동안 그 운동 동작을 신나게 수행합니다. 4) 화면이 바뀌면 다음 질문과 운동 동작을 확인하고, 타바타 형식으로 반복하여 몸을 풉니다.</p>
