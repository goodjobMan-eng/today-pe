<h1>킨볼(Kin-Ball) 기초 규칙 및 경기 방법</h1>
<p>1) 4명씩 구성된 세 팀(핑크, 그레이, 블랙)이 경기장에 들어간다. 2) 공격 팀 4명이 모두 대형공에 접촉한 상태에서 수비할 한 팀의 색상을 외치며 히트(서브)한다. 3) 호명된 수비 팀 전원은 공이 바닥에 닿기 전에 몸의 어느 부위로든 받아내야 한다. 4) 수비 성공 시 바로 공격 팀으로 전환하여 새로운 서브를 진행하며, 수비 실패 시 다른 두 팀이 각각 1점씩 얻는다.</p>
