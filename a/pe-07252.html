<h1>스쿠터 카약 태그</h1>
<p>1) 학생들은 스쿠터보드에 앉아 폼 롤러(패들)를 저으며 이동한다. 2) 술래에게 태그를 당한 학생은 라바콘으로 표시된 운동 구역(Exercise Zone)으로 이동한다. 3) 운동 구역에서 무릎 당기기(니 턱)를 3회 수행한 후 다시 게임으로 복귀한다.</p>
