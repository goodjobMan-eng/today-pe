<h1>아리랑 관짝춤 K-컬처 표현활동</h1>
<p>1) 왼쪽 손을 허리에 대고 손끝을 건 채 8박자에 맞춰 돈다.2) 반대쪽(오른쪽)으로도 8박자에 맞춰 돈다.3) 박수를 치며 탈춤 동작과 한삼 뿌리기 동작을 연결하여 춘다.4) 아리랑과 음악에 맞춰 전체 동작을 반복하며 춤을 춘다.</p>
