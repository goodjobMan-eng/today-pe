<h1>풋볼 4 (Fútbol 4)</h1>
<p>1) 경기장 사방에 골대를 1개씩 총 4개 배치하고, 학생들을 4팀으로 나누어 각 골대를 하나씩 맡아 수비한다. 2) 축구공을 투입하여 자기 팀 골대를 제외한 나머지 3개 골대 중 어느 곳에나 골을 넣어 득점한다. 3) 어느 팀이든 골을 넣으면 모든 팀이 자리를 바꾸어 수비할 골대를 교대한다.</p>
