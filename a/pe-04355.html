<h1>마리오 스켈레톤 헌트</h1>
<p>1) 마리오의 뼈를 찾기 위해 노래와 숫자에 맞춰 제자리 걷기, 점프, 발구르기, 앙감질을 한다. 2) 좀비 굼바가 나타나면 달리고 점프하여 피한다. 3) 부끄끄(Boo)가 나타나면 달리고 몸을 숙여 피한다. 4) 와르르(Dry Bones)에게는 발차기를 하고, 길을 막는 블록은 펀치로 부순 뒤 보우저의 포즈를 취해 뼈를 되찾는다.</p>
