<h1>달리기 게임 - 링에 링잡고</h1>
<p>1) 팀원들이 출발선에 일렬로 선다.2) 1번 주자가 고리(링)를 잡고 달려가 반환점을 한 바퀴 돌고 돌아온다.3) 돌아와서 2번 주자의 고리를 걸어 잡고 함께 손을 잡지 않은 채 달려 반환점을 돈다.4) 한 명씩 주자를 연결하며 이어가고 마지막 주자가 돌아오면 완주한다.</p>
