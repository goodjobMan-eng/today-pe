<h1>교실 풍선 배구</h1>
<p>1) 교실 중앙에 줄이나 간이 네트를 설치하고 양 팀 코트를 나눈다. 2) 서브로 게임을 시작하며, 손·발 등 몸의 모든 부위를 활용해 풍선을 떨어뜨리지 않고 상대편 코트로 넘긴다. 3) 한 사람이 풍선을 여러 번 연속해서 터치해도 인정된다. 4) 상대방 공격 시 네트 가까이에서 블로킹할 수 있으며, 풍선이 바닥이나 네트 바깥쪽 물건에 맞으면 아웃이 된다.</p>
