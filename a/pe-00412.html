<h1>천하통일 가위바위보</h1>
<p>1) 모둠별로 2~5글자의 구호와 3~4박자의 고유 동작을 정합니다. 2) 시작 신호가 울리면 교실을 돌아다니며 자기 모둠의 구호와 동작을 외치다가 다른 팀 친구를 만나 가위바위보 대결을 합니다. 3) 대결에서 진 학생은 이긴 팀에 흡수되어 즉시 그 팀의 구호와 동작으로 바꿔 함께 활동합니다. 4) 일정 시간이 지나면 팀별로 모여 생존 팀을 확인하고, 한 팀의 구호와 동작으로 학급 전체가 통일될 때까지 대결을 이어 갑니다.</p>
