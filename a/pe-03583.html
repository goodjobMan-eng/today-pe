<h1>패드민턴 서바이벌 오래 치기</h1>
<p>1) 핸들러 라켓을 잡고 배드민턴 반코트당 2명씩 자기 구역(자기 집)에 들어간다. 2) 처음에는 플로어볼 공으로 중심을 잡고 무릎 반동을 이용해 튕기는 연습을 하다가 셔틀콕으로 바꾼다. 3) 라켓 양면을 번갈아 뒤집어가며 떨어뜨리지 않고 공을 연속해서 쳐 올린다. 4) 자기 구역을 벗어나거나 남의 집을 침범하지 않아야 하며, 공을 떨어뜨려 탈락한 사람은 방해되지 않게 바닥에 앉고 끝까지 살아남은 최후의 1인을 가린다.</p>
