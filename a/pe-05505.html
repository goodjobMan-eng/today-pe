<h1>지렁이 체조</h1>
<p>1) 교사의 구호에 맞춰 검지손가락을 꿈틀거리며 지렁이 체조 노래와 동작을 따라 한다.2) 손목과 손 전체를 구불거리며 뱀 체조 동작으로 크기를 키운다.3) 양팔 전체를 크게 휘두르며 이무기 체조 동작으로 확장한다.4) 온몸을 역동적으로 점프하고 흔들며 용 체조를 수행한다.</p>
