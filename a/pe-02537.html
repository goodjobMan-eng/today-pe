<h1>배구 스파이크 익히기</h1>
<p>1) 3스텝(왼발 시작, 오른발-왼발 도약) 또는 2스텝(오른발 시작, 왼발-도약)으로 도움닫기를 한다. 2) 점프 후 팔을 뒤로 빼며 상체를 열고, 팔꿈치는 어깨보다 살짝 위에 위치시킨다. 3) 공을 끝까지 보며 팔꿈치가 반원을 그리듯 쭉 펴서 손바닥으로 스윙하여 공을 맞춘다. 4) 세터가 올려준 오버핸드 패스를 연결하여 스파이크 공격을 연습한다.</p>
