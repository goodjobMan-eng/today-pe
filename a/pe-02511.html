<h1>꼬리 앞구르기</h1>
<p>1) 수건을 길게 접어 바지 뒷부분에 넣어 꼬리를 만든다. 2) 매트 위에서 앞구르기를 실시한다. 3) 앞구르기를 마치자마자 술래(보호자)에게 꼬리를 빼앗기지 않도록 재빨리 일어선다. 4) 다리 사이로 꼬리를 바라보며 몸을 둥글게 말아 회전한다.</p>
