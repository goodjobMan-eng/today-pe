<h1>병뚜껑 까기</h1>
<p>1) 긴 테이블의 한쪽 끝에서 출발 준비를 한다. 2) 손가락으로 병뚜껑을 튕겨 반대편 끝을 향해 보낸다. 3) 병뚜껑이 테이블 밖으로 떨어지지 않고 가장 끝에 가깝게 멈춘 팀이 승리한다. 4) 상대 팀의 병뚜껑을 쳐내어 밖으로 떨어뜨릴 수도 있다.</p>
