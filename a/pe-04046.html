<h1>박스 하키 게임</h1>
<p>1) 두 선수가 박스 양쪽에 마주 서서 1, 2, 3 페이스오프로 경기를 시작한다. 2) 스틱을 이용해 중앙 아치 문을 통과시켜 상대 진영의 골대 안으로 퍽을 넣는다. 3) 퍽이 공격 구역 밖으로 튀어나가면 해당 구역에서 다시 페이스오프를 진행한다. 4) 변형 규칙으로 수비와 공격 역할을 나누어 2대2로 진행하거나 퍽을 2개로 늘려 진행한다.</p>
