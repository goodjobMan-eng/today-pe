<h1>발렌타인데이 둘 중 하나 골라 운동하기</h1>
<p>1) 화면에 제시되는 두 가지 발렌타인데이 관련 선택지 중 마음에 드는 쪽을 고릅니다. 2) 오른쪽 그림이 좋으면 오른쪽으로, 왼쪽 그림이 좋으면 왼쪽으로 이동합니다. 3) 화면이 전환되면 선택한 쪽에 해당하는 정해진 운동이나 댄스 동작을 타이머가 끝날 때까지 수행합니다. 4) 라운드가 반복되며 다양한 전신 유산소 운동과 스트레칭을 이어갑니다.</p>
