<h1>실용 무용 케이팝 포인트 안무 바꾸기</h1>
<p>1) 제시된 케이팝 음악 중 마음에 드는 곡을 고르고 기억에 남는 기존 포인트 안무 구간을 확인한다. 2) 대화 제스처나 손가락 하트 등 익숙한 상체 동작을 중심으로 반복되는 나만의 손·팔 안무를 구상한다. 3) 손동작에 발스텝과 하체 동작을 결합하고 시작과 끝을 자유 동작으로 연결하여 득점 및 완성을 노린다. 4) 개인 창작에서 모둠원과 함께 대형을 맞추어 변형하거나 친구들 앞에서 발표하며 표현을 즐긴다.</p>
