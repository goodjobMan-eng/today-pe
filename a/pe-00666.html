<h1>협동 사다리 스텝 릴레이</h1>
<p>1) 스텝래더 2개를 나란히 설치하고 모둠원들이 줄을 서서 대기합니다. 2) 모둠원 전체가 구호에 맞춰 점프 스텝(구-파, 구-구-파 등) 또는 양발 교차 스텝을 같은 박자로 수행하며 전진합니다. 3) 앞 주자가 사다리를 이동하면 다음 주자가 바로 이어서 리듬을 맞춰 통과하며, 사다리에 발이 걸리지 않고 완주하면 성공입니다. 4) 양쪽에서 마주 보고 진행하는 교차 스텝 릴레이 형태로 난이도를 높여 진행할 수도 있습니다.</p>
