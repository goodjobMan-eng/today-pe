<h1>축구 킥 기본 동작 배우기</h1>
<p>1) 킥을 하는 동안 시선은 공에 집중한다 2) 디딤발(차지 않는 발)을 공 옆에 딛는다 3) 백스윙 시 차는 발의 무릎을 굽힌다 4) 발등(인스텝)으로 공을 정확히 맞힌다 5) 차는 발의 반대쪽 팔을 앞쪽과 옆쪽으로 휘둘러 균형을 잡는다 6) 공을 찬 후 차는 발을 목표 방향으로 끝까지 뻗어 준다(팔로스루)</p>
