<h1>풍선 하키 스테이션 놀이</h1>
<p>1) 풍선과 하키 스틱을 챙겨 출발선에 준비한다. 2) 스틱으로 풍선을 조작하며 오렌지색 콘을 돌아 출발선으로 돌아오는 연습을 한다. 3) 모둠원과 함께 대결을 원할 경우 콘을 먼저 돌아오는 경주를 진행한다. 4) 하키 배틀을 원할 경우 중앙 검은 선 사이에 마주 서서 풍선을 쳐 상대 검은 선을 넘기면 점수를 얻는다.</p>
