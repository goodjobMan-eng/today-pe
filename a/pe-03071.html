<h1>도둑의 모자를 벗겨라</h1>
<p>1) 술래를 한 명 정하고 나머지는 모자(도둑)를 쓴 채 술래를 피해 도망 다닌다. 2) 술래는 한 손을 머리에 얹고 돌아다니며 다른 한 손으로 도둑 친구들의 모자를 벗긴다. 3) 술래가 도둑의 모자를 벗기면 그 모자를 술래가 쓰고, 잡힌 도둑의 손을 잡고 2인 1조로 술래가 되어 놀이를 계속한다. 4) 도망 다니던 도둑이 술래에게 모자를 빼앗으면 모자의 주인은 술래에게서 풀려나며, 모든 도둑이 잡히면 놀이가 끝난다.</p>
