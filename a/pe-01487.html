<h1>무릎 구르기 배트맨 회전 놀이</h1>
<p>1) 보호자(보조자)는 무릎을 꿇거나 편안히 앉고, 어린이는 보호자의 무릎 위에 배를 대고 엎드린다. 2) 보호자는 어린이의 골반이나 양다리를 단단하게 잡고 안정된 상태를 확인한다. 3) &quot;하나, 둘, 셋&quot; 구호에 맞춰 어린이를 앞뒤로 가볍게 흔들며 회전할 준비를 한다. 4) 무릎 위에서 어린이를 뒤쪽으로 굴려 바닥 매트로 부드럽게 뒤집어 착지하며 뒤공중 회전 감각을 익힌다.</p>
