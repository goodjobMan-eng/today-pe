<h1>공기놀이</h1>
<p>1) 공기알 5개가 잘 흩어지도록 바닥에 뿌린다. 2) 1단계는 하나씩, 2단계는 두 개씩, 3단계는 세 개를 먼저 잡고 나머지 하나를, 4단계는 네 알을 한 번에 잡아 낚아챈다. 3) 공기 하나를 위로 던진 사이에 검지손가락으로 바닥을 쓸어주는 '고추장'을 한다. 4) 공기알을 손바닥에서 위로 던져 손등 위에 올리고 다시 잡아채는 '꺾기'로 점수를 획득한다.</p>
