<h1>등에 스티커 붙이기 놀이</h1>
<p>1) 활동 구역을 그리고 안전 구역을 고려하여 경기장을 구성한다. 2) 각자 스티커를 들고 경기장 안에 적당한 거리를 두고 대기한다. 3) 시작 신호와 함께 서로를 쫓아 친구의 등에 스티커를 붙인다. 4) 쫓아오는 상대를 피해 경기장을 벗어나지 않도록 하며, 등에 스티커가 붙은 학생은 대기 구역으로 이동한다.</p>
