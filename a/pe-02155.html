<h1>전래 한 줄 고무줄놀이</h1>
<p>1) 두 명의 술래가 마주 서서 고무줄을 잡고 높이를 발목, 무릎, 엉덩이, 가슴, 머리, 만세 순으로 높여가며 준비한다. 2) 노래에 맞춰 고무줄을 밟거나, 뛰어넘거나, 줄을 감았다 푸는 정해진 동작을 수행한다. 3) 동작을 틀리거나 줄에 걸리지 않고 완수하면 다음 높이 단계로 올라간다. 4) 동작 도중 줄을 놓치거나 실수하면 술래와 역할을 바꾼다.</p>
