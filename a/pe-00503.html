<h1>펀치 마리오네트 리듬 스텝</h1>
<p>1) 바닥에 서서 양팔과 두 발을 이용해 정해진 리듬에 맞춰 펀치와 스텝 동작을 할 준비를 합니다. 2) 먼저 가볍게 뛰며 주먹을 앞으로 두 번, 옆으로 두 번 지르는 동작을 손발을 맞춰 연습합니다. 3) 벽을 치는 느낌으로 손동작을 명확히 하고 하체 스텝과 상체 동작의 엇박자 리듬을 유지합니다. 4) 동작이 익숙해지면 주먹을 앞, 옆, 위 방향으로 2회씩 번갈아 뻗는 등 단계를 높여 진행합니다.</p>
