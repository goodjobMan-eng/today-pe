<h1>리듬봇과 함께하는 리듬 표현 활동</h1>
<p>1) 소리 속에서 리듬을 찾아 걷기, 점프하기, 손 뻗기, 찌르기, 한 발 짚기 동작으로 기본 리듬을 익힌다. 2) 박수치기, 사이드 스텝, 팔다리 당기기, 팔다리 뻗기 등 다양한 신체 동작을 연결하여 리듬을 표현한다. 3) 수건을 소품으로 활용하여 흔들기, 당기기, 감기 등 도구를 이용한 리듬 동작을 수행한다. 4) 익힌 여러 동작을 조합하여 음악과 리듬에 맞춰 자유롭게 춤추며 표현한다.</p>
