<h1>개구리 발박수 치기 물구나무 놀이</h1>
<p>1) 양손을 어깨너비로 바닥에 짚고 개구리처럼 웅크린 자세를 잡습니다. 2) 양손으로 바닥을 단단히 지지하며 엉덩이와 하체를 공중으로 힘차게 들어 올립니다. 3) 공중에 뜬 순간 양 발바닥을 마주쳐 '탁' 소리가 나게 박수를 친 뒤 가볍게 착지합니다. 4) 1회 성공 후 공중에서 2회, 3회 연속으로 발박수를 치거나, 공중에서 발로 가위바위보를 하는 게임으로 발전시킵니다.</p>
