<h1>꼬깔콘 축구 (휘트헨푸스발)</h1>
<p>1) 각 선수가 콘을 하나씩 손에 들고 경기에 참여한다 2) 공은 발로 차서 패스하거나 슛을 하지만 받을 때는 반드시 손에 든 콘으로 받아내야 한다 3) 콘으로 공을 잡은 선수는 움직임이 제한되며 상대 선수를 콘이나 몸으로 터치하여 점수를 얻을 수도 있다 4) 상대 팀 골대에 공을 넣어 골을 성공시켜 득점한다</p>
