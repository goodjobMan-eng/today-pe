<h1>리듬 축구 체조</h1>
<p>1) 자신이 좋아하는 신나는 음악을 선곡하고 스피커를 준비한다.2) 음악의 리듬과 박자에 맞추어 축구 기본 동작(패스, 드리블 등)을 연결한다.3) 개인 또는 2인 1조로 통일된 축구 기본 동작을 함께 수행한다.4) 숙련도에 따라 공중 리프팅이나 다이렉트 패스를 추가하여 연속 동작을 완성한다.</p>
