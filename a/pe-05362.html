<h1>캐논 런처 발사 및 캐치 놀이</h1>
<p>1) 런처 통 안에 공을 절반 정도 넣고 파트너 방향으로 조준한다.2) 발로 발판을 밟아 공을 발사하고 맞은편 파트너가 날아오는 공을 잡는다.3) 잡은 후 역할을 바꾸어 반복한다.4) 공 대신 콩주머니를 넣어 발사하거나, 몸을 돌려 뒤꿈치로 밟아 날리는 힐 블라스트 방식을 적용한다.</p>
