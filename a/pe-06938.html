<p>1) 중앙선을 경계로 두 팀으로 나뉘어 매트 위에 등을 대고 눕는다 2) 엉덩이와 등을 매트에 붙인 채 발만 매트 밖으로 내밀어 발로 대형 공을 찬다 3) 상대 팀 선수들의 머리 위로 공을 넘겨 차면 득점한다 4) 수비 시에는 손을 사용해 공이 머리 위로 넘어가지 않도록 막을 수 있으며, 넘어가면 상대 팀 득점이 된다</p>
