<h1>다양한 방법으로 공 굴리기</h1>
<p>1) 양발을 앞뒤로 벌리고 양손으로 큰 공을 밀듯이 굴린다. 2) 한쪽 무릎을 굽혀 바닥에 대고 두 손으로 타원형 공을 바닥에 굴린다. 3) 양발을 앞뒤로 벌리고 허리를 숙여 한 손으로 작은 공을 굴린다.</p>
