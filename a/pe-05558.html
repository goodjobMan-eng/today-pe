<h1>교실 네트 방청소 게임</h1>
<p>1) 교실 중앙에 네트를 설치하고 양 팀 구역 바닥에 원마커를 흩어 놓는다.2) 신호가 울리면 자기 팀 구역에 있는 원마커를 집어 네트 위로 상대 팀 코트에 넘긴다.3) 한 번에 원마커를 1개씩만 집어서 넘겨야 한다.4) 정해진 제한 시간이 끝났을 때 자기 진영에 남은 원마커 수가 적은 팀이 승리한다.</p>
