<h1>엑스(X) 캐치볼 놀이</h1>
<p>1) 두 사람이 4~5m 정도 간격을 두고 마주 보고 섭니다. 2) 한 사람이 양손으로 밑에서부터 공을 던져 상대방에게 패스합니다. 3) 상대방은 두 팔을 교차(X자 형태)하여 공을 받아내면 앞으로 한 걸음 전진할 수 있습니다. 4) 공을 제대로 잡지 못하고 떨어뜨리면 패배하며, 얼굴을 향해 던지지 않도록 주의하고 안전하고 부드러운 공으로 즐깁니다.</p>
