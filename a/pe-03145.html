<h1>비이동 움직임 균형 잡기</h1>
<p>1) 한 손으로 매트를 짚고 양발을 일자로 뻗으며 다른 쪽 팔을 벌려 손과 발로 균형을 잡는다. 2) 한쪽 손과 반대쪽 무릎으로 바닥을 짚고 다른 쪽 손과 발은 바닥에 닿지 않게 유지한다. 3) 양팔을 옆으로 벌리고 한쪽 다리를 뒤로 들어 올리거나, 두 손과 엉덩이에 체중을 분산해 균형을 잡는다. 4) 두 친구가 발을 맞대고 앉아 손을 잡고 무릎을 펴거나, 안쪽 발을 맞대고 팔짱을 낀 채 바깥쪽 팔을 옆으로 뻗어 균형을 잡는다.</p>
