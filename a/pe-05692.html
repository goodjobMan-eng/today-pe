<h1>거꾸로 액션</h1>
<p>1) 교사가 고/스톱, 다운/점핑, 펀치/킥 6가지 지시어를 안내하고 처음에는 지시대로 동작한다.2) 익숙해지면 교사의 지시와 정반대로 움직이는 '거꾸로 액션'에 도전한다(고↔스톱, 다운↔점프, 펀치↔킥).3) 학생들은 고리 팔찌 5개를 착용하고 시작하여 틀릴 때마다 1개씩 뺀다.4) 정해진 시간 후 고리 팔찌가 가장 많이 남아 있는 학생이 승리한다.</p>
