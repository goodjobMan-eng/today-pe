<h1>핸디를 피해라</h1>
<p>1) 전체 인원을 2팀으로 나누고, 각 팀의 첫 번째 주자는 핸드볼 공을 들고 대기하다가 출발 신호에 맞춰 출발한다. 2) 골에어리어 라인에 도달하면 핸드볼 골대에 슛을 해 골을 넣는다. 3) 한 번의 슛 기회가 끝나면 빠르게 달려와 다음 주자에게 공을 건네고, 릴레이로 동일하게 진행한다. 4) 한 번 공이 들어간 구멍으로 골을 넣어도 골로 인정되지 않으며, 모든 구멍에 먼저 골인을 시키는 팀이 승리한다.</p>
