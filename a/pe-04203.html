<h1>삼각형 태그 술래잡기</h1>
<p>1) 4명이 한 모둠을 이루어 3명은 서로 안쪽을 바라보고 손을 잡아 삼각형 대형을 만들고, 1명은 술래가 된다. 2) 삼각형을 이룬 3명 중 술래의 맞은편에 위치한 학생 1명이 태그 목표가 된다. 3) 술래는 삼각형 외곽을 시계 방향이나 반시계 방향으로 돌며 목표 학생을 터치하려 하고, 삼각형 3명은 함께 움직여 이를 방어한다. 4) 술래는 삼각형 안쪽을 가로지를 수 없으며, 목표 학생을 태그하는 데 성공하면 역할을 교대한다.</p>
