<h1>손가락 빵야</h1>
<p>1) 한 손을 머리 위로 들고 자유롭게 돌아다닌다 2) 1~5까지 숫자 중 원하는 숫자를 손가락으로 표시한다 3) 사냥꾼이 숫자를 외치며 총을 쏘면 해당 숫자만큼 손가락을 든 친구들은 쓰러진다 4) 생존한 친구들은 쓰러진 친구의 팔을 잡아 일으켜 세운다</p>
