<h1>노바운드 농구</h1>
<p>1) 양 팀으로 나뉘어 드리블 없이 오직 노바운드 패스로만 이동하며 경기를 진행한다.2) 공을 잡은 선수는 이동할 수 없으나 피벗은 가능하며, 공을 소유하지 않은 선수는 자유롭게 이동한다.3) 수비수는 공격수가 쥐고 있는 공을 뺏을 수 없고 패스된 공만 가로챌 수 있다.4) 전후반 10분씩 경기하여 상대 골대에 슛을 성공해 더 많은 득점을 올린 팀이 승리한다.</p>
