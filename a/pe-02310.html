<h1>콩콩 콩주머니 모으기</h1>
<p>1) 네 명이 한 모둠이 되어 한 줄로 선다. 2) 모둠별로 한 명씩 번갈아 한 발로 뛰고 균형을 잡으며 콩주머니를 줍고 돌아온다. 3) 뛰는 발을 제외한 다른 신체 부위가 땅에 닿거나 원마커 밖에 착지하면 다른 팀으로 기회가 넘어가며 콩주머니를 가지고 있을 경우 원래 자리에 되돌려 놓는다. 4) 정해진 시간 동안 콩주머니를 가장 많이 획득한 모둠이 승리한다.</p>
