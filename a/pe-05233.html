<h1>게임화 성공 루브릭을 적용한 스테이션 활동</h1>
<p>1) 콘 캐처 및 벨크로 훌라후프 표적 맞히기 스테이션을 진행한다.2) 패들로 폼 테니스공을 벽에 연속으로 치며 성공 횟수를 기록한다.3) 자석 다트를 던져 맞힌 점수에 따라 점수를 획득하며 바닥에 떨어지면 0점 처리한다.4) 스틱으로 풍선을 치며 정해진 횟수(최대 20회)에 도달하도록 사다리 방식으로 도전한다.</p>
