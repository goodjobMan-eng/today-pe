<h1>거미줄 통과하기</h1>
<p>1) 6명씩 두 모둠으로 나누어 한 모둠은 높이가 다르게 줄을 엮어 잡고 입구와 출구를 정한다. 2) 다른 모둠은 한 명씩 입구에서 출구까지 몸을 움직여 줄 사이를 통과한다. 3) 줄에 몸이 걸리면 탈락한다. 4) 역할을 바꾸어 게임을 진행하고 줄을 통과한 모둠원이 더 많은 모둠이 승리한다.</p>
