<h1>농구 원핸드 슛 기본자세 연습</h1>
<p>1) 골대 가까이에 서서 골대를 정면으로 바라보고 선다. 2) 주 손을 공 밑에 받치고 팔꿈치를 L자 모양으로 유지한다. 3) 무릎을 굽혔다 펴면서 팔꿈치를 뻗고 손목을 스냅하여 공에 백스핀을 주며 슛한다. 4) 기본 동작이 익숙해지면 반대 손을 가이드 핸드로 공 옆에 대고 보조하며 슛한다.</p>
