<h1>1대 1 배틀 주사위 피구</h1>
<p>1) 가위바위보를 하여 이긴 사람이 주사위의 홀수나 짝수를 정하고 먼저 굴린다.2) 나온 눈에 해당하는 사람이 공을 잡고 '얼음'을 외치면 상대는 멈춘다.3) 공을 잡은 사람은 세 발까지 걸어가서 던지며, 맞히면 상대의 팔찌를 획득하고 상대가 공을 잡으면 반대로 팔찌를 넘겨준다.</p>
