<h1>펀치 마리오네트 점프</h1>
<p>1) 제자리에서 발을 모았다 벌리는 점프 동작을 리듬감 있게 반복합니다. 2) 발 동작과 동시에 주먹을 앞으로 2회, 옆으로 2회 지르는 펀치 동작을 연결합니다. 3) 단계가 올라가면 앞 2회, 옆 2회에 이어 위로 2회 펀치를 추가해 총 6회 동작으로 확장하고, 마지막 단계에서는 앞으로 찌를 때는 주먹, 옆으로 뻗을 때는 손바닥을 펴서 벽을 터치하듯 손 모양을 바꿉니다. 4) 점차 템포를 빠르게 올려 민첩성과 신체 협응력을 기릅니다.</p>
