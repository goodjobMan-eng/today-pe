<h1>배드민턴 숏서브 롱서브 연습</h1>
<p>1) 엄지손가락이 위로 올라오게 백핸드형 그립으로 라켓을 잡는다. 2) 엄지와 검지로 셔틀콕을 잡고 라켓 면 앞쪽에 놓는다. 3) 짧게 보내는 숏서브와 뒤로 멀리 보내는 롱서브를 모션을 잡고 번갈아 연습한다. 4) 라켓 헤드를 뒤로 물러서 공간을 확보한 뒤 셔틀콕을 맞힌다.</p>
