<h1>다리 사이 사람 통과 릴레이</h1>
<p>1) 모둠원들이 한 줄로 서서 다리를 벌려 터널을 만듭니다.2) 1번 주자가 반환점을 돌아와 모둠원들의 다리 사이로 몸을 통과합니다.3) 다리 사이를 빠져나온 주자가 뒤쪽에 붙어 엎드리거나 자세를 낮추면 다음 주자가 출발합니다.4) 모든 팀원이 차례로 다리 사이를 통과하여 먼저 완주하는 팀이 승리합니다.</p>
