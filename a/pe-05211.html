<h1>초등 체육 선택 활동 시간 (초이스 타임)</h1>
<p>1) 체육관 구역별로 줄넘기, 플라즈마 카, 레이저 스쿠터, 체조 매트, 농구 코트 등을 배치한다.2) 놀이기구를 기다릴 때는 콘 뒤에 줄을 서서 2분 타이머를 맞추고 차례를 기다린다.3) 타이머가 끝나면 타고 있던 학생이 기구를 반납하고 다음 학생이 탑승한다.4) 농구 구역에서는 팀 조끼를 입고 3대3 또는 4대4 풀코트 경기를 하거나 자유롭게 슛을 연습한다.</p>
