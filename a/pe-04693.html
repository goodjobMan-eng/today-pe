<h1>난파선 탈출(Shipwreck)</h1>
<p>1) 팀원들과 지급받은 도구를 활용해 체육관 바닥을 건너 섬들을 거쳐 반대편으로 이동한다. 2) 단서 종이의 암호를 풀어 자물쇠 상자들을 순서대로 열어 나간다. 3) 상자를 열 때마다 새로운 도구를 획득하여 이동 경로를 계속 확장한다. 4) 마지막 상자까지 해제하고 모든 팀원이 끝에 있는 3개의 훌라후프 안으로 무사히 이동하면 탈출에 성공한다.</p>
