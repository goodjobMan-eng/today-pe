<h1>꼬리잡기 술래</h1>
<p>1) 각자 허리에 꼬리 끈을 찬다. 2) 코트 안에서 상대의 꼬리를 뺏고 자신의 꼬리를 빼앗기지 않게 도망친다. 3) 꼬리를 빼앗겨도 탈락하지 않고 계속해서 상대의 꼬리를 뺏으러 다닐 수 있다. 4) 정해진 제한 시간 안에 꼬리를 가장 많이 뺏은 사람이 승리한다.</p>
