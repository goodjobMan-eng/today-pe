<h1>뉴질랜드 고무줄놀이</h1>
<p>1) 양 끝의 두 사람이 긴 고무줄을 다리에 걸쳐 팽팽하게 고정한다. 2) 도전자 1명이 구호 리듬에 맞춰 고무줄 안팎을 오가며 발로 줄을 밟거나 걸쳐 넘는다. 3) 성공할 때마다 고무줄의 높이를 발목에서 무릎, 겨드랑이 높이로 점차 올려 도전한다.</p>
