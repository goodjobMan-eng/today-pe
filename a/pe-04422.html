<h1>픽 잇 업(Pick It Up)</h1>
<p>1) 출발선에서 원하는 원마커로 이동한다. 2) 원마커 위에서 버킷을 향해 콩주머니를 언더핸드로 던진다. 3) 콩주머니가 버킷에 들어가면 원마커를 챙겨서 돌아온다. 4) 팀원들과 원마커를 모아 한 더미로 쌓으면 승리한다.</p>
