<h1>공 던지기와 잡기</h1>
<p>1) 두 손으로 공을 잡고 머리 위로 올려 앞으로 던지고 머리 위로 오는 공을 잡습니다. 2) 두 손으로 공을 잡고 가슴 높이에서 팔을 앞으로 뻗으며 던지고 날아오는 공을 가슴 쪽으로 당기며 잡습니다. 3) 한 손으로 공을 잡고 허리 아래에서 위로 올리면서 던집니다. 4) 자세를 낮추고 위에서 아래로 떨어지는 공을 손바닥과 손가락을 이용해 잡습니다.</p>
