<h1>황금 단지 찾기 피트니스 게임</h1>
<p>1) 화면에 제시된 세 가지 물건 중 황금 단지가 숨겨져 있을 것 같은 하나를 고른다. 2) 자신이 선택한 물건 위에 표시된 운동 동작을 확인한다. 3) 타이머가 줄어드는 동안 해당 운동 동작을 반복해서 수행한다. 4) 시간이 종료되면 황금 단지가 숨겨진 정답 위치가 공개된다. 5) 새로운 라운드마다 다른 물건을 선택하며 다양한 전신 운동을 이어간다.</p>
