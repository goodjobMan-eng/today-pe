<h1>토카 프리스비 (원반 패스 터치 게임)</h1>
<p>1) 경기장 양쪽에 팀별로 마주 보고 서며, 한 팀에게 프리스비를 준다. 2) 프리스비를 상대 진영으로 던지면 상대 팀은 원반이 공중에 떠 있는 동안 팀원이 터치한 후 최종 포구한다. 3) 공중에서 터치한 횟수만큼 점수를 획득하며, 아무도 터치하지 않고 바로 잡거나 떨어뜨리면 0점이 된다.</p>
