<h1>플로어볼 채로 공을 몰아 친구에게 이어 주고 슛하기</h1>
<p>1) 1번 친구는 공을 몰아 콘을 지그재그로 통과합니다. 2) 물기 구역이 끝날 때쯤 대기 장소에 있는 친구에게 공을 이어 줍니다. 3) 이어 주기 구역에서 공을 주고받으며 슛 구역까지 이동합니다. 4) 1번 친구가 슛을 하고 이어 주기 구역의 대기 장소로 갑니다. 5) 1번 친구가 친 공은 대기 장소에 있던 친구가 가지고 출발선으로 가서 뒤에 습니다.</p>
