<h1>윈드 완드 저항 리듬 체조</h1>
<p>1) 완드를 한 손에 잡고 몸 앞쪽에서 큰 원을 그리며 돌리고 반대 방향으로도 돌린다. 2) 반대쪽 손으로 바꾸어 잡고 같은 방식으로 원을 돌린 후, 머리 위로 올려 큰 원을 그린다. 3) 완드로 몸 앞에서 숫자 8자(피겨 에잇) 모양을 그리며 움직인다. 4) 양손에 완드를 하나씩 잡고 끝부분을 쥔 채 동시에 큰 원을 돌리며 교실/강당을 2바퀴 행진한다.</p>
