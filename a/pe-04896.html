<h1>달리기가 빨라지는 동물 걷기 5가지</h1>
<p>1) 곰처럼 손과 발을 가능한 한 크게 앞으로 내밀며 네 발로 걷습니다.2) 게처럼 옆으로 몸을 크게 움직이며 걷습니다.3) 개구리처럼 손을 멀리 짚고 몸을 크게 띄우며 앞으로 뜁니다.4) 다른 동물 동작으로 몸 전체를 크고 빠르게 움직입니다.5) 다섯 가지 동물 걷기 동작을 차례대로 수행하며 몸을 크게 쓰는 감각을 익힙니다.</p>
