<h1>언더서브 목적타 서브 게임</h1>
<p>1) 반대쪽 코트에 훌라후프를 배치하고 서브 라인에 선다. 2) 공을 가볍게 띄운 후 주먹을 쥐고 공의 아래쪽을 올려쳐서 언더서브를 넣는다. 3) 훌라후프 안에 서브가 떨어지면 2점, 훌라후프 밖 코트 안에 들어가면 1점을 획득한다. 4) 1인당 3번씩 도전하여 팀원들의 점수를 모두 합산해 총점이 높은 팀이 승리한다.</p>
