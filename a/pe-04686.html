<h1>손 씻기 저름 볼 굴리기 피구</h1>
<p>1) 코트 중앙에 배구 네트를 낮게 설치하고 양쪽에 노란 팀과 초록 팀으로 나뉘어 선다. 2) 공을 머리 위로 던지지 않고 허리를 숙여 네트 밑으로 굴려 상대방의 발이나 다리를 맞힌다. 3) 공에 맞은 사람은 바닥에 앉아 비누 스쿠터를 탄 도우미가 올 때까지 대기한다. 4) 비누 스쿠터 주자가 오면 손을 씻는 흉내를 내며 20초를 세거나 알파벳 노래를 부른 뒤 부활하여 다시 참여한다.</p>
