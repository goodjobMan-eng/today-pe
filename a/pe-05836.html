<h1>변형 스피드볼 게임</h1>
<p>1) 5명씩 두 팀으로 나누어 농구 코트에서 진행한다.2) 한 팀이 엔드라인(베이스라인)에서 공을 가지고 패스를 시작한다.3) 공을 가진 사람은 이동할 수 없으며 패스로 반대편 엔드라인까지 도달한다.4) 공을 떨어뜨리면 상대 팀에게 공격권이 넘어간다.</p>
