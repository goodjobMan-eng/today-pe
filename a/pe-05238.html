<h1>도미노 피트니스</h1>
<p>1) 학생들은 각자 도미노 블록 1개(또는 플래시카드)를 가지고 시작한다.2) 짝을 만나 서로의 도미노를 보여주고 일치하는 숫자의 개수(2개, 3개, 4개 일치)를 확인한다.3) 일치 개수에 따라 빔프로젝터 화면에 안내된 해당 운동 활동을 함께 수행한다.4) 활동이 끝나면 서로 도미노를 맞바꾼 뒤 새로운 짝을 찾아 이동한다.</p>
