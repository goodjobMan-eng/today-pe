<h1>포지션 체인지 주먹야구</h1>
<p>1) 가위바위보로 1등 타자, 2등 포수, 3등 투수, 4등 내야수, 5등 외야수 역할을 정한다.2) 타자가 공을 치고 베이스를 돌아 점수를 획득하며, 아웃 없이 점수만 누적한다.3) 수비팀은 뜬공을 잡더라도 모든 수비수를 거쳐 포수에게 공을 전달해야 하며, 타격이 끝나면 포지션을 한 자리씩 교대한다.</p>
