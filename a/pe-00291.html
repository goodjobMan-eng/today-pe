<h1>무궁화 꽃이 가위바위보</h1>
<p>1) 술래는 벽 쪽에 서고 나머지 참여자들은 반대편 출발선에 정렬합니다. 2) 술래가 '무궁화 꽃이 가위바위보'를 외치며 머리 위로 손을 내밀면 참여자들도 동시에 가위바위보를 냅니다. 3) 술래를 이긴 사람은 앞으로 두 걸음, 비긴 사람은 한 걸음을 크게 이동하며, 진 사람은 술래 옆에 서서 새끼손가락을 걸고 이어집니다. 4) 참여자가 잡힌 사람의 손가락을 끊으면 술래는 친구들을 쫓아가 터치하고, 터치당한 사람이 새 술래가 됩니다.</p>
