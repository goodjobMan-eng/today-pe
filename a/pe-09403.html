<h1>풍가루(라켓과 풍선) 활용 체육 활동</h1>
<p>1) 음악에 맞춰 전신 준비운동을 한다. 2) 라켓(풍가루) 위에 솜털공(탱탱볼)을 올려놓고 떨어뜨리지 않고 돌아오기를 한다. 3) 풍가루로 솜털공 맞히기 게임을 한다. 4) 풍선을 바닥에 떨어뜨리지 않고 누가 많이 치는지 시합을 한다. 5) 풍가루와 솜털공을 사용하여 과녁판 점수 획득하기 게임을 한다.</p>
