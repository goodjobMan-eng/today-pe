<h1>신발 릴레이 (Shoe Relay)</h1>
<p>1) 모든 참가자는 신발 한 짝을 벗어 활동 구역 한가운데에 모아 둔다. 2) 팀을 나누어 일렬로 출발선에 선다. 3) 신호가 울리면 각 팀의 첫 번째 주자가 신발을 신은 발로만 깽깽이걸음(호핑)으로 신발 더미까지 이동한다. 4) 자기 신발을 찾아 신고 끈을 묶은 뒤 팀으로 달려오고, 다음 주자가 출발한다. 5) 모든 팀원이 완료하여 자리에 앉으면 게임이 끝나며, 반대쪽 발로 다시 진행한다.</p>
