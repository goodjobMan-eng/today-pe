<h1>쥐와 토끼 (래츠 앤 래비츠) 달리기 게임</h1>
<p>1) 두 참가자는 각각 '쥐(Rat)'와 '토끼(Rabbit)' 역할을 정하고 두 목표 지점 사이 중앙에서 등이나 옆을 마주보고 선다. 2) 신호자가 &quot;Rat&quot;을 외치면 쥐는 자신의 목표 지점(의자)으로 달아나고 토끼는 도착 전 태그를 시도한다. 3) 신호자가 &quot;Rabbit&quot;을 외치면 토끼는 자신의 목표 지점(공)으로 달아나고 쥐가 쫓아가 태그를 시도한다.</p>
