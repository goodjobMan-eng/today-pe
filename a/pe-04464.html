<h1>동물 흉내 정글 런 릴레이</h1>
<p>1) 4~5개 팀으로 나누어 출발선에 줄을 서서 앉는다. 2) 첫 번째 주자가 지시된 동물 움직임으로 반대편 끝 콘까지 이동해 터치하고 돌아와 다음 주자와 하이파이브한다. 3) 치타(빠르게 달리기), 개구리(두 발 모아 뛰기), 꽃게(옆으로 게걸음 이동) 흉내를 내며 릴레이를 진행한다. 4) 벌/말벌(뒤로 조심해서 달리기), 말(다리를 곧게 펴고 갤럽으로 달리기) 동작을 순서대로 수행한다.</p>
