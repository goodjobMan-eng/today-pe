<h1>콩주머니 수집 탈환 대작전</h1>
<p>1) 중앙 훌라후프에 콩주머니들을 모아두고 각 모둠은 자기 베이스 훌라후프 뒤에 일렬로 대기한다. 2) 신호가 울리면 각 모둠 1번 주자가 달려가 콩주머니를 1개씩 집어 자기 베이스로 가져와 터치한다. 3) 중앙의 콩주머니가 바닥나면 다른 모둠 베이스로 달려가 콩주머니를 1개씩 빼앗아 올 수 있다. 4) 정해진 시간(2~3분)이 종료되었을 때 자기 베이스에 콩주머니를 가장 많이 모은 모둠이 승리한다.</p>
