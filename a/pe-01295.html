<h1>신체 접촉 없는 교과 수업놀이</h1>
<p>1) 교실에서 학생들은 마스크를 착용하고 개인 간 거리를 유지하며 자리에 앉거나 지정된 위치에 섭니다. 2) 신체적 접촉 없이 서로 거리를 둔 채 짝 또는 모둠과 시선 및 동작으로 소통하는 규칙을 안내받습니다. 3) 진행자의 신호나 교과 활동 문제에 맞춰 정해진 비접촉 신체 동작이나 응답 신호를 정확히 수행합니다. 4) 모둠별 순서나 응답 속도, 미션 완수 여부를 점검하며 난도를 점진적으로 높여 즐깁니다.</p>
