<h1>곰들이 온다! (사냥꾼 술래잡기)</h1>
<p>1) 체육관 양쪽에 사냥꾼 구역 라인을 긋고 사냥꾼을 배치하며 나머지 학생들은 체육관 한쪽 끝 출발선에 선다. 2) 사냥꾼은 라인을 따라서만 좌우로 움직일 수 있으며 &quot;곰들이 온다!&quot;라고 신호를 외친다. 3) 신호가 떨어지면 모든 학생은 반대편 체육관 끝으로 건너가야 하고 도중에 태그된 사람은 사냥꾼이 되어 라인에서 함께 잡는다.</p>
