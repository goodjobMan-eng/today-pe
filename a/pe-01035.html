<h1>손등 컵 균형 유지 흔들흔들 술래잡기</h1>
<p>1) 술래 1명을 정하고 술래와 도망자는 서로 다른 색의 스태킹 컵을 각자 1개씩 준비한다. 2) 엄지를 뺀 네 손가락을 모은 채 손등 위에 컵의 좁은 바닥면을 올린다. 3) 손등 위의 컵 중심을 잡으며 술래를 피해 교실 안을 자유롭게 도망다닌다. 4) 술래에게 터치당하거나 손등의 컵을 떨어뜨리면 탈락하며, 술래 컵이 먼저 떨어지면 새 술래를 뽑거나 끝까지 남은 사람이 다음 술래가 된다.</p>
