<h1>콩주머니 전달 놀이</h1>
<p>1) 원을 따라 모둠원 수만큼 삼각콘을 놓고 한 명씩 선 뒤 번호를 확인합니다. 2) 1번이 가슴에 콩주머니를 얹고 균형을 잡아 2번 자리로 이동하고, 번호순으로 손등, 머리, 어깨에 올려 다음 자리로 전달합니다. 3) 전달이 끝나면 교사의 신호에 맞춰 원 가운데로 콩주머니를 던집니다.</p>
