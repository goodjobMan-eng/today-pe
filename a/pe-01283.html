<h1>제자리 몸으로 말해요 모둠 놀이</h1>
<p>1) 4인 1모둠으로 책상을 마주 보게 배치하고 종이를 8칸으로 접어 몸으로 표현할 단어 8개를 적는다. 2) 가위바위보로 순서를 정해 출제자가 종이 양 끝의 단어 중 하나를 골라 찢고 일어서서 몸짓으로 설명한다. 3) 모둠원들은 손을 들고 정답을 맞히며, 맞힌 학생이 다음 출제자가 되어 자신의 단어를 설명한다. 4) 설명이 어려울 때는 글자 수나 초성 힌트를 주고, 모둠원 전체가 8장의 단어를 모두 찢어 성공할 때까지 협동한다.</p>
