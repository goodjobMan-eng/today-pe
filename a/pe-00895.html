<h1>레벨업 3! 바다 모험 타바타 홈트레이닝</h1>
<p>1) 화면 속 캐릭터의 동작에 맞춰 제자리에서 수영 동작을 하며 앞으로 나아갑니다. 2) 바닥으로 다가오는 조개껍데기가 나타나면 타이밍에 맞춰 가볍게 점프하여 피합니다. 3) 날아오는 펠리컨이나 해파리가 보이면 재빨리 몸을 웅크려 머리 위로 지나가게 숙입니다. 4) 레벨이 올라갈수록 등장하는 돌고래는 엎드린 배 자세(플랭크/스윔)로, 상어는 등을 대고 누운 자세로 피하며 보물상자까지 도달합니다.</p>
