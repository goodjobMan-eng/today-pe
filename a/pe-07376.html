<h1>대장을 지켜라</h1>
<p>1) 각 팀에서 스티로폼 막대를 든 추격자 1명과 팀 조끼를 입은 대장 1명을 선발한다. 2) 각 팀원들은 라바콘을 중심으로 손을 잡고 원을 만들며, 추격자는 상대 팀 원 앞에 선다. 3) 놀이가 시작되면 팀원들은 추격자가 대장을 터치하지 못하도록 라바콘을 중심으로 회전한다. 4) 우리 팀 추격자가 상대 팀 대장을 먼저 터치하거나, 상대 팀 원이 먼저 끊어지거나 라바콘을 벗어나면 승리한다.</p>
