<h1>보치아 경기</h1>
<p>1) 선공이 흰색 표적구(잭볼)를 경기 구역 안으로 던진다. 2) 선공 빨간색 팀이 첫 공을 던진 후 후공 파란색 팀이 공을 던진다. 3) 표적구에서 더 먼 팀이 계속해서 다음 공을 던진다. 4) 양 팀 모두 6개의 공을 다 던지면 점수를 계산하며, 표적구에 더 가까운 색상의 팀이 승리한다. 5) 상대 팀의 가장 가까운 공보다 표적구에 더 가까이 놓인 공 1개당 1점을 얻는다.</p>
