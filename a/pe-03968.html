<h1>포켓몬 표적 맞히기 릴레이</h1>
<p>1) 모둠별로 활동 구역 둘레에 위치하고, 중앙에 훌라후프와 유아용 풀장 표적을 배치한다. 2) 팀원들이 차례대로 공(포켓볼)을 굴리거나 던져 중앙 표적 안에 넣는다. 3) 공이 훌라후프에 들어가면 1장, 유아용 풀장에 들어가면 2~3장의 포켓몬 카드를 획득한다. 4) 팀원들이 릴레이 방식으로 번갈아 던지며 가장 많은 카드를 모은다.</p>
