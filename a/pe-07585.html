<h1>지진 놀이 (집과 세입자)</h1>
<p>1) 두 사람이 마주 보고 손을 잡아 집을 만들고, 한 명은 그 안에 들어가 세입자가 된다. 2) 술래가 '집'을 외치면 집을 이룬 두 사람이 손을 잡은 채 다른 세입자를 찾아 이동한다. 3) 술래가 '세입자'를 외치면 세입자들이 나와 다른 집으로 들어가고, '지진'을 외치면 집과 세입자가 모두 해체되어 새로운 3인조를 만든다.</p>
