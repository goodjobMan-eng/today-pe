<h1>알록달록 징검다리 건너기</h1>
<p>1) 4명이 한 모둠이 되어 순서대로 서고 첫 번째 주자가 콩주머니를 머리에 이고 출발선에 선다. 2) 나머지 친구들이 삼색 주사위를 각각 두 번씩 굴린다. 3) 첫 번째 주자는 주사위에 나온 6개의 색깔 순서대로 원마커를 밟고 이동하며 원마커를 밟았을 때는 한 발로 균형을 잡고 셋을 센다. 4) 콩주머니가 떨어지거나 다른 색깔 마커를 밟으면 탈락하며 징검다리를 통과한 모둠원이 많은 팀이 승리한다.</p>
