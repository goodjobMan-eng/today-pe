<h1>동작 카드 창작 라인댄스 놀이</h1>
<p>1) 라인댄스 기본 동작이 적힌 카드 10장을 섞은 후 뒤집어 펼쳐 놓는다. 2) 참가자들은 카드를 2장씩 뽑아 해당 동작을 활용해 각자 동작을 만든다. 3) 개별 동작을 8박자에 맞추어 창작한다. 4) 4명이 대열을 맞추어 1열로 선 뒤 각자 창작한 동작을 연결해 음악에 맞춰 연속으로 춤춘다.</p>
