<h1>스페이스 인베이더 (Space Invaders)</h1>
<p>1) 콘으로 만든 6개 베이스에서 첫 번째 주자가 언더핸드 스로우로 맞은편 스페이스 타워(후프·링·핀)를 맞혀 쓰러뜨린다. 2) 빌드 2에서는 타워를 농구공(파워 스테이션)으로 변경하여 더 강한 파워로 던져 후프 밖으로 밀어낸다. 3) 빌드 3에서는 두 팀으로 나뉘어 외계 공간에 있는 메테오를 언더핸드로 던져 맞춰 상대 팀 우주선 진영으로 굴려 넣는다.</p>
