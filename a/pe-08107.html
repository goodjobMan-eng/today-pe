<h1>로그 롤 (Log Roll)</h1>
<p>1) 바닥에 누워 발과 어깨를 바닥에서 뗀 할로우(hollow) 자세를 잡는다. 2) 양팔은 어깨너비로 뻗고 발을 모은 상태로 몸의 긴장을 유지하며 어깨와 골반을 비틀어 구른다. 3) 회전하면서 발과 가슴을 띄운 아치 자세를 거쳐 다시 할로우 자세로 돌아온다.</p>
