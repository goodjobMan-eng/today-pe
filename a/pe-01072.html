<h1>교실 책상 펀스틱 수비 야구</h1>
<p>1) 수비 팀은 책상 사이사이에 펀스틱(스펀지봉)을 들고 앉아 위치를 잡고, 타자는 배팅 서클에 선다. 2) 타자가 스스로 공을 띄워 손바닥이나 주먹으로 전방을 향해 강타한다. 3) 수비수는 앉은 채 팔과 펀스틱을 뻗어 날아오는 공을 건드리거나 쳐내면 타자를 아웃 처리한다. 4) 수비를 피해 비어 있는 책상(1~3점)을 맞히거나 홈런 줄을 넘기면 득점하며, 매 타자마다 수비 위치를 자유롭게 교체한다.</p>
