<h1>꼬리 뺏기 달리기 게임</h1>
<p>1) 각자 바지 뒤에 꼬리(플래그 또는 스카프)를 꽂고 체육관 안의 빈자리로 흩어진다. 2) 신호가 울리면 자유롭게 뛰어다니며 자신의 꼬리를 지키고 다른 사람의 꼬리를 뺏는다. 3) 자신의 꼬리를 빼앗긴 사람도 탈락하지 않고 계속해서 다른 사람의 꼬리를 뺏을 수 있다. 4) 경기 시간이 끝나거나 모든 꼬리가 사라졌을 때 가장 많은 꼬리를 모은 사람이 승리한다.</p>
