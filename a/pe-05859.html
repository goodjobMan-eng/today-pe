<h1>공 전달 릴레이 (Under, Over - Ball Passing Relay)</h1>
<p>1) 팀원들이 일렬로 줄을 서서 선다.2) 첫 번째 주자부터 시작하여 머리 위(오버)와 다리 사이(언더)로 번갈아가며 뒤로 공을 전달한다.3) 마지막 주자가 공을 받으면 공을 들고 맨 앞으로 달려나간다.4) 모든 팀원이 순서대로 이동하며 팀 전체가 결승선에 도달할 때까지 반복한다.</p>
