<h1>축볼 경쟁 활동</h1>
<p>1) 3m 반경의 포비든 존 밖에서 바운더를 향해 공을 던져 공격을 시도한다. 2) 공격 팀은 최대 3번의 패스 이내에 바운더 그물에 공을 맞혀야 한다. 3) 바운더 그물에 맞고 튕겨 나온 공이 포비든 존 밖 바닥에 떨어지면 공격 팀이 1점을 득점한다. 4) 튕겨 나온 공을 수비수가 받아내면 수비 실패 없이 수비 팀의 공격권으로 전환된다.</p>
