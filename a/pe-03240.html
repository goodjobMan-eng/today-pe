<h1>8자 달리기</h1>
<p>1) 5명에서 10명씩 한 모둠으로 구성하고 바닥에 8자 모양으로 선을 그린다. 2) 모둠원 전체가 오른손에 긴 줄을 잡고 8자 모양의 선 위에 한 줄로 선다. 3) 출발 신호가 울리면 전체가 선을 따라 가볍게 달리다가, 맨 앞사람이 줄을 놓고 빠르게 달려 나가 맨 뒷사람을 따라잡는다. 4) 맨 뒷사람을 따라잡은 후 '고'라고 외치면 다음 앞사람이 달리며, 세 바퀴 이내에 따라잡지 못했거나 지친 사람은 원 안에서 쉬고 마지막에 남은 2명이 이긴다.</p>
