<h1>사냥꾼과 동물 흉내 태그 놀이</h1>
<p>1) 손을 잡고 원을 만들어 준비운동을 한 뒤 사자, 고양이 등 동물 흉내를 내며 기어 다닌다. 2) 참가자 중 한 명이 스펀지봉을 든 사냥꾼 역할을 맡고, 다른 참가자들은 특정 동물 역할을 정해 날개짓을 하거나 점프하며 도망친다. 3) 사냥꾼이 스펀지봉으로 조준해 쫓아오면 동물들은 잡히지 않도록 뛰어다니며 피한다.</p>
