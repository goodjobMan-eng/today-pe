<h1>배구형 공 던져 넘기기 게임</h1>
<p>1) 바닥 경기장 가운데 네트를 두고 양 모둠이 마주 보고 선다. 2) 공을 손으로 치거나 던져서 상대 모둠 구역으로 넘긴다. 3) 공을 받은 친구는 손으로 잡을 수 있으며 직접 넘기거나 모둠원끼리 이어준 뒤 넘긴다. 4) 상대가 공을 못 받거나 네트에 걸리거나 같은 사람이 2번 이상 건드리거나 5번 이상 이어주면 1점을 얻는다.</p>
