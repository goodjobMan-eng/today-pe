<h1>숨은 연주가 찾기 연기 관찰 놀이</h1>
<p>1) 한 모둠이 복도로 나가 들키지 않게 연주하는 척 연기만 할 '숨은 연주가' 1명을 지목해 정합니다. 2) 모둠원 전원이 교실 앞으로 들어와 배운 곡을 리코더로 함께 연주하며 자연스럽게 운지 연기를 펼칩니다. 3) 자리에 앉은 관찰 학생들은 소리와 연주자들의 손가락, 호흡 동작을 세밀하게 관찰하며 추리합니다. 4) 연주 종료 후 관찰 모둠별로 토의하여 숨은 연주가를 지목하고, 연주 위치를 바꾸어 다음 모둠이 도전합니다.</p>
