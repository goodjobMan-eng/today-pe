<h1>키퍼 오브 더 코트</h1>
<p>1) 코트마다 수비자(키퍼)와 도전자 2명이 들어가 3점 내기 단식 경기를 진행한다. 2) 도전자가 패하면 코트 밖으로 나가 줄 맨 뒤로 가거나 다른 코트로 이동하고, 키퍼는 1승을 기록한다. 3) 키퍼가 3승을 거두면 왕관을 획득하고 코트를 나와 화이트보드에 이름을 적은 뒤 원하는 코트의 대기 줄 끝으로 간다. 4) 키퍼가 나간 코트에는 대기 줄의 다음 두 선수가 들어가 가위바위보로 새 키퍼와 도전자를 정한다.</p>
