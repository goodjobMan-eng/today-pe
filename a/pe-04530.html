<h1>민첩성 및 협동 밸런스 미션 과제</h1>
<p>1) 3~4m 간격의 두 콘 사이를 정면을 바라보며 8자 모양으로 10회 왕복 달리기한다. 2) 높은 콘 위에 공을 올려두고 한 발로 서서 코로 공을 건드린 후 일어서기를 7회 실시한다. 3) 발등 위에 빈백을 얹고 공중으로 튕겨 올린 뒤 한 손으로 잡기를 양발 각 10회 실시한다. 4) 한 발로 균형을 잡은 상태에서 긴 폼스틱으로 바닥의 빈백을 최대한 멀리 밀어낸다.</p>
