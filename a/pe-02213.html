<h1>빙고 달리기</h1>
<p>1) 고깔콘 9개를 3개씩 3줄로 세웁니다. 2) 양 팀은 일렬로 서고 맨 앞의 세 사람은 팀 조끼를 들고 출발선에 섭니다. 3) 첫 번째 사람이 달려와 고깔콘 위에 팀 조끼를 올려놓고 돌아옵니다. 4) 네 번째 사람부터는 자기 팀의 조끼를 빙고 만들기 알맞은 위치로 옮겨 놓으며 먼저 한 줄을 완성하는 팀이 승리합니다.</p>
