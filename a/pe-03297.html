<h1>공 이어 나르기</h1>
<p>1) 2명씩 짝을 지어 플레이스틱 2개를 나란히 잡고 그 사이에 공을 올려놓는다. 2) 신호가 울리면 스틱에서 공이 떨어지지 않게 균형을 잡고 이동하여 반환점을 찍고 돌아온다. 3) 앞 주자가 출발선에 들어오면 다음 주자가 공을 건네받아 출발한다. 4) 마지막 주자가 가장 먼저 들어온 모둠이 승리한다.</p>
