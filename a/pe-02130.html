<h1>신문지 한 장 목걸이 가위바위보</h1>
<p>1) 1인당 신문지 1장씩 준비하여 찢어지지 않게 결대로 길게 찢어 하나의 큰 원형 목걸이를 만든다. 2) 완성된 신문지 목걸이를 각자 목에 걸고 교실을 돌아다닌다. 3) 만나는 친구와 &quot;가위바위보&quot;를 하여 진 사람이 이긴 사람의 목에 자신의 신문지 목걸이를 걸어준다. 4) 목걸이를 얻은 사람끼리 계속 대결하여 마지막에 모든 목걸이를 모은 한 사람이 승리한다.</p>
