<h1>색깔 달팽이놀이</h1>
<p>1) 양쪽에 줄을 서서 출발 신호에 맞춰 1번 주자가 색깔판을 따라 달린다. 2) 상대팀과 마주치면 가위바위보를 하고, 이긴 학생은 판을 뒤집으며 전진하고 진 학생은 맨 뒤로 돌아간다. 3) 지면 다음 주자가 빠르게 달려나가며 모든 판을 뒤집거나 제한시간 동안 상대 진영에 더 가까워진 팀이 승리한다.</p>
