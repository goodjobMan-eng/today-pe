<h1>얼티밋 보틀 플립 챌린지</h1>
<p>1) 종이 4장을 바닥에 약 2피트(약 60cm) 간격으로 일렬로 배치하고 물이 일부 채워진 페트병을 준비한다.2) 종이들 뒤에서 출발하여 종이를 하나씩 점프하여 건넌 뒤 돌아선다.3) 페트병을 한 번 던져 세우기를 시도하고, 성공하면 해당 종이를 다음 종이 위에 겹쳐 쌓으며 실패 시 다시 점프해 돌아가 반복한다.</p>
