<h1>매트 브릿지 자세 버티기</h1>
<p>1) 매트에 등을 대고 바르게 누운 뒤 무릎을 세워 발뒤꿈치를 엉덩이 가까이 당깁니다. 2) 손바닥을 귀 옆 매트에 짚되 엄지손가락이 귀 옆을 향하도록 손가락을 어깨 쪽으로 돌려 놓습니다. 3) 손과 발로 매트를 강하게 밀어내며 엉덩이와 등을 들어 올려 몸을 활처럼 젖힙니다. 4) 브릿지 자세로 버티며, 유연성이 부족하면 머리를 매트에 댄 채로 연습합니다.</p>
