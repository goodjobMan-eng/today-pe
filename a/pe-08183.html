<h1>루미스틱 박자 맞추기 신체표현</h1>
<p>1) 양손에 루미스틱을 하나씩 쥐고 바닥에 바르게 앉는다. 2) 음악의 3박자 카운트(하나 둘 셋)에 맞춰 공중에서 스틱을 두드린다. 3) 바닥을 세 번 두드린 후 오른쪽과 왼쪽 바닥을 번갈아 세 번씩 두드린다. 4) 스틱끼리 비비고, 머리 위로 높이 흔들고, 등 뒤로 넘기는 동작을 수행한다. 5) 무릎을 두드리고 스틱 끝끼리 맞댄 뒤 양손 해머 동작을 박자에 맞춰 반복한다.</p>
