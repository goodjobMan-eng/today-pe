<h1>누들 하키</h1>
<p>1) 의자를 마주 보게 일렬로 배치하고 양 끝에 테이블을 눕혀 골대를 만든다. 2) 마주 앉은 사람끼리 같은 팀이 되고 좌우에는 상대 팀 선수가 앉도록 번갈아 착석한다. 3) 중앙에 투입된 폼볼을 수영 누들로 쳐서 각자의 목표 골대에 넣는다. 4) 득점이 나오면 한 세트의 선수가 반대편 끝으로 이동하고 모두가 한 칸씩 옆으로 자리를 옮긴다.</p>
