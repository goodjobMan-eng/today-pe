<h1>한마음 바운드 축구</h1>
<p>1) 지름 3m 원 안에 4명이 들어가거나 두 팀으로 나누어 선다. 2) 발과 머리로만 공을 터치하며, 공은 원 안에서 한 번 바운드된 후 다음 사람이 차서 넘긴다. 3) 공이 두 번 이상 바운드되거나 원 밖으로 나가면 아웃 또는 실점하며 먼저 목표 점수(10점)를 내면 승리한다.</p>
