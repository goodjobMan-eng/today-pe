<h1>달리기 자세를 익히는 런런 체조</h1>
<p>1) 손목을 잡고 상체를 옆으로 기울여 옆구리를 늘리는 스트레칭을 합니다. 2) 다리를 벌려 무릎을 굽히고 어깨를 안쪽으로 넣으며 고관절 유연성을 높입니다. 3) 팔을 앞뒤로 크게 흔들며 리듬에 맞춰 제자리 및 전후좌우 스텝을 밟습니다. 4) 엉덩이 닿기 킥, 무릎 들어올리기, 다리 크게 앞으로 내밀기 동작을 음악에 맞춰 진행합니다.</p>
