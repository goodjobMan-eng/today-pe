<h1>라켓과 셔틀콕 친해지기</h1>
<p>1) 제자리에서 배드민턴 라켓으로 셔틀콕을 적당한 높이로 튕기며 바닥에 떨어뜨리지 않고 연속 10번 이상 친다. 2) 라켓 면을 앞뒤로 번갈아 뒤집어가며 셔틀콕의 위치를 파악해 연속으로 튕긴다. 3) 3~5m 거리에 반환점을 두고 셔틀콕을 라켓으로 계속 치면서 걸어가 반환점을 돌아 출발 지점으로 돌아온다.</p>
