<h1>윷 굴리기</h1>
<p>1) 교실 바닥에 마스킹 테이프로 점수 구역(1-3-2-감점)을 만든다. 2) 팀을 나누고 던질 순서를 정한다. 3) 윷 4개를 동시에 점수 구역을 향해 굴린다. 4) 점수 구역에 들어간 숫자만큼 점수를 얻고, 돌아가며 굴려 더 높은 점수를 얻은 팀이 승리한다.</p>
