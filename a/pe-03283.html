<h1>내 공 지키기</h1>
<p>1) 모둠을 나누고 모둠 조끼를 착용한 후 각자 축구공을 하나씩 가지고 선다. 2) 신호가 울리면 정해진 구역 안에서 자신의 공을 지키면서 드리블을 한다. 3) 공을 드리블하다 상대편 친구의 공을 발로 차서 구역 밖으로 내보낸다. 4) 내 공이 밖으로 나가면 공을 들고 점수판에 와서 우리 팀 점수를 올린 뒤 게임에 다시 참여하며, 정해진 시간 동안 획득한 점수가 가장 낮은 모둠이 이긴다.</p>
