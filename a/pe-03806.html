<h1>농구 슈팅 &amp; 축구 패스 1분 챌린지</h1>
<p>1) 의자 위에 바구니(또는 상자)를 올리고, 의자로부터 6~8피트 거리에 돌돌 만 수건을 바닥에 놓는다. 2) 수건 뒤에서 양말공을 던져 바구니에 넣는 농구 슛을 시도해 성공 시 1점을 얻는다. 3) 바구니에서 공을 꺼내 수건과 가장 가까운 의자 다리 옆 바닥에 놓는다. 4) 발 안쪽으로 양말공을 차서 수건을 맞히면 1점을 추가하며, 1분 동안 반복하여 점수를 누적한다.</p>
