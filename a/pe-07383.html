<h1>움직임 동작으로 감정 및 주제 표현하기</h1>
<p>1) 기쁨이나 슬픔 등의 감정이나 학교 가는 길과 같은 주제를 정한다. 2) 정지 동작에 머물지 않고 동작의 크기와 속도를 조절하며 움직임으로 구체적인 상황을 표현한다. 3) 친구들과 함께 소리를 직접 내지 않고 동작을 보고 무엇인지 맞히는 스피드 퀴즈 형식으로 진행한다.</p>
