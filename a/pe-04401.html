<h1>버디스 스노우볼 게임</h1>
<p>1) 중앙에 설치된 네트를 사이에 두고 양 팀이 공을 주고받는다. 2) 상대가 던진 공에 맞으면 바닥에 앉는다. 3) 앉아 있는 팀원은 팀원이 던져주는 공을 잡으면 다시 게임에 참여할 수 있다. 4) 레벨이 올라갈수록 다시 참여하기 위해 필요한 공의 개수가 늘어난다.</p>
