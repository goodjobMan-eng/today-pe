<h1>10가지 축구 몸풀기 놀이 모음</h1>
<p>1) 깃발 가져오기 및 태그: 중앙 훌라후프 안의 조끼를 낚아채거나 상대의 무릎 또는 허리의 조끼를 터치해 빼앗습니다. 2) 공 피하기 및 탈출: 굴러오는 축구공을 피하며 강을 건너거나 콘 사이를 지그재그로 통과하며 술래를 따돌립니다. 3) 훌라후프 레이스: 팀원 전체가 손을 맞잡고 손을 놓지 않은 채 훌라후프를 머리와 발로 통과시켜 반대쪽 끝까지 전달합니다.</p>
