<h1>원숭이 놀이</h1>
<p>1) 술래를 한 명 뽑고 놀이가 시작되면 술래는 원숭이를 잡으러 갑니다. 2) 원숭이는 술래를 피해 매달릴 곳을 찾아 매달립니다. 3) 술래는 매달린 원숭이를 잡을 수 없으며, 매달린 원숭이는 술래가 다섯을 세기 전에 다른 곳으로 이동해야 합니다. 4) 술래가 매달리지 않은 원숭이를 잡으면 잡힌 원숭이가 다음 술래가 됩니다.</p>
