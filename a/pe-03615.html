<h1>장애물달리기 릴레이</h1>
<p>1) 첫 주자가 출발하여 놓여 있는 미니 허들을 연속으로 뛰어넘는다. 2) 라바콘 기둥 사이를 지그재그로 통과한다. 3) 천막 터널 속을 통과한 뒤 평균대 위를 건넌다. 4) 스텝래더를 한 칸씩 밟고 지나가 라바콘에 링을 걸거나 다음 주자에게 배턴을 전달한다.</p>
