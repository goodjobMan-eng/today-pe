<h1>스피드 우선 축구 (큰 콘을 잡아라 축구)</h1>
<p>1) 3인 1조로 한 팀을 구성하여 달리기(A), 공차기(B), 헤딩(C)의 역할을 나눈다. 2) 출발선 20m 앞에 크기가 다른 콘(고깔) 2개를 세우고 신호에 맞춰 A가 달려 먼저 도착한 사람이 원하는 콘을 선택한다. 3) B가 출발선 2m 앞 지름 1m 원 안의 A에게 원바운드로 찬 공을 C가 헤딩으로 패스하고, A가 콘으로 공을 받아내면 승리한다.</p>
