<h1>가위바위보 다리 교차 터널 통과 놀이</h1>
<p>1) 두 사람이 짝을 지어 마주 서서 기본 안전 거리를 확인하고 준비한다. 2) &quot;가위바위보&quot; 구호에 맞춰 가위바위보를 진행하여 승패를 결정한다. 3) 이긴 사람은 양다리를 넓게 벌려 터널을 만들고, 진 사람은 기어가며 상대의 다리 사이 터널을 통과한다. 4) 역할을 바꾸어 진 사람이 터널을 만들거나 발로 가위바위보를 하는 등 다양한 변형 동작으로 진행한다.</p>
