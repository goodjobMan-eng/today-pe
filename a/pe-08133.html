<h1>째깍째깍 쾅! (Tick Tock BOOM!)</h1>
<p>1) 약 5피트 간격으로 둥글게 원을 서고, 1명은 중앙에서 폭발자 역할을 맡는다. 2) 원 바깥 참가자들이 공을 시계 방향으로 패스하기 시작하면 폭발자는 눈을 가리고 '째깍째깍'을 외친다. 3) 폭발자가 '쾅!'을 외치는 순간 공을 쥐고 있거나 공중 패스 시 가장 가까웠던 사람이 탈락하여 제자리에 앉는다.</p>
