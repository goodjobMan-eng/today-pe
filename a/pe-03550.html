<h1>협동 팔굽혀펴기</h1>
<p>1) 6명이 한 모둠을 이루어 1명은 주사위를 던지고 나머지 모둠원은 팔굽혀펴기 자세로 준비한다. 2) 주사위의 숫자만큼 다 함께 팔굽혀펴기를 한다. 3) 모둠원 전체가 돌아가면서 주사위를 던지며 게임을 진행한다. 4) 게임이 끝난 후 모둠원 전체의 팔굽혀펴기 총 횟수가 가장 많은 모둠이 승리한다.</p>
