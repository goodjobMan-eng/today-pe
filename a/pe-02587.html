<h1>드래곤볼 손바닥 액션 게임</h1>
<p>1) 두 사람이 마주 보고 손을 잡은 뒤 드래곤볼 구호에 맞춰 손바닥을 한 번 친다. 2) 기를 모으거나(1회 충전), 공격(파)을 쓰거나, 상대 공격을 피하는 동작 중 하나를 선택한다. 3) 파는 기를 1회 이상 모아야 쓸 수 있으며, 상대가 피하면 모아둔 기는 모두 사라진다. 4) 기를 3번 모으면 피할 수 없는 '에네르기파'를 쓸 수 있으며, 맞은 상대는 아웃된다.</p>
