<h1>짐볼 축구 게임</h1>
<p>1) 두 팀으로 나누어 팀 조끼를 착용하고 경기를 준비한다. 2) 짐볼을 패스하거나 드리블하여 상대 골대에 슛을 넣어 득점한다. 3) 수비수는 상대의 공을 빼앗거나 막을 수 있다. 4) 양 팀 골키퍼는 골대 앞을 지키며 슛을 막아낸다.</p>
