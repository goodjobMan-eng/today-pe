<h1>허수아비 컵 균형 보행 피라미드 릴레이</h1>
<p>1) 출발선에서 책상까지 바닥에 구불구불한 선을 표시하고 모둠별로 한 줄로 대기한다. 2) 주자는 양팔을 벌려 양 손바닥과 머리 위에 스태킹 컵을 각각 1개씩 올리고 구불구불한 길을 걷는다. 3) 책상에 도착하면 손바닥의 컵부터 내려놓아 팀원들과 합작해 피라미드(4-3-2-1)를 차례대로 쌓는다. 4) 컵을 다 쌓은 후 박수를 치면 다음 주자가 출발하며, 10개 피라미드를 가장 먼저 완성한 모둠이 승리한다.</p>
