<h1>골라 하는 피트니스 타바타 운동</h1>
<p>1) 자신의 운동 구역을 정하고 바른 자세로 서서 10초 카운트다운 동안 준비한다. 2) 화면에 4분할로 제시되는 전신 운동 동작 중 자신이 수행할 운동 1가지를 즉시 선택한다. 3) 경쾌한 비트에 맞춰 20초 동안 선택한 운동을 최대 집중하여 정직하게 수행하고 10초간 호흡을 가다듬으며 휴식한다. 4) 총 8라운드 동안 매 라운드마다 다른 부위의 동작을 골라 전신을 골고루 단련하도록 변형한다.</p>
