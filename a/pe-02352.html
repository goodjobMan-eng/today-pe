<h1>간이 족구</h1>
<p>1) 4명이 한 모둠을 이루어 두 모둠이 게임을 준비한다. 2) 코트 밖에서 서브를 하며 게임을 시작하고, 공을 받아 세 번 이내에 네트 너머로 넘긴다. 3) 공을 넘길 때는 발과 머리만 사용할 수 있고 손은 사용할 수 없으며 바닥에 공을 두 번 이상 튕길 수 없다. 4) 상대 모둠이 공을 받아넘기지 못하면 1점을 얻고 점수를 얻은 모둠이 다음 서브를 하며, 세트당 15점씩 3세트를 먼저 이긴 모둠이 승리한다.</p>
