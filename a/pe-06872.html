<h1>다리 밑의 트롤</h1>
<p>1) 두 사람이 마주 보고 다리(플랭크) 자세를 취한 뒤 다리 사이에 물병을 세워 놓는다. 2) 플랭크 자세를 유지하면서 한 손으로 공을 굴려 상대방 다리 밑의 물병을 맞히려고 시도한다. 3) 상대방은 굴러오는 공을 한 손으로 막아내고 다시 상대방의 물병을 향해 굴린다. 4) 공을 주우러 가는 동안에도 플랭크 자세를 계속 유지하여 코어 근육을 단련한다.</p>
