<h1>플리커컵 운동 챌린지</h1>
<p>1) 컵을 책상 끝에 1~1.5cm 정도 걸쳐 놓는다. 2) 손가락으로 컵 바닥을 튕겨 컵이 바로 설 때까지 반복한다. 3) 이긴 사람은 준비된 운동(스쿼트)을 수행한다.</p>
