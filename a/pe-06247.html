<h1>의자와 함께 발란스</h1>
<p>1) 바퀴가 없는 안전한 의자를 준비하고 양발 뒤꿈치를 붙여 선다.2) 발레의 플리에(무릎 굽히기)와 를르베(뒤꿈치 들어올리기) 동작을 익힌다.3) 한 다리를 접어 무릎 옆에 붙이는 파세 동작과 다리를 뒤로 뻗는 아라베스크 동작을 배운다.4) 의자 위에 한쪽 다리를 올린 스트레칭 동작에 이어 의자를 잡고 선 채로 플리에, 를르베, 파세, 아라베스크를 연속 수행하며 중심을 잡는다.</p>
