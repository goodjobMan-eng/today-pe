<h1>안전하게 착지 높이뛰기</h1>
<p>1) 네 명이 한 모둠을 이루고 높이뛰는 순서를 정한다. 2) 매트 위에 스티커를 놓는다. 3) 가로대를 허리 높이에 두고 순서대로 도움닫기를 한 다음 가로대를 뛰어넘는다. 4) 매트 위에 놓인 스티커가 등에 붙을 수 있게 등 쪽으로 착지하며 턱을 당긴다.</p>
