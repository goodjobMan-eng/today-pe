<h1>정지 신호 익히기와 걷기 조깅 라인 준비운동</h1>
<p>1) 교사가 '1, 2, 3' 신호를 외치면 학생들은 즉시 멈추고 바닥에 앉거나 무릎을 꿇고 교사를 바라본다. 2) 기구를 들고 있다면 바닥에 내려놓고 멈춰서 교사의 설명을 듣는다. 3) 음악이 나오는 동안 긴 라인에서는 조깅을 하고 짧은 라인에서는 걷기를 수행한다. 4) 다른 사람과 경쟁하지 않고 앞사람과 간격을 유지하며 정해진 시간 동안 지속한다.</p>
