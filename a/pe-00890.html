<h1>의자 운동 1편 (팔 돌리기 &amp; 인아웃 스텝)</h1>
<p>1) 의자에 바르게 앉아 화면의 카운트다운 신호에 맞춰 동작을 준비합니다. 2) 20초 동안 양팔을 좌우로 교차하여 돌리는 팔 돌리기 동작을 실시하고, 10초간 호흡을 가다듬으며 휴식합니다. 3) 이어서 의자에 앉은 상태로 두 발을 바깥과 안으로 빠르게 벌렸다 모으는 인아웃 스텝을 20초간 수행합니다. 4) 두 가지 동작 세트를 다시 한번 반복하여 전신 순환과 협응력을 기릅니다.</p>
