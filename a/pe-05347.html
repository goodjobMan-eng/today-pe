<h1>패들 슬램(Paddle Zlam)</h1>
<p>1) 2인 1조로 2개 팀을 나누어 선다.2) 한 사람이 서브를 넣고 짝이 원통(캔) 쪽으로 토스한다.3) 서브가 통에 직접 맞으면 1점, 짝이 쳐서 통에 맞히면 2점, 짝이 쳐서 통 안으로 꽂아 넣으면 3점을 얻는다.4) 서브한 공이 통 안으로 바로 들어가면 상대 팀의 점수가 0점으로 초기화(와이프아웃)된다.</p>
