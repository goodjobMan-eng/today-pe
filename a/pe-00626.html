<h1>단차를 활용한 머리스프링(헤드스프링) 착지 연습</h1>
<p>1) 강당 무대 단차 위에 매트를 깔고 아래쪽에는 두꺼운 안전 매트를 설치합니다. 2) 두 발로 강하게 구르며 무대 끝 매트에 양손을 짚고 엉덩이를 높이 띄웁니다. 3) 정수리를 매트에 댄 뒤 엉덩이가 머리 위를 넘어가는 순간 다리를 쭉 펴서 힘차게 차올립니다. 4) 손으로 바닥을 강하게 밀어내며 몸을 젖혀 안전 매트 위로 가볍게 착지합니다.</p>
