<h1>와리가리 게임</h1>
<p>1) 양쪽에 베이스를 두고 공격과 수비 팀으로 나눈다.2) 공격하는 주자는 양쪽 베이스 사이를 다섯 바퀴 돌아온다.3) 수비팀은 공을 서로 10번 주고받으며 주자를 아웃시키기 위해 공으로 터치하거나 쳐낸다.4) 공을 10번 주고받는 동안 공격수가 움직이지 않거나 아웃되면 공수가 교대된다.</p>
