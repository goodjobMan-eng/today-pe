<h1>축구형 게임 포지션 패스 연습</h1>
<p>1) 팀 내에서 피드백 역할을 수행할 주장(친샘)과 포지션을 회의하여 정한다.2) 위치가 겹치거나 공에 몰려다니지 않도록 포지션별로 서로 다른 색상의 조끼를 착용한다.3) 주장이 공을 가져오면 정해진 포지션 위치에 서서 짧게, 길게, 옆, 뒤, 대각선 등 다양한 방향으로 패스 연습을 진행한다.</p>
