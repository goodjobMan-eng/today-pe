<h1>테이블볼 게임</h1>
<p>1) 책상 1~2개를 붙이고 3명이 한 조가 되어 2명 쪽과 1명 쪽으로 나뉜다2) 2명 쪽에서 공을 테이블 위로 굴려 서브하고 반대쪽으로 뛰어간다3) 공은 테이블 위에서는 여러 번 튀어도 되지만 바닥에서는 한 번만 튀어야 한다4) 공을 받아 넘기지 못하거나 바닥에 2번 이상 튀면 실점한다</p>
