<h1>부상방지 단체 워밍업 프로그램</h1>
<p>1) 파트너와 함께 누워 어깨와 흉추 돌리기 스트레칭을 6회씩 좌우로 실시한다. 2) 엎드린 상태에서 허리 비틀기(총 6회)와 슈퍼맨 자세로 등·엉덩이 근육을 들어 올리는 동작을 진행한다. 3) 무릎을 댄 상태로 푸시업 10회를 2세트 반복하고, 바로 누워 글루트 브릿지(엉덩이 들기)를 6회씩 2세트 실시한다. 4) 옆으로 누워 내전근 강화를 위해 엉덩이를 들어 올리는 동작(좌우 각 6회씩 2세트)을 진행한다.</p>
