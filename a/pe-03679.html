<h1>원 둘레 4인 방향 전환 달리기 태그 놀이</h1>
<p>1) 4명이 한 모둠이 되어 원 둘레를 4등분한 위치에 선다. 2) 신호에 맞춰 일제히 시계 방향으로 달리며 앞 사람을 터치하려 시도한다. 3) 신호하는 사람이 3초~5초 뒤에 다시 신호를 주면 반시계 방향으로 달린다. 4) 터치되면 아웃된다.</p>
