<h1>코어 볼 피트니스 트레이닝</h1>
<p>1) 자신의 운동 구역에 앉아 공을 양손으로 잡고 발을 공중에 띄워 균형을 잡는다. 2) 상체를 빠르게 좌우로 비틀며 공으로 몸 옆 바닥을 터치하는 사이드 탭을 실시한다. 3) 공을 허리, 머리, 양다리 둘레로 회전시키고 자전거 타듯 다리를 움직이며 8자 모양으로 통과시킨다. 4) 크런치 동작과 함께 양손과 양발 사이로 공을 주고받거나 다리·허리·머리를 연속으로 도는 어라운드 더 월드를 수행한다.</p>
