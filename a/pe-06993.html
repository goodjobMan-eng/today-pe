<h1>단계별 저글링 스킬 수업</h1>
<p>1) 공 1개를 허리 높이에서 머리 위로 던져 잡는 동작을 연속 5회 성공한다. 2) 다음 단계로 허리 높이에서 던지고 박수를 친 뒤 잡는 '던지기-박수-잡기'를 5회 성공한다. 3) 공 2개를 양손에 쥐고 주 손부터 차례로 던져 '던지고 던지고 잡고 잡고' 패턴으로 머리 위로 띄워 잡는다. 4) 공을 잡을 때는 손을 허리 높이에 유지하며 연속 5회 잡기에 도전한다.</p>
