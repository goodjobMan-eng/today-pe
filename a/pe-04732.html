<h1>필리핀 민속춤 티니클링 변형 동작 익히기</h1>
<p>1) 바닥의 선(줄)을 기준으로 안에서 두 번, 바깥에서 두 번 발을 벌려 뛴다.2) 박자에 맞춰 점프하며 몸을 90도씩 회전하여 원래 자리로 돌아온다.3) 모둠발 뛰기, 깽깽이(한 발 뛰기), 번갈아 뛰기 등 8가지 연결 동작을 박자에 맞춰 익히고 음악에 맞춰 표현한다.</p>
