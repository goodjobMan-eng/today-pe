<h1>테니스의 기초 규칙</h1>
<p>1) 공이 바닥에 두 번 튀기기 전에 라켓으로 쳐서 네트를 넘겨 상대 코트로 보낸다. 2) 득점 방식은 첫 번째 포인트 15, 두 번째 포인트 30, 세 번째 포인트 40이며, 40 이후 한 포인트를 더 얻으면 게임에서 이긴다. 3) 양 선수 모두 40이 되면 듀스가 되며, 이후 두 포인트를 연속으로 이겨야 게임을 가져온다.</p>
