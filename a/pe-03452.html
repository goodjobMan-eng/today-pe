<h1>날 잡아 봐</h1>
<p>1) 6명이 한 모둠을 이루고 술래 2명을 정한다. 2) 술래가 아닌 4명은 출발선에서 도움닫기를 하여 연속으로 세 번 뛴다. 3) 술래는 도움닫기를 하여 연속으로 두 번 뛴 후 팔을 뻗어 모둠원을 치거나 잡는다. 4) 술래에게 잡히지 않은 모둠원은 다시 도움닫기를 하여 연속으로 세 번 뛰어 출발선으로 돌아오면 1점을 얻고, 역할을 돌아가며 하여 가장 높은 점수를 얻은 모둠원이 이긴다.</p>
