<h1>안대 숨바꼭질</h1>
<p>1) 술래 1명 또는 2명을 뽑고 술래는 안대를 쓰고 펀스틱을 들고 준비한다. 2) 나머지 친구들은 10초 동안 교실 곳곳에 숨는다. 3) 10초가 끝난 뒤에는 절대 움직일 수 없다. 4) 시작과 동시에 술래는 숨어 있는 친구들을 찾으러 다닌다. 5) 스틱에 맞은 친구는 아웃되어 지정된 장소로 이동해 앉아서 조용히 지켜본다.</p>
