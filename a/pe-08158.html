<h1>잭스 테니스 활동</h1>
<p>1) 라켓을 들고 테니스공을 위로 1회 가볍게 쳐 올린다. 2) 바닥에 1번 바운드된 후 공을 라켓이나 손으로 안전하게 잡는다. 3) 바운드 후 연속으로 치는 횟수를 2회, 3회, 4회, 5회까지 점차 늘려가며 공을 제어한다.</p>
