<h1>새해맞이 브레인 브레이크 파티</h1>
<p>1) 화면이 잘 보이는 위치에 서서 양팔 간격으로 부딪힘 없는 안전 거리를 확보한다. 2) 새해 관련 밸런스 게임 선택지가 나타나면 원하는 항목 방향으로 스텝을 밟고 지정된 신체 트레이닝을 수행한다. 3) 캐릭터 올림픽 달리기 코너에서는 응원할 선수를 지정한 뒤 출발 신호에 맞춰 제자리에서 전력 질주한다. 4) 화면 속 틀린 그림 찾기 미니게임 구간에서는 관찰력을 발휘해 다른 부분을 찾아내며 호흡을 가다듬는다.</p>
