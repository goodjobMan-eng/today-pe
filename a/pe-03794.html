<h1>페이퍼 로켓 캐치 챌린지</h1>
<p>1) 종이 2장을 각각 돌돌 말아 가운데 테이프를 붙여 페이퍼 로켓 2개를 만든다. 2) 발을 교차하여 뛰는 크로스 점프를 1회 실시한다. 3) 한 손에 종이 로켓 2개를 쥐고 반대쪽 손으로 쳐올려 머리 위 높이로 띄운다. 4) 공중에 뜬 종이 로켓을 양손으로 각각 1개씩 동시에 잡으면 1점을 획득하며, 1분 동안 점수를 누적한다.</p>
