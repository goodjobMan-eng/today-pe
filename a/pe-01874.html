<h1>골대 부활 넷 피구</h1>
<p>1) 코트 양쪽에 골대와 골키퍼를 배치하고 학급을 두 팀으로 나누어 피구공을 들고 준비합니다. 2) 일반 피구 규칙에 따라 상대편 던진 공에 맞으면 아웃되어 코트 옆 대기 구역으로 이동합니다. 3) 공격팀이 상대 골키퍼를 뚫고 골대 안에 공을 던져 골을 성공시키면 아웃된 아군 전원이 코트로 부활합니다. 4) 상대 팀의 모든 필드 선수를 먼저 아웃시키거나 정해진 시간 내에 더 많은 골을 넣으면 승리합니다.</p>
