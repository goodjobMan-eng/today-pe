<h1>뒤구르기 단계별 연습 (구르기·물구나무서기 기초)</h1>
<p>1) 매트에 누워 발을 벽에 대고 발바닥으로 밀어내는 감각을 익힙니다. 2) 손바닥을 귀 뒤쪽 매트에 정확히 짚고 목과 허리를 둥글게 만 상태에서 뒤로 구릅니다. 3) 구르기가 어려운 경우 매트 한쪽에 경사로를 만들어 뒤쪽으로 넘어가는 회전력을 보조받습니다. 4) 손바닥으로 바닥을 밀어내며 머리가 눌리지 않게 회전하여 발로 안전하게 착지합니다.</p>
