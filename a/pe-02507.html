<h1>뜀틀 위 점프 도약 훈련</h1>
<p>1) 낮은 단수의 뜀틀 앞뒤로 발판과 매트를 깔고 준비한다. 2) 발판을 밟고 손을 짚지 않은 채 모둠발로 뜀틀을 단숨에 뛰어넘어 착지한다. 3) 뜀틀 단수를 높인 뒤 손을 대지 않고 뜀틀 위에 모둠발로 올라탄 후 옆이나 뒤로 뛰어내린다. 4) 매트 위에 콘을 놓고 콘이 있는 지점까지 목표를 겨냥하여 멀리 뛰어내린다.</p>
