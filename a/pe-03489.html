<h1>동서남북 옆돌기</h1>
<p>1) 반 전체를 세 모둠으로 나누고 모둠별로 순서를 정한다. 2) 출발 신호와 함께 첫 번째 모둠원이 달려가 첫 번째 매트에서 양발로 박수 치기를 한다. 3) 두 번째 매트에서 양손 짚고 매트 건너기를 하고 세 번째 매트에서 무릎 굽혀 옆돌기를 한다. 4) 첫 번째 모둠원이 출발선으로 돌아오면 다음 주자가 출발하며 마지막 모둠원이 가장 빨리 돌아온 모둠이 이긴다.</p>
