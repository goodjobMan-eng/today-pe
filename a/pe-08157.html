<h1>상어와 피라미 드리블 태그</h1>
<p>1) 참가자들은 베이스라인에서 공을 드리블하며 반대편 베이스라인으로 건너간다. 2) 가운데 있는 술래(상어)는 공을 드리블하면서 건너가는 사람을 태그한다. 3) 술래에게 태그된 사람은 그 자리에 멈춰 서서 양발 사이에 공을 끼우고 문어(옥토퍼스)가 된다. 4) 문어가 된 사람은 자리를 이동할 수는 없지만 손을 뻗어 지나가는 사람을 태그할 수 있다. 5) 마지막 1명이 남을 때까지 반복한다.</p>
