<h1>늪지대 피구 게임</h1>
<p>1) 각 팀 진영에 매트(늪) 1장씩을 깔고 학급을 두 팀으로 나눈 뒤 부드러운 폼볼을 지급한다. 2) 상대 선수를 공으로 맞히면 맞은 사람은 노바운드로 맞았을 경우 상대 진영에 있는 매트(늪)로 들어가 갇힌다. 3) 매트에 갇힌 선수는 자기 팀원이 던져준 패스를 공중에서 다이렉트로 받으면 살아나 복귀하며, 상대 팀 전원을 늪에 가두면 승리한다.</p>
