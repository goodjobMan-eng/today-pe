<h1>공 없는 축구</h1>
<p>1) 풋살 경기장에서 진행하며 골라인과 코너라인이 골 구역을 이룬다. 2) 상대의 전진을 막기 위해 상대 선수의 몸 아무 부위나 터치한다. 3) 터치당한 선수는 자신이 방어하는 홈 골라인으로 돌아갔다가 다시 출발한다. 4) 상대의 골라인을 통과하면 1점을 획득하며 제한 시간 종료 시 더 많은 점수를 얻은 팀이 승리한다.</p>
