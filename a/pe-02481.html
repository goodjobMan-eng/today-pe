<h1>눈치 콘 게임</h1>
<p>1) 센터라인 주위에 놓여진 콘 바깥쪽으로 모든 인원이 준비합니다. 2) 시작 신호에 맞춰 오른쪽으로 달려갑니다. 3) 지도자의 휘슬이 한 번 울리면, 방향을 바꾸어 달려갑니다. 4) 지도자의 휘슬이 두 번 울리면 앞에 있는 콘을 재빠르게 잡고, 잡지 못한 1인은 탈락하고 콘 1개를 빼고 마지막 우승자를 가릴 때까지 수행합니다.</p>
