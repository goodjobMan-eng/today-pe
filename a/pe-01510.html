<h1>셔틀 풋워크 민첩성 릴레이</h1>
<p>1) 중앙 스팟에 셔틀콕 6개를 모아 두고, 사방 6곳에 지정된 반환 스팟을 배치한다. 2) 홀수 주자는 중앙의 셔틀콕을 하나씩 집어 외곽 6개 스팟에 신속하게 분산 배치하고 돌아온다. 3) 짝수 주자는 외곽의 셔틀콕을 하나씩 주워 다시 중앙 스팟으로 회수하여 모은다. 4) 다음 주자에게 터치하여 이어가며, 난이도 조절을 위해 지정된 손(라켓 쥔 손/주 손)만 사용하도록 규칙을 변경한다.</p>
