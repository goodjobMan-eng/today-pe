<h1>어부와 물고기 술래잡기</h1>
<p>1) 술래(어부)들은 손을 잡고 일렬로 연결된 상태로 움직인다. 2) 술래들은 도망가는 학생(물고기)을 터치하여 잡는다. 3) 잡힌 학생은 술래 대열에 합류하여 함께 손을 잡고 다음 학생을 잡는다.</p>
