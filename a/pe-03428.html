<h1>간이 발야구</h1>
<p>1) 9명이 한 모둠을 이루고 두 모둠이 게임을 한다. 2) 타자는 투수가 굴려주는 공을 차고, 타자나 주자가 모든 누를 돌아 홈으로 들어오면 1점을 얻는다. 3) 수비 모둠이 뜬공을 바로 받거나 타자보다 먼저 누에서 공을 받으면 타자는 아웃이다. 4) 3번 아웃이면 공수를 교대하고 5회 동안 점수를 더 많이 얻은 모둠이 이긴다.</p>
