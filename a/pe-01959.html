<h1>마당 청소 쓰레기 던지기</h1>
<p>1) 배구 네트를 기준으로 코트를 양 구역(마당)으로 나누고 양쪽에 피구공과 콩주머니를 골고루 분배한다. 2) 신호가 울리면 피구공은 네트 위로 던지고 콩주머니는 네트 아래 바닥으로 굴려 상대 구역으로 넘긴다. 3) 종료 휘슬이 울리면 즉시 멈추고 각 구역에 남은 물품 수를 세어 물품이 적은 팀이 1점을 획득한다. 4) 한 번에 한 개의 물품만 넘기도록 제한하며 음악을 재생해 멈추는 방식으로 시간 제한을 둘 수 있다.</p>
