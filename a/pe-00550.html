<h1>스텝래더 상급 사이드 스텝 훈련</h1>
<p>1) 바닥에 스텝래더를 길게 설치하고 래더 옆에 측면을 향해 섭니다. 2) '안-안-밖-밖' 순서로 발을 번갈아 디디며 래더 칸을 따라 빠르게 옆으로 이동합니다. 3) 래더 안쪽과 바깥쪽을 민첩하게 스텝하며 골반을 틀어 주는 힙체인지(Hip Change) 동작을 연결합니다. 4) 반대 방향으로도 몸을 돌려 동일하게 스텝을 밟으며 양방향 민첩성과 순발력을 기릅니다.</p>
