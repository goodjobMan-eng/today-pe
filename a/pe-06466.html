<h1>방송댄스 배우기</h1>
<p>1) 본격적인 안무 시작 전 목, 어깨, 골반, 손목, 발목을 스트레칭하여 몸을 푼다. 2) 왼손과 오른손으로 알파벳 L 모양을 만들어 합치며 왼쪽 다리를 내밀고 돌아오며 위로 올리는 1절 동작을 익힌다. 3) 두 번 흔든 후 손으로 머리를 짚으며 골반을 튕기고, 손과 다리를 뻗는 2절 연결 동작을 배운다. 4) 카운트에 맞춰 동작을 연결하고 음악에 맞추어 전체 안무를 완성한다.</p>
