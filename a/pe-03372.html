<h1>빅발리볼(배구형 공 넘기고 받기)</h1>
<p>1) 직사각형 경기장에 중앙 네트를 설치하고 4명씩 2개 모둠을 이룬다. 2) 경기장 밖에서 공을 던져 서브를 넣으며 시작한다. 3) 공은 바닥에 1번 튄 후 받아 이어 주어야 하며, 모든 모둠원의 손을 거친 뒤 네트 너머로 넘긴다. 4) 네트를 넘어온 공을 받지 못하거나 넘긴 공이 상대 지역을 벗어나면 상대 모둠이 1점을 얻고, 15점을 먼저 얻은 모둠이 이긴다.</p>
