<h1>말뜀 이어달리기 놀이</h1>
<p>1) 2인 1조가 되어 1명은 말을 서고 1명은 양팔 지지로 말을 뛰어넘는다. 2) 말을 서는 사람은 가능한 머리를 낮추고 발 쪽으로 숙인다. 3) 서로 역할을 번갈아 가며 10초 동안 몇 회를 넘는지 횟수를 센다. 4) 역할을 교대하며 앞으로 전진하는 말뜀 이어달리기(릴레이)로 확장해 겨룬다.</p>
