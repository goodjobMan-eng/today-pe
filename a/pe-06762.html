<h1>츄크볼 골대를 활용한 킨볼</h1>
<p>1) 세 팀이 참여하며 공격 팀은 상대 팀의 이름을 호명한 후 츄크볼 골대를 향해 킨볼을 친다. 2) 공격 팀 내에서 최대 2회까지 패스하여 슛을 시도할 수 있다. 3) 호명된 팀이 리바운드되는 공을 바닥에 닿기 전에 잡아내지 못하면 실점한다.</p>
