<h1>오뚝이 구르기 체조</h1>
<p>1) 두 사람이 짝을 지어 한 사람이 양반다리를 하고 다른 사람을 무릎 위에 앉힙니다. 2) 뒤에 있는 사람이 앞에 앉은 사람의 발이나 몸을 단단히 감싸 잡습니다. 3) 몸을 둥글게 만 상태에서 그대로 뒤로 굴렀다가 반동을 이용해 다시 원래 자리로 일어납니다. 4) 뒤로 구르는 동작에 익숙해지면 옆으로 한 바퀴 굴러 제자리로 돌아오는 옆구르기에도 도전합니다.</p>
