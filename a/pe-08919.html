<h1>초등 티볼 기본 기술과 실전 경기 가이드</h1>
<p>1) 타격은 배팅 티 위에 공을 놓고 스탠스와 그립을 잡은 뒤 스윙하여 공을 쳐낸다. 2) 수비는 포구 시 양손을 사용하며 공의 낙하 지점을 확인하고 '마이 볼' 구호를 외쳐 충돌을 방지한다. 3) 주루는 타격 후 베이스로 신속히 진루하며 릴레이 형태의 베이스러닝 경주로 연습한다.</p>
