<h1>신호등 주먹야구 게임</h1>
<p>1) 바닥에 초록(1점), 노랑(2점), 빨강(3점) 색깔의 원마커를 놓는다. 2) 타자가 주먹으로 공을 친 뒤 원하는 색깔의 원마커를 밟고 홈으로 돌아오면 해당 점수를 획득한다. 3) 수비팀은 뜬공을 직접 잡거나, 타자가 베이스를 밟고 홈으로 돌아오기 전에 수비수가 포수에게 공을 직접 전달하여 타자를 아웃시킨다.</p>
