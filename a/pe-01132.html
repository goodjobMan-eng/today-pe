<h1>플레이스쿠프 나 홀로 던지고 받기 도전</h1>
<p>1) 학생마다 플레이스쿠프 1개와 스펀지 공 1개를 준비하고 일정한 간격으로 선다. 2) 바닥의 공을 발로 막아 스쿠프로 건져 올리고, 공을 위로 던진 뒤 원바운드로 튕겨 오르는 공을 받아낸다. 3) 스쿠프 뒷면으로 튕겨 올린 뒤 바로 받거나 다리 밑으로 띄워 올린 뒤 받아내며 성공 횟수를 늘린다. 4) 허리 뒤로 스쿠프를 돌려 공을 살짝 띄운 뒤 몸 앞으로 돌아와 잡아내는 고난도 동작으로 변형하여 도전한다.</p>
