<h1>거꾸로 축구 게임</h1>
<p>1) 양 팀 골대를 반대 방향(뒤쪽을 향하도록)으로 설치하고 두 팀으로 나누어 경기장에 배치한다. 2) 일반 필드 플레이어는 발을 쓰지 않고 오직 손바닥으로 공을 쳐서 패스하거나 골대를 향해 보낸다. 3) 반대로 골키퍼는 일반 축구와 달리 손을 절대 쓸 수 없으며 발이나 온몸을 사용하여 골대를 방어한다. 4) 공을 잡고 들고 뛰는 것은 금지되며 뒤돌아 있는 골대 뒤쪽으로 돌아 들어가 골을 넣어야 득점으로 인정된다.</p>
