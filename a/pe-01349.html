<h1>노래 가사로 나만의 춤 만들기</h1>
<p>1) 한글 가사 위주의 빠르지 않은 곡을 선정하고 가사 속 핵심 낱말과 문장을 확인한다. 2) 핵심 가사에서 연상되는 손동작과 상체 제스처를 자유롭게 브레인스토밍하여 정한다. 3) 떠올린 손동작을 음악 박자에 맞춰 반복하거나 크기를 키우고, 스텝 등 하체 움직임을 엮어 한 구절을 완성한다. 4) 동작을 가사 옆에 메모하며 기억하고, 모둠원과 연결하여 1절 전체 분량으로 창작 영역을 확장한다.</p>
