<h1>볼 패스 술래잡기</h1>
<p>1) 한 팀 3~4명씩 2팀으로 나누고, 한 변 10m 정도의 코트를 만들어 전원이 안으로 들어간다. 2) 술래 팀이 패스를 돌리고 상대 팀 사람은 술래에게 터치되지 않도록 도망친다. 3) 패스를 받아 공을 갖고 있는 술래는 그 자리에서 움직일 수 없으며, 다른 술래는 코트 안을 자유롭게 움직인다. 4) 공을 갖고 있는 술래가 상대 팀 사람을 공으로 터치하면 술래 팀이 이긴다.</p>
