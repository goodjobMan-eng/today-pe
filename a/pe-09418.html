<h1>스캐터볼</h1>
<p>1) 원을 만들어 돌다가 주사위를 던지면 주사위가 멈춘 번호 팀이 잡는다. 2) 굴리는 공이 발에 닿거나 원 안에 볼을 던져 맞히지 못하면 탈락한다. 3) 주사위를 잡은 사람이 던져서 못 맞히거나 상대방이 받으면 탈락한다.</p>
