<h1>음악 비트 하체 피트니스 도전</h1>
<p>1) 준비운동으로 가볍게 제자리 걷기와 상·하체 관절 스트레칭을 실시한다. 2) 신나는 음악 리듬에 맞추어 기본 스쿼트와 스쿼트 킥, 펀치 스쿼트 동작을 수행한다. 3) 와이드 스쿼트와 점프 스쿼트, 런지 니업과 런지 킥을 연속으로 수행하여 하체 지구력을 기른다. 4) 동작 횟수를 4회에서 8회로 늘리거나 사이드 런지 콤보로 변형하여 강도를 조절한다.</p>
