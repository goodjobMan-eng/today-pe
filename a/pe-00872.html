<h1>소닉 밸런스 게임 둘 중 하나 고르기 운동</h1>
<p>1) 화면에 양자택일 질문(소닉처럼 달리기 vs 테일즈처럼 날기 등)이 나오면 마음에 드는 쪽을 고릅니다. 2) 선택한 방향에 맞춰 좌우로 자리를 이동하거나 해당 선택지의 운동 자세를 준비합니다. 3) 화면이 전환되면 선택한 쪽에 해당하는 운동 동작을 카운트다운 동안 수행합니다. 4) 중간 경주 미니게임에서는 자신이 고른 레이서가 1등을 하도록 제자리에서 전속력으로 달리며 응원합니다.</p>
