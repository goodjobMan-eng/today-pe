<h1>한 골대 농구 게임</h1>
<p>1) 3명씩 공격 모둠과 수비 모둠으로 나눈다. 2) 신호가 울리면 공격수는 출발선에 서서 패스와 드리블로 공을 이어주며 슛하고, 성공 시 1점을 얻는다. 3) 공격수는 공을 잡고 세 걸음 이상 걸을 수 없다. 4) 경기장 밖으로 공이 나가면 마지막 터치한 팀의 상대 모둠이 나간 자리에서 패스하여 재개하며, 정해진 시간 동안 점수가 많은 모둠이 승리한다.</p>
