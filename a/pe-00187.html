<h1>공 패스 술래잡기 — 체스트·바운드 패스 중 호루라기 신호 추격전</h1>
<p>2인 1조로 2~3m 간격을 두고 마주 서서 호루라기 1번 신호에 체스트 패스·바운드 패스·오버헤드 패스를 연속으로 주고받습니다. 그러다 교사가 '삑-삑-' 두 번 길게 불면 그 순간 공을 쥐고 있는 사람이 술래, 공이 없는 사람이 도망자가 되어 종료 호루라기까지 공으로 터치하면 술래 승, 도망치면 도망자 승(패자는 스쿼트 점프 5회)이 됩니다.</p>
