<h1>배턴 터치 이어달리기</h1>
<p>1) 배턴을 받는 2주자는 빠르게 출발할 수 있도록 자세를 낮추고 달려오는 1주자를 봅니다. 2) 건네 줄 1주자는 속도를 늦추지 않고 달려옵니다. 3) 약속 지점에 1주자가 들어오면 2주자는 빠르게 앞으로 달려나가며 손을 뒤로 뻗고, 달려온 1주자는 신호를 외치며 배턴을 건넵니다. 4) 배턴을 건네받은 2주자는 힘차게 앞으로 달려나갑니다.</p>
