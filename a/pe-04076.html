<h1>스트라이커 시트 네트 패들 라켓 게임</h1>
<p>1) 스트라이커 시트를 가운데 네트처럼 두고 양편에 파트너가 마주 선다. 2) 플라스틱 패들과 폼 테니스공을 사용해 네트 너머로 원바운드로 공을 주고받는다. 3) 2명 대 2명 복식 경기로 확장하거나, 건너편 바구니에 공을 바운드시켜 넣는 표적 맞히기 규칙을 적용한다. 4) 스트라이커 시트로 4개 구역을 만들어 자기 구역에 공이 튀면 다른 구역으로 쳐 넘기는 포스퀘어 방식으로 점수를 내며 경기한다.</p>
