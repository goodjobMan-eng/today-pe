<h1>매트볼</h1>
<p>1) 경기장을 반으로 나누고 각 팀 진영 뒤편에 매트 1장을 놓는다. 2) 각 팀에서 첫 번째 포수를 1명씩 매트 위로 보낸다. 3) 선수가 중앙선 앞까지 이동하여 매트 위의 팀원 포수에게 공을 패스하고, 수비수는 이를 가로채거나 막는다. 4) 포수가 두 발을 매트에 딛고 패스를 성공하면 패스한 선수가 매트로 합류하여 포수가 되며, 모든 선수가 매트에 올라간 팀이 승리한다.</p>
