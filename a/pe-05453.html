<h1>가위손 탁구공 옮기기</h1>
<p>1) 손을 가위처럼 팔꿈치나 아래팔을 모아 교차하는 형태로 만든다.2) 손을 쓰지 않고 양팔 사이에 탁구공을 끼워 옮긴다.3) 자기 팀의 계란판에 탁구공을 떨어뜨려 넣고 누가 더 많이 옮기는지 겨룬다.</p>
