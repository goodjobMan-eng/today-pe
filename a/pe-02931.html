<h1>토끼굴 술래잡기</h1>
<p>1) 두 명이 양손을 마주 잡고 서서 토끼굴을 만든다. 2) 술래에게 쫓기는 도망자(토끼)는 토끼굴 안으로 들어가 한 명의 손을 잡는다. 3) 토끼에게 손을 잡히지 않고 남겨진 반대쪽 사람이 새로운 토끼가 되어 밖으로 도망친다. 4) 술래에게 태그되면 술래가 바뀌며 &quot;내가 술래다&quot;라고 크게 외친 후 게임을 이어간다.</p>
