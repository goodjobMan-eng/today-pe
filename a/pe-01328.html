<h1>단계별 훌라후프 골인 디스크 챌린지</h1>
<p>1) 축구 골대 앞 운동장에 훌라후프 3개를 가까운 거리부터 먼 거리 순서대로 일렬로 배치한다. 2) 각 팀의 첫 번째 주자가 1단계 훌라후프 안에 들어가 골대를 향해 백핸드로 디스크를 던진다. 3) 1단계를 성공하면 2단계, 3단계 훌라후프로 이동하여 순서대로 디스크 골인을 시도하며 넣을 때마다 팀 점수를 얻는다. 4) 3단계 투구가 모두 끝나면 디스크를 회수하고 다음 주자가 나와 도전하며 총점을 합산한다.</p>
