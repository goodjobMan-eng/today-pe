<h1>가운데서 만나요 준비운동</h1>
<p>1) A팀과 B팀 인원을 마주 보게 세운 뒤 동시에 출발하여 가운데로 달려온다.2) 마주 본 짝과 가위바위보를 한다.3) 이긴 사람은 점핑잭 5회, 진 사람은 스쿼트 5회를 하고 자기 자리로 돌아간다.4) 한쪽 줄의 맨 앞사람이 맨 뒤로 이동하여 줄 전체가 한 칸씩 이동함으로써 다음 상대와 만난다.5) 모든 아이들을 한 번씩 만나거나 학급 전체 기록을 단축하는 방식으로 진행한다.</p>
