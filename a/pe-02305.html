<h1>투호놀이</h1>
<p>1) 잔디밭이나 넓은 마당에 귀가 달린 투호 항아리를 중앙에 놓는다. 2) 참여자들이 청팀과 백팀(서로 다른 편)으로 편을 나눈다. 3) 항아리에서 열 걸음 정도 떨어진 위치에 던지는 지점을 정하고 선다. 4) 붉은 화살과 푸른 화살 총 12개의 화살을 차례로 던져 항아리나 귓구멍에 많이 넣은 편이 승리한다.</p>
