<h1>빌더와 불도저 드리블 게임</h1>
<p>1) 전체 공간에 다양한 콘과 교구를 세워 두고 빌더 팀과 불도저 팀으로 나눈다. 2) 참가자는 각자 공을 한 손으로 낮게 드리블하며 이동한다. 3) 불도저는 드리블을 유지하면서 세워진 교구를 쓰러뜨린다. 4) 빌더는 드리블을 유지하면서 쓰러진 교구를 다시 세운다. 5) 상대방의 공은 건드릴 수 없으며 넓은 공간 전체를 활용해 활동한다.</p>
