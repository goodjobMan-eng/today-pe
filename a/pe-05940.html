<h1>놀밥 인형극 홈트 유연성 운동</h1>
<p>1) 허리에 손을 올리고 목을 양방향으로 돌린다.2) 오른손으로 반대쪽 머리를 잡고 옆으로 내려 목과 어깨를 늘려준다.3) 양쪽 팔꿈치로 원을 그리듯 어깨를 돌리고, 주먹을 팔꿈치 밑에 대고 들어 올린다.4) 손바닥과 손등이 앞으로 보이게 각각 당겨 팔을 스트레칭한다.5) 다리를 벌려 허벅지 아래쪽을 늘려주고, 발목을 잡고 허벅지 앞쪽을 당겨 버틴다.</p>
