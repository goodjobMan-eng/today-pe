<h1>호커스 포커스 런</h1>
<p>1) 마법서로 이어질 것 같은 경로를 고르고 제시된 요가 자세를 취해 선택을 표현한다. 2) 선택 후 다음 선택지가 나올 때까지 길을 달리며 나타나는 모든 장애물을 피한다. 3) 점프, 숙이기, 피하기, 펀치, 검은 불꽃 밟기 동작으로 장애물을 극복한다. 4) 해가 뜨기 전까지 마법서를 찾을 때까지 이 과정을 반복한다.</p>
