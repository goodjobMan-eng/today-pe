<h1>단계별 적응형 하키 및 표적 활동</h1>
<p>1) 바닥에 놓인 콘을 빠르게 넘나들며 발로 탭하는 스텝 훈련을 진행한다 2) 하키 스틱을 양손으로 잡고 공을 드리블하여 체육관 중앙과 콘 주변으로 이동한다 3) 하키 스틱으로 콘을 쓰러뜨린 후 손을 쓰지 않고 공을 콘 안으로 밀어 넣어 숨긴다 4) 훌라후프 사이로 공을 발로 패스하거나 건강/비건강 식품 빈백을 골라 초록/빨강 바구니에 던져 넣는다</p>
