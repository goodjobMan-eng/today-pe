<h1>부모 자식 술래잡기</h1>
<p>1) 술래 1명을 정하고, 나머지 참가자들은 어버이(선두) 뒤에 서서 앞사람 어깨에 손을 얹어 한 줄로 길게 연결한다.2) 술래는 맨 뒤에 있는 사람의 엉덩이를 터치하러 다가간다.3) 어버이는 양팔을 벌려 술래를 막고, 맨 뒤 참가자는 잡히지 않도록 피한다.4) 줄을 잡은 손이 떨어지면 줄 팀의 패배가 된다.</p>
