<h1>사방 족구형 게임</h1>
<p>1) 3명씩 4개 모둠을 이루어 십자형 네트로 구분된 사방 구역에 각각 선다. 2) 신호가 울리면 서브 구역에서 공을 차 넘겨 경기를 시작한다. 3) 공은 최대 3번 안에 다른 구역으로 차 넘겨야 하며 같은 모둠으로 2번 연속 보낼 수 없다. 4) 상대 모둠이 공을 받아넘기지 못하면 득점하며 정해진 시간 동안 가장 많은 점수를 얻은 모둠이 이긴다.</p>
