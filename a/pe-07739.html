<h1>농구 슛 연습 게임</h1>
<p>1) 두 사람이 농구 골대와 농구공 하나를 준비해 슛 연습을 진행한다. 2) 골대에 공이 들어가면 성공한 사람이 공을 회수하고, 들어가지 않으면 다른 사람이 공을 튄 자리에서 바로 슛을 던진다. 3) 다양한 위치로 자리를 바꿔가며 연속해서 슛을 시도한다. 4) 공이 경기 구역 밖으로 완전히 나가면 정해진 자리에서 다시 시작한다.</p>
