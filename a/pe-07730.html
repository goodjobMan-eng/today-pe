<h1>벽 패스 릴레이 대결</h1>
<p>1) 출발선에서 출발하여 벽을 향해 전진하며 손 또는 발로 벽에 공을 5번 패스하여 주고받는다. 2) 벽 패스를 마치고 끝까지 이동한 뒤에는 드리블을 하며 출발선으로 되돌아온다. 3) 손으로 패스·드리블하는 방식과 발로 하는 방식 중 어느 쪽이 더 빠른지 대결한다.</p>
