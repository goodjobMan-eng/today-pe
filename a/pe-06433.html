<h1>파라슈트 큰 파도와 산 만들기</h1>
<p>1) 파라슈트를 잡고 원형으로 둘러선 뒤 한쪽 팀이 구호에 맞춰 파라슈트를 빠르게 들어 올렸다 내리며 반대편으로 큰 파도를 보낸다.2) 반대편 팀도 동일하게 파라슈트를 위아래로 흔들어 파도를 전달한다.3) 파라슈트를 높이 든 뒤 바닥으로 내리며 무릎으로 가장자리를 눌러 공기를 가두어 산 형태를 만든다.</p>
