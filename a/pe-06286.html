<h1>협력 공 옮기기 게임</h1>
<p>1) 4개 모둠으로 나누고 각 모둠에서 2명이 짝을 지어 경기장 중앙으로 이동한다.2) 중앙의 공을 주운 후 둘이서 던지고 받기를 하며 자기 모둠 기지(후프)까지 공을 운반한다.3) 공을 가진 사람은 이동할 수 없으며 패스를 떨어뜨리면 처음 공을 집은 위치로 돌아가 다시 시도한다.</p>
