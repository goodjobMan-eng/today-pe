<h1>옆돌기 고무줄 넘기 게임</h1>
<p>1) 5명이 한 모둠이 되어 고무줄을 잡는 2명을 정합니다. 2) 다른 친구들은 도전할 고무줄의 높이를 외치고 차례로 옆돌기하여 고무줄을 넘습니다. 3) 고무줄을 발목 높이에서 넘으면 1점, 무릎 높이에서 넘으면 2점, 허리 높이에서 넘으면 3점을 획득합니다. 4) 정해진 횟수 동안 획득한 점수가 가장 높은 모둠이 승리합니다.</p>
