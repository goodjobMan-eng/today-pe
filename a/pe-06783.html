<h1>공 다리사이 통과 릴레이</h1>
<p>1) 1번 주자가 공을 들고 반환점을 향해 빠르게 달려간다. 2) 반환점을 돌아 자기 줄의 맨 뒤로 이동한다. 3) 팀원 전체가 다리를 넓게 벌리고 서면, 맨 뒤에서 다리 사이로 공을 굴려 맨 앞사람에게 보낸다. 4) 맨 앞사람이 공을 받아 다시 출발하며 네 명 모두 완료할 때까지 반복한다.</p>
