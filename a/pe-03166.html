<h1>태풍 놀이</h1>
<p>1) 술래는 태풍 목걸이를 목에 걸어 표시한다. 2) 술래가 제자리에서 '하나, 둘, 셋, 넷, 나는 태풍이다'를 외치면 놀이가 시작된다. 3) 태풍은 이리저리 피하는 다른 친구들을 잡으며, 태풍에게 잡히면 제자리에 서서 팔만 흔드는 '작은 태풍'이 된다. 4) 작은 태풍의 손에 닿으면 그 자리에 서서 또 다른 작은 태풍이 되고, 모두 다 잡히면 놀이가 끝난다.</p>
