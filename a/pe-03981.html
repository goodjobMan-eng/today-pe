<h1>도어대시 식품군 배달 놀이</h1>
<p>1) 모둠별로 훌라후프(집)와 원마커(주차장), 스쿠터보드를 배치하고 중앙에 다양한 색상의 콩주머니(식당)를 놓는다. 2) 첫 주자는 스쿠터보드에 엉덩이를 대고 앉아 자기 팀 색상의 원마커 주차장으로 이동한다. 3) 식당에서 원하는 색상의 식품 콩주머니를 1개 집어 팀 진영으로 배달한다. 4) 배달된 콩주머니의 색상이 나타내는 식품군을 팀원들과 함께 맞히고 해당 식품의 예시를 이야기한다.</p>
