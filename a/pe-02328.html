<h1>상어 술래잡기</h1>
<p>1) 강당이나 운동장에 배 모양을 그리고 사람 수의 1/3~1/2 정도의 원판을 곳곳에 놓는다. 2) 상어(술래)를 정해 모서리에서 5초를 센 뒤 출발하고, 나머지 친구들은 중앙에서 도망친다. 3) 배와 원판(무인도)은 안전 구역으로 상어가 잡을 수 없으나, 5초 후 나와야 하며 나오자마자 바로 재입장할 수 없다. 4) 상어에게 잡힌 사람은 술래가 되어 놀이를 이어가며, 상어는 안전 구역 안의 친구를 기다리지 않는다.</p>
