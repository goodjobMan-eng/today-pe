<h1>인형극 놀이</h1>
<p>1) 짝을 지어 한 명은 인형 조종사, 다른 한 명은 인형 역할을 맡는다. 2) 조종사는 가상의 줄로 인형의 팔, 다리 등 신체 부위를 들어 올리거나 움직인다. 3) 인형 역할을 맡은 사람은 줄에 이끌리듯 신체를 움직이며 표현한다. 4) 역할이 끝나면 서로 역할을 바꾼다.</p>
