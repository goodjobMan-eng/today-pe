<h1>어라운드 더 타운 (동네 한 바퀴 스쿠터 놀이)</h1>
<p>1) 각자 스쿠터보드를 타고 개인 공간을 지키며 안전하게 이동한다.2) 엉덩이를 대고 앉거나 엎드리거나 무릎을 꿇고 탑승하며 충돌하지 않는다.3) 다른 사람과 부딪치면 2분에서 5분간 타임아웃 벌칙을 받는다.4) 배구 네트가 설치된 경우 네트를 만지지 않고 그 아래로 통과할 수 있다.5) 벤치나 콘 등을 활용해 식당이나 세차장 등으로 상상하며 자유롭게 이동한다.</p>
