<h1>강강술래 덕석 말고 풀기</h1>
<p>1) 모두 오른쪽을 보고 오른손은 앞으로 왼손은 뒤로 하여 앞뒤 사람 손을 잡고 연결한다. 2) 선두가 자신의 왼쪽으로 크게 돌아 달팽이 모양을 그리며 점점 안쪽으로 감아 들어간다. 3) 충분히 말리면 제자리에서 뛰며 멈추고 원을 작게 만든다. 4) 풀 때는 선두가 왔던 길을 되돌아 사람 사이로 빠져나가거나 가던 길을 뒤로 후진하며 풀어나간다.</p>
