<h1>엘 카스티요 (후프 성 무너뜨리기)</h1>
<p>1) 학급을 두 팀으로 나누고, 경기 시작 전 각 팀은 훌라후프로 자신들의 성을 만든다. 2) 양 팀에 폼볼을 나누어 준 뒤 상대 팀의 후프 성을 향해 공을 던진다. 3) 공으로 상대 성을 무너뜨리면 1점을 얻고, 무너진 성을 재건축하는 동안 상대는 공을 던질 수 없다.</p>
