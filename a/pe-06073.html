<h1>컵 젠가</h1>
<p>1) 스태킹 컵을 약 5층 높이의 기본 타워로 미리 쌓아 둔다.2) 가위바위보로 순서를 정해 이긴 사람부터 컵을 위로 쌓아 올린다.3) 초기에는 아래 컵의 두께만큼만 벗어나게 쌓고 점차 벗어나는 범위를 넓혀 난도를 높인다.4) 타워를 쓰러뜨린 사람이 패배하며 벌칙 운동을 수행한다.</p>
