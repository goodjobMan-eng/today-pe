<h1>라바콘 왕복 순발력 콘 터치 레이스</h1>
<p>1) 바닥에 라바콘(또는 미니 블록)을 1~2개 일정 간격으로 세우고 양옆에 사이드스텝 공간을 마련한다. 2) 20초 동안 콘을 중심으로 좌우 사이드스텝을 반복하며 콘을 터치한 왕복 횟수를 측정한다. 3) 콘 사이를 전력 질주하여 찍고 돌아오는 셔틀런 방식으로 빠르게 순발력 기록을 측정한다. 4) 콘의 간격을 넓히거나 방향 전환 회수를 3회 이상으로 늘려 순발력 미션을 다양화한다.</p>
