<h1>모서리게임</h1>
<p>1) 칠판에 교실의 모서리와 측면 등 6개 구역의 번호와 학생들의 관심 주제(음식, 취미 등) 단어를 적습니다. 2) 신호와 함께 5초 카운트다운 동안 모든 학생이 원하는 구역 번호로 걸어서 이동합니다. 3) 술래(교사)가 1~6번이 적힌 뽑기 막대 중 하나를 무작위로 뽑아, 뽑힌 구역에 서 있던 학생들은 탈락하여 자리로 돌아가 앉고 그 구역에는 X 표시를 합니다. 4) 라운드를 반복해 끝까지 살아남은 구역의 학생들이 승리합니다.</p>
