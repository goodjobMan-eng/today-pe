<h1>뜀틀 아래보기 넘기(하향도비) 기초 익히기</h1>
<p>1) 뜀틀 앞에 서서 손을 나란히 또는 약간 대각선으로 짚는다.2) 몸을 1/4~1/2 비틀며 시선을 바닥(착지점)을 향한 채 다리를 옆으로 빼내어 넘는다.3) 익숙해지면 도움닫기와 점프를 더해 측전도비(옆돌며 넘기) 형태로 높이를 올려 도전한다.</p>
