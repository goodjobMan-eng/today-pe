<h1>부활절 버니 프리즈 댄스</h1>
<p>1) 화면과 음악에 맞춰 캐릭터의 춤 동작을 따라 한다. 2) 화면에 정지 신호(Freeze)가 나타나면 움직임을 멈춘다. 3) 제시되는 요가 및 스트레칭 정지 자세를 10초간 그대로 유지한다. 4) 다시 음악이 시작되면 댄스 파티 동작을 이어서 따라 한다.</p>
