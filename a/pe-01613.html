<h1>30:15 타바타 인터벌 트레이닝</h1>
<p>1) 8가지 전신 맨몸 운동 동작을 확인하고 개인 간격을 유지하며 선다. 2) 타이머 신호에 맞춰 30초 동안 제자리 무릎 당겨 뛰기, 스쿼트 등 주어진 동작을 전력으로 수행한다. 3) 15초의 휴식 신호가 나오면 호흡을 가다듬으며 다음 화면에 나오는 동작을 준비한다. 4) 체력 수준에 따라 일반 스쿼트나 런지를 스쿼트 점프나 런지 점프로 난이도를 올려 8사이클을 완주한다.</p>
