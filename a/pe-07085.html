<h1>기브 앤 고 축구 패스 릴레이 게임</h1>
<p>1) 리더 1명이 공을 두고 앞에 서고 나머지 팀원은 원마커 뒤에 한 줄로 선다. 2) 리더가 신호에 맞춰 첫 번째 주자에게 공을 차서 패스하면 주자가 다시 리더에게 패스하고 다음 마커로 이동한다. 3) 마지막 주자까지 패스를 주고받은 후 마지막 주자는 공을 드리블하여 리더 위치로 가고 기존 리더는 줄의 첫 번째로 들어간다. 4) 모든 팀원이 리더 역할을 한 번씩 먼저 마치는 팀이 승리한다.</p>
