<h1>스포츠클럽 내야 외야 협동 피구</h1>
<p>1) 코트를 내야와 외야로 나누고 양 팀 선수를 배치하며 팀 조끼를 착용한다. 2) 외야와 내야 간 빠른 패스로 상대 내야수의 빈틈을 노려 공을 던진다. 3) 공에 맞은 선수는 외야로 이동하며, 상대 내야 선수를 모두 아웃시키거나 경기 종료 시 내야 잔여 인원이 많은 팀이 세트를 득점한다. 4) 공을 2개로 늘리거나 포지션별 외야수 인원을 조절하여 진행할 수 있다.</p>
