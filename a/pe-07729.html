<h1>협력 문장 만들기</h1>
<p>1) 학생 한 명당 단어가 적힌 종이를 한 장씩 나누어 가진다. 2) 친구들끼리 돌아다니며 단어를 조합해 행동 문장을 만든다. 3) 만든 문장대로 실제로 함께 행동을 수행하면 성공한다. 4) 행동을 성공하면 가지고 있던 종이를 내고 새로운 종이를 받아 같은 방식으로 반복한다. 5) 제한 시간 1분 안에 학급 전체가 몇 개를 성공하는지 확인한다.</p>
