<h1>집콕 종이접시 플라잉디스크 만들기</h1>
<p>1) 종이접시 3장을 겹친 후 네 면에 테이프를 붙여 고정합니다. 2) 종이접시 가장자리 틈새로 바람이 들어가지 않도록 박스테이프나 절연테이프를 길게 잘라 테두리 전체를 감싸 붙이고, 꼼꼼하게 문질러 디스크 형태를 단단하게 완성합니다. 3) 네임펜이나 색연필을 활용해 자신만의 디자인과 그림을 디스크 표면에 꾸밉니다. 4) 완성된 디스크를 손목 스냅을 이용해 안전한 공간에서 던지고 받는 활동을 합니다.</p>
