<h1>야외 깃발 뺏기 대작전</h1>
<p>1) 중앙 통행로를 경계로 양 팀 구역을 나누고 30초 동안 깃발의 색이 보이도록 각 진영에 숨긴다. 2) 상대 진영에 들어가 깃발을 찾아 자기 진영으로 가지고 오며 상대편에게 태그되면 감옥 벤치로 이동해 2분간 머문다. 3) 태그당하지 않고 상대 깃발을 먼저 자기 진영으로 무사히 운반해 온 팀이 승리한다. 4) 교사가 숨겨둔 무적 빈백을 획득하면 면책권이 생기며 게임이 지연될 경우 태그 없는 프리포올 모드를 발동한다.</p>
