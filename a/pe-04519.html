<h1>체조 수업 전 매트 스트레칭 루틴</h1>
<p>1) 다리를 넓게 벌려 앉은 뒤 무릎을 굽히지 않고 한쪽 발을 향해 5초간 숙인 후 반대쪽으로 이동한다. 2) 두 다리를 모으고 앞으로 뻗은 파이크 자세로 앉아 무릎을 펴고 상체를 최대한 숙인다. 3) 양팔을 옆으로 뻗고 작은 원부터 큰 원 모양으로 크기를 점차 키우며 팔을 회전시킨다. 4) 바르게 앉아 머리를 어깨 쪽으로 기울여 5초간 유지하고 천장과 바닥을 보며 목을 늘린다.</p>
