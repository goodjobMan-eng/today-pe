<h1>짝과 함께하는 2인 선인장 체조</h1>
<p>1) 2인 1조로 짝을 이루어 앞사람은 받침대, 뒷사람은 올라타는 역할을 맡습니다. 2) 받침대 역할을 하는 학생은 양발을 벌리고 무릎을 굽혀 기마자세를 취하며 중심을 낮춥니다. 3) 올라타는 학생은 받침대의 어깨를 잡고 받침대의 허벅지 윗부분(서혜부 부근)에 한 발씩 차례로 디뎌 올라섭니다. 4) 두 사람 모두 균형을 잡은 뒤 신호에 맞춰 양팔을 좌우로 벌려 선인장 모양을 완성합니다.</p>
