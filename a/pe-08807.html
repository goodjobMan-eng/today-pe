<h1>패스 받는 방법을 고려한 포트볼/농구형 게임 수업</h1>
<p>1) 준비운동으로 드리블과 제자리 공 던져 잡기, 허리 돌리기를 진행한다. 2) 경기 장면 영상을 함께 보며 패스를 잘 받기 위한 움직임(접근하기, 제자리 유지, 공간 활용)을 분석한다. 3) 팀별 경기 후 하프타임에 태블릿 영상을 확인하며 패스 받는 방법을 재정비하고 본 경기를 진행한다.</p>
