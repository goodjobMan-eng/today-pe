<h1>줄넘기 던져 스태킹 컵 맞히기</h1>
<p>1) 책상 위에 스태킹 컵을 피라미드 형태로 쌓아 표적을 준비한다. 2) 일정한 거리의 투척선에서 줄넘기를 던져 피라미드 컵을 쓰러뜨린다. 3) 팀별로 정해진 횟수만큼 차례대로 던져 쓰러뜨린 컵의 개수를 기록한다. 4) 정해진 기회 동안 더 많은 컵을 쓰러뜨린 팀이 승리한다.</p>
