<h1>한 손으로 줄 돌리며 타이밍 점프하기</h1>
<p>1) 줄을 넘지 않고 두 손잡이를 한 손에 모아 쥔다.2) 팔을 몸에서 너무 벌리지 않고 허리 옆에서 작은 원을 그리듯 앞으로 줄을 돌린다.3) 줄이 바닥에 닿는 소리와 순간에 맞춰 가볍게 점프하며 타이밍 감각을 익힌다.</p>
