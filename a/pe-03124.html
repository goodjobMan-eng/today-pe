<h1>신체 정지 동작 표현과 텔레파시 게임</h1>
<p>1) 승리나 슬픔 등 감정, 동물, 탈것과 같은 표현 주제를 확인한다. 2) 일시 정지 화면처럼 몸의 크기와 형태를 조절하여 움직이지 않고 멈춘 정지 동작을 만든다. 3) 교사가 제시어를 외치고 셋을 센 뒤 모든 학생이 동시에 자신만의 정지 동작을 취한다. 4) 모둠원이나 학급 친구들이 서로 같은 정지 동작을 취했는지 확인하며 일치 횟수를 겨룬다.</p>
