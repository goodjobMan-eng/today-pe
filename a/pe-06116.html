<h1>스포츠스태킹 원 릴레이</h1>
<p>1) 모둠별로 원 둘레를 따라 지정된 위치에 일렬로 선다.2) 신호가 울리면 주자가 출발하여 3-3-3 스태킹 및 다운스태킹 미션을 완료한다.3) 원 바깥쪽을 따라 한 바퀴를 빠르게 달린다.4) 다음 주자와 바통을 터치하고, 주자들이 돌아가며 컵을 원통형 모양으로 차례대로 포갠다.5) 모든 주자가 스태킹과 달리기를 먼저 완료하고 컵을 완전히 포갠 팀이 승리한다.</p>
