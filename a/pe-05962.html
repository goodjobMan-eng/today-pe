<h1>같은 색 컵에 퐁당</h1>
<p>1) 4가지 색상의 컵 24개를 바닥에 모아 두고 각자 담당할 색상(주황, 연두, 핑크, 파랑)을 정한다.2) 지정된 범위에서 탁구공을 튕겨 바닥에 바운드시킨 후 컵 안으로 넣는다.3) 자신의 색깔 컵에 탁구공이 들어가면 해당 컵을 획득하여 가져온다.4) 자기 색깔의 컵 6개를 먼저 모두 뺀 사람이 승리한다.</p>
