<h1>교실 요가 3가지 동작 순환 스트레칭</h1>
<p>1) 발을 어깨너비로 벌리고 양팔을 머리 위로 뻗어 산 자세를 취하며 코로 깊게 3회 호흡한다. 2) 상체를 천천히 숙여 손을 발 쪽으로 뻗는 서서 숙이기 자세를 취하며 3회 호흡한다. 3) 허리를 숙이고 손을 정강이에 대며 등을 평평하게 펴는 반 접기 자세를 취하며 3회 호흡한다. 4) 주먹을 쥐며 숨을 들이쉬고 내쉬는 정리 호흡으로 마무리한다.</p>
