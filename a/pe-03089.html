<h1>하체 스트레칭</h1>
<p>1) 요가 매트를 바닥에 깐다. 2) 왼다리를 잡고 가슴 쪽으로 당기며 반대쪽 다리는 바닥에 붙여 30초 동안 유지한다. 3) 왼다리를 올린 상태에서 발목을 천천히 돌려주고 발을 위아래로 움직인다. 4) 왼발을 오른 무릎에 걸쳐 오른쪽 다리를 당겨 유지한 뒤, 다리를 꼰 상태로 하체를 비틀고 반대쪽 다리도 동일하게 진행한다.</p>
