<h1>스포츠스태킹 6단 피라미드 쌓기 도전</h1>
<p>1) 컵 6개를 준비하여 겹쳐서 중앙에 둔다. 2) 오른손으로 3개, 왼손으로 2개의 컵을 뽑아 1개를 바닥에 남긴다. 3) 오른손과 왼손을 번갈아 사용하여 3-2-1 피라미드 형태로 6단을 업스태킹한다. 4) 오른손으로 맨 위 컵, 왼손으로 바로 아래 컵을 잡고 ㅅ자 모양으로 내린 뒤 왼손 컵과 오른손 컵을 차례로 얹어 다운스태킹한다.</p>
