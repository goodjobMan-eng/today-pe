<h1>원형 술래잡기와 도망가기 게임</h1>
<p>1) 4개의 콘으로 표시된 사각형 구역 안에 도망자(Flee)들이 위치한다. 2) 술래(Chaser)들은 지정된 원 안에서 엎드려 시작하며, 수행할 이동 동작을 외친다. 3) 술래가 일어서서 쫓아오는 동안, 도망자들은 베이스라인(안전 구역) 밖으로 탈출한다. 4) 술래는 도망자를 손으로 밀지 않고 한 손가락으로만 가볍게 태그해야 한다.</p>
