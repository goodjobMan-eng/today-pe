<h1>용꼬리 잡기</h1>
<p>1) 두 팀으로 나눈 다음 앞사람의 허리를 잡고 일렬로 서서 용 모양을 만든다. 2) 각 용의 끝에 위치한 사람이 뒷주머니나 허리춤에 손수건 끝이 보이게 꽂는다. 3) '용꼬리'를 외치는 신호로 게임을 시작하며 맨 앞사람이 상대 팀의 꼬리 손수건을 낚아챈다. 4) 상대 팀의 용꼬리를 낚아챌 때마다 1점씩 얻는다.</p>
