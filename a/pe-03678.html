<h1>저쪽으로 점프 뿅 (방향 점프 가위바위보)</h1>
<p>1) 두 사람이 마주보고 서서 가위바위보를 한다. 2) 가위바위보를 이긴 사람이 &quot;저쪽으로 점프 뿅&quot;이라고 구령을 외친다. 3) &quot;뿅&quot; 구령 타이밍에 맞춰 두 사람 모두 전후좌우 중 한 방향으로 점프한다. 4) 거울 모드로 보았을 때 두 사람이 같은 방향으로 점프하면 가위바위보를 이긴 사람이 최종 승리하며, 다른 방향이면 원위치로 돌아와 다시 가위바위보를 반복한다.</p>
