<h1>핸드워킹 빈백 옮기기 미션</h1>
<p>1) 손바닥으로 바닥을 터치하며 팔굽혀펴기 자세로 이동한다. 2) 빈백을 반대 팔 옆으로 옮기는 동작을 수행한다. 3) 릴레이 미션으로 핸드워킹으로 이동하여 30초 이내에 목표 지점에 빈백을 던져 넣는다. 4) 정확하게 동작을 유지하며 빠르고 정확하게 목표 지점에 빈백을 던져 넣는 활동을 진행한다.</p>
