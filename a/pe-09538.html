<h1>초등학생을 위한 라더 트레이닝 발전편</h1>
<p>1) 훌라후프 안으로 두 번 들어가고 밖으로 두 번 나오는 중중외외 동작을 한다. 2) 옆으로 서서 훌라후프 안으로 두 번 들어가고 밖으로 두 번 나오는 횡방향 중중외외 동작을 한다. 3) 훌라후프 안으로 두 번 들어가고 밖은 한 발씩 나가는 동작을 한다. 4) 옆으로 서서 훌라후프 안으로 두 번 들어가고 밖은 한 발씩 나가는 동작을 한다.</p>
