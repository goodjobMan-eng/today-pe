<h1>풍선 사냥 놀이</h1>
<p>1) 바닥에 넘어갈 수 없는 경계선을 표시한다. 2) 한 사람이 오리 풍선을 공중에 띄워 올린다. 3) 사냥꾼 역할은 경계선을 넘지 않은 상태에서 사냥용 풍선을 손으로 치거나 발로 차서 공중의 오리 풍선을 맞힌다. 4) 정해진 시간 동안 적은 시도만으로 오리 풍선을 최대한 많이 맞힌 팀이 승리한다.</p>
