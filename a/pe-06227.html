<h1>기구를 활용한 장애물 달리기</h1>
<p>1) 출발 신호에 맞춰 첫 번째 주자가 미니 허들을 뛰어넘는다.2) 라바콘에 폴(막대)을 꽂거나 걸쳐 만든 장애물을 넘거나 통과한다.3) 점보스틱 장애물을 넘은 뒤 액션후프(훌라후프) 구역을 지나 반환점을 돈다.4) 되돌아와 다음 주자와 터치하고, 마지막 주자가 들어와 만세를 부르면 종료된다.</p>
