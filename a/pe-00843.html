<h1>여름 테마 밸런스 게임 타바타 운동</h1>
<p>1) 화면에 제시되는 두 가지 여름 테마 보기 중 자신이 더 마음에 드는 선택지를 하나 고릅니다. 2) 카운트다운이 끝난 후 화면이 전환되면 자신이 선택한 쪽의 캐릭터가 보여주는 운동 동작을 확인합니다. 3) 타이머에 맞춰 15초 동안 해당 신체 활동 및 스트레칭 동작을 즐겁게 따라 합니다. 4) 라운드가 바뀔 때마다 새로운 질문이 나오며 동일한 방식으로 선택 후 신체 활동을 이어갑니다.</p>
