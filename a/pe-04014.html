<h1>스카프 챌린지 양자택일 워밍업</h1>
<p>1) 화면에 제시되는 두 가지 스카프 동작 중 하나를 선택한다. 2) 허리 둘레로 돌리기 또는 다리 둘레로 돌리기, 박수 1번 치고 잡기 또는 박수 5번 치고 잡기 등 선택한 동작을 제한 시간 동안 수행한다. 3) 무릎 꿇고 어깨 또는 머리로 받기, 무릎 또는 발로 받기, 한 손으로만 잡기, 돌며 잡기 등의 과제에 도전한다. 4) 마지막에는 자신만의 스카프 챌린지 동작을 직접 만들어 수행한다.</p>
