<h1>분리수거 분류 릴레이 게임 (슈퍼 레시클라헤)</h1>
<p>1) 교실 중앙 의자에 재활용 물품 이름이 적힌 종이들을 두고, 주변에 4가지 분리수거함 의자(유리, 플라스틱/용기, 종이, 유기물)를 배치한다. 2) 신호가 울리면 참가자들은 중앙으로 달려가 종이를 한 장씩 집는다. 3) 집어 든 물품의 재질에 맞는 분리수거 의자로 신속하게 이동하며, 4가지 어디에도 해당하지 않는 쓰레기 종이를 집은 사람은 중앙 바닥에 앉는다.</p>
