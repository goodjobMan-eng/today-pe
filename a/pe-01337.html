<h1>나무 선 따라 매미잡기</h1>
<p>1) 강당 바닥의 경기선들을 나무로 정하고 전체 가위바위보로 술래 1명을 뽑아 막대풍선을 쥐여 준다. 2) 모든 참가자는 바닥에 표시된 경기선 위로만 걸어서 이동하며 술래를 피해 도망친다. 3) 바닥선을 벗어나 떨어지거나 술래에게 터치되면 아웃 처리되며, 체육관 가장자리를 한 바퀴 돌고 복귀하거나 잡힌 사람이 새 술래가 된다. 4) 익숙해지면 술래가 선과 선 사이를 점프해 건너뛰거나 이동 속도를 걷기에서 달리기 단계로 높여 진행한다.</p>
