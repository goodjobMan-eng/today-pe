<h1>재활용품 타워 챌린지 (The Recycled Tower)</h1>
<p>1) 오트밀 통, 시리얼 상자, 커피 캔, 치즈 통 등 재활용품을 모은다. 2) 개인 또는 짝과 함께 재활용품을 한 층씩 쌓아 올려 최대한 높은 타워를 만든다. 3) 타워가 완성되면 쌓아 올린 재활용품의 총 층수를 센다. 4) 줄자를 사용하여 바닥부터 타워 꼭대기까지의 높이(인치)를 측정한다(반올림 적용). 5) '층수 + 총 높이(인치)'를 합산하여 최종 점수를 계산한다.</p>
