<h1>언덕을 넘어, 넘어</h1>
<p>1) 8명이 한 모둠을 이루고 2명씩 짝을 지어 순서를 정합니다. 2) 첫 번째 출발 모둠원 2명을 제외한 나머지 모둠원들은 2명씩 마주보고 1m 간격을 두고 차례대로 앉아 장애물을 만듭니다. 3) 장애물 높이는 정강이 높이, 무릎 높이, 허벅지 높이 순서대로 만듭니다. 4) 출발 신호와 함께 출발하여 장애물을 차례대로 넘고 마지막 모둠원 2명 뒤에 앉아 장애물을 만들며, 순서대로 진행하여 도착선에 가장 먼저 도착한 모둠이 이깁니다.</p>
