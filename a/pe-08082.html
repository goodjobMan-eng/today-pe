<h1>피클볼 기본 규칙과 경기 방법</h1>
<p>1) 대각선 오른쪽 서비스 박스로 허리 아래에서 언더핸드로 서브를 넣는다. 2) 서브된 공은 리시버 코트에서 한 번, 서버 코트에서 한 번씩 총 2번 바운드된 후에야 발리가 가능하다(투 바운드 규칙). 3) 키친(노발리 존) 구역 안에서는 발리를 할 수 없으며 공이 바운드된 후에만 들어가 칠 수 있다. 4) 서브권을 가진 팀만 득점할 수 있으며 11점을 먼저 내고 2점 차를 내는 팀이 승리한다.</p>
