<h1>이사 술래잡기(히코시오니)</h1>
<p>1) 각자 훌라후프 하나씩 안에 들어가 자리를 잡고 술래 1명을 정한다. 2) 술래에게 터치당하지 않으면서 비어 있는 다른 후프로 이동한다. 3) 이동 중 술래에게 터치당하면 술래를 교대하며 제한 시간 동안 가장 많이 이사한 사람이 승리한다.</p>
