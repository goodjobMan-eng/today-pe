<h1>이누이트 다리 씨름</h1>
<p>1) 바닥 매트 중앙에 팔꿈치가 오도록 두 사람이 머리를 반대 방향으로 두고 나란히 등을 대고 눕는다. 2) 팔짱을 낀 상태에서 안쪽 다리를 들어 올려 발가락을 맞대며 하나, 둘을 센다. 3) 셋에 다리를 서로 걸어 상대방을 자신의 방향으로 강하게 당긴다. 4) 힘에 밀려 넘어갈 때 어깨 너머로 뒤구르기 형태로 넘어가며 승패를 가린다.</p>
