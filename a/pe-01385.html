<h1>외야 압박 패스 전술 피구</h1>
<p>1) 코트 규격에 맞춰 내야와 외야를 설정하고 팀별로 내야수와 외야수를 정해 배치한다. 2) 내야 중앙과 외야 사이드를 잇는 빠른 전환 패스로 상대 수비의 틈을 벌려 던진다. 3) 상대 내야 선수의 몸을 맞혀 아웃시키며 라인 아웃 및 터치 반칙 없이 내야 선수를 더 많이 지킨 팀이 승리한다. 4) 공 점유 제한 시간을 두거나 인터페어 파울 기준을 단순화하여 진행할 수 있다.</p>
