<h1>앉아서 하는 체조 자세</h1>
<p>1) 파이크 자세로 다리를 펴고 앉아 발끝을 향해 상체를 숙입니다. 2) 엉덩이만 바닥에 대고 다리를 들어 올려 상체와 복부를 당기는 홀로 자세를 취합니다. 3) 무릎을 가슴 쪽으로 당겨 접고 앉아 균형을 잡는 턱 자세를 취합니다. 4) 다리를 좌우로 최대한 벌려 앉아 상체를 숙이는 스트래들 자세를 취합니다. 5) 엉덩이로 균형을 잡으며 다리를 대각선 위로 곧게 뻗는 V-싯 자세를 취합니다.</p>
