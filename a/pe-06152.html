<h1>배구 오버핸드 패스 연습하기</h1>
<p>1) 양손의 엄지와 검지로 삼각형 모양을 만들고 공을 살짝 잡듯이 위로 밀어 올리는 손 모양을 익힌다.2) 무릎 반동을 이용해 머리 위에서 풍선을 살짝 잡았다가 밀어 올려주는 기본 동작을 반복한다.3) 피구공과 배구공으로 도구를 바꾸어 공을 잡지 않고 손가락 반동으로 연속해서 튕겨 올린다.4) 콘으로 출발 지점과 반환점을 두고 제자리 연습에 이어 앞으로 이동하며 오버핸드 패스를 실시한다.</p>
