<h1>행운의 동전 던지기</h1>
<p>1) 셔츠로부터 3피트 떨어진 곳에 첫 번째 책을 두고 2피트 간격으로 책 두 권을 차례로 놓는다. 2) 가장 먼 책 뒤에서 반대발을 내딛으며 언더핸드로 동전을 셔츠 위로 던진다. 3) 동전이 셔츠에 안착하면 1점을 얻고 동전을 주운 뒤 책 사이를 앙감질(켄켄파)로 뛰어 돌아온다. 4) 1분 동안 동전 던지기와 앙감질 왕복을 반복하여 가장 높은 점수를 획득한다.</p>
