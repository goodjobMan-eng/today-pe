<h1>낙하산 이어달리기</h1>
<p>1) 주자는 낙하산 벨트를 허리에 차고 출발선 콘 뒤에 대기하며 뒷사람이 낙하산을 잡아줄 수 있다. 2) 신호에 맞춰 출발하여 반환점을 돌아온다. 3) 주자는 손으로 낙하산을 들고 뛰지 않고 허리에 맨 상태로 달려야 한다. 4) 결승점에 도착하면 다음 주자와 손 터치 후 낙하산을 벗어 넘겨주고, 주자는 부딪히지 않게 옆으로 가서 앉아 대기한다.</p>
