<h1>로데오 라운드업 (Rodeo Roundup)</h1>
<p>1) 활동 공간을 목장 1/3과 목초지 2/3로 나누고 야생마 역할을 맡은 학생들은 목초지에서 갤럽으로 이동한다. 2) 교사가 멈춤 신호를 줄 때마다 갤럽의 5가지 핵심 요소를 하나씩 익히고 짝과 함께 관찰 및 피드백을 나눈다. 3) 카우보이/카우걸 술래들이 풀누들(올가미)을 들고 말을 태그하면 태그된 말은 목장 안의 콘 트랙을 성숙한 갤럽 동작으로 돈다.</p>
