<h1>허리 비틀기 패스 릴레이</h1>
<p>1) 4~6명으로 팀을 만들어 세로 1열로 선다. 2) 맨 앞 사람 앞에 공을 10개 두고 맨 뒷사람 뒤에 후프를 놓는다. 3) 출발 신호에 맞춰 공을 1개씩 몸을 비틀어 뒷사람에게 건넨다. 4) 맨 끝까지 전달된 공을 후프에 넣고, 모든 공을 가장 먼저 후프에 넣은 팀이 이긴다.</p>
