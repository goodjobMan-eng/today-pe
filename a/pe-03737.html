<h1>리듬 무릎 올리기</h1>
<p>1) '하나, 둘, 셋'의 3박자 리듬에 맞춰 제자리에서 발을 구른다. 2) '하나' 박자에 한쪽 무릎을 높이 들어 올리며 양발을 번갈아 가며 실시한다. 3) '하나'나 '셋' 박자에 뒤꿈치를 들어 손으로 발뒤꿈치를 터치하는 동작으로 바꿔 진행한다. 4) '하나'에 무릎 올리기, '셋'에 발뒤꿈치 터치하기를 결합하거나 반대쪽 손을 함께 위로 들어 올리며 리듬에 맞춰 몸을 움직인다.</p>
