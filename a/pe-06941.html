<h1>볼링 놀이</h1>
<p>1) 한 모둠 내에서 투구자와 핀 세터로 역할을 나눈다. 2) 투구자는 원마커 위에 서서 무릎을 굽히고 공을 굴려 볼링핀을 쓰러뜨린다. 3) 핀 세터는 쓰러진 핀을 다시 세우고 공을 주워 투구자에게 전달한다. 4) 팀원끼리 역할을 교대하여 진행한다.</p>
