<h1>벽과 평행봉을 활용한 철봉 차오르기 기초 연습</h1>
<p>1) 평행봉을 벽 쪽으로 밀착해 두고 안쪽 봉을 분리하여 한쪽 봉만 설치한다. 2) 디딤발을 봉 아래에 두고 팔을 살짝 굽힌 상태에서 한쪽 다리를 강하게 차올린다. 3) 차올린 다리를 봉 쪽으로 신속하게 가져가면서 디딤발을 따라 올리고, 시선은 항상 발을 향한다. 4) 발로 벽을 짚고 올라가며 몸을 회전시켜 봉 위에 지탱하는 지지 자세를 완성한다.</p>
