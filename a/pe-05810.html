<h1>패드민턴 서브 연습</h1>
<p>1) 엄지와 검지로 꼬집듯이 라켓을 쥐고 손등이 앞을 향하게 하여 배꼽 높이에서 공을 떨어뜨리지 않고 네트 너머로 숏서브를 넣는다.2) 옆을 보고 서서 발밑을 대각선으로 둔 뒤 라켓을 쥐고 허리 높이에서 손바닥 면으로 공을 떨어뜨리지 않고 롱서브를 넣는다.3) 숏서브와 롱서브를 1분 동안 자유롭게 연습한다.</p>
