<h1>플로어컬링 점수판 게임</h1>
<p>1) 바닥에 점수 구역(10점, 5점, 3점, 2점)이 표시된 점수판을 펼쳐 놓는다. 2) 가위바위보로 선공을 정하고 양 팀이 순서대로 플로어컬링 스톤을 점수판을 향해 투구한다. 3) 상대 스톤을 밀어내거나 자기 스톤을 높은 점수 구역 가운데에 위치시킨다. 4) 정해진 엔드가 끝난 후 점수판 위에 올라간 스톤의 점수를 합산하여 총점이 높은 팀이 승리한다.</p>
