<h1>비사치기</h1>
<p>1) 3~4m 거리를 두고 출발선과 비사를 세울 선을 그리고, 두 모둠으로 나누어 가위바위보로 공격과 수비를 정한다. 2) 수비 모둠은 비사를 세우고, 공격 모둠은 출발선에서 비사를 던지거나 몸에 얹고 가서 상대 비사를 쓰러뜨린다. 3) 공격 방법은 한 발 뛰기, 던지기, 턱치기, 떡장수(이마), 발등치기, 배치기, 신문 배달(겨드랑이) 순서로 진행한다. 4) 비사를 모두 쓰러뜨리지 못하면 공수를 바꾸고, 모두 쓰러뜨리면 다음 단계로 넘어간다.</p>
