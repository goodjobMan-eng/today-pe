<h1>플라잉디스크 같은 방향에서 달려가 받기</h1>
<p>1) 던지는 사람 1명과 받으러 달릴 사람 2~3명이 같은 방향을 보고 선다. 2) 던지는 사람이 앞으로 디스크를 날리면 대기하던 사람들이 동시에 달려간다. 3) 날아가는 디스크를 끝까지 쫓아가 먼저 캐치한 사람이 포인트를 얻는다.</p>
