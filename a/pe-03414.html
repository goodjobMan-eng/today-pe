<h1>원형 수비 공차기</h1>
<p>1) 모든 학생이 둥글게 원형 대형으로 선다. 2) 자신의 왼발부터 오른쪽 친구의 왼발까지를 자신의 수비 구역이자 골대로 정한다. 3) 자기한테 공이 오면 앞으로 찬다. 4) 왼발부터 가랑이 사이 오른쪽까지 내 구역으로 공이 빠져나가면 아웃되며, 4명 정도 남을 때까지 살아남은 사람이 승리한다.</p>
