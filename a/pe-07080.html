<h1>다리 술래잡기 (Bridge Tag Game)</h1>
<p>1) 술래 2~3명을 정하고 나머지 학생들은 활동 구역에 흩어진다. 2) 술래는 도망치는 사람들을 쫓아가 태그한다. 3) 태그된 사람은 양팔을 위로 들고 서서 양팔을 든 다른 태그된 사람을 찾는다. 4) 양팔을 든 두 사람이 만나 손을 잡고 팔을 연결하여 다리 모양을 만든다. 5) 다른 친구가 다리 아래로 통과해 지나가면 구출되어 다시 도망친다.</p>
