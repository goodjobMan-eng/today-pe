<h1>플로어컬링스톤 보치아 변형 게임</h1>
<p>1) 경기장 중앙에 표적 역할을 하는 원마커(표적구)를 배치하고 양 팀 투구 구역을 설정한다. 2) 각 팀 선수는 정해진 순서에 따라 번갈아 가며 플로어컬링 스톤을 표적 원마커를 향해 굴린다. 3) 상대방 공보다 원마커에 더 가까운 자기 팀 스톤 1개당 1점씩 득점한다. 4) 정해진 엔드가 모두 끝난 후 각 엔드에서 획득한 점수를 합산하여 승자를 가린다.</p>
