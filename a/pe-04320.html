<h1>일본 전통 꼬리잡기 놀이(고로고로)</h1>
<p>1) 술래 1명, 앞사람의 허리를 잡고 기차처럼 늘어선 부모와 자식 팀으로 나뉜다. 2) 술래는 줄의 맨 뒤에 있는 자식을 터치하면 이긴다. 3) 도망치는 도중 부모와 자식의 열이 끊어지면 술래가 이긴다. 4) 맨 앞의 부모가 자식을 술래로부터 끝까지 지켜내면 부모와 자식 팀이 이긴다.</p>
