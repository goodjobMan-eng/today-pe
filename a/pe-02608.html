<h1>홈트레이닝 기초 체력 운동</h1>
<p>1) 층간소음 방지를 위해 매트를 깔고 제자리 높이뛰기 동작으로 전신 워밍업을 한다. 2) 무릎이 발끝 앞으로 과도하게 나오지 않고 허리를 편 상태로 스쿼트를 10회씩 3세트 실시한다. 3) 팔을 어깨보다 넓게 벌리고 허리를 편 상태로 팔굽혀펴기를 10회씩 3세트 실시한다(힘들면 무릎을 대고 실시). 4) 양손을 가슴 앞에 모으고 무릎을 들어 올린 채 10초간 버티며 균형 감각을 기른다.</p>
