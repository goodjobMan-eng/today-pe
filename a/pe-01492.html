<h1>뜀틀 명인 무대 뛰어오르기 손 짚고 밀치기</h1>
<p>1) 강당 무대 모서리에 매트를 세로로 깔고 안전 착지 지대를 만든 뒤 발구름판을 앞쪽에 배치한다. 2) 도움닫기 후 발구름판 직전에서 외발 홉(Hop) 동작으로 리듬을 탄다. 3) 두 발로 구름판을 강하게 구르고 무대 매트에 양손을 짚으며 강하게 밀쳐내(찌르기) 두 발로 무대 위에 착지한다. 4) 착지가 안정되면 구름판 거리를 넓히거나 손 밀치기 반동을 강화하여 체공 높이를 높인다.</p>
