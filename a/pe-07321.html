<h1>마라톤다(원형 이어달리기)</h1>
<p>1) 접시콘으로 큰 원을 만들고 3~4개 팀으로 나누어 원 바깥의 같은 간격 지점에 일렬로 선다. 2) 출발 신호에 각 팀의 1번 주자가 같은 방향으로 동시에 출발하여 원을 한 바퀴 완전히 돈다. 3) 2번 주자에게 바통을 넘기고, 정해진 바퀴 수를 가장 먼저 완주한 팀이 승리한다.</p>
