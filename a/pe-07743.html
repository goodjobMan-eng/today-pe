<h1>물병 줄다리기</h1>
<p>1) 바닥에 7칸, 9칸, 11칸, 13칸 등의 줄다리기 칸을 그리고 중앙에 물병 1개를 세운다. 2) 양 팀 선수가 번갈아 물병을 3번씩 던져 세우기를 시도하고 다음 선수와 교대한다. 3) 물병을 세우면 중앙에 있던 물병을 자신의 팀 쪽으로 한 칸 이동시킨다. 4) 중앙의 물병을 자신의 팀 마지막 칸 밖으로 먼저 보내면 승리한다.</p>
