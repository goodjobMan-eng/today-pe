<h1>물병 돌리기 술래잡기</h1>
<p>1) 전체 인원이 원 대형으로 둥글게 모여 선다. 2) 가운데 1명이 물병을 바닥에 놓고 강하게 돌린다. 3) 물병이 멈췄을 때 물병 끝(입구)이 가리키는 사람이 술래가 된다. 4) 술래가 결정되는 즉시 술래는 도망치고, 나머지 모든 사람이 10초 안에 술래를 잡아야 하며 잡히면 술래가 벌칙을 받는다.</p>
