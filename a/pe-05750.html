<h1>방향 전환 달리기 마주 보고 피하기</h1>
<p>1) 두 명이 짝을 지어 한 명은 공격, 한 명은 수비(술래) 역할을 맡는다.2) 등을 돌리지 않고 서로 마주 본 상태에서 방향을 전환하며 달린다.3) 공격은 방향을 빠르게 전환하여 수비를 피하고, 등을 보이면 패배한다.</p>
