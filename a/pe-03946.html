<h1>홈 플랭크 하키</h1>
<p>1) 양손을 짚고 엉덩이가 너무 높거나 낮지 않게 곧게 편 플랭크 자세를 취한다. 2) 준비가 되면 양말(또는 퍽 대용품)을 미끄러운 바닥에서 목표선 테이프를 향해 밀어 슬라이딩한다. 3) 양말이 테이프 선에 닿으면 1점을 획득하며, 5점을 먼저 낼 때까지 도전한다. 4) 파트너가 맞은편에서 팔을 벌리고 플랭크를 서서 양팔 사이로 양말을 통과시켜 득점하는 방식으로 변형한다.</p>
