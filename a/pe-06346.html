<h1>레프러콘 스톰프</h1>
<p>1) 화면 트랙을 따라 플레이 존으로 내려오는 버튼의 색상을 확인한다2) 빨간색 버튼이 들어오면 왼발로 구르거나 홉을 하고, 노란색 버튼은 오른발로 구르거나 홉을 한다3) 빨간색과 노란색이 함께 나오면 점프를 하고, 파란색은 박수치기, 보라색은 허벅지 치기를 수행한다4) 퀴즈 미니게임이 나오면 질문을 듣고 선택지에 해당하는 신체 동작을 수행해 정답을 맞힌다</p>
