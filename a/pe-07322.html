<h1>성 지키기 놀이(카스텔로)</h1>
<p>1) 경기장 중앙에 큰 원을 그리고 원 한가운데에 표적(성)을 설치한다. 2) 수비팀은 원 안쪽에 위치하고 공격팀은 원 바깥쪽에 둘러선다. 3) 원 바깥의 공격팀은 손으로 공을 패스하며 중앙의 표적을 맞히려 하고, 안쪽 수비팀은 표적을 막아내며 정해진 시간 후 역할을 바꾸어 더 높은 점수를 얻은 팀이 승리한다.</p>
