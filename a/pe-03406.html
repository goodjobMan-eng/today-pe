<h1>나비 야구</h1>
<p>1) 나비 모양으로 공격과 수비 구역을 그리고 배팅 티를 중앙에 놓는다. 2) 4~5명씩 2개 모둠을 이루어 공격 모둠 타자가 배팅 티 위의 공을 친다. 3) 공을 치면 공격 모둠원 전원이 함께 반대편 구역의 누를 돌아 홈으로 들어온다. 4) 수비 모둠이 공을 잡아 4개의 누로 차례대로 모두 전달하기 전에 공격 모둠이 홈을 밟으면 1점을 얻는다.</p>
