<h1>숫자 피구 (Zahlenvölkerball)</h1>
<p>1) 팀을 나누고 각 팀원에게 1번부터 차례대로 연속된 고유 번호를 비밀리에 부여한다 2) 경기 시작 후 상대 팀의 번호 순서(1번, 2번 등)에 맞춰 지정된 순서대로만 공을 던져 아웃시킨다 3) 상대의 공격 번호에 해당하지 않는 수비 선수는 대상 선수를 보호하기 위해 앞을 가로막아 줄 수 있다 4) 마지막 번호를 가진 외야수(Freigeist) 및 상대 팀 전원을 순서대로 맞히면 승리한다</p>
