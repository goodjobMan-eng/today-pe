<h1>다리 사이로 패널티킥</h1>
<p>1) 두 모둠이 3m 간격을 두어 마주보고 개인당 콩주머니 2개씩 들고 선다. 2) 모둠원 모두 다리를 벌려 양옆의 친구와 발을 붙이고 선다. 3) 신호가 울리면 허리를 숙이고 콩주머니를 밀어 상대 모둠원의 다리 사이로 보낸다. 4) 상대 모둠은 다리 사이로 오는 콩주머니를 손으로 잡아 막고 상대 모둠원에게 밀어보내며, 정해진 시간 동안 다리 사이로 많이 밀어 넣은 모둠이 이긴다.</p>
