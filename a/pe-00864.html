<h1>올라프의 겨울 런 선물 찾기</h1>
<p>1) 올라프가 잃어버린 크리스마스 선물을 찾기 위해 제자리에서 달리며 장애물을 피합니다. 2) 레벨마다 등장하는 장애물 지시에 맞추어 점프나 회피 신체 활동을 수행합니다. 3) 선물이 숨겨진 가방을 맞히는 퀴즈를 풀고 눈길 탈출 수단을 선택합니다. 4) 떨어지는 선물을 자루로 받아내는 미션을 완수하며 3개 레벨을 모두 클리어합니다.</p>
