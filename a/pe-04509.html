<h1>나눗셈 셔틀 런 릴레이</h1>
<p>1) 활동 구역에 1부터 10까지 숫자가 붙은 콘 10개를 무작위로 배치하고 모둠별로 출발 콘 뒤에 선다. 2) 교사가 나눗셈 문제를 부르면 각 모둠의 첫 번째 주자가 정답을 계산한다. 3) 계산한 정답 숫자가 적힌 콘을 빠르게 돌아 모둠으로 복귀한다. 4) 먼저 돌아온 순서대로 점수를 얻고 다음 주자가 준비한다.</p>
