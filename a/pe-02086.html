<h1>보물 지키기 피구</h1>
<p>1) 일반 피구 경기장 한가운데 책상이나 의자를 두고 그 위에 보물(라바콘)을 올립니다. 2) 일반 피구와 같이 공을 던지고 피하며 상대팀 보물을 맞춰 책상 위에서 떨어뜨립니다. 3) 공에 맞으면 아웃되어 외야로 나갑니다. 4) 내야에 살아남은 사람이 많아도 보물이 바닥에 떨어지면 지게 됩니다.</p>
