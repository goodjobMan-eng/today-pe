<h1>콘 세우기와 뒤집기 (빌더와 불도저)</h1>
<p>1) 체육관이나 야외 바닥에 작은 콘 20~30개를 절반은 똑바로, 절반은 엎어서 흩어 놓는다. 2) 학급을 빌더 팀과 불도저 팀의 두 모둠으로 나눈다. 3) 빌더는 쓰러진 콘을 바로 세우고, 불도저는 세워진 콘을 쓰러뜨린다. 4) 1분 정도마다 역할을 바꾸고 스키핑, 홉핑 등 이동 동작 조건을 변경해 진행한다.</p>
