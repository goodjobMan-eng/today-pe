<h1>캐치 더 치킨 (하울러 달리기 게임)</h1>
<p>1) 투척 팀과 주자 팀으로 역할을 나눈다. 2) 투척 팀 주자가 하울러(또는 테니스공)를 필드로 멀리 던진 뒤 자기 팀원들 주변을 계속 돌며 점수를 얻는다. 3) 주자 팀은 날아온 하울러를 잡아 팀원들 다리 사이로 통과시킨 뒤 머리 위로 다시 전달해 맨 앞으로 보낸다. 4) 주자 팀 학생이 하울러를 들고 투척 팀으로 달려가 돌려주면 주자의 점수 획득이 멈추고, 전원 투척 후 공수를 교대한다.</p>
