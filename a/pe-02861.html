<h1>공 놓고 돌아오기</h1>
<p>1) 팀을 나누고 출발 콘에 손을 대고 출발 준비를 한다. 2) 첫 주자는 축구공을 발로 드리블하여 훌라후프 안에 넣고 출발 콘으로 돌아온다. 3) 다음 주자는 달려가서 훌라후프 안의 공을 발로 드리블해 가져와 훌라후프 안에 다시 넣는다. 4) 번갈아 진행하여 먼저 출발 콘으로 돌아와 터치하는 팀이 승리한다.</p>
