<h1>짐볼 피구</h1>
<p>1) 원 형태로 둘러앉아 가운데 있는 친구를 향해 짐볼을 굴린다. 2) 공에 맞으면 아웃되어 다음 사람과 교대하여 자리로 들어간다. 3) 두 번째 단계에서는 원을 크게 넓히고 짐볼을 던져서 맞힌다. 4) 던진 공을 가운데 사람이 받으면 던진 사람이 뒤로 돌아 등이나 다리를 맞는다.</p>
