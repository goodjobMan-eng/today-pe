<h1>탁구공을 지켜라</h1>
<p>1) 접시콘으로 영역을 표시하고 술래는 안대를 착용한 채 펀스틱을 든다.2) 참가자들은 탁구공이 떨어지지 않도록 받쳐 든 채 술래를 피해 도망 다닌다.3) 펀스틱에 맞거나, 영역을 벗어나거나, 탁구공을 떨어뜨리면 쉼터에서 스쿼트 2회를 하고 복귀한다.4) 중계자가 술래의 위치를 소리로 안내하는 상황에서 끝까지 공을 지킨 학생이 승리한다.</p>
