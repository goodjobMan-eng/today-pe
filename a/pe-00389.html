<h1>집콕놀이 쓰러지는 가위바위보 2가지</h1>
<p>1) 두 사람이 마주 보고 서서 가위바위보를 합니다. 2) 쓰러질 때까지 가위바위보는 한 번 질 때마다 한쪽 무릎 꿇기, 양쪽 무릎 꿇기, 팔베개하고 눕기 순으로 자세를 낮춥니다. 3) 총 4번 먼저 지면 최종 패배합니다. 엉덩방아 가위바위보는 질 때마다 점차 스쿼트 자세로 무릎을 깊게 구부려 낮추며, 버티지 못하고 바닥에 먼저 엉덩방아를 찧는 사람이 패배합니다. 4) 3~4명 이상의 인원도 함께 즐길 수 있습니다.</p>
