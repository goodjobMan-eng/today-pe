<h1>게이트 통과 패스 드릴</h1>
<p>1) 교사가 활동 구역 전체에 콘을 2개씩 짝지어 여러 개의 게이트를 설치한다. 2) 학생들은 두 명씩 짝을 짓고 공 1개를 공유한다. 3) 한 명이 리더가 되어 게이트로 드리블해가면 상대방은 게이트 반대편에 선다. 4) 두 사람이 게이트 사이로 패스를 3회 주고받은 뒤, 역할을 바꾸어 다른 게이트로 이동하며 제한 시간 동안 최대한 많은 게이트를 통과한다.</p>
