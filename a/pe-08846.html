<h1>바이러스 술래잡기 (Juego VIRUS)</h1>
<p>1) 술래(바이러스)를 정하고 나머지 사람들은 지정된 구역 내에서 도망칩니다. 2) 술래에게 잡히지 않으려면 양손을 가슴에 대고 &quot;코비드(Covid)&quot;라고 외치며 제자리에 멈춰 자가격리 상태가 됩니다. 3) 자가격리 중에는 이동할 수 없지만 술래에게 잡히지 않으며, 다른 참가자가 와서 팔꿈치를 터치해주어야 해제되어 다시 도망칠 수 있습니다.</p>
