<h1>줄 아래 공 굴리기 게임</h1>
<p>1) 1미터 높이에 고무줄을 설치하여 경기장을 양쪽 진영으로 나눈다. 2) 공을 손으로 던지거나 굴려 1미터 높이 고무줄 아래를 통과시켜 상대 벽면을 맞히면 득점한다. 3) 수비는 손이나 발로 공을 막을 수 있으며, 공격 시에는 손으로만 던질 수 있다.</p>
