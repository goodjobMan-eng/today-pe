<h1>사다리 마주보기 대향 스텝 챌린지</h1>
<p>1) 스텝래더를 1자 또는 사각형으로 바닥에 길게 설치하고 양 끝 또는 마주보는 지점에 모둠원을 배치한다. 2) 신호가 울리면 양쪽에서 동시에 다양한 스텝(앞으로 뛰기, 옆걸음, 엇갈리기 등)으로 래더 칸을 밟으며 전진한다. 3) 중간 지점에서 상대와 마주칠 때 부딪히지 않도록 서로 스텝을 조율하며 교차 통과한다. 4) 사각형 배열에서는 4명이 동시에 출발해 코너를 돌아 정해진 위치까지 릴레이 방식으로 완주한다.</p>
