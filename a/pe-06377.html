<h1>슬라임 스톰프 브레인 브레이크</h1>
<p>1) 매 라운드 슬라임을 맞힐 캐릭터를 한 명 선택한다.2) 트랙을 따라 이동하는 버튼이 플레이 존에 도달하면 해당 신체 동작을 수행한다.3) 빨간색은 왼발 스톰프/홉, 노란색은 오른발 스톰프/홉, 빨강과 노랑은 점프, 파란색은 박수, 보라색은 허벅지 치기이다.4) 미니게임 구간에서는 화면 중앙의 지정 포즈를 유지한 채 서로 다른 부분 세 곳을 찾는다.</p>
