<h1>코디네이션 사다리 기본 스텝 및 접지 변형 훈련 1</h1>
<p>1) 사다리 칸마다 한 발씩 균일하게 디디며 통과한다. 2) 각 칸마다 두 발씩(양발 2접지) 번갈아 딛고 전진한다. 3) 1접지와 2접지를 번갈아 조합하여 리듬에 맞춰 달린다. 4) 1접지, 2접지, 3접지를 순차적으로 늘렸다가 줄이며 통과한다.</p>
