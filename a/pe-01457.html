<h1>순발력 쑥쑥 180도·360도 점프 회전</h1>
<p>1) 주변 장애물을 치우고 양팔 간격으로 넓게 벌려 바르게 선다. 2) 가벼운 반동으로 제자리에서 90도씩 회전하며 안정적으로 착지하는 연습을 한다. 3) 신호에 맞추어 점프하여 공중에서 180도 뒤로 돌거나 360도 한 바퀴를 돌아 착지한다. 4) 두 발 점프가 익숙해지면 한 발 켄켄 점프로 회전 각도를 점진적으로 늘려 도전한다.</p>
