<h1>원마커 풍선 피구</h1>
<p>1) 교실 중앙에 라인 테이프로 코트를 나누고 학생마다 원마커를 1개씩 나누어 준 뒤 원하는 자리에 놓는다. 2) 경기 중에는 자리를 옮길 수 없고 원마커에서 발을 뗄 수 없다. 3) 풍선에 맞으면 아웃되어 원마커를 들고 자신의 팀 외야로 이동하며, 외야에서도 원마커를 놓고 서서 공격에 참여한다. 4) 풍선을 바로 잡거나 친구를 맞은 풍선이 바닥에 떨어지기 전에 같은 팀원이 잡으면 세이프가 된다.</p>
