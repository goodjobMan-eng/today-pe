<h1>과일바구니 게임</h1>
<p>1) 술래는 가운데 서고 다른 사람들은 바닥에 놓인 훌라후프 안에 한 명씩 섭니다. 2) 훌라후프에 서 있는 사람들은 각자 세 가지 과일 중 하나를 정해 맡습니다. 3) 가운데의 술래가 과일 이름을 외치면 해당 과일인 사람들과 술래가 빈 훌라후프를 찾아 이동합니다. 4) 자리를 찾지 못해 남은 사람이 다음 술래가 되어 게임을 반복합니다.</p>
