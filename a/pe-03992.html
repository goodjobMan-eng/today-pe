<h1>컵스 앤 카디오 3 피트니스 챌린지</h1>
<p>1) 화면에 컵 쌓기 모양 사진과 유산소 운동 미션이 동시에 제시된다. 2) 1분의 제한 시간 동안 화면에 표시된 것과 동일한 모양으로 컵 스택을 완성한다. 3) 컵 모양 완성을 마치면 해당 라운드의 남은 시간 동안 지정된 유산소 운동을 계속 수행한다. 4) 라운드 종료 후 주어지는 10초의 휴식 시간 동안 컵을 원래 상태로 정리한다.</p>
