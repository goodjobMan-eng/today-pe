<h1>놀이형 어린이 체간(코어) 트레이닝</h1>
<p>1) 몸을 연필처럼 곧게 펴고 바닥을 구르는 연필 구르기와, 오뚝이처럼 굴렀다 일어나는 다루마 동작을 합니다. 2) 벽에 발을 대고 물구나무를 서서 옆으로 이동하는 닌자 벽 걷기와 스파이더 기어가기 동작으로 코어 힘을 기릅니다. 3) 플랭크 자세를 취한 상태에서 상대와 바닥으로 공을 굴려 주고받는 캐치볼 놀이를 합니다. 4) 공 개수를 늘리거나 버티는 시간을 점진적으로 늘려 가며 재미있게 도전합니다.</p>
