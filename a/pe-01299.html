<h1>순발력 가위바위보 5종 세트</h1>
<p>1) 두 명씩 짝을 짓고 책상을 마주 보거나 정면에 선다. 2) 만세 가위바위보, 졌다 가위바위보, 손잡고 순발력 터치, 가위바위보 숫자 더하기, 뿅망치 대결 중 한 가지 규칙을 선택한다. 3) 승패 확인 후 만세하며 구호 외치기, 손등 터치하기, 합산 숫자 먼저 말하기를 성공한 학생이 1점을 얻는다. 4) 익숙해지면 반대로 말하기(지면 이겼다 외치기)나 수비와 공격 역할을 바꿔서 진행한다.</p>
