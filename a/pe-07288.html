<h1>평균대 및 매트 구르기 감각 운동</h1>
<p>1) 좁고 높은 표면인 10cm 너비의 평균대 위를 기어가거나 걸어서 지나간다. 2) 손과 발의 위치에 맞춰 손발 지지를 활용하며 이동한다. 3) 뒤로 넘어지는 두려움을 줄이며 매트 위에서 몸을 굴려 회전한다. 4) 달리기, 점프하기, 구르기를 순서대로 연결하여 복합 동작을 수행한다.</p>
