<h1>축구 스텝오버 기술 및 지그재그 릴레이 훈련</h1>
<p>1) 정지된 축구공을 건드리지 않고 양발을 번갈아 가며 공 위로 넘어가는 헛다리짚기(스텝오버)를 연습한다.2) 지그재그로 배치된 콘 코스의 출발점에 선다.3) 각 콘에 도착할 때마다 공 위로 스텝오버를 한 뒤 다음 콘으로 드리블한다.4) 콘을 건드리지 않고 작은 터치로 드리블하며 출발점까지 돌아온다.</p>
