<h1>가위바위보 이어달리기</h1>
<p>1) 팀을 두 개로 나눕니다. 2) 각 팀에서 먼저 달릴 순서를 정합니다. 3) 경기가 시작되면 각 팀에서 순서대로 달려 상대방을 만나면 가위바위보를 합니다. 4) 가위바위보에서 이겼다면 계속 상대진영을 향해 달리고 졌다면 그 자리에 앉습니다. 5) 상대방 진영에 먼저 도달하는 팀이 승리합니다. 6) 가위바위보에서 져서 앉아 있는 사람은 우리 팀 팀원이 나를 지나칠 때 다시 일어나 팀 뒤에 줄을 섭니다.</p>
