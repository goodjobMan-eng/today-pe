<h1>다람쥐와 사냥꾼 놀이</h1>
<p>1) 다람쥐 1명과 사냥꾼 1명을 정하고, 나머지 학생들은 숲 역할을 맡아 손을 잡고 바깥쪽을 향해 둥글게 선다 2) 사냥꾼은 숲 사이를 이동하며 도망치는 다람쥐를 쫓아 잡는다 3) 숲 역할의 학생들은 사냥꾼이 통과하지 못하도록 손을 막아 다람쥐를 보호하고, 다람쥐가 잡히면 역할을 바꾼다</p>
