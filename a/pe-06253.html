<h1>병뚜껑 셔틀런</h1>
<p>1) 세 명씩 두 팀을 만들고 팀당 병뚜껑 약 15개와 접시콘 1개를 준비해 병뚜껑 1개씩만 소유하고 나머지는 출발선의 접시콘에 넣는다.2) 5m 거리의 도착 지점으로 이동해 상대팀과 가위바위보를 한다.3) 가위바위보에서 이기면 상대의 병뚜껑을 획득해 출발선 접시콘에 저장하고, 진 팀은 병뚜껑을 준 뒤 출발선으로 뛰어가 접시콘에서 새 병뚜껑을 가져와 다시 대결한다.4) 정해진 시간 동안 반복한 뒤 병뚜껑을 더 많이 모은 팀이 승리한다.</p>
