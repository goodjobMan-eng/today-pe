<h1>그린치 밸런스 게임 인터랙티브 홈트레이닝</h1>
<p>1) 화면에 제시되는 크리스마스 및 그린치 테마의 두 가지 선택지 중 하나를 고릅니다. 2) 화면이 전환되면 자신이 선택한 쪽에 해당하는 운동 동작을 타이머 동안 따라 합니다. 3) 중간에 등장하는 선물 상자 속 캐릭터 맞히기나 그린치 달리기 레이스 등 미니게임에 적극적으로 참여합니다. 4) 달리기 레이스가 시작되면 제자리 달리기를 하면서 응원하고 끝까지 재미있게 완주합니다.</p>
