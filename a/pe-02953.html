<h1>푸시업 5세트 운동</h1>
<p>1) 1세트는 느린 속도로 푸시업 10개를 실시하고 10초간 휴식한다. 2) 2세트는 빠른 속도로 푸시업 10개를 실시하고 10초간 휴식한다. 3) 3세트는 느리게 10개, 4세트는 빠르게 10개를 실시하며 세트 사이에 10초씩 쉰다. 4) 마지막 5세트는 30초 동안 쉬지 않고 최대한 많은 개수를 채워 실시한다.</p>
