<h1>코너별 농구 레이업 릴레이 레이스</h1>
<p>1) 체육관 네 개 코너에 4개 팀으로 나누어 정렬하고 각 팀에 농구공을 1개씩 배정한다.2) 휘슬이 울리면 각 팀의 첫 번째 주자가 반대쪽 골대로 달려가 레이업 슛을 성공시킨다.3) 자기 공을 리바운드하여 반대쪽 골대로 드리블해 다시 레이업 슛을 넣은 뒤 자기 팀으로 공을 가지고 돌아오며 가장 먼저 성공한 팀이 점수를 얻는다.</p>
