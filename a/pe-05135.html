<h1>공룡 섬 (기구 없는 체육 게임)</h1>
<p>1) 한 명이 중앙에서 공룡이 되어 공룡 섬을 지키고, 나머지 관광객들은 주변에 원을 이루어 선다.2) 관광객들은 공룡 섬 안으로 살금살금 기어들어가 2m 이내로 접근한다.3) 공룡에게 움직임이 발각되면 출발 지점으로 돌아가야 하며, 멈춰 서서 균형을 잡고 있으면 들키지 않는다.4) 가장 먼저 공룡 섬에 도달한 관광객이 승리하고 다음 게임의 공룡이 된다.</p>
