<h1>숟가락 탁구공 이어달리기</h1>
<p>1) 책상을 세로로 길게 연결하여 반환 코스를 만든다. 2) 플라스틱 숟가락 위에 탁구공을 올리고 책상을 한 바퀴 돌아 출발점으로 복귀한다. 3) 다음 주자에게 숟가락 대 숟가락으로 공을 떨어뜨리지 않고 옮겨준다. 4) 업그레이드 활동으로는 책상 간격을 띄워 놓고 책상 사이를 지그재그로 통과하며 달린다.</p>
