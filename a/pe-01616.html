<h1>스카프 저글링 신체 협응 챌린지</h1>
<p>1) 각자 스카프 두 장을 양손에 쥐고 주변 공간을 확보하여 선다. 2) 한 손의 스카프를 공중에 띄우고 반대쪽 어깨·무릎·뒤꿈치를 터치한 후 떨어지는 스카프를 다시 잡는다. 3) 양손의 스카프를 연속으로 띄운 뒤 박수를 치고 두 손으로 번갈아 잡아채며 협응력을 기른다. 4) 스카프를 띄워 공중에서 교차시켜 잡는 크로스 저글링으로 난이도를 높여 도전한다.</p>
