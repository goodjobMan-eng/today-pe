<h1>허수아비 팀 꼬리잡기</h1>
<p>1) 라바콘 4개로 사각 경기장을 만들고 두 팀으로 나누어 각자 바지 뒤에 팀 조끼 꼬리를 넣는다. 2) 신호와 함께 경기장 안을 자유롭게 뛰며 상대 팀 친구의 꼬리를 뽑으러 다닌다. 3) 꼬리를 빼앗긴 사람은 꼬리가 떨어진 자리에 서서 한 발을 고정한 채 허수아비가 되어 지나가는 상대를 태그해 꼬리를 뺏는다. 4) 정해진 경기 시간이 끝난 후 팀 조끼 꼬리를 유지하고 살아남은 인원이 더 많은 팀이 승리한다.</p>
