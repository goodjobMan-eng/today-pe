<h1>다리 벌려 뒤구르기 활동</h1>
<p>1) 매트 위에 뒤로 앉으며 발로 매트를 밀어 몸의 중심을 뒤로 옮긴다. 2) 뒤로 앉으며 무릎과 얼굴의 거리를 가깝게 유지한다. 3) 허리가 매트에 닿으면 무릎을 가슴 쪽으로 당기고 다리를 머리 뒤로 보낸다. 4) 뒷머리가 매트에 닿으면 두 다리를 벌리고 손바닥으로 매트를 힘껏 밀며 일어선다.</p>
