<h1>풋티 그레네이드</h1>
<p>1) 콘 4개로 약 10x10 크기의 팀별 진지 구역을 사각형으로 만든다 2) 교사가 신호를 보낼 때까지 기다렸다가 신호에 맞춰 상대 진지로 공을 킥한다 3) 수비 팀은 날아오는 축구공을 땅에 떨어뜨리지 않고 캐치(마크)해야 한다 4) 공이 자기 팀 진지 바닥에 떨어지면 벌점을 받으며 최종적으로 벌점이 가장 적은 팀이 승리한다</p>
