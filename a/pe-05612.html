<h1>핑퐁 타워 게임</h1>
<p>1) 책상 위에 팀별 색깔 컵과 검정색 컵으로 지그재그 타워를 배치한다.2) 번갈아 가며 탁구공을 책상에 바운스시켜 컵 안으로 넣는다.3) 자기 팀 컵에 공이 들어가면 해당 컵을 빼내고, 상대 팀 컵에 들어가면 뺐던 컵을 다시 되돌려 놓는다.4) 정해진 시간(3분) 동안 컵을 더 많이 빼내거나 마지막 검정색 컵을 먼저 제거한 팀이 승리한다.</p>
