<h1>컵탁구</h1>
<p>1) 서브는 가위바위보로 순서를 정해 2번씩 번갈아 넣으며, 자기 쪽 테이블에 한 번 닿고 상대방 테이블에 한 번 닿도록 넣는다. 2) 상대가 넣은 공을 컵으로 잡는다. 3) 랠리를 할 때는 내 책상에 닿지 않고 상대방 책상에 닿도록 공을 친다. 4) 공을 제대로 넘기지 못하거나 컵으로 잡지 못하면 상대가 실점/득점한다.</p>
