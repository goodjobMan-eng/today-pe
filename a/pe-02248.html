<h1>남녀협동축구</h1>
<p>1) 남녀가 혼성이 되어 두 팀으로 나눈다. 2) 축구장을 4등분하고 센터라인을 중심으로 좌우측에는 남학생이 들어간다. 3) 여학생은 각각 양쪽 골대의 앞에 위치한다. 4) 남학생 구역에서 패스를 연결하여 골대 앞 여학생에게 전달하고 슈팅하여 득점한다.</p>
