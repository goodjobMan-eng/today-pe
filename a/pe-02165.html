<h1>나무젓가락 고무줄 총 표적 사격</h1>
<p>1) 나무젓가락 3~4개와 고무줄을 결합하여 고무줄 발사 총을 제작한다. 2) 표적으로부터 5~6걸음 뒤로 물러나 정조준 자세를 취한다. 3) 총구와 가늠쇠가 일직선이 되도록 조준한 뒤 손잡이를 당겨 큰 물병 표적을 맞춘다. 4) 물병 맞추기에 성공하면 종이컵, 펜 뚜껑 크기의 소형 표적으로 크기를 줄여가며 도전한다.</p>
