<h1>교실 공 주고받기 반 미션 놀이</h1>
<p>1) 책상을 시험 대형으로 배치하고 분단 맨 앞에 원마커를 놓는다. 2) 원마커 위에 선 주장이 바로 앞에 앉은 친구부터 차례대로 공을 던져 주고받는다. 3) 공을 받아 주장에게 다시 던진 친구는 책상에 엎드리고, 맨 뒤 친구까지 끝나면 주장은 맨 뒤로 가고 앞사람들이 한 칸씩 당겨 앉는다. 4) 반 미션으로 한 줄씩 차례대로 도전하여 모든 줄이 실수 없이 공 주고받기에 성공하면 미션을 완수한다.</p>
