<h1>좌우로 공 주고받고 달리기 게임</h1>
<p>1) 8m 정도 간격으로 양쪽에 콘을 세워 반환점을 표시하고 모둠원이 한 줄로 선 뒤 맨 앞사람이 공을 잡는다. 2) 신호가 울리면 왼쪽부터 시작해 좌우로 공을 번갈아 전달한다. 3) 맨 뒷사람이 공을 받으면 공을 가지고 앞으로 달려 앞과 뒤 두 개의 콘을 돈 뒤 맨 앞줄에 선다. 4) 다시 왼쪽부터 공을 전달하며 모든 모둠원이 콘을 돌아와 먼저 자리에 앉은 모둠이 이긴다.</p>
