<h1>러닝백 릴레이</h1>
<p>1) 모둠을 반으로 나누어 체육관 양쪽 끝에 마주 보고 선다. 2) 주자는 풋볼 공을 품에 안전하게 감싸 쥐고 세워진 수비수들(누들) 사이를 지그재그로 달린다. 3) 반대편 끝에 도착하면 대기 중인 주자에게 쿼터백처럼 공을 핸드오프 방식으로 건넨다. 4) 공을 받은 주자가 반대 방향으로 달리며 릴레이를 계속 이어간다.</p>
