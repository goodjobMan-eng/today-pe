<h1>스트라이크볼</h1>
<p>1) 4~10명이 모여 각자 좌우 사람과 발을 맞대고 다리 사이에 틈을 만들어 원형을 이룬다. 2) 몸을 약간 웅크리고 손을 사용해 가운데 있는 공을 서로 쳐서 주고받는다. 3) 공이 누군가의 다리 사이로 통과하면 쳐서 넣은 사람이 1점을 얻는다. 4) 실점한 선수가 공을 주워 원 안으로 가져와 경기를 이어간다.</p>
