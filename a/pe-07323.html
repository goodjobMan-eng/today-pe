<h1>살아있는 공 릴레이 게임</h1>
<p>1) 각 팀 앞에 1~1.5m 간격으로 콘 4개를 일렬로 배치하고 끝에 훌라후프를 둔다. 2) 첫 번째 주자는 출발하여 첫 번째 콘 위에 공을 올려두고 팀으로 돌아온다. 3) 두 번째 주자는 첫 번째 콘을 슬라럼으로 통과해 공을 주워 두 번째 콘에 올려두고 돌아온다. 4) 다음 주자들도 순서대로 다음 콘으로 공을 옮기며, 마지막 훌라후프에 공을 가장 먼저 넣은 팀이 승리한다.</p>
