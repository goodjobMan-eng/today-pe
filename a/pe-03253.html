<h1>구역 나누어 공 빼앗기</h1>
<p>1) 바닥에 구역을 나누어 2개의 경기장을 그리고, 6명씩 2개 모둠으로 구성하여 모둠별로 공격수 4명과 수비수 2명을 정한다. 2) 각각의 구역에 공격수 4명과 상대 모둠의 수비수 2명이 함께 들어가 준비한다. 3) 공격수는 정해진 구역 안에서 공을 이어주고, 수비수는 상대 공격수의 공을 빼앗는다. 4) 공격수가 공을 4번 이어주면 1점을 얻고 수비수가 공을 빼앗으면 2점을 얻으며, 10점을 먼저 얻은 모둠이 이긴다.</p>
