<h1>스턴트 조종사 장애물 놀이</h1>
<p>1) 양팔을 옆으로 벌려 비행기 자세를 취하고 활동 구역을 이동한다. 2) 벤치 위에서 균형을 잡고, 의자에 묶인 줄넘기 아래로 낮게 통과한다. 3) 콘 사이를 지나고 바닥의 폼볼을 발로 찬 뒤 훌라후프 안에서 회전한다. 4) 허들을 넘고 사다리를 뒤로 지나간 후 힘이 들면 매트 위에서 휴식한다.</p>
