<h1>변형 사방치기 (Modified Hopscotch)</h1>
<p>1) 8개의 레인과 끝부분 반원 구역으로 바닥에 판을 그리고, 4번과 8번 레인은 반으로 나눈다.2) 마커를 1번 레인부터 차례로 던져 넣고, 마커가 들어간 레인을 건너뛰어 외발로 뛴다.3) 양발을 디딜 수 있는 4번과 8번 레인에서 균형을 잡고 돌아선 후, 외발로 마커를 줍거나 발가락으로 쳐서 출발선으로 되돌아온다.</p>
