<h1>직접 만든 낙하산 협동 놀이</h1>
<p>1) 학생들이 원 형태로 낙하산을 함께 잡고 위아래로 흔들며 움직인다. 2) 호명된 사람이나 숫자에 맞춰 자리를 바꾸거나 안으로 이동한다. 3) 공이나 풍선을 낙하산 위에 올려 떨어뜨리지 않고 튀기거나 이동시킨다.</p>
