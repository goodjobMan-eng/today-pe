<h1>멀리뛰기 도움닫기 및 마크 발구르기 연습</h1>
<p>1) 발구르기판에서 출발점 방향으로 걸어가며 보폭을 확인해 출발 위치(예: 12보)를 정한다. 2) 출발선에서 발구르기판을 향해 점진적으로 속도를 높이며 전력에 가깝게 도움닫기 달리기를 한다. 3) 발구르기 2보 전(3족장)과 1보 전(5족장)에 표시된 마커를 따라 보폭을 조절하며 리듬을 높여 발을 구른다. 4) 구름발 반대쪽 무릎과 팔을 동시에 위로 신속하게 끌어올려 높이를 확보한다.</p>
