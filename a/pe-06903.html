<h1>리핑(도약하기) 기초 움직임 기술</h1>
<p>1) 도약하여 착지할 앞쪽 방향을 눈으로 똑바로 응시한다. 2) 한쪽 다리로 서서 발바닥을 바닥에 강하게 밀착시키며 균형을 잡는다. 3) 지지하는 무릎을 굽힌 후 반대쪽 발로 높고 길게 뛰어넘듯이 도약한다. 4) 착지한 발로 균형을 유지하며 앞뒤, 좌우 등 다양한 방향으로 번갈아 뛰는 연습을 반복한다. 5) 균형을 잡기 어려울 때는 벽을 짚고 지지하며 균형 잡기와 도약 동작을 단계적으로 연습한다.</p>
