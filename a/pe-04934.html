<h1>달리기 빠르게 달리기 기본 트레이닝</h1>
<p>1) 직선을 따라 발끝이 정면을 향하도록 지면을 뒤로 강하게 차며 달린다.2) 팔꿈치를 90도로 굽히고 양팔을 앞뒤로 흔들어 골반 회전과 고관절 움직임을 이끌어낸다.3) 발목 점프와 인간 드리블(파트너가 어깨를 가볍게 눌러 탄력 유도)로 지면 반발력을 익힌다.4) 고관절로 허벅지를 빠르게 끌어올리고 빠른 걷기(경보 동작)를 통해 발을 뒤로 당기는 동작을 훈련한다.</p>
