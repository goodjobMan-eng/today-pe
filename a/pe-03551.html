<h1>선 따라 구르기</h1>
<p>1) 반 전체를 세 모둠으로 나누고 모둠별로 구르는 순서를 정합니다. 2) 출발 신호와 함께 첫 번째 모둠원이 구르며, 반환점을 향해 구를 때는 직선을 따라 구르고 반환점을 돌아올 때는 곡선을 따라 구릅니다. 3) 첫 번째 모둠원이 반환점을 돌아오면 다음 순서의 모둠원이 출발합니다. 4) 마지막 모둠원이 가장 먼저 출발선으로 돌아온 모둠이 이깁니다.</p>
