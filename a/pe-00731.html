<h1>철봉 운동 단계별 지도와 보조 요령</h1>
<p>1) 철봉에서 다리 걸쳐 내리기, 앞으로 돌아 내리기, 거꾸로 오르기 등 다양한 회전 및 내리기 기술을 단계적으로 익힙니다. 2) 매달려 진동을 만들고 손목을 꺾어 넘기는 동작을 통해 자연스럽게 몸을 띄워 내립니다. 3) 보조자는 회전력이 멈추지 않도록 적절한 타이밍에 허리나 허벅지를 받쳐 가속을 돕습니다. 4) 수준에 맞춰 낮은 철봉부터 시도하며 점진적으로 난이도를 높여 도전합니다.</p>
