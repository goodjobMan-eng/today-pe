<h1>충전해 주세요!</h1>
<p>1) 모든 학생은 손등 위에 미니 고깔(배터리)을 올린 채 활동 구역 안에서 자유롭게 움직인다. 2) 술래는 돌아다니며 도망치는 친구들의 손등에 있는 배터리를 쳐서 떨어뜨린다. 3) 배터리가 떨어진 학생은 그 자리에 멈춰 서고, 살아있는 다른 친구가 배터리를 다시 손등에 올려 주면 부활하며 정해진 시간 동안 목표 인원 이상 살아남으면 승리한다.</p>
