<h1>공 잡기 관찰 피드백 연습</h1>
<p>1) 구역별로 한 팀이 굴려주는 공 잡기를 연습하면 반대편 구역 친구는 앉지 말고 가까이 가서 관찰하고 피드백을 제공한다.2) 무릎을 꿇으면 움직이지 못하므로 굴러오는 공의 방향을 먼저 잡고 몸을 미리 숙여 공을 감싸며 잡는다.3) 역할을 바꾸어 다른 구역 친구가 연습하고 상대 친구가 관찰 및 피드백을 진행한다.</p>
