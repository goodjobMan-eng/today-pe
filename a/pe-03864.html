<h1>세이 마이 네임 가위바위보</h1>
<p>1) 체육관 안에서 가능한 한 빨리 짝을 찾는다. 2) 짝을 만나면 이름을 말하며 인사하고 주먹 인사를 나눈다. 3) 3판 2선승제로 가위바위보를 한다. 4) 승자는 손을 들고 체육관을 돌아다니며 다음 상대를 찾고, 패자는 승자를 큰 소리로 응원하는 치어리더가 되어 함께 다닌다.</p>
