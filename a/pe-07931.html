<h1>임금님 모시기 놀이</h1>
<p>1) 우리 반의 임금님을 정하고 임금님 역할을 맡은 친구는 조끼를 입습니다. 2) 다른 친구들은 둘씩 짝을 지어 마주보고 서서 두 손을 맞잡아 임금님이 지나갈 수 있는 문을 만듭니다. 3) 출발 신호가 울리면 임금님은 낮은 자세로 빠르게 문을 통과합니다. 4) 임금님이 지나간 문은 맨 끝으로 이동해 다시 문을 만들어 줍니다. 5) 임금님은 문을 통과해 반환점을 돌아 출발선으로 돌아옵니다.</p>
