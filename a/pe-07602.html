<h1>밀수꾼과 도둑 게임 (Les Contrebandiers)</h1>
<p>1) 팀을 도둑과 밀수꾼(수비/경찰)으로 절반씩 나눈다. 2) 도둑은 지폐를 신발이나 몸에 숨겨 상대 진영을 통과해 반대편으로 운반한다. 3) 밀수꾼에게 잡히면 5초 동안 몸을 수색당하며 지폐를 빼앗기지 않고 최대한 많이 옮겨야 한다.</p>
