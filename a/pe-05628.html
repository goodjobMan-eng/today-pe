<h1>2대 2 주사위 피구</h1>
<p>1) 가위바위보로 이긴 팀이 주사위의 홀수나 짝수를 선택하고 먼저 굴린다.2) 나온 눈에 해당하는 팀이 공을 잡고 '얼음'을 외치면 상대 팀은 멈춘다.3) 공을 잡은 팀은 패스를 하거나 세 걸음까지 이동하여 상대를 맞춰 팔찌(점수)를 가져온다.</p>
