<h1>공 3개 토스 저글링 완성하기</h1>
<p>1) 오른손에 2개, 왼손에 1개의 공을 쥔다. 2) 오른손부터 반박자 대각선으로 공을 띄워 올린다. 3) 세 번째 공을 던질 때 동시에 왼손으로 1번 공을 잡고 4번째 박자에 오른손으로 2번 공, 5번째 박자에 왼손으로 남은 공을 받는다. 4) 공을 받는 개수를 점차 늘려가며 양손으로 연속 토스 저글링을 완성한다.</p>
