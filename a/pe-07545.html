<h1>매트산 브렌발 (마텐베르크 브렌발)</h1>
<p>1) 공격팀 어린이가 수비 필드로 소프트볼을 던진 후, 반대편에 높게 쌓인 매트산을 향해 달린다. 2) 수비팀은 날아온 소프트볼을 잡아 매트산과 출발선 사이를 달리는 주자를 공으로 맞혀 아웃을 노린다. 3) 공격 주자는 공에 맞지 않고 매트산(안전 베이스)에 오른 뒤, 다시 자기 팀 진영으로 무사히 복귀해야 1점을 획득한다(단, 매트산 위에는 동시에 최대 3명까지만 머물 수 있다).</p>
