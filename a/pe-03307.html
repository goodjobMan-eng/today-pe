<h1>코코코 게임</h1>
<p>1) 코끼리 모둠과 코뿔소 모둠으로 나누어 서로 마주 보고 선다. 2) 두 모둠 가운데에 1m 간격을 두고 서로 등을 돌려 앉는다. 3) 교사가 코코코를 말하다가 모둠 이름을 외치면 이름 불린 모둠이 상대 모둠을 잡으러 뛰어간다. 4) 상대 모둠은 앞으로 달려가 안전 구역으로 들어가며, 게임을 5회 진행하여 상대 모둠을 더 많이 잡은 모둠이 승리한다.</p>
