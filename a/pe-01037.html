<h1>다리 벌려 앉기 플라잉디스크 주루 피구</h1>
<p>1) 수비팀은 바닥에 다리를 넓게 벌리고 원형으로 둘러앉고, 공격팀 2~3명은 원 안에서 대기한다. 2) 수비팀은 바닥을 통해 소프트 디스크를 패스하며 원 안의 공격수를 향해 낮게 던져 맞힌다. 3) 공격팀 주자는 수비팀의 벌린 다리 사이로 빠져나가 원 바깥을 한 바퀴 돌아 다시 안으로 생환을 시도한다. 4) 주자가 무사히 돌아오면 득점하고, 도는 도중이나 원 안에서 디스크에 맞으면 아웃되어 역할을 교대한다.</p>
