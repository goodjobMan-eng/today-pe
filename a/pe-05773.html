<h1>술래 피해 공 던지고 잡기</h1>
<p>1) 3명이 한 모둠이 되어 술래 1명을 정한다.2) 정한 구역에서 양쪽 선수는 가운데 구역의 술래를 피해 반대쪽으로 공을 던지고 받는다.3) 술래는 가운데 구역에서 날아오는 공을 가로챈다.4) 술래의 몸에 닿거나 패스를 놓치거나 공이 구역 밖으로 나가면 술래를 교대한다.</p>
