<h1>맥도널드 액션 놀이</h1>
<p>1) 교사가 &quot;맥도널드 준비!&quot;를 외치면 다리를 움직이며 양손을 돌려 &quot;야!&quot;를 외친다.2) &quot;맥도널드!&quot; 구호에 맞춰 햄버거 동작(양손으로 빵 만들기)이나 콜라 동작(컵과 빨대 만들기) 중 하나를 취한다.3) 공정한 판정을 위해 학생들은 교사를 등지고 뒤돌아선 상태에서 동작을 취한다.4) 동작 후 뒤를 돌아 교사와 같은 메뉴를 고른 학생은 스쿼트를 수행하고 다시 도전한다.</p>
