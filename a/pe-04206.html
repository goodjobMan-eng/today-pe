<h1>미닛 피트니스</h1>
<p>1) 원 안에 10~15개의 다양한 운동 카드를 배치한다. 2) 음악이 나오는 1분 동안 선택한 운동을 쉬지 않고 실시한다. 3) 음악이 멈추면 20초 동안 짧은 휴식을 취하며 다음 운동 장소로 이동한다. 4) 6~10분 운동 후에는 물을 마시거나 숨을 고르는 긴 휴식을 취한다.</p>
