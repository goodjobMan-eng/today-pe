<h1>체육 퍼트퍼트 골프 놀이</h1>
<p>1) 공과 같은 색의 점(스팟)에 공을 올려놓고 퍼터를 잡는다.2) 발을 정렬하고 옆구리가 표적(벽면 홀)을 향하도록 선다.3) 첫 타는 조금 강하게 치고 이후에는 부드럽게 퍼팅한다.4) 친 공이 완전히 멈출 때까지 기다린 후 멈추면 다음 타를 친다.5) 6회 미만의 타수로 벽면 홀에 공을 넣는 챌린지를 음악이 끝날 때까지 진행한다.</p>
