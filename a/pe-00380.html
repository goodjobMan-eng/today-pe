<h1>신문지 과녁 종이비행기 날리기 운동</h1>
<p>1) 신문지에 5개의 구멍을 뚫고 각 구멍에 10점부터 50점까지 점수를 적어 문틀에 과녁판으로 붙입니다. 2) 과녁에서 세 걸음 떨어진 위치에 출발선을 정합니다. 3) 비행기를 던지기 전에 점핑잭(팔벌려뛰기)을 1회 한 뒤 종이비행기를 날립니다. 4) 구멍을 통과해 얻은 점수를 누적하여 총 200점 이상을 달성할 때까지 걸린 시간을 측정합니다.</p>
