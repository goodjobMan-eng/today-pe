<h1>보틀 플립 하키</h1>
<p>1) 출발선에서 양말공을 하키 스틱이나 빗자루로 쳐서 골대 사이로 1회 슛을 한다. 2) 골을 넣으면 공을 드리블하여 출발선으로 가져온 뒤 스틱을 내려놓는다. 3) 골대 옆에 놓인 종이 위로 물병을 던져 똑바로 세우는 보틀 플립을 성공할 때까지 시도한다. 4) 물병이 서면 다시 스틱을 잡고 슛을 하며 1분 동안 기록한 총 골 수를 측정한다.</p>
