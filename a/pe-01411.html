<h1>기초 매트 운동과 장애물 구르기 20선</h1>
<p>1) 체육관에 안전 매트를 깔고 주변에 훌라후프와 공 등 보조 기구를 배치한다. 2) 앞구르기, 뒤구르기, 통나무 구르기 등 기본 매트 회전 동작을 익힌다. 3) 짝과 손잡고 함께 구르거나 배 위에 풍선을 얹고 떨어뜨리지 않고 구르는 협동 과제를 수행한다. 4) 후프 연속 점프 후 다리 벌려 앞구르기나 타월 캐치 구르기 등 복합 도전 코스를 완주한다.</p>
