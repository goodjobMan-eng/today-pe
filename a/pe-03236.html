<h1>컵쌓기 릴레이 게임 (3-3-3 스태킹 릴레이)</h1>
<p>1) 모둠을 나누고 모둠 안에서 순서를 정해 출발선 뒤로 줄을 선다. 2) 첫 번째 주자는 신호가 울리면 컵이 놓인 반대편 책상으로 뛰어간다. 3) 3개씩 포갠 3묶음의 컵을 왼쪽에서 오른쪽(또는 반대) 방향으로 3개씩 피라미드 형태로 쌓아 올린다. 4) 쌓기를 끝내자마자 같은 방향으로 컵을 다시 포갠 후 출발점으로 달려와 다음 주자와 교대한다.</p>
