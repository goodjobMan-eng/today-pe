<h1>고무줄놀이 이름 게임</h1>
<p>1) 두 사람이 고무줄을 잡고 한 사람이 가운데 선다.2) 발을 벌려 뛰며(straddle jumps) 이름을 알파벳으로 하나씩 외친다.3) 이름을 다 외친 뒤 안으로 뛰었다가 밖으로 뛴다(in and out).</p>
