<h1>플라잉디스크 5가지 스텝 연습</h1>
<p>1) 위로 높이 뛰며 앞으로 전진하는 호핑을 실시한다. 2) 팔을 힘차게 치며 위로 솟구쳐 앞으로 나아가는 리핑을 한다. 3) 진행 방향의 발부터 옆으로 미끄러지듯 이동하는 슬라이딩을 연습한다. 4) 뒷발이 축이 되는 앞발을 넘지 않게 달리는 갤로핑과 두 번씩 바닥을 구르는 스키핑을 플라잉디스크를 든 채 차례로 밟아본다.</p>
