<h1>되돌려뛰기 줄넘기 기술</h1>
<p>1) 한 손은 반대쪽 어깨 위로 올리고 다른 손은 등 뒤 허리에 대는 되돌리기 기본자세를 좌우로 연습한다. 2) 팔을 양옆으로 펴는 동작과 교차하는 동작을 번갈아 연습한다. 3) 되돌리기 동작 타이밍에 맞춰 무릎을 들어 올리는 연습을 진행한다. 4) 발끝을 펴고 무릎을 최소 허리 높이까지 들며 연속 점프로 줄을 넘는다.</p>
