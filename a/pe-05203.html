<h1>풍선 손발 치기 놀이</h1>
<p>1) 자신의 구역에서 오른손과 왼손을 번갈아 가며 풍선을 쳐서 공중에 띄운다.2) 신호가 울리면 자리 중앙으로 돌아와 양손으로 풍선을 잡고 멈춘다.3) 다음 단계로 손과 발을 번갈아(손-발-손-발) 풍선을 치며 떨어뜨리지 않는다.</p>
