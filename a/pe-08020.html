<h1>3선 왕복 리턴 배턴 패스 연습</h1>
<p>1) 3개의 직선을 준비하고 그림과 같이 제1주자와 제2주자부터 마주 보거나 지그재그로 나란히 정렬한다. 2) 제1주자가 출발하여 제2주자에게 배턴을 넘긴다. 3) 제2주자는 반대 방향으로 출발하여 제3주자에게 배턴을 넘기는 방식을 반복하며, 최종 주자는 다시 제1주자에게 넘겨 끊김 없이 연속 연습한다.</p>
