<h1>인성풋살</h1>
<p>1) 3~5명씩 비슷한 수준의 학생들로 팀을 구성하고 팀 구분을 위해 인성조끼를 착용한다. 2) 경기 전 팀별로 상의하여 득점 시 함께할 세리머니를 정하고, 상대 팀의 대단히(1득점 이후 도움만 가능)와 득점이(득점 시 2점 인정)를 선정한다. 3) 경기장 중앙에 서서 인사와 악수로 경기를 시작 및 종료한다. 4) 5~10분간 경기를 진행하며, 득점 후 사전에 정한 세리머니를 팀원 전체가 함께 모여 해야만 득점으로 인정된다.</p>
