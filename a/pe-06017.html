<h1>말랑 비석치기 7단계 게임</h1>
<p>1) 상대 비석을 세워두고 도둑(발등), 오줌싸개(무릎), 비행기(손등), 배사장(배), 훈장(어깨), 떡장수(머리), 장님 순으로 도전한다2) 각 신체 부위에 비석을 얹고 걸어가 떨어뜨려 상대 비석을 쓰러뜨린다3) 실패하면 차례가 넘어가며 다음 차례에는 실패했던 단계부터 이어서 도전한다4) 마지막 장님 단계는 비석을 던져둔 뒤 눈을 감고 걸어가 발로 차서 쓰러뜨린다</p>
