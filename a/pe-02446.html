<h1>길도우미 놀이</h1>
<p>1) 두 명씩 짝을 지어 역할을 한 명은 길도우미(안내자), 한 명은 눈을 감는 보행자로 정한다. 2) 길도우미는 눈을 감은 친구의 양어깨 위에 두 손을 올리고 선다. 3) 음악이 나오는 동안 신호에 맞춰 안내한다: 직진은 양어깨 밀기, 오른쪽은 오른손 떼기, 왼쪽은 왼손 떼기, 정지는 양손 멈춤. 4) 음악의 빠르기에 맞춰 걷되 절대 뛰어다니지 않고 안전하게 이동한 후 역할을 바꿔 진행한다.</p>
