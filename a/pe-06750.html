<h1>종이 로켓 챌린지</h1>
<p>1) A4 용지를 말아 끝부분을 접어 종이 로켓 2개를 만든다. 2) 스쿼트를 1회 실시한 후 종이 로켓 2개를 위로 발사한다. 3) 발사한 종이 로켓 2개를 동시에 모두 잡으면 1점을 획득한다. 4) 1개만 잡거나 놓치면 점수를 얻지 못하며 목표 점수에 도전한다.</p>
