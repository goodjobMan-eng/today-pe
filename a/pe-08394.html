<h1>후쿠 닌자 놀이</h1>
<p>1) 참가자 전원이 원 가운데로 모여 손을 모았다가 구호와 함께 각자 닌자 자세를 취한다. 2) 한 사람씩 돌아가며 한 번의 동작으로 양옆 친구의 손등을 쳐서 공격한다. 3) 공격당할 때만 피할 수 있으며, 손을 맞은 참가자는 해당 손을 잃고 양손을 모두 잃으면 탈락한다.</p>
