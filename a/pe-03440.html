<h1>칸 족구</h1>
<p>1) 4명이 한 모둠을 이루어 두 모둠이 네트를 사이에 두고 대결한다. 2) 모둠별로 코트를 두 구역으로 나누어 한 구역에 2명씩 위치한다. 3) 자신의 구역을 벗어나서 공격이나 수비를 하면 상대 모둠이 1점을 얻는다. 4) 공이 상대 모둠 코트 바닥에 떨어지거나 상대 모둠이 찬 공이 코트 밖으로 나가면 1점을 얻으며, 15점을 먼저 얻은 모둠이 이긴다.</p>
