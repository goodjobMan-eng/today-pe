<h1>다양한 플라잉디스크 활동 즐기기(플라잉디스크 전달하기·퍼팅)</h1>
<p>1) 플라잉디스크 전달하기는 3명이 한 모둠이 되어 한 줄로 서서 순서대로 디스크를 던져 패스하고, 마지막 모둠원이 디스캐처에 던져 넣으면 1점을 얻으며 정해진 시간 동안 가장 높은 점수를 얻은 모둠이 이긴다. 2) 플라잉디스크 퍼팅은 4명이 한 모둠을 이루어 순서대로 플라잉디스크를 던져 디스크가 떨어진 곳의 숫자만큼 점수를 얻으며 가장 높은 점수를 얻은 모둠이 이긴다.</p>
