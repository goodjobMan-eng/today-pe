<h1>하나, 둘, 셋 슛! (축구형 게임)</h1>
<p>1) 골대가 있는 바닥에 사각형 경기장과 출발선을 그린다. 2) 4~6명씩 한 모둠이 되어 공격 모둠과 수비 모둠으로 나누고 수비 모둠에서 골키퍼 1명을 정한다. 3) 공격 모둠은 출발선에서 시작하여 공 몰기나 이어주기를 하며 골대에 슛을 시도하고, 수비 모둠은 공격 모둠을 막는다. 4) 공격 모둠의 모든 모둠원이 한 번씩 공을 이어준 다음 골을 넣어야 1점을 얻으며, 수비에게 공을 빼앗기면 출발 지점에서 다시 시작한다.</p>
