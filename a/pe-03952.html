<h1>터키 트롯 주사위 웜업</h1>
<p>1) 코너의 1번 콘에 서서 각자 주사위를 굴린다. 2) 주사위 눈이 지정된 매직 넘버(예: 6)가 나올 때까지 계속 굴린다. 3) 매직 넘버가 나오면 출발하여 강당 둘레를 크게 한 바퀴 달린다. 4) 깃털(아이스크림 막대)을 하나 가져와 칠면조 도안에 꽂아 장식한 뒤 다시 1번 콘으로 돌아가 반복한다.</p>
