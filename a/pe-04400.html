<h1>비치볼 배구</h1>
<p>1) 양 팀으로 나누어 코트에 선다. 2) 비치볼을 손으로 치거나 잡아 상대 코트로 넘긴다. 3) 상대 코트 바닥에 비치볼이 닿으면 득점한다. 4) 네트를 몸으로 건드리면 10회 운동을 수행한다.</p>
