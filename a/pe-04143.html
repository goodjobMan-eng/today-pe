<h1>언더핸드 스윙 스텝 던지기</h1>
<p>1) 공을 쥔 팔을 뒤로 당기며 스윙(Swing) 동작을 준비한다. 2) 공을 잡은 손의 반대쪽 발(Opposite foot)을 앞으로 내딛는 스텝(Step)을 밟는다. 3) 목표 지점을 향해 팔을 부드럽게 올리며 앞으로 던지는 드로우(Throw)를 연결한다.</p>
