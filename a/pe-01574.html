<h1>종이 하트 떨어뜨려 잡기 도전</h1>
<p>1) 종이를 가위로 잘라 하트 모양 종이를 준비한다. 2) 팔벌려뛰기를 1회 수행한 뒤 하트 종이를 머리 위에 얹고 양손을 차렷 자세로 내린다. 3) 머리를 앞으로 살짝 기울여 떨어지는 종이 하트가 바닥에 닿기 전에 손으로 낚아채면 1점을 얻는다. 4) 1분 동안 이 과정을 반복하며 하트 크기를 작게 만들어 난이도를 높이는 방식으로 변형해 개인 최고 점수에 도전한다.</p>
