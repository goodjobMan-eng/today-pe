<h1>농구 워밍업과 게임</h1>
<p>1) 학생들이 코트 위에서 각자 농구공을 드리블하며 자유롭게 이동합니다. 2) 술래가 도망치는 학생들을 태그하거나 공을 뺏는 술래잡기를 진행합니다. 3) 교사의 시범을 보며 제자리와 이동 중에 다양한 볼핸들링 및 드리블 연습을 수행합니다. 4) 팀을 나누어 훌라후프나 뜀틀(상자)을 활용한 패스 및 슈팅 게임을 합니다.</p>
