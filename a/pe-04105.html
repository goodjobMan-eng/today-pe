<h1>훌라 헛 릴레이</h1>
<p>1) 출발선 콘 앞에 팀별로 정렬하고 중앙선까지 이동한다. 2) 바닥에 훌라후프 1개를 깔고 양쪽에 벽 2개를 세운 뒤 앞문, 뒷문, 지붕 순서로 훌라후프 총 6개를 조립해 오두막을 만든다. 3) 오두막을 완성한 뒤 팀원 1명이 오두막 안을 통과한다. 4) 오두막 통과를 마친 팀은 반대편 결승선으로 달려가 바닥에 앉아 박수를 친다.</p>
