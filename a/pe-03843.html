<h1>키즈 로키 마운틴 타바타 운동</h1>
<p>1) 20초 운동 후 10초 휴식하는 타바타 리듬에 맞추어 제자리 동작을 준비한다. 2) 제자리 달리기, 팔굽혀펴기, 무릎 당겨 점프, 자전거 타기 복근 운동 순으로 동작을 수행한다. 3) 런지 자세로 바닥을 딛고, 팔꿈치 플랭크 자세를 유지한다. 4) 스키를 타듯 제자리에서 몸을 비틀며 점프하는 모글 스키 점프로 운동을 마무리한다.</p>
