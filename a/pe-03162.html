<h1>티볼공 멀리 던지기</h1>
<p>1) 공을 던질 방향을 바라보고 옆으로 선다. 2) 뒷발을 던질 방향으로 옮기며 공을 쥔 손을 뒤로 보내고 이동한다. 3) 공을 든 반대쪽 발을 앞으로 내딛고 허리와 몸통을 회전시키며 팔을 던질 방향으로 쭉 뻗어 던진다. 4) 공을 던진 곳에서부터 공이 떨어진 지점까지의 가장 짧은 직선거리를 줄자로 측정한다.</p>
