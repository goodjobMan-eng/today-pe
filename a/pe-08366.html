<h1>포스퀘어 (사각 구역 공치기)</h1>
<p>1) 네 개의 칸으로 나뉜 구역에 한 명씩 사람이 들어갑니다. 2) 4번 구역(서버)의 사람이 공을 바닥에 한 번 튀긴 후 언더핸드로 다른 사람의 칸을 향해 칩니다. 3) 공이 자기 칸에서 바닥에 한 번 튄 뒤 다른 사람의 칸으로 넘어가도록 받아쳐야 합니다. 4) 라인을 밟거나 칸 안에서 실수를 하면 아웃되어 가장 낮은 칸으로 이동하고 나머지 사람들이 한 칸씩 이동합니다.</p>
