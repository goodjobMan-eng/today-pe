<h1>요시 순록 런</h1>
<p>1) 화면을 보며 갈림길에서 원하는 방향의 포즈를 취해 길을 선택한다.2) 화면의 지시에 따라 점프(jump), 웅크리기(duck), 피하기(dodge), 발차기(kick), 펀치(punch) 동작을 수행한다.3) 다른 그림 찾기 미니게임에서는 세 가지 틀린 그림을 찾는 동안 제시된 포즈를 유지한다.</p>
