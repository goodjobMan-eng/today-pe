<h1>경찰과 비밀경찰</h1>
<p>1) 학급의 1/3을 경찰로 정하고, 도둑 무리 중 1명을 비밀리에 비밀경찰로 지정한다2) 도둑은 체육관에 흩어져 경찰을 피하며 보물(공 등)을 훔쳐 탈출하려 한다3) 경찰 및 비밀경찰이 도둑의 어깨나 등을 터치하면 도둑은 감옥으로 이동한다4) 다른 도둑이 감옥 콘 안으로 달려와 갇힌 동료를 터치하면 탈옥시킬 수 있다5) 경찰이 제한 시간 내에 도둑을 전원 체포하거나 도둑이 보물을 탈환하면 끝난다</p>
