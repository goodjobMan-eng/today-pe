<h1>줄넘기 줄 길이 조정법과 줄넘기 지도팁</h1>
<p>1) 한 발로 줄의 가운데를 밟고 손잡이를 위로 당겨 길이를 확인한다.2) 초보자는 손잡이가 명치 부근이나 겨드랑이 사이에 오도록 스토퍼를 조절해 고정한다.3) 줄을 넘을 때는 팔 전체가 아닌 손목 회전으로 돌리고, 팔을 벌리지 않고 몸 안쪽에 붙여 1~1.5cm 정도 가볍게 뛴다.</p>
