<h1>마법의 가마솥</h1>
<p>1) 소모둠 팀을 구성하고 중앙에 공, 팀조끼, 콘을 놓는다.2) 출발 신호에 팀원 한 명이 중앙으로 달려가 물품 1개를 가져와 자기 팀 가마솥에 넣고 팀원과 하이파이브한다.3) 가마솥에 물품 2개를 모으면 중앙 대신 다른 팀의 가마솥에서 물품을 빼앗아 올 수 있다.4) 다른 팀이 빼앗으러 올 때 자기 가마솥을 지키며 태그하면 해당 팀원은 다른 곳에서 훔쳐야 한다.</p>
