<h1>마지막까지 서 있기 줄넘기 게임</h1>
<p>1) 참가자들은 각자 줄넘기를 들고 선다. 2) 신호와 함께 줄넘기를 시작하며 줄을 옆으로 돌리는 사이드 스윙은 허용되지 않는다. 3) 줄에 걸리거나 실수를 하면 즉시 바닥에 앉아 탈락한다. 4) 마지막까지 줄에 걸리지 않고 서 있는 사람이 승리한다.</p>
