<h1>티볼 내야 수비 기본자세 및 땅볼 포구 연습</h1>
<p>1) 내야수는 발뒤꿈치를 살짝 들고 무릎을 낮추며 글러브를 펴서 빠르게 반응할 기본자세를 취한다. 2) 타구 방향으로 발을 이동하며 글러브 쪽으로 오는 공은 양손으로 안정적으로 감싸며 잡는다. 3) 반대 방향으로 깊게 빠지는 땅볼은 다리를 넘기며 백핸드로 몸 앞쪽에서 침착하게 막아낸다. 4) 포구 후 바로 송구할 수 있도록 오른손으로 글러브 속 공을 감싸 쥐는 연습을 반복한다.</p>
