<h1>훔칠까 말까?</h1>
<p>1) 중앙에 조끼를 든 사람(또는 심판)이 서고 양쪽에 고깔콘이나 접시콘을 세운다.2) 양쪽 출발선에 선 두 사람은 신호에 맞춰 출발하여 조끼를 먼저 가져가거나 상대방을 쫓아가 태그한다.3) 조끼를 잡고 도망가거나 상대가 잡기 전에 먼저 건드려 태그하면 점수를 얻는다.4) 3판 2선승제로 진행하며, 이긴 사람은 조끼를 들고 심판 역할을 하고 진 사람은 대기자와 대결한다.</p>
