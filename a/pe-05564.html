<h1>요술 술래</h1>
<p>1) 술래가 도망가는 친구를 쫓아가 가볍게 터치하여 마네킹처럼 멈추게 한다.2) 태그되어 멈춘 친구를 살리기 위해 도망자 두 명이 양쪽에서 달려와 손을 잡고 에워싸서 가두어 준다.3) 두 친구가 몸을 감싸 안듯이 가두어 주면 갇혔던 친구가 풀려나 다시 도망친다.</p>
