<h1>이중뛰기 연습: 제자리 높이뛰기</h1>
<p>1) 줄 없이 1, 2, 3 타이밍에 맞춰 높이 점프한다. 2) 높이 뜬 상태에서 공중에서 2번 손을 부딪힌다. 3) 무릎을 굽히지 않고 몸을 빳빳하게 세워 제자리에 높이 뛴다. 4) 손목으로 작은 원을 그리며 빠르게 줄을 돌리고 높이 뛴다.</p>
