<h1>배드민턴형 게임 기본 규칙 익히기</h1>
<p>1) 서브를 넣을 때는 셔틀콕이 허리 아래쪽에 위치하도록 하여 서브합니다. 2) 상대 모둠이 서브를 넣을 때는 리시브 측이 먼저 움직이지 않습니다. 3) 셔틀콕을 한 사람이 두 번 연속해서 치지 않고 네트를 넘깁니다. 4) 라켓이나 몸이 네트에 닿지 않도록 주의하며 랠리를 이어갑니다.</p>
