<h1>친구 술래잡기</h1>
<p>1) 술래 1명이 경기장 중앙에서 시작하여 도망치는 학생들을 쫓아 터치한다. 2) 도망치는 학생은 다른 친구와 손을 잡아 짝을 이루면 술래의 터치로부터 안전해진다. 3) 짝을 이룬 학생들은 큰 소리로 3초를 센 후 즉시 손을 놓고 다시 흩어져야 한다. 4) 술래에게 터치된 학생이 새로운 술래가 되어 게임을 이어간다.</p>
