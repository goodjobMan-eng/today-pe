<h1>요리조리 장애물 피하기 게임</h1>
<p>1) 출발선을 그리고 같은 거리에 2개씩 장애물을 둔 뒤, 3~5명씩 두 모둠으로 나누어 출발선에 한 줄로 선다. 2) 첫 번째 주자부터 장애물을 피해 지그재그로 공을 몰며 돌아온다. 3) 출발선으로 돌아왔을 때 쓰러진 장애물이 있으면 다시 세우고 다음 주자가 출발한다. 4) 모든 모둠원이 순서대로 공을 몰고 마지막 주자가 먼저 돌아오는 모둠이 이긴다.</p>
