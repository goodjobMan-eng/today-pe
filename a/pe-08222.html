<h1>T1 럭비 기본 게임</h1>
<p>1) 앞으로 달리며 공은 뒤로 패스하여 트라이 존에 공을 찍어 득점한다. 2) 수비수는 겨드랑이 아래를 한 손 또는 두 손으로 터치하여 볼 캐리어를 멈추게 한다. 3) 터치당한 공격수는 멈춰서 뒤돌아서고, 팀원이 공을 빼앗아 세 걸음 안에 패스한다. 4) 수비는 터치한 선수와 가장 가까운 수비 2명이 물러나며 터치 삼각형 대형을 만든다.</p>
