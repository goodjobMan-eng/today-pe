<h1>루이지 고스트 런 장애물 달리기</h1>
<p>1) 유령들이 나타난 버섯 왕국에서 루이지를 도와 제자리에서 달리며 장애물을 피합니다. 2) 레벨별로 나타나는 장애물 지시에 맞춰 점프, 숙이기, 펀치 등의 동작을 수행합니다. 3) 숨어 있는 유령 상자를 찾거나 날아가는 유령 숫자를 세는 퀴즈 도전을 해결합니다. 4) 마지막 바닥 용암 구간에서는 지시된 자세를 취해 용암에 빠지지 않고 탈출합니다.</p>
