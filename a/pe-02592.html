<h1>교실놀이 손수건 꼬리잡기</h1>
<p>1) 하의나 상의 안에 손수건을 넣어 적당한 길이로 꼬리를 만든 뒤 앉은 자세로 자리를 잡는다. 2) 노래 전주가 끝나고 가사가 나오면 일어나서 다른 친구의 꼬리를 낚아채서 뽑는다. 3) 뽑은 꼬리는 즉시 수집가에게 제출하고 다시 게임 영역으로 돌아간다. 4) 탈락자 중 바른 자세로 앉아 있는 어린이에게 수집된 꼬리를 주어 부활시키며 최후까지 남는다.</p>
