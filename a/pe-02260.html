<h1>킨볼 주요 경기 규칙 배우기</h1>
<p>1) 공격 팀이 히트한 공이 수비 실패로 경기장 안 바닥에 떨어지면 드랍볼로 공격 팀이 득점한다. 2) 공을 히트할 때 4명 전원이 공에 닿아 있어야 하며, 다른 신체에 맞아 궤도가 꺾이면 컨택 미스 파울이 된다. 3) 심판의 히트인 신호 후 &quot;옴니킨&quot;과 상대 팀 색상을 외치고 5초 이내에 히트해야 한다. 4) 공을 받은 1~2명은 자유롭게 이동 가능하나, 3번째 선수가 닿는 순간 양발을 모두 움직이면 워킹 파울이 된다.</p>
