<h1>6학년 축구형 게임</h1>
<p>1) 남학생 팀과 여학생 팀 등으로 팀 조끼를 나누어 입고 경기를 준비한다.2) 경기 시작 시 뒤로 패스하여 경기를 전개한다.3) 패스로 빈 공간을 찾아 전진하며 골대 그물에 공을 맞히거나 골을 넣으면 득점한다.4) 전반/경기 종료 후 악수로 인사하고 다음 팀에게 조끼를 전달하며 교대한다.</p>
