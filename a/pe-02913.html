<h1>이기면 쫓아! 지면 도망가!</h1>
<p>1) 가운데 대결 라인, 반대편에 안전 지대를 콘 등을 이용해 만듭니다. 2) 팀을 나누고 대결 라인에 한 줄로 섭니다. 3) 앞에 있는 짝과 가위바위보 대결을 합니다. 4) 이긴 사람은 쫓고, 진 사람은 반대편 안전 지대로 달립니다. 5) 안전 지대에 들어가기 전에 이긴 사람에게 잡히면 미션(팔 벌려 높이뛰기 5번)을 합니다.</p>
