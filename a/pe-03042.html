<h1>컵빼기 릴레이</h1>
<p>1) 모둠별로 책상 위에 맨 위 컵의 색깔이 다른 컵 뭉치를 하나씩 올려두고 출발선에 선다. 2) 신호와 함께 첫 주자가 책상으로 달려가 맨 아래의 컵을 하나씩 빼서 위로 올린다. 3) 가장 위에 있던 색깔 컵이 다시 맨 위로 올라와 한 바퀴가 돌면 컵을 책상에 두고 출발선으로 돌아온다. 4) 다음 친구에게 바통 터치를 하여 릴레이로 진행하고 먼저 끝낸 팀이 승리한다.</p>
