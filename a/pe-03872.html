<h1>데스스타 파괴하기 타깃 던지기 게임</h1>
<p>1) 매트를 세우고 위에 다른 매트를 얹은 뒤 훌라후프와 뒤집은 스쿠터보드를 올리고 데스스타 비치볼을 얹어 타워를 만든다. 2) 수비수는 폼 누들과 테이프로 만든 광선검을 쥐고 타워를 방어한다. 3) 공격수는 공을 던져 상대 구역 코너에 있는 타워 위의 비치볼을 맞혀 떨어뜨린다. 4) 성공하면 다른 팀 구역으로 이동하여 새로운 타워를 공략한다.</p>
