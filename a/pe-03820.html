<h1>신발 균형 감각 챌린지</h1>
<p>1) 신발을 바닥에 바깥쪽을 향하게 놓는다. 2) 무릎을 꿇고 앉아 양 무릎으로 신발을 조여 들어 올린다. 3) 팔꿈치를 사용해 무릎에 끼워진 신발을 잡는다. 4) 팔꿈치를 위로 튕기며 신발을 공중에 띄운 뒤 두 손으로 잡아 머리 위로 들어 올려 1점을 얻고 1분간 반복한다.</p>
