<h1>X자 서킷 트레이닝</h1>
<p>1) 체육관 중앙에 사다리와 마커를 X자 교차형으로 놓고 외곽에 6개 운동 구역을 배치한다. 2) 학생들은 각 스테이션에 균등하게 서서 타이머와 음악에 맞춰 동시에 출발한다. 3) 지정된 체력 운동(팔굽혀펴기, 버피 등) 10회와 스텝 통과를 2분 동안 순환한다. 4) 2분 운동 후 30초~1분 휴식하며 회전 방향을 반대로 바꾸거나 운동 종목을 교체한다.</p>
