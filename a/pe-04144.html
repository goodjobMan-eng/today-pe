<h1>훌라후프 자동차 신호등 놀이</h1>
<p>1) 각자 훌라후프를 운전대처럼 양손에 잡고 교실 공간을 자동차처럼 이동할 준비를 한다. 2) 교사가 신호등 색깔 구령을 외치면 규칙에 맞게 반응한다(노란색은 천천히 걷기, 초록색은 빠르게 달리기, 빨간색은 정지). 3) 분홍색 신호 구령이 나오면 제자리에서 점프하고, 파란색 구령이 나오면 뒤를 살피며 후진으로 걷는다. 4) 신호에 맞춰 부딪히지 않고 침착하게 교실을 순환하며 움직임을 조절한다.</p>
