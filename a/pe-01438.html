<h1>배꼽 밀착 철봉 차오르기</h1>
<p>1) 자신의 명치 높이에 맞는 철봉 앞에 서서 어깨너비로 봉을 위에서 감아쥐고 한 발을 살짝 앞에 두는 가위 다리 자세를 취한다. 2) 앞발을 힘차게 차올리는 동시에 팔을 굽혀 배꼽을 철봉에 바짝 밀착시키며 몸을 뒤로 회전시킨다. 3) 허벅지를 봉 위에 얹고 상체를 세워 팔을 곧게 뻗은 지지 자세로 버티면 성공 판정을 받는다. 4) 단발 성공 후 반동을 유지하며 내려와 즉시 발을 차올려 연속 3회 회전하기로 단계를 높인다.</p>
