<h1>에어라이트 공 띄우기 활동</h1>
<p>1) 미니 에어라이트 큐브와 원통을 바닥에 떨어뜨리지 않고 공중에 계속 띄운다.2) 원 안에서 에어라이트를 띄우며 원 밖으로 벗어나지 않도록 유지한다.3) 큐브를 띄우며 매트가 있는 곳까지 이동했다가 다시 제자리로 돌아온다.4) 정해진 순서(1번부터 5번까지)대로 번갈아 가며 터치하여 공중에 유지한다.</p>
