<h1>공 튀기며 이어달리기</h1>
<p>1) 4명이 한 모둠을 이루어 출발 순서를 정한다. 2) 첫 번째 모둠원이 제자리에서 공을 10번 튀긴 후 시계 방향으로 공을 튀기며 이동한다. 3) 다음 순서 모둠원에게 공을 던지지 않고 양손으로 안전하게 건네준다. 4) 공을 받은 주자가 제자리에서 10번 튀기고 달리기를 반복하여, 마지막 주자가 첫 번째 주자 위치에 가장 먼저 도착한 모둠이 승리한다.</p>
