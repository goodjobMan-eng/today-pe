<h1>빙글빙글 시계</h1>
<p>1) 가운데 원 마커를 기준으로 12시, 3시, 6시, 9시 방향에 원 마커를 하나씩 놓는다. 2) 한 발은 가운데 원 마커에서 떨어지지 않은 채 선생님이 불러주는 시간을 표현한다. 3) 시간을 가장 빨리 표현하면 1점을 얻는다. 4) 게임을 10번 진행하여 가장 높은 점수를 얻은 친구가 이긴다.</p>
