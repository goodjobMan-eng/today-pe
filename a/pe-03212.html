<h1>손 골프</h1>
<p>1) 숫자 원마커를 원하는 위치에 넓게 펼쳐 놓고 가위바위보 등으로 순서를 정한다. 2) 1번 원마커에 서서 2번 원마커 홀을 향해 콩주머니를 손으로 던진다. 3) 콩주머니가 원마커 홀 위에 완전히 들어가지 않으면 다음 사람에게 차례가 넘어가며, 다음 차례에는 콩주머니가 떨어진 자리에서 다시 던진다. 4) 콩주머니를 홀에 넣으면 다음 번호 홀로 바로 이어서 던지며 10번 홀까지 먼저 완료한다.</p>
