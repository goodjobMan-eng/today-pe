<h1>철봉 두 오금 걸고 물구나무서서 내리기 챌린지</h1>
<p>1) 철봉에 뛰어올라 매달리며 두 다리의 오금을 철봉에 단단히 걸고 거꾸로 매달린다. 2) 양손을 철봉에서 천천히 떼어 바닥 안전 매트에 어깨너비로 짚어 물구나무 자세를 잡는다. 3) 철봉에 걸려 있던 두 발을 조심스럽게 풀면서 바닥으로 다리를 내려 착지한다. 4) 동작이 안정되면 물구나무 유지 시간을 2~3초 버틴 뒤 안전하게 내려오도록 도전한다.</p>
