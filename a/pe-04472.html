<h1>축구 볼 컨트롤 및 드리블 스킬 트레이닝</h1>
<p>1) 제자리에서 발끝으로 공 위를 번갈아 터치하는 토 탭(Toe Taps)을 하고 앞뒤 콘 사이를 이동하며 실시한다. 2) 발 안쪽으로 공을 좌우로 주고받는 사이드 탭을 연습하고 앞뒤로 이동하며 적용한다. 3) 발 바깥쪽으로 공을 당겨 디딤발 뒤로 쳐낸 뒤 반대 발로 잡는 백앤비하인드 기술을 익힌다. 4) 두 개의 콘 사이를 무한대(8자) 모양으로 양발을 사용해 좁은 간격으로 드리블한다.</p>
