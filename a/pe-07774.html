<h1>피트니스 피구</h1>
<p>1) 코트 곳곳에 폼볼을 배치하고 팀 조끼를 입은 퍼스널 트레이너 2명을 지정한다. 2) 트레이너는 바닥의 공을 주워 다른 참가자들을 향해 던져 맞힌다. 3) 공에 맞은 참가자는 코트 밖으로 나가 지정된 운동(팔굽혀펴기 10회 또는 스쿼트 10회)을 수행한다. 4) 정해진 미션 운동을 완료하면 즉시 경기장으로 복귀해 게임을 이어간다.</p>
