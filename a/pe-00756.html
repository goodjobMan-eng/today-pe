<h1>크레이지 프로그 댄스 피트니스 워크아웃</h1>
<p>1) 영상 속 캐릭터의 안내에 맞춰 신나는 음악과 함께 제자리에서 춤 동작을 따라 할 준비를 합니다. 2) 다리를 좌우로 뻗고 팔을 흔들거나 개구리 점프를 하는 등 전신을 활용해 리듬에 맞춰 움직입니다. 3) 음악의 비트에 맞춰 점핑 잭과 사이드 스텝 등 유산소 피트니스 동작을 반복합니다. 4) 끝까지 멈추지 않고 동작을 완주하며 심폐 지구력과 리듬감을 기릅니다.</p>
