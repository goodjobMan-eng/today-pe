<h1>소서 슬램 디스크 골 게임</h1>
<p>1) 2인 1조 두 팀으로 나누어 마주 보는 목표 통 양쪽에 팀원을 각각 1명씩 배치한다. 2) 한 선수가 반대편 목표 통을 향해 플라잉디스크를 던진다. 3) 디스크가 목표 통에 맞으면 1점, 팀원의 도움 없이 통 안으로 직접 들어가면 5점을 얻는다. 4) 반대편 팀원이 날아오는 디스크를 쳐서 통에 맞히면 1점, 쳐서 통 안으로 넣으면 2점을 얻으며 먼저 21점을 내는 팀이 승리한다.</p>
