<h1>스웜프볼 (늪지대 피구)</h1>
<p>1) 체육관 양쪽에 매트를 깔아 늪지대로 정하고 두 팀으로 나누어 피구를 시작합니다. 2) 상대의 공에 맞은 선수는 상대 진영의 매트(늪지대) 안으로 이동해야 하며, 늪에 갇힌 선수는 자기 팀원이 던져준 공을 노바운드로 잡으면 구출되어 본인 진영으로 돌아갑니다. 3) 상대가 던진 공을 직접 잡아내면 공을 던진 상대 선수가 늪으로 들어갑니다. 4) 상대 팀 전원을 매트(늪지대) 안으로 모두 보내면 승리합니다.</p>
