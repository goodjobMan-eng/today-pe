<h1>위험 감수 달리기 (리시코라우프)</h1>
<p>1) 출발 신호에 맞춰 각자 출발하여 공(1점), 빨래집게(2점), 컵(3점), 가장 뒤의 특수 공(즉시 승리) 중 하나를 향해 달린다. 2) 물건을 하나 가지고 출발선으로 돌아오되, 가장 마지막으로 들어온 사람은 물건을 원래 자리에 다시 갖다 놓아야 한다. 3) 마지막이 아닌 사람들은 가져온 물건을 점수로 누적하며, 먼저 10점에 도달하는 사람이 승리한다.</p>
