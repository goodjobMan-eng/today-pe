<h1>플라잉디스크 배구놀이</h1>
<p>1) 10명 내외의 인원을 두 팀으로 나눈다. 2) 서비스 존(라인 밖)에서 플라잉디스크를 던지면서 경기를 시작한다. 3) 플라잉디스크가 바닥에 닿지 않고 던져야 하며, 팀 내에서 3번 이내에 상대 구역으로 던져 넘겨야 한다. 4) 선수의 이동은 자유롭게 할 수 있으나 플라잉디스크를 받으면 이동할 수 없다. 5) 3세트 11점제로 진행하며, 10:10 동점일 때는 듀스를 적용한다.</p>
