<h1>배스킥볼 (농구 발야구)</h1>
<p>1) 수비 팀은 체육관에 흩어지고 공격 팀은 홈 베이스 옆에 줄을 선다. 2) 투수가 굴린 폼볼/플레이그라운드 볼을 타자가 차고, 멈추지 않고 1·2·3루를 거쳐 홈까지 달린다. 3) 수비 팀은 뜬공을 잡거나 주자가 홈에 들어오기 전에 체육관의 농구 골대 중 아무 곳에 골을 넣어 아웃을 잡는다. 4) 3아웃이 되면 공격과 수비를 교대하고 득점이 많은 팀이 승리한다.</p>
