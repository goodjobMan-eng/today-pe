<h1>후프에 닿지 않게 살금살금</h1>
<p>1) 조립 후프의 결합부에 끈을 끼워 학생들이 잡을 수 있도록 준비한다. 2) 술래는 안대를 쓰고 손에 풍선을 든 채 후프 안에 들어와 자리를 잡는다. 3) 나머지 학생들은 끈을 잡고 들어 올려 술래가 골인 지점으로 이동할 때까지 후프가 술래 몸에 닿지 않도록 협동하여 함께 이동한다. 4) 술래를 번갈아 가며 도착 지점으로 이동한다.</p>
