<h1>홈 피트니스 바스켓볼 (1분 양말공 농구 챌린지)</h1>
<p>1) 바닥에 테이프나 담요 등으로 사각형 구역을 표시하고, 구역 안에 바구니(또는 양동이, 반찬통)를 놓는다. 2) 양말을 말아 만든 공(또는 뭉친 종이공)을 준비하고 사각형 구역 바깥에 위치한다. 3) 1분 타이머를 시작하고 사각형 바깥의 어느 방향에서든 바구니를 향해 슛을 던진다. 4) 1분 동안 바구니에 들어간 슛의 개수를 세어 1골당 1점씩 획득한 총점을 확인한다.</p>
