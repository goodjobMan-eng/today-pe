<h1>스팟 잇 피트니스 여름 에디션</h1>
<p>1) 화면 좌우에 제시된 여름 그림들을 관찰할 준비를 한다. 2) 10초 카운트다운 동안 양쪽에 중복되지 않는 유일한 그림 하나를 찾아낸다. 3) 자신이 고른 그림 밑에 매칭된 동작(스쿼트, 제자리 뛰기 등)을 30초 동안 따라 하며 체력을 기른다. 4) 동작 후 정답 그림을 확인하며 다음 라운드에서 다른 전신 피트니스 동작으로 변형해 도전한다.</p>
