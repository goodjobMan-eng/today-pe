<h1>공주 왕자 피구 게임</h1>
<p>1) 각 팀은 상대 몰래 왕(또는 공주) 1명을 정해 심판에게만 알려준다. 2) 일반 피구 규칙대로 경기를 진행하며 상대 팀원을 맞혀 아웃시킨다. 3) 일반 팀원은 공에 맞아도 아웃되지만, 왕(또는 공주)이 공에 맞으면 그 즉시 해당 팀 전체가 패배한다.</p>
