<h1>박물관 놀이</h1>
<p>1) 참가자들을 전시물을 표현하는 팀과 관람객 팀으로 나눈다. 2) 전시물 팀은 기념물, 조각상, 명화, 인물 등을 침묵 속에 정지 동작(동상)으로 표현한다. 3) 관람객 팀이 전시관을 둘러본 뒤 출발점으로 돌아와 각 동상이 무엇을 표현했는지 맞힌다.</p>
