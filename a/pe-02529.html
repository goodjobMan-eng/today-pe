<h1>백보드 피구</h1>
<p>1) 체육관을 둘로 나누고 두 팀이 각자의 구역에 서서 폼볼로 상대 팀을 맞힌다. 2) 공에 맞은 선수는 아웃되어 코트 옆으로 이동한다. 3) 공격팀이 상대편 농구 골대의 백보드를 공으로 맞히면 아웃되었던 자기 팀 선수들이 모두 코트로 부활하여 복귀한다. 4) 공을 농구 골대 림 안으로 골인시키면 즉시 그 라운드에서 승리한다.</p>
