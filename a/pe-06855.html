<h1>셔플 댄스 기초</h1>
<p>1) 무릎을 구부렸다 펴는 업 리듬과 폈다가 구부리는 다운 리듬을 익힌다. 2) 무릎을 들었다가 문을 차듯이 발을 차며 뒤로 밀리는 킥 스텝을 연습한다. 3) 발 앞꿈치가 먼저 닿도록 하며 앞뒤 다리를 펴고 달리는 팔 동작과 함께 셔플 스텝(러닝맨)을 완성한다. 4) 발 앞꿈치와 뒤꿈치 축을 활용하여 옆으로 이동하는 티 스텝을 익혀 연결한다.</p>
