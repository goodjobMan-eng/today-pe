<h1>플라잉디스크 거츠 경기</h1>
<p>1) 두 팀이 14m 떨어진 평행선에 마주 보고 서고, 던지는 사람을 제외한 팀원은 옆으로 이동한다. 2) 공격 팀이 파울라인을 넘지 않고 상대 수비 범위를 벗어나지 않게 디스크를 강하게 던진다. 3) 수비 팀은 오직 한 손으로만 받아내야 하며(버블 허용), 디스크를 놓치거나 두 손으로 잡거나 땅에 닿으면 실점하고 양 팀 합산 11점마다 코트 체인지 후 21점에 먼저 도달하면 승리한다.</p>
