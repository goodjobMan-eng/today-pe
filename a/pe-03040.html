<h1>라인 얼음땡 술래잡기</h1>
<p>1) 모든 참가자와 술래는 바닥에 그려진 코트 선 위로만 이동한다. 2) 술래에게 잡힐 위기일 때 양팔을 교차하며 얼음을 외치면 태그되지 않는다. 3) 선 밖의 일반 바닥을 밟거나 얼음을 외치기 전에 술래에게 터치당하면 아웃된다. 4) 다른 생존자가 얼음 상태인 친구를 터치해 주면 땡이 되어 다시 움직일 수 있다.</p>
