<h1>바람 볼링 챌린지</h1>
<p>1) 책상 위에 스피드스태킹 컵 10개를 일렬로 세우고 종이 접시를 준비한다. 2) 시작 신호가 울리면 종이 접시를 세차게 부쳐 바람의 힘만으로 컵을 쓰러뜨린다. 3) 10개의 컵을 모두 쓰러뜨릴 때까지 걸린 시간을 측정하여 가장 빠른 기록을 낸 사람이 승리한다. 4) 종이 접시 대신 풍선에 공기를 채운 뒤 바람을 빼며 맞히는 방식으로 변형할 수 있다.</p>
