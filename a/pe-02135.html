<h1>주토피아 음악줄넘기</h1>
<p>1) 음악 전주에 맞춰 줄을 모아쥐고 8자돌리기와 다리변형 동작을 수행한다. 2) 되돌리기와 1도약 변형으로 줄을 넘는다. 3) 번갈아뛰기 변형, 8자느리게 이동, SSOO COCO 동작을 연결한다. 4) 벌려모아 뛰기, 무릎들어 뛰기, 앞뒤 벌려뛰기 변형 후 앞멈춤으로 마무리한다.</p>
