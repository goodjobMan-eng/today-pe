<h1>발 위에 공 전달</h1>
<p>1) 의자에 둥글게 원으로 앉아 준비한다. 2) 첫 주자는 공을 발 위에 올리거나 두 발로 잡아 전달을 준비한다. 3) 순서대로 옆 사람 발 위에 공을 전달해서 한 바퀴 돌아오는 것에 도전한다. 4) 공이 바닥에 떨어지면 그 사람부터 다시 시작해서 한 바퀴를 돈다.</p>
