<h1>코만도 (다리 밑 통과 릴레이)</h1>
<p>1) 학생들을 여러 모둠으로 나누어 출발선 뒤에 일렬로 촘촘하게 줄을 서게 한다. 2) 출발선 앞쪽 일정 거리에 결승선을 표시한다. 3) 맨 뒤에 있는 학생이 앞 친구들의 다리 밑으로 기어서 통과하여 줄의 맨 앞으로 이동한다. 4) 새로운 맨 뒤 학생이 다시 앞선 친구들의 다리 밑을 통과해 맨 앞으로 이동하는 과정을 반복한다. 5) 줄 전체가 전진하여 팀원 중 결승선에 가장 먼저 도착하는 팀이 승리한다.</p>
