<h1>고무줄놀이 아메리칸 패턴 스트래들 점프</h1>
<p>1) 고무줄을 잡고 선 상태에서 4번 다리를 벌려 뛴다(four straddles).2) 줄 안으로 들어갔다 나갔다(in out), 안으로 들어갔다 줄을 밟는다(in on).3) 종아리 높이 등으로 올려가며 패턴을 수행한다.</p>
