<h1>월윈드 긴줄넘기 챌린지</h1>
<p>1) 긴 줄을 돌리는 토너먼트 줄과 연습 줄로 영역을 나누고, 학생들은 순서대로 줄을 서서 준비한다. 2) 긴 줄은 항상 대기 줄의 반대 방향으로 크고 완만하게 천천히 돌린다. 3) 첫 번째 주자가 들어가서 1회 뛰고 나온 뒤, 긴 줄이 빈 회전 없이 계속 돌도록 다음 주자가 즉시 연속으로 들어가 1회 뛰고 나온다. 4) 줄에 걸리거나 타이밍을 놓쳐 빈 줄이 돌게 만든 학생은 연습 줄 영역으로 이동하여 연습한다.</p>
