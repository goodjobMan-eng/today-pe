<h1>눈 피자 술래잡기</h1>
<p>1) 교사를 따라 눈 위에 원을 그리고 조각 모양으로 길을 내어 피자 모양의 선을 만든다. 2) 술래 한 명을 피자 중앙에 배치한다. 3) 술래는 피자 모양으로 난 선만을 따라 이동하며 도망치는 학생들을 쫓아가 태그한다. 4) 태그당한 사람은 중앙으로 들어가 새로운 술래가 되며, 시작 전 팔굽혀펴기나 점핑잭 10회를 수행한다.</p>
