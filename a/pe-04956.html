<h1>스포츠 눈싸움</h1>
<p>1) 코트에는 각 팀 5명이 들어가고 나머지는 사이드에서 대기한다.2) 공을 상대에게 던져 맞히며, 맞은 사람은 코트 밖으로 나가고 사이드 대기 선수가 엔드라인을 통해 코트로 들어온다(목 위 머리 부위는 맞아도 세이프).3) 상대 코트에 놓인 컬러콘에 훌라후프 3개를 먼저 걸면 해당 팀이 승리한다.4) 후프를 든 채 공에 맞으면 그 자리에 후프를 내려놓아야 하며, 상대를 직접 붙잡는 등 신체 접촉은 금지된다.</p>
