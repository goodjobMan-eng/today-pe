<h1>사자와 영양 꼬리떼기 놀이</h1>
<p>1) 콘으로 아프리카 구역을 표시하고, 영양 역할은 태그 플래그를 착용하며 사자 역할은 착용하지 않는다. 2) 사자는 구역 안의 영양을 쫓아가 플래그를 뜯는다. 3) 뜯은 플래그는 한 번에 1개씩만 훌라후프(바구니) 안에 넣어야 한다. 4) 사자에게 플래그를 뺏긴 사람은 사자가 되어 함께 영양을 쫓으며, 모든 영양이 잡히거나 제한 시간이 끝나면 종료된다.</p>
