<h1>플라잉 디스크 던지기와 받기</h1>
<p>1) 백핸드 던지기는 원반을 가슴 높이에서 당겼다가 지면과 수평이 되게 팔과 손목을 펴며 던진다. 2) 포핸드 던지기는 원반을 어깨 높이에서 지면과 수직이 되게 들어 올려 팔과 손목을 펴며 수평으로 던진다. 3) 손뼉 치듯 받기는 날아오는 원반 쪽으로 손을 뻗어 몸쪽으로 당기며 손뼉을 치듯 잡는다. 4) 양손 받기는 양손을 뻗어 몸쪽으로 당기며 원반의 가장자리를 잡는다.</p>
