<h1>다양한 방법으로 뛰기 활동</h1>
<p>1) 한 발을 들고 디딤발을 살짝 굽혔다가 펴면서 앞으로 뛰기와 모둠발로 앞으로 뛰기를 실시합니다. 2) 무릎을 굽혔다 펴면서 바닥의 접시콘을 모둠발로 옆으로 뛰어넘습니다. 3) 제자리에서 위로 뛰면서 다리를 벌렸다 모으거나 양팔을 뻗으며 높이 뜁니다. 4) 양쪽 손바닥을 바닥에 대고 웅크렸다가 무릎을 펴며 손 짚고 앞으로 뜁니다.</p>
