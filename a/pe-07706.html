<h1>자이언트 탁구 (Giant Table Tennis)</h1>
<p>1) 중앙에 뜀틀을 가림막(네트)으로 두고 양쪽에 대형 매트를 바닥에 깐다. 2) 짐볼을 뜀틀 너머 반대편 대형 매트 구역으로 손으로 쳐서 넘긴다. 3) 공이 뜀틀에 걸리지 않고 반대편 매트에 튕기도록 협동하여 최대한 많은 랠리 횟수를 이어간다(숙련 시 공을 잡지 않고 즉시 리턴).</p>
