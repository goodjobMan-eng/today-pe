<h1>콘 쓰러뜨리기 축구</h1>
<p>1) 양쪽 골대 구역에 콘을 일렬로 세우고 두 팀으로 나눕니다. 2) 폼볼을 발로 차서 축구 경기를 진행하며 상대 구역의 콘을 노립니다. 3) 킥으로 상대 콘을 쓰러뜨리면 그 콘을 가져와 자기 팀 구역으로 옮깁니다. 4) 상대 팀의 콘을 모두 먼저 가져오는 팀이 승리합니다.</p>
