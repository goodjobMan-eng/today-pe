<h1>보물 딱지 뒤집기</h1>
<p>1) 정해진 시간 동안 팀별로 모여 색종이 딱지를 접습니다. 2) 딱지 1개에 '보물(앞/뒤)'이라고 적은 후 교실 바닥에 내려놓습니다. 3) 팀별로 1명씩 나와서 보물 딱지를 넘기기 위해 도전하며, 뒤집지 못하면 사용한 딱지를 두고 들어갑니다. 4) 보물 딱지를 뒤집는 것에 성공하면 바닥에 있는 딱지를 모두 가져가며 정해진 시간 동안 가장 많은 딱지를 모은 팀이 승리합니다.</p>
