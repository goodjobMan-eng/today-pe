<h1>공중 발박수 점프 챌린지</h1>
<p>1) 양발을 어깨너비로 벌리고 선 채 무릎을 가볍게 굽혀 점프 준비를 한다. 2) 신호에 맞춰 높이 뛰어올라 발을 모아 아래쪽에서 양발 안쪽을 부딪쳐 박수를 친다. 3) 난이도를 높여 점프 중 무릎을 뒤나 옆, 앞쪽으로 들어 올려 공중에서 발박수를 친다. 4) 착지 후 바로 다음 점프를 연속으로 수행하거나 착지 밸런스를 3초간 유지하도록 변형한다.</p>
