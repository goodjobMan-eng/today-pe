<h1>렛츠 댄스 오어 프리즈 (멈춤 댄스 놀이)</h1>
<p>1) 음악이 나오기 시작하면 화면의 춤을 따라 추거나 자신만의 프리스타일 춤을 추며 신나게 움직인다.2) 음악이 멈추고 화면에 FREEZE 표시가 뜨면 그 즉시 움직임을 멈추고 그대로 얼음 자세를 유지한다.3) 음악이 다시 나오면 동작을 재개하며 여러 라운드를 반복한다.</p>
