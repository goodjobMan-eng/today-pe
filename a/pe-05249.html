<h1>추수감사절 어린이 요가 브레인 브레이크</h1>
<p>1) 화면에 나오는 칠면조 캐릭터의 요가 자세를 화면을 보며 따라 한다.2) 깊은 숨을 들이쉬고 내쉬며 몸의 긴장을 풀고 균형을 유지한다.3) 전환 신호가 나오면 반대쪽 다리와 팔로 방향을 바꾸어 동일한 자세를 취한다.</p>
