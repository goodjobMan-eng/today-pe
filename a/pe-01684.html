<h1>퍼피 구조대 휴먼 테트리스 자세 맞추기 놀이</h1>
<p>1) 화면을 잘 볼 수 있도록 각자 주변의 안전 거리를 확보하고 바른 자세로 준비합니다. 2) 다가오는 벽 중앙에 뚫린 실루엣 구멍의 모양을 빠르게 관찰하고 신체로 똑같은 포즈를 만듭니다. 3) 벽이 몸을 통과할 때까지 흔들리지 않고 균형을 유지해야 해당 레벨을 통과합니다. 4) 레벨이 올라갈수록 한 발 서기나 유연성 중심의 고난도 스트레칭 동작으로 변형하여 도전합니다.</p>
