<h1>스택 뎀 업 (원뿔 쌓기 표적 게임)</h1>
<p>1) 벽에서 5m, 7m, 9m 거리에 라바콘을 일렬로 세우고, 벽과 가장 가까운 첫 번째 콘 위에 배구공을 올려놓는다. 2) 3~4명으로 구성된 팀이 가장 먼 콘 뒤에서 벽을 향해 테니스공을 던져, 벽에 맞고 튕겨 나온 공으로 배구공을 맞춰 떨어뜨린다. 3) 배구공이 떨어지면 넘어진 콘을 다음 콘 위에 겹쳐 쌓고 그 위에 배구공을 다시 올린 뒤, 3개의 배구공 표적을 모두 가장 먼저 쓰러뜨리는 팀이 승리한다.</p>
