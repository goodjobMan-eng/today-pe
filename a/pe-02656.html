<p>1) 무릎을 가슴 쪽으로 올리면서 몸통을 돌려주는 동작을 실시한다. 2) 사이드스텝으로 이동하여 반대편으로 빈백을 옮겨놓는다. 3) 다리를 벌리고 선 상태에서 하체를 고정하고 다리 라인을 따라 몸을 이동시킨다. 4) 자세를 낮추고 공을 바닥에 드리블하며 8자 모양으로 이동한다.</p>
