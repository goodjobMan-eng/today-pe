<h1>두루마리 휴지를 활용한 집콕 운동</h1>
<p>1) 두루마리 휴지 끝이 풀리지 않도록 안쪽으로 말아 넣거나 테이프로 고정한다.2) 휴지를 위로 던지고 박수를 친 뒤 떨어지는 휴지를 잡으며 박수 친 횟수를 기록한다.3) 휴지를 던진 후 몸 앞과 뒤를 오가며 앞뒤 박수를 치고 휴지를 잡는 횟수에 도전한다.4) 휴지를 발로 차서 땅에 떨어뜨리지 않고 연속으로 차올리는 개수를 기록한다.</p>
