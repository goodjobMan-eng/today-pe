<h1>뉴스포츠 콘홀 릴레이 게임</h1>
<p>1) 친구와 마주 보고 서서 주머니를 친구 발 앞에 살짝 던지는 연습을 한다. 2) 4m 거리에서 콘홀 보드의 구멍을 향해 주머니를 던지는 연습을 한다. 3) 남자 팀과 여자 팀으로 나누어 콘홀 릴레이 게임을 진행한다. 4) 팀원들이 차례로 주머니를 던져 주머니 4개를 먼저 구멍에 다 넣는 팀이 승리한다.</p>
