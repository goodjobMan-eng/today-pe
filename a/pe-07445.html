<h1>사라진 숫자 찾기 몸풀기 놀이</h1>
<p>1) 모든 참가자에게 겹치지 않게 고유 번호를 하나씩 부여한다. 2) 경기장 안을 자유롭게 이동하다가 다른 참가자를 만나면 자신의 번호를 말하고 서로 번호를 맞바꾼다. 3) 진행자가 신호를 주어 게임을 멈추면 전원이 모인다. 4) 번호를 순서대로 확인하며 빠진 숫자가 있는지 또는 중복된 숫자가 있는지 확인한다.</p>
