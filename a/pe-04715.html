<h1>터키 트롯 달리기</h1>
<p>1) 야외 트랙에 색깔 막대(또는 스카프)를 담은 바구니를 놓아둔다. 2) 트랙을 한 바퀴 달릴 때마다 칠면조 깃털 역할인 막대나 스카프를 1개씩 획득한다. 3) 매 바퀴마다 다른 색상을 선택하거나 자유롭게 골라 모은다. 4) 스카프를 사용할 경우 바퀴를 돌 때마다 바지 허리춤에 꽂고 달린다.</p>
