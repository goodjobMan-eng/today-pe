<h1>헤드 벗 태그</h1>
<p>1) 진행자가 하나, 둘, 셋을 외치면 모든 참가자는 손을 머리에 올리는 머리(Head) 또는 엉덩이에 대는 엉덩이(Butt) 중 하나를 선택한다 2) 머리 팀은 엉덩이 팀을 쫓아가 손으로 태그하고, 엉덩이 팀은 머리 팀을 쫓아가 태그한다 3) 태그를 당한 사람은 즉시 역할을 바꾸어 상대 팀으로 합류한다 4) 모든 참가자가 한 팀(전원 머리 또는 전원 엉덩이)이 될 때까지 게임을 계속한다.</p>
