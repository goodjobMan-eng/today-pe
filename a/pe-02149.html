<h1>킨볼 기본 공수 게임</h1>
<p>1) 4인 1조로 팀을 구성하며 수업 상황에 따라 3~5팀으로 운영한다. 2) 공격 팀은 '옴니킨 색깔'을 외친 후 셋을 세며 10초 안에 히팅을 실시한다. 3) 호명된 수비팀 4명은 공을 바닥에 떨어뜨리지 않고 캐치한다. 4) 수비는 공을 기준으로 위, 아래, 오른쪽, 왼쪽으로 대형을 맞추어 수비한다.</p>
