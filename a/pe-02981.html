<h1>배드민턴 기초 풋워크 4가지 드릴</h1>
<p>1) 바닥의 원마커에 발을 붙였다가 오른발, 왼발 순으로 조금씩 떼는 연습을 한다. 2) 잔발걸음을 촘촘하게 하다가 셔틀콕에 맞춰 오른발 또는 왼발·오른발을 떼며 스텝을 준비한다. 3) 잔발걸음을 하다가 셔틀콕이 뒤로 넘어올 때 뒤쪽으로 풋워크를 크게 잡아 이동한다. 4) 사이드스텝 후 뒷발(왼발)을 누르고 몸 방향을 틀며 셔틀콕을 앞으로 보낸다.</p>
