<h1>케이팝 다이너마이트 소고춤 리듬 표현</h1>
<p>1) 소고와 채를 쥐는 기본 손 모양을 익히고 면 치기와 테 치기 동작을 박자에 맞춰 연습한다 2) 1·3박 치기 및 머리·얼굴·가슴 순서의 4박자 타격 동작을 익히며 상체 리듬감을 기른다 3) 뒤꿈치부터 디디며 무릎 굴신을 주는 발동작과 결합하여 전진 및 후진하며 소고를 타격한다 4) 방탄소년단(BTS) 다이너마이트 국악 편곡 음악에 맞춰 배운 기본동작을 조합한 군무를 선보인다.</p>
