<h1>수준별 왕복달리기</h1>
<p>1) 15m 거리 양끝에 삼각콘을 설치하거나, 3m 거리에 지그재그로 접시콘을 설치한다. 2) 출발 신호가 울리면 앞으로 왕복 달리기는 맞은편 삼각콘을 돌아온다. 3) 옆으로 왕복 달리기는 첫 번째 접시콘에서 사이드 스텝으로 좌우 접시콘을 차례로 짚으며 이동한다. 4) 자신이 할 수 있는 만큼 반복하여 운동한다.</p>
