<h1>보치아 경기하기</h1>
<p>1) 가위바위보나 동전 던지기로 선공을 정하고, 2, 4, 6엔드 등 짝수 엔드로 진행합니다. 2) 선공 팀이 흰색 표적구를 먼저 던진 후 자신의 팀 공을 던집니다. 3) 양 팀이 공을 던진 후 표적구에서 더 멀리 떨어진 팀이 계속해서 공을 투구합니다. 4) 모든 공을 던진 후 상대 팀의 가장 가까운 공보다 표적구에 더 가까이 있는 공의 개수만큼 득점합니다.</p>
