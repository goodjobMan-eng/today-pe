<h1>축구 드리블 패스 릴레이 코스</h1>
<p>1) 두 팀으로 나누어 콘으로 설치된 코스 양쪽에서 각 팀 첫 주자가 공을 몰고 출발한다. 2) 콘 구간을 손을 쓰지 않고 발로만 돌아 나온 후 짝과 마주 보고 이동하며 패스를 주고받는다. 3) 모든 팀원이 통과하면 서로 손을 잡고 사이드스텝(파샤세)으로 반환점에 걸린 팀 조끼(스카프)를 가져온다.</p>
