<h1>넘어지지 않는 몸 만들기 밸런스 운동</h1>
<p>1) 바닥에 앉아 발을 붓처럼 사용하여 한 발을 들고 1부터 5까지 숫자를 공중에 쓴다. 2) 손을 뒤로 짚지 않고 반대 발로 숫자를 쓰거나, 양발을 모두 들고 크게 숫자를 쓴다. 3) 일어서서 한 발로 서서 균형을 잡으며 숫자를 쓰고, 눈을 감고도 도전한다. 4) 제자리 점프 후 착지하여 멈추기, 점프 회전 후 멈추기, 뒤로 굴렀다 한 발로 일어나 멈추기 등을 수행한다.</p>
