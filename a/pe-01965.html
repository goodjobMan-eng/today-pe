<h1>신호 반응 콘 터치 놀이</h1>
<p>1) 2~4명씩 짝을 짓고 가운데에 콘 1개를 놓아 준비한다. 2) 교사가 발끝 닿기, 한 발 서기, 팔 돌리기 등 동작을 지시하면 따라 한다. 3) 교사가 '출발(Go)' 신호를 외치면 가장 먼저 콘을 터치한 학생이 1점을 획득한다. 4) 음악을 틀어 콘 주변을 돌다가 음악이 멈출 때 터치하는 방식으로 변형할 수 있다.</p>
