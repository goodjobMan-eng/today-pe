<h1>발로 공 차서 콘 맞히기</h1>
<p>1) 7명이 한 모둠을 이루어 두 모둠으로 나눈 뒤, 후프 안에 콘을 세워 들어갈 수 없는 골대로 만든다. 2) 공격 모둠은 발로 공을 차고 멈추며 몰면서 수비수를 피해 공으로 상대 모둠의 콘을 맞힌다. 3) 수비 모둠은 공격 모둠이 콘을 맞히지 못하게 수비하며, 공을 빼앗기거나 밖으로 나가면 공수가 바뀐다. 4) 상대 모둠의 콘을 가장 먼저 맞힌 모둠이 이긴다.</p>
