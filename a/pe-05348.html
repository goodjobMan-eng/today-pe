<h1>멀티 버킷 컵 쌓기 챌린지 (Multi Buckets Stacking)</h1>
<p>1) 3인 1조로 팀을 구성하고 출발선에 선다.2) 한 번에 양동이 1개씩만 들고 나가 피라미드 형태로 쌓는다.3) 반환 시 한 번에 양동이 1개씩만 만져서 회수하거나, 제시된 규칙(2개·6개·10개 탑)에 맞춰 쌓기를 완성한다.4) 전원이 함께 나가 최대한 높이 양동이 탑을 쌓아 올린다.</p>
