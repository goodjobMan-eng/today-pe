<h1>배드민턴형 네트 넘기기 게임</h1>
<p>1) 교실 책상이나 의자로 임시 네트를 만들고, 네트 너머에 4가지 인성 덕목 바구니(존중, 협동, 규칙 준수, 배려)를 배치한다. 2) 백핸드 방식으로 네트 가까이에 있는 인성 바구니를 향해 셔틀콕을 쳐서 넣는다. 3) 포핸드 방식으로 허리 아래에서 강하게 쳐서 조금 더 멀리 있는 인성 바구니에 셔틀콕을 넣는다. 4) 하이 클리어 방법으로 셔틀콕을 높고 멀리 쳐서 네트 너머 상대 코트로 보낸다.</p>
