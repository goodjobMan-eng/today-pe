<h1>버지니아 릴 소셜 댄스</h1>
<p>1) 파트너와 마주 보고 서서 4박자 동안 가운데로 가 인사하고 제자리로 돌아온다. 2) 오른팔을 걸고 8박자 동안 원을 돌고, 왼팔을 걸고 8박자 동안 원을 돈다. 3) 오른 어깨 쪽으로 돌며 8박자 도싯도를 하고, 왼 어깨 쪽으로 돌며 8박자 도싯도를 한다. 4) 박자에 맞춰 발을 구르고 손뼉을 치는 동안 리드 커플이 셔플로 이동 후 바깥쪽으로 돌아 터널을 만들면 다른 학생들이 통과한다.</p>
