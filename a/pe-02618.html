<h1>온라인 기초체력 기르기 운동</h1>
<p>1) 한 발을 앞으로 내딛고 무릎을 굽히는 런지 자세를 10초간 유지합니다. 2) 팔꿈치와 무릎을 댄 상태에서 무릎을 떼고 몸을 일직선으로 펴는 플랭크 자세를 30초씩 3세트 진행합니다. 3) 엎드린 자세에서 양팔과 다리를 들어 올려 5초간 버틴 후 내리는 슈퍼맨 동작을 5회씩 3세트 반복합니다. 4) 손을 어깨너비보다 넓게 짚고 엎드려 내려갔다 올라오는 팔굽혀펴기를 10회씩 2세트 실시합니다.</p>
