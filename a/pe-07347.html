<h1>원형 술래잡기</h1>
<p>1) 모든 참가자가 손을 잡고 원을 만든다. 2) 술래 1명이 원 밖으로 나가고, 원 안에서 잡힐 대상 1명을 정한다. 3) 원을 만든 참가자들은 술래가 동료를 잡지 못하도록 막으며, 술래는 원 사이를 빠져나갈 수는 있지만 부수고 들어갈 수는 없다.</p>
