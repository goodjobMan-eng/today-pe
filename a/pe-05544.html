<h1>해-달-별 시간 점프!</h1>
<p>1) 체조 대형으로 서서 지시어에 맞춰 12시는 앞으로 점프, 6시는 뒤로 점프, 3시(해)는 오른쪽 점프, 9시(달)는 왼쪽 점프를 한다.2) 별 지시어에는 360도 턴을 하고, 뒤로 돌아 지시어에는 180도 턴을 한다.3) 해와 달은 절대적인 방향이므로 뒤로 돌아선 상태에서도 처음 시작할 때의 절대적 방향과 동일하게 뛴다.</p>
