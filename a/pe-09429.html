<h1>컵 스틱 놀이</h1>
<p>1) 한 손에는 컵을 끼운 펀스틱, 다른 한 손에는 펀스틱을 듭니다. 2) 펀스틱으로 상대방의 컵을 직접 치거나 상대방의 펀스틱을 쳐서 컵을 떨어뜨리면 승리합니다. 3) 시작과 동시에 나의 컵을 지키고, 상대방 컵을 떨어뜨립니다.</p>
