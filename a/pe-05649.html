<h1>업다운 손 얹기 놀이</h1>
<p>1) 두 사람이 짝을 지어 한 사람이 손등을 내밀면 다른 사람이 그 위에 손을 얹고 번갈아 손을 쌓아 올린다.2) 손을 위아래로 옮기며 서로 손을 맞추어 두 바퀴를 돌린다.3) 준비 시작 신호와 함께 10번(또는 4명이서 20번)을 가장 먼저 빠르게 완료하고 제자리에 앉는 팀이 승리한다.</p>
