<h1>발로 공 이어 주기 게임</h1>
<p>1) 5명씩 2모둠을 이루어 2명씩 각자 위치에 선다. 2) 공을 가진 모둠은 다양한 방법으로 득점 구역에 있는 친구에게 발로 공을 이어 준다. 3) 득점 구역의 친구가 공을 받으면 1점을 획득한다. 4) 상대 모둠이 공을 가로채면 상대 모둠으로 공이 넘어가며, 정해진 시간 동안 점수가 가장 많은 모둠이 승리한다.</p>
