<h1>맞수대결 풍선 축구</h1>
<p>1) 3m 원 안에서 두 명이 마주 보고 서서 손과 팔을 제외한 부위로 풍선을 한 번씩 주고받으며 원 안에 떨어뜨리면 득점한다. 2) 네트 양쪽에 3m 코트를 만들고 2번 이내 터치로 상대 코트에 풍선을 넘겨 족구 경기를 한다. 3) 5m 거리에서 헤딩으로 출발하여 풍선을 떨어뜨리지 않고 이동해 미니 골대에 먼저 넣는 사람이 승리한다.</p>
