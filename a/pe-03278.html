<h1>마음모아 뜻모아</h1>
<p>1) 개인별로 한 개씩 다른 색의 원마커를 가지고 원형으로 서서 원마커를 밟고 선다. 2) 원마커 위에 모둠발로 서서 다 같이 손을 잡는다. 3) '하나, 둘, 셋' 신호에 맞춰 오른쪽으로 동시에 점프하여 옆 친구의 원마커를 밟는다. 4) 전체 원을 만들어 뛰어 돌 때 중심을 잡지 못해 쓰러지거나 원마커 안에 들어오지 못하면 다 같이 스쿼트를 수행하고, 익숙해지면 한 발로 점프하거나 왼쪽으로 이동한다.</p>
