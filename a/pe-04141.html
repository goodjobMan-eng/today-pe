<h1>림보 봉 통과하기</h1>
<p>1) 양쪽에서 림보 봉을 높게 들고 참가자들은 줄을 서서 차례대로 봉 아래를 지나간다. 2) 봉 아래를 지날 때는 배를 먼저 앞으로 내밀고 머리는 가장 나중에 통과해야 하며 발만 바닥에 닿아야 한다. 3) 머리가 먼저 들어가거나 손 등 신체가 바닥에 닿거나 봉을 건드리면 탈락하여 콘에 앉아 응원한다. 4) 모든 참가자가 지나간 뒤 다음 라운드마다 봉의 높이를 조금씩 낮추어 마지막 남은 사람이 승리한다.</p>
