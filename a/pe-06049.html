<h1>시계게임 (짹깍짹깍 몇 시?)</h1>
<p>1) 진행자가 &quot;째깍째깍 째깍째깍 몇 시?&quot;라고 구호를 외친다.2) 진행자와 학생들이 동시에 팔 동작으로 시간을 나타낸다(양손 위로 12시, 수평 9시/3시, 아래로 6시).3) 진행자와 같은 시간을 표시한 학생은 통과하거나 살아남는다.4) 짝 활동으로 진행할 경우 서로 등을 지고 서 있다가 구호에 맞춰 돌아보며 동작을 맞춘다.5) 짝과 동작이 일치하면 하이파이브를 하고 환호하며 성공을 축하한다.</p>
