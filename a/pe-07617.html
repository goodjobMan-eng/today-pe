<h1>잡고 한 걸음</h1>
<p>1) 코트 중앙에서 두 명씩 짝을 지어 서로 마주 보고 서며, 짝마다 공을 1개씩 갖는다. 2) 한 사람이 상대방에게 공을 패스한다. 3) 공을 던져 준 파트너가 공을 받아내면 뒤로 한 걸음 물러선다. 4) 공을 잡지 못하고 떨어뜨리면 앞으로 한 걸음 다가선다. 5) 거리를 조절하며 패스와 캐치를 반복한다.</p>
