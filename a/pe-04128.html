<h1>가장 빠른 학급 챌린지 (5분 달리기)</h1>
<p>1) 체육관 네 모서리에 콘 4개를 설치하여 트랙 코스를 만든다. 2) 타이머를 5분으로 설정하고 신호와 함께 전원 코스를 따라 5분 동안 달린다(걷거나 조깅 가능). 3) 학생이 기준점을 통과할 때마다 교사가 카운터기로 학급 전체의 랩(바퀴) 수를 합산 측정한다. 4) 총 랩 수를 출석 학생 수로 나누어 학생 1인당 평균 랩 수를 계산해 최고 기록 학급을 선정한다.</p>
