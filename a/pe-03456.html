<h1>초등 5학년 농구형 게임의 기본 규칙</h1>
<p>1) 손으로 공을 다루면서 상대 영역으로 이동한다. 2) 공이 발에 닿아서는 안 되며, 공을 들고 세 걸음 이상 걸으면 안 된다. 3) 공이 아군 모둠을 맞고 게임장 밖으로 나가면 상대 모둠에게 공격권이 넘어간다. 4) 상대 모둠의 골대에 공을 던져 넣으면 점수를 얻는다.</p>
