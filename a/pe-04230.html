<h1>유령열차</h1>
<p>1) 한 명의 유령열차 기장을 제외한 나머지 사람들은 원으로 앉아서 눈을 감습니다. 2) 유령열차 기장은 원 바깥을 돌면서 한 명씩 어깨를 치며 한 방향으로 돕니다. 3) 유령이 되어 일어난 사람들은 유령열차의 기장 뒤에 붙어 같이 손을 잡고 걷습니다. 4) 놀이 중 자신이 제일 마지막까지 남은 사람이라고 생각되면 눈을 뜹니다. 5) 가장 마지막에 남은 사람이 있으면 그 사람 주위를 한 바퀴 돕니다.</p>
