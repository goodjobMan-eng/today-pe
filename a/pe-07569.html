<h1>후프 배구</h1>
<p>1) 중앙에 높이 2m 네트를 설치하고 6명씩 2개 모둠을 이룬다. 2) 공이 올 것으로 예상되는 곳에 후프를 놓고 경기장 밖에서 공을 쳐서 넘겨준다. 3) 한 사람당 두 번씩 공을 쳐서 넘겨주고 모둠원끼리 이어주어 3번 안에 네트 너머 후프를 피해 보낸다. 4) 네트 너머 후프를 건드리지 않고 공을 보내면 1점을 얻고, 점수를 많이 얻은 모둠이 이긴다.</p>
