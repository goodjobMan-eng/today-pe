<h1>공 2개 저글링 2단계 던지고 던지고 받기</h1>
<p>1) 양손에 공(볼)을 각각 하나씩 쥐고 준비한다. 2) 주로 쓰는 손(오른손잡이는 오른손)부터 공을 비스듬히 위로 던진다. 3) 첫 번째 공이 정점에 이를 때 반대쪽 손의 공을 이어서 던진다. 4) &quot;던지고 던지고 받고 받고&quot; 구령에 맞춰 양손으로 순서대로 날아오는 공을 잡는다.</p>
