<h1>페트 볼 (페트병 쓰러뜨리기 패스 게임)</h1>
<p>1) 경기장 양 끝 원형 구역 안에 표적으로 세워진 페트병들을 배치합니다. 2) 팀원들은 패스를 주고받으며 상대 진영으로 전진해 페트병을 공으로 던져 쓰러뜨리면 득점합니다. 3) 페트병을 쓰러뜨려 득점한 선수는 직접 가서 페트병을 다시 세우고 자기 점수를 기록판에 올린 뒤 복귀해야 합니다. 4) 득점자가 표적을 정리하는 동안 일시적인 수적 우위가 생기므로 빠른 역습과 패스 플레이가 중요합니다.</p>
