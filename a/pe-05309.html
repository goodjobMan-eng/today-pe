<h1>코치 스미스의 스카프 저글링 챌린지</h1>
<p>1) 1장의 스카프로 흔들기, 양손 번갈아 던지고 받기, 한 손으로 던지고 받기를 연습한다2) 스카프를 던지고 돌아서 받기, 다리 밑으로 던져 받기, 박수 치고 받기 등 응용 동작을 수행한다3) 스카프를 입으로 불어 띄운 후 무릎이나 발로 받기를 시도한다4) 2장의 스카프를 사용해 양손으로 던져 교차해 받기 및 한 손 저글링에 도전한다.</p>
