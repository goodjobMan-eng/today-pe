<h1>음악 멈춤 요가 프리즈 댄스</h1>
<p>1) 신나는 음악에 맞춰 각자 제자리에서 자유롭게 춤을 춘다. 2) 음악이 멈추고 화면에 칠면조나 나무늘보 등 캐릭터가 나타나면 그 자리에서 얼음(Freeze)이 된다. 3) 화면에 제시된 동물 요가 정지 자세를 타이머가 끝날 때까지 15초 동안 유지하며 버틴다. 4) 다음 음악이 나오면 다시 춤을 추고, 라운드가 반복될 때마다 한 발 서기 등 난이도가 높은 자세를 유지해 본다.</p>
