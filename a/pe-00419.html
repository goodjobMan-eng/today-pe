<h1>교실 책상 달팽이경주</h1>
<p>1) 교실 책상을 길게 4줄로 배치해 달팽이 모양의 이동 경로를 만들고 두 팀으로 나눕니다. 2) 두 팀이 양쪽 끝에서 빠른 걸음으로 출발해 마주치면 가위바위보를 합니다. 3) 진 학생은 책상에 걸터앉고 이긴 학생은 계속 전진하며, 진 팀의 다음 주자는 즉시 출발하고 길에 앉아 있는 자기 팀 친구를 터치하면 다시 살릴 수 있습니다. 4) 상대 진영 끝까지 도달해 마지막 대기 학생과의 가위바위보까지 이기면 승리합니다.</p>
