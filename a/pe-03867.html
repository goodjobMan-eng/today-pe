<h1>줄넘기 기초 레인보우 턴 및 점프 연습</h1>
<p>1) 줄 가운데를 밟고 손잡이를 겨드랑이 높이까지 당겨 알맞은 줄 길이를 맞춘다. 2) 발을 움직이지 않고 줄만 앞으로 넘기는 레인보우 턴을 10회 연습한다. 3) 레인보우 턴을 하며 한 발씩 앞으로 걸어 넘어가는 연습을 한다. 4) 레인보우 턴 후 양발로 가볍게 점프해 넘는 연습을 하고 자유롭게 줄넘기를 이어간다.</p>
