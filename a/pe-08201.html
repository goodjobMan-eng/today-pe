<h1>중간놀이 축구 규칙</h1>
<p>1) 필드 플레이어는 손을 쓸 수 없으며, 골키퍼가 골대 근처에 있거나 사이드라인 밖으로 나간 공을 스로인할 때만 손을 사용한다. 2) 머리를 보호하기 위해 의도적인 헤더는 금지되며, 중앙선 킥오프로 경기를 시작하거나 득점 후 재개한다. 3) 사이드라인 밖으로 나가면 두 발을 땅에 붙이고 머리 위로 두 손 스로인을 하고, 공격팀 맞고 엔드라인을 벗어나면 골킥, 수비팀 맞고 벗어나면 코너킥을 진행한다.</p>
