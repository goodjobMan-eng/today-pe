<h1>벤치볼</h1>
<p>1) 강당 양쪽 끝에 긴 벤치를 놓고, 각 팀에서 1명이 상대편 코트 뒤쪽 벤치에 올라가 시작합니다. 2) 각 팀은 상대 선수를 맞히는 대신, 상대 코트 끝 벤치 위에 서 있는 자기 팀원에게 공을 패스합니다. 3) 벤치 위의 팀원이 공을 떨어뜨리지 않고 안전하게 잡으면 공을 던진 주자도 상대편 벤치로 이동해 올라갑니다. 4) 벤치 위에 팀원 5명이 먼저 올라가는 팀이 그 라운드에서 승리합니다.</p>
