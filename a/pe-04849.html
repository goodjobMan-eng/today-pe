<h1>주변 도구를 이용한 릴레이 놀이</h1>
<p>1) 바통 대신 접시콘을 머리에 하나 올리고 손을 대지 않은 채 반환점을 돌아 다음 친구 머리에 올려준다.2) 접시콘이 떨어지면 그 자리에서 다시 주워 머리 위에 올리고 이동한다.3) 화장지나 신문지를 몸 앞쪽에 대고 공기 저항을 이용해 떨어지지 않게 달리거나 종이비행기를 날려 따라가는 방식으로 응용한다.</p>
