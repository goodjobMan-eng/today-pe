<h1>단심줄놀이</h1>
<p>1) 단심봉에 짝수 개의 천을 매달고 참여자들이 천을 한 가닥씩 잡고 선다. 2) 순서대로 홀수와 짝수를 정해 홀수는 우향우, 짝수는 좌향좌로 마주본다. 3) 노래에 맞춰 진행 방향으로 가며 천을 들고 바깥으로, 다음에는 천을 숙여 안쪽 밑으로 교차해 지나간다. 4) 천이 다 감기면 반대 방향으로 진행하며 같은 방식으로 엮인 줄을 풀어낸다.</p>
