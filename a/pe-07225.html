<h1>철봉 달마 돌기(무릎 걸쳐 돌기)</h1>
<p>1) 제비 자세(철봉 위 지지 자세)에서 다리를 앞뒤로 흔들며 반동을 만든다. 2) 매달려 돌기 전 바닥에서 몸 웅크리기(구르기 자세) 동작을 연습해 둥근 몸 형태를 익힌다. 3) 철봉에 오금(무릎 뒤)을 단단히 걸고 손으로 무릎 뒤를 강하게 잡은 뒤 팔과 상체 전체를 과감하게 앞으로 기울이며 회전한다.</p>
