<h1>학교에 가면' 창작 체조 기억하기 게임</h1>
<p>1) 둥글게 둘러서거나 자리에 앉아 순서를 정한다. 2) 첫 번째 사람이 '학교에 가면'을 외치고 학교 관련 사물(예: 연필, 책상)을 몸 전체나 특정 부위 스트레칭 동작으로 표현한다. 3) 다음 사람은 앞사람의 체조 동작을 순서대로 모두 따라 한 뒤 자신의 새로운 스트레칭 동작을 추가한다. 4) 앞 동작을 기억하지 못하거나 틀린 학생이 나오면 벌칙을 수행하거나 새로운 주제로 다시 시작한다.</p>
