<h1>지그재그 드리블 및 스텝오버 릴레이 드릴</h1>
<p>1) 콘을 지그재그 형태로 배치하고 끝 지점에 작은 원 구역을 표시한다.2) 공을 몸 가까이에 두고 발의 인사이드, 아웃사이드, 발바닥 등을 활용해 콘 사이를 드리블한다.3) 각 콘에 도달할 때마다 공을 멈추었다가 다음 콘으로 이동한다.4) 끝 지점 원에 도착하면 공을 멈춘 후 건드리지 않고 스텝오버(헛다리 짚기) 10회를 수행하고 출발점으로 빠르게 복귀한다.</p>
