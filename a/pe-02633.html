<h1>엎드려 다리 뻗기</h1>
<p>1) 무릎과 손을 바닥에 대고 'ㄷ' 모양으로 엎드려서 준비한다. 2) 다리, 엉덩이, 허리, 어깨가 일직선이 되도록 다리를 뒤로 뻗는다. 3) 무릎을 굽혀 엎드린 상태에서 몸이 일직선이 되도록 다리를 뒤로 뻗는 동작을 좌우 5회씩 반복한다.</p>
