<h1>미니 장애물 코스 준비운동</h1>
<p>1) 번호가 적힌 큰 콘 4개 뒤에 줄을 선다. 2) 각 콘에 해당하는 장애물 활동(1번 트램펄린·평균대, 2번 콘 지그재그 달리기, 3번 곰 걸음·게 걸음, 4번 허들 점프·사방치기)을 수행한다. 3) 장애물을 통과한 뒤 구석 바구니에서 보상 물품(과일·채소 모형)을 1개 꺼낸다. 4) 다른 장애물에 방해되지 않도록 벽 쪽을 따라 달려가 빈 빨간 바구니에 물품을 넣고 다른 줄로 이동한다.</p>
