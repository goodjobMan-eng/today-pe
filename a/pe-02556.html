<h1>발목줄넘기 따라잡기</h1>
<p>1) 발목줄넘기의 고리 부분에 한쪽 발목을 끼우고 줄을 수평으로 놓는다. 2) 줄을 뒤쪽으로 돌려 돌아오는 줄을 반대쪽 발로 뛰어넘는다. 3) 한 발씩 번갈아 뛰며 발을 좌우나 앞뒤로 가볍게 스텝을 밟아 넘는다. 4) 숙달되면 발을 바꾸거나 두 명이 함께 넘는 방식으로 진행한다.</p>
