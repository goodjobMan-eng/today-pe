<h1>캐치 배구 2</h1>
<p>1) 약 2m 높이의 네트를 사이에 두고 양 팀이 마주 보고 서서 경기를 진행합니다. 2) 서브와 패스 때 날아오는 공을 두 손으로 잡은 뒤 같은 팀원에게 던져 연결합니다. 3) 세 번째로 공을 잡은 선수가 네트 너머 상대 진영으로 던져 공격(스파이크 대신)을 시도하며, 상대 어택라인보다 뒤쪽으로 넘겨야 유효하고 라인 안쪽은 아웃입니다. 4) 공을 바닥에 떨어뜨리지 않고 정해진 횟수 안에 상대 코트로 넘겨 득점을 겨룹니다.</p>
