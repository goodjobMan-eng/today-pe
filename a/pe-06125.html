<h1>주자가 있는 티볼형 게임</h1>
<p>1) 두 모둠으로 나누어 공격 순서와 수비 위치를 정하고 루간 거리가 14m인 경기장에서 진행한다.2) 1회 1루, 2회 2루, 3회 2·3루, 4회 1·2·3루 주자 배치 상황에 맞추어 공격 모둠의 타자가 배팅티 위의 공을 친다.3) 수비는 뜬공을 잡거나 타자보다 먼저 루로 공을 보내 아웃시키고, 공격자가 홈에 들어오면 1점을 얻으며 3아웃 시 공수를 교대하여 4회까지 진행한다.</p>
