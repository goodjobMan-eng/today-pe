<h1>하키 스타 드리블 연습</h1>
<p>1) 중앙에 큰 콘을 두고 주변에 작은 콘 4개를 배치한다.2) 바깥쪽 콘에서 출발하여 중앙 콘을 돌고 다음 바깥쪽 콘으로 드리블한다.3) 다시 중앙 콘을 돌아 다음 바깥쪽 콘으로 이동하는 과정을 반복한다.4) 모든 방향을 돌고 처음 출발한 콘으로 돌아온다.</p>
