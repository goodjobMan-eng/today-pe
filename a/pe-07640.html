<h1>왕 (농구 슛 놀이)</h1>
<p>1) 구역별 투구 위치를 정하고 시작 방향을 결정한 뒤 한 명은 골대 밑에 서고 나머지 선수는 지정 위치에 선다 2) 순서대로 슛을 던져 득점하면 옆 구역으로 한 칸 이동하고 연속해서 던질 수 있으며 실패하면 다음 순서로 넘어간다 3) 골대 밑 선수가 백보드에 튕겨 나온 공을 바로 잡아 골을 넣으면 직전 투구자와 자리를 교체한다 4) 마지막 투구 구역에서 슛을 성공한 참가자가 승리하여 왕이 된다</p>
