<h1>모두가 술래인 얼음 땡</h1>
<p>1) 전원이 술래가 되어 서로를 태그하며 태그당하지 않도록 도망친다. 2) 태그된 사람은 그 자리에 멈춰 두 손을 앞으로 내밀고 있는다. 3) 다른 참여자가 다가와 내민 손을 세 번 쳐주면 풀려나 다시 게임에 참여한다. 4) 원마커 베이스에 올라가거나 한 발 서기 동작을 취해 5초간 태그를 피할 수 있다.</p>
