<h1>공 던지고 잡기(1차시) 활동2</h1>
<p>1) 또래 도우미(친샘)가 활동 시범을 보이며 던지고 잡기 활동을 안내한다.2) 학생들은 공을 가슴 높이나 한 손으로 튀겨 가슴 높이에서 던지고 잡는 동작을 연습한다.3) 던질 때는 팔을 뻗고 오른손으로 던질 때 왼발을 내밀면서 던지며, 잡을 때는 끌어당기면서 잡는다.4) 신호에 따라 공을 가지고 다음 구역으로 이동하며 활동을 반복한다.</p>
