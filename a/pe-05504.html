<h1>후프 타임머신</h1>
<p>1) 훌라후프를 바닥에 일렬로 촘촘하게 배치하여 코스를 만든다.2) 주자는 후프 안으로 두 발을 모아 점프하며 앞으로 전진한다.3) 주자가 지나간 뒤쪽 후프를 도우미가 신속히 집어 주자 앞쪽 바닥에 연속해서 연결해 준다.4) 반환점까지 전진한 뒤 역할을 바꾸거나 팀 릴레이 방식으로 복귀한다.</p>
