<h1>화장실 휴지 롤 밸런스 챌린지</h1>
<p>1) 1단계는 머리 위에 휴지 롤 1개를 얹고 바닥에 앉았다가 일어난다.2) 2단계는 손을 바닥에 짚지 않고 머리 위 휴지 롤의 균형을 잡으며 앉았다가 일어난다.3) 3단계는 손바닥 위에 두 번째 휴지 롤을 올리고 내려간 뒤, 일어날 때 바닥에 떨어뜨리지 않고 손을 바꾸어 일어난다.</p>
