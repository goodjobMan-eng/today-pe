<h1>집어 교과 놀이</h1>
<p>1) 짝과 마주 보고 책상 가운데에 풀(또는 필통) 등 집을 물건을 하나 올려 둡니다. 2) 화면에 2~3가지 보기가 있는 학습 퀴즈 문제를 띄우고 답을 생각하게 합니다. 3) 교사가 머리, 어깨, 배, 무릎 등 신체 부위를 부르면 학생들은 해당 부위에 두 손을 얹고, 교사가 '집어!'라고 외치면 가운데 물건을 먼저 잡는 학생이 우선권을 얻습니다. 4) 물건을 먼저 잡은 학생이 짝에게 귓속말로 정답을 말해 맞히면 점수를 얻습니다.</p>
