<h1>뜀틀 머리대고 넘기(헤드스프링) 도전하기</h1>
<p>1) 뜀틀 앞에 발구름판을 놓고 착지 매트를 충분히 깔아 도움닫기 코스를 준비합니다. 2) 도움닫기를 하여 발구름판을 양발로 강하게 구르고, 뜀틀 상단에 두 손과 머리(정수리 앞부분)를 짚으며 몸을 띄웁니다. 3) 몸이 거꾸로 서는 순간 손과 머리로 뜀틀을 밀치며 다리를 힘차게 앞으로 튕겨 넘깁니다. 4) 반동을 이용해 착지 매트에 양발로 중심을 잡고 바로 선 뒤 양손을 들어 동작을 마무리합니다.</p>
