<h1>정전기 척력을 이용한 공중부양 비닐봉지 띄우기</h1>
<p>1) 털가죽으로 고무풍선을 문질러 음전하를 띠게 만든다. 2) 털가죽으로 비닐봉지를 문질러 비닐봉지도 음전하를 띠게 만든다. 3) 고무풍선과 비닐봉지 사이에 발생하는 정전기 척력을 이용해 비닐봉지를 고무풍선 위로 띄운다. 4) 비닐봉지가 바닥에 떨어지지 않도록 고무풍선으로 밀어내며 더 오랫동안 띄우는 사람이 승리한다.</p>
