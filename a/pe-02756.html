<h1>심폐지구력 향상 2분 줄넘기 도전</h1>
<p>1) 간편한 운동복 차림과 줄넘기를 준비한다. 2) 2분 동안 쉬지 않고 줄넘기를 연속으로 넘는 것에 도전한다. 3) 도중 줄에 걸리면 즉시 다시 시작하여 정해진 시간 동안 횟수를 센다. 4) 주당 3~5회 규칙적으로 줄넘기 운동을 지속하여 심폐지구력을 기른다.</p>
