<h1>발야구·축구 킥 훈련(비행기 밸런스와 크로스 터치)</h1>
<p>1) 머리를 숙이고 한 다리를 뒤로 드는 비행기 밸런스로 백스윙(뒤로 젖히기) 자세를 익힌다. 2) 뜀틀이나 지지대에 손을 얹고 디딤발을 공 옆에 둔 뒤 몸을 약간 기울여 발등으로 차는 감각을 익힌다. 3) 킥을 한 뒤 발을 높이 올려 반대쪽 손을 터치하는 크로스 터치로 팔로스루 동작을 연결한다. 4) 1보 점프 스텝으로 들어가 멈추며 비행기 밸런스에서 크로스 터치로 이어지는 전체 킥을 단계별로 확장한다.</p>
