<h1>스텝 점프와 도움닫기 멀리뛰기 드릴</h1>
<p>1) 잔디밭에서 일정한 간격으로 무릎을 높여 뛰는 스텝 점프(가위뛰기 동작)를 연습한다. 2) 도움닫기 주로에 콘을 일정한 간격으로 배치하고 리듬에 맞춰 달려간다. 3) 모래사장 직전 발구름 구역에서 힘차게 도약하여 모래사장으로 착지한다. 4) 여러 명이 나란히 서서 도움닫기 후 동시에 모래사장으로 착지하는 연습을 반복한다.</p>
