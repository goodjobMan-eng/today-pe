<h1>가가볼(Gaga Ball) 게임 규칙 및 진행 방법</h1>
<p>1) 책상을 눕혀 사각형 경기장을 만들고 참가자는 책상에 손을 터치하고 대기합니다. 2) 진행자가 공을 경기장 가운데에 던져주고 구호(가가볼)를 외치면 공이 바닥에 3번 닿은 뒤 경기가 시작됩니다. 3) 참가자는 손으로 공을 쳐서 허리 아래 부분을 맞춰 상대방을 아웃시킬 수 있습니다.</p>
