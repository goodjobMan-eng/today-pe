<h1>스카이워커 죽마(키다리 발판) 걷기</h1>
<p>1) 발판을 뒤쪽 팔 아래에 밀착하여 단단히 잡는다.2) 벽에 등을 대고 서서 한 발씩 차례대로 발판 위에 올린 후 균형을 잡는다.3) 벽에서 떨어져 앞으로 천천히 걸어가며 방향 전환(턴)을 연습한다.4) 익숙해지면 뒤로 걷기나 발판 높이를 올려 높은 단계에서 걷기에 도전한다.</p>
