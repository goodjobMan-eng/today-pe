<h1>캥거루 마라톤</h1>
<p>1) 2개 팀으로 나누고 각 팀의 첫 번째 주자(캥거루)가 신호에 맞춰 팀 앞에 놓인 훌라후프를 점프해 건너간다. 2) 팀원들은 주자가 지나간 훌라후프를 주워 주자의 앞쪽에 다시 놓아 길을 이어준다. 3) 주자가 훌라후프 밖(바닥)에 닿으면 처음으로 돌아가 다시 시작한다. 4) 주자가 반대편에 먼저 도착한 팀이 1점을 얻고, 팀원 전원이 주자 역할을 수행할 때까지 반복한다.</p>
