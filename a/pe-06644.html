<h1>학교 주변 플로깅(줍깅) 활동</h1>
<p>1) 학생들의 체력 수준을 고려하여 코스별(평지, 언덕 등) 모둠을 편성한다. 2) 사전에 이동 경로, 소요 시간, 교통 위험 요소, 분리수거 계획을 세운다. 3) 러닝 앱을 켜고 모둠원들과 함께 조깅하며 정해진 구역의 쓰레기를 줍는다. 4) 활동 중 위험 상황을 피하고 교사 및 조장과 실시간 연락을 유지한다. 5) 주운 쓰레기를 분리수거하고 이동 거리와 활동 소감을 기록한다.</p>
