<h1>자리 바꾸기 (의자 빼기 진술 놀이)</h1>
<p>1) 전체 인원수보다 1개 적은 수의 의자(또는 바닥 마커)를 둥글게 배치하고 참가자들이 앉는다 2) 술래 1명이 원 가운데 서서 자신에게 해당하는 사실(예: &quot;나는 아이스크림을 좋아한다&quot;)을 말한다 3) 해당 진술에 해당하는 사람들은 모두 일어나 자신과 바로 옆자리가 아닌 다른 빈자리로 이동해야 한다 4) 술래도 빈자리를 찾아 앉으며, 자리를 차지하지 못한 사람이 다음 술래가 되어 새로운 진술을 한다</p>
