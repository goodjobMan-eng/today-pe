<h1>워터 스펀지 피구 (웻 닷지볼)</h1>
<p>1) 경기장 중앙에 차가운 물을 채운 양동이를 배치하고 참가자들을 양 팀으로 나눈다. 2) 게임 시작 시 대표 학생 1~2명이 중앙으로 달려가 양동이 속 젖은 스펀지를 가져온다. 3) 스펀지를 쥐고 상대 진영으로 던져 상대 팀 선수를 맞혀 아웃시킨다. 4) 날아오는 젖은 스펀지를 피하며 상대 팀원을 모두 아웃시킬 때까지 진행한다.</p>
