<h1>교차 만남(콘 들어올리기 릴레이)</h1>
<p>1) 두 팀으로 나누고 각 팀 앞에 색깔 콘을 하나씩 배치한 뒤 총 6개의 콘을 경기장에 둔다. 2) 신호가 울리면 각 팀의 첫 번째 주자가 달려 나가 상대 팀 콘을 돌아서 달린다. 3) 주자는 자기 팀 쪽의 색깔 콘으로 돌아와 먼저 들어올려 1점을 획득하며 동시에 들어올리면 양 팀 모두 1점을 얻는다. 4) 먼저 10점을 얻는 팀이 승리한다.</p>
