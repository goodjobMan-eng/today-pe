<h1>양말 서클 밸런스</h1>
<p>1) 뭉친 양말 한 켤레를 손에 쥐고 무릎을 굽혀 한 발로 들어 올린다. 2) 양손을 사용하여 들어 올린 다리의 허벅지 아래로 양말을 통과시킨다. 3) 허벅지 위로 양말을 다시 넘겨 양손으로 주고받으며 원을 그린다. 4) 20초 동안 자세를 유지하며 양말을 떨어뜨리지 않고 통과시킨 횟수를 센다.</p>
