<h1>볼 탈취 술래잡기 (축구 워밍업)</h1>
<p>1) 술래 1명은 마커 구역 안에서 공을 발로 지키며 다른 사람들을 터치하러 쫓아간다. 2) 바깥 사람들은 술래를 피해 마커(안전지대) 바깥으로 도망치거나, 기회를 노려 술래의 공을 빼앗는다. 3) 공을 빼앗은 팀이 패스를 5번 연속 성공하면 1점을 획득하고, 술래에게 터치당하면 그 사람이 새로운 술래가 된다.</p>
