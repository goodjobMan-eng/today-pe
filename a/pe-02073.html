<h1>2인 1조 짝 유연성 기르기 스트레칭</h1>
<p>1) 두 사람이 마주 보고 서서 서로 어깨에 손을 올린 뒤 뒤로 물러나 상체를 숙이며 어깨를 눌러준다. 2) 나란히 서서 한 손은 상대방 어깨를 잡고 반대 손으로 자신의 발목을 잡아 뒤로 당겨 허벅지 앞쪽을 늘려준다. 3) 마주 앉아 다리를 벌린 채 발바닥을 맞대고 서로 양손을 잡는다. 4) 한 사람이 뒤로 당겨주면 상대방은 상체를 앞으로 숙여 다리 안쪽을 늘려주며 번갈아 실시한다.</p>
