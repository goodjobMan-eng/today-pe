<h1>서바이버</h1>
<p>1) 1팀과 2팀으로 팀을 나누고 각 팀에서 4명을 뽑아 훌라후프 밖에 서게 한다.2) 훌라후프 앞에는 보호해야 할 볼링핀을 하나씩 세워둔다.3) 상대 팀은 공을 굴리거나 언더핸드로 던져 상대의 볼링핀을 쓰러뜨려야 하며 오버핸드 투구는 인정되지 않는다.4) 자신의 핀이 쓰러지면 핀을 주워 대기 줄의 첫 번째 사람에게 전달하고 훌라후프 위치를 교대한 뒤 자신은 줄 끝으로 이동한다.</p>
