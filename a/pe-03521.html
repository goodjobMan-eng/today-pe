<h1>공과 함께 구르기</h1>
<p>1) 반 전체를 두 모둠으로 나눈 뒤 모둠별로 구르는 순서를 정한다. 2) 출발 신호와 함께 출발선에서 첫 번째 모둠원이 공을 안고 굴러서 반환점을 돌아온다. 3) 다음 순서 모둠원에게 공을 던지지 않고 양손으로 건네준다. 4) 마지막 모둠원이 가장 먼저 출발선으로 돌아온 모둠이 이긴다.</p>
