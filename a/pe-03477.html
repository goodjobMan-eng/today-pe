<h1>농구형 게임의 기본 기능</h1>
<p>1) 한 발을 앞으로 내딛고 팔을 앞으로 쭉 뻗으며 손목의 힘으로 공을 패스합니다. 2) 패스를 받을 때 양손을 뻗고 손가락을 자연스럽게 벌려 공을 가슴 쪽으로 끌어당기며 받습니다. 3) 수비가 막고 있을 때는 발 옆으로 공을 튀기는 바운드 패스를 하거나 양손으로 좌우로 공을 튀기며 드리블합니다. 4) 손가락과 손바닥 윗부분으로 공을 잡고 무릎을 굽혔다 펴며 골대를 향해 포물선을 그리듯 슛합니다.</p>
