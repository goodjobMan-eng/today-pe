<h1>계란판 핑퐁 틱택토 삼목 놀이</h1>
<p>1) 책상 중앙에 30구 계란판을 놓고 양 팀 선수(개인 또는 모둠)가 서로 다른 색상의 탁구공을 준비한다. 2) 가위바위보로 선공을 정한 뒤 책상에 공을 1회 이상 바운드시켜 계란판 구멍 안으로 튕겨 넣는다. 3) 가로, 세로, 대각선 중 어느 한 방향으로 자신의 공 3개를 먼저 일렬로 연결(삼목 완성)하면 승리한다. 4) 공이 빗나가면 즉시 회수하며 책상 간격을 벌려 투척 거리를 늘리는 방식으로 난이도를 변형할 수 있다.</p>
