<h1>농구 다이아몬드 패스 드릴</h1>
<p>1) 콘 5개를 이용해 다이아몬드 모양과 중앙 위치를 만든다. 2) 네 개의 코너 뒤에 플레이어들이 줄을 선다. 3) 신호에 맞춰 각 줄의 첫 번째 플레이어가 중앙 콘로 드리블하며 간다. 4) 중앙에서 점프 스톱을 하고 오른쪽으로 피벗한 뒤, 해당 코너의 플레이어에게 패스하고 그 줄의 끝으로 간다.</p>
