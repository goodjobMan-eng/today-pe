<h1>기초 매트 운동과 신체 지지력을 키우는 5가지 곰 걸음</h1>
<p>1) 양손과 양발을 바닥에 대고 엉덩이를 높이 든 채 앞으로 걷고, 같은 자세에서 몸을 틀어 좌우 옆 방향으로 게걸음처럼 이동합니다. 2) 다리 사이로 뒤쪽 진행 방향을 바라보며 턱을 당긴 채 뒤로 걷습니다. 3) 제자리에서 원을 그리며 회전 곰 걸음을 수행해 회전 감각을 익힙니다. 4) 한쪽 다리를 공중에 들고 세 발로 지탱하며 전진해 물구나무서기 기초 지지력을 기릅니다.</p>
