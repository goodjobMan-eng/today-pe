<h1>반원 농구 (득점 위치 찾기 농구형 게임)</h1>
<p>1) 공격 5명, 수비 3명으로 모둠을 구성하고 한쪽에 농구 골대와 반원 영역을 설치합니다. 2) 반원 안에는 공격수와 수비수 1명씩만 들어가고, 나머지 인원은 반원 밖에서 패스나 드리블로 공을 이어줍니다. 3) 반원 안에서 골을 넣으면 2점, 반원 밖에서 골을 넣으면 1점을 얻으며 10점을 먼저 얻은 모둠이 이깁니다.</p>
