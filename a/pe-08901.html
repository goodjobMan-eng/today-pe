<h1>초등 체육 킨볼 게임 방법</h1>
<p>1) 총 3팀이 참여하며 1팀당 4명 이상으로 구성하여 진행한다. 2) 공격 팀은 3명이 공을 받치고 1명이 공을 쳐서 수비 팀이 못 받는 곳으로 보낸다. 3) 공을 치기 전에 공격할 팀을 크게 외친 후 공격하고 13점을 먼저 얻는 팀이 승리한다.</p>
