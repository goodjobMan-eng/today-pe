<p>1) 번호 뽑기 등으로 두 명씩 짝을 정하고 서로 손을 잡은 채 축구 경기를 진행한다. 2) 손을 잡기 불편한 경우 짧은 바통이나 손수건의 양 끝을 나누어 잡고 참여할 수 있다. 3) 경기 중 손이 떨어지면 즉시 경기장 가장자리로 나가 1부터 50까지 숫자를 센 후 다시 복귀한다.</p>
