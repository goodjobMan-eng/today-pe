<h1>우리 집 지키기</h1>
<p>1) 공격 모둠과 수비 모둠으로 나눈다. 2) 수비수는 경기장 안에 서고 각자 옆에 폼 볼링 핀을 세워 놓는다. 3) 공격수는 경기장 밖에서 안으로 공을 굴려 폼 볼링 핀을 쓰러뜨리고, 수비수는 손으로 공을 막고 공을 굴려 경기장 밖으로 내보낸다. 4) 역할을 바꾸어 다시 게임을 진행하고 정해진 시간 동안 삼각콘(볼링핀)을 가장 많이 지킨 모둠이 승리한다.</p>
