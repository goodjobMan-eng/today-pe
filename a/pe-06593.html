<h1>티자형 탁구대 경기</h1>
<p>1) 탁구대 한 대를 가로로 놓고 가운데 쪽에 탁구대 상판 한쪽을 연결하여 T자형 탁구대를 만들고 네트를 설치한다. 2) 총 세 명이 2대 1로 마주 서며, 두 명이 함께하는 팀은 파트너와 공을 치는 순서를 상의한다. 3) 가위바위보로 서브권을 정한 뒤 이긴 사람의 서브로 시작하여 듀스 없이 11점을 먼저 획득한 팀이 승리한다.</p>
