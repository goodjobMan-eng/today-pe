<h1>산 넘기 앞구르기</h1>
<p>1) 보조자가 바닥에 엎드려 둥근 산 모양을 만든다. 2) 아이는 보조자의 등 위에 등, 다리, 엉덩이를 차례로 맞대어 기대며 눕는 동작을 익힌다. 3) 보조자의 몸을 가로질러 옆으로 넘어가며 균형을 잡는다. 4) 보조자 너머 매트에 양손을 짚고 배꼽을 보며 무릎과 머리가 부딪히지 않게 앞으로 구른다.</p>
