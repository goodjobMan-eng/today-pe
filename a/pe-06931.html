<h1>평균대 위에서 앞구르기</h1>
<p>1) 평균대에 올라가기 전에 먼저 바닥에 선을 긋고 선을 따라 똑바로 앞구르기하는 연습을 충분히 한다. 2) 평균대 위에서 두 팔을 위로 쭉 뻗었다가 쪼그려 앉으며 한 발은 평균대에 평평하게 딛고 다른 발은 발끝으로 세운다. 3) 앞쪽으로 손을 뻗으며 머리를 몸 쪽으로 깊숙이 집어넣고 앞구르기를 한다. 4) 구르기가 끝나면 다시 안정된 쪼그려 앉기 착지 자세로 올라와 마무리한다.</p>
