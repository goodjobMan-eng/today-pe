<h1>손짚고 옆돌기 연습</h1>
<p>1) 벽이나 매트 앞에서 한 발을 내밀고 손을 짚으며 발을 세게 차올려 물구나무서기를 연습한다. 2) 발을 차올릴 때 처음에는 낮게 차다가 점차 높게 차올리는 동작을 반복한다. 3) 오른손잡이 기준 왼발을 앞으로 내딛고 왼손, 오른손, 오른발, 왼발 순서로 스텝을 밟으며 돈다. 4) 왼손잡이는 오른발을 내딛고 오른손, 왼손, 왼발, 오른발 순서로 바닥을 짚으며 돌아 착지한다.</p>
