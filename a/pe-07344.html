<h1>좀비볼 (3개 공 피구 놀이)</h1>
<p>1) 벤치와 농구 코트 선 안쪽 경기장 바닥에 놓인 3개의 빨간 공을 사용해 서로를 맞힌다. 2) 공을 잡은 사람은 최대 2걸음까지만 걸을 수 있고 그 후에는 공을 던져야 한다. 3) 공에 맞은 사람은 흰색 선 뒤로 나가서 팔벌려뛰기(점핑잭) 5회를 실시한 후 경기장 안으로 돌아와 계속 참여한다. 4) 자신에게 날아온 공을 노바운드로 잡으면 아웃되지 않고 바로 경기를 이어간다.</p>
