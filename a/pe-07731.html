<h1>제기 피구 놀이</h1>
<p>1) 양쪽 선 밖의 공격수가 제기를 던져 선 안의 수비수를 맞힌다. 2) 수비수는 제기를 피하거나 공중에서 잡을 수 있으며, 공격수가 공중으로 던진 제기를 수비수가 한 번에 잡으면 '정지(스톱)'를 외친 뒤 공격수가 세 발자국 이내로 다가와 수비수를 맞힐 기회를 얻는다. 3) 수비수가 밖으로 던진 제기를 공격수가 한 번에 잡으면 던진 수비수는 아웃된다.</p>
