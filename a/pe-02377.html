<h1>저글링 양손 번갈아 직상띄우기 도전</h1>
<p>1) 양손에 공을 하나씩 쥐고 어깨선 위치에 둔다. 2) 주로 사용하는 손으로 직상으로 띄워 받은 다음 반대 손으로 직상으로 띄워 받는다. 3) 익숙해지면 어깨선 안쪽과 바깥쪽에서 번갈아 던지며 정점에서 시선을 다음 공으로 옮겨 받음과 동시에 던진다. 4) 1분마다 1라운드씩 어깨선, 안쪽, 바깥쪽 순서로 총 8라운드를 수행한다.</p>
