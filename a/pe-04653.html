<h1>긴줄 넘기 릴레이</h1>
<p>1) 긴 줄을 돌리는 동안 줄례를 정해 순서대로 들어와 지정된 횟수만큼 넘는다. 2) 지정된 횟수(5회, 3회, 1회)를 다 채우면 줄 밖으로 빠져나간다. 3) 줄에 걸리면 다른 사람으로 교체하여 진행한다. 4) 성공하면 횟수를 줄여가며 단계별로 도전한다.</p>
