<h1>가정형 신체활동 4종 프로그램</h1>
<p>1) 상체를 숙여 양손으로 발목을 잡은 뒤 한쪽 팔을 위로 뻗어 몸통을 돌려 스트레칭한다. 2) 공을 이동하는 방향으로 높게 던지고 받고 발을 바꾸며 이동한다. 3) 빈백을 높게 던지고 받으며 한 발로 균형을 잡는다. 4) 좌우 대각선으로 사이드스텝하며 발앞꿈치로 가볍게 점프 스텝하여 이동한다.</p>
