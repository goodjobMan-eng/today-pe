<h1>풀누들 타깃 투척 및 누들 하키</h1>
<p>1) 학생들은 1인당 1개씩 펀스틱(풀누들)을 들고 체육관 벽면을 향해 선다. 2) 창던지기 자세로 펀스틱을 오버핸드로 벽 표적을 향해 정확히 던져 맞힌다. 3) 2인 1조로 펀스틱 위로 폼볼을 굴리거나 띄워 주고받으며 협동 미션을 수행한다. 4) 펀스틱을 반으로 접어 양손으로 잡고 폼볼을 벽 골대로 쳐 넣는 누들 하키 팀 경기로 발전시킨다.</p>
