<h1>버티기와 굽히기 체력 운동</h1>
<p>1) 양발을 어깨너비로 벌리고 양팔을 앞으로 뻗은 뒤 허리를 펴고 무릎을 90도 굽혔다 일어선다. 2) 엎드린 상태에서 팔꿈치를 매트에 대어 삼각형을 만들고 발끝과 팔로 몸을 지탱하며 버틴다. 3) 매트 위에 누워 상체와 팔다리를 들고 지면과 40~60도를 유지하며 버틴다.</p>
