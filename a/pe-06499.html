<h1>좀비 축구</h1>
<p>1) 수비하는 어린이들은 마스크를 올려 눈을 가리고 좀비가 된다. 2) 공격수는 공을 몰고 드리블하여 좀비를 피해 페널티 에어리어 근처로 이동한다. 3) 교사가 '눈 떠'라고 외치면 공격수와 골키퍼가 일대일 상황에서 슈팅을 시도한다. 4) 좀비가 공격수나 공을 터치하면 공격수는 아웃된다. 5) 5명씩 공격 후 공수를 교대한다.</p>
