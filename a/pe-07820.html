<h1>고양이 꼬리 뺏기</h1>
<p>1) 학생 전원에게 손수건이나 조끼를 꼬리로 나누어 착용하게 합니다. 2) 자신의 꼬리를 지키면서 다른 참가자의 꼬리를 최대한 많이 빼앗습니다. 3) 꼬리를 빼앗긴 학생도 경기장 밖으로 탈락하지 않고 계속해서 다른 사람의 꼬리를 뺏을 수 있습니다. 4) 경기장 내 모든 꼬리가 뽑히면 라운드가 종료되고 가장 많은 꼬리를 모은 사람이 승리합니다.</p>
