<h1>짐볼을 활용한 핸들링 축구</h1>
<p>1) 강당 양쪽에 뜀틀/스텝박스와 밴드로 골대를 만들고 짐볼을 경기 공으로 사용한다. 2) 공을 뒤로 굴려주고 인사를 한 뒤 경기를 시작한다. 3) 공을 잡고 이동하거나 소유하는 시간은 1인당 최대 5초(드리블 3초/패스 2초)로 제한된다. 4) 발로 차거나 공을 위로 띄우지 않고 오직 손(핸들링)으로만 굴리거나 패스하여 상대 골대에 넣어 득점한다.</p>
