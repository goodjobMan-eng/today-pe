<h1>포 코너 볼링</h1>
<p>1) 강당을 원마커로 4개의 구역으로 나누고 각 구역 코너에 볼링핀 10개씩을 세운다. 2) 각 구역에 5~6명씩 팀을 배치하고, 자기 구역 안에서 공을 굴려 다른 팀의 핀을 쓰러뜨린다. 3) 핀을 쓰러뜨리면 해당 팀 구역으로 가 쓰러진 핀을 가져와 자기 팀 코너 선 위에 배치한다. 4) 상대 팀의 굴러오는 공을 손이나 발로 트래핑하여 방어할 수 있다.</p>
