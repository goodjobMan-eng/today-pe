<h1>4학년 균형잡고 이동 1차시(활동1)</h1>
<p>1) 직선 장애물에서는 시선을 멀리 두고 걷는다.2) 퐁당퐁당 장애물이나 꺾여 있는 구간에서는 발끝을 바라보며 건넌다.3) 앞사람이 장애물에 도달하면 뒷사람이 출발하며 총 2회 반복한다.4) 평균대 등 응용 장애물에서도 침착하게 시선을 조절하며 이동한다.</p>
