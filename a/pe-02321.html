<h1>훌라후프 돌리기 기본 동작</h1>
<p>1) 훌라후프를 양손으로 잡고 허리 높이로 올린다. 2) 다리는 10cm 정도 벌리고 서고 한쪽 발을 앞으로 내밀어 균형을 잡는다. 3) 훌라후프를 몸통 한쪽에 걸친 후 손에 힘을 주어 돌림과 동시에 허리와 엉덩이도 원을 그리며 함께 돌린다. 4) 오른쪽으로 돌릴 때는 오른발이 앞에 오게 왼쪽으로 돌릴 때는 왼발이 앞에 오도록 하며 양방향으로 번갈아 돌리거나 편한 방향으로 돌린다.</p>
