<h1>나무 막대 잡기 놀이</h1>
<p>1) 긴 나무막대를 하나씩 잡고 둥글게 모여 섭니다. 2) 한 사람이 '하나, 둘, 셋' 하고 신호를 주면 잡고 있던 나무막대를 놓고 재빨리 앞으로 이동하여 앞사람의 나무막대를 잡습니다. 3) 나무막대를 쓰러뜨리지 않고 잡은 사람은 놀이를 이어나갑니다. 4) 두 명이 남으면 가위바위보로 승부를 가릅니다.</p>
