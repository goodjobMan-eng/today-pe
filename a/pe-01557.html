<h1>철봉 무릎 안아 뒤로 돌기 (기초 도전 챌린지)</h1>
<p>1) 철봉 앞에 서서 어깨너비로 철봉을 위에서 쥔 후 팔을 펴서 지지 자세를 만든다. 2) 허벅지를 철봉 쪽으로 당겨 몸을 둥글게 말고 뒤쪽으로 체중을 실어 회전한다. 3) 회전 모멘텀을 이용해 철봉 주위를 한 바퀴 돌아 제자리 지지 자세 또는 착지로 연결한다. 4) 익숙해지면 반동을 최소화하거나 연속 회전으로 난이도를 높여 도전한다.</p>
