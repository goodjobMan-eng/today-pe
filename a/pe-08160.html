<h1>미들 볼 배구 게임</h1>
<p>1) 4~5명씩 모둠을 만들고 코트에 네트를 설치한다. 2) 공을 언더핸드 패스(범프)로만 쳐서 넘긴다. 3) 공은 치기 전에 반드시 바닥에 한 번 튀겨야(바운드) 한다. 4) 팀 내에서 원하는 만큼 여러 번 패스할 수 있다. 5) 넷트 없이 원 형태로 둘러서서 바운드 후 범프로 공을 이어받는 방식으로도 연습한다.</p>
