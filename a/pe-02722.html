<h1>공 차기 기본 활동 및 골대 도전</h1>
<p>1) 공에 빠른 속도로 접근한다. 2) 공을 차기 앞서 순간적인 넓은 보폭으로 차지 않는 발(디딤발)을 공의 바로 옆이나 뒤에 위치시킨다. 3) 주로 사용하는 발의 안쪽이나 발등으로 공을 찬다. 4) 짝과 정확하게 패스하는 활동을 연습하거나 콘으로 만든 골대를 향해 공을 찬 후 성공 여부를 확인한다.</p>
