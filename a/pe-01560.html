<h1>단계별 줄넘기 도약 놀이</h1>
<p>1) 양 무릎을 붙이고 앞꿈치로 뛰는 캥거루 점프와 거미줄 줄넘기 장애물 넘기를 연습한다. 2) 바닥에 놓인 줄의 움직임을 눈으로 확인하며 타이밍에 맞춰 양발 모아 제자리 뛰기를 익힌다. 3) 긴 줄을 파도처럼 흔들어 넘는 파도타기 놀이와 줄 돌리기 타이밍에 맞춰 뛰어넘기를 성공한다. 4) 줄을 몸 옆과 머리 위로 돌리는 감각을 익힌 뒤 개인 줄넘기 연속 5~10회 및 뒤로 돌리기, 엇걸어뛰기(아야튐)에 도전한다.</p>
