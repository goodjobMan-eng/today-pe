<h1>양말 플릭 접시 캐치 챌린지</h1>
<p>1) 말아 쥔 양말공을 바닥에 두고 일회용 종이접시(또는 바구니)를 한 손에 든 채 준비한다. 2) 바닥의 양말공을 두 발 모아 스키 점프로 뛰어넘는다. 3) 발만을 이용해 양말공을 한쪽 발등 위에 올린 뒤, 발끝을 튕겨 올려 들고 있는 접시로 공중 캐치하면 1점을 얻는다. 4) 1분 동안 제한 시간 내에 양말공을 다시 바닥에 내려놓고 반복하며, 익숙해지면 발을 번갈아 가며 도전한다.</p>
