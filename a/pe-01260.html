<h1>빨대 호흡 애벌레 달리기</h1>
<p>1) 색종이를 접어 주름진 종이 애벌레를 만들고 책상 위에 출발선과 도착선을 정한다. 2) 신호가 울리면 빨대를 물고 애벌레의 꼬리나 주름 부분을 입바람으로 불어 전진시킨다. 3) 도착선에 애벌레가 완전히 도달할 때까지 걸린 시간을 측정하거나 친구와 동시에 출발해 먼저 통과하면 점수를 얻는다. 4) 책상 위 코스에 굴곡을 주거나 반환점을 돌아오는 릴레이 방식으로 변형할 수 있다.</p>
