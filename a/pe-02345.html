<h1>스포츠스태킹 3스택 릴레이</h1>
<p>1) 3스택 컵을 3m 간격으로 3세트 바닥에 배치한다. 2) 출발선에서 시작 신호가 울리면 반환점까지 달려가며 3세트의 3스택을 차례대로 업스택한다. 3) 반환점을 돌아 출발선으로 돌아오면서 3세트의 3스택을 차례대로 다운스택한다. 4) 출발점에 먼저 도착하거나 다음 주자에게 터치하여 먼저 모든 주자가 완주한 팀이 승리한다.</p>
