<h1>챌린지 타프 접고 돌리기</h1>
<p>1) 최대 10명의 학생들이 펼쳐진 방수포(타프) 위에 올라서서 자리를 잡는다. 2) 학생들은 방수포 바깥으로 발이 벗어나거나 떨어지지 않도록 유지한다. 3) 방수포 위에서 뛰어오르며 학생 전원이 발을 떼지 않고 방수포를 반으로 접는 동작을 반복한다. 4) 반으로 접었던 방수포를 다시 원래 크기로 완전히 펼치거나, 방수포에 붙은 스티커 위치를 돌려 바꾸는 과제를 완수한다.</p>
