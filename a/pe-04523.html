<h1>테니스 라켓 볼 핸들링 챌린지</h1>
<p>1) 한 손으로 라켓을 잡고 콩주머니를 높이 던져 라켓 면으로 부드럽게 받는다(익숙해지면 팬케이크 뒤집듯 라켓 위에서 뒤집어 받기). 2) 공을 바닥에 바운스한 뒤 라켓으로 쳐올리고 다시 바운스시켜 연속으로 친다. 3) 달걀을 숟가락에 얹듯 라켓 중앙에 공을 올려놓고 떨어뜨리지 않고 선을 따라 걷는다. 4) 라켓으로 공을 바닥으로 연속해서 튕긴다(손 바꿔서도 진행).</p>
