<h1>징검다리 게임</h1>
<p>1) 두 팀으로 나누고 모든 학생에게 솜털공을 하나씩 나눠준 뒤 양끝 출발선 밖에 일렬로 줄을 선다 2) 출발 신호와 함께 솜털공을 비어있는 원마커를 향해 던진다 3) 솜털공을 원마커 위에 올리면 그 원마커로 이동한다 4) 같은 원마커에 여러 명이 동시에 공을 올리면 가위바위보를 하여 이긴 사람이 올라가고 진 사람은 자기 자리로 돌아가 다시 도전한다</p>
