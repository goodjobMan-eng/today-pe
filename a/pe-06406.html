<h1>서머 슬라임 스톰프 브레인 브레이크</h1>
<p>1) 화면 트랙을 따라 내려오는 캐릭터 버튼을 주시한다.2) 빨간색 버튼이 플레이 존에 오면 왼발 구르기나 뜀뛰기를 하고, 노란색은 오른발 구르기나 뜀뛰기를 한다.3) 빨간색과 노란색이 함께 나오면 점프, 파란색은 박수, 보라색은 허벅지 치기 동작을 수행한다.4) 중간 미니 게임에서는 지정된 자세를 유지하며 양쪽 그림의 서로 다른 점 3곳을 찾는다.</p>
