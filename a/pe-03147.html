<h1>공 이어 주기 게임</h1>
<p>1) 네 명씩 두 모둠이 되어 공을 가질 모둠을 정하고 서로의 위치에 선다. 2) 공을 가진 모둠은 다양한 방법으로 공차기와 멈추기를 하여 득점 구역에 있는 모둠 친구에게 공을 이어준다. 3) 득점 구역 안에 있는 친구가 공을 받아 멈추면 1점을 획득한다. 4) 상대 모둠이 공을 경기장 밖으로 내보내거나 공을 가로채면 상대 모둠으로 공이 넘어가며, 정해진 시간 동안 획득한 점수가 가장 많은 모둠이 승리한다.</p>
