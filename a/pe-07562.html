<h1>플라잉 디스크 던지고 받기 게임</h1>
<p>1) 출발선 앞에 원마커를 가능한 만큼 배치하고 모둠별로 순서를 정해 한 줄로 선다. 2) 1번 학생이 원하는 원마커에 올라가고 2번 학생이 1번 학생에게 플라잉 디스크를 던진다. 3) 원마커 위에서 디스크를 받으면 마커와 디스크를 가져오고 실패하면 디스크만 가져오며, 제한 시간 후 마커를 가장 많이 차지한 모둠이 이긴다.</p>
