<h1>나 혼자 산다 피구</h1>
<p>1) 3명이 가위바위보를 하여 혼자 이기거나 진 1명이 살아 돌아와야 하는 역할을 맡는다.2) 1명은 반대편에 있는 소프트 폼볼을 가져와 원마커 사이 공간을 통과해 출발점으로 돌아온다.3) 나머지 2명은 소프트 피구공 2개를 들고 원마커 사이로 달리는 1명을 공으로 맞힌다.4) 공을 맞히면 수비 2명이 1점을 획득하고, 맞지 않고 무사히 통과하면 달린 학생이 점수를 얻는다.</p>
