<h1>경사판을 활용한 철봉 다리걸어 오르기(역회전 오르기) 연습</h1>
<p>1) 철봉에 비스듬히 판(발판)을 세워 회전을 돕는 경사면을 만든다.2) 철봉을 잡고 판을 달려 올라가듯 발을 힘껏 차올린다.3) 배가 철봉 위에 얹어지고 몸이 뒤로 회전하면 착지한다.4) 익숙해지면 경사 각도를 점차 줄여가며 연습한다.</p>
