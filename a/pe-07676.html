<h1>축구 팩맨 게임</h1>
<p>1) 모든 학생은 각자 축구공을 드리블하며 경기장 안을 움직인다. 2) 술래는 공 없이 경기장 중앙 주변을 걸어 다닌다. 3) 신호가 울리면 학생들은 발 안쪽(인사이드)으로 공을 패스하여 술래를 맞힌다. 4) 한 번 맞힌 뒤에는 더 먼 거리에서 패스하거나 왼발 전용 규칙 등을 적용해 시도한다.</p>
