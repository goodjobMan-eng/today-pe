<h1>고관절 유연성 7종 운동</h1>
<p>1) 짝과 마주 보거나 교실 바닥 공간에 안전거리를 두고 준비 자세를 취합니다. 2) 악어 걸음, 스파이더맨 워킹, 펭귄 발 얹고 걷기, 통나무 넘기 등 제시된 동물 동작에 맞춰 고관절을 크게 가동합니다. 3) 터널 가위바위보에서 진 사람은 다리를 한 뼘씩 넓혀가며 버티고, 곰 걸음 릴레이로 자세를 유지합니다. 4) 공 밟고 굴리기나 좌우 교대 등 난이도와 속도를 조절하며 단계별로 변형하여 실천합니다.</p>
