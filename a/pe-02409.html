<h1>골인 탁구공 교실놀이</h1>
<p>1) 팀당 탁구공 20개를 준비하고, 한 명은 바구니를 들고 반대편에 선다. 2) 던지는 사람은 탁구공을 바닥에 튕겨서 바구니를 든 친구에게 보낸다. 3) 바구니에 공을 골인시킨 사람은 바구니를 들고 있던 친구와 자리를 교대한다. 4) 골인시키지 못하면 공을 주워 맨 뒷줄에 서며, 가장 먼저 모든 공을 바구니에 넣는 팀이 승리한다.</p>
