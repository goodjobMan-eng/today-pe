<h1>공보다 빠르게 변형 발야구</h1>
<p>1) 공격수가 공을 발로 강하게 찬 뒤 바깥쪽 베이스를 차례로 돌아 홈으로 달린다.2) 수비팀은 찬 공을 잡아 원형 또는 지정된 안쪽 베이스 구역을 차례로 돌려 홈으로 송구한다.3) 주자가 수비의 공 전달보다 먼저 홈에 도착하면 득점하고, 공이 먼저 도달하면 아웃된다.</p>
