<h1>정식 스포츠 피구 경기와 역할 실습</h1>
<p>1) 양 팀이 코트에 정렬해 용모 검사와 인사를 마친 뒤 점프볼로 경기를 시작한다. 2) 공격 팀은 패스 제한(더블 패스, 포패스 금지)을 지키며 상대 선수를 공으로 맞히고, 얼굴이나 머리를 맞히지 않도록 주의한다. 3) 공에 맞은 수비 선수는 외야로 나가고, 노바운드로 공을 잡으면 세이브가 된다. 4) 주심, 부심, 선심, 기록원, 감독 역할을 맡아 수신호와 파울 판정 및 기록지를 작성하며 세트 경기를 진행한다.</p>
