<h1>동물 동작 따라하기 게임쇼 워크아웃</h1>
<p>1) 1번부터 15번까지의 번호 상자 중 하나를 선택하여 미션을 엽니다. 2) 상자 속 동물이 공개되면 20초 동안 해당 동물의 움직임을 흉내 내며 신체 활동을 합니다. 3) 펭귄 걸음, 게걸음, 개구리 점프, 오리걸음 등 제시된 전신 모방 동작을 정확하게 수행합니다. 4) 퀴즈 상자가 열리면 문제의 정답에 해당하는 신체 스트레칭이나 근력 동작을 선택하여 운동합니다.</p>
