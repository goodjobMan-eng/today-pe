<h1>홈 트레이닝 4종 서킷 운동</h1>
<p>1) 사이드 런지: 한쪽 다리를 옆으로 뻗으면서 상체를 낮춰 공으로 발을 터치한다. 2) 크로스 스쿼트: 스쿼트 실시 후 측면으로 팔을 올려 상체를 늘려준다. 3) 무릎 접어 위로 올리기: 양팔을 내리며 좌우 번갈아 무릎을 허리 높이까지 위로 차올린다. 4) 양발로 홉핑: 한쪽 발 이동 후 다른 발이 따라가며 발꿈치로 가볍게 걷는다.</p>
