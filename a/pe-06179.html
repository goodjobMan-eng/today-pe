<h1>콩주머니 옮기기 협동 달리기</h1>
<p>1) 모둠원 전체가 일렬로 손을 잡고 늘어서며, 양쪽 끝 바닥에 후프를 놓고 한쪽 후프에 콩주머니들을 담아 둔다.2) 신호가 울리면 손을 놓지 않은 채로 이동하여 반대편 후프 안으로 콩주머니를 던지지 않고 하나씩 사뿐히 옮겨 넣는다.3) 주어진 콩주머니를 모두 옮긴 후 팀원 전체가 바닥에 먼저 앉는 팀이 승리한다.</p>
