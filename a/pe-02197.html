<h1>가위바위보 선생님 따라하기 놀이</h1>
<p>1) 자리에 앉아 몸을 가볍게 풀고 준비한다. 2) 신호에 맞춰 선생님과 동시에 가위바위보를 한다. 3) 선생님에게 비기거나 진 학생은 화면 속 관짝춤 등 선생님의 몸짓 동작을 최대한 똑같이 따라 춘다. 4) 선생님을 이긴 학생은 동작을 따라 하지 않고 쉰다.</p>
