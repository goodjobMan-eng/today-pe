<h1>주먹야구 기본 기능 익히기</h1>
<p>1) 양말을 돌돌 말아 손에 쥐기 알맞은 크기의 공을 만든다. 2) 벽을 향해 공을 던져 바운드된 공을 가슴 높이에서 안정적으로 포구하는 연습을 한다. 3) 몸과 골반을 회전시키며 목표 지점을 향해 정확하게 송구하는 연습을 한다. 4) 한 손으로 공을 살짝 띄운 후 반대쪽 주먹 안쪽 면으로 강하게 쳐서 목표 지점을 맞추는 연습을 한다.</p>
