<h1>포스트잇을 활용한 스텝 순발력 트레이닝 3종</h1>
<p>1) 바닥에 포스트잇을 일정한 간격으로 나란히 붙여 놓는다. 2) 싱글 레그 인앤아웃: 옆으로 빠르게 달리며 한 발씩 포스트잇 사이 공간을 밟고 지나간다. 3) 투 포워드 원 백: 앞으로 두 칸 건너뛰었다가 한 칸 뒤로 물러나는 스텝을 반복하며 전진한다. 4) 투 풋 홉: 양발을 모아 좌우로 지그재그 방향을 바꾸며 포스트잇 사이를 뛰어넘는다.</p>
