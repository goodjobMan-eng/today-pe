<h1>히라도레스 (콘 뒤집기 게임)</h1>
<p>1) 경기장 전체에 콘을 흩어 놓고 학급을 두 팀(초록팀, 빨강팀)으로 나눈다. 2) 시작 신호가 울리면 한 팀은 콘을 뒤집어 엎어놓고, 다른 팀은 콘을 원래대로 바로 세운다. 3) 정해진 시간 동안 이동하며 콘을 뒤집거나 바로 세운다.</p>
