<h1>마마무 데칼코마니 포인트 안무 발표회</h1>
<p>1) 4명이 한 모둠을 이루어 무대 중앙에서 마주 보거나 나란히 서서 준비 자세를 취한다. 2) 마마무의 '데칼코마니' 음악에 맞추어 서로 거울을 보듯 대칭되는 포인트 안무를 펼친다. 3) 가사의 흐름에 맞추어 마주 보기 대형에서 일자 대형으로 자연스럽게 대형을 전환하며 동작을 일치시킨다. 4) 후렴구 포인트 동작을 역동적으로 선보인 후 엔딩 포즈를 취하고 친구들의 박수를 받으며 마무리한다.</p>
