<h1>홈트레이닝 기초 준비체조 및 국민체조</h1>
<p>1) 제자리에서 팔벌려뛰기(점핑잭) 4박자 동작을 5회 연속 실시한다. 2) 발을 앞뒤로 교차하고 팔을 번갈아 뻗는 크로스잭 동작을 5회 반복한다. 3) 손뼉을 위아래로 치며 앞뒤 스텝을 밟는 몸 따로 마음 따로 체조와 아기 물개 체조를 순서대로 익힌다. 4) 전신 근육과 관절을 고루 풀어주는 국민체조 12가지 연결 동작을 음악과 구령에 맞춰 2회 완주한다.</p>
