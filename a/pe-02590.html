<h1>곰 연어 모기 게임</h1>
<p>1) 양 팀이 마주 보고 서서 줄로 안전지대를 표시한 후 낼 순서(곰, 연어, 모기)를 정합니다. 2) 진행자의 구호에 맞춰 양 팀이 정한 동물의 동작과 소리를 동시에 냅니다. 3) 가위바위보 상성에 따라 진 팀은 안전지대로 도망치고 이긴 팀은 상대를 쫓아가 터치합니다. 4) 터치된 사람은 상대 팀으로 넘어가며 한쪽 팀에 사람이 남지 않을 때까지 반복합니다.</p>
