<h1>범프 업 챌린지</h1>
<p>1) 패들과 풍선을 준비하고 패들을 평평하게 눕혀 잡는다.2) 패들로 풍선을 공중에 연속해서 치면서 횟수를 센다.3) 풍선이 바닥에 닿거나 정해진 검은 선 구역 밖으로 벗어나면 처음부터 다시 시작하여 50회 연속 치기에 도전한다.</p>
