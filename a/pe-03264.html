<h1>다양한 동작으로 뜀틀 내리기</h1>
<p>1) 뜀틀 위에 올라서서 착지 매트를 바라보고 준비 자세를 취한다. 2) 박수를 한 번 또는 두 번 치며 뜀틀 내리기를 시도한다. 3) 뛰어내리면서 몸을 뒤로 돌려 내리기를 시도한다. 4) 다리를 높이 들어 올렸다가 착지 매트에 안전하게 내린다.</p>
