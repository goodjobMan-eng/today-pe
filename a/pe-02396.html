<h1>고무밴드와 판자를 활용한 배구 언더패스 기초 연습</h1>
<p>1) 두 발에 탄력 고무밴드를 착용하고 어깨너비 보폭을 유지하며 자세를 낮춘다. 2) 날아오는 공을 한 발만 움직여 낙하 위치에 맞추며 양손으로 판자를 잡고 언더로 튕겨낸다. 3) 팔꿈치 사이에 작은 공을 끼워 팔을 곧게 편 상태를 유지하며 날아오는 공을 언더로 받아낸다. 4) 익숙해지면 팔꿈치에 끼웠던 공을 원바운드 후 바로 잡는 동작과 연결한다.</p>
