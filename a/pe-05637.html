<h1>책상 탁구</h1>
<p>1) 교실 책상 6개~8개를 길게 붙여 탁구대 경기장을 만든다.2) 가운데 네트 대신 책상이나 칸막이를 두고 팀을 나눈다.3) 탁구 라켓과 테이블볼(소프트볼)을 사용하여 상대 진영으로 공을 쳐 넘긴다.4) 바운드된 공을 번갈아 쳐 넘기며 득점을 겨룬다.</p>
