<h1>스컹크 태그</h1>
<p>1) 구석에 4개, 중앙에 1개의 훌라후프를 배치하고 중앙에 스컹크(술래) 2명이 들어간다. 2) 신호가 울리면 술래가 일반 학생들을 쫓아다니며 태그한다. 3) 태그된 학생은 중앙 홈으로 가 &quot;새로운 스컹크(new skunk)&quot;라고 외치고 새 술래가 되며 기존 술래는 일반 참가자가 된다. 4) 구석 훌라후프(안전지대)에는 한 명만 최대 10초간 머물 수 있고 다른 학생이 들어오면 기존 학생은 나가야 한다.</p>
