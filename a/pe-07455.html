<h1>파르타이발 (팀 패스 라인 터치 게임)</h1>
<p>1) 양 팀으로 나뉘어 경기장 끝에 콘이나 라인으로 득점 구역을 표시한다. 2) 팀원들끼리 패스를 이어가며 공을 가진 채로 이동하지 않고 상대편 라인 위에 공을 터치한다. 3) 공은 경기장 안쪽에서 라인 위로 직접 놓아야 득점으로 인정된다.</p>
