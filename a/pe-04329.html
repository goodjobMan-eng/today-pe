<h1>홈 얼론 태그</h1>
<p>1) 훌라후프 8개와 그 안에 라바콘 8개, 태그 스틱 8개를 배치한다. 2) 술래가 훌라후프 안의 라바콘(열쇠)을 가져가기 전에 태그 스틱으로 술래를 터치한다. 3) 술래가 되면 역할을 교대한다. 4) 동점 시 가위바위보로 승자를 정한다.</p>
