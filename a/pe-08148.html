<h1>스네이크 태그 (뱀 술래잡기)</h1>
<p>1) 참가자들은 앞사람의 허리나 어깨를 잡고 긴 일렬(뱀)로 줄을 선다. 2) 줄의 맨 앞에 선 사람이 술래가 된다. 3) 술래는 줄의 맨 뒤에 있는 사람을 잡으러 쫓아간다. 4) 뱀을 이루는 참가자들은 몸을 좌우로 흔들며 맨 뒷사람이 잡히지 않도록 보호한다.</p>
