<h1>실내 퍼팅 그린 골프 활동</h1>
<p>1) 각자 골프공 2개를 가지고 홀인원을 노리는 퍼팅 연습을 진행한다. 2) 공이 홀에 들어갈 때까지 스트로크 수를 세며, 해저드에 들어가면 공을 절반 지점으로 꺼내놓고 1벌타를 추가한다. 3) 퍼팅 그린에 굴곡(범프)을 만들어 장애물을 창의적으로 변형한다. 4) 자신이 변형한 그린을 옆 사람과 교환하여 다른 학생이 만든 코스에서 퍼팅을 진행한다.</p>
