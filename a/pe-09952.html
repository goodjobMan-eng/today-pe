<h1>천 주머니(스카프) 던져 맞히기 놀이</h1>
<p>1) 천 주머니를 목표물(쿠션, 의자, 바구니)을 향해 던져 올린다. 2) 발로 천 주머니를 차서 목표물에 맞힌다. 3) 다양한 신체 부위로 천 주머니를 던지고 받는다. 4) 네발로 기어 다니며 천 주머니를 밀어 골대에 넣는 게임을 한다.</p>
