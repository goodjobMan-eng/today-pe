<h1>허들 브레이커 미션</h1>
<p>1) 출발선 앞에 미니 허들 5개를 일정 간격으로 놓고 마지막에 곡갈콘을 세운다. 2) 첫 번째 시도에는 한 발 넘기 방식으로 미니 허들 5개를 넘고 곡갈콘을 터치한 뒤 출발선으로 돌아온다. 3) 두 번째 시도에는 양발 점프로 넘고 곡갈콘을 터치한 뒤 돌아온다. 4) 세 번째 시도에는 달리듯 자연스러운 리듬으로 넘고 돌아오며, 두 번의 기록 차이가 2초 이내이면 챌린지에 성공한다.</p>
