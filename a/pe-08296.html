<h1>높이뛰기 기초 착지 및 도약 연습</h1>
<p>1) 매트 옆 콘에서 출발하여 한 발로 발구르기를 하며 매트 위로 올라선다 2) 가위뛰기(Schersprung) 동작으로 다리를 차례대로 들어 올리며 매트 위에 착지한다 3) 높이뛰기 바를 설치하고 측면에서 도움닫기하여 바를 넘은 후 매트에 착지한다</p>
