<h1>수건으로 풍선·공 띄워 받기 놀이</h1>
<p>1) 두 사람이 마주 보고 수건의 양쪽 끝을 함께 잡습니다. 2) 수건 중앙에 풍선이나 가벼운 공을 올려놓고 구령에 맞춰 위로 높이 띄웁니다. 3) 공중에 뜬 풍선이나 공의 낙하 위치를 빠르게 파악하여 움직이고, 떨어지는 풍선이나 공을 수건으로 바닥에 닿지 않게 다시 받아 냅니다. 4) 익숙해지면 눈을 감았다 뜨거나 앉았다 일어서며 난이도를 높여 도전합니다.</p>
