<h1>타바타 러닝 피트니스 아일랜드</h1>
<p>1) 학급을 중앙 그룹과 외곽 조깅 그룹 두 팀으로 나눈다. 2) 화면이 초록색(운동 시간)으로 바뀌면 중앙 팀은 제자리에서 운동 동작을 따라 하고, 외곽 팀은 조깅을 한다. 3) 화면이 빨간색(휴식 시간)으로 바뀌면 외곽 팀은 걸으면서 숨을 고르고 중앙 팀도 휴식한다. 4) 조깅과 걷기 구간을 정해진 시간 동안 반복하며 진행한다.</p>
