<h1>다리 피구 (Brückenvölkerball)</h1>
<p>1) 경기장 중앙에 큰 매트 2장을 겹쳐놓고 뒤에 일반 매트를 연결해 다리 구역을 만든다. 2) 선수들은 다리 매트를 타고 상대 진영으로 건너가 공격할 수 있으나, 상대편 바닥을 밟거나 다리 위에서 공에 맞으면 아웃된다. 3) 공에 맞은 선수는 아웃된 순서대로 코트 밖 대기선에 서며, 같은 팀원이 농구 백보드를 공으로 맞히면 먼저 아웃된 순서대로 부활한다.</p>
