<h1>브리티시 불독 (황소 술래잡기)</h1>
<p>1) 체육관 한쪽 끝에 모든 러너(불독)가 서고, 중앙에 술래 1~2명을 배치한다. 2) 술래가 &quot;브리티시 불독!&quot;이라고 외치면 러너들은 반대편 안전 구역을 향해 일제히 달린다. 3) 중앙을 지나다 술래에게 태그된 러너는 다음 라운드부터 함께 잡는 술래가 된다. 4) 마지막 1명이 남을 때까지 반복하며, 끝까지 살아남은 학생이 다음 게임의 첫 술래가 된다.</p>
