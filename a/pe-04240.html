<h1>경찰과 악당 가위바위보</h1>
<p>1) 학생들에게 경찰과 악당 카드를 각각 절반씩 나누어 줍니다. 2) 타이머를 1분 30초로 설정하고 시작합니다. 3) 학생들은 자유롭게 돌아다니다 만나면 가위바위보를 합니다. 4) 진 학생은 오리걸음으로 이동하고, 이긴 학생은 서서 이동합니다. 5) 오리걸음 학생끼리, 서 있는 학생끼리 가위바위보를 하여 이기면 다시 일어설 수 있습니다. 6) 시간이 종료되었을 때 서 있는 학생이 많은 팀이 승리합니다.</p>
