<h1>노컨택 가위바위보 점프 릴레이</h1>
<p>1) 활동 공간의 양쪽 끝 라인에 학생들이 나뉘어 마주 보고 섭니다. 2) 중앙으로 이동해 마주친 친구와 비접촉으로 가위바위보를 진행합니다. 3) 가위바위보에서 이긴 학생은 반대편 라인까지 지정된 점프 스텝(주먹 점프, 찌 갤럽 점프, 빠 벌려 점프)으로 이동합니다. 4) 방의 네 모서리 구역으로 스테이션을 확장하여 다양한 친구들과 연속으로 대결하도록 변형합니다.</p>
