<h1>경례(Salute) 반응형 준비운동</h1>
<p>1) 교사는 훈련교관이 되고 학생들은 군인이 되어 한 줄로 정렬해 선다. 2) 교사가 부르는 구령(경례, 열중쉬어, 엎드려, 육군, 해군, 공군, 해병대 등)에 맞춰 지정된 동작을 신속하고 안전하게 수행한다. 3) 교사의 지시에 따라 제식 행진을 하며 기준선으로 복귀한다.</p>
