<h1>페이퍼 링 마스터 챌린지</h1>
<p>1) 출발선 앞에 종이를 4피트, 5피트, 6피트, 7피트 간격으로 놓는다. 2) 출발선을 넘어 종이 위로 물병을 던져 세운다. 3) 물병이 세워지면 출발선으로 돌아와 점핑잭 1회를 수행한다. 4) 종이 링을 던져 물병에 걸고 다음 거리의 종이로 이동하여 1분 안에 4곳을 모두 성공한다.</p>
