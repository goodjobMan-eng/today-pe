<h1>배드민턴 미니 게임 3종</h1>
<p>1) 네트 게임: 서비스 라인을 백라인으로 설정하고 스매시나 킬 없이 네트 바로 앞 헤어핀과 스핀 감각만 연습한다 2) 네트 없는 하프코트 게임: 코트 중앙선을 네트 삼아 서비스 라인과 사이드라인으로 둘러싸인 구역에서 셔틀콕을 최대한 낮게 유지하며 깊은 풋워크로 랠리를 이어간다 3) 하프코트 1회 리프트 게임: 하프코트에서 자유롭게 경기하되 각 선수는 한 랠리당 셔틀콕을 높이 띄우는 리프트를 단 1번만 사용할 수 있다.</p>
