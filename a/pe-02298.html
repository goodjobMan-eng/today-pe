<h1>킨볼 기초 경기 규칙과 서브 및 수비</h1>
<p>1) 세 팀(핑크, 그레이, 블랙) 각 4명씩 총 12명이 코트에서 함께 참여한다. 2) 공격(히팅) 시 반드시 4명의 팀원이 모두 공에 터치하고 있어야 하며 공을 살짝 상향 궤도로 쳐야 한다. 3) 2·3등 팀은 1등 팀만 호명하고, 1등 팀은 2등 팀을 호명하여 공격해야 한다. 4) 수비는 신체 모든 부위를 활용해 바닥에 닿기 전에 받아내며, 공을 터치한 후 10초 이내에 다시 공격한다.</p>
