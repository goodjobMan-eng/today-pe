<h1>중앙 통로 돌파 구역 피구</h1>
<p>1) 라바콘으로 체육관 중앙에 길게 통로 구역을 만들고 좌우를 4개 구역으로 나누어 팀별로 배치한다. 2) 각 구역의 팀원들은 상대 구역으로 피구공을 던져 공격을 주고받는다. 3) 공에 맞은 탈락자는 중앙 통로 구역으로 이동해 반대편 끝까지 공에 맞지 않고 통과해야 부활한다. 4) 통로를 뛰는 도중 공에 맞으면 통과할 때까지 왕복 달리기를 계속 시도하는 방식으로 진행한다.</p>
