<h1>초등 티니클링 (4/4박자 변형 댄스)</h1>
<p>1) 양쪽에서 두 명이 대나무 봉(폴)을 잡고 4/4박자(1-2-3-4)에 맞춰 봉을 바닥에 치고 모은다 2) 뛰는 사람은 발목이 봉 사이에 끼이지 않도록 박자를 세며 안팎으로 뛴다(jump in jump out) 3) 기본 스텝에 힙합 스텝 등 다양한 응용 스텝을 섞어 모둠원과 협동하며 춤을 춘다</p>
