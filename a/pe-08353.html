<h1>3골 사커</h1>
<p>1) 4~5명씩 팀을 나누고 각 팀 골키퍼 1명은 꼬깔콘 수비를, 나머지 공격수는 공을 드리블한다. 2) 공격수는 상대 골키퍼를 제치고 발로 공을 차서 세워진 꼬깔콘을 맞힌다. 3) 공이 꼬깔콘에 닿아 쓰러지면 1점을 획득하며 라운드 종료 후 골키퍼에게 득점을 보고한다.</p>
