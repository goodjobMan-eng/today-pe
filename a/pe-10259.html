<h1>30 to Win</h1>
<p>1) 체육관 양쪽에 훌라후프를 모아 진지를 만들고 럭비공이나 피구공을 주고받아 훌라후프를 모읍니다. 2) 상대 진영으로 이동하다가 태그를 당하거나 공을 잡히면 감옥(콘 안쪽)으로 갑니다. 3) 감옥에 있는 팀원은 같은 팀원이 태그하러 와서 구출해주면 안전하게 돌아올 수 있습니다.</p>
