<h1>런 &amp; 스로우</h1>
<p>1) 2개 팀으로 나누어 옆으로 1렬로 나란히 선다. 2) 각 팀 동일한 수의 공을 코트 한쪽에 흩뿌려 놓는다. 3) 시작 신호에 맞춰 일제히 공을 가지러 달려가 코트 반대 방향으로 힘껏 던진다. 4) 처음에 나란히 섰던 라인보다 앞으로 나가서 공을 던질 수는 없으며 1회에 던질 수 있는 공은 1개로 하고 모든 공을 먼저 다 던진 팀이 이긴다.</p>
