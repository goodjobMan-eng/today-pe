<h1>농구 벽면 연습 드릴 20선</h1>
<p>1) 체육관 벽면을 마주보고 서서 각 활동당 30초 또는 10~30회 반복 횟수를 정한다 2) 벽을 향해 바운드 패스, 드리블 후 패스 등 다양한 패스 및 드리블 동작을 연습한다 3) 머리 뒤로 던져 벽 맞히고 잡기, 360도 회전 후 잡기 등 점진적으로 난이도가 높은 동작을 수행한다 4) 짝 없이도 혼자 벽면을 활용하여 오른손과 왼손을 번갈아 가며 고르게 연습한다</p>
