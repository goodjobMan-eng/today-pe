<h1>교실 숨바꼭질</h1>
<p>1) 교실을 네 구역으로 나누고 장소 이름을 종이에 적어 붙인다 2) 술래 한 명을 정해 뒤돌아서서 학교종 노래를 부르게 한다 3) 다른 학생들은 노래가 나오는 동안 교실을 돌아다니다 네 장소 중 한 곳으로 이동한다 4) 노래가 끝난 뒤 술래가 외친 장소에 있던 학생들은 자리에 앉아 탈락하며 끝까지 살아남은 학생이 승리한다</p>
