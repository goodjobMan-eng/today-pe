<h1>모양에 맞게 점프 점프</h1>
<p>1) 도화지에 발바닥 모양을 그려 바닥에 불규칙하게 배치하여 놀이판을 만듭니다. 2) 모양에 맞게 점프할 순서를 정합니다. 3) 순서대로 발바닥 모양에 맞춰 점프하여 통과합니다. 4) 모양대로 하지 않았으면 3초 정지 후 출발하며 더 빨리 돌아온 사람이 승리합니다.</p>
