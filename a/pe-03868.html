<h1>저리 가 좀비 (뇌 탈환 게임)</h1>
<p>1) 체육관 반대편에 훌라후프 8개를 놓고 각 후프 안에 태그 스틱과 공(뇌) 1개씩을 둔 뒤 수비수 8명을 배치한다. 2) 나머지 학생들은 좀비가 되어 음악에 맞춰 천천히 걸어서 수비수 진영으로 이동한다. 3) 좀비는 수비수의 태그 스틱에 닿지 않고 훌라후프 안의 공을 훔쳐야 한다. 4) 스틱에 태그당하면 다른 후프로 이동해야 하며, 공을 훔치는 데 성공하면 수비수와 역할을 바꾼다.</p>
