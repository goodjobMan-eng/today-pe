<h1>스피드스택스 6개 컵 쌓기와 유산소 운동 챌린지</h1>
<p>1) 화면에 컵 쌓기 모양 사진과 유산소 운동 동작이 제시된다. 2) 1분 동안 사진과 똑같은 모양으로 컵을 쌓는다. 3) 컵을 다 쌓은 후 남은 시간 동안 지정된 유산소 운동을 수행한다. 4) 라운드 사이에 주어지는 10초 동안 스택을 원래대로 정리한다.</p>
