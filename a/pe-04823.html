<h1>공을 받고 던지며 이동하는 이어달리기</h1>
<p>1) 콘으로 원형 트랙을 만들고 180도 마주 보는 두 곳에 출발 지점을 설정한다.2) 두 모둠으로 나누어 팀조끼를 입고, 모둠 내에서 2명씩 짝을 지어 순서를 정한다.3) 시작 신호가 울리면 1번과 2번 주자가 원형 트랙을 돌며 서로 공을 패스하고 이동한다.4) 한 바퀴를 돌아 다음 주자 짝에게 공을 패스하며, 상대를 따라잡거나 마지막 주자가 먼저 들어온 팀이 승리한다.</p>
