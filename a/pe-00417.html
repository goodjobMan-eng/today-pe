<h1>가라사대 놀이</h1>
<p>1) 진행자 앞에 참가자들이 서서, 지시 앞에 '가라사대'가 붙을 때만 동작을 따라 하기로 약속합니다. 2) 진행자가 '가라사대 오른손 올리세요'처럼 지시하면 해당 신체 동작을 수행합니다. 3) '가라사대' 없이 한 지시에 반응해 움직이면 탈락하여 무릎을 꿇거나 자리에 앉습니다. 4) 진행자는 '내리세요' 같은 페이크 지시를 섞고, 끝까지 속지 않고 서 있는 사람이 승리합니다.</p>
