<h1>정글 동물 모방 전신 홈트레이닝</h1>
<p>1) 주변 장애물이 없는 넉넉한 공간에 바르게 서서 관절을 회전하며 몸을 푼다. 2) 개구리 점프, 지렁이 기어가기, 강아지 다리 들기, 플라밍고 한 발 서기 등 동물 움직임을 따라 한다. 3) 강사의 구령과 타이머에 맞춰 온몸 근육을 수축하고 자세를 유지하여 신체 밸런스를 다진다. 4) 동작 간 전환 시간을 줄이거나 연속 점프 횟수를 늘려 인터벌 챌린지로 변형한다.</p>
