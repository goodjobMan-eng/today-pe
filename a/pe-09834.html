<h1>체조 동작 익히기</h1>
<p>1) 런지: 한 발을 앞으로 크게 내딛고 뒷다리를 곧게 펴며 엉덩이를 앞 무릎 높이까지 낮춘다 2) 모터바이크: 발을 어깨너비로 벌리고 무릎을 굽혀 앉으며 팔을 앞으로 뻗는다 3) 아라베스크: 한 발로 서서 다른 발을 뒤로 뻗고 양팔을 앞뒤로 벌려 균형을 잡는다 4) 플라밍고: 한 발로 서서 다른 발을 무릎에 대고 양팔을 옆으로 벌려 균형을 잡는다 5) 타다: 발을 모으고 양팔을 위로 뻗어 동작을 마무리한다</p>
