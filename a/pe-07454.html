<h1>마법의 숲</h1>
<p>1) 모두 원으로 둘러서 눈을 감고 손을 뒤로 뻗은 상태에서 교사가 조용히 소프트볼을 건네 술래를 정한다. 2) 신호와 함께 술래들은 공을 던지지 않고 손에 쥔 채 다른 학생의 상체를 터치한다. 3) 터치된 학생은 지정된 자세(나무, 돌 등)로 굳으며 다른 친구가 다리 밑으로 기어가거나 뛰어넘어 구출해 준다.</p>
