<h1>배드민턴 백핸드 서비스 및 릴레이 게임</h1>
<p>1) 라켓을 백핸드 그립으로 잡고 엄지와 검지로 셔틀콕의 깃털을 잡는다. 2) 오른발을 앞으로 내밀고 뒤꿈치를 살짝 든 후 라켓 헤드를 1.15m(명치) 아래에 둔다. 3) 손목을 바깥쪽으로 꺾으며 정해진 서비스 구역으로 서브를 넣는다. 4) 2인 1조 릴레이 형식으로 목표 구역에 서브를 성공시키고 돌아오는 게임을 진행한다.</p>
