<h1>발걸음 술래잡기</h1>
<p>1) 8명이 한 모둠이 되어 술래 1명을 정하고 모두 활동 공간에 폼볼을 든 술래와 함께 선다. 2) 교사의 안내에 따라 속도와 보폭에 변화를 주며(느리게, 빠르게, 좁게, 넓게) 걷는다. 3) 신호가 울리면 술래가 '한 발'이라고 외치고 모두 따라 외치며 한 걸음만 이동한다. 4) 술래가 한 발 이동한 뒤 폼볼로 친구를 치면 그 친구가 새 술래가 되며, 정지 상태에서 움직이면 술래가 되고 끝까지 잡히지 않은 친구가 승리한다.</p>
