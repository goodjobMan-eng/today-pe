<h1>4방 깃발 뺏기</h1>
<p>1) 체육관이나 놀이 구역을 4개 사분면으로 나누고 4개 팀이 각각 자기 구역에서 시작합니다. 2) 자기 구역의 안전 지대에 다른 팀의 콩주머니(깃발) 2개씩을 가져다 둡니다. 3) 상대 구역으로 이동해 다른 팀의 콩주머니를 자기 구역으로 가져오며, 상대 구역에서 잡히면 앉아서 팀원이 구해줄 때까지 기다립니다.</p>
