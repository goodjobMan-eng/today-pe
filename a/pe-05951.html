<h1>침묵의 유령기차</h1>
<p>1) 모든 참가자가 둥글게 둘러앉아 눈을 꼭 감고 대기한다.2) 술래로 지정된 선두 열차가 조용히 일어나 앉아 있는 사람들의 주위를 천천히 돈다.3) 선두 열차는 자신이 출발했던 자리에 돌아오기 전 다른 참가자를 터치하여 두 번째 열차로 연결한다.4) 선택받은 사람이 차례로 다음 사람을 선택해 열차를 이어가며, 마지막 남은 1명이 자신의 순서를 직감하고 눈을 뜨면 탈출에 성공한다.</p>
