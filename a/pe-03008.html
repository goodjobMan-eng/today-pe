<h1>플로어볼 라인 패스 및 패스 게임</h1>
<p>1) 두 팀으로 나누어 마주 보고 선다. 2) 포핸드 패스와 백핸드 패스를 활용하여 마주 보는 상대에게 공을 패스한다. 3) 패스한 후 상대 라인 뒤로 이동하여 순서가 계속 이어지도록 한다. 4) 정해진 목표 개수(30개 또는 50개)를 정해 놓고 공을 놓치지 않고 먼저 채우는 연습을 진행한다.</p>
