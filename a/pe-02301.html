<h1>배구 월패스</h1>
<p>1) 벽을 마주보고 손으로 벽에 공을 던져 튀어나온 공으로 시작한다. 2) 언더핸드 패스와 오버핸드 패스를 번갈아가며 벽에 패스한다. 3) 1분 동안 연속으로 패스를 성공한 횟수를 측정한다. 4) 공을 잡거나 바닥에 떨어뜨리면 공을 회수해 재개하며 이전 성공 횟수에 이어서 카운트한다.</p>
