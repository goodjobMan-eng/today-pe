<h1>까치와 까마귀 게임</h1>
<p>1) 왼쪽 줄 학생은 까치, 오른쪽 줄 학생은 까마귀로 정하고 까치는 왼발, 까마귀는 오른발을 붙이고 정면 교사를 바라본다. 2) 교사가 까치를 외치면 까치가 까마귀를 잡으러 가고, 까마귀를 외치면 까마귀가 까치를 잡으러 간다. 3) 파란 콘을 통과하기 전에 도망가는 학생을 잡지 못했거나 잡힌 학생은 팔벌려 높이뛰기를 5회 실시한다.</p>
