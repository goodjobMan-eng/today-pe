<h1>앉아서 하는 의자 유산소 스트레칭</h1>
<p>1) 교실 책상 앞 의자에 등을 펴고 바르게 앉아 호흡을 정리하며 준비한다. 2) 음악에 맞춰 목 늘리기, 허리 숙여 다리 펴기, 앉아서 제자리 행진 동작을 차례로 실시한다. 3) 무릎 가슴으로 당기기, 90도 로봇 어깨 풀기, 의자 잡고 다리 들어올리기 복근 운동으로 유산소와 근력을 높인다. 4) 동작 횟수를 늘리거나 짝과 호흡을 맞춰 거울 동작으로 따라 하는 놀이형 활동으로 변형한다.</p>
