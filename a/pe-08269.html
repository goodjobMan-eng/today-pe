<h1>코너 지키기 콘 태그 놀이</h1>
<p>1) 바닥에 4개의 라바콘을 사각형 형태로 배치하고 도망자 3명이 각각 하나의 콘을 맡아 섭니다. 2) 술래 1명은 가운데에서 뿅망치를 들고 서 있습니다. 3) 도망자들은 빈 콘으로 빨리 이동하여 자리를 바꾸고, 술래는 도망자나 비어 있는 콘을 먼저 터치하려 시도합니다. 4) 도망자가 술래에게 터치당하거나 술래가 빈 콘을 먼저 터치하면 역할이 바뀝니다.</p>
