<h1>스캐빈저스</h1>
<p>1) 체육관에 콘(파일런)들을 배치하고 그중 약 절반의 콘 밑에 콩주머니를 보이지 않게 숨겨 놓는다. 2) 모둠을 나누어 일렬로 선 뒤 신호가 울리면 첫 번째 주자가 나가 콘 하나를 들어 확인한다. 3) 콘 밑에 콩주머니가 있으면 자기 모둠으로 가져오고, 없으면 모둠 전체가 팔벌려뛰기 5회를 수행한 뒤 다음 주자가 출발한다. 4) 차례대로 반복하여 가장 많은 콩주머니를 찾아 모은 팀이 승리한다.</p>
