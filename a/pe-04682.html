<h1>파라슈트 동작 테스트 (우산, 버섯, 파도)</h1>
<p>1) 발가락으로 지탱하고 개구리처럼 쪼그려 앉아 파라슈트를 잡는다. 2) 한 걸음 들어가며 파라슈트를 올려 '우산(Umbrella)' 모양을 만든다. 3) 학생 리더의 신호에 맞춰 안쪽으로 세 걸음(세 번) 엉덩이로 밀고 들어가 '버섯(Mushroom)' 모양을 만든다. 4) 파라슈트 밖으로 나와 흔들며 '파도(Waves)'를 만든다.</p>
