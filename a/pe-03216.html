<h1>바르게 줄넘기하는 기본 자세 익히기</h1>
<p>1) 두 발을 모으고 발뒤꿈치를 든 상태에서 상체를 약간 앞으로 기울이고 시선은 정면을 보며 리듬감 있게 점프한다. 2) 줄을 한 손으로 잡고 허리 높이에서 손목을 이용해 돌리며 점프하는 연습을 양손 번갈아 실시한다. 3) 양손으로 줄을 잡고 허리 높이에서 돌리며 하루 100개씩 연습한다. 4) 숙달되면 한 발로 뛰기나 좌우로 벌리며 뛰기에 도전한다.</p>
