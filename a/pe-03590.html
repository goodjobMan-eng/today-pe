<h1>제자리 배드민턴 스윙 및 셔틀콕 던지기 연습</h1>
<p>1) 정면을 보고 서서 허리 회전을 이용해 제자리에서 스윙 동작을 연습한다. 2) 팔꿈치를 들어 올리고 팔로우스루 동작까지 끝까지 당겨 연결한다. 3) 라켓 대신 셔틀콕을 들고 측면으로 서서 투수처럼 반동을 이용해 위로 던져 클리어 감각을, 앞으로 던져 스매시 감각을 익힌다. 4) 셔틀콕을 칠 때 연결된 신체 부위(허리, 팔꿈치, 발목, 왼팔)를 동시에 움직여 스윙한다.</p>
