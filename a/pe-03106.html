<h1>농구 슈팅 기본자세 및 거리별 슛 연습</h1>
<p>1) 오른손으로 공 아래를 받치고 왼손은 옆에서 거들며 팔꿈치 각도를 약 90도로 들어 올린다. 2) 무릎을 굽혔다 펴는 하체 반동과 팔을 뻗는 힘을 동시에 사용해 골대를 향해 슛을 쏜다. 3) 골대 바로 앞 가까운 거리에서 슛을 쏘아 감각을 익힌다. 4) 슛이 성공하면 뒤로 두 걸음이나 세 걸음씩 물러나며 거리를 점차 늘려 연습한다.</p>
