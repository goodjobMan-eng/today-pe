<h1>캐슬 풀 (포켓볼 핀 타격전)</h1>
<p>1) 배구 코트 양쪽에 팀을 나누고 각 진영에 볼링핀 7개와 훌라후프 6개로 만든 캐슬을 설치한다. 2) 폼볼을 던져 상대 핀을 맞혀 넘어뜨리며, 핀 1개당 1명의 수비수만 보호할 수 있다. 3) 7개의 일반 핀을 모두 쓰러뜨린 팀만 상대 캐슬(8번 공)을 최종 공격할 수 있다. 4) 만약 모든 핀을 쓰러뜨리기 전에 캐슬을 먼저 무너뜨리면 즉시 반칙패(실점) 처리된다.</p>
