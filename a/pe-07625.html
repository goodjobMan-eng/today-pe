<h1>일렬 달리기 릴레이 (Fila)</h1>
<p>1) 학급을 두 팀으로 나누어 일렬로 줄을 서고, 각 줄의 학생들에게 앞에서부터 차례대로 번호(예: 1~6번)를 부여한다. 2) 교사가 특정 번호를 호명하면 양 팀의 해당 번호 학생이 뛰어나와 자기 팀 줄의 맨 뒤와 맨 앞을 돌아 제자리로 돌아온다. 3) 자기 원래 자리에 먼저 돌아와 멈춘 팀이 1점을 획득한다.</p>
