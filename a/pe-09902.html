<h1>벌집 태그 게임</h1>
<p>1) 두 팀으로 나누고 각 팀은 절반을 자신들의 벌집으로 정하며, 각 팀에서 여왕벌 1명을 뽑아 왕좌(스론)에 세운다. 2) 상대 팀 벌집으로 건너갈 때는 '쯩' 소리를 내며 뛰어야 하고, 소리가 끝나거나 멈추면 자리에 앉아 같은 팀원의 구조를 기다린다. 3) 자기 팀 벌집 안에서 태그를 당하면 왕좌에 있는 여왕벌의 구출을 받아야 하며, 여왕벌이 왕좌를 비우고 구출하러 갈 때는 태그를 당할 수 있다.</p>
