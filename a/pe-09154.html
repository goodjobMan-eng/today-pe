<h1>티볼형 게임의 규칙과 방법 이해하기</h1>
<p>1) 투수 없이 배팅 티 위에 공을 놓고 친다. 2) 스트라이크가 세 번이면 타자는 아웃이다. 3) 투 스트라이크 이후에 파울 볼을 치면 타자는 아웃이다. 4) 주자가 누를 밟고 있지 않을 때 공을 잡은 손이나 글러브를 주자의 몸에 대면 주자는 아웃이다. 5) 공격 모둠원 모두 공격하면 공격과 수비를 교대한다.</p>
