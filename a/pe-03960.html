<h1>보물 사냥꾼 콩주머니 탈환 놀이</h1>
<p>1) 학급을 여러 팀으로 나누고 각 팀 구역에 콘과 훌라후프를 놓아 섬을 만든 뒤 콩주머니 보물을 넣어 둔다. 2) 신호가 울리면 모든 학생이 동시에 달려가 다른 팀의 섬에서 콩주머니를 한 번에 1개씩만 집어 온다. 3) 가져온 보물은 자기 팀 섬(후프 안)에 먼저 넣어야 다른 팀 섬으로 다시 보물을 가지러 갈 수 있다. 4) 게임이 끝나면 팀 섬으로 돌아오며, 보물(콩주머니) 색상별로 부여된 점수를 확인해 합산한다.</p>
