<h1>달리기 팔치기와 다리 동작</h1>
<p>1) 발을 어깨너비로 벌리고 주먹을 턱이나 코 높이로 올린 뒤 팔꿈치를 뒤로 강하게 친다. 2) 구령에 맞춰 팔치기를 1회, 2회, 3회, 왕복 연속 20회 반복한다. 3) 한쪽 발을 뒤로 뺐다가 무릎을 직각으로 들어 올리며 팔과 교차한다. 4) 제자리에서 하이니(피치) 동작을 2회 또는 3회 연속으로 손발을 교차하며 실시한다.</p>
