<h1>백야드 도그 태그</h1>
<p>1) 콘이나 바닥 선으로 구역을 4개의 사각형(마당)으로 나누고, 각 구역마다 폼볼이나 스카프를 든 술래(개)를 1명씩 배치한다. 2) 나머지 도망자들은 한쪽 구석에서 출발하며 모든 마당과 울타리를 자유롭게 넘나들 수 있다. 3) 술래는 자신의 마당 안에서만 움직여야 하며, 술래에게 잡힌 도망자는 도구를 넘겨받아 새로운 술래(개)가 된다.</p>
