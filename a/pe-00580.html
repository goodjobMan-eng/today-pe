<h1>머리대고 물구나무 브릿지 (머리짚고 넘기 연결 연습)</h1>
<p>1) 매트에 양손과 정수리를 삼각대 모양으로 단단히 짚고 엉덩이를 들어 올립니다. 2) 엉덩이가 머리 위치를 넘어가면서 몸이 'ㄱ'자 형태가 되도록 중심을 이동합니다. 3) 두 다리를 위와 뒤쪽으로 힘차게 차올리며 상체와 허리를 활처럼 젖힙니다. 4) 발이 바닥에 닿는 순간 양팔로 바닥을 강하게 밀며 머리를 들고 브릿지 자세를 유지합니다.</p>
