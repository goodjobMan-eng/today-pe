<h1>혼자서 맨손체조 하기</h1>
<p>1) 양손을 깍지 끼고 구령에 맞춰 손목을 돌리며 왼쪽과 오른쪽 발목을 차례로 돌린다. 2) 손을 허리에 대고 구령에 맞춰 고개와 허리를 4박자씩 좌우로 한 바퀴씩 돌린다. 3) 한쪽 팔을 어깨 높이로 들고 반대 팔로 감싸 안거나, 발등을 뒤로 잡아당겨 10까지 세며 스트레칭한다. 4) 양손을 깍지 낀 채 앞으로 뻗어 온몸을 늘려주며 정지 자세를 유지한다.</p>
