<h1>버킷볼 (Bucket Ball)</h1>
<p>1) 중앙선에 공 10개를 일렬로 배치하고 양 팀 진영 끝에 콘 4개로 안전구역과 버킷을 설치한다. 2) 상대 진영으로 침투하여 공을 가져오며 상대 머리 아래를 태그하면 아웃되어 벽을 터치하고 복귀해야 한다. 3) 상대 안전구역 안으로 들어가면 태그되지 않으며 공을 부드럽게 버킷 안에 직접 넣어야 득점된다. 4) 득점한 플레이어는 태그되지 않고 자유롭게 자기 진영으로 걸어 복귀하며 3골을 먼저 넣는 팀이 승리한다.</p>
