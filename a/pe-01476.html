<h1>수건 공 회피 및 캐치볼 트레이닝</h1>
<p>1) 수건을 길게 접어 양쪽을 묶어 부드러운 수건 공을 만들어 짝과 마주 선다. 2) 한 명이 누워 있으면 상대방이 다리, 머리, 복부 위로 수건 공을 떨어뜨려 몸을 굴려 피한다. 3) 일어서서 수건 공을 위로 던진 후 박수 치기, 머리 만지기 후 잡는 솔로 캐치를 한다. 4) 1~2m 거리에서 반대 손, 등 뒤로 던지기, 피구처럼 피하기 규칙을 더해 캐치볼을 진행한다.</p>
