<h1>초등 티볼 게임 규칙</h1>
<p>1) 본루 티 위에 놓인 공을 배트로 쳐서 경기장 안으로 보낸다. 2) 타자는 공을 친 뒤 1루를 향해 달리고, 수비수는 땅에 떨어진 공을 주워 주자보다 먼저 베이스로 던진다. 3) 뜬공을 땅에 떨어지기 전에 잡거나 주자보다 공이 베이스에 먼저 도달하면 주자는 아웃된다. 4) 1번 타자부터 마지막 타자까지 모두 타격을 마친 후 공수를 교대하며 본루를 밟으면 1점을 득점한다.</p>
