<h1>무브 앤 프리즈 이동 운동 놀이</h1>
<p>1) 교사의 신호에 맞춰 화면에 제시되는 이동 동작만을 체육관 안에서 수행한다. 2) 첫 번째 동작으로 한 발을 앞으로 내딛고 뒷발을 따라붙이는 갤럽(gallop) 스텝으로 이동한다. 3) 호각 소리가 들리면 즉시 동작을 멈추고 자신의 정해진 제자리로 돌아간다.</p>
