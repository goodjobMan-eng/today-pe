<h1>애니모브 알파벳 동물 동작 놀이</h1>
<p>1) 알파벳 카드에 제시된 동물을 확인한다. 2) 악어 카드에 맞춰 방 안을 10번 뛰어넘는다(leap). 3) 제자리에서 20번 점프한다. 4) 곰 자세로 균형을 잡고 팔을 뻗으며 주변을 살피는 등 제시된 동작을 따라 한다.</p>
