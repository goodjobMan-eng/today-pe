<h1>반대방향축구</h1>
<p>1) 경기장 양쪽 끝에 골대를 마주 보지 않게 서로 반대 방향(역방향)으로 설치한다.2) 주황색 팀은 지정된 한쪽 골대에, 연두색 팀은 반대쪽 골대에 공을 넣어 득점한다.3) 공을 가진 한 명만 길게 드리블하지 않고 동료들과 패스를 주고받으며 경기를 진행한다.</p>
