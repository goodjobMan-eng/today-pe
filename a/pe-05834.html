<h1>붐 볼</h1>
<p>1) 경기장 양쪽(또는 4방향)에 팀을 나누어 배치하고 중앙에 대형 비치 발리볼을 둔다.2) 학생들은 손에 든 공을 던져 중앙의 비치 발리볼을 맞힌다.3) 비치 발리볼이 상대 팀 코트의 라인을 넘어가면 1점을 획득한다.4) 점수가 나거나 비치 발리볼이 체육관 엉뚱한 구역으로 벗어나면 지도자가 경기를 멈추고 다시 시작한다.</p>
