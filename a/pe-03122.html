<h1>평균대 오르기, 내리기, 걷기</h1>
<p>1) 손을 펴서 균형을 잡고 편한 발로 딛고 천천히 평균대에 오른다. 2) 착지할 때는 매트 위로 살짝 점프하되 무릎을 굽혀 충격을 줄이며 내린다. 3) 앞으로 걸을 때는 평균대를 발로 스쳐 지나가듯 앞으로 뻗으며 걷는다. 4) 뒤로 걷기는 발끝 감각으로 위치를 확인하며 천천히 걷고, 옆으로 걷기는 발바닥 가운데 오목한 부분으로 중심을 잡으며 이동한다.</p>
