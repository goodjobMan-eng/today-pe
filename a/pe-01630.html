<h1>MLK 타바타 피트니스 트레이닝</h1>
<p>1) 화면에 역사적 인물과 함께 제시되는 운동 동작(점핑잭, 팔굽혀펴기, 플랭크 등)을 확인하고 제자리에 선다. 2) 타이머 소리에 맞추어 20초 동안 해당 인터벌 운동을 전력을 다해 수행한다. 3) 20초 운동이 끝나면 10초 동안 휴식하며 호흡을 가다듬고 다음 인물의 명언을 확인한다. 4) 체력 수준에 따라 무릎 대고 팔굽혀펴기나 하프 스쿼트 등 난이도를 조절하여 8개 세트를 완주한다.</p>
