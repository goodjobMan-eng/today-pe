<h1>줄넘기를 활용한 협동 점프 운동</h1>
<p>1) 한 사람이 짧은 줄넘기를 넘고, 모둠원은 그 타이밍에 맞춰 줄 안으로 뛰어 들어갔다 나오는 활동으로 시작합니다. 2) 두 사람이 나란히 줄을 돌리면 조원들이 그 사이로 스텝을 맞춰 이동합니다. 3) 돌아가는 긴 줄(단체 줄넘기) 안으로 연속해서 달려 통과하거나 V자 형태로 되돌아 나옵니다. 4) 긴 줄 두 개를 X자로 교차해 돌리는 난도 높은 줄 통과하기와 학급 전체 8자 마라톤 줄넘기에 도전합니다.</p>
