<h1>얼티밋 변형 게임</h1>
<p>1) 운동장 양 끝에 정해진 득점 구역을 설치하고 경기장 중앙에서 패스로 경기를 시작한다. 2) 디스크를 가진 학생은 달릴 수 없으며 피벗만 가능하고 7초 이내에 패스해야 한다. 3) 디스크를 가진 학생을 상대방이 터치하면 아웃되어 사이드라인으로 나가며, 공격권이 넘어가면 다시 들어온다. 4) 공격 팀이 던진 디스크를 득점 구역 안에서 직접 잡으면 득점하고, 땅에 떨어지면 공격권이 전환된다.</p>
