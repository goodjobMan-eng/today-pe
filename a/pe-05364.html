<h1>스피드볼</h1>
<p>1) 양 팀 각 4명씩 구성하고 상대편 골대에 공을 넣어 득점한다2) 손으로 던져 넣으면 1점, 발로 차 넣으면 2점을 얻는다3) 손으로 패스하다 공을 떨어뜨리면 손으로 주울 수 없고 발로만 다루어야 한다4) 떨어진 공을 다시 손으로 올리려면 발로 띄워 동료의 손으로 차 올려주어야 한다.</p>
