<h1>그린치 프리즈 댄스 요가</h1>
<p>1) 음악과 그린치의 동작에 맞춰 춤을 춘다. 2) 신디 루 후가 나타나 멈추라고 하면 화면의 요가 자세를 취하고 그대로 멈춘다. 3) 미니 게임 시간(강아지 달리기)에는 응원할 강아지의 자세를 취해 선택한다. 4) 선택한 강아지의 속도를 높이기 위해 제자리 달리기를 한다.</p>
