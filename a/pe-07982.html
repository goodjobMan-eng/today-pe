<h1>이너피스 젓가락 휴지 챌린지</h1>
<p>1) 한쪽 발등 위에 휴지 한 칸을 올리고 같은 쪽 손에 젓가락을 든다. 2) 젓가락으로 휴지를 집어 반대쪽 무릎 위로 옮긴 뒤 젓가락을 반대 손으로 바꾼다. 3) 같은 방식으로 반대쪽 어깨, 반대쪽 무릎, 마지막 발등까지 대각선 지그재그 경로로 한 단계씩 옮기며 레벨 10까지 완주한다.</p>
