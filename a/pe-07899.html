<h1>블라인드 트립 (눈 감고 길 찾기)</h1>
<p>1) 두 명이 짝을 지어 한 학생은 눈을 감고, 다른 학생은 파트너의 어깨나 몸을 잡고 강당 안을 안내해 걷는다. 2) 교사가 '스톱'을 외치면 눈을 감은 채로 멈춘다. 3) 눈을 계속 감은 상태에서 안내자가 위험 요소로부터 지켜주는 가운데 원래 출발했던 시작 지점까지 스스로 되돌아간다.</p>
