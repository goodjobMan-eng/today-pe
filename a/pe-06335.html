<h1>스티치 스프링 런</h1>
<p>1) 제자리에서 달리고 점프하며 장애물을 넘는다.2) 2단계 벽의 구멍 미션에서는 틈새 모양에 맞춰 몸을 통과시킨다.3) 3단계에서는 주먹 펀치 동작을 수행한다.4) 중간 미니 게임에서는 포즈를 유지하며 3가지 다른 점을 찾는다.5) 4~5단계에서는 점프, 피하기(Dodge), 웅크리기(Duck) 동작을 수행한다.</p>
