<h1>1루 발야구</h1>
<p>1) 경기장에는 홈베이스와 1루만 두고 공격팀과 수비팀으로 나눈다.2) 공격수는 공을 차고 1루를 향해 달린 뒤 1루를 밟고 홈으로 돌아오면 1점을 얻는다.3) 공격수가 찬 공을 수비수가 한 번에 잡으면 아웃되고, 수비팀이 공을 잡아 주자보다 먼저 홈베이스를 밟으면 수비 성공이다.4) 공격팀 모두가 공을 찬 후 공격과 수비를 바꾼다.</p>
