<h1>접시콘 원마커를 덮다!</h1>
<p>1) 바닥에 점수가 부여된 원마커들을 배치한다. 2) 출발선에서 접시콘을 플라잉디스크처럼 던진다. 3) 던진 접시콘이 원마커를 덮으면 해당 마커의 점수를 획득한다. 4) 정해진 개수의 접시콘을 던져 더 많은 점수를 얻은 편이 승리한다.</p>
