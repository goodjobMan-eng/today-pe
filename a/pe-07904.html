<h1>섬 피구 (인셀 푈커발)</h1>
<p>1) 두 팀으로 나누고 상대 진영에 1~3장의 매트를 깐다. 2) 공에 맞으면 상대 진영의 매트로 이동한다. 3) 매트에서 상대 선수를 맞히면 본인 진영으로 복귀한다. 4) 상대 팀 선수를 모두 아웃시키면 승리한다.</p>
