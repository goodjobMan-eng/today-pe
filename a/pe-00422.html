<h1>랜덤 출석부 (친구 알아맞히기)</h1>
<p>1) 학생들은 좋아하는 음식, 계절, 과목 등 자신을 설명하는 질문이 적힌 출석부 시트지를 비공개로 작성해 진행자에게 제출합니다. 2) 진행자가 시트지를 무작위로 섞어 1장을 뽑고 적힌 내용을 차례대로 읽어 줍니다. 3) 설명을 들은 참가자들은 누구의 출석부인지 유추해 손을 들고 이름을 맞히며, 자기 출석부가 나오면 정답을 외치지 않고 모른 척합니다. 4) 정답을 맞히면 새 출석부를 뽑아 계속 진행하며 학급 친구들을 알아갑니다.</p>
