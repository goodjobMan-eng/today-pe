<h1>원 달려 점보스택 퐁당</h1>
<p>1) 출발선에서 신호를 받고 트랙을 한 바퀴 달린다.2) 중앙에 놓인 점보스택(원통)을 향해 공을 바운드시켜 던진다.3) 공이 점보스택 안으로 들어가면 성공으로 인정한다.4) 공이 들어가지 않으면 직접 공을 주워와서 들어갈 때까지 바운드시켜 던진다.5) 스택이 쓰러지지 않도록 주의하며 성공한 순서대로 점수를 부여한다.</p>
