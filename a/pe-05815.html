<h1>강과 뚝 뛰어넘기 놀이</h1>
<p>1) 강 구역에 모여 준비하고 신호에 맞춰 강이나 뚝으로 모둠발로 뛴다.2) 강아지(멍멍)나 홀수 신호에는 강으로 뛰고 고양이(야옹)나 짝수 신호에는 뒤로 빠져 뚝으로 뛴다.3) 잘못 뛰거나 늦게 뛴 사람은 벌칙으로 제자리에서 뛴다.</p>
