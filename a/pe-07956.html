<h1>경비 술래잡기 (Berek na strazy)</h1>
<p>1) 술래 3명을 정하고 나머지 학생들은 팀 조끼(스카프)를 받는다. 2) 술래에게 잡힌 학생은 멈춰 서서 스카프를 술래에게 주고 양손을 위로 든다. 3) 술래는 획득한 스카프를 원(후프) 안으로 가져가 보관하며 다른 학생들이 빼앗지 못하도록 지킨다. 4) 잡히지 않은 학생이 원으로 달려가 스카프를 가져오면 잡힌 학생에게 전달하여 구출한다.</p>
