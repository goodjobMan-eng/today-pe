<h1>티볼 타격 자세 교정 및 배팅 연습 방법</h1>
<p>1) T와 발의 적정한 높이와 거리를 유지한다. 2) T는 왼발보다 앞쪽에 위치하도록 놓는다. 3) 배트 스윙은 일직선으로 자연스럽게 휘두른다. 4) 스윙하는 동안 시선은 공에 끝까지 고정한다.</p>
