<h1>우산 세우기 놀이</h1>
<p>1) 교실에 있는 장우산 10~14개를 준비한다. 2) 5~7명을 한 팀으로 구성하여 우산을 잡고 원형으로 선다. 3) 원형 중앙에 있는 팀원 중 1명이 박자를 센다(하나, 둘, 셋). 4) 자신의 우산은 잘 세워 놓고 팀원의 박자에 맞춰 옆의 우산을 재빨리 잡는다. 5) 1분 동안 우산을 쓰러뜨리지 않고 성공한 횟수를 세어 다승 팀이 우승한다.</p>
