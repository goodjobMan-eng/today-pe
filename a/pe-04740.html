<h1>집에서 즐기는 축구 홈트레이닝</h1>
<p>1) 목, 어깨, 무릎, 다리 스트레칭으로 상체와 하체 관절을 충분히 푼다.2) 제자리에서 허벅지와 가슴 높이로 무릎 올리기 및 골반 넘기기를 실시한다.3) 발을 앞으로 뻗으며 낮게 차기와 러닝 점프로 높게 차는 동작을 반복한다.4) 발 안쪽(인사이드)과 바깥쪽(아웃사이드)으로 발을 올리고 스텝을 밟으며 털어준다.5) 스텝을 맞춰 발 안쪽과 바깥쪽으로 가상 패스를 주고받은 뒤 숨을 고르며 마친다.</p>
