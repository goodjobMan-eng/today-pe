<h1>돌려라 페트병 술래잡기</h1>
<p>1) 라바콘 6개로 큰 원 구역을 만들고 중앙에 페트병과 펀스틱(닭 인형)을 둔 뒤 콘 사이에 모둠별로 선다. 2) 교사가 중앙의 페트병을 돌려 병 입구가 가리키는 구역의 학생들이 해당 라운드의 술래가 된다. 3) 술래들은 펀스틱을 집어 들고, 나머지 도망자들은 원 안으로 들어가 요리조리 피하며 달린다. 4) 술래에게 터치당한 학생은 원 둘레 콘 주변으로 나가 대기하며 전원 탈락 시 역할을 바꾼다.</p>
