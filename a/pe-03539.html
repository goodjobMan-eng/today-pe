<h1>공 차고 콘 돌아오기</h1>
<p>1) 6명이 1모둠을 이루고 2모둠이 공격과 수비로 나뉘어 게임을 합니다. 2) 공격 모둠은 순서대로 1명씩 공을 차고 콘을 돌아 공격 홈으로 돌아옵니다. 3) 수비 모둠은 공격수가 찬 공을 발로 멈춘 다음 손으로 잡아 수비 홈으로 보냅니다. 4) 공격수가 공보다 먼저 홈에 들어오면 공격 모둠이 1점을 얻고 역할을 바꾸어 점수가 많은 모둠이 이깁니다.</p>
