<h1>어린이 농구 경기 규칙과 시합</h1>
<p>1) 코트 라인 안쪽에서만 공을 드리블해야 하며 선 밖으로 나가거나 밖에서 드리블할 수 없다. 2) 드리블을 멈추고 공을 잡은 뒤 다시 드리블하는 드리블 재개(더블 드리블)는 허용되지 않는다. 3) 중앙 원에서 각 팀의 키가 가장 큰 선수가 점프하여 공을 쳐내며 경기를 시작한다. 4) 다른 선수들은 중앙 원 바깥의 지정된 선 뒤에서 대기하고 점프볼 시 공을 잡지 않고 쳐내야 한다.</p>
