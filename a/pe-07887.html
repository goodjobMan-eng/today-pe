<h1>머리 위 패스 피구 (Kopfballabwerfen)</h1>
<p>1) 넓은 공간에서 술래가 배구공을 가지고 패스하거나 던져 다른 선수를 맞힌다. 2) 공을 던질 때는 머리 위로 올려 던져서 상대를 맞힌다. 3) 공에 맞은 선수는 늑목(사다리)을 끝까지 오르내리는 신체 과제를 수행한 뒤 다시 경기에 복귀한다.</p>
