<h1>수학 퀴즈 타바타 체조</h1>
<p>1) 화면을 바라보고 바른 자세로 서서 퀴즈를 풀 준비를 한다. 2) 화면에 나오는 유아·저학년 맞춤형 수학 문제(수 세기, 연산, 수 배열 등)를 10초 동안 관찰한다. 3) 자신이 생각한 정답 번호에 해당하는 신체 동작(제자리 달리기, 스쿼트 등)을 30초 동안 수행한다. 4) 정답 확인 후 점수를 매겨보며 다음 문제의 다양한 타바타 트레이닝 동작에 맞춰 몸을 움직인다.</p>
