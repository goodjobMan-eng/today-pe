<h1>거미줄 나도 그래</h1>
<p>1) 참가자들이 둥글게 원으로 선다.2) 시작하는 사람이 실 뭉치의 끝을 잡고 좋아하는 것을 말한다.3) 같은 것을 좋아하는 사람이 &quot;나도 그래(Me too)&quot;라고 외치면 실 뭉치를 던져주고, 받은 사람은 실을 잡은 상태에서 다른 사람에게 패스한다.4) 만들어진 실(거미줄) 위에 공을 올리고 떨어뜨리지 않은 채 10번 바운스하면 성공한다.</p>
