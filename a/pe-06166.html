<h1>장애물 통과하기</h1>
<p>1) 친구들이 훌라후프나 줄넘기 줄을 잡고 높낮이를 조절해 지그재그 장애물 길을 만든다.2) '얼음' 신호가 나오면 장애물을 든 학생들은 움직이지 않고 멈춘다.3) 출발 신호에 맞춰 한 명씩 차례대로 장애물에 닿지 않게 통과한다.4) 통과 중 줄이나 후프에 닿았는지는 양심적으로 스스로 판단하여 걸리면 다시 줄 뒤로 가서 재도전한다.</p>
