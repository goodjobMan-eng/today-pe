<h1>삼각물구나무서기(삼점도립) 균형 잡기 단계별 연습</h1>
<p>1) 바닥에 양손과 머리 정수리를 어깨너비로 짚어 정삼각형 형태를 만든다2) 겨드랑이를 조이고 무릎을 구부린 채 등과 허리를 수직으로 세워 균형을 잡는다3) 다리를 펴지 않고 공처럼 웅크린 상태로 체중을 양손과 머리에 실어 버틴다4) 몸이 안정되면 한 발씩 천천히 들어 올려 몸통 축을 유지하며 5초 이상 정지한다</p>
