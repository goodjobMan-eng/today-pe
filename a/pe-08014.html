<h1>콘 트리오 &amp; 게이트 통과 &amp; 3대3 축구</h1>
<p>1) 콘 트리오: 술래를 피해 콘을 잡고 있으면 세이프되며, 다른 주자가 오면 자리를 양보해야 한다. 2) 볼 컨트롤 및 게이트 통과: 2인 1조로 콘 사이로 패스를 주고받거나 여러 콘 게이트를 패스로 통과하며 이동한다. 3) 3대3 미니게임: 양 팀 3명씩 출전해 콘이나 골대로 득점을 겨루고, 나머지 인원은 벽 역할을 맡아 공이 나가면 즉시 투입한다.</p>
