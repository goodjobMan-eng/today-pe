<h1>독서의 날 기념 밸런스 운동 및 스트레칭 놀이</h1>
<p>1) 화면에 책이나 독서와 관련된 두 가지 선택지가 제시되면 마음에 드는 쪽을 고릅니다. 2) 오른쪽 선택지를 고르면 오른쪽으로 이동하고, 왼쪽을 고르면 왼쪽으로 이동합니다. 3) 카운트다운 후 선택한 항목의 캐릭터나 시범자가 보여주는 운동 동작 및 스트레칭을 30초 동안 수행합니다. 4) 문제가 바뀔 때마다 새로운 선택지를 고르고 다양한 전신 활동을 반복합니다.</p>
