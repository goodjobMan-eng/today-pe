<h1>배구 토스 3단계 연습방법</h1>
<p>1) 1단계: 손가락으로 공을 감싸고 팔꿈치와 손목을 이용해 공을 잡고 내민다. 2) 2단계: 팔꿈치를 고정한 채 손목만 사용하여 공을 잡고 내민다. 3) 3단계: 공이 떨어지는 타이밍에 팔꿈치를 내밀면서 손목으로 공을 잡아 빠르게 토스한다.</p>
