<h1>꽃과 봉오리 협동 구출 술래잡기 놀이</h1>
<p>1) 라바콘으로 안전 구역을 설정하고 술래 1~3명에게 팀 조끼를 입혀 시작한다. 2) 도망자는 술래를 피해 달아나며, 잡힐 위기에 처하면 '꽃'을 외치고 두 손을 머리 위로 모아 꽃봉오리 자세로 멈춘다. 3) 멈춰 선 친구는 다른 도망자 두 명이 동시에 양팔을 내려주며 '봉오리'를 외쳐야 구출된다. 4) 익숙해지면 꽃받침 자세로 동작을 바꾸거나 깽깽이걸음 등 이동 규칙을 제한하여 변형한다.</p>
