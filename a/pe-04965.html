<h1>초등 피클볼 기본 랠리 체험</h1>
<p>1) 배드민턴 규격 코트 중앙에 낮은 네트를 설치하고 패들과 구멍 뚫린 피클볼을 준비한다.2) 서브는 대각선 방향으로 언더핸드로 넣고, 서브와 리턴 시 각각 1회 바운드된 후 공을 친다(투 바운드 규칙).3) 네트 앞 논볼리존(키친) 안으로 들어가지 않고 상대와 패들로 랠리를 이어가며 득점한다.</p>
