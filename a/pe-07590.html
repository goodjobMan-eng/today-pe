<h1>발 개수 맞추기 협동 달리기</h1>
<p>1) 진행자가 있는 곳까지 팀원 전원이 이동하여 진행자의 머리를 부드럽게 터치하는 것을 목표로 한다. 2) 진행자가 발의 개수를 부르면(예: 6개, 7개 등) 팀원들이 모여 바닥에 닿는 발의 총합을 해당 숫자에 맞추는 방법을 상의한다. 3) 신호가 울리면 정해진 발 개수 조건을 유지한 채 팀원 전원이 함께 진행자에게 이동한다.</p>
