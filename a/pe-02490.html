<h1>킨볼 정식 경기</h1>
<p>1) 핑크, 그레이, 블랙의 3개 팀(팀당 4명)으로 나뉘어 20m x 20m 코트에 배치된다. 2) 공격 팀 3명이 공을 받치고 있는 상태에서 히터가 '옴니킨 + 수비팀 색상'을 호명한 후 허리 위 신체 부위로 공을 타격한다. 3) 호명된 수비팀은 공이 바닥에 닿기 전에 신체 부위로 받아내며, 3번째 터치 후에는 이동 없이 피벗만 가능하다. 4) 수비 실패나 반칙이 발생하면 실수를 한 팀을 제외한 나머지 2개 팀이 동시에 1점씩 득점한다.</p>
