<h1>스틸터치 디스크</h1>
<p>1) 술래 1명과 술래가 아닌 선수들로 팀을 구성하며 경기장 밖으로 벗어날 수 없다. 2) 술래는 학생들이 주고받는 디스크의 궤적을 예측하여 가로채거나 건드린다. 3) 디스크가 날아가는 중에 술래가 건드리면 마지막에 던진 선수가 술래가 되고, 디스크가 경기장 밖으로 나가면 던진 선수가 술래가 된다. 4) 패스된 디스크를 받지 못해 실패하면 던진 사람과 못 잡은 사람이 가위바위보를 하여 술래를 결정한다.</p>
