<h1>농구 스킬 밸런스 게임(Would You Rather)</h1>
<p>1) 화면에 제시되는 두 가지 선택지 중 마음에 드는 항목 하나를 고른다. 2) 왼손 선택 시 왼손 드리블, 오른손 선택 시 오른손 드리블을 실시한다. 3) 다리 사이 드리블, 등 뒤 드리블, 피겨 에이트 드리블 등 선택지에 배정된 핸들링 기술을 연습한다. 4) 마지막 보너스 라운드에서는 자신이 좋아하는 기술이나 연습하고 싶은 기술을 자유롭게 연습한다.</p>
