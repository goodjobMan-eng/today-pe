<h1>팀 협동 꼬리잡기</h1>
<p>1) 수비 팀원들은 서로의 어깨나 허리를 잡고 둥글게 원형 또는 한 줄로 연결해 뭉치고, 바지 뒤춤에 꼬리(머리띠/스카프)를 꽂아 둡니다. 2) 술래(공격자) 1명 또는 2명이 제한 시간 동안 빠르게 돌며 수비 팀원들의 꼬리를 빼앗으려 이동합니다. 3) 수비 팀은 대형이 끊어지지 않도록 발을 맞추어 회전하며 술래에게 등을 내주지 않도록 막습니다. 4) 제한 시간이 끝났을 때 빼앗긴 꼬리의 개수로 승패를 겨루거나 역할을 교대합니다.</p>
