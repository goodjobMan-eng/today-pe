<h1>농구 슛 익히기</h1>
<p>1) 시작점에서 달려와 점프하며 벽이나 철봉에 높이가 다르게 매달린 3단계 물체를 차례로 터치한다. 2) 골대 양옆과 정면에 놓인 3개의 원마커 위에 서서 각각 농구 골대를 향해 슛을 던진다. 3) 시작점에서 낮은 골대 쪽 원마커까지 드리블한 뒤 슛을 시도하고, 성공하면 더 높은 골대로 이동해 도전을 이어간다.</p>
