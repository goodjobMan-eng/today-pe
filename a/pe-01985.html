<h1>훌라후프 카우보이 스탬피드 태그</h1>
<p>1) 원 안에 도망자(말)들이 모이고 바깥 사방에 훌라후프를 든 술래(카우보이) 4명이 선다. 2) 신호와 함께 도망자들은 갤럽 스텝으로 원 밖으로 흩어져 달아나고 술래는 훌라후프를 이용해 도망자를 잡으러 다닌다. 3) 훌라후프로 잡힌 학생은 중앙 마구간 원 안으로 들어가 팔벌려뛰기 미션을 수행한다. 4) 안전을 위해 달리기 대신 갤럽으로 이동하거나 훌라후프 없이 손 터치 태그 방식으로 변형하여 진행할 수 있다.</p>
