<h1>계란판 탁구공 1대1 배틀</h1>
<p>1) 책상 위에 계란판을 놓고 두 사람이 마주 보고 선다.2) 탁구공을 책상에 바운스시켜 계란판 홈 안으로 튕겨 넣는다.3) 공이 들어가지 않으면 즉시 주워 다시 바운스하여 자신의 한 줄(또는 두 줄)을 먼저 채운다.4) 계란판의 한 줄(또는 두 줄)을 먼저 완성한 사람이 점수를 얻는다.</p>
