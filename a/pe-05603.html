<h1>원마커 득템 농구 드리블</h1>
<p>1) 중학년은 공을 들고 원마커로 가서 왼손과 오른손으로 각 3회씩 총 6회 드리블하고 공을 다음 사람에게 패스한 뒤 원마커를 가지고 출발선으로 돌아온다.2) 고학년은 출발선부터 드리블하며 이동하여 원마커 위에서 양손 각 10회씩 드리블하고 공을 패스한 뒤 원마커를 회수한다.</p>
