<h1>무릎 잡고 뒤구르기 턱 킥</h1>
<p>1) 짝(보조자)은 매트 위에 다리를 뻗고 앉고, 수행자는 보조자의 발등 앞 매트에 등을 대고 눕는다. 2) 보조자가 양손으로 수행자의 두 발목을 잡아 안정적으로 지지해 준다. 3) 수행자는 배를 위로 들며 브릿지 자세를 취하고 배와 골반을 보조자 몸 쪽으로 바짝 당긴다. 4) 발을 천장과 뒤쪽을 향해 힘차게 차올리는 동작을 반복하며 뒤구르기와 턱걸이 감각을 익힌다.</p>
