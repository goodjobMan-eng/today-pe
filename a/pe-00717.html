<h1>고학년 수영 (버디 학습·크롤·평영·25m 완영 도전)</h1>
<p>1) 버디 시스템(2인 1조)을 구성하여 서로의 영법 자세를 관찰하고 보조해 주며 학습을 진행합니다. 2) 크롤(자유형) 호흡 시 팔 동작과 귀의 위치 등 핵심 동작을 확인하고 연습합니다. 3) 평영은 발바닥으로 물을 밀어내는 킥과 손발 타이밍에 유의하며 추진력을 얻는 연습을 합니다. 4) 스트로크 횟수를 최소화하여 25m 완영하기 등 개인별 도전 과제에 참여합니다.</p>
