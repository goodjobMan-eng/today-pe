<h1>당신은 어디 사나요 점프 (고학년용 십자 점프)</h1>
<p>1) 수건이나 줄 2개를 바닥에 십자(+) 모양으로 교차하여 4개 구역을 만듭니다. 2) 전래동요 리듬에 맞추어 좌우 왕복 점프와 전후 왕복 점프를 수행합니다. 3) 특정 가사('사')가 나올 때만 순간적으로 앞 구역으로 뛰었다가 제자리로 복귀하는 반응 점프를 합니다. 4) 십자 구역을 시계 방향이나 반시계 방향으로 1회전하며 점프하거나 짝과 마주 보고 호흡을 맞춰 점프합니다.</p>
