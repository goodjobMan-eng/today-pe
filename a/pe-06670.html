<h1>스태킹 틱택토 팀 대항전</h1>
<p>1) 4명씩 두 팀으로 나누고 각자 책상 위에 스태킹 컵 1세트를 준비하며, 10m 앞 바닥에 9개 후프를 3x3으로 배치한다. 2) 주자는 1-10-1 스태킹을 마친 후 컵을 들고 달려가 9개 후프 중 한 곳에 놓는다. 3) 다음 주자들이 번갈아 이어가며 가로, 세로, 대각선 중 한 줄을 먼저 완성하는 팀이 승리한다.</p>
