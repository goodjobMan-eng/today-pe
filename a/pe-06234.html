<h1>전원 패스 간이 농구 게임</h1>
<p>1) 남학생 5대 5, 여학생 5대 5로 팀을 나누고 공격팀과 수비팀을 정한다.2) 공격팀은 팀원 전원이 패스를 최소 한 번씩 이어받아야 공격을 전개할 수 있다.3) 팀원 모두가 패스를 받은 후 골대 근처에서 패스를 이어받은 학생이 슛을 하여 득점한다.4) 한 쿼터당 7분씩 총 4쿼터(남학생 2쿼터, 여학생 2쿼터)로 경기를 진행한다.</p>
