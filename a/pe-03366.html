<h1>체조 앞구르기 도전하기</h1>
<p>1) 매트 앞에 서서 한 명씩 순서대로 앞구르기에 도전한다. 2) 양손을 어깨너비로 벌려 매트를 짚고 머리를 최대한 숙인다. 3) 턱을 당기고 무릎을 모아 가슴에 붙이며 몸을 둥글게 말아 힘껏 구른다. 4) 다리 모아 앞구르기가 익숙해지면 구를 때 허리가 매트에 닿는 순간 다리를 벌려 구르는 동작에 도전한다.</p>
