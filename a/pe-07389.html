<h1>콩주머니 빨리 옮기기 (달리기 게임)</h1>
<p>1) 중앙 후프에 콩주머니 7개를 넣고 각자 출발선에 후프 1개씩을 둔다. 2) 신호가 울리면 직선으로 달려가 중앙 콩주머니를 1개씩 가져와 자기 후프에 넣는다. 3) 중앙의 공이 떨어지면 다른 친구의 후프에서 콩주머니를 가져와 자기 후프에 먼저 3개를 채우면 이긴다.</p>
