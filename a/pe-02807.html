<h1>차고 달리고! 차고 달리기!</h1>
<p>1) 팀을 나눈 후 절반씩 서로 10미터 정도 떨어져 마주 보고 선다. 2) 공을 차고, 반대편으로 달려가 맨 뒤에 선다. 3) 공을 받는 사람이 제자리에서 받으면 반대편으로 출격한다. 4) 제자리에서 받지 못하면 달려가서 다시 가져와서 차며, 두 번째에도 받지 못하면 발을 친구에게 가져다주고 맨 뒤에 서거나 스타 점프 10번을 한다.</p>
