<h1>포스퀘어 서브 연습 및 코트 게임</h1>
<p>1) 학생들은 자신의 수준에 맞춰 퍼플 문 코트(경쟁), 옐로 선 코트(친선), 레인보우 코트(학습) 중 하나를 선택한다.2) 빅 베어 위치에 선 서버는 발을 선 위나 뒤에 두고 서브하기 전 'Are you ready?'라고 말해야 하며, 말하지 않으면 아웃된다.3) 서브 시 공을 내리치지 않고 머리 높이에서 손을 옆으로 빼며 아래에서 떠받치듯 언더핸드로 쳐서 상대 구역으로 넘긴다.</p>
