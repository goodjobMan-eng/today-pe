<h1>초보자를 위한 허들 달리기</h1>
<p>1) 성인용보다 낮고 넘어지도록 설계된 주행 방향으로 허들을 배치한다. 2) 허들 사이를 망설이지 않고 일정한 리듬으로 달린다. 3) 한쪽 리드 다리를 앞으로 뻗고 트레일 다리는 몸 옆으로 접어 넘는다. 4) 허들을 뛰어넘지(jump) 않고 큰 한 걸음으로 가로지르며 달린다. 5) 고의로 허들을 넘어뜨리지 않으며 결승선까지 달린다.</p>
