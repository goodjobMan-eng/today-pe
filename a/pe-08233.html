<h1>리파 체이스 게임</h1>
<p>1) 콘으로 표시된 원형 구역 안에서 두 팀으로 나뉘어 각자 태그 벨트를 찬다. 2) 도망가는 팀은 럭비공을 항상 양손으로 잡은 채 구역 안을 달리며 수비수를 피한다. 3) 술래 팀은 달려가 상대의 태그를 뜯고, 태그 2개가 모두 뜯긴 선수는 구역 밖으로 나온다. 4) 술래 팀이 상대 전원의 태그를 모두 뜯어내는 데 걸린 시간을 초시계로 측정하여 더 빠른 팀이 승리한다.</p>
