<h1>스퀘어 피구 (스퀘어 도지볼)</h1>
<p>1) 한 변이 약 6m인 정사각형 코트를 만들고 각 변에 1명씩 외야수로 선다. 2) 시작 신호와 함께 외야수는 패스를 돌리며 내야의 어린이를 향해 공을 던진다. 3) 약 1분의 제한 시간 동안 내야의 어린이를 공으로 몇 번 맞히는지 겨룬다. 4) 제한 시간이 끝나면 역할을 교대하여 모든 어린이가 내야를 경험하도록 한다.</p>
