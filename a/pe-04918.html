<h1>축구 가랑이 바운드 헤딩 리프팅</h1>
<p>1) 리프팅을 하다가 공을 조금 높게 띄운다.2) 점프하면서 공을 양 다리 사이(가랑이) 바닥으로 원 바운드시킨다.3) 튀어 오른 공을 머리 뒤통수에 맞혀 다시 바닥으로 떨어뜨린 뒤, 바운드된 공을 발로 퍼 올려 리프팅을 이어간다.</p>
