<h1>해적과 선원</h1>
<p>1) 강당 모서리에 매트를 놓아 선원들의 배를 만들고, 중앙에 매트를 놓아 해적선의 감옥 구역을 설치한다. 2) 풀누들(스펀지봉)을 든 3명의 해적이 선원들을 쫓아다니며 부드럽게 태그한다. 3) 선원들은 배에서 배로 이동하며 해적을 피하고, 배 안에서는 안전하지만 최대 3초 동안만 머물 수 있다. 4) 해적에게 태그된 선원은 해적선 감옥으로 이동하며, 다른 선원이 태그당하지 않고 감옥에 와서 손을 잡고 선원 배로 데려오면 부활한다.</p>
