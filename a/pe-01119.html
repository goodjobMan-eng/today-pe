<h1>플라잉 종이 링 캔 걸기 챌린지</h1>
<p>1) A4 용지 3장을 접어 둥글게 만든 종이 링 3개와 목표물인 캔 3개를 바닥에 준비한다. 2) 타이머를 1분으로 설정하고 출발선에서 반환점 수건을 찍고 돌아와 종이 링을 캔을 향해 던진다. 3) 링이 캔에 걸리지 않으면 즉시 왕복 달리기를 다시 수행한 뒤 다음 링을 주워 연속으로 투척한다. 4) 제한 시간 1분 안에 캔 3개 모두에 종이 링을 다 거는 데 성공하면 미션을 완수하며 기록을 단축한다.</p>
