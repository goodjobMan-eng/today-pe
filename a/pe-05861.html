<h1>로켓 착륙 콘 쌓기 게임</h1>
<p>1) 콘을 들고 엔드라인에 놓인 다른 콘을 향해 달려간다.2) 엔드라인의 콘에 도착하면 손에 든 콘을 지정된 높이(허리, 가슴, 이마 높이)에서 떨어뜨린다.3) 바닥의 콘 위에 손에 든 콘이 정확히 겹쳐 착륙하면 1점을 획득한다.4) 콘 착륙에 실패하면 점핑잭 10회를 수행한다.</p>
