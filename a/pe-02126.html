<h1>뜀틀 다리벌려 뛰어넘기</h1>
<p>1) 발구름판을 향해 도움닫기로 일정하게 달려온다. 2) 한 발이 아닌 두 발을 모아 발구름판을 힘차게 구른다. 3) 뜀틀의 3분의 2 이상 지점(먼 곳)에 양손을 넓게 짚는다. 4) 다리를 양옆으로 벌려 뜀틀을 넘은 뒤 두 발을 모으고 무릎을 굽혀 착지한다.</p>
