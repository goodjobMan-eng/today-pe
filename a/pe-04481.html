<h1>운동 후 정리 스트레칭 활동</h1>
<p>1) 한 팔을 앞으로 뻗고 엄지를 아래로 내린 뒤 가슴 쪽으로 당겨 팔 뒤쪽을 10~15초간 스트레칭한다. 2) 한 손으로 등을 두드리듯 손을 내리고 반대 손으로 팔꿈치를 아래로 밀어 삼두근을 늘린다. 3) 한 발을 앞으로 내딛고 뒷다리를 곧게 펴서 종아리를 늘리는 런지 동작을 한다. 4) 한 손으로 발뒤꿈치를 엉덩이에 닿게 잡고 중심을 잡으며 허벅지 앞쪽을 스트레칭한다.</p>
