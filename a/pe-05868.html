<h1>점핑잭 변형 도전 과제</h1>
<p>1) 버전 1은 발을 벌릴 때 손을 올리고, 버전 2는 발을 벌릴 때 손을 내린다.2) 레벨 1은 버전 1을 2회 연속 뛰고 이어서 버전 2를 2회 연속 뛰며, 멈추지 않고 5회 연속 전환을 완료한다.3) 레벨 2는 각 버전을 1회씩 번갈아 가며 멈추지 않고 5회 연속 전환을 완료한다.</p>
