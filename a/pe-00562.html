<h1>저학년 기초 사다리 스텝 훈련</h1>
<p>1) 바닥에 스텝래더를 놓고 칸마다 줄을 밟지 않고 지나가는 것을 기본 규칙으로 시작합니다. 2) 1칸에 1보씩 걷거나 뛰며 통과한 뒤, 1칸에 2보씩 발을 디디는 스텝으로 난이도를 올립니다. 3) 사다리 측면으로 서서 이동하는 횡이동 2보 스텝과 안-안-밖-밖(인-인-아웃-아웃) 4박자 스텝을 연습합니다. 4) 마지막으로 안-안-밖 3박자 스텝을 정면과 측면 방향으로 수행하며 발동작과 체중 이동 감각을 익힙니다.</p>
