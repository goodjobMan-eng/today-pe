<h1>파이브 패스 (패스트 패스)</h1>
<p>1) 팀을 나누고 일부 팀원은 벨트나 조끼를 착용해 구분한다. 2) 공을 받은 사람은 자신에게 바로 패스해 준 사람에게 되돌려 던질 수 없다. 3) 다른 팀원에게 패스를 연결하며 팀 전체가 연속으로 5번 패스에 성공하면 1점을 얻는다.</p>
