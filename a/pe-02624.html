<h1>가정형 신체활동 4종 트레이닝</h1>
<p>1) 누워서 다리를 올렸다 내린 후 한쪽 다리를 접어 반대쪽 다리에 올리고 몸쪽으로 당겨 스트레칭한다. 2) 상체를 바르게 세우고 점프 박스 위로 한 발로 최대한 높게 점프하여 올라간다. 3) 다리를 벌렸다 모으면서 측면으로 이동하여 스쿼트 후 공을 던졌다 받는다. 4) 상체를 바르게 세우고 정해진 원마커에 정확하게 한 발로 앞뒤 좌우 크로스 점프를 한다.</p>
