<h1>음악에 맞춘 의자 스트레칭</h1>
<p>1) 의자에 바르게 앉아 줄을 잡아서 몸 쪽으로 당기고 손목을 돌린다. 2) 양손을 마주 보게 하여 옆으로 밀고 어깨를 돌린 뒤, 상체를 크게 돌린다. 3) 발을 모았다가 벌리고, 발을 앞으로 들었다가 내리는 동작을 반복한다. 4) 양손을 포개어 앞으로 밀고 구리구리를 한 후, 크게 기지개를 켜며 마무리한다.</p>
