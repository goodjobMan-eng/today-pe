<h1>무선조종 자동차 포켓몬 스쿠터 태그</h1>
<p>1) 학생들은 스쿠터보드를 타고 양손에 풀누들(라이트세이버)을 잡고 포켓몬이 되어 이동한다.2) 술래는 몬스터볼이 묶인 무선조종(RC) 자동차를 조종하여 학생들을 쫓아다닌다.3) RC 자동차에 태그된 학생은 스쿠터에서 내려 벽에 부착된 포켓몬 피트니스 카드로 이동한다.4) 벽에 적힌 두 가지 운동 중 하나를 선택해 수행하여 포켓볼에서 탈출한 후 다시 게임에 복귀한다.</p>
