<h1>10초 순발력 술래잡기</h1>
<p>1) 정해진 구역(코트의 절반 등) 안에 도망자 학생들이 흩어지고, 나머지는 출발선에 일렬로 섭니다. 2) 호각 신호와 함께 줄 맨 앞 학생이 술래가 되어 구역 안으로 뛰어듭니다. 3) 술래는 약 10초 동안 최대한 많은 도망자를 터치하며, 터치당한 학생은 대기 줄 맨 뒤로 이동해 다음 차례를 기다립니다. 4) 10초 후 호각이 울리면 술래를 빠르게 교대하여 줄의 다음 학생이 새 술래로 들어갑니다.</p>
