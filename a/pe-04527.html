<h1>사다리 스텝 및 점프 활동</h1>
<p>1) 민첩성 사다리 칸마다 한 발로 제자리 뛰기를 하며 끝까지 간 뒤 발을 바꿔 돌아온다. 2) 두 발을 모아 캥거루처럼 발끝으로 칸을 뛰어넘으며 이동한다. 3) 양팔을 머리 위로 올리고 다리를 모은 채 연필 모양으로 사다리를 통과하며 뛴다. 4) 콘에서 도움닫기 후 최대한 멀리 뛴 뒤 양팔을 뻗고 무릎을 굽히는 모터바이크 자세로 착지한다.</p>
