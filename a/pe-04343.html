<h1>스폰지밥 런 게리 구출 피트니스</h1>
<p>1) 1단계 비키니 시티에서 달팽이 점액은 점프하고 해파리와 게살버거 아래로 숙이며 거품은 헤엄쳐 통과한다. 2) 2단계 아틀란티스 시티로 이동하며 해초는 넘고 물고기는 숙여 피하며 라디오가 켜지면 춤을 춘다. 3) 3단계 삼지창 아래로 숙이고 장애물을 피하며 닭다리는 점프하고 달팽이 점액을 닦아낸다. 4) 게리를 구출한 뒤 댄스 파티에 맞춰 함께 춤을 춘다.</p>
