<h1>농구 기본 드리블 익히기</h1>
<p>1) 양발을 어깨너비보다 넓게 벌리고 엉덩이를 낮춰 안정적인 기본자세를 잡는다. 2) 어깨 대신 팔꿈치 아래의 힘을 이용하고 손바닥 전체로 공을 감싸듯 부드럽게 눌러준다. 3) 반대쪽 손은 공을 감싸 보호할 수 있도록 공 가까이에 받쳐 둔다. 4) 무릎 높이의 미들 드리블에 익숙해지면 가슴 높이의 하이 드리블과 좌우 크로스오버 드리블로 발전시킨다.</p>
