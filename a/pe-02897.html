<h1>점점 멀리 플라잉디스크 주고받기</h1>
<p>1) 두 명이 마주 보고 서서 플라잉디스크를 주고받는 연습을 한다. 2) 디스크 받기에 성공하면 뒤로 한 발씩 물러나 거리를 넓힌다. 3) 디스크를 공중에서 받지 못하고 놓치면 앞으로 한 발 이동한다. 4) 정해진 시간 동안 떨어뜨리지 않고 가장 멀리 이동한 거리를 달성한다.</p>
