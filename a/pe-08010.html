<h1>호박 술래잡기 (펌킨 태그)</h1>
<p>1) 술래는 머리 위에 주황색 고깔콘을 얹고 양손으로 잡은 채 도망치는 사람들을 쫓아간다. 2) 술래에게 터치당한 사람은 그 자리에서 술래가 된다. 3) 터치된 사람은 체육관 한쪽에 놓인 주황색 콘을 가져와 머리에 얹고 새로운 호박 술래가 되어 모든 사람이 잡힐 때까지 놀이를 이어간다.</p>
