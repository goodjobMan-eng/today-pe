<h1>철봉 기본 턱걸이 및 차오르기(사카아가리) 익히기</h1>
<p>1) 자신의 가슴 높이로 설정된 철봉을 잡고 팔꿈치를 가볍게 굽힌다.2) 한 발을 뒤로 뺀 자세에서 차는 다리를 위로 강하게 10회 흔들어 차올리는 연습을 한다.3) 팔꿈치를 굽힌 상태를 유지하고 배꼽을 보며 발을 차올려 철봉 위로 넘어간다.</p>
