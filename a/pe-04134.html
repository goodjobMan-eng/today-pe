<h1>밸런스 볼 배틀</h1>
<p>1) 두 명의 학생이 밸런스 보드 위에 올라선 채 두 사람 사이에 공을 맞대어 잡는다. 2) 시작 신호가 울리면 공을 튕기거나 당기거나 밀어서 상대를 흔든다. 3) 공에서 손이 떨어져 공을 놓치거나, 밸런스 보드 아래로 발이 먼저 떨어지면 패배한다. 4) 보드 위에서 공을 유지하며 끝까지 버틴 사람이 승자가 된다.</p>
