<h1>거리 조절 플라잉 디스크 패스 챌린지</h1>
<p>1) 두 명이 마주 보고 서서 약 5걸음 거리에서 안전한 폼 디스크를 들고 준비한다. 2) 상대를 향해 몸 앞쪽으로 가볍게 밀어주듯 디스크를 던져 서로 주고받는다. 3) 패스를 안정적으로 성공하면 한 걸음씩 뒤로 물러나고 실패하면 한 걸음 앞으로 좁히며 거리를 조절한다. 4) 숙달되면 두 사람 사이에 네트를 설치해 네트 위로 넘기거나 릴레이 순환 방식으로 인원을 늘려 변형한다.</p>
