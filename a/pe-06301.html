<h1>국가 이름 축구 드리블 및 콘 패스 훈련</h1>
<p>1) 배구 코트 구역 안에서 자유롭게 축구공을 드리블한다.2) 지도자가 외치는 국가 이름 신호에 맞춰 달리기 드리블을 하거나 걷기 속도로 감속하며 공을 제어한다.3) 짝과 함께 마주 보고 콘 사이에 위치하여 정확하게 공을 주고받는 패스를 연습한다.4) 패스에 성공할 때마다 최대 5걸음까지 뒤로 물러나며 패스 거리를 늘려 도전한다.</p>
