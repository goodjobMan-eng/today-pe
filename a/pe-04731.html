<h1>산타와 루돌프 발목 잡기 놀이</h1>
<p>1) 루돌프 역할을 맡은 학생들은 발목을 잡고 엎드려 자세를 유지한다.2) 산타는 루돌프들의 발목을 잡아 끌어 당겨서 뽑으려 한다.3) 루돌프는 발로 차지 않고 가만히 버티며 바지가 벗겨지지 않도록 옷을 넣어 입는다.4) 산타에게 뽑힌 루돌프는 산타와 함께 다른 루돌프들을 뽑으러 다닌다.</p>
