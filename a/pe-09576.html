<h1>킨볼 전술 훈련 상급</h1>
<p>1) 수비 역할 선수는 중앙에 4각형으로 대형을 갖추고 공격 선수는 킨볼과 동일 선상에 준비한다. 2) 지도로부터 받은 킨볼을 중앙에 히트하고 수비 선수는 킨볼을 수비한다. 3) 수비 성공한 선수는 지도자 앞으로 드리블하여 세팅하고 같은 방법으로 훈련을 반복한다.</p>
