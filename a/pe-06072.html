<h1>3인 가위바위보 컵 쌓기</h1>
<p>1) 3명이 함께 가위바위보를 한다.2) 혼자 이기거나 혼자 지면 컵을 2개 쌓는다.3) 세 명이 모두 비기면 각자 컵을 1개씩 쌓는다.4) 컵을 쌓다가 무너지면 다시 시작한다.5) 정해진 시간 동안 가장 많은 컵을 쌓은 사람이 승리한다.</p>
