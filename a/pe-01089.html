<h1>오는 줄 연속 통과하기</h1>
<p>1) 긴 줄넘기 양 끝을 돌림판 2명이 잡고 앞쪽으로 다가오며 회전하는 형태(오는 줄)로 일정하게 돌린다. 2) 줄이 바닥을 치고 위로 올라가 정수리를 지나는 타이밍에 맞춰 첫 번째 주자가 줄 안으로 진입한다. 3) 제자리 점프 1회를 가볍게 뛰며 줄을 넘자마자 전방으로 자연스럽게 빠져나간다. 4) 앞 주자가 점프하는 순간 뒷 주자가 틈 없이 연속해서 뛰어들며 전원 통과 기록을 달성한다.</p>
