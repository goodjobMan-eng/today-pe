<h1>공 굴리기 클리닉</h1>
<p>1) 1차시에서 좋은 움직임을 보였던 4명을 친샘으로 뽑는다.2) 친샘의 안내에 따라 자세를 취하고 공을 굴린다.3) 공을 굴리자마자 친샘의 피드백을 먼저 듣고 공을 주우러 간다.4) 오른쪽으로 한 칸씩 이동하며 여러 친샘에게 피드백을 받는다.</p>
