<h1>공 활용 코어 워밍업 챌린지</h1>
<p>1) 누운 채 손에 쥔 공을 발 사이에 전달하고 다시 손으로 가져오는 V자 복근 패스를 5회 왕복한다. 2) 공을 두 발목 사이에 끼운 뒤 점프와 동시에 공을 공중으로 띄워 손으로 잡는 동작을 10회 실시한다. 3) 푸시업 자세(플랭크)를 유지하며 한 손으로 공을 바닥에 연속으로 튀기거나 쳐내어 버틴다. 4) 선 자세나 긴 바닥 자세에서 공을 강하게 바닥에 바운드시킨 후 재빠르게 그 밑을 통과하거나 일어서서 캐치한다.</p>
