<h1>협동 구출 전자레인지 얼음땡</h1>
<p>1) 접시콘으로 안전 구역을 표시하고 술래 1~2명을 정한 뒤 나머지 학생들은 구역 안에서 자유롭게 도망친다. 2) 술래에게 터치된 사람은 양손을 모으고 얼음처럼 그 자리에 그대로 굳어 멈춘다. 3) 도망자 두 명이 얼어붙은 친구의 양손을 잡고 함께 &quot;땡!(친)&quot;을 크게 외치면 얼음이 풀려 다시 도망칠 수 있다. 4) 구출 인원을 3명으로 늘리거나 술래들이 손을 잡고 다니며 포위하는 방식으로 난이도를 변형한다.</p>
