<h1>어깨동무 저글링 (어울림 저글링)</h1>
<p>1) 마주 보고 서서 공 2개로 서로 주고받으며 던지는 호흡을 맞춘다. 2) 나란히 서서 어깨동무를 한 뒤 공 1개를 오른손과 왼손으로 각 3번씩 주고받는다. 3) 어깨동무한 상태에서 각자 공 1개씩(총 2개)을 쥐고 포물선을 그리며 동시에 주고받는다. 4) 한 사람이 공 2개, 다른 사람이 공 1개를 쥐고 신호에 맞춰 정식 3구 저글링을 완성한다.</p>
