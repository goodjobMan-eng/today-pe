<h1>액션후프 4x4 리듬 스텝 놀이</h1>
<p>1) 바닥에 가로 4줄, 세로 4줄로 총 16개의 액션후프를 4x4 형태로 붙여 놓는다. 2) 바깥에서 발을 벌린 상태로 두 개의 후프 안쪽으로 점프해 들어간 뒤, '하나 둘 하나 둘' 박자에 맞춰 옆으로 이동했다가 제자리로 돌아온다. 3) 한 줄 앞 칸으로 점프하여 이동한 후 다시 좌우로 2박자 리듬에 맞춰 움직인다. 4) 마지막 4번째 줄까지 모두 이동하여 밖으로 나가면 성공하며 다음 사람이 연속해서 실시한다.</p>
