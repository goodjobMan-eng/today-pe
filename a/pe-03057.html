<h1>탁구공 골인 컵 쌓기 게임</h1>
<p>1) 경기장 중앙에 여러 개의 컵을 모아 두고, 팀별로 원 마커 뒤에 한 줄로 선다. 2) 각 팀 주자가 차례대로 나와 탁구공을 직접 던지거나 바닥에 튀겨 중앙의 컵 안으로 넣는다. 3) 탁구공을 컵에 골인시키면 해당 컵을 가져와 자기 팀 원 마커 바닥에 두고, 주황색 컵에 넣으면 한 번 더 던질 기회를 얻는다. 4) 가져온 컵을 3개, 2개, 1개 순으로 피라미드 형태로 먼저 쌓아 올리는 팀이 승리한다.</p>
