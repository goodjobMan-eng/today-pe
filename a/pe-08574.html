<h1>레드라이트 그린라이트</h1>
<p>1) 학생들은 체육관 한쪽 끝에 일렬로 선다. 2) 교사는 반대편 끝에 선다. 3) 교사가 '그린라이트'라고 외치면 학생들은 교사 쪽으로 이동한다. 4) 교사가 '레드라이트'라고 외치면 학생들은 즉시 멈춘다. 5) 멈추지 못한 학생은 처음 위치로 돌아간다.</p>
