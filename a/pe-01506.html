<h1>다양한 시작 자세 달리기와 핸디캡 레이스</h1>
<p>1) 출발선과 결승선에 라바콘을 두고 충분한 간격을 두어 정렬한다. 2) 체육 앉기나 엎드린 자세 등 지정된 자세로 대기하다가 신호에 맞춰 결승선 콘까지 전력 질주한다. 3) 결승선을 통과한 순서에 따라 1위는 두 걸음 뒤로, 꼴찌는 두 걸음 앞으로 이동하여 핸디캡을 부여한다. 4) 중간 콘까지 팔짱을 끼고 달리다가 통과 후 팔을 힘차게 흔들며 질주하는 변형을 적용한다.</p>
