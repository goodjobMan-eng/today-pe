<h1>당겨 차기 시저스 페인트 연습</h1>
<p>1) 한쪽 발바닥으로 공을 몸 안쪽으로 끌어당겨 옆으로 굴린다.2) 당긴 발을 바닥에 내리지 않고 시저스 페인트처럼 공 안쪽에서 바깥쪽으로 넘긴다.3) 반대쪽 발로 공을 밀어내며 상대를 제친다.4) 페트병이나 사람을 앞에 두고 천천히 동작을 연습하며 거리와 타이밍을 익힌다.</p>
