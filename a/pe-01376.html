<h1>팀 대항 스포츠스태킹 매치</h1>
<p>1) 팀별로 경기 테이블에 전용 매트와 타이머 및 스태킹 컵 세트를 배치하고 출전 순서를 정한다. 2) 신호에 맞춰 개인전(3-6-3 등) 또는 2인 1조 더블 경기로 컵을 피라미드 모양으로 쌓았다가 신속하게 허문다. 3) 타이머를 정지시켜 기록이 더 빠르거나 실격(스크래치) 없이 먼저 완료한 팀이 해당 라운드 점수를 획득한다. 4) 주자 순서를 바꾸거나 4인 팀 릴레이 방식으로 변형하여 세트제 대결을 펼친다.</p>
