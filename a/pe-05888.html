<h1>스플래툰 콘 뒤집기</h1>
<p>1) 두 가지 색상이 양쪽으로 테이핑된 미니 콘을 체육관 바닥에 골고루 배치한다.2) 시작 신호가 울리면 경기장을 이동하며 자기 팀 색상이 위로 오도록 콘을 뒤집는다.3) 같은 콘을 연속으로 두 번 터치할 수 없으며, 특정 친구를 두 개를 초과하여 따라다니며 뒤집을 수 없고, 한 번에 콘 하나만 뒤집어야 한다.4) 경기 종료 신호 시 손을 들고 즉시 멈추며, 바닥에 자기 팀 색상이 위로 향한 콘이 더 많은 팀이 승리한다.</p>
