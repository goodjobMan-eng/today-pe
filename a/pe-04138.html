<h1>데일리 스트레칭 및 웜업 루틴</h1>
<p>1) 2~3분간 즉석 신체활동을 한 뒤 지정된 홈베이스 스팟으로 모인다. 2) 홈베이스 자리에 서서 교사와 학생이 숫자를 번갈아 세며 포스터에 제시된 스트레칭을 순서대로 진행한다. 3) 컬업과 푸시업을 가볍게 수행하며 몸을 푼다. 4) 5~6주 후 학급이 준비되면 학생 리더가 포스터를 보고 직접 스트레칭을 진행하도록 이끈다.</p>
