<h1>짝꿍 허들 넘고 터널 통과하기</h1>
<p>1) 두 명이 짝을 이루어 한 명은 바닥에 엎드리거나 네발기기(다리 자세)로 장애물 역할을 맡는다. 2) 다른 한 명은 짝의 몸 위를 가볍게 점프하여 뛰어넘은 뒤 즉시 몸을 돌린다. 3) 짝이 양손과 발로 다리(터널) 모양을 만들면 그 아래를 신속하게 기어서 통과한다. 4) 역할을 즉시 교대하여 정해진 시간 동안 점프와 터널 통과를 연속으로 몇 번 수행하는지 측정한다.</p>
