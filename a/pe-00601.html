<h1>음악에 맞춰 뛰는 리듬 점프 체조 제1탄</h1>
<p>1) 한 사람이 설 수 있는 공간만 확보하고, 가벼운 심호흡과 관절 돌리기로 몸을 풉니다. 2) 음악 비트에 맞춰 제자리에서 스텝을 밟으며 점프와 스트레칭 동작을 따라 합니다. 3) 팔꿈치와 무릎 맞닿기, 허벅지 아래 손뼉 치기, 발바닥 터치 등 리듬 동작을 차례로 이어서 합니다. 4) 다리 벌려 뛰기와 전신 크로스 점프를 연결하며 심폐지구력과 신체 협응력을 기릅니다.</p>
