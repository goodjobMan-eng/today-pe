<h1>최면술사 마임 놀이</h1>
<p>1) 한 사람이 최면술사가 되어 상대방의 눈앞에서 손을 뱅글뱅글 돌려 최면을 건다.2) 최면술사는 손바닥을 상대방 얼굴 앞 15~20cm 거리에 유지하며 손을 움직여 상대를 이끈다.3) 최면에 걸린 사람은 손바닥과 얼굴 거리가 떨어지지 않도록 손의 움직임을 그대로 따라 이동한다.</p>
