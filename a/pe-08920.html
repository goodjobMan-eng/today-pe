<h1>배구 오버핸드 패스(토스) 기본 자세 및 원리</h1>
<p>1) 손끝과 팔을 마름모 모양으로 만들고 손가락을 공 모양에 맞게 감싸듯 구부립니다. 2) 공의 무게중심을 맞추어 정수리 및 이마 위 위치에서 공을 맞이합니다. 3) 팔꿈치를 적당히 굽혔다가 어깨와 손목의 라인을 살려 손 모양 그대로 공을 밀어냅니다.</p>
