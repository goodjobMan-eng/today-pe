<h1>지장보살 술래잡기</h1>
<p>1) 가위바위보 등으로 술래와 도망자를 정한다. 2) 술래가 10을 세는 등 정해진 수를 세는 동안 도망자는 도망친다. 3) 수를 다 센 술래는 도망자를 쫓아간다. 4) 술래에게 태그된 사람은 그 자리에서 지장보살 자세를 취하고 굳는다. 5) 다른 동료가 다가와 공양물을 바치는 흉내를 낸 뒤 두 손을 모아 빌어주면 움직일 수 있게 되어 게임에 부활한다.</p>
