<h1>줄 서기 모이기 미션 게임</h1>
<p>1) 교실에서 체육복을 정돈해 바르게 개어 두는 옷 갈아입기 지도를 받는다. 2) 남녀 1열 또는 2열로 앞사람 머리가 겹치도록 정렬하는 대형을 연습한다. 3) 지정된 기구(철봉, 농구골대 등)를 터치하고 교사 앞으로 돌아와 대형대로 모인다.</p>
