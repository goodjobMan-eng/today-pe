<h1>포스퀘어 (배드민턴 게임)</h1>
<p>1) 배드민턴 코트를 4개 구역으로 나누고 1번부터 4번(왕/여왕 구역)까지 번호를 매긴 뒤 선수가 각 구역에 라켓을 들고 1명씩 들어간다. 2) 4번 구역의 왕 또는 여왕이 네트 너머로 서브를 넣어 랠리를 시작한다. 3) 셔틀콕이 자신의 구역에 떨어지거나 자신이 친 셔틀콕이 코트 밖으로 나가면 탈락한다. 4) 앞 번호 선수가 탈락하면 한 칸씩 왕/여왕 구역 쪽으로 이동하고 1번 구역에는 새 선수가 들어온다.</p>
