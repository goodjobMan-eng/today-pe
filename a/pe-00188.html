<h1>진놀이 잡을까 말까? — 라바콘 탈환 눈치싸움 &amp; 수비 돌진 페널티</h1>
<p>수비 출발선 앞 2~3m 지점에 라바콘 1개를 두고 공격 팀이 천천히 다가갑니다. 공격수가 라바콘을 잡고 도망갈 때는 수비수 누구나 튀어나와 터치할 수 있으며 공격선까지 무사히 가져오면 1점입니다. 단, 공격수가 아직 콘을 잡지 않았는데 수비수가 먼저 뛰어나왔다가 아무도 터치하지 못하면 그 수비수가 오히려 아웃됩니다(이닝당 콘 탈환 기회 3회).</p>
