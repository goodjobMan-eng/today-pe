<h1>인성 배드민턴</h1>
<p>1) 직사각형 게임장 중앙에 네트를 설치하고 4명씩 모둠을 구성한다. 2) 4개의 인성 바구니, 배드민턴 라켓, 셔틀콕을 준비하며 한 사람당 10개의 셔틀콕을 가지고 시작한다. 3) 셔틀콕을 쳐서 네트 너머에 있는 4개의 인성 바구니에 모두 넣으면 1점을 얻는다. 4) 네 명의 셔틀콕을 모두 친 후 점수를 많이 얻은 모둠이 이긴다.</p>
