<h1>피트니스 릴레이</h1>
<p>1) 3인 1조 6개 팀으로 나누어 콘 뒤에 줄을 서서 대기한다. 2) 신호가 울리면 매트로 달려가 사전에 지정된 운동(예: 팔굽혀펴기 10회)을 수행한다. 3) 운동을 마치면 팀으로 돌아와 다음 주자의 손을 터치한다. 4) 경쟁 방식일 경우 주자가 돌아와 맨 뒤에 앉으며, 전원이 먼저 앉은 팀이 승리한다.</p>
