<h1>가을 밸런스 게임 타바타 신체활동</h1>
<p>1) 화면 좌우에 제시된 두 가지 가을 주제 선택지(예: 호박밭 술래잡기 vs 옥수수 미로 숨바꼭질)를 확인한다. 2) 자신이 더 선호하는 선택지 아래에 표시된 운동 동작을 정해진 타이머 동안 제자리에서 따라 한다. 3) 선택지 투표와 운동 수행을 완료한 뒤 다음 라운드로 이동하며 점수 경쟁 없이 전원 참여한다. 4) 중간중간 다른 그림 찾기 및 요시와 동키콩 달리기 응원 미니게임을 섞어 활력을 높인다.</p>
