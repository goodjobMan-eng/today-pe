<h1>소방관 릴레이</h1>
<p>1) 한쪽 끝에 물이 가득 찬 컵 1개와 빈 컵 1개를 두고, 약 15~25보 떨어진 반대편에 빈 컵 1개를 놓는다. 2) 물이 든 컵을 들고 반대편으로 이동해 빈 컵에 물을 붓는다. 3) 물을 부을 때마다 1점을 획득하며 1분 동안 이를 반복한다.</p>
