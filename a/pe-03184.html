<h1>민첩성 기르기 운동</h1>
<p>1) 삼각콘과 줄 사다리를 준비한다. 2) 허리를 펴고 섰다가 바닥을 짚고 다리를 뻗은 후 돌아오는 엎드렸다 빠르게 일어나기, 짝의 동작을 재빨리 따라하기를 실시한다. 3) 삼각콘 사이를 지그재그로 통과하거나 5개의 삼각콘을 별 그리는 순서대로 달려가 손으로 살짝 친다. 4) 줄 사다리 칸을 옆으로 한 발씩 뛰며 이동하거나 양발을 벌렸다 모아뛰며 앞으로 빠르게 이동한다.</p>
