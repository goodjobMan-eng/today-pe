<h1>마피아 술래잡기</h1>
<p>1) 학급 전체가 원형으로 둘러앉아 눈을 감고 고개를 숙여 엎드린다. 2) 교사가 돌아다니며 등이나 어깨를 터치해 마피아(술래) 5명을 비밀리에 지정한다. 3) 교사의 신호에 마피아만 고개를 들어 서로가 누구인지 얼굴을 확인한 후 다시 엎드린다. 4) 호루라기 신호 후 3초가 지나면 마피아가 일반 학생들을 터치하며, 터치당한 학생은 무대 위로 올라가 탈락한다.</p>
