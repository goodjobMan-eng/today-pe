<p>28명 기준 전원이 책상에 엎드려 눈을 감으면 교사가 비밀리에 천사 3명을 지정한 뒤, 공개 좀비 술래 2명을 뽑고 2분 타이머를 켭니다. 교실 안에서는 좀비와 시민 모두 절대 뛸 수 없고 걷기만 가능하며, 좀비에게 터치당한 시민은 그 자리에 앉습니다. 비밀 천사는 좀비 몰래 앉아 있는 시민을 터치해 부활시키며, 2분 후 생존자가 10명 이상이면 시민·천사 팀이 승리합니다.</p>
