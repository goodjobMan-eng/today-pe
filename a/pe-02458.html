<h1>수건을 이용한 스트레칭</h1>
<p>1) 수건을 어깨너비로 잡고 앞으로 뻗거나 머리 뒤로 넘기며 팔과 어깨를 늘려준다. 2) 수건을 잡은 팔을 좌우로 천천히 넘기며 옆구리를 늘려준다. 3) 수건을 목 뒤에 걸고 머리를 뒤로 젖히며 목 주변 근육을 풀어준다. 4) 의자에 앉아 수건을 한쪽 발바닥에 걸고 무릎을 펴 올리며 다리 뒤쪽을 늘려준다.</p>
