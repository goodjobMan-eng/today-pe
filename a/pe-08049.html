<h1>어린이 테니스 기초 레슨</h1>
<p>1) 신호에 따라 조깅, 사이드스텝, 무릎 높여 스킵, 뒤로 뛰기 등의 동작을 수행한다. 2) 콘 뒤집기 대결을 진행하고, 짝과 발 안쪽으로 공을 주고받는다. 3) 워리어 자세(어깨너비보다 넓게 서서 무릎 굽히기)로 공을 던져 바운드 후 잡는다. 4) 라켓 2개 사이에 공을 끼워 잡거나, 네트 너머로 백핸드 타구 및 랠리를 연습한다.</p>
