<h1>물건 던지기 (올림피아드)</h1>
<p>1) 경기장에 라바콘 등을 활용하여 흰색(1점), 초록색(2점), 파란색(3점), 빨간색(4점) 구역을 먼 거리 순으로 설치한다. 2) 투척자는 출발선 뒤에 위치하고 신호에 맞춰 물건을 최대한 먼 구역으로 던진다. 3) 1인당 총 3회의 투척 기회를 부여하며, 그중 가장 좋은 기록(최고 득점)을 최종 점수로 반영한다. 4) 모든 투척이 끝난 후 개인 또는 팀별로 가장 높은 점수를 획득한 쪽이 승리한다.</p>
