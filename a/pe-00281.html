<h1>유산소 운동을 하는 교실 트레이닝</h1>
<p>1) 자신의 책상 옆이나 교실 빈 공간에 바르게 선 채 영상을 보며 유산소 체력 운동을 시작합니다. 2) 제자리 점핑잭(팔벌려뛰기)과 무릎 올려 뛰기를 일정 시간 동안 지속하고, 이어서 크로스 스텝과 엉덩이 치며 뛰기를 리듬에 맞추어 반복합니다. 3) 스쿼트 점프와 양발을 앞뒤로 교차하는 런지 동작을 수행합니다. 4) 마지막으로 슬로우 버피 테스트를 10회 실시하며 유산소 운동을 마무리합니다.</p>
