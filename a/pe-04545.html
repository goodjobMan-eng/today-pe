<h1>글러브로 공 잡는 방법과 땅볼 잡기</h1>
<p>1) 글러브를 세우거나 손바닥이 위를 향하게 하지 않고 주머니 쪽이 보이도록 옆으로 눕혀서 잡는다. 2) 공이 오기 전에 미리 팔을 뻗고 기다렸다가 충격을 흡수하며 공을 맞이한다. 3) 땅볼을 잡을 때도 글러브 위를 손으로 덮어 공이 튀는 것을 막는다. 4) 땅볼이 멀리서 올 때 미리 몸을 숙이고 잡을 준비를 한다.</p>
