<h1>줄넘기 기초 릴리즈 3가지 동작</h1>
<p>1) 손을 뻗은 상태에서 왼손으로 줄을 오른손에 한 바퀴 감은 뒤 튕겨서 손잡이를 잡는다. 2) 왼발을 앞으로 뻗어 다리를 꼬고 줄을 팽팽하게 당겨 크로스한 뒤, 왼손을 위로 돌려 던지고 잡는다. 3) 줄을 몸 앞에서 옆으로 돌려 왼손을 등 뒤 허리로 넘긴 후 던져서 잡고, 반대 손을 연속으로 돌려 캐치한다. 4) 배운 1번부터 3번 동작을 리듬에 맞춰 자연스럽게 연결하여 연습한다.</p>
