<h1>득템 무빙 원마커</h1>
<p>1) 팀원이 빈백을 바닥으로 슬라이딩시켜 무빙 원마커 위에 올린다.2) 빈백을 올리는 데 성공하면 나와 있는 팀원과 함께 정해진 운동(런지 2회, 점프 회전 2회, 푸시업 2회 등)을 수행한다.3) 올리지 못하면 운동 없이 사람만 교체된다.4) 먼저 3개를 달성한 팀이 승리한다.</p>
