<h1>새학기 이름 획득 게임</h1>
<p>1) 참가자들은 시트지 왼쪽 상단에 개인 번호를 기록합니다. 2) 참가자들은 시트지와 연필을 들고 이동하여 원하는 상대와 가위바위보 대결을 합니다. 3) 가위바위보를 이기면 상대방 이름 중 원하는 글자 하나를 얻습니다. 4) 이름 전체를 알 때까지 대결을 계속하여 가장 많은 이름을 획득한 사람이 승리합니다.</p>
