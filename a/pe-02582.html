<h1>스피킹 컵 쌓고 내리기(3-3-3 스태킹)</h1>
<p>1) 컵끼리 잘 포개어졌다 빠르게 뺄 수 있도록 아래에 구멍이 난 스태킹 컵을 준비한다. 2) 3개의 컵과 6개의 컵을 쌓고 내리는 기본 동작을 익힌다. 3) 컵을 3개씩 3세트 배치하는 3-3-3 스택을 순서대로 쌓은 후 다시 내린다. 4) 스태킹 전용 컵이 없는 경우 일반 종이컵을 활용하여 도전한다.</p>
