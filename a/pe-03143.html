<h1>1루 주먹 야구형 게임</h1>
<p>1) 6명씩 2개 모둠을 이루어 공격과 수비 위치에 선다. 2) 공격수는 주먹으로 공을 치고 1루를 밟은 뒤 되돌아 홈으로 들어온다. 3) 수비수는 공을 잡아 수비 홈에 있는 최종 수비수에게 던진다. 4) 최종 수비수가 공을 잡기 전에 공격수가 홈에 들어오면 1점을 얻고, 전원 공격이 끝나면 공수를 교대하여 점수가 많은 팀이 승리한다.</p>
