<h1>여기 여기 붙어라 창작 체조 게임</h1>
<p>1) 매트를 놓고 두 모둠으로 나누어 앉는다. 2) 1라운드는 제시어 카드를 확인하고 2명이 창작 체조 동작을 만든다. 3) 라운드가 올라갈수록 인원을 1명씩 추가하며 똑같은 제시어를 1분 이내로 표현한다. 4) 모든 인원수를 활용하여 표현을 완료하면 제시어 카드를 획득하며, 가장 많은 카드를 얻은 모둠이 이긴다.</p>
