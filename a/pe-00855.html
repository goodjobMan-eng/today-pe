<h1>마리오 vs 루이지 댄스 배틀 스톰프 &amp; 점프</h1>
<p>1) 시작 전 응원할 캐릭터(마리오 팀 또는 루이지 팀)를 선택합니다. 2) 화면 아래쪽 화살표에 맞춰 화면 위에서 내려오는 방향으로 발을 구르거나(스톰프) 점프합니다. 3) 게이지를 먼저 다 채우는 팀이 승리하며 중간중간 틀린그림찾기 등의 미니게임이 진행됩니다. 4) 마지막 레벨까지 박자에 맞춰 스텝을 밟으며 신나게 댄스 배틀을 완료합니다.</p>
