<h1>지구의 날 지구 캐릭터 요가 스트레칭</h1>
<p>1) 지구 캐릭터가 보여주는 워리어, 나무, 나비, 비행기 등 요가 동작을 확인한다. 2) 30초 타이머 동안 천천히 호흡하며 화면과 똑같은 자세를 바르게 유지한다. 3) 타이머 종료 후 안내음과 함께 반대쪽 다리와 팔로 전환하여 균형 잡힌 신체 발달을 돕는다. 4) 동작 사이에 편안한 자세로 호흡을 가다듬으며 환경의 소중함을 되새기는 이완 활동으로 마무리한다.</p>
