<h1>셔플보드 원반 투구 경기</h1>
<p>1) 양 팀 선수가 번갈아 가며 긴 큐를 이용해 원반을 밀어 코트 반대편 득점 구역으로 보낸다. 2) 원반이 10점, 8점, 7점 구역 선 안에 반 이상 들어가면 해당 점수를 획득하고 10-OFF 구역에 들어가면 10점이 감점된다. 3) 자신의 원반을 득점 구역에 넣거나 상대 원반을 쳐내어 밀어내는 전략을 사용한다. 4) 팀당 정해진 라운드를 진행한 후 누적 득점이 높은 팀이 승리한다.</p>
