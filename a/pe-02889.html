<p>1) 교실 바닥에 바구니 등을 이용해서 제기 농구 골대를 만든다. 2) 개인별로 제기를 차는 연습을 한다. 3) 제기를 찰 수 있는 만큼 찬 후 마지막에 바구니 골대를 향해 찬다. 4) 바구니 골대에 제기가 들어가면 보너스 점수를 추가로 받고, 돌아가며 도전해 더 높은 점수를 얻은 팀이 승리한다.</p>
