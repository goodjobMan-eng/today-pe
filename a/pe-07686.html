<h1>조각상 놀이</h1>
<p>1) 정해진 구역 안에서 자유롭게 뛰어다니거나 지정된 방식(한 발/양발 뛰기, 게걸음 등)으로 이동한다. 2) 진행자가 '궁수', '식탁', '꽃', '우승자', '황새', '지렁이', '풍차', '여왕' 등의 단어를 외치면 즉시 멈추고 해당 모습을 조각상처럼 흉내 낸다. 3) 진행자가 다음 신호를 줄 때까지 움직이지 않고 정지 상태를 유지한다.</p>
