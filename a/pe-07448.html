<h1>배 가라앉히기</h1>
<p>1) 술래는 폼볼을 들고 나머지 참가자들은 훌라후프를 허리에 둘러 쥐고 배가 되어 강당을 자유롭게 이동한다. 2) 술래는 폼볼을 던져 상대의 훌라후프 안을 통과시켜 배를 침몰시킨다. 3) 공이 훌라후프를 통과해 침몰한 참가자는 훌라후프를 바닥에 내려놓고 멈춰 선다. 4) 구출 방법은 다른 참가자가 자신의 훌라후프를 머리 위로 씌워 빼내 구해주거나, 하나의 훌라후프에 함께 들어가 함께 이동한다.</p>
