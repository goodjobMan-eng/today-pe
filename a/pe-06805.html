<h1>승진 배구 게임</h1>
<p>1) 4개 구역에 1~4번 학생이 한 명씩 들어가고 나머지 학생들은 대기열에 선다. 2) 가장 높은 자리인 4번 학생이 오버핸드로 서브를 넣으며 게임을 시작한다. 3) 이후 언더핸드로 공을 받아 상대 구역으로 넘기며, 실수한 학생은 밖으로 나가고 뒷번호 학생들이 승진하여 자리를 채운다.</p>
