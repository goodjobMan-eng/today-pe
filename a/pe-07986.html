<h1>풍선 배구 스파이크 챌린지</h1>
<p>1) 풍선을 공중에 띄우고 팔을 편 스파이크 동작으로 쳐서 천장에 맞힌다. 2) 천장에 맞고 내려오는 풍선은 최대 2번까지 터치하여 다시 스파이크를 시도할 수 있다. 3) 풍선이 천장에 닿지 않거나 바닥에 떨어지면 1단계부터 다시 시작하며 목표 횟수(최대 30개)까지 도전한다.</p>
