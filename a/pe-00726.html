<h1>뱅뱅 볼 (발로 차서 상자 밀어내기)</h1>
<p>1) 중앙선 근처에 종이상자 표적 여러 개를 배치하고 양 팀은 각자의 진영 출발선에 정렬합니다. 2) 신호가 울리면 자기 진영에 있는 공을 발로 차서 중앙의 상자 표적을 맞혀 상대 진영으로 밀어냅니다. 3) 공이 반대편으로 넘어가면 다시 가져오거나 굴러온 공을 멈춘 뒤 계속해서 상자를 향해 찹니다. 4) 정해진 경기 시간이 끝났을 때 상자가 상대 팀 진영 쪽으로 더 많이 넘어가 있는 팀이 승리합니다.</p>
