<h1>3학년 구르기 1차시(활동2)</h1>
<p>1) 조끼를 입은 또래 도우미(친샘)가 매트 위치에 대기한다.2) 학생들은 순서대로 이동하며 친샘 앞에서 앞구르기 등의 구르기를 시도한다.3) 친샘은 구르는 방향이 일정하게 유지되는지, 준비 자세나 다리 모으기가 잘 되는지 관찰하고 피드백을 제공한다.</p>
