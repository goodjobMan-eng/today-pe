<h1>터널 발야구 놀이</h1>
<p>1) 베이스는 홈 베이스 한 곳만 설치하고 공격과 수비 팀으로 나눈다. 2) 공격은 베이스에 공을 올려 두고 발로 찬 후, 1루로 달리는 것이 아니라 자신의 편 둘레를 정해진 바퀴수만큼 돈다. 3) 수비는 공을 가장 먼저 잡은 사람 뒤에 일렬로 서서 다리 사이로 공을 이어준다. 4) 수비의 마지막 사람이 공을 들고 홈 베이스로 뛰어와 공격 주자보다 먼저 베이스를 밟으면 아웃이 된다.</p>
