<h1>긴줄넘기 터널 통과 놀이</h1>
<p>1) 두 사람이 긴 줄을 잡고 사람이 진입하는 방향을 향해 줄을 돌린다. 2) 줄이 바닥을 치고 위로 올라가 가장 높이 형성되는 가운데 공간을 확인한다. 3) 줄을 뛰어넘지 않고 줄이 올라간 틈 사이로 멈추지 않고 연속해서 신속하게 걸어서 통과한다. 4) 앞사람이 통과하면 다음 사람이 음료수 자판기처럼 멈추지 않고 바로 이어서 들어간다.</p>
