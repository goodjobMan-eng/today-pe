<h1>내가 왕이다 진화 가위바위보 놀이</h1>
<p>1) 모든 참가자는 알 단계에서 바닥에 쪼그리고 앉아 양손으로 알 모양을 만들며 돌아다닌다. 2) 같은 단계에 있는 사람끼리 만나 가위바위보를 하여 이기면 다음 단계(알-병아리-닭-호랑이-사냥꾼-왕)로 진화한다. 3) 사냥꾼 단계에서 같은 사냥꾼을 이기면 왕에게 도전할 기회를 얻는다. 4) 왕과 최종 가위바위보를 하여 이기면 왕관을 넘겨받아 새로운 왕이 된다.</p>
