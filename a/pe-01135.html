<h1>원마커 징검다리 보물 줍기</h1>
<p>1) 3~4인 1조로 구성하고 팀마다 원마커 6~7장과 보물 바구니 1개를 지급하며 반환점에 콩주머니를 흩어놓는다. 2) 맨 앞 주자가 바닥에 원마커를 놓아 길을 만들고 조원들은 마커만을 밟으며 전진한다. 3) 뒤쪽 주자가 남은 마커를 앞사람에게 전달하며 징검다리를 이어 나가 반환점의 보물(콩주머니)을 줍는다. 4) 팀원 전체가 마커 위를 밟고 안전하게 출발선으로 되돌아와 가장 많은 보물을 모은 팀이 승리한다.</p>
