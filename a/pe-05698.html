<h1>말랑 플디 교실 칸잼</h1>
<p>1) 교실에서 4인 1조로 짝을 이루고 마주 보는 책상을 표적으로 설정한다.2) 던진 플라잉디스크가 앞쪽 책상 면을 맞고 떨어지면 1점을 획득한다.3) 파트너가 날아오는 디스크를 쳐서 책상에 맞히면 2점, 책상 밑으로 통과하면 3점을 얻는다.4) 파트너가 쳐서 책상 위에 올리거나 디스크가 책상 위에 머무르면 5점을 얻으며, 책상 틈 사이로 들어가면 즉시 21점이 되어 승리한다.</p>
