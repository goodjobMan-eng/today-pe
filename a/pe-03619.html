<h1>팀 조끼 피구</h1>
<p>1) 양 팀은 자기 진영 벽에 붙어 대기하다가 신호가 울리면 가운데에 놓인 팀 조끼를 향해 달려가 잡는다. 2) 잡은 팀 조끼를 던져 상대 팀 친구를 맞힌다. 3) 공중에 던져진 팀 조끼가 바닥에 떨어지면 아웃이며, 아웃된 사람은 외곽의 원마커 위치로 이동한다. 4) 같은 팀 친구가 팀 조끼를 노바운드로 잡아내면 아웃된 친구가 다시 경기장 안으로 되살아나 복귀한다.</p>
