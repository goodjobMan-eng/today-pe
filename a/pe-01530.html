<h1>비닐봉지 풍선 공중 제어 캐치 놀이</h1>
<p>1) 비닐봉지에 공기를 넣어 묶은 뒤 손바닥으로 쳐올리며 바닥에 떨어뜨리지 않는 연습을 한다. 2) 봉지를 높이 띄운 뒤 박수를 치거나 머리·어깨·엉덩이 등 지정된 신체 부위를 터치하고 캐치한다. 3) 봉지를 띄우고 바닥에 엉덩이를 대고 누워 두 발 사이에 끼워 잡는 하체 캐치 미션을 수행한다. 4) 봉지를 던진 후 제자리에서 1바퀴 회전하거나 재미있는 자유 포즈를 취한 뒤 안정적으로 잡아낸다.</p>
