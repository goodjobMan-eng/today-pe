<h1>가정형 신체활동(누워서 다리 당기기·밸런스·버피·클라이밍)</h1>
<p>1) 누워서 한쪽 다리를 접어 반대쪽 다리에 올리고 몸쪽으로 당겨 유연성 운동을 한다. 2) 한쪽 다리로 중심을 잡고 반대쪽 발끝으로 목표점을 터치하는 밸런스 운동을 한다. 3) 팔굽혀펴기 자세에서 발을 대각선 손 쪽으로 교차 터치한 후 양발을 모아 높이 뛰는 크로스 버피를 한다. 4) 엎드린 자세에서 무릎을 당겨 교차 스텝 후 무릎을 어깨 높이 측면으로 당기는 클라이밍 니업을 실시한다.</p>
