<h1>칸 속의 술래 피하기 게임</h1>
<p>1) 3명씩 4개 모둠으로 나누어 2개 모둠은 출발선에 서고 2개 모둠은 술래 구역 칸에 한 명씩 나누어 섭니다. 2) 출발선의 모둠원은 술래 구역의 술래를 피해 도착선으로 이동합니다. 3) 술래는 정해진 구역 안에서만 지나가는 상대를 잡으며, 술래를 피해 도착선에 가면 1점을 얻습니다. 4) 술래에게 잡히거나 도착선에 닿으면 출발선으로 돌아가 다시 달리며 역할을 번갈아 진행합니다.</p>
