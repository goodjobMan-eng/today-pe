<h1>가족과 풍선 주고받기 미션</h1>
<p>1) 매트를 바닥에 깔고 양쪽에 마주 보고 선다.2) 타이머를 1분으로 설정하고 풍선을 서로 주고받는다.3) 풍선이 바닥에 떨어지거나 매트 구역을 벗어나지 않도록 유지하며 1분 동안 30회(어른은 50회) 이상 주고받는 미션을 달성한다.</p>
