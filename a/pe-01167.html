<h1>순환 볼링 릴레이</h1>
<p>1) 4인 1모둠으로 번호를 정하고 1번은 투구선, 4번은 핀 옆에 대기하며 볼링핀 10개를 세운다. 2) 1번이 공을 굴려 핀을 쓰러뜨리면 4번은 공을 잡아 다음 주자인 2번에게 전달하고 대기열 뒤로 이동한다. 3) 1번은 앞으로 달려가 넘어진 볼링핀을 다시 세운 뒤 다음 공을 잡기 위해 핀 옆에서 대기한다. 4) 정해진 제한 시간(3분) 동안 모둠원들이 계속 순환하며 쓰러뜨린 볼링핀의 총합으로 승부를 겨룬다.</p>
