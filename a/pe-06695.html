<h1>할로윈 스테이션 기초 이동 및 신체 훈련</h1>
<p>1) 체육관을 돌며 지시에 맞춰 말 타기(갤럽)나 외발 뛰기 등 이동 기술(locomotor skills)로 몸을 푼다 2) 훌라후프 안에 서서 한 발로 균형을 잡는 밸런스 스테이션을 수행한다 3) 줄사다리(애질리티 래더)를 피하며 두 발 또는 한 발로 호핑 스텝을 연습한다 4) 스테이션 간 이동 신호가 울리면 체육관을 가볍게 조깅하여 다음 스테이션으로 순환한다</p>
