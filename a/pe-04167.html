<h1>핀 피구(볼링핀 쓰러뜨리기 피구)</h1>
<p>1) 각 팀 진영 엔드라인 부근에 볼링핀 3개를 세우고 중앙선에 공을 배치한다. 2) 각 팀에 아웃된 선수를 터치해 부활시키는 닥터 1~2명을 지정한다. 3) 공에 맞아 아웃되면 자리에 앉고 팀 닥터가 어깨를 쳐주면 다시 경기에 참여한다. 4) 상대 팀의 볼링핀 3개를 먼저 모두 쓰러뜨리거나 상대 팀 전원을 아웃시킨 팀이 승리하며, 자기 팀 핀이 쓰러지면 아웃된 전원이 부활한다.</p>
