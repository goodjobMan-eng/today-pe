<h1>사냥 매 놀이 (알코네스 카사도레스)</h1>
<p>1) 운동장에 나무 역할을 하는 후프를 여러 개 배치하고 각 후프 안에 매(학생)를 1명씩 배치한다. 2) 학생들은 서로 신호를 주고받거나 이름을 부르며 비어 있는 다른 후프(나무)로 자리를 바꾼다. 3) 규칙에 익숙해지면 후프 2개를 빼서 매 2명을 술래로 만들고, 다른 학생들이 자리를 바꿀 때 빈 후프를 차지하게 한다. 4) 후프를 차지하지 못해 남겨진 학생이 새로운 술래가 되어 빈자리를 찾아 들어간다.</p>
