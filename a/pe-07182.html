<h1>점프 점프 핏</h1>
<p>1) 2인 1조로 짝을 짓고 한 명은 줄넘기를, 다른 한 명은 바닥에 5개의 원마커를 배치한다. 2) 1분 동안 줄넘기 담당은 넘은 횟수를 세고, 원마커 담당은 지정된 패턴 경로를 왕복하며 완료한 횟수(랩)를 센다. 3) 1분이 지나면 역할을 맞바꾸어 동일하게 운동을 수행한다.</p>
