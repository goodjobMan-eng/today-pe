<h1>월볼(벽치기 공놀이)</h1>
<p>1) 대기자는 벽 옆에 줄을 서서 기다리고, 서버는 바닥 코트선에서 공을 튀긴 뒤 손으로 벽을 향해 쳐서 시작한다. 2) 공이 코트 구역 안에 바닥 1회 바운드된 후 상대 선수는 바닥에 두 번 튀기 전에 다시 벽을 향해 쳐낸다. 3) 공이 2번 바운드되거나, 바운드 없이 벽을 맞히거나, 벽을 맞히지 못하거나, 라인 밖으로 나가면 아웃되어 다음 대기자와 교체된다.</p>
