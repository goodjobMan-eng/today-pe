<h1>4 대 4 하키형 게임</h1>
<p>1) 네 명씩 두 모둠으로 나누고 2m 간격으로 콘 두 개를 마주 보게 놓아 골대를 만듭니다. 2) 가위바위보로 선공을 정해 자기 골대에서 시작하며, 공을 몰거나 패스해 상대 영역으로 들어갑니다. 3) 상대 콘 사이로 공을 쳐 넣으면 1점을 얻으며, 골키퍼는 두고 골대 바로 앞을 막아서는 수비는 금지됩니다.</p>
