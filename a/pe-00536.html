<h1>신문지 막대 점프 놀이</h1>
<p>1) 돌돌 만 신문지 막대를 바닥에 낮게 두고 아이를 향해 앞뒤 또는 회전하며 움직여 줍니다. 2) 아이는 다가오는 신문지 막대를 타이밍에 맞춰 두 발로 점프하여 넘습니다. 3) 막대를 위아래로 번갈아 흔들면 아래로 올 때는 점프하고 위로 올 때는 앉아서 피합니다. 4) 역할을 바꾸어 아이가 막대를 돌리고 다른 사람이 점프하는 방식으로도 진행합니다.</p>
