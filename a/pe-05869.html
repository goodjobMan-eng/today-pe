<h1>두루마리 휴지 균형 구르기 챌린지</h1>
<p>1) 손바닥을 활짝 펴고 그 위에 두루마리 휴지를 올려놓는다.2) 휴지를 손가락으로 쥐지 않고 손바닥의 균형만 유지하며 어깨 앞구르기를 실시한다.3) 이어서 휴지를 떨어뜨리지 않고 그대로 뒤구르기까지 연속으로 수행한다.</p>
