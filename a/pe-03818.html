<h1>의자 요가 스트레칭</h1>
<p>1) 의자 앞쪽에 걸터앉아 무릎을 굽히고 손을 깍지 끼워 손바닥이 밖을 향하게 머리 위로 올려 30초간 호흡하며 뻗는다. 2) 양팔을 옆으로 벌려 T자를 만든 뒤 코로 숨을 들이마시며 팔꿈치를 접어 어깨를 짚고 입으로 내쉬며 편다. 3) 어깨를 귀 쪽으로 으쓱 올리며 숨을 들이마시고 내쉬며 내리는 동작을 30초간 반복한다. 4) 의자 뒤에 서서 등받이를 한 손으로 잡고 다른 손으로 발목을 잡아 허벅지 앞쪽을 30초간 늘려준다.</p>
