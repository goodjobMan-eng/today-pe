<h1>슬래퍼즈</h1>
<p>1) 체육관 구석에 4개의 골대를 벽을 향하게 배치하고 4개 팀으로 나눈다. 2) 코트에 4개의 탄성 공을 넣고 손바닥으로 공을 쳐서 이동시킨다. 3) 공을 던지거나 잡거나 굴리거나 공을 쥐고 달릴 수 없으며 손으로만 쳐야 한다. 4) 공을 벽에 맞히거나 패스하여 상대 골대에 넣어 득점한다.</p>
