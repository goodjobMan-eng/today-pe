<h1>콩주머니 주고받기 술래잡기 놀이</h1>
<p>1) 두 명씩 짝을 이루어 서로 마주 보고 선다. 2) 콩주머니를 서로 주고받는다. 3) 신호에 따라 콩주머니를 들고 있는 사람은 술래가 되고 없는 사람은 피하는 사람이 되어 게임을 진행한다. 4) 술래에게 태그된 사람은 신체활동 과제를 수행하고 그렇지 않으면 게임을 계속 이어간다.</p>
