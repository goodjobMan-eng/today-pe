<h1>후프 잇 업 (Hoop It Up)</h1>
<p>1) 팀별 콘을 두고 2인 1조로 짝을 지어 줄넘기 두 줄을 나누어 쥔다. 2) 신호가 울리면 이동하여 줄넘기 두 줄을 바닥의 훌라후프 밑으로 넣어 손과 발을 쓰지 않고 후프를 들어 올린다. 3) 후프가 떨어지지 않게 둘이서 운반하여 팀 콘에 내려놓아 점수를 얻는다. 4) 운반 중 후프가 떨어지면 그 자리에 멈춰 손발 없이 줄넘기로 다시 들어 올려야 하며 모든 후프를 다 가져오면 라운드가 끝난다.</p>
