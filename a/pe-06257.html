<h1>위드 런 (그림자 놀이와 오른쪽에 서라)</h1>
<p>1) 가위바위보로 토끼(이긴 사람)와 호랑이(진 사람) 역할을 정합니다.2) 토끼가 정해진 공간을 도망치면 호랑이는 갤로핑이나 호핑 동작으로 뒤따라갑니다.3) 15초 뒤 그만 신호에 멈춰서 호랑이가 손을 뻗어 토끼를 닿으면 호랑이 성공이고, 이후 역할을 바꾸거나 오른편에 서서 같은 동작을 따라 하는 방식으로 진행합니다.</p>
