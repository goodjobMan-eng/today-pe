<h1>긴 줄넘기 가는 줄 연속 타이밍 통과하기</h1>
<p>1) 두 사람이 긴 줄넘기를 잡고 일정한 속도와 높이로 연속해서 돌린다. 2) 줄이 바닥에 닿는 순간의 회전 리듬에 맞춰 줄을 등지지 않고 줄을 따라 달린다. 3) 줄에 걸리지 않고 한 바퀴 회전마다 한 명씩 연속으로 통과하여 연속 성공 횟수를 기록한다. 4) 연속 통과 인원을 늘리거나 줄 가운데서 한 번 점프한 뒤 빠져나가는 방식으로 변형한다.</p>
