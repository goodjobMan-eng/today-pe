<h1>발야구 공 굴리기와 차기 기초 기능</h1>
<p>1) 투수는 공을 빠르게 굴릴 때 자세를 낮추고 손목 스냅을 이용해 바닥으로 빠르게 굴린다. 2) 정확하게 굴릴 때는 몸을 살짝 돌린 후 목표 지점을 향해 천천히 정확하게 굴린다. 3) 타자는 정지된 공을 발등(강한 타구) 또는 발 안쪽 인사이드(방향 조절)로 찬다. 4) 굴러오는 공은 마음속으로 하나, 둘, 셋 박자를 세며 타이밍을 맞춰 찬다.</p>
