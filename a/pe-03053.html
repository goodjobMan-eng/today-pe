<h1>농구 기본 패스 연습</h1>
<p>1) 두 손으로 공을 잡고 배와 가슴 쪽으로 끌어당겼다가 팔을 앞으로 뻗으며 10번 체스트 패스를 연습한다. 2) 오른발이나 왼발을 한 발 내밀며 체스트 패스를 10번 연습한다. 3) 공을 바닥에 한 번 튕겨 보내는 바운드 패스를 10번 연습한다. 4) 머리 뒤에서 앞으로 보내는 오버헤드 패스와 한 손으로 미는 원핸드 패스 및 베이스볼 패스를 각각 10번씩 연습한다.</p>
