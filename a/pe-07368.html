<h1>킨볼 서바이벌</h1>
<p>1) 공을 가진 사람은 다른 사람을 향해 킨볼을 던져 맞힌다. 2) 공에 맞은 사람은 아웃되어 탈락한다. 3) 공격받을 때 날아오는 공을 피하거나 직접 잡으면 공격권이 자신에게 넘어온다. 4) 마지막 한 명이 남을 때까지 피하고 공격하며 끝까지 살아남은 사람이 승리한다.</p>
