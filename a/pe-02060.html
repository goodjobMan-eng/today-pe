<h1>넷볼 주요 파울 및 기본 규칙</h1>
<p>1) 드로인은 해당 지역 경기자가 라인으로부터 15cm 내에서 패스한다. 2) 수비 시에는 공을 가진 선수로부터 0.9m 이상 떨어져야 한다. 3) 공을 가진 채 두 걸음 이상 걷거나, 드리블하거나, 공을 굴려 패스할 수 없다. 4) 센터패스는 센터서드 안에서 신호에 맞춰 들어온 선수에게 패스하여 시작한다.</p>
