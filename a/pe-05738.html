<h1>구르기 4단계 순환 활동</h1>
<p>1) 매트 옆 활동 안내판을 확인하고 달걀처럼 구르기, 통나무처럼 구르기, 연필 모양처럼 구르기, 곰인형처럼 구르기를 수행한다.2) 준비 자세를 바르게 취한 후 천천히 몸을 굴린다.3) 신호에 맞춰 노란 팀은 주황 팀, 주황 팀은 파란 팀, 파란 팀은 연두 팀, 연두 팀은 노란 팀 자리로 순환 이동한다.4) 모둠원끼리 서로의 준비 자세와 구르기 동작을 관찰하고 피드백을 주고받는다.</p>
