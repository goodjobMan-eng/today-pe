<h1>양동이 너머 캐치볼 (Catch Everything)</h1>
<p>1) 짝과 양동이를 사이에 두고 마주 서서 양동이 속 공을 꺼낸다. 2) 상대방이 받을 준비 자세(ready hands)를 취했을 때만 양동이 너머 상대방 손으로 정확하게 공을 던진다. 3) 공을 놓치면 다시 주워서 던지며, 파트너와 연속으로 성공한 횟수를 센다. 4) 교사가 '스위치' 신호를 보내면 한 방향으로 이동하여 다음 양동이 스테이션으로 순환한다.</p>
