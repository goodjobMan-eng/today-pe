<h1>6방향 셔틀콕 풋워크 왕복 달리기</h1>
<p>1) 코트 중앙을 홈 포지션으로 정하고 전방·측면·후방 6개 구역에 접시콘을 각각 배치한다. 2) 홈 포지션에서 출발 신호와 함께 1번 구역 콘으로 달려가 셔틀콕을 올려놓고 다시 중앙으로 복귀한다. 3) 순서대로 2번부터 6번 구역까지 빠르게 달려가 셔틀콕을 하나씩 올려놓으며 전 구간 복귀 시간을 측정한다. 4) 배치가 끝나면 역순으로 각 구역의 셔틀콕을 하나씩 중앙으로 회수해 오는 방식으로 변형하여 진행한다.</p>
