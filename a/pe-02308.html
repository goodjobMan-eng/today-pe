<h1>문어의 꿈 미션 줄넘기</h1>
<p>1) 음악 신호에 맞춰 양발 모아뛰기 1도약, 양발 모아뛰기 2도약, 조깅 스텝, 좌우 벌려뛰기, 앞뒤 벌려뛰기, 복싱 스텝 순으로 줄에 걸리지 않고 뛴다. 2) 후렴구 안내 멘트에 따라 오래 뛰기를 시작한다. 3) 오래 뛰기 중 줄에 걸린 사람은 즉시 그 자리에 앉는다. 4) 음악이 끝날 때까지 걸리지 않고 서서 뛰면 미션을 성공한다.</p>
