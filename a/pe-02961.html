<h1>줄넘기 더블 크로스 기술</h1>
<p>1) 첫 번째 손(예: 왼손)을 먼저 안쪽으로 넣어 크로스 동작을 합니다. 2) 아래쪽이 아닌 어깨 정도 높이까지 손을 들어 올립니다. 3) 필요한 만큼만 움직여 반대 손(예: 오른손)을 교차하여 안으로 넣어 줍니다.</p>
