<h1>공 다리 사이 통과 달리기</h1>
<p>1) 공을 바닥에 두고 앞으로 가볍게 발로 찹니다. 2) 공이 굴러가는 동안 재빨리 앞으로 달려가 공을 앞지릅니다. 3) 굴러가는 공 앞에서 다리를 벌리고 서서 공이 가랑이 사이로 지나가도록 합니다. 4) 공이 벽이나 장애물에 닿기 전에 다시 돌아뛰어 몇 번 통과시켰는지 횟수를 셉니다.</p>
