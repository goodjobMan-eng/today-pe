<h1>파우스트볼 (배구형 변형 게임)</h1>
<p>1) 배구 지주대에 140~160cm 높이로 고무줄을 치고 콘으로 코트 구역을 정한다. 2) 서브를 비롯해 팔이나 주먹으로 공을 칠 때마다 공은 바닥에 한 번씩 튀겨야 한다. 3) 공을 팀 내에서 패스한 뒤 주먹으로 상대 코트에 넘기며, 공이 두 번 튀기거나 줄 아래로 통과하면 실점한다.</p>
