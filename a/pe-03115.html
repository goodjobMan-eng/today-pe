<h1>축구 드리블과 방향 전환 기초 연습</h1>
<p>1) 디딤발을 공 옆에 두고 몸을 앞으로 살짝 숙여 짧게 톡톡 차며 드리블한다. 2) 공이 몸에서 너무 멀어지지 않도록 발이 닿는 거리 안에서 공을 다룬다. 3) 발 안쪽과 바깥쪽을 번갈아 사용하여 원하는 방향으로 공을 전환한다. 4) 양발을 교대로 사용하여 꼬깔이나 정해진 공간을 돌며 속도를 점차 높인다.</p>
