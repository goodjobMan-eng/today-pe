<h1>드리블로 떠나는 농구 여행</h1>
<p>1) 콘 위에 공을 얹어 지키는 아이스크림 콘 배틀로 몸을 푼다. 2) 바닥의 공을 손으로 들지 않고 튕겨 올리기, 양손 10회 드리블, 정해진 횟수(3회·6회·10회)로 지정 라인까지 이동하기를 수행한다. 3) 짝과 공 2개로 리듬 맞춰 드리블하기 및 드리블을 유지하며 가위바위보 술래잡기를 한다. 4) 구역 안에서 자신의 드리블을 지키며 상대 공을 쳐내는 개인전·팀전 드리블 생존 게임을 진행한다.</p>
