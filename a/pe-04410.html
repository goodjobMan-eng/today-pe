<h1>하키 핏</h1>
<p>1) 하키 스틱의 날을 테이블 높이보다 낮게 유지한다. 2) 매 라운드마다 새로운 사람이 시작한다. 3) 콘 뒤에 순서대로 줄을 선다. 4) 테이블에 기대지 않는다. 5) 공이 테이블 밖으로 나가면 마지막으로 공을 건드린 사람이 아웃된다.</p>
