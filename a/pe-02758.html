<h1>발야구 수비 시연 및 경기</h1>
<p>1) 수비수는 굴러오는 공을 잡을 때 한 발을 축으로 낮추고 무릎을 굽힌 안정된 자세로 정면에서 포구한다. 2) 공을 잡으러 갈 때는 동료와의 충돌을 방지하기 위해 반드시 큰 소리로 '마이' 콜을 외친다. 3) 앞선 수비수가 공을 놓칠 경우에 대비하여 뒤에 위치한 동료 수비수는 뒤쪽 커버 플레이를 준비한다. 4) 투수가 공을 굴려주고 타자가 킥을 한 뒤, 수비수는 포구하여 베이스의 동료에게 정확하게 언더핸드로 송구한다.</p>
