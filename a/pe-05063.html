<h1>벽을 활용한 물구나무서서 앞구르기 연습법</h1>
<p>1) 벽에 배를 대고 양손으로 바닥을 밀며 다리를 모아 10~15초간 버틴 후 굴러 내려온다.2) 익숙해지면 벽에서 주먹 2~3개 거리를 두고 등을 대고 물구나무서기를 한 뒤 발바닥으로 착지한다.3) 단 위에서 엉덩이를 높이 들고 배꼽을 보며 등을 둥글게 말아 구르는 감각을 익힌다.</p>
