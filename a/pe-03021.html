<h1>수건(팀조끼) 던지고 받기 도전 놀이</h1>
<p>1) 바닥에 원마커를 놓고 한 발을 올린 뒤, 1인당 수건(또는 팀조끼) 1개를 준비한다. 2) 수건을 머리 위로 던져 두 손 또는 한 손으로 10번 던지고 받기를 진행한다. 3) 수건을 머리 위로 던진 뒤 박수를 1번, 2번, 3번 또는 1-2-3-2-1 순서로 치고 받는다. 4) 수건을 머리 위로 던지고 머리, 어깨, 무릎, 발 신체 부위에 걸친 뒤 3초간 유지하거나 앉았다 일어서며 받기에 도전한다.</p>
