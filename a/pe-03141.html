<h1>색깔 술래잡기</h1>
<p>1) 경기장 바닥에 참가자 수보다 적은 수의 다양한 색 원판을 1m 간격으로 배치하고, 조끼나 모자로 표시된 술래를 뽑는다. 2) 술래가 중앙에서 주변에 존재하는 색깔 중 하나를 큰 소리로 외친다. 3) 참가자들은 해당 색깔 원판이나 물건(옷, 놀이기구 등)을 찾아 몸의 일부를 대어 안전을 확보한다. 4) 같은 색 구역에는 최대 2명까지만 머물 수 있으며, 15초 안에 색을 찾지 못해 술래에게 잡힌 학생이 다음 술래가 된다.</p>
