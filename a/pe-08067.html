<h1>유아 및 저학년 점프와 구르기 체조</h1>
<p>1) 매트 색깔을 밟으며 두 발로 점프하고 훌라후프를 통과한다. 2) 매트 위에 누워 손을 가슴에 모으고 통나무처럼 옆으로 구른다. 3) 무릎을 가슴으로 모아 안고 앞뒤로 흔들며 오뚝이 구르기를 한다. 4) 음악이 멈추면 인형을 줍는 프리즈 댄스 놀이로 마무리한다.</p>
