<h1>스텝 체인지-룸</h1>
<p>1) 참가자들은 바닥의 마커(룸)에 서고, 교사가 술래가 되어 8가지 기본 스텝 중 하나와 '체인지 룸'을 외친다.2) 모든 참가자는 외쳐진 스텝 방식으로 이동하여 빈 자리를 찾고, 술래도 빈 자리를 차지한다.3) 자리를 찾지 못한 참가자는 점핑잭 2회를 수행한 뒤 새로운 술래가 되어 다음 스텝을 외친다.4) 동시에 마커를 밟은 경우 가위바위보로 자리를 정한다.</p>
