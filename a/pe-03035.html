<h1>안전지대 술래잡기</h1>
<p>1) 바닥에 훌라후프나 원을 그리거나 라바콘을 놓아 안전지대를 설정한다. 2) 술래는 말랑한 공을 가지고 도망가는 친구들을 잡으러 다닌다. 3) 도망가는 친구가 안전지대(통 위나 원 안)로 피하면 술래가 잡을 수 없다. 4) 술래에게 공으로 터치되면 잡힌 사람이 새로운 술래가 된다.</p>
