<h1>짐볼 무한도전 피구</h1>
<p>1) 경기장 중앙에 놓인 의자에 한 팀이 앉고, 공격 팀은 짐볼을 굴려 앉아 있는 수비 팀을 맞힌다.2) 공에 맞으면 아웃되어 경기장 뒤편으로 나가며, 준비된 신체활동 과제를 수행하고 대기한다.3) 수비 팀 학생들은 스케이트 브레인 밴드(부활권)를 2~3개씩 나누어 가져 아웃될 때마다 밴드를 사용해 다시 경기에 참여할 수 있다.</p>
