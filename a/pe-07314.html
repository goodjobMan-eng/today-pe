<h1>코너 벤치 골 맞히기(발론 에스키나)</h1>
<p>1) 마당이나 강당 네 모퉁이에 벤치를 하나씩 놓고 각 모둠 학생들이 벤치 뒤에 배치된다. 2) 코트 중앙에 축구공을 올려두고 학생들에게 각자 번호를 배정한다. 3) 교사가 번호를 부르면 각 팀의 해당 번호 선수들이 중앙으로 달려 나온다. 4) 공을 차지하여 상대 세 팀의 벤치를 향해 슈팅해 벤치를 맞히면 득점한다.</p>
