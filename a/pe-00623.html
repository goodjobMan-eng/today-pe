<h1>초등학교 매트운동 발전 기술: 무릎 펴 뒤구르기(신슬후전)</h1>
<p>1) 매트 끝에 바르게 선 자세로 뒤구르기를 준비합니다. 2) 엉덩이가 바닥에 닿기 직전에 양손으로 매트를 짚으며 무릎을 곧게 편 채 회전을 시작합니다. 3) 엉덩이가 닿자마자 양손을 귀 옆으로 가져가 매트를 강하게 밀어낼 준비를 합니다. 4) 무릎을 완전히 편 상태를 유지한 채 손으로 매트를 힘껏 밀어내며 일어섭니다.</p>
