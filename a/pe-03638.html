<h1>초등 티볼 전원 타격 경기</h1>
<p>1) 수비는 안쪽 베이스를 밟고 공격은 바깥쪽 베이스를 밟으며, 볼루스는 반대쪽에 위치한다. 2) 쓰리아웃이 아닌 전원 타격 방식으로 진행한다. 3) 공수 교대 시 베이스에 남아 있는 잔루 주자 위치를 기억해 두었다가 다음 공격 때 이어 나간다. 4) 배트를 던지면 아웃 처리된다.</p>
