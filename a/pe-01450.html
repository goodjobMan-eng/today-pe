<h1>꽁치 뒤집기 짝 신체놀이</h1>
<p>1) 두 사람이 각각 꽁치와 생선가게 주인이 되어 꽁치 역할은 매트 위에 엎드려 전신에 힘을 주고 버팁니다 2) 신호가 울리면 생선가게 주인은 10초 동안 바닥에 엎드린 꽁치의 몸을 굴려 반대로 뒤집으려고 시도합니다 3) 제한 시간 안에 꽁치를 성공적으로 뒤집으면 생선가게 주인이 승리하고 버텨내면 꽁치가 방어에 성공합니다 4) 역할을 바꾸어 진행하거나 두 사람이 협동하여 한 명의 술래를 뒤집는 다인 협동 방식으로 변형합니다</p>
