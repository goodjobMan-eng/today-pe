<h1>스타워즈 키즈 요가 스트레칭</h1>
<p>1) 개인 매트 위나 교실 바닥에서 주변 친구와 닿지 않도록 팔을 뻗어 간격을 벌리고 준비한다. 2) 화면에 스타워즈 캐릭터가 등장하면 화면 속 요가 동작을 그대로 관찰하고 따라 한다. 3) 타이머가 진행되는 동안 몸의 긴장을 풀고 깊은 호흡을 유지하며 안정된 자세를 유지한다. 4) 한쪽 방향 자세가 끝나면 안내 음성에 맞춰 반대쪽 팔다리로 번갈아 수행하며 전신 균형을 맞춘다.</p>
