<h1>꼬꼬닭을 잡아라 (치킨 탈환 게임)</h1>
<p>1) 양 팀(빨강팀·파랑팀)으로 진영을 나누고 한쪽 진영 원 안에 통과 모형 닭을 배치한다. 2) 공격 팀은 상대 수비에게 태그되지 않고 원 안으로 달려가 모형 닭을 들어 올린다. 3) 수비 팀은 자기 진영으로 들어온 공격 선수를 태그하며 한 번에 한 명씩 후프 감옥으로 호송한다. 4) 감옥에 갇힌 선수는 팀원이 와서 터치해 주어야 풀려나며 공격 팀이 닭을 잡으면 승리한다.</p>
