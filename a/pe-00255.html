<h1>플로어볼 (스틱 패스·슛 경기)</h1>
<p>1) 골키퍼를 포함해 팀을 이루고, 경기 중앙 페이스오프 지점에서 심판 신호에 맞춰 경기를 시작합니다. 2) 스틱을 이용해 공을 패스하거나 드리블하여 상대 골대에 슛을 넣어 득점합니다. 3) 공격이나 슛을 할 때 스틱을 허리 높이 이상으로 들어 올리면 반칙이 선언됩니다. 4) 전·후반 각 10분 동안 경기를 진행하여 더 많은 골을 성공시킨 팀이 승리합니다.</p>
