<h1>핀 쓰러뜨리기</h1>
<p>1) 네 명이 한 모둠을 이루고 모둠에서 공 굴리는 순서를 정한다. 2) 모둠별로 한 명씩 순서대로 7m 또는 10m 거리를 선택하여 공을 굴린다. 3) 7m 거리에서 핀을 쓰러뜨리면 한 개당 1점, 10m 거리에서 쓰러뜨리면 한 개당 2점을 얻는다. 4) 모둠원의 점수를 모두 더해 가장 높은 점수를 얻은 모둠이 이긴다.</p>
