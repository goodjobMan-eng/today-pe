<h1>풍선 이어달리기</h1>
<p>1) 일자형: 2명씩 마주 보고 신문지를 함께 잡고 일자로 선 뒤 신문지로 풍선을 튕겨 옆 친구에게 전달하고 마지막 친구에서 다시 처음으로 되돌린다. 2) 원형: 2명씩 마주 보고 신문지를 잡고 둥글게 선 뒤 신문지로 풍선을 튕겨 전달하며 제한 시간 동안 최다 횟수를 달성한다. 3) 두 발은 바닥에 고정하여 움직이지 않는다. 4) 풍선이 밖으로 떨어지면 떨어진 지점부터 다시 시작한다.</p>
