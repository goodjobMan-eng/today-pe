<h1>풍선 무릎 끼워 점프 릴레이</h1>
<p>1) 두 팀으로 나누어 출발선에 정렬하고 각 팀 앞쪽 반환점에 라바콘을 세운다. 2) 각 팀의 1번 주자는 풍선을 가랑이 사이 또는 무릎 사이에 끼우고 준비한다. 3) 출발 신호에 맞춰 풍선이 빠지지 않도록 양발 모아 점프하며 반환점 라바콘을 돌아온다. 4) 출발선에 도착하여 다음 주자에게 풍선을 넘겨주고 모든 주자가 먼저 완주한 팀이 승리한다.</p>
