<h1>보너스 배려 배구 게임</h1>
<p>1) 한 팀에 6번의 공격 기회가 주어지며 세터가 공을 올려주고 스파이크나 공격으로 상대 코트에 떨어뜨리면 득점한다 2) 수비 팀이 공격 성공 전에 공을 잡으면 수비 팀도 1점을 획득한다 3) 배려 배구에서는 정해진 터치 횟수(팀원 수+1회) 동안 전원이 공을 터치하여 넘기면 공격 성공 여부와 상관없이 1점을 얻는다</p>
