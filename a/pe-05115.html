<h1>눈싸움 (크리스마스 체육 게임)</h1>
<p>1) 바닥 곳곳에 눈송이 역할을 할 팀조끼(빕스)를 인원수보다 많게 흩어 놓는다.2) 신호가 울리면 이동하며 바닥의 빕스(눈송이)를 빠르게 줍는다.3) 눈송이를 쥔 상태로 이동하여 다른 사람을 향해 던져 맞힌다.4) 눈송이로 상대를 맞히면 1점을 획득하며, 라운드 종료 시 가장 많은 점수를 얻은 사람이 승리한다.</p>
