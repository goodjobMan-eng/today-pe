<h1>제다이 트레이닝</h1>
<p>1) 경기장 경계선 주위 콘 위치마다 2~3명씩 줄을 서고 맨 앞 주자가 풀누들을 잡는다. 2) 신호가 울리면 맨 앞 주자들이 경기장 안으로 들어가 풀누들로 상대의 허리 아래를 가격한다. 3) 허리 아래를 맞은 주자는 탈락하며 풀누들을 머리 위로 들고 자기 줄로 돌아가 다음 주자에게 넘긴다. 4) 풀누들로 상대의 공격을 방어할 수 있으며 두 사람이 동시에 허리 아래를 맞추면 둘 다 탈락한다.</p>
