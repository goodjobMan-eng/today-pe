<h1>3대3 동서남북 점보성을 무너뜨려라</h1>
<p>1) 3명씩 두 팀을 구성하여 한 팀은 공격, 한 팀은 수비를 맡는다. 2) 경기장 동서남북 4개 위치에 점보 스택스(또는 고깔)로 성 표적을 쌓는다. 3) 공격 팀은 패스와 플로어볼 슛 기술을 활용하여 성을 넘어뜨린다. 4) 수비수 3명은 구역에 배치되어 공격수의 슛을 막거나 공을 밖으로 쳐내어 시간을 지연시킨다. 5) 3분간 진행한 뒤 공수를 교대하며, 쓰러뜨린 성의 개수가 더 많은 팀이 승리한다.</p>
