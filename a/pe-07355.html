<h1>링 체조 기본 동작 익히기</h1>
<p>1) 링의 높이를 적절히 맞추고 앞뒤 돌아돌기(überdrehen) 등 기초 동작을 연습한다 2) 앞쪽 또는 뒤쪽 흔들기를 통해 거꾸로 매달리기(sturzhang) 동작을 시도한다 3) 무릎 걸치기(kniehang) 상태에서 물구나무를 거쳐 착지하거나 창문 통과하기(Fenstersturz) 동작을 수행한다</p>
