<h1>크로스홉</h1>
<p>1) 가로세로 50cm 칸으로 된 크로스홉 매트(또는 라인 테이프)의 중앙 0번에서 준비합니다. 2) 신호와 함께 0-1-0-2-0-3-0-4 번호 순서대로 양발 점프하여 한 사이클을 수행합니다. 3) 1인당 20초 동안 양발 점프를 실시하여 사이클 및 추가 번호 성공 횟수(1점씩)를 측정합니다. 4) 경계선을 벗어나거나 순서를 틀리면 1회당 1점 감점되며 팀원의 점수를 합산합니다.</p>
