<h1>가디언 오브 더 캐슬</h1>
<p>1) 중앙에 콘으로 작은 원(성)을 만들고 바깥에 마커로 큰 원을 표시한다. 2) 수비팀은 중앙 콘 주변에 서고 공격팀은 큰 원 바깥에 서서 대기한다. 3) 신호가 울리면 공격팀은 큰 원 안으로 들어가 콘을 손으로 터치하고 태그당하기 전에 원 밖으로 빠져나온다. 4) 콘을 터치하고 무사히 탈출하면 개인 1점(팀 점수 합산)을 얻고, 원 안에서 태그당하면 점수 없이 밖으로 나갔다 다시 도전하며 2~3분 후 역할을 바꾼다.</p>
