<h1>축구공 콘 볼링</h1>
<p>1) 라바콘 10개를 볼링핀 모양(1-2-3-4개)으로 설치합니다. 2) 팀을 나누고 순서를 정해 출발선에서 콘 볼링핀을 향해 축구공을 발로 찹니다. 3) 차고, 쓰러뜨린 콘을 정리하고, 공을 가지고 돌아오는 순서로 진행하며 넘어진 콘 수만큼 득점합니다. 4) 10개를 먼저 모두 쓰러뜨리거나 돌아가며 찬 후 더 많이 쓰러뜨린 팀이 승리합니다.</p>
