<h1>식품군 블리츠 술래잡기</h1>
<p>1) 한두 명의 술래(셰프)가 중앙에 서고, 나머지 학생들은 식품군을 나타내는 빨강, 파랑, 초록, 노랑 팀 조끼를 입고 양 끝에 선다. 2) 중앙의 셰프가 특정 음식 이름을 외치면 해당 식품군 색깔의 조끼를 입은 학생들만 반대편 끝으로 태그를 피해 달린다. 3) 달리다 태그된 학생은 사이드로 이동하여 식품군 관련 활동을 수행하거나 중앙의 술래에 합류한다.</p>
