<h1>체력 증진 균형 잡기 운동</h1>
<p>1) 발을 어깨너비로 벌리고 양손을 허리에 올린 뒤 한 발로 서서 체중을 이동하며 제자리로 돌아온다(10회 3세트). 2) 양발을 모아 선 후 한 발을 들어 반대쪽 무릎 위에 올리고 양손을 머리 위로 뻗어 중심을 잡는다. 3) 한쪽 다리에 체중을 싣고 골반을 접어 다리는 뒤로 뻗고 양팔은 옆으로 뻗어 T자 자세를 만들어 10초간 버틴다.</p>
