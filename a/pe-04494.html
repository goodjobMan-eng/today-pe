<h1>축구 기초 발 다루기 및 차기</h1>
<p>1) 양발을 사용해 작은 터치로 공을 몸 가까이에 두며 선을 따라가거나 리더를 따라 드리블한다. 2) 발바닥으로 공을 바닥에 굴려보고 멀어지면 발로 멈춰 세운다(트랩). 3) 짝과 마주 보고 디딤발을 공 옆에 둔 뒤 발 안쪽(인사이드)으로 땅을 따라 패스한다. 4) 발등(신발 끈 부위)으로 큰 킥이나 슈팅을 연습하며, 혼자서 공을 바운드시키거나 떨어뜨린 후 차서 잡는 개별 연습을 진행한다.</p>
