<h1>핑퐁컵 스트라이크</h1>
<p>1) 출발선에서 원마커(표시선)까지 빠르게 이동한다.2) 바닥에 바운드하여 탁구공을 튕겨 반대편의 컵 안으로 넣는다.3) 공이 컵 안에 들어가면 해당 컵을 뒤집어 놓고 출발선으로 돌아와 다음 사람과 교대한다.4) 10개의 컵을 가장 먼저 모두 뒤집은 팀이 승리한다.</p>
