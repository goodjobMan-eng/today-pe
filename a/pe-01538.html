<h1>사방팔방 4골대 축구 게임</h1>
<p>1) 가로 30m 세로 15m 코트의 사방 4개 변 중앙에 5m 너비 골대를 콘으로 설치하고 팀 조끼로 팀을 나눈다. 2) 경기장에 축구공 4개를 동시에 투입하고 5분간 양 팀 각 8명의 선수가 동시에 경기를 진행한다. 3) 어느 골대에든 슛을 성공시키면 1점을 획득하며, 대기 선수는 나간 공 회수와 득점 기록 역할을 맡는다. 4) 공의 개수를 줄이거나 특정 발로만 패스하는 조건부 규칙을 더해 난이도를 조절한다.</p>
