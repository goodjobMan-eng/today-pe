<h1>위로 점프하며 연속으로 스틱 뛰어넘기</h1>
<p>1) 바닥에 일정한 간격으로 플레이스틱을 놓은 뒤 출발선에 순서대로 선다. 2) 신호가 울리면 첫 번째 주자가 모둠발로 점프하여 플레이스틱을 뛰어넘는다. 3) 모든 플레이스틱을 뛰어넘으면 일어서서 반환점을 돌아 뛰어 들어온다. 4) 두 번째 주자도 같은 방법으로 하며 마지막 주자가 가장 먼저 들어온 모둠이 승리한다.</p>
