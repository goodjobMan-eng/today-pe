<h1>명령 앞구르기</h1>
<p>1) 부모(지도자)가 가위바위보 손동작이나 구령으로 매트 동작을 지시한다. 2) 주먹이면 연필 구르기, 가위면 일반 앞구르기, 보면 비행기 앞구르기 등 약속된 동작으로 매트 위에서 앞구르기를 수행한다. 3) 가위바위보 대결로 변형하여 지도자에게 지는 손동작에 해당하는 구르기를 빠르게 판단하여 실시한다.</p>
