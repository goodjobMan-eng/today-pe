<h1>스쿠터 릴레이</h1>
<p>1) 출발선에서 스쿠터보드에 앉아 손을 손잡이 구멍 안쪽에 넣고 발을 굴러 출발한다. 2) 반환점 콘을 돌아 출발선으로 돌아와 다음 주자에게 인계한다. 3) 스쿠터를 연결하여 한 명은 정면을 보고 다른 한 명은 뒤를 보며 발을 굴러 반환점 콘에 볼링핀을 세우고 돌아온다. 4) 두 명이 탄 스쿠터 발 사이에 볼링핀을 끼우고 이동하거나 3명을 연결하여 콘을 돌아온다.</p>
