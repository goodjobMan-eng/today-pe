<h1>홈 트레이닝 신체활동 프로그램</h1>
<p>1) 양팔 벌려 뛰기는 양팔과 다리를 넓게 벌리며 높게 점프한다. 2) 무릎 대고 팔굽혀펴기는 무릎을 바닥에 대고 팔꿈치를 몸에 붙여 실시한다. 3) 플랭크는 엎드린 자세에서 머리, 어깨, 엉덩이, 발목이 일직선이 되도록 유지한다. 4) 브릿지는 천장을 보고 누워 무릎을 세우고 엉덩이를 들어올려 자세를 유지한다.</p>
