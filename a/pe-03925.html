<h1>팩맨 라인 태그 놀이</h1>
<p>1) 술래 4명을 정해 팀 조끼를 입히고, 학생들은 코트 라인과 원마커 위로만 걸어서 이동한다. 2) 술래와 도망자는 코트 라인을 벗어나거나 코너를 가로지를 수 없으며 걷기만 허용된다. 3) 술래에게 태그된 학생은 라인 밖으로 나가 한쪽 무릎을 꿇고 앉는다. 4) 다른 도망자가 다가와 하이파이브를 해주면 다시 살아나서 게임에 참여한다.</p>
