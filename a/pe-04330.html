<h1>엔드존 고</h1>
<p>1) 팀을 두 팀으로 나눕니다. 2) 코트 양 끝에 엔드존 구역을 표시합니다. 3) 시작 신호와 함께 중앙으로 달려가 콩주머니를 집습니다. 4) 콩주머니를 상대 팀 발을 향해 미끄러뜨려 맞히고, 성공하면 엔드존으로 이동해 팀원의 패스를 받아 터치다운합니다.</p>
