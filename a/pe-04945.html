<h1>줄넘기 앞돌려 뛰기 기초 점프 연습 (前回しとびドリル1)</h1>
<p>1) 줄 없이 제자리에서 공처럼 탄력을 이용해 점프하는 감각을 익힌다.2) 2인 1조로 한 사람은 점프하고, 다른 한 사람은 뒤에서 어깨나 등을 공처럼 가볍게 눌러주며 리듬을 맞춘다.3) 무릎을 과하게 굽히지 않고 발끝으로 수직 점프한다.4) 줄을 잡고 허리 부근에서 손목을 돌리며 공중에서는 힘을 빼고 착지 시 지면 반동을 받는다.</p>
