<h1>타고 버티기: 오래 버티기 게임</h1>
<p>1) 3팀으로 나눈 후 번호 순서대로 나와 기구에 오른다.2) 밸런스볼은 한 발로 버티고, 짐볼은 손이 공에 닿지 않게 한 발로 서서 눈을 감고 버틴다.3) 스스로 균형이 깨지면 조심스럽게 내려와 자기 자리에 앉는다.4) 일정 시간 후 10초 카운트다운을 세어 최종 버틴 사람에게 3점, 먼저 깨진 순서에 따라 점수를 차등 부여한다.5) 전원이 시도한 후 팀원들의 점수를 모두 합산하여 승패를 가린다.</p>
