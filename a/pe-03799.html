<h1>알파벳 글자 맞추기 체조</h1>
<p>1) 학생들은 체육관 내 자신의 개인 공간(바닥 자리)에 선다. 2) 교사가 제시한 단어(성 또는 이름)의 글자를 확인한다. 3) 벽에 붙은 포스터로 가 해당 글자에 적힌 운동을 확인한다. 4) 자신의 자리로 돌아와 해당 운동을 수행한 후 다음 글자를 확인하러 간다.</p>
