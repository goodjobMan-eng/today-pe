<h1>초보자 크롤영(자유형) 단계별 연습</h1>
<p>1) 얕은 수영장에서 원을 그리며 걷고 물 흐름을 느끼며 팔을 젓는다. 2) 물속에서 다리를 곧게 펴고 발끝을 세워 크롤 킥(발차기)을 연습한다. 3) 배영 자세로 먼저 팔 젓기 감각을 익힌 후 엎드린 자유형 자세로 전환하여 호흡과 연결한다.</p>
