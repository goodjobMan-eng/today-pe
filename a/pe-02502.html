<h1>어깨를 풀어주는 체조 전투</h1>
<p>1) 의자에 앉아 바른 자세를 유지하고 어깨를 으쓱거리며 가볍게 푼다. 2) 어깨를 앞뒤로 돌리는 동작을 진행한다. 3) 팔을 앞으로 뻗어 활을 쏘듯 당기는 화살 쏘기 동작과 대각선으로 주먹 치기 동작을 번갈아 실시한다. 4) 목 돌리기, 어깨 털기, 뒤로 팔 뻗기와 팔 크로스 동작을 순서대로 반복한다.</p>
