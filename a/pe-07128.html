<h1>가위바위보 반응 콘 터치 게임</h1>
<p>1) 두 참가자가 마주 보고 서고, 양옆에 콘을 각각 1개씩(오른쪽 콘, 왼쪽 콘) 배치한다. 2) 사전 구호를 정한다(예: 이기면 오른쪽, 지면 왼쪽). 3) 구호에 맞춰 가위바위보(손 또는 발)를 실시하고, 결과에 따라 지정된 콘으로 재빨리 달려가 먼저 터치한 사람이 승리한다. 4) 구호 규칙을 반대로 바꾸거나(이기면 왼쪽, 지면 오른쪽), 발 가위바위보 방식으로 변형하여 순발력과 판단력을 겨룬다.</p>
