<h1>강강술래 고사리 꺾기</h1>
<p>1) 참가자들은 손을 잡고 오른발은 세우고 왼발 무릎은 바닥에 닿게 앉아 앞뒤로 리듬을 탄다. 2) 대열 맨 앞사람부터 이동하며 손을 맞잡은 두 사람 사이로 통과한다. 3) 지나간 사람은 제자리에서 몸을 돌린 후 뒷사람 손을 잡고 일어선다. 4) 모든 사람이 일어설 때까지 동작을 이어가며 노래에 맞춰 놀이를 진행한다.</p>
