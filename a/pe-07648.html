<h1>엉덩이 핸드볼(큐큐볼)</h1>
<p>1) 모든 선수가 바닥에 엉덩이를 대고 앉은 상태로 두 팀으로 나뉩니다. 2) 경기 시작 시 공을 코트 중앙에 무작위로 던져 넣고 경기를 시작합니다. 3) 공을 가진 상태에서는 이동할 수 없으며, 엉덩이로 바닥을 밀며 이동하는 것은 공이 없을 때만 가능합니다. 4) 팀원끼리 패스를 주고받으며 상대 팀 골대에 슛을 던져 득점합니다. 5) 수비수는 상대의 패스를 공중에서 가로채서 공격권을 가져옵니다.</p>
