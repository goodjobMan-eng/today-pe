<h1>무지개 도로 달리기 준비운동</h1>
<p>1) 체육관 바닥에 1번 콘부터 시작해 빨강, 주황, 노랑, 초록, 파랑, 보라색 순서로 원마커를 배치해 이동 코스를 만든다. 2) 1번 콘에서 출발하여 색깔 순서대로 원마커 경로를 따라 달린다. 3) 보라색 원마커를 지나 다시 출발선 콘으로 돌아온다. 4) 타이머에 맞춰 약 5분 동안 일정한 페이스를 유지하며 코스를 반복해서 달린다.</p>
