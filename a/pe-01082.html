<h1>스카프 2장 공중 캐치 저글링</h1>
<p>1) 학생마다 천천히 떨어지는 저글링용 스카프 2장을 양손에 1장씩 잡고 가슴 높이에 든다. 2) 한 손으로 스카프를 위쪽 반대 방향으로 띄운 뒤, 반대 손의 스카프도 교차하여 공중으로 띄워 올린다. 3) 스카프가 천천히 허공에서 내려오는 궤적을 보며 손바닥을 아래(또는 위)로 향해 순서대로 공중에서 잡아챈다. 4) &quot;하나, 둘, 셋, 넷&quot; 박자에 맞춰 던지는 손의 순서를 바꾸거나 8박자 연속 캐치 동작으로 연결해 도전한다.</p>
