<h1>다양한 동작 변형 스킵 달리기</h1>
<p>1) 출발선에 서서 기본 리듬에 맞춰 전방으로 가볍게 스킵하며 나아간다. 2) 신호에 따라 몸의 방향을 돌려 옆으로 이동하는 사이드 스킵을 연습한다. 3) 보폭을 아주 잘게 쪼개어 종종걸음으로 뛰는 작은 스킵으로 신체 조절력을 높인다. 4) 무릎을 높게 들고 보폭을 넓히는 큰 스킵과 전력 질주하듯 빠르게 달리는 스피드 스킵으로 신체 협응성과 순발력을 극대화한다.</p>
