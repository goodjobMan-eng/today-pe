<h1>다 함께 연속 줄넘기 (어드밴스)</h1>
<p>1) 모둠별로 한 줄로 서서 각자 개인 줄넘기를 준비하고 일정한 간격을 둡니다. 2) 줄넘기를 넘으며 앞으로 달려 나갑니다. 3) 앞사람의 줄넘기 리듬과 이동 속도에 맞추어 대열을 유지한 채 체육관 전체를 순환합니다. 4) 중간에 줄에 걸리지 않고 팀원 전체가 리듬을 타며 끝까지 완주하는 것이 목표입니다.</p>
