<h1>크리켓 표적 투구(볼링) 게임</h1>
<p>1) 25x15m 직사각형 구역을 만들고 스텀프와 마커를 설치합니다. 2) 주자 팀은 코너에 서고, 볼링 팀은 스텀프 한쪽에 서서 반대편에 위켓 키퍼를 배치합니다. 3) 주자 팀은 한 명씩 직사각형 주위를 완주하고, 볼링 팀이 스텀프를 맞히면 주자는 그 자리에 앉아야 합니다.</p>
