<h1>훌라후프 표적 플라잉디스크 윷놀이 점수전</h1>
<p>1) 바닥에 훌라후프 5개를 배치하고 도·개·걸·윷·모 점수판(1~5점)을 각각 후프 안에 넣는다. 2) 두 모둠으로 나눈 후 투척선에 서서 모둠별로 번갈아 가며 한 명씩 플라잉디스크를 던진다. 3) 디스크가 완전히 안착한 후프의 점수를 누적 합산하여 정확히 목표 점수(30점)를 먼저 채운 팀이 승리한다. 4) 던지는 도중 누적 점수가 30점을 초과하면 해당 판의 점수가 무효가 되어 상대팀에게 기회가 넘어간다.</p>
