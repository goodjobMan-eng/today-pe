<h1>알래스카 볼</h1>
<p>1) 교사가 경기장에 공을 던지면 양 팀이 먼저 공을 차지하기 위해 달린다. 2) 공을 먼저 잡은 팀은 일렬로 서서 다리 사이로 공을 뒤로 전달하고 맨 뒷사람이 공을 멀리 던진다. 3) 공을 잡지 못한 팀은 원형을 만들고 한 주자가 원 바깥을 계속 돌며 바퀴 수를 센다.</p>
