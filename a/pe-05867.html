<h1>스틱 낚시 놀이 (Fun PE game - fishing)</h1>
<p>1) 두 팀으로 인원을 나누고 중앙에 원마커를 배치한 뒤 출발 신호를 기다린다.2) 출발 신호가 떨어지면 달려가 스틱으로 바닥의 마커를 낚아채 자기 팀 후프로 가져온다.3) 가장 많은 수의 마커를 모은 팀이 승리하며, 획득한 마커의 색깔을 분류하거나 개수를 센다.</p>
