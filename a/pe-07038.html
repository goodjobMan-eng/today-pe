<h1>올바른 공 받기 6단계 연습</h1>
<p>1) 주변에 부딪히거나 걸려 넘어질 물건이 없는지 확인하고 안전한 공간을 확보한다. 2) 짝이 공을 던져주면 끝까지 공에 집중하며 팔꿈치를 구부려 준비 자세를 취한다. 3) 공을 맞이하러 이동한 후 올바른 손 모양으로 오직 두 손만을 이용해 공을 잡고 팔꿈치를 굽혀 충격을 흡수한다.</p>
