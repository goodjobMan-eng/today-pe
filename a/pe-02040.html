<p>1) 풍선을 적당한 크기로 불어 준비한다. 2) 풍선을 아래로 떨어뜨려 발 안쪽으로 높게 찬다. 3) 처음에는 한 번 차고 한 번 잡기를 반복하고 익숙해지면 연속으로 찬다. 4) 친구와 번갈아가며 한 번씩 차서 풍선이 떨어지지 않게 이어간다.</p>
