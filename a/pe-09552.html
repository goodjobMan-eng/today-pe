<h1>배틀 빙고</h1>
<p>1) 4팀으로 나눈다. 2) 의자를 4×4로 배치한다. 3) 차례대로 팀조끼를 의자에 던져 올리거나 걸친다. 4) 한 줄을 먼저 완성시킨 팀이 승리한다. 5) 상대방의 조끼를 떨어뜨릴 수 있다. 6) 두 팀의 조끼가 같이 놓여져 있으면 먼저 놓은 팀조끼만 유효하다.</p>
