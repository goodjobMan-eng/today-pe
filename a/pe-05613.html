<h1>바스켓볼 스키 점프 챌린지</h1>
<p>1) 바닥에 수건(또는 신문지)을 깔고 앞쪽에 바구니를 놓는다.2) 수건을 좌우로 넘나들며 스키 점프를 4회 연속으로 실시한다.3) 점프를 마친 뒤 즉시 공을 던져 바구니에 슛을 넣는다.4) 음악에 맞춰 1분 동안 반복하여 성공한 슛 개수를 기록한다.</p>
