<h1>높이 던지고 받아라</h1>
<p>1) 팀을 나누고 공을 던지고 받을 순서를 정한 후 2명씩 나옵니다. 2) 공을 제자리에서 머리 위로 높게 던진 후 반대편으로 달려갑니다. 3) 반대편에 있는 사람은 공이 바닥에 떨어지기 전에 달려와서 받습니다. 4) 공이 바닥에 떨어지기 전에 받으면 팀 점수를 1점 받으며 정해진 시간이나 횟수 동안 더 많이 성공한 팀이 승리합니다.</p>
