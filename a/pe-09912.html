<h1>생선 뒤집기 게임</h1>
<p>1) 2명 또는 3명이 1모둠이 되어 1명은 엎드려 '생선' 역할을 하고 나머지는 '어부'가 되어 정해진 신호에 맞춰 엎드린 사람을 뒤집거나 뒤집히지 않게 버틴다. 2) 어부 역할은 누워 있는 사람의 다리를 잡아 몸을 뒤집고, 생선 역할은 기지개 자세처럼 몸을 펴고 버틴다. 3) 역할을 바꾸어가며 번갈아 활동한다.</p>
