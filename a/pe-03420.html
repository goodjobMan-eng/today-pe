<p>1) 다섯 명이 한 모둠을 이루고, 각 모둠에서 공을 후프에 옮겨 주는 역할 1명을 정한다. 2) 첫 번째 모둠원이 발로 공을 잡아 오뚝이처럼 뒤로 굴러 머리 위 후프로 공을 옮긴다. 3) 다음 순서 모둠원도 동일한 방법으로 공을 옮기며, 공이 후프 밖으로 나가면 담당 모둠원이 후프 안으로 넣어 준다. 4) 공 5개를 먼저 옮긴 모둠이 이긴다.</p>
