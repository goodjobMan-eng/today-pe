<h1>개구리 점프 릴레이</h1>
<p>1) 두 팀으로 나누고 각 팀의 첫 번째 주자는 출발선에 선다. 2) 신호가 울리면 모둠발로 굴곡-신전 동작을 이용해 앞으로 멀리 뛴다. 3) 진행자가 착지 지점에 콘을 놓아 표시한다. 4) 다음 주자는 앞 주자의 착지 지점 콘 위치에서 출발하여 앞으로 모둠발 점프를 한다. 5) 모든 주자가 뛴 후 최종 합산 거리가 가장 긴 팀이 4점을 얻고, 패한 팀은 1점을 얻는다.</p>
