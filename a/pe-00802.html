<h1>음식 밸런스 게임 브레인 브레이크</h1>
<p>1) 화면에 제시되는 두 가지 음식 선택지 중 자신이 더 좋아하는 음식을 하나 고릅니다. 2) 선택 제한 시간이 지나고 화면이 바뀌면 자신이 고른 음식에 지정된 운동 동작을 확인합니다. 3) 타이머가 끝날 때까지 화면 속 캐릭터나 시범자의 동작을 따라 30초 동안 운동을 수행합니다. 4) 라운드 중간에 등장하는 미니게임 퀴즈(숨은 사과 도시락 찾기 등)에 참여하며 활동을 이어갑니다.</p>
