<h1>도깨비 밧줄 씨름과 밧줄 빼앗기 놀이</h1>
<p>1) 3m 밧줄을 두 번 접어 짧게 만든 뒤 마주 선 짝과 서로 밧줄을 걸어 좌우로 흔들고 몸을 돌리며 몸을 푼다. 2) 8자 매듭으로 묶은 밧줄 꾸러미를 준비하고 두 사람이 마주 보고 가위바위보를 한다. 3) 이긴 사람은 진 사람의 밧줄을 하나 가져오며, 가장 많은 밧줄을 모은 사람이 승리한다.</p>
