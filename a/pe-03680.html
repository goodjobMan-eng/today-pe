<h1>연어와 범고래 (샤케토 샤치)</h1>
<p>1) 연어(샤케) 팀과 범고래(샤치) 팀으로 나뉘어 서로 마주 보고 선다. 2) 신호자가 &quot;시-샤-샤- 연어!&quot;라고 외치면 연어 팀이 수영 동작을 하며 범고래 팀을 쫓아간다. 3) 범고래 팀은 태그되지 않도록 뒤쪽 라인까지 수영 동작으로 도망간다. 4) 신호자가 &quot;샤-샤-샤- 범고래!&quot;라고 외치면 범고래 팀이 연어 팀을 쫓아가며 이를 반복한다.</p>
