<h1>후프 톡톡 킥 달리기</h1>
<p>1) 바닥에 훌라후프를 내려놓고 출발선에 선 뒤 반환점 위치에 라바콘을 세운다. 2) 신호가 울리면 후프 안에 발을 넣고 전진하고자 하는 방향으로 후프 안쪽 테두리를 발로 톡톡 차면서 달린다. 3) 반환점 라바콘을 먼저 돌아서 출발선으로 돌아오는 순서대로 승리한다. 4) 익숙해지면 반환점 거리를 늘리거나 릴레이 이어달리기 형태로 변형하여 진행한다.</p>
