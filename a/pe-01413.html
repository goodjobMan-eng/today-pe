<h1>손잡고 겨루는 1대1 수건 꼬리잡기 놀이</h1>
<p>1) 두 사람이 짝을 짓고 허리 뒤 바지춤에 수건을 끼워 꼬리를 만든다. 2) 한 사람은 도망가고 다른 한 사람은 상대 뒤를 쫓아가 꼬리 수건을 낚아챈다. 3) 두 사람이 한 손을 맞잡은 상태에서 상대의 움직임을 견제하며 상대 꼬리를 먼저 뺏으면 득점한다. 4) 잡는 손을 반대 손으로 바꾸거나 두 사람 모두 꼬리를 차고 공방전을 벌인다.</p>
