<h1>슬라이딩 빈백 태그</h1>
<p>1) 모든 참가자에게 빈백을 1개씩 나눠준다. 2) 체육관 바닥으로 빈백을 미끄러뜨려 다른 사람의 발을 맞히며 태그한다. 3) 빈백에 발을 맞은 사람은 쪼그려 앉아 빈백을 머리 위에 얹는다. 4) 다른 사람이 머리 위의 빈백을 집어 손에 쥐여주면 게임에 부활한다. 5) 고학년은 팀별로 빈백 색깔을 나눠 같은 색 빈백을 가진 팀원만 구해줄 수 있다.</p>
