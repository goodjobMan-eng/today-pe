<h1>바이킹 매트 항해 릴레이</h1>
<p>1) 강당 출발선에 모둠별로 매트를 1장씩 깔고 모든 모둠원이 매트 위에 올라선다. 2) 출발 신호가 울리면 신체 부위가 체육관 바닥에 닿지 않도록 매트 위에서만 협동하여 매트를 이동시킨다. 3) 바닥에 떨어지지 않고 반대편 결승선에 가장 먼저 도착한 모둠이 승리한다. 4) 바닥에 콘이나 빈백을 보물로 흩뿌려 두고 제한 시간 내에 매트 위에서 가장 많이 수거하는 방식으로 변형한다.</p>
