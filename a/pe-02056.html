<h1>셔틀콕 균형잡기와 신체 감각 놀이</h1>
<p>1) 머리에 셔틀콕을 올리고 떨어지지 않게 스쿼트 자세로 내려갔다 일어난다. 2) 발등 또는 허벅지 위에 셔틀콕을 올리고 다리를 들어 균형을 잡는다. 3) 발등 위의 셔틀콕을 높이 차올려 손으로 잡는다. 4) 머리 위에 셔틀콕을 올린 뒤 고개를 뒤나 앞으로 기울여 떨어지는 셔틀콕을 손으로 잡는다.</p>
