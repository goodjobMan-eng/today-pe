<h1>문어 술래잡기</h1>
<p>1) 술래(문어)는 후프와 폼스틱(슬라이스)으로 만든 촉수를 들고 학생들을 쫓아간다. 2) 문어의 촉수에 닿아 잡히거나 바닥에 넘어지면 게로 변한다. 3) 게가 된 학생은 바닥에 엎드려 배를 하늘로 향한 채 네 발(크랩 워크)로 기어 다녀야 한다. 4) 게 상태인 학생들끼리 서로 기어가 하이파이브를 나누면 둘 다 구출되어 다시 일어선다.</p>
