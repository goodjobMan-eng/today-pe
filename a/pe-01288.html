<h1>단체 원형 투명의자 협동 챌린지</h1>
<p>1) 학생들이 교실 책상을 밀어 공간을 만든 뒤 의자를 둥글게 원형으로 모으고 옆으로 앉습니다. 2) 신호에 맞춰 모든 학생이 뒷사람의 무릎을 베개 삼아 뒤로 동시에 눕습니다. 3) 교사가 의자를 하나씩 천천히 바깥으로 빼내어 학생들만으로 지탱하는 투명의자 형태를 완성합니다. 4) 모든 의자를 제거한 상태에서 카운트다운 동안 버티며 전원 성공 미션을 달성합니다.</p>
