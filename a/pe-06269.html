<h1>보물 술래잡기</h1>
<p>1) 보물과 술래가 양끝에 위치하도록 참가자들이 손을 잡고 일렬로 선다.2) 술래는 줄 끝에 있는 보물을 터치하려 하고, 앞쪽의 지킴이와 보물은 몸을 움직여 이를 저지한다.3) 술래가 보물을 터치하면 역할을 바꾸어 지킴이가 술래가 되고 술래는 보물, 보물은 지킴이가 된다.</p>
