<h1>라이온킹 준비운동</h1>
<p>1) 제자리에서 앞뒤 및 좌우로 가볍게 걸으며 몸을 푼다. 2) 음악에 맞추어 양팔을 올리고 내리며 상체 운동을 실시한다. 3) 리듬에 맞추어 팔과 다리를 신나게 흔들며 전신을 움직인다. 4) 옆구리 늘리기, 등 말아주기, 기지개 켜기, 런지 등 부위별 스트레칭으로 유연성을 기른다.</p>
