<h1>채로 공 치기</h1>
<p>1) 4명이 한 모둠이 되어 각자 공을 1개씩 가지고 큰 원 밖에 서고 작은 원 안에는 같은 색깔 공 4개를 넣는다. 2) 모둠원은 순서를 정해 채로 공을 쳐서 작은 원 안의 공을 밖으로 밀어낸다. 3) 공을 친 후에는 자신의 공을 다시 가져와 다음 차례에 계속 사용한다. 4) 가장 적은 횟수로 공을 밀어낸 모둠이 승리한다.</p>
