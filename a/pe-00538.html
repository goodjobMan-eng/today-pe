<h1>수건 접기 인구밀도 균형 놀이</h1>
<p>1) 바닥에 펼쳐 놓은 수건 위에 두 사람이 함께 올라서서 5초 동안 버팁니다. 2) 성공할 때마다 수건을 절반씩 접어 면적을 줄여 나갑니다. 3) 수건이 작아지면 서로 꼭 껴안거나 한 발로 서서 수건 밖으로 발이 나가지 않도록 중심을 잡습니다. 4) 더 작아져 두 사람이 모두 설 수 없으면 상대의 발등 위에 올라타 한 발로 중심을 잡아 버팁니다.</p>
