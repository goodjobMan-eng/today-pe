<h1>20m 셔틀런 빕 테스트</h1>
<p>1) 20m 거리에 출발선과 반환점을 표시하고 5m 간격으로 보조선을 표시한다. 2) 신호음(비프음)에 맞춰 출발선에서 반환선까지 달린다. 3) 반환점에 도달하면 방향을 돌려 다음 신호음에 맞춰 반대편으로 다시 달린다. 4) 단계가 올라갈수록 신호음 간격이 짧아지며, 자신의 페이스대로 한계까지 완주하여 기록을 측정한다.</p>
