<h1>주사위 굴리기 이동 기술</h1>
<p>1) 체육관 곳곳에 주사위가 든 바구니 5개를 놓는다. 2) 음악이 나오면 학생들은 각자 자유롭게 체육관을 뛰어다닌다. 3) 음악이 멈추면 바구니로 모여 주사위를 굴리고 화면을 보고 나온 숫자에 해당하는 이동 기술을 확인한다. 4) 다시 음악이 나오면 해당 이동 기술로 체육관을 자유롭게 돌아다닌다.</p>
