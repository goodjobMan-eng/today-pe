<h1>신문지 볼 투구 협응력 기르기 놀이</h1>
<p>1) 신문지를 손 크기에 맞게 둥글게 뭉쳐 손쉽게 쥘 수 있는 볼을 제작한다. 2) 전신을 활용해 신문지 볼을 최대한 멀리 힘껏 던지는 연습을 한다. 3) 과녁이나 지정된 목표물 구역을 설정하여 정확하게 맞히면 득점한다. 4) 던지는 거리와 목표물의 크기를 점진적으로 조절하며 난이도를 변형한다.</p>
