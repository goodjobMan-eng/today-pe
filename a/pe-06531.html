<h1>번개 더블 플레이</h1>
<p>1) 전체 인원을 두 팀으로 나눈 뒤 타자 1명을 고정하고 수비 중 1명은 1루, 나머지는 2루에 위치한다. 2) 타자가 2루 방향으로 땅볼을 굴려주면 2루수는 포구 후 2루 베이스를 밟고 1루로 송구한다. 3) 송구한 사람은 1루로 이동하여 다음 송구를 캐치하고, 캐치한 사람은 2루로 가서 대기한다. 4) 3분 동안 정확하게 수비를 성공한 횟수가 많은 팀이 승리한다.</p>
