<h1>스텝 줄넘기 5단계 도전</h1>
<p>1) 줄넘기를 잡고 발을 좌, 우, 앞, 뒤 순서로 이동하는 동작을 1세트로 정한다. 2) 좌·우·앞·뒤 1세트를 10회 연속으로 실시한다. 3) 1단계부터 5단계까지 세트당 10회씩 연속으로 쉬지 않고 이어 뛰기에 도전한다. 4) 연속 수행이 어려운 경우 종목별로 50회 또는 100회씩 나누어 연습한다.</p>
