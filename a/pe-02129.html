<h1>체조 도전을 위한 매트 근력 운동</h1>
<p>1) 매트 위에 엎드려 몸을 일직선으로 만들고 푸시업 자세를 10초간 유지한다. 2) 몸을 옆으로 돌려 한 팔로 바닥을 짚고 몸을 일직선으로 10초간 버틴 후 반대쪽도 동일하게 실시한다. 3) 등을 바닥 쪽으로 돌려 양손으로 바닥을 짚고 허리를 들어 올려 일직선으로 10초간 버틴다. 4) 매트에 앉아 무릎을 모아 안고 등을 둥글게 말아 앞뒤로 구르기를 반복한다.</p>
