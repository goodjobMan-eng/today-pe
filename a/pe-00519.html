<h1>2인 1조 가위바위보 점프 놀이</h1>
<p>1) 두 사람이 짝을 지어 마주 본 상태에서 가위바위보를 합니다. 2) 이긴 학생은 차려 자세로 그 자리에 대기하고, 진 학생은 정해진 스텝(주먹: 모둠발 점프, 가위: 갤럽/앞뒤 점프, 보: 벌려 점프)으로 상대 주위를 1바퀴 돕니다. 3) 한 바퀴를 돌고 나면 다시 마주 서서 가위바위보를 이어 갑니다. 4) 회전 방향을 시계 방향과 반시계 방향으로 바꾸거나 2바퀴로 횟수를 늘려 다양하게 변형할 수 있습니다.</p>
