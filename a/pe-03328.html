<h1>깃발 들기 텔레파시 게임</h1>
<p>1) 원 모양으로 선다. 2) 다 같이 깃발을 활용하여 1, 2, 3번 움직임을 표현한다. 3) 모두 눈을 감고 준비 자세로 서 있다가 술래가 하나 둘 셋을 외치면 세 가지 움직임 중 한 가지를 표현한다. 4) 눈을 떠서 서로 동작을 확인한 후 술래와 같은 동작을 표현한 사람만 남고 마지막까지 남은 사람이 승리한다.</p>
