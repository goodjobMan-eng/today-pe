<h1>상어와 피라미 태그 게임</h1>
<p>1) 1~2명의 상어(술래)를 정하고 나머지 학생은 피라미가 되어 검은색 출발선에 정렬한다. 2) 신호에 맞춰 피라미들은 반대편 검은색 안전선까지 상어를 피해 달린다. 3) 상어에게 태그되거나 부딪힘·넘어짐, 구역 이탈(검은색 사이드라인), 콘 터치 시 바닥에 멈춘 해초가 된다. 4) 해초는 자리에 고정된 상태로 팔을 뻗어 지나가는 피라미를 태그할 수 있다.</p>
