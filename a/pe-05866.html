<h1>링 마스터</h1>
<p>1) 중앙 구역에 여러 개의 콘을 약간의 간격을 두고 배치하고, 양 팀은 중앙에서 수 미터 떨어진 맞은편에 정렬한다.2) 신호가 울리면 각 팀의 첫 번째 주자가 후프를 중앙 콘 쪽으로 굴린다.3) 후프를 던지지 않고 굴려서 콘 위로 씌워지면 1점을 획득한다.4) 모든 선수가 굴린 후 점수를 합산하여 가장 많은 점수를 얻은 팀이 승리한다.</p>
