<h1>융합 놀이체육 3종 (스파이크 피구, 손족구, 럭비축구)</h1>
<p>1) 스파이크 피구: 공을 그냥 던지지 않고 손으로 스파이크하여 상대를 맞히며, 원바운드된 공이나 천장에 맞은 공은 아웃되지 않는다2) 손족구: 원마커 중앙선을 사이에 두고 원바운드 이내로 손바닥으로만 쳐서 넘기며 랠리를 이어간다3) 럭비축구: 원 밖에서 패스나 킥으로 연결해 특정 존 안의 팀원에게 전달하며, 손으로 잡으면 1점, 발로 차서 주면 3점을 획득한다</p>
