<h1>상체 밴드 운동</h1>
<p>1) 운동용 고무밴드의 양 끝 또는 안쪽을 잡고 손으로 한 바퀴 감아 풀리지 않도록 준비합니다. 2) 밴드를 양발로 밟고 팔꿈치를 몸에 붙인 상태에서 천천히 위로 당겨 팔 운동을 실시합니다. 3) 손바닥이 하늘을 보게 하거나 90도로 들어 올려 머리 위로 펴면서 어깨 운동을 실시합니다. 4) 바닥에 앉아 밴드를 발바닥에 대고 허리를 편 채 팔꿈치가 몸통 뒤로 가도록 당겨 등 운동을 실시합니다.</p>
