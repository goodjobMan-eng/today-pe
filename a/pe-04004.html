<h1>네 모퉁이 주사위 놀이 (4 코너 다이스)</h1>
<p>1) 음악이 나오는 동안 트랙을 따라 지정된 이동 운동(빠르게 걷기, 조깅, 스킵 등)을 수행한다. 2) 음악이 멈추면 가장 가까운 네 모퉁이(1~4번 콘) 중 한 곳으로 이동해 선다. 3) 교사나 학생 리더가 주사위를 굴려 나온 모퉁이 번호의 학생들은 중앙 원으로 이동한다. 4) 5가 나오면 전체가 정해진 운동 5회를 하고, 6이 나오면 중앙 원에 있던 모든 학생이 게임으로 복귀한다.</p>
