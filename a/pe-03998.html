<h1>스쿠터 경찰과 도둑 술래잡기</h1>
<p>1) 경찰(술래) 4명은 펀스틱과 스쿠터를 받고, 도둑들은 양쪽 콘 뒤 대기 줄에 최소 5명 이상 대기한다. 2) 빈 스쿠터가 나오면 대기열 맨 앞 학생이 스쿠터에 올라타 구역 안으로 진입한다. 3) 코트 밖으로 나가거나 어깨 아래를 태그당하거나 스쿠터에서 떨어지면 탈락한다. 4) 탈락한 학생은 스쿠터를 바퀴가 위로 오도록 뒤집어 반납하고 다시 대기 줄 뒤로 이동한다.</p>
