<h1>티슈 5종 집콕 신체 도전 놀이</h1>
<p>1) 한 발을 바닥에 고정하고 얇은 티슈 한 장을 입바람으로 불어 바닥에 떨어지지 않게 버틴다. 2) 티슈를 얼굴에 얹어 불어 올린 뒤 손바닥으로 쳐서 바닥에 늦게 떨어지도록 유지한다. 3) 바람으로 띄운 티슈를 연필 끝에만 걸치고 3초 이상 떨어지지 않게 유지하는 도전을 한다. 4) 티슈를 불어 높이 띄우고 낮은 자세로 최대한 박수를 많이 친 후 티슈를 낚아채며, 양손에 든 2장을 번갈아 띄워 교차로 잡는다.</p>
