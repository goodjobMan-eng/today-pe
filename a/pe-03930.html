<h1>포 코너스 (네 구석 게임)</h1>
<p>1) 교실 모서리에 1번부터 4번까지 구역을 지정하고, 술래 1명은 칠판을 바라보며 뒤돌아선다. 2) 교사가 10초를 세는 동안 학생들은 4개 구역 중 한 곳으로 조용히 이동하며 중앙에 머무르지 않는다. 3) 카운트가 끝나면 술래는 뒤돌아보지 않고 특정 구석을 먼저 가리킨 후 돌아본다. 4) 술래가 가리킨 구석에 있던 학생들은 아웃되어 자리에 앉고, 술래는 총 3번의 기회를 갖는다.</p>
