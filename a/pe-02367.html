<h1>플라잉디스크 윷놀이</h1>
<p>1) 반 전체를 두 모둠으로 나누고 모둠별로 플라잉디스크를 던지는 순서를 정한다. 2) 순서대로 과녁을 향해 플라잉디스크를 던진다. 3) 플라잉디스크로 맞힌 과녁에 따라 말을 옮기며, 플라잉디스크가 과녁을 벗어나면 말을 옮길 수 없다. 4) 모든 말이 도착점에 먼저 도착하는 모둠이 이긴다.</p>
