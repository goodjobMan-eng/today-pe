<h1>주사위 피트니스</h1>
<p>1) 모둠별로 주사위를 굴릴 리더 1명을 정한다. 2) 리더가 주사위를 굴려 나온 눈에 지정된 운동을 모둠 전체가 함께 실시한다(예: 1번은 스쿼트 10회). 3) 운동을 마치면 체육관 한 바퀴를 조깅하여 달린다. 4) 이전 리더가 다음 주사위 굴릴 사람을 지목하여 역할을 교대한다.</p>
