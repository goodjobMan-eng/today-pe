<h1>학생건강체력평가(PAPS) 심폐지구력·유연성 측정 방법</h1>
<p>1) 출발 지점에서 신호음에 따라 출발해 맞은편 20m 지점에 도착 후 다음 신호를 기다린다. 2) 신호음이 울리면 다시 처음 위치로 달려 왕복 오래달리기를 실시한다. 3) 신발을 벗은 후 측정기 수직면에 양발이 완전히 닿게 앉아 양손을 겹쳐 뻗고 준비 자세를 취한다. 4) 가슴을 앞으로 내밀고 윗몸을 완전히 굽히면서 측정 기구의 눈금 아래로 손을 뻗어 유연성을 측정한다.</p>
