<h1>하키형 게임의 규칙과 방법</h1>
<p>1) 채로 공을 다루면서 상대 영역으로 이동한다. 2) 채가 상대 모둠원의 몸에 닿거나 채의 머리 부분을 무릎 위로 들면 안 된다. 3) 상대 모둠의 골대에 공을 넣으면 점수를 얻는다. 4) 골키퍼는 몸 전체로 공을 막을 수 있다.</p>
