<h1>3학년 다양한 방법으로 공 던지기 1차시(활동3)</h1>
<p>1) 공을 가진 팀은 빈 공간에 있는 동료에게 공을 던져 패스를 연결한다.2) 패스를 성공시켜 득점 구역에 공을 보내 득점한다.3) 공을 잡은 상태에서 걸을 수 없으며 수비가 없는 빈 공간으로 던져야 한다.4) 공을 놓치거나 아웃된 학생은 팀의 다음 공격 시 다시 참여한다.</p>
