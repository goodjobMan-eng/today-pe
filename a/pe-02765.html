<h1>밴드를 활용한 상체 근력 운동</h1>
<p>1) 밴드(또는 신축성 있는 끈, 허리띠)를 바닥에 놓고 두 발로 밟고 선다. 2) 팔을 몸에 붙인 상태에서 팔꿈치를 고정하고 손목과 팔을 위로 천천히 당겨 올린다. 3) 밴드를 밟은 채 팔을 45도 방향 옆쪽으로 당겨 올리며 어깨와 팔의 자극을 느낀다. 4) 밴드를 앞쪽으로 당겨 올리거나, 밴드를 양손으로 짧게 쥐고 가슴과 배 쪽에서 바깥으로 벌려 당긴다.</p>
