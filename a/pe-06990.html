<h1>서클 피구</h1>
<p>1) 콘으로 원을 만들고 참가자들은 콘 사이에 서서 자신만의 골대를 지킨다. 2) 공을 바닥으로 굴려 원 건너편 다른 사람의 골대 사이로 통과시켜 득점을 노린다(양옆 사람 골대로는 득점 불가). 3) 단계가 올라가면 공을 2개로 늘리거나, 원 중앙에 피하는 사람을 두고 공을 굴려 맞히면 역할을 바꾸는 방식으로 진행한다.</p>
