<h1>어린이 데일리 피트니스 챌린지</h1>
<p>1) 제자리에서 동서남북 홉 점프를 앞·우·뒤·좌 방향으로 뛴다. 2) 손을 허리에 대고 한 발로 균형을 잡으며 다리를 옆으로 높게 들어 올린다. 3) 바닥에 엉덩이를 뗀 크랩 자세로 엎드려 반대쪽 손과 발을 교차하여 터치한다. 4) 각 동작을 1분간 진행하고 동작 사이에 15초간 휴식한다.</p>
