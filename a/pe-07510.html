<h1>비밀 그림 게임</h1>
<p>1) 경기장을 그리기 구역(백지)과 문장 구역(설명 문장)으로 나누고 각 팀을 두 그룹으로 나눈다. 2) 신호가 울리면 문장 구역의 선수가 문장을 확인하고 중앙으로 달려와 그리기 구역의 선수에게 말로만 전달한다. 3) 설명을 들은 선수는 백지로 달려가 들은 내용을 그리고, 다음 주자들도 순서대로 문장 정보를 전달하며 그림을 완성한다. 4) 원본 그림을 가장 잘 표현하여 완성한 팀이 득점한다.</p>
