<h1>바꾸자 술래잡기</h1>
<p>1) 술래는 3~4명으로 정하고 조끼를 입고 시작한다. 2) 도망치는 사람은 힘들 때 바닥의 훌라후프 안에서 쉴 수 있다. 3) 다른 친구가 와서 '바꾸자'고 외치면 안에 있던 사람은 무조건 밖으로 나와야 한다. 4) 방금 들어갔던 훌라후프 안으로는 다시 들어가지 못하며, 술래에게 터치당하면 조끼를 바꿔 입고 술래가 된다.</p>
