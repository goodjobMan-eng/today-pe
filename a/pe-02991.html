<h1>릴레이 놀이 및 가위바위보 릴레이 놀이</h1>
<p>1) 모둠 친구들과 한 줄로 서서 첫 번째 주자가 목표 지점의 콘을 한 바퀴 돌아온다. 2) 출발점으로 돌아와 다음 주자와 한 손으로 하이파이브를 해야 교대할 수 있고, 주자는 맨 뒤로 이동한다. 3) 가위바위보 릴레이는 첫 번째 주자가 원마커로 이동해 상대 모듬 주자와 가위바위보를 한다. 4) 가위바위보를 이기면 모둠을 한 바퀴 돌아와 다음 주자와 교대하며, 모든 모둠원이 먼저 돌아와 앉는 팀이 승리한다.</p>
