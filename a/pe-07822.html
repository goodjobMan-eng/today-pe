<h1>선생님의 복수</h1>
<p>1) 학생들을 운동장에 흩어지게 배치하고 바닥 곳곳에 폼볼을 놓습니다. 2) 술래인 선생님이 공을 집어 도망치는 학생들의 무릎 아래를 겨냥해 던집니다. 3) 무릎 아래에 공을 맞은 학생은 선생님이 지시하는 운동(윗몸일으키기 10회, 팔굽혀펴기 10회, 스쿼트 10회 등)을 수행합니다. 4) 정해진 운동을 마친 학생은 다시 게임에 참여하며 선생님이 지칠 때까지 이어집니다.</p>
