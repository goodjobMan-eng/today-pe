<h1>훌라후프 통과하기</h1>
<p>1) 모든 참가자가 둥글게 모여 서서 서로의 손을 맞잡는다. 2) 한 사람의 팔 사이에 훌라후프를 걸어 두고 신호와 함께 시작한다. 3) 맞잡은 손을 절대 풀지 않고 몸과 다리를 움직여 옆 사람에게 훌라후프를 넘긴다. 4) 후프가 모든 사람을 거쳐 처음 출발했던 사람에게 다시 돌아오면 성공한다.</p>
