<h1>시소 벤치 및 균형 스테이션 활동</h1>
<p>1) 시소 모양 벤치 위를 떨어지지 않고 건너간다. 2) 뒤집은 벤치 위 좁은 면을 걷거나 뒤로 걷기, 눈 감고 걷기에 도전한다. 3) 매트 위에 봉을 일정 간격으로 깔고 그 위에 올린 벤치를 굴러가지 않게 균형을 잡으며 건넌다.</p>
