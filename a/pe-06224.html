<h1>가위바위보 달리기 피구</h1>
<p>1) 양 팀이 마주 보고 신호에 맞춰 가위바위보를 한다.2) 가위바위보에서 진 참가자는 정해진 구역을 향해 달리고, 이긴 참가자는 공을 던져 달리는 상대를 맞힌다.3) 달리는 참가자는 공에 맞지 않도록 지그재그로 뛰며 경기장 흰 선과 콘 밖으로 벗어나지 않아야 한다.4) 공에 맞으면 정해진 규칙에 따라 점수판/말판을 반대로 옮겨 놓는다.</p>
