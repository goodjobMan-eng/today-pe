<h1>수건공 페어 캐치볼 놀이</h1>
<p>1) 수건 양끝을 단단히 묶어 공 모양을 만들고 두 사람이 3~4m 거리를 두고 마주 보고 앉거나 선다. 2) 정좌나 장좌 자세에서 시작해 한 무릎 서기, 외발 서기, 다리 벌리기 등 다양한 신체 자세로 번갈아 가며 가슴 쪽으로 던지고 받는다. 3) 떨어뜨리지 않고 정해진 횟수(예: 10회 연속)를 서로 주고받으면 성공으로 인정한다. 4) 반대 손(비우세손)으로 던지거나 던진 후 균형을 3초간 유지하는 방식으로 규칙을 변형한다.</p>
