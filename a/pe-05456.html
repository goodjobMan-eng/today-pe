<h1>숫자 고깔콘 정리하기</h1>
<p>1) 6가지 색상과 1번부터 6번까지 숫자가 적힌 고깔콘을 상대방과 함께 무작위로 섞은 뒤 서로 바꾼다.2) 콘의 숫자를 보지 않고 손을 머리 위에 올린 채 시작 신호를 기다린다.3) 신호가 울리면 맨 밑에 1번, 맨 위에 6번이 오도록 순서대로 콘을 먼저 정리하는 사람이 승리한다.</p>
