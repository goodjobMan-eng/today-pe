<h1>힘 조절 공 굴리기·패스 놀이 모음</h1>
<p>1) 앉아서 다리를 뻗거나 벌린 채 공을 굴려 떨어지기 직전에 멈추는 코로코로 스톱을 한다. 2) 마주 보고 공을 굴려 서로 부딪쳐 원 안에 멈추게 하는 볼 컬링을 한다. 3) 다리를 벌리고 선 사람들의 다리 사이로 공을 굴려 통과시키는 터널 챌린지를 한다. 4) 바운드 횟수를 미리 말하고 패스하는 바운드 캐치 및 끝말잇기 바운드를 진행한다.</p>
