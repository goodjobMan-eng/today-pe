<h1>PAPS 윗몸 말아올리기 측정</h1>
<p>1) 실시자와 측정자가 2인 1조를 구성한다.2) 실시자는 매트에 등을 대고 무릎을 90도로 세우고 누우며 손바닥을 허벅지 위에 올린다.3) 측정자는 실시자의 무릎뼈 아래 튀어나온 부분에 손끝을 댄다.4) 3초마다 울리는 신호음에 맞춰 상체를 말아 올려 손끝을 맞대고 원위치로 내려온다.5) 2회 연속 신호음에 맞춰 올라오지 못하면 측정을 종료하고 이전 기록까지 인정한다.</p>
