<h1>타바타 운동 (음악 인터벌 트레이닝)</h1>
<p>1) 개인 운동 구역(사각 구역)에 서서 준비한다. 2) 음악이 커지고 화면이 초록색이 되면 화면에 나오는 동작을 따라 하며 지정된 시간 동안 운동한다. 3) 음악이 잦아들고 화면이 빨간색이 되면 호흡을 가다듬고 뭉친 근육을 스트레칭하며 휴식한다.</p>
