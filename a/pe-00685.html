<h1>다 함께 스탠드업</h1>
<p>1) 2인 1조로 바닥에 마주 앉아 서로 발을 맞대고 양손을 마주 잡습니다. 2) 신호에 맞춰 동시에 서로를 당기며 다리 힘으로 균형을 잡고 일어섭니다. 3) 2명이 성공하면 3명, 4명, 6명, 8명 순으로 인원을 점차 늘려 원형으로 모여 앉습니다. 4) 인원이 늘어나면 팔을 엇갈려 잡거나 단단히 손을 쥐고 호흡을 맞추며, 모든 구성원이 엉덩이를 떼고 완전히 일어나 균형을 유지하면 성공입니다.</p>
