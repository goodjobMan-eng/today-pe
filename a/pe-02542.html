<h1>배구 패스 기본 동작 익히기</h1>
<p>1) 네트를 사이에 두고 팀당 6명씩 나누어 위치한다. 2) 언더핸드 패스는 다리를 벌리고 무릎과 엉덩이를 낮추며 양팔을 모아 앞으로 쭉 펴서 공을 받는다. 3) 오버핸드 패스는 양손으로 삼각형을 만들어 이마 위에서 준비 자세를 취한다. 4) 무릎과 팔을 한 번에 쭉 펴면서 공을 패스한다.</p>
