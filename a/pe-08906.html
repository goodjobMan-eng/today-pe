<h1>협동 게임 모음 (바닥은 라바가 외 4종)</h1>
<p>1) 팀별로 매트 2장을 이용해 바닥에 닿지 않고 이동한다. 2) 긴 줄이나 연결된 줄로 제시된 기하학적 도형 모양을 만든다. 3) 훌라후프를 원형으로 서서 손을 잡고 몸을 통과시킨다. 4) 팀원들이 각자 턴스틱을 세우고 동시에 놓아 옆 사람의 스틱을 잡는다.</p>
