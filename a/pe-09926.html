<h1>팀 릴레이 줄넘기 체력운동</h1>
<p>1) 각 팀 대표 주자가 나와 지정된 줄넘기 미션(예: 2중뛰기 10회)을 수행한다. 2) 미션을 완수한 주자는 달려가 자기 팀 자리를 먼저 터치한다. 3) 먼저 터치하여 승리한 팀은 누워서 휴식을 취하고, 패배한 팀은 줄넘기 벌칙을 수행한다.</p>
