<h1>걷기 놀이</h1>
<p>1) 발뒤꿈치가 먼저 닿게 걷고 턱은 당기며 팔은 구부려 앞뒤로 흔들며 바르게 걷기를 연습한다.2) 교사와 가위바위보를 하여 가위로 이기면 두 발, 주먹으로 이기면 세 발, 보자기 다섯 발, 비기면 한 발 이동하여 목적지에 도착한다.3) 무궁화 꽃이 피었습니다 놀이로 개인전과 팀전을 진행하며, 술래가 돌아볼 때 멈추고 걸린 사람은 앞으로 나온다.</p>
