<h1>큐피드 스톰프</h1>
<p>1) 트랙을 따라 내려오는 버튼을 확인한다.2) 버튼이 플레이 존에 들어오면 해당 동작을 수행한다.3) 빨간색은 왼발 구르기 또는 점프, 노란색은 오른발 구르기 또는 점프, 빨강과 노랑은 점프, 파란색은 박수, 보라색은 허벅지 치기를 한다.4) 미니 게임에서는 각 구역에서 반복되는 이미지를 찾아 맞추고 포즈를 취한다.</p>
