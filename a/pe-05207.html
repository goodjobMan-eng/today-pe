<h1>장소 방문하기 축구 드리블 놀이</h1>
<p>1) 학생들은 각자 축구공을 가지고 체육관 안을 자유롭게 드리블한다.2) 공을 짧게 툭툭 치며 양발을 모두 사용하고 시선은 앞을 향하도록 공을 제어한다.3) 체육관 곳곳에 표시된 장소(맥도날드, 해변, 주유소, 워터파크, 놀이터 등)에 도착하면 발로 공을 멈춰 세운다(트래핑).4) 친구들과 함께 가상으로 주유를 하거나 물건을 사는 흉내를 내며 다른 장소로 이동한다.</p>
