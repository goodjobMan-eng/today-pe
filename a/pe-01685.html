<h1>양자택일 무브먼트 밸런스 운동</h1>
<p>1) 교실이나 강당에서 화면을 마주 보고 좌우로 이동할 수 있는 개인 공간을 준비합니다. 2) 15초 카운트다운 동안 좌우 두 가지 선택지 중 마음에 드는 쪽을 골라 해당 방향으로 이동합니다. 3) 화면이 전환되면 선택한 쪽에 제시된 30초 맞춤 운동(스텝, 제자리 달리기, 댄스 등)을 수행합니다. 4) 라운드가 반복됨에 따라 심폐 지구력 유산소 동작이나 요가·호흡 이완 동작으로 강도를 조절합니다.</p>
