<h1>라인 술래잡기</h1>
<p>1) 술래 2명은 띠(리본)를 착용하여 술래임을 표시한다. 2) 모든 참가자는 체육관 바닥의 라인 위로만 이동할 수 있으며 라인 사이를 뛰어넘을 수 없다. 3) 라인이 교차하는 갈림길에서는 자유롭게 방향을 바꿀 수 있으며, 술래는 라인을 따라 도망자를 터치하여 잡는다.</p>
