<h1>홀수 짝수 술래잡기 게임</h1>
<p>1) 학급을 홀수 팀과 짝수 팀으로 나누고 중앙선에 마주 보거나 등지고 눕거나 앉는다.2) 교사가 연산 문제(덧셈, 뺄셈, 곱셈, 나눗셈 등)를 제시한다.3) 계산 결과가 홀수면 홀수 팀이 짝수 팀을 태그하고, 짝수면 짝수 팀이 홀수 팀을 태그한다.4) 도망치는 팀은 정해진 안전구역 안으로 들어가야 하며 들어가기 전에 태그당하면 다음 게임에서 상대 팀이 된다.</p>
