<h1>엘프 익스프레스</h1>
<p>1) 학급을 동등한 팀으로 나누고 각 플레이어에게 후프를 하나씩 주어 팀별로 줄을 서서 후프 안에 서서 준비한다. 2) 맨 뒤의 엘프가 앞의 후프 속으로 들어가 빈 후프를 집어 맨 앞 플레이어에게 전달하고, 모든 플레이어가 앞으로 한 칸씩 이동한다. 3) 팀 전체가 교사가 설정한 골 라인을 통과할 때까지 이 과정을 반복한다. 4) 두 번째 단계에서는 체육관에 흩어져 있는 팀 컬러의 빈백을 후프 안에 두 발을 두고 수집한다.</p>
