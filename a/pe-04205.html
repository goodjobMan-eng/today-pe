<h1>페트병 셔틀 릴레이 게임</h1>
<p>1) 재활용 페트병을 반으로 잘라 윗부분을 뒤집어 셔틀로 만들고 아랫부분을 바닥 표적으로 놓는다. 2) 출발선에 콘을 일정 간격으로 세우고 학생들은 각자 출발선 콘 앞에 선다. 3) 출발선에서 손에 든 셔틀을 떨어뜨려 바닥의 페트병 아래쪽 통 안에 넣기를 시도한다. 4) 셔틀이 통 안에 정확히 들어가면 다음 콘으로 전진하며, 가장 먼저 결승선에 도달한 사람이 승리한다.</p>
