<h1>원형 농구 게임</h1>
<p>1) 작은 원과 큰 원을 이중으로 그리고, 작은 원 안에는 골대 역할을 할 학생 1명이 들어간다. 2) 공격수와 수비수를 나누어 배치하고, 공격수가 수비수를 피해 골대 학생에게 공을 정확히 전달하면 2점을 얻는다. 3) 공격수는 공을 잡은 뒤 드리블을 할 수 없으며 제자리에 서서 패스나 슛을 해야 한다. 4) 공이나 공을 든 선수가 원 밖으로 나가거나, 수비수가 공을 가로채거나, 공격수가 골을 성공하면 공격과 수비 역할을 바꾼다.</p>
