<h1>발바닥 인사이드 축구 드리블 기초 연습</h1>
<p>1) 1미터 사각형 안에서 발바닥의 가운데에서 살짝 앞쪽(미들풋)으로 축구공을 밟아 잡습니다. 2) 발바닥으로 공을 몸 쪽으로 끌어당기면서 디딤발도 함께 뒤로 와줍니다. 3) 끌어당긴 공을 반대 발 안쪽(인사이드)으로 팡 차는 게 아니라 부드럽게 밀어줍니다. 4) 자신의 1m 공간 안에서 다른 학생의 공간을 존중하며 발바닥 인사이드 동작을 연속으로 연습합니다.</p>
