<h1>신체 터널 게임 (공 굴려 이동하기)</h1>
<p>1) 모둠원들이 엎드려 다리 사이로 터널을 만들며, 엎드린 학생의 간격은 10cm 이내여야 합니다. 2) 시작 신호와 함께 공을 든 사람은 맨 뒤로 달려와 모둠원들 사이로 공을 굴립니다. 3) 공을 굴린 사람은 그 자리에 엎드려 다음 차례를 기다리고, 맨 뒤의 사람이 공을 잡으면 맨 앞으로 달려가 공을 굴립니다. 4) 공이 뒤로 빠지면 마지막 사람이 주워 경기를 진행하며, 도착 지점에 먼저 도착한 모둠이 이깁니다.</p>
