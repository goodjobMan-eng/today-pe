<h1>축구 볼 컨트롤 기초 5가지 스킬 연습</h1>
<p>1) 발바닥 밑부분을 사용해 발꿈치를 들고 공을 좌우로 굴려 이동시킨다. 2) 제자리에서 양발 발바닥 밑부분으로 번갈아 공 위를 밟아 터치하는 토 탭을 한다. 3) 공을 건드리지 않고 양발로 안쪽에서 바깥쪽으로 번갈아 공 위를 넘어가는 스텝오버를 연습한다. 4) 발바닥으로 공을 앞뒤로 굴려 이동시키며 중심을 잡고, 발 안쪽으로 좌우 번갈아 공을 톡톡 찬다.</p>
