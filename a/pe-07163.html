<h1>투르미오팔로 (Turmiopallo)</h1>
<p>1) 체육관 양쪽에 골대와 골대 앞 크리스 구역(매트)을 설치하고 두 팀으로 나눈다. 2) 각 팀 골키퍼를 지정하고, 팀원들은 자기 진영에서만 활동한다. 3) 초록색 피구공은 상대 골대에 던져 득점하는 공격용 공으로 사용한다. 4) 보라색 피구공은 상대 선수를 맞혀 일시적으로 퇴장시키는 용도로 사용한다. 5) 보라색 공에 맞은 선수는 경기장 옆으로 나가 간단한 운동을 수행한 뒤 복귀한다.</p>
