<h1>미니 트램펄린 공중 앞구르기(앞공중돌기)</h1>
<p>1) 도움닫기 후 미니 트램펄린에 똑바로 선 자세로 도약판을 밟는다. 2) 트램펄린이 밀어 올려주는 반동 순간에 양팔을 머리 위로 똑바로 들어 올린다. 3) 트램펄린 반동과 동시에 즉시 빠른 회전을 시작한다. 4) 정강이를 두 손으로 강하게 끌어안아 몸을 좁게 웅크려 회전 속도를 높인다. 5) 회전 후 안전 매트 위에 착지한다.</p>
