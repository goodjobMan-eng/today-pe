<h1>풀 누들 11단계 체육 미션 챌린지</h1>
<p>1) 누들을 바닥에 두고 모둠발 스키 점프로 넘거나, 광선검 동작 및 스쿼트 운동을 진행한다. 2) 손, 팔, 머리 위에 누들을 올려 중심을 잡고, 바닥에 세운 뒤 손뼉을 치고 쓰러지기 전에 잡는다. 3) 양손으로 누들을 번갈아 던져 받거나 공중에 회전시켜 반대쪽을 잡고, 멀리 던진 후 손바닥으로 튕겨 올리는 미션에 순차 도전한다.</p>
