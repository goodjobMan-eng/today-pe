<h1>풍선 위 달리기 스태킹</h1>
<p>1) 길게 분 풍선 위에 컵 1~2개를 올려놓는다. 2) 풍선을 살살 흔들어 컵이 미끄러지며 출발선에서 결승선까지 이동하게 만든다. 3) 중간에 컵이 떨어지면 떨어진 위치에서 다시 컵을 올리고 이어간다. 4) 2인 1조로 한 명은 수행하고 한 명은 거리를 확인하는 심판 역할을 맡는다.</p>
