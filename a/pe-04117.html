<h1>농구 팔로우 더 리더 준비운동</h1>
<p>1) 공을 배에 닿지 않게 들고 손가락 끝 패드로 공을 두드리는 슬랩과 탭을 한다. 2) 공을 바닥에 한 번 튕긴 뒤 회전하여 손가락 패드로 잡는 드롭 스핀 캐치를 연습한다. 3) 공을 허리 높이로 유지하며 오른손과 왼손으로 각각 드리블한다. 4) 좌우로 V 드리블을 하고 드리블을 유지하면서 앉았다가 일어선다.</p>
