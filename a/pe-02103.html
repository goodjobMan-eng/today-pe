<h1>리듬 걷기와 리듬 뛰기 놀이</h1>
<p>1) 리듬 걷기는 둘씩 마주보고 신호 구령에 맞춰 손뼉을 치며 발을 맞추어 걷는다. 2) 한쪽 방향으로 뛰기는 진입한 발로 오른쪽으로 갔다가 되돌아오며, 뒷사람이 앞사람 동작을 똑같이 따라 전진한다. 3) 교차 뛰기는 가로 최소 4칸 이상, 세로 짝수 줄로 사다리/칸을 배치한다. 4) 양쪽 맞은편에서 출발하여 서로 엇갈려 비켜 가며 칸을 뛰어 통과한다.</p>
