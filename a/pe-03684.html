<h1>엉덩이 걷기 가위바위보 글리코 왕복 달리기</h1>
<p>1) 나란히 앉아 양다리를 앞으로 뻗고 출발선에 앉아 준비한다. 2) 가위바위보를 하여 이긴 사람이 엉덩이를 움직여 앞으로 전진한다. 3) 주먹(구)으로 이기면 3걸음, 보(파)나 가위(초키)로 이기면 6걸음씩 앞으로 나아간다. 4) 반환점 수건에 발이 닿으면 뒤로 돌아서 엉덩이 걷기로 후진하여 먼저 출발선에 엉덩이가 닿는 사람이 이긴다.</p>
