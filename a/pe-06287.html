<h1>비대면 티볼 벽 캐치 앤 드로 측정 과제</h1>
<p>1) 벽으로부터 5m 거리에 라인 테이프를 부착하여 측정 구역을 준비한다.2) 1분 동안 벽에 공을 던져 튕겨 나온 볼을 글러브로 포구한 횟수를 측정한다.3) 벽에 던진 공은 노바운드로 닿아야 하며, 튀어나온 공은 2회 이상 바운드된 후 글러브로 한 번에 포구해야 성공으로 인정된다.4) 5m 라인 밖에서 서서 던져야 하며 라인을 밟거나 넘어가서 공을 던지거나 잡으면 성공 개수에서 제외된다.</p>
