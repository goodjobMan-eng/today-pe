<h1>패스 득점 연계 스로볼 2</h1>
<p>1) 배구 코트 네트를 사이에 두고 팀을 나누며 서브 순서를 정한다. 2) 상대의 서브나 공격 공을 받아 동료들과 패스를 주고받거나 즉시 상대 코트로 던져 넘긴다. 3) 공이 닿은 팀원 수만큼 득점하며(예: 3회 패스 후 넘겨 성공 시 4점) 30점을 먼저 내는 팀이 승리한다. 4) 빠른 기습 공격으로 1~2점을 노릴지 모두 패스해 고득점을 노릴지 팀 전략에 따라 선택한다.</p>
