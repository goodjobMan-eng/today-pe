<h1>스푹태큘러 펀데이 핼러윈 스테이션 활동</h1>
<p>1) 학생들은 스테이션 번호와 색상 콘을 배정받아 3분씩 활동에 참여한다.2) 몬스터 먹이 주기, 고스트 띄우기, 마녀의 스튜 재료 옮기기, 스크린 타깃 맞히기 등 다양한 활동을 순환한다.3) 해골 퍼즐 릴레이, 바닥에 앉아서 하는 눈알 배구, 스쿠터보드 유령의 집 터널 통과를 진행한다.4) 3분이 지나면 정리하고 앉아서 신호에 맞춰 함께 다음 색상 스테이션으로 이동한다.</p>
