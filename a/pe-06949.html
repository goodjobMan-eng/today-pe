<h1>배틀쉽 (배구 서브 게임)</h1>
<p>1) 네트를 사이에 두고 양 팀 코트에 훌라후프를 3개 묶음 2세트, 2개 묶음 2세트, 1개 묶음 1세트로 각각 연결하여 배치한다. 2) 시작 신호가 울리면 네트 너머 상대편 구역을 향해 배구 서브를 넣는다. 3) 서브된 공이 상대 훌라후프 안에 바운드되어 들어가면 해당 훌라후프를 제거하며, 상대의 모든 전함(훌라후프)을 먼저 침몰시킨 팀이 승리한다.</p>
