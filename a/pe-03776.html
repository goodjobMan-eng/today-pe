<h1>전래놀이를 활용한 움직임 만들기</h1>
<p>1) '무궁화 꽃이 피었습니다'에서 제시어를 축구·야구·동물 등으로 바꾸고 해당 동작을 표현하며 멈춥니다. 2) '어디 사니(안타가타도코사)' 노래에 맞추어 기본 스텝을 하다가 특정 가사('사')가 나올 때만 앞이나 옆으로 이동합니다. 3) 짝이나 모둠별로 화이트보드를 활용해 움직임 규칙을 직접 계획하고 변형합니다. 4) 젠카 등 포크댄스 스텝의 방향이나 순서를 바꾸어 새로운 리듬 표현 동작을 만듭니다.</p>
