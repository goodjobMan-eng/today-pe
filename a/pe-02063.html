<h1>동물이 되어 달려볼까</h1>
<p>1) 전체를 두 팀으로 나누고 8가지 동물 동작을 미리 연습한다. 2) 각 팀 바구니에 동물 이름을 적은 쪽지를 5장씩 준비한다. 3) 앞 주자가 달리기 시작하면 다음 주자는 바구니에서 쪽지를 뽑아 표현할 동물을 정한다. 4) 뽑힌 동물 동작으로 달려 반환점을 돌아온 뒤 다음 주자를 터치하며 총 10번 주자가 먼저 완주하는 팀이 승리한다.</p>
