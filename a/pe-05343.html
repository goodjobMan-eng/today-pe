<h1>폼 주사위 숫자 달리기 및 쌓기 놀이</h1>
<p>1) 주사위를 굴려 1부터 6까지 모든 숫자를 먼저 채우는 활동을 한다.2) 홀수(1, 3, 5)만 나오는 주사위 굴리기 활동을 진행한다.3) 주사위를 굴려 나온 눈의 합이 20이 될 때까지 굴린다.4) 콘을 돌아온 뒤 주사위 6개를 타워나 피라미드 형태로 쌓는 릴레이를 한다.5) 굴려서 나온 숫자를 종이에 적어 누적 합 50을 달성하는 팀 활동을 한다.</p>
