<h1>트로피컬 아일랜드</h1>
<p>1) 콘을 1~2m 간격으로 코트에 배치하여 섬 구역을 만든다. 2) 2인 1조가 되어 1번 선수가 한 섬에서 다른 섬에 있는 2번 파트너에게 패스한다. 3) 1번 선수는 비어 있는 다른 섬으로 이동해 다시 패스를 받으며 한 섬에는 한 명만 머문다. 4) 1분 동안 두 사람이 완성한 패스 횟수를 최대한 늘린다.</p>
