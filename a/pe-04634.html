<h1>베이스로 달리기 (Race To The Bases)</h1>
<p>1) 4명으로 구성된 모둠에서 1번 타자가 티 위의 공을 치면 수비수 3명이 공을 잡아 배팅 베이스로 송구한다. 2) 빌드 2에서는 타자가 타격 후 배팅 베이스와 러닝 베이스(콘) 사이를 왕복 달리기하며 베이스에 닿을 때마다 1점을 획득한다. 3) 수비수가 러닝 베이스를 공을 쥔 채 터치하면 타자의 주루가 끝나며 타순을 교대한다.</p>
