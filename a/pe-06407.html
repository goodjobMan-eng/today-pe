<h1>마리오 하트 스톰프 브레인 브레이크</h1>
<p>1) 화면 트랙을 타고 내려오는 버튼 표시를 확인한다.2) 빨간색은 왼발 구르기(또는 뜀뛰기), 노란색은 오른발 구르기(또는 뜀뛰기)를 실행한다.3) 빨강·노랑이 동시에 나오면 점프를 하고 파란색은 박수, 보라색은 허벅지 치기를 한다.4) 틀린 그림 찾기 구간에서는 중앙의 신체 자세를 버티며 차이점 3개를 찾는다.</p>
