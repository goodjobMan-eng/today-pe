<h1>로프 스윙 챌린지 (바닥은 용암)</h1>
<p>1) 1단계는 매트에서 출발하여 로프를 타고 건너편 매트로 착지한다.2) 2단계는 매트에서 출발하여 로프를 타고 바닥(매트 사이 공간)을 건너뛰어 통제된 자세로 바닥에 착지하며, 바닥에 넘어지면 실패한다.3) 3단계는 바닥에서 출발하여 로프를 타고 반대편 바닥으로 안전하게 스윙하여 착지한다.</p>
