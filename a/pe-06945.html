<h1>런 더 건틀릿 (포니 익스프레스)</h1>
<p>1) 주자 팀은 안전 구역에 한 줄로 서고, 첫 번째 주자는 라켓이나 배트 등의 도구를 들고 출발한다. 2) 주자가 반대편 안전 구역까지 왕복 달리기를 성공하면 팀에 1점을 획득한다. 3) 양쪽 사이드라인의 투수들은 짝을 지어 서서 주자를 향해 피구공을 던져 직접 맞힌다. 4) 주자는 도구로 공을 쳐서 막아낼 수 있으며, 공에 맞으면 그 자리에 멈추고 다음 주자가 넘겨받아 달린다.</p>
