<h1>초보자를 위한 포환던지기 지도법</h1>
<p>1) 포환이나 콩주머니를 손가락 위에 얹고 턱 아래 목에 붙인 뒤 팔꿈치를 높게 든다. 2) 옆으로 서서 하늘을 가리키며 몸을 뒤로 젖힌 후 밀어내며 높은 하이파이브 자세로 끝낸다. 3) 자세를 낮춰 무릎·턱·발끝을 일치시키고 몸을 비틀었다가 풀며 밀어낸다.</p>
