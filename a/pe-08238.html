<h1>발 구르기 신호 전달 놀이</h1>
<p>1) 참가자들이 좁은 간격으로 둥글게 둘러선다. 2) 한 사람이 발을 굴러 옆 사람에게 신호를 보내면 순서대로 발을 굴러 전달한다. 3) 두 번 연속 발을 구르면 신호가 다음 발 하나를 건너뛰며, 실수한 사람은 쪼그려 앉았다 일어난다. 4) 푸시업(플랭크) 자세로 엎드려 손으로 바닥을 두드리는 방식으로 변형할 수 있다.</p>
