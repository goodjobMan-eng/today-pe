<h1>찜 럭비(럭비형 공 이어주기 게임)</h1>
<p>1) 5명씩 2개의 모둠을 이루고 약 10m×20m의 게임장 영역과 골 영역을 정합니다. 2) 같은 모둠 친구들과 공을 이어 주며 골 영역으로 이동시킵니다. 3) 공을 받은 사람은 제자리에서 움직일 수 없으며, 모든 모둠원이 공을 이어 주어 골 영역으로 이동시키면 1점을 얻습니다.</p>
