<h1>플로어 풋볼</h1>
<p>1) 양쪽 구역에서 번갈아 골판지 상자를 발로 차서 넘긴다.2) 찬 골판지 상자가 반대편 라인 가장자리에 일부라도 걸쳐 멈추면 터치다운으로 6점을 얻는다.3) 터치다운을 성공한 팀은 부드러운 스펀지 공을 차서 테이프로 만든 골대 사이로 통과시키면 추가 1점을 획득한다.</p>
