<h1>벽 술래잡기 (마우어펑엔)</h1>
<p>1) 모든 어린이는 유령이 되고 공을 든 4명의 시작 술래(유령 사냥꾼)가 유령을 터치해 잡는다. 2) 술래에게 터치된 유령은 새로운 유령 사냥꾼이 되며, 방금 자신을 잡은 사람을 즉시 다시 잡을 수는 없다. 3) 유령은 벽 역할을 하는 벤치를 뛰어넘을 수 있으나 한 벤치는 한 번만 넘고 다른 벤치로 가야 하며, 술래는 벤치 주위를 돌아서 뛰어야 한다.</p>
