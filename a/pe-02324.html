<h1>풍차 이어달리기 놀이</h1>
<p>1) 반을 네 모둠으로 나누고 달리기 순서를 정해 모둠별로 삼각콘 뒤에 한 줄로 선다. 2) 출발 신호가 들리면 각 모둠의 첫 번째 주자가 배턴을 들고 한 바퀴를 돌아 출발점으로 온다. 3) 첫 번째 주자가 출발하면 두 번째 주자는 출발점 앞으로 나가 배턴을 받을 준비를 하며 대기한다. 4) 두 번째 주자에게 배턴을 전달한 후 맨 뒤로 가며, 가장 빠르게 모든 친구들이 한 바퀴를 돌고 자리로 돌아오는 모둠이 승리한다.</p>
