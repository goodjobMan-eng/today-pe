<h1>풋볼 프렌지 (Football Frenzy)</h1>
<p>1) 네 개의 콘을 사각형으로 배치하고 중앙의 훌라후프 안에 풋볼 두 개를 넣은 뒤 두 팀이 각 콘에 줄을 선다. 2) 신호가 울리면 각 줄의 첫 번째 주자가 중앙 후프로 달려가 풋볼을 집어 든다. 3) 동시에 두 번째 주자는 콘을 돌아 뛰어나가 리드 패스를 받아낸다. 4) 잡은 공을 다시 중앙 훌라후프 안에 가져다 놓은 뒤 줄의 맨 뒤로 돌아가고 다음 주자가 진행한다.</p>
