<h1>8자 공 드리블</h1>
<p>1) 양발을 어깨너비로 벌리고 선다. 2) 상체를 최대한 낮추고 공이 몸에서 멀어지지 않도록 다리 사이로 8자를 그리며 드리블한다. 3) 여럿이 나란히 서서 15초 이내에 다음 사람에게 공을 전달해 목표 지점까지 옮긴다. 4) 두 팀으로 나누어 공을 8자로 굴려 목표 지점에 더 빠르고 정확하게 전달하는 경쟁을 한다.</p>
