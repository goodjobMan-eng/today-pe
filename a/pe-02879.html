<h1>수건 스나이퍼</h1>
<p>1) 종이컵 12개를 쌓고 맨 위에 다른 색상의 컵 1개를 올려 목표물을 준비한다. 2) 수건의 한쪽 끝을 잡고 다른 한 손은 옆구리나 허리에 댄다. 3) 수건을 신속하게 털어 수건 끝으로 목표물인 컵을 맞춘다. 4) 쓰러진 컵마다 1점을 얻고 맨 위의 컵을 쓰러뜨리면 추가 10점을 얻는다.</p>
