<h1>육상 기초 코스(도약·가속 달리기)</h1>
<p>1) 1번째 구간에서 콘 사이를 한 발로 디디며 무릎을 높이 들어 수평으로 도약한다. 2) 2번째 구간에서 점진적으로 가속하며 바르게 달린다. 3) 3번째 구간에서 훌라후프 사이에 두 번 디뎌 발을 교차하고 무릎을 들어 수직 도약한다. 4) 4번째 구간에서 처음 두 개의 훌라후프에는 한 발씩 디디고 세 번째 훌라후프에는 두 발로 착지한다.</p>
