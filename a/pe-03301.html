<h1>원 마커 징검다리 건너기</h1>
<p>1) 원 마커를 일렬로 배치하여 징검다리를 만들고 양 끝에 모둠별로 선다. 2) 신호가 울리면 첫 번째 주자가 모둠발 뛰기로 원 마커를 한 개씩 뛰어넘으며 앞으로 이동한다. 3) 두 모둠의 주자가 서로 만나면 멈춰 서서 가위바위보를 한다. 4) 가위바위보에서 진 주자는 징검다리 밖으로 나가고 다음 주자가 출발하며, 이긴 주자는 계속 이동해 상대 출발점에 먼저 도착하면 승리한다.</p>
