<h1>동서남북 축구</h1>
<p>1) 6명이 한 모둠을 이루어 두 모둠이 대결하며, 모둠별로 2개의 골대를 정한다. 2) 상대 모둠의 골대에 공을 넣으면 1점을 얻는다. 3) 공격 모둠은 골대 앞 반원 안에 들어갈 수 없으며, 상대 모둠원을 잡거나 밀면 그 지점에서 멈추었다가 다시 공격한다. 4) 득점하거나 상대 모둠에게 공을 빼앗기면 공수가 바뀌며, 정해진 시간 동안 점수를 더 많이 얻은 모둠이 이긴다.</p>
