<h1>농구 기본 규칙</h1>
<p>1) 5명 대 5명으로 팀을 구성하여 경기를 진행한다. 2) 경기 시간은 40분이며 10분씩 4개 쿼터로 나누어 진행하고 휴식 시간을 가진다. 3) 3점 라인 밖에서 슛을 성공하면 3점을 획득한다. 4) 3점 라인 안쪽에서 슛을 성공하면 2점을 획득한다. 5) 상대가 반칙을 하여 자유투 기회를 얻은 경우 골대 정면 지정된 위치에서 방해 없이 슛을 던져 성공할 때마다 1점을 획득한다.</p>
