<h1>브리지에서 발 차넘기 및 워크오버</h1>
<p>1) 다리와 팔을 곧게 펴고 발을 바닥에 단단히 고정하여 브리지 자세를 만듭니다. 2) 두 다리를 차례로 차올립니다. 3) 런지 자세로 착지한 후 몸을 곧게 폅니다. 4) 워크오버를 할 때는 머리를 뒤로 젖히고 평균대를 보면서 발을 올려놓습니다.</p>
