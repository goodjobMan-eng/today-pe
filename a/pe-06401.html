<h1>유니콘 스톰프 신체활동</h1>
<p>1) 대결하는 두 유니콘 중 마음에 드는 쪽을 응원하며 선택한다.2) 화면 트랙을 따라 버튼이 플레이 존에 들어오면 지정된 신체 동작을 수행한다.3) 빨간색은 왼발 구르기나 깽깽이, 노란색은 오른발 구르기나 깽깽이, 빨강·노랑 동시는 점프, 파란색은 박수, 보라색은 허벅지 치기를 한다.4) 틀린 그림 찾기 미니게임이 나오면 유니콘 요가 자세를 유지하며 3가지 차이점을 찾는다.</p>
