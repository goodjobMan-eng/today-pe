<h1>팔 벌려 가위바위보 신체놀이</h1>
<p>1) 두 명씩 짝을 지어 팔 벌려 가위바위보를 한다. 2) 이긴 학생은 사자, 진 학생은 사슴 역할을 맡는다. 3) 서로 마주 보고 서서 신호에 맞춰 고개를 돌려 같은 방향을 보면 사자 승, 다른 방향을 보면 사슴이 승리한다.</p>
