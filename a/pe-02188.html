<h1>가위바위보 유연성 다리찢기 놀이</h1>
<p>1) 교실 앞 술래와 사물함 앞 두 팀(A팀, B팀)으로 나눈다 2) 술래와 가위바위보를 하여 이긴 학생만 다리를 찢어 한 걸음 나아간다 3) 비기거나 진 학생은 제자리에서 손끝을 바닥에 3초간 대고 유지한다 4) 술래에게 계속 이겨 도착점(점수판 책상 선)에 발이 닿으면 자기 팀의 점수를 올리고 뒷문으로 돌아가 줄을 선다</p>
