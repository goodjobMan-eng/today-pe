<h1>훌라후프 점프하며 봄심기</h1>
<p>1) 교사의 시작 신호에 따라 바구니에 있는 씨앗을 훌라후프 안에 한 개씩 내려놓으며 끝까지 점프하여 이동한다. 2) 돌아올 때는 바구니에 있는 새싹을 한 개씩 내려놓으며 끝까지 점프해서 이동한다. 3) 다음 친구가 출발할 때는 빈 바구니에 씨앗을 담고, 돌아올 때는 새싹을 담아 가지고 오며 활동을 반복한다.</p>
