<h1>수업 연계형 준비운동</h1>
<p>1) 수업 본활동의 학습 목표(예: 방향 전환, 패스, 타격 등)에 맞는 기본 움직임을 선정한다.2) 방향 전환 연습 시 술래잡기(TIG)를 하거나, 패스 연습 시 2인 1조로 공을 주고받는 활동을 약 4분간 진행한다.3) 태그되더라도 탈락하거나 쉬지 않고 움직임을 멈추지 않는다.4) 가벼운 움직임을 통해 체온을 높이고 본활동 기술을 인지적으로 예열한 뒤 본활동으로 전환한다.</p>
