<h1>스쿠터보드 릴레이</h1>
<p>1) 각 모둠 앞에 콘을 놓고 스쿠터보드를 배부한 뒤 5개 모둠으로 나눈다. 2) 첫 주자는 스쿠터보드에 앉아 맞은편 콘까지 이동했다가 돌아온다. 3) 다음 주자에게 스쿠터보드를 넘겨 같은 방식으로 릴레이를 진행한다. 4) 모둠원 전원이 주행을 마치고 먼저 자리에 앉는 모둠이 승리한다.</p>
