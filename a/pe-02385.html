<h1>츄크볼 기초 경기 규칙</h1>
<p>1) 양 팀은 사이드라인과 엔드라인으로 구획된 코트에서 양쪽 바운더 중 어느 곳이든 공격할 수 있다. 2) 공을 잡고 3초 이상 소유하거나 3보 이상 걷지 않으며, 3회 이내로 패스하여 슛을 시도한다. 3) 바운더 앞 3m 반원의 금지 구역(포비든 존)을 밟지 않고 바운더를 향해 공을 던진다. 4) 바운드된 공이 바닥에 닿기 전에 수비팀이 잡지 못하면 공격팀이 1점을 얻고, 수비가 잡으면 경기가 계속된다.</p>
