<h1>벽 족구</h1>
<p>1) 평탄한 벽 앞에서 주발 인사이드로 벽에 공을 다이렉트로 차며 튕겨 나오는 공을 연속으로 찬다. 2) 양발을 번갈아 차기, 발 안쪽/바깥쪽(아웃사이드) 활용하기, 벽을 맞고 나온 공을 1~2회 리프팅 후 벽에 차기로 단계를 높인다. 3) 2인 1조로 콘 사이에 서서 벽을 향해 공을 주고받거나 손을 잡고 토스와 킥을 번갈아 연습한다.</p>
