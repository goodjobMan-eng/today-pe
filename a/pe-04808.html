<h1>햄볼(기백반 변형 규칙)</h1>
<p>1) 드리블 없이 패스로만 공을 연결하여 전진한다.2) 골대에 있는 5군데 구멍 중 가운데 동그라미에 넣으면 2점, 네 꼭짓점 사각형에 넣으면 1점을 얻는다.3) 공을 가진 공격수가 수비수를 공으로 터치하면 수비수는 경기장 밖으로 나가 신체 활동 과제(5회 등)를 수행한 후 복귀한다.4) 신체 접촉 발생 시 수비 파울을 적용하고 파울이 발생한 자리에서 바로 공격을 재개한다.</p>
