<h1>햄버거 술래</h1>
<p>1) 술래에게 태그된 사람은 바닥에 누워 패티(고기)가 된다.2) 다른 친구 두 명이 누워 있는 친구의 양옆에 누워 빵 역할을 해 햄버거를 완성한다.3) 햄버거가 완성되면 잡혔던 친구가 살아나 다시 도망친다.4) 도움을 주러 가는 친구는 술래가 태그할 수 없다.</p>
