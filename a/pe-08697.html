<h1>반원 축구</h1>
<p>1) 직사각형 게임장 양쪽 끝에 반원 영역을 정합니다. 2) 2개의 모둠으로 나누어 골대와 축구공을 준비합니다. 3) 반원 안에 남녀 공격수 각 1명씩만 들어갈 수 있습니다. 4) 같은 모둠끼리 공을 주고받아 골을 넣으면 1점, 반원 안에서 남녀가 주고받은 후 골을 넣으면 2점을 얻습니다. 5) 6점을 먼저 얻는 모둠이 승리합니다.</p>
