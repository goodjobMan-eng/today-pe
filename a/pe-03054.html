<h1>횡단보도 통과하기 달리기 게임</h1>
<p>1) 두 팀으로 나누어 공격 팀(통과)과 수비 팀(차단 구역)을 정하고 3분간 진행한다. 2) 공격 팀은 수비 팀의 터치를 피해 구역을 한 칸씩 통과하여 마지막 칸까지 이동한다. 3) 수비 팀에게 터치당하면 경기장 옆으로 나와서 처음 위치로 돌아가 다시 도전한다. 4) 마지막 칸까지 통과한 공격 팀은 공을 하나 가지고 처음 위치 바구니에 넣으면 1점을 얻는다.</p>
