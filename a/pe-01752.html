<h1>그레이트 8 농구 볼핸들링 워밍업</h1>
<p>1) 개인 원마커 위에 농구공 1개씩을 들고 앉아 준비 자세를 취한다. 2) 양반다리로 앉아 볼 슬랩과 손가락 탭으로 공 감각을 깨우고, 몸 주위로 굴리며 방향을 전환한다. 3) 무릎을 꿇고 공을 떨어뜨려 잡는 드롭 앤 캐치와 일어서서 머리·허리·무릎 3단 돌리기를 실시한다. 4) 오른손/왼손 한 번 튕겨 잡기를 거쳐 제자리 오른손/왼손 연속 드리블 챌린지로 변형해 진행한다.</p>
