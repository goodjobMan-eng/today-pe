<h1>소다 팝(SODA POP) 기초 음악줄넘기</h1>
<p>1) 전주에 맞춰 좌우앞뒤 2도약 8박자와 양발모아 1도약 8박자를 뛴다. 2) 노래 도입부에서 좌우이동 스텝과 앞뒤이동 스텝을 2회씩 번갈아 뛴다. 3) 좌우 벌려 2회와 좌우 이동 2회, 앞뒤 벌려 2회와 앞뒤 이동 2회를 연결하여 뛴다. 4) 번갈아뛰기 및 번갈아 2박자 스텝 후 SO 2도약과 SO SO CO CO 교차 동작으로 마무리한다.</p>
