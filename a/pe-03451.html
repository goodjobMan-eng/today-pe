<h1>선 따라 술래잡기</h1>
<p>1) 술래를 정하고 모든 참가자는 코트에 그려진 선 위에 위치한다. 2) 참가자들은 오직 그려진 선을 따라서만 걷거나 뛸 수 있다. 3) 술래는 10초를 센 후 다른 친구를 잡으러 이동한다. 4) 술래에게 잡힌 친구도 술래가 되며, 10초를 센 후 다른 친구를 잡을 수 있다.</p>
