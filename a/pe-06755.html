<h1>응급처치 맞매듭법</h1>
<p>1) 빨간색 줄과 파란색 줄 두 가닥을 교차하여 옾매듭으로 한 번 묶는다. 2) 위에 올라온 줄을 다시 위로 올려 같은 방식으로 한 번 더 묶어 대칭을 만든다. 3) 묶은 상태에서 짧은 줄을 잡고 힘껏 당겨 매듭을 신속하게 푼다.</p>
