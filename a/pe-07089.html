<h1>문어 술래잡기</h1>
<p>1) 농구 코트 한쪽 끝선에 참가자들이 줄을 서고 중앙에 술래 2명이 위치합니다. 2) 출발 신호가 나면 참가자들은 술래를 피해 반대쪽 끝선까지 뛰어갑니다. 3) 술래에게 태그된 사람은 그 자리에 멈춰 해초가 되며, 원마커에 한 발을 대고 서 있거나 바닥에 앉아서 지나가는 다른 참가자를 태그합니다. 4) 왕복을 반복하여 마지막까지 태그되지 않고 남는 사람이 승리합니다.</p>
