<h1>킨볼 기초 규칙과 경기 방법</h1>
<p>1) 4명씩 3팀(파랑, 회색, 검정)으로 나뉘어 공격 팀이 호명한 색상의 팀이 공이 바닥에 닿기 전에 캐치한다. 2) 공격 팀은 '옴니킨'과 함께 공격할 상대 팀의 색상을 외치고 손바닥을 모아 앞이나 수평으로 타격한다. 3) 수비 팀의 3명은 한쪽 무릎을 꿇고 손바닥을 위로 향해 삼각형을 만들어 공을 지탱한다. 4) 타격된 공이 바닥에 닿거나 코트 라인 밖으로 나가면 실점하여 상대 두 팀에 각 1점씩 부여된다.</p>
