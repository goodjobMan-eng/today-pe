<h1>동물 흉내내기 이동 운동 (Animal Walk)</h1>
<p>1) 화면에 동물(코끼리, 개구리, 곰, 뱀, 말, 게, 토끼, 자벌레, 캥거루, 사자 등)이 나타나면 그 동물의 걸음걸이로 흉내 내며 걷는다.2) 'Freeze' 소리가 들리면 즉시 멈추고 원래 자세로 돌아와 다음 동물을 기다린다.3) 마지막 자유 선택 시간에는 자신이 원하는 동물을 스스로 정해 흉내 낸다.</p>
