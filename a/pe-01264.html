<h1>4단계 농구 볼 핸들링 서킷 타임어택</h1>
<p>1) 콘 4개로 사각 코트를 만들고 각 모퉁이에 1번부터 4번까지 미션 구역을 지정합니다. 2) 1구역은 공 위로 던져 받기 10회, 2구역은 양손 공 튀기기 10회를 순서대로 수행합니다. 3) 3구역은 오른손 튀기기 10회, 4구역은 왼손 튀기기 10회를 연속으로 성공한 뒤 전체 소요 시간을 측정합니다. 4) 양손으로 잡고 튀기기 연습을 거친 뒤 공 2개를 동시에 다루거나 제한 시간을 단축하는 방식으로 변형합니다.</p>
