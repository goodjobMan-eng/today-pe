<h1>스탬프 가위바위보</h1>
<p>1) 학생들에게 스탬프 종이를 나눠주고, 방어팀은 분단별 의자에 앉으며 맨 뒤 학생이 스탬프를 소지한다. 2) 공격팀은 스탬프 종이를 들고 원하는 줄로 달려가 앞 학생부터 순서대로 가위바위보 대결을 한다. 3) 가위바위보를 이기면 한 칸 앞으로 전진하고, 패배하면 다시 맨 앞 친구부터 재도전하거나 다른 줄로 이동한다. 4) 마지막 스탬프를 가진 학생까지 이겨서 제한 시간 10분 내에 모든 줄의 스탬프를 모으면 미션에 성공한다.</p>
