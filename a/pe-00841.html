<h1>봄맞이 둘 중 하나 고르기 브레인 브레이크</h1>
<p>1) 화면에 나타나는 두 가지 봄 관련 선택지 중 자신이 좋아하는 쪽을 선택합니다. 2) 화면이 바뀌면 선택한 쪽에 해당하는 유산소 운동이나 캐릭터 댄스 동작을 수행합니다. 3) 레이스 대결이나 미니언 찾기 등 중간 미니게임이 나오면 제자리 달리기나 퀴즈 맞히기 신체활동으로 참여합니다. 4) 라운드가 바뀔 때마다 새로운 선택지가 나오며 같은 방식으로 반복합니다.</p>
