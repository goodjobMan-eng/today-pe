<h1>가상 운동회 챌린지</h1>
<p>1) 구글 슬라이드에 제시된 다양한 체육 및 특별 활동 중 원하는 종목을 선택한다. 2) 각 활동별 안내 슬라이드를 확인하고 집 주변의 간단한 도구를 활용해 가족과 함께 활동을 수행한다. 3) 활동을 완료한 후 메인 페이지로 돌아와 완료한 활동 수를 기록한다. 4) 완료한 활동 수에 따라 메달 기준(10개 브론즈, 15개 실버, 20개 골드)에 도전한다.</p>
