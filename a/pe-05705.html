<h1>친구야 함께 운동하자!</h1>
<p>1) 턱점프를 3~5회 실시한 후 짝과 사인을 교환한다.2) 원마커 목표를 놓고 제자리 멀리뛰기를 실시한다.3) 사이드스텝 후 하이파이브 및 라인 원마커 터치를 정해진 횟수만큼 실시한다.4) 나무 자세 버티기 및 발 가위바위보를 진행한다.5) 짝과 함께 목표 줄넘기 횟수를 분담해 달성한다.6) 공 바운드하여 잡기 및 띄워 잡기를 짝과 성공하고 사인을 교환한다.</p>
