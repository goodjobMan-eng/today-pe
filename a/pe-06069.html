<h1>축구공 점핑 릴레이</h1>
<p>1) 반환점 콘을 돌아오는 경로를 확인하고 모둠별로 줄을 선다.2) 발목 사이에 축구공을 끼우고 양발로 점프하며 앞으로 이동한다.3) 반환점 콘을 돌아 출발선으로 돌아온다.4) 다음 주자에게 공을 손으로 그냥 주지 않고, 발목으로 공을 위로 들어 올려 손으로 전달한 뒤 다음 주자가 이어받는다.</p>
