<h1>홈 피트니스 타바타 및 코어 공 다루기</h1>
<p>1) 스트레칭으로 관절과 전신 근육을 충분히 풀어 준비한다. 2) 화면의 초록 신호에 맞춰 맨몸 운동을 하고 빨간 신호에 맞춰 휴식하는 타바타 운동을 8라운드 진행한다. 3) 호흡을 가다듬는 마인드풀니스 시간을 가진 뒤 앉은 자세를 취한다. 4) 소형 공이나 뭉친 양말을 양손과 양발 사이로 넘기며 허리·머리 돌리기 및 크런치 동작의 코어 운동으로 마무리한다.</p>
