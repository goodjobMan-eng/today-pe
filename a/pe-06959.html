<h1>터치다운 히어로즈 풋볼 운동</h1>
<p>1) 코치의 안내에 따라 제자리에서 빠르게 달리는 40야드 대시를 연습한다. 2) 날아오는 미식축구 공을 양손으로 잡는 캐치 동작을 훈련한다. 3) 수비수를 피하기 위해 좌우로 방향을 트는 닷지와 스핀 동작을 익힌다. 4) 수비수를 뛰어넘는 점프와 밀어내는 스티프 암 동작을 연습한다. 5) 실전 경기 5개 레벨 동안 화면 신호에 맞춰 동작을 연계해 터치다운을 성공시키고 세리머니 댄스를 춘다.</p>
