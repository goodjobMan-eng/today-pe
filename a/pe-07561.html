<h1>고무줄 골대 축구 게임</h1>
<p>1) 양 팀 골대를 콘 2개 사이 8걸음 간격으로 설치하고 팀별 골키퍼를 1명씩 선발한다. 2) 일반 축구 규칙으로 경기하되 키퍼는 공을 잡을 수 없고 발이나 몸, 쳐내기로만 방어한다. 3) 득점한 팀의 골대는 양쪽 콘을 한 걸음씩 넓히고, 실점한 팀의 골대는 한 걸음씩 좁힌다. 4) 키퍼의 허리 아래로 들어간 공만 득점으로 인정하며 정해진 시간 후 다득점 팀이 승리한다.</p>
