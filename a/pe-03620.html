<h1>티볼 수비 간이경기</h1>
<p>1) 배트로 타격하는 대신 타자가 손으로 공을 던져서 수비 연습을 시작한다. 2) 던지는 사람은 땅볼, 뜬 볼, 원바운드 등 실제 경기 상황처럼 공을 던진다. 3) 타자 주자는 공을 던진 후 베이스를 향해 전력으로 달린다. 4) 수비수는 공을 잡아 주자보다 먼저 가까운 베이스로 송구하여 아웃을 잡는다.</p>
