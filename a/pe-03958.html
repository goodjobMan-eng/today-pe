<h1>메모리 릴레이 챌린지</h1>
<p>1) 3~5명씩 팀을 나누고 출발선 훌라후프에 정렬한 뒤 중앙에 콘과 그 아래 색깔 빈백을 숨긴다. 2) 신호가 울리면 각 팀 첫 번째 주자가 중앙으로 달려가 콘 1개를 들어 확인한다. 3) 자기 팀 색깔이 아니면 콘을 다시 덮고 돌아오며, 자기 팀 색깔이면 콘을 쓰러뜨려 두고 빈백을 가져온다. 4) 팀원들이 번갈아 가며 달려가 5개의 빈백을 모두 먼저 찾는 팀이 승리한다.</p>
