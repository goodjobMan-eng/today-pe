<h1>거미곰 술래잡기</h1>
<p>1) 술래는 곰 걸음(네발 엎드려 걷기)으로 쫓아가고, 도망자는 거미 걸음(손발을 바닥에 대고 배를 위로 든 자세)으로 도망친다. 2) 매트 위는 거미줄 구역으로, 도망자는 매트 위에서 10초 동안 엉덩이를 바닥에 대고 쉴 수 있다. 3) 매트에서 10초가 지나면 다른 거미줄(매트)로 이동해야 다시 쉴 수 있다. 4) 제한 시간이 될 때까지 거미 걸음 상태로 끝까지 도망치면 승리한다.</p>
