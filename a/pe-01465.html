<h1>사각형 콘 페인트 술래잡기</h1>
<p>1) 접시콘 4개를 사각형 형태로 널찍하게 배치하고 술래 1명은 팀조끼를 입고 선다. 2) 도망자 2~3명은 사각형 콘의 바깥쪽 라인을 따라 술래의 반대편에 위치한다. 3) 신호가 울리면 술래는 콘 라인을 따라 이동하며 페인트를 활용해 도망자를 터치하려 하고, 도망자는 콘을 돌며 피한다. 4) 술래에게 터치된 도망자는 팀조끼를 넘겨받아 새로운 술래가 되며, 익숙해지면 이동 방식을 사이드스텝 등으로 제한한다.</p>
