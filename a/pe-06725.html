<h1>유치부·저학년 체육 기술 및 놀이 모음</h1>
<p>1) 지그재그로 놓인 스팟 마커를 한 발씩 번갈아 뛰며 스케이트 동작으로 이동한다. 2) 벽에서 4~5m 떨어진 곳에 훌라후프를 두고 라켓으로 공을 쳐 벽에 맞힌 뒤 훌라후프 안에 바운드되도록 조절한다. 3) 짐볼에 테니스공을 던져 튕겨 나오는 공을 잡거나, 미니 허들을 넘기며 발등으로 축구공을 띄워 넘긴다.</p>
