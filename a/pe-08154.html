<h1>훌라후프 스파이크볼</h1>
<p>1) 훌라후프를 바닥에 두고 양 팀이 마주 보고 선다. 2) 서버가 훌라후프 안 바닥으로 공을 바운드시켜 상대 팀에게 서브한다. 3) 서브 후에는 구역 제한 없이 훌라후프 주변 360도를 자유롭게 움직이며 공을 바운드시켜 주고받는다. 4) 공이 훌라후프 테두리에 맞거나 안에서 두 번 바운드되거나 받아넘기지 못하면 실점한다.</p>
