<h1>손바닥 공 떨어뜨려 받기와 공 떨어뜨리기 대결</h1>
<p>1) 두 사람이 손바닥을 펴서 수건 볼(또는 공)을 함께 맞잡고 타이밍을 맞춰 전후좌우로 이동한다. 2) 익숙해지면 손가락 3개, 2개, 1개로 맞잡고 이동해 본다. 3) 위에서 떨어뜨리는 공을 두 손바닥으로 손가락을 쓰지 않고 타이밍을 맞춰 부드럽게 협동하여 받아낸다. 4) 각자 손바닥을 펴서 공을 올린 뒤 손가락으로 쥐지 않고 떨어지지 않게 균형을 잡으며 상대 공을 쳐서 떨어뜨리면 1점을 얻는다.</p>
