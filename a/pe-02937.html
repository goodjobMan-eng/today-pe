<h1>까막잡기</h1>
<p>1) 두 조로 나누고 한 조에서는 술래인 고양이를, 다른 조에서는 도망자인 쥐를 선발한다. 2) 고양이와 쥐 역할을 맡은 두 어린이는 눈을 수건으로 완전히 가린다. 3) 나머지 어린이들은 둘러앉아 원 형태의 경기 구역을 만든다. 4) 원 안에서 눈을 가린 고양이가 쥐를 찾아 잡으며, 쥐가 원 밖으로 나가면 잡힌 것으로 처리한다.</p>
