<h1>플디 유산소 볼링</h1>
<p>1) 1번 주자가 플라잉디스크를 던져 세워진 볼링핀을 맞혀 쓰러뜨린다.2) 1번 주자는 다음 주자(2번)에게 디스크를 넘겨주고 쓰러진 볼링핀을 다시 세우러 달려간다.3) 쓰러진 볼링핀을 세우고 출발선 뒤로 돌아온다.4) 정해진 시간(약 3분~5분) 동안 팀원들이 릴레이로 던지고 세우기를 반복하며 총 넘어진 핀 수를 기록한다.</p>
