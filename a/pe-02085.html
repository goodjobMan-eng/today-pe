<h1>가정 및 교실 표적 도전 활동 3가지</h1>
<p>1) 종이 과녁판을 만들고 신문지 공을 10번 던져 점수 합계를 내는 벽 과녁 던지기를 한다. 2) 빗자루나 도구를 사용해 공을 쳐서 상자 골대 사이를 통과시키는 홀 통과 도전(10회)을 한다. 3) 바닥에 1점부터 5점까지 구역을 나누고 도구로 공을 쳐서 점수를 획득하는 퍼팅 도전을 10회 실시한다. 4) 의자 다리 사이에 신문지 공을 매달아 흔들리게 한 뒤 던져서 맞히는 움직이는 표적 맞히기를 진행한다.</p>
