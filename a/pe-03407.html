<h1>피자 배달하기 게임</h1>
<p>1) 2인 1조로 모둠을 이루고 콘 옆에 모둠별로 피자(플라잉디스크) 2개를 놓은 뒤 배달할 사람과 받을 사람을 정한다. 2) 신호가 울리면 배달하는 사람이 피자를 향해 달려가 피자를 가져와 친구에게 전달하고 다시 달려간다. 3) 2개의 피자 배달이 끝나면 역할을 바꾸어 한 번 더 진행한다. 4) 피자 2개를 가장 빨리 가져오는 모둠이 승리하며, 피자 수를 늘리거나 달리는 거리를 늘려 변형할 수 있다.</p>
