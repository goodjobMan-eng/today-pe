<h1>페트병 입구로 공 받기 레이스</h1>
<p>1) 페트병 윗부분을 잘라 만든 깔때기 모양의 도구를 손에 든다. 2) 일렬로 놓인 콘이나 마커 위치에 플레이어가 정렬한다. 3) 앞의 투구자가 던져주는 작은 공을 페트병 도구로 받아낸다. 4) 마지막으로 공을 잡아낸 플레이어만 다음 콘(마커) 위치로 전진하며, 가장 먼 지점에 먼저 도달하면 득점한다.</p>
