<h1>양말 공 던지고 받기 신체 조절 챌린지</h1>
<p>1) 집 안에서 양말 한 켤레를 둥글게 말아 양말 공(빈백 대용)을 만든다. 2) 거실이나 차고 등 주변에 방해물이 없는 빈 공간을 확보하고 몸의 균형을 잡는다. 3) 양말 공을 공중으로 던진 뒤 몸이 흔들리지 않게 제어하며 양손으로 안전하게 받는다. 4) 익숙해지면 공중에 던진 후 박수를 한 번 치고 잡는 등 동작을 추가하여 도전한다.</p>
