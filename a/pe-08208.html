<h1>쥐와 토끼 (반응속도 달리기 놀이)</h1>
<p>1) 콘 4개로 구역을 나누고 중앙선에 두 명씩 짝을 지어 선 뒤 한 명은 쥐(Rat), 한 명은 토끼(Rabbit)로 지정한다. 2) 코치가 '쥐(Rats)!'를 외치면 쥐는 자신의 엔드라인을 향해 전력 질주하고, 토끼는 쥐가 라인에 닿기 전에 태그해야 한다. 3) 한 라운드가 끝나면 조깅하며 원래 자리로 돌아와 코치의 다음 신호를 준비한다.</p>
