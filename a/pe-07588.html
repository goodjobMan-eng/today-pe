<h1>박쥐 놀이</h1>
<p>1) 한 명이 안대로 눈을 가리고 술래인 박쥐가 된다. 2) 나머지 참여자들은 신호에 맞춰 술래 주변을 자유롭게 걸어 다니며 침묵하거나 술래를 건드려 혼란을 줄 수 있다. 3) 박쥐는 촉각으로만 상대를 잡고 얼굴 등을 만져 누구인지 이름을 맞힌다. 4) 알아맞히는 데 성공하면 잡힌 사람이 다음 박쥐가 되고, 맞히지 못하면 술래를 계속한다.</p>
