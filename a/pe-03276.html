<h1>보치아 게임</h1>
<p>1) 두 모둠이 서로 다른 색으로 공을 6개씩 준비한다. 2) 던지기 선에서 흰색 공을 먼저 던진 뒤, 양쪽에서 1명씩 나와 공을 1개씩 던진다. 3) 흰색 공에서 더 멀리 던진 모둠이 먼저 의자에 앉아 나머지 공을 모두 던지고, 상대 모둠도 5개의 공을 모두 던진다. 4) 모둠별로 흰색 공에 가장 가깝게 던진 공의 거리를 비교하여, 상대 모둠보다 더 가까이 던진 공의 개수마다 1점씩 얻는다.</p>
