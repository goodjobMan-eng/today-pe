<h1>짝 줄넘기 마주보기와 나란히 뛰기</h1>
<p>1) 2인 1조로 짝을 짓고 약간 긴 규격의 줄넘기 1개를 준비한다. 2) 마주보기는 한 명이 줄을 돌리고 다른 한 명이 타이밍에 맞춰 안으로 들어가 함께 호흡을 맞춰 뛴다. 3) 나란히 뛰기는 각자 바깥쪽 손으로 줄 손잡이를 하나씩 잡고 구령에 맞춰 동시에 크게 돌리며 넘는다. 4) 기본 도약이 익숙해지면 공중 회전 돌기, 바닥 터치하기, 줄 밖으로 빠져나왔다 다시 들어가기 등으로 변형한다.</p>
