<h1>배구 벽치기 스파이크 연습</h1>
<p>1) 벽 앞에 서서 공을 띄우고 손목과 손바닥으로 벽을 향해 튀기는 터치감을 익힌다. 2) 어깨를 바깥쪽으로 부드럽게 열고 공이 몸의 이마 앞쪽 라인에 오도록 위치를 잡는다. 3) 공이 다가오기 전에 치는 손이 먼저 마중 나가 대각선 아래 바닥을 맞고 벽으로 향하게 스파이크한다. 4) 벽에서 튀어나오는 공을 연속해서 안정적인 타점과 각도로 때려 이어간다.</p>
