<h1>농구 레이업 슛 단계별 도전</h1>
<p>1) 왼발을 앞으로 딛고 제자리에서 백보드를 맞추며 공을 올려놓는 연습을 한다. 2) 뒤로 두 걸음 물러난 뒤 걸어가며 왼발이 닿을 때 오른손으로 슛을 한다. 3) 왼발로 가볍게 점프하며 오른 무릎을 올리고 레이업 슛을 연결한다. 4) 천천히 달리다가 빠르게 달리는 속도를 이용하여 점프 후 슛을 10번 시도해 목표 성공 횟수에 도전한다.</p>
