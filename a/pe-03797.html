<h1>엘리 캣 리듬 댄스</h1>
<p>1) 양발을 모으고 서서 오른발을 옆으로 두 번 딛고 모은 뒤, 왼발을 옆으로 두 번 딛고 모은다. 2) 오른발을 뒤로 두 번 딛고 모은 후, 왼발을 뒤로 두 번 딛고 모은다. 3) 오른 무릎과 왼 팔꿈치를 두 번 맞닿고, 반대로 왼 무릎과 오른 팔꿈치를 두 번 맞닿은 후 1회씩 번갈아 교차한다. 4) 박수를 1회 치고 오른쪽으로 90도 회전하여 동일한 동작을 반복한다.</p>
