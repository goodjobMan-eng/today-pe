<h1>음식 레시피 온몸 타바타 홈트</h1>
<p>1) 매트나 평평한 바닥에 안전하게 서서 전신 관절을 가볍게 풀어 준비한다. 2) 피자 도우 치대기, 햄버거 패티 푸시업, 스파게티 면 삶기 등 음식 조리 동작을 온몸 운동으로 수행한다. 3) 구령에 맞춰 정해진 세트와 횟수를 채워 근력과 심폐지구력을 발휘한다. 4) 학생들이 좋아하는 나만의 음식 메뉴를 추가하여 새로운 전신 동작을 만들어 변형한다.</p>
