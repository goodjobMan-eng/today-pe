<h1>폭소 영상 선택 피트니스 인터벌</h1>
<p>1) 화면 좌우에 제시된 두 가지 재미있는 동물 영상을 10초 동안 관찰한다. 2) 자신이 더 웃기다고 생각하는 영상 하나를 속으로 선택한다. 3) 화면이 전환되면 선택한 영상 아래에 배정된 맨몸 운동(스키 점프, 제자리 달리기, 스쿼트 등)을 확인한다. 4) 지정된 운동 동작을 30초 동안 집중하여 수행하며 총 8라운드 동안 다양한 피트니스 활동을 완주한다.</p>
