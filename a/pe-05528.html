<h1>주사위술래</h1>
<p>1) 가위바위보나 지명으로 술래를 정하고 술래에게 대형 주사위를 쥐어준다.2) 술래가 도망치는 친구를 쫓아가 손으로 태그한다.3) 태그된 사람은 그 자리에서 주사위를 굴리고 나온 눈의 수만큼 신체 활동 과제(버피테스트)를 수행한다.4) 과제를 마친 사람이 새로운 술래가 되어 다른 친구를 쫓아가며, 교사가 '그만'을 외쳤을 때 주사위를 가진 사람이 벌칙을 받는다.</p>
