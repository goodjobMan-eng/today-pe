<h1>큐피드 태그</h1>
<p>1) 1명의 솜너스가 학생들을 쫓아가 태그하면 태그된 학생은 제자리에서 잠자는 흉내를 내며 멈춘다. 2) 1명의 큐피드는 폼볼(골든 애로우)을 들고 돌아다니다가 잠자는 학생에게 공을 전달해 부활시킨다. 3) 같은 색 공을 가진 잠자는 학생 둘이 만나면 러브 스쿼드를 결성하여 손을 잡고 활동한다. 4) 큐피드는 러브 스쿼드가 커지면 리드 애로우를 사용하여 스쿼드를 반으로 쪼개 게임을 진행한다.</p>
