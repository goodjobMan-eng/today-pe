<h1>우리 집에 모여라</h1>
<p>1) 4명의 참가자가 각자 본인의 훌라후프(집)을 1개씩 골라 링 옆에 섭니다. 2) 시작 신호에 맞춰 다른 사람의 링 안에 있는 콘을 나의 집으로 가져옵니다. 3) 1번에 1개의 콘만 이동할 수 있고, 콘을 본인 집으로 옮길 때 외에는 콘을 들고 이동할 수 없습니다. 4) 제한시간(30초)이 끝났을 때 링에 가장 많은 콘을 가지고 있는 사람이 승리합니다.</p>
