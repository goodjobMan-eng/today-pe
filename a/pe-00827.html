<h1>마리오 할로윈 런</h1>
<p>1) 화면에 나타나는 쿠파와 몬스터들의 공격에 맞춰 점프, 숙이기, 발차기, 좌우 피하기 동작을 수행합니다. 2) 스테이지 사이에는 숨겨진 사탕 바구니를 찾거나 쿠파가 지나간 방향의 포즈를 유지하는 미션이 주어집니다. 3) 레벨이 올라갈수록 등장하는 장애물의 속도와 복합 동작이 늘어납니다. 4) 끝까지 모든 장애물을 회피하고 문제를 해결해 빼앗긴 사탕 바구니를 되찾습니다.</p>
