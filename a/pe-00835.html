<h1>100일 기념 밸런스 운동 선택 게임</h1>
<p>1) 화면에 제시되는 두 가지 선택지 중 마음에 드는 쪽을 15초 카운트다운 동안 고릅니다. 2) 화면이 전환되면 선택한 쪽에 해당하는 동작(버피, 복근 운동, 스트레칭 등)을 30초 동안 따라 수행합니다. 3) 라운드가 바뀔 때마다 새로운 선택지와 동작이 주어집니다. 4) 지정된 시간 동안 끝까지 멈추지 않고 동작을 완료하며 체력을 기릅니다.</p>
