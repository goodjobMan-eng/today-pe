<h1>우리 마당에서 쓰레기 치우기 게임</h1>
<p>1) 배구 코트에 네트를 치고 학급을 두 팀으로 나누어 양쪽 코트에 배치한다. 2) 각 진영에 폼볼과 콩주머니(쌀주머니)를 골고루 나누어 준다. 3) 폼볼은 네트 위로, 콩주머니는 네트 아래로 상대 진영을 향해 1개씩 던져 넘긴다. 4) 교사가 휘슬이나 음악을 멈췄을 때 자기 진영에 쓰레기(교구)가 더 적은 팀이 승리한다.</p>
