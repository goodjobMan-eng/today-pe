<h1>딱지치기 배꼽 맞추기 도전</h1>
<p>1) 종이 2장을 접어 딱지 2개를 만든다. 2) 바닥에 놓인 목표 딱지의 정중앙(배꼽)이나 들뜬 부분을 향해 내 딱지를 내리치는 연습을 한다. 3) 2명이 가위바위보를 하여 순서를 정하고, 진 사람의 딱지를 바닥에 놓는다. 4) 이긴 사람부터 번갈아 가며 상대 딱지를 쳐서 완전히 뒤집히면 승리한다.</p>
