<h1>신문지 잡고 돌아가는 협동 커피잔 놀이</h1>
<p>1) 안쪽 학생들은 다리를 중앙으로 모으고 바닥에 엉덩이를 대고 앉습니다. 2) 바깥쪽 학생들은 서서 안쪽 학생들과 말아 쥔 신문지 봉을 마주 잡아 연결합니다. 3) 신문지가 찢어지거나 놓치지 않도록 힘을 조절하며 바깥 학생들이 원을 그리며 천천히 회전합니다. 4) 안쪽 학생들은 원심력을 느끼며 몸을 지탱하고, 팀 전체가 끊김 없이 한 바퀴를 돌면 성공합니다.</p>
