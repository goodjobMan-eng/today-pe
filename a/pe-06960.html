<h1>가방을 활용한 어린이 홈트레이닝</h1>
<p>1) 책가방에 책, 장난감, 신발 등을 넣어 적절한 무게를 맞춘다(너무 무거우면 내용물을 뺀다) 2) 가방을 메고 제자리 조깅(Warm-up Jog)으로 몸을 푼다 3) 런지 점프, 삼두 익스텐션, 제자리 뛰며 손 흔들기, 바이셉 컬, 백팩 쓰러스터, 백팩 북 치기, 밸런스 스쿼트, 몸통 비틀기 동작을 순서대로 수행한다</p>
