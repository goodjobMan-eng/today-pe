<h1>정글 탐험하기 게임</h1>
<p>1) 콘이나 줄을 이용해 경기장을 만들고, 두 개 모둠(공격 모둠, 수비 모둠인 악어)으로 나눈다. 2) 수비 모둠은 한 선에 한 명씩 서서 준비하고, 공격 모둠은 출발 지점에 선다. 3) 신호가 울리면 공격 모둠은 선을 따라 이동하는 수비수를 피해 도착 지점으로 달린다. 4) 수비수의 손을 피해 정글을 통과한 인원수가 점수가 되며, 번갈아 진행해 점수가 높은 모둠이 승리한다.</p>
