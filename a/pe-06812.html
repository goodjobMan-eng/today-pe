<h1>후프에 서브 넣기 게임</h1>
<p>1) 4명씩 모둠을 구성하고 순서를 정한 뒤 출발선 앞쪽에 후프 2개를 나란히 놓는다. 2) 1번부터 출발선에서 셔틀콕을 쳐서 먼 쪽 후프에 넣고 친 셔틀콕은 직접 주워 온다. 3) 먼 쪽 후프에 들어가면 가까운 쪽 후프를 먼 쪽으로 옮겨 거리를 늘리며 도전한다. 4) 정해진 시간 동안 가장 멀리 이동한 모둠이 승리한다.</p>
