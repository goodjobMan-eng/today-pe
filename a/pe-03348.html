<h1>원형 경기장 추격 이어달리기</h1>
<p>1) 콘으로 원형 경기장을 표시하고 경기장을 4개 구역으로 나누어 원의 4분의 1 지점마다 각 모둠이 위치한다. 2) 신호에 맞춰 각 지점에서 모둠별 첫 주자가 동시에 출발하여 원형 트랙을 달린다. 3) 원을 한 바퀴 돌고 난 후 다음 모둠원에게 배턴을 전달한다. 4) 마지막 주자가 가장 먼저 출발점으로 돌아오는 모둠이 승리하며, 뒤 모둠에게 추월당한 모둠은 경기에서 제외되는 규칙을 추가할 수 있다.</p>
