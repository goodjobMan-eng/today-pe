<h1>[뉴스포츠] 피볼(P-Ball)</h1>
<p>1) 타자는 배트로 티 위에 놓인 피구공을 쳐서 안타를 노린다. 2) 타자주자는 공을 친 후 1루, 2루, 3루를 향해 달린다. 3) 수비수는 잡은 피구공으로 주자를 맞히거나 베이스로 던져 아웃을 잡으며, 3아웃이 되면 공수를 교대한다.</p>
