<h1>같은 쪽을 바라봐 &amp; 톰과 제리</h1>
<p>1) 두 사람이 짝을 이루고 진행자가 구령을 외친다.2) '같은 쪽을 바라봐'는 구령에 맞춰 고개를 90도 돌려 두 사람이 같은 쪽을 바라보면 1점을 획득한다.3) '톰과 제리'는 가위바위보로 톰(고양이)과 제리(쥐) 역할을 정한다.4) 구령에 맞춰 고개를 돌려 같은 쪽을 보면 톰이 1점, 다른 쪽을 보면 제리가 1점을 획득한다.</p>
