<h1>교실 라인댄스 지도</h1>
<p>1) TV 화면으로 댄스 영상(스파크 댄스 5-6-7-8)을 보며 동작의 전체 흐름을 익힙니다. 2) 교사가 동작을 한꺼번에 가르치지 않고 몇 동작씩 끊어서 시범 보이고 설명합니다. 3) 영상을 다시 틀어놓고 교실 책상 사이 공간에서 학급 전체가 동작을 끝까지 따라 춥니다. 4) 배운 동작을 학생들이 좋아하는 K-pop 노래(Pretty Girl 등)에 맞춰 적용하며 춤춥니다.</p>
