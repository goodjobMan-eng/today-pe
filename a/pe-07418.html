<h1>농구 스텝 워밍업 서킷</h1>
<p>1) 4개의 코너(아틀리에)로 나누어 각 코너에 3명씩 출발 지점에 선다. 2) 제1코너는 파란 후프에서 오른발, 빨간 후프에서 왼발로 멈추며 이동한다. 3) 제2코너는 옆으로 스텝을 밟으며 멈추는 동작을 반복한다. 4) 제3코너는 민첩성 사다리(스텝래더) 칸마다 양발을 두 번씩(오른발-왼발) 빠르게 밟으며 지나간다. 5) 제4코너는 간격이 점점 넓어지는 막대(라트)를 건너뛰며 전진한다.</p>
