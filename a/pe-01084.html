<h1>다득점 후프 볼링 게임</h1>
<p>1) 훌라후프 9개를 3x3 격자(또는 1열)로 배치하고 각 후프 중앙에 1~10점 숫자 마커를 놓은 뒤 출발선을 정한다. 2) 모둠별 순서대로 출발선에 서서 폼볼을 바닥에 낮게 굴려 목표 후프 안을 향해 굴린다. 3) 공이 후프 안에 온전히 멈추면 해당 후프에 적힌 점수를 획득하며, 후프 밖으로 벗어나면 0점으로 처리한다. 4) 4개 팀이 동서남북 네 방향에서 번갈아 투구하거나 팀원 합산 점수가 먼저 목표 점수에 도달하면 승리한다.</p>
