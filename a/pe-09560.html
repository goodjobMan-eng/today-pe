<h1>볼링 핀 잡기 게임</h1>
<p>1) 학급을 두 팀으로 나누고 체육관 양쪽에 볼링 핀 12개씩을 세운다. 2) 중앙선을 넘어 상대 팀 진영의 볼링 핀을 굴려서 넘어뜨린다. 3) 핀을 넘어뜨리면 우리 팀 진영으로 가져와서 더 많은 핀을 모으거나 먼저 다 모으는 팀이 승리한다.</p>
