<h1>스쿠터보드 직선 코스 릴레이</h1>
<p>1) 각 팀의 주자는 스쿠터보드를 타고 혼자 직선 코스를 이동한다.2) 콘에 닿으면 반칙이 되므로 닿지 않도록 주의하며 주행한다.3) 출발선을 완전히 통과해야 다음 주자와 교대할 수 있으며 마지막 5번째 주자까지 먼저 들어온 팀이 승리한다.</p>
