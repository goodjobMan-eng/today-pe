<h1>층간소음 제로 무소음 교실 서킷 트레이닝</h1>
<p>1) 교실 책상 옆 통로에 개인 매트나 활동 공간을 마련하고 차렷 자세로 정렬한다. 2) 팔다리 가볍게 뛰기, 누워 무릎 당기기, 뒷 런지 트위스트 등 10개 유산소·근력 종목을 순서대로 진행한다. 3) 각 종목은 30초간 쉬지 않고 지속하며 동작 사이 5초간 휴식하면서 호흡을 가다듬는다. 4) 발을 바닥에서 떼지 않는 무소음 템포로 진행하며 체력 수준에 따라 세트 수를 2~3회로 늘린다.</p>
