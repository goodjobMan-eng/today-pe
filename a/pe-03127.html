<h1>동작 무궁화 꽃이 피었습니다</h1>
<p>1) 술래가 벽을 보고 서서 구령을 외치고 나머지 참가자들은 출발선에 선다. 2) 술래가 '시계 꽃이 피었습니다', '파도 꽃이 피었습니다' 등 특정 사물이나 동작 이름을 넣어 외친다. 3) 참가자들은 술래가 돌아볼 때 해당 단어에 맞는 흉내 동작을 취하며 멈춘다. 4) 동작을 잘 표현하지 못하거나 움직인 사람은 술래에게 지적받아 한 걸음 더 앞으로 나오거나 탈락한다.</p>
