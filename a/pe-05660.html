<h1>고리 킥 볼링 게임</h1>
<p>1) 일정한 거리에 점수가 적힌 숫자 고깔콘을 세워 둔다.2) 출발선에서 고리를 발로 차거나 바닥에 댄 상태로 밀어서 고깔콘을 넘어뜨린다.3) 쓰러뜨린 고깔콘의 점수를 합산하여 기록한다.4) 정해진 점수(예: 100점)에 먼저 도달하면 승리한다.</p>
