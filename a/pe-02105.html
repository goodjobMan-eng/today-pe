<h1>플라잉디스크 던지고 받기와 러닝 캐치</h1>
<p>1) 손가락 세 개로 디스크 테두리 안쪽을 잡고 엄지는 위를 받치며 검지는 던질 방향을 가리키는 그립을 잡는다. 2) 디스크를 가슴과 반대쪽 어깨에 붙였다가 허리를 틀며 앞으로 팔을 뻗어 던진다. 3) 받는 사람은 두 팔을 위아래로 벌려 악어 입 모양으로 디스크를 잡는다. 4) 던지는 방향으로 달려가며 잡는 러닝 캐치나 골대 안으로 던져 넣는 활동으로 심화한다.</p>
