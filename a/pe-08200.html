<h1>나베나베 소코누케 술래잡기</h1>
<p>1) 가위바위보 등으로 술래와 도망자를 정한다. 2) 술래가 10을 세는 동안 도망자는 도망친다. 3) 수를 다 센 술래가 도망자를 쫓아간다. 4) 술래에게 태그된 사람은 양손을 앞으로 뻗고 그 자리에서 굳는다. 5) 동료가 마주 보고 양손을 맞잡은 뒤, 같은 방향을 보고 맞잡은 팔 안쪽 고리를 통과해 바깥쪽을 보며 등을 맞대고 서면 풀려나 도망칠 수 있다.</p>
