<h1>변형 미니 핸드볼 게임</h1>
<p>1) 콘으로 설정된 골에어리어와 미니 골대를 양쪽에 두고 3:3으로 팀을 구성한다. 2) 신체 접촉 없이 패스를 유지하며 공을 앞으로 전진시킨다. 3) 골에어리어 밖에서 슛을 시도하며 1단계는 바운드 슛, 2단계는 다이렉트 슛으로 진행한다. 4) 골키퍼만 골에어리어에 들어갈 수 있으며 혼성 경기 시 여학생 득점에는 3점을 부여한다.</p>
