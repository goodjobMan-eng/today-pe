<h1>셔틀 놀이</h1>
<p>1) 한 명의 폭격수를 정해 스펀지 공을 주고, 나머지 참가자들은 짝을 지어 훌라후프를 바닥과 평행하게 양손으로 잡는다. 2) 짝 중 한 명은 눈을 감고 다른 동료의 안내를 받아 이동한다. 3) 지도자의 신호에 맞춰 폭격수가 후프 안으로 공을 던져 침몰시키려 하며, 맞은 조는 후프를 바닥에 두고 살아남은 다른 조의 후프를 잡아 점차 더 많은 인원이 탑승한 셔틀을 만든다.</p>
