<h1>제기 만들기 및 제기차기</h1>
<p>1) 색한지를 겹쳐 가위로 양쪽을 자릅니다. 2) 병뚜껑에 동전을 넣고 색한지 가운데에 올려 돌돌 맙니다. 3) 동전을 중심으로 양쪽 술을 모아 비틀고 고무줄로 고정합니다. 4) 술을 비벼 넓게 폅니다. 5) 제기를 발로 차서 땅에 떨어뜨리지 않고 많이 차는 편이 이깁니다.</p>
