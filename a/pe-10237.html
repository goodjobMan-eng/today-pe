<h1>색깔판 뒤집기</h1>
<p>1) 색깔판을 바닥에 내려놓고 두 팀으로 나누어 출발선 앞에 대기한다. 2) 출발 신호에 맞춰 달려가 제한시간 30초 동안 자신의 색깔이 보이도록 색깔판을 뒤집는다. 3) 경기 종료 후 자신의 색깔판을 가져와 개수가 많은 팀이 승리한다.</p>
