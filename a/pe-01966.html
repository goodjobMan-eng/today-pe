<h1>구역 수비 축구 게임</h1>
<p>1) 양쪽 골대 앞쪽에 콘으로 전용 수비 구역을 설정하고 공격수와 수비수, 골키퍼 역할을 나눈다. 2) 수비수는 지정된 수비 구역 밖으로 나갈 수 없고 그 안에서만 방어한다. 3) 공격수는 수비 구역을 통과하며 패스 연계를 시도하고 상대 골대에 공을 넣어 득점한다. 4) 종목에 따라 축구공 대신 핸드볼이나 농구공으로 바꾸고 골대 형태를 변형할 수 있다.</p>
