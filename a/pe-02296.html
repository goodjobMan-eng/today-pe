<h1>뜀틀에서 손짚고 다리 벌려 넘기</h1>
<p>1) 적당한 거리에서 달려와 구름판 중간보다 약간 위쪽을 양발로 강하게 밟아 도약한다. 2) 뜀틀의 2/3 지점 또는 중간보다 먼 지점에 양손을 정확히 짚는다. 3) 손으로 뜀틀을 힘껏 밀어내며 다리를 최대한 양옆으로 벌려 뜀틀을 뛰어넘는다. 4) 착지 매트에 양발로 안정감 있게 착지하며 두 팔을 든다.</p>
