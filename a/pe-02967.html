<h1>금산 한발뛰기</h1>
<p>1) 바닥에 네모 칸과 양쪽에 O, X 구역을 그리고 술래와 놀래 순서를 정한다. 2) 놀래들은 네모 안에서 시작하여 술래가 정한 발걸음 수만큼 한 발로 뛴 후 멈춘다. 3) 술래는 놀래보다 한 발 적은 걸음으로 나가 놀래를 손으로 친다. 4) 술래에게 잡히거나 네모 칸으로 제 발걸음에 돌아오지 못하고 선을 밟으면 X로 가고, 성공하면 O로 간다.</p>
