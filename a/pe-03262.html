<h1>빠르게 달리기 기초 동작 연습</h1>
<p>1) 한 발을 내딛을 때 다른 발뒤꿈치로 빠르게 엉덩이를 차며 달린다. 2) 다리를 좌우 번갈아 높이 들어올리고 다리 아래로 박수를 치며 앞으로 나아간다. 3) 한쪽 다리는 직각으로 굽히고 다른 쪽 무릎은 지면에 닿을 정도로 뒤로 뻗으며 걷는다. 4) 한쪽 무릎을 높이 들어 올려 허벅지가 지면과 평행을 이루게 하고 발목을 세우며 앞으로 이동한다.</p>
