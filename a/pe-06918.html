<h1>평균대 홉과 리프 연습</h1>
<p>1) 평균대 기술을 먼저 바닥에서 충분히 연습한다 2) 평균대 위로 올라가 무릎을 엉덩이 높이 이상으로 들어 올리며 앞으로 뛴다 3) 몸을 돌려 뒤로 뛸 때도 무릎을 높게 유지하며 뛴다 4) 반대쪽 다리로도 같은 홉 동작을 연습한다 5) 평균대 가운데 큰 웅덩이가 있다고 상상하며 다리를 공중에서 최대한 넓게 벌려 리프를 뛰고 착지 자세를 유지한다</p>
