<h1>링 오브 파이어</h1>
<p>1) 던지는 사람(또는 타자)으로부터 15~20피트 떨어진 곳에 수비수들이 우산(부채꼴) 대형으로 둘러선다 2) 던지는 사람이 각 수비수에게 차례대로 공을 던지거나 쳐준다 3) 수비수는 공을 바르게 포구(캐치 또는 땅볼 포구)한 뒤 다시 던진 사람에게 송구하며, 포구에 실패하면 목숨을 하나 잃는다 4) 모든 선수가 한 번씩 돌아가면 수비 대형이 뒤로 한 걸음 물러나며, 목숨을 모두 잃어 탈락하고 마지막까지 남은 1명이 승리한다</p>
