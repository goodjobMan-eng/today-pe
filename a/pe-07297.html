<h1>깃발 뺏기 (캡처 더 플래그)</h1>
<p>1) 중앙선을 기준으로 양 팀 진영을 나누고, 각 진영 끝에 깃발(콘 10개) 보관 구역(베이스)과 감옥을 설치한다 2) 상대 진영에 들어가 상대 베이스에 있는 콘을 빼앗아 자기 진영으로 가져오면 득점한다 3) 상대 진영에서 태그를 당하면 감옥에 갇히게 되며, 안전 구역(상대 베이스 안 등)에서는 태그되지 않는다 4) 감옥에 갇힌 팀원은 아군이 달려와 손을 잡고 함께 자기 진영으로 무사히 돌아오면 탈출할 수 있다</p>
