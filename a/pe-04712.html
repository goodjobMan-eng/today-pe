<h1>유치원 및 저학년 이어달리기 바톤 전달 및 콘 배치 팁</h1>
<p>1) 주자는 바톤을 앞으로 내밀고 다음 주자는 바톤을 잡아당기지 않고 건네받는다. 2) 시작할 때는 콘을 아주 가깝게 배치하여 제자리에서 이동하도록 한다. 3) 같은 색깔 콘 주변을 돌아서 돌아오는 방식으로 진행한다. 4) 학생들이 익숙해지면 콘 사이 거리를 5피트씩 늘려가며 진행한다.</p>
