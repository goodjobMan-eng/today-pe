<h1>양말과 공을 활용한 배드민턴 백스윙 연습</h1>
<p>1) 소프트 테니스공 2개를 양말에 넣고 부러진 라켓에 연결하여 테이프로 감아 보조기구를 만든다. 2) 보조기구를 돌리며 손목 회전 감각과 포핸드·백핸드 그립 전환을 연습한다. 3) 머리 위에 꼬깔(라바콘)을 올린 상태에서 보조기구로 꼬깔을 쳐서 떨어뜨리는 궤적으로 백스윙 감각을 익힌다. 4) 스윙 준비는 느리게 진행하다가 등이 넘어가는 순간 빠르게 라켓 헤드를 떨어뜨리며 타구 동작으로 연결한다.</p>
