<h1>모두가 한쪽에 풍선 배구</h1>
<p>1) 교실 책상이나 줄을 활용해 네트(장애물)를 설치하고 모둠별로 줄을 선다.2) 첫 번째 주자가 풍선을 네트 너머로 띄워 쳐서 넘긴 뒤 빠르게 반대편으로 이동한다.3) 풍선이 땅에 떨어지지 않도록 이어 치며 모든 팀원이 반대편으로 왕복 이동을 완료할 때까지의 기록을 측정한다.</p>
