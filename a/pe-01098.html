<h1>숫자 고깔콘 스트라이크 볼링</h1>
<p>1) 숫자 고깔콘 3개를 삼각형 구도로 간격을 두어 세우고 3명이 둘러앉아 공을 준비한다. 2) 가위바위보로 순서를 정해 바닥으로 공을 굴려 상대 고깔콘 사이 골대로 통과시키거나 넘어뜨린다. 3) 고깔콘 사이로 들어가거나 넘어지면 해당 점수를 받고, 최종 점수가 가장 낮은 사람이 승리한다. 4) 득점자가 다음 투구자를 지목하거나 고깔콘 사이 간격을 넓혀 난이도를 조절한다.</p>
