<h1>가위바위보 야구</h1>
<p>1) 모둠별로 자리에 앉은 후 선생님과 전체 학생이 가위바위보를 합니다. 2) 이긴 학생은 1루(운동장 쪽 창가)로 이동하고, 지거나 비긴 학생은 제자리에 남습니다. 3) 다음 판에 1루에 있던 학생이 또 이기면 2루(교실 뒤편), 3루(복도 쪽 창가)로 한 베이스씩 전진합니다. 4) 3루에서 한 번 더 이겨 홈으로 들어온 학생은 칠판의 자기 모둠 번호에 득점 동그라미를 표시하고 제자리로 돌아갑니다.</p>
