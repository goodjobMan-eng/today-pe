<h1>팝콘 파라슈트 놀이</h1>
<p>1) 학생들이 파라슈트를 잡고 선다. 2) 프라이팬에 불을 올리듯 천천히 흔들다가 점점 빠르게 파라슈트를 흔든다. 3) 공(팝콘)을 파라슈트 위로 던져 올리고 파라슈트를 마구 흔들어 공이 튕겨 나가게 한다. 4) 지정된 2명의 학생이 밖으로 튀어나간 공을 주워 다시 파라슈트 위로 던져 넣는다.</p>
