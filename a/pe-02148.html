<h1>스틱 튕겨 종이컵 넣기 표적게임</h1>
<p>1) 책상 위에 종이컵을 3~4개 나란히 올려놓고 표적을 만든다. 2) 커피 믹스 스틱이나 볼펜 등의 길쭉한 물건을 손바닥 위에 올려놓는다. 3) 다른 손으로 스틱 끝을 쳐서 위로 튕겨 올려 종이컵 속으로 날려 넣는다. 4) 스틱을 여러 번 튕겨 정해진 종이컵 안에 모두 골인시키면 성공한다.</p>
