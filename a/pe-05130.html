<h1>아이리시 골드(아일랜드의 황금 던지기)</h1>
<p>1) 가운데 훌라후프나 상자(항아리)를 두고 학생들이 둘러선다.2) 각자 여러 개의 골드 코인(빈백이나 공)을 들고 차례로 항아리를 향해 던져 넣는다.3) 항아리 안에 들어가면 1점을 얻고, 빗나가 바닥에 떨어진 코인은 먼저 주운 사람이 자신의 점수로 가져간다.</p>
