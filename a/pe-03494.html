<h1>공보다 빠르게</h1>
<p>1) 다섯 명이 한 모둠을 이루어 두 모둠이 공격과 수비로 나눈다. 2) 타자는 티 위에 있는 공을 치고 누를 순서대로 돌아 홈으로 들어온다. 3) 수비 모둠은 공을 잡아 1루, 2루, 3루, 홈 순으로 공을 이어준다. 4) 타자가 공보다 먼저 홈으로 들어오면 1점을 얻고, 공이 먼저 홈에 도착하면 타자는 아웃되며 모든 타자의 공격이 끝나면 공수를 교대하여 점수를 더 많이 얻은 모둠이 이긴다.</p>
