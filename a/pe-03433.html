<h1>원 마커를 얻어라</h1>
<p>1) 반 전체를 세 모둠으로 나누고, 바닥에 후프와 다양한 점수(1점, 2점, 3점)의 원마커를 배치한다. 2) 원마커 위에서만 공을 던질 수 있으며, 한 명이 5번씩 공을 던진다. 3) 원마커 위에서 던진 공이 후프 안에 들어가면 해당 원마커를 획득하고, 들어가지 않으면 그대로 둔다. 4) 모든 모둠원이 공을 던진 후 얻은 원마커의 점수를 합산하여 가장 높은 점수를 얻은 모둠이 이긴다.</p>
