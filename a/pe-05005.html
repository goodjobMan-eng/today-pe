<h1>예쁜 옆돌리기(측전) 완성을 위한 무릎 펴기와 직선 이동 연습</h1>
<p>1) 다리를 벌리고 앉아 무릎과 발끝을 곧게 펴는 다리 찢기 유연성 스트레칭을 한다2) 벽에 배를 대고 물구나무서기를 한 상태에서 무릎을 편 채 양다리를 벌려 유지하는 연습을 한다3) 매트 중앙의 일직선(흰 선)을 따라 손과 발이 벗어나지 않도록 일직선상에 짚으며 옆돌기를 한다4) 느린 속도로 균형을 잃지 않도록 적절한 스피드를 유지하며 연속 2회 옆돌기를 실시한다</p>
