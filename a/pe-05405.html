<h1>협동 공치기와 받기</h1>
<p>1) 두 모둠을 이루어 각 위치에 선다.2) 먼저 공을 가진 모둠이 공을 쳐서 상대 모둠 구역으로 보낸다.3) 공을 받은 모둠은 공이 바닥에 닿기 전에 공을 쳐서 되돌려 보낸다(넘기지 못하면 상대가 1점 획득).4) 공이 정해진 구역 밖으로 나가면 공을 받는 모둠이 1점을 획득한다.5) 점수를 획득한 모둠이 공을 다시 쳐서 게임을 계속 진행한다.6) 정해진 시간 동안 획득한 점수가 가장 많은 모둠이 승리한다.</p>
