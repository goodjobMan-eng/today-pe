<h1>쿠키 몬스터 술래잡기</h1>
<p>1) 술래(쿠키 몬스터)는 매트 위에 누워 자는 척을 합니다. 2) 학생들은 출발선에서 술래 쪽으로 살금살금 다가가며 &quot;쿠키 몬스터, 자고 있니?&quot;라고 묻습니다. 3) 술래가 &quot;응, 자고 있어&quot;라고 하면 계속해서 다가가 질문을 반복합니다. 4) 술래가 &quot;아니, 안 자!&quot;라고 외치면 학생들은 태그되지 않도록 출발선 뒤로 빠르게 도망칩니다. 5) 술래에게 폼 누들로 태그당한 학생은 술래가 되어 함께 잡으러 다닙니다.</p>
