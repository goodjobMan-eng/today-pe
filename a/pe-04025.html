<h1>러브 몬스터 디스 오어 댓 드로잉</h1>
<p>1) 화면에 제시된 두 가지 부위(몸, 머리, 눈, 뿔, 입, 팔, 다리, 하트) 디자인 중 마음에 드는 하나를 고른다 2) 선택한 디자인에 지정된 신체 운동을 30초 동안 수행한다 3) 운동이 끝나면 30초 동안 종이에 해당 몬스터 부위를 그린다 4) 모든 부위가 완성되면 추가 시간 동안 자유롭게 색칠한다</p>
