<p>1) 두 사람이 마주 서서 가위바위보를 한다. 2) 가위바위보에서 진 사람만 다리를 어깨너비로 벌리고, 또 지면 한쪽 무릎을 꿇는다. 3) 계속해서 질 때마다 양쪽 무릎, 인어공주 자세, 다리 뻗기 순으로 낮아져 먼저 바닥에 눕는 사람이 승리한다.</p>
