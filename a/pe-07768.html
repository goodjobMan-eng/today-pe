<p>1) 두 명이 짝을 지어 콘 사이를 지나며 공을 땅에 떨어뜨리지 않고 서로 패스를 주고받으며 앞으로 이동한다. 2) 지정된 첫 번째 콘에 도착하면 멈추어 선다. 3) 콘으로 구획된 골대 구역(1점, 2점, 3점 구역)을 향해 공을 던져 득점한다.</p>
