<h1>배드민턴 복식 경기 스트로크 익히기</h1>
<p>1) 배드민턴 코트와 네트를 설치하고 2:2 복식 팀으로 마주 선다. 2) 쇼트 서비스 또는 롱 서비스로 셔틀콕을 상대 코트 대각선으로 넘겨 경기를 시작한다. 3) 하이클리어, 드롭, 스매시, 푸시, 드라이브 등 다양한 스트로크 기술을 구사하며 랠리를 이어간다. 4) 셔틀콕이 바닥에 떨어지거나 라인 밖으로 나가면 실점하며 정해진 점수 규칙에 따라 승패를 겨룬다.</p>
