<h1>3대3 패스 돌리기 및 넷볼 얼티미트</h1>
<p>1) 3대3 패스 돌리기는 정해진 공간에서 상대 방해를 피해 연속 10번 패스 성공 시 1점을 얻는다. 2) 수비수 몸에 맞고 나간 경우 기존 패스 횟수에서 1개를 차감한 뒤 이어서 진행한다. 3) 넷볼 얼티미트는 자기 진영 엔드라인에서 시작해 3번 이상 패스 후 상대 엔드라인 안에서 공을 받으면 득점한다. 4) 공을 뺏기면 공수가 전환되며 옵스트럭션, 콘택트 등 넷볼 파울 규칙을 적용한다.</p>
