<h1>링피구</h1>
<p>1) 링을 바닥에 굴려 상대방을 맞춰 아웃시킬 수 있습니다. 2) 아웃된 사람은 사이드에서 수비수로 활동하며 살아있는 사람을 맞추면 부활합니다. 3) 링을 동시에 잡으면 가위바위보로 결정합니다. 4) 수비수는 벽에 붙어서 수비하며 앞으로 너무 나오지 않습니다.</p>
