<h1>초등 체육 맨손 준비운동</h1>
<p>1) 제자리에서 팔목 스트레칭 및 발목 돌리기를 좌우 번갈아 실시한다. 2) 허리에 손을 얹고 목 돌리기와 어깨 돌리기를 차례대로 진행한다. 3) 몸통(허리) 돌리기와 무릎 돌리기를 실시하여 관절을 풀어준다. 4) 다리 스트레칭(가볍게/넓게)과 팔 어깨 스트레칭, 고관절 스트레칭 후 팔벌려 높이뛰기로 마무리한다.</p>
