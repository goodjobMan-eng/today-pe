<h1>피구 수비 캐치 훈련법</h1>
<p>1) 4m 거리를 셔틀런으로 왕복 달리기한 후 굴러오는 공을 원바운드로 잡거나 노바운드로 캐치한다. 2) 2~3곳 포인트를 지정하고 사이드스텝으로 좌우 이동하며 원바운드 및 노바운드 공을 캐치한다. 3) 삼각형이나 사각형 포인트를 정해 앞·뒤·좌·우로 움직이며 투수가 던지는 공을 캐치한다. 4) 좌우 포인트 10개를 지그재그 백스텝으로 이동하며 날아오는 공을 연속으로 캐치한다.</p>
