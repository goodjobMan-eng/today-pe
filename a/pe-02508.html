<h1>신체 인지 블라인드 트레인</h1>
<p>1) 2~3명이 앞뒤로 한 줄로 서서 앞사람의 어깨나 옷을 잡고 열차 대형을 만든다. 2) 맨 앞사람은 눈을 뜨고 길을 안내하며, 뒤에 선 사람들은 모두 눈을 감는다. 3) 뒤에 선 사람은 앞사람의 몸에서 절대 손을 떼지 않도록 유지하며 이동한다. 4) 앞사람의 신호와 움직임에 맞춰 곡선 보행, 속도 조절, 방향 전환을 수행한다.</p>
