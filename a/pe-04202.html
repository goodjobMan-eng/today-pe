<h1>비치볼 키커스</h1>
<p>1) 체육관 양쪽에 매트를 세워 골대를 만들고 두 팀으로 나눈다. 2) 비치볼을 경기장에 투입하면 양 팀 선수들은 상대 진영을 자유롭게 오가며 발로 공을 찬다. 3) 손과 팔을 사용하지 않고 발, 무릎, 머리 등 전신을 이용해 공을 띄우고 패스한다. 4) 공을 차서 상대 팀 매트 안으로 넣으면 1점을 획득한다.</p>
