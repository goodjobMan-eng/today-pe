<h1>숫자 뛰기 (멀리뛰기 및 수 규칙 이동 놀이)</h1>
<p>1) 바닥에 놓인 숫자 원마커에서 교사가 제시하는 수 조건(짝수, 홀수, ~보다 큰/작은 수)에 맞는 칸으로 모둠발로 멀리 뛰어 이동한다.2) 같은 칸에서 만나면 가위바위보를 하여 진 사람은 출발 자리로 되돌아간다.3) 술래 놀이로 확장하여 도망자는 호명된 조건의 칸으로만 도망치고, 술래는 아무 칸이나 한 칸씩 이동하며 도망자를 태그하여 잡힌 사람도 술래가 된다.</p>
