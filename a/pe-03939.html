<h1>폴라 익스프레스 훌라후프 기차 협동 놀이</h1>
<p>1) 인원을 동일한 팀으로 나누고 팀원 수만큼 훌라후프를 바닥에 일렬로 놓아 기차를 만든다. 2) 맨 뒤에 선 승무원(마지막 주자)이 앞 후프 안으로 발을 옮겨 들어가며 빈 후프를 앞사람에게 건넨다. 3) 후프를 머리 위/손으로 전달받은 맨 앞 기관사가 후프를 맨 앞에 내려놓아 기차가 조금씩 전진한다. 4) 체육관 곳곳에 흩어진 팀 색깔의 콩주머니를 모두 수집한 뒤 출발 위치(집)로 돌아온다.</p>
