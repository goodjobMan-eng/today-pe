<h1>줄넘기를 활용한 기초 체력 및 이동 놀이</h1>
<p>1) 학생마다 줄넘기를 하나씩 들고 서로 부딪히지 않도록 거리를 유지하며 섭니다. 2) 제자리에서 발끝으로 가볍게 뛰며 손목을 돌려 다양한 기본 줄넘기 동작을 연습한 뒤, 공간 안을 이동하며 줄을 넘습니다. 3) 바닥에 줄넘기를 길게 일자 라인으로 내려놓고 라인 위만 밟으며 줄을 넘습니다. 4) 마주 오는 친구를 만나면 발동작으로 줄넘기 가위바위보를 하여 진 사람이 길을 양보합니다.</p>
