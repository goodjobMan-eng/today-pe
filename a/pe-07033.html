<h1>양말 윗몸일으키기 시소 게임</h1>
<p>1) 두 사람이 마주 앉아 서로의 발을 엮어 한자리에 고정합니다. 2) 한 사람이 양말 뭉치를 들고 어깨가 바닥에 닿을 때까지 뒤로 누웠다가 일어납니다. 3) 일어나면서 맞은편 짝에게 양말 뭉치를 던져 주고, 받은 짝도 똑같이 뒤로 누웠다가 일어나며 다시 던져 줍니다. 4) 1분 동안 진행하거나 함께 횟수를 세며 목표 숫자까지 반복합니다.</p>
