<h1>주사위 줄넘기 기부천사 게임</h1>
<p>1) 모둠별 대표 주자가 주사위를 굴려 나온 눈의 수를 확인한다. 2) 주자가 팀원들에게 달려가 주사위 눈만큼 개인 줄넘기 횟수를 팀원들에게 골고루 기부(배분)한다. 3) 팀원들은 기부받은 횟수만큼 줄넘기를 완료하고 다음 주자가 다시 주사위를 굴리러 출발한다. 4) 팀별 줄넘기 누적 목표치를 먼저 달성하거나 정해진 시간 내 가장 많은 횟수를 완수한 팀이 승리한다.</p>
