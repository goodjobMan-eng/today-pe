<h1>방구석 젓가락 투호 던지기</h1>
<p>1) 투호 통(바구니 또는 쓰레기통)을 바닥에 두고 일정한 거리에 투척선을 정한 뒤 참가자마다 나무젓가락 4개씩 나눈다. 2) 순서를 정해 투척선에 두 발을 땅에 붙이고 서서 통을 향해 젓가락을 1개씩 던진다. 3) 정해진 라운드(총 4회) 동안 통 안에 넣은 젓가락 개수를 세어 가장 많이 넣은 사람이 승리한다. 4) 던지는 거리를 점차 늘리거나 한 발 서기 등 난이도를 조절하여 변형한다.</p>
