<h1>골라 뛰는 댄스 &amp; 홈트 타바타</h1>
<p>1) 제자리에서 운동할 수 있도록 주변 정리를 하고 화면을 바라봅니다. 2) 화면에 제시되는 세 가지 옵션(기본 운동, 댄스, 변형 피트니스) 중 원하는 동작을 선택합니다. 3) 30초 카운트다운 타이머에 맞춰 신나는 음악과 함께 선택한 동작을 적극적으로 수행합니다. 4) 10초간 제자리 호흡을 하며 휴식하고, 다음 라운드마다 새로운 동작을 자유롭게 골라 실시합니다.</p>
