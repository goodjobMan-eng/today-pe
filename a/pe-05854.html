<h1>색깔 반응 순발력 활동</h1>
<p>1) 오른발과 왼발 옆 바닥에 색종이를 두고, 양옆 허리 높이에 색종이를 두며 천장(흰색) 등 총 5가지 색깔 구역을 설정한다.2) 피더(공 던져주는 사람)가 종이공(또는 양말공)을 던지며 특정 색깔을 외친다.3) 받는 사람은 던져진 공을 즉시 쳐내어(슬랩) 지시된 색종이 쪽으로 최대한 빠르게 보낸다.4) 색깔을 외치지 않고 피더가 던진 공 자체의 색깔을 보고 같은 색 종이로 쳐내는 변형으로도 진행한다.</p>
