<h1>기억력 발판 미로 탈출</h1>
<p>1) 교사는 비밀 경로 지도를 만들고 바닥에 6x6 등의 크기로 원마커를 배치하여 미로를 준비합니다. 2) 모둠의 첫 주자가 출발 원마커에서 시작해 상하·좌우·대각선 중 한 칸으로 이동합니다. 3) 교사가 경로 일치 여부를 판정하며 올바른 칸이면 계속 전진하고 틀린 칸을 밟으면 즉시 탈락하여 줄 맨 뒤로 돌아갑니다. 4) 다음 주자는 앞선 주자가 확인한 올바른 발판 경로를 기억하며 이어받아 최종 도착 원마커까지 길을 완성합니다.</p>
