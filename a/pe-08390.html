<h1>별 모양 축구 드리블 훈련</h1>
<p>1) 중앙을 중심으로 십자/별 모양으로 콘을 배치하고 각 꼭짓점에 인원을 나눈다. 2) 각 줄의 첫 주자가 동시에 출발하여 콘 사이를 통과하며 좁은 간격으로 드리블한다. 3) 중앙 쪽에서 정해진 방향(오른쪽)으로 꺾으며 상대 수비수를 가정한 페인팅이나 방향 전환 후 반대편 모서리의 대기자에게 공을 인계한다.</p>
