<h1>콩주머니를 없애라</h1>
<p>1) 구부리기 자세로 후프 뒤에서 준비한다. 2) 시작 신호와 함께 자신의 후프 안에 있는 콩주머니를 상대방 후프 안으로 옮긴다. 3) 이때 바닥에 닿은 양발이 모두 떨어지면 안 되고 몸을 구부려서 콩주머니를 옮겨야 한다. 4) 정해진 시간 동안 게임을 진행하고 후프 안에 콩주머니가 가장 적게 있는 친구가 이긴다.</p>
