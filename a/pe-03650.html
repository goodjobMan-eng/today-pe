<h1>팔굽혀펴기 4단계</h1>
<p>1) 머리부터 발끝(또는 무릎)까지 몸이 일직선이 되도록 기본 자세를 잡는다. 2) 1단계는 벽에 서서 벽을 짚고 민다. 3) 2단계는 허리 높이에서 팔굽혀펴기를 실시한다. 4) 3단계는 무릎 높이 위치를 짚고 실시하며, 4단계는 바닥에서 실시(여학생/힘이 부족한 학생은 무릎 대고)한다.</p>
