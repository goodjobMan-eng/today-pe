<h1>규칙을 직접 정하는 베이스볼형 게임</h1>
<p>1) 타자가 친 공을 수비 팀 전원이 한곳에 모여 아웃을 외치면 주자가 아웃된다. 2) 주자는 일반적인 야구 주루 방향과 반대인 오른쪽(시계 방향)으로 달려도 무방하며, 주자가 달리기 편한 방향을 자유롭게 선택하여 달린다. 3) 주자와 베이스의 접촉 여부로 아웃을 판정하지 않으므로 자신이 정한 방향으로 베이스를 돈다.</p>
