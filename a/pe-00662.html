<h1>싱크로 매트 운동 2 (집단 매트)</h1>
<p>1) 여러 명이 매트 위에 대열을 맞추어 정렬한 뒤, 구령에 맞춰 같은 타이밍에 구르기와 정지 동작을 수행합니다. 2) 앞구르기, 뒤구르기, 다리벌려 앞구르기, 뛰어 앞구르기 등 다양한 매트 기술을 차례로 연결합니다. 3) 기술 동작 사이사이에 팔을 벌려 정지하는 포즈와 수평 균형 잡기 동작을 일치시켜 표현합니다. 4) 옆돌기와 보조 물구나무서기를 차례로 선보인 뒤 마지막에 모여 피날레 포즈를 취합니다.</p>
