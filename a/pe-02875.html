<h1>보디가드 술래잡기</h1>
<p>1) 4명 기준으로 왕 1명, 보디가드 2명, 술래 1명을 정합니다. 2) 왕과 보디가드는 손을 잡아 원을 만들고 술래는 왕을 터치하러 다가갑니다. 3) 보디가드는 좌우로 회전하여 술래를 피하며 왕을 지킵니다. 4) 정해진 시간 동안 대결하여 제한 시간 안에 왕을 잡으면 술래가 성공합니다.</p>
