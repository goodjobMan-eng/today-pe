<h1>1대1 간이 티볼 게임</h1>
<p>1) 본루와 1루 두 가지만 베이스로 두고 타자가 공을 친 뒤 1루를 찍고 본루로 돌아온다. 2) 수비수는 글러브 없이 공을 잡아 미니 축구 골대 안에 공을 집어넣는다. 3) 타자는 공이 골대에 들어가기 전까지 홈과 1루를 오가며 왕복한 횟수로 득점하고, 5분 동안 더 많은 득점을 한 쪽이 이긴다.</p>
