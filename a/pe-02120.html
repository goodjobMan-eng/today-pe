<h1>킨볼</h1>
<p>1) 4명이 한 팀이 되어 3개 팀(분홍, 회색, 검정)이 조끼를 입고 참여한다. 2) 공격 팀 3명이 공을 받치고 1명이 '옴니킨'과 상대 팀 색깔을 외치며 두 손으로 공을 친다. 3) 호명된 팀은 신체 부위 제한 없이 공이 바닥에 닿지 않도록 받아내며 수비 후 5초 내에 다시 공격한다. 4) 호명된 수비 팀이 공을 받지 못해 바닥에 닿으면 공격 팀이 1점을 얻고 총 15점씩 3세트로 진행한다.</p>
