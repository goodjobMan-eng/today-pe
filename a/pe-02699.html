<h1>가정형 유연성 및 순발력 신체활동 프로그램</h1>
<p>1) 누운 자세에서 손과 다리를 교차로 들어 터치하는 유연성 운동을 한다. 2) 한 발로 균형 잡고 서서 허리를 축으로 공을 원을 그리며 돌리는 평형성 운동을 한다. 3) 무릎을 세워 다리를 교차한 후 다리 안쪽으로 깍지를 끼고 가슴 쪽으로 당겨 엉덩이를 늘려준다. 4) 한쪽 방향으로 회전 점프하며 양발로 동시에 착지하는 순발력 운동을 한다.</p>
