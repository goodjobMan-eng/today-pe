<h1>안타가타도코사 라인 스텝 체조</h1>
<p>1) 바닥의 직선 라인을 기준으로 대열을 맞추고, 전래 동요 '안타가타도코사'의 장단에 맞춰 스텝을 밟습니다. 2) 노래 가사에 맞춰 제자리 스텝을 밟다가 '사(さ)' 박자가 나올 때마다 라인을 앞뒤로 넘나들며 점프합니다. 3) 대형을 횡대로 서서 하거나, 원형으로 손을 마주 잡고 안팎으로 점프하는 등 다양한 형태로 바꾸어 진행합니다. 4) 박자에 맞춰 단체로 통일된 스텝과 점프를 수행하며 리듬감과 협동심을 기릅니다.</p>
