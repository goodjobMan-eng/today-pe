<h1>지키기 놀이(펜싱)</h1>
<p>1) 칼 위에 공을 올리고 준비 자세를 잡은 뒤 경기장 중앙에서 시작한다. 2) 칼을 휘두르지 않고 찌르기만 하여 상대의 공을 떨어뜨린다. 3) 공을 몸에 붙이거나 선 밖으로 나가면 안 되며 자신의 공이 늦게 떨어진 팀이 승리한다.</p>
