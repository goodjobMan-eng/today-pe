<h1>철인 3종 팝스</h1>
<p>1) 출발선에서 선생님과 가위바위보를 합니다. 2) 결과에 따라 단계별로 정해진 동작을 반복하며 도착선까지 갑니다. 3) 도착선에 도착하면 한 단계 통과입니다. 출발선으로 이동하여 다음 단계를 진행합니다. 4) 단계별 동작은 1단계(유연성)-2단계(순발력)-3단계(심폐지구력&amp;근력)입니다. 3단계까지 전부 통과했다면 다시 1단계로 갑니다. 5) 본인이 몇 번이나 3단계를 달성했는지 확인합니다.</p>
