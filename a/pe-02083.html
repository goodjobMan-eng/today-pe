<h1>핸들러 피라미드 쌓기</h1>
<p>1) 팀에서 순서를 정하고 첫 번째 순서 학생부터 원마커에서 셔틀콕을 핸들러 라켓으로 쳐서 중앙의 점보스택스 안에 넣는다. 2) 셔틀콕이 들어가지 않고 떨어지면 셔틀콕을 주워 와서 다음 순서 학생에게 넘긴다. 3) 셔틀콕을 넣는 데 성공하면 해당 점보스택스를 자기 팀 진영으로 가져와 탑을 쌓는다. 4) 4-3-2-1(총 10개) 피라미드 탑을 먼저 쌓은 팀이 승리한다.</p>
