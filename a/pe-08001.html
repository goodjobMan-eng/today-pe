<h1>방향 전환 피하기 (Dodging)</h1>
<p>1) 몸이 나아가는 진행 방향에 시선을 집중한다. 2) 바깥쪽 발로 지면을 강하게 밀어내며 방향을 바꾼다. 3) 방향을 바꾸는 순간에는 자세를 낮춘다. 4) 방향 전환은 한 걸음 동작 안에 신속하게 이루어지도록 한다.</p>
