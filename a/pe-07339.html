<h1>숫자 달리기 (Zehnerlauf)</h1>
<p>1) 모둠(4~6명)별로 출발선에 일렬로 서고, 반환점에는 숫자 카드(1~6)를 엎어 둔다. 2) 출발 신호가 울리면 첫 주자가 훌라후프를 양발 모아 점프로 통과하고 라바콘을 슬라롬으로 돌아 반환점의 카드로 간다. 3) 카드를 한 장 뒤집어 찾는 숫자(6부터 1까지 내림차순)가 맞으면 들고 오고, 틀리면 다시 엎어 두고 돌아와 다음 주자와 손뼉을 친다.</p>
