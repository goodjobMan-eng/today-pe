<h1>개각 전텐 유리카고 연습</h1>
<p>1) 바닥에 앉아 무릎을 감싸 안고 둥글게 구르는 기본 유리카고를 한다. 2) 다리를 높이 들며 크게 구르는 유리카고를 한다. 3) 매트에 나란히 앉아 구를 때 바닥에 가까운 위치에서 다리를 넓게 벌리는 개각 전텐 유리카고를 한다. 4) 매트에 지그재그로 앉아 서로 부딪히지 않도록 주의하며 개각 전텐 유리카고를 연습한다.</p>
