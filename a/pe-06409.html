<h1>추수감사절 디너 스톰프 히어로</h1>
<p>1) 화면 아래로 내려오는 음식 버튼 표시에 집중한다.2) 빨간색은 왼발 스톰프나 뜀뛰기, 노란색은 오른발 스톰프나 뜀뛰기 동작을 취한다.3) 빨간색과 노란색이 함께 나오면 점프, 파란색은 박수, 보라색은 허벅지 치기를 한다.4) 중간에 주어지는 식탁 관찰 미니 게임에서 사라진 음식을 맞춰 점수를 얻는다.</p>
