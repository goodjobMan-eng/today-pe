<h1>원 베이스 야구 게임</h1>
<p>1) 타자는 배팅 티에 올려진 공을 배트로 타격한다. 2) 타격 즉시 배트를 바닥에 내려놓고 1루 베이스를 발로 밟은 뒤 본루로 달려 돌아온다. 3) 외야수와 1루수는 공을 잡아 타자가 본루로 돌아오기 전에 1루 베이스를 밟아 아웃을 노린다. 4) 타자가 먼저 본루를 밟으면 1점을 얻고, 공을 공중에서 바로 잡히거나 배트를 던지면 즉시 아웃된다.</p>
