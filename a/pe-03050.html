<h1>팝스(PAPS) 왕복오래달리기</h1>
<p>1) 초등학생은 15m 거리를 두고 출발선에 선다. 2) 신호 주기에 맞춰 울리는 벨소리와 함께 출발하여 다음 벨소리가 울리기 전 목표 지점에 도달한다. 3) 중간에 벨이 울리면 그 자리에서 뒤로 돌아 이어서 뛴다. 4) 첫 번째 실패는 세모 표시로 계속 시도하며, 두 번째 실패는 X 표시와 함께 직전 기록으로 종료된다.</p>
