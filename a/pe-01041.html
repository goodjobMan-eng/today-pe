<h1>밤양갱 리듬 짝 손뼉치기 놀이</h1>
<p>1) 두 명씩 짝을 지어 마주 보고 선 후 기본 손뼉 박자 패턴을 익힌다. 2) 노래 음악에 맞춰 손뼉을 치고 상대방과 양손을 엇갈려 마주치며 리듬에 맞춰 움직인다. 3) 하이라이트 구간에서 손뼉을 높이 마주치거나 주먹을 맞대는 특수 동작을 박자에 맞추어 완성한다. 4) 박자를 빠르게 올리거나 4명이 원형으로 모여 교차 손뼉치기로 난이도를 확장할 수 있다.</p>
