<h1>스탠드 달리기</h1>
<p>1) 팀을 나누고 운동장 스탠드 맨 끝 출발 콘에 발을 붙인 상태로 준비합니다. 2) 신호에 맞춰 맨 끝 부분 라바콘 위에 놓아둔 접시콘을 향해 달립니다. 3) 접시콘을 먼저 잡으면 1점을 얻고 접시콘을 들고 원래 출발 지점으로 달려서 돌아옵니다. 4) 출발 지점 라바콘에 먼저 접시콘을 끼우면 1점을 얻으며 돌아가며 도전해 높은 점수를 얻은 팀이 승리합니다.</p>
