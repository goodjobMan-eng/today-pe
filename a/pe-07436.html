<h1>휴첸발 (콘 맞히기 게임)</h1>
<p>1) 양쪽 진영에 작은 콘으로 구역을 만들고 상자 위에 큰 콘을 올려 표적을 세운다. 2) 공을 잡은 상태에서는 걸을 수 없으며 패스로만 전진하여 상대 구역의 콘을 공으로 던져 맞힌다. 3) 콘을 맞혀 떨어뜨리면 1점을 얻고 공격권이 상대 팀으로 넘어간다.</p>
