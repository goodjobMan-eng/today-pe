<h1>풍선 퀴디치와 풍선 배틀</h1>
<p>1) 학생들은 각자 풀누들 1개와 풍선 1개를 가지고 체육관 중앙에서 시작한다. 2) 음악이 시작되면 풍선을 누들로 쳐서 바닥에 떨어뜨리지 않고 체육관을 이동한다. 3) 농구 골대에 매달린 색색의 훌라후프 안으로 풍선을 통과시켜 점수를 얻는다.</p>
