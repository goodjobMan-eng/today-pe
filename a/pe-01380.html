<h1>제자리 도움닫기 멀리뛰기 챌린지</h1>
<p>1) 모래사장 앞 약 15m 지점에 출발선을 두고 발구름판(테이프 선)과 모래 착지장을 점검한다. 2) 신호와 함께 약 15m 거리를 전속력으로 도움닫기하여 달려온다. 3) 구름판 파울 라인을 밟거나 넘지 않고 강하게 외발로 발구름한 뒤 약 30도 각도로 공중으로 도약한다. 4) 착지 시 무릎을 굽히며 모래판에 안전하게 착지하고 기록을 측정하여 3회 시기 중 최고 기록을 겨룬다.</p>
