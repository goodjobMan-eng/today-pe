<h1>공 차기 이어달리기</h1>
<p>1) 팀을 나누고 드리블 순서를 정한다. 2) 축구공을 발로 차며 달려 반환점을 돌아 출발 지점으로 온다. 3) 돌아온 후 다음 주자에게 정확하게 공을 패스하고 맨 뒤로 이동한다. 4) 응용으로 2명씩 짝을 지어 손을 잡거나 백업 스틱을 잡고 번갈아 가며 공을 차 반환점을 돌아온다.</p>
