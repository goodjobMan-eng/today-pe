<h1>선장의 명령 신체 반응 놀이</h1>
<p>1) 교사(선장)가 내리는 해적선 관련 명령 구령을 듣고 정해진 신체 동작을 즉각 수행한다. 2) '선장에게 경례'는 경례 자세, '갑판 닦기'는 바닥 닦는 시늉, '사람 살려'는 수영 동작을 취한다. 3) '상어 출현' 구령에는 온몸을 멈추고 정지하며, '배가 가라앉는다'에는 빠르게 노를 젓는 동작을 한다. 4) '밧줄 오르기'와 '선장 체조' 등 구령이 바뀌는 즉시 정확한 동작으로 전환한다.</p>
