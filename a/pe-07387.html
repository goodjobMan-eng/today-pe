<h1>점프 앤 스톱 (원마커 점프 놀이)</h1>
<p>1) 바닥에 놓인 원마커 위에 한 명씩 올라선다. 2) 호루라기 소리가 한 번 울리면 주변 원마커로 두 발을 모아 점프하여 이동한다. 3) 호루라기 소리가 두 번 울리면 점프하지 않고 원마커 위에서 멈춘다. 4) 한 원마커에 두 명 이상 모이거나, 손을 바닥에 짚거나, 신호에 늦게 점프하거나, 호루라기 두 번에 멈추지 못하고 점프·이탈하면 아웃되어 끝까지 살아남는다.</p>
