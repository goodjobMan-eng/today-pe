<h1>3인 1조 라인 패스 달리기</h1>
<p>1) 3명이 한 모둠을 이루어 3~4m 거리를 유지하며 일렬로 가볍게 달린다. 2) 중앙에 있는 학생이 측면 학생에게 공을 패스한다. 3) 공을 받은 학생은 몸을 돌려 반대편 측면으로 패스하며, 공을 받을 때마다 공 방향으로 2~3걸음 이동한다.</p>
