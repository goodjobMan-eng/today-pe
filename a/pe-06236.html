<h1>농구 피벗 활용 놀이 지켜라 빼앗아라</h1>
<p>1) 2인 1조를 구성하고 수비 학생은 원마커 위에 한 발을 올려놓고 떨어지지 않도록 축 발을 고정합니다.2) 수비 학생은 다른 한 발을 360도로 움직이며 드리블하여 공을 지킵니다.3) 공격 학생은 몸을 움직여 공과 손이 떨어진 순간을 노려 공을 빼앗거나 쳐내며, 성공 시 역할을 바꿉니다.</p>
