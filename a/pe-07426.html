<h1>코메타 볼 네트 게임</h1>
<p>1) 고무줄이나 비닐봉지를 연결해 네트를 치고 공간을 둘로 나눈다. 2) 코메타 볼을 받을 때는 항상 머리 부분을 잡고, 받은 손 그대로 상대 코트로 던져 넘긴다. 3) 손목 스냅을 활용해 꼬리가 잘 정돈되도록 던지며 상대 코트 바닥에 떨어뜨려 득점한다. 4) 두 개의 코메타 볼을 동시에 사용하는 변형 경기 시에는 카운트다운 후 양 팀이 동시에 볼을 넘겨 진행한다.</p>
