<h1>스파이크 놀이</h1>
<p>1) 벽 앞에 서서 공을 띄운 뒤 바닥을 향해 손바닥으로 스파이크를 때린다. 2) 바닥에 튕겨 벽을 맞고 나오는 공을 연속으로 스파이크 하거나 잡아내는 연습을 한다. 3) 참가자들이 한 줄로 서서 바닥에 스파이크 한 후 빠지면 다음 사람이 1회 바운드된 공을 이어 스파이크 한다.</p>
