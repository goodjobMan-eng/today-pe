<h1>스핀 더 핀 슈퍼 태그</h1>
<p>1) 훌라후프 주변에 볼링 핀과 태그 스틱을 두고 4명의 선수가 중앙에 선다. 2) 새 선수가 볼링 핀을 돌려 핀이 가리킨 사람이 술래가 된다. 3) 술래는 태그 스틱을 잡고 느린 카운트다운 5초 안에 다른 사람을 태그해야 한다. 4) 5초 안에 태그에 성공하면 태그당한 선수가 자리를 바꾸고, 태그하지 못하면 술래 본인이 자리를 바꾼다.</p>
