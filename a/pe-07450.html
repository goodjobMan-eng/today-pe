<h1>역피구</h1>
<p>1) 경기장을 반으로 나누고 각 팀은 1명만 자기 진영에 들어가고 나머지 팀원들은 상대 진영 외곽에서 시작한다. 2) 외곽의 팀원들이 상대 진영 내부의 선수를 공으로 맞히면 맞힌 선수가 자기 진영 안으로 들어온다. 3) 자기 진영 안에 들어온 선수는 공에 맞아도 아웃되지 않으며, 공에 맞은 팀의 외곽 선수가 1명 진영 안으로 들어간다. 4) 팀원 전원이 먼저 자기 진영 안으로 들어오는 팀이 승리한다.</p>
