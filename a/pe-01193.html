<h1>스피드스택스 협동 피라미드 성 쌓기</h1>
<p>1) 12개 1세트로 구성된 스피드스택스 컵을 학급 전체 분량(약 28세트 이상)으로 교실 바닥에 준비한다. 2) 준비운동으로 컵을 지그재그 일렬로 높게 쌓기 및 모둠별 창의적 형태 만들기를 먼저 진행한다. 3) 바닥에 종이테이프로 기준선을 긋고 수학적 수열 계산을 통해 가장 안정적인 밑변 개수(25개)를 도출한다. 4) 모둠별로 차례대로 정해진 개수의 컵을 조심스럽게 올려 총 25층 거대 피라미드를 무너뜨리지 않고 완성한다.</p>
