<h1>카운트다운 301점 정복 경기</h1>
<p>1) 3명이 한 팀을 이루고 다트보드와 투구선을 설정하여 준비한다. 2) 301점에서 시작하여 팀원들이 번갈아 다트를 3발씩 던져 획득한 점수만큼 차감해 나간다. 3) 남은 점수를 정확히 0점으로 만들어야 하며, 마지막 점수는 반드시 더블 구역을 맞혀야 승리한다. 4) 남은 점수보다 높은 점수가 나오면 버스트로 판정되어 직전 라운드 점수로 되돌아간다.</p>
