<h1>여름 양자택일 브레인 브레이크 운동</h1>
<p>1) 화면에 제시되는 두 가지 여름 테마 보기 중 마음에 드는 선택지를 하나 고릅니다. 2) 오른쪽 선택지가 좋으면 오른쪽으로, 왼쪽 선택지가 좋으면 왼쪽으로 이동합니다. 3) 화면이 전환되면 선택한 쪽에 해당하는 정해진 동작(댄스, 운동, 스트레칭 등)을 제한 시간 동안 따라 합니다. 4) 중간에 등장하는 미니 달리기 응원 게임이나 다른 그림 찾기 퀴즈에도 적극적으로 참여합니다.</p>
