<h1>로봇 연구소</h1>
<p>1) 로봇 역할을 맡은 학생들은 멈추지 않고 한 줄로 계속 전진해 걷는다. 2) 로봇은 스스로 방향을 바꿀 수 없으며 멈춰 설 수도 없다. 3) 풀누들을 든 로봇 엔지니어가 풀누들로 로봇을 터치해 주면 로봇은 새 방향으로 전환해 걸어갈 수 있다. 4) 벽에 부딪히거나 막힌 로봇을 엔지니어가 찾아가 터치해 구출해 준다.</p>
