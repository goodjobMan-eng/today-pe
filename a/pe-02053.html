<h1>스틱 볼 놀이</h1>
<p>1) 2명씩 마주 보고 서서 1인당 스틱 1개씩 양손으로 잡아 2개의 스틱 위에 공을 올린다. 2) 공을 바닥으로 튀긴 후 두 스틱으로 다시 받아 균형을 잡는다. 3) 공을 위로 올렸다가 바닥에 튀긴 후 스틱으로 받는다. 4) 공을 바닥에 튀기거나 위로 띄워 옆 팀의 스틱으로 이동시킨다.</p>
