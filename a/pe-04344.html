<h1>퍼피 구조대 프리즈 댄스 챌린지</h1>
<p>1) 퍼피 구조대 캐릭터들과 함께 음악에 맞춰 춤을 춘다. 2) 'Freeze' 신호가 나오면 움직이지 않고 그대로 멈춘다. 3) 단계 사이마다 주어지는 미니 퀴즈(패턴 맞히기, 밥그릇 고르기 포즈, 알파벳 맞히기)를 해결한다. 4) 보너스 레벨 배틀에서 원하는 캐릭터를 응원하며 춤을 춰 게이지를 채운다.</p>
