<h1>짝 술래잡기</h1>
<p>1) 2명씩 짝을 이루어 가위바위보를 합니다. 2) 이긴 친구는 도망을 치고 진 친구는 술래가 되어 짝을 잡으러 갑니다. 3) 활동 중 방향 전환 신호가 들리면 역할이 바뀌어 도망치던 친구가 술래가 됩니다. 4) 술래에게 잡힌 친구는 정해진 동작을 3회 수행한 후 다시 술래가 되며, 정해진 시간 후 술래가 아닌 친구가 이깁니다.</p>
