<h1>원형 제자리 스페이스 체인지 공 전달</h1>
<p>1) 1인당 1개씩 공을 들고 안쪽을 바라보며 원형으로 선다. 2) 자신의 머리 바로 위로 공을 던지고 왼쪽 사람의 공을 직접 잡는다. 3) 공을 한 번 바운드시켜서 왼쪽 사람의 공을 잡는 방식으로 진행한다. 4) 익숙해지면 오른쪽 방향으로 회전하며 공을 던져 잡고 인원을 점차 늘려 진행한다.</p>
