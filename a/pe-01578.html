<h1>양말공 슛 윗몸일으키기 챌린지</h1>
<p>1) 의자 위에 바구니를 올리고 약 3m 거리에 매트를 깔고 말아 쥔 양말공 3개를 준비한다. 2) 매트에 누워 양말공을 머리 뒤 바닥에 터치한 뒤 상체를 일으키며 바구니를 향해 슛한다. 3) 양말공 3개를 연속으로 던진 뒤 일어나 양말을 모두 회수해 출발선으로 달려온다. 4) 1분 동안 제한 시간 내에 바구니에 들어간 양말공의 총 개수를 세거나 거리를 조절해 도전한다.</p>
