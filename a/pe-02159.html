<h1>훌라후프 몸으로 옮기기</h1>
<p>1) 같은 모둠끼리 서로 손을 잡고 한 줄로 길게 선다. 2) 모둠의 한쪽 끝 친구 옆에는 훌라후프 3개를 두고, 반대쪽 끝 친구 옆에는 콘을 세워둔다. 3) 시작 신호가 울리면 첫 번째 친구가 손에 훌라후프를 끼우고 온몸을 이용해 잡은 손을 놓지 않고 옆 친구에게 넘긴다. 4) 마지막 친구가 넘겨받은 훌라후프를 콘에 걸어 내려놓으면 첫 번째 친구가 다음 훌라후프를 넘기며, 3개를 먼저 전부 옮긴 모둠이 승리한다.</p>
