<h1>종이 접시 라켓으로 풍선 띄우기</h1>
<p>1) 종이 접시 라켓을 쥐고 한 손으로 풍선을 연속해서 띄운다.2) 반대 손으로 라켓을 바꿔 잡거나 양손을 번갈아 가며 풍선을 띄운다.3) 라켓의 앞면과 뒷면을 번갈아 치거나, 풍선을 띄운 후 한 바퀴 회전 또는 바닥 짚기 등 미션을 수행하며 풍선을 유지한다.</p>
