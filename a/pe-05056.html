<h1>멋진 2회 연속 측전(옆돌기) 연습법</h1>
<p>1) 1회차 측전을 실시할 때는 바닥의 일직선 라인을 벗어나지 않도록 똑바로 회전한다.2) 2회차 측전에서는 뒷다리를 빠르고 강하게 차올려 공중 회전 속도를 높인다.3) 2회차 착지 순간에 흔들리지 않고 딱 멈춰서 자세를 유지한다.</p>
