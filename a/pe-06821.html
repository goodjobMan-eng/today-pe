<h1>뽑은 카드 다 같이 따라해 보기</h1>
<p>1) 기본 움직임 기술 카드(파란색)와 움직임 요소 카드(초록색)를 나누어 뒤집어 놓는다. 2) 교사가 기본 움직임 기술 카드와 움직임 요소 카드를 각각 1장씩 뽑는다. 3) 교사가 뽑힌 두 카드가 무엇인지 학생들에게 설명한다. 4) 학생들은 정답에 얽매이지 않고 자신의 상상대로 카드의 움직임을 몸으로 표현하며 따라 한다.</p>
