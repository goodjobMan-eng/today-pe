<h1>발로 콘 잡기 스쿠터 릴레이 (콘 그랩)</h1>
<p>1) 2인 1조로 짝을 지어 한 명은 스쿠터보드 위에 앉고 한 명은 뒤에서 밀어줄 준비를 한다. 2) 신호가 울리면 뒤 주자가 스쿠터를 밀어 목표 지점의 콘 앞으로 빠르게 이동한다. 3) 스쿠터에 탄 주자는 손을 쓰지 않고 오직 두 발의 힘만으로 콘을 집어 들어올린다. 4) 콘을 발로 잡은 채 출발선까지 복귀한 뒤 다음 주자 조와 교대하여 먼저 끝낸 팀이 승리한다.</p>
