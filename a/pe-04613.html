<h1>온 더 라인, 오프 더 라인</h1>
<p>1) 교사가 '온 더 라인'을 외치면 학생들은 선 위에서 슬라이딩하며 이동한다. 2) 교사가 '오프 더 라인'을 외치면 학생들은 선 밖에서 리핑하며 이동한다. 3) 술래는 폼볼을 들고 다니며 패크 가족을 태그한다. 4) 태그된 학생은 미니 코치에게 가서 슬라이딩 지도를 받는다.</p>
