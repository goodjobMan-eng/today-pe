<p>1) 매트에 앉아 양손으로 무릎을 잡고 가슴에 붙인 뒤 턱을 가슴쪽으로 당기고 뒤로 누운 다음 앞으로 구릅니다. 2) 양손을 벌려 매트를 짚고 뒷머리가 매트에 닿도록 최대한 숙여 앞구르기를 합니다. 3) 친구의 도움을 받거나 기울어진 매트에서 연습합니다. 4) 양손을 매트에 짚고 양발을 힘 있게 밀며 몸을 곰처럼 둥글게 말아 힘껏 구릅니다.</p>
