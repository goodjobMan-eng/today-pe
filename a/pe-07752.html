<h1>축구 스모</h1>
<p>1) 참가자들은 각자 공을 하나씩 바닥에 두고 정해진 구역 안에 선다. 2) 발을 사용해 자신의 공을 지키면서 상대방의 공을 정해진 범위 밖으로 차낸다. 3) 공이 밖으로 나가지 않고 끝까지 살아남은 최후의 1인이 승리한다.</p>
