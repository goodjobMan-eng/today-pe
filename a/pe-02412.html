<h1>후프 얼음땡</h1>
<p>1) 콘으로 활동 영역을 정하고 구역 안에 참가 인원의 1/3 수량만큼 후프를 배치한다. 2) 술래 4명을 정하고 나머지 도망자는 후프 밖에서 피해 다닌다. 3) 후프 안으로 들어가면 밖으로 나올 수 없는 얼음 상태가 되며, 후프 밖의 친구가 터치해주면 땡이 되어 밖으로 나올 수 있다. 4) 술래에게 터치되면 아웃되어 경기장 밖 지정된 장소로 이동하며, 제한 시간 내에 술래가 모두 아웃시키거나 생존자가 남으면 승패가 결정된다.</p>
