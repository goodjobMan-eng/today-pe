<h1>올림픽 성화 릴레이 달리기</h1>
<p>1) 주자는 한 손을 등 뒤로 하고, 테이프 표시 아래쪽만 한 손으로 잡아 성화봉 위에 공을 올려 준비한다. 2) 성화 위의 공이 떨어지지 않도록 균형을 잡으며 앞으로 달려 콘을 돌아온다. 3) 이동 중 공이 떨어지면 제자리에 멈춰 서서 공을 다시 올려놓은 뒤 이동을 재개한다. 4) 다음 주자에게 성화봉을 넘겨주며 모든 팀원이 한 번씩 주자로 달린다.</p>
