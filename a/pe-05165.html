<h1>프레리 독 픽오프 (핸드볼 변형 게임)</h1>
<p>1) 각자 후프 안에 핀을 세우고 공으로 다른 사람의 핀을 쓰러뜨리며 자신의 핀을 수비한다.2) 핀이 쓰러지면 상대 팀에 합류해 함께 기지를 지키며 다른 핀을 공격한다.3) 공을 잡고 3보 이동을 허용하거나 패스로만 이동하도록 변형해 협동하며 진행한다.</p>
