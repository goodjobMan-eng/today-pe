<h1>신학기 캐릭터 따라하기 요가 스트레칭</h1>
<p>1) 학생들은 교실 책상 주변에서 화면을 잘 볼 수 있도록 각자 안전 거리를 확보하고 선다. 2) 화면에 인기 캐릭터와 함께 제시되는 다양한 요가 동작을 30초 동안 그대로 따라 하며 자세를 유지한다. 3) 화면 안내에 맞춰 반대쪽 방향으로 자세를 바꿔가며 전신의 균형과 유연성을 기른다. 4) 호흡을 천천히 깊게 들이마시고 내쉬는 데 집중하며 마지막 동작까지 차분하게 완료한다.</p>
