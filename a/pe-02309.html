<h1>버티기로 공 옮기기</h1>
<p>1) 모둠원이 일렬로 순서대로 앉는다. 2) 신호가 울리면 맨 앞사람이 양발로 공을 잡고 들어 올려 공을 떨어뜨리지 않고 다음 친구에게 전달한다. 3) 공을 전달받은 마지막 사람은 공을 후프에 넣으며 공을 떨어뜨린 경우에는 맨 앞사람에게 전달하여 처음부터 다시 시작한다. 4) 정해진 시간 동안 후프에 공을 가장 많이 넣은 모둠이 승리한다.</p>
