<h1>스포츠스태킹 기초 활동</h1>
<p>1) 8개의 컵을 4개씩 양손에 쥐고 한쪽으로 컵을 모았다가 다시 양손으로 나눈다. 2) 컵을 한 줄로 높이 쌓아 올렸다가 다시 정리한다. 3) 컵 엘리베이터 활동으로 6개의 컵 중 맨 위의 컵을 아래로 옮겨가며 다른 색상의 컵이 가장 위로 올라오게 한다. 4) 양쪽에 놓인 컵을 양손의 감각을 활용해 동일한 개수로 집어 올린다.</p>
