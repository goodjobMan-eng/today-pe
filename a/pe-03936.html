<h1>캐슬볼</h1>
<p>1) 3~4인 1모둠으로 팀을 나누어 각자 훌라후프 위치에서 피구공으로 성(캐슬)을 가장 빠르게 만든다. 2) 성을 가장 빠르게 완성한 팀이 1점을 획득한다. 3) 다음 라운드에서는 피구공을 던져 상대 팀의 성을 무너뜨리며, 무너진 성 하나당 1점을 득점한다. 4) 성이 무너진 팀은 공을 던질 수 없고 성을 다시 재건해야만 다시 공을 던져 공격할 수 있다.</p>
