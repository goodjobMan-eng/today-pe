<h1>종이컵과 나무젓가락 균형감각 기르기</h1>
<p>1) 출발 지점과 도착 지점 탁자에 종이컵을 각각 6개씩 놓고 2개씩 짝지어 나무젓가락을 다리처럼 올려놓는다2) 출발 지점의 나무젓가락을 손등 위에 올려 떨어뜨리지 않고 도착 지점으로 이동해 다리 모양으로 쌓는다3) 3개의 나무젓가락을 모두 옮길 때까지 걸린 시간을 측정한다4) 난이도를 높여 손등 대신 발등 위에 나무젓가락을 올려놓고 도착 지점까지 이동하여 올린다</p>
