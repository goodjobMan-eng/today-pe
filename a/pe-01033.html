<h1>표정 만렙 포스트잇 얼굴로 떨어뜨리기 대결</h1>
<p>1) 각자 이마나 얼굴 부위에 포스트잇을 손으로 꼭꼭 눌러 밀착시켜 붙인다. 2) 신호가 울리면 손을 쓰지 않고 1단계 얼굴 근육만 움직여 종이를 흔든다. 3) 잘 떨어지지 않으면 2단계 머리 흔들기, 3단계 온몸 털기 순으로 제한을 풀며 먼저 떨어뜨린 사람이 득점한다. 4) 볼이나 턱 등 부착 위치를 바꾸거나 단어 맞히기 미션과 결합할 수 있다.</p>
