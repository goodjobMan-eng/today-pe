<h1>호흡 조절 &amp; 스탠딩 모빌리티 웜업</h1>
<p>1) 복식호흡, 튜브호흡, 늑골호흡, 4초 박스 브리딩 순으로 5분간 호흡을 조절한다. 2) 벽이나 의자를 잡고 발목을 원형으로 돌리고, 무릎을 굽혀 발을 안팎으로 회전하며 편다. 3) 서서 다리를 4자 모양으로 걸쳐 둔부를 스트레칭하고, 팔과 흉추 회전을 이어서 진행한다.</p>
