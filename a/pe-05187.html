<h1>닌자 트레이닝 코스 (장애물 서킷 트레이닝)</h1>
<p>1) 트럭 타이어를 끌거나 스쿼트 자세로 뒤집으며 전진한다.2) 볼링핀 콘 주위를 돌아 터널을 통과하거나 평균대 위를 건넌다.3) 바닥에 엎드려 포복(군대식 기어가기)으로 통과한다.4) 트램펄린 위에서 10회 점프하고 매트 위에서 앞구르기를 한 뒤 봉 아래로 통과한다.</p>
