<h1>펑고 야구</h1>
<p>1) 3명이 한 팀을 이루고 가위바위보로 순서를 정해 타자, 송구자, 1루수로 역할을 나눈다. 2) 타자가 테니스 라켓으로 테니스공을 쳐주면 받은 사람이 1루로 정확히 송구하고 1루수가 공을 캐치한다. 3) 1루수가 캐치에 성공할 때마다 1점씩 획득하며 제한 시간(예: 3분) 동안 더 많은 공을 잡은 팀이 승리한다.</p>
