<h1>철인3종</h1>
<p>1) 1라운드로 바닥에 마주 앉아 발을 맞대고 손을 잡은 뒤 구령에 맞춰 동시에 일어나는 손잡고 일어서기를 2명부터 모둠 전체까지 성공한다.2) 2라운드로 손을 잡고 원을 만든 상태에서 손을 놓지 않고 몸을 통과시켜 옆 사람에게 후프를 넘기는 모둠 후프넘기기를 왕복으로 성공한다.3) 3라운드로 오른손은 아래(손바닥 위), 왼손은 위(손바닥 아래)로 엇갈려 잡은 고리를 손을 놓지 않고 풀어 원을 만드는 손풀기놀이를 모둠부터 학급 전체까지 성공한다.</p>
