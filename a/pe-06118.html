<h1>발끝 숫자 컵탑 쌓기</h1>
<p>1) 바닥에 눕거나 앉은 상태에서 발로 컵을 잡고 3단(3개-2개-1개) 컵탑을 쌓는다.2) 처음에 발을 바닥에서 떼는 순간부터는 땅에 발을 댈 수 없다.3) 번호 순서에 상관없이 자유롭게 발끝만을 이용해 탑을 완성한다.4) 정해진 시간(1분 또는 초 단위 미션) 안에 성공하는 챌린지로 진행한다.</p>
