<h1>볶음밥 놀이</h1>
<p>1) 원 대형으로 모여 사람 수보다 1개 적게 의자를 준비한다. 2) 볶음밥 재료를 계란, 김치, 파 등으로 정해 순서대로 배정한다. 3) 가운데 술래가 볶음밥 재료를 부르면 해당되는 사람이 일어나 자리를 이동하고, 바로 옆자리는 이동할 수 없다. 4) 술래가 볶음밥을 외치면 모든 사람이 자리를 이동해야 하며 술래는 한 번에 1~3가지 재료를 부를 수 있다.</p>
