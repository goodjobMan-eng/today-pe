<h1>에그 핑퐁 삼목(빙고)</h1>
<p>1) 1~4명씩 2개 팀을 나누고 선공을 정한다. 2) 탁구공을 책상에 1번 이상 튕겨 계란판 칸 안에 넣는다. 3) 공이 계란판에 안 들어가거나 다른 공 위로 올라가면 무효 처리되어 공수가 전환된다. 4) 탁구공 3개가 대각선, 가로, 세로 모양으로 먼저 빙고(삼목)를 완성한 팀이 승리한다.</p>
