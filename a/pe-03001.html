<h1>플로어볼 기초 드리블 익히기</h1>
<p>1) 본인에게 맞는 스틱(레프트/라이트)을 고른 후 양손으로 잡고 체육관을 가볍게 돌며 적응한다. 2) 발을 어깨너비로 벌리고 공을 몸 밖으로 벗어나지 않게 스틱 중간면으로 가볍게 밀며 숏드리블을 연습한다. 3) 두 발을 앞뒤로 벌린 상태에서 앞뒤 방향으로 공을 가볍게 밀어주는 응용 숏드리블을 연습한다. 4) 스틱을 넓게 잡고 1.5m~2m 폭으로 좌우로 공을 길게 밀어주는 롱드리블을 익힌다.</p>
