<h1>다리 벌려 앞구르기</h1>
<p>1) 매트에 누워 양팔을 머리 위로 올리고 엉덩이가 닿지 않게 다리를 힘껏 들어 올린 후 반동을 이용해 상체를 일으키는 연습을 한다. 2) 제자리에 서서 앞구르기와 같은 방법으로 구르며 다리가 공중에 왔을 때 양옆으로 최대한 넓게 벌린다. 3) 다리를 벌리고 양손을 다리 사이로 깊숙이 짚으면서 굴러온 속도를 이용해 허리와 상체를 들어 올린다.</p>
