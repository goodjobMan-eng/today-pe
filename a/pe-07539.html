<h1>뜀틀 뛰어오르기 및 앞구르기</h1>
<p>1) 네 발 걷기와 토끼뜀 운동으로 팔의 지지력을 기른다. 2) 낮은 뜀틀 위에 양손을 짚고 발을 손 가까이 모으며 뛰어오른다. 3) 뜀틀 높이를 점진적으로 높이고, 상단에서 몸을 둥글게 말아 앞구르기로 연결하여 착지한다.</p>
