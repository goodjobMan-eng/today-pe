<h1>폼스틱 하키 기초 훈련 및 패스 게임</h1>
<p>1) 두 손으로 스틱을 잡고 손목을 돌려 스틱을 허리 아래로 유지하며 콘 사이로 드리블 연습을 한다. 2) 콘 코스 끝에서 콘 골대 아래로 슛을 하고 공을 직접 회수해 조깅으로 돌아온다. 3) 훌라후프 안에 한 사람이 서 있고, 다른 사람은 빈 훌라후프를 찾아 이동하며 신호를 보내 패스를 주고받는다. 4) 후프 안에 최소 한 발을 딛고 패스를 성공적으로 멈추면 1점을 얻고 역할을 바꾸어 이동한다.</p>
