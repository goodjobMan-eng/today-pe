<h1>바운다룬과 공 활용 게임</h1>
<p>1) 바운다룬 위에 공을 떨어뜨리지 않게 수평을 잡고 장애물을 피해 목표 지점까지 돌아온다. 2) 바운다룬으로 풍선이나 탱탱볼을 공중으로 쳐올리거나 바운드시켜 주고받는다. 3) 던져주는 솜털 공을 바운다룬으로 쳐서 훌라후프 표적 안에 넣는다. 4) 2인 1조로 풍선을 서로 주고받으며 더 많이 주고받은 팀이 승리한다.</p>
