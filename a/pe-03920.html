<h1>플립 잇 타깃 게임</h1>
<p>1) 3~5인 모둠을 구성하여 콘 뒤에 줄을 서고, 앞쪽에 스팟마커와 훌라후프를 배치한다. 2) 주자는 스팟마커에 한 발을 올린 상태에서 언더핸드로 훌라후프 안을 향해 콩주머니를 던진다. 3) 던진 후 콩주머니를 회수하여 콘에 두고 줄 맨 뒤로 이동하며 순번을 유지한다. 4) 팀의 모든 콩주머니가 후프 안에 들어가면 후프를 앞으로 한 바퀴 굴려 뒤집어 다음 레벨로 올린다.</p>
