<h1>북 슬라임 스톰프 브레인 브레이크</h1>
<p>1) 화면 속 두 도서 캐릭터 중 슬라임을 맞힐 캐릭터를 선택한다.2) 트랙을 따라 내려오는 버튼이 플레이 존에 들어갈 때 동작을 수행한다.3) 빨간색은 왼발 스톰프/홉, 노란색은 오른발 스톰프/홉, 빨강과 노랑은 점프, 파란색은 박수, 보라색은 허벅지 치기를 한다.4) 중간 미니게임에서는 중심 자세를 유지하며 3가지 틀린 그림을 찾는다.</p>
