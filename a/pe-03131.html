<h1>공 던지고 받기 연습</h1>
<p>1) 공을 던질 때는 공을 내 이마 높이에 두고 두 손으로 살짝 아래쪽을 받쳐준다. 2) 받는 친구의 위치를 확인하고 친구가 있는 쪽으로 무릎을 살짝 굽혔다 펴면서 힘차게 던진다. 3) 공을 받을 때는 공이 날아오는 쪽으로 팔을 뻗어 준비한다. 4) 공이 오는 쪽으로 빠르게 움직여 자세를 낮추고 공을 가슴 쪽으로 끌어당기듯 받는다.</p>
