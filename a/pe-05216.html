<h1>아메리칸 고무줄놀이 패턴</h1>
<p>1) 고무줄을 종아리 높이에 걸고 1, 2, 3, 4 카운트에 맞춰 다리를 벌려 네 번 뛴다(straddles).2) 고무줄 안쪽으로 들어와 뛴다(in).3) 고무줄 줄을 밟으며 뛴다(on).4) 고무줄 밖으로 뛰어나오며 동작을 완성한다(out).</p>
