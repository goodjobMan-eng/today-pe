<h1>메시 드리블 게임</h1>
<p>1) 모든 학생이 허리에 태그(밴드)를 2개씩 차고 각자 공을 드리블한다.2) 자기 공을 드리블하며 이동하면서 다른 친구의 공을 차내어 밖으로 보낸다.3) 자기 공이 나가면 태그 1개를 반납하며, 끝까지 태그가 가장 많이 남은 학생이 이긴다.</p>
