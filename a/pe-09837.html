<h1>타이타닉 농구 슈팅</h1>
<p>1) 모둠을 나누어 골대 앞에 줄을 선다. 2) 앞사람부터 차례로 슛을 한다. 3) 슛이 성공하면 줄 뒤로 가서 다음 차례를 기다린다. 4) 슛이 실패하면 타이타닉(옆 구역)으로 이동한다. 5) 타이타닉에 있는 사람이 슛을 성공하면 다시 게임에 참여한다. 6) 한 팀의 마지막 사람이 슛을 실패하면 그 팀은 침몰하여 게임에서 제외된다.</p>
