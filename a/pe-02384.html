<h1>공 2개 피구</h1>
<p>1) 피구 공인구 1개와 빅발리볼 공 1개를 준비하고 두 팀으로 편성한다. 2) 각 팀에서 외야 수비 3명을 미리 편성하여 배치한다. 3) 대표 선수가 가위바위보를 하여 공격과 수비를 정한 뒤 경기를 시작한다. 4) 어느 한 팀의 내야에 3명만 남게 되면 처음에 나갔던 외야 수비 3명이 내야로 복귀하며, 내야 선수가 모두 아웃되면 끝난다.</p>
