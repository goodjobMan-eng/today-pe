<h1>짝과 손잡고 달리는 체조 준비운동</h1>
<p>1) 두 명이 짝을 지어 손을 잡고 반환점까지 달린 뒤 손을 놓지 않고 출발선으로 돌아온다. 2) 앞으로 달려갔다가 뒤로 달려서 출발선으로 돌아온다. 3) 다리를 양옆으로 벌리고 점프하며 왕복한다. 4) 바닥에 손을 대지 않고 엉덩이가 발뒤꿈치에 닿도록 쪼그려 앉은 자세로 짝과 함께 이동한다.</p>
