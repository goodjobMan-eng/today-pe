<h1>병뚜껑 스포츠 놀이 5종 세트</h1>
<p>1) 책상 위에 종이컵 골대와 테이프 사각형 표적 구역을 만들고, 병뚜껑으로 축구·농구·볼링·컬러 포켓볼·사각 컬링 5종 미니 스포츠를 준비합니다. 2) 병뚜껑을 손가락으로 튕기거나 굴려 종이컵 골대에 넣거나 지정된 표적 구역에 도달시킵니다. 3) 포켓볼 방식은 무지개 색상 순서대로 상대 병뚜껑을 쳐서 테이블 밖으로 아웃시킵니다. 4) 컬링과 볼링에서는 힘 조절과 회전으로 점수를 얻거나 상대 병뚜껑을 쳐내며 승부를 겨룹니다.</p>
