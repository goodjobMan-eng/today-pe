<h1>포켓몬 볼링 게임</h1>
<p>1) 2~3명씩 모둠을 구성하고 각 스테이션에 선다. 2) 차례대로 공을 굴려 볼링핀을 쓰러뜨린다. 3) 핀을 쓰러뜨리면 체육관 중앙 바구니에서 포켓몬 카드 1장을 가져온다. 4) 작은 포켓몬 카드 3장을 모으면 메가 포켓몬 카드 1장으로 교환할 수 있다.</p>
