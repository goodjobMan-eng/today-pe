<h1>풍선 배구 기초 기능 익히기</h1>
<p>1) 손바닥을 펴서 풍선을 부드럽게 쳐 올리며 공중에 띄우는 연습을 한다. 2) 손으로 창문 모양을 만들고 밀어 올리는 셋(set)과 양손을 모으고 다리 반동을 이용하는 언더핸드 패스를 연습한다. 3) 토르, 호크아이, 헐크 스매시의 단계별 동작으로 스파이크를 연습한다. 4) 한 사람이 풍선을 아래로 내리치고 두 사람이 바닥에 떨어지지 않게 받아 올리는 게임을 진행한다.</p>
