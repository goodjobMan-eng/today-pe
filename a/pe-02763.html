<h1>손수건 잡기 놀이</h1>
<p>1) 손수건을 위로 던지고 떨어지는 손수건을 손으로 잡는다. 2) 손수건을 위로 던진 후 몸을 한 바퀴 돌고 떨어지는 손수건을 잡는다. 3) 오른쪽과 왼쪽으로 도는 방향을 바꾸어 가며 30초씩 3세트를 실시한다. 4) 떨어지는 손수건을 향해 주먹을 찔러 떨어뜨리지 않는 방법으로 변형하여 진행한다.</p>
