<h1>가위바위보 꼬리잡기 달리기</h1>
<p>1) 두 학생이 허리 뒤쪽에 꼬리끈을 착용하고 양쪽 콘 위치에서 출발해 중앙으로 달려옵니다. 2) 중앙에서 마주쳐 가위바위보를 하고 사전에 정한 규칙에 따라 재빠르게 반응합니다. 3) 1단계는 이긴 사람이 자기 출발선으로 도망치고 진 사람이 쫓아가 꼬리를 낚아챕니다. 4) 2단계는 이긴 사람이 상대 진영 쪽으로 질주해 넘어가고, 3단계는 진 사람이 도망치고 이긴 사람이 쫓아가며, 승패에 따라 도망자와 술래가 실시간으로 바뀝니다.</p>
