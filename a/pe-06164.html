<h1>방향전환 달리기 연구와 실험</h1>
<p>1) 모둠의 1번이 책상 위에서 교과서를 가져와 48쪽을 펼친다.2) 약 2분간 동그랗게 앉아 몸의 기울기, 몸의 높이, 보폭, 팔다리를 살펴보며 더 빨리 달리는 방법을 연구한다.3) 연구가 끝나면 교과서를 반납하고 지그재그 달리기나 십자 달리기를 자율적으로 실험하며 연습한다.</p>
