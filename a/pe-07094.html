<h1>풋볼 베이스볼 (푸티 베이스볼)</h1>
<p>1) 야구 다이아몬드 형태의 경기장을 구성하고 공격 팀 키커가 공을 차면 주자가 1루부터 베이스를 연속해서 달린다. 2) 수비 팀은 공을 잡아 1루, 2루, 3루로 차례로 킥 패스한 뒤 3루 주자가 골포스트 사이로 골 킥을 시도한다. 3) 수비가 골이나 포인트를 성공시켜 교사가 멈춤을 외칠 때까지 주자가 돈 베이스 수가 점수가 되며, 골 성공 시 감점된다.</p>
