<h1>티볼 배팅 티 스윙 기본 연습</h1>
<p>1) 자신에게 맞는 배트를 고르고 배팅 티의 높이를 조절한다. 2) 오른손잡이 기준 왼손을 아래, 오른손을 위에 두고 배트를 쥔 뒤 백스윙 준비자세를 취한다. 3) 시선은 공을 끝까지 유지하며 골반과 허리를 빠르게 회전시켜 레벨 스윙을 한다. 4) 임팩트 후 양손을 자연스럽게 덮어주며 팔로스루 동작까지 연결한다.</p>
