<h1>꽃게 술래 1 (발 끝 손 터치)</h1>
<p>1) 술래는 긴 펀스틱(문어다리)을 들고 다른 참가자들을 쫓아다니며 터치한다.2) 술래를 피해 참가자들은 도망친다.3) 술래에게 터치된 참가자는 꽃게 자세(바닥에 손과 발을 대고 엉덩이를 든 자세)를 취한다.4) 꽃게 자세에서 손을 교차하여 자신의 발끝을 2번 터치하면 스스로 살아나 다시 게임에 참여한다.</p>
