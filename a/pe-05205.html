<h1>스타워즈 표적 던지기 게임</h1>
<p>1) 무지개 색깔 원마커 위에 던지는 학생들이 서고(빨간색이 가장 쉽고 보라색이 뒤쪽), 매트로 만든 우주선 안에 우주비행사 학생들이 들어간다.2) 원마커에 선 학생들은 공을 던져 우주선 안으로 넣으려고 시도한다.3) 우주선 안의 우주비행사 학생들은 들어온 공을 주워 밖으로 다시 던져낸다.</p>
