<h1>음악 리듬 감각 익히기 스팟 마커 자리 찾기 놀이</h1>
<p>1) 참가자 각자 바닥에 원마커를 내려놓고 자신의 1번 자리로 기억한다. 2) 음악이 흐르면 리듬의 빠르기와 세기에 맞춰 자유롭게 공간을 이동하며 걷거나 뛴다. 3) 신호가 울리면 가장 가까운 곳에 마커를 놓고 2번·3번 자리를 순서대로 지정해 익힌다. 4) 선생님이 호명하는 번호 자리(예: 3번에서 1번)로 리듬에 맞춰 스텝을 밟으며 정확하게 찾아간다.</p>
