<h1>콘 원 안에 테니스공 바운드시키기 게임</h1>
<p>1) 상대방 콘 원 안에 공이 바운드되어 들어가도록 공을 던지거나 친다. 2) 상대방이 보낸 공은 반드시 한 번 바운드된 후 잡는다. 3) 공이 원 안에 들어가면 콘 위에 공을 올려 점수를 표시하고 모든 콘에 공을 먼저 올리면 승리한다.</p>
