<h1>던지기 배구</h1>
<p>1) 코트 꼭짓점에 콘을 세우고 중앙에 네트를 설치한 뒤 양 팀으로 나눈다.2) 일반 배구와 달리 공을 양손으로 잡고 던지며, 공격 전 모든 팀원이 최소 한 번씩 패스를 주고받아야 한다.3) 마지막으로 공을 받은 사람이 네트 넘어 상대 팀 빈 공간으로 공을 던져 공격한다.4) 공이 바닥에 두 번 닿거나, 네트에 걸리거나, 라인 밖으로 벗어나거나, 몸이 네트에 닿으면 실점하며 먼저 15점을 얻은 팀이 승리한다.</p>
