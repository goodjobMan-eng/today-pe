<h1>다람쥐 꼬리 잡기</h1>
<p>1) 모든 참가자는 조끼나 깃발을 주머니나 바지 허리춤에 꽂아 다람쥐 꼬리가 밖으로 잘 보이게 합니다. 2) 게임이 시작되면 서로 뛰어다니고 피하면서 다른 사람의 꼬리를 뽑아 모읍니다. 3) 꼬리를 모두 빼앗겨도 탈락하지 않고 계속 게임에 남아 다른 사람의 꼬리를 잡으러 다닙니다. 4) 진행자가 게임을 멈췄을 때 각자 모은 꼬리 개수를 세어 가장 많은 꼬리를 가진 사람이 승리합니다.</p>
