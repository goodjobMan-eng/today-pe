<h1>킥런볼 게임</h1>
<p>1) 공격수가 공을 차고 베이스를 달린다. 2) 수비수가 공을 잡으면 수비 팀 전원이 일렬로 모여 다리 사이 뒤로 공을 전달하며 10을 센다. 3) 마지막 사람이 공을 받아 베이스로 던지거나 베이스를 밟기 전까지 공격수가 돈 바퀴 수로 점수를 매긴다. 4) 두 바퀴를 돌면 1점, 세 바퀴를 돌면 2점을 얻으며 세 번 아웃되면 공수를 교대한다.</p>
