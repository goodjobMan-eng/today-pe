<h1>브라질 삼바 춤 배우기</h1>
<p>1) 편한 자세로 서서 무릎에 힘을 주지 않고 엉덩이를 뒤로 살짝 내리며 부드럽게 리듬을 탄다.2) 리듬을 타면서 옆으로 이동하고 두 번째 발의 발꿈치를 살짝 들어준다.3) 옆으로 이동하며 갈려는 방향의 발을 앞으로 내밀고 골반과 어깨를 흔들며 사이드 워크를 한다.4) 양팔을 벌리고 뒤로 이동하며 어깨를 살짝 뒤로 빼는 동작을 한 뒤 음악에 맞춰 연결한다.</p>
