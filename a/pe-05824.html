<h1>탁구 4인 포핸드 스트로크 랠리</h1>
<p>1) 4인 1조로 네트를 사이에 두고 양쪽에 2명씩 대기한다.2) 랠리 순서는 1번, 2번, 3번, 4번 순서로 반복하여 진행한다.3) 신호음 후 1번 선수의 서브(포핸드 스트로크)로 랠리를 시작한다.4) 1분 동안 포핸드 스트로크 랠리 성공 횟수를 측정한다.5) 랠리를 하다가 실패할 경우 공을 주워서 계속 실시한다.</p>
