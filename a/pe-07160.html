<h1>낙 잇 오프</h1>
<p>1) 짝을 지어 3개의 콘 위에 각각 테니스공이 올려진 표적을 마주보고 선다. 2) 2분의 제한 시간 동안 첫 번째 주자가 축구공을 발로 차서 콘 위의 테니스공을 맞혀 떨어뜨린다. 3) 공을 맞히거나 빗나간 후 드리블이나 패스로 공을 되가져오면 짝이 교대로 공을 찬다. 4) 테니스공을 모두 떨어뜨리면 거리를 멀리 이동시켜 난이도를 높인다.</p>
