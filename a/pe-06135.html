<h1>같은 색깔 빨리 찾아 맞히기</h1>
<p>1) 경기장에 여러 색상의 폭신주사위공을 흩어놓고 참가자들은 경기장에 모인다.2) 심판이 스캐터볼(정육면체 주사위공)을 높이 던진 뒤 멈출 때까지 지켜본다.3) 스캐터볼 윗면에 나온 색깔과 동일한 색깔의 폭신주사위공을 찾아 집어 든다.4) 스캐터볼을 향해 공을 던져 정확히 맞혀 움직이게 하면 생존하여 통과한다.5) 전체 인원의 3분의 1이 맞혀 성공하면 라운드가 종료되고, 남은 3분의 2 인원은 과제 벌칙을 수행한다.</p>
