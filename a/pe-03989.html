<h1>토일렛 태그 (변기 술래잡기)</h1>
<p>1) 술래는 스펀지봉을 들고 도망치는 학생들을 쫓아가며, 플러머(구출자)는 뚫어뻥을 든다. 2) 술래에게 태그된 학생은 즉시 자리에 멈추고 변기 손잡이 모양으로 한 손을 뻗은 채 무릎을 굽혀 스쿼트 자세를 유지한다. 3) 뚫어뻥을 든 플러머가 다가와 머리에 뚫어뻥을 살짝 대고 내밀어진 손(손잡이)을 내리면 구출되어 다시 도망갈 수 있다.</p>
