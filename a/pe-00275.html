<h1>컵 위 탁구공 튕겨 받기</h1>
<p>1) 플라스틱 컵이나 종이컵을 거꾸로 뒤집고 바닥 평평한 면 위에 탁구공을 올려놓습니다. 2) 한 손으로 컵을 잡고 공이 떨어지지 않도록 중심을 유지합니다. 3) 컵을 위로 살짝 튕겨 올려 탁구공을 공중에 띄운 뒤, 공이 떠 있는 순간 컵을 재빠르게 바로 뒤집어 컵 안으로 탁구공을 받아냅니다. 4) 공을 떨어뜨리지 않고 정해진 횟수를 먼저 성공하는 사람이 승리합니다.</p>
