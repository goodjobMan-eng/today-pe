<h1>드리블 파쿠르 축구 릴레이</h1>
<p>1) 콘으로 통과 문과 반환점을 설치하고 모둠별로 출발선에 선다. 2) 차례대로 공을 발 가까이 두고 콘 사이를 드리블하여 돌아온 뒤 다음 주자와 교대한다. 3) 중간에 콘을 추가해 8자 드리블을 하거나 도착선에서 표적(상자나 미니 골대)으로 슈팅하는 방식으로 난이도를 높여 대결한다.</p>
