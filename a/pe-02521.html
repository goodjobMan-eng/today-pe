<h1>스로 포 도우 (거리별 미식축구 패스 캐치)</h1>
<p>1) 투수는 패스 마커(발판) 위에 서서 쿼터백처럼 오버핸드로 풋볼 공을 던질 준비를 한다. 2) 포수는 거리별로 놓인 훌라후프(빨강 1달러부터 보라 100달러까지) 중 원하는 위치를 선택해 최소 한 발을 후프 안에 딛고 공을 받는다. 3) 후프 안에서 캐치에 성공하면 해당 구역의 모형 지폐를 획득하고, 실패하면 역할을 교대해 다른 후프를 선택해 재도전한다.</p>
