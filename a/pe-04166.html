<h1>어라운드 더 월드(농구 슛 게임)</h1>
<p>1) 골대와 가까운 위치에서 시작하여 슛을 시도한다. 2) 슛이 들어가면 골대에서 조금 더 먼 다음 목표 지점으로 이동하여 슛을 던진다. 3) 슛을 실패하면 순서를 상대방에게 넘기고, 다음 차례가 오면 이전에 성공했던 지점에서 다시 시작한다. 4) 가장 먼 지점을 지난 후에는 점차 골대 쪽으로 다시 다가가며 슛을 성공시켜 코스를 마친다.</p>
