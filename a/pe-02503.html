<h1>줄넘기 기본동작 7가지 익히기</h1>
<p>1) 16박자 기준으로 양발 모아뛰기 천천히(2도약) 8회, 빠르게(1도약) 16회를 연습한다. 2) 번갈아 뛰기(왼→오) 8회, 십자 뛰기(왼→오→앞→뒤) 2회를 연습한다. 3) 앞 흔들어 뛰기(오→왼 발차기) 8회, 뒤 흔들어 모아뛰기(오→왼 들기) 8회를 익힌다. 4) 줄을 모아쥐고 8자 돌리기 8회를 연습한 뒤, 섞인 번호 신호에 맞춰 동작을 암기하여 수행한다.</p>
