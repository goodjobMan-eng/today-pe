<h1>10분 줄넘기 챌린지</h1>
<p>1) 줄넘기를 잡고 30초 운동 후 30초 휴식하는 인터벌 방식으로 진행한다. 2) 기본 1회 도약(싱글 타임)을 시작으로 2회 도약(더블 타임), 제자리 달리기 도약을 차례로 실시한다. 3) 좌우 측면 뛰기, 360도 회전 도약, 뒤로 넘기 등 변형 줄넘기 동작에 도전한다.</p>
