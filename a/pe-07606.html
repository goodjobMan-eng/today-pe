<h1>한 손 공 던지고 받기 기초 저글링</h1>
<p>1) 양발을 골반 너비보다 약간 넓게 벌려 균형을 잡고 양손을 테이블 위에 얹듯 안정적인 자세를 취합니다. 2) 한 손으로 공을 살짝 위로 던진 뒤 그릇 모양으로 손을 오므려 공을 잡고 다시 던지기를 반복합니다. 3) 손에서 손으로 공을 전달해 받는 연습 및 머리 위, 등 뒤, 공 주위로 손을 돌리는 응용 동작과 덮어 잡기(고양이 발) 동작을 양손 모두 연습합니다.</p>
