<h1>피딩 타임 (레벨 1)</h1>
<p>1) 두 명당 공 1개를 준비하고 한 명은 골 서클 밖, 짝은 서클 안에서 마주 본다. 2) 코치가 '동물원 피딩 타임'을 외치면 서클 안의 물개들은 1분 동안 서클 밖의 사육사들로부터 최대한 많은 패스를 받는다. 3) 패스를 완료할 때마다 서클 안의 물개는 다른 사육사를 찾아 이동해 다음 패스를 받는다. 4) 1라운드가 끝나면 역할을 바꿔 진행한다.</p>
