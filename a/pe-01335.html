<h1>스내그 골프 롤링 타깃 맞히기 스테이션 활동</h1>
<p>1) 강당 내에 불스아이 표적과 롤러 타깃을 설치하고 모둠별로 타깃 스테이션에 정렬한다. 2) 스내그 골프 클럽(롤러)을 잡고 타깃을 향해 5번 방향으로 공을 굴리거나 띄워 친다. 3) 타깃에 공이 부착되면 명중한 구역의 점수를 합산하여 모둠 점수판에 기록한다. 4) 바닥 바운드로 맞히기, 직접 맞히기 등 타격 방식을 변경하거나 거리를 늘려 도전한다.</p>
