<h1>뜀틀 무트슈프룽 (용기 점프)</h1>
<p>1) 뜀틀 위에 무릎을 꿇고 올라앉는다. 2) 양팔을 강하게 앞으로 흔들며 뜀틀을 밀고 앞으로 뛰어내린다. 3) 바닥(매트)에 안전하게 착지하며, 숙달되면 뜀틀의 단 수를 점진적으로 높여 도전한다.</p>
