<h1>팀 빙고 챌린지</h1>
<p>1) 출발 지점에서 10~15m 떨어진 곳에 테이프를 사용해 가로세로 3칸의 빙고판을 만든다. 2) 시작 신호와 함께 각 팀의 첫 번째 주자가 팀콘을 들고 빙고판으로 달려가 원하는 칸에 내려놓고 돌아와 다음 주자와 손바닥을 터치한다. 3) 팀 콘을 다 놓고 빈손일 때는 놓여 있는 우리 팀 콘을 옮겨 가로·세로·대각선 중 한 줄을 먼저 완성한다.</p>
