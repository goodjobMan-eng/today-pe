<h1>늙은 회색 고양이 술래잡기</h1>
<p>1) 한 명의 술래(늙은 고양이)를 원 중앙에 세우고 나머지 학생(아기새)들은 둥글게 원을 만듭니다. 2) 아기새들이 원을 돌며 고양이를 놀리는 노래 구호를 다 함께 외칩니다. 3) 구호가 끝나는 순간 아기새들은 원 밖으로 흩어져 도망치고 고양이는 재빨리 뛰어가 아기새들을 쫓아가 태그합니다. 4) 가장 먼저 고양이에게 잡힌 학생이 다음 판의 새로운 술래가 되며 역할을 바꾸어 반복합니다.</p>
