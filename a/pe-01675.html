<h1>미니언즈 도시락 찾기 브레인 브레이크</h1>
<p>1) 화면 속 미니언즈가 훔쳐간 6개 음식 중 찾을 대상을 확인하고 화면 앞에 선다. 2) 도시락 가방들이 이리저리 뒤섞이는 움직임을 집중해서 눈으로 추적한다. 3) 가방 이동이 멈추면 정답 가방 밑 미니언의 춤이나 운동 동작을 15초간 따라 하며 선택한다. 4) 라운드가 올라갈수록 가방 개수와 섞이는 속도가 빨라지므로 집중력을 높여 도전한다.</p>
