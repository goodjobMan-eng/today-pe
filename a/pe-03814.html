<h1>봄 테마 계산 피트니스 운동</h1>
<p>1) 라운드마다 화면에 제시된 봄 관련 그림 3가지 중 가장 마음에 드는 그림 1가지를 선택한다. 2) 그림 위에 제시된 운동 동작을 제한 시간 30초 동안 수행한다. 3) 운동 시간이 끝나면 각 그림 뒤에 숨겨진 점수(1~3점)가 공개된다. 4) 라운드마다 획득한 점수를 누적하여 합산하고, 총점에 따라 동메달(8~14점), 은메달(15~20점), 금메달(21~24점)을 확인한다.</p>
