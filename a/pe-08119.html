<h1>콩주머니 균형 잡기</h1>
<p>1) 콩주머니를 머리나 어깨 등 신체 부위에 올리고 바닥에 떨어뜨리지 않도록 유지한다. 2) 콩주머니를 올린 상태에서 천천히 앉아 바닥을 터치하고 일어선다. 3) 신체 부위에 콩주머니를 얹은 채 시계 방향과 반시계 방향으로 천천히 한 바퀴 회전한다.</p>
