<h1>악동뮤지션 콩떡빙수 음악 줄밴드 리듬 점프</h1>
<p>1) 4인 1조로 2명은 양발에 고무줄 밴드를 끼워 간격을 유지하고, 2명은 밴드 사이에서 대기한다. 2) '콩떡빙수' 음악에 맞춰 좌우 스텝, 교차 점프, 마주보고 회전 점프 등 모둠 안무를 펼친다. 3) 노래 1절 동안 발이 밴드에 걸리지 않고 동작 일치도를 끝까지 유지하면 합격 점수를 받는다. 4) 동작에 손동작이나 턴 동작을 추가하여 모둠 고유의 창작 스텝으로 변형할 수 있다.</p>
