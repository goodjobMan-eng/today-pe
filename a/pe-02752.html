<h1>집에서 할 수 있는 전신 근력운동 루틴</h1>
<p>1) 1단계로 무릎을 굽힌 상태에서 팔을 굽혔다 폈다 하며 무릎 대고 팔굽혀펴기를 반복한다. 2) 다음 단계로 강도를 높여 무릎을 떼고 일반 팔굽혀펴기를 반복한다. 3) 제자리에 앉아 손을 옆에 짚고 무릎 굽혔다 펴기, 다리 들어 위아래 교차하기, 다리 들고 10초 버티기로 복근 운동을 한다. 4) 어깨너비로 서서 팔을 앞으로 뻗고 엉덩이를 뒤로 빼며 무릎이 앞으로 나오지 않게 스쿼트와 와이드 스쿼트를 반복한다.</p>
