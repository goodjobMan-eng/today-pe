<h1>샤프슈터 리바운드</h1>
<p>1) 벽 앞에 콘을 세우고 그 위에 배구공을 올려 표적을 만든다. 2) 각 팀은 표적 뒤 3~4m 거리에 선다. 3) 벽을 향해 테니스공을 던져 튕겨 나온 공으로 상대 팀 표적의 배구공을 먼저 맞혀 떨어뜨리는 팀이 승리한다.</p>
