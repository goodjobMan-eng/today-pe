<h1>스쿠터보드 라이더: 지그재그 코스 릴레이</h1>
<p>1) 2명이 짝이 되어 한 명은 스쿠터보드에 타고 다른 한 명은 뒤에서 밀어준다.2) 출발 신호에 맞춰 라바콘 사이를 지그재그로 통과하여 나아간다.3) 반환점을 지나 돌아올 때는 직선으로 빠르게 이동한다.4) 주자가 돌아오면 다음 번호 친구가 타는 사람의 어깨를 밀어주며 릴레이를 이어간다.5) 도중에 콘과 충돌하거나 스쿠터보드가 전복되면 무조건 꼴찌가 된다.</p>
