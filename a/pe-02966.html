<h1>고수의 공기놀이 (알낳기 공기)</h1>
<p>1) 바닥에 공기알 5개를 흩뿌린 뒤 공기알 하나를 위로 던지며 바닥의 공기를 집는 1단부터 4단까지 진행한다. 2) 5단에서는 손등이나 손가락 사이에 공기알을 끼우는 알낳기 특수 동작을 수행한다. 3) 6단에서는 손가락 사이사이에 공기를 끼워 바닥에 내려놓고 다시 잡는 기술을 수행한다. 4) 마지막 꺾기에서 공기알 5개를 모두 공중에 띄워 손등으로 받은 후 낚아채서 콩 하고 내려찍어 끝낸다.</p>
