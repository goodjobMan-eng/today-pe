<h1>구역 침투 게임 (에리어 33)</h1>
<p>1) 3명이 한 조가 되어 공격팀과 수비팀으로 나뉜다. 2) 수비팀은 구역 라인을 따라 서서 마주 보고, 신호가 울리면 공격팀은 구역 안으로 달린다. 3) 수비팀은 구역을 지키며 공격수를 터치하고 구역 안으로는 들어갈 수 없다. 4) 공격수 중 1명이라도 구역에 들어가면 공격 승리, 수비가 전원을 터치하면 수비가 승리한다.</p>
