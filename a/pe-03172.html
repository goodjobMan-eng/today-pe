<h1>종합 이어달리기 게임</h1>
<p>1) 세 명씩 두 모둠으로 나누어 순서를 정하고 출발선에 선다. 2) 신호가 울리면 첫 번째 주자가 출발하여 1구역 콘 사이를 지그재그로 달린다. 3) 2구역에서 티라노 발로 뛰면서 이동하고, 3구역에서 코끼리 코를 만들고 제자리에서 세 바퀴 돈다. 4) 4구역 매트 위에서 세 바퀴 구른 뒤 도착점으로 들어오고 앞 주자가 들어오면 다음 주자가 출발하여 가장 먼저 들어온 모둠이 승리한다.</p>
