<h1>2인 패스 연계 및 전진 슛팅 훈련</h1>
<p>1) 출발 콘과 중간 지점 콘을 세워 2개 라인을 만들고 축구 골대 앞에 키퍼를 배치한다. 2) 첫 주자가 옆 줄 학생에게 패스를 건네고 전방 콘을 향해 빠르게 달려 나간다. 3) 패스를 받은 학생이 전진하는 첫 주자 앞쪽으로 리턴 패스를 연결하고 주자는 이를 이어받아 골대로 슈팅한다. 4) 좌우 진행 방향을 바꾸어 양발 슛팅을 연습하거나 골키퍼를 순번대로 교체하며 진행한다.</p>
