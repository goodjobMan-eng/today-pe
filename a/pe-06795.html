<h1>탁구공 블랙홀</h1>
<p>1) 박스 뚜껑에 탁구공이 빠질 크기의 구멍(블랙홀)을 뚫고 그 아래에 계란판을 놓는다. 2) 박스 뚜껑 위에 탁구공 10개를 올린다. 3) 박스 뚜껑을 손으로 기울이고 조작하여 탁구공을 블랙홀 구멍 사이로 빠뜨린다. 4) 밖으로 튀어나온 공은 다시 올려놓고 계란판 홈 안으로 먼저 10개를 모두 넣은 사람이 승리한다.</p>
