<h1>게라볼 (표적 콘 공 쓰러뜨리기)</h1>
<p>1) 경기장을 4개 구역으로 나누고 각 구역에 훌라후프를 놓은 뒤, 후프 안에 콘을 세우고 콘 위에 테니스공을 올려놓는다. 2) 4개 팀이 각 구역에 위치하고 폼볼을 지급받는다. 3) 폼볼을 던져 상대 구역 콘 위의 테니스공을 맞춰 떨어뜨리면 1점을 획득한다. 4) 수비는 표적을 방어할 수 있으나 후프 내부 영역 안으로 발을 디뎌서는 안 되며, 공이 떨어지면 다시 올려놓고 경기를 계속한다.</p>
