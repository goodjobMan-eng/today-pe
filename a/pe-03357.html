<h1>티볼 게임</h1>
<p>1) 10명씩 두 개의 모둠을 이루어 정해진 순서대로 타격과 수비 역할을 정한다. 2) 타자는 공을 친 후 각 베이스(누)를 돌아 홈으로 들어오면 1점을 얻는다. 3) 수비 모둠이 타자가 친 뜬공을 바로 잡거나 주자보다 먼저 해당 누로 공을 보내면 타자 또는 주자는 아웃된다. 4) 모둠원 모두가 한 번씩 공을 치고 나면 공격과 수비를 교대하며, 3회씩 진행하여 점수가 많은 모둠이 이긴다.</p>
