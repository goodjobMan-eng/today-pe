<h1>자동차 훌라후프 놀이</h1>
<p>1) 콘 4개로 표시된 놀이 구역 안에서 각자 훌라후프를 핸들처럼 잡고 선다. 2) '초록 불' 신호에는 운전하듯 서로 부딪히지 않게 이동하고, '고속도로' 신호에는 구역 안에서 빠르게 달린다. 3) '기름 유출'에는 좌우로 비틀거리며 피하고, '터널'에는 몸을 낮추며, '빨간 불'에는 멈춘다. 4) 다른 사람과 부딪히면 후프를 가지고 바깥으로 나가 채소 이름 5가지를 말하며 점핑잭 5회를 수행한 뒤 복귀한다.</p>
