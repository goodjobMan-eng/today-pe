<h1>4개 구역 모서리 이동 피트니스</h1>
<p>1) 활동 공간의 네 모서리 구역을 색상이나 번호로 미리 지정해 둔다. 2) 화면에 지시된 이동운동(걷기, 갤럽, 조깅 등)을 수행하며 경계 구역 안을 자유롭게 돌아다닌다. 3) 사이렌 호루라기 소리가 울리면 자신에게 가장 가까운 모서리 구역으로 신속히 이동한다. 4) 모서리에 배정된 지정 운동 동작(스쿼트, 런지, 푸시업, 요가 자세 등)을 정해진 시간 동안 성실히 완수한다.</p>
