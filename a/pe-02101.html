<h1>배틀 피구</h1>
<p>1) 코트 중앙에 콘으로 라인을 설치하고 팀 조끼를 착용하여 양 팀으로 나눈다. 2) 일반 피구 규칙으로 공을 던져 상대 팀 선수를 맞혀 아웃시킨다. 3) 공격을 받아 아웃된 선수는 코트 밖으로 이동하여 대기한다. 4) 자신을 아웃시켰던 상대 공격수가 아웃되는 순간, 대기하던 탈락자가 다시 코트 안으로 살아 돌아온다.</p>
