<h1>해적 어드벤처 샤크 탈출 운동</h1>
<p>1) 바닥에 엎드려 배를 대고 눕는다. 2) 교사가 신호(Help)를 외치면 손과 발을 동시에 공중으로 들어 올린다. 3) 다시 신호(Down)에 맞춰 바닥으로 엎드린 자세로 돌아간다. 4) 40초 동안 신호에 맞춰 상하체 들기 동작을 반복한 후 빠르게 일어선다.</p>
