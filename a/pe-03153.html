<h1>우리 집 지키기 게임</h1>
<p>1) 공격 모둠과 수비 모둠으로 역할을 나눈다. 2) 수비수는 경기장 안에 자유롭게 서서 자신의 옆에 페트병을 세워 놓는다. 3) 공격수는 경기장 밖에서 공을 굴려 페트병을 쓰러뜨리려 하고, 수비수는 공을 손으로 잡아 밖으로 내보낸다. 4) 역할을 바꾸어 게임을 진행하고 정해진 시간 동안 세워 놓은 페트병이 많은 모둠이 이긴다.</p>
