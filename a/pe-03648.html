<h1>줄넘기 응용 스텝 (앞뒤 흔들어 뛰기, 무릎 올려 뛰기, 360도 돌기)</h1>
<p>1) 앞뒤로 흔들어 뛰기는 1 할 때 발을 뒤로, 2 할 때 앞으로 내밀며 발을 번갈아 뛴다. 2) 무릎 올려 뛰기는 무릎과 허벅지가 90도가 되도록 높이 들어 올려 뛴다. 3) 4번 줄이 돌아갈 때를 한 세트로 맞춰 무릎 올려 뛰기 동작을 완성한다. 4) 모아 뛰며 360도 돌기는 천천히 각도를 나누어 반 바퀴씩 몸을 돌리며 뛴다.</p>
