<h1>물구나무서기 전 부상 예방 스트레칭</h1>
<p>1) 머리 뒤를 잡고 배꼽을 바라보며 머리를 앞으로 숙여 목 뒤를 5초간 늘린다. 2) 귀와 어깨가 닿도록 당기고 반대 손으로 바닥을 밀어내듯 목 옆 근육을 좌우 각 5초간 늘린다. 3) 엄지손가락으로 턱 밑을 밀어 올려 목 앞 근육을 5초간 늘린다. 4) 한쪽 팔을 반대쪽으로 당겨 어깨를 좌우 5초씩 늘리고, 머리 뒤로 팔꿈치를 당겨 옆구리를 늘린 후 손을 아래로 짚어 체중을 실으며 손목을 앞뒤 5초씩 늘린다.</p>
