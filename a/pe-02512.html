<h1>발끝 조작 및 공 밟기 운동놀이</h1>
<p>1) 미니콘을 발가락이나 양발 사이에 끼워 발로만 뒤집는다. 2) 엉덩이를 바닥에 대고 앉은 자세로 이동하며 발로 콘을 뒤집는다. 3) 네발 엎드린(쿠마아루키) 자세로 뒤로 기어가며 발로 콘을 뒤집는다. 4) 공 위에 발을 얹어 굴리기, 탭하기, 주위 돌기 및 양발 사이에 공을 끼워 점프 캐치하기를 한다.</p>
