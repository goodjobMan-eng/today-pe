<h1>원형 패스 고양이와 쥐 공 추격 놀이</h1>
<p>1) 모둠원들이 동그랗게 둘러선 뒤 마주보는 두 사람이 각각 크기가 다른 공 2개를 나눠 쥔다. 2) 신호와 함께 두 공을 시계 방향(오른쪽)으로 옆 사람에게 신속하게 전달한다. 3) 뒤따라가는 공(고양이)이 앞서가는 공(쥐)을 따라잡도록 양쪽에서 전달 속도를 끌어올린다. 4) 공을 떨어뜨리면 놓친 사람이 직접 주워 이어가며, 한 사람에게 두 공이 동시에 모이면 추격 성공으로 게임을 다시 시작한다.</p>
