<h1>미션 고깔 릴레이와 고깔 위치 바꾸기</h1>
<p>1) 고깔 10개에 방향 지시 표시를 부착하고 대표 학생이 배치하는 동안 팀원들은 뒤돌아 대기한다. 2) 시작 신호가 울리면 첫 주자가 출발하여 고깔의 미션을 수행하고 반환점을 돌아 다음 주자의 등을 터치한다. 3) 두 번째 활동에서는 원마커 위의 고깔 10개의 위치를 좌우로 번갈아 바꾸며 반환점을 돌아온 뒤 다음 주자에게 인계한다.</p>
