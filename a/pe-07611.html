<h1>농구 에페르비에 (농구 드리블 술래잡기)</h1>
<p>1) 사냥꾼(술래)은 공 없이 중앙에 서고, 나머지 도망자들은 각자 농구공을 가지고 출발선에 선다. 2) 시작 신호가 울리면 도망자들은 규칙에 맞게 한 손씩 번갈아 드리블하며 반대편 안전선(중앙선 콘 구역)까지 건너간다. 3) 사냥꾼은 상대 신체를 치지 않고 오직 공만 쳐내야 하며, 드리블을 멈추거나 공을 빼앗긴 사람은 공을 지도자에게 건네고 새 사냥꾼이 된다.</p>
