<h1>훌라후프 체인 게임</h1>
<p>1) 모든 참가자가 손을 잡고 원으로 둘러선다. 2) 원의 한 지점에 훌라후프를 놓는다. 3) 서로의 손을 놓지 않고 각자 훌라후프를 통과하여 옆 사람에게 넘긴다. 4) 훌라후프가 원을 한 바퀴 다 돌 때까지 계속 진행한다.</p>
