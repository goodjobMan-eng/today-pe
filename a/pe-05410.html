<p>1) 팀원끼리 말이나 눈빛 등 신호를 주고받지 않도록 규칙을 정한다.2) 구호에 맞춰 팀원 전원이 동시에 각자 가위바위보 손을 낸다.3) 팀원 모두가 같은 모양을 내거나 규칙에 따라 승패를 판정한다.</p>
