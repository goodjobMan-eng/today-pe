<h1>줄넘기 기본 파워동작 기술(푸시업 및 프로그)</h1>
<p>1) 푸시업은 4박자 스텝(발 붙이기, 양발 벌리기, 다시 모아 플렉스, 일어서기)으로 줄 없이 먼저 연습한다. 2) 네 박자가 자연스러워지면 3박자로 연결하여 줄을 넘으며 푸시업 파워 동작을 익힌다. 3) 프로그는 손을 짚고 물구나무서기 동작으로 발을 쭉 뻗어 붙인 상태에서 내려오는 연습을 거쳐 줄을 넘는다.</p>
