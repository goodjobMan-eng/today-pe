<h1>야구·럭비형 제기차기 드리기 놀이</h1>
<p>1) 제기차기 대결로 공격과 수비를 나누고 투수와 타자는 마주 서며 주위에 공격수와 수비수가 배치된다. 2) 투수가 타자에게 제기(폭신공)를 던져주면 타자가 발로 차며 놀이를 시작한다. 3) 제기를 2회 이상 연속 차거나 잡고 도망치며 찰 때마다 목숨(공격 기회)을 1개씩 획득하며 패스도 가능하다. 4) 수비수가 공을 가진 공격수를 터치하거나 날아오는 공을 가로채 발로 차면 공수가 즉시 교대된다.</p>
