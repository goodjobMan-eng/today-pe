<h1>에어로빅 볼링</h1>
<p>1) 체육관 한쪽에 핀들을 펼쳐 두고 반대편에는 각 팀의 훌라후프를 놓는다. 2) 짝을 이룬 두 선수 중 첫 번째 주자가 롤링 라인에서 공을 굴려 핀을 쓰러뜨린다. 3) 핀을 맞히면 핀 1개와 공을 챙겨 와 공은 파트너에게 넘기고 핀은 팀의 훌라후프 안에 넣은 뒤 대기 자리로 돌아온다. 4) 파트너가 돌아오면 역할을 맞바꾸어 다음 차례를 진행하며, 핀을 맞히지 못하면 공만 회수해 파트너에게 전달한다.</p>
