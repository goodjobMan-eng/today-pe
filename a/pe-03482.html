<h1>협력 오래 달리기</h1>
<p>1) 4명이 한 모둠을 이루고 두 모둠이 운동장 반대편에 선다. 2) 출발 신호와 함께 동시에 출발하여 운동장을 달린다. 3) 달리는 동안 상대를 잡으면 1점을 얻고, 잡힌 모둠은 출발선으로 이동해 자기 모둠이 지날 때 다시 달린다. 4) 운동장 네 바퀴를 달리는 동안 더 많은 점수를 얻은 모둠이 이긴다.</p>
