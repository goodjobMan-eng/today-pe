<h1>포트나이트 댄스 휠 신체활동</h1>
<p>1) 룰렛(휠)에 다양한 포트나이트 댄스 종목을 넣고 돌려 배울 댄스를 무작위로 선택한다. 2) 선택된 춤(플로스, 디스코 피버 등)의 하체 및 상체 동작을 단계별로 나누어 교사와 함께 익힌다. 3) 단순화된 박자에 맞추어 팔과 다리 동작을 결합하고 제자리에서 반복하여 숙달한다.</p>
