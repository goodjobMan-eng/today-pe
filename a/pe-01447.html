<h1>헬리콥터 복근 가위바위보</h1>
<p>1) 짝과 마주 서서 바른 자세로 서서 가위바위보를 진행한다. 2) 진 사람은 바닥에 반듯이 누워 양다리를 모으고 복근에 힘을 주어 다리를 살짝 들어 올린다. 3) 이긴 사람은 진 사람의 두 발목을 잡고 헬리콥터 프로펠러처럼 원을 그리며 360도 빙 돌려준다. 4) 다리를 잡고 돌리는 대신 엉덩이를 바닥에 댄 채 살짝 끌어당기거나 역할을 바꿔 진행한다.</p>
