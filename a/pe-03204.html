<h1>삼각형 티볼 게임</h1>
<p>1) 6명씩 공격 모둠과 수비 모둠으로 나누어 정해진 위치에 선다. 2) 타자가 타격한 뒤 달려 1루와 2루를 밟고 홈으로 들어오면 1점을 획득한다. 3) 타자가 세 번 안에 공을 치지 못하거나 친 공이 공중에서 잡힐 경우, 또는 수비수가 던진 공이 주자보다 먼저 누에 도착하면 아웃된다. 4) 아웃이 세 번 되면 공수를 바꾸며 4회까지 번갈아 진행하여 득점이 많은 모둠이 승리한다.</p>
