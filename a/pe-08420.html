<h1>사람 골대 변형 농구 게임</h1>
<p>1) 스텝박스 위에 선 학생(골대)에게 공을 패스하여 전달하면 득점한다. 2) 남학생은 두 손으로만 공을 패스하거나 슛할 수 있으며 미드존에는 들어갈 수 없다. 3) 공을 놓치면 다시 잡을 수 없으며 득점할 때마다 정해진 순서대로 골대를 교대한다.</p>
