<h1>씨름 손기술·발기술 연습</h1>
<p>1) 무릎을 꿇고 제자리에 앉아 서로 마주 보고 샅바(또는 허리)를 잡는다. 2) 왼쪽 무릎을 세우고 함께 일어선 뒤 허리를 숙여 준비 자세를 취한다. 3) 신호에 맞춰 안무릎치기, 오금당기기, 밭다리걸기 등의 손기술과 발기술을 연습한다.</p>
