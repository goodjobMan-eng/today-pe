<h1>바톤 터치 오픈 코스 이어달리기</h1>
<p>1) 학급을 4개 팀으로 나누고 주자 순서를 정한 뒤 오픈 코스 계주 트랙에 배치한다. 2) 출발 신호와 함께 1번 주자가 전력 질주하며 다음 주자의 인계 구역으로 접근한다. 3) 감속 없이 전달 주자가 오른손(또는 왼손)으로 건네고 받는 주자가 교차 손으로 바톤을 쥐고 달린다. 4) 4팀 합동 경기 시 오른손 전달 후 즉시 안쪽 주로로 퇴장해 뒷주자 진로 방해를 줄이는 변형 규칙을 적용한다.</p>
