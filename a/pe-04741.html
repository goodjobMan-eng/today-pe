<h1>집에서 즐기는 배드민턴 홈트</h1>
<p>1) 대각선 방향으로 왼발, 오른발을 딛고 돌아오는 배드민턴 기본 스텝을 익힌다.2) 스텝과 함께 네트 바로 앞에 공을 떨어뜨리는 포핸드 및 백핸드 헤어핀 동작을 연습한다.3) 리모컨이나 작은 물건을 바닥에 두고 앞뒤로 발을 바꾸며 뛰는 풋워크를 수행한다.4) 스텝과 연계하여 높은 타점에서 타구하는 클리어와 내리꽂는 스매시, 직선으로 치는 드라이브 스윙을 단계별로 연습한다.</p>
