<h1>전쟁 피구 (발론 데 게라)</h1>
<p>1) 경기장 중앙에 매트와 벤치 등 엄폐물을 배치하고 학급을 두 팀으로 나눈다 2) 양 팀에 폼볼을 나누어 준 뒤 상대 팀 선수를 향해 공을 던져 맞힌다 3) 공에 맞은 선수는 코트 밖으로 퇴장한다 4) 자신을 맞힌 상대 선수가 공에 맞아 탈락하면 밖으로 나갔던 선수는 다시 코트로 복귀한다</p>
