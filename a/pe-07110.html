<h1>돌려 돌려 공</h1>
<p>1) 동그랗게 원 대형으로 둘러선다. 2) 팔을 X자로 교차해 양옆 친구의 손을 잡는다. 3) 시작점 친구의 손에 공을 올리고 시계 반대 방향으로 공을 떨어뜨리지 않고 넘긴다. 4) 공을 떨어뜨리면 떨어진 다음 사람 손에 공을 다시 올리고 이어서 진행한다. 5) 반 전체 한 모둠으로 3바퀴를 돌며 걸린 시간을 측정해 기록을 단축한다.</p>
