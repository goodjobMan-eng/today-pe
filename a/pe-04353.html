<h1>발렌타인데이 마리오 런</h1>
<p>1) 마리오가 가장 많은 골드 하트를 찾을 수 있는 방향을 정하고 해당 자세를 취해 선택한다. 2) 길을 달리며 벽돌을 펀치로 부수어 골드 하트를 찾고 발견한 개수를 소리 내어 센다. 3) 굼바를 뛰어넘고, 패러트루퍼 아래로 몸을 숙이며, 캐서린(버도)을 피한다. 4) 하트를 충분히 모아 마리오의 발렌타인에게 도착할 때까지 반복한다.</p>
