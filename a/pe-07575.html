<h1>베곳 (공간 제약 빈백 패스 릴레이)</h1>
<p>1) 직사각형 4면에 각 팀(3~4명)이 일렬로 앉고 가장 왼쪽 학생이 빈백을 쥔다. 2) 교사가 부르는 이동 기술(갤럽, 사이드 슬라이드 등)로 일어나 콘을 터치하고 돌아온다. 3) 돌아와 바닥에 앉아 팀원들 다리 밑으로 빈백을 통과시켜 다음 주자에게 넘긴다. 4) 2분 동안 처음 주자에게 몇 번 돌아오는지 팀별로 횟수를 센다.</p>
