<h1>리비 (야구·필딩형 게임)</h1>
<p>1) 공격팀 타자는 투수가 던진 공을 배트로 치고 1루 또는 2루로 달린다.2) 타자가 베이스에 도착하기 전에 수비팀이 먼저 공을 베이스로 송구하면 득점을 저지하거나 아웃을 잡는다.3) 3스트라이크, 플라이 아웃, 더블 플레이, 또는 모든 타자가 타격하면 공수를 교대한다.</p>
