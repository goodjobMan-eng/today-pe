<h1>태양의 흑점 술래잡기</h1>
<p>1) 참가자들은 손을 잡고 둥글게 원을 만들어 태양을 형성한다.2) 술래 1명과 도망자 1명을 정하여 잡기 놀이를 시작한다.3) 원을 만든 학생들은 도망자가 올 때는 손을 들어 문을 열어주고, 술래가 오면 손을 내려 막는다.4) 접시콘으로 정한 활동 구역 밖으로 벗어나면 아웃된다.</p>
