<h1>매트 에어-퐁 게임</h1>
<p>1) 네트를 사이에 두고 양쪽 매트 위에 1명 또는 2명씩 마주 보고 앉거나 자리 잡는다.2) 손으로 풍선을 쳐서 네트 너머 상대방 매트 위로 넘긴다.3) 한 사람이 연속해서 치는 투터치는 금지하며 바로바로 넘긴다.4) 풍선이 상대방 매트 위에 떨어지면 득점하고, 너무 강하게 쳐서 매트 밖으로 벗어나면 상대방이 득점한다.</p>
