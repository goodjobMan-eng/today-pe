<h1>개구리 후프 징검다리 건너기</h1>
<p>1) 팀별로 출발선에 한 줄로 서고 첫 주자(개구리) 앞에 훌라후프 3~4개를 일렬로 배치한다. 2) 신호가 울리면 첫 주자는 후프 안으로 두 발 또는 한 발로 점프하며 징검다리를 건너듯 이동한다. 3) 주자가 지나간 뒤쪽 후프를 뒤따르는 팀원들이 신속히 주워 개구리의 앞쪽으로 차례대로 놓아 길을 만든다. 4) 발이 후프 밖(물)에 닿으면 출발점으로 돌아가며, 반대편 벽에 도착하면 역할을 바꾸어 돌아오는 릴레이를 진행한다.</p>
