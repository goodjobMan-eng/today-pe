<h1>빠른 발바꿈 런지 점프 트레이닝</h1>
<p>1) 차려 자세에서 한쪽 발을 앞으로, 반대쪽 발을 뒤로 벌려 런지 스탠스를 취한다. 2) 제자리에서 가볍게 점프하며 양발의 앞뒤 위치를 공중에서 빠르게 맞바꿔 착지한다. 3) 리듬감 있게 연속으로 발을 바꾸며 무릎을 충분히 굽히고 상체의 중심을 안정적으로 유지한다. 4) 동작에 익숙해지면 한 번의 높은 점프 동안 공중에서 발을 2회 또는 3회 연속 교차하는 고급 도전에 나선다.</p>
