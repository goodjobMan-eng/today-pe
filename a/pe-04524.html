<h1>이것 또는 저것: 세계 명소 운동</h1>
<p>1) 10초 동안 화면에 제시된 두 곳의 여행지 중 가고 싶은 곳 하나를 선택한다. 2) 30초 동안 선택한 장소에 해당하는 정해진 맨몸 운동을 수행한다. 3) 총 5라운드 동안 다른 여행지와 운동(우드찹, 스윙킥, 사이드 셔플, 제자리 달리기 등)을 같은 방식으로 진행한다.</p>
