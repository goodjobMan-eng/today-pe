<h1>푸시업 앤 컬업 5x5 근지구력 단련</h1>
<p>1) 매트 위에 엎드리거나 누워 팔굽혀펴기와 상체 말아올리기 기본자세를 숙지한다. 2) 구령 음성에 맞춰 5회의 팔굽혀펴기를 내려가고 올라오는 박자에 정확히 맞추어 실시한다. 3) 휴식 신호 후 자세를 바꾸어 무릎을 세우고 누운 뒤 구령에 맞춰 5회의 컬업을 수행한다. 4) 두 종목을 번갈아 가며 총 5세트(각 25회)를 올바른 자세를 유지하며 완수한다.</p>
