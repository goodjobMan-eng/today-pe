<h1>오시쿠라만쥬 술래잡기</h1>
<p>1) 원 안에 모여 가슴 앞에서 팔짱을 낀다. 2) 원 밖의 술래는 원 안의 사람을 터치하려고 한다. 3) 원 안의 사람들은 등을 맞대고 밀어내며 버틴다. 4) 술래에게 터치당하거나 원 밖으로 밀려나면 술래가 된다.</p>
