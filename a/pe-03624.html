<h1>책상 의자 컵농구 게임</h1>
<p>1) 책상 뒤에 의자를 딱 붙여 놓고 홈통 또는 목표 지점을 구성한다. 2) 원바운드로 공을 튕겨 의자나 컵 등 목표물에 공을 넣는 연습을 진행한다. 3) 원바운드 방식 대신 노바운드로 직접 던져 넣는 방식으로 변형하여 활동한다. 4) 팀별로 빠르게 공을 던지고 쫓아가서 공을 회수하며 순서를 이어간다.</p>
