<h1>연필깎기 술래놀이</h1>
<p>1) 전체 가위바위보 등으로 천사 술래 2명을 뽑는다.2) 천사는 잡을 수 없고 아웃되지 않는다.3) 천사에게 태그된 친구는 다리를 벌리고 멈춰 선다.4) 다른 친구가 다리 사이를 세 바퀴 돌며 연필을 깎아주면 부활한다.</p>
