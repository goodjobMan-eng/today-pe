<p>1) 학생들은 마당 전체에 원하는 위치를 정해 흩어져 서며, 경기 중 발을 움직여 이동할 수 없습니다. 2) 침묵을 유지한 채 서로에게 공을 던져 패스합니다. 3) 공을 떨어뜨리거나, 나쁜 패스를 던지거나, 말을 하면 벌칙(스트레칭, 팔굽혀펴기 5회, 윗몸일으키기 5회 중 하나)을 수행합니다.</p>
