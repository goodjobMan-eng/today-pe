<h1>무한 그림 릴레이</h1>
<p>1) 모둠별로 책상 위에 그림 그릴 종이를 올려놓고 1번부터 순서를 정한다.2) 시작 신호가 울리면 1번 주자가 문제 바구니로 가 단어 쪽지를 뽑는다.3) 뽑은 단어를 글씨, 숫자, 영어, 말 없이 오직 그림으로만 그린다.4) 모둠원들이 정답을 맞히면 다음 주자가 바구니로 달려가 새 문제를 뽑아 이어 그린다.</p>
