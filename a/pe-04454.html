<h1>줄넘기 기본 및 응용 스텝 연습</h1>
<p>1) 줄을 밟고 섰을 때 손잡이가 겨드랑이에 오는 길이로 맞춘다. 2) 발을 모아 양발 모아뛰기(2회 회전/1회 회전)를 손목을 사용해 연습한다. 3) 한 발로 두 번씩 번갈아 뛰는 한 발 뛰기와 제자리 달리기 스텝을 익힌다. 4) 스키어, 벨, 사이드 스트래들, 시저스, 스트래들 크리스크로스, 캉캉, 십자뛰기 등 다양한 변형 스텝과 바닥에 줄을 놓는 스텝 연습을 진행한다.</p>
