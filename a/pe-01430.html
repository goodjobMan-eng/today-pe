<h1>안 뛰는 줄넘기 협동 배틀 게임</h1>
<p>1) 바닥에 긴 줄이나 개인 줄넘기를 일직선으로 길게 늘어놓고 양 끝에 접시콘을 출발점으로 배치한다 2) 두 팀으로 나뉘어 각자 양 끝에서 출발해 줄 위를 외나무다리처럼 밟으며 반대편을 향해 전진한다 3) 줄 중간에서 상대와 마주치면 멈추어 서서 가위바위보를 진행하고 패자는 줄 밖으로 나간다 4) 승자는 계속 전진하고 패한 팀은 즉시 다음 주자가 출발하며 상대편 진영 끝 콘에 먼저 도달하면 득점한다</p>
