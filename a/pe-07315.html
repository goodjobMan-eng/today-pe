<h1>등 맞대고 반응 술래잡기(페페와 페파)</h1>
<p>1) 학생들은 둘씩 짝을 짓고 1미터 거리를 두고 등을 맞대고 서며, 양쪽에 골인선을 둔다. 2) 한쪽은 '페페', 다른 쪽은 '페파'로 역할을 지정한다. 3) 교사가 '페페'라고 외치면 페파는 자기 골인선으로 도망가고 페페는 쫓아가 태그한다. 4) 잡히지 않고 골인선에 도달하면 도망친 선수가 1점, 그 전에 잡으면 쫓아간 선수가 1점을 얻는다.</p>
