<h1>양말 균형 챌린지 (The Sock Challenge)</h1>
<p>1) 바닥에 표적이 될 종이 4장을 놓는다.2) 한 발로 선 상태에서 몸을 숙여 각 종이 위에 양말을 하나씩 올려놓는다(던지거나 떨어뜨리기 금지).3) 든 발을 바닥에 딛지 않고 하나씩 양말을 다시 주워 모은다.4) 동작이 완전히 끝날 때까지 한 발 균형을 유지한다.</p>
