<h1>볼 샐러드</h1>
<p>1) 학급을 두 팀으로 나누고 팀1은 벤치로 둘러싼 사각형 안, 팀2는 사각형 밖으로 배치한다. 2) 신호가 울리면 팀1은 사각형 밖으로 최대한 많은 공을 던져내고 팀2는 밖으로 나온 공을 사각형 안으로 다시 주워 넣는다. 3) 2분간 진행한 뒤 공 수를 세고 역할을 맞바꾼다. 4) 2분 종료 시점에 사각형 안에 남은 공 수가 더 적은 팀이 승리한다.</p>
