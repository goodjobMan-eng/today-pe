<h1>폴짝 이어 뛰기</h1>
<p>1) 학급 전체를 4개 모둠으로 나누고 모둠별로 순서를 정한다. 2) 첫 번째 모둠원은 도움닫기를 하여 출발선에 놓인 원 마커를 한 발로 밟고 뛰어 착지한 지점에 원 마커를 놓는다. 3) 다음 순서 모둠원은 도움닫기를 하여 앞 모둠원이 놓은 원 마커를 한 발로 밟고 멀리 뛴 후 착지 지점에 마커를 놓는다. 4) 순서대로 모든 모둠원이 이어 뛰기를 하고 최종 착지 거리가 가장 먼 모둠이 이긴다.</p>
