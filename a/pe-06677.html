<h1>키즈핏 타바타 트레이닝</h1>
<p>1) 40분 수업 중 10분 동안 스쿼트와 고관절 힙힌지 자세로 준비운동을 한다. 2) 본운동으로 줄넘기, 스쿼트, 버피 테스트 등 종목을 8분간 정해진 개수만큼 반복 수행한다. 3) 수행한 총 반복 횟수를 운동 일지에 기록하고 3개월 전 기록과 비교한다.</p>
