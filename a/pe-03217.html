<h1>플라잉디스크 컬링·볼링·사격 활동</h1>
<p>1) 엄지를 위에 올리고 네 손가락으로 디스크를 잡은 뒤 몸 안쪽에서 바깥쪽으로 던지는 법을 익힙니다. 2) 바닥에 점수가 표시된 과녁판을 설치하고 디스크를 던져 높은 점수를 획득하거나 상대 디스크를 쳐냅니다. 3) 책상 위에 세워진 핀들을 향해 디스크를 던져 쓰러진 핀의 개수를 겨룹니다. 4) 출발선에서 디스크를 주워 적힌 번호를 확인한 뒤 해당 번호 타깃을 디스크로 맞힙니다.</p>
