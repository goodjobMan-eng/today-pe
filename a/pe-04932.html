<h1>축구 시저스 페인트 연습</h1>
<p>1) 제자리에서 공을 두고 안쪽에서 바깥쪽으로 한 발로 넘긴 뒤 반대 발 아웃사이드로 빠르게 치고 나간다.2) 상체 전체를 크게 흔들어 상대방을 속이는 동작을 연습한다.3) 페트병을 수비수 삼아 1m 거리에서 드리블하며 타이밍에 맞춰 시저스 동작으로 제친다.</p>
