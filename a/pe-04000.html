<h1>정지 신호 반응 및 홈스폿 이동 훈련</h1>
<p>1) 농구 코트 검은색 경계선 안에서 다른 친구와 부딪히거나 신체 접촉을 하지 않고 정해진 속도로 걷는다. 2) 교사가 '얼음(Freeze)'이라고 외치면 즉시 멈춰 서서 교사를 바라보고 설명을 들을 준비를 한다. 3) 신호에 맞춰 걷거나 행진하는 다양한 이동 동작을 수행하다가 신호가 떨어지면 자신의 지정된 자리(홈스폿)로 신속히 찾아 돌아간다.</p>
