<h1>뜀틀 위 손 짚고 안전하게 착지하기</h1>
<p>1) 반 전체를 2개 모둠으로 나누고 모둠별 순서를 정한다. 2) 뜀틀 위에 손을 짚는 위치를 표시하고 착지할 매트 위에 원마커를 놓는다. 3) 표시된 위치에 손을 정확히 짚으면 2점, 착지 구역의 원마커 위에 착지하면 1점을 획득한다. 4) 모둠원의 점수를 모두 합산하여 더 높은 점수를 얻은 모둠이 이긴다.</p>
