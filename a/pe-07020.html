<h1>스쿠터 론볼</h1>
<p>1) 목표 지점 역할을 하는 스팟 마커를 두고 각자 콩주머니 2개를 받는다. 2) 3인 1팀(밀어주는 사람 2명, 스쿠터보드 탑승자 1명)으로 팀원이 탄 스쿠터보드를 밀어 스팟 마커에 최대한 가깝게 보낸다. 3) 도착한 위치에 콩주머니를 내려놓고 역할을 교대하며, 모든 선수가 2번씩 탄 뒤 스팟 마커에 더 가까운 콩주머니 개수만큼 점수를 얻는다.</p>
