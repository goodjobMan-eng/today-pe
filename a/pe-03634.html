<h1>플레이스쿠프 배구형 경기</h1>
<p>1) 양 팀이 3-3-3 지그재그 대형으로 선 뒤 서브 순서를 정한다. 2) 서브된 공을 스쿠프로 받아 동료에게 연결한 뒤 상대 코트로 던져 넘긴다. 3) 공을 잡은 사람은 이동할 수 없으며 그 자리에 서서 패스하거나 던져야 한다. 4) 상대가 공을 받지 못하거나 바닥에 떨어뜨리면 득점하며 득점한 팀에서 계속 서브를 넣는다.</p>
