<h1>깔고 뺏는 접시콘 배틀</h1>
<p>1) 각자 지정된 색깔의 접시콘 더미를 가지고 출발선에 선다. 2) 신호가 울리면 교실 책상 위로 달려가 자신의 접시콘을 책상 위에 깔아놓는다. 3) 동시에 상대방 책상에 깔린 접시콘을 집어 자신의 베이스로 가져온다. 4) 제한 시간이 끝났을 때 자신의 콘 홀더에 더 많은 접시콘을 모은 쪽이 승리한다.</p>
