<h1>셔틀콕 옮기기</h1>
<p>1) 출발점과 도착점을 정하고 도착점 끝에 마커를 놓는다.2) 팀별로 셔틀콕을 뽑아 팀을 구성한다.3) 1단계는 손바닥, 2단계는 손등, 3단계는 팔꿈치, 다음 단계는 머리 위에 셔틀콕을 올리고 이동하여 접시콘을 맞춘다.4) 이동 중 떨어뜨리거나 맞추지 못하면 제자리로 돌아가 통과할 때까지 재도전한다.5) 단계별 실패 횟수를 기록하여 총 실패 횟수가 적은 팀이 승리한다.</p>
