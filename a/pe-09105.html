<h1>코너달리기</h1>
<p>1) 체육관이나 운동장의 네 모퉁이에 각각 다른 색깔의 구역을 정한다. 2) 모든 플레이어에게 네 모퉁이 중 하나의 색깔이 적힌 큣션이나 카드를 나누어 준다. 3) 플레이어들은 필드를 자유롭게 움직이다가 다른 플레이어를 만나면 가지고 있는 카드를 서로 교환한다.</p>
