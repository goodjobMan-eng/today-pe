<h1>배구 끝말잇기</h1>
<p>1) 비닐봉지를 부풀려 묶은 뒤 공 대신 사용한다. 2) 두 사람이 끝말잇기를 하면서 배구처럼 비닐봉지를 서로 쳐서 주고받는다. 3) 랠리가 이어질 수 있도록 상대방이 받아치기 쉬운 곳으로 친다. 4) 단어를 생각하는 사이에 비닐봉지가 바닥에 떨어지거나 끝말잇기를 잇지 못하면 패배한다.</p>
