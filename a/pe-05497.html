<h1>원 공 주고 상대 뒤로 돌아 받기 패스</h1>
<p>1) 원 형태로 서서 바깥쪽에 있는 사람이 다른 사람에게 패스한다.2) 공을 보낸 사람은 옆 사람의 뒤쪽으로 돌아 이동한다.3) 사람과 사람 사이 공간으로 이동하며 공이 도착하기 전에 움직여서 다시 받는다.</p>
