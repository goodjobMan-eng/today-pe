<h1>원반던지기 하프턴 기초 동작 연습</h1>
<p>1) 원반 없이 투사 방향을 바라보고 디딤발을 앞으로 둔다. 2) 축 발 쪽 엉덩이를 던지는 방향으로 밀며 비틀기를 만든다. 3) 반대쪽 다리를 접어 180도 회전시켜 파워 포지션 자세를 잡는다. 4) 동작이 익숙해지면 원반을 쥐고 원심력을 느끼며 던진다.</p>
