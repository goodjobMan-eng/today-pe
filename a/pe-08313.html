<h1>콘 지그재그 인사이드 드리블 훈련</h1>
<p>1) 지그재그 형태로 놓인 콘 코스를 향해 차례로 드리블하여 출발한다. 2) 콘에 등을 지듯이 서며 발 안쪽(인사이드)을 이용해 부드럽고 작게 턴한다. 3) 콘 코스를 통과한 뒤에는 콘 사이 중앙 주로를 통해 최고 속도로 드리블하여 출발선으로 복귀한다.</p>
