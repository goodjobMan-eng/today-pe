<h1>주사위 달리기</h1>
<p>1) 1부터 6까지 번호가 적힌 콘을 순서대로 일렬로 세우고 1대 1 대결 대진을 정한다. 2) 출발선에서 양 팀 주자가 동시에 주사위를 던진다. 3) 주사위를 던져 나온 숫자에 해당하는 번호의 콘을 돌아 출발선으로 먼저 돌아온다. 4) 각 라운드 승패를 집계하여 더 많이 승리한 팀이 최종 승리한다.</p>
