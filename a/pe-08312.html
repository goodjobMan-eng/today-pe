<h1>배구 기초 토스와 언더패스 연습</h1>
<p>1) 양손으로 삼각형 모양을 만들어 이마 위에서 손목과 무릎 반동을 이용해 벽에 토스하거나 위로 띄우는 수직 토스를 연습한다. 2) 두 손을 포개어 팔을 펴고 상체를 약 45도 숙인 기본자세에서 무릎 반동을 이용해 벽을 향해 언더패스를 연습한다. 3) 혼자 선 채로 팔과 다리를 동시에 움직여 위로 띄우는 수직 언더패스를 연습하거나 짝과 공을 주고받는다.</p>
