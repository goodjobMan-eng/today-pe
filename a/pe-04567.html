<h1>모아뛰기(가까예우피기)</h1>
<p>1) 로이터판을 양으로 두 발을 강하게 밟는다. 2) 손을 최대한 뜀박스 안쪽에 짚고 팔로 체를 지탱하면서 최대한 허리를 높게 든다. 3) 뜀박스를 밀어내며(つきはなし) 몸을 일으켜 세운다. 4) 착지할 때 반사이(만세) 자세를 한다.</p>
