<h1>제이크 더 헝그리 스네이크(Jake The Hungry Snake)</h1>
<p>1) 교사가 긴 줄넘기(제이크)를 바닥에 대고 둥글게 돌리면 둘러선 학생들은 발에 닿지 않게 점프한다. 2) 카드를 뒤집어 나온 음식 이름을 부르고 줄을 돌리며, 줄에 발이 닿은 학생은 카드에 적힌 운동을 수행해 칼로리를 소모한 뒤 다시 합류한다. 3) 6개 모둠으로 카드를 나누어 건강한 음식과 건강하지 않은 음식으로 분류하고 평가지를 작성해 발표한다.</p>
