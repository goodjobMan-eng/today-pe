<h1>솥뚜껑과 바가지</h1>
<p>1) 짝과 주먹탑을 번갈아 쌓는다. 2) 교사가 '위'라고 말하면 맨 아래 주먹만 위로, '아래'라고 말하면 맨 위 주먹만 아래로 옮긴다. 3) 교사가 '솥뚜껑'이라고 말하면 아래에 있는 나와 상대의 두 손 중에서 먼저 위쪽 주먹을 덮으면 승리한다. 4) 교사가 '바가지'라고 말하면 위에 있는 나와 상대의 두 손 중에서 먼저 맨 아래 주먹을 받히면 승리한다.</p>
