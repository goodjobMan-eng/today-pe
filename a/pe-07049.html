<h1>육상 3종 홈 챌린지 (달리기·뛰기·던지기)</h1>
<p>1) 제자리에서 상체와 무릎 드라이브를 유지하며 20초간 빠르게 전력 질주한다. 2) 제자리에서 두 발을 모으고 팔 반동을 이용해 최대한 멀리 제자리멀리뛰기를 한다. 3) 옆으로 선 자세에서 몸통 회전을 이용해 공(또는 양말공, 종이비행기)을 멀리 던진다. 4) 각 종목별로 시간 또는 거리를 측정하여 기록을 공유한다.</p>
