<h1>왕좌 탈환 캐슬 피구</h1>
<p>1) 양 팀 진영에 매트로 해자와 탑, 기둥을 만들고 기둥 위에 공을 얹은 뒤 기사 1명은 상대 진영에 배치한다. 2) 1단계로 상대 탑에 폼볼 3개 넣기, 2단계로 기둥 위의 공 2개 맞혀 떨어뜨리기를 순서대로 달성한다. 3) 최종 3단계에서 상대 진영 의자(왕좌)에 앉은 아군 기사가 던져준 공을 완벽히 캐치하면 승리한다. 4) 피구 규칙을 병행하여 공에 맞은 선수를 감옥으로 보내고 감옥에서 공을 캐치하면 부활하도록 진행한다.</p>
