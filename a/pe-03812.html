<h1>길거리 계산기 점프 챌린지</h1>
<p>1) 분필로 바닥에 계산기 숫자(0~9)와 연산 기호, ON 버튼을 그린다. 2) ON 버튼에 양발로 뛰어 착지하여 계산기를 켠다. 3) 수학 연산 문제의 숫자와 연산 기호, 등호(=)를 순서대로 점프하여 밟는다. 4) 마지막 계산 결과에 해당하는 숫자를 점프하여 정답을 완성한다.</p>
