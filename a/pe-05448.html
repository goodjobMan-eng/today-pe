<h1>활동이 많은 순환 패스 연습</h1>
<p>1) 마주 보고 서서 제자리 패스를 하지 않고 공을 패스한 직후 반대편 줄 맨 뒤로 뛰어가 선다.2) 양쪽 줄에 서 있는 인원이 적거나 홀수여도 패스 후 즉시 반대쪽으로 이동한다.3) 맨 끝에 도착하면 계속해서 순환하며 여러 명의 친구들과 번갈아 공을 주고받는다.</p>
