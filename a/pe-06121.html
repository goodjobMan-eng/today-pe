<h1>배드민턴 서브 연습 활동</h1>
<p>1) 경기장 코트 바닥에 종이 테이프로 1점 득점 구역을 표시한다.2) 4명씩 2개 모둠으로 나누고 각 모둠에서 참여 순서를 정한다.3) 서브 구역에서 대각선 코트 방향으로 포핸드 또는 백핸드 서브를 넣는다.4) 셔틀콕이 득점 구역에 들어가면 1점을 얻으며, 차례대로 3회씩 서브 후 교대하여 합산 점수가 높은 팀이 이긴다.</p>
