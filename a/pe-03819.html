<h1>위치 이즈 퍼니어 브레인 브레이크 워크아웃</h1>
<p>1) 화면에 제시되는 두 가지 재미있는 동물 클립 영상 중 더 재미있는 쪽을 10초 동안 선택한다. 2) 슬라이드가 전환되면 선택한 영상 아래에 나타난 지정 운동 종목을 확인한다. 3) 화면 속 강사의 동작을 보며 30초 동안 해당 체조 운동을 따라 수행한다. 4) 총 8라운드 동안 서로 다른 동작을 수행하며 준비운동을 완료한다.</p>
