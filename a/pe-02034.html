<h1>뜀틀 기본 기능 익히기</h1>
<p>1) 발구르기: 빠르게 달려와 두 발로 구름판을 힘껏 굴러 뜀틀 위에 섭니다. 2) 걸터앉기: 구름판을 밟고 두 손으로 뜀틀을 짚으며 다리를 벌려 뜀틀 위에 걸터앉습니다. 3) 다리 벌려 넘기: 3~5걸음 뒤에서 달려와 두 발로 구름판을 밟고 두 손으로 뜀틀의 2/3 지점을 짚은 뒤, 다리를 벌려 뛰어넘고 무릎을 살짝 구부려 착지합니다.</p>
