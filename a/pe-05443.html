<h1>가위바위보 공격방어 2</h1>
<p>1) 신문지 막대기와 컵(또는 필통)을 책상 위에 준비하고 마주 본다.2) 가위바위보를 하여 이긴 사람은 신문지 막대로 상대 앞의 컵을 공격하고 진 사람은 자기 컵을 방어한다.3) 가위바위보 결과에 따라 먼저 공격이나 방어를 성공한 사람이 승리한다.</p>
