<h1>농구 드리블 기초 연습 (원드리블 캐치, 연속 드리블, 이동 드리블)</h1>
<p>1) 양足を 넓게 벌리고 무릎을 굽힌 파워 스탠스 자세를 잡고 드리블 연습을 한다. 2) 메뉴 1은 1회 드리블 후 두 손으로 공을 잡는 원드리블+캐치를 10회 연습한다. 3) 메뉴 2는 멈춰 서서 한 손으로 연속 드리블 10회를 오른손과 왼손 번갈아 연습한다. 4) 메뉴 3은 청색 선 사이를 오가며 오른손과 왼손으로 각각 걸어가면서 드리블을 연습한다.</p>
