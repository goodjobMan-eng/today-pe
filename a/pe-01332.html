<h1>노 드리블 농구 패스 게임</h1>
<p>1) 농구 코트 절반 크기의 사각형 구역을 콘으로 지정하고 두 팀으로 나누어 조끼를 착용한다. 2) 공격 팀은 드리블 없이 오직 패스로만 공을 주고받으며 수비 팀은 공중에 뜬 공을 가로챈다. 3) 패스 성공마다 1점씩 누적해 외치며 정해진 목표 횟수(예: 20회)에 먼저 도달한 팀이 승리한다. 4) 팀원 전원이 공을 터치해야 1점을 얻거나 양 팀 누적 패스 31회째를 선점하는 방식으로 변형한다.</p>
