<h1>훌라 헛 챌린지</h1>
<p>1) 5명 이하의 모둠을 구성하고 훌라후프 6개를 이용해 바닥 1개, 벽 2개, 문 2개, 지붕 1개 구조의 훌라 헛을 짓는다. 2) 한 명이 중앙에 앉은 상태에서 주변에 훌라 헛을 짓는 2단계를 수행한 뒤 조심스럽게 해체하고 다시 짓는다. 3) 팀원 전체가 훌라 헛을 통과해 기어가거나 크랩 워크 자세로 통과하는 미션을 수행한다. 4) 훌라 헛을 통째로 들어 5피트 떨어진 콘 위치로 쓰러뜨리지 않고 이동하여 내려놓는다.</p>
