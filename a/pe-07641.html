<h1>참새와 까마귀 (달리기 술래잡기)</h1>
<p>1) 학생들을 두 팀(참새 팀, 까마귀 팀)으로 나누어 중앙선을 사이에 두고 마주 보고 선다 2) 교사가 부른 팀이 술래가 되어 직진으로 쫓아가고 반대 팀은 자신의 엔드라인을 향해 도망친다 3) 엔드라인에 도달하기 전에 태그당하면 술래 팀이 점수를 얻고 무사히 도망치면 도망친 팀이 점수를 얻는다 4) 여러 라운드 진행 후 누적 점수가 더 많은 팀이 승리한다</p>
