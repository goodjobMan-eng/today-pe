<h1>레프러콘 요가와 마음챙김 스트레칭</h1>
<p>1) 화면 속 레프러콘 캐릭터의 요가 자세를 보고 제자리에서 준비한다. 2) 타이머 30초 동안 깊은 호흡을 유지하며 서서 옆구리 늘리기, 나무 자세, 앉아 다리 펴기 등 요가 동작을 따라 한다. 3) 안내 신호에 맞춰 반대쪽으로 자세를 전환하며 신체의 좌우 균형을 맞춘다. 4) 마지막 엎드려 허리 펴기(코브라) 자세까지 수행하며 긴장을 풀고 마음을 차분히 정리한다.</p>
