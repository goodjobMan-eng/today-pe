<h1>다리와 강 놀이 (푸엔테스 이 리오스)</h1>
<p>1) 참가자들을 경기장에 분산 배치하고 한쪽은 다리 역할, 다른 쪽은 강 역할로 정한다 2) 음악이 흐르는 동안에는 모두 자유롭게 경기장을 돌아다닌다 3) 음악이 멈추고 다리가 호명되면 다리 팀은 손과 발을 땅에 대고 엉덩이를 든 자세를 취하며, 강 팀은 음악이 멈춘 동안 최대한 많은 다리 밑을 통과한다 4) 음악이 다시 흐르다 멈추고 강이 호명되면 강 팀은 바닥에 엎드리고, 다리 팀은 최대한 많은 강을 뛰어넘는다</p>
