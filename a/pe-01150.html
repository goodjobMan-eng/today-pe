<h1>스타와 팬 가위바위보 기차놀이</h1>
<p>1) 전원이 자유롭게 이동하다가 둘씩 짝을 지어 마주보고 서서 각자 자기소개로 이름을 확인한다. 2) 마주 본 두 사람이 가위바위보를 진행하여 승자는 '스타', 패자는 승자의 '팬'이 된다. 3) 팬은 스타의 뒤에 손을 얹고 기차처럼 붙어 서서 스타의 이름을 큰 소리로 외치며 열렬히 응원한다. 4) 스타끼리 만나 대결을 반복하며 진 스타와 그 팬 전체가 이긴 스타 뒤로 합류하고, 최종 2팀의 대결로 마지막 승자 스타를 탄생시킨다.</p>
