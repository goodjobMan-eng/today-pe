<h1>4가지 농구 게임</h1>
<p>1) 첫 번째 게임에서는 9개 지점을 순서대로 돌며 슛을 넣어 한 바퀴를 돕니다. 2) 두 번째 게임(카오)에서는 앞 주자가 실패하고 뒷 주자가 먼저 넣으면 앞 주자가 탈락합니다. 3) 세 번째 게임에서는 3대 3으로 공격 전 체크 패스를 주고받은 뒤 득점을 노립니다. 4) 네 번째 게임(21)에서는 자유투(2점)와 리바운드 후 슛(1점)으로 정확히 21점을 먼저 만듭니다.</p>
