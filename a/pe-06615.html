<h1>코어 근력 강화 요가와 힐링 챌린지</h1>
<p>1) 관절 스트레칭으로 몸을 풀고 쪼그려 앉아 한 발 잡기 3초 유지와 V자세 5초 버티기로 코어 근력을 다진다. 2) 짝과 마주 보고 서서 가위바위보를 해 이기면 앞발을 붙이고 진 사람은 다리를 벌리는 2인 다리 당기기 챌린지를 한다. 3) 전사 2·3번 자세와 아기 자세, 송장 자세의 올바른 정렬을 익힌 후 모둠별로 3분 감각에 맞춰 자세를 유지하는 힐링 타임어택을 한다.</p>
