<h1>접시콘 볼 회수 릴레이</h1>
<p>1) 출발선 앞에 일정한 간격으로 놓인 접시콘 위에 공을 하나씩 올려 둡니다. 2) 팀의 첫 번째 주자는 신호가 울리면 앞으로 달려가 접시콘 위의 공을 하나 집어 출발선으로 돌아옵니다. 3) 다음 주자에게 터치하면 다음 주자도 달려가 남아 있는 접시콘의 공을 하나씩 회수해 옵니다. 4) 모든 공을 먼저 회수하여 팀원 전원이 출발선에 정렬하는 팀이 승리합니다.</p>
