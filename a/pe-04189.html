<h1>벽 응시 몰래 다가가기 태그 놀이</h1>
<p>1) 체육관에 약 20피트 간격으로 출발선과 도착선을 두고 여러 줄로 선다. 2) 첫 번째 주자는 도착선으로 걸어가 벽의 한 지점을 응시하며 뒤돌아보지 않고 선다. 3) 두 번째 주자가 조용히 다가가 첫 번째 주자의 어깨나 등을 가볍게 친다. 4) 터치당한 첫 번째 주자는 즉시 뒤돌아 두 번째 주자를 출발선까지 쫓아가 태그를 시도하고, 끝나면 다른 줄 맨 뒤로 이동한다.</p>
