<h1>토끼와 사냥꾼 놀이</h1>
<p>1) 참가자 전체가 원을 만들어 차렷 자세를 취한 뒤 양옆 사람과 손을 잡아 울타리를 만듭니다. 2) 토끼와 사냥꾼 역할을 각각 선정합니다. 3) 울타리 역할을 하는 사람들은 손을 들어 문을 열어주거나 손을 내려 문을 닫습니다. 4) 토끼는 문을 열어 안팎으로 피신하게 돕고 사냥꾼은 문을 닫아 막으면서 토끼를 잡도록 진행합니다.</p>
