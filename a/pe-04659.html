<h1>버디의 눈싸움 피구 게임</h1>
<p>1) 코트 중앙선을 기준으로 두 팀으로 나뉘고 매트로 눈 요새를 설치한다. 2) 소프트볼(눈뭉치)을 상대 코트로 던져 상대를 맞히거나 상대의 공을 막는다. 3) 날아오는 공에 맞으면 그 자리에 앉고, 팀원이 공을 가져다주면 다시 일어난다. 4) 상대가 던진 공을 직접 잡으면 상대가 아웃되어 자리에 앉는다.</p>
