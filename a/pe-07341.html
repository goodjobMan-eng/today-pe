<h1>매달리기 구조물 술래잡기 놀이</h1>
<p>1) 유아들에게 조끼를 입히고 구조물에 조끼 색상과 같은 색의 스카프를 표시한다. 2) 자기 팀 색깔의 구조물로 이동해 매달리는 활동을 한다. 3) 교사가 신호를 울리면 아이들은 매달리며 두 번째 신호에는 움직임을 멈춘다. 4) 고양이 역할을 추가해 신호가 울리면 쥐들을 잡으려 하고 쥐는 빠르게 매달려 피한다.</p>
