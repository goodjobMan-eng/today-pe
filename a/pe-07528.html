<h1>늑목과 긴의자를 활용한 오르기와 미끄럼 타기</h1>
<p>1) 늑목(벽면 사다리)에 긴의자(평행 벤치)를 비스듬히 걸쳐 다양한 경사로를 설치한다. 2) 엎드린 자세로 배를 대고 미끄러져 내려오며 손이나 발로 의자를 조여 속도를 조절한다. 3) 경사로를 걸어 내려올 때는 경사면에서 평지로 이어지는 전환 구간에 유의하며 중심을 잡는다. 4) 긴의자 아래쪽을 잡고 매달려 거꾸로 기어오르는 고난도 오르기를 수행한다.</p>
