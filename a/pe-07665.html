<h1>팩맨 술래잡기</h1>
<p>1) 팀조끼를 입은 유령 팀과 팩맨 팀의 두 팀으로 나뉜다. 2) 시작 신호가 울리면 모든 참여자는 경기장 바닥의 선 밖으로 벗어나지 않고 선 위로만 달린다. 3) 유령에게 태그된 팩맨은 중앙 원에 있는 감옥으로 이동하며, 다른 팩맨이 터치해 주면 탈출할 수 있다. 4) 10분 제한 시간 동안 유령이 모든 팩맨을 잡으면 유령 팀이 승리하고, 1명이라도 살아남으면 팩맨 팀이 승리한다.</p>
