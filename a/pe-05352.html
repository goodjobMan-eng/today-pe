<h1>역피라미드 버킷 챌린지</h1>
<p>1) 바닥에 양동이 2개를 놓고 그 위에 3개, 4개 순으로 점차 개수를 늘려가며 역삼각형 모양으로 쌓아 올린다.2) 각 팀에는 양동이를 고정할 수 있는 테이프 2피트(약 60cm)가 주어진다.3) 2분의 제한 시간 동안 무너지지 않게 최대한 높은 단수까지 쌓는다.</p>
