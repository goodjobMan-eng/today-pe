<h1>플라잉 디스크 퍼팅 연습</h1>
<p>1) 디스크 글씨가 있는 윗면에 엄지를 얹고 검지는 옆면, 나머지 세 손가락은 아랫면을 받쳐 잡는다. 2) 옆으로 서서 다리를 어깨너비로 벌리고 손은 어깨높이에서 유지한다. 3) 콘 위치에 서서 디스캐처를 향해 하나, 둘, 셋 구령에 맞춰 팔을 뻗으며 퍼팅한다. 4) 근거리에서 디스캐처 바스켓 안으로 정확하게 넣는 연습을 10회씩 반복한다.</p>
