<h1>홈런 농구 게임</h1>
<p>1) 공격 팀은 코너에, 수비 팀은 프리드로우 라인에 각자 농구공을 들고 선다. 2) 신호가 울리면 공격 팀 주자는 하프코트를 드리블로 질주해 돌아오고, 수비 팀은 프리드로우 슛을 차례로 던진다. 3) 공격 팀이 모두 완주하기 전에 수비 팀이 전원 득점하면 수비가 이기고, 수비가 모두 성공하기 전에 공격 팀이 들어온 인원수만큼 득점을 얻는다.</p>
