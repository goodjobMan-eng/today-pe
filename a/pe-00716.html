<h1>저학년 물놀이 (물 적응·잠수·보물찾기)</h1>
<p>1) 물에 적응하기 위해 물 뿌리기와 동물 흉내내기 등 친숙한 놀이로 물에 대한 불안감을 줄입니다. 2) 친구들과 손을 잡고 물속에 함께 잠수하거나 다리 터널을 통과하는 놀이를 진행합니다. 3) 물속에서 눈을 뜨고 가위바위보를 하거나 숨을 참는 호흡 연습을 반복합니다. 4) 바닥에 가라앉은 다양한 물건이나 링을 찾는 보물찾기 활동을 모둠 대항전으로 진행합니다.</p>
