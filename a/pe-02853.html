<h1>패드민턴 이어 달리기</h1>
<p>1) 책상 등을 옮겨 교실에 활동 공간을 만들고 라바콘 등으로 출발점과 반환점을 만듭니다. 2) 셔틀콕이 바닥에 떨어지거나 천장에 닿지 않게 패드민턴 채로 치면서 이동하는 연습을 합니다. 3) 셔틀콕이 바닥에 떨어지거나 천장에 닿으면 스타 점프 3번 등 미션을 한 후 다시 출발합니다. 4) 반환점을 돌아오면 다음 주자가 출발하는 릴레이 방식으로 대결합니다.</p>
