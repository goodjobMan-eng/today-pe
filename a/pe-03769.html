<h1>매트 놀이 데굴데굴 랜드</h1>
<p>1) 체육관 중앙에 매트를 서로 틈이 생기지 않도록 붙여서 길게 연결합니다. 2) 연결된 매트 위에서 여러 가지 구르기 방법을 발명하며 굴러 이동합니다. 3) 친구와 부딪히지 않도록 주의하며 자유롭게 매트 길을 돌아봅니다. 4) 혼잡한 구역이 생기면 순환형 코스나 좁은 매트 코스를 추가하여 공간 배치를 다양하게 바꿉니다.</p>
