<h1>콩주머니 던지기 놀이</h1>
<p>1) 반을 두 편으로 나누고 각 편에서 던질 순서를 정해 선 뒤에 순서대로 선다. 2) 신호에 따라 맨 앞사람은 콩주머니를 들고 한 발로 균형을 잡고 선다. 3) 한 발로 균형을 유지하며 선 앞까지 이동한 후, 손에 든 콩주머니를 삼각콘을 향해 던진다. 4) 콩주머니가 훌라후프 안에 들어가면 1점을 얻고, 점수가 더 높은 편이 이긴다.</p>
