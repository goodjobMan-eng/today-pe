<h1>캥거루 술래</h1>
<p>1) 술래는 점프(점핑) 동작으로만 이동하며 다른 친구들을 잡으러 다닙니다.2) 플레이스틱(도구)이나 술래의 몸에 닿아 태그된 친구는 경기장 밖으로 나갑니다.3) 경기장 밖에 마련된 원마커(재충전소)를 4번 밟는 미션을 수행한 후 다시 게임에 복귀합니다.</p>
