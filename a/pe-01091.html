<h1>집콕 99초 순환 도전 미션</h1>
<p>1) 긴 책상에 종이컵 피라미드와 탁구공, 풍선, 비행기 등 미션 교구를 코스별로 순서대로 배치한다. 2) 타이머를 누른 뒤 무릎 대고 푸시업 7회, 스쿼트 7회, 휴지 2장 저글링을 연속 수행한다. 3) 풍선으로 종이컵 옮기기, 병뚜껑 튕기기, 컵 플립, 탁구공 잡기·바운드 넣기, 비행기로 컵 맞히기를 차례로 통과해 완주 시간을 측정한다. 4) 모둠별 릴레이 대항전이나 미션 난이도를 조절하여 99초 이내 단축 기록에 도전한다.</p>
