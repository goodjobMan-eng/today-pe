<h1>필라테스 링 허벅지 조이기 및 브릿지 운동</h1>
<p>1) 바닥에 누워 양 무릎을 세우고 양발을 골반 너비보다 약간 넓게 벌린다. 2) 필라테스 링을 무릎 안쪽에 끼우고 양손은 엉덩이 옆 바닥에 둔다. 3) 숨을 내쉬며 허벅지 안쪽 힘으로 링을 조이고 엉덩이를 천천히 들어 올려 버틴다. 4) 엉덩이를 내렸다가 다시 들어 올리는 동작을 10회 반복한다.</p>
