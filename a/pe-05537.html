<h1>후프에 쏙 빙고 게임</h1>
<p>1) 바닥에 훌라후프를 3x3 빙고판 모양으로 배치한다.2) 라켓으로 솜공을 쳐서 후프 안에 솜공이 처음 떨어진 자리에 공을 그대로 둔다.3) 주자는 한 바퀴 돌아와 다음 주자에게 라켓을 넘겨주며, 3칸 빙고를 먼저 완성한 팀이 승리한다.</p>
