<h1>무릎·발끝 터치 및 풋 플랜트 (주장 없이 번호 나누기)</h1>
<p>1) 두 명씩 마주 보고 악수 그립을 잡은 뒤 신호에 맞춰 상대방 무릎을 먼저 터치한다. 2) 다음으로 발을 움직여 상대방의 발끝(발가락)을 먼저 터치한다. 3) 양 발을 바닥에 고정하고 손을 맞잡은 상태에서 상대방의 발을 먼저 움직이게 만든다. 4) 각 대결에서 먼저 성공한 사람이 1번, 진 사람이 2번을 맡아 팀을 나눈다.</p>
