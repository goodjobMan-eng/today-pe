<h1>벤치 피구</h1>
<p>1) 중앙선을 기준으로 양 팀 진영을 나누고, 각 진영 뒤편에 벤치를 배치한다. 2) 상대 공에 맞은 사람은 머리에 손을 올리고 상대 진영 뒤편 벤치(감옥)로 이동한다. 3) 같은 팀원이 던져준 공을 벤치 위에서 두 발을 디딘 채 노바운드로 잡으면 감옥에서 탈출한다. 4) 벤치 앞 수비수는 상대 팀이 벤치로 던지는 공을 가로채거나 쳐내어 탈출을 방지할 수 있다.</p>
