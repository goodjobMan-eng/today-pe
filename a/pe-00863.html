<h1>할로윈 런 장애물 회피 운동</h1>
<p>1) 할로윈 밤거리를 달리며 사탕을 모으고 다가오는 장애물을 피합니다. 2) 호박은 펀치, 거미줄은 촙(손날 치기), 빗자루는 점프, 박쥐는 숙이기로 피합니다. 3) 유령이 나타나면 즉시 움직임을 멈추고 얼음 자세를 유지해야 합니다. 4) 날아오는 해골과 불꽃을 좌우 킥과 회피로 피하며 총 3단계를 완주합니다.</p>
