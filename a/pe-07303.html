<h1>신체 타악 반응 콘 잡기 놀이</h1>
<p>1) 교사가 제시하는 신체 타악 리듬이나 번호별 동작을 반복하여 수행한다. 2) 교사가 신호 명령을 외치기 전까지 집중하여 동작을 이어간다. 3) 신호가 떨어지면 가운데에 놓인 콘을 재빨리 집는다. 4) 상대보다 먼저 콘을 잡은 사람이 1점을 얻는다.</p>
