<h1>합체 놀이</h1>
<p>1) 바닥의 원판을 중심으로 학급 전체 친구들이 둥글게 둘러선다. 2) 술래 2명을 정해 가운데 원판으로 들어오게 한다. 3) 술래 둘이 가위바위보를 하여 상체 술래와 하체 술래를 정한다. 4) 음악이 나오면 각자 맡은 상체와 하체 동작을 표현하고 다른 친구들은 두 동작을 합쳐 따라 한다.</p>
