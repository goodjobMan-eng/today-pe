<h1>경찰과 도둑 콩주머니 탈환 놀이</h1>
<p>1) 두 사람이 짝을 이루어 한 명은 경찰, 다른 한 명은 도둑 역할을 맡고 15~20m 거리를 둔다. 2) 경찰은 콩주머니(금괴) 앞에 등돌려 서 있고, 도둑은 경찰이 등돌린 순간 몰래 다가간다. 3) 경찰이 뒤를 돌아보면 도둑은 즉시 제자리에 멈춰 서야 한다. 4) 도둑은 콩주머니를 집어 안전선 너머로 달아나야 하며, 선을 넘기 전에 경찰에게 태그되면 체포된다.</p>
