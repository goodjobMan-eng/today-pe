<h1>스타워즈 우주선 공 던지기</h1>
<p>1) 체육관을 중앙선과 콘으로 4개 구역(영역)으로 나누고 각 팀의 우주선(매트)을 설치한다. 2) 학생들은 공을 양발 사이에 끼운 채 시작 신호를 기다린다. 3) 신호가 울리면 자기 영역 안에 머물며 상대 팀 우주선 안으로 폼볼과 털실공을 던져 넣는다. 4) 수비 시 날아오는 공을 막을 수 있으나 우주선이 쓰러지면 1점 감점되며, 공이 가장 적게 들어간 팀이 득점한다.</p>
