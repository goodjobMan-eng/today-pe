<h1>빌더와 불도저</h1>
<p>1) 준비단계에서 학생들은 활동 전 안정시 심박수를 확인한다. 2) 빌더 역할은 바닥에 쓰러진 콘을 세우고, 불도저 역할은 세워진 콘을 넘어뜨린다. 3) 정해진 시간 동안 활동을 마친 뒤 심박수를 재고 변화를 확인한다. 4) 두 팀으로 나누어 콘을 세우는 팀과 넘어뜨리는 팀이 겨룬다.</p>
