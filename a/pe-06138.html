<h1>공 배달하기 게임</h1>
<p>1) 네 모둠으로 나누고 정사각형 경기장 꼭지점에 공을 넣은 바구니를 둔다.2) 경기장 안에 십자가로 이동 금지선을 표시한다.3) 시작 신호가 울리면 상대 모둠 바구니로 달려가 손으로 공을 튀기며 이동 금지선까지 온다.4) 이동 금지선에서는 공을 튀겨 건너가지 못하므로 모둠원에게 공을 이어준다.5) 공을 이어받은 모둠원은 다시 공을 튀겨 자기 모둠 바구니에 넣고, 정해진 시간 후 공이 많은 모둠이 이긴다.</p>
