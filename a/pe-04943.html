<h1>초보자 축구 교실: 제자리 볼 터치와 드리블 기초</h1>
<p>1) 공이 움직이지 않도록 발바닥으로 부드럽게 공 위를 번갈아 터치한다.2) 양발 안쪽(인사이드)만을 사용하여 공을 좌우로 리듬감 있게 통통 치며 다룬다.3) 한쪽 발바닥으로 공을 몸쪽으로 당긴 뒤 같은 발 인사이드로 반대 방향으로 밀어내며 V자 형태로 공을 조작한다.4) 발을 바꿔 반대쪽 발로도 발바닥 당기기와 인사이드 밀어내기를 반복 연습한다.</p>
