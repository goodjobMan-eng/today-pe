<h1>동물 흉내 내기 체조</h1>
<p>1) 토끼처럼 제자리에서 껑충 뛴다. 2) 나비처럼 팔을 움직이며 날아다닌다. 3) 곰처럼 네발로 기어 간다. 4) 캥거루처럼 멀리 점프한다. 5) 개구리처럼 쪼그려 앉아 뛴다. 6) 플라밍고처럼 한 발로 서서 균형을 잡는다. 7) 악어처럼 엎드려 기어간다. 8) 표범처럼 빠르게 달린다.</p>
