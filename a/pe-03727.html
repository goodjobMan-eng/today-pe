<h1>신호 반응 출발 달리기와 고양이 쥐 게임</h1>
<p>1) 짝과 엎드리거나 마주 보고 앉아 대기하다가 촉각(등 터치)·시각(손 내림)·청각(박수 소리) 신호가 발생하면 빠르게 일어난다. 2) '고양이와 쥐'로 편을 나누어 엎드려 대기한다. 3) 진행자가 '고양이' 또는 '쥐'를 호명하면 지목된 팀은 도망치고 상대 팀은 일어나 쫓아가 태그한다. 4) 도망치는 쪽이 결승선을 먼저 통과하면 점수를 얻거나 생존한다.</p>
