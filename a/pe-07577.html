<h1>토르페도(어뢰) 놀이</h1>
<p>1) 참가자들은 일렬로 앞사람 뒤에 줄을 서며, 맨 뒤의 한 사람만 눈을 뜨고 앞의 모든 사람은 눈을 감는다. 2) 맨 뒤의 안내자가 상대 어뢰(팀)의 방향을 파악하고 전진할 방향을 안내한다. 3) 안내자가 발사(disparo)를 외치면 맨 앞의 사람이 앞으로 나가 상대 팀원을 터치하며, 터치당한 사람은 탈락한다. 4) 모든 상대 팀원을 먼저 탈락시키는 어뢰 팀이 승리한다.</p>
