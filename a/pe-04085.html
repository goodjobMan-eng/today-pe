<h1>체인지 업</h1>
<p>1) 교실 공간을 자유롭게 이동하며 교사의 신호에 맞춰 동작한다. 2) 갤럽(Gallop) 신호에는 이동하고 프리즈(Freeze) 신호에는 멈춘다. 3) 규칙을 반대로 바꾸어 프리즈 신호에 갤럽을 하고 갤럽 신호에 멈춘다. 4) 우(Woo)와 트위스트(Twist), 점프(Jump)와 사이드 슬라이드(Side Slide) 동작을 추가하고 서로 반대로 수행한다.</p>
