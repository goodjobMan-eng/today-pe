<h1>수건을 활용한 슈퍼맨 코어 트레이닝 놀이</h1>
<p>1) 매트 위에 수건 2장을 나란히 깔고 어린이는 엎드려 눕는다 2) 보조자는 어린이의 겨드랑이 밑과 무릎 위에 각각 수건을 통과시킨 뒤 양 끝을 단단히 잡고 위로 들어 올린다 3) 어린이는 몸 전체에 힘을 주어 수평 자세를 유지하고 보조자는 양옆으로 가볍게 흔들어 준다 4) 균형을 5초 이상 안정적으로 유지하면 성공하며 익숙해지면 좌우로 흔드는 폭과 속도를 점차 늘린다</p>
