<h1>라인댄스 상체 릴레이 시장에 가면</h1>
<p>1) 4명 이상의 모둠원이 의자에 바르게 앉아 상체와 팔을 자유롭게 움직일 수 있도록 준비한다. 2) 첫 번째 사람이 '시장에 가면'을 외치며 손뼉 치기, 팔 흔들기 등 상체나 손동작 하나를 수행한다. 3) 두 번째 사람은 앞사람의 동작을 그대로 반복한 후 자신의 새로운 상체 동작을 추가한다. 4) 순서대로 앞사람들의 모든 동작을 누적하여 반복하고 마지막 사람까지 이어가며 한 라운드를 완성한다.</p>
