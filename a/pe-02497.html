<h1>음악과 함께하는 교실 맨손체조</h1>
<p>1) 음악 박자에 맞춰 팔을 왼쪽, 오른쪽으로 1번씩 돌리고 양팔을 2번 돌린다. 2) 같은 방향의 손과 발을 맞대어 오른손-오른발, 왼손-왼발 찍기를 한 후 엇갈려 찍기를 수행한다. 3) 제자리 및 두 발자국 이동하며 스케이트 타듯 옆으로 미끄러지는 스케이트 동작을 진행한다. 4) 손을 머리에 대고 허리를 좌우로 늘려준 뒤, 무릎 올리기와 허벅지 당겨 늘려주기 스트레칭으로 마무리한다.</p>
