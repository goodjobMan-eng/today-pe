<h1>포 코너스 락 페이퍼 시저스</h1>
<p>1) 체육관 네 모퉁이에 플로론으로 구역을 표시하고 학생들이 하키스틱과 퍽을 가지고 각 코너에 나뉘어 선다. 2) 신호와 함께 같은 코너의 상대방과 가위바위보를 한다. 3) 이긴 사람은 퍽을 가지고 다음 코너로 이동하며, 이 과정을 반복해 가장 많은 바퀴를 돈 사람이 승리한다.</p>
