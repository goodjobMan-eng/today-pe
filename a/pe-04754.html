<h1>데굴데굴 이사 대작전</h1>
<p>1) 매트 위에 몸을 펴고 엎드려 첫 번째 주자가 팔찌를 손에 쥔다.2) 몸 전체를 펴서 옆으로 굴러 이동한 뒤 다음 주자에게 손으로 팔찌를 전달한다.3) 팔찌를 받은 다음 주자가 이어서 굴러가며 마지막 팔찌까지 반대편으로 모두 옮긴다.</p>
