<h1>지구력 클럽 줄넘기 챌린지</h1>
<p>1) 각자 자리를 잡고 줄넘기를 준비한 뒤 타이머와 음악에 맞춰 걸리지 않고 계속 줄을 넘는다. 2) 사이드 스윙은 인정되지 않으며 제자리에서 넘어야 한다. 3) 시작 후 15초 이내에 걸리면 1회 재도전 기회가 주어지며 15초 이후 걸리면 즉시 줄을 내려놓고 멈춘다. 4) 걸리지 않고 1분, 2분, 3분을 버티면 해당 시간 클럽의 벽보에 이름을 적는다.</p>
