<h1>발바닥 및 인사이드 볼 터치 연습</h1>
<p>1) 제자리에서 발바닥 앞부분(발가락 쪽)으로 공이 움직이지 않게 번갈아 가며 가볍게 터치한다.2) 제자리에서 볼 터치를 유지하며 공 주변을 천천히 회전한다.3) 발바닥으로 터치하면서 앞뒤나 원하는 방향으로 천천히 이동한다.4) 양발 안쪽(인사이드)으로 공이 발 사이에서 벗어나지 않게 같은 세기로 가볍게 주고받는다.5) 인사이드 터치를 유지하며 제자리 회전 및 전후좌우 이동을 연습한다.</p>
