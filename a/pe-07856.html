<h1>볼링핀 축구 (케겔푸스발)</h1>
<p>1) 각자 콘이나 볼링핀을 하나씩 경기장 둘레에 세워 자기 진영을 정한다. 2) 발로 공을 차서 상대방의 핀을 쓰러뜨리는 동시에 자기 핀을 수비한다. 3) 자신의 핀이 쓰러진 참가자는 경기장 밖으로 탈락하며, 끝까지 남은 사람이 승리한다.</p>
