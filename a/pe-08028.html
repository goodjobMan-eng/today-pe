<h1>초등 핸드볼 기초 훈련 및 슛 연습</h1>
<p>1) 준비운동으로 팀 전원이 달리기와 술래잡기를 한 뒤 오른손 드리블 5회, 몸 주위로 공 돌리기 좌우 각 5회를 실시한다. 2) 2인 1조로 짝을 지어 상대방 가슴 높이로 공을 주고받고 익숙해지면 반대 손으로도 패스한다. 3) 코트에 넓게 퍼져 공간을 활용하며 이동 패스 연습을 진행한다. 4) 골대를 향해 역동적인 점프 슛을 연습하고 전체 코트에서 패스를 연결하여 골을 노린다.</p>
