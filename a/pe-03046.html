<h1>농구 경기 규칙과 경기 방법</h1>
<p>1) 5명이 한 팀이 되어 경기를 진행하며 상대방 영역 골대에 골을 넣어 점수를 얻는다. 2) 공격 팀은 같은 편에게 공을 패스하거나 공을 몰아 드리블하며 상대방 영역으로 이동한다. 3) 공을 들고 세 걸음 이상 드리블 없이 갈 수 없으며, 세 걸음 가기 전에 드리블해야 한다. 4) 일정한 시간 동안 골을 많이 넣는 모둠이 이긴다.</p>
