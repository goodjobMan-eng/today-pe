<h1>앞구르기 연계 숫자를 더해요</h1>
<p>1) 5명이 한 모둠을 이루어 1명은 숫자 카드를 보여주고 나머지 4명은 구르는 순서를 정한 뒤 뒤로 돌아서 준비한다. 2) 출발 신호와 함께 첫 번째 모둠원이 앞구르기로 굴러가며 숫자 카드를 보고 적힌 숫자를 기억한다. 3) 순서대로 모든 모둠원이 앞구르기를 진행한다. 4) 모둠원이 본 숫자를 모두 더해 정답을 외치며, 틀리면 처음부터 다시 진행하여 가장 먼저 정답을 맞힌 모둠이 이긴다.</p>
