<h1>속도 도전 공 모으기 게임</h1>
<p>1) 바닥에 훌라후프를 놓거나 원을 그리고 중앙 구역에 공을 흩어 놓는다. 2) 출발 신호와 함께 양 팀 선수가 전력 질주하여 중앙의 공을 하나씩 가져와 자신의 진영 훌라후프 안에 넣는다. 3) 정해진 시간 동안 더 많은 공을 모은 쪽이 승리한다.</p>
