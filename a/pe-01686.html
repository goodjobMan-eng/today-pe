<h1>슈퍼 마리오 캐릭터 요가 스트레칭</h1>
<p>1) 바닥에 편안하게 앉거나 설 수 있도록 주변 장애물이 없는 개인 공간을 준비합니다. 2) 화면에 등장하는 마리오 캐릭터들의 요가 자세를 보고 똑같이 몸으로 흉내 냅니다. 3) 타이머가 진행되는 동안 몸에 힘을 빼고 깊은 심호흡을 유지하며 바른 정렬로 자세를 버팁니다. 4) &quot;switch to the other side&quot; 신호에 맞춰 반대쪽 방향도 균형 있게 동일한 방법으로 스트레칭합니다.</p>
