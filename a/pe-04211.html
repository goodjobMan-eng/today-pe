<h1>수학 연산 점핑잭 스팟 체인지</h1>
<p>1) 다양한 색상의 원마커 밑에 덧셈이나 뺄셈 연산 문제가 적힌 종이를 미리 숨겨 둔다. 2) 몇 명의 술래를 제외한 모든 학생은 원마커 위에 한 명씩 올라가 자리를 잡는다. 3) 교사가 두 가지 색상을 외치면 해당 색상의 학생들과 술래들은 빈 원마커로 재빨리 이동한다. 4) 자리를 잡은 학생은 원마커 밑의 연산 문제를 확인하여 그 정답 수만큼 점핑잭을 수행한다.</p>
