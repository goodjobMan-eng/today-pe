<h1>사다리 타고 가위바위보 (스텝래더 대결)</h1>
<p>1) 바닥에 일렬로 길게 펼친 스텝래더 양 끝에서 각 팀의 첫 번째 주자가 출발합니다. 2) 스텝래더 칸을 정해진 스텝(점프 또는 잔발)으로 밟으며 앞으로 전진합니다. 3) 양 팀 주자가 중간에서 만나면 멈춰 서서 가위바위보를 하고, 이긴 사람은 계속 전진하며 진 팀은 다음 주자가 즉시 출발해 상대 주자를 막습니다. 4) 상대 팀 진영 끝의 콘에 먼저 도달하는 팀이 점수를 얻습니다.</p>
