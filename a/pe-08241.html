<h1>훌라후프 및 매트를 활용한 구르기·물구나무서기 기초 운동</h1>
<p>1) 훌라후프 안에 발을 딛고 서서 손으로 바닥을 짚으며 훌라후프 둘레를 손으로 걷는다. 2) 벽에 다리를 올리고 물구나무서기를 연습한 뒤 매트 위로 구른다. 3) 매트를 몸 위로 반으로 접어 덮고 웅크린 상태에서 등을 둥글게 말아 앞뒤로 흔들며 일어선다. 4) 매트에 누워 무릎을 가슴으로 모아 안고 등을 둥글게 말아 앞뒤로 구르기를 반복한다.</p>
