<h1>라켓 기초 조작 활동</h1>
<p>1) 악수하듯 라켓을 잡아 V자 형태가 일치하도록 콘티넨탈 그립을 잡는다. 2) 라켓 면에 콩주머니를 올리고 계란을 스크램블하듯 떨어뜨리지 않고 이리저리 움직인다. 3) 손을 뒤집어 백핸드 자세로도 같은 방법으로 콩주머니를 올리고 떨어뜨리지 않게 움직인다. 4) 팬케이크를 뒤집듯 라켓 위의 콩주머니를 위로 살짝 띄웠다 받는 연습을 하고, 이후 띄운 후 라켓을 돌려받는다.</p>
