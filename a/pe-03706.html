<h1>물고기 게임</h1>
<p>1) 물고기 역할을 맡을 사람을 몇 명 정한다. 2) 그물 역할을 맡은 사람들은 손을 잡고 둥글게 원을 만들어 물고기를 둘러싼다. 3) 시작 신호가 울리면 물고기는 그물(손 사이) 아래로 빠져나가려 하고, 그물은 손을 놓지 않고 물고기가 도망가지 못하게 막는다. 4) 제한 시간 안에 물고기 전원이 그물 밖으로 빠져나가면 물고기의 승리, 1명이라도 남아 있으면 그물의 승리다.</p>
