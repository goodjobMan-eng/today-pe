<h1>게이트볼과 슐런의 조합 - 왕퍽(볼) 넣기</h1>
<p>1) 게이트볼 스틱과 볼, 게이트 4개를 준비하고 중앙에 보라색 볼을 배치한다. 2) 양 팀 대표가 가위바위보를 하여 선공과 후공을 결정한다. 3) 팀별 순서에 따라 교대로 번갈아가며 스틱으로 공을 친다. 4) 어느 팀이든 먼저 보라색 볼을 맞혀서 게이트 관문에 넣으면 승리하며 게임이 종료된다.</p>
