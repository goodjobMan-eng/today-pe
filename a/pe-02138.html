<h1>리본으로 춤춰요 리듬체조</h1>
<p>1) 리본 막대를 손에 잡고 음악에 맞춰 준비 자세를 취한다. 2) 팔을 크게 돌리며 동그라미 그리기 동작을 수행한다. 3) 리본을 위아래로 흔들며 물결 그리기와 8자 그리기 동작을 이어간다. 4) 지그재그 그리기, 반원 그리기, 회오리 그리기 동작을 음악의 흐름에 맞춰 연결하여 표현한다.</p>
