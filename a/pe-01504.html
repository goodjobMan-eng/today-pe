<h1>5걸음 그림자 밟기 술래잡기</h1>
<p>1) 콘이나 라인을 활용해 사각형 활동 구역을 표시하고 1명의 술래를 선발한다. 2) 교사의 구호와 박자에 맞춰 모든 학생이 정확히 다섯 걸음만 걸어 안전한 위치로 이동한다. 3) 술래 역시 다섯 걸음만 걸어 도망자에게 접근한 뒤, 도망자의 그림자를 발로 밟아 태그를 시도한다. 4) 그림자가 밟힌 학생이 새로운 술래가 되며, 뛰지 않고 걷기 규칙과 신체 거리 유지를 철저히 지킨다.</p>
