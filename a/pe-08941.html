<h1>스포츠 피구 받기</h1>
<p>1) 양발을 어깨너비로 벌리고 무릎과 팔을 약간 구부린 상태로 앞으로 뻗어준다. 2) 양팔을 90도 아래로 굽혀서 공을 몸으로 안듯이 받는다. 3) 양 손바닥을 삼각형 모양으로 만들고 공을 손바닥 전체와 손가락을 이용하여 받는다.</p>
