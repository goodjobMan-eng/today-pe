<h1>우디의 칠면조 잡기 런 운동</h1>
<p>1) 도망치는 칠면조를 잡기 위해 화면의 안내에 맞춰 제자리에서 달립니다. 2) 화면에 다가오는 낙엽, 통나무 등 장애물에 맞춰 점프하거나 숙이고 주먹을 뻗는 반응 동작을 합니다. 3) 스테이지가 끝나면 칠면조가 숨은 도토리나 사물을 맞히는 관찰 퀴즈에 참여합니다. 4) 칠면조가 도망갈 때는 카우보이 밧줄을 던지는 제스처를 취해 칠면조를 포획합니다.</p>
