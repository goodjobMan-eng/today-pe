<h1>비닐봉지 풍선 리프팅 챌린지</h1>
<p>1) 비닐봉지에 공기를 불어넣고 손잡이를 묶어 공처럼 가벼운 풍선 볼을 만든다 2) 발등을 이용해 비닐봉지를 위로 차올리며 연속으로 몇 회 띄울 수 있는지 도전한다 3) 오른발과 왼발을 번갈아 사용하거나 허벅지·가슴·머리 등 다양한 신체 부위를 활용해 떨어뜨리지 않는다 4) 바닥에 엉덩이를 대고 앉아서 리프팅하기나 1회 킥 후 360도 제자리 회전하고 다시 차올리기로 변형한다</p>
