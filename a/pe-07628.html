<h1>실 끊기 술래잡기 (코르타르 엘 일로)</h1>
<p>1) 술래 1명을 정하고 경기장 안에 모든 학생이 흩어진다. 2) 술래는 특정 한 명의 학생을 지정하여 그 학생만을 계속 쫓는다. 3) 다른 학생이 술래와 도망자 사이를 가로질러 지나가면 '실이 끊어진' 것으로 본다. 4) 실이 끊어지면 술래는 기존 목표를 두고 사이를 가로지른 새 학생을 쫓아야 하며, 잡힌 학생이 다음 술래가 된다.</p>
