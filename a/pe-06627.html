<h1>릴레이 족구</h1>
<p>1) 교실 크기 공간 중앙에 네트(또는 의자)를 설치하여 영역을 구분한다. 2) 네트를 사이에 두고 양쪽에 3명씩 마주 보고 일렬로 선다. 3) 첫 번째 학생이 공을 차서 네트를 넘긴 뒤 줄의 맨 뒤로 이동한다. 4) 맞은편 학생도 공을 받아 네트를 넘기고 줄 맨 뒤로 이동하며 끊기지 않게 릴레이를 이어간다.</p>
