<h1>동물 걸음 걷기 놀이</h1>
<p>1) 반을 둘로 나누고 양쪽 출발선 뒤에 순서대로 선다. 2) 한쪽은 곰처럼 바닥에 두 손을 짚고 무릎을 세워 앞으로 걷는다. 3) 반대쪽은 꽃게처럼 옆으로 서서 집게 손을 움직이며 옆으로 걷는다. 4) 도착선에 닿으면 역할을 바꾸어 순서대로 반대 걸음으로 이동한다.</p>
