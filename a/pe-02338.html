<h1>골대에 공 던지고 잡기 (츄크볼)</h1>
<p>1) 3명씩 두 모둠을 이루어 골라인 밖에 섭니다. 2) 공격수는 공을 드리블하고 모둠원과 3번 패스한 뒤 골대에 공을 던집니다. 3) 골대 그물에 맞고 튕겨 나온 공을 수비수가 잡지 못하면 공격 모둠이 1점을 얻습니다. 4) 골대 그물에 맞고 튕긴 공을 수비수가 잡거나 골대에 맞지 않고 나가면 공수가 바뀝니다.</p>
