<h1>기본 움직임 및 이동 기술 훈련</h1>
<p>1) 원마커를 지그재그로 배치하고 발끝으로 중심을 잡으며 좌우로 홉(hop) 이동한다. 2) 바닥의 훌라후프 안팎으로 4박자(1, 2인 3, 4아웃) 스텝을 빠르게 밟는다. 3) 콘 위에 큰 공을 올리고 한 발로 서서 천천히 숙여 코로 공을 터치한다. 4) 허들을 넘는 사이드 스텝 및 스피닝 후프 점프 등 다양한 이동 드릴을 수행한다.</p>
