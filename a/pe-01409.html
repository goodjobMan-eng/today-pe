<h1>마음 통하는 이심전심 하이파이브와 공 전달 놀이</h1>
<p>1) 전원이 원형으로 서고 짝과 마주 볼 준비를 한다. 2) 구호에 맞춰 양옆 중 한쪽을 돌아보고 시선이 마주친 짝과 하이파이브를 나눈다. 3) 두 사람이 마주 잡은 팔 위에 공을 얹고 떨어뜨리지 않고 옆으로 전달해 원을 완주한다. 4) 원 크기를 키우거나 팀별 릴레이 기록 경쟁으로 난도를 높여 진행한다.</p>
