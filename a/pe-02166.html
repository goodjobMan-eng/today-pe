<h1>옷걸이 양궁 표적 맞추기</h1>
<p>1) 세탁소 옷걸이와 고무줄, 나무젓가락을 활용해 활과 화살을 제작하고 화살촉 끝에 안전장치를 씌운다. 2) 활 앞쪽 링에 화살을 끼우고 고무줄 홈에 걸어 뒤로 팽팽하게 당긴다. 3) 왼팔을 앞으로 곧게 뻗고 화살이 일직선이 되도록 조준한 뒤 시위를 놓아 표적을 맞춘다. 4) 큰 표적 맞추기에서 작은 표적, 최종적으로 종이컵 통 안에 화살 집어넣기로 단계를 높여 도전한다.</p>
