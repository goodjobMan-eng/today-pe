<h1>안팎 원형 패스 풍선 떨어뜨리기 (보물쟁탈전)</h1>
<p>1) 학생들은 안쪽 원(6명)과 바깥쪽 원(8명)의 이중 원 대형으로 서서 손이 닿을 간격을 유지한다. 2) 안쪽 원은 풍선을, 바깥쪽 원은 공을 들고 각각 자신의 원 안에서 옆 사람에게 빠르게 패스한다. 3) 바깥쪽 원 학생이 공을 던지지 않고 들고서 안쪽 원 학생의 풍선을 쳐서 떨어뜨리면 자리를 맞바꾼다. 4) 참가 인원이 늘어나면 공과 풍선을 2개씩 늘리거나 패스 회전 방향을 수시로 바꾸어 진행한다.</p>
