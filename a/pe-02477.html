<h1>돌려라 패스</h1>
<p>1) 전체 인원을 4인 1조로 나누고, 사각형의 각 꼭짓점에 한 명씩 섭니다. 2) 한 사람이 사각형 가운데에서 훌라후프를 세워서 돌린 후 제자리로 돌아가면, 시계 방향으로 패스를 시작합니다. 3) 훌라후프가 돌다가 멈출 때까지 패스를 진행하여 정해진 개수(30개)의 패스를 성공해야 합니다. 4) 성공할 때까지 게임을 진행해 가장 늦게 성공하는 팀이 벌칙을 받습니다.</p>
