<h1>큰 공 바운드 배구</h1>
<p>1) 전체 인원을 네트를 사이에 두고 두 편으로 나누며 배구형 규칙을 적용한다. 2) 3회 터치 안에 상대편 코트로 넘겨야 하며, 같은 학생이 연속으로 터치할 수 없다. 3) 바운드는 코트 당 각 1회 허용하며, 공격이나 수비할 때 네트를 터치할 수 없다. 4) 선수는 라인 밖으로 나가서 공을 받을 수 있으며, 킨볼의 특성상 공을 멀리 보내기 힘들기 때문에 서브선은 앞으로 당겨서 진행한다.</p>
