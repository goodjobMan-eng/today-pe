<h1>짝과 함께 맨손체조 모양 만들기</h1>
<p>1) 마주 보고 서서 발을 어깨너비로 벌리고 서로의 어깨를 잡고 허리를 숙여 네모 모양을 만든다. 2) 마주보고 앉아 손을 잡고 서로의 발바닥을 마주 대고 천천히 위로 올려 세모 모양을 만든다. 3) 옆으로 서서 양손을 잡고 서로의 발에 의지하며 바깥쪽으로 잡아당겨 하트 모양을 만든다. 4) 같은 방향을 보고 앞뒤로 앉아 뒤에 앉은 사람이 발로 허리를 받치며 앞 친구의 양팔을 뒤로 잡아당겨 배 모양을 만든다.</p>
