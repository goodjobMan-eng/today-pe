<h1>공을 들고 달려가서 이어주는 게임</h1>
<p>1) 원마커 5개를 오각형으로 배치하고 3명이 한 모둠이 되어 원마커를 하나씩 건너뛰어 선다. 2) 1번이 다음 원마커로 뛰어간 후 2번에게 공을 이어주고, 2번은 공을 받고 다음 원마커로 뛰어 3번에게 공을 이어주기를 반복한다. 3) 1분 동안 성공한 이어주기 횟수를 기록하거나, 두 모둠이 동시에 시작해 5바퀴를 먼저 끝내는 모둠이 이긴다.</p>
