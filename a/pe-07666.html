<h1>어드벤처 릴레이</h1>
<p>1) 콘, 매트(강), 훌라후프 장애물이 설치된 코스에 두 팀이 대열을 맞춰 선다. 2) 출발 신호가 울리면 각 팀의 첫 번째 주자가 달려가 콘을 돌고, 발이 닿지 않게 매트(강)를 뛰어넘는다. 3) 훌라후프 안에 두 발을 모아 착지한 뒤 훌라후프를 머리 위로 통과시켜 다시 바닥에 내려놓고 진영으로 돌아온다. 4) 출발선을 통과하면 다음 주자가 출발하며, 모든 팀원이 총 3번을 먼저 완주한 팀이 1점을 얻는다.</p>
