<h1>원 바운스 (One Bounce)</h1>
<p>1) 수건이나 테이프로 바닥 가운데 경계선을 만들어 구역을 나눈다. 2) 한쪽에서 공을 중앙선 너머로 보낸다. 3) 공이 한 번 바운드된 후 다른 쪽 구역에서 받아쳐 랠리를 이어간다. 4) 패들이나 일회용 접시를 도구로 사용해 짝과 랠리를 주고받는다.</p>
