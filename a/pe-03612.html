<h1>패스 게임</h1>
<p>1) 조끼를 입은 팀과 안 입은 팀으로 나눈다. 2) 같은 팀끼리 공을 연속으로 5번 패스하면 1점을 얻는다. 3) 득점 후에는 상대 팀에게 공을 넘겨주고 시작한다. 4) 3초 안에 패스해야 하며, 패스할 때만 상대 공을 빼앗을 수 있다. 5) 공을 빼앗기면 패스 횟수는 다시 0부터 센다. 6) 5분 동안 더 많은 점수를 얻은 팀이 승리한다.</p>
