<h1>벌과 거미 술래잡기</h1>
<p>1) 참여 인원수에 따라 2명 이상 거미(술래)를 정한다. 2) 신호가 울리면 한 명의 거미는 집을 지키고 나머지 거미는 뛰어나가 벌을 잡아 집으로 데려온다. 3) 처음 잡힌 벌이 거미집에 손을 붙이고, 그 뒤에 잡힌 벌들은 차례로 손을 잡고 늘어선다. 4) 잡히지 않은 벌이 잡힌 벌들의 연결된 손을 끊으면 끊긴 손의 바깥쪽 벌은 다시 달아난다.</p>
