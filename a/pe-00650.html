<h1>프렐볼 (프렐 테니스)</h1>
<p>1) 낮은 네트를 사이에 두고 양 팀이 마주 서서 진행하는 네트형 구기 게임입니다. 2) 서브나 리턴을 할 때 공을 바닥에 한 번 바운드시킨 뒤 손이나 팔로 쳐서 넘깁니다. 3) 팀원끼리 패스를 이을 때도 바닥 바운드를 활용해 상대 코트로 넘기며, 공이 네트에 걸리거나 코트 밖으로 나가면 상대 팀이 득점합니다. 4) 정해진 점수에 먼저 도달하는 팀이 승리합니다.</p>
