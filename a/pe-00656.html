<h1>스텝래더 달리기 릴레이</h1>
<p>1) 모둠별로 출발선 앞에 스텝래더를 깔고 반환점 위치에 콘을 배치합니다. 2) 신호가 울리면 각 모둠의 첫 주자가 래더 구간을 빠른 잔발 스텝으로 통과합니다. 3) 래더를 통과한 뒤 반환점 콘을 돌아 전력 질주로 출발선에 복귀합니다. 4) 다음 주자와 손뼉을 터치해 교대하며, 모든 모둠원이 먼저 완주한 팀이 승리합니다.</p>
