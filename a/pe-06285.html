<h1>배구 2인 패스</h1>
<p>1) 2인 1조로 네트를 사이에 두고 마주 서서 준비한다.2) 신호음이 울리면 첫 번째 선수가 공을 위로 던져 패스를 실시하고 상대 선수가 받아 패스한 것부터 측정한다.3) 1분 동안 바닥에 공을 떨어뜨리지 않고 언더핸드 또는 오버핸드 패스를 연속 성공한 횟수를 측정한다.</p>
