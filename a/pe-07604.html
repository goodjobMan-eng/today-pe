<h1>의자 차지하기 (L'Anarchaise)</h1>
<p>1) 공간 곳곳에 의자를 흩어 놓고, 의자 1개를 비워둔 채 술래 1명은 빈 의자의 반대편에 섭니다. 2) 술래는 오직 걷기만 하여 빈 의자로 이동할 수 있고, 다른 학생들은 뛰어서 빈 의자에 먼저 앉아 술래를 막습니다. 3) 다른 사람이 일어나 생겨난 빈 의자로 술래가 계속 이동하며, 한 번 의자에서 일어난 사람은 다시 앉을 수 없고 한 번에 한 명씩만 일어납니다.</p>
