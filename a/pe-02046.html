<h1>변형 피구 놀이</h1>
<p>1) 두 팀으로 나누고 팀원들은 경기장 바깥 라인에서 한 줄로 대기한다. 2) 신호가 울리면 달려나가 중앙 라인에 놓인 5~6개의 공을 잡는다. 3) 공에 맞으면 아웃되어 경기장 밖으로 나가며 외야로 가지 않고 밖으로 나간 공을 자기 팀 쪽으로 넣어주는 역할을 한다. 4) 상대가 던진 공을 잡으면 공을 던진 상대편이 아웃되며, 자신이 들고 있는 공으로 날아오는 공을 튕겨내거나 막을 수 있고 한 번에 한 명만 아웃된다.</p>
