<h1>양말 공 넘버 파이브 챌린지</h1>
<p>1) 둥글게 만 양말 1개를 이마에 올리고 누웠다가 떨어뜨리지 않고 일어선다 2) 두 번째 양말을 무릎 사이에 끼우고 첫 번째 양말을 이마에 올린 채 누웠다 일어선다 3) 손을 짚지 않고 한 발의 힘과 유연성을 이용해 그대로 일어선다 4) 한쪽 무릎을 바닥에 대고 반대쪽 다리를 90도 이상 벌린 상태에서 일어선다 5) 양말을 발로 차올려 무릎이나 허벅지 사이에 끼운다</p>
