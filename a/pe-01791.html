<h1>B.E.E.F. 슈팅 카피캣 놀이</h1>
<p>1) 학생들이 골대 주변 적정 거리에 서서 작은 아케이드 농구공을 준비한다. 2) B.E.E.F.(밸런스, 눈, 팔꿈치, 팔로스루) 4가지 기본자세를 교사와 함께 확인하고 익힌다. 3) 교사나 리더의 슈팅 폼과 던지기를 따라 림 뒤쪽을 조준해 골대에 슛을 시도한다. 4) 비거리가 부족한 학생은 무릎을 굽혔다 점프하는 하체 반동을 이용해 슛을 날리도록 단계를 변형한다.</p>
