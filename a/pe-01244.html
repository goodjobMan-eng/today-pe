<h1>가위바위보 추격 게임</h1>
<p>1) 짝과 1m 간격으로 원마커 위에 마주 서고, 양쪽 뒤편 일정 거리에 콘으로 도착선을 표시한다. 2) 구호에 맞춰 가위바위보를 하여 이긴 사람은 추격자가 되고 진 사람은 도망자가 되어 전력 질주한다. 3) 도망자가 도착선에 닿기 전에 추격자가 손으로 태그하면 1점을 얻고, 도망자가 먼저 닿으면 점수가 없다. 4) 익숙해지면 도망자가 반환점에 도달한 직후 즉시 역할을 바꾸어 역추적하는 규칙으로 변형한다.</p>
