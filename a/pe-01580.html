<h1>팝콘 송 피트니스 워밍업</h1>
<p>1) 음악이 잘 들리는 실내 공간에서 양팔을 벌려 부딪히지 않을 정도의 안전거리를 확보하고 선다. 2) 경쾌한 팝콘 음악에 맞춰 제자리 러닝, 양손 찌르기 스쿼트, 사이드 스텝 펀치 동작을 연속으로 수행한다. 3) 옥수수가 튀어 오르는 박자에 맞춰 제자리 점핑 잭과 하이 니(무릎 올리기) 리듬 점프를 역동적으로 이어간다. 4) 모둠별로 동작 타이밍을 다르게 하거나 강도를 조절하여 전신 인터벌 트레이닝 형태로 변형한다.</p>
