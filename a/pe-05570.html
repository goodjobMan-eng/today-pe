<h1>등대등 공 던지고 박수 공받기</h1>
<p>1) 짝과 등을 맞대고 선 뒤 약 3~4m 거리를 두고 떨어져 마주보고 섭니다.2) 신호가 울리면 뒤로 돌아 동시에 공을 상대방을 향해 포물선으로 던집니다.3) 상대방이 던져준 공을 놓치지 않고 안전하게 받아냅니다.4) 익숙해지면 공을 던진 직후 박수를 2번 친 뒤 날아오는 공을 받습니다.5) 성공 횟수에 따라 박수를 3번, 4번으로 늘려가며 난이도를 조절합니다.</p>
