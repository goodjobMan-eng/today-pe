<h1>평균대와 친해지기 기본 활동</h1>
<p>1) 매트가 깔린 낮은 평균대 위에 두 발로 천천히 올라선다. 2) 시선은 발 밑이 아닌 앞쪽 평균대 윗부분을 바라보며 천천히 걸어 이동한다. 3) 중심을 잡기 어려울 때는 양팔을 양옆으로 펼쳐 균형을 유지한다. 4) 평균대 끝까지 도달하면 점프하여 매트 위로 안전하게 착지하거나 뒤로 돌아서 본다.</p>
