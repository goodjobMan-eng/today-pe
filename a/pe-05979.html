<h1>2구 저글링 연습</h1>
<p>1) 1구 저글링으로 던지고 박수 치고 받거나 땅 짚고 받기, 돌고 받기, 머리·어깨·무릎 짚고 받기를 연습한다.2) 팔을 옆으로 치지 말고 끌어올려 몸통 프레임 안에서 반대 손으로 던져 받는 1구 포물선 연습을 5분 이상 한다.3) 2구 저글링은 첫 번째 공이 최고 정점에 도달해 떨어지려고 할 때 안쪽 아래에서 두 번째 공을 던지며 &quot;하나, 둘, 셋, 넷&quot; 구령에 맞춰 양손으로 번갈아 잡는다.</p>
