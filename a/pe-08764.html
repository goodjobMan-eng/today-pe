<h1>상어 게임</h1>
<p>1) 바닥에 긴 줄을 경계선으로 두고 참가자들이 줄 한쪽에 일렬로 선다. 2) 진행자의 구호에 따라 '상어'면 줄의 왼쪽, '사자'면 줄의 오른쪽으로 점프하여 이동한다. 3) 틀린 동작을 하거나 늦게 움직인 사람은 탈락한다.</p>
