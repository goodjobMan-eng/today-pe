<h1>사각 피구</h1>
<p>1) 학급을 A, B, C, D 네 팀으로 나누어 사각 구역에 배치한다. 2) 자기 팀을 제외한 다른 팀의 선수를 공으로 맞춰 아웃시킨다. 3) 아웃된 친구는 자기 팀 영역 바깥으로 나가서 다른 팀을 맞춘다. 4) 정해진 시간 안에 선수가 가장 많이 남아있는 팀이 이긴다.</p>
