<h1>안전지대로 도망쳐 피구</h1>
<p>1) 뜀틀·매트 등으로 3~4곳의 안전지대를 만들고 가운데 공격 구역을 정합니다. 2) 이동 신호가 떨어지면 수비는 5초 안에 다른 안전지대로 달려가 피합니다. 3) 가운데 공격 구역에 있는 팀은 공을 던져 이동하는 수비수를 맞힙니다. 4) 공에 맞거나 5초 안에 안전지대에 도달하지 못하면 아웃되며, 한 바퀴를 돌았을 때 더 많이 살아남은 팀이 승리합니다.</p>
