<h1>배구 블로킹 기초 연습</h1>
<p>1) 짝과 네트를 사이에 두고 마주 서서 제자리에서 동시에 점프하여 손을 마주칩니다. 2) 네트를 따라 좌우로 이동하며 점프하여 손을 마주칩니다. 3) 한 명이 높은 위치에서 공을 들고 있고, 다른 한 명이 점프하여 두 손으로 공을 터치합니다. 4) 네트를 사이에 두고 점프하여 공을 주고받습니다. 5) 콘을 놓고 측면 이동 및 도움닫기 점프 동작을 연습합니다. 6) 상대가 던져주는 공을 네트 앞에서 블로킹합니다.</p>
