<h1>켄다마 바닥 컵 받기와 스파이크</h1>
<p>1) 바닥 컵 주변을 감싸 쥐고 구슬을 가슴 높이로 띄워 바닥 컵으로 받는다. 2) 기본 그립에서 구슬을 띄운 뒤 켄다마를 안쪽으로 돌려 바닥 컵으로 받는다. 3) 큰 컵, 작은 컵, 바닥 컵 순서로 연속해서 옮겨 받는다. 4) 구슬이 회전하지 않게 무릎 탄력으로 띄워 꼬챙이(스파이크)에 구멍을 꽂는다.</p>
