<h1>매와 비둘기</h1>
<p>1) 구석에 콘을 놓아 비둘기 둥지와 매 둥지를 만들고 중앙 공간에 긴 벤치를 놓아 새장을 설치한다. 2) 비둘기들은 매를 피해 출발 둥지에서 반대편 목표 둥지를 향해 이동을 시도한다. 3) 이동 중 매에게 터치당한 비둘기는 벤치(새장)에 올라가 갇히며, 다른 비둘기가 와서 터치해주면 풀려난다.</p>
