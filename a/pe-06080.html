<h1>사격 축구 게임</h1>
<p>1) 중앙에 표적이 되는 공을 두고 양 팀 선수는 이동하는 공을 맞히기 위한 투척용 공을 준비한다.2) 투척용 공을 던져 중앙의 공을 맞춰 상대 진영의 골대에 집어넣으면 2점을 획득한다.3) 상대 선수를 던진 공으로 맞히면 1점을 획득하며, 굴러온 공을 주워 연속으로 사격 공격을 이어간다.</p>
