<h1>피구 사이드 전술 훈련</h1>
<p>1) 내야 수비수와 외야 공격수(사이드 공격수)를 배치하고 라바콘 및 마커로 이동 구역을 설정한다. 2) 외야에서 사이드로 이동하여 직접 공격하거나, 사이드로 이동 후 바운드 패스로 내야에 전달하여 공격한다. 3) 패스 후 사이드로 이동하여 다시 패스를 받아 공격하는 전술을 연습한다. 4) 번호별 수비수 및 공격수 파트너를 순차적으로 교대하며 전술 훈련을 반복한다.</p>
