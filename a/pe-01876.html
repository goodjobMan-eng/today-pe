<h1>바다 문어의 촉수 술래잡기</h1>
<p>1) 체육관 중앙에 술래(문어) 1명을 지정하고 나머지 학생들은 한쪽 끝 출발선에 나란히 대기합니다. 2) 학생들이 다 함께 문어 구호를 외친 뒤 반대편 안전선까지 문어를 피해 전력 질주합니다. 3) 문어에게 태그당한 학생은 잡힌 그 자리에 앉아 팔을 흔드는 촉수가 되어 지나가는 다른 주자를 태그할 수 있습니다. 4) 왕복을 거듭하며 모든 학생이 문어나 촉수로 변할 때까지 진행하고 마지막까지 살아남은 주자가 승리합니다.</p>
