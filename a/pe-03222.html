<h1>간이 하키 게임</h1>
<p>1) 바닥에 경기장을 그리고 양쪽에 골대를 세운다. 2) 5명씩 두 모둠으로 나누어 준비한다. 3) 공을 몰거나 이어 주면서 상대 모둠의 지역으로 이동한다. 4) 공격수의 공을 뺏으면 공격과 수비가 바뀐다. 5) 골키퍼는 골대 앞에서 손을 포함한 모든 부위로 골을 막을 수 있다. 6) 상대 모둠 골대에 골을 넣으면 1점을 얻고, 정해진 시간 동안 더 많은 점수를 얻은 모둠이 이긴다.</p>
