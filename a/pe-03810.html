<h1>종이공 스쿼트 챌린지</h1>
<p>1) 종이 한 장은 둥글게 뭉쳐 공으로 만들고 다른 한 장은 평평하게 펴서 양손으로 잡는다. 2) 평평한 종이 가운데에 종이공을 올리고 스쿼트 자세로 앉았다가 일어난다. 3) 일어서면서 양팔을 위로 뻗어 종이공을 머리 위로 띄운 뒤 내려오는 공을 종이로 받으면 1점을 얻는다. 4) 1분 동안 스쿼트와 받기를 반복하여 총 몇 점을 획득하는지 기록에 도전한다.</p>
