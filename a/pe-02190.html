<h1>교과서 탁구공 전달 놀이</h1>
<p>1) 폐 교과서의 절반을 접어 책장 사이에 끼워 하트 모양 홈이 생기도록 만든다. 2) 두 팀으로 나뉘어 출발지점부터 도착지점 의자 위의 종이컵까지 책을 맞대어 한 줄로 길을 만든다. 3) 맨 앞사람이 탁구공을 굴리면, 공이 지나간 뒷사람은 재빨리 줄의 맨 뒤로 이동해 길을 계속 이어준다. 4) 공이 중간에 떨어지면 그 지점에서 주워 계속 진행하며, 도착지점 종이컵에 탁구공을 먼저 넣은 팀이 이긴다.</p>
