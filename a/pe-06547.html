<h1>파트너 슬레드풀 챌린지</h1>
<p>1) 한 사람은 바닥에 팀 조끼를 깔고 앉은 채 두 손을 앞으로 뻗어 파트너에게 건넨다. 2) 다른 한 사람은 파트너의 앞에 서서 두 손을 잡고 하체의 힘을 이용해 뒤로 걸으며 파트너를 끌어당긴다. 3) 끌려가는 사람은 몸의 중심을 잡고 바닥에 앉아 이동한다. 4) 정해진 거리를 왕복한 뒤 역할을 교대해서 다시 수행한다.</p>
