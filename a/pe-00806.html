<h1>디즈니 프리즈 댄스</h1>
<p>1) 디즈니 음악에 맞춰 화면 속 캐릭터들과 함께 자유롭게 춤을 춥니다. 2) 음악이 멈추고 'FREEZE' 신호가 뜨면 화면에 제시된 캐릭터의 요가/정지 포즈를 그대로 따라 멈춥니다. 3) 타이머가 끝날 때까지 흔들리지 않고 균형을 유지해야 합니다. 4) 중간에 출제되는 '틀린 그림 찾기(Find the odd one out)' 미니 게임도 함께 해결합니다.</p>
