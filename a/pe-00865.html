<h1>마리오 런 브레인 브레이크 모험 놀이</h1>
<p>1) 화면 속 마리오의 모험에 맞춰 제자리 달리기와 점프를 하며 장애물을 피합니다. 2) 보너스 퀴즈가 나오면 캐릭터가 숨어 있는 박스를 추리해 맞힙니다. 3) 카트 경주 단계에서는 장애물을 피하고 엉금엉금 등껍질을 던지는 동작을 따라 합니다. 4) 마지막 성 스테이지를 통과해 친구들을 모두 구출하면 성공합니다.</p>
