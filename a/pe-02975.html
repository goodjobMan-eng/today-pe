<h1>빈백 저글링 커플 연습</h1>
<p>1) 편한 손(오른손 파랑) 던지고 반대 손(왼손 노랑) 던진 뒤 파랑만 잡는 단계로 시작한다. 2) 파랑 던지고 노랑 던진 뒤 두 개를 모두 잡는 단계로 연습한다. 3) 한 손에 두 개의 빈백을 쥐고 앞의 파랑을 먼저 던진 뒤 뒤의 노랑을 차례대로 던진다. 4) 편한 손에 2개, 반대 손에 1개를 잡고 파랑-빨강-노랑 순서로 던지며 짝과 함께 3개 빈백 저글링을 이어간다.</p>
