<h1>체중 빼기(언웨이팅) 스텝 반응 대시</h1>
<p>1) 양발을 모으고 차려 자세로 선다. 2) 신호(지도자의 구령 또는 화면의 공 방향)를 보고 이동하려는 반대쪽 발로 지면을 딛으며 체중을 빼는 발중 스텝을 밟는다. 3) 신호가 나온 방향(좌·우·앞·뒤)으로 한 걸음 또는 수 미터를 전력으로 대시한다. 4) 동작에 익숙해지면 점차 양발을 벌리고 허리를 낮춘 실전 자세에서 연습한다.</p>
