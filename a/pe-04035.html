<h1>해적 어드벤처 준비운동</h1>
<p>1) 30초 운동 후 10초 휴식 인터벌에 맞춰 제자리에서 줄넘기(또는 상상 줄넘기) 동작을 한다. 2) 다음 30초 동안 먼 바다의 해적선을 부르듯 양팔과 다리를 크게 흔들며 점프한다. 3) 다음 30초 동안 해변의 코코넛을 치우듯 양발을 번갈아 가며 발차기 동작을 한다. 4) 마지막 30초 동안 몸을 길게 뻗고 손을 이마에 대며 먼 바다의 배를 망보는 동작을 수행한다.</p>
