<h1>이어서 걷기 게임</h1>
<p>1) 콘을 이용해 지름 10m 정도의 작은 원을 만들고, 첫 번째 주자만 원 밖으로 나오고 나머지는 원 안에서 줄을 맞추어 기다립니다. 2) 신호가 울리면 첫 번째 주자가 출발하여 한 바퀴를 돌아 우리 모둠 쪽으로 옵니다. 3) 다음 주자는 원 밖으로 나와 배턴을 주는 사람이 신호를 보낼 때 팔을 뒤로 뻗어 배턴을 건네받습니다. 4) 모둠원과 협력하여 이어 걷다가 상대 모둠원의 등을 치면 승리합니다.</p>
