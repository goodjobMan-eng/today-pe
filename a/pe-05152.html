<h1>포스퀘어 유닛 3일 차 변형 게임</h1>
<p>1) 4개 구역(빅 베어, 1, 2, 3)으로 나뉜 코트에 각자 한 명씩 선다.2) 빅 베어가 '어라운드 더 월드'를 외치며 1번 구역으로 서브하고 공이 원을 그리며 순서대로 넘어가도록 친다.3) 빅 베어가 '워(War)'를 선언하면 지정한 번호의 구역과 일대일 대결을 진행한다.</p>
