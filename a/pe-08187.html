<h1>비행기 놀이</h1>
<p>1) 양팔을 옆으로 뻗은 비행기 자세를 취하고 네모 구역 안에서 대기한다. 2) 원형으로 돌지 않고 네모 구역의 한쪽 면에서 반대편 면으로 중앙을 통과해 이동한다. 3) 양팔을 내리지 않은 채 다른 사람과 부딪히지 않도록 피하며 이동한다.</p>
