<h1>안과 밖 피구 게임</h1>
<p>1) 9m x 9m 크기의 사각 구역을 만들고 한 팀은 구역 안, 다른 팀은 둘레 외곽에 선다. 2) 외곽의 팀원들이 안쪽에 있는 상대 팀을 향해 하나 이상의 공을 던진다. 3) 공에 맞은 안쪽 팀원은 구역 밖으로 나가며, 역할을 바꾼 후 더 짧은 시간 안에 상대를 전원 아웃시킨 팀이 승리한다.</p>
