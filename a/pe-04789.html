<h1>치킨 배달</h1>
<p>1) 1단계 알 상태로 돌아다니다가 같은 알을 만나 가위바위보를 한다.2) 이기면 2단계 병아리로 레벨업하고, 지면 이전 단계로 떨어진다.3) 병아리에서 이기면 3단계 닭(꼬꼬댁), 다음은 4단계 통닭, 5단계 치킨 배달로 올라간다.4) 배달 단계에서 이긴 학생은 사장님(교사)에게 도전하며, 교사를 이기면 분점 1호점, 2호점 사장님이 된다.</p>
