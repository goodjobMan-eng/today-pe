<h1>스포츠스태킹 3-6-3</h1>
<p>1) 12개의 스태킹 컵을 3개, 6개, 3개로 나누어 3개의 탑으로 준비합니다. 2) 자신의 손잡이에 맞추어 왼쪽 또는 오른쪽부터 3단, 6단, 3단 순서로 업스태킹(쌓기)을 진행합니다. 3) 업스태킹을 시작했던 방향과 같은 방향부터 3단, 6단, 3단 순서로 다운스태킹(정리하기)을 진행합니다. 4) 업스태킹 중 실수가 나오면 즉시 이전 상태로 복구한 뒤 수정하고, 타이머를 양손으로 멈추어 기록을 측정합니다.</p>
