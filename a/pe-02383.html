<h1>숫자 누적 패스 변형 게임</h1>
<p>1) 두 팀으로 나누고 공격팀은 상대 수비를 피해 같은 팀원끼리 공을 연속으로 패스한다. 2) 같은 팀끼리 패스가 연결될 때마다 교사가 패스 성공 숫자를 1부터 누적하여 센다. 3) 수비팀이 공을 가로채면 이전까지 누적된 패스 횟수는 0으로 초기화되고 공수 전환된다. 4) 공을 가진 채 달릴 수 없으며 피벗만 가능하고, 정해진 목표 숫자(15회)를 먼저 달성한 팀이 승리한다.</p>
