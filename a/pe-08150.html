<h1>가위바위보 피트니스 (Rock Paper Scissors Fitness)</h1>
<p>1) 라운드가 시작되면 3초 카운트다운에 맞춰 가위바위보를 준비한다. 2) '가위바위보 슛(shoot)' 구호에 맞춰 손 모양을 내고 화면 상단 상대의 손 모양을 확인한다. 3) 가위바위보에서 이기면 초록색 칸의 운동을 수행한다. 4) 패배하면 빨간색 칸의 운동을, 비기면 노란색 칸의 운동을 각각 수행한다.</p>
