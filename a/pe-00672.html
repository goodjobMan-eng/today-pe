<h1>훌라후프 돌리기 도전 활동</h1>
<p>1) 각자 훌라후프 1개씩을 준비하여 허리에 걸치고 대기합니다. 2) 신호와 함께 허리를 돌려 훌라후프를 떨어뜨리지 않고 계속 돌립니다. 3) 허리 돌리기가 익숙해지면 무릎이나 발목 등 몸의 낮은 부위로 옮겨 돌리기에 도전합니다. 4) 정해진 시간 동안 바닥에 떨어뜨리지 않고 연속으로 회전을 유지합니다.</p>
