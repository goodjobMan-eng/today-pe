<h1>자기 지역 발야구</h1>
<p>1) 9명씩 2개 모둠을 이루고, 수비 모둠은 미리 정한 지역에서 2명씩 짝을 지어 수비 위치에 선다. 2) 공격 모둠은 수비 모둠이 굴려 준 공을 차고 누를 돌아 홈으로 들어온다. 3) 수비 모둠이 타자가 찬 뜬공을 바로 잡거나 주자보다 먼저 공을 누로 보내면 아웃된다. 4) 3아웃이 되면 공수를 교대하며, 3회씩 진행하여 점수를 더 많이 얻은 모둠이 이긴다.</p>
