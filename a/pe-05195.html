<h1>풋볼 술래잡기</h1>
<p>1) 술래를 피해 정해진 이동 방식(1라운드 걷기, 2라운드 스키핑/갤로핑, 3라운드 조깅)으로 이동한다.2) 술래에게 태그되면 코트 밖의 리시버 구역으로 이동한다.3) 쿼터백의 패스를 받아 공을 다시 던져주면(성공하거나 3번 기회 후) 게임에 복귀한다.4) 2~3분이 지나면 술래와 쿼터백 역할을 교대한다.</p>
