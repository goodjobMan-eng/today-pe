<h1>스펀지 물 나르기 릴레이 게임</h1>
<p>1) 전체 인원을 두 팀으로 나누고 출발선 뒤에 일렬로 정렬한다. 2) 출발 신호가 울리면 첫 번째 주자가 어린이 수영장에서 젖은 스펀지를 집어 들고 팀 양동이로 달려간다. 3) 스펀지의 물을 양동이에 모두 짜 넣은 뒤 전력 질주로 복귀하여 다음 주자의 손을 하이파이브로 터치한다. 4) 양동이에 물이 넘칠 때까지 스펀지 릴레이를 반복하며 먼저 물을 넘치게 만든 팀이 승리한다.</p>
