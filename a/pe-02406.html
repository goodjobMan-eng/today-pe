<h1>풍선 배구 게임</h1>
<p>1) 각 팀을 5~6명으로 구성하고 팀원들은 1번부터 각자 순서를 정한다. 2) 풍선은 순서대로 한 번씩만 터치할 수 있으며 마지막 번호인 사람만 상대편으로 공을 넘기거나 공격할 수 있다. 3) 서브는 순서대로 돌아가며 넣고, 점수를 얻은 사람은 계속해서 서브를 넣는다. 4) 순서를 건너뛰거나 마지막 사람이 아닌 사람이 넘기거나 풍선이 바닥에 떨어지면 상대팀이 득점하며 10~15점을 먼저 얻는 팀이 승리한다.</p>
