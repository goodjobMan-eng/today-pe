<h1>마당 나온 병아리 술래</h1>
<p>1) 3명이 가위바위보를 하여 1등은 암탉, 2등은 병아리, 3등은 늑대를 맡는다.2) 병아리는 꼬리에 꼬리끈을 넣고 암탉 뒤에 서서 암탉의 허리를 잡으며, 늑대는 암탉과 마주보고 선다.3) 늑대가 암탉의 수비를 피해 병아리 뒤의 꼬리끈을 빼앗으면 늑대와 병아리 역할을 바꾼다.</p>
