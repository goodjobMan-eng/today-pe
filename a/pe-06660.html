<h1>학교스포츠클럽 요가 및 나무 자세 술래잡기</h1>
<p>1) 의자나 바닥에 앉아 복식 호흡과 흉곽 호흡을 익히고 파트너와 함께 2인 의자 자세 및 유연성 챌린지를 수행한다. 2) 산 자세, 나무 자세, 고양이 자세, 코브라 자세, 낙타 자세, 비둘기 자세 등 기본 요가 동작을 단계별로 익힌다. 3) 술래가 조끼를 들고 쫓아올 때 터치 전 '나무'를 외치며 나무 자세로 버티고, 다른 친구가 터치하면 풀려나는 얼음땡 게임을 한다.</p>
