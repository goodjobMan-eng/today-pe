<h1>치킨 댄스 이동 운동 웜업</h1>
<p>1) 교실이나 강당의 안전한 열린 공간에 각자 자리를 잡고 선다. 2) 음악에 맞춰 4카운트씩 부리(손짓), 날개(팔꿈치), 꽁지깃(엉덩이), 박수를 4회 반복한다. 3) 4회 세트가 끝나고 간주 음악이 나오면 스킵(앞), 슬라이드(옆), 갤럽(앞) 동작으로 공간을 자유롭게 이동한다. 4) 익숙해지면 이동 동작을 짝과 함께하는 스퀘어 댄스나 리본·스카프를 활용한 루틴으로 변형한다.</p>
