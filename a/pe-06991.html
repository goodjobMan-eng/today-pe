<h1>버킷 볼 (Bucket Ball)</h1>
<p>1) 중앙에 버킷(바구니)을 두고 각 팀 줄 앞에 여러 개의 스팟 마커를 일렬로 배치한다 2) 팀의 첫 번째 주자가 원하는 스팟 마커를 선택해 이동한 뒤 언더핸드 던지기로 버킷을 향해 던진다 3) 성공하면 자신이 던진 스팟 마커와 도구를 챙겨 줄 뒤로 돌아가 마커를 보관하고 실패하면 도구만 주워 다음 주자에게 넘기며 팀의 모든 마커를 먼저 모은 팀이 승리한다</p>
