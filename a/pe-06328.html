<h1>봄으로 탈출하기 런 브레인 브레이크</h1>
<p>1) 1단계 3월 탈출에서는 사자와 번개를 피해 점프하거나 피하고, 구름 밑으로 숙이며 얼음 결정을 부순다.2) 2단계 4월 탈출에서는 웅덩이를 뛰어넘고 우산 밑으로 숙이며 먹구름을 치우고 토네이도를 만나면 회전한다.3) 3단계 5월 탈출에서는 꽃을 피하고 해 밑으로 숙이며 반딧불이를 잡고 잔디깎이를 보면 얼음처럼 멈춘다.</p>
