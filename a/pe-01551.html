<h1>뜀틀 다리벌려뛰기 및 매트 위 앞구르기 도전 활동</h1>
<p>1) 뜀틀과 발구름판, 착지 매트 및 보조 단차 매트를 안전 간격에 맞추어 설치한다. 2) 3~5걸음 조주 후 발구름판을 양발로 힘차게 구르며 손을 뜀틀 앞쪽에 짚는다. 3) 다리를 양옆으로 벌려 뜀틀을 넘거나 매트 위에서 목 뒤를 대며 안전하게 앞구르기 후 두 발로 착지한다. 4) 수준에 따라 단차 뜀틀이나 보조 표식 매트를 활용해 손 짚는 위치와 높이를 조절하며 연습한다.</p>
