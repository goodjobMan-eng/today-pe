<h1>가정형 신체활동 루틴(DAY-19)</h1>
<p>1) 런지 자세에서 한 팔을 위로 뻗어 스트레칭한다. 2) 어깨너비로 발을 벌리고 양팔을 머리 위로 올려 손뼉을 치며 점핑잭을 한다. 3) 한 발을 뒤로 접어 착지하며 점프 회전하는 점프 턴을 실시한다. 4) 런지 자세로 앉으면서 상체를 앞쪽 다리 방향으로 회전하는 트위스트 런지를 반복한다.</p>
