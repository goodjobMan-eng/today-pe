<h1>2x2 피트니스 준비운동</h1>
<p>1) 각 학생은 운동 종목이 적힌 기록지 한 장과 필기도구를 준비한다.2) 트랙 안팎에서 다른 파트너를 찾아 둘 다 필요한 운동(예: 점핑잭 20회)을 함께 센다.3) 운동을 마치면 서로의 기록지에 서명(이니셜 또는 X 표시)을 해준다.4) 중앙 원으로 이동해 손을 들고 새로운 파트너를 찾아 모든 운동 과제를 완수할 때까지 반복한다.</p>
