<p>1) 학생들을 안쪽과 바깥쪽 원으로 나눕니다. 2) 음악이 나오면 안쪽과 바깥쪽 학생들이 서로 반대 방향으로 뜁니다. 3) 음악이 멈추면 바깥쪽 학생은 동작을 취하고 안쪽 학생은 그 동작을 따라 합니다.</p>
