<h1>출발 드림팀 사격 게임</h1>
<p>1) 1분 타이머를 누르고 출발하여 사격 위치로 이동한다2) 엎드려 쏴 자세 등으로 사격 총을 장전하고 표적(타깃)을 향해 발사한다3) 통과 장애물 및 점프 기구를 넘고 통과하여 달린다4) 두 번째 사격 위치에서 다시 엎드려 쏴 자세로 표적을 쏜다5) 평균대 등 장애물을 건너와 타이머를 정지하여 1분 안에 성공하고 맞힌 표적 수만큼 보상을 받는다.</p>
