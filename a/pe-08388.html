<h1>공 훔치기 놀이 (손과 드리블)</h1>
<p>1) 가로세로 8~10m 사각형 모퉁이에 3~4명씩 4팀으로 나뉘어 서고 중앙에 공 8개를 둡니다. 2) 신호가 울리면 각 팀의 주자가 차례대로 중앙으로 달려가 공 1개를 손으로 들고 자기 팀 콘으로 돌아옵니다. 3) 중앙의 공이 떨어지면 다른 팀 진영에서 공을 훔쳐올 수 있으며, 먼저 공 4개를 모은 팀이 승리합니다. 4) 다음 라운드는 손 대신 발로 드리블하여 공을 가져오는 방식으로 진행합니다.</p>
