<h1>스틸링 콘 슈팅</h1>
<p>1) 팀을 두 그룹으로 나누어 골대 양쪽에 서고, 각 그룹의 콘을 맞은편 트랜스버스 라인에 둔다. 2) 신호가 울리면 차례대로 슛을 던진 뒤 리바운드하여 다음 주자에게 패스한다. 3) 슛이 들어가면 상대편 콘으로 달려가 하나를 훔쳐 자기 팀으로 가져온다. 4) 상대 팀의 콘을 모두 먼저 훔쳐온 팀이 승리한다.</p>
