<h1>가위바위보 주사위 달리기 게임</h1>
<p>1) 각자 가위바위보 주사위를 하나씩 쥐고 체육관 한쪽 구석 모퉁이에서 출발한다. 2) 다른 친구와 주사위를 굴려 가위바위보 대결을 펼친다. 3) 대결에서 이긴 학생은 체육관 전체를 한 바퀴 달려 출발·결승선으로 이동한다. 4) 결승선에서 칠면조 깃털 역할을 하는 막대기를 획득하여 칠면조 몸통에 꽂은 후 다시 모퉁이로 돌아가 다른 상대를 찾아 도전한다.</p>
