<h1>다시 머리 위로</h1>
<p>1) 매트 위에 나란히 누운 상태에서 공을 하나씩 준비합니다. 2) 매트에 누운 상태로 공을 천장에 닿지 않을 정도로 두 손으로 위로 던집니다. 3) 매트에 누운 상태를 유지하며 공을 잡으면 성공하여 1점을 얻고 다시 기회가 생깁니다. 4) 공을 받지 못했거나 공을 받으려고 매트에서 일어나면 탈락하며, 정해진 시간 동안 더 많이 받은 사람이 승리합니다.</p>
