<h1>마리오 파티 피트니스 브레인 브레이크</h1>
<p>1) 다가올 미니게임에 대한 질문을 읽고 질문에 가장 알맞은 답이라고 생각하는 캐릭터를 고른다. 2) 자신이 선택한 캐릭터에 지정된 운동 동작을 20초 동안 수행한다. 3) 미니게임 영상을 시청하며 화면 측면의 마리오 동작을 따라 하고 자신의 캐릭터를 응원한다. 4) 선택한 답이 맞으면 3점을 획득하고 게임 내내 점수를 누적해 기록한다.</p>
