<h1>좁은 공간 활용 신체놀이 모음</h1>
<p>1) 손을 잡고 원을 만들어 동요에 맞춰 발을 벌려 뛰는 신체 놀이를 합니다. 2) 온몸으로 가위바위보를 하고 결과에 따라 정해진 동작(점프, 달리기 등)을 수행합니다. 3) 2명이 등을 맞대고 팔짱을 낀 채 동시에 힘을 주어 일어서거나, 신문지 봉을 손바닥 위에 올려 중심을 잡으며 걷습니다. 4) 바닥에 발로 원을 그린 뒤 선을 따라 뛰거나 원 안에서 밀어내기·모자 뺏기 놀이를 진행합니다.</p>
