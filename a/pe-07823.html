<h1>통나무 위의 개미</h1>
<p>1) 바닥의 선(통나무) 위에 학생들이 올라서고 각자 번호를 부여받는다. 2) 교사가 두 번호를 부르면 해당 번호의 두 학생은 선 밖으로 벗어나지 않고 서로 자리를 맞바꾼다. 3) 두 모둠으로 나뉘어 협동하거나 어느 팀이 먼저 전원 자리를 바꾸는지 경쟁할 수도 있다.</p>
