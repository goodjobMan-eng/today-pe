<h1>태풍 쫓기 (원형 공 돌리기 추월 오래달리기)</h1>
<p>1) 접시콘을 운동장에 둥글게 원형으로 배치하고 팀 조끼를 입은 2개 팀(또는 4개 팀)으로 나눈다.2) 각자 콘 위치에 서서 시작 신호에 맞춰 낮고 빠르게 같은 방향으로 공을 패스하며 한 칸씩 이동한다.3) 공을 패스하면서 원을 돌아 앞서가는 상대 팀 공을 지나쳐 추월하면 승리한다.</p>
