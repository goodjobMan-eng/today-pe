<h1>다운볼 (핸드볼/포스퀘어 변형)</h1>
<p>1) 킹(King), 퀸(Queen), 잭(Jack), 던스(Dunce) 4개 구역으로 나뉘며 킹이 서브로 경기를 시작한다. 2) 공을 칠 때는 반드시 자신의 구역에 먼저 한 번 바운드시킨 후 상대방 구역으로 넘어가 바운드되도록 손으로 쳐야 한다. 3) 자신의 구역에 먼저 튀기지 않고 상대 구역으로 바로 넘기면 파울(풀)이 선언되며, 실점한 사람은 가장 아래 칸(던스)으로 가고 다른 사람들이 한 단계씩 승급한다.</p>
