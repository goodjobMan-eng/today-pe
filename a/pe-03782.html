<h1>농구 럭키맨 존 게임</h1>
<p>1) 농구 등 골형 게임을 할 때 사이드라인 바깥쪽에 '럭키맨 존'을 설정한다. 2) 게임 진행에 따라 럭키맨 역할을 하는 학생을 교대한다. 3) 럭키맨 존에는 럭키맨만 들어갈 수 있으며, 럭키맨이 된 학생은 드리블을 하지 않고 공을 들고 달려서 운반할 수 있다.</p>
