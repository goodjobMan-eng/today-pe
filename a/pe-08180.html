<h1>제자리멀리뛰기 기초 연습</h1>
<p>1) 바닥에 출발 마커를 두고 양발을 어깨너비로 벌리고 선다. 2) 팔을 뒤에서 앞으로 힘차게 스윙하며 다리를 굽혔다가 빠르게 펴며 양발로 뛰어오른다. 3) 착지 매트에 부드럽게 무릎을 굽히고 발바닥 전체로 균형을 잡으며 양발로 착지한다. 4) 친구들의 점프 동작을 관찰하며 서로 피드백을 주고 연습 후 기록 향상 정도를 측정한다.</p>
