<h1>말없이 공을 주고받는 사일런트 볼</h1>
<p>1) 학생들은 교실이나 체육관에 이동하지 않고 제자리에 분산해 서서 준비합니다. 2) 게임이 시작되면 말을 하지 않고 조용히 서로에게 공을 안전하게 던져 패스합니다. 3) 공을 떨어뜨리거나 잘못 던지거나 말을 하면 실격되어 팔굽혀펴기나 점핑잭 5회를 수행해야 복귀합니다. 4) 숙달되면 던지는 공의 개수를 2~3개로 늘려 난이도를 높입니다.</p>
