<h1>초등 체육 기본 준비운동</h1>
<p>1) 양발을 모으고 서서 손목과 발목을 좌우 번갈아 가며 부드럽게 돌린다. 2) 양손을 무릎에 올리고 무릎을 모아 안팎으로 돌린 뒤, 다리를 벌려 무릎을 작게 누르고 크게 누르며 늘려준다. 3) 다리를 넓게 벌려 기마 자세를 취하고 손으로 무릎을 짚은 채 몸통을 좌우로 비튼다. 4) 한 발을 앞으로 내딛고 뒷다리의 아킬레스건을 늘려준 뒤, 허리 돌리기와 어깨 돌리기, 목 돌리기로 마무리한다.</p>
