<h1>사랑의 배터리 게임</h1>
<p>1) 학생들은 지우개, 자, 필통, 포스트잇 등 학용품을 손바닥과 손등을 제외한 신체 부위(머리, 팔, 어깨 등)에 올린다. 2) 물건이 올려진 상태에서는 자유롭게 교실을 움직이며 술래를 피해 도망간다. 3) 술래가 물건을 떨어뜨리거나 스스로 떨어뜨리면 그 자리에 멈춰 서서 움직이지 못한다. 4) 다른 친구가 술래를 피해 다가와 떨어진 배터리(학용품)를 원래 자리에 다시 올려주면 부활하여 움직일 수 있다.</p>
