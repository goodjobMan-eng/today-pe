<h1>폭풍 릴레이 (라 쿠르스 폴)</h1>
<p>1) 4개 팀이 사각형 경기장의 각 콘(진영) 뒤에 한 줄로 선다. 2) 출발 신호가 울리면 각 팀의 1번 주자가 모든 상대 진영 콘의 외곽을 한 바퀴 달린다. 3) 주자는 한 바퀴를 돈 뒤 경기장 중앙에 놓인 스카프 1개를 집어 자기 팀 진영 콘에 넣는다. 4) 다음 주자가 바통을 이어받아 동일하게 달리며, 중앙의 스카프가 모두 소진되었을 때 가장 많은 스카프를 모은 팀이 승리한다.</p>
