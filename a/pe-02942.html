<h1>디스크 훌라후프 골인</h1>
<p>1) 거리에 따라 훌라후프를 배치하여 점수를 정한다. 2) 백핸드나 포핸드 중 편한 그립으로 디스크를 던진다. 3) 훌라후프 안에 들어가거나 걸치면 점수를 획득한다. 4) 모든 팀원이 다 던진 후 합산 점수가 가장 높은 팀이 승리한다.</p>
