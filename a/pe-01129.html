<h1>두더지 패스 릴레이</h1>
<p>1) 모둠별로 일렬 종대로 서고 맨 앞 주자 맞은편에 리더 1명이 공을 들고 선다. 2) 리더가 맨 앞 주자에게 공을 패스하면 주자는 공을 받아 다시 리더에게 패스한 뒤 자리에 쪼그려 앉는다. 3) 뒤쪽 줄의 모든 팀원이 같은 방식으로 패스를 주고받고 앉으면, 맨 앞 주자가 새 리더가 되고 이전 리더는 줄 맨 끝으로 이동한다. 4) 모든 팀원이 리더 역할을 한 번씩 먼저 완료하고 제자리에 돌아오는 모둠이 승리한다.</p>
