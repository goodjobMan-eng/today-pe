<h1>슬라이드·갤럽·스킵 3가지 이동 운동</h1>
<p>1) 슬라이드는 옆으로 발을 내딛고 반대쪽 발을 끌어당긴다. 2) 갤럽은 발끝을 진행 방향으로 두고 앞발을 디딘 뒤 뛰어 발을 모은다. 3) 스킵은 한 발로 서서 홉으로 뛴 후 다른 발을 디디며 교대로 홉과 스텝을 반복한다.</p>
