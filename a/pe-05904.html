<h1>배구 스파이크 기술 익히기</h1>
<p>1) 전사의 자세로 서서 공을 칠 손을 뒤로 젖히고 반대 손은 앞을 향한다.2) 높은 점프를 뛰며 날아오는 공을 향해 손을 뻗는다.3) 주먹을 쥐지 않고 손바닥을 활짝 편 상태에서 가장 높은 타점의 공을 하이파이브하듯 때려 네트 너머로 넘긴다.</p>
