<h1>리듬 풍선 챌린지</h1>
<p>1) 각자 콘으로 표시된 개인 영역 안에서 풍선을 준비한다 2) 음악에 맞춰 몸을 이용해 풍선을 공중에 튕긴다 3) 음악이 멈추면 교사가 외치는 특정 신체 부위(손등, 발등 등) 위에 풍선을 올린다 4) 제시된 신체 부위로 3초 동안 풍선을 떨어뜨리지 않고 버티면 통과한다 5) 놀이 도중 다른 친구의 영역을 침범하지 않으며 풍선을 떨어뜨리면 다시 주워 도전한다</p>
