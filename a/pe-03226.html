<h1>보물을 지켜라 게임</h1>
<p>1) 바닥에 무인도와 섬 3개를 그리고 각 섬에 보물을 4개씩 넣는다. 2) 4명이 한 모둠이 되어 지킴이 1명, 탐험가 3명을 정한다. 3) 지킴이는 자기 보물을 지키고, 탐험가는 한 번에 하나씩 다른 섬의 보물을 자신의 섬으로 옮기며 지킴이에게 잡히면 보물을 두고 무인도로 간다. 4) 무인도의 팀원은 모둠 친구가 손을 쳐주면 복귀하며, 종료 후 섬의 보물 1개당 2점, 들고 있던 보물은 1점으로 계산하여 가장 점수가 높은 모둠이 승리한다.</p>
