<h1>배려 탁구: 푸시 푸시</h1>
<p>1) 반코트에서 10~15cm 높이로 공을 떨어뜨려 바운드된 공을 백핸드·포핸드 푸시로 반대편 목표물(라켓·종이컵·스피드스택스 컵)에 맞힌다. 2) 푸시 기술로 반대편 코트의 계란판에 공을 넣어 빙고 한 줄을 완성한다. 3) 파트너와 10회 연속 푸시 랠리를 이어가거나 3~4명이 순서대로 공을 치는 한마음 푸시 릴레이를 진행한다. 4) 양손에 라켓을 각각 1개씩 들고 11점을 먼저 얻는 투라켓 경기를 진행한다.</p>
