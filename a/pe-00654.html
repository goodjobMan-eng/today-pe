<h1>싱크로 매트 운동(집단 매트 표현 활동)</h1>
<p>1) 체조 매트 여러 장을 넓게 이어 붙인 공간에서 4~5명이 한 모둠을 이룹니다. 2) 음악에 맞춰 앞구르기, 뒤구르기, 다리 벌려 구르기, 물구나무서기 등의 매트 기술을 동시에 수행합니다. 3) 각자 또는 짝과 함께 균형 잡기(한 발 서기, 옆으로 버티기 등)와 조형 동작을 선보이며 대형을 바꿉니다. 4) 모둠원 전체가 호흡과 타이밍을 일치시켜 한 편의 체조 안무를 완성합니다.</p>
