<h1>용암 강 건너기 징검다리 균형 놀이</h1>
<p>1) 바닥 전체에 수십 개의 원마커를 징검다리 형태로 흩어 배치하고 출발선과 도착선을 정한다. 2) 바닥을 용암으로 가정하여 원마커만 밟으며 균형을 잡고 끝까지 전진한다. 3) 발이 바닥에 닿지 않고 도착지점에 도달할 때마다 연결 블록 등 점수 획득용 아이템을 1개씩 획득한다. 4) 원마커 간격을 넓히거나 모둠별 제한 시간 릴레이로 변형하여 난이도를 조절할 수 있다.</p>
