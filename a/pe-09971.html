<h1>필드형 야구 변형 게임 수업</h1>
<p>1) 3~4명이 모여 드라이브, 플라이볼, 그라운드볼로 구분하여 캐치볼을 진행한다. 2) 4명 전후로 모둠을 구성하여 캐치볼, 1루 송구, 홈 연결, 배팅 연습의 역할을 순환한다. 3) 4루까지 베이스를 만들고 모든 학생이 수비에 참여하며 타순에 따라 한 명씩 들어와 타격하는 경기를 진행한다.</p>
