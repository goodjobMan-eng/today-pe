<h1>방향 전환 달리기 게임</h1>
<p>1) 양쪽에 T자 모양으로 콘 5개씩 대칭 배치한다.2) 4인 1모둠으로 구성하여 대칭 지점의 1번 주자가 대기한다.3) 신호에 맞춰 콘을 좌우로 지그재그 돌며 달린다.4) 출발점으로 돌아와 대기 주자와 손 태그를 하고 다음 주자가 출발한다.5) 8바퀴를 먼저 뛰거나 도중에 상대 모둠을 따라잡으면 승리한다.</p>
