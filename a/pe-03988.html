<h1>감정 웰니스 휠 돌리기 놀이</h1>
<p>1) 판지나 종이접시에 다양한 진정 활동(팔벌려뛰기, 퍼즐 맞추기, 심호흡 5회 등)을 적어 휠을 만든다. 2) 압정과 지우개, 클립을 연결하여 가운데에 회전판 스피너를 완성한다. 3) 스트레스를 받거나 휴식이 필요할 때 스피너를 돌린다. 4) 클립이 가리키는 활동을 실천하여 마음을 가라앉힌다.</p>
