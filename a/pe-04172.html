<h1>오버핸드 던지기와 받기 기초</h1>
<p>1) 던지는 손의 반대쪽 어깨와 발을 목표물을 향해 위치시키며 선다. 2) 반대쪽 발을 앞으로 내딛고 골반을 회전시키며 팔꿈치를 앞세워 던진다. 3) 공을 받을 때는 양손 새끼손가락을 모아 바구니 모양을 만들어 몸 쪽에서 잡는다. 4) 숙련되면 양손으로 창문 모양 삼각형을 만들어 날아오는 공을 잡는다.</p>
