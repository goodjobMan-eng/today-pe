<h1>훌라후프 버블 카 공간 지각 놀이</h1>
<p>1) 훌라후프 안쪽에 들어가 자동차 운전대처럼 잡고 자신의 안전 공간(버블)을 만든다. 2) 걷기, 조깅, 스킵, 갤럽 등의 이동 동작을 하며 체육관 안을 안전하게 이동한다. 3) 다른 사람과 부딪히거나 몸이 닿으면 자동차를 주차하듯 훌라후프 안에 주저앉아야 한다. 4) 벽에 붙은 그림(주유소 등)을 찾아가 물을 마시거나 방문하는 변형 활동을 하거나 두 명이 한 차를 타고 이동할 수 있다.</p>
