<h1>슛 앤 래더스</h1>
<p>1) 6개 팀으로 나누어 홈 베이스 바구니(작은 콘 8개 보관), 4개의 원마커 경로, 결승선인 훌라후프를 배치한다. 2) 모든 학생이 농구공을 가지고 배정된 골대로 드리블해 가며 각자 3번씩 슛을 시도한다. 3) 슛 시도 후 홈 베이스 바구니로 복귀하여 자신이 성공한 슛 개수만큼 말(콘)을 마커 칸을 따라 이동시킨다. 4) 4칸을 지나 훌라후프에 도달한 말은 고정되며, 팀의 8개 말을 먼저 모두 훌라후프에 넣는 팀이 승리한다.</p>
