<h1>판토마임 놀이</h1>
<p>1) 학생들이 짝을 지어 두 줄로 마주 보고 선다. 2) 한 그룹이 교사로부터 과제(인물, 동물 등)를 받아 판토마임으로 몸짓 표현을 한다. 3) 이어 학생들이 스스로 대상을 정해 표현하면 짝이 그것을 맞힌다. 4) 심화 변형으로 4글자 단어를 생각한 뒤 각 글자를 판토마임으로 하나씩 표현하고 짝이 단어를 조합해 맞히면 역할을 바꾼다.</p>
