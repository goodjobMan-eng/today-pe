<h1>순발력 1대 1 축구 게임</h1>
<p>1) 10m 거리를 두고 공 2개와 골대 2개를 마주 보게 설치한 뒤 양 선수가 경례한다.2) 신호가 울리면 각자 작은 원을 한 바퀴 돈 뒤, 자기 골대 쪽으로 달려가 크게 한 바퀴를 돌아온다.3) 먼저 도착한 사람이 자기 공을 상대 골대로 슈팅하고, 늦게 도착한 사람은 골키퍼가 되어 막는다.4) 골을 막아내면 막은 선수가 자기 공으로 달려가 슈팅할 수 있으며, 공은 한 번씩만 차고 먼저 3점을 내면 승리한다.</p>
