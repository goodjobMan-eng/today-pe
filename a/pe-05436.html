<h1>공기놀이 - 설마 빨강은 아니지?</h1>
<p>1) 각자 다른 색깔의 공기알을 손에 쥐고 색을 숨긴 채 짝과 만납니다.2) 발가위바위보 등을 하여 이긴 사람이 주도권을 잡습니다.3) 이긴 사람이 &quot;설마 (특정 색)은 아니지?&quot;라고 외치며 상대방의 색을 추측합니다.4) 상대방이 그 색깔을 쥐고 있었다면 공기알을 뺏어오고, 제한 시간 동안 가장 많은 공기를 모은 사람이 승리합니다.</p>
