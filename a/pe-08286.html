<h1>매직 태그 (Magic Tag)</h1>
<p>1) 정해진 구역 안에서 술래 2명(마법사)에게 팀 조끼를 입힌다. 2) 술래를 피해 달아나며, 술래에게 태그된 사람은 팔을 위로 모아 마법 지팡이 동작으로 멈춘다. 3) 다른 도망자 2명이 얼어붙은 사람 주위를 원으로 둘러싸고 '아브라카다브라'를 외치면 마법이 풀려 다시 게임에 참여한다.</p>
