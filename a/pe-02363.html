<h1>평균대에서 가위바위보</h1>
<p>1) 반 전체를 두 모둠으로 나누고 각 모둠은 평균대 양쪽 끝에 섭니다. 2) 모둠별로 순서를 정하고, 첫 번째 모둠원이 평균대에 올라 상대 모둠원과 가위바위보를 합니다. 3) 가위바위보에서 이긴 사람은 평균대 위에 남고, 진 사람은 평균대에서 뛰어내립니다. 4) 이긴 모둠원은 다음 상대와 계속 가위바위보를 진행하여 마지막까지 남은 모둠이 이깁니다.</p>
