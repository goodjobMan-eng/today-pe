<h1>주사위 운동 게임 (Movin' 4 Money)</h1>
<p>1) 체육관 사방에 1~4번 콘을 배치하고 학생들은 각자 주사위를 굴린다. 2) 나온 주사위 눈금에 해당하는 번호의 콘으로 이동하며, 5나 6이 나오면 다시 굴리거나 원하는 콘을 선택한다. 3) 콘에 도착한 후 지정된 준비운동(팔벌려뛰기, 팔 돌리기 등 10초간)을 수행한다. 4) 시간 종료 후 룰렛을 돌려 당첨된 번호 콘에 서 있는 학생들이 해당 금액의 장난감 지폐를 은행에서 획득한다.</p>
