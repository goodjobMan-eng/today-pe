<h1>모두 함께 점프 (마주보고 스텝 따라하기)</h1>
<p>1) 두 사람이 마주보고 서서 한 사람이 먼저 스텝 동작을 시작한다. 2) 쫓아가는 상대방은 한 박자 늦게(원 템포 늦게) 같은 동작으로 스텝을 따라 한다. 3) 스텝을 한 뒤에는 반드시 원래 위치로 되돌아오는 스텝을 넣는다. 4) 동작에 익숙해지면 리듬을 빠르게 바꾸거나 한 발 뛰기 등 자세를 다양하게 변형하여 진행한다.</p>
