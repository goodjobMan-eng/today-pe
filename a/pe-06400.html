<h1>신학기 스톰프 선택 신체활동</h1>
<p>1) 제시되는 학교 관련 밸런스 질문 중 자신이 원하는 선택지를 고른다.2) 화면 트랙의 버튼이 플레이 존에 들어오는 박자에 맞추어 지정된 동작을 수행한다.3) 빨간색은 왼발 구르기, 노란색은 오른발 구르기, 빨강·노랑 동시는 점프, 파란색은 박수, 보라색은 허벅지 치기를 한다.4) 달리기, 점프, 피하기, 숙이기, 치기 등 지각 위기 탈출 동작을 화면에 맞춰 수행한다.</p>
