<h1>비닐봉지 지키며 빙글빙글 회전 태그</h1>
<p>1) 도망치는 사람과 비닐봉지를 빼앗는 사람의 역할을 정한다. 2) 도망치는 사람은 비닐봉지를 양발 사이에 끼우고 제자리에서 빙글빙글 돌며 비닐봉지를 지킨다. 3) 빼앗는 사람은 도망치는 사람 주변을 이동하며 비닐봉지를 빼앗으려 시도한다. 4) 제한 시간 안에 비닐봉지를 빼앗으면 빼앗는 사람의 승리, 빼앗지 못하면 도망치는 사람의 승리가 되며 역할을 바꾸어 진행한다.</p>
