<h1>체육 전신 스트레칭 루틴</h1>
<p>1) 한쪽 팔을 펴서 엄지를 바닥으로 향하게 한 뒤 가슴 쪽으로 당겨 팔 뒤쪽을 10초간 늘린다. 2) 등 뒤로 깍지를 끼고 팔을 펴 가슴을 밀어내며 상체를 10초간 늘린다. 3) 두 발을 모으고 서서 한쪽 발을 뒤로 접어 발등을 잡고 뒤꿈치를 엉덩이에 붙여 허벅지 앞쪽을 늘린다. 4) 매트에 앉아 한쪽 무릎을 접어 반대쪽 다리 바깥으로 넘긴 뒤 가슴으로 끌어안아 엉덩이 근육을 늘린다.</p>
