<h1>뛰어 뛰어 점프 챌린지 (SALTA SALTA)</h1>
<p>1) 두 명씩 짝을 지어 한 명은 줄넘기를 잡고, 다른 한 명은 바닥에 놓인 훌라후프 앞에 선다. 2) 1분 동안 줄넘기 주자는 줄넘기를 넘은 횟수를 세고, 훌라후프 주자는 후프 사이를 양발 모아 점프하며 횟수를 센다. 3) 1분이 지나면 각자 뛴 점프 횟수를 합산·비교하여 누가 더 많이 뛰었는지 겨룬다.</p>
