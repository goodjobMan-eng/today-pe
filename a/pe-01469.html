<h1>지시 반응 턴 대시</h1>
<p>1) 출발선에 콘을 두고 주자는 교사(신호자)를 바라보며 가벼운 제자리 러닝 자세로 준비합니다. 2) 신호자가 손가락으로 오른쪽이나 왼쪽을 가리키면, 주자는 지시한 방향을 보고 빠르게 회전하여 전방 콘까지 전력 질주합니다. 3) 바른 방향으로 정확하고 빠르게 회전하여 목표 콘에 먼저 도달하면 득점합니다. 4) 지시한 방향의 반대쪽으로 회전하기, 양손 지시 후 특정 손 규칙 적용하기 등 신호 조건을 복합화하여 변형합니다.</p>
