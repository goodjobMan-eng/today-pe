<h1>컵-탁-퐁 릴레이</h1>
<p>1) 모둠원들이 컵을 들고 일렬로 선다.2) 첫 번째 주자가 탁구공을 컵으로 튕겨 넘기며 뒤로 전달한다.3) 공이 맨 뒤 주자에게 전달되면 공을 가지고 반환점을 돌아와 원래 자리로 이동한다.4) 팀원 수가 맞지 않으면 한 사람이 한 번 더 참가한다.</p>
