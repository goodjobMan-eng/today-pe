<h1>비밥볼 전신 움직임 놀이</h1>
<p>1) 공기가 팽창된 대형 비밥볼 속에 몸을 집어넣고 선다.2) 누웠다 일어나기, 옆으로 구르기, 다리와 팔까지 완전히 안에 넣고 몸 굴리기 동작을 차례로 시도한다.3) 교사의 신호에 따라 슬로우 모션 걷기, 거북이 신호에 웅크려 숨기, 곰 흉내 내며 네 발로 걷기 등 동물 모방 움직임을 수행한다.</p>
