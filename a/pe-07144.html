<h1>강 건너뛰기 (Jump The River)</h1>
<p>1) 줄넘기 두 줄을 1~2피트 간격으로 바닥에 나란히 놓아 강을 만든다. 2) 줄 선 순서대로 한 명씩 도움닫기하여 뛰어올라 강(줄 사이)을 건너뛴다. 3) 건너뛰기에 성공하면 반대편으로 넘어가고, 줄 사이 강에 닿거나 빠지면 탈락하여 앉아서 대기한다. 4) 모든 주자가 성공하면 줄넘기 사이 간격을 약 반 피트 넓힌 뒤 반대 방향으로 계속 도전한다. 5) 마지막 한 명의 성공자가 남을 때까지 반복한다.</p>
