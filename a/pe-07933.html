<h1>미션 달리기 게임</h1>
<p>1) 2~3개의 모둠이 출발선에 서서 준비한다. 2) 각 모둠의 첫 번째 주자는 엉덩이 차며 달리기, 두 번째 주자는 다리 밑으로 손뼉 치기, 세 번째 주자는 무릎 굽히며 걷기로 콘을 돌아온다. 3) 출발 신호와 함께 첫 번째 주자가 출발하여 콘을 돌아온다. 4) 마지막 친구가 먼저 돌아오는 모둠이 승리한다.</p>
