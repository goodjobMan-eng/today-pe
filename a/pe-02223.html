<h1>티볼 공 잡기(포구법) 기초 연습</h1>
<p>1) 공을 던지지 않는 손에 글러브를 착용하고 공이 들어오는 순간 손가락을 오므려 글러브를 닫는다. 2) 땅볼은 발을 어깨너비보다 넓게 벌리고 자세를 낮춰 발끝보다 앞에서 잡으며 오른손으로 덮어준다. 3) 뜬공은 글러브를 위로 올려 얼굴 약간 왼쪽에서 잡은 뒤 오른손으로 글러브 옆을 받쳐준다. 4) 2인 1조로 마주보고 땅볼과 뜬공을 주고받거나 벽에 던져 나오는 공을 잡는 연습을 한다.</p>
