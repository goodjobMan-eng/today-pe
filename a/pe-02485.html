<h1>카드 뒤집기 놀이</h1>
<p>1) 바닥에 양면 색상이 다른 카드들을 넓게 펼쳐 놓는다. 2) 가위바위보를 하여 팀별로 담당할 카드 색상을 선택한다. 3) 호각 소리와 함께 출발하여 30초 동안 자신의 팀 색상이 위로 오도록 카드를 뒤집는다. 4) 호각이 울리면 즉시 손을 떼고 정지하며, 1인 대결, 2인 대결, 3인 대결 방식으로 전체 인원이 모두 한 번씩 참여한다.</p>
