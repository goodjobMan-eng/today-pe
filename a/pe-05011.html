<h1>트램펄린 기본 3단계 점프 기술</h1>
<p>1) 발바닥으로 가볍게 리듬을 타며 수직으로 높이 점프한다.2) 손을 앞으로 향하게 짚으며 엉덩이로 트램펄린 바닥에 닿았다가 반동으로 일어선다.3) 엎드린 자세로 배를 대고 튕겨 오른 뒤, 엉덩이 착지와 연속으로 연결하여 점프한다.</p>
