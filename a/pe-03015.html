<h1>점퍼 공 전달 릴레이 놀이</h1>
<p>1) 두 명씩 짝을 지어 1개의 점퍼 양 끝을 잡고 교실 책상 가장자리 통로에 둘러선다. 2) 시작 신호와 함께 점퍼 위에 공 1개를 올리고 손을 사용하지 않은 채 점퍼에서 점퍼로 공을 넘겨 전달한다. 3) 공이 바닥에 떨어지면 공을 주워 떨어진 위치의 점퍼에 다시 올려 활동을 이어간다. 4) 공은 바로 옆의 점퍼로만 이동해야 하며(두 칸 넘어가면 반칙), 일정 횟수(5바퀴)를 먼저 돌리거나 완주 시간이 더 짧은 팀이 승리한다.</p>
