<h1>바닥 선과 마커를 활용한 스텝 및 균형 운동</h1>
<p>1) 바닥의 직선이나 곡선을 따라 발끝을 세우거나 뒤로 걸으며 균형을 잡고 이동한다. 2) 바닥 선을 사이에 두고 양발 모아뛰기나 한 발 뛰기로 앞뒤·좌우로 점프한다. 3) 바닥에 놓인 원마커나 선의 형태를 따라 걸으며 공을 발로 차거나 굴린다. 4) 머리 위로 공을 들고 원마커를 밟으며 이동한다.</p>
