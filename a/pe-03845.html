<h1>유산소 공 발운동 챌린지</h1>
<p>1) 공을 바닥에 두고 양발을 모아 좌우로 뛰어넘는다. 2) 오른발과 왼발을 번갈아 가며 한 발씩 공 위를 뛰어넘는다. 3) 공 뒤에 서서 왼발과 오른발로 번갈아 공을 밟아 멈춘다(트래핑). 4) 양발 사이에 공을 끼우고 공중으로 뛰어오른 뒤 손으로 공을 잡는다.</p>
