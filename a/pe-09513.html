<h1>풍선 터뜨리기 놀이</h1>
<p>1) 참가자들의 발목에 풍선을 하나씩 묶고 음악에 맞춰 춤을 춘다. 2) 음악이 멈추거나 신호가 울리면 다른 사람의 발목에 묶인 풍선을 발로 밟아 터뜨린다. 3) 마지막까지 풍선이 터지지 않고 살아남은 사람이 승리한다.</p>
