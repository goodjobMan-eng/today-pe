<h1>스피드 콘 뒤집기 (팀 대항 콘 배틀)</h1>
<p>1) 활동 공간에 접시콘을 반은 바로 세우고 반은 엎어 놓습니다. 2) 양 팀으로 나뉘어 한 팀은 세우는 역할, 다른 팀은 뒤집는(엎는) 역할을 맡습니다. 3) 신호가 울리면 정해진 시간 동안 콘을 부지런히 뒤집습니다. 4) 종료 휘슬 후 자기 팀 방향의 콘이 더 많은 팀이 이깁니다.</p>
