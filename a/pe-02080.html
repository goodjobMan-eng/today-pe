<h1>수업에 적용한 핸들러</h1>
<p>1) 2명씩 2팀(총 4명)으로 코트에 마주 보고 준비합니다. 2) 가위바위보로 선공을 정한 뒤, 점수가 0점이나 짝수면 오른쪽, 홀수면 왼쪽에서 대각선 방향으로 서브하여 경기를 시작합니다. 3) 원바운드 또는 노바운드로 한 번에 네트 너머 상대 코트로 셔틀콕을 넘겨 랠리를 이어갑니다. 4) 서브를 넣은 팀이 득점하면 동일한 학생이 계속해서 서브를 넣으며, 15점을 먼저 얻은 팀이 승리합니다.</p>
