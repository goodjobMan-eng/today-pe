<h1>스피드 슈즈 이어달리기 (Speed Shoes)</h1>
<p>1) 경기장 반대편 끝에 참가자들의 신발을 모두 벗어 모아두고 두 팀으로 나뉘어 일렬로 섭니다. 2) 신호가 울리면 각 팀 첫 번째 주자가 신발 더미로 달려가 자신의 신발을 찾아 신습니다. 3) 신발을 완전히 신고 자기 진영 출발선을 통과하면 다음 주자가 출발하며, 모든 팀원이 먼저 신발을 신고 돌아온 팀이 승리합니다.</p>
