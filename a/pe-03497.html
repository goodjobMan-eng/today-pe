<h1>매트 뒤구르기 연습</h1>
<p>1) 매트에 앉아 무릎을 가슴 쪽으로 당기고 양손을 얼굴 옆으로 가져가 준비한다. 2) 무게 중심을 뒤꿈치로 옮기며 몸을 힘차게 뒤로 밀어 구른다. 3) 엉덩이, 허리, 등, 어깨, 양손, 머리 순으로 매트에 닿게 하며 턱을 당겨 몸을 둥글게 유지한다. 4) 양손으로 귀 옆 매트를 힘있게 밀어내며 양발이 닿을 때 일어선다.</p>
