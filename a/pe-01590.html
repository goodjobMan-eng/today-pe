<h1>호루라기 반응 순발력 게임</h1>
<p>1) 교사의 신호 전까지 바닥에 앉거나 엎드려 팔 돌리기, 다리 들기 등 지정된 체조 동작을 지속한다. 2) 교사가 호루라기를 부는 순간 동작을 멈추고 신속하게 양발과 손을 모아 바르게 선다. 3) 교사보다 더 빠르게 일어서는 데 성공했는지 확인하며 순발력을 측정한다. 4) 앉은 상태뿐만 아니라 제자리 조깅, 점핑잭, 스쿼트 등 서 있는 운동을 하다가 호루라기 소리에 빠르게 바닥에 앉는 규칙으로 변형해 진행한다.</p>
