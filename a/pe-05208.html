<h1>동물 걸음 술래잡기</h1>
<p>1) 술래에게 태그된 사람은 동물원 콘 구역으로 간다.2) 정해진 동물 걸음(토끼 뜀뛰기 등)을 하며 정지 표지판 콘까지 이동한다.3) 정지 표지판에 도달하면 다시 게임에 참여하여 달린다.4) 동물 표지판은 몇 분마다 변경된다.</p>
