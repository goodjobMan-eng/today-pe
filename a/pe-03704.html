<h1>홈런 더비</h1>
<p>1) 4명에서 6명으로 팀을 만들고 티 스탠드와 배트를 팀 수만큼 준비한다. 2) 티 스탠드를 가로 1열로 늘어놓고 홈런 라인을 긋고 공은 뒤쪽에 둔다. 3) 시작 신호에 팀의 첫 번째 주자가 달려가 공을 가져와 티 스탠드에 놓고 치며, 치면 다음 사람이 공을 가지러 달린다. 4) 공이 없어질 때까지 반복하여 홈런 라인을 넘긴 공의 수가 많은 팀이 이긴다.</p>
