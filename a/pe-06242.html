<h1>2루 발야구</h1>
<p>1) 홈, 1루, 2루의 세 개 베이스를 설치하고 투수가 공을 굴리면 타자(공격수)가 공을 찬다.2) 수비수가 찬 공을 바로 잡으면 플라잉 아웃이며, 파울이 3번이면 아웃된다.3) 공을 찬 타자는 1루까지만 진루할 수 있고, 기존 1루 주자는 2루까지 한 번에 진루할 수 있으며 모든 공격수가 공격 후 공수 교대한다.</p>
