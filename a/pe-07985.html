<h1>펜싱 플뢰레 휴지 챌린지</h1>
<p>1) 뚜껑이 있는 볼펜을 펜싱 검처럼 쥐고 풀리지 않게 테이프를 붙인 휴지를 준비한다. 2) 휴지를 가볍게 위로 던져 반 바퀴 돌린다. 3) 떨어지는 휴지의 몸통 중앙 심 구멍에 펜을 정확히 꽂아 넣는다(초등학생 4회 성공).</p>
