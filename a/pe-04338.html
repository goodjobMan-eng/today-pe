<h1>가드 더 핀(Guard The Pin)</h1>
<p>1) 원형으로 서서 옆 사람을 제외한 친구에게 공을 패스한다 2) 공을 2개 이상으로 늘려 저글링하듯 패스한다 3) 원 중앙에 후프를 놓고 한 명은 후프 안에, 한 명은 수비로 서서 패스를 주고받는다 4) 후프 안의 사람 대신 핀을 세우고 핀을 쓰러뜨리면 역할을 교대한다</p>
