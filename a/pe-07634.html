<h1>문어 술래잡기</h1>
<p>1) 술래 1명(문어)은 중앙에 서고 나머지 학생들은 구역 한쪽에 한 줄로 선다. 2) 노래(&quot;올리 올리 바다의 문어, 나를 잡을 수 없어&quot;)를 부르고 난 뒤 반대편으로 달린다. 3) 문어에게 잡힌 학생은 그 자리에 앉는다. 4) 앉아 있는 학생은 자리를 이동하지 않고 앉은 상태에서 지나가는 학생을 태그해 잡을 수 있다.</p>
