<h1>번호 콘 터치 릴레이</h1>
<p>1) 모둠별로 일렬로 서고 활동 구역에 1번부터 6번까지 번호가 적힌 콘을 배치한다. 2) 출발 신호가 울리면 모둠의 첫 번째 주자가 달려나가 1번부터 6번 콘 상단을 차례대로 손으로 터치한다. 3) 6번 콘까지 터치한 주자는 출발선으로 돌아와 다음 주자와 하이파이브로 교대한다. 4) 모든 팀원이 정해진 순서대로 콘 터치를 먼저 완료한 팀이 승리한다.</p>
