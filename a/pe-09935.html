<h1>요시 게임</h1>
<p>1) 양 팀은 상대 진영 끝에 있는 매트로 태그당하지 않고 이동해야 합니다. 2) 상대 진영에서 태그당하면 그 자리에 앉아야 하며, 태그당하지 않고 매트에 도착한 팀원이 터치해주면 1명씩 안전하게 걸어서 복귀합니다. 3) 게임 진행이 느려지면 교사가 '요시!'라고 외치고, 앉아 있던 사람도 모두 일어나 자기 팀 매트로 전원 먼저 합류하는 팀이 승리합니다.</p>
