<h1>풍선 8가지 도전 과제</h1>
<p>1) 홈 스팟에 서서 풍선을 머리 바로 위 높이로 띄우고 두 손으로 잡는다. 2) 풍선을 띄운 뒤 오른손 손바닥으로 가볍게 치고 잡는다. 3) 왼손 손바닥으로 가볍게 치고 잡는다. 4) 스팟을 벗어나지 않고 한 손 치기, 팔꿈치 치기, 무지개 치기(양손 번갈아 치기) 등 다양한 방법으로 연속 터치에 도전한다.</p>
