<h1>리듬봇과 춤을 - 물방울 리듬 표현 활동</h1>
<p>1) 주변에서 들리는 소리(물방울 떨어지는 소리 등)에 귀를 기울이며 박자와 리듬을 탐색한다. 2) 리듬에 맞춰 1단계 제자리 걷기, 2단계 박수치기 동작을 익힌다. 3) 3단계 발차기, 4단계 통통 뛰기(점프), 5단계 다리 박수 동작을 순서대로 연결한다. 4) 익힌 기본 리듬 동작들을 조합하여 음악에 맞춰 자유롭게 몸으로 표현하며 춤을 춘다.</p>
