<h1>스포밴드 스트레칭과 근력 운동</h1>
<p>1) 스포밴드의 가장 바깥 구멍에 손이나 발을 끼우고 유지하며 어깨 스트레칭을 실시한다. 2) 가운데 구멍에 손을 넣고 가슴과 어깨 근육을 자극하며 단계별로 밴드를 벌려 당긴다. 3) 발에 밴드를 걸고 허리를 펴며 다리와 코어 근력을 단련하는 동작을 10회씩 반복한다. 4) 상체와 하체의 밸런스를 맞추기 위해 팔과 다리를 교차하여 밴드를 늘리는 복합 운동을 진행한다.</p>
