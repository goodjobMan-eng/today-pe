<h1>스포츠 스태킹 사이클 수행</h1>
<p>1) 업스태킹(피라미드 쌓기)으로 시작하여 다운스태킹(기둥 형태로 내리기)으로 마무리한다. 2) 반드시 오른손-왼손 또는 왼손-오른손 순서대로 번갈아 컵을 쌓는다. 3) 업스태킹을 진행한 방향과 다운스태킹을 진행하는 방향을 동일하게 맞춘다. 4) 사이클 종목은 3-6-3 스태킹으로 시작해 6-6 스태킹, 1-10-1 스태킹을 거쳐 다시 3-6-3 다운스태킹으로 마무리한다.</p>
