<h1>회전 종이 로켓 챌린지</h1>
<p>1) 종이를 말아 가운데에 테이프를 붙여 종이 로켓을 만든다. 2) 발을 모아 앞뒤로 한 번 점프한다. 3) 로켓을 쥔 손과 같은 쪽 발을 앞으로 내딛고 팔을 휘둘러 로켓 끝을 쳐서 공중으로 날린다. 4) 공중에서 회전하는 로켓을 한 손으로 잡으면 1점을 획득하며 1분 동안 점수를 모은다.</p>
