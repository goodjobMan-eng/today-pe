<h1>훌라후프 보치아 릴레이</h1>
<p>1) 각 팀은 보치아 공 5개를 받고 일렬로 선다. 2) 줄의 첫 번째 주자가 공을 굴려 바닥의 훌라후프 안에 멈추도록 시도한다. 3) 공이 후프 안에 들어가 머무르면 득점 처리되고 주자는 줄 뒤로 이동하며, 다음 주자가 다음 공을 굴린다. 4) 공이 후프 밖으로 나가면 주자가 직접 뛰어가 공을 주워 와 다음 주자에게 손으로 건네주고 다시 성공할 때까지 도전한다.</p>
