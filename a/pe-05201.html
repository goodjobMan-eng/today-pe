<h1>Pattern Warm-Up</h1>
<p>1) 콘 중 하나를 선택해 이동한다.2) 체육관을 두 바퀴 조깅한다.3) 팔굽혀펴기 등 해당 운동을 10회 하거나 체중을 10초간 버틴다.4) 조깅과 10회 운동 패턴을 3~4분간 반복한 뒤 스트레칭으로 마무리한다.</p>
