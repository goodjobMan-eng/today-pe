<h1>유소년 농구 드리블 훈련 7가지</h1>
<p>1) 앞뒤·좌우 전환 드리블과 다리 사이 드리블(2회-1회-연속)을 단계별로 연습한다. 2) 코트를 달리며 바운드마다 양손을 번갈아 튀기는 스피드 드리블과 급정지 동작을 익힌다. 3) 공 2개를 들고 짝의 움직임을 따라 하는 미러 드릴과 어깨 저항을 뚫고 치고 나가는 훈련을 한다. 4) 콘으로 좁힌 레인에서 수비수의 압박을 이겨내는 올코트 1대1 및 약한 손 드리블 1대1을 진행한다.</p>
