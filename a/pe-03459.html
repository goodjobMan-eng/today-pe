<h1>발로 고리 전달하기</h1>
<p>1) 여섯 명이 한 모둠을 이루어 나란히 앉거나 선다. 2) 발에 고리를 끼우고 균형을 잡으며 옆에 있는 모둠원에게 발에서 발로 고리를 전달한다. 3) 마지막 순서의 모둠원은 전달받은 고리를 바구니에 넣는다. 4) 도중에 고리를 떨어뜨리면 떨어진 자리에서 다시 시작하며, 정해진 시간 동안 가장 많은 고리를 옮긴 모둠이 이긴다.</p>
