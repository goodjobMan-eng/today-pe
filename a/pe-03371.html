<h1>몸과 마음이 개운해지는 스트레칭</h1>
<p>1) 숨을 천천히 내쉬며 각 스트레칭 동작을 10~15초 동안 유지하고 반복한다. 2) 한쪽 무릎을 구부려 한 손으로 발등을 잡고 엉덩이 쪽으로 들어 올려 허벅지를 늘린다. 3) 양팔을 머리 위로 뻗어 깍지를 끼고 좌우로 몸통을 굽히며, 팔을 펴 반대 팔꿈치로 눌러 어깨를 늘린다. 4) 친구와 마주 보고 상체를 숙여 서로 어깨를 누르거나, 손을 마주 잡고 안쪽 다리는 펴고 바깥쪽 다리를 구부려 늘린다.</p>
