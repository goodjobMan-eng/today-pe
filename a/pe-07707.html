<h1>풀 볼 (Poull Ball)</h1>
<p>1) 5명씩 구성된 두 팀이 55cm 크기의 큰 공으로 대결한다. 2) 패스를 통해 협동하여 양쪽 진영에 놓인 2개의 큐브 표적 중 하나를 공으로 맞춰 쓰러뜨린다. 3) 상대 수비가 한쪽 표적을 막으면 반대편 표적으로 이동해 공격할 수 있다. 4) 다른 선수의 손에 공이 있을 때는 공을 건드릴 수 없으며 큐브 주변 금지 구역에는 아무도 들어갈 수 없다.</p>
