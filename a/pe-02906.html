<h1>콘에서 콘으로 전달</h1>
<p>1) 두 팀으로 나눈 후 팀원들이 일렬로 서서 라바콘을 거꾸로 들고 준비한다. 2) 첫 주자가 라바콘 위에 올린 공을 던져 다음 주자에게 전달한다. 3) 다음 주자는 들고 있는 라바콘으로 던져진 공을 받아 다음 사람에게 다시 던져 끝까지 전달한다. 4) 공을 떨어뜨리지 않고 끝까지 전달한 후 돌아오는 거리를 정해 더 빨리 성공한 팀이 승리한다.</p>
