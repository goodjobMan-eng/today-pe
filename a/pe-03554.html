<h1>점점 더 높이 뛰어넘기</h1>
<p>1) 4명이 한 모둠을 이루고 높이 뛰는 순서를 정한다. 2) 가로대를 무릎 높이에 두고 순서대로 뛰어넘는다. 3) 무릎 높이에 성공하면 가로대를 엉덩이 높이, 배꼽 높이로 점차 높인다. 4) 가로대를 넘는 데 성공하면 무릎 높이는 1점, 엉덩이 높이는 2점, 배꼽 높이는 3점을 얻으며 모둠원의 점수를 모두 더해 가장 높은 모둠이 이긴다.</p>
