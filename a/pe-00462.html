<h1>오또또 (수건 줄다리기 균형 놀이)</h1>
<p>1) 두 사람이 발을 어깨너비로 벌리고 서로 마주 보고 서서 양손으로 두 장의 손수건(수건) 양 끝을 마주 잡습니다. 2) 발을 바닥에 굳건히 디딘 채 손수건을 당기거나 늦추면서 상대방의 균형을 무너뜨립니다. 3) 발이 바닥에서 움직이거나 손수건을 놓치면 패배합니다. 4) 인원을 늘려 다자간으로 진행하거나 양발 간격을 좁혀 난이도를 높일 수 있습니다.</p>
