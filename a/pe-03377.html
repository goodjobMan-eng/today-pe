<h1>구역 축구</h1>
<p>1) 경기장을 공격, 중간, 수비의 3개 구역(가, 나, 다)으로 나누고 골대를 설치한 뒤 두 모둠으로 나눈다. 2) 게임 시작 전 각자 맡은 역할을 정하고 정해진 구역에서 활동한다. 3) 공격 모둠은 다 지역에서 공을 차고 나 지역을 거쳐 가 지역으로 공을 몰거나 패스하며, 수비 모둠은 패스 길을 차단한다. 4) 공격 모둠이 가 지역에서 골대에 공을 차 넣어 득점한다.</p>
