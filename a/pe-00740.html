<h1>몸을 지탱하는 지지력 놀이와 뜀틀 기초</h1>
<p>1) 손바닥을 활짝 펴고 무릎을 바닥에서 뗀 채 곰 걸음(베어워크)으로 선을 따라 이동합니다. 2) 한쪽 다리를 번쩍 든 상태로 곰 걸음을 하거나 고무줄 거미줄을 넘어 옆돌기 기초를 연습합니다. 3) 개구리 점프처럼 양손을 짚고 다리를 벌려 손보다 앞쪽으로 착지하며 지탱하는 힘을 기릅니다. 4) 매트와 뜀틀(스펀지 뜀틀)에서 도움닫기 없이 손을 짚고 다리를 벌려 뛰어넘는 뜀틀 기초로 발전시킵니다.</p>
