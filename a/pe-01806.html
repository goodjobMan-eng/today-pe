<h1>스맥볼 농구 슛 대결 놀이</h1>
<p>1) 2~3인 1조로 짝을 짓고 농구 골대 앞 기준선에 마주 보고 선다. 2) 두 사람이 동시에 공을 바닥에 5회 드리블(저학년은 양손으로 공을 5회 찰싹 치기)한 뒤 공을 서로 맞부딪친다. 3) 부딪침 신호와 함께 골대로 달려가 슛을 시도하며, 먼저 골을 넣은 학생이 1점을 획득한다. 4) 먼저 3점을 득점하면 승리하며, 승리 후 다른 골대로 이동하거나 슛 거리를 넓히는 변형을 적용한다.</p>
