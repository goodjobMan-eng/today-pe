<h1>곤충 동작 기억하기 게임</h1>
<p>1) 화면에 나오는 바퀴벌레, 개미, 노린재 등 곤충별 지정 동작을 보고 따라 익힌다. 2) 안내에 맞춰 3개씩 묶인 곤충 동작을 순서대로 연결하여 기억하며 수행한다. 3) 모든 곤충 동작을 처음부터 끝까지 순서대로 이어서 몸으로 표현한다. 4) 무작위로 화면에 나타나는 곤충 사진을 보고 해당하는 동작을 알맞게 맞혀 수행한다.</p>
