<h1>골밑 슛 릴레이 드릴 게임</h1>
<p>1) 골대 좌우 양쪽에 일정 거리를 두고 공 여러 개를 배치하고, 두 팀(또는 2인 1조)이 각각 골대 한쪽을 맡습니다. 2) 시작 신호와 함께 바닥에 놓인 농구공을 차례로 집어 골밑 슛을 시도합니다. 3) 리바운드 후, 또는 슛 성공 여부와 관계없이 다음 공을 빠르게 주워 연속으로 슛을 이어갑니다. 4) 정해진 시간 동안 골을 더 많이 성공시킨 팀이 승리합니다.</p>
