<h1>체육 전 부상 예방 관절 스트레칭</h1>
<p>1) 손목과 발목 돌리기, 손발 털기, 몸 비틀며 팔 흔들기를 순서대로 실시한다. 2) 무릎 돌리기와 다리 짧게/길게 늘려주기, 런지 자세로 하체 관절을 풀어준다. 3) 허리 돌리기와 어깨 돌리기, 고개 돌리기로 몸통 상체를 풀어준다. 4) 깍지 껴 고개 숙이기와 턱 밀어 올리기, 목 당기기 및 어깨 늘리기로 마무리 스트레칭을 한다.</p>
