<h1>집콕 풍선치기</h1>
<p>1) 손바닥이 땅과 수평하게 닿도록 하여 풍선을 위로 올려 보내고, 손등이나 손바닥·손등 번갈아 치기를 연습한다. 2) 자주 쓰는 손 외에 반대 손(왼손)으로도 손바닥과 손등으로 번갈아 가며 풍선을 위로 쳐올린다. 3) 오른손과 왼손을 번갈아 가며 손바닥 또는 손등으로 풍선을 친다. 4) 풍선 두 개를 떨어뜨리지 않고 양손 또는 한 손으로 번갈아 치거나, 벽을 향해 손바닥·손등으로 벽치기를 한다.</p>
