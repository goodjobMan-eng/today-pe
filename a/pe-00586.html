<h1>철봉 뛰어오르기와 뛰어내리기</h1>
<p>1) 자신의 키에 맞는 높이의 철봉을 두 손으로 단단히 잡고 무릎을 굽혀 준비합니다. 2) 무릎을 힘차게 펴며 점프하여 배꼽이 철봉 높이를 넘어가도록 뛰어오릅니다. 3) 팔을 곧게 펴서 체중을 지탱한 뒤 다리를 앞뒤로 흔들어 반동을 만듭니다. 4) '하나, 둘, 셋' 리듬에 맞춰 뒤로 힘차게 밀며 착지 지점으로 뛰어내리고, 착지할 때는 무릎을 살짝 굽혀 충격을 흡수합니다.</p>
