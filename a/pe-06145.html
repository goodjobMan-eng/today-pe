<h1>종이컵 점프점프</h1>
<p>1) 종이컵 하나에 적당량의 물을 붓고, 그 안에 다른 종이컵을 겹쳐 띄운다.2) 맞은편에 목표 종이컵 3개와 골대용 종이컵 1개를 배치한다.3) 출발 신호에 맞춰 정해진 지점을 달려가 터치하고 돌아와 스쿼트 1회를 수행한다.4) 겹쳐진 종이컵 틈 사이로 입바람을 불어 컵을 날려 목표 컵 안에 넣는다.5) 3개의 컵을 넣을 때까지 왕복 달리기, 스쿼트, 바람 불기를 반복한다.</p>
