<h1>어질리티 래더 스텝 운동</h1>
<p>1) 어질리티 래더나 라인 마커, 콘으로 코스를 설치하고 1명씩 또는 짝과 함께 동작을 따라하며 이동한다. 2) 한 발로 칸 안팎을 지그재그로 뛰거나 양발을 모아 옆으로 뛰며 전진한다. 3) 한 칸에 양발을 차례로 딛고 지나가거나 안팎으로 뛰며 4박자 스텝을 밟는다. 4) 개구리 점프로 1~2칸을 뛰어넘거나 엉덩이를 비틀며 발을 교차하고 까치발로 균형을 잡으며 걷는다.</p>
