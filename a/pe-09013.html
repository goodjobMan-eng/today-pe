<h1>두 개의 골대 미니 핸드볼 게임</h1>
<p>1) 짝을 지어 마주 보고 앉거나 서서 한쪽은 골키퍼, 다른 쪽은 공을 가지고 골대를 향해 던집니다. 2) 신호에 따라 골대를 돌아 골키퍼를 향해 공을 던져 골을 넣습니다. 3) 두 명 모두 공을 가지고 동시에 공격과 수비를 하거나 골대를 일직선으로 배치하여 진행합니다.</p>
