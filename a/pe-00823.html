<h1>신발 던지기 놀이 (신발 과녁 맞히기)</h1>
<p>1) 출발선에 서서 자신의 발에 신은 신발을 벗어 지정된 구역이나 표적을 향해 날릴 준비를 합니다. 2) 신발을 목표 지점(훌라후프나 원마커)을 향해 날립니다. 3) 목표 지점 안에 신발이 들어가거나 가장 가깝게 안착하면 점수를 획득합니다. 4) 모둠별로 차례대로 던져 합산 점수가 높은 팀이 승리합니다.</p>
