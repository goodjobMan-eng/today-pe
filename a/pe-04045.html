<h1>덕 워커 균형 잡기 및 이동 레이스</h1>
<p>1) 덕 워커의 양쪽에 두 발을 올리고 무릎을 굽힌 채 등을 펴서 준비한다. 2) 제자리에서 좌우로 흔들며 중심을 잡는 연습을 한다. 3) 신호에 맞춰 출발하여 앞쪽에 놓인 콘의 왼쪽을 돌아 출발선으로 돌아오는 레이스를 진행한다. 4) 덕 워커를 뒤집어 올라선 뒤 360도 회전하거나 짝과 공을 주고받는 변형 활동을 한다.</p>
