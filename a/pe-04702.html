<h1>가위바위보 럼블 (후프 점령전)</h1>
<p>1) 4개 팀(팀당 5~6명)으로 나누어 팀 조끼를 입고, 바닥에 팀 색깔별로 훌라후프를 배치한다. 2) 학생들은 빈 후프에 들어가 수비하며 다른 팀원의 도전을 받으면 가위바위보 대결을 한다. 3) 가위바위보에서 이기면 후프를 차지하고, 패배한 학생은 다른 후프로 이동해 다시 도전한다. 4) 1분마다 경기를 중단해 일반 후프는 1점, 자기 팀 색상의 후프는 3점을 집계하여 합산한다.</p>
