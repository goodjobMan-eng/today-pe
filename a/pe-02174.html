<h1>공 튀기기</h1>
<p>1) 학급당 8명씩 4개 조(총 32명)를 구성하고 조별로 서서 차례대로 대기한다. 2) 첫 조는 공 튀기기 기구의 줄을 한 줄씩 잡고 팽팽하게 당겨서 선다. 3) 담임교사가 공을 판 위로 올려주면 머리 위로 공이 올라가게 튀기며, 공이 떨어지면 바로 다음 조가 들어와 줄을 잡고 이어간다. 4) 모든 조가 끝나고 공을 튀긴 횟수를 합산하여 순위를 매긴다.</p>
