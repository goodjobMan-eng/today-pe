<h1>흥부와 놀부 콩주머니 옮기기 게임</h1>
<p>1) 반 전체를 네 모둠으로 나누고 각 모둠의 후프 위치를 정한다. 2) 흥부 게임은 모둠별 콩주머니 5개씩을 두고 시작 신호와 함께 자신의 후프에서 상대 모둠 후프로 한 번에 1개씩 옮긴다. 3) 정해진 시간 동안 진행하여 콩주머니가 가장 적게 남은 모둠이 이긴다. 4) 놀부 게임은 가운데 후프 안의 콩주머니를 자신의 모둠 후프로 한 번에 1개씩 가져오며 가장 많이 모은 모둠이 이긴다.</p>
