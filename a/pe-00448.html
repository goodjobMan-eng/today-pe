<h1>신체 부위 씨름 놀이</h1>
<p>1) 두 명이 짝을 지어 안전 매트 위에 마주 보거나 등지고 섭니다. 2) 엉덩이 밀치기, 발바닥 밀기, 손바닥 밀치기 등 사전에 약속한 규칙을 정합니다. 3) 신호가 울리면 정해진 부위를 밀거나 당겨 상대의 중심을 무너뜨립니다. 4) 먼저 발의 위치가 바닥에서 떨어지거나 중심을 잃고 밀려난 사람이 패배합니다.</p>
