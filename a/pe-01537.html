<h1>보조 교구를 활용한 앞구르기 도전 놀이</h1>
<p>1) 매트 위에 발포스티롤 블록이나 스펀지봉을 가로 또는 세로 방향으로 놓아 장애물 구역을 준비한다. 2) 물개 자세나 손수레 자세로 매트 앞까지 전진한 뒤 교구 너머로 양손을 짚는다. 3) 엉덩이를 높이 들고 스펀지 교구를 건너뛰듯 안전하게 등을 대며 앞구르기를 완수하면 성공 스티커를 얻는다. 4) 익숙해지면 교구의 높이를 높이거나 살짝 점프하여 회전하는 뛰며 앞구르기로 난이도를 변형한다.</p>
