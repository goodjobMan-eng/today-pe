<h1>할로윈 체육 게임 모음</h1>
<p>1) '점핑 펌킨'은 술래가 뒤돌아볼 때 호박들이 점프해 다가가며 술래에게 걸리면 출발선으로 돌아간다.2) '그레이브야드 가드'는 가드들이 빈 무덤(콘 표시)을 지키고 미라는 비어 있는 무덤으로 이동을 시도한다.3) '좀비 태그'는 좀비가 사람들을 쫓고 잡힌 사람은 좀비가 되며 의사를 추가해 사람으로 되돌릴 수도 있다.4) '엔터 더 캐슬'은 드라큘라나 마녀가 2명의 수비수가 지키는 3개의 문 중 하나로 침투를 시도한다.</p>
