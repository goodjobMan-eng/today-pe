<h1>피라미드 달리기</h1>
<p>1) 두 모둠으로 나누어 각각 대장을 정하고, 한 모둠은 피라미드 대형 원판에 서고 다른 모둠은 출발선에 정렬한다. 2) 신호가 울리면 수비 첫 줄 인원수만큼 공격 주자가 달려가 1대1 가위바위보를 한다. 3) 가위바위보에서 이기면 다음 줄로 이동해 대결하고, 지면 출발선 맨 뒤로 돌아가며 다음 주자가 출발한다. 4) 피라미드 꼭대기의 대장까지 이기면 1점을 얻고, 정해진 시간 후 공수를 교대한다.</p>
