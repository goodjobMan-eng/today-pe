<h1>윈터 챌린지 5종 경기</h1>
<p>1) 썰매견 달리기: 매트(부직포 타일)에 탄 한 명을 두 명이 콘까지 끌고 왕복하며 5분간 바퀴 수를 센다. 2) 미니 바이애슬론: 훌라후프 안에서 뜀틀 상자로 테니스공 6개를 던져 모두 넣을 때까지 주자가 교대한다. 3) 아이스하키 슬라롬: 공을 몰고 콘 사이를 통과한다. 4) 퍼즐 달리기: 색깔 테두리를 확인하며 6조각 퍼즐을 맞춘다. 5) 유빙 건너기: 팀원 수보다 1장 많은 매트를 이어 밟으며 체육관을 건넌다.</p>
