<h1>토이스토리 관찰 동작 챌린지</h1>
<p>1) 화면 속 두 장의 토이스토리 그림을 관찰할 수 있도록 스크린 앞에 편안하게 정렬한다. 2) 15초 제한 시간 동안 두 그림 사이의 서로 다른 부분을 집중해서 찾아낸다. 3) 정답이라고 생각하는 선택지에 지정된 피트니스 동작(스쿼트, 버피, 점핑잭 등)을 수행하여 득점한다. 4) 피자 플래닛 갈고리를 좌우로 숙이며 피하는 회피 미션과 퀴즈 연계 동작을 수행하는 보너스 라운드를 진행한다.</p>
