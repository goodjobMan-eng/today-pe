<h1>세계의 전통 놀이와 브라질의 놀이</h1>
<p>1) 브라질 등 세계 각국의 전통 놀이의 유래와 역사에 대해 알아봅니다. 2) 페테카는 털이 달린 놀이개를 손으로 치며 떨어뜨리지 않고 놀이합니다. 3) 엠부베는 눈을 가린 사자와 사냥꾼들이 소리를 내며 잡는 놀이입니다.</p>
