<h1>줄넘기 기초 뛰기와 줄넘기 활용 릴레이·협동 놀이</h1>
<p>1) 양팔을 옆구리에 붙이고 손목 회전을 이용해 양발 모아 뛰기, 번갈아 뛰기, 엇걸었다 풀어 뛰기(X자) 등의 기초 기술을 연습한다.2) 줄넘기를 접어 쥐고 반환점을 돌아온 뒤 다음 주자와 함께 줄을 잡고 달리는 릴레이 달리기를 한다.3) 둘이서 줄넘기를 양손으로 팽팽하게 잡고 그 위에 풍선이나 공을 올려 떨어뜨리지 않고 골대(상자)까지 운반한다.</p>
