<h1>투호 스태킹 게임</h1>
<p>1) 거리와 높이가 다른 스태킹 컵(점수 1점, 2점, 3점 등)을 바닥에 배치한다.2) 정해진 위치에서 공을 던져 직접 스태킹 컵 안으로 넣거나, 바닥에 한 번 바운드시켜서 컵 안에 넣는다.3) 정해진 횟수(예: 3~4회)만큼 공을 던져 공이 들어간 컵의 점수를 합산하여 승패를 가린다.</p>
