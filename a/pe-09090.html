<h1>가위바위보 진화하기</h1>
<p>1) 5단계 진화단계에 따라 같은 단계의 친구들이 가위바위보를 합니다. 2) 알에서 시작해서 가위바위보를 이기면 한단계 위로 올라가게 되고, 지면 무조건 다시 1단계(알)가 됩니다. 3) 알 - 애벌레 - 번데기 - 나비 - 천사 4) 각 단계에 어울리는 움직임 표현을 하며 이동합니다. 5) 5단계 천사가 된 선생님과 가위바위보를 해서 이기면 신이 되어 놀이가 끝납니다.</p>
