<h1>골프 축구</h1>
<p>1) 안전 고깔(라바콘) 4개를 배치하여 홀을 정하고 파3, 4, 5 등을 설정한다.2) 발 안쪽(1번), 바깥쪽(2번), 발등(3번), 뒤꿈치(4번), 허벅지(5번), 헤딩(6번) 등 신체 부위를 골프 클럽처럼 지정하여 공을 찬다.3) 허벅지와 헤딩은 손으로 던져 공중에서 처리하며 공이 떨어진 자리에서 연속해서 다음 샷을 이어간다.4) 공을 찬 횟수와 사용한 신체 부위를 기록하여 가장 적은 타수로 마지막 안전 고깔을 맞힌 사람이 승리한다.</p>
