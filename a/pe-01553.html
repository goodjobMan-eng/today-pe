<h1>매트 운동 안전 약속 및 기구 운반 실습 활동</h1>
<p>1) 4인 1조가 되어 매트의 네 모서리 손잡이를 잡고 구령에 맞추어 동시에 들어 올린다. 2) 일방통행 통로를 따라 매트를 가로로 안전하게 운반한 뒤 구령에 맞춰 바닥에 내려놓는다. 3) 앞사람의 신호(손들기)를 확인한 후 차례대로 매트에 올라가 구르기 동작을 수행하고 매트 틈을 정돈한다. 4) 활동이 끝나면 역순으로 매트를 정렬하고 단차와 모서리를 맞추어 안전하게 보관 장소로 운반한다.</p>
