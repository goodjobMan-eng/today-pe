<h1>카이 (전통 공 손치기 놀이)</h1>
<p>1) 4명에서 8명의 참가자가 둥글게 원형 대형을 만든다. 2) 공을 공중으로 던져 올리며 게임을 시작한다. 3) 참가자들은 손바닥으로 공을 위로 쳐올려 서로에게 패스한다. 4) 공이 바닥에 떨어지지 않도록 공중에 가장 오래 띄우거나 특정 목표 점수에 도달하는 것을 목표로 한다. 5) 팀 대항으로 진행할 경우 공을 바닥에 떨어뜨리지 않고 가장 오래 유지한 팀이 승리한다.</p>
