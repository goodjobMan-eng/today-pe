<h1>자기만족 챌린지 15탄 - 양말 컵 챌린지</h1>
<p>1) 1단계는 컵에 담긴 양말을 던져 반대쪽 팔 아래로 통과시켜 다시 컵으로 받으며 양손을 번갈아 수행한다. 2) 2단계는 등 뒤로 양말을 던져 통과시킨 후 컵으로 받는다. 3) 3단계는 한쪽 다리 밑으로 양말을 통과시켜 받고 양다리와 양손을 모두 수행한다. 4) 4단계는 양말을 발로 차 올려 컵으로 받아낸다.</p>
