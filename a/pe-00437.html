<h1>도움닫기 멀리뛰기</h1>
<p>1) 일정한 거리를 도움닫기하여 속도를 붙이며 달려옵니다. 2) 발구름판 표시선을 밟거나 넘지 않고 정확하게 한 발로 굴러 도약합니다. 3) 공중 동작 후 착지할 때는 양 무릎을 부드럽게 굽히며 모래판에 안전하게 내려앉습니다. 4) 측정할 때는 발구름 기준선부터 신체가 닿은 가장 가까운 지점까지의 거리를 확인합니다.</p>
