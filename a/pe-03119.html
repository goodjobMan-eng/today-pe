<h1>축구 드리블 슛 및 바운드 슛, 헤딩 연습</h1>
<p>1) 앞에 가상의 수비가 있다고 생각하고 드리블하거나 방향 전환 페이크 동작을 섞어 슈팅 연습을 한다. 2) 튀어 오른 공이 땅에 튄 뒤 올라갔다 내려올 때 타이밍을 맞춰 발등으로 바운드 슈팅을 한다. 3) 이마의 정수리 아래 눈썹 위 튀어나온 뼈 부위에 공을 맞추도록 손으로 던져 이마로 받는 연습을 한다. 4) 파트너가 골대 쪽으로 살짝 올려준 공을 끝까지 보고 헤딩 슛을 연결한다.</p>
