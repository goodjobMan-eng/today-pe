<h1>가위바위보 전쟁</h1>
<p>1) 교실 책상 위치대로 두 팀으로 나누고 각 팀의 맨 끝 자리에 왕을 정합니다. 2) 마주 보고 있는 앞 주자부터 가위바위보 대결을 시작합니다. 3) 진 사람은 자리에 앉고 이긴 사람은 상대 팀 다음 주자와 차례대로 대결하여 상대 팀 왕을 이기면 승리합니다.</p>
