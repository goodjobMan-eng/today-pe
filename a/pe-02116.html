<h1>스포츠피구 기본 공격대형 및 수비대형</h1>
<p>1) 공격 시 외야 선수는 시야를 확보하여 내야 전방·중앙의 공격수에게 골고루 패스한다. 2) 내야 공격수는 수비력이 약하거나 자세가 높은 선수를 우선 조준하여 빠르게 아웃시킨다. 3) 수비 시 엔드라인 안쪽 2~3m 지점에 일자형 대형을 기본으로 배치한다. 4) 상대 공격수의 공 위치에 따라 주장 지시에 맞춰 일자형 대형 전체가 사이드로 신속히 이동한다.</p>
