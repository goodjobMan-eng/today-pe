<h1>흔들흔들 버티기 균형 체조</h1>
<p>1) 한 사람이 엎드려뻗쳐(푸시업) 자세나 네 발 기기 자세 등 다양한 버티기 자세를 취합니다. 2) 상대는 버티고 있는 사람을 밀거나 당기거나 간지럼을 태우며 균형을 무너뜨리려 시도하고, 버티는 사람은 코어와 팔다리에 힘을 주어 균형을 유지합니다. 3) 버티던 사람이 균형을 잃고 쓰러지거나 정해진 시간이 지나면 역할을 교대합니다. 4) 자세를 한 손 들기 등 다양한 버티기 변형 동작으로 바꾸어 난이도를 높입니다.</p>
