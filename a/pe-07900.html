<h1>협동 신체 미션 놀이</h1>
<p>1) 학생들이 자유롭게 이동하다가 교사가 외친 숫자만큼 모둠을 만든다. 2) 교사의 지시에 따라 지정된 신체 부위 조건(예: 정해진 발 수만 바닥에 닿기, 손 3개와 발 3개만 닿기, 한 명은 바닥에 닿지 않기 등)을 모둠원이 협동하여 완성한다. 3) 모든 모둠이 미션을 완료하면 이동을 재개하고 새 지시를 받는다.</p>
