<h1>가위바위보 피구</h1>
<p>1) 두 팀으로 나누어 가위바위보나 묵찌빠를 합니다. 2) 이긴 사람은 공을 향해 뛰고 진 사람은 놓여진 콘으로 뜁니다. 3) 공을 가진 사람은 상대가 출발선으로 돌아가기 전에 던져 맞추면 득점합니다. 4) 진 사람은 공을 피하거나 콘을 가지고 출발선으로 돌아왔을 때 득점합니다.</p>
