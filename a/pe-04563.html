<h1>의자에서 일어나 던지기 연습</h1>
<p>1) 의자에 다리를 벌리고 앉아 상체를 약간 숙인다. 2) 일어날 때 중심을 발가락(발끝)에 둔다. 3) 오른쪽에 있던 중심을 왼쪽 다리로 이동하며 공을 던진다.</p>
