<h1>오목 이어달리기</h1>
<p>1) 바닥에 3X3 혹은 5X5 사각형 모양으로 훌라후프를 놓아 판을 만든다. 2) 두 팀으로 나누어 출발선에 일렬로 선다. 3) 각 팀 주자는 팀조끼를 들고 달려가 후프 안에 놔두고 돌아와 다음 주자와 교대한다. 4) 조끼를 던지지 말고 정확히 칸에 놓아야 하며, 빙고나 오목이 완성될 때까지 조끼를 옮길 수 있고 먼저 완성한 팀이 승리한다.</p>
