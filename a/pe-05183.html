<h1>하트 숨바꼭질 보물찾기 게임</h1>
<p>1) 출발선에서 신호가 울리면 벽 쪽에 배치된 콘들을 향해 달려간다.2) 콘을 하나씩 들어 올려 밑에 숨겨진 하트(흰색, 분홍색, 빨간색) 중 하나를 찾는다.3) 하트를 집은 뒤 다시 콘을 덮어두고 출발선 쪽 바구니로 달려가 색깔별로 분류해 넣는다.</p>
