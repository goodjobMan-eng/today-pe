<h1>킥볼 (발야구형 게임)</h1>
<p>1) 키커 팀 선수가 빨간 콘 뒤에서 차례대로 공을 차서 경기장 멀리 보낸다. 2) 키커는 빨간 콘으로 표시된 베이스들을 돌아 홈 라인을 통과해 1점을 얻는다. 3) 수비 팀 패서들이 공을 잡아 노란 콘 사이의 캡틴에게 패스하기 전에 베이스에 도착하지 못하고 베이스 사이에 멈춰 있으면 키커는 아웃된다.</p>
