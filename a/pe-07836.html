<h1>배드민턴 로테이션 활동</h1>
<p>1) 각 코트에 네트를 설치하고 코트당 4명씩 배치하며 1인당 배드민턴 라켓 1개와 코트당 셔틀콕 2개를 준비한다. 2) 교사가 지정한 배드민턴 활동(기능 연습)을 1분 동안 실시한다. 3) 교사가 멈춤 신호를 주면 모든 인원이 시계 방향으로 코트를 한 칸씩 이동하여 새로운 활동을 1분간 반복한다.</p>
