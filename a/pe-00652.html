<h1>팀 대항 꼬리잡기 (팀 배틀 꼬리잡기)</h1>
<p>1) 모든 참가자가 허리 뒤에 꼬리끈(머리띠)을 꽂고 정해진 구역 안에 섭니다. 2) 시작 신호와 함께 상대 팀원의 꼬리끈을 낚아채며 자신의 꼬리끈을 지킵니다. 3) 꼬리가 뽑힌 참가자는 경기장 밖 지정 구역으로 이동해 대기합니다. 4) 제한 시간 동안 끝까지 살아남거나 상대 팀의 꼬리를 더 많이 뽑은 팀이 승리합니다.</p>
