<h1>계란이 왔어요</h1>
<p>1) 콘 위에 계란판을 적당한 거리에 올려놓고 모둠당 탁구공을 12개씩 나눈다. 2) 순서대로 탁구공을 바닥에 한 번 바운드하여 계란판에 안착시킨다. 3) 들어가지 않은 공은 자기가 직접 주워서 줄 맨 끝으로 이동한다. 4) 먼저 계란판에 탁구공을 모두 올리는 모둠이 승리한다.</p>
