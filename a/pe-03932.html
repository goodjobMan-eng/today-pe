<h1>사자와 영양 플래그 태그</h1>
<p>1) 콘으로 아프리카 구역을 표시하고, 영양 역할을 맡은 학생들은 플래그를 착용하며 사자는 착용하지 않는다. 2) 사자는 구역 안에서 영양을 쫓아가 플래그를 한 번에 1개씩만 뜯는다. 3) 뜯은 플래그는 훌라후프 안에 넣고, 플래그를 빼앗긴 영양은 사자가 되어 다른 영양을 함께 쫓는다. 4) 정해진 시간이 끝나거나 남은 영양이 없으면 라운드가 종료된다.</p>
