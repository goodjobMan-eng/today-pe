<h1>외쳐라 술래잡기</h1>
<p>1) 포스트잇에 한글 단어를 적어 각자 등에 붙인다. 2) 교실의 한쪽 벽에 나란히 선다. 3) 출발 신호가 울리면 깽깽이(한 발)로 반대편 벽으로 이동한다. 4) 이동하면서 다른 친구 등의 단어를 보고 먼저 외치면 단어가 불린 친구는 아웃되어 자리에 앉는다.</p>
