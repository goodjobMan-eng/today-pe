<h1>컵&amp;컵 낚시</h1>
<p>1) 줄을 연결한 컵을 책상 위에서 잡고 낚싯대처럼 늘어뜨린다.2) 줄에 달린 컵을 이용해 바닥에 놓인 종이컵을 낚아 올린다.3) 낚아 올린 컵 6개를 책상 위 다른 컵 안에 차례대로 넣는다.4) 6개를 모두 가장 빠르게 낚아 넣은 사람이 이긴다.</p>
