<h1>원 안에서 풍선 띄우기 챌린지</h1>
<p>1) 신문지나 수건을 바닥에 둘러 발 두 걸음 크기의 좁은 원형 영역을 만들고 풍선을 든 채 들어선다. 2) 원 밖으로 두 발이 벗어나지 않도록 유지하며 손으로 풍선을 쳐서 머리 위 높이로 계속 띄운다. 3) 한 손으로 5회 연속 띄운 후 반대 손으로 5회, 최종적으로 양손을 번갈아 가며 5회 띄우기에 성공한다. 4) 풍선 대신 둥글게 뭉친 이면지(팝콘 공)를 활용해 불규칙한 반사를 제어하는 방식으로 난이도를 높인다.</p>
