<h1>풍선 당구 놀이</h1>
<p>1) 바닥에 목표 풍선을 두고 각자 모서리 출발선에서 출발한다. 2) 발로 칠 때는 바닥에 놓고 목표 풍선을 향해 차서 맞힌다. 3) 목표 풍선에 닿으면 1점을 얻고 추가 공격 기회를 얻으며, 빗나가면 상대 팀으로 기회가 넘어간다. 4) 손으로 할 때는 풍선을 위로 띄워 눈높이 정도에 왔을 때 쳐서 목표 풍선을 맞춘다.</p>
