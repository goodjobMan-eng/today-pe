<h1>독도는 우리 땅 &amp; 커브 릴레이 &amp; 어프로치 대결</h1>
<p>1) 두 팀으로 나누어 공격팀은 독도 구역에 디스크를 안착시키고 수비팀은 수비 구역에서 디스크를 떨어뜨려 독도에 디스크가 더 많이 남은 팀이 이긴다. 2) 3m x 3m 구역마다 위치한 팀원들이 지정된 커브 던지기로 패스를 연결해 3m 앞 디스캐처에 먼저 넣는 팀이 승리한다. 3) 정해진 거리에서 번갈아 던져 디스캐처에 더 가까운 디스크마다 1점을 얻어 총점이 높은 팀이 승리한다.</p>
