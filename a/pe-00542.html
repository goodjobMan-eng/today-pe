<h1>더블더치 기초 줄넘기 도전</h1>
<p>1) 두 개의 긴 줄을 양손으로 번갈아 돌리는 더블더치 기본 동작을 연습합니다. 2) 줄이 돌아갈 때 몸통 높이에서 지나가는 순간을 보고 가운데로 빠르게 들어갑니다. 3) 줄의 정중앙에서 가볍게 리듬에 맞춰 점프하며 양발 혹은 한 발로 번갈아 뜁니다. 4) 정해진 횟수를 뛰고 난 뒤 머뭇거리지 않고 신속하게 반대편으로 빠져나옵니다.</p>
