<h1>리더 달리기</h1>
<p>1) 모둠원들이 한 줄로 나란히 걸어가거나 가볍게 달린다. 2) 앞사람이 뒷사람에게 차례로 공을 패스하여 맨 뒤까지 보낸다. 3) 공을 받은 맨 뒷사람은 공을 들고 전속력으로 달려 줄의 맨 앞(리더 자리)으로 이동한다.</p>
