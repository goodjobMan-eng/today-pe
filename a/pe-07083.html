<h1>농부 술래잡기 (파머 태그)</h1>
<p>1) 3~4명의 술래(농부)를 정해 긴 펀스틱(풀누들)을 주고 체육관 구석으로 보낸다 2) 나머지 학생(가축)은 중앙 원(헛간)에 모여 있다가 음악이 시작되면 도망친다 3) 술래에게 터치된 동물은 그 자리에 멈추고 술래가 풀누들로 허리를 감싸 헛간으로 데려간다 4) 헛간에 잡혀 온 동물은 점핑잭 5회를 하고 다시 게임에 참여한다</p>
