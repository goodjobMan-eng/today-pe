<h1>요가 프리즈 댄스 신체 표현 놀이</h1>
<p>1) 음악에 맞춰 자유롭게 춤을 추다가 화면 신호에 맞춰 정지하는 요가 표현 놀이이며, 신나는 음악이 나오는 동안 화면 캐릭터를 따라 하거나 자신만의 동작으로 춤을 춥니다. 2) 음악이 멈추면 화면에 제시되는 둥근 캐릭터의 요가 정지 자세를 확인합니다. 3) 20초 카운트다운 동안 흔들리지 않고 해당 요가 자세를 그대로 유지합니다. 4) 타이머가 끝나고 다시 음악이 나오면 춤추기를 반복합니다.</p>
