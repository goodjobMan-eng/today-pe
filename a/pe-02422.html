<h1>따라해 얼음땡</h1>
<p>1) 인원수보다 한 개 부족하게 원마커를 배치하고, 원마커 위에 선 친구들은 몸을 활용해 다양한 동작을 만들고 얼음 상태로 멈춘다. 2) 술래는 원마커 위에 서 있는 친구에게 달려가 그 친구의 동작을 똑같이 따라 한다. 3) 같은 동작을 따라 하면 얼음이 풀려 원마커에서 나와 돌아다니며 다른 얼음인 친구들의 동작을 따라 해 풀어준다. 4) 모든 친구가 얼음에서 풀려나면 다 같이 손을 잡고 원을 만들어 한 바퀴 돈다.</p>
