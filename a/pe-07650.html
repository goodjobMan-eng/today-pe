<h1>토끼 사냥 피구 게임</h1>
<p>1) 2명의 사냥꾼은 경기장 가장자리에 위치하고, 10명의 토끼는 출발선에 섭니다. 2) 신호가 울리면 토끼들은 사냥꾼이 던지는 공을 피해 결승선을 향해 달려갑니다. 3) 결승선에 도착한 토끼들은 다시 출발선을 향해 공을 피하며 되돌아옵니다. 4) 어깨 아래(발부터 어깨까지)로 공에 맞은 토끼는 사냥꾼으로 변해 바깥에서 공을 던집니다. 5) 경기장 안에 마지막 1마리의 토끼가 남을 때까지 반복합니다.</p>
