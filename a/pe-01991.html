<h1>지팡이 사탕 태그 놀이</h1>
<p>1) 활동 공간 전체에 학생들을 자유롭게 분산시키고 술래 1~2명을 선정한다. 2) 시작 신호와 함께 도망자는 넓게 달아나고 술래는 다른 학생들을 손으로 가볍게 태그한다. 3) 태그된 학생은 팔을 앞으로 내밀고 등을 구부려 구부러진 지팡이 사탕(캔디 케인) 모양을 만들고 멈춰 선다. 4) 잡히지 않은 친구가 지팡이의 굽은 팔 아래 틈으로 통과해주면 풀려나 다시 게임에 참여하며 일정 시간 후 술래를 교체한다.</p>
