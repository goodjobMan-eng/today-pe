<h1>플랭크 탭볼 게임</h1>
<p>1) 두 사람이 마주 보고 플랭크(엎드린) 자세를 취한다.2) 양옆에 콘을 세워 골대를 만들고 공을 가운데 둔다.3) 한 손으로 몸을 지탱하고 다른 손으로 공을 쳐서 상대 골대(콘 사이)로 넣는다.4) 공이 콘 사이 골문 안으로 들어가면 1점을 획득한다.</p>
