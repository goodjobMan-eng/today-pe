<h1>튀긴 탁구공 삼각콘으로 받기</h1>
<p>1) 두 모둠으로 나누고 각 모둠에서 한 명씩 앞으로 나와 모둠원을 바라보며 받는 구역에 섭니다. 2) 맨 앞사람이 탁구공을 바닥에 튀기고 맞은편에 있는 친구가 삼각콘으로 공을 받아냅니다. 3) 공 튀기와 받기를 실패하면 다시 시도하고 성공하면 던진 사람은 받는 구역으로, 받는 사람은 줄의 맨 뒤로 이동합니다. 4) 모든 탁구공을 가장 먼저 받아낸 모둠이 승리합니다.</p>
