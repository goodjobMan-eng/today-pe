<h1>애플 바나나 오렌지 점프</h1>
<p>1) 학생들이 서로 앞사람의 어깨에 양손을 올리고 하나의 긴 원 대형이나 기차 대형을 만든다. 2) 술래(교사)의 구호에 맞춰 '애플'은 앞으로 점프, '바나나'는 뒤로 점프, '오렌지'는 180도 방향을 돌며 점프한다. 3) 참가자들은 구호를 동시에 복창하며 정해진 동작을 일제히 수행한다. 4) 익숙해지면 &quot;애플-바나나&quot;, &quot;오렌지-오렌지-애플&quot;처럼 구호를 2~3개 연속으로 연결하여 난이도를 높인다.</p>
