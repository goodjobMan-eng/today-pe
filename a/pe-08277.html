<h1>팀 핸드볼 기초 기능 및 드릴 (Team Handball Skills and Drills)</h1>
<p>1) 원 대형으로 서서 공을 다리 사이에 두고 몸풀기 스트레칭을 실시한다. 2) 허리 돌리기, 8자 돌리기, 드리블 등 기초 볼 핸들링을 연습한다. 3) 공을 튕겨 점프 캐치 후 3보 이동 및 피벗 페이크 동작을 수행한다. 4) 벽이나 파트너를 향해 오버핸드 패스를 주고받고, 콘 사이 표적을 향해 슛 및 수비 섀도잉 연습을 진행한다.</p>
