<h1>행운의 접시 만들기</h1>
<p>1) 1번부터 6번까지 번호가 적힌 접시콘 6개를 엎어 둔(돔 모양) 상태로 배치한다.2) 주사위를 굴려 나온 숫자 번호의 접시콘으로 달려가 바르게 뒤집어 접시 모양으로 만든다.3) 약속된 신체활동 과제(예: 점핑잭 2회)를 수행하고 돌아오며, 모든 접시콘을 접시 모양으로 완성할 때까지 반복한다.</p>
