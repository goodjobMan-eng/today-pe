<h1>추억의 청소년 체조</h1>
<p>1) 제자리에서 가볍게 뛰며 몸 전체의 긴장을 풀고 워밍업을 시작한다. 2) 구령에 맞춰 팔운동, 팔다리운동, 가슴운동, 옆구리운동 순으로 관절과 근육을 풀어준다. 3) 등배운동, 몸통운동, 뜀뛰기, 온몸운동으로 점차 운동 강도를 높이며 전신을 움직인다. 4) 마지막으로 깊게 숨쉬기 운동을 하며 심박수를 안정시키고 마무리한다.</p>
