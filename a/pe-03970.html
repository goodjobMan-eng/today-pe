<h1>드럼 핏 루틴('펌프 잇 업')</h1>
<p>1) 풀누들(폼 스틱) 두 개를 양손에 쥐고 버킷 앞에 선다. 2) 음악 'Pump It Up' 비트에 맞춰 머리 위에서 스틱을 서로 교차해 두드린다. 3) 버킷의 양옆이나 윗부분을 스틱으로 리듬에 맞춰 두드린다. 4) 바닥이나 스틱끼리 맞부딪치며 음악에 맞추어 다양한 드럼 동작을 수행한다.</p>
