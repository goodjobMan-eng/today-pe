<h1>줄넘기 동작과 2인 줄넘기</h1>
<p>1) 처음에는 양발을 모아 동시에 줄을 넘고, 다음 번에는 양발을 양쪽으로 벌리며 줄을 넘는다. 2) 줄이 돌아가는 리듬에 맞추어 왼발과 오른발을 번갈아가며 줄을 넘는다. 3) 오른발을 뒤로 들면서 줄을 넘고 앞으로 흔들어 내리면서 넘으며 왼발도 같은 동작을 한다. 4) 두 사람이 같은 방향 또는 마주 보고 서서 한 사람이 줄을 돌려 함께 넘거나, 옆으로 서서 손잡이를 하나씩 잡고 함께 넘는다.</p>
