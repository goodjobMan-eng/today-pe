<h1>플라잉 디스크 이어 던지기</h1>
<p>1) 3명이 한 모둠이 되어 출발선에서 도착 지점까지 삼각콘 사이에 한 줄로 선다. 2) 신호가 울리면 첫 번째 친구가 두 번째 친구에게 원반을 던지고, 두 번째 친구는 받아 세 번째 친구에게 던진다. 3) 원반이 다음 사람에게 연결되지 못하고 바닥에 떨어지면 받지 못한 친구가 던져 준 친구에게 원반을 보내 다시 던진다. 4) 마지막 친구가 가장 먼저 원반을 받은 모둠이 승리한다.</p>
