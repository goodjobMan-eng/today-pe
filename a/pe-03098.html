<h1>몸을 둥글게 하여 앞구르기</h1>
<p>1) 발을 어깨너비로 벌리고 서서 무릎을 굽혀 앉습니다. 2) 양손을 매트 위에 멀리 짚고 시선은 배꼽(발 부분)을 봅니다. 3) 다리를 쭉 밀면서 뒷머리가 매트에 닿도록 몸을 둥글게 말아 앞으로 굴러 일어납니다. 4) 불안하거나 무서워하는 친구는 보조자가 옆에서 몸을 잡아서 천천히 구를 수 있도록 도와줍니다.</p>
