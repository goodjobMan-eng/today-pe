<h1>항상 승리하는 방법 (스포츠맨십과 노력 중심 성공관)</h1>
<p>1) 체육 경기나 활동에 참여할 때 자신의 성공 기준을 승패 결과가 아닌 쏟아부은 노력(100%)에 둔다. 2) 경기에서 지더라도 최선을 다했다면 당당하게 고개를 들고 스스로를 자랑스럽게 여긴다. 3) 경기가 끝난 뒤 상대 팀에게 다가가 진심으로 축하의 인사를 건넨다.</p>
