<h1>트럼프 카드 플랭크 챌린지</h1>
<p>1) 트럼프 카드를 무늬별로 4개 더미(각 13장)로 나눈 뒤, 자신이 모을 무늬를 정하고 카드를 섞는다. 2) 팔을 곧게 펴고 몸을 일직선으로 유지하는 하이 플랭크 자세를 취한다. 3) 60초 동안 양손을 번갈아 사용해 한 번에 한 장씩 카드를 뒤집으며 목표 무늬 카드를 최대한 많이 찾아 모은다.</p>
