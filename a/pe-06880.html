<h1>스키틀 스커틀 벽 반사 킥 게임</h1>
<p>1) 물병(또는 표적물)을 벽에서 약 1~2미터 떨어진 위치에 세워 둔다. 2) 표적물 옆에 공을 두고 벽을 향해 공을 찬다. 3) 벽에 맞고 튕겨 나온 반사공으로 세워 둔 물병을 맞춰 쓰러뜨린다. 4) 성공하면 공의 위치를 벽에서 한 걸음 더 뒤로 물러나 난이도를 올려 다시 시도한다. 5) 쓰레기통 같은 장애물을 중간에 배치해 돌려 차거나, 표적물의 크기 및 공의 크기를 바꾸어 다양하게 도전한다.</p>
