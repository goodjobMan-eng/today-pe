<h1>넷볼 종목 소개 및 기본 규칙</h1>
<p>1) 코트를 3등분(골 서드 2개, 센터 서드 1개)하여 경기를 진행한다. 2) 7개의 포지션별로 정해진 구역 안에서만 플레이한다. 3) 드리블 없이 패스로만 공을 이동시키며, 공을 받으면 걸을 수 없다. 4) 신체 접촉을 하지 않으며 수비 시 90cm 이상 떨어져서 수비한다.</p>
