<h1>밸런스 챌린지 (파트너 중심 무너뜨리기)</h1>
<p>1) 체격과 힘이 비슷한 파트너와 마주 보고 선다. 2) 양손을 단단히 맞잡고 잠근다(그립 유지). 3) 시작 신호에 맞춰 밀고 당기며 상대방의 중심(밸런스)을 무너뜨려 발을 움직이게 만든다. 4) 30초 동안 진행하며 상대의 중심을 무너뜨릴 때마다 점수를 얻고 파트너를 바꾼다.</p>
