<h1>준비운동 3종 놀이</h1>
<p>1) 다리 짧게/길게, 손바닥 짚기, 팔·목 당기기 순으로 5초 이상 유지하며 개인 스트레칭을 한다. 2) 짝과 마주 보고 서로 어깨에 손을 올린 뒤 상체를 아래로 숙여 어깨와 등을 함께 늘려준다. 3) 허리 아래 하체는 고정한 채 호루라기 소리에 맞춰 상체 허리를 돌려 짝과 손뼉을 친다. 4) 다리를 모으고 가위바위보를 하여 이긴 사람은 앞발을 뒤로, 진 사람은 앞발을 앞으로 내밀며 다리 찢기를 진행한다.</p>
