<h1>B-O-W-L 표적 게임</h1>
<p>1) 10피트 거리에서 정해진 핀 배치(1~6번)를 향해 공을 굴려 쓰러뜨린다.2) 선공 볼러가 카드에 제시된 핀 배열을 한 번에 모두 쓰러뜨리면 상대방도 같은 샷에 3번 도전한다.3) 3번의 기회 안에 쓰러뜨리지 못하면 글자(B-O-W-L)를 하나씩 받고 단어가 완성되면 패배한다.</p>
