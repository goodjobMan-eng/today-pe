<h1>고·슬로우·워 영양 퀴즈 피트니스 2</h1>
<p>1) 화면에 제시되는 음식을 보고 10초 동안 해당 음식이 Go(건강식), Slow(주의식), Whoa(제한식) 중 무엇인지 판단한다. 2) 자신이 선택한 답(Go, Slow, Whoa) 아래에 표시된 운동 동작을 확인한다. 3) 30초 타이머 동안 화면 속 캐릭터와 함께 해당 피트니스 동작을 수행한다. 4) 정답 확인 후 다음 음식 문제로 넘어가며 체력 운동과 영양 퀴즈를 이어간다.</p>
