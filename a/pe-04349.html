<h1>그린치 스톰프 발스텝 리듬 피트니스</h1>
<p>1) 좋아하는 그린치 캐릭터를 선택해 파워 미터를 채우도록 돕는다. 2) 트랙을 따라 버튼이 플레이 존에 들어올 때 해당 색상의 동작을 수행한다. 3) 빨간색은 왼발 스톰프/홉, 노란색은 오른발 스톰프/홉, 빨강+노랑은 점프, 파란색은 박수, 보라색은 허벅지 치기를 한다. 4) 사라진 장난감을 찾는 미니게임이 나오면 방 안을 관찰한 뒤 없어진 물건의 포즈를 취해 득점한다.</p>
