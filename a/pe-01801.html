<h1>돌리고 뛰기 기초 줄넘기</h1>
<p>1) 발 가운데로 줄을 밟고 양손 손잡이가 겨드랑이 높이에 오도록 길이를 조절해 잡는다. 2) 교사나 보조자가 학생 뒤에서 양손을 함께 잡고 줄을 머리 위로 크게 돌리는 궤적을 익힌다. 3) 줄이 발앞 바닥을 탁 치며 멈추면 그 순간을 보고 두 발로 줄을 폴짝 뛰어넘는다. 4) 돌리고 뛰는 1회 성공이 익숙해지면 뒤로 넘기나 연속 2~5회 도전 과제로 발전시킨다.</p>
