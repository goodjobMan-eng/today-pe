<h1>북극 vs 남극 술래잡기</h1>
<p>1) 활동 구역을 절반으로 나누어 한쪽은 파란 콩주머니(북극), 다른 쪽은 빨간 콩주머니(남극)를 든 학생들이 위치한다.2) 각 진영에는 상대를 쫓는 상대 팀 술래가 있으며, 학생들은 자신의 구역 안에서만 뛰어다녀야 한다.3) 술래에게 태그되면 사이드의 바구니로 가 콩주머니를 반대 색상으로 바꾸고 반대편 진영으로 들어가 게임을 이어간다.</p>
