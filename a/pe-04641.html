<h1>포켓몬 피트니스 헌트 (Pokemon Fitness Hunt)</h1>
<p>1) 보호자가 집 안 곳곳에 숨겨 놓은 15장의 포켓몬 카드를 탐색하여 찾는다. 2) 카드를 발견하면 포켓몬 타입에 지정된 운동을 수행하여 몬스터볼(동전 1회 던지기), 슈퍼볼(3회), 하이퍼볼(5회) 중 하나를 선택할 자격을 얻는다. 3) 획득한 기회만큼 동전을 던져 앞면이 1번이라도 나오면 해당 포켓몬을 포획하고 도감에 기록한다.</p>
