<h1>캐치 앤 밸런스 협동 놀이</h1>
<p>1) 4명이 한 모둠이 되어 그물망의 스트랩을 각자 하나씩 잡고 위에 공을 올린다.2) 공이 떨어지지 않도록 무릎을 굽히거나 빠르게 걸으며 균형을 유지한다.3) 구령에 맞춰 네 명이 동시에 무릎을 굽혔다 펴며 공을 위로 띄운 뒤 다시 그물로 받는다.4) 교사가 던져주는 공을 네 명이 이동하여 그물망으로 받아낸다.5) 두 모둠이 마주 보고 서서 그물망을 이용해 서로에게 공을 띄워 주고받는다.</p>
