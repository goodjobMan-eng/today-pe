<h1>링크업</h1>
<p>1) 2인 1조로 팔짱을 끼고 서며, 술래 1명과 쫓기는 사람 1명은 짝 없이 시작한다. 2) 술래는 쫓기는 사람을 잡으러 달리고, 쫓기는 사람은 2인 조에 팔짱을 껴서 3인이 되면 안전해진다. 3) 3인이 된 조의 반대쪽 끝에 있던 사람은 즉시 분리되어 새로운 도망자가 된다. 4) 술래에게 태그되면 역할을 맞바꿔 방금 잡힌 사람이 새로운 술래가 된다.</p>
