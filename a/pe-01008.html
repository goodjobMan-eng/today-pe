<h1>네덜란드 전통 나막신 춤 더치댄스</h1>
<p>1) 모둠별 또는 학급 전체가 대형을 맞추어 서서 네덜란드 클롬펜 나막신 스텝의 기본 원리를 익힌다. 2) 왼발을 구르며 오른발을 대각선으로 차고 발을 교차하는 걷기 동작과 손뼉 치기 리듬을 맞춘다. 3) 고개를 좌우로 까딱이며 발을 구르고, 풍차처럼 제자리에서 회전하는 연결 동작을 음악 박자에 맞춰 수행한다. 4) 짝과 마주 보거나 대형을 바꾸는 대형 변형을 추가하여 완성된 8가지 연결 동작을 군무로 펼친다.</p>
