<h1>혼자서 하는 매트 체조 1인 동작 8종</h1>
<p>1) 교사의 신호나 구령에 맞춰 플라밍고, 수평 밸런스 등 서서 하는 균형 동작을 합니다. 2) 이어서 V자 밸런스, 한 손 밸런스(사이드 플랭크) 등 바닥을 짚고 버티는 코어 균형 동작을 합니다. 3) 엎드린 자세에서 상체를 젖히는 물개 자세 및 활 모양 비행기 자세를 취합니다. 4) 누운 자세에서 브리지 및 다리를 곧게 세우는 스카이트리 동작까지 각 자세를 수 초간 유지하며 순서대로 수행합니다.</p>
