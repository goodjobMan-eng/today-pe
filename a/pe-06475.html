<h1>기초 러닝(달리기 자세와 호흡법)</h1>
<p>1) 1km를 8분 페이스 수준으로 설정하고 약 1.2km 코스 달리기를 준비한다 2) 호흡은 코로 들이마시고 입으로 내뱉으며 발걸음에 맞춰 2-2 호흡(습-습-후-후)을 유지한다 3) 팔은 90도 각도를 유지하며 앞뒤로 자연스럽게 흔들고 상체는 앞으로 15도 정도 기울인다 4) 발 착지 시 전력 질주가 아니므로 뒤꿈치 대신 발바닥 중앙(미들풋)부터 닿도록 달린다</p>
