<h1>라인 술래잡기</h1>
<p>1) 술래와 도망자 모두 체육관 바닥에 그려진 라인 위로만 이동할 수 있으며, 술래는 구분을 위해 팀조끼를 손에 듭니다. 2) 술래가 라인을 따라 이동하며 도망자를 쫓습니다. 3) 술래가 도망자를 터치하면 역할이 교체되고, 새 술래는 제자리에서 5초를 천천히 센 뒤 다시 쫓기 시작합니다. 4) 라인 밖으로 벗어나거나 점프로 선을 넘는 행동은 반칙입니다.</p>
