<h1>가정형 신체활동 순환 운동</h1>
<p>1) 런지 자세에서 한 팔을 최대한 위로 뻗은 상태로 상체를 좌우로 스트레칭합니다. 2) 발을 교차하여 뛰고 런지 자세로 착지하며 점핑 런지를 실시합니다. 3) 중앙 지점에서 양쪽 목표점으로 이동하며 빈백을 하나씩 옮깁니다. 4) 양팔을 어깨 높이로 올린 후 런지 자세를 취하며 상체를 좌우로 회전합니다.</p>
