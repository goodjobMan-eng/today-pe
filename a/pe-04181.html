<h1>스탠다드 피구</h1>
<p>1) 체육관 중앙선을 기준으로 양 팀이 절반씩 나뉘어 선다. 2) 각 팀에 피구공을 나눠주거나 중앙선에 공을 일렬로 정렬한 후 시작 신호와 함께 달려가 공을 가져온다. 3) 날아온 공에 맞으면 아웃되어 맞은 자리나 체육관 가장자리에 앉아 게임이 끝날 때까지 대기한다.</p>
