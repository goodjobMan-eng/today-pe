<h1>이겨라! 비겨라! 져라! 자리바꾸기</h1>
<p>1) 술래와 모든 학생이 가위바위보 대결을 한다. 2) 이긴 사람(또는 술래가 정한 조건에 해당하는 사람)을 제외하고 모두 자리에서 일어나 빈자리로 이동한다. 3) 두 칸 이상 떨어진 자리로만 이동하며, 원래 자기 자리나 바로 옆자리는 앉을 수 없다. 4) 술래도 빈자리에 앉고, 자리를 차지하지 못한 사람이 미션을 수행한 뒤 다음 술래가 된다.</p>
