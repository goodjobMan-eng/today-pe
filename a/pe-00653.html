<h1>회전목마 줄넘기 (메리고라운드 긴줄넘기)</h1>
<p>1) 가운데에서 술래가 개인 줄넘기 또는 줄을 연속해서 돌리며 뜁니다. 2) 주변에 선 팀원들이 차례대로 줄이 돌아가는 타이밍에 맞춰 안으로 뛰어 들어갑니다. 3) 함께 리듬을 맞춰 뛴 뒤 줄에 걸리지 않고 반대쪽으로 빠져나가 다음 사람과 교대합니다. 4) 단계(레벨)가 올라갈수록 동시에 뛰거나 방향을 바꿔 회전하며 난이도를 높입니다.</p>
