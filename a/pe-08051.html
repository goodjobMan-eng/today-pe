<h1>풀 누들 팀버</h1>
<p>1) 각자 풀 누들(스펀지봉) 1개씩을 바닥에 세워 잡고 원형으로 선다. 2) 교사가 &quot;하나, 둘, 셋, 출발&quot; 구호를 외치면 잡고 있던 누들을 놓고 쓰러지기 전에 다음 누들로 달려가 잡는다. 3) 시계 방향 또는 반시계 방향으로 방향을 바꾸어 이동하며 잡는다. 4) 누들이 바닥에 쓰러지면 턱 점프(또는 스쿼트) 3회를 수행한다.</p>
