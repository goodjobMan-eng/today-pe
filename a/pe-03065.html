<h1>농구 슛 점수 많이 내기 도전</h1>
<p>1) 긴 풍선으로 동그란 골대를 만들어 문이나 창문에 붙이고, 일반 풍선에 물을 5분의 1 정도 넣어 공을 만든다. 2) 골대 정면에서 한 발자국 거리는 2점, 두 발자국 거리는 3점, 세 발자국 거리는 4점, 네 발자국 거리는 5점으로 정한다. 3) 총 10번을 도전하여 슛을 시도한다. 4) 성공한 점수를 모두 합산하여 자신의 최종 점수로 기록한다.</p>
