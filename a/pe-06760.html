<h1>왕관을 지켜라 술래</h1>
<p>1) 접시콘을 머리 위에 올려 왕관을 만들고 조끼를 입은 술래를 피해 걸어 다닌다. 2) 움직이다가 접시콘이 떨어지거나 영역 밖으로 벗어나면 한쪽 무릎을 꿇고 앉는다. 3) 다른 친구가 와서 떨어진 왕관을 머리에 다시 올려주면 부활한다.</p>
