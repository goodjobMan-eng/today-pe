<h1>도망치는 칠면조 (화면 반응형 달리기 놀이)</h1>
<p>1) 화면 속 칠면조가 되어 농장을 탈출하는 신체활동 놀이입니다. 2) 울타리가 나타나면 점프를 하고, 포크가 날아오면 좌우로 점프하여 피합니다. 농부 아저씨가 나타나면 바닥에 배를 대고 엎드려 소리를 내지 않고 숨어야 합니다. 3) 레벨이 올라갈수록 미식축구공 차기, 허리 숙여 피하기, 호박 피하기 등 새로운 동작이 추가됩니다. 4) 총 3단계 레벨을 통과하여 칠면조 댄스 파티를 즐깁니다.</p>
