<h1>짝과 함께하는 배구 언더핸드 리시브 기초 훈련 (무릎 꿇기부터 일어서기까지)</h1>
<p>1) 2인 1조로 마주 보고 서서 한 명이 던져주는 공을 다른 한 명이 한쪽 무릎을 꿇은 낮은 자세로 손목에서 캐치한다. 2) 발을 바꾸어가며 무릎 꿇은 자세에서 캐치와 언더핸드 리시브를 적은 횟수로 번갈아 연습한다. 3) 무릎을 바닥에 대지 않고 자세를 낮게 유지하며 좌우로 움직여 언더핸드 리시브를 수행한다.</p>
