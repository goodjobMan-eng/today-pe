<h1>겨울 테마 교구 창작 빌딩 게임</h1>
<p>1) 각 팀은 벽 쪽 구역에 위치하고 체육관 뒤쪽에 콘을 둔다. 2) 첫 번째 주자가 트랙 한 바퀴를 달린 뒤 중앙에서 교구 1개를 가져와 팀으로 돌아간다. 3) 주자가 교구를 가져오면 다음 사람이 출발하며 겨울과 관련된 구조물을 자유롭게 만든다. 4) 원하는 색깔의 교구가 부족하면 다른 팀을 찾아가 교구를 교환할 수 있다.</p>
