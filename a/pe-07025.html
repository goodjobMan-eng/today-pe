<h1>두 손 타격(티볼 배팅) 기본 동작 연습</h1>
<p>1) 타자는 투수 위치를 향해 어깨와 발을 일직선으로 두고 타깃을 향해 측면으로 선다. 2) 주로 쓰는 손을 반대 손 위에 올려 그립을 쥐고 배트를 어깨 뒤쪽에 둔다. 3) 타격 시 주로 쓰는 손 반대쪽 발로 타깃 방향으로 5~10cm 정도 짧게 발을 내딛는다. 4) 골반이 어깨보다 먼저 회전하는 순차적 회전을 하며 앞발 맞은편에서 팔을 편 상태로 공을 맞추고 몸을 감싸며 팔로우스루를 한다.</p>
