<h1>스포츠 스태킹(3-3-3, 3-6-3, 6-6, 1-10-1)</h1>
<p>1) 왼쪽에서 오른쪽 순서대로 스태킹을 진행한다. 2) 오른손과 왼손을 번갈아가며 컵을 쌓는다(업스태킹). 3) 쌓은 컵을 순서대로 내린다(다운스태킹). 4) 2인 1조 더블 경기는 한 사람은 오른손, 다른 사람은 왼손만 사용하여 협동해 쌓고 내린다.</p>
