<h1>충전 에너지 진놀이</h1>
<p>1) 양쪽 진영 바닥에 원마커나 접시콘으로 원형 기지를 만들고 기지 옆에 라바콘 깃발을 세운다. 2) 모든 참가자가 진영 안에서 100% 충전 후 출발하며, 진영 밖으로 나간 순간부터 에너지가 점차 소모된다. 3) 나중에 진영을 나온 충전량이 높은 사람이 먼저 나온 상대를 태그하여 아웃시키고, 태그된 자는 손을 반짝이며 귀환해 재충전한다. 4) 상대 수비를 따돌리고 적진의 라바콘 깃발을 먼저 터치하거나 낚아채면 1점을 획득한다.</p>
