<h1>엘프 런 크리스마스 브레인 브레이크</h1>
<p>1) 버디가 캔디 케인 숲과 링컨 터널을 통과하도록 달리며 엘프의 주요 식품군 장애물을 피한다. 2) 뉴욕 거리에서 썰매 목격 정보를 확인하며 날아오는 장애물을 피한다. 3) 밸런스 게임 질문이 나오면 선택지에 해당하는 운동 동작을 수행해 의견을 표현한다. 4) 떨어진 엔진을 뛰어넘고 추락하는 썰매 밑으로 숙인 뒤 음악 선물을 주먹이나 발로 쳐서 크리스마스 응원을 퍼뜨린다.</p>
