<h1>안전한 물구나무 앞구르기 단계별 연습</h1>
<p>1) 벽에서 주먹 1~2개 거리에 손을 짚고 발을 차올려 배를 벽 쪽으로 향하게 물구나무서기를 선다.2) 뜀틀 2단을 설치하고 그 위에 올라가 손을 짚은 뒤, 발로 밀어 대각선 앞으로 체중을 이동하며 구르는 연습을 한다.3) 보조자의 지지에 맞춰 물구나무 상태에서 손을 끝까지 밀며 등을 둥글게 말고 배꼽을 보며 앞으로 구른다.</p>
