<h1>로데오 라운드업</h1>
<p>1) 중앙 원이나 콘 등으로 헛간 구역을 표시하고 모든 참가자는 스쿠터에 앉아 이동 준비를 한다. 2) 몇 명의 카우보이 술래는 훌라후프를 들고 스쿠터를 타며, 나머지 말 역할 학생들은 스쿠터만 탄다. 3) 카우보이가 말을 잡으면 잡힌 말은 헛간 안으로 들어가야 한다. 4) 변형으로 바닥에 당근 역할을 하는 주황색 콩주머니를 두고 말들이 잡히기 전에 최대한 많이 모으게 할 수 있다.</p>
