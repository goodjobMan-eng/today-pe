<h1>코너 공 회수하기</h1>
<p>1) 피클볼 코트의 각 코너에 공을 하나씩 올려놓는다. 2) 참가 학생은 베이스라인 센터에서 대기한다. 3) 출발 신호(휘슬)가 울리면 각 코너로 빠르게 뛰어가 공을 하나씩 회수한다. 4) 코트의 모든 공을 주워 베이스라인 센터로 먼저 가져오면 완주에 성공한다.</p>
