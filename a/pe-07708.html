<h1>플로어볼 공 다루기(볼 운반) 기술</h1>
<p>1) 상대의 압박이 없을 때는 공에서 시선을 떼고 주변 상황을 살피며 동료에게 패스할 타이밍을 만든다. 2) 상대의 압박을 받을 때는 다양한 드리블을 활용해 공 소유권을 지킨다. 3) 빠른 달리기 시에는 한 손으로 스틱을 쥐고 볼을 운반하며, 좁은 공간에서 볼을 보호하거나 패스 및 슛을 할 때는 양손으로 스틱을 쥔다.</p>
