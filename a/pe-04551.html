<h1>장애물 피구</h1>
<p>1) 반 아이들을 두 팀으로 나누고 각 팀별로 경기장 밖에서 공을 던질 한 명을 정해 상대방 팀 바깥쪽으로 보낸다. 2) 남은 모두는 자기 영역 안으로 들어가게 한 뒤 영역 가운데에 공을 피할 수 있는 장애물을 놓아준다. 3) 피구 경기가 시작되고 공에 맞으면 밖으로 나가 상대방 영역 밖에서 공을 던지도록 하는 규칙은 모두 똑같다.</p>
