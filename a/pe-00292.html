<h1>스머프 술래잡기 (가가멜·고양이·파파스머프)</h1>
<p>1) 가가멜 2명, 고양이 1명, 파파스머프 1명을 정하고 나머지는 스머프가 되어 도망칩니다. 2) 스머프는 혼자 있을 때만 가가멜에게 잡히며, 친구들과 손을 잡고 있으면 가가멜이 잡을 수 없습니다. 3) 고양이는 손을 잡은 스머프 무리의 양 끝 사람을 터치해 무리를 해체시킵니다. 4) 가가멜에게 터치당한 스머프는 아웃되어 점핑잭 10회를 수행한 뒤 파파스머프에게 구출 요청을 해야 부활합니다.</p>
