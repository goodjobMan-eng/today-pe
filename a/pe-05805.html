<h1>5학년 영역형 럭비형 게임 - 속력과 방향 바꿔 피하기</h1>
<p>1) 공격 번호 학생이 출발 신호에 맞춰 달린다.2) 수비 학생은 정해진 구역에서 공격 학생을 태그하여 잡으려고 시도한다.3) 공격 학생은 달리는 속력과 진행 방향을 바꾸고 속임 동작을 활용하여 수비수를 피해 통과한다.4) 역할을 번갈아 진행하며 팀별로 피하기와 잡기를 교대하여 수행한다.</p>
