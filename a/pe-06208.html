<h1>일대일 축구</h1>
<p>1) 양 선수가 공 옆에 나란히 서서 준비 신호를 기다린다.2) 신호가 울리면 바로 차지 않고 드리블과 속임 동작으로 상대를 제치며 슛을 시도한다.3) 수비수는 상대 공격을 막아내고 공격수는 골을 넣어 점수를 획득한다.4) 골이 들어가거나 플레이가 끝나면 두 선수가 함께 공을 제자리에 가져다 놓는다.5) 마주 보고 손인사(악수)를 나눈 뒤 점수판의 점수를 올리고 다음 주자에게 넘긴다.</p>
