<h1>도착 지점으로 달리기와 주사위 달리기</h1>
<p>1) 두 사람이 마주 보고 각자 뒤쪽 15걸음 거리에 콘을 세워 두고 중간에 마주 보고 엎드린다. 2) 가위바위보를 하여 이긴 사람은 자기 콘으로 달리고 진 사람은 상대 어깨를 터치하면 성공한다. 3) 모둠 활동에서는 4~6명이 원형으로 서서 각자 주사위 눈 번호를 하나씩 정한다. 4) 주사위를 던져 나온 번호의 학생이 술래가 되어 30초 동안 다른 학생들을 터치하고, 잡힌 학생은 팔벌려뛰기 5회를 한다.</p>
