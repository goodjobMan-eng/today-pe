<h1>플로어볼 라인 패스</h1>
<p>1) 팀원들이 마주 보고 서서 포핸드 또는 백핸드로 공을 주고받는다. 2) 패스한 후 상대방 라인 뒤쪽으로 뛰어가서 줄을 선다. 3) 공이 끊기지 않도록 이어가며 목표 패스 개수(30개 또는 50개)를 채운다. 4) 공을 놓치면 직접 가져와서 계속해서 패스를 이어간다.</p>
