<h1>철봉 매달리기 및 흔들기 놀이</h1>
<p>1) 철봉을 잡고 매달리거나 몸을 지탱하며 다양한 동작을 익히는 철봉 놀이를 준비합니다. 2) 통돼지 바비큐처럼 손과 발을 모두 걸고 매달려 좌우로 이동해 봅니다. 3) 원숭이 자세로 매달려 몸을 앞뒤나 좌우로 반동을 주어 흔들거나 턱걸이 버티기에 도전합니다. 4) 박쥐 자세처럼 무릎을 걸고 거꾸로 매달려 보거나, 이불 널기 자세로 배를 대고 엎드려 앞뒤로 몸을 흔듭니다.</p>
