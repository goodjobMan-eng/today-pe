<h1>멀리뛰기의 기본 기능</h1>
<p>1) 서서히 출발하여 발구르기 직전까지 속도를 높이고 마지막 걸음의 보폭을 약간 좁힌다. 2) 편한 발로 발바닥 전체에 체중을 실어 강하게 구르며 반대쪽 다리를 수평으로 차올린다. 3) 공중 정점에서 허리와 어깨를 젖혀 활처럼 폈다가 착지 전 팔다리를 앞으로 뻗는다. 4) 균형을 유지하며 무릎을 굽히고 뒤로 넘어지지 않도록 몸을 앞으로 숙여 착지한다.</p>
