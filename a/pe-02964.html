<h1>동그란 딱지 비교 놀이</h1>
<p>1) 동그란 딱지를 섞고 참가자끼리 똑같이 나눈다. 2) '별높' 또는 '별낮'을 외치며 동시에 딱지 한 장을 보여주고 별의 수가 더 많거나 적은 사람이 가져간다. 3) '글높' 또는 '글낮'을 외쳐 글자 수가 더 많거나 적은 사람이 가져가며 같으면 묻어둔다. 4) '파워짱 가위바위보'를 외쳐 딱지의 가위바위보로 승패를 가르며 파워짱 딱지는 무조건 이긴다.</p>
