<h1>비빔밥 놀이</h1>
<p>1) 3명씩 짝을 이루어 가운데 학생은 '나물'이 되고 양쪽 학생은 손을 잡아 '밥'이 되어 감싼다. 2) 교사(또는 술래)가 &quot;나물&quot;을 외치면 나물이 빠져나와 다른 팀의 밥 속으로 들어간다. 3) &quot;밥&quot;을 외치면 밥이 헤어져 새로운 나물을 찾아 감싸며, &quot;비빔밥&quot;을 외치면 밥과 나물 구분 없이 모두 흩어져 새로 짝을 만든다. 4) 술래를 추가하여 짝을 만들지 못한 1명이 다음 술래가 된다.</p>
