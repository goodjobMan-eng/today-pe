<h1>5가지 체육 스테이션 활동 순환</h1>
<p>1) 학생들은 피트니스 튜브(화면 운동 따라 하기), 컵 쌓기, 가위바위보 올림픽, 이동 기술, 암벽 등반의 5개 스테이션으로 나뉜다. 2) 이동 기술 스테이션에서는 콘 라인을 따라 지정된 동작 기술로 이동하고, 가위바위보 올림픽은 훌라후프 주변을 조심해서 이동한다. 3) 타바타 음악 인터벌 타이머에 맞춰 교사의 안내에 따라 다음 스테이션으로 순환 이동한다.</p>
