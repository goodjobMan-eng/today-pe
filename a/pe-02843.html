<h1>매트 위를 굴러서 콩주머니 옮기기</h1>
<p>1) 매트 양쪽에 바구니를 두고 한쪽 바구니에 콩주머니들을 담아 둡니다. 2) 주자가 콩주머니 1개를 손에 쥐고 매트 위를 좌우로 굴러 반대편 바구니로 이동합니다. 3) 반대편 바구니에 콩주머니를 넣은 후 다시 굴러서 원래 자리로 돌아옵니다. 4) 돌아온 후 다음 주자와 교대하며, 정해진 시간 동안 더 많은 콩주머니를 옮긴 팀이 승리합니다.</p>
