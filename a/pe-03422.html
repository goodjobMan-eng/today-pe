<h1>빈 곳으로 움직이며 공 던지고 잡기</h1>
<p>1) 6명이 한 모둠을 이루고, 각 모둠에서 1명씩 골대 역할을 정한다. 2) 모둠별로 공을 던지고 잡거나 몰면서 이동하여 골대 역할에게 공을 전달하면 점수를 얻는다. 3) 3걸음 이상 이동 시 공을 튀기며 이동해야 한다. 4) 공을 놓치거나 빼앗기면 공격과 수비가 바뀌며, 정해진 시간 동안 점수를 많이 얻은 팀이 승리한다.</p>
