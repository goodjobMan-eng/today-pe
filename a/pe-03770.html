<h1>평영 개구리 발차기 익히기</h1>
<p>1) 수영장 풀사이드에 걸터앉아 발바닥으로 물을 휘젓듯이 차는 연습을 한다. 2) 물속에서 바닥을 딛고 걸어가며 발바닥으로 물을 뒤로 차내는 감각을 익힌다. 3) 발차기 직전 발끝을 바깥(옆) 쪽으로 향하게 열어 물을 모은다. 4) 발바닥으로 물을 뒤로 힘껏 차낸 뒤 두 다리를 곧게 뻗어 유선형 자세를 유지한다.</p>
