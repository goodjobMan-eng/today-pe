<h1>헤이 헤이 굿바이 댄스 웜업</h1>
<p>1) 음악에 맞춰 제자리에서 화면 속 동작을 따라 하는 유산소 댄스 웜업을 시작합니다. 2) 음악 비트에 맞추어 제자리 스텝을 밟고 다리를 한쪽씩 들어 올리며 팔을 흔듭니다. 3) '헤이 헤이 굿바이' 구간에서는 한 손을 머리 위로 흔들며 안녕 인사를 건네듯 동작합니다. 4) 펀치 동작과 점핑 동작을 결합하여 전신의 체온을 올리고 몸을 풉니다.</p>
