<h1>협동 메모리 게임</h1>
<p>1) 경기장 끝 바닥에 메모리 카드들을 뒤집어 배치하고 학급을 2개 팀으로 나눈다. 2) 각 팀은 2인 1조(듀오)로 구성하며, 출발 신호에 맞춰 각 팀의 첫 번째 조가 메모리 구역으로 달린다. 3) 각자 카드를 한 장씩 뒤집어 확인하고, 두 카드가 일치하면 카드를 자기 진영으로 가져온다. 4) 카드가 일치하지 않으면 원래 자리에 다시 뒤집어 두고 진영으로 복귀하며, 더 많은 카드 쌍을 모은 팀이 승리한다.</p>
