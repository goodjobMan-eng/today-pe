<h1>텀블링 타워</h1>
<p>1) 팀 색상과 같은 훌라후프 주변에 팀원들이 둥글게 둘러앉는다. 2) 시작 신호가 울리면 팀원들과 협동하여 후프 안에 블록으로 가장 높은 탑을 쌓는다. 3) 휘슬이 울리고 &quot;손 머리 위로(Hands up)&quot;를 외치면 즉시 손을 떼고 후프 밖으로 물러선다. 4) 손을 뗀 후 탑이 쓰러지지 않고 자립해 있어야 하며, 측정봉으로 쟀을 때 가장 높이 쌓은 팀이 승리한다.</p>
