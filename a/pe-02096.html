<h1>인간 줄다리기</h1>
<p>1) 두 팀으로 나뉘어 가운데 기준선(라바콘)을 두고 선두가 서로 맞잡고 뒷사람들은 앞사람의 허리를 잡습니다. 2) 시작 신호와 함께 뒤로 힘껏 당기며 버팁니다. 3) 손이 떨어지거나 기준선 너머로 더 많이 끌려간 팀이 집니다. 4) 5초 안에 승부가 나지 않으면 무승부 또는 가위바위보로 승패를 결정합니다.</p>
