<h1>단계별 축구 슈팅 기본기</h1>
<p>1) 높은 콘 옆 원마커를 디딤발로 딛고 반대 발로 콘을 가볍게 탭한 뒤 다리를 뒤로 젖혀 발등(신발끈 부위)으로 콘을 찬다. 2) 도움닫기 후 콘 옆에 디딤발을 딛고 다리를 크게 휘둘러 콘을 세게 찬다. 3) 콘 위에 올려진 공 옆 원마커를 딛고 발등으로 공을 강하게 찬다. 4) 콘에서 달려 나와 바닥에 놓인 공을 골대를 향해 발등으로 슈팅한다.</p>
