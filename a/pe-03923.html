<h1>포 코너스 운동 놀이</h1>
<p>1) 술래 1명은 교사 옆에서 눈을 감고 손으로 얼굴을 가려 앞을 보지 않는다. 2) 음악이 나오는 동안 학생들은 체육관 안을 자유롭게 움직인다. 3) 음악이 멈추면 학생들은 코너에 배치된 색깔 콘 중 한 곳으로 이동한다. 4) 술래가 특정 색깔을 외치면 해당 코너에 선 학생들은 점핑잭 5회를 수행하고 게임을 계속 진행한다.</p>
