<h1>뜀틀 운동 (목걸기 뛰어넘기·머리대고 뛰어넘기)</h1>
<p>1) 뜀틀 위에서 목걸기 뛰어넘기(首はね跳び)와 머리대고 뛰어넘기(頭はね跳び)의 회전 동작을 익힙니다. 2) 도움닫기 후 뜀틀에 손을 짚고 발끝을 위로 뻗으며 몸을 회전시킵니다. 3) 목걸기 뛰어넘기는 턱을 당겨 등을 둥글게 말고 진자 운동처럼 반동을 주어 일어납니다. 4) 머리대고 뛰어넘기는 턱을 당기지 않고 시선을 유지해 경추 반사를 활용하여 몸을 곧게 펴며 착지합니다.</p>
