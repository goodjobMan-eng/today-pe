<h1>훌라후프 산 목표 던지기 (물라 마운틴)</h1>
<p>1) 색상별 훌라후프를 피라미드 산 모양으로 층층이 배치하고 꼭대기 너머에 양동이를 놓는다. 2) 2인 1조로 바구니에서 빈백이나 쿠시볼을 꺼내 훌라후프 산을 향해 던진다. 3) 들어간 훌라후프 색깔(빨강 1달러부터 보라 50달러, 양동이 100달러)에 해당하는 장난감 지폐를 은행에서 가져온다. 4) 파트너에게 하이파이브나 팔꿈치 터치를 하고 차례를 넘겨 번갈아 던지며 금액을 모은다.</p>
