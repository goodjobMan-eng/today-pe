<h1>외야수 피구 (Zbijak z matkami)</h1>
<p>1) 양 팀이 각자의 진영에 서고 엔드라인 뒤편에 외야수를 배치한다. 2) 교사가 코트 중앙에 공을 던져 바운드가 3번 된 후 공을 잡아 경기를 시작한다. 3) 공에 직접 맞은 내야수는 아웃되어 상대편 엔드라인 뒤 외야수로 이동한다. 4) 상대가 던진 공을 공중에서 바로 잡으면 아웃된 팀원을 1명 구출할 수 있다.</p>
