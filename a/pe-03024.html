<h1>축구형 및 하키형 원피구 놀이</h1>
<p>1) 콘으로 9m 이상의 원을 만들고 수비팀은 원 안, 공격팀은 원 밖에 선다. 2) 원 밖 공격팀은 고리를 발로 차거나 스틱으로 밀어 넣어 원 안 수비팀의 발을 맞힌다. 3) 고리를 잡은 공격수는 3초 이내에 원 안으로 차 넣어야 하며, 수비팀은 원 안에 멈춘 고리를 빈 곳으로 밖으로 차낼 수 있다. 4) 움직이는 고리에 발이 맞은 수비수는 아웃되어 점수판 앞으로 가 팔벌려뛰기 3회를 하고 실점 1점을 올린 뒤 다시 복귀한다.</p>
