<h1>빈백 보치아</h1>
<p>1) 사각 목표 구역 중앙에 목표 빈백을 둔다. 2) 두 팀이 차례로 번갈아 가며 중앙의 목표 빈백을 향해 자신의 빈백을 던진다. 3) 각 라운드가 끝난 후 목표 빈백에 가장 가깝게 빈백을 놓은 팀이 점수를 획득한다. 4) 발전 단계에서는 5피트, 10피트, 15피트 거리에 콘을 두고 가까운 거리부터 목표 콘에 가장 가깝게 던진 팀이 득점하며 순차적으로 진행한다.</p>
