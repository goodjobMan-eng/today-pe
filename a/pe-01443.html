<h1>유치원·보육원 운동회 부모 참여 레크리에이션 5선</h1>
<p>1) 펭귄 걷기: 부모의 발등 위에 아이가 올라타 함께 보폭을 맞춰 걷습니다. 2) 커피잔 돌리기: 체육 앉기 자세의 아이를 부모가 잡고 제자리에서 회전시킵니다. 3) 원숭이 매달리기: 아이가 부모의 몸에 매달려 떨어지지 않고 버티거나 거꾸로 매달립니다. 4) 코끼리와 비행기: 부모가 아이를 안아 들고 그네처럼 흔들거나 발 위에 눕혀 비행기 자세로 중심을 잡습니다.</p>
