<h1>몸으로 하는 가위바위보 표현 놀이</h1>
<p>1) 교사의 신호에 맞춰 이동하며 만나는 친구와 온몸을 사용해 가위, 바위, 보 동작으로 승부합니다. 2) 1분 이내에 가위바위보를 3번 이긴 학생은 무대(단상) 위로 올라가 대기합니다. 3) 이후 단상에 올라간 학생들과 짝을 이루어 다양한 몸동작으로 가위바위보 표현을 새롭게 연구하고 시연합니다. 4) 짝과 함께 전신을 크게 늘리거나 웅크리는 등 창의적인 동작을 만들어 학급 전체와 공유하며 즐깁니다.</p>
