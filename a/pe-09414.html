<h1>서프라이즈 공</h1>
<p>1) 농구 코트 안에 모든 학생들이 흩어져서 시작한다. 2) 폼볼 여러 개를 코트 곳곳에 흩어놓는다. 3) 학생들이 폼볼을 집어 손으로 다른 사람을 맞힌다. 4) 공에 맞은 사람은 밖으로 나가 자유롭게 이동하다가 떨어진 공을 주워 안의 사람을 맞힐 수 있다. 5) 코트에 단 한 명의 학생만 남을 때까지 진행한다.</p>
