<h1>외나무다리 선 위 순서 바꾸기</h1>
<p>1) 4~6명의 모둠원이 바닥에 그어진 직선(또는 평균대) 위에 일렬로 발을 올리고 섭니다. 2) 교사가 키 순서, 생일 순서, 이름 가나다순 등의 정렬 미션을 제시합니다. 3) 학생들은 선 밖으로 발이 떨어지지 않도록 서로 손을 잡거나 몸을 지탱하며 위치를 바꿉니다. 4) 침묵 모드(말하지 않고 제스처만 사용)나 폭이 좁은 평균대 위에서 진행하는 규칙을 추가하여 난이도를 높입니다.</p>
