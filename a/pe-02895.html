<h1>개미 술래잡기</h1>
<p>1) 술래가 일어나면 빈자리가 생기며, 빈자리 바로 옆에 앉은 사람은 이동할 수 없다. 2) 술래는 빈자리를 향해 걸어가고, 다른 친구들은 먼저 이동해 그 자리에 앉아 술래를 방어한다. 3) 술래가 개미굴에 앉으면 술래가 승리하고 남은 친구들은 벌칙을 수행한다.</p>
