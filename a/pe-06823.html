<h1>종이컵 도미노 운동 놀이</h1>
<p>1) 탁자 위 높은 쪽에 마시는 넓은 부분이 오도록 종이컵 3개를 간격을 두고 도미노처럼 배치한다. 2) 첫 번째 종이컵을 툭 쳐서 굴려 다음 컵을 차례로 밀어 탁자 끝의 목표 상자 안에 컵을 넣는다. 3) 컵이 떨어져 실패하면 그 컵은 내려두고 멀리 놓인 종이컵 보관 장소까지 뛰어간다. 4) 새 종이컵을 가져온 후 점핑잭(팔벌려뛰기)을 2회 실시하고 다시 탁자에 배치하여 성공할 때까지 도전한다.</p>
