<h1>체험형 시각축구</h1>
<p>1) 3인 1조로 한 팀을 구성하고 정안인 2명은 양쪽에 서서 시각 러닝 스트랩을 잡고 시각안대를 쓴 1명은 가운데 선다. 2) 골킥 라인에 도착하면 보조자의 도움을 받아 안대를 쓴 선수가 손으로 공의 위치를 확인한다. 3) 보조자 1명이 전방의 골체험 전용 매트 골대 뒤로 달려가 손뼉을 치며 소리로 방향을 알려준다. 4) 시각 선수가 손뼉 소리를 듣고 매트 골대를 향해 슛을 찬다.</p>
