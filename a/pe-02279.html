<h1>초등학생을 위한 튼튼 스트레칭</h1>
<p>1) 배에 힘을 주고 키 커진 자세로 머리 뒤에 깍지를 끼고 목을 아래로 10초간 늘려준다. 2) 오른손으로 왼쪽 귀를 잡고 목을 늘려주고 반대쪽도 동일하게 10초간 늘려준다. 3) 양손 깍지를 끼고 엄지손가락으로 턱을 10초간 밀어 올린다. 4) 양손 깍지 끼고 기지개를 켜며 옆구리를 좌우로 늘려주고 가슴 펴기와 등 조이기, 어깨 돌리기를 차례로 실시한다.</p>
