<h1>친구의 공 빼앗아 차 내기</h1>
<p>1) 직사각형의 게임장 영역을 정한 후 6명씩 2개의 모둠을 이루고 각자 축구공을 1개씩 준비합니다. 2) 자기 공을 몰면서 상대 모둠의 공을 게임장 밖으로 차 냅니다. 3) 자기 공이 게임장 밖으로 나가면 같은 모둠 친구가 이어 주는 공을 받거나 상대 모둠의 공을 게임장 밖으로 차 내기 위해 움직입니다. 4) 정한 시간이 끝나고 공을 많이 가지고 있는 모둠이 이깁니다.</p>
