<h1>초등 발야구형 게임</h1>
<p>1) 수비 팀은 투수, 포수, 1·2·3루수, 내야수, 외야수로 필드에 위치하고 공격 팀은 홈에서 타순을 정해 대기한다. 2) 투수가 마운드에서 굴려준 공을 타자가 발로 차서 필드 안 빈 곳으로 보낸다. 3) 타자는 공이 수비수에게 잡혀 베이스로 송구되기 전에 1루, 2루, 3루를 차례로 돌아 홈으로 들어오면 1점을 얻는다. 4) 뜬공을 바로 잡히거나 베이스에서 공보다 늦게 도착하여 3아웃이 되면 공수를 교대한다.</p>
