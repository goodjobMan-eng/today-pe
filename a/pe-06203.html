<h1>3학년 공 굴리기</h1>
<p>1) 공을 하나만 사용하여 던지거나 차지 않고, 자세를 낮춰 무릎을 굽힌 채 목표물을 보고 한 발을 내밀며 굴린다.2) 굴린 공이 목표 후프 위에 들어가거나 통과하면 점수를 얻고 공을 주워 다음 주자에게 던지지 않고 손으로 전달한다.3) 거리에 따라 가까운 빨간 후프 1점, 노란 후프 2점, 파란 후프 3점, 가장 먼 형광색 후프에 들어가면 즉시 승리(인스턴트 윈)한다.</p>
