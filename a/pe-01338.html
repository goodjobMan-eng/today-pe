<h1>연못 징검다리 개구리 폴짝 뛰기</h1>
<p>1) 원마커를 S자 형태로 길게 늘어놓고 학급을 두 팀으로 나누어 양쪽 끝 마커 뒤에 한 줄로 선다. 2) 신호와 함께 양 팀 첫 주자가 모둠발로 원마커를 한 칸씩 뛰어넘으며 중앙을 향해 전진한다. 3) 마주친 지점에서 가위바위보를 진행하여 진 사람은 즉시 대열 맨 뒤로 돌아가고 새 팀원이 출발하며, 이긴 사람은 계속 전진한다. 4) 상대 진영의 목표 마커에 도달하면 1점을 획득하며 제한 시간 3분 동안 다득점 팀이 승리한다.</p>
