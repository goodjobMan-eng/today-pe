<h1>달팽이 피구</h1>
<p>1) 운동장에 콘을 놓아 달팽이 모양 트랙을 그리고 수비팀은 한 줄로 달팽이 안으로 들어간다. 2) 공격은 공을 던질 수 없으며, 반드시 바닥으로 굴려서 수비에게 공격한다. 3) 수비는 굴러오는 공을 피하되 같은 편을 앞지를 수 없고 선을 밟으면 안 되며, 달팽이 안과 밖으로 이동한다. 4) 공을 피하지 못하고 맞은 사람은 달팽이 밖으로 나오고, 모든 수비팀이 아웃되면 공격팀과 교대한다.</p>
