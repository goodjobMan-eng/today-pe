<h1>배구 1차시 쓰로우볼</h1>
<p>1) 24명 기준 4명씩 6개 모둠을 만들고 한 코트에 3개 팀이 배정되어 두 팀은 경기하고 한 팀은 심판(주심, 선심, 스코어보드)을 맡는다 2) 가위바위보로 서브권을 정한 뒤 넘어온 공을 무조건 아래에서 위로 무지개 모양을 그리며 던져 패스한다 3) 공을 받기 전에는 움직일 수 있으나 받은 후에는 이동할 수 없으며 모든 팀원이 한 번씩 패스한 후 상대 코트로 던져 넘긴다</p>
