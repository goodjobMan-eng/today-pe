<h1>초등 체육 댄스 파티 수업</h1>
<p>1) 사전 연습을 거친 뒤 체육관에 조명과 야광봉을 준비하고 단체 라인 댄스로 시작한다. 2) 단체 댄스 후 15~20분 동안 음악에 맞춰 자유롭게 프리스타일 댄스를 진행한다. 3) 프리스타일 중에는 그냥 뛰어다니거나 친구를 당기거나 들지 않고 다른 사람의 개인 공간을 존중하며 춤춘다.</p>
