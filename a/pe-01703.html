<h1>교실 의자 원업 앤 힐토 체조</h1>
<p>1) 학생들은 교실 책상 앞 의자에 바른 자세로 앉아 준비한다. 2) 화면 신호에 맞춰 한 손씩 번갈아 위로 찌르는 원업 동작을 20초간 수행하고 5초 휴식한다. 3) 이어서 양발을 뒤꿈치와 앞꿈치 순서로 교대 터치하는 힐토 동작을 20초간 진행하고 5초간 쉰다. 4) 두 가지 루틴을 1회 더 반복하며 신체 협응력과 리듬감을 기르고, 속도를 점진적으로 빠르게 변형할 수 있다.</p>
