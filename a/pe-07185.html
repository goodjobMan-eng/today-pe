<h1>농구 드릴 &amp; 미니게임 모음 (10가지)</h1>
<p>1) 레이업 휠: 6개 팀이 중앙에서 출발해 각각 농구 골대에 레이업을 시도하고 공을 주워 다음 주자에게 넘기며 일정 시간 후 골대를 회전한다. 2) 해적 게임: 전원 드리블하는 중에 공이 없는 2~3명의 해적이 드리블하는 공을 스틸하고, 빼앗긴 사람이 새 해적이 된다. 3) 핫 샷: 코트에 깔린 스팟 마커에서 슛을 성공시키면 해당 마커를 가져와 자기 팀 후프에 모은다.</p>
