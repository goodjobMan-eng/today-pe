<h1>굴러가는 후프 순간 다이빙 통과 챌린지</h1>
<p>1) 한 사람이 훌라후프를 바닥에 세워 굴리고, 도전자는 후프가 굴러오는 궤적의 측면에서 출발 대기한다. 2) 신호와 함께 주자가 전속력으로 달려가 굴러가는 후프의 궤적과 속도를 눈으로 파악한다. 3) 회전하며 굴러가는 후프 원의 중앙 구멍을 향해 몸을 웅크려 부딪히지 않고 한 번에 뛰어 통과한다. 4) 후프의 굴리는 속도를 빠르게 하거나 연속 2연속 후프 통과로 난이도를 높여 성공 여부를 겨룬다.</p>
