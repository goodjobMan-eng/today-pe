<h1>신나는 전신 스트레칭 체조</h1>
<p>1) 학생들은 교사를 향해 양팔 간격으로 넓게 벌려 안전거리를 확보하고 선다. 2) 발목 돌리기와 뒷다리 늘리기부터 시작해 어깨 누르기, 무릎 가슴으로 당겨 중심잡기를 수행한다. 3) 기지개 켜며 뒤꿈치 들기, 옆구리 숙이기, 상체 전굴, 앞굽이·뒷굽이 하체 스트레칭을 음악에 맞춰 진행한다. 4) 경쾌한 음악의 템포에 맞춰 동작당 5~6초씩 전신을 리듬감 있게 스트레칭한다.</p>
