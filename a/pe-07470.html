<h1>구역 피구 (10가지 체육 게임)</h1>
<p>1) 콘으로 코트를 4개 구역과 중앙 통로로 구분하고 구역마다 모둠을 배치한다. 2) 각 모둠에 폼볼을 나누어 주고 상대 팀을 향해 공을 던져 맞히는 피구를 진행한다. 3) 공에 맞은 학생은 중앙 통로로 이동해 끝까지 왕복 달리기를 한 뒤 다시 구역으로 복귀한다.</p>
