<h1>사람 메모리 게임</h1>
<p>1) 두 명의 술래(맞히는 사람)가 잠시 체육관 밖으로 나간다. 2) 나머지 학생들은 2명씩 짝을 지어 고유한 신체 동작을 정하고 교사에게 보여준다(중복 방지). 3) 학생들이 체육관 전체에 흩어져 서면 게임이 시작된다. 4) 두 명의 술래가 학생을 터치하면 해당 학생이 정해진 동작을 수행하며, 같은 동작을 하는 한 쌍을 찾아내면 점수를 얻는다.</p>
