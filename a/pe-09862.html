<h1>맨몸 타바타 체력 운동 루틴</h1>
<p>1) 화면의 카운트다운 신호에 맞춰 20초간 조깅이나 걷기 동작으로 가볍게 몸을 풉니다. 2) 푸시업, 스탠딩 크런치, 마운틴 클라이머, 벤드 앤 스쿱, 플랭크, 카프 레이즈, 러시안 트위스트, 점핑 잭 동작을 각 25초 동안 수행합니다. 3) 각 운동 사이 사이에 20초 조깅 또는 30초 걷기를 쉬는 시간 겸 연결 동작으로 진행합니다.</p>
