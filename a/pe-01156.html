<h1>협동 주먹야구 게임</h1>
<p>1) 수비팀은 각자 지정된 원마커 위에 서고 공격팀은 타격 순서를 정해 타석에 선다. 2) 타자가 공을 주먹으로 치면 공격 모둠원 4명이 한 줄로 함께 베이스를 돈다. 3) 수비팀은 타구를 잡아 자기 원마커를 태그한 뒤 패스로 전원이 마커를 태그해 미션을 끝낸다. 4) 수비 미션 완료 시점 공격 마지막 주자의 통과 베이스 수로 점수를 산정하며 공수 교대한다.</p>
