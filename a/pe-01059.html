<h1>스프링 협력 달리기 릴레이</h1>
<p>1) 두 팀이 원형 대형으로 마주 서서 서로 반대 방향을 바라보며 대기하고 첫 주자를 지정한다. 2) 신호가 울리면 첫 주자는 팀원들이 둘러싼 원의 바깥쪽을 한 바퀴 반 전력으로 달린다. 3) 완주한 주자는 기존 방향의 반대쪽을 바라보고 서며 다음 주자가 바통 터치 후 즉시 반대 방향으로 질주한다. 4) 팀원 전체가 먼저 반대 방향으로 모두 돌아서서 정렬한 팀이 승리하며, 주자 인원수를 늘려 변형할 수 있다.</p>
