<h1>노드리블 패스 연결 초등 변형 넷볼</h1>
<p>1) 팀 조끼를 착용해 두 팀(팀당 4~6명)으로 나누고 중앙 코트에서 패스로 경기를 개시한다. 2) 공을 잡은 선수는 드리블이나 이동을 할 수 없으며 오직 피벗과 제자리 패스로만 전진한다. 3) 공을 갖고 있지 않은 동료들이 빈 공간으로 빠르게 달려나가 패스를 이어받으며 상대 넷볼 골대 앞까지 전진한다. 4) 골대를 향해 슛을 성공하면 득점하며 림을 맞지 않고 빗나가거나 상대가 가로채면 즉시 공수가 교대된다.</p>
