<h1>스킬 챌린지 야구</h1>
<p>1) 1단계: 타구 공을 잡아 지정된 구역 안에 3회 송구를 성공한다.2) 2단계: 날아오는 플라이볼을 3회 캐치한다.3) 3단계: 마운드로 이동하여 스트라이크 존에 공을 3회 통과시킨다.4) 4단계: 타격하여 안타를 3회 성공한다.5) 5단계: 타석에서 3루까지 베이스 러닝을 완주하여 걸린 시간으로 경쟁한다.</p>
