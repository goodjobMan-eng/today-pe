<h1>동작 따라 하기 준비운동</h1>
<p>1) 학급 전체 학생을 코트 테두리 선이나 중앙 원 둘레를 따라 서게 한다. 2) 학생 한 명이 중앙에 서서 준비운동을 이끈다. 3) 중앙의 학생은 스트레칭, 댄스, 기능 동작, 점프, 팔굽혀펴기 등 원하는 신체 동작을 20초간 선보인다. 4) 주변의 모든 학생은 중앙의 학생 동작을 똑같이 따라 하고, 20초가 지나면 다음 학생과 교대한다.</p>
