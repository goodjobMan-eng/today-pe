<h1>기본 줄넘기 익히기</h1>
<p>1) 발뒤꿈치를 살짝 들고 무릎을 굽힌 뒤, 팔꿈치를 몸에 붙이고 손을 허리 높이 약간 앞에 두는 기본 준비 자세를 취한다. 2) 팔꿈치를 몸에 붙인 채 줄을 살짝 넘을 수 있을 정도로 가볍게 두 발 모아 뛰기를 연습한다. 3) 양발이 동시에 닿지 않고 한 발씩 땅에 닿으며 달리는 동작으로 두 발 번갈아 뛰기를 3분 동안 실시한다.</p>
