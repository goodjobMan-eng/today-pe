<h1>녹아웃 농구 슈팅 게임</h1>
<p>1) 5~6명씩 줄을 서고 앞의 두 사람이 농구공을 하나씩 든다. 2) 첫 번째 주자는 라인 뒤에서 첫 슛을 던지고, 슛을 던지는 즉시 바로 뒷사람이 첫 슛을 시도한다. 3) 첫 슛이 안 들어가면 리바운드 후 골대 가까이 원하는 위치 어디서든 슛을 계속 던진다. 4) 앞사람보다 뒷사람이 먼저 골을 넣으면 앞사람은 아웃(녹아웃)되어 다른 코트로 이동하고, 성공한 사람은 다음 주자에게 공을 넘긴다.</p>
