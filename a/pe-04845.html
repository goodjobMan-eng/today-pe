<h1>선풍기 달리기</h1>
<p>1) 운동장에 접시콘으로 커다란 원을 만들고 2~4개 팀으로 나누어 원 둘레에 일정한 각도로 정렬한다.2) 팀별 첫 번째 주자가 원 바깥에 서고 나머지 팀원은 원 안쪽에 대기한다.3) 신호와 함께 바통을 들고 원을 한 바퀴 돌아 다음 주자에게 바통을 전달한다.4) 모든 팀원이 달리기를 마치고 먼저 자리에 앉는 팀이 승리한다.</p>
