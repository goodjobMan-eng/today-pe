<h1>스로우 볼 (배구형 경기)</h1>
<p>1) 각 팀은 코트 앞 2명, 뒤 3명 등으로 자리를 잡고 대기합니다. 2) 서브는 초록선 뒤에서 상대 코트로 공을 던져서 시작합니다. 3) 공을 받은 팀은 팀원끼리 최대 세 번까지 패스하여 상대 코트로 넘깁니다. 4) 공을 가지고 있는 사람은 이동할 수 없으며, 상대 코트로 꽂아 내리지 않고 어깨 위로 높게 던져야 합니다. 5) 패스를 놓치거나 규칙을 위반하면 상대 팀이 득점합니다.</p>
