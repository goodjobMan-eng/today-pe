<h1>피자 토핑 배달 릴레이</h1>
<p>1) 모둠별 출발선 맞은편에 피자 도우 역할을 하는 훌라후프를 1개씩 두고 중앙에 색깔별 빈백을 쌓는다. 2) 출발 신호에 첫 주자가 달려가 원하는 색깔의 토핑 빈백을 1개 골라 후프 안에 넣고 돌아온다. 3) 다음 주자와 하이파이브를 하면 차례로 출발하여 중앙의 빈백이 모두 소진될 때까지 배달한다. 4) 활동 후 모둠별로 토핑 개수를 세며 비교하고 달리기 방식을 깽깽이발이나 갤럽으로 변경한다.</p>
