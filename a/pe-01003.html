<h1>오름판 활용 파워 발야구</h1>
<p>1) 경기장에 홈 오름판과 스트라이크존, 베이스를 설치하고 두 팀으로 나누어 공격과 수비를 정한다. 2) 투수가 볼링 자세로 굴린 공이 오름판을 거쳐 튀어 오르면 타자가 공이 땅에 닿기 전에 발로 찬 뒤 베이스로 달린다. 3) 타자가 찬 공이 수비수에게 잡히지 않고 안타가 되면 진루하여 득점하며, 3아웃이 되면 공수를 교대한다. 4) 투구 및 타격 거리를 학생 수준에 맞추어 조절하고 퍼펙트 스트라이크 존 규칙을 적용하여 긴장감을 높인다.</p>
