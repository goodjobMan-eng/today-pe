<h1>미니 스킬 트라이애슬론 레이스</h1>
<p>1) 출발선에서 체육관 라인 위에 놓인 훌라후프를 향해 언더핸드로 콩주머니를 던져 넣는다. 2) 후프에 넣으면 다음 라인으로 후프를 전진시키며 출발선으로 돌아와 던지기를 반복해 끝까지 전진한다. 3) 콩주머니를 머리 위에 얹고 균형을 잡으며 손으로 훌라후프를 돌려 반대편까지 왕복 이동한다. 4) 바닥에 둔 훌라후프를 발로 차서 다음 체육관 라인에 닿게 하며 목표 지점까지 전진한다.</p>
