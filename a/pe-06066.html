<h1>뉴-얼음땡</h1>
<p>1) 술래에게 터치된 사람은 양다리를 넓게 벌리고 얼음 상태로 멈춘다.2) 다른 친구가 멈춰 선 친구의 다리 사이로 뒤에서 앞으로 빠져나가면 해동된다.3) 해동된 친구는 다시 도망칠 수 있다.4) 얼음이 된 친구를 도와주는 사람은 술래가 터치할 수 없다.</p>
