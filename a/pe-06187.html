<h1>5학년 스포츠 영역형 럭비형게임 2차시(활동2)</h1>
<p>1) 공을 가진 팀은 패스를 연결하며 인원수를 늘려가고 수비는 공을 받을 사람을 막는다.2) 패스를 받아 터치할 때마다 1명씩 인원수가 추가된다.3) 패스 중 공을 떨어뜨리거나 빼앗기면 인원수가 리셋된다.4) 팀원 5명이 모두 패스를 연결하면 1점을 득점한다.</p>
