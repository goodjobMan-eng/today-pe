<h1>인간 오코노미야키 2</h1>
<p>1) 2명의 어린이가 오코노미야키가 되어 엎드린다. 2) 부모(술래)가 굽는 사람이 되어 엎드려 있는 오코노미야키를 뒤집으려 한다. 3) 오코노미야키는 뒤집히지 않도록 버틴다. 4) 제한 시간 안에 2장의 오코노미야키를 모두 뒤집으면 굽는 사람의 승리이고, 뒤집히지 않으면 오코노미야키의 승리이다.</p>
