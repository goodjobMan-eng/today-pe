<h1>4학년 구르기 앞구르기 심판 활동</h1>
<p>1) 매트에서 학생이 앞구르기 동작을 수행한다.2) 관찰하는 심판 학생들은 동작을 보고 점수를 매긴다.3) 심판 학생들은 정수리가 닿았는지, 다리가 펴졌는지 등 잘한 점과 고칠 점에 대해 심사평을 말해준다.4) 심사평 피드백을 들은 후 고칠 점을 반영하여 다시 동작을 연습하고, 마친 학생은 조끼를 벗고 매트에 앉아 대기한다.</p>
