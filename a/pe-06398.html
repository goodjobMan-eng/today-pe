<h1>마리오 칠면조 찾기 움직임 놀이</h1>
<p>1) 화면 속 모험 영상을 보며 제자리 걷기, 점프, 발 구르기, 깽깽이 뛰기 동작을 순서대로 따라 한다.2) 적 캐릭터가 등장하면 안내에 따라 제자리에서 점프하기, 숙이기, 펀치 날리기, 발차기, 피하기 동작을 수행한다.3) 쿠파에게 도달한 후 쿨다운 스트레칭 자세를 화면에 맞춰 따라 하며 마무리한다.</p>
