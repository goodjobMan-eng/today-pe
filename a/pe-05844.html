<h1>훌라후프 드리블 코치와 올스타</h1>
<p>1) 짝을 지어 한 명은 코치, 다른 한 명은 올스타 선수가 됩니다.2) 코치는 줄넘기를 잡고 바닥에서 훌라후프를 끌고 이동합니다.3) 올스타 선수는 움직이는 훌라후프 안쪽으로 공을 드리블합니다.4) 코치는 지그재그나 곡선으로 훌라후프를 자유롭게 움직일 수 있으며, 1분마다 역할을 바꿉니다.</p>
