<h1>도전 공중부양 단합 미션</h1>
<p>1) 10명 내외의 모둠원들이 거리 두기를 유지하며 각자 개성 있는 점프 포즈를 정한다. 2) 교사의 '하나, 둘, 셋' 구호에 맞춰 모든 학생이 동시에 공중으로 뛰어오른다. 3) 교사가 카메라로 사진을 촬영하여 전원의 두 발이 바닥에서 떠 있는지 확인한다. 4) 한 명이라도 발이 땅에 닿아 있으면 실패하며 전원이 공중에 뜬 사진이 찍힐 때까지 도전한다.</p>
