<h1>노 킹크 후프 활동 모음</h1>
<p>1) 후프 위에 손을 올리고 바닥에서 돌리는 스핀 대결을 한다.2) 짝에게 손을 위에 얹고 밀어 굴려 전달하거나 두 개를 동시에 밀어 보낸다.3) 바닥의 후프 안으로 두 발로 점프하며 통과한다.4) 이동하다가 멈춤 신호에 같은 후프에 두 발을 넣거나 서로 다른 색상의 후프에 발을 넣는다.</p>
