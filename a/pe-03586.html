<h1>앞구르기 단계별 도전 활동</h1>
<p>1) 매트와 친해지는 탐색 놀이를 하고, 손을 발 가까이 짚고 머리 뒤통수를 매트에 대며 몸을 둥글게 만들어 구른다. 2) 구르는 순간 무릎을 가슴 쪽으로 끌어안아 반동으로 한 번에 일어선다. 3) 경사 매트를 활용하여 경사면을 타고 앞으로 자연스럽게 굴러 일어나는 연습을 한다. 4) 발 앞에 허들 등 보조 장애물을 두고 손을 멀리 짚으며 점프 또는 추진력을 붙여 앞으로 구른다.</p>
