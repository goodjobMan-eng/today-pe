<h1>바퀴의자 릴레이</h1>
<p>1) 팀을 나누어 순서대로 게임을 준비한다. 2) 게임이 시작되면 순서대로 두 명이 나와 1번은 의자에 양반다리로 앉고 2번은 밀어준다. 3) 1번 친구는 가지고 출발한 공을 통에 던져 넣어야 하며, 정해진 선을 넘어서면 안 된다. 4) 2번 친구는 1번 친구가 실패할 때마다 공을 다시 주워서 1번 친구에게 전해주며 마지막 친구가 도착할 때까지 릴레이를 이어간다.</p>
