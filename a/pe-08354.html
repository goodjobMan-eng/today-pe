<h1>팀조끼 던지기 태그와 드리블 술래잡기</h1>
<p>1) 콘으로 표시된 구역 안에서 술래가 팀조끼를 던져 다른 사람을 맞힌다. 2) 조끼에 맞은 사람이 새 술래가 되어 조끼를 주워 다른 사람을 맞히러 가고 이전 술래는 도망친다. 3) 공을 추가한 단계에서는 도망치는 학생들이 공을 드리블하고, 조끼를 던져 맞힌 술래가 그 사람의 축구공을 빼앗아 드리블을 시작한다.</p>
