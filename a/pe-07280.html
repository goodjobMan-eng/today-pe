<h1>동물 릴레이</h1>
<p>1) 콘 뒤에 줄을 서서 팀을 구성한다. 2) 교사가 동물을 제시하면 첫 주자는 해당 동물의 특징을 흉내 내며 콘을 돌아온다. 3) 돌아와서 다음 주자와 하이파이브를 하면 다음 주자가 출발한다. 4) 팀의 모든 주자가 마칠 때까지 진행하고 다음 동물로 바꾼다.</p>
