<h1>철봉 앞 지지</h1>
<p>1) 어깨 높이로 설치된 철봉을 캥거루 그립(엄지를 감싸지 않고 어깨너비로 오버그립)으로 잡는다.2) 점프하여 올라와 팔을 곧게 펴고 다리를 모아 곧게 편 상태로 몸을 지탱한다.3) 팔과 다리를 곧게 편 채 3초간 앞 지지 자세를 유지한다(3, 2, 1 카운트).4) 세 번 반동을 주며 안전하게 매트 위로 착지(모터바이크 자세)한다.</p>
