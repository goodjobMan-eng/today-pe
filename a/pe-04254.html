<h1>리듬 가위바위보 열차</h1>
<p>1) 음악 리듬에 맞춰 켄켄(한 발 뛰기)으로 이동하며 가까운 사람과 가위바위보를 합니다. 2) 진 사람은 이긴 사람의 뒤에 멈춰서 어깨에 손을 올립니다. 3) 연결된 상태에서 리듬에 맞춰 켄켄으로 이동합니다. 4) 음악 리듬을 바꿔서 놀아봅니다.</p>
