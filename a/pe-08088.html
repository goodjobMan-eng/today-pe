<h1>플로어하키 드리블 및 슈팅</h1>
<p>1) 교사의 '드리블' 신호에 맞춰 플로어하키 스틱의 양면을 활용해 퍽을 컨트롤하며 빈 공간으로 드리블한다. 2) 교사가 '얼음(Freeze)'을 외치면 즉시 멈추고 몸을 낮춰 슈팅 자세를 취한다. 3) 교사가 '슛(Shoot)'을 외치면 주변의 빈 벽을 찾아 퍽이 벽에 맞도록 슈팅한다. 4) 슈팅 후 신속하게 자신의 퍽을 회수한 뒤 다시 빈 공간을 찾아 드리블을 이어간다.</p>
