<h1>미니 테니스</h1>
<p>1) 테니스 코트의 서비스 박스 구역을 활용해 복식(2 대 2) 경기를 구성한다. 2) 서버가 자신에게 원바운드 드롭 서브를 넣으며 경기를 시작한다. 3) 탁구 복식처럼 같은 팀끼리 한 번씩 번갈아 가며 공을 친다. 4) 공이 바운드된 후에만 쳐야 하며 노바운드 발리는 허용되지 않는다.</p>
