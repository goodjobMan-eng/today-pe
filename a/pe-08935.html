<h1>앞으로 던지기(팔꿈치 활용)</h1>
<p>1) 던지는 방향으로 정면으로 서서 다리 보폭을 어깨너비 만큼 벌려 살짝 낮춘다. 2) 던지는 팔꿈치를 어깨 높이만큼 들어 올려 팔꿈치를 위로 구부린다. 3) 보조 손은 던지는 손의 팔꿈치를 지탱해 주어 팔꿈치와 손목을 사용하여 볼을 던진다. 4) 보조 손은 던지는 손을 지탱하여 팔꿈치가 어깨보다 내려가지 않도록 한다.</p>
