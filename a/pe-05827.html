<h1>음악에 맞춘 10회 팔굽혀펴기 / 10회 윗몸일으키기 구령 운동</h1>
<p>1) 음악 신호와 안내 음성에 맞춰 팔굽혀펴기(Push-up) 구간을 시작한다.2) 'Down-Up' 구령 카운트에 맞춰 팔굽혀펴기 10회를 정확히 수행한다.3) 전환 신호 후 윗몸일으키기(Curl-up) 구간으로 넘어가 'Up-Down' 구령에 맞춰 10회를 실시한다.4) 팔굽혀펴기 10회와 윗몸일으키기 10회 세트를 음악이 끝날 때까지 번갈아 반복한다.</p>
