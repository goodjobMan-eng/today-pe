<h1>깃발 뺏기 게임 규칙</h1>
<p>1) 운동장을 반으로 나누어 양 팀이 각자의 진영을 사용합니다. 2) 상대 진영으로 건너가 진영 안의 공(깃발)을 6개 먼저 모으는 팀이 승리합니다. 3) 상대 진영에서 깃발을 빼앗기면 감옥으로 가야 하며 팀원의 구조를 받을 수 있습니다.</p>
