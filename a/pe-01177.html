<h1>체공시간이 긴 풍선 배구 게임</h1>
<p>1) 4명의 학생이 2대 2로 팀을 나누고 체육관 바닥의 코트 라인을 기준으로 양쪽에 마주 선다. 2) 가위바위보로 서브권을 정한 뒤 손으로 풍선을 쳐서 상대 코트로 넘기며 경기를 시작한다. 3) 풍선을 손으로 쳐서 라인을 넘겨 상대 영역의 바닥에 떨어뜨리면 1점을 득점한다. 4) 모둠 내 학생 수를 3대 3으로 늘리거나 터치 횟수 제한(3회 이내)을 두어 변형하여 진행할 수 있다.</p>
