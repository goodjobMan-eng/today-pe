<h1>패들 타격 자기주도형 연습 과제</h1>
<p>1) 탁구 네트가 설치된 테이블과 패들, 폼볼을 준비한다. 2) 학생들은 자신의 수준에 맞춰 목표 타격 횟수(5회, 10회, 20회)를 선택한다. 3) 선택한 목표 횟수에 도달할 때까지 패들로 공을 치며 랠리를 이어간다. 4) 성공 여부에 따라 플래그넷 판의 수준별 지표에 자신의 달성도를 기록한다.</p>
