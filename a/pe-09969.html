<h1>풍선으로 끝내는 비접촉 교실놀이 5종</h1>
<p>1) 각자 1개의 풍선을 든다. 2) 1분 동안 정해진 영역에서 제기차기를 한다. 3) 1분 후 개수로 승패를 가린다. 4) 상대방의 영역에 침범하면 돌아온다. 5) 풍선이 떨어지면 다시 주워 찬다.</p>
