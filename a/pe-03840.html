<h1>피스톨 스쿼트 챌린지</h1>
<p>1) 주변에 부딪힐 만한 위험 요소가 없는 안전한 공간을 확보한다. 2) 한 발로 균형을 잡고 양손과 반대쪽 발을 공중에 띄운다. 3) 턱을 목 쪽으로 당겨 유지한 상태에서 엉덩이가 바닥에 닿을 때까지 앉았다가 밀어 올린다. 4) 익숙해지면 성공할 때마다 발을 번갈아 가며 연속으로 도전한다.</p>
