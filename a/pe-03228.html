<h1>농구형 기초 공 몰기(드리블) 연습</h1>
<p>1) 자세를 낮추고 무릎을 살짝 굽혀 기본 드리블 자세를 잡는다. 2) 공을 손끝으로 누르듯이 손목 스냅을 이용해 바닥에 튕긴다. 3) 시선은 바닥 대신 이동할 방향 및 상대방을 바라본다. 4) 공을 튕기며 원하는 방향으로 몰며 이동한다.</p>
