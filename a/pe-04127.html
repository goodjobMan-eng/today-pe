<h1>하프코트 3대3 농구 토너먼트</h1>
<p>1) 조끼를 입고 3명 또는 4명으로 팀을 구성하며, 4명인 팀은 득점이 날 때마다 교대한다. 2) 가위바위보로 첫 공격권을 정하고 하나의 골대에서 하프코트 경기를 시작한다. 3) 공격권이 바뀔 때마다 팀원 전원에게 패스를 돌린 후에만 슛을 시도할 수 있다. 4) 아웃 오브 바운즈 없이 진행하며 1골당 1점으로 계산하여 3분 동안 경기한다.</p>
