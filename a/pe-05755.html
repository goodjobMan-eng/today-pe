<h1>가슴 높이에서 공 던지기</h1>
<p>1) 태권도 다리 자세를 취하고 공을 가슴 앞에 들고 준비한다.2) 구호 '내밀'에 공을 가슴 쪽으로 당긴다.3) 구호 '면서'에 앞다리를 앞으로 뻗으며 가슴에서부터 공을 앞으로 던진다.4) 동작에 성공하면 점차 원마커 뒤로 물러나 거리를 넓히며 연습한다.</p>
