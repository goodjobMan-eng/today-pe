<h1>탁구 백핸드 커트 기초</h1>
<p>1) 무릎을 굽히고 상체를 숙인 낮은 기본자세에서 오른발이 앞으로 나가며 커트 타구를 한다. 2) 깊은 공이 올 때는 왼발이 이동하며 커트하고 빠르게 원래 위치로 돌아와 대기한다. 3) 라켓 면을 눕힌 상태에서 팔 전체가 아닌 팔꿈치를 내밀며 손목을 살짝 꺾어 밀어준다. 4) 공의 중간보다 약간 윗부분부터 긁어주듯이 타구하여 네트를 넘긴다.</p>
