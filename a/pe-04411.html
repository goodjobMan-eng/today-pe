<h1>팩토리 라인</h1>
<p>1) 출발 지점의 훌라후프에 여러 물건을 담아 준비한다. 2) 학생들은 바닥에 앉아 발을 사용하여 물건을 다음 사람에게 전달한다. 3) 물건이 바닥에 떨어지면 다시 출발 지점으로 보낸다. 4) 모든 물건을 도착 지점의 훌라후프까지 옮기면 성공한다.</p>
