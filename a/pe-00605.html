<h1>보조 도구를 활용한 철봉 거꾸로 오르기 연습</h1>
<p>1) 철봉 아래에 발판 보조대, 뜀틀 상자, 수건 등 보조 도구를 준비합니다. 2) 발판 보조대를 딛고 올라가며 점차 발을 구르는 위치를 낮춰 가면서 거꾸로 오르기 감각을 익힙니다. 3) 뜀틀 상자 등 작은 발판을 이용하거나 친구가 등과 몸을 받쳐 주며 보조합니다. 4) 수건이나 보조 밴드로 허리와 철봉을 고정해 몸이 떨어지지 않게 하고 혼자서도 안전하게 회전 연습을 합니다.</p>
