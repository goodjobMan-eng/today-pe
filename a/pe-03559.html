<h1>멀리 멀리</h1>
<p>1) 반 전체를 네 모둠으로 나누고 모둠별로 달리는 순서를 정한 뒤, 모둠별로 자신의 모둠 후프 옆에 선다. 2) 출발 신호와 함께 첫 번째 모둠원이 자신의 모둠 후프 안에 있는 콩주머니를 들고 게임장 가운데 그려진 선 안으로 옮긴다. 3) 콩주머니를 선 안에 놓고 '옮기기 완료'라고 외치면 다음 순서의 모둠원이 출발한다. 4) 자신의 모둠 후프 안에 있는 콩주머니를 가장 빨리 선 안으로 모두 옮긴 모둠이 이긴다.</p>
