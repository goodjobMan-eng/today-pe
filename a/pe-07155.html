<h1>발로 전달하기 (패스 잇 온)</h1>
<p>1) 팀별로 바닥에 등을 대고 천장을 보며 머리와 발이 맞닿도록 일렬로 눕는다. 2) 줄의 맨 앞과 맨 끝에 훌라후프를 각각 놓고, 맨 앞사람 발밑 후프 안에 여러 교구를 넣는다. 3) 손은 바닥을 짚어 균형을 잡는 데만 사용하고 오직 발만을 이용해 다음 사람에게 물건을 전달한다. 4) 물건이 바닥에 떨어지면 다시 발로 집어 올려 끝 후프에 들어갈 때까지 전달을 이어간다.</p>
