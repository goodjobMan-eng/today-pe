<h1>할로윈 그린치 런</h1>
<p>1) 마을을 달리며 호박, 박쥐, 유령 장식을 없애기 위해 장애물을 피한다. 2) 집 안에 들어가 거미줄을 쳐내고, 조명을 잡으며, 회전하여 할로윈 트리의 리본을 푼다. 3) 놀라게 하려는 장난감 거미를 점프하여 밟고 다음 집으로 이동한다. 4) 거리에서 춤을 추며 장식물을 피하고, 빼앗았던 사탕을 다시 던져 돌려준다.</p>
