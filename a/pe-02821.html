<h1>부딪치거나! 들어가거나!</h1>
<p>1) 교실 바닥 중앙에 분필이나 마스킹 테이프로 점수 구역을 그린다. 2) 둘러앉은 팀원들이 정해진 자리에서 고리를 바닥에 놓고 밀어서 점수 구역으로 보낸다. 3) 고리가 점수 구역에 완벽히 들어가면 10점, 선에 걸치면 5점을 획득한다. 4) 다른 고리와 부딪힐 때마다 보너스 1점을 추가하며 모든 투구가 끝난 후 합산 점수가 높은 팀이 승리한다.</p>
