<h1>볼링핀 돌리기 술래잡기</h1>
<p>1) 3~5인 1조로 구성하고 강당 한편에 후프, 볼링핀, 펀스틱을, 반대편에 후프와 같은 색깔의 콘을 둔다. 2) 한 학생이 후프 안에서 볼링핀을 돌린다. 3) 볼링핀이 멈추었을 때 핀이 가리키는 학생이 술래가 되어 펀스틱을 잡는다. 4) 다른 학생들은 반대편 콘까지 도망치고 술래는 펀스틱으로 태그를 시도한다.</p>
