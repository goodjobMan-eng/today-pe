<h1>경사로와 원통 장애물 기어 통과하기</h1>
<p>1) 경사로와 원통 터널, 착지 매트로 연결된 장애물 코스 앞에 선다. 2) 양손과 무릎을 바닥에 대고 엎드려 경사로를 향해 준비 자세를 취한다. 3) 팔과 다리를 교차로 움직이며 경사로를 올라가 원통 터널 안으로 천천히 기어 들어간다. 4) 원통을 통과하여 반대편 경사로로 내려올 때는 무게중심을 뒤로 두어 앞으로 쏠리지 않도록 조절하며 안전하게 내려온다.</p>
