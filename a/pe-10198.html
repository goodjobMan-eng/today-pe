<h1>초등학생을 위한 올바른 달리기 기초 자세와 훈련법</h1>
<p>1) 베이스 포지션 자세를 익히고 한쪽 다리로 10초간 유지한다. 2) 제자리에서 몸을 뼛조각처럼 꼿꼿이 세우고 앙클 호핑을 10회 한다. 3) 베이스 포지션을 유지하며 앙클 호핑을 결합한 체인지 동작을 연습한다. 4) 포켓 앞과 코 앞을 기준으로 올바른 팔 스윙 동작을 익힌다.</p>
