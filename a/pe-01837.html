<h1>구역 제한 3존 축구</h1>
<p>1) 경기장을 수비·미드필더·공격 3개 구역으로 나누고 팀별로 각 구역과 골키퍼를 배치합니다. 2) 선수들은 배정된 구역 밖으로 절대 벗어날 수 없으며 공이 해당 구역에 올 때만 플레이합니다. 3) 패스로 구역을 통과시켜 상대 골대에 골을 성공시키면 팀 득점으로 인정됩니다. 4) 일정 시간마다 수비-미드필더-공격 구역 포지션을 순환하여 모든 역할을 경험하도록 변형합니다.</p>
