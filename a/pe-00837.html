<h1>세인트 패트릭 데이 프리즈 댄스 벽 피하기 놀이</h1>
<p>1) 신나는 음악이 나오는 동안 자유롭게 춤을 추며 신나게 몸을 움직입니다. 2) 벽이 다가오면 화면에 나타난 클로버 벽의 자세(요가/스트레칭 포즈)와 똑같이 몸을 정지합니다. 3) 벽의 구멍 모양과 정확히 일치하는 자세를 유지하여 벽을 통과해야 합니다. 4) 매 라운드마다 다른 포즈를 취하며 끝까지 떨어지지 않고 생존하면 성공합니다.</p>
