<h1>인사이드 풋 패스 및 트래핑 훈련</h1>
<p>1) 두 사람이 콘 위치에 마주보고 선다. 2) 한 발을 내딛으며 발 안쪽(인사이드)으로 파트너를 향해 공을 패스한다. 3) 굴러오는 공을 신발 밑바닥 등으로 트래핑해 멈춘 후 다시 발 안쪽으로 패스한다. 4) 익숙해지면 공을 건드리지 않고 공 위로 발을 넘기는 헛다리 동작(스텝오버)을 한 후 패스한다.</p>
