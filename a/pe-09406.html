<h1>코어 엑서사이즈</h1>
<p>1) 상체를 바르게 펴서 무릎을 세워 앉고 팔을 앞으로 뻗어 준비한다. 2) 발을 바닥에서 들어올린 후 다리를 펴서 몸을 V자 모양으로 만든다. 3) 무릎을 구부리며 가슴 쪽으로 끌어당기면서 양팔을 다리 옆으로 모아준다.</p>
