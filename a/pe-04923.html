<h1>농구 레이업 슛 및 원핸드 슛</h1>
<p>1) 골대를 향해 달려가며 오른발, 왼발 스텝을 밟고 무릎을 들어 올리며 높이 점프한다.2) 공을 골대에 올려놓듯이 부드럽게 레이업 슛을 넣는다.3) 무릎을 가볍게 굽힌 상태에서 공을 머리 위로 올리고 팔꿈치를 펴며 원핸드 슛을 쏜다.</p>
