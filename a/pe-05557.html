<h1>곰-연어-모기 가위바위보 놀이</h1>
<p>1) 곰은 팔을 뻗어 위협하는 동작, 연어는 소리 없이 엉덩이를 흔드는 동작, 모기는 '위잉' 소리를 내며 날아다니는 손 동작을 정한다.2) 곰은 연어를 잡고, 연어는 모기를 이기며, 모기는 곰을 무는 물고 물리는 규칙을 확인한다.3) 신호에 맞춰 각자 표현하고 싶은 동작을 동시에 취한다.4) 상성에 따라 이긴 사람이 승점을 얻으며 3판 2선승제로 대결한다.</p>
