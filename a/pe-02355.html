<h1>큰 공 피하기</h1>
<p>1) 공 굴리는 모둠과 공 피하는 모둠을 나눕니다. 2) 공 굴리는 모둠은 4명씩 짝을 이루고 선을 따라 큰 공을 굴립니다. 3) 공 피하는 모둠은 출발선에서 대기하다가 신호와 함께 큰 공을 피해 도착 지점까지 이동하며, 굴리는 공에 몸이 닿으면 게임장 밖으로 나갑니다. 4) 역할을 바꾸어 진행하고 도착 지점까지 안전하게 도착한 모둠원이 많은 모둠이 이깁니다.</p>
