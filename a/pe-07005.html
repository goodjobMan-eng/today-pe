<h1>액티브 테트리스</h1>
<p>1) 가정 내 물건 4종류를 각각 4개씩(총 16개) 모아 4x4 정사각형 형태로 섞어서 배치한다. 2) 출발선에서 출발하여 물건이 놓인 구역까지 달려간다. 3) 물건을 가로 또는 세로 직선 방향으로 인접한 두 개만 한 번 자리를 바꾼 뒤 출발선으로 되돌아온다. 4) 바닥 가장 아랫줄에 같은 종류의 물건 4개가 모두 모이면 그 줄의 물건을 획득하여 치우고 다음 줄을 진행한다.</p>
