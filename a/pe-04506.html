<h1>농구 원스텝 레이업 슛 연습</h1>
<p>1) 골대 옆 콘 앞에 농구공을 들고 선다. 2) 골대 왼쪽에서는 오른발로 디디며 점프하여 왼손으로 백보드 네모 상단 모서리를 노려 슛한다. 3) 골대 오른쪽에서는 왼발로 점프하고 오른쪽 무릎을 높이 들며 오른손으로 슛한다. 4) 동작에 익숙해지면 가벼운 도움닫기를 추가하여 연습한다.</p>
