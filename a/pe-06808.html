<h1>올터치 바운싱 손족구</h1>
<p>1) 책상 네트를 사이에 두고 양 팀 4명씩 코트에 위치한다. 2) 팀원 4명이 한 번씩 모두 공을 원바운드로 터치해야 한다. 3) 4명이 빠짐없이 터치한 네 번째에 공을 쳐서 상대 코트로 넘긴다. 4) 올터치를 완성하지 못하고 넘기면 실점하여 상대 팀이 1점을 얻고, 전 팀원은 함께 스쿼트 1회를 수행한다.</p>
