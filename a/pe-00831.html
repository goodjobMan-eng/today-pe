<h1>겨울 노움 찾기 동작 퀴즈</h1>
<p>1) 화면 속 장식물 뒤로 숨어 움직이는 노움(요정)의 위치를 눈으로 집중해서 추적합니다. 2) 노움이 어느 장식물 뒤에 숨었는지 예측하고 해당 장식물 아래에 지정된 운동 동작, 요가 자세, 또는 댄스 동작을 수행합니다. 3) 타이머가 끝날 때까지 바른 자세로 신체활동을 유지하며 정답을 확인합니다. 4) 레벨이 올라갈수록 장식물 개수와 섞이는 속도가 빨라지므로 끝까지 집중해 도전합니다.</p>
