<h1>테이블탑 하키</h1>
<p>1) 긴 테이블 위에 3개의 동전을 서로 일정한 간격을 두고 배치한다. 2) 한 동전을 다른 두 동전 사이의 틈으로 미끄러뜨려 통과시키며 전진한다. 3) 동전이 다른 두 동전 사이를 완전히 통과하지 못하거나 동전끼리 충돌하거나 테이블 밖으로 떨어지면 차례가 상대방에게 넘어간다. 4) 테이블 중앙선을 넘은 뒤 테이블 끝 모서리를 향해 슛을 날려 떨어지는 동전을 손으로 잡으면 득점으로 인정된다.</p>
