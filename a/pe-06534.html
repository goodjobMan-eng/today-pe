<h1>플라잉디스크 교실 릴레이 및 폭탄 돌리기 게임</h1>
<p>1) 모둠별로 둥글게 원을 만들고 플라잉디스크를 준비한다. 2) 시계 방향과 반시계 방향으로 디스크를 손으로 빠르게 1바퀴씩 전달하는 디스크 릴레이를 한다. 3) 눈을 감고 소리와 손의 감각에만 의존하여 디스크를 전달하는 블라인드 릴레이에 도전한다. 4) 디스크를 폭탄으로 정하고 2초 안에 옆 사람에게 넘기며 타이머 종료 시 디스크를 들고 있는 사람이 탈락하는 폭탄 돌리기를 진행한다.</p>
