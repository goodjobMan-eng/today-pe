<h1>볼탑 쌓기 활동</h1>
<p>1) 팀원 전원이 번갈아가며 한 개씩 플로어볼 공을 올린다. 2) 손을 사용하되 공을 쌓은 후에는 손을 뗀다. 3) 한 번 쌓은 공은 위치를 변경할 수 없으며 도중에 무너지면 처음부터 재도전한다. 4) 제한 시간 3분 동안 가장 높이 쌓은 팀이 승리한다.</p>
