<h1>콕으로 콕 받기 챌린지</h1>
<p>1) 1인당 셔틀콕 2개씩 준비하여 양손에 각각 하나씩 쥐거나 준비 자세를 잡는다. 2) 셔틀콕 1개를 머리 위로 1m 이상 던진 후 다른 손에 든 셔틀콕으로 받는다. 3) 10회씩 던지고 받는 동작을 충분히 연습하여 감각을 익힌다. 4) 2분의 제한 시간 동안 셔틀콕으로 셔틀콕을 받아낸 성공 횟수를 측정하여 목표 기록에 도전한다.</p>
