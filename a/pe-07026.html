<h1>원스텝 멀리뛰기(리프) 기초 동작 연습</h1>
<p>1) 1m 도약 구역을 원마커로 표시하고 짧은 도움닫기 거리를 확보한다. 2) 학습자는 도약 구역까지 달려와 구역 안에서 한 발로 힘차게 발을 굴러 가능한 한 멀리 도약한다. 3) 공중에서 다리를 펴고 팔과 다리를 반대로 교차한 뒤 반대쪽 발로 착지한다. 4) 착지 후 급정지하지 않고 달리는 동작을 부드럽게 유지하며 앞으로 빠져나간다.</p>
