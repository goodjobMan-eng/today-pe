<h1>파트너 및 그룹 협동 줄넘기·달리기</h1>
<p>1) 2인 1조가 나란히 서서 하나의 줄넘기를 함께 잡고 타이밍에 맞춰 제자리 도약을 한다. 2) 줄을 돌리며 호흡을 맞춰 앞으로 나란히 조깅 스텝으로 달린다. 3) 인원을 3인으로 늘려 나란히 손을 잡고 함께 회전하는 줄을 뛰어넘는다. 4) 양쪽에서 긴 줄을 돌리고 여러 명이 일렬로 서서 연속으로 함께 줄을 넘으며 이동한다.</p>
