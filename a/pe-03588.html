<h1>배드민턴 스텝 및 셔틀콕 치기 연습</h1>
<p>1) 대각선으로 날아오는 셔틀콕을 연속 2번 치는 것에 도전한다. 2) 셔틀콕을 친 다음 포핸드나 백핸드 스텝을 밟으며 빠져나간다. 3) 스텝 방법으로 '꼭 백 포켓', '왼발 오른발', '걸어서 이동' 중 적절한 방식을 활용한다. 4) 백핸드로 칠 때는 엄지를 세워 라켓을 받치고 친다.</p>
