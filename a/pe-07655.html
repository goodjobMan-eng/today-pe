<h1>야간 열차 놀이</h1>
<p>1) 팀원들이 일렬로 줄을 서서 기차 대형을 만든다. 2) 맨 앞의 기관차(첫 번째 주자)를 제외한 모든 팀원은 안대로 눈을 가린다. 3) 출발 신호가 울리면 기관차의 음성 안내(방향, 장애물 지시)를 들으며 팀 전체가 대형을 유지한 채 앞으로 이동한다. 4) 기관차는 모든 객차(팀원)가 코스의 장애물을 안전하게 통과하도록 이끈다.</p>
