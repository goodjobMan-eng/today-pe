<h1>컵과 종이로 탑 쌓기</h1>
<p>1) 컵 4개와 두꺼운 종이 2장을 준비합니다. 2) 컵과 컵 사이에 종이를 올려서 탑을 쌓습니다. 3) 5층을 쌓은 팀 순으로 100점, 80점, 60점, 40점, 20점, 0점을 받습니다. 4) 순서대로 두꺼운 종이를 빼서 컵이 제대로 포개지면 추가로 100점씩 받습니다. 5) 더 많은 점수를 받은 사람이나 팀이 승리합니다.</p>
