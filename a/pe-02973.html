<h1>티볼 공 정확하게 던지기</h1>
<p>1) 공을 잡을 때는 숫자 3 모양을 기억하고 검지와 중지를 공에 얹어 놓는다 2) 엄지와 중지로 옆을 받쳐 잡는 그립을 익힌다 3) 몸을 틀어 공을 잡은 손은 반원으로 돌리고 반대 손은 앞으로 뻗는다 4) 앞발을 내딛으며 공은 머리(정수리) 위에서 앞으로 던진다</p>
