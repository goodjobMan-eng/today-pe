<h1>배구 기본 기능(언더핸드·오버핸드·스파이크) 단계별 연습</h1>
<p>1) 천장에 매달린 배구공을 양손/한손으로 쳐보며 공의 위치와 감각을 익힌다. 2) 무릎을 굽힌 언더핸드(리시브) 자세와 머리 위 삼각형을 만드는 오버핸드(토스) 자세로 공을 위로 쳐 올린다. 3) 매달린 공을 향해 팔을 뒤로 뺐다가 점프하며 스파이크 타격 동작을 연습한다. 4) 네트를 사이에 두고 2인 1조로 공을 던져 주고받기, 원바운드 후 받아넘기기, 서브 및 랠리 미니게임을 진행한다.</p>
