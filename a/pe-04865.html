<h1>플라잉디스크 티볼</h1>
<p>1) 팀당 6명 이상으로 팀을 나누어 공격과 수비를 정한다.2) 공격수는 티 위에 공을 치는 대신 플라잉디스크를 던져 날리고 베이스를 차례로 돌아 홈으로 들어온다.3) 파울 3회, 날린 디스크를 수비수가 노바운드로 잡은 경우, 베이스 주변 반경 3m 원 안에 디스크가 먼저 들어오거나 디스크로 주자를 태그하면 아웃된다.4) 총 3회 전원 던지기 방식으로 경기를 진행하며 디스크를 날려 주자를 맞히는 태그는 금지된다.</p>
