<h1>자베볼(로켓볼) 던지기 운동 (투능력 향상)</h1>
<p>1) 소리가 나는 자베볼(로켓볼)을 잡고 라인을 양발로 걸치고 섭니다. 2) 양팔을 벌리고 시선은 정면 던질 방향을 향한 채 앞뒤로 체중 이동을 하며 진자 운동을 만듭니다. 3) 뒤로 체중을 실었다가 앞으로 이동할 때 앞발 끝을 던지는 방향으로 돌리고, 골반의 회전과 팔 스윙을 연결하여 포물선을 그리며 힘껏 던집니다. 4) 던진 후에는 팔을 끝까지 휘두르는 팔로스루 동작을 완성합니다.</p>
