<h1>축구 기초 롱킥 배우기</h1>
<p>1) 디딤발은 공보다 앞에 두지 않고 한 발짝 멀리 두고 딛는다. 2) 발등 뼈 부위를 공 밑부분에 깊게 집어넣어 숟가락으로 밥을 퍼 올리듯 찬다. 3) 오른발잡이 기준으로 손은 11시에서 1시로, 발과 몸은 1시에서 7시 방향으로 팔로우스루한다. 4) 골대 등 목표물을 설정하여 맞추는 연습을 한다.</p>
