<h1>침묵의 짝꿍 찾기</h1>
<p>1) 선생님에게 동물·악기·직업 등이 적힌 쪽지를 받고 대기한다 2) 1라운드는 쪽지에 적힌 대상을 말과 행동으로 표현하며 자신과 같은 짝을 찾는다 3) 짝을 찾으면 선생님에게 가서 정답을 확인받고 통과하면 손을 잡고 원을 만든다 4) 2라운드는 소리만으로, 3라운드는 소리 없이 행동만으로 짝을 찾는다</p>
