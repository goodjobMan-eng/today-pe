<h1>침묵의 안대 기차 놀이</h1>
<p>1) 앞사람은 안대를 쓰고 뒷사람은 앞사람의 어깨나 몸에 손을 올려 기차를 만든다. 2) 뒷사람이 앞사람 어깨를 양손으로 두드리면 직진, 오른쪽이나 왼쪽을 치면 해당 방향으로 회전한다. 3) 어깨를 양손으로 꾹 누르면 멈추고 머리를 누르면 자리에 앉는다. 4) 소리를 내거나 말을 하지 않고 오직 손 신호에만 의지하여 이동한다.</p>
