<h1>풀누들 릴레이 경주</h1>
<p>1) 모둠별로 출발선에 한 줄로 서고 반환점에 라바콘을 설치한다. 2) 첫 주자는 손을 쓰지 않고 무릎 사이에 풀누들을 끼운 채 콘을 돌아온다. 3) 돌아와서 다음 주자에게 풀누들을 넘겨주며 가장 먼저 모든 주자가 완주한 모둠이 승리한다. 4) 주자가 돌아올 때마다 다음 사람이 함께 누들을 잡고 달리는 기차 릴레이나 손바닥 위에 수직으로 세워 균형 잡고 달리기 등으로 변형한다.</p>
