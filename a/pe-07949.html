<h1>짐바브웨 전통 놀이: 스카치-스카치 (Scotch-scotch)</h1>
<p>1) 바닥에 4x4 총 16칸의 격자 그리드를 약 2m 규격으로 그린다. 2) 두 명의 참가자가 그리드 바깥쪽 오른쪽 위치에서 서로 마주 보고 선다. 3) 주변 친구들이 '와사(wash-a)'와 '스카치(scotch)' 노래를 부른다. 4) '와사' 구호에 발을 양 칸에 딛으며 안쪽으로 점프하고, '스카치' 구호에 좌우로 이동하며 격자를 돈다.</p>
