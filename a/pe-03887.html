<h1>플래스킷볼 (미식축구공 농구 게임)</h1>
<p>1) 학급을 3개 팀으로 균등하게 나누어 2팀이 경기하고 1팀은 대기한다. 2) 공을 가진 상태에서는 달릴 수 없으며 패스와 캐치만으로 코트를 전진한다. 3) 미식축구공을 농구 골대로 던져 림을 통과시키면 득점한다. 4) 골대 근처 슛은 1점이며, 멀리서 던질수록 더 높은 점수를 획득한다.</p>
