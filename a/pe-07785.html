<h1>헬리콥터 착륙장 술래잡기</h1>
<p>1) 코트 네 모퉁이에 색깔별 콘(16개)을 두어 헬리콥터 착륙장을 만들고 중앙에 펀스틱을 든 술래를 배치한다. 2) 나머지 학생들은 각 모퉁이 착륙장에 나뉘어 대기한다. 3) 교사가 이동 명령(예: 초록색에서 주황색으로 비행)을 외치면 해당 구역 학생들은 지정된 착륙장으로 달린다. 4) 술래에게 펀스틱으로 태그된 학생은 원래 출발했던 착륙장으로 되돌아간다.</p>
