<h1>체육 수업 릴레이 달리기 절차</h1>
<p>1) 출발 신호에 맞춰 검은색 선을 향해 달린다.2) 손으로 검은색 선을 터치한 후 팀으로 되돌아온다.3) 콘을 소리 내어 터치(빕)하면 다음 주자가 출발한다.4) 줄에서 자기 차례를 기다리는 동안에는 점핑잭 챌린지를 수행한다.</p>
