<h1>슬라이딩 플레이트 양말공 릴레이</h1>
<p>1) 출발선 바닥에 종이접시 2개를 놓고 양발로 올라선 뒤, 머리 위에 양말공을 올리고 양팔을 벌려 균형을 잡는다. 2) 발을 떼지 않고 종이접시를 미끄러뜨려 걸으며 반대편 선까지 이동한다. 3) 반대편에 도착하면 양말공을 등 뒤에 올리고 하이 플랭크 자세를 취한다. 4) 팔 힘만을 이용해 종이접시를 신은 발을 끌며 출발선으로 돌아와 접시가 선을 넘으면 1점을 얻는다.</p>
