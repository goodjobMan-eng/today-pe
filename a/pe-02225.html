<h1>티볼 용구 탐색 및 베이스 밟기 기초</h1>
<p>1) 본루에 높이 조절이 가능한 티대를 세우고 그 위에 티볼 공을 올린다. 2) 배트는 크기가 다른 것 중 알맞은 것을 고르고, 글러브는 공을 던지지 않는 손에 착용한다. 3) 각 누(1루, 2루, 3루, 본루)에 베이스 고무판을 배치한다. 4) 공을 친 후 공격 주자와 공을 잡은 수비수가 베이스를 밟아 세이프와 아웃을 가리는 원리를 익힌다.</p>
