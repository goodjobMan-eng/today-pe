<h1>버티며 공 옮기기</h1>
<p>1) 학급 전체를 두 모둠으로 나눕니다. 2) 모둠별로 한 줄로 선 다음 매트 위에 앉아 준비 자세를 취합니다. 3) 출발 신호와 함께 공을 양발 사이에 끼워 옆에 있는 모둠원에게 전달합니다. 4) 다리가 매트에 닿지 않도록 유지하며 공을 전달하고, 정해진 시간 동안 공을 가장 많이 옮긴 모둠이 이깁니다.</p>
