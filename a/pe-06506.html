<h1>카르페디엠 댄스 놀이</h1>
<p>1) 음악이 나오면 주변 눈치를 보지 않고 팔, 다리, 몸통을 자유롭게 움직이며 나만의 춤 동작을 4회에 걸쳐 연습한다. 2) 모든 학생이 둥글게 원을 만들어 서서 음악에 맞춰 몸을 흔들며 리듬을 탄다. 3) 선생님이 이름을 부르면 호명된 학생이 원 가운데로 나와 준비한 춤 동작을 선보인다. 4) 원을 둘러선 나머지 학생들은 가운데 나온 친구의 춤 동작을 다 함께 즐겁게 따라 춘다.</p>
