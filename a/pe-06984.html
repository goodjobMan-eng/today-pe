<h1>레이싱 트랙 피구</h1>
<p>1) 중앙에 달리기 트랙을 표시하고 외곽에 4개 팀, 중앙 트랙 안쪽에 공을 던지는 수비 1개 팀을 배치한다. 2) 각 팀 주자는 한 방향으로 트랙을 돌며 자기 팀 색상의 콩주머니를 주워 팀으로 가져오면 1점을 얻는다. 3) 트랙을 돌다 피구공에 맞으면 콩주머니를 내려놓고 구역 밖으로 돌아가 다음 주자와 하이파이브를 하고 교대한다. 4) 정해진 시간 동안 각 팀이 획득한 콩주머니 수를 비교하여 승패를 가린다.</p>
