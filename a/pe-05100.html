<h1>물건 술래잡기</h1>
<p>1) 술래가 주변에 있는 특정 자연물(돌, 나뭇가지, 솔방울 등)을 지정해 외친다.2) 도망자는 술래에게 잡히기 전에 해당 물건을 주변에서 찾는다.3) 찾은 물건을 정해진 반환 장소에 술래의 터치 없이 놓으면 승리한다.</p>
