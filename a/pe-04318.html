<h1>나무 터치 고공(바리어 놀이)</h1>
<p>1) 술래를 정하고 시작 신호와 함께 도망친다. 2) 나무를 만지면 바리어가 되어 술래에게 잡히지 않는다. 3) 나무를 만질 수 있는 바리어 시간은 5초 동안만 유지할 수 있다. 4) 술래에게 잡히면 술래가 바뀌어 게임을 계속한다.</p>
