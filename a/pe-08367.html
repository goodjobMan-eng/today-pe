<h1>벽 맞히기 손바닥 공치기 (월 핸드볼)</h1>
<p>1) 두 선수가 코트에 들어가 가위바위보를 하여 이긴 사람이 서버가 된다. 2) 서버가 공을 쳐서 바닥에 한 번 튕긴 뒤 벽을 맞히고, 벽에서 튕겨 나와 바닥에 한 번 튄 공을 상대방이 손으로 쳐서 벽으로 보낸다. 3) 공이 바닥에 두 번 튀거나, 바닥에 튀지 않거나, 코트 구역 밖으로 나가면 해당 선수는 대기 줄 뒤로 가고 새 선수가 들어와 서버가 되어 게임을 시작한다.</p>
