<h1>강강술래 (걷고 뛰고 잡기)</h1>
<p>1) 오른손은 앞으로 45도 내리고 왼손은 허리에 둔 상태에서 옆 사람 손을 고리 걸듯 가볍게 맞잡아 원형 대형을 만든다. 2) 오른발부터 내디디며 발뒤꿈치부터 닿고 무릎의 업·다운 굴신을 타며 중모리 장단에 맞춰 보통 빠르기로 걷는다(중강강술래). 3) 자진모리 장단에 맞춰 손을 잡은 채 가볍게 위로 뛰며 빠른 속도로 이동한다(자진강강술래). 4) 진양조 장단에 맞춰 오른발을 딛고 왼발을 모으며 아주 느린 속도로 이동한다(진강강술래).</p>
