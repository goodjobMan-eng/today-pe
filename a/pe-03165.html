<h1>삼각콘으로 탁구공 받기</h1>
<p>1) 학급을 두 모둠으로 나누고 각 모둠에서 1명씩 앞으로 나와 모둠원을 마주 보며 받는 구역에 선다. 2) 줄의 맨 앞사람이 탁구공을 바닥에 튕기고 맞은편 친구가 삼각콘으로 바운드된 공을 받아낸다. 3) 실패 시 다시 시도하며 성공하면 공을 던진 사람은 받는 구역으로, 받은 사람은 줄의 맨 뒤로 이동한다. 4) 모둠의 모든 탁구공을 가장 먼저 받아낸 모둠이 승리한다.</p>
