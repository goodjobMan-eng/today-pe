<h1>지퍼백 농구</h1>
<p>1) 바람을 넣은 지퍼백과 골대로 쓸 바구니를 준비한다. 2) 돌아가며 지퍼백을 바구니에 던져 넣는 슈팅 연습을 한다. 3) 뒤쪽에서부터 연속으로 패스한 뒤 마지막 사람이 지퍼백을 바구니로 슈팅한다. 4) 패스받은 개수만큼 슈팅 기회를 얻으며 정해진 시간 동안 10점 득점에 도전한다.</p>
