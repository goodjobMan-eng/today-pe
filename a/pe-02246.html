<h1>가위바위보 줄넘기</h1>
<p>1) 두 모둠으로 나누고, 두 명이 긴 줄넘기를 돌리며 나머지는 노래를 부르며 준비한다. 2) 긴 줄넘기 안으로 각 모둠에서 한 명씩 들어가서 줄을 넘으며 가위바위보를 한다. 3) 가위바위보에서 이긴 사람은 계속 그대로 줄넘기를 하고, 진 사람은 줄넘기 밖으로 나간다. 4) 진 모둠에서 다음 순서 사람이 줄넘기 안으로 들어가 되풀이하며, 마지막까지 살아남은 사람이 있는 모둠이 이긴다.</p>
