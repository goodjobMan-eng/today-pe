<h1>코코넛 쓰러뜨리기 표적 맞추기 게임</h1>
<p>1) 긴 콘 위에 큰 고무공을 올린 타깃 10개를 양 팀에 5개씩 세우고 마커로 투척선을 표시한다. 2) 양 팀은 투척선 뒤에 서서 16개 이상의 작은 공을 준비한다. 3) 신호가 울리면 공을 던져 상대편 콘 위의 공을 맞혀 떨어뜨린다. 4) 떨어진 공을 주워 모으며 투척선 뒤에서 계속 던져 먼저 모든 타깃을 쓰러뜨린 팀이 승리한다.</p>
