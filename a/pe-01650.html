<h1>콘 라인 심폐지구력 &amp; 순발력 드릴</h1>
<p>1) 일렬로 세워진 6~8개의 라바콘 앞에 모둠별로 줄을 서서 차례를 기다립니다. 2) 앞주자가 콘 3개를 통과하면 출발하여 점프 턱, 지그재그 달리기, 사이드 셔플 등 제시된 동작으로 콘 코스를 완주합니다. 3) 코스 통과 후 가볍게 조깅하여 대열 맨 뒤로 복귀하며 모둠별 순환을 완주합니다. 4) 콘 간격을 넓히거나 워킹 런지, 스케이트 리프 등 고난도 스텝으로 동작을 변경해 진행합니다.</p>
