<h1>스타워즈 태그: 만달로리안</h1>
<p>1) 만달로리안 역할을 맡은 학생은 풀 누들(스피어)과 플래그를 착용한다. 2) 만달로리안은 술래(스톰트루퍼)의 공격을 받으면 플래그를 하나씩 잃는다. 3) 만달로리안은 술래에게 태그당해도 얼지 않으며, 플래그를 모두 잃으면 술래에게 태그당할 때 얼게 된다. 4) 만달로리안은 술래에게 태그당해 얼어있는 반란군을 구출한다.</p>
