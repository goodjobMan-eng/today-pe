<h1>전략 게임 동전 던지기</h1>
<p>1) 두 팀이 중앙선 양쪽에 1대1로 마주 보고 서서 각자 앞에 공을 하나씩 둔다. 2) 선생님이 동전을 던져 앞면(머리)이 나오면 한 팀이 공을 집어 상대방을 맞히고, 뒷면(꼬리)이 나오면 반대 팀이 공을 집어 맞힌다. 3) 공격하는 팀은 상대방을 맞히고 빠르게 베이스라인으로 돌아가고, 피하는 팀은 도망친다.</p>
