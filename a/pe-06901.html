<h1>발구르기 캐치 판 만들기 및 빈백 받기</h1>
<p>1) 합판에 PVC 파이프와 폼 누들을 결합하여 덕트 테이프로 단단히 고정해 시소 형태의 발구르기 판을 만든다. 2) 테이프로 표시된 판의 끝부분(X자 표시)에 콩주머니를 올려놓는다. 3) 반대쪽 다른 색상 테이프가 붙은 곳을 발로 강하게 굴러 튀어 오른 콩주머니를 손으로 잡는다.</p>
