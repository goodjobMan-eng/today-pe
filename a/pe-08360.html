<h1>제자리 짝 패스 드릴 (체스트 패스 &amp; 바운스 패스)</h1>
<p>1) 두 사람이 마주 보고 서서 공을 바닥에 놓거나 손에 든다. 2) 앞으로 한 발 내딛으며 엄지손가락을 아래로, 손바닥을 바깥쪽으로 밀어 상대방의 가슴 높이로 체스트 패스를 하고 자세를 유지한다. 3) 공을 받는 사람은 가슴 높이에 양손을 내밀어 준비하고 날아오는 공을 잡는다. 4) 같은 요령으로 한 발을 내딛으며 바닥에 강하게 튕겨 전달하는 바운스 패스를 주고받는다.</p>
