<h1>앉아서 하는 타바타 운동</h1>
<p>1) 의자에 바르게 앉아 상체와 어깨 스트레칭으로 준비한다. 2) 구령에 맞춰 팔, 가슴, 상체 및 다리 동작을 정해진 시간 동안 반복 실시한다. 3) 동작 사이 짧은 휴식을 취하며 정해진 세트만큼 운동을 이어간다. 4) 마지막 정리 동작을 하며 숨을 고르고 마무리한다.</p>
