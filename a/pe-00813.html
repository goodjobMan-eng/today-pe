<h1>큐피드의 날개 깃털 모으기 달리기 운동</h1>
<p>1) 화면을 보며 제자리 달리기를 하다가 장애물이 나오면 알맞은 동작을 취하는 타바타형 인터랙티브 놀이입니다. 2) 낮은 울타리나 화살이 아래쪽으로 지나갈 때는 점프로 피하고, 장미 꽃다발이나 위쪽으로 날아오는 화살이 보이면 몸을 숙여 피합니다. 3) 화면에 날아다니는 깃털이 나타나면 손을 뻗어 잡는 동작을 취합니다. 4) 가짜 로봇 큐피드가 나타나면 제자리에서 얼음처럼 전혀 움직이지 않아야 합니다.</p>
