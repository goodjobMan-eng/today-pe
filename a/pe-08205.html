<h1>농구 홀스 게임</h1>
<p>1) 순서를 정해 한 줄로 서서 차례대로 농구 골대에 슛을 시도한다. 2) 첫 번째 사람이 슛을 성공시키면 복제 슛(Copy shot)이 생성되고, 다음 사람이 같은 위치·방식으로 슛을 따라 해야 한다. 3) 따라 쏘지 못하고 실패하면 알파벳 한 글자를 얻으며, H-O-R-S-E 철자를 모두 모으면 탈락한다.</p>
