<h1>윙크 게임</h1>
<p>1) 수호자는 의자 뒤에 서고 포로는 의자에 앉으며 한 명의 수호자만 빈 의자를 앞에 둔다. 2) 빈 의자의 수호자가 앉아 있는 포로 중 한 명에게 윙크를 보낸다. 3) 윙크를 받은 포로는 도망쳐 빈 의자로 가려 하고, 뒤의 수호자는 손으로 포로를 터치해 막으려 한다. 4) 포로를 놓친 수호자는 새로운 빈 의자의 수호자가 되어 다른 포로에게 윙크한다.</p>
