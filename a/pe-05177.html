<h1>1학년 스테이션 체육 활동</h1>
<p>1) 달리기 및 초록색 허들 넘기를 연습한다.2) 훌라후프 구역에서 후프 활동을 수행한다.3) 버킷(통)에 콩주머니를 던져 넣는다.4) 풍선을 띄우며 움직인다.5) 스텝 킥으로 공을 차서 볼링핀을 쓰러뜨린다.</p>
