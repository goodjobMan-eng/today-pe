<h1>스쿠터보드 쇼핑카트 릴레이</h1>
<p>1) 폼 튜브 손잡이와 바구니를 장착한 스쿠터보드를 팀별로 준비하고 반대편 벽면에 콩주머니들을 펼쳐 둔다. 2) 신호가 울리면 각 팀 1번 주자가 스쿠터보드를 쇼핑카트처럼 밀며 반대편 목표 지점까지 달려간다. 3) 도착지의 콩주머니 1개를 바구니에 담아 출발선으로 되돌아온 후 다음 주자에게 카트를 인계한다. 4) 모은 콩주머니 개수를 합산해 승패를 가리거나 장애물 콘을 지그재그로 통과하는 방식으로 변형한다.</p>
