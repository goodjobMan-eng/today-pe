<h1>정글 크루즈 체육</h1>
<p>1) 음악이 시작되면 학생들은 각자 훌라후프 보트를 잡고 콘 둘레의 바깥쪽을 돌며 이동한다. 2) 음악이 멈추면 가장 가까운 매트로 이동하여 훌라후프를 내려놓는다. 3) 교사가 각 매트를 돌며 매트에 표시된 동물(사자, 코뿔소, 원숭이, 코끼리, 뱀, 악어)의 움직임을 흉내 내도록 유도하고 학생들은 신체로 표현한다.</p>
