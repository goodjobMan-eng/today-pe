<h1>손으로 공 몰며 술래잡기</h1>
<p>1) 6명이 한 모둠을 이루고 술래 1명을 정한다. 2) 술래는 공을 몰면서 도망가는 모둠원을 잡으러 가고, 모둠원은 각자 공을 몰며 술래를 피해 도망간다. 3) 안전 구역에 들어가면 잡히지 않지만 한 명만 들어갈 수 있다. 4) 게임장 밖으로 나가거나 술래의 손에 닿으면 술래를 바꾼다.</p>
