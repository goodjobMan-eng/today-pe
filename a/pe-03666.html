<h1>층간소음 없는 교실 맨손체조</h1>
<p>1) 오른발 허벅지 스트레칭을 하고 반대쪽 다리도 스트레칭한다. 2) 발목을 잡고 앉았다 일어난다. 3) 발끝으로 찍으며 팔 뻗기, 팔꿈치 올리기, 아래위 찍기를 차례로 수행한다. 4) 앉아서 다리를 길게 스트레칭한 뒤 일어나서 손가락을 깍지 껴 위로 기지개를 켠다.</p>
