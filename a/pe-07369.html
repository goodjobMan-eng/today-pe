<h1>플라잉디스크 해머 던지기</h1>
<p>1) 플라잉디스크를 포핸드 그립처럼 엄지·검지·중지는 펴고 나머지 손가락은 접어 잡는다. 2) 날리고자 하는 방향을 정면으로 바라보고 다리는 어깨너비로 벌린 뒤 던지는 손의 반대발을 살짝 앞으로 내민다. 3) 플라잉디스크를 머리 위로 올리고 머리 반대편으로 살짝 기울인다. 4) 플라잉디스크를 힘껏 머리 위쪽 앞에서 날려 준다. 5) 마지막에 놓을 때는 손목 스냅을 이용해 던진다.</p>
