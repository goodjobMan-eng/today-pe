<h1>디즈니 터키 스톰프 브레인 브레이크</h1>
<p>1) 화면 트랙을 따라 떨어지는 버튼에 맞춰 동작을 준비한다.2) 빨간색 버튼에는 왼발 스톰프 또는 뜀뛰기, 노란색 버튼에는 오른발 스톰프 또는 뜀뛰기를 한다.3) 빨간색과 노란색 조합은 점프, 파란색은 박수, 보라색은 허벅지 치기를 수행한다.4) 틀린 그림 찾기 미니 게임이 나오면 제시된 자세를 유지하면서 차이점 3개를 찾아낸다.</p>
