<h1>인간 다트 물속 유선형 미끄러지기</h1>
<p>1) 2인 1조가 되어 한 명은 다트 역할로 수면에 엎드리고 다른 한 명은 뒤에서 발을 잡고 밀어주는 역할을 맡는다. 2) 밀어주는 친구는 다트 친구를 앞쪽으로 부드럽고 강하게 밀어 수면 위를 미끄러지듯 띄워 보낸다. 3) 수면에 띄워진 수중 훌라후프 표적 중심을 향해 몸을 일직선으로 곧게 펴서 통과하면 점수를 얻는다. 4) 역할을 번갈아 진행하며 훌라후프의 거리를 점차 멀리 배치해 도달 거리를 늘려나간다.</p>
