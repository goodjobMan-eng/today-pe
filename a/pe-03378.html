<h1>코끼리와 코뿔소 코코 달리기</h1>
<p>1) 4명씩 코끼리 모둠과 코뿔소 모둠으로 나뉘어 출발선에서 등을 맞대고 선다. 2) 교사가 부르는 동물 모둠은 도망가고 다른 모둠은 쫓아가서 잡는다. 3) 도망가는 상대를 잡거나 잡히지 않고 10m 도착선을 넘어가면 점수를 얻는다. 4) 교사가 바로 외치지 않고 코코코를 외치다 부르는 방식으로 변형하여 진행한다.</p>
