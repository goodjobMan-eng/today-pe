<h1>특수 체육 축구 기본 훈련</h1>
<p>1) 바닥에 누워 호흡, 무릎 당겨 안기, 다운독, 나무 자세 등 스트레칭으로 몸을 푼다.2) 발 안쪽(인사이드)을 사용하여 킥 동작 후 팔로우스루를 연결하는 연습을 한다.3) 날아오는 공을 밟거나 멈춰 세우며 트래핑 동작을 연습한다.4) 흰 선 위에 공을 세워두고 골대를 향해 슈팅한다.</p>
