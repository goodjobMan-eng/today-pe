<h1>후프에 공 넣기 게임</h1>
<p>1) 모둠별로 원마커 위에 플라스틱 공을 올리고 약 1m 거리에 후프 4개를 1열로 배치한다.2) 모둠원이 차례대로 플로어볼 채로 공을 쳐서 가장 가까운 후프에 넣기를 시도한다.3) 공이 후프에 들어가면 해당 후프와 공을 모둠으로 가져오고 실패하면 공만 회수한다.4) 다음 사람에게 차례를 넘기며 모든 후프를 가장 먼저 획득한 팀이 승리한다.</p>
