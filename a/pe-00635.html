<h1>몸으로 가위바위보 진토리</h1>
<p>1) 양 팀은 원마커로 표시한 출발선에 마주 보고 섭니다. 2) 신호에 맞춰 온몸으로 가위바위보를 하고, 이긴 사람은 앞으로 3보 전진하며 비기면 양쪽 모두 1보 전진하고 진 사람은 그 자리에 멈춰 다음 판을 기다립니다. 3) 계속 가위바위보를 진행하여 상대 팀의 진영이나 목표선에 먼저 도착하는 사람이 승리합니다. 4) 켄켄(외발뛰기)이나 두 발 점프 등 이동 방식을 바꾸어 변형할 수 있습니다.</p>
