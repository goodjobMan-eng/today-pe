<h1>야외 지형 스트라테고</h1>
<p>1) 두 팀으로 나누어 계급과 스파이, 깃발이 적힌 카드를 한 장씩 배분받고 각 진영의 감옥을 정한다. 2) 상대 진영을 오가며 상대를 태그하고 카드를 비교해 계급이 낮은 사람이 상대 감옥에 갇힌다. 3) 아군 스파이가 감옥을 하이파이브하여 팀원을 구출하며, 상대 깃발 카드를 가진 선수를 잡으면 승리한다.</p>
