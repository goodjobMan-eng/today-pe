<h1>굴러오는 훌라후프 피하기 놀이</h1>
<p>1) 지도자가 경기장 중앙이나 맞은편에서 바닥을 향해 훌라후프를 굴려 보낸다. 2) 아이들은 지정된 선을 출발해 반대편 안전선까지 훌라후프에 닿지 않고 달려간다. 3) 2차전에서는 굴러오는 훌라후프의 궤적과 속도에 회전 등 변화를 주어 피하게 한다. 4) 아이들은 무작정 달리지 않고 훌라후프가 회전해 돌아오는 움직임을 관찰하여 멈추거나 피하며 통과한다.</p>
