<h1>양말공 다트 바구니 표적 챌린지</h1>
<p>1) 둥글게 만 양말 5개와 10발자국 거리의 바구니 표적을 준비하고 투척선에 선다. 2) 던지는 손 쪽 발을 앞으로 두고 팔꿈치 높이를 표적과 일직선으로 맞추어 다트 자세를 잡는다. 3) 팔꿈치를 축으로 곧게 뻗으며 양말공을 하나씩 던져 바구니 안에 정확히 골인시킨다. 4) 표적 바구니의 크기를 줄이거나 거리를 늘려 난이도를 높여가며 기록을 겨룬다.</p>
