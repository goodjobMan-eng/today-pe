<h1>태권도 기본 동작 연습</h1>
<p>1) 어깨너비보다 넓게 발을 벌려 무릎을 살짝 굽히고 주먹을 가슴높이에서 배꼽으로 내리는 주춤서기를 취한다. 2) 허리춤에서 시작하여 상대 명치를 향해 주먹을 똑바로 지르고 반대 손은 당겨 허리춤으로 가져오는 몸통 지르기를 한다. 3) 공격할 발을 뒤쪽에 둔 상태에서 가슴높이까지 들어 올린 후 앞으로 뻗어 차는 앞차기를 한다. 4) 한쪽 무릎을 살짝 굽혀 낮추고 다른 발을 끌어올려 발날등을 맞추어 서는 학다리 서기를 취한다.</p>
