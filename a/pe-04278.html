<h1>줄넘기 상급 단계 상달 방법</h1>
<p>1) 무릎을 깊게 구부리지 않고 발끝으로 위를 향해 점프한다. 2) 허리를 펴고 팔꿈치를 몸에 붙여서 줄을 넘는다. 3) 교차뛰기를 할 때 팔을 너무 크게 사용하지 않고 크게 깊게 교차한다. 4) 이중뛰기를 할 때 1, 2, 3, 4 박자에 맞춰 크게 점프하며 줄을 넘는다.</p>
