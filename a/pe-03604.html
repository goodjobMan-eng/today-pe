<h1>배드민턴 셔틀콕 멀리 보내기</h1>
<p>1) 좁은 코트에서 1대 1 단식 경기를 진행하며 경기 전후에 정중하게 인사한다. 2) 날아오는 셔틀콕을 반대 손으로 가리키며 집중하고, 라켓을 든 팔과 몸통을 뒤로 젖혀 준비한다. 3) 오른발을 축으로 몸통을 회전시키며 라켓을 하늘로 던지듯 높고 크게 휘둘러 셔틀콕을 멀리 보낸다. 4) 셔틀콕이 뒤로 넘어올 때는 오른발로 멈춰 서며 몸통을 회전시켜 강하게 타구한 후 제자리로 복귀한다.</p>
