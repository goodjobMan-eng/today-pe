<h1>신문지 막대로 균형 잡기 및 무용 놀이</h1>
<p>1) 신문지를 단단하게 말아 테이프로 고정하고 양끝을 5cm 잘라 신문지 막대를 만든다. 2) 손바닥, 손가락 3개/2개/1개, 손등 또는 검지 위에 막대를 세워 중심을 잡는 활동을 한다. 3) 둘이서 마주 보고 서서 각자의 검지를 막대 양쪽 끝에 맞대어 연결한다. 4) 검지로 맞댄 막대가 바닥에 떨어지지 않도록 한 사람이 밀면 상대는 뒤로 물러나거나 돌면서 음악에 맞춰 다양한 움직임을 표현한다.</p>
