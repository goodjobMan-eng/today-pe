<h1>철봉 역회전(오름돌기) 3가지 차이점과 가정 보조 운동</h1>
<p>1) 자신의 가슴 높이보다 약간 낮은 철봉을 잡고 턱을 당겨 자신의 배꼽을 본다2) 팔꿈치를 굽힌 상태를 유지하여 복부를 철봉에 밀착시키며 몸을 둥글게 유지한다3) 한 발을 앞으로 디디고 다른 발을 위로 강하게 차올리며 몸을 회전시켜 철봉 위로 올라탄다4) 가정에서는 바닥에 앉아 한 발로 엉덩이를 띄우는 편자 차기와 무릎을 안고 구르는 요람 운동을 연습한다</p>
