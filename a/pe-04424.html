<h1>루돌프 먹이 주기 게임</h1>
<p>1) 3명이 한 팀이 되어 스쿠터보드, 훌라후프, 바구니를 하나씩 맡는다. 2) 스쿠터보드 담당은 반대편에서 콩주머니를 가져와 훌라후프 안의 토서에게 전달한다. 3) 토서는 콩주머니를 던져 바구니를 든 캐처에게 보낸다. 4) 캐처는 바구니로 콩주머니를 받는다.</p>
