<h1>폴짝폴짝 장애물 뛰어넘기</h1>
<p>1) 두 모둠으로 나누고 순서를 정합니다. 2) 신호가 울리면 첫 번째 주자가 모둠 조끼를 입고 콩주머니를 가진 채 모둠발로 장애물(미니허들)을 뛰어넘어 바구니에 콩주머니를 넣습니다. 3) 다시 장애물을 모둠발로 뛰어넘어 돌아옵니다. 4) 앞 주자가 출발선에 들어오면 다음 주자가 출발하며, 마지막 주자가 가장 먼저 들어온 모둠이 승리합니다.</p>
