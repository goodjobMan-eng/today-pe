<h1>협동 공 몰기</h1>
<p>1) 네 명이 한 모둠을 이루어 모둠별로 1영역(발로 공 몰기)과 2영역(채로 공 몰기) 중 한 곳을 정해 위치한다. 2) 첫 번째 모둠원이 바구니에서 꺼낸 공을 몰아 다음 모둠원에게 전달한다. 3) 공을 받은 마지막 모둠원은 공을 몰아 바구니에 넣는다. 4) 정해진 시간 동안 진행 후 역할을 바꾸며, 1영역과 2영역에서 옮긴 공의 개수를 합산해 가장 많은 공을 옮긴 모둠이 이긴다.</p>
