<h1>쓰리볼 발야구</h1>
<p>1) 수비는 경기장에 골고루 자리를 잡고, 공격은 순서대로 대기하다 차례가 되면 홈 위치로 나온다. 2) 한 사람이 세 개의 공을 차거나 손으로 던져 경기장 안으로 보낸 뒤 1루, 2루, 3루, 홈으로 달린다. 3) 수비수는 공을 빠르게 잡아 바구니에 담으며, 세 번째 공을 담는 순간 '그만 뛰어'라고 외친다. 4) '그만 뛰어'를 외친 순간 공격 주자가 1루 도착 시 1점, 2루 2점, 3루 3점, 홈 도착 시 4점을 얻는다.</p>
