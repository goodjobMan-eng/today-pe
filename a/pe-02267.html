<h1>레크댄스 5, 6, 7, 8 (Five Six Seven Eight)</h1>
<p>1) 1번 동작으로 사이드 스텝을 밟으며 왼발, 오른발, 뒤, 제자리 순으로 밟는다. 2) 2번 동작으로 스케이트를 타듯 앞으로 슬라이딩 스텝으로 나아간다. 3) 3번 동작으로 손 방향에 맞추어 왼손, 오른손, 엉덩이를 치며 손뼉을 친다. 4) 4번 동작으로 워킹 스텝으로 가볍게 걸어 뒤쪽 제자리로 돌아온 뒤 음악에 맞춰 반복한다.</p>
