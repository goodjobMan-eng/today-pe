<h1>팩맨 술래잡기</h1>
<p>1) 파란 조끼를 입은 술래(고스트) 4명을 정하고 나머지 학생들은 팩맨이 된다. 2) 모든 참가자는 바닥의 흰색 선 또는 선을 잇는 스팟 위로만 걸어서 이동할 수 있으며 달리기나 점프는 금지된다. 3) 술래에게 태그되면 선 바깥으로 나와 무릎을 꿇고 한 손을 든다. 4) 다른 팩맨이 다가와 하이파이브를 해주면 다시 일어서서 선 위로 복귀하여 걷는다.</p>
