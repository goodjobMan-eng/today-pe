<p>1) 색상 포인트 마커를 코트에 배치하고 그 아래에 덧셈·뺄셈 수학 연산 종이를 놓는다. 2) 마커 위에 설 학생들과 마커 바깥에 설 학생들을 배치한다. 3) 교사가 동작(예: 점핑잭)을 제시하고 두 가지 색상을 호명한다. 4) 호명된 색상의 마커에 있던 학생들과 바깥 학생들이 서로 마커를 차지하기 위해 이동한다. 5) 마커를 차지한 학생은 아래의 수학 문제를 확인하고 결과만큼 지정된 운동을 수행한다.</p>
