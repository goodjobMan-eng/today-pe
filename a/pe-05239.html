<h1>응급처치 술래잡기</h1>
<p>1) 훌라후프에 한 발을 넣고 풀누들을 든 사고 유발자(술래) 3명과 안전조끼를 입은 응급의료요원 3명을 정한다.2) 술래는 훌라후프를 끌며 천천히 이동해 다른 사람을 풀누들로 태그한다.3) 태그된 사람은 손을 흔들며 &quot;도와주세요&quot;라고 외치고, 안전조끼를 입은 구호 요원이 다가와 자신의 조끼를 벗어 입혀준다.4) 조끼를 입은 사람이 새로운 구호 요원이 되어 이동하며, 조끼를 넘겨준 사람은 일반 참가자가 되어 다시 술래를 피한다.</p>
