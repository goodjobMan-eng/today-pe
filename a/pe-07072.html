<h1>풍선과 숟가락 릴레이</h1>
<p>1) 출발선에서 10걸음 떨어진 곳에 빨래 바구니를 놓는다. 2) 나무 숟가락으로 풍선을 쳐서 이동하며 빨래 바구니 안에 넣는다. 3) 풍선을 바구니에서 꺼내 출발선으로 달려와 1분 동안 같은 동작을 반복한다. 4) 풍선이 바닥에 닿으면 주워서 계속 진행한다.</p>
