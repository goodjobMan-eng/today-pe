<h1>크루 복근 배틀 챌린지</h1>
<p>1) 5~6명이 원형으로 둘러앉아 양옆 팀원과 손을 단단히 맞잡는다. 2) 팀원들과 구호를 맞춰 20초 동안 동시에 뒤로 누웠다가 상체를 일으켜 앉는다. 3) 전원이 박자를 놓치지 않고 10회 이상 복근 운동을 함께 성공해낸다.</p>
