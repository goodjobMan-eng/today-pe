<h1>앉아 윗몸 앞으로 굽히기 검사</h1>
<p>1) 신발을 벗고 한쪽 발을 좌전굴 측정 상자에 평평하게 붙이고, 다른 발은 바닥에 평평하게 둔다. 2) 양 손가락을 모아 포개고 상체를 앞으로 숙여 측정판을 밀어낸다. 3) 네 번째 뻗는 동작에서 가능한 가장 먼 위치를 유지하여 기록을 측정한다. 4) 다리를 바꾸어 반대쪽 다리도 동일한 방식으로 측정한다.</p>
