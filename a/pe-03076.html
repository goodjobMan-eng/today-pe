<h1>원마커 활용 기본 움직임 및 민첩성 놀이</h1>
<p>1) 바닥에 학생 수만큼 원마커를 두고 음악에 맞춰 춤추며 돌다가 음악이 멈추면 원마커 위에 올라선다. 2) 교사가 마커를 1개씩 제거하여 마커를 차지하지 못한 탈락자에게 점핑잭 등 신체활동 벌칙을 부여한다. 3) 출발점과 도착점 사이에 일렬로 놓인 원마커를 따라 점핑, 호핑, 스킵핑 스텝으로 이동한다. 4) 각자 손등 위에 원마커를 올린 상태에서 자신의 마커를 지키며 상대 마커를 쳐서 떨어뜨린다.</p>
