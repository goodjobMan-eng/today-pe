<h1>고무 닭 던져 잡기 및 바구니 받기 놀이</h1>
<p>1) 고무 닭을 던져 잡는 연습을 하며 머리, 목, 한 발, 두 발 등 교사가 지정하는 부위만 사용해 잡는다. 2) 던진 후 박수를 치거나 등 뒤로 박수를 치는 등 동작을 추가해 잡는다. 3) 발 위에 고무 닭을 얹어 차올린 뒤 잡거나 한 바퀴 돌아 잡는 등 기술을 응용한다. 4) 한 사람이 바구니를 들고 움직이며 다른 사람이 던진 고무 닭을 받아 담는다.</p>
