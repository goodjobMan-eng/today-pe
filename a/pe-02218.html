<h1>주사위 태그 놀이</h1>
<p>1) 두 팀으로 편성하고 마주보고 섭니다. 2) 주사위를 던져 자신의 팀과 같은 주사위 색이 나오면 상대 팀을 태그하러 뛰고, 상대 팀은 콘으로 뜁니다. 3) 콘을 잡지 못하고 태그된 친구는 게임장에서 이탈합니다. 4) 터치하여 상대 팀원을 데려오는 방식으로도 변형하여 진행합니다.</p>
