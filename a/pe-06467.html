<h1>타바타 중급 코어 운동</h1>
<p>1) 매트에 누워 무릎을 세우고 배를 말아 올리며 손바닥이 무릎에 닿도록 크런치를 한다 2) 머리 뒤로 깍지를 끼고 무릎과 반대쪽 팔꿈치가 마주보도록 번갈아 교차하는 몸통 비틀기를 한다 3) 팔꿈치를 매트에 대고 엎드려 꼬리뼈를 만 상태로 플랭크 자세를 버틴다 4) 한쪽 팔꿈치로 지지하고 다리를 교차해 엉덩이를 들어 올려 사이드 플랭크를 한다 5) 손바닥을 짚고 엎드려 무릎을 가슴까지 빠르게 교차해 당기는 마운틴 클라이머를 한다</p>
