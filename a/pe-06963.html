<h1>올림픽 스피드 스택스</h1>
<p>1) 체육관 구역을 브론즈, 실버, 골드 세 구역으로 나눈다. 2) 각자 12개의 스피드 스택스 컵을 가지고 브론즈 구역에서 손을 들어 짝을 찾아 대결한다. 3) 대결에서 이기면 실버를 거쳐 골드 구역으로 한 단계씩 올라간다. 4) 골드 구역에서 승리하면 팔찌 1개를 획득하고 다시 브론즈 구역으로 돌아가 시작한다. 5) 대결에서 지면 해당 구역에 머물며 새로운 상대를 찾아 대결한다.</p>
