<h1>스파이더 리프트 핵폐기물 이송 및 마블 메이즈</h1>
<p>1) 팀원들이 스파이더 리프트 줄 끝을 잡고 줄을 당겨 균형을 잡는다.2) 연료봉 역할을 하는 펭귄 인형을 시작 지점에서 파란색 콘 안전 구역까지 떨어뜨리지 않고 운반한다.3) 마블 메이즈 보드를 함께 잡고 위아래로 기울이며 구슬이 구멍에 빠지지 않게 꼭대기까지 굴린다.4) 구슬이 구멍에 빠지면 핀(페그)으로 구멍을 막고 도전을 이어간다.</p>
