<h1>다리 벌려 뜀틀 뛰어넘기 기본 기능 익히기</h1>
<p>1) 뜀틀에서 약 5~10m 떨어진 거리에서 도움닫기를 하며 발구르기 3~4보 전에 보폭을 맞춥니다. 2) 달려오던 속도를 유지하고 탄성을 이용하여 양발로 힘차게 발구르기를 합니다. 3) 팔을 뻗어 몸을 살짝 앞으로 기울이며 뜀틀의 약 2/3 지점을 짚고 고개를 듭니다. 4) 양손을 짚으면서 다리를 옆으로 넓게 벌려 몸을 앞으로 당긴 후 손을 떼고 무릎을 살짝 굽히며 착지합니다.</p>
