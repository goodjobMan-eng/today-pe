<h1>삼색 꼬리잡기 게임</h1>
<p>1) 경기장을 그리고 두 모둠으로 나누어 선 뒤, 모든 학생은 세 가지 색깔의 꼬리를 허리 양쪽과 뒤쪽에 착용한다. 2) 시작 신호와 함께 상대 모둠의 꼬리를 빼앗되, 한 번 빼앗은 색깔의 꼬리는 중복해서 빼앗을 수 없다. 3) 세 가지 색깔의 꼬리를 모두 빼앗은 경우 더 이상 상대 꼬리를 빼앗을 수 없으며 자신의 꼬리를 지킨다. 4) 게임 종료 후 꼬리 하나당 1점으로 계산하여 빼앗은 꼬리와 남은 꼬리 수의 합이 많은 모둠이 이긴다.</p>
