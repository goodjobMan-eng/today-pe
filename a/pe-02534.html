<h1>단계별 3구 저글링</h1>
<p>1) 1단계: 공 1개를 바깥쪽에서 안쪽으로 포물선을 그리며 양손으로 번갈아 던지고 받는다. 2) 2단계: 양손에 공을 하나씩 쥐고 바깥에서 안쪽으로 번갈아 던져 엇갈려 받는다. 3) 3단계: 한 손에 공 2개, 다른 손에 공 1개를 쥐고 2개 던지고 받기를 연습한다. 4) 4단계 및 5단계: 공 3개를 순서대로 띄우며 멈추지 않고 연속으로 저글링을 이어간다.</p>
