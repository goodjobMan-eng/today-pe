<h1>롱 발목 줄넘기</h1>
<p>1) 발목 줄넘기 끝에 긴 줄을 풀리지 않도록 단단히 연결한다. 2) 줄을 돌리는 사람이 중앙에서 줄을 낮게 돌린다. 3) 주변에 서 있던 여러 명의 학생들이 회전하는 줄 반대쪽 타이밍에 맞춰 한 명씩 차례대로 안으로 들어와 뛰어넘는다. 4) 줄에 걸린 학생은 줄을 돌리는 역할을 교대하거나 바깥에서 신체활동 과제를 수행한다.</p>
