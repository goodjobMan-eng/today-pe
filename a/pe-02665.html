<h1>의자 팔다리 뻗기와 복근 신체활동</h1>
<p>1) 의자에 앉아 한 다리를 모았다가 대자로 뻗는 스트레칭 및 근력 운동을 실시한다. 2) 천장을 보고 누워 무릎을 90도로 접어 공을 무릎에서 발까지 이동시킨 후 잡는 운동을 한다. 3) 공을 어깨 높이로 들고 런지 후 다리를 들어 발끝으로 공을 터치한다. 4) 런지 자세 후 무릎을 앞으로 접어 허리 높이까지 들어 올린다.</p>
