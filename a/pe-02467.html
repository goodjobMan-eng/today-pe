<h1>거북이 등딱지 떨어뜨리기</h1>
<p>1) 참가자들은 허리를 굽히고 접시콘을 등에 얹은 채 시작한다. 2) 자신의 접시콘은 지키면서 상대방의 접시콘을 손으로 쳐서 떨어뜨린다. 3) 등에 얹은 접시콘이 바닥에 떨어지면 아웃된다. 4) 상대방의 신체는 건드리지 않고 접시콘만 쳐야 한다.</p>
