<h1>뉴스포츠 플로어볼 기초 드리블과 슛 릴레이</h1>
<p>1) 오른손은 스틱 아래, 왼손은 위에 잡고 무릎을 낮춰 기본 자세를 취한다. 2) 접시콘을 양발 사이에 두고 스틱으로 좌우 밀며 10초간 제자리 드리블을 연습한 뒤 실제 공으로도 실시한다. 3) 5m 거리에 세운 꼬깔콘을 드리블하며 돌아오는 릴레이 활동을 진행한다. 4) 골대 앞까지 공을 드리블하여 슛을 넣고 공을 회수한 뒤 다음 사람과 교대한다.</p>
