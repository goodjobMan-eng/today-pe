<h1>드래곤의 보석 (Le jeu du joyau du dragon)</h1>
<p>1) 콘으로 원형 구역(동굴)을 만들고 중앙에 보석(공)을 둔 뒤 술래 1명을 드래곤으로 지정합니다. 2) 도전 팀들이 차례대로 동굴에 들어가 드래곤을 피해 중앙의 보석을 밖으로 빼내옵니다. 3) 드래곤에게 한 명이라도 태그당하면 팀 전체가 탈락하며, 태그 없이 보석을 밖으로 가지고 나오면 1점을 얻습니다.</p>
