<h1>큰 공 놀이</h1>
<p>1) 반을 둘로 나누어 공격 모둠과 수비 모둠으로 정하고 전체가 들어갈 넓은 사각 공간을 선으로 표시한다. 2) 공격 모둠은 놀이선 바깥에서 두 손으로 가슴 앞에서 큰 공을 밀어 선 안의 수비를 맞힌다. 3) 수비 모둠은 놀이선 안쪽에서만 돌아다니며, 밖으로 나가거나 공에 닿으면 탈락하여 밖으로 나가 공격자가 된다. 4) 일정 시간 동안 수비가 살아남으면 수비 모둠이 이기고, 전원이 탈락하면 공격 모둠이 이긴다.</p>
