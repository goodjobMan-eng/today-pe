<p>1) 의자를 책상 안으로 넣고 자리 앞에 서서 준비합니다. 2) 교사가 '섬'을 외치면 책상 앞자리로, '바다'를 외치면 책상 옆 통로 공간으로 이동합니다. 3) 늦게 움직이거나 반대로 이동하거나 몸을 움찔거리면 탈락하여 자리에 앉습니다. 4) 학급 전체 연습 후 줄별 팀 대항전이나 최후의 1인을 가리는 서바이벌 개인전으로 진행합니다.</p>
