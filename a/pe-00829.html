<h1>세인트 패트릭 데이 무브 앤 프리즈</h1>
<p>1) 화면에 제시되는 신체 표현 미션(무지개처럼 굽히기, 금화처럼 돌기, 아일랜드 춤추기 등)을 확인합니다. 2) 음악에 맞춰 해당 동작이나 자유로운 댄스를 신나게 이어갑니다. 3) 화면에 얼음 효과와 함께 음악이 멈추면 그 자리에서 그대로 얼음 자세를 유지해야 합니다. 4) 신호음이 울리면 다음 제시되는 동작으로 전환하여 활동을 반복합니다.</p>
