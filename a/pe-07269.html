<h1>풍선 기본 움직임 활동</h1>
<p>1) 학생마다 각자 풍선 1개씩을 바닥에 두고 뒤, 앞, 옆에 서거나 주변을 조깅하며 움직인다. 2) 교사의 지시에 따라 풍선 위를 뛰거나 갤럽, 스킵, 동물 걸음 등의 동작을 수행한다. 3) 풍선을 손, 무릎, 머리, 발 등으로 쳐서 공중에 띄우며 떨어뜨리지 않고 유지한다.</p>
