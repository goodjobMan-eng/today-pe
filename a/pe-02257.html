<h1>킨볼 전술 연습 (속공 및 세팅 공격)</h1>
<p>1) 3명이 삼각형 모양 등으로 세팅하거나 2인 세팅 후 이동하며 공격 형태를 만든다. 2) 심판의 히트인 신호 후 &quot;옴니킨 (팀 색상)&quot;을 외치고 정해진 공격수가 공을 히트한다. 3) 속공 전술 시 공이 떨어지는 지점으로 빠르게 달려가 세팅 후 마지막 선수가 즉시 공격한다. 4) 공격 시 심판 지정 위치 기준 1.8m(공 크기 1.5배) 밖으로 벗어나지 않도록 주의한다.</p>
