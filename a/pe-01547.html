<h1>아웃보드 티볼 야구 게임</h1>
<p>1) 수비팀은 경기장 내 원하는 위치에 아웃보드 2개를 배치하고 포수 및 투수-홈 사이 구역은 안전상 비워둔다. 2) 타자는 투구된 공을 치거나 티에 놓인 공을 친 후 즉시 1루를 향해 달린다. 3) 타자 주자가 베이스에 도달하기 전 수비수가 공을 주워 아웃보드에 맞히면 아웃이 되고, 주자가 먼저 밟으면 세이프가 된다. 4) 주자가 홈까지 돌아오면 1점을 얻으며 공이 최저 비거리선 안에 멈추면 파울로 다시 친다.</p>
