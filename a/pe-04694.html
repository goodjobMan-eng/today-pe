<h1>사이드 스태커스</h1>
<p>1) 3명(또는 4명)이 한 모둠이 되어 1명은 손을 마주 대는 홀더, 1명은 손을 벌리는 사람, 1명은 누들 조각을 넣는 사람을 맡는다. 2) 홀더의 마주 댄 양손 사이에 누들 조각을 가로로 정해진 양만큼 끼워 넣고 손의 압력으로 버틴다. 3) 쌓인 누들 조각의 중간을 벌려가며 조각을 계속해서 더 끼워 넣는다. 4) 조각이 떨어질 것 같으면 교사에게 공식 개수를 세어 달라고 요청하며, 개수를 확인한 뒤에는 더 추가할 수 없다.</p>
