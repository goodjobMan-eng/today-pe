<h1>샅바 겨루기</h1>
<p>1) 두 명이 어깨를 맞대고 앉아 왼손은 다리샅바를 안쪽에서 바깥쪽으로 감아 잡고, 오른손은 허리샅바를 바깥쪽으로 움켜잡습니다. 2) '준비' 신호와 함께 샅바를 잡고 일어섭니다. 3) '시작' 신호와 함께 힘과 몸무게를 이용하여 샅바를 당기거나 밀어서 상대방의 무게 중심을 무너뜨립니다. 4) 상대방을 먼저 넘어뜨리거나 매트 밖으로 내보내는 친구가 이깁니다.</p>
