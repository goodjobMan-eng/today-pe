<h1>탈락 없는 가라사대</h1>
<p>1) 진행자가 '가라사대'를 붙여 말하는 명령에만 동작을 따라 하고, '가라사대'가 붙지 않은 명령에는 절대로 움직이지 않습니다. 2) 동작을 틀리더라도 탈락하지 않고, 양심적으로 자신이 틀렸음을 인지한 채 계속 참여합니다. 3) 진행자는 차렷, 박수, 손 반짝반짝 등 다양한 동작과 말장난으로 학생들을 속입니다. 4) 정해진 시간 동안 끝까지 한 번도 안 틀린 학생을 확인하며 놀이를 마무리합니다.</p>
