<h1>플로어볼 기본기능과 간이 경기</h1>
<p>1) 손잡이 끝과 중간을 잡아 채를 쥐고 제자리에서 탭 드리블과 바닥으로 공을 끄는 긴 드리블, 회전 드리블을 익힌다. 2) 접시콘을 수비수 삼아 지그재그로 피하며 탭 드리블과 긴 드리블로 전진한다. 3) 2인 1조로 마주 보고 땅을 끌며 밀어주는 패스와 채를 뒤로 빼며 충격을 흡수해 받는 연습을 한다. 4) 골대를 향해 밀어 치며 슛을 연습한 뒤 간이 게임에 적용한다.</p>
