<h1>래더 볼 (사다리 골프)</h1>
<p>1) 사다리 표적을 향해 끈으로 연결된 볼(볼라)을 언더핸드로 던진다.2) 맨 위 칸에 걸리면 1점, 가운데 칸은 2점, 맨 아래 칸은 3점을 획득한다.3) 상대 팀과 같은 칸에 걸리면 점수가 상쇄(취소)된다.4) 먼저 15점을 획득하는 팀이 승리한다.</p>
