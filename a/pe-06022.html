<h1>미식축구 가위바위보</h1>
<p>1) 팀별로 공을 든 첫 주자가 출발선에서 마주 보고 달려 나온다.2) 만난 지점에서 가위바위보를 하여 진 사람은 옆으로 빠져 자기 팀 줄 뒤로 돌아간다.3) 가위바위보에서 이긴 사람은 계속 전진하고, 진 팀에서는 다음 주자가 즉시 출발해 상대 주자를 막는다.4) 정해진 시간 동안 상대 진영 끝의 원마커를 먼저 밟거나 더 많이 터치한 팀이 승리한다.</p>
