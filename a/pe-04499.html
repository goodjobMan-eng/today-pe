<h1>농구 패스 연습</h1>
<p>1) 두 사람이 마주 보고 서서 양손으로 공을 잡고 팔꿈치를 벌린 뒤 한 걸음 내딛으며 밀어 체스트 패스를 한다. 2) 같은 방식으로 바닥에 공을 튕겨 바운스 패스를 연습하거나 한 손 바운스 패스를 한다. 3) 공을 몸 옆에 두고 한 손으로 밀어주는 푸시 패스를 연습한다. 4) 머리 위에서 양손으로 던지는 오버헤드 패스를 연습하며 둘 사이의 거리를 다양하게 조절한다.</p>
