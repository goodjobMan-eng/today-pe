<h1>야구형 게임 기본 규칙 익히기</h1>
<p>1) 한 팀에 9명씩 공격과 수비를 번갈아 가며 경기를 진행한다. 2) 공격 팀 타자가 공을 치고 원하는 만큼 1루, 2루, 3루를 향해 달린다. 3) 수비 팀이 타자보다 먼저 도착할 베이스로 공을 던져 공이 먼저 도착하거나 타구 뜬공을 바로 잡으면 타자는 아웃된다. 4) 타자가 아웃되지 않고 1루, 2루, 3루를 돌아 홈으로 다시 들어오면 1점을 득점한다.</p>
