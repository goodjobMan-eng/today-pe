<h1>얼음 땡 폼볼 술래잡기 (얼리기와 녹이기)</h1>
<p>1) 모든 학생이 운동장 전체에 자유롭게 흩어진다. 2) 학생 중 두 명을 정해 한 명에게는 파란색 폼볼, 다른 한 명에게는 빨간색 폼볼을 준다. 3) 파란색 폼볼을 쥔 술래에게 잡힌 학생은 완전히 얼어붙어 제자리에서 전혀 움직이지 못한다. 4) 빨간색 폼볼을 쥔 학생은 얼어붙은 친구에게 달려가 녹여서 다시 움직이게 해준다.</p>
