<h1>올챙이 연못 건너기 릴레이</h1>
<p>1) 출발선에서 모둠별로 줄을 서고 앞쪽 바닥에 번호가 적힌 원마커들을 징검다리처럼 배치한다. 2) 신호가 울리면 첫 주자가 팀원이 바닥에 놓아주는 원마커를 순서대로 밟으며 반환점을 향해 건너간다. 3) 반환점의 빨간 선을 터치한 뒤 다시 같은 방식으로 원마커를 놓아주며 출발선으로 리턴하여 돌아온다. 4) 전원이 먼저 완주한 팀 순서대로 등위를 매기며 원마커 간격을 넓히거나 외발 뛰기 규칙으로 변형할 수 있다.</p>
