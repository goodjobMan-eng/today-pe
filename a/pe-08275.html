<h1>7볼 (드래곤볼)</h1>
<p>1) 체육관 중앙 원(후프 안)에 배구공 7개를 모아두고 각 모둠은 자기 진영의 후프 뒤에 위치한다. 2) 신호가 울리면 각 모둠의 주자가 중앙으로 달려가 공을 1개씩 집어 자기 진영 후프로 가져온다. 3) 중앙의 공이 모두 소진되면 다른 팀 진영의 후프에 있는 공을 빼앗아 올 수 있다. 4) 공을 가져오거나 빼앗을 때는 한 번에 1개씩만 손으로 들고 자기 진영으로 복귀한다.</p>
