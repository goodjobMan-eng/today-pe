<h1>1대1 농구 게임</h1>
<p>1) 공격과 수비 역할을 정하고 골대에서 먼 쪽에 공격수가 위치한다. 2) 공격수와 수비수가 서로 패스를 1회 주고받아 수비 준비 완료를 확인한 후 경기를 시작한다. 3) 공격수는 드리블과 슛을 시도하고 슛이 안 들어가면 리바운드 후 공격을 이어가며 득점을 겨룬다.</p>
