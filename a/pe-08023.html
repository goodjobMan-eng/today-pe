<h1>피라미드 가위바위보</h1>
<p>1) 수비 팀은 피라미드 형태로 1열부터 4열까지 줄지어 서고 마지막 열에 '킹' 1명이 선다. 2) 공격 팀은 출발선에서 일제히 출발해 1열의 수비수와 가위바위보를 한다. 3) 이기면 다음 열로 전진해 가위바위보를 하고, 지면 어느 열에서 졌든 무조건 출발점으로 돌아가 재출발한다. 4) 마지막 킹을 이기면 통과이며, 정해진 시간(예: 5분) 동안 통과한 인원을 집계한 뒤 공수를 교대한다.</p>
