<h1>마이플레이트 영양 파라슈트 활동</h1>
<p>1) 식품군(과일, 채소, 단백질, 곡물, 유제품)이 표시된 파라슈트를 잡고 흔들며 준비한다. 2) 지도자가 부르는 식품군에 맞춰 약속된 동작(과일-위로, 채소-아래로, 단백질-뒤로, 곡물-안으로)을 수행한다. 3) 파라슈트 위의 공/물건을 지정된 식품군 색상 영역으로 이동시키는 협동 활동을 한다. 4) 한 손만 사용하여 파라슈트를 흔들어 물건을 밖으로 털어내는 신체 활동을 진행한다.</p>
