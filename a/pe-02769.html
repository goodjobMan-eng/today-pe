<h1>주먹야구 기본 기능 공치기</h1>
<p>1) 타자는 몸을 비스듬히 세우고 양발을 어깨너비만큼 벌린 뒤 무릎을 살짝 굽힌다. 2) 공을 쥔 손으로 공을 몸앞 쪽으로 살짝 띄워 올린다. 3) 반대쪽 손(주먹)을 뒤로 뺐다가 날아오는 공을 정확히 보고 휘둘러 친다. 4) 멀리 높게 보내려면 공의 밑부분을, 직선으로 보내려면 중앙을 맞춰 원하는 방향으로 보낸다.</p>
