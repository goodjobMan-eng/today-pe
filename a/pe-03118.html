<h1>패드민턴 기초 기능 익히기</h1>
<p>1) 짧은 쪽에 엄지손가락을 두고 포핸드 또는 백핸드 그립으로 패드민턴 라켓을 잡는다. 2) 제자리에서 셔틀콕을 라켓 중심에 맞추며 연속으로 띄우는 리프팅 연습을 한다. 3) 밑에서 위로 걷어 올리듯 서브를 넣어 상대 코트로 보낸다. 4) 1대 1 또는 2대 2로 공을 주고받으며 높게 뜬 공은 위에서 아래로 스매시 공격을 한다.</p>
