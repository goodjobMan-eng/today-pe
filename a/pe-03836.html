<h1>플래그 저글링 스킬</h1>
<p>1) 왼손의 플래그를 공중에 던지고 오른손으로 오른쪽 어깨를 친 후 왼손으로 잡고, 반대쪽도 수행한다. 2) 플래그를 던지고 반대쪽 무릎을 터치한 후 같은 손으로 잡고, 반대쪽도 교대한다. 3) 플래그를 던지고 등 뒤로 반대쪽 발뒤꿈치를 터치한 후 잡는 동작을 양쪽 모두 연습한다. 4) 플래그를 던지고 반대쪽 팔꿈치로 무릎을 터치하거나, 두 손으로 연속해서 던지고 박수를 친 뒤 잡는 저글링으로 발전시킨다.</p>
