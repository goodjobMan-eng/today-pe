<h1>서브 챔피언 배구 게임</h1>
<p>1) 배구 네트를 사이에 두고 학급 학생들을 절반씩 두 팀으로 나누어 각 코트에 배치한다. 2) 팀원들에게 배구공을 나누어 준 뒤, 서브를 넣어 상대 팀 코트 라인 안에 최대한 많은 공을 집어넣도록 한다. 3) 코트 안에 성공적으로 들어간 공의 개수가 상대 팀보다 많은 팀이 승리하며, 언더핸드와 오버핸드 서브를 번갈아 연습한다.</p>
