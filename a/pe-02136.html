<h1>바른 관계 맺기 협력 기차 놀이</h1>
<p>1) 6명씩 4개 팀으로 나누고 각 팀의 주장을 정한다. 2) 주장은 맨 뒤에서 눈을 뜨고 말을 할 수 있는 기관사 역할을 맡고, 앞의 팀원 5명은 안대를 쓰고 어깨에 손을 올린다. 3) 주장의 음성 지시에 따라 팀원들이 지그재그로 설치된 콘 장애물을 건드리지 않고 결승 지점까지 통과한다. 4) 콘을 쓰러뜨리지 않고 다른 팀보다 먼저 통과하면 승리한다.</p>
