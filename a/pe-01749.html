<h1>루키 줄넘기 기초 스킬 챌린지</h1>
<p>1) 각자 줄넘기 1개를 챙겨 넓은 공간에 바르게 정렬해 설 준비를 한다. 2) 바닥에 줄넘기를 놓아 모양·숫자·글자를 만들고 안팎 점프, 스킵, 갤럽 등 다양한 이동 스텝을 익힌다. 3) 줄을 일자로 길게 바닥에 펼친 뒤 양발 모아 앞뒤 점프(벨 점프)와 좌우 점프(스키어 점프)를 수행한다. 4) 줄을 손에 쥐고 레인보우 턴 및 악어 점프를 거쳐 연속 양발 모아 뛰기 챌린지로 변형해 뛴다.</p>
