<h1>공을 튀기고 던져라</h1>
<p>1) 6명이 한 모둠을 이루고 모둠 내 순서를 정한다. 2) 첫 번째 모둠원이 공을 밀듯이 바닥에 튀기며 이동하다가 원마커 위에서 제자리 공 튀기기를 5번 실시한다. 3) 공을 던져 바구니에 넣되, 들어가지 않으면 다시 잡아 바구니에 들어갈 때까지 던진다. 4) 공을 바구니에 넣고 출발선으로 돌아오면 다음 주자가 출발하며, 마지막 모둠원이 가장 빨리 출발선으로 돌아온 모둠이 이긴다.</p>
