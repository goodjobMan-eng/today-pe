<h1>줄넘기 기본 방법과 기본 스텝</h1>
<p>1) 줄넘기 길이를 자신의 신체에 맞게 조절하고 양발 뒤꿈치를 가볍게 든 상태로 준비합니다. 2) 양발 모아 뛰기를 1회선 2도약과 1회선 1도약으로 나누어 연습한 뒤, 번갈아 뛰기(러닝 스텝)와 한 발에 두 번씩 뛰는 번갈아 2박자 스텝을 익힙니다. 3) 좌우 및 앞뒤로 이동하며 뛰는 십자 뛰기 스텝에 도전합니다. 4) 모든 기본 스텝을 익힌 뒤 음악 비트에 맞추어 연속으로 뛰어봅니다.</p>
