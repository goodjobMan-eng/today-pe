<h1>농구 기초 드리블 연습 방법</h1>
<p>1) 제자리에서 두 손으로 공을 튕기고 잡는 횟수를 1회부터 10회까지 늘려가며 연습합니다. 2) 제자리에서 오른손, 왼손, 번갈아 가며 공을 튕기고 잡는 횟수를 1회부터 10회까지 늘려 연습합니다. 3) 걸어가면서 한 손으로 공을 튕기고 잡는 횟수를 단계적으로 늘려 연습합니다. 4) 가볍게 뛰어가면서 한 손으로 공을 튕기고 잡는 횟수를 단계적으로 늘려 연습합니다.</p>
