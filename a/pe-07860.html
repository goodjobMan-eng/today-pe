<p>1) 배구공을 바운드시켜 상대 영역의 두꺼운 착지매트에 닿게 하는 방식으로 진행한다 2) 공을 손에 쥐고는 달릴 수 없으므로 패스를 통해 전진한다 3) 수비수는 착지매트로 다이빙 점프하여 공이 매트에 닿는 것을 몸으로 막아낼 수 있다 4) 바운드된 공이 매트에 닿으면 3점, 매트 위에 선 채로 패스를 받아내면 1점을 획득한다</p>
