<h1>콘홀 퇴근 게임</h1>
<p>1) 양 팀이 차례대로 콘홀 보드의 원(구멍)을 향해 빈백을 던진다.2) 원 안에 빈백을 넣은 사람은 성공하여 게임에서 빠진다(퇴근).3) 자신이 던진 빈백은 직접 주워 온다.4) 모든 팀원이 먼저 성공하여 퇴근한 팀이 승리한다.</p>
