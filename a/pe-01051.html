<h1>스포밴드 탄성 전신 코디네이션 체조</h1>
<p>1) 스포밴드(또는 스트레칭 밴드, 수건)를 준비하고 어깨너비 제자리 걷기 워밍업을 한다. 2) 밴드 양 끝을 잡고 만세 자세에서 어깨 회전 및 옆구리 늘리기로 상체 유연성을 기른다. 3) 밴드 중앙에 발을 걸고 전방 킥, 사이드 킥, 로잉 당기기, 런지 버티기로 전신 근력을 강화한다. 4) 잡는 밴드 칸수를 좁혀 탄성 저항 강도를 높이거나 버티는 시간을 늘려 도전한다.</p>
