<h1>빈백 던지고 받기 게임</h1>
<p>1) 각 구역에 놓인 안내판의 지시에 따라 빈백을 던지고 받는다. 2) 한 구역당 5~10회씩 연습한다. 3) 스스로 속도를 조절하며 구역을 순환한다.</p>
