<h1>농구 드리블 조끼 뺏기 및 공 뺏기 게임</h1>
<p>1) 콘으로 정해진 구역을 표시하고 각자 농구공 1개와 허리춤에 팀 조끼를 착용한다. 2) 구역 안에서 드리블을 유지하며 이동한다. 3) 드리블을 하면서 상대방의 허리에 걸린 팀 조끼를 빼앗아 구역 바깥으로 던진다. 4) 조끼를 빼앗기거나 자신의 공이 바깥으로 나간 학생은 구역 밖으로 나가며 최후의 1인이 남을 때까지 진행한다.</p>
