<p>1) 학생들이 원형으로 서서 파라슈트의 손잡이를 잡고 준비한다. 2) 교사의 구호에 맞춰 파라슈트를 위로 들어 올려 우산 모양을 만든다. 3) 지정된 걸음 수만큼 구호를 외치며 안쪽으로 걷는다. 4) 다시 바깥쪽으로 물러나며 원위치한다.</p>
