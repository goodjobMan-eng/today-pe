<h1>아이 오브 더 타이거 복싱 댄스 웜업</h1>
<p>1) 영화 록키의 주제곡에 맞춰 복싱과 피트니스 동작을 결합해 몸을 푸는 활동을 시작합니다. 2) 제자리에서 리듬을 타며 가볍게 발을 구르고 가드 자세를 취합니다. 3) 음악 박자에 맞춰 잽과 스트레이트 펀치를 날리고 위빙 및 스쿼트 동작을 합니다. 4) 점핑잭과 제자리 하이니(무릎 올리기)를 통해 심폐 기능을 강화하고 전신 근육을 풀어줍니다.</p>
