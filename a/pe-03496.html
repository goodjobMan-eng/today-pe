<h1>떡 팔러 가요 (콩주머니 머리에 얹고 이동하기)</h1>
<p>1) 4명이 한 모둠을 이루고, 출발선에서 머리 위에 콩주머니(떡)를 올려놓는다. 2) 출발 신호와 함께 바닥에 그려진 선을 따라 균형을 잡으며 이동한다. 3) 고개를 숙여 후프 안에 콩주머니를 넣는다. 4) 콩주머니를 떨어뜨리면 출발선으로 다시 돌아가 시작하며, 정해진 시간 동안 떡을 가장 많이 판 모둠이 이긴다.</p>
