<h1>개인 테니스 기초 기술 및 라켓 조작 훈련</h1>
<p>1) 테니스공을 바닥에 튀긴 뒤 다리를 공 위로 넘어가며 제어한다.2) 라켓으로 공을 가볍게 띄운 후 라켓을 공 주변으로 한 바퀴 돌려 닿지 않게 통과시킨다.3) 공을 높이 던져 올린 뒤 라켓 면 중앙으로 충격을 흡수하며 바닥에 떨어뜨리지 않고 받는다.4) 바닥 선 위에서 균형을 잡으며 공을 튀기거나 허들을 넘어가며 공을 연속으로 튕겨 올린다.</p>
