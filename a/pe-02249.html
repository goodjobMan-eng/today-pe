<h1>전방 스쿼트 점프 (릴레이 제자리 멀리뛰기)</h1>
<p>1) 4명씩 한 팀을 만든다. 2) 첫 번째 팀원이 출발선에서 제자리 멀리뛰기를 한다. 3) 두 번째 팀원은 앞 주자가 착지하여 측정(생략 가능)된 거리 지점에서 이어서 제자리 멀리뛰기를 한다. 4) 이러한 방식으로 팀원 전체(4명)가 연속으로 뛰어 최종 도달 거리를 측정한다. 5) 한 팀당 2회를 실시하여 더 우수한 기록을 팀의 최종 기록으로 사용한다.</p>
