<h1>배구형 게임 알아보기</h1>
<p>1) 배구 코트 안에서 네트를 넘겨 상대방의 빈 곳에 공을 떨어뜨려 득점한다. 2) 혼자서 연속으로 공을 두 번 터치하면 파울이 되어 상대방에게 점수를 준다. 3) 공을 다룰 때 네트에 몸이나 손이 닿지 않도록 주의하며 팀 전체가 3번 안에 공을 연결하여 상대 코트로 넘긴다. 4) 서브는 코트 선 밖에서 언더핸드 서브나 오버핸드 서브로 공을 쳐서 상대 코트로 넘기며 경기를 시작한다.</p>
