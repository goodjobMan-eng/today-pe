<h1>사막에서 물을 찾은 기쁨! 이스라엘 민속춤 마임</h1>
<p>1) 남녀가 번갈아 손을 잡고 강강술래처럼 둥근 원 대형을 만들어 음악에 맞춰 무릎 반동을 탄다. 2) 왼발을 앞뒤로 교차하는 그레이프바인 스텝으로 시계 방향으로 돌며 가볍게 이동한다. 3) 원 중앙으로 모이며 팔을 올리고 발끝을 찍은 뒤 제자리로 물러나는 오므렸다 펼치기 동작을 수행한다. 4) 시계 방향 워킹 스텝 후 제자리 점프 발 찍기와 옆 사람 손뼉 치기 동작을 순서대로 반복하며 흥겹게 춘다.</p>
