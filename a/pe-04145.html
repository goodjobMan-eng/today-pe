<h1>지뢰 피하기 콘 수거 태그 놀이</h1>
<p>1) 바닥에 다양한 색상의 접시콘을 배치하고 술래는 펀스틱을 든다. 2) 참가자들은 바닥의 콘을 주워 모으되, 술래가 지정한 지뢰 색상 콘은 건드리지 않는다. 3) 술래가 지정한 금지 색상을 만지거나 술래의 펀스틱에 닿으면 아웃된다. 4) 지뢰 색상이 아닌 안전한 색상의 콘을 술래의 방해를 피해 모두 수거한다.</p>
