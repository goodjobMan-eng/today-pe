<h1>줄줄이 숫자 스탬핑</h1>
<p>1) 팀원들이 순서대로 서서 1번 주자가 번호 마커(1~10번)를 순서대로 밟으며 앞으로 이동한다.2) 뒤따르는 2번, 3번 주자도 앞 주자를 추월하지 않고 줄지어 번호 마커를 차례대로 밟는다.3) 마지막 주자가 10번 마커를 밟는 순간 스톱워치를 멈추고 팀의 소요 시간 기록을 측정한다.</p>
