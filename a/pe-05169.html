<h1>금화 획득 체력 운동 게임</h1>
<p>1) 체육관 벽 쪽 바구니 앞에 놓인 원마커로 달려간다.2) 원마커 위에서 지정된 체력 운동(점핑잭, 푸시업 등)을 10회 수행하고 바구니에서 금화 1개를 획득한다.3) 반대편 라인에 있는 팀 바구니(남/여)에 금화를 넣고 계속 반복하여 왕복한다.</p>
