<h1>손수건 뺏기 게임 (엘 파뉴엘로)</h1>
<p>1) 학생들은 두 팀으로 나뉘어 마당 양쪽에 서고 각자 1번부터 6번까지 번호를 배정받는다. 2) 교사는 중앙에서 손수건을 한 손으로 높이 들고 특정 번호를 외친다. 3) 호명된 양 팀 학생은 달려 나와 손수건을 잡아 자기 진영으로 돌아가려 하며 상대에게 잡히지 않고 복귀하면 1점을 얻고 잡히면 상대 팀이 1점을 얻는다.</p>
