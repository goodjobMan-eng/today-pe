<h1>체인 릴레이</h1>
<p>1) 각 팀 앞에 참가 인원의 두 배에 해당하는 평면 마커를 일정한 간격으로 일직선으로 배치하고, 마지막 마커에서 몇 미터 떨어진 지점에 후프를 놓거나 원을 표시한다.2) 출발 신호가 울리면 각 팀의 맨 마지막 주자가 마지막 마커 주위를 돈 뒤 지그재그로 달려 돌아와 맨 앞 주자 앞 첫 번째 마커에 선다.3) 모든 팀원이 같은 과정을 반복하며 한 칸씩 마커를 앞으로 전진하고, 팀원 중 먼저 후프에 도달하는 팀이 승리한다.</p>
