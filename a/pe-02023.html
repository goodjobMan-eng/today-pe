<h1>병뚜껑 장애물 네트형 게임</h1>
<p>1) 상이나 책상 가운데에 장애물을 놓아 네트를 구성한다. 2) 장애물을 피해 손가락으로 병뚜껑을 튕겨 상대편으로 넘긴다. 3) 병뚜껑이 상대 구역 밖으로 나가거나 상대가 쳐서 넘기지 못하면 득점한다. 4) 병뚜껑이 장애물 네트에 닿거나 걸리면 실점한다.</p>
