<h1>클린 네트 피구(쓰레기 수거함)</h1>
<p>1) 배구 네트로 코트를 양분하고, 각 팀 진영 뒤쪽 끝에 수거함 역할을 할 훌라후프를 배치한다. 2) 경기 시작과 함께 양 팀 선수들은 자기 구역에 떨어진 폼볼(쓰레기)을 상대 진영으로 던져 넘긴다. 3) 네트를 넘어온 폼볼이 바닥에 닿기 전에 노바운드로 캐치한 학생은 공을 자기 팀 훌라후프 안에 넣는다. 4) 정해진 시간 동안 훌라후프에 공을 가장 많이 수거해 넣거나 코트에 공을 적게 남긴 팀이 승리한다.</p>
