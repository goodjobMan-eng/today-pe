<h1>할로윈 둘 중 하나 선택 타바타 운동</h1>
<p>1) 화면에 등장하는 두 가지 할로윈 관련 선택지 중 마음에 드는 것을 하나 선택합니다. 2) 화면이 전환되면 자신이 고른 선택지의 캐릭터가 보여주는 댄스나 운동 동작을 15초 동안 수행합니다. 3) 중간중간 문 고르기, 다른 그림 찾기, 달리기 레이스 등 미니게임이 번갈아 진행됩니다. 4) 다양한 퀴즈와 운동 과제를 해결하며 전신의 유연성과 근지구력을 기릅니다.</p>
