<h1>물병 트랩 게임 (Water Bottle Trap Game)</h1>
<p>1) 빈 물병 위에 빨래 바구니를 비스듬히 걸쳐 세워 트랩을 만든다2) 약 8~10피트(2.5~3m) 떨어진 곳에서 테니스공(또는 축구공)을 굴려 물병을 맞힌다3) 물병과 테니스공이 모두 바구니 안에 갇히면 3점, 물병만 갇히면 2점, 테니스공만 갇히면 1점을 얻는다4) 1분(60초) 타이머 동안 공을 굴려 총 획득 점수를 계산한다</p>
