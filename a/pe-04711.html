<h1>그린치 태그(Grinch Tag)</h1>
<p>1) 그린치 술래 2명은 스펀지봉을 들고, 나머지 도망자들은 막대 5개씩을 가지고 도망친다. 2) 중앙 원(그린치의 동굴) 안에는 아무도 들어갈 수 없으며 그 주위를 피해 달린다. 3) 술래에게 태그된 사람은 손을 들고 동굴 바구니에 막대 1개를 넣은 뒤 다시 나와 경기에 참여한다. 4) 막대 5개를 모두 잃은 사람은 교사에게 와서 지정된 운동을 수행하고 막대를 다시 받아 복귀한다.</p>
