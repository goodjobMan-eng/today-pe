<h1>플로어볼 슈팅 및 게임 규칙 연습</h1>
<p>1) 플로어볼 스틱의 페이스로 공의 밑부분을 살짝 누르며 앞으로 밀어내듯 슈팅하는 기본 자세를 익힙니다. 2) 스틱의 블레이드가 허리 위로 올라가지 않도록(하이 스틱 반칙 방지) 바닥을 쓸어주듯 슛을 시도합니다. 3) 실제 경기 시 공을 몸으로 가리거나 반칙이 나오면 프리힛을 적용하며 패스와 슛을 연결합니다. 4) 골대를 향해 집중해서 슛을 연습하고 리그전 미니 게임을 진행합니다.</p>
