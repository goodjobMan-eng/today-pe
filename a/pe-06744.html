<h1>바운드 배구</h1>
<p>1) 서브는 3m 지점에서 상대 코트로 던져서 넣는다. 2) 첫 번째 볼은 바운드되거나 노바운드로 리시브한다. 3) 두 번째 볼은 공을 잡고 네트 앞으로 달려와 던져서 세팅한다. 4) 세 번째 볼을 스파이크하여 노바운드로 연결되면 2점, 바운드되어 연결되면 1점을 획득한다.</p>
