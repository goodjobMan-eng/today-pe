<h1>체육 수업 준비운동 및 정리운동</h1>
<p>1) 체육 수업 전 관절 풀기와 스트레칭을 통해 체온을 높이고 심장박동을 올려줍니다. 2) 손목·발목, 무릎, 허리, 어깨, 목 등 주요 관절을 순서대로 부드럽게 돌려줍니다. 3) 이어서 다리, 허벅지(런지), 어깨, 팔, 옆구리 등을 늘려주는 동적·정적 스트레칭을 진행합니다. 4) 본 운동이 끝난 뒤에는 관절 풀기를 제외하고 근육을 진정시키는 스트레칭만으로 정리운동을 실시합니다.</p>
