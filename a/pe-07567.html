<h1>책임감 배구</h1>
<p>1) 네트를 사이에 두고 코트를 가~바 6개 구역으로 나눈 뒤 6명씩 2개 모둠을 이룬다. 2) 게임장 밖에서 공을 치거나 던지며 시작하고 넘어온 공은 1번 튀기고 받아도 되며 모둠원끼리 공을 이어주어 3번 안에 상대 구역으로 넘긴다. 3) 공을 받지 못하거나 3번 안에 넘기지 못하거나 넘긴 공이 벗어나면 상대 모둠이 1점을 얻고 점수를 얻을 때마다 시계 방향으로 이동해 역할을 바꾼다. 4) 15점을 먼저 얻은 모둠이 이긴다.</p>
