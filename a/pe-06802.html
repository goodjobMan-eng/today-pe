<h1>다득점 티볼 게임</h1>
<p>1) 타자가 공을 친 후 아웃 없이 1루를 밟으면 1점, 2루 2점, 3루 3점, 홈 4점으로 계속 돌며 득점한다. 2) 수비팀은 공을 잡아 팀원끼리 패스하며 홈까지 공을 보낸다. 3) 홈에 있는 수비수가 공을 받고 그만을 외치면 그때까지 타자가 밟은 베스 점수만 인정된다.</p>
