<h1>버티기와 굽히기 기초 근력 운동</h1>
<p>1) 양발을 어깨너비로 벌리고 양팔을 앞으로 뻗은 뒤 허리를 펴고 무릎을 90도로 굽혔다 일어선다. 2) 매트에 엎드려 팔꿈치로 삼각형을 만들고 발을 뒤로 뻗어 팔과 발끝으로 몸을 지탱하며 버틴다. 3) 매트 위에 누워 상체를 들고 팔과 다리를 앞으로 뻗어 버틴다.</p>
