<h1>놀이터 장애물 코스 달리기</h1>
<p>1) 놀이터의 놀이 기구들을 활용해 6개의 스테이션을 설치한다. 2) 각 스테이션마다 '위로', '아래로', '옆으로', '통과하여' 등 이동 방법을 적은 카드를 배치한다. 3) 학생들은 각 스테이션에서 카드에 적힌 이동 방법으로 놀이 기구를 통과한다. 4) 일정 시간 후 다음 스테이션으로 이동하여 모든 코스를 체험한다.</p>
