<h1>풍선 손·발 번갈아 치기 패턴 활동</h1>
<p>1) 주변 친구들과 부딪히지 않도록 공간을 넓게 벌려 선다.2) 풍선을 머리 위로 띄운다.3) 손으로 풍선을 한 번 쳐서 띄운다.4) 풍선이 조금 떨어질 때까지 기다린 후 발로 찬다.5) 손과 발 순서 패턴을 유지하며 풍선이 바닥에 닿지 않게 계속 이어간다.</p>
