<h1>콩 주머니 모으기</h1>
<p>1) 4명이 한 모둠을 이루고 네 모둠이 게임에 참여하며 모둠별로 시작 위치를 정한다. 2) 출발 신호와 함께 모둠에서 순서대로 한 명씩 공을 튀기며 이동하여 콩 주머니를 가져와 모둠 위치에 놓는다. 3) 공을 튀기며 이동하다가 공을 놓치면 다시 공을 잡아 제자리에서 5번 튀겨야 이동할 수 있다. 4) 정해진 시간 동안 가장 많은 콩 주머니를 모은 모둠이 이긴다.</p>
