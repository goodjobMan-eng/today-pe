<h1>공 훔치기 (Bälleklau)</h1>
<p>1) 경기장을 3개 구역으로 나누어 중앙에 술래 팀 1팀, 양 끝 진영에 2팀을 배치한다. 2) 양 끝 팀은 중앙 술래 구역을 통과해 상대 진영 상자에 있는 공을 훔쳐 온다. 3) 술래에게 태그되지 않고 자기 진영으로 공을 가져오면 득점하며 일정 시간 후 역할을 교대한다.</p>
