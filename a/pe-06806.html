<h1>가위바위보 의자 책상 레벨-업</h1>
<p>1) 전원이 바닥에 엉덩이를 대고 앉아(또는 누워) 1단계로 시작한다. 2) 교사와 가위바위보를 하여 이긴 학생만 다음 단계로 승급한다. 3) 단계 순서는 1단계 앉기(눕기), 2단계 무릎 꿇기, 3단계 의자 앉기, 4단계 의자 위에 서기, 5단계 책상에 걸터앉기(또는 손들기)로 올라간다. 4) 가장 먼저 최종 단계에 도달하여 성공하는 학생을 가린다.</p>
