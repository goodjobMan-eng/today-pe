<h1>츄크볼 소개 및 기능 연습</h1>
<p>1) 2인 1조로 마주보고 숄더 패스, 푸시 패스, 언더 패스를 연습합니다. 2) 바운더에 공을 던지고 스스로 튀어나오는 공을 받아냅니다. 3) 바운더에 공을 던지고 뒤따라오는 다음 사람이 튀어나오는 공을 받는 연속 연습을 진행합니다. 4) 공격 위치에 1명, 수비 위치에 2명이 서서 공격수가 바운더에 던진 공을 수비수가 잡고 자리를 순환하는 공격 및 수비 종합 연습을 합니다.</p>
