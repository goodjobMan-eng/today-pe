<h1>점보스택 퐁당 릴레이</h1>
<p>1) 1번 주자가 공을 들고 반환점을 한 바퀴 돌아온다.2) 돌아온 주자는 점보스택 컵 안으로 공을 굴리거나 던져서 넣는다.3) 공이 점보스택 안에 들어가면 성공하고 공을 꺼내 다음 주자에게 넘긴다.4) 다음 주자도 같은 방식으로 달려가 점보스택 안에 공을 넣는 과정을 반복한다.</p>
