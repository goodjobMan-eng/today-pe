<h1>마리오 러브 피치 브레인 브레이크 런닝 게임</h1>
<p>1) 화면 속 1인칭 달리기 시점에 맞춰 제자리에서 계속 달리기를 합니다. 2) 굼바가 나타나면 점프하고, 엉금엉금이 나오면 발차기(킥)를 합니다. 3) 뻐끔플라워나 불꽃 공격이 날아오면 좌우로 몸을 숙여 피하고(닷지), 물음표 상자가 나오면 주먹으로 펀치를 날립니다. 4) 레벨을 통과하며 코인과 파워업 스타를 모아 보스 쿠파를 물리치고 피치 공주를 구출합니다.</p>
