<h1>런닝맨 체조</h1>
<p>1) 같은 쪽 팔과 다리를 앞으로 내밀고 준비 자세를 취한다.2) 구호에 맞춰 앞뒤로 발을 네 번 바꾸면서 팔도 좌우로 네 번 번갈아 바꾼다.3) 넷째 박자에 팔을 번쩍 들며 동작을 완성한다.4) 준비 신호 시 기합을 넣고 10회 또는 20회 반복하여 준비운동을 실시한다.</p>
