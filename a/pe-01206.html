<h1>수비 패스 득점 발야구 게임</h1>
<p>1) 수비 구역 홈 플레이트 옆에 훌라후프를 두고, 공격과 수비를 7명씩 팀으로 나눕니다. 2) 투수가 굴린 배구공을 타자가 차고 1루·2루·3루를 거쳐 홈으로 전력 질주합니다. 3) 수비팀은 공을 잡아 주자가 홈을 밟기 전까지 2m 이상 떨어진 팀원에게 노바운드로 패스를 이어가며 1회 성공마다 1점을 획득합니다. 4) 이미 패스를 받은 사람은 중복으로 받을 수 없으며 훌라후프 안의 최종 수비수에게 배달되어야 누적 득점이 인정됩니다.</p>
