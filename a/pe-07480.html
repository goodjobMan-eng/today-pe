<h1>풋베이스볼 (발야구)</h1>
<p>1) 매트 4장을 베이스로 배치하고 공격팀(키커)과 수비팀(투수 및 수비수)으로 나눈다. 2) 투수가 공을 굴리면 키커가 발로 차고 베이스를 향해 달린다. 3) 뜬공 포구, 베이스 선점 포구, 베이스 간 태그아웃 시 아웃되며 3아웃 또는 타순 종료 시 공수를 교대한다. 4) 4개 베이스를 모두 돌아 홈으로 들어오면 1점을 득점한다.</p>
