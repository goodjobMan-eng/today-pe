<h1>홈 피트니스 챌린지</h1>
<p>1) 손을 허리에 얹고 목 스트레칭과 어깨 돌리기를 한다. 2) 제자리에서 방향을 바꾸며 20초씩 가볍게 달린다. 3) 스키점프, 스쿼트 터치다운, 펀치와 킥 동작을 차례대로 수행한다. 4) 줄넘기 동작을 35회 실시하고 원하는 경우 처음부터 사이클을 반복한다.</p>
