<h1>다리 찢기 놀이 (가로·세로 버전)</h1>
<p>1) 가로 버전은 두 사람이 마주 보고 가위바위보를 하여 진 사람이 뒤꿈치와 앞꿈치를 번갈아 벌리며 버틴다. 2) 세로 버전은 발을 전후로 맞대고 가위바위보를 하여 이긴 사람은 앞발을 뒤로, 진 사람은 앞발을 앞으로 이동한다. 3) 다리를 벌리며 끝까지 균형을 유지하지 못하거나 버티지 못하면 패배한다.</p>
