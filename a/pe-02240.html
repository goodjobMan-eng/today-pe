<h1>진에서 밀어내기</h1>
<p>1) 술래 한 명을 정하고 다른 사람은 인원수에 맞게 적당히 그린 원 안에 들어간다. 2) 원 안에 있는 사람들은 &quot;영차영차&quot; 하며 서로 등으로 밀어낸다. 3) 술래는 원의 주위를 돌며 중앙의 사람을 터치한다. 4) 원 밖으로 밀려나거나 술래에게 터치된 사람은 술래와 한 편이 되며, 최후의 1명이 남을 때까지 계속 진행한다.</p>
