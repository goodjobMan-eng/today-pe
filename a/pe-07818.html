<h1>벽치기 핸드볼 (월 볼)</h1>
<p>1) 체육관이나 운동장 벽면을 마주 보고 선다. 2) 게임 시작 전 학생마다 공을 칠 순서 번호를 하나씩 배정받는다. 3) 첫 번째 순서 학생이 손바닥으로 테니스공을 쳐서 벽에 맞힌다. 4) 벽에 맞고 튕겨 나온 공을 바운드 없이 바로 치거나 원바운드 이내에 손바닥으로 쳐서 벽으로 보낸다. 5) 공을 놓치거나 투바운드 이상이 되면 벌점 1점을 받으며, 게임 종료 시 벌점이 가장 적은 학생이 승리한다.</p>
