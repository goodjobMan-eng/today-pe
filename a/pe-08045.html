<h1>소프트 배구 패스 연습</h1>
<p>1) 열 손가락을 넓게 펴고 엄지와 검지로 삼각형 모양을 만든다. 2) 엄지손가락이 붙지 않도록 살짝 벌리고 손의 위치는 이마에서 주먹 하나 정도 거리를 둔다. 3) 정지해 있는 공을 열 손가락으로 감싸 쥐어 이마 앞으로 가져오는 감각을 익힌다. 4) 주로 쓰는 발을 살짝 앞으로 내밀고 어깨너비보다 넓게 벌린 뒤 무릎을 굽혀 상체를 앞으로 기울인다. 5) 양손으로 공을 아래에서 위로 띄워 자신의 머리 위로 올려 보내는 연습을 혼자 반복한다.</p>
