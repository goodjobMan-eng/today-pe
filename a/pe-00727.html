<h1>고고 골 (차고 달려 점수 얻기)</h1>
<p>1) 공격 팀은 출발선에서 공을 발로 차서 콘 사이의 골라인을 통과시키거나 콘 위의 표적을 맞힙니다. 2) 공을 찬 공격수는 곧바로 반환점 콘이나 후프 구역을 향해 달려가 점수를 얻는 달리기 미션을 수행합니다. 3) 수비 팀은 굴러온 공을 빠르게 잡아 정해진 보관 바구니나 후프 안으로 회수합니다. 4) 수비수가 공을 완전히 회수하기 전까지 공격수가 달린 횟수나 통과한 골라인 조건에 따라 점수를 누적합니다.</p>
