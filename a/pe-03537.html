<h1>공 받아 이어 주기</h1>
<p>1) 4명이 한 모둠을 이루고 공격 모둠과 수비 모둠으로 나눈다. 2) 공격 모둠은 서브 구역에서 서브를 넣는다. 3) 수비 모둠은 공격 모둠이 서브한 공을 받아 모든 모둠원에게 이어주면 1점을 얻는다. 4) 공격 모둠이 모두 서브를 마치면 공수를 교대하고 점수가 더 많은 모둠이 승리한다.</p>
