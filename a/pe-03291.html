<h1>왕복 이어달리기 빙고 게임</h1>
<p>1) 3명씩 두 팀을 이루어 팀별 색깔의 미니 삼각콘을 갖고 후프를 이용해 빙고판을 만든다. 2) 신호가 울리면 첫 번째 주자가 미니 삼각콘을 들고 달려가 후프에 놓고 돌아온다. 3) 다음 주자도 같은 방식으로 왕복 달리기를 하며 미니 삼각콘을 후프에 놓고 돌아온다. 4) 삼각콘을 다 쓴 후부터는 이미 놓인 콘을 다른 후프로 옮기며 먼저 빙고를 완성한 팀이 승리한다.</p>
