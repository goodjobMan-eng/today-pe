<h1>족구 경기 방법 및 규칙</h1>
<p>1) 서브 제한 구역에서 시계 방향 로테이션 순서로 서브를 넣어 경기를 시작한다. 2) 공은 바운드 없이 바로 차거나 바닥에 1번 튄 것까지 찰 수 있으며, 2번 이상 튀기면 실점한다. 3) 최대 3번의 패스 안에 머리와 무릎 아래 부위(발·종아리)만을 사용해 상대 코트로 넘긴다. 4) 한 사람이 연속 2번 터치하거나, 신체나 발이 네트에 닿거나, 네트를 넘어 상대 코트를 침범하면 반칙으로 실점한다.</p>
