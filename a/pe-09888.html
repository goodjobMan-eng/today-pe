<h1>원숭이가 되고 싶은 고릴라!</h1>
<p>1) 2인 1조로 짝을 지은 뒤 가위바위보를 해 진 사람이 고릴라가 되어 뒤에 꼬리를 1개씩 달고 시작합니다. 2) 신호와 함께 고릴라들은 꼬리를 잡기 위해 움직이고, 꼬리를 뺏긴 고릴라는 한쪽 무릎을 꿇고 앉아 꼬리를 다시 달면 부활합니다. 3) 뺏긴 친구가 곧바로 자신을 뺏은 친구의 꼬리를 공격하는 것은 금지합니다. 4) 게임 종료 시 꼬리를 달고 있는 고릴라가 1점을 획득합니다.</p>
