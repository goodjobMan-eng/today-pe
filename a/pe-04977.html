<h1>키보다 높은 뜀틀 넘기 도전</h1>
<p>1) 도움닫기 후 구름판에서 양발로 강하게 굴러 체공 시간이 긴 점프를 한다.2) 시선은 아래가 아닌 대각선 앞쪽 높은 곳을 바라보며 손을 짚는다.3) 도움닫기 힘에만 의존하지 않고 발을 구른 후 스스로 엉덩이와 다리를 단번에 힘껏 들어 올리며 손으로 강하게 밀어낸다.</p>
