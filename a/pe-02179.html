<h1>전통놀이 사방치기</h1>
<p>1) 바닥에 사방치기 놀이판을 그리고 던질 돌을 준비한다. 2) 첫 번째 칸에 돌을 던져 넣고 선을 밟지 않으면서 외발 또는 양발로 칸을 이동한다. 3) 끝 칸까지 이동한 후 몸을 돌려 되돌아오면서 던져둔 돌을 줍고 출발선으로 나온다. 4) 다음 단계 칸으로 돌을 던지며 순서대로 칸을 완주한다.</p>
