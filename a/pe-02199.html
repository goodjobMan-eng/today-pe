<h1>체육시간 질서와 배려 다짐하기</h1>
<p>1) 우사인 볼트와 박지성 선수의 사례를 보며 체육 시간의 목적을 생각한다. 2) 잘하는 활동을 할 때 지나친 승부욕으로 다른 친구를 소외시키지 않고 배려하는 태도를 배운다. 3) 자신 없는 활동을 할 때도 포기하지 않고 최선을 다하는 자세를 다짐한다. 4) 모든 친구와 함께 즐겁게 참여하는 체육 수업을 만들기로 약속한다.</p>
