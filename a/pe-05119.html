<h1>자루 달리기 술래잡기 놀이</h1>
<p>1) 경기 구역을 정하고 술래 1명을 지정한다.2) 자루가 없으면 두 다리를 모아 붙인 채 뜀뛰기(점프)로만 이동하며 술래를 피해 도망친다.3) 술래에게 터치당하면 새로운 술래가 되고, 방금 상대를 터치한 사람은 면책권을 얻어 바로 잡히지 않는다.</p>
