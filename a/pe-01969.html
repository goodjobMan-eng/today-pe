<h1>종합 장애물 코스 달리기</h1>
<p>1) 매트, 훌라후프, 스쿠터보드, 줄넘기, 콘, 터널 등을 순서대로 배치하여 코스를 구성한다. 2) 앞 주자가 첫 번째나 두 번째 구간을 통과하면 다음 주자가 순차적으로 출발한다. 3) 구르기, 훌라후프 켄켄파, 스쿠터 주행, 줄넘기 10회, 콘 지그재그 통과 미션을 완료한다. 4) 일정 시간 후 코스 진행 방향을 반대로 바꾸거나 학생들이 직접 코스를 설계하도록 변형한다.</p>
