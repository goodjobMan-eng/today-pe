<h1>문부과학성 고학년 소프트발리볼 — 3대3 캐치·원바운드·노바운드 3단계</h1>
<p>50~100g 소프트발리볼을 활용해 3대3(팀당 4~5명 득점 시 로테이션)으로 진행합니다. 1단계(2번째 세터가 공을 잡아 토스하는 캐치 배구), 2단계(원바운드 허용 배구), 3단계(노바운드 3단 공격 배구) 중 팀 수준에 맞는 규칙을 선택하며, 서브는 무지개 언더핸드 토스로 넣고 셀프 심판제로 운영합니다.</p>
