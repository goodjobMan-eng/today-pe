<h1>날아라 뛰어라 반응 점프 놀이</h1>
<p>1) 참가자들은 일렬로 서서 진행자의 구령에 집중한다. 2) 진행자가 '날아라(とべ)' 또는 '점프(ジャンプ)'라고 외치면 앞으로 한 발 점프한다. 3) '잠자리(トンボ)', '망치(とんかち)' 등 비슷한 엉뚱한 단어가 나오면 뛰지 않고 멈춰야 하며, 잘못 뛰면 출발선으로 돌아간다.</p>
