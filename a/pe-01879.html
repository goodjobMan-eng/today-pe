<h1>암산 수학 준비운동</h1>
<p>1) 칠판에 왕복 달리기 횟수나 점핑잭 개수를 사칙연산 수식으로 적어 둔다. 2) 체육관에 들어온 학생들은 문제를 보고 스스로 암산하여 목표 횟수를 계산한다. 3) 계산한 정답 횟수만큼 체육관을 달리거나 스트레칭 체조 과제를 완수한다. 4) 저학년은 단순 덧셈·뺄셈, 고학년은 곱셈·거듭제곱 연산으로 난이도를 변경해 적용한다.</p>
