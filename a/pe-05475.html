<h1>별똥별 짝야구</h1>
<p>1) 2인 1조 공격팀에서 한 명이 공을 띄워주고 타자가 주먹이나 손바닥으로 공을 친다.2) 타자와 공을 띄워준 사람 모두 각자 1점 또는 2점 콘을 돌아 홈으로 세이프되면 두 사람의 점수를 합산해 획득한다.3) 수비가 뜬공을 잡으면 아웃이며, 공을 잡아 홈으로 패스하기 전에 돌아오지 못해도 아웃되고 3아웃 시 역할을 바꾼다.</p>
