<h1>6가지 생활 도구 활용 조작 움직임 마스터</h1>
<p>1) 반팔티, 비닐봉지, 공, 휴지, 물통, 우산 등 교실이나 가정 내 6가지 도구를 준비한다. 2) 조작 움직임 기본 형태인 던지기, 받기, 치기, 튀기기, 드리블, 흔들기, 휘돌리기를 도구별로 익힌다. 3) 티슈 연속 공중 받기 박수 챌린지, 페트병 악기 응원 타법 등 도구별 특화 미션을 완수한다. 4) 음악에 맞추어 도구와 신체 동작을 결합하고 높낮이와 빠르기를 변형하여 독창적인 안무를 만든다.</p>
