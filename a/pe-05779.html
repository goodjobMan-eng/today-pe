<h1>공다리기</h1>
<p>1) 두 팀으로 나눈 후 중간에 큰 공(짐볼)을 놓고 양 팀이 마주보고 선다.2) 신호에 맞춰 공을 던져 큰 공을 맞힌다.3) 공을 던져 맞혀 큰 공이 상대 구역 선 밖으로 나가거나 상대 진영에 머물게 하면 승리한다.4) 공이 넘어가면 상대편 진영에 넘어가서 던질 수도 있으며 공에 몸이 닿으면 패배한다.</p>
