<h1>재미있는 낚시 놀이</h1>
<p>1) 팀별로 앞에 훌라후프 1개와 몇 미터 맞은편에 훌라후프 1개를 두고 맞은편 훌라후프 안에 작은 공들을 넣는다.2) 출발 신호가 울리면 첫 번째 주자가 수영장 국수(폼롤러 막대)를 들고 바닥에 줄이 달린 컵을 연결한다.3) 훌라후프를 건드리지 않고 오직 막대만을 이용해 컵으로 공을 덮어 팀 앞 훌라후프로 가져오며 가장 많은 공을 모은 팀이 이긴다.</p>
