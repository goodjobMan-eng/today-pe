<h1>바가지·바구니 공 받기 캐치 놀이</h1>
<p>1) 두 사람이 짝을 이루고 한 명은 작은 공을, 다른 한 명은 바구니나 통을 양손으로 잡고 마주 보고 선다. 2) 던지는 사람이 포물선으로 공을 던져주면 받는 사람은 공의 낙하 지점을 빠르게 예측해 이동한다. 3) 공을 손으로 잡지 않고 바구니 안으로 튕겨 나가지 않게 쏙 받아내면 1점을 획득한다. 4) 익숙해지면 뒤로 돌아 서 있다가 신호에 맞춰 뒤돌아 받거나 바구니 대신 종이컵 등 작은 용기를 사용해 난이도를 높인다.</p>
