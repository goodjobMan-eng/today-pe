<h1>주장 공 보내기 게임 (라 발 오 카피텐)</h1>
<p>1) 각 팀의 주장은 경기장 양쪽 끝의 전용 구역에 위치하며 구역 밖으로 나올 수 없다. 2) 선수는 공을 손에 쥐고 걷거나 달릴 수 없으며, 패스를 주고받으며 주장을 향해 전진한다. 3) 주장에게 공을 보내기 전에 최소 2회 이상의 패스를 연결해야 한다. 4) 주장이 바닥에 닿지 않고 노바운드로 공을 캐치하면 1점을 획득한다.</p>
