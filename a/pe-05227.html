<h1>리핑 레프러콘 (장애물 통과 몸풀기)</h1>
<p>1) 음악이 시작되면 스테이션의 장애물을 큰 점프로 통과한다.2) 장애물을 넘은 뒤 코너에서 럭키 참(행운의 부적)을 하나 집는다.3) 벽을 따라 달려가 끝에 있는 버킷에 럭키 참을 넣고 줄을 선다.</p>
