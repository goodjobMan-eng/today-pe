<h1>축구 트랩 및 풋워크 기초 훈련</h1>
<p>1) 농구공처럼 튀기지 않고 손을 전혀 사용하지 않는 규칙(No Hands)을 확인한다. 2) 공을 하나씩 받아 지정된 빈 공간의 바닥에 공을 놓는다. 3) 음악이 나오는 동안 발을 이용한 다양한 풋워크 활동을 수행한다. 4) 음악이 멈추면 즉시 발로 공을 밟아 멈추는 트랩(Trap) 동작을 실시한다.</p>
