<h1>콘홀 빈백 던지기 게임</h1>
<p>1) 1명당 빨간색 또는 파란색 빈백 4개씩 가지고 정해진 거리에서 선다. 2) 번갈아 가며 아래로 던지는 언더핸드 방식으로 빈백을 콘홀 보드 구멍을 향해 밀어 넣듯 던진다. 3) 빈백이 구멍에 들어가면 3점, 보드 판 위에 걸치면 1점을 획득하며 총점을 합산한다.</p>
