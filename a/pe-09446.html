<h1>츄크볼(변형) 게임</h1>
<p>1) 경기의 한 가운데에 시작 지점 표시를 한 후 그것을 밟아야 경기가 시작됩니다. 2) 우리 팀끼리 패스하다 놓치게 되면 상대가 공격권을 가지게 되고 공을 소유하게 된 상대 팀은 중앙에서 시작합니다. 3) 상대 팀이 패스를 시도할 때 손을 높이 들어 공을 터치만 해도 공격권은 우리에게 넘어오게 됩니다.</p>
