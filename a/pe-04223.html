<h1>말랑 플라잉디스크 날리고 받기</h1>
<p>1) 샌드위치 받기: 옆으로 서서 날아오는 디스크를 위아래로 눌러 잡는다. 2) 한 손 잡기: 한 손으로 디스크를 잡는다. 3) 두 손 잡기: 한 손으로 잡기 어려운 경우 두 손으로 잡는다. 4) 날리기: 검지를 디스크 옆에 대고 엄지를 위에 올린 뒤 손목 스냅을 이용해 던진다.</p>
