<h1>발로 하는 플라잉디스크 알까기</h1>
<p>1) 바닥에 접시콘이나 기준선을 설정하여 경기 구역을 정하고 플라잉디스크 원반을 배치한다. 2) 가위바위보로 공격 순서를 정한다. 3) 손 대신 발을 이용하여 원반을 차서 상대방의 원반을 쳐낸다. 4) 상대 원반을 정해진 선(접시콘 기준선) 바깥으로 밀어내면 승리한다.</p>
