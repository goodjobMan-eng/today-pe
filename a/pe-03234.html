<h1>몸으로 동작 전달하기 게임</h1>
<p>1) 각 모둠의 맨 앞사람만 시범을 보이는 모둠과 마주 보고 서고 나머지 모둠원은 앞을 본다. 2) 시범 모둠이 모둠원이 함께 만든 체조 동작을 8박자 동안 보여준다. 3) 각 모둠의 맨 앞사람부터 자신이 본 동작을 뒷사람에게 몸으로 차례대로 전달한다. 4) 맨 뒷사람이 정확한 동작을 표현해 내면 점수를 얻고 모둠별로 역할을 번갈아 진행한다.</p>
