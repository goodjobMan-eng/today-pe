<h1>다운 더 라인 협동 전달 릴레이</h1>
<p>1) 모둠원들이 바닥에 일렬로 누워 앞사람의 발이 뒷사람의 머리 옆에 오도록 자리를 잡는다. 2) 첫 번째 주자가 발 사이에 도구(풀누들 등)를 끼운 채 시작 신호에 맞춰 누운 상태로 뒷사람의 발로 도구를 전달한다. 3) 도구를 전달한 사람은 즉시 일어나 줄 맨 끝으로 뛰어가 다시 누우며, 벽까지 도달한 뒤 다시 돌아온다.</p>
