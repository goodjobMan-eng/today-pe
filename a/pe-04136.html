<h1>4단계 던지기 및 받기 챌린지</h1>
<p>1) 1단계는 벽을 향해 언더핸드로 던져 연속 5회 잡기에 성공한다. 2) 2단계는 뒤로 물러서서 오버핸드로 몸을 비틀며 벽에 던져 연속 5회 잡기에 성공한다. 3) 3단계는 중앙 구역에서 손가락 세 개를 든 다른 친구를 찾아 짝을 맺고 언더핸드로 5회 주고받는다. 4) 4단계는 짝과 오버핸드로 공을 연속 5회 던지고 받는다.</p>
