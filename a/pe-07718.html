<h1>공을 이용한 전신 근력 강화 릴레이 게임</h1>
<p>1) 모둠별로 줄을 서서 출발 신호를 기다린다. 2) 네 발 자세로 엎드려 손이나 다리로 농구공을 굴리며 반환점을 향해 이동한다. 3) 한 손으로만 체중을 지탱하고 다른 손으로 공을 굴리는 등 다양한 자세로 공을 조작한다. 4) 등을 대고 엉덩이를 든 크랩 자세로 허벅지와 가슴 사이에 공을 끼우고 이동하거나 반환점을 돌아온다. 5) 반환점을 돌아 다음 주자에게 공을 인계한다.</p>
