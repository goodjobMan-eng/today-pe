<h1>다시마 건조하기 릴레이</h1>
<p>1) 출발선에 서서 신호가 울리면 플래그(다시마)를 들고 앞쪽 줄넘기 줄로 달려간다.2) 줄넘기 줄에 플래그를 걸어 건조시키고 출발선으로 돌아와 다음 주자에게 인계한다.3) 팀의 5개 플래그를 모두 걸면 마지막에 두 명이 함께 나가 줄을 잡는다.4) 두 명이 줄을 들고 돌아와 줄지어 선 팀원들의 다리 밑으로 통과시킨 후 머리 위로 넘겨 돌아온다.</p>
