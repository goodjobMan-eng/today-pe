<h1>콩주머니 가위바위보</h1>
<p>1) 팀별로 콩주머니 20~30개와 바구니를 적당한 거리에 배치합니다. 2) 팀별 바구니 앞에 모여 콩주머니를 1개씩 손에 듭니다. 3) 콩주머니 1개를 손에 들고 상대팀 1명과 가위바위보를 합니다. 4) 진 사람은 이긴 사람에게 콩주머니를 주고, 이긴 사람은 받은 콩주머니를 자신의 팀 바구니에 넣고 다시 게임에 참여합니다.</p>
