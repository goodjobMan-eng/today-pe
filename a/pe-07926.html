<h1>모두 모여라 놀이</h1>
<p>1) 운동장에 훌라후프를 놓는다. 2) 선생님이 부르는 규칙을 잘 듣는다. 3) 규칙에 해당하는 친구들은 훌라후프 안으로 들어간다. 4) 훌라후프 안에 들어가지 못한 친구들은 쉼터로 이동한다. 5) 다른 규칙을 정하여 놀이를 이어간다.</p>
