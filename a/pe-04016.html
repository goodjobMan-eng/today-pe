<h1>풍선 타격 놀이</h1>
<p>1) 체육관 곳곳에 훌라후프와 원마커를 배치하고 학생마다 풍선 1개씩을 배부받아 훌라후프 안에 선다. 2) 후프 안에서 풍선을 손, 팔꿈치, 무릎 등으로 머리 위로 연속해서 쳐 올린다. 3) 음악이 나오면 이동하며 풍선을 치고, 음악이 멈추면 가장 가까운 후프로 들어가 타격한다. 4) 파트너와 함께 풍선을 머리 위로 계속 쳐 올리며 후프 밖으로 나가지 않고 오래 버티는 대결을 진행한다.</p>
