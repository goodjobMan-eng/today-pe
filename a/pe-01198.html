<h1>바람개비 다이아몬드 패스 릴레이</h1>
<p>1) 야구 다이아몬드 형태로 4개 베이스와 중앙 투수 위치에 원마커를 배치하고 8~12명이 각 베이스에 나뉘어 선다. 2) 홈의 주자가 1루로 송구함과 동시에 중앙 투수 위치로 달려가 대기한다. 3) 1루 주자는 중앙으로 달려온 홈 주자에게 패스하고 자신은 다음 베이스 방향으로 이동한다. 4) 중앙에서 공을 받은 주자는 대각선 베이스로 송구하며 대각선으로 이동하고, 공은 90도 시계방향으로 계속 패스하며 성공 횟수를 기록한다.</p>
