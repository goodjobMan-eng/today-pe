<h1>무릎 태그 축구 드리블 놀이</h1>
<p>1) 모든 학생은 공을 발 가까이에 두고 제어하며 빠르게 드리블한다. 2) 술래 없이 진행자가 태그 신호를 외치면 드리블을 유지하면서 다른 친구의 무릎 앞쪽을 손으로 태그한다. 3) 무릎 뒤쪽은 태그할 수 없으며 무릎 앞쪽만 터치해야 한다. 4) 정해진 시간 동안 태그한 횟수를 세고 점수를 점차 높여가며 기록에 도전한다.</p>
