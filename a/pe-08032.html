<h1>핸드볼 슛 기본(스텝 슛·점프 슛) 연습</h1>
<p>1) 6m 라인 밖에서 공을 잡고 슛 준비를 한다. 2) 스텝 슛은 잡은 손의 반대쪽 발을 앞으로 딛으며 던진다. 3) 점프 슛은 오른손잡이 기준 왼발(잡은 손의 반대 발)로 힘차게 발을 굴러 뛰어올라 던진다. 4) 수비수나 골키퍼를 피해 골문 안으로 공을 던져 득점한다.</p>
