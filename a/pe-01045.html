<h1>원마커 밟기 액션 스텝 게임</h1>
<p>1) 바닥에 다양한 색상의 원마커를 일정한 간격으로 배치하고 두 참가자가 마주 보고 선다. 2) 신호에 맞춰 원마커 사이를 민첩한 스텝으로 이동하며 교사가 부르는 색상이나 목표 마커로 이동한다. 3) 정해진 지점에 먼저 도달해 발로 마커를 정확히 밟거나 손으로 터치한 사람이 승점을 획득한다. 4) 마커 뒤집기 대결이나 드리블 및 풋워크를 결합한 릴레이 경쟁으로 변형하여 운영할 수 있다.</p>
