<h1>몰키 (Molkky) 핀 쓰러뜨리기 게임</h1>
<p>1) 투척 구역에서 약 3~4m 거리에 1부터 번호가 적힌 핀들을 세워 놓는다. 2) 던지는 핀(몰키)을 던져 핀을 쓰러뜨린다. 3) 핀을 1개만 쓰러뜨리면 그 핀에 적힌 숫자가 점수가 되고, 2개 이상 쓰러뜨리면 쓰러진 핀의 개수가 점수가 된다. 4) 쓰러진 핀은 넘어진 그 자리에 다시 세우며, 정확히 50점을 먼저 만드는 사람이 승리한다(50점을 초과하면 25점으로 감점).</p>
