<h1>앉아서 하는 전신 스트레칭</h1>
<p>1) 박수를 3번, 5번, 10번 치고 주먹을 쥐었다 폈다 3번, 5번, 10번 반복한다. 2) 깍지를 끼고 양방향으로 손목을 8박자씩 돌린다. 3) 코끼리 코 자세로 팔을 걸어 당기며 고개를 반대로 돌리고, 팔을 머리 뒤로 넘겨 팔꿈치를 아래로 당긴다. 4) 깍지 낀 손을 앞·위·옆으로 뻗고 목 돌리기 및 목을 숙이고 젖히는 동작 후 어깨와 팔을 두드려 마무리한다.</p>
