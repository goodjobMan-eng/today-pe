<h1>패드민턴 및 배드민턴 기초 스트로크 연습</h1>
<p>1) 손바닥과 손등 면을 활용할 수 있도록 라켓 면과 그립을 상황에 맞게 잡는다. 2) 오른발이 뒤로 빠지면서 스텝을 밟아 높이 뜨는 하이 클리어를 타격한다. 3) 몸 앞으로 오는 셔틀콕에 대해 왼발과 오른발을 순서대로 디디며 푸시, 드라이브, 헤어핀 동작으로 타격한다. 4) 엄지손가락으로 라켓을 누르는 백핸드 그립 및 오른쪽 눈앞의 타격 포인트를 익혀 스매시 연습을 진행한다.</p>
