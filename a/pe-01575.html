<h1>음악 멈춤 버티기 프리즈 댄스</h1>
<p>1) 신나는 음악이 흘러나오는 동안 제자리에서 자유롭게 춤추고 몸을 움직인다. 2) 화면에 'Freeze' 신호와 함께 제시된 코치의 신체 균형 동작을 확인한다. 3) 카운트다운 10초 동안 흔들리지 않고 해당 정지 자세를 그대로 유지하면 성공한다. 4) 라운드가 거듭될수록 한 발 서기, 브이자 앉기 등 버티기 동작 난이도를 점차 높여 진행한다.</p>
