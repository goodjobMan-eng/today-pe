<h1>홈트레이닝 족구 띄우기 및 사이드스텝 토스 연습</h1>
<p>1) 기본자세를 잡고 사이드스텝으로 좌우 및 앞뒤로 이동하는 스텝 훈련을 실시한다. 2) 좌우로 빠르게 사이드스텝 이동 후 무릎을 활용해 가상의 공을 헤딩으로 받아낸다. 3) 사이드스텝으로 이동한 뒤 배구의 세터처럼 삼각형 모양을 만들어 공격수가 차기 좋게 토스 동작을 연결한다. 4) 원바운드 후 발 안쪽으로 강하게 차는 동작과 디딤발을 딛고 스윙하는 타격 동작을 연습한다.</p>
