<h1>교실 가위바위보 씨름 5종 놀이</h1>
<p>1) 교실에 무릎씨름, 팔씨름, 손가락씨름, 손뼉씨름, 돼지씨름 구역과 가위바위보 장소를 배치한다. 2) 모든 학생이 가위바위보 장소에 모여 동성끼리 가위바위보를 진행한다. 3) 가위바위보를 이긴 학생이 원하는 씨름 종목의 장소로 친구를 데려가 해당 씨름 대결을 펼친다. 4) 승패가 나면 이긴 학생은 2점, 진 학생은 1점을 얻고 다시 가위바위보 장소로 이동해 다른 상대와 반복하며 최종 점수가 높은 학생이 우승한다.</p>
