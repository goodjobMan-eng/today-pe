<h1>안타가타도코사 후프 리듬 점프</h1>
<p>1) 바닥에 훌라후프를 1인당 1개씩 일정 간격으로 두고 후프 안이나 뒤쪽에 바르게 선다. 2) 전래 동요 '안타가타도코사' 노래에 맞춰 제자리에서 가볍게 리듬을 타며 점프한다. 3) 가사 중 '사(さ)'가 나올 때마다 후프 앞뒤나 좌우로 발을 번갈아 디디며 위치를 재빠르게 바꾼다. 4) 2단계에서는 한 발 들기나 손동작(만세, 손뼉)을 추가하여 점프 난이도를 높여 진행한다.</p>
