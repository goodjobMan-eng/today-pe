<h1>사각형 패스 릴레이</h1>
<p>1) 전체 인원을 4~8인 1조로 나누고, 사각형의 각 꼭짓점에 인원을 균등하게 배분해 대기시킵니다. 2) 시작 신호에 맞춰 시계 방향으로 공을 패스하고 공의 진행 방향으로 이동합니다. 3) 30개의 패스를 먼저 마친 팀이 승리합니다. 4) 패스의 종류와 방향을 바꿔가며 진행합니다.</p>
