<h1>공 던지고 받기 및 튕겨 받기</h1>
<p>1) 위로 던진 공을 손과 가슴으로 함께 받는다. 2) 공을 가슴에 대지 않고 두 손으로만 잡는다. 3) 공을 위로 던진 뒤 박수를 1회, 2회, 3회 치고 잡는다. 4) 바닥으로 공을 1회, 2회, 3회 튕겨서 잡는다. 5) 양손을 번갈아 가며 한 손으로 바닥에 공을 튕겨 받는다. 6) 공을 바닥에 튕긴 후 제자리에서 한 바퀴 돌아 빠르게 잡는다.</p>
