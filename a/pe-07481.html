<h1>화성인 놀이 (엘 옴브레 데 마르테)</h1>
<p>1) 모든 학생은 경기장 한쪽에 한 줄로 서고, 중앙에 술래인 '화성인' 1명을 배치한다. 2) 학생들이 &quot;화성인, 우리를 별까지 데려다줄 수 있나요?&quot;라고 물으면, 술래는 특정 색상(예: 초록색 옷)을 지정해 답한다. 3) 해당 색상의 옷을 입은 학생들은 술래에게 잡히지 않고 반대편으로 건너가야 한다. 4) 술래에게 태그된 학생은 중앙에서 함께 술래가 되어 다음 라운드에 함께 잡는다.</p>
