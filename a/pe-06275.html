<h1>기차 타고 할머니 집으로</h1>
<p>1) 3명에서 4명이 한 모둠을 이루어 긴 줄을 잡고 출발선에 선다.2) 교사가 이동 움직임 기술(걷기, 뛰기, 점프, 스키핑, 갤로핑, 호핑)과 함께 출발 신호를 보내면 지정된 움직임으로 이동한다.3) 콘(반환점)을 한 바퀴 돌아 처음 위치로 돌아온 후, 맨 앞 학생은 맨 뒤로 이동하여 줄을 잡고 다음 움직임으로 반복한다.</p>
