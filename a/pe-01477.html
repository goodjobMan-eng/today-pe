<h1>달리기 속도 향상 장요근 스트레칭</h1>
<p>1) 바르게 서서 팔꿈치를 어깨높이로 올린 후 무릎을 팔꿈치에 닿도록 10회 들어 올린다. 2) 양팔을 옆으로 나란히 벌리고 발끝을 손바닥 높이까지 곧게 뻗어 10회 차올린다. 3) 씨름의 기마자세를 취한 상태에서 한쪽 다리를 옆으로 들고 3~5초간 중심을 잡는다. 4) 팔굽혀펴기 자세에서 무릎을 같은 쪽 팔꿈치로 당겨 붙이는 동작을 좌우 10회 실시한다.</p>
