<p>1) 상대 진지로 건너가 양손으로 터치를 당하면 자기 진지의 스타트 에어리어로 돌아온다. 2) 상대 진지의 S 에어리어에서는 터치를 당하지 않는다. 3) 보물 주위의 사크리에는 지키는 사람이 들어갈 수 없다.</p>
