<h1>가위바위보 스펀지 줄넘기</h1>
<p>1) 각자 스펀지를 들고 제자리 원마커에 줄넘기를 두고 출발 준비를 한다. 2) 1분 동안 자유롭게 돌아다니며 친구를 만나 가위바위보를 하고 이긴 사람이 진 사람에게 스펀지를 1개 건넨다. 3) 1분이 끝나면 제자리로 돌아와 모인 스펀지 개수당 줄넘기 10개씩(스펀지 10개면 100개) 뛴다. 4) 1분 제한시간 동안 줄넘기를 10개 넘을 때마다 스펀지를 1개씩 뒤집는 미션을 수행한다.</p>
