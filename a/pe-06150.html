<h1>배구형 경쟁 기초 포어암 패스 연습</h1>
<p>1) 무릎을 굽히고 팔꿈치부터 손목까지 평평한 면을 만들어 자세를 잡는다.2) 팔을 지면과 수평으로 유지하고 무릎 반동을 이용해 제자리에서 공을 튀겨 올린다.3) 풍선, 피구공, 배구공 순서로 난이도를 높여가며 연습한다.4) 콘 사이를 이동하며 포어암 패스로 공을 튀겨 목적지까지 이동한다.</p>
