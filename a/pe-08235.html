<h1>비밀 타깃 공간 지각 놀이</h1>
<p>1) 참가자들은 각자 마음속으로 대상 한 명을 비밀리에 정한다. 2) 신호가 울리면 이동하면서 자신이 정한 사람과 최대한 멀리 떨어지도록 움직인다. 3) 두 명을 비밀리에 지정해 두 사람 모두에게서 멀리 떨어지거나, 뒤로 걷기·갤럽 등으로 이동 방식을 바꾼다. 4) 두 사람을 지정해 자신과 함께 정삼각형을 만들거나 두 사람 사이에 머무는 방식으로 응용한다.</p>
