<h1>골프형 게임 3가지</h1>
<p>1) 페트병을 놓고 10걸음을 걸어 종이를 놓은 뒤 공의 방향성에 집중해 골프채로 공을 친다. 2) 훌라후프를 놓고 5걸음을 걸어 종이를 놓은 뒤 공을 치는 힘의 세기에 집중해 공을 친다. 3) 점수와 함정이 적힌 종이 주위에 막대기를 대어 공이 튀어나가지 않게 하고 총 10점을 얻으면 게임이 끝난다.</p>
