<h1>렛츠 고 헌팅 (뱅 술래잡기)</h1>
<p>1) 학생들은 출발선에 나란히 서서 리더를 따라 걷기, 점프, 스킵, 조깅, 슬라이드, 갤럽 등의 이동 동작을 하며 이동한다. 2) 교사가 &quot;뱅(Bang)&quot;이라고 외치면 신호를 듣고 즉시 원래 출발선으로 달려 돌아간다. 3) 교사는 도망치는 학생들을 태그하려 시도하며, 태그되지 않고 출발선에 도착하면 성공한다.</p>
