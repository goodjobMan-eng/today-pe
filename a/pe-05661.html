<h1>숫자 스태킹 컵 합치기</h1>
<p>1) 6개씩 나누어 놓은 스태킹 컵을 양손을 사용하여 1개씩 포개어 2개의 컵 더미로 합친다.2) 양손을 교대로 빠르게 움직여 컵을 모두 합치는 데 걸리는 시간을 스톱워치로 측정한다.3) 자신의 기록을 기록지에 적어 두고 이전 기록을 단축해 나간다.4) 컵 나누기와 컵 합치기를 이어서 연속으로 도전할 수도 있다.</p>
