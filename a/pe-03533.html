<h1>원 안에 공 굴려 넣기</h1>
<p>1) 반 전체를 세 모둠으로 나눈다. 2) 다양한 크기의 공을 굴려 원 안으로 보낸다. 3) 큰 공이 원 안에 들어가면 1점, 작은 공이 들어가면 2점을 얻으며, 원 안의 상대 모둠 공을 쳐서 원 밖으로 내보낼 수 있다. 4) 정해진 시간 동안 가장 높은 점수를 얻은 모둠이 승리한다.</p>
