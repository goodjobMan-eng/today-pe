<h1>배드민턴 라켓 셔틀콕 컨트롤 챌린지</h1>
<p>1) 배드민턴 라켓과 셔틀콕을 준비하고 콘으로 출발선과 반환점을 설정한다. 2) 제자리에서 라켓 헤드로 셔틀콕을 적당한 높이로 10회 연속 튀겨 올린다. 3) 제자리 연습에 익숙해지면 반환점을 향해 걸어가며 셔틀콕을 튀겨 3회 왕복하는 기록을 측정한다. 4) 셔틀콕을 떨어뜨리면 즉시 제자리나 출발선에서 다시 이어가며 반환점 거리를 늘리는 방식으로 도전한다.</p>
