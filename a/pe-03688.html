<h1>쥐 놓아주기(원형 쥐잡기)</h1>
<p>1) 술래인 고양이 1명을 정하고, 나머지 사람들은 손을 잡고 원을 만들어 쥐 1명을 정합니다. 2) 쥐가 고양이에게 터치되지 않도록, 중심의 마커 밖으로 벗어나지 않게 원을 회전시키며 움직입니다. 3) 고양이가 쥐를 터치하면 고양이의 승리이며, 제한 시간까지 터치되지 않으면 쥐가 승리합니다. 4) 원을 이루는 사람의 수나 쥐의 수를 늘려서 진행할 수 있습니다.</p>
