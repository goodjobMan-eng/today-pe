<h1>쿵푸팬더 가위바위보</h1>
<p>1) 교사가 &quot;쿵푸&quot;를 외치면 학생들은 뒤돌아 있다가 &quot;팬더&quot;를 외치며 정해진 동작을 취해 돌아선다.2) 가위는 뱀 동작(양손 앞으로 찌르기), 바위는 사부 동작(주먹 감싸기), 보는 학 동작(양팔 펼치기)이다.3) 가위바위보 규칙으로 승패를 정하며, 비겼을 때는 더 멋진 동작을 취한 사람이 이긴다.</p>
