<h1>복싱 스텝 색깔 반응 워밍업</h1>
<p>1) 링 안에서 달리지 않고 복싱 스텝(다이내믹 스텝)을 유지하며 정해진 공간 안을 자유롭게 이동한다. 2) 지도자가 중간 가드(뺨 높이), 높은 가드(관자놀이 높이), 낮은 가드(어깨 아래) 동작을 지시하면 해당 가드 자세를 유지한다. 3) 지도자가 특정 색깔을 외치면 달리지 않고 복싱 스텝으로 해당 색깔 위치로 재빠르게 이동한다.</p>
