<h1>풀누들 장애물 챌린지 코스</h1>
<p>1) 제공된 풀누들, 연결 부품(커넥터 및 엘보), 받침대를 활용하여 모둠별로 자유롭게 장애물 코스를 조립·구성한다. 2) 각자 만든 장애물 코스의 진행 방식과 통과 규칙(달리기, 팔굽혀펴기 등 미션 포함)을 정하고 출발부터 결승까지 배치한다. 3) 첫 번째 주자가 출발하여 코스를 2바퀴 돈 후 다음 주자가 출발하는 방식으로 차례대로 장애물을 통과한다.</p>
