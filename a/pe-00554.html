<h1>수건 지혜의 고리 풀기</h1>
<p>1) 두 사람이 마주 보고 서서 수건의 양 끝을 각자 손으로 잡습니다. 2) 수건을 잡은 손을 절대 놓지 않은 채 몸과 다리를 수건 너머로 통과시켜 매듭처럼 엉킨 자세를 만듭니다. 3) 손을 놓지 않고 몸을 돌리거나 다리를 다시 빼내어 원래의 마주 선 자세로 돌아오면 성공입니다. 4) 익숙해지면 한 사람이 눈을 감고 상대방의 안내에 따라 수건 고리를 푸는 방식으로 난이도를 높입니다.</p>
