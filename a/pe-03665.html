<h1>줄넘기 좌우 벌렸다 모아뛰기 기초</h1>
<p>1) 줄 없이 양발을 모아 가볍게 네 번 제자리에서 뛴다. 2) 다리를 어깨너비로 벌렸다 모으는 동작을 네 박자에 맞춰 연결한다. 3) 줄이 발 바로 앞에 올 때 타이밍을 맞춰 가볍게 점프하며 뛰어넘는다. 4) 박자에 맞추어 줄을 넘기며 양발 벌렸다 모아뛰기를 연속으로 연습한다.</p>
