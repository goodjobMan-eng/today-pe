<h1>성장기 학생을 위한 키커지는 놀밥홈트 2강 (스트레칭 편)</h1>
<p>1) 제자리에서 교사의 구령에 맞추어 전신 스트레칭을 시작합니다. 2) 양손 깍지를 끼고 앞으로 밀어준 뒤 머리 위로 쭉 뻗어 올려 몸을 늘려주고, 깍지를 낀 채 상체를 좌우로 번갈아 기울이며 옆구리를 이완합니다. 3) 어깨너비로 발을 벌리고 팔과 다리를 교차하거나 늘리며 전신 유연성 운동을 이어갑니다. 4) 모든 동작은 호흡을 편안하게 유지하며 무리하지 않는 범위에서 끝까지 따라 합니다.</p>
