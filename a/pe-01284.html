<h1>반대로 핸들 돌리기 붕붕붕 부릉부릉 교실체조</h1>
<p>1) 교실 책상 자리에 앉아 양손으로 자동차 운전대를 잡는 기본자세를 취한다. 2) 교사가 &quot;붕붕붕&quot;을 외치면 학생들은 &quot;부릉부릉&quot; 구호를 외치며 신호에 집중한다. 3) 교사가 &quot;오른쪽&quot;을 외치면 핸들은 오른쪽으로 돌리고 몸은 왼쪽으로 기울이며 반대 방향으로 반응한다. 4) 기본 방향에 익숙해지면 &quot;앞으로&quot;(몸 뒤로), &quot;브레이크&quot;(몸 앞으로), &quot;방지턱&quot;(엉덩이 점프) 동작을 추가하여 순발력 체조로 진행한다.</p>
