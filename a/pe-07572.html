<h1>플라잉디스크 피구(돗지비)</h1>
<p>1) 플라잉디스크를 5초 안에 상대 진영으로 던져 공격한다. 2) 날아오는 디스크를 맞지 않고 피하거나 잡는다. 3) 디스크에 맞으면 밖으로 나가 아웃되며, 수비수가 잡으면 밖의 팀원이 부활해 안으로 들어온다.</p>
