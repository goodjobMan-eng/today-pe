<h1>제트볼 (Jetball)</h1>
<p>1) 학생들은 체육관 한쪽 벽면을 따라 일렬로 서고 던지는 사람 2명은 피구공을 들고 선다 2) 두 던지는 사람이 동시에 공을 학생들 머리 위 벽을 향해 던져 튀어나오는 리바운드 공을 잡는다 3) 공이 벽에 닿는 순간 학생들은 반대편 벽으로 달리고, 던지는 사람은 튀어나온 공을 잡아 달리는 학생들을 맞힌다 4) 공에 맞은 학생은 그 자리에 앉고, 다음 차례에 지나가는 주자를 손으로 터치하여 아웃시킬 수 있다</p>
