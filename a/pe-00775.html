<p>1) 제시된 기준 단어와 끝소리(라임)가 같은 단어를 두 가지 보기 중에서 찾아 선택합니다. 2) 제한 시간 카운트다운 동안 각 보기에 표시된 운동 동작을 확인하며 정답을 생각합니다. 3) 정답 단어가 공개되면 해당 단어 카드에 매칭된 신체 운동 동작(플랭크, 사이드 런지, 버피 등)을 따라 합니다. 4) 라운드마다 새로운 단어와 운동 동작으로 바뀌며 신체와 두뇌를 함께 단련합니다.</p>
