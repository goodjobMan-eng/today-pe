<h1>존민턴 (Zoneminton)</h1>
<p>1) 배드민턴 반코트에서 셔틀콕을 주고받으며 랠리를 연습한다(빌드 1). 2) 코트를 3개 구역으로 나누어 뒷구역 3점, 중간구역 1점, 앞구역 2점으로 설정하고 5점 선취 경기를 진행한다(빌드 2). 3) 코트 앞뒤에 논슬립 스팟을 3개씩(총 6개) 배치하고, 스팟을 맞히면 3점을 얻고 맞힌 스팟은 제거하며 11점을 먼저 얻는 사람이 승리한다(빌드 3).</p>
