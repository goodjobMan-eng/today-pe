<h1>체육관 캔디랜드 대형 보드게임</h1>
<p>1) 빨간색부터 보라색까지 콘을 지그재그 무지개 경로로 체육관에 배치한다. 2) 각자 주사위를 가지고 첫 번째 콘에서 출발 준비를 한다. 3) 주사위를 굴려 나온 숫자만큼 콘을 세며 앞으로 이동한다. 4) 결승점에 도달하면 금화 코인 1개를 획득하고, 정해진 시간 동안 다시 처음부터 반복하여 코인을 모은다.</p>
