<h1>DMZ 지뢰 찾기 평형성 게임</h1>
<p>1) 바닥에 원마커나 A4용지를 바둑판 모양 격자로 배열한다. 2) 모둠원들과 상의하여 안전한 경로 10칸을 직선 또는 대각선으로 연결하여 작전지에 지뢰 지도를 작성한다. 3) 주자는 한 칸씩 전진하며 한 발로 원마커 위에 서서 2초 이상 균형을 유지해야 한다. 4) 지뢰 칸을 밟아 심판이 '쾅'을 외치면 탈락하고 다음 주자가 처음부터 다시 도전하며, 성공할 때까지 걸린 횟수를 겨룬다.</p>
