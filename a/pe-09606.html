<h1>우노 카오스 술래잡기</h1>
<p>1) 모든 학생이 허리에 꼬리끈을 하나씩 착용한다. 2) 술래가 꼬리끈을 뺏으면 뺏긴 학생은 술래가 되어 다른 학생의 꼬리끈을 뺏으러 다닌다. 3) 꼬리끈을 뺏긴 학생은 다시 꼬리끈을 착용하고 술래가 되어 게임에 참여한다.</p>
