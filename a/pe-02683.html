<h1>가정형 신체활동(V 스트레칭·워킹·에어플레인)</h1>
<p>1) 다리를 위로 들어 올리고 몸의 균형을 유지하는 V 스트레칭을 한다. 2) 공을 위로 던지고 받으며 발을 바꾸어 이동하는 워킹을 한다. 3) 한 칸에 한 발씩 발을 디뎌 걷는 한발 워킹을 한다. 4) 양팔을 벌리고 한쪽 다리를 뒤로 뻗으며 상체를 90도로 숙여 유지하는 에어플레인 자세를 한다.</p>
