<h1>다리 레슬링 (레그 레슬링)</h1>
<p>1) 두 사람이 바닥에 누워 어깨와 팔꿈치를 서로 반대 방향으로 맞대고 밀착한다. 2) 부상을 방지하기 위해 안쪽 손을 자신의 가슴 위에 단단히 얹는다. 3) 심판의 구호에 맞춰 안쪽 다리를 동시에 들어 올리며 하나, 둘, 셋 순서로 다리를 맞댄다. 4) 신호가 떨어지면 다리를 서로 걸어 상대방의 다리를 반대편으로 넘겨 밀어낸다. 5) 상대방의 몸을 완전히 뒤집어 넘긴 사람이 승리한다.</p>
