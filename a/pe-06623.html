<h1>이름으로 춤추기</h1>
<p>1) 손가락을 사용해 자신의 앞, 하늘, 바닥, 작게, 크게, 빠르게, 느리게 이름을 써 본다. 2) 어깨, 팔꿈치, 등, 배꼽, 엉덩이, 발뒤꿈치, 발가락 등 다양한 신체 부위로 공중이나 바닥에 이름을 써 본다. 3) 사용했던 신체 부위 중 5군데 이상을 골라 1분 30초 동안 자신만의 '이름 춤'을 만든다. 4) 완성된 이름 춤을 빠른 음악에 맞춰 춰 보고, 이어서 느린 음악에 맞춰 추며 느낌의 차이를 비교한다.</p>
