<h1>동물 흉내 무브 앤 프리즈 댄스</h1>
<p>1) 음악에 맞춰 캥거루, 곰, 원숭이 등 제시되는 동물의 움직임을 창의적으로 표현하며 춤을 춥니다. 2) 음악이 멈추면 그 자리에서 얼음처럼 완벽하게 정지해야 합니다. 3) 중간에 등장하는 연잎 징검다리 건너기 미션에서는 물에 빠지지 않도록 제자리 점프와 균형 잡기를 수행합니다. 4) 마지막 라운드까지 다양한 동물의 특징을 온몸으로 표현하며 신체 조절력을 기릅니다.</p>
