<h1>신체 협응력 볼 챌린지</h1>
<p>1) 저글링: 공 1개로 양손 번갈아 던지기부터 시작하여, 2개로 떨어지기 직전 던지는 연습을 거쳐 3개 저글링으로 완성한다. 2) 이마에 공 얹기: 이마의 중심점을 찾아 공을 얹고, 손을 뗀 후 몸을 공 아래로 계속 움직여 균형을 잡는다. 3) 손가락 위 공 돌리기: 한 손으로 회전을 주고 다른 손으로 속도를 더한 뒤 검지 손가락 끝에 올려 중심을 잡고 회전을 유지한다.</p>
