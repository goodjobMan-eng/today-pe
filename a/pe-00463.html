<h1>점프 구역 술래잡기</h1>
<p>1) 경기장 바닥에 여러 개의 선을 그어 일정한 간격의 구역(존)들을 만듭니다. 2) 술래와 도망치는 사람 모두 양발 점프(모둠발 점프)로만 구역 사이를 이동합니다. 3) 앞뒤 어느 방향으로든 점프할 수 있고 구역을 여러 칸 건너뛰는 것도 허용됩니다. 4) 술래가 점프해 착지한 구역과 같은 구역에 서 있게 된 도망자는 아웃되어 경기장 밖으로 나갑니다.</p>
