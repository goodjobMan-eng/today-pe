<h1>피벗 패스 드릴</h1>
<p>1) 신호에 맞춰 한 줄의 선수들이 동시에 앞으로 달려 나가며 양발로 강하게 점프 스톱한다. 2) 지정된 축발(오른발 또는 왼발)을 중심으로 앞 피벗 또는 리버스 피벗을 한다. 3) 동료의 이름을 부르며 체스트 패스나 바운스 패스를 전달한다. 4) 패스 페이크 후 수비를 피해 돌파하는 스텝 스루 동작을 추가하여 발전시킨다.</p>
