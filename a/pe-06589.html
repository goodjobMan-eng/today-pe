<h1>슬라이딩 피구</h1>
<p>1) 가위바위보로 공격과 수비를 정한 뒤 공격팀은 외야, 수비팀은 내야에 위치한다. 2) 시작 신호에 맞춰 공격팀은 플라잉디스크 2개를 바닥에 밀착시켜 슬라이딩 패스로 공격한다. 3) 내야의 수비수는 디스크를 점프하여 피하며, 디스크가 발에 맞으면 아웃되어 경기장 밖에서 대기하고 수비수가 발로 디스크를 정지시키면 아웃된 친구 1명이 부활한다.</p>
