<h1>저글링 직상띄우기 기초 도전</h1>
<p>1) 양말이나 콩주머니로 한 손에 쥐어지는 크기의 저글링 공을 만든다. 2) 주로 사용하는 손으로 공이 일자로 머리보다 살짝 높은 정점까지 올라가도록 직상으로 5회 던지고 받는다. 3) 반대 손으로도 동일하게 일자로 공을 5회 던지고 받는다. 4) 매 분마다 오른손과 왼손을 번갈아 직상으로 띄우는 동작을 총 4라운드 수행한다.</p>
